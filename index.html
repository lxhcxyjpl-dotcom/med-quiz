","stem":"要测定核孔复合体对惰性分子的扩散上限，最合适的做法是","options":["用一系列不同浓度的地塞米松测入核速率","用一系列不同分子量的惰性葡聚糖测入核","用放线菌素D处理不同时间后测核仁大小","用诺考达唑处理不同时间后测细胞形态","用不同强度的激发光测核内荧光强度"],"answer":1,"explain":"B 对：用分子量递增、不带任何运输信号的惰性分子逐一测试能否进入核内，可直接定出核孔被动扩散的分子量上限，70 kDa 葡聚糖正是其中一档。B 改变地塞米松浓度测的是受体入核的动力学，与核孔孔径无关；C 放线菌素 D 影响 rRNA 转录与核仁，不反映核孔的通透性；D 诺考达唑破坏微管，改变的是细胞形态与分裂状态；E 改变激发光强度只影响可检测信号的强弱，不改变通透性。","type":"A1","group":"c2-04","kind":"experiment","chs":[10,6,9],"vignette":"研究生小陈把糖皮质激素受体的编码序列接上GFP后转染培养细胞。血清饥饿后荧光均匀分布在细胞质与细胞核；加入100 nmol/L地塞米松，30分钟后荧光集中到核内，核质比由0.4升至3.1。随后几组处理：把受体核定位信号的碱性氨基酸换成丙氨酸，加激素后荧光仍留在胞质；用叠氮钠加脱氧葡萄糖耗竭ATP，入核同样被阻断；向胞质注入70 kDa的惰性葡聚糖，1小时后仍不见核内聚集；用放线菌素D抑制rRNA转录，2小时后荧光标记的核仁蛋白从核仁内散入核质、核仁消失，光漂白后其荧光半恢复时间仅约20秒。另一组细胞加诺考达唑破坏微管，细胞停滞在分裂期，核膜崩解、核仁消失。","vignette_title":"情景 4：半小时后，绿色荧光聚到了核里","gidx":3,"gn":5,"anchor":"向胞质注入70 kDa的惰性葡聚糖"},{"id":"gc21-03-3","ch":10,"part":2,"tag":"判读","stem":"长转录本在核内堆积而细胞质中几乎检测不到，这一结果说明","options":["核孔复合体对RNA分子的大小没有选择性，任何转录本都能自由通过","该转录本在核内被翻译成蛋白质，因而细胞质中检测不到它的存在","mRNA在细胞质中完成加尾后又被运回核内，故核内信号反而更强","核孔复合体不运输RNA，RNA须先降解成核苷酸再扩散到细胞质","mRNA须在核内完成加工成熟后，才能经核孔复合体输出到细胞质"],"answer":4,"explain":"E 对：RNA同样经核孔复合体输出，而mRNA须在核内完成加帽、加尾与剪接等加工后才能被识别并输出，未加工成熟的转录本滞留在核内并被降解。A 错：核孔复合体的转运有选择性，并非任何转录本都能通过。B 错：核内没有核糖体，该转录本不会在核内被翻译。C 错：该转录本在核内堆积是因为未被识别输出，而不是被运回核内。D 错：核孔复合体可以运输RNA，核内RNA也不必先降解成核苷酸。","type":"A1","group":"c21-03","kind":"mechanism","chs":[20,21,10],"vignette":"某分泌蛋白基因的3′端加尾信号由AAUAAA突变为AAGAAA。把该基因转入培养细胞后做核质分离：细胞核内该基因的转录本比正常长约1.2 kb，其3′端一直延伸到下游一个隐蔽位点；细胞质中对应的成熟mRNA只剩正常水平的15%，蛋白质合成量约为正常的12%。用抗m7G抗体做沉淀，核内那份长转录本可被沉淀下来；而用寡聚dT探针杂交时，长转录本几乎没有信号。该转录本的剪接位点序列本身并未改变，聚合酶Ⅱ最大亚基C端结构域的第5位丝氨酸磷酸化水平也与正常细胞一致。若人为给这种转录本补上多聚腺苷酸尾、再注入细胞质，其翻译效率仍低于正常mRNA，约为正常的40%。","vignette_title":"情景 3：加不上尾的那条转录本","gidx":3,"gn":5,"anchor":"只剩正常水平的15%"},{"id":"gc21-03-5","ch":10,"part":2,"tag":"判读","stem":"关于该基因从转录到翻译的这条链条，下列判断正确的是（X 型多选）","options":["3′端加尾信号突变使该转录本延长，并丧失正常的多聚腺苷酸尾","该转录本的5′帽仍按时加上，说明加帽与3′端加工相互独立","未完成加工的转录本被滞留在核内，无法经核孔进入细胞质","该基因的剪接位点序列未变，因此蛋白质减少应归因于剪接效率下降","细胞质中成熟的mRNA锐减，与该转录本在核内的滞留和降解有关"],"answer":[0,1,2,4],"explain":"答案 ABCE。A 对：突变发生在3′端加尾信号，转录本因此延长且缺少正常的多聚腺苷酸尾。B 对：5′帽仍能按时加上，说明加帽与3′端加工是相对独立的偶联环节。C 对：未完成加工的转录本滞留核内，无法经核孔进入细胞质。E 对：成熟mRNA锐减与该转录本在核内滞留并降解相符。D 错：剪接位点序列未改变，蛋白质减少来自加尾缺陷造成的核内滞留，而不是剪接效率下降。","type":"X","group":"c21-03","kind":"mechanism","chs":[20,21,10],"vignette":"某分泌蛋白基因的3′端加尾信号由AAUAAA突变为AAGAAA。把该基因转入培养细胞后做核质分离：细胞核内该基因的转录本比正常长约1.2 kb，其3′端一直延伸到下游一个隐蔽位点；细胞质中对应的成熟mRNA只剩正常水平的15%，蛋白质合成量约为正常的12%。用抗m7G抗体做沉淀，核内那份长转录本可被沉淀下来；而用寡聚dT探针杂交时，长转录本几乎没有信号。该转录本的剪接位点序列本身并未改变，聚合酶Ⅱ最大亚基C端结构域的第5位丝氨酸磷酸化水平也与正常细胞一致。若人为给这种转录本补上多聚腺苷酸尾、再注入细胞质，其翻译效率仍低于正常mRNA，约为正常的40%。","vignette_title":"情景 3：加不上尾的那条转录本","gidx":5,"gn":5,"anchor":"该转录本的剪接位点序列本身并未改变"},{"id":"gc5-04-4","ch":10,"part":2,"tag":"判读","stem":"镜下可见核膜崩解、核仁消失的细胞，其核的变化说明该细胞处于","options":["分裂期，此时核膜崩解、核仁消失，染色质凝集","G0期，此时细胞退出周期且核膜保持完整","G2期，此时DNA复制完成并合成所需蛋白","G1期，此时细胞进行DNA复制前的物质准备","S期，此时核内DNA复制，DNA含量加倍"],"answer":0,"explain":"A对：核被膜崩解、核仁消失是分裂期的典型变化：核纤层解聚使核膜解散，rRNA合成停止使核仁消失，染色质高度凝集成染色体。D错：G1期为DNA复制作物质准备，核被膜与核仁保持完整。E错：S期核内DNA复制、含量由2C增至4C，核被膜与核仁依然存在。C错：G2期DNA复制已完成，核膜核仁同样完整。B错：G0期细胞退出细胞周期，核膜与核仁完整，不会出现崩解消失。","type":"A1","group":"c5-04","kind":"experiment","chs":[26,29,10],"vignette":"研究生小周把同一株Rb野生型人乳腺癌细胞分成三组：A组加CDK4/6抑制剂，B组加紫杉醇，C组不加药。24小时后做流式：A组G1期细胞由46%升到79%，S期由32%降到8%，EdU掺入率同步由34%降到7%，Annexin V单阳性细胞仅3%；B组G2/M期由18%升到61%，EdU掺入率几乎不变，镜下可见核膜崩解、核仁消失的细胞；C组周期分布与加药前基本一致。第48小时B组经Annexin V/PI双染示38%双阳性细胞，同时DNA电泳呈梯状条带（180～200bp整数倍）。另一株Rb缺失细胞用同样的抑制剂处理，周期分布毫无变化。","vignette_title":"情景 4：三组细胞，三种结局","gidx":4,"gn":6,"anchor":"核膜崩解、核仁消失的细胞"},{"id":"gc9-03-2","ch":10,"part":2,"tag":"机制","stem":"外源表达的四种转录因子进入细胞核的方式是","options":["直接穿过核被膜的脂双层向核内扩散","在内质网合成后经高尔基体转运至细胞核","以自由扩散方式通过核孔，与分子大小无关","由核定位信号引导，经核孔复合体耗能转运","被核糖体直接运入核内并在核内完成翻译"],"answer":3,"explain":"D 对：情景给出目的蛋白约 45 kDa，超过核孔扩散的 40 kDa 限度，必须由核定位信号被输入蛋白识别、经核孔复合体耗能主动转运入核。A 错：核被膜是双层膜结构，蛋白质不能自由穿过脂双层。B 错：转录因子在核内起作用，不经分泌途径，也不由内质网合成。E 错：蛋白质合成在细胞质核糖体上进行，核内并不进行翻译。C 错：自由扩散只适用于小于 40 kDa 的小分子，说与分子大小无关不成立。","type":"A1","group":"c9-03","kind":"mechanism","chs":[28,22,10],"vignette":"研究者取小鼠尾尖成纤维细胞，导入 Oct4、Sox2、Klf4、c-Myc 四种转录因子，表达出的目的蛋白约 45 kDa，需从细胞质进入细胞核才能结合基因组。培养约两周后，约 0.1% 的细胞形成碱性磷酸酶染色阳性的集落。检测显示：成纤维细胞标志基因的转录本在第 3 天开始下降，第 10 天几乎检测不到，其启动子区 DNA 甲基化由 15% 升至 75%、组蛋白乙酰化降低；与此同时，内源 Oct4 基因的启动子区 DNA 甲基化由 70% 降至 20%，内源 Oct4、Sox2 与 Nanog 依次被激活。这些细胞的基因组序列没有改变，被重置的是基因表达程序；它们在形态、标志与三胚层分化能力上与胚胎干细胞相似，但仍保留部分成纤维细胞的表观遗传记忆。","vignette_title":"情景 3：把成纤维细胞改写成干细胞","gidx":2,"gn":5,"anchor":"从细胞质进入细胞核"},{"ch":10,"part":2,"tag":"核被膜","stem":"关于核被膜（nuclear envelope）的结构，叙述正确的是？","options":["核被膜由一层单位膜构成，核孔是膜上的开放式孔道","核周间隙（perinuclear space）与细胞外空间直接相通","内、外两层核膜完全独立，彼此之间无任何连接","核被膜由内、外两层单位膜构成，外核膜与内质网相连并附着核糖体，内核膜下紧贴核纤层","核被膜在细胞分裂期始终保持完整，以保证遗传物质不外漏"],"answer":3,"explain":"核被膜为双层单位膜，核周间隙位于两层之间，外核膜与内质网连续，核孔处两层膜融合；分裂期核膜崩解、末期重建。","type":"A1","id":"c10-885939e5"},{"ch":10,"part":2,"tag":"核孔复合体","stem":"关于核孔复合体（nuclear pore complex, NPC）介导的物质运输，正确的是？","options":["所有蛋白质均以自由扩散方式通过核孔，不消耗能量","相对分子质量小于40kDa的小分子可经核孔扩散通过；大分子蛋白质需由核定位信号（NLS）等信号介导、耗能地主动转运","核输入依靠核输出信号（NES），核输出依靠核定位信号（NLS）","核孔复合体只允许蛋白质通过，RNA不能通过","核孔复合体的数目在各时期恒定，与细胞代谢活性无关"],"answer":1,"explain":"NPC为双向运输通道，小分子可扩散，大分子经NLS/NES与输入、输出蛋白介导主动转运；mRNA、tRNA、rRNA等也经核孔出核。","type":"A1","id":"c10-35749ad0"},{"ch":10,"part":2,"tag":"核转运","stem":"某蛋白质在细胞静息状态下位于细胞质，在DNA损伤信号诱导下转位入核发挥转录调控作用。其最可能的机制是？","options":["损伤信号使其核定位信号（NLS）暴露或被修饰，与输入蛋白（importin）结合后经核孔复合体入核","损伤信号使核纤层解体，胞质蛋白随机流入核内","该蛋白质水解ATP后直接穿过核膜脂双层进入核内","损伤时核孔复合体孔径明显扩大，该蛋白质被动扩散入核","该蛋白质经内吞途径被直接运入细胞核"],"answer":0,"explain":"大分子入核须由NLS被importin识别、经核孔复合体耗能转运；损伤信号不会使核纤层解体或使核孔孔径非特异开放。","type":"A1","id":"c10-5d3cef83"},{"ch":10,"part":2,"tag":"染色质包装","stem":"人体细胞DNA总长约2m，而细胞核直径仅5～8μm。下列解释最合理的是？","options":["DNA以共价闭合环状形式存在，从而缩小体积","DNA大部分被降解，仅保留编码序列","DNA以单链游离形式均匀分散于核基质中","DNA经核孔持续排入细胞质以节省核内空间","DNA与组蛋白组装成核小体，并逐级螺旋折叠压缩形成染色质与染色体"],"answer":4,"explain":"核小体是染色质的基本结构单位，DNA经核小体、30nm纤维、襻环及染色体等多级压缩，使2m长的DNA容纳于核内。","type":"A1","id":"c10-de8ea402"},{"ch":10,"part":2,"tag":"染色质类型","stem":"关于常染色质与异染色质的叙述，正确的是？","options":["常染色质高度螺旋化，转录不活跃","异染色质多分布于核中央，常染色质多紧靠核膜","常染色质折叠疏松、着色浅、转录活跃；异染色质高度折叠、着色深、转录不活跃","异染色质中不含任何基因序列","细胞核中异染色质占90%以上，是执行转录功能的主要区域"],"answer":2,"explain":"两者是同一DNA的不同折叠状态：常染色质疏松、转录活跃，异染色质致密、多位于核膜下且转录不活跃。","type":"A1","id":"c10-d14811dd"},{"ch":10,"part":2,"tag":"核仁","stem":"关于核仁（nucleolus）的叙述，正确的是？","options":["核仁由纤维中心、致密纤维组分和颗粒组分构成，是rRNA合成加工及核糖体亚基组装的场所","核仁是由单位膜包裹的独立细胞器，主要合成mRNA","核仁的主要成分是脂质与DNA，不含RNA","核仁在有丝分裂期体积增大、功能最为活跃","核糖体蛋白（蛋白质）在核仁内合成"],"answer":0,"explain":"核仁无膜，是rRNA合成加工并与胞质运入的核糖体蛋白组装成核糖体亚基的场所；分裂期核仁解体消失，核糖体蛋白在胞质合成。","type":"A1","id":"c10-1ea17992"},{"ch":10,"part":2,"tag":"核纤层核基质","stem":"关于核纤层与核基质构成的核内网架系统，正确的是？","options":["核纤层由微管构成，核基质由微丝构成","核纤层与核基质互不相连，各自独立完成支撑功能","核基质是核内的膜性网状结构，与DNA复制无关","核纤层位于内核膜下，由核纤层蛋白构成中间纤维样网络，与核基质一起构成核骨架，为染色质提供锚定与支撑","核纤层只存在于细胞分裂期，间期细胞中消失"],"answer":3,"explain":"核纤层（lamin中间纤维网络）与核基质（非膜性核内网架）共同构成核骨架，参与染色质定位、DNA复制转录及核膜稳定。","type":"A1","id":"c10-8aefc3c5"},{"ch":10,"part":2,"tag":"核异常与疾病","stem":"关于细胞核结构异常与疾病的关系，正确的是？","options":["核仁增大只出现于良性病变，与肿瘤无关","早老症（Hutchinson-Gilford progeria）由LMNA基因突变致核纤层蛋白A异常，核膜形态异常、核稳定性下降","核孔复合体数目增多仅见于衰老细胞，与肿瘤细胞异常增殖无关","染色质重塑异常不参与白血病等肿瘤的发生","核纤层蛋白基因突变只影响骨骼肌，不引起其他系统病变"],"answer":1,"explain":"LMNA突变（progerin）导致早老症等核纤层蛋白病；核仁增大、核孔增多、染色质重塑异常均常见于肿瘤细胞。","type":"A1","id":"c10-de7693bc"},{"ch":10,"part":2,"tag":"核孔复合体的结构组成","stem":"关于核孔复合体（NPC）结构组成的叙述，正确的是？","options":["核孔复合体由一层膜性隔板封闭核孔，物质必须先解离隔板后才能通过","核孔复合体由核孔蛋白（nucleoporin）构成，包括胞质环、核质环、辐和中央转运体等结构，其FG重复序列可与核转运受体相互作用形成选择性通道","核孔复合体的中央通道由微管构成，其功能是牵引染色体移向两极","核孔复合体只存在于外核膜上，内核膜上没有核孔","核孔复合体是磷脂双分子层包裹的膜性孔道，其孔径固定不变"],"answer":1,"explain":"核孔处内、外核膜融合，核孔复合体由核孔蛋白组装成胞质环、核质环、辐、中央转运体等结构，无膜性隔板；FG重复序列介导与转运受体的相互作用。","type":"A1","id":"c10-07afeedf"},{"ch":10,"part":2,"tag":"Ran与核转运的方向性","stem":"关于核转运中Ran蛋白（Ran GTPase）作用的叙述，正确的是？","options":["Ran在核内主要以RanGDP形式存在，与输入蛋白结合后促进其携带货物入核","Ran自身即可识别核定位信号（NLS），无需输入蛋白参与","Ran水解GTP所释放的能量直接用于撑开核孔复合体的中央通道","核内RanGEF使Ran与GTP结合、胞质RanGAP促使Ran水解GTP，形成RanGTP梯度；核内RanGTP与输入蛋白结合使货物释放，出核过程则需RanGTP与输出蛋白协同","Ran本身属马达蛋白，可沿微管将蛋白质运入核内"],"answer":3,"explain":"RanGEF在核内、RanGAP在胞质，形成核内高RanGTP的梯度；RanGTP使输入蛋白释放货物，又与输出蛋白协同完成出核，保证核转运的方向性。","type":"A1","id":"c10-9778b44e"},{"ch":10,"part":2,"tag":"组蛋白修饰与染色质活性","stem":"关于组蛋白修饰与染色质活性的叙述，正确的是？","options":["组蛋白乙酰化使染色质构象较松散、转录活性升高；抑制组蛋白去乙酰化酶（HDAC）可使某些沉默基因重新表达","组蛋白只存在于异染色质中，常染色质的DNA不与组蛋白结合","组蛋白乙酰化直接改变DNA的碱基序列，属基因突变","各种组蛋白修饰均使染色质更加紧缩、基因表达沉默","组蛋白修饰只发生在组蛋白的球状结构域内部，与转录调控无关"],"answer":0,"explain":"组蛋白的乙酰化、甲基化、磷酸化等修饰改变染色质构象，乙酰化一般使染色质疏松、转录活跃；修饰主要发生在组蛋白尾部，是可逆的表观调控方式。","type":"A1","id":"c10-864cb41b"},{"ch":10,"part":2,"tag":"巴氏小体与兼性异染色质","stem":"女性间期细胞核膜内侧可见一个深染的小体（巴氏小体，Barr body），其本质是？","options":["一条多余的常染色体，由染色体不分离所引起","核仁组织区（NOR）的rRNA基因高度转录而形成的结构","失活的X染色体，属兼性异染色质，由Xist等非编码RNA介导的X染色体失活实现剂量补偿","由Y染色体高度螺旋化形成的组成型异染色质","由核纤层蛋白异常聚集形成的核内包涵体"],"answer":2,"explain":"女性两条X染色体中一条在间期高度螺旋化失活、贴近核膜形成巴氏小体，属兼性异染色质，通过Xist介导的X失活实现雌雄间基因剂量的补偿。","type":"A1","id":"c10-70585aed"},{"ch":10,"part":2,"tag":"核仁组织区与核仁周期","stem":"关于核仁组织区（nucleolus organizer region, NOR）与核仁周期的叙述，正确的是？","options":["人类细胞的NOR位于第1～22对染色体的短臂末端，共44处","NOR是核仁内合成核糖体蛋白的部位，其活性高低与细胞的蛋白质合成能力无关","分裂期核仁解体时，NOR的rRNA基因仍保持最高转录活性","NOR是核被膜上核孔集中分布的特殊区域，核仁即由此处穿出核膜","NOR位于5对近端着丝粒染色体短臂的次级缢痕处，含rRNA基因（rDNA），是间期核仁形成的部位；分裂期rRNA合成停止、核仁消失，末期在NOR处重新形成核仁"],"answer":4,"explain":"rDNA成串分布于5对近端着丝粒染色体短臂的次级缢痕（NOR）；间期在NOR周围形成核仁，分裂期rRNA合成停止、核仁消失，末期在其处重建。","type":"A1","id":"c10-1ec817f9"},{"ch":10,"part":2,"tag":"核内RNA的出核运输","stem":"关于核内合成的RNA经核孔复合体输出到细胞质的叙述，正确的是？","options":["mRNA前体须在核内完成剪接、5′加帽和3′加尾等加工成为成熟mRNA后才能输出；rRNA在核仁中与核糖体蛋白组装成核糖体亚基前体后经核孔输出，并在细胞质中进一步成熟","核内各种RNA均以自由扩散方式经核孔进入细胞质，不需要消耗能量","DNA也可经核孔进入细胞质，参与细胞质中的转录","rRNA先在细胞质中合成，再运入核仁加工","mRNA输出到细胞质后才进行剪接与加尾"],"answer":0,"explain":"RNA出核同样经核孔复合体的选择性转运：mRNA须加工成熟后才被输出，核糖体亚基前体在核仁组装后出核并在胞质中成熟，DNA不出核。","type":"A1","id":"c10-669b1e3b"},{"ch":10,"part":2,"tag":"核结构与功能的对应","stem":"下列关于细胞核各结构与其功能对应关系的叙述，正确的是？","options":["核仁——DNA复制的主要场所","核孔复合体——合成蛋白质的场所","核纤层——rRNA转录的场所","核纤层与核基质——构成核内网架，为染色质提供锚定与支撑，异染色质多贴近核膜与核仁周边","核周间隙——蛋白质合成后折叠加工的场所"],"answer":3,"explain":"核纤层（lamin中间纤维网络）与核基质共同构成核骨架，为染色质提供锚定支撑；DNA复制在核基质中进行，蛋白质合成在细胞质核糖体上进行。","type":"A1","id":"c10-3e81b7ab"},{"ch":10,"part":2,"tag":"核膜形成的区室化意义","stem":"核膜的出现使真核细胞形成了核内、核外两个区室。下列叙述正确的是？","options":["由于有核膜保护，真核细胞的DNA不再需要与蛋白质结合","真核细胞转录在核内进行、翻译在细胞质中进行，RNA前体在核内加工成熟后才输出，由此形成了转录后加工与运输等额外的调控层次","核膜的出现使真核细胞在核内进行翻译，从而明显提高翻译效率","原核细胞因没有核膜，DNA复制与细胞分裂不能进行","核膜使真核细胞的遗传信息不再受内外环境因素的影响"],"answer":1,"explain":"核膜使真核细胞的转录（核内）与翻译（细胞质）在时空上分开，RNA须加工成熟后经核孔输出，从而增加了转录后加工、运输等调控层次。","type":"A1","id":"c10-8512de32"},{"id":"gc11-04-1","ch":11,"part":3,"tag":"判读","stem":"C1 标记组释放的 ¹⁴CO₂ 是 C6 标记组的 8 倍，说明该细胞","options":["主要经糖酵解生成乳酸，C1 与 C6 以乳酸的形式排出细胞","主要经三羧酸循环彻底氧化，C1 比 C6 更早释放为二氧化碳","主要经糖异生转变为糖原，C1 与 C6 的代谢命运没有差别","主要经磷酸戊糖途径的非氧化阶段，C1 转移给核糖-5-磷酸","主要经磷酸戊糖途径的氧化阶段，C1 在脱羧时释放为二氧化碳"],"answer":4,"explain":"E 对：在磷酸戊糖途径的氧化阶段，葡糖-6-磷酸的 C1 在生成 5-磷酸核酮糖时以二氧化碳形式释放，C6 则留在糖链上，故 C1 标记组的 ¹⁴CO₂ 远多于 C6 组；经糖酵解与三羧酸循环代谢时两个位置的碳命运相近，C1 与 C6 释放量之比因此可用于估计该途径的通量。A 错：生成乳酸时 C1 与 C6 都不以二氧化碳形式释放。B 错：三羧酸循环中 C1 与 C6 最终都会被氧化，不能解释 8 倍差异。C 错：转变为糖原也不产生二氧化碳。D 错：非氧化阶段只重排碳链，不释放二氧化碳。","type":"A1","group":"c11-04","kind":"experiment","chs":[15,14,11,6],"vignette":"为判断一株白血病细胞系的核苷酸原料从哪来，研究生做了三组实验。第一组：分别在 C1 位 ¹⁴C 标记葡萄糖和 C6 位 ¹⁴C 标记葡萄糖的培养基中培养细胞并收集 ¹⁴CO₂，C1 标记组的释放量是 C6 标记组的 8 倍；加入葡萄糖-6-磷酸脱氢酶抑制剂后，¹⁴CO₂ 释放量与细胞增殖速度同步降到原来的三成。第二组：用酰胺氮被 ¹⁵N 标记的谷氨酰胺培养细胞，2 小时后在细胞内的 IMP、GMP 与 CTP 中检出 ¹⁵N，而 dTMP 的甲基上没有标记。第三组：差速离心分离胞质与线粒体组分，胞质组分中可测到以谷氨酰胺为氮源的氨基甲酰磷酸合成酶活性，该活性可被 UTP 抑制；线粒体组分中的同类酶则以游离氨为氮源，并可被 N-乙酰谷氨酸激活。","vignette_title":"情景 4：¹⁴CO₂ 计数器上的三条线索","gidx":1,"gn":5,"anchor":"释放量是 C6 标记组的 8 倍"},{"id":"gc14-01-3","ch":11,"part":3,"tag":"机制","stem":"该患者发作时血乳酸为 2.6 mmol/L，而肌糖原不能直接变成血中的葡萄糖，原因是","options":["肌肉缺乏糖原磷酸化酶，肌糖原不能分解为葡糖-6-磷酸","肌肉缺乏葡糖-6-磷酸酶，葡糖-6-磷酸不能水解为葡萄糖","肌肉缺乏乳酸脱氢酶，丙酮酸不能还原为乳酸而大量蓄积","肌肉缺乏己糖激酶，血中葡萄糖不能被肌细胞摄取和利用","肌肉缺乏磷酸果糖激酶-1，糖酵解不能正常进行和供能"],"answer":1,"explain":"B 对：骨骼肌缺乏葡糖-6-磷酸酶，肌糖原分解与肌内糖异生产生的葡糖-6-磷酸不能水解为游离葡萄糖，只能进入糖酵解生成乳酸，乳酸经血液运至肝再异生为葡萄糖回到肌肉，这就是乳酸循环。A 错：肌糖原磷酸化酶活性很高，肌糖原能够分解，缺的是末端的水解酶。C 错：肌肉富含乳酸脱氢酶，正是它把丙酮酸还原为乳酸。D 错：肌肉有己糖激酶，能摄取并磷酸化葡萄糖，正因为磷酸化的糖不能透出细胞，肌糖原才无法直接补充血糖。E 错：肌肉的磷酸果糖激酶-1活性正常，糖酵解可以顺利进行。","type":"A1","group":"c14-01","kind":"mechanism","chs":[16,11],"vignette":"一名 49 岁男性，体重 92 kg，腰围 101 cm。口服 75 g 葡萄糖后 3 小时内同步测血糖与胰岛素：血糖 30 分钟升至 11.8 mmol/L，180 分钟降至 3.0 mmol/L，此刻出现心慌、出汗与手抖；胰岛素 120 分钟才达峰值 71 mU/L，180 分钟仍为 52 mU/L。医生解释，他的脂肪与肌肉组织对胰岛素的反应减弱，胰岛β细胞只能分泌更多胰岛素来代偿，而分泌高峰的时相向后推移。低血糖发作时，血中胰高血糖素、肾上腺素与生长激素升高，肝内糖原分解与糖异生被动员；同一时刻测得的血乳酸为 2.6 mmol/L，但肝外的肌肉并不能直接把糖原变成血中的葡萄糖。","vignette_title":"情景 1：餐后三小时，血糖为什么反而掉下去了","gidx":3,"gn":5,"anchor":"肌肉并不能直接把糖原变成血中的葡萄糖"},{"id":"gc14-01-5","ch":11,"part":3,"tag":"方案","stem":"针对该患者餐后 180 分钟反复出现的低血糖，最合理的饮食调整是","options":["增加每餐单糖用量，使餐后血糖的峰值进一步升高","取消早餐并延长夜间禁食，减少胰岛素的分泌次数","每餐后立即皮下注射胰岛素，抑制肝糖原的分解输出","减少精制单糖摄入，改用低血糖生成指数的复合糖类","三餐改为全天禁食并静脉输注葡萄糖维持血糖水平"],"answer":3,"explain":"D 对：患者的问题是胰岛素分泌高峰延迟，减少精制单糖、改用吸收较慢的复合糖类可使餐后血糖峰值变平，避免血糖先冲高、再在延迟出现的胰岛素作用下过度下降。A 错：单糖越多，餐后血糖峰值越高，延迟出现的胰岛素高峰也越强，低血糖反而更重。B 错：取消早餐与延长禁食使空腹期更长，空腹低血糖风险增大。C 错：此时胰岛素水平并不低，再加胰岛素会使低血糖更严重。E 错：长期禁食并依赖静脉输液并非可行的日常方案，也失去了经口进食对血糖的缓冲。","type":"A1","group":"c14-01","kind":"mechanism","chs":[16,11],"vignette":"一名 49 岁男性，体重 92 kg，腰围 101 cm。口服 75 g 葡萄糖后 3 小时内同步测血糖与胰岛素：血糖 30 分钟升至 11.8 mmol/L，180 分钟降至 3.0 mmol/L，此刻出现心慌、出汗与手抖；胰岛素 120 分钟才达峰值 71 mU/L，180 分钟仍为 52 mU/L。医生解释，他的脂肪与肌肉组织对胰岛素的反应减弱，胰岛β细胞只能分泌更多胰岛素来代偿，而分泌高峰的时相向后推移。低血糖发作时，血中胰高血糖素、肾上腺素与生长激素升高，肝内糖原分解与糖异生被动员；同一时刻测得的血乳酸为 2.6 mmol/L，但肝外的肌肉并不能直接把糖原变成血中的葡萄糖。","vignette_title":"情景 1：餐后三小时，血糖为什么反而掉下去了","gidx":5,"gn":5,"anchor":"此刻出现心慌、出汗与手抖"},{"id":"gc14-03-3","ch":11,"part":3,"tag":"判读","stem":"该患者空腹血糖降至 2.9 mmol/L，最合理的解释是","options":["胰岛素分泌明显增多，外周组织对葡萄糖的摄取增强","胰高血糖素分泌减少，肝内糖异生的关键酶表达下降","脂肪动员增强，血浆游离脂肪酸在肝内大量异生为葡萄糖","肝细胞大量减少，肝糖原分解与糖异生能力明显下降","血糖超过肾糖阈，大量葡萄糖随尿排出而致血糖下降"],"answer":3,"explain":"D 对：肝是维持空腹血糖的主要器官，肝硬化时肝细胞大量减少，肝糖原储备耗竭且糖异生能力下降，血糖来源不足而出现空腹低血糖。A 错：情景未提示胰岛素分泌增多，肝硬化患者的低血糖源于肝产生葡萄糖的能力下降。B 错：应激状态下升糖激素是升高的，把低血糖归因于胰高血糖素减少缺乏依据。C 错：脂肪动员产生的脂肪酸不能大量异生为葡萄糖，只有甘油能进入糖异生，乙酰辅酶A不能净生糖。E 错：本例是血糖过低，不存在超过肾糖阈而大量随尿排出的情形。","type":"A1","group":"c14-03","kind":"mechanism","chs":[14,11,16],"vignette":"一名 58 岁男性，乙型肝炎后肝硬化 8 年，因呕血与黑便入院。入院 48 小时后出现嗜睡与扑翼样震颤。血氨 152 μmol/L（正常 18–72），动脉血 pH 7.49，空腹血糖 2.9 mmol/L，血乳酸 3.4 mmol/L，血尿素仅 1.8 mmol/L，血清白蛋白 26 g/L。医生分析，肠道内积血被细菌分解产氨增多，而肝细胞数量减少使鸟氨酸循环能力下降，氨不能像正常时那样在肝内合成尿素后排出；血中的氨以 NH₄⁺ 与 NH₃ 两种形式存在，二者的比例受血液 pH 影响。患者入院后未进食，肝糖原已近耗竭，肝糖异生能力也随肝细胞减少而下降。","vignette_title":"情景 3：肝硬化患者的一场消化道出血","gidx":3,"gn":5,"anchor":"肝糖异生能力也随肝细胞减少而下降"},{"id":"gc14-04-1","ch":11,"part":3,"tag":"判读","stem":"注射胰高血糖素后血糖几乎不升而血乳酸反而升高，说明该患儿的断点在","options":["己糖激酶缺陷，血中葡萄糖不能磷酸化后进入代谢","磷酸果糖激酶-1 缺陷，果糖-6-磷酸不能被继续分解","果糖二磷酸酶-1 缺陷，糖异生的中间物不能越过该反应","葡糖-6-磷酸水解为葡萄糖受阻，堆积后生成乳酸","丙酮酸羧化酶缺陷，丙酮酸不能羧化为草酰乙酸"],"answer":3,"explain":"D 对：胰高血糖素通过激活肝糖原磷酸化酶并促进糖异生来升高血糖，而这两条途径生成的葡糖-6-磷酸都要经葡糖-6-磷酸酶水解才能释放游离葡萄糖；该酶活性只剩 4%，所以血糖几乎不升，堆积的葡糖-6-磷酸转而进入糖酵解生成乳酸，血乳酸因此进一步升高。A 错：己糖激酶缺陷影响的是葡萄糖进入细胞后的第一步磷酸化，不会表现为血糖不升而乳酸升高。B 错：磷酸果糖激酶-1 缺陷使糖酵解受阻，乳酸生成应当减少而不是增多。C 错：情景已给出其余三个糖异生关键酶活性均在正常范围，果糖二磷酸酶-1 可以排除。E 错：丙酮酸羧化酶同属糖异生关键酶，其活性正常也与情景给出的酶学结果不符。","type":"A1","group":"c14-04","kind":"experiment","chs":[11,13,16],"vignette":"一名 9 个月男婴因清晨反复抽搐、肝大就诊。空腹 6 小时血糖 2.3 mmol/L，血乳酸 7.1 mmol/L。肝穿活检：肝糖原 84 mg/g（正常 30–50），葡糖-6-磷酸酶活性为对照的 4%，其余三个糖异生关键酶活性均在正常范围。静脉注射胰高血糖素 30 分钟后，血糖由 2.3 升至 2.5 mmol/L，血乳酸由 7.1 升至 8.6 mmol/L。用 ¹⁴C 标记的乳酸灌注肝匀浆，掺入葡萄糖的量仅为对照的 6%，而掺入二氧化碳的量与对照接近；另取离体肝线粒体测定，以谷氨酸加苹果酸为底物时 P/O 为 2.5，以琥珀酸为底物时为 1.5。","vignette_title":"情景 4：三项数据指向同一个断点","gidx":1,"gn":5,"anchor":"静脉注射胰高血糖素 30 分钟后"},{"id":"gc14-04-2","ch":11,"part":3,"tag":"机制","stem":"¹⁴C 标记的乳酸掺入葡萄糖仅 6% 而掺入二氧化碳接近对照，说明","options":["乳酸仍能生成葡糖-6-磷酸，断点在最后一步水解反应","乳酸不能被肝细胞摄取，其碳骨架未进入代谢途径","乳酸的碳骨架不能进入糖异生，故掺入量如此之低","乳酸被直接氧化成二氧化碳，绕过了糖异生的各步反应","标记的乳酸在肝匀浆中被稀释，放射性计数失去意义"],"answer":0,"explain":"A 对：掺入二氧化碳的量接近对照，说明乳酸的碳骨架照常经丙酮酸进入线粒体被氧化，糖异生上游的各步反应也在进行；只有生成游离葡萄糖这一步被卡住，放射性因此留在葡糖-6-磷酸里而不能出现在葡萄糖中。B 错：若乳酸根本不能进入肝细胞，掺入二氧化碳的量会同步下降，与结果不符。C 错：碳骨架既然能沿糖异生上游生成葡糖-6-磷酸并氧化为二氧化碳，就不能说它进不了糖异生。D 错：乳酸氧化为二氧化碳本身要经过丙酮酸与三羧酸循环，说它绕过糖异生的各步反应与实验结果矛盾。E 错：对照组的计数正常，稀释不能解释掺入量降到 6% 这样大的差别。","type":"A1","group":"c14-04","kind":"experiment","chs":[11,13,16],"vignette":"一名 9 个月男婴因清晨反复抽搐、肝大就诊。空腹 6 小时血糖 2.3 mmol/L，血乳酸 7.1 mmol/L。肝穿活检：肝糖原 84 mg/g（正常 30–50），葡糖-6-磷酸酶活性为对照的 4%，其余三个糖异生关键酶活性均在正常范围。静脉注射胰高血糖素 30 分钟后，血糖由 2.3 升至 2.5 mmol/L，血乳酸由 7.1 升至 8.6 mmol/L。用 ¹⁴C 标记的乳酸灌注肝匀浆，掺入葡萄糖的量仅为对照的 6%，而掺入二氧化碳的量与对照接近；另取离体肝线粒体测定，以谷氨酸加苹果酸为底物时 P/O 为 2.5，以琥珀酸为底物时为 1.5。","vignette_title":"情景 4：三项数据指向同一个断点","gidx":2,"gn":5,"anchor":"掺入葡萄糖的量仅为对照的 6%"},{"id":"gc14-04-3","ch":11,"part":3,"tag":"判读","stem":"该患儿血乳酸高达 7.1 mmol/L 并持续存在，其原因是","options":["组织缺氧，糖酵解产生的乳酸大量增加而不能被氧化","葡糖-6-磷酸堆积推动糖酵解，肝又不能将其异生为糖","肝内乳酸脱氢酶活性升高，把丙酮酸大量还原为乳酸","酮体生成减少，机体转而以乳酸作为主要能源物质","肾脏排泄乳酸的功能下降，乳酸在体内大量地蓄积"],"answer":1,"explain":"B 对：葡糖-6-磷酸酶缺乏使肝内葡糖-6-磷酸不能水解为葡萄糖而在细胞内堆积，堆积的底物推动糖酵解通量增大，乳酸生成增多；同时肝把乳酸异生为葡萄糖这条乳酸循环的末端被阻断，乳酸生成多而清除少，因而持续升高。A 错：患儿并无组织缺氧的证据，乳酸升高的根源在肝的代谢阻断。C 错：乳酸脱氢酶活性升高并非本例的酶学发现，情景给出的酶学异常在于葡糖-6-磷酸酶。D 错：乳酸并不是机体的主要能源物质，酮体生成减少与乳酸升高也没有因果关系。E 错：乳酸主要在肝内代谢清除，肾排泄不是血乳酸升高的主要原因。","type":"A1","group":"c14-04","kind":"experiment","chs":[11,13,16],"vignette":"一名 9 个月男婴因清晨反复抽搐、肝大就诊。空腹 6 小时血糖 2.3 mmol/L，血乳酸 7.1 mmol/L。肝穿活检：肝糖原 84 mg/g（正常 30–50），葡糖-6-磷酸酶活性为对照的 4%，其余三个糖异生关键酶活性均在正常范围。静脉注射胰高血糖素 30 分钟后，血糖由 2.3 升至 2.5 mmol/L，血乳酸由 7.1 升至 8.6 mmol/L。用 ¹⁴C 标记的乳酸灌注肝匀浆，掺入葡萄糖的量仅为对照的 6%，而掺入二氧化碳的量与对照接近；另取离体肝线粒体测定，以谷氨酸加苹果酸为底物时 P/O 为 2.5，以琥珀酸为底物时为 1.5。","vignette_title":"情景 4：三项数据指向同一个断点","gidx":3,"gn":5,"anchor":"血乳酸 7.1 mmol/L"},{"id":"gc16-03-3","ch":11,"part":3,"tag":"机制","stem":"加入转运体抑制剂后培养液中乳酸升到对照的2.4倍，最合理的解释是","options":["抑制剂破坏了线粒体，使丙酮酸不能进入三羧酸循环","抑制剂促进了糖原分解，乳酸是糖原分解的必然产物","胞质中堆积的葡糖-6-磷酸转向糖酵解，生成大量乳酸","抑制剂使乳酸脱氢酶的活性被激活，乳酸生成因而增多","内质网腔内的葡萄糖回漏到胞质，经糖异生转变成乳酸"],"answer":2,"explain":"C 对：转运体被抑制后葡糖-6-磷酸在胞质中堆积，它转而进入糖酵解生成丙酮酸，再还原为乳酸，故培养液中乳酸升高而标记葡萄糖减少。A 错在电镜下线粒体结构完好，丙酮酸进入三羧酸循环的通道未受损；B 错在乳酸并不是糖原分解的必然产物；D 错在乳酸脱氢酶并未被激活，乳酸增多源于底物供应增加；E 错在糖异生的方向是把乳酸变成葡萄糖，不会把葡萄糖变成乳酸。","type":"A1","group":"c16-03","kind":"mechanism","chs":[6,7,11],"vignette":"取同一批肝细胞分三组。甲组培养液含 25 mmol/L 葡萄糖，培养 4 小时；乙组先在无糖培养液中培养 12 小时，再补加葡萄糖培养 4 小时。电镜定量：甲组胞质中无膜包裹的颗粒约占胞质面积的 12%，该颗粒的数量随营养状态消长，过碘酸雪夫染色阳性；乙组补糖前降到 1% 以下，补糖后回升到 9%。丙组以 ¹⁴C 标记的乳酸为唯一碳源，其培养液中出现标记葡萄糖。若加入一种抑制葡糖-6-磷酸转运体的药物，培养液中标记葡萄糖降到 16%，胞质中葡糖-6-磷酸由 0.06 升到 0.21，培养液中乳酸升到对照的 2.4 倍；细胞活力仍在 95% 以上，培养液中测不到乳酸脱氢酶，线粒体结构完好。","vignette_title":"情景 3：胞质里那堆会消失的颗粒","gidx":3,"gn":5,"anchor":"培养液中乳酸升到对照的 2.4 倍"},{"id":"gc20-02-2","ch":11,"part":3,"tag":"判读","stem":"缺血区糖酵解速率提高到8倍，ATP供应仍严重不足，因为","options":["糖酵解净生成2分子ATP，彻底氧化可生成30或32分子","糖酵解每分子葡萄糖净生成4分子ATP，但生成乳酸又消耗等量ATP","糖酵解产生的ATP须先转变为磷酸肌酸才能被心肌收缩利用","糖酵解在胞质中生成的NADH不能用于合成ATP，故产额很低","糖酵解速率受磷酸果糖激酶-1的抑制性调节，无法持续提高"],"answer":0,"explain":"A 对：糖酵解每分子葡萄糖净生成2分子ATP，而彻底氧化可生成30或32分子，产额相差十几倍，即使速率提高到8倍也补不上氧化磷酸化停止留下的缺口。B 错：糖酵解净生成2分子ATP而不是4分子，乳酸生成也不消耗ATP。C 错：糖酵解生成的ATP可直接被心肌利用，不必先转变为磷酸肌酸。D 错：胞质NADH可经穿梭系统进入线粒体氧化，并非不能用于合成ATP。E 错：缺氧时磷酸果糖激酶-1反而被AMP与ADP激活，糖酵解能够持续加快。","type":"A1","group":"c20-02","kind":"mechanism","chs":[13,11,16],"vignette":"62岁男性因持续胸痛40分钟急诊入院，心电图提示前壁心肌梗死，冠状动脉前降支完全闭塞。心肌活检显示：缺血区氧分压降至1.3kPa（正常约5.3kPa），ATP由24降至8μmol/g，磷酸肌酸由30降至12μmol/g，ADP与AMP分别升高3倍与6倍，乳酸由1.4升至22μmol/g；此时线粒体的电子传递几乎停止，跨内膜质子梯度不能维持。缺血区糖原分解与糖酵解速率提高到原来的8倍，乳酸脱氢酶催化丙酮酸还原为乳酸，使NAD⁺不断再生；血乳酸升至5.2mmol/L，血糖7.8mmol/L。入院后患者心率由78升至120次/分，医师提醒这一变化会进一步加重缺血区的损伤。","vignette_title":"情景 2：冠状动脉堵住后的四十分钟","gidx":2,"gn":5,"anchor":"糖酵解速率提高到原来的8倍"},{"id":"gc24-01-4","ch":11,"part":3,"tag":"机制","stem":"该患者长期蛋白质摄入不足，体内一碳单位的供应随之减少；丝氨酸是一碳单位的主要来源，其碳骨架来自","options":["糖酵解中间产物 3-磷酸甘油酸，经三步反应转变为丝氨酸","糖酵解中间产物磷酸烯醇式丙酮酸，经转氨基作用生成丝氨酸","三羧酸循环中间产物草酰乙酸，经转氨基作用生成丝氨酸","磷酸戊糖途径产物 5-磷酸核糖，经转酮反应转变为丝氨酸","糖异生中间产物果糖-1,6-二磷酸，经水解反应生成丝氨酸"],"answer":0,"explain":"A 对：丝氨酸的碳骨架来自糖酵解中间产物 3-磷酸甘油酸，后者经 3-磷酸羟基丙酮酸、3-磷酸丝氨酸两步中间物再水解去磷酸生成丝氨酸，糖分解的中间物与氨基酸合成由此接上，糖供应不足时一碳单位的来源也随之减少。B 错：磷酸烯醇式丙酮酸经转氨基反应不生成丝氨酸，它主要经丙酮酸激酶生成丙酮酸。C 错：草酰乙酸经转氨基作用生成的是天冬氨酸，不是丝氨酸。D 错：5-磷酸核糖是磷酸戊糖途径的产物，用于核苷酸合成，不转变为丝氨酸。E 错：果糖-1,6-二磷酸在糖异生中被水解与去磷酸，方向与丝氨酸合成无关。","type":"A1","group":"c24-01","kind":"mechanism","chs":[14,15,11],"vignette":"肝细胞内甲硫氨酸的周转很快：甲硫氨酸腺苷转移酶消耗 1 分子 ATP，把甲硫氨酸变成 S-腺苷甲硫氨酸（SAM），SAM 是体内甲基的直接供体，把甲基交给受体后变成 S-腺苷同型半胱氨酸（SAH），SAH 再水解为同型半胱氨酸与腺苷。这些受体包括胍乙酸（接受甲基后生成肌酸）、去甲肾上腺素（接受甲基后生成肾上腺素）与 DNA 上的胞嘧啶。SAH 对多种甲基转移酶有强烈的抑制作用，SAM 与 SAH 的比值因此决定甲基化反应的实际速率。同型半胱氨酸要再获得甲基变回甲硫氨酸，只能接受 N5-甲基四氢叶酸提供的甲基，这一步由甲硫氨酸合酶催化，维生素 B12 是其辅酶；甲硫氨酸属必需氨基酸，该患者长期蛋白质摄入不足。检测结果：血浆甲硫氨酸 8 μmol/L，肝细胞内 SAM 与 SAH 的比值由 15 降到 1.8，血浆同型半胱氨酸 26 μmol/L，24 小时尿肌酐排出量比同龄人低 40%。","vignette_title":"情景 1：一份甲基的进项与出项","gidx":4,"gn":5,"anchor":"长期蛋白质摄入不足"},{"id":"gc24-02-4","ch":11,"part":3,"tag":"判读","stem":"该细胞谷氨酰胺的消耗速率高于葡萄糖，从碳骨架的去向看，谷氨酰胺","options":["经草酰乙酸转变为葡萄糖，以维持培养基中的葡萄糖浓度","直接进入糖酵解通路，与葡萄糖在同一环节被脱氢酶氧化","用于合成核苷酸与蛋白质，不进入三羧酸循环参与氧化供能","经乙酰辅酶A生成酮体，供肝外组织氧化利用","经 α-酮戊二酸进入三羧酸循环，既氧化供能又回补中间物"],"answer":4,"explain":"E 对：谷氨酰胺水解脱氨后生成 α-酮戊二酸，进入三羧酸循环既被氧化供能，又补充被核苷酸与氨基酸合成抽走的循环中间物，因此它在增殖细胞中的消耗量可以超过葡萄糖，与 α-酮戊二酸由 1.2 降到 0.2 相符。A 错：草酰乙酸可经糖异生生成葡萄糖，但谷氨酰胺的碳骨架主要经 α-酮戊二酸进入三羧酸循环被氧化，说它能大量转变为葡萄糖与实测的葡萄糖浓度下降不符。B 错：谷氨酰胺不进入糖酵解通路的前几步，它与葡萄糖的代谢入口不同。C 错：谷氨酰胺的碳骨架进入三羧酸循环，正是它提供能量的方式之一。D 错：酮体在肝内生成，增殖的淋巴细胞不生成酮体。","type":"A1","group":"c24-02","kind":"mechanism","chs":[14,15,11],"vignette":"丝裂原刺激后的一株人淋巴细胞进入快速增殖：24 小时内培养基中的谷氨酰胺由 2.0 mmol/L 降到 0.3 mmol/L，葡萄糖由 11.0 mmol/L 降到 9.9 mmol/L，前者的消耗速率约为后者的 1.5 倍。细胞内谷氨酰胺酶活性升到静息细胞的 5 倍，谷氨酸脱氢酶活性升高 3 倍。撤除培养基中的谷氨酰胺后，细胞内 α-酮戊二酸由 1.2 降到 0.2 nmol/mg 蛋白，天冬氨酸由 4.5 降到 1.1，嘌呤与嘧啶核苷酸的合成速率同步降到原来的三成。谷氨酰胺在血浆中浓度最高，是氨的无毒运输形式。谷氨酰胺酶水解其侧链酰胺基，释放出酰胺氮并生成谷氨酸；谷氨酸既可经氧化脱氨基作用变成 α-酮戊二酸，也可把氨基交给草酰乙酸生成天冬氨酸。谷氨酰胺的酰胺氮进入核苷酸环，其碳骨架则经 α-酮戊二酸进入三羧酸循环。","vignette_title":"情景 2：增殖细胞的两笔原料账","gidx":4,"gn":5,"anchor":"经 α-酮戊二酸进入三羧酸循环"},{"id":"gc24-03-1","ch":11,"part":3,"tag":"判读","stem":"该患者红细胞转酮醇酶活性为正常的 45%，加入焦磷酸硫胺素后升到 90%，说明","options":["酶蛋白的合成量明显减少，属于酶含量调节，加辅酶无效","辅酶焦磷酸硫胺素不足，酶蛋白本身并未明显减少","酶蛋白的一级结构发生突变，加入辅酶可纠正其构象","该酶被磷酸化修饰而失活，加入辅酶使其去磷酸化","酶的底物浓度不足，加入辅酶后底物供应得到补充"],"answer":1,"explain":"B 对：体外加入辅酶后活性由 45% 回升到 90%，说明酶蛋白的量与结构基本完好，缺的是辅酶焦磷酸硫胺素，属于辅酶供应不足造成的活性下降，与该患者长期嗜酒、以精制糖为主食的营养背景吻合。A 错：酶含量调节取决于酶蛋白的合成量，补加辅酶不会使活性成倍回升。C 错：一级结构突变属于酶蛋白本身的缺陷，补加辅酶不能纠正。D 错：磷酸化修饰改变的是已有酶的活性，与补加辅酶后活性回升的现象无关。E 错：底物由糖代谢提供，辅酶不是底物，加入辅酶不能补充底物。","type":"A1","group":"c24-03","kind":"mechanism","chs":[11,15,14],"vignette":"快速增殖的细胞并不让葡萄糖走完糖酵解：一部分葡糖-6-磷酸进入磷酸戊糖途径，生成 5-磷酸核糖与 NADPH；该途径的非氧化阶段由转酮醇酶与转醛醇酶催化碳单位的重排，把糖酵解的中间产物果糖-6-磷酸与 3-磷酸甘油醛也转回 5-磷酸核糖，转酮醇酶以焦磷酸硫胺素为辅酶。5-磷酸核糖与 ATP 反应生成磷酸核糖焦磷酸（PRPP），这是嘌呤与嘧啶核苷酸从头合成的共同起点。第二条支路的起点是糖酵解中间产物 3-磷酸甘油酸，它经三步反应生成丝氨酸；丝氨酸把羟甲基交给四氢叶酸，自身剩下的碳骨架成为甘氨酸，甘氨酸与一碳单位分别进入嘌呤环的不同位置。第三条支路的起点是丙酮酸，它经丙酮酸羧化酶生成草酰乙酸，后者接受谷氨酸的氨基成为天冬氨酸。一位以精制糖为主食并长期嗜酒的男性，红细胞转酮醇酶活性为正常的 45%，加入焦磷酸硫胺素后恢复到 90%，其外周血淋巴细胞在丝裂原刺激后的增殖反应明显低于对照。","vignette_title":"情景 3：一条葡萄糖的三个分岔口","gidx":1,"gn":5,"anchor":"加入焦磷酸硫胺素后恢复到 90%"},{"id":"gc24-03-2","ch":11,"part":3,"tag":"机制","stem":"转酮醇酶所催化的反应，在糖代谢中的意义是","options":["把葡糖-6-磷酸脱羧生成 5-磷酸核酮糖，同时生成 NADPH","把 5-磷酸核糖与 ATP 转变为 PRPP，为核苷酸提供原料","把糖酵解中间产物重排为 5-磷酸核糖，不产生 NADPH","把葡糖-6-磷酸水解为游离葡萄糖，使血糖得以维持稳定","把果糖-6-磷酸磷酸化为果糖-1,6-二磷酸，推动糖酵解进行"],"answer":2,"explain":"C 对：转酮醇酶属磷酸戊糖途径的非氧化阶段，它把果糖-6-磷酸与 3-磷酸甘油醛这类糖酵解中间产物的碳单位反复重排，生成 5-磷酸核糖，为核苷酸合成提供原料，这一步既不脱羧也不产生 NADPH。A 错：脱羧并生成 NADPH 的是氧化阶段的葡糖-6-磷酸脱氢酶。B 错：5-磷酸核糖与 ATP 生成 PRPP 由 PRPP 合成酶催化，不是转酮醇酶。D 错：葡糖-6-磷酸水解为游离葡萄糖由葡糖-6-磷酸酶催化。E 错：果糖-6-磷酸磷酸化为果糖-1,6-二磷酸由磷酸果糖激酶-1 催化，属糖酵解。","type":"A1","group":"c24-03","kind":"mechanism","chs":[11,15,14],"vignette":"快速增殖的细胞并不让葡萄糖走完糖酵解：一部分葡糖-6-磷酸进入磷酸戊糖途径，生成 5-磷酸核糖与 NADPH；该途径的非氧化阶段由转酮醇酶与转醛醇酶催化碳单位的重排，把糖酵解的中间产物果糖-6-磷酸与 3-磷酸甘油醛也转回 5-磷酸核糖，转酮醇酶以焦磷酸硫胺素为辅酶。5-磷酸核糖与 ATP 反应生成磷酸核糖焦磷酸（PRPP），这是嘌呤与嘧啶核苷酸从头合成的共同起点。第二条支路的起点是糖酵解中间产物 3-磷酸甘油酸，它经三步反应生成丝氨酸；丝氨酸把羟甲基交给四氢叶酸，自身剩下的碳骨架成为甘氨酸，甘氨酸与一碳单位分别进入嘌呤环的不同位置。第三条支路的起点是丙酮酸，它经丙酮酸羧化酶生成草酰乙酸，后者接受谷氨酸的氨基成为天冬氨酸。一位以精制糖为主食并长期嗜酒的男性，红细胞转酮醇酶活性为正常的 45%，加入焦磷酸硫胺素后恢复到 90%，其外周血淋巴细胞在丝裂原刺激后的增殖反应明显低于对照。","vignette_title":"情景 3：一条葡萄糖的三个分岔口","gidx":2,"gn":5,"anchor":"转酮醇酶以焦磷酸硫胺素为辅酶"},{"id":"gc24-04-5","ch":11,"part":3,"tag":"方案","stem":"关于本实验三类指标联合定位的做法，下列判断正确的是（X 型多选）","options":["代谢物浓度提示 5-磷酸核糖正常而 PRPP 减少，阻断点在两者之间","酶活测定把候选环节缩小到 PRPP 合成酶，与同位素结果一致","标记葡萄糖显示 5-磷酸核糖生成正常，支持磷酸戊糖途径通畅","三类指标中有一项异常就足以定位阻断点，无需相互印证","加入碱基不能恢复，说明补救合成同样需要 PRPP 参与"],"answer":[0,1,2,4],"explain":"答案 ABCE。A 对：代谢物浓度把缺口夹在 5-磷酸核糖与 PRPP 之间，提示问题出在由前者生成后者的那一步。B 对：酶活测定显示 PRPP 合成酶只有对照的 8%，其余三种酶活性接近对照，与同位素标记所见的上游通畅、下游受限完全一致，两类证据互相印证。C 对：用 ¹⁴C 标记的葡萄糖孵育后 5-磷酸核糖的放射性比活与对照接近，说明由葡萄糖到 5-磷酸核糖的通路没有被阻断。E 对：补加次黄嘌呤不能恢复腺苷酸含量与增殖，说明补救合成也需要 PRPP 提供磷酸核糖，两条路线共用同一份原料，这也解释了为什么单补碱基无效。D 错：三类指标各有盲区，例如耗氧与酶活都可能正常而代谢物浓度异常，只有相互印证才能把阻断点夹到具体的一步，说一项异常即可定位不成立。","type":"X","group":"c24-04","kind":"experiment","chs":[15,11,14],"vignette":"为定位一株人白血病细胞系核苷酸合成受阻的环节，研究生在含 11.0 mmol/L 葡萄糖与 2.0 mmol/L 谷氨酰胺的培养基中做了三组测定，各样品的细胞数已配平。第一组测细胞内代谢物浓度，单位 nmol/mg 蛋白：5-磷酸核糖 0.90（对照 0.90），PRPP 0.05（对照 0.40），α-酮戊二酸 1.2（对照 1.2），天冬氨酸 4.4（对照 4.5）。第二组测酶活性，以对照的百分比表示：PRPP 合成酶 8，葡糖-6-磷酸脱氢酶 96，天冬氨酸转氨酶 101，丝氨酸羟甲基转移酶 99。第三组以 ¹⁴C 标记的葡萄糖孵育 3 小时：细胞内 5-磷酸核糖的放射性比活与对照接近，腺苷酸与尿苷酸的放射性比活降到对照的 10% 以下。补充实验：培养基中加入 0.1 mmol/L 次黄嘌呤 24 小时后，细胞内的腺苷酸含量与增殖速率都没有恢复；另以 ¹⁵N 标记的甘氨酸孵育时，标记进入嘌呤核苷酸而在嘧啶核苷酸中检不出；改以 ¹⁵N 标记的天冬氨酸孵育，嘌呤与嘧啶核苷酸中都可检出标记。","vignette_title":"情景 4：三项指标共同指向的分流点","gidx":5,"gn":5,"anchor":"第一组测细胞内代谢物浓度"},{"id":"gc25-04-3","ch":11,"part":3,"tag":"判读","stem":"甲组细胞内 UDP-葡萄糖升到 380%、¹⁴C 掺入糖原升到 340%，这一结果说明","options":["胰岛素使糖的去路转向脂肪酸合成，故掺入糖原的放射性升高","¹⁴C 掺入量升高说明葡萄糖被彻底氧化为二氧化碳与水","胰岛素使糖的去路转向糖原合成，糖原合酶利用 UDP-葡萄糖","细胞内 UDP-葡萄糖升高说明糖原分解的速率同时升高","UDP-葡萄糖是糖酵解的中间产物，其升高说明糖酵解加快"],"answer":2,"explain":"C 对：UDP-葡萄糖是糖原合成中葡萄糖基的活化供体，其含量与放射性掺入量同步升高，说明胰岛素使葡萄糖的去路转向糖原合成，糖原合酶把葡萄糖基转移到糖原分子上。A 掺入的是糖原而不是脂质；B 掺入糖原与彻底氧化是两条不同的去路；D 糖原分解加强会使 UDP-葡萄糖利用减少，与结果方向相反；E UDP-葡萄糖属糖原合成途径，不是糖酵解的中间产物。","type":"A1","group":"c25-04","kind":"experiment","chs":[1,3,25,11],"vignette":"为追踪胰岛素把葡萄糖送进糖原的分子链条，研究生用同一批大鼠肝细胞做四组实验，各组细胞数与培养条件一致。甲组加 10 nmol/L 胰岛素；乙组先加 PI3K 抑制剂再加等量胰岛素；丙组先加蛋白磷酸酶抑制剂再加等量胰岛素；丁组不加药。孵育 30 分钟后测定，结果以丁组为 100%：甲组受体自身磷酸化升到 620%，Akt 磷酸化升到 480%，糖原合酶激酶磷酸化升到 510%，糖原合酶活性升到 260%，细胞内 UDP-葡萄糖升到 380%，¹⁴C 标记的葡萄糖掺入糖原的量升到 340%；乙组受体自身磷酸化仍为 590%，而 Akt 磷酸化只有 90%，糖原合酶活性为 100%；丙组 Akt 磷酸化与糖原合酶激酶磷酸化均与甲组接近，糖原合酶活性却只有 110%。另一组细胞在胰岛素作用前导入一个不能被 Akt 磷酸化的糖原合酶激酶突变体，该突变体持续保持活性，其糖原合酶活性只有 120%，¹⁴C 掺入糖原只有 140%。","vignette_title":"情景 4：三个抑制剂与一条通往糖原的链条","gidx":3,"gn":6,"anchor":"细胞内 UDP-葡萄糖升到"},{"id":"gc3-01-1","ch":11,"part":3,"tag":"机制","stem":"冲刺 30 秒时骨骼肌 PFK-1 活性升高约 8 倍，最合理的解释是","options":["PFK-1 被磷酸化修饰，酶的催化活性因而升高","胰高血糖素升高，使肌内果糖-2,6-二磷酸减少","细胞内 pH 下降，使酶的最适 pH 发生偏移","AMP 与 ADP 增多，使 PFK-1 的变构激活增强","ATP 与柠檬酸增多，使 PFK-1 的变构抑制增强"],"answer":3,"explain":"D 对：骨骼肌中 ATP 降到 3.1 mmol/L、柠檬酸降到 0.3 mmol/L 而 AMP 升高约 5 倍，该酶的变构激活剂增多、变构抑制剂减少，活性因此升高约 8 倍。E 错：ATP 与柠檬酸是 PFK-1 的变构抑制剂，增多只会抑制该酶，方向与本例相反。A 错：PFK-1 主要受变构调节，磷酸化修饰并非其激活方式，磷酸化调节的是糖原磷酸化酶等。C 错：pH 下降改变的是反应条件，不能解释酶活性成倍升高。B 错：胰高血糖素不作用于骨骼肌，肌内果糖-2,6-二磷酸不会因它减少。","type":"A1","group":"c3-01","kind":"mechanism","chs":[11,16,3],"vignette":"短跑冲刺 30 秒，骨骼肌细胞内 ATP 由 5.2 mmol/L 降到 3.1 mmol/L，AMP 升高约 5 倍，柠檬酸由 1.1 mmol/L 降到 0.3 mmol/L，实测 PFK-1 活性升高约 8 倍；乳酸脱氢酶把丙酮酸还原为乳酸，使 NAD⁺ 不断再生，糖酵解在无氧条件下仍可净生成 2 分子 ATP。把底物果糖-6-磷酸浓度提高 10 倍，被 ATP 与柠檬酸抑制的 PFK-1 活性仍无明显回升。同一时刻肝细胞 ATP 与柠檬酸水平偏高，胰高血糖素经 cAMP 通路使肝内果糖-2,6-二磷酸减少，肝细胞 PFK-1 活性反而下降，糖异生得以维持血糖；骨骼肌则缺乏葡糖-6-磷酸酶，糖原分解产物不能直接补充血糖。","vignette_title":"情景 1：冲刺三十秒里的两个 PFK-1","gidx":1,"gn":5,"anchor":"AMP 升高约 5 倍"},{"id":"gc3-01-3","ch":11,"part":3,"tag":"机制","stem":"骨骼肌在无氧条件下仍能持续净生成 ATP，乳酸脱氢酶的作用是","options":["把 NADH 直接氧化，为呼吸链提供大量 ATP","使 NAD⁺ 再生，糖酵解得以继续进行","使丙酮酸进入线粒体，彻底氧化生成 CO₂","使细胞内 pH 升高，从而增强多种酶的活性","把乙酰 CoA 转变为酮体，供脑组织氧化利用"],"answer":1,"explain":"B 对：3-磷酸甘油醛脱氢酶催化的反应需要 NAD⁺，无氧时线粒体不能把 NADH 重新氧化，乳酸脱氢酶把丙酮酸还原为乳酸，使 NAD⁺ 不断再生，故糖酵解仍能继续并净生成 2 分子 ATP。A 错：NADH 的氧化依赖呼吸链，乳酸脱氢酶只完成 NAD⁺ 的再生，不产生 ATP。C 错：丙酮酸进入线粒体彻底氧化需要氧，正是无氧条件下做不到的。E 错：酮体在肝内生成，与骨骼肌的乳酸代谢无关。D 错：乳酸生成使细胞内 pH 下降而非升高。","type":"A1","group":"c3-01","kind":"mechanism","chs":[11,16,3],"vignette":"短跑冲刺 30 秒，骨骼肌细胞内 ATP 由 5.2 mmol/L 降到 3.1 mmol/L，AMP 升高约 5 倍，柠檬酸由 1.1 mmol/L 降到 0.3 mmol/L，实测 PFK-1 活性升高约 8 倍；乳酸脱氢酶把丙酮酸还原为乳酸，使 NAD⁺ 不断再生，糖酵解在无氧条件下仍可净生成 2 分子 ATP。把底物果糖-6-磷酸浓度提高 10 倍，被 ATP 与柠檬酸抑制的 PFK-1 活性仍无明显回升。同一时刻肝细胞 ATP 与柠檬酸水平偏高，胰高血糖素经 cAMP 通路使肝内果糖-2,6-二磷酸减少，肝细胞 PFK-1 活性反而下降，糖异生得以维持血糖；骨骼肌则缺乏葡糖-6-磷酸酶，糖原分解产物不能直接补充血糖。","vignette_title":"情景 1：冲刺三十秒里的两个 PFK-1","gidx":3,"gn":5,"anchor":"乳酸脱氢酶把丙酮酸还原为乳酸"},{"id":"gc3-01-5","ch":11,"part":3,"tag":"机制","stem":"关于这 30 秒中骨骼肌与肝的代谢调节，下列判断正确的是（X 型多选）","options":["肌糖原分解产生的葡糖-6-磷酸可直接补充血糖","骨骼肌 ATP 下降、AMP 升高，PFK-1 变构激活增强","肝内果糖-2,6-二磷酸减少，PFK-1 活性受到抑制","乳酸脱氢酶再生 NAD⁺，使无氧糖酵解得以继续","胰高血糖素经 cAMP 通路使肝糖原分解增强"],"answer":[1,2,3,4],"explain":"答案 BCDE。B、D、C、E 逐一对应情景中的四条信息：骨骼肌 AMP 升高后 PFK-1 变构激活、乳酸脱氢酶再生 NAD⁺ 使糖酵解继续、肝内果糖-2,6-二磷酸减少使 PFK-1 受抑、胰高血糖素经 cAMP 通路促进肝糖原分解。A 错：骨骼肌缺乏葡糖-6-磷酸酶，肌糖原分解产生的葡糖-6-磷酸不能水解为游离葡萄糖，因此不能直接补充血糖，这也是肌糖原只能供肌肉自身利用的原因。","type":"X","group":"c3-01","kind":"mechanism","chs":[11,16,3],"vignette":"短跑冲刺 30 秒，骨骼肌细胞内 ATP 由 5.2 mmol/L 降到 3.1 mmol/L，AMP 升高约 5 倍，柠檬酸由 1.1 mmol/L 降到 0.3 mmol/L，实测 PFK-1 活性升高约 8 倍；乳酸脱氢酶把丙酮酸还原为乳酸，使 NAD⁺ 不断再生，糖酵解在无氧条件下仍可净生成 2 分子 ATP。把底物果糖-6-磷酸浓度提高 10 倍，被 ATP 与柠檬酸抑制的 PFK-1 活性仍无明显回升。同一时刻肝细胞 ATP 与柠檬酸水平偏高，胰高血糖素经 cAMP 通路使肝内果糖-2,6-二磷酸减少，肝细胞 PFK-1 活性反而下降，糖异生得以维持血糖；骨骼肌则缺乏葡糖-6-磷酸酶，糖原分解产物不能直接补充血糖。","vignette_title":"情景 1：冲刺三十秒里的两个 PFK-1","gidx":5,"gn":5,"anchor":"糖原分解产物不能直接补充血糖"},{"id":"gc3-02-1","ch":11,"part":3,"tag":"机制","stem":"禁食 16 小时后血糖仍能维持在 4.5 mmol/L 左右，主要因为","options":["肝糖原持续大量分解，可维持血糖数天以上","酮体在肝内大量转变为葡萄糖，补充血糖浓度","肌糖原直接分解为葡萄糖，补充血糖浓度","肝糖异生增强，以乳酸、甘油和生糖氨基酸为原料","脂肪酸经β氧化生成乙酰辅酶A，再异生为葡萄糖"],"answer":3,"explain":"D 对：禁食 16 小时后肝糖原已由 70 g 降至约 20 g，糖异生取代肝糖原分解成为维持血糖的主要途径，原料是乳酸、甘油和生糖氨基酸。A 错：肝糖原储备有限，不可能维持数天以上。C 错：肌肉缺乏葡糖-6-磷酸酶，肌糖原不能直接分解为葡萄糖补充血糖。E 错：丙酮酸脱氢酶复合体催化的反应不可逆，乙酰辅酶A不能净生成丙酮酸，脂肪酸不能大量异生为糖。B 错：酮体运至肝外组织氧化供能，并不转变为葡萄糖。","type":"A1","group":"c3-02","kind":"mechanism","chs":[11,14,16],"vignette":"禁食 16 小时后，血糖仍维持在 4.5 mmol/L 左右，而肝糖原由 70 g 降至约 20 g，尿中尿素排出量比餐后增加近一倍。此时骨骼肌蛋白质分解加强，氨经转氨基作用交给丙酮酸生成丙氨酸，随血液运至肝；肝把丙氨酸脱氨后，氨进入鸟氨酸循环合成尿素，剩下的丙酮酸成为糖异生的原料。肝细胞内丙酮酸羧化酶与磷酸烯醇式丙酮酸羧激酶活性明显升高，乳酸、甘油和生糖氨基酸成为血糖的主要来源。血浆游离脂肪酸虽然明显升高，但它并不能大量转变为葡萄糖。","vignette_title":"情景 2：禁食十六小时，血糖从哪里来","gidx":1,"gn":5,"anchor":"肝糖原由 70 g 降至约 20 g"},{"id":"gc3-02-2","ch":11,"part":3,"tag":"机制","stem":"肝内脂肪酸氧化产生的乙酰辅酶A不能大量异生为葡萄糖，原因是","options":["乙酰辅酶A经三羧酸循环后可转变为丙酮酸","丙酮酸脱氢酶复合体反应不可逆，乙酰辅酶A不能净生糖","糖异生的四个关键酶都位于线粒体内，脂肪酸无法接触","脂肪酸β氧化释放的能量不足以驱动糖异生反应","肝内缺乏甘油激酶，脂肪酸不能被磷酸化后进入糖异生"],"answer":1,"explain":"B 对：丙酮酸脱氢酶复合体催化的反应不可逆，乙酰辅酶A不能净生成丙酮酸，因此脂肪酸的碳骨架无法大量进入糖异生，这正是糖易转变为脂肪而脂肪难以转变为糖的原因。A 错：乙酰辅酶A经三羧酸循环生成的是柠檬酸等中间物，不能净生成丙酮酸。D 错：能量并非限制因素，脂肪酸氧化释放的能量反而充足。E 错：肝内存在甘油激酶，脂肪动员产生的甘油可在肝内异生为糖，受限制的是脂肪酸部分。C 错：糖异生关键酶并不都在线粒体，磷酸烯醇式丙酮酸羧激酶等主要在胞质。","type":"A1","group":"c3-02","kind":"mechanism","chs":[11,14,16],"vignette":"禁食 16 小时后，血糖仍维持在 4.5 mmol/L 左右，而肝糖原由 70 g 降至约 20 g，尿中尿素排出量比餐后增加近一倍。此时骨骼肌蛋白质分解加强，氨经转氨基作用交给丙酮酸生成丙氨酸，随血液运至肝；肝把丙氨酸脱氨后，氨进入鸟氨酸循环合成尿素，剩下的丙酮酸成为糖异生的原料。肝细胞内丙酮酸羧化酶与磷酸烯醇式丙酮酸羧激酶活性明显升高，乳酸、甘油和生糖氨基酸成为血糖的主要来源。血浆游离脂肪酸虽然明显升高，但它并不能大量转变为葡萄糖。","vignette_title":"情景 2：禁食十六小时，血糖从哪里来","gidx":2,"gn":5,"anchor":"它并不能大量转变为葡萄糖"},{"id":"gc3-03-3","ch":11,"part":3,"tag":"机制","stem":"该患者肝内乙酰辅酶A转而生成酮体而不是彻底氧化，主要原因是","options":["乙酰辅酶A羧化酶活性升高，乙酰辅酶A被大量消耗","呼吸链被酮体抑制，NADH 不能重新氧化","三羧酸循环的关键酶被乙酰辅酶A变构激活","肉碱脂酰转移酶活性下降，β氧化受到抑制","草酰乙酸被糖异生大量消耗，柠檬酸合成减少"],"answer":4,"explain":"E 对：乙酰辅酶A进入三羧酸循环需先与草酰乙酸缩合成柠檬酸；胰岛素缺乏、胰高血糖素升高时，草酰乙酸被糖异生大量消耗，乙酰辅酶A因而转向酮体生成，这解释了本例血酮升高的来源。A 错：乙酰辅酶A羧化酶催化脂肪酸合成，酮症时其活性受抑。B 错：酮体并不抑制呼吸链。C 错：三羧酸循环关键酶在 ATP、NADH 充足时受抑制，本例限制点在草酰乙酸的供应。D 错：酮症时肉碱脂酰转移酶活性升高而非下降。","type":"A1","group":"c3-03","kind":"mechanism","chs":[12,16,11],"vignette":"一名 1 型糖尿病患者中断胰岛素治疗 12 小时后入院，呼吸深快（28 次/分），呼气有烂苹果味，皮肤干燥。化验：血糖 22 mmol/L，血浆游离脂肪酸 1.8 mmol/L（正常 0.4～0.9），血酮 5.2 mmol/L，动脉血 pH 7.22、HCO₃⁻ 8 mmol/L。治疗观察：补液并静脉滴注小剂量胰岛素后 6 小时，血糖降至 11 mmol/L，血浆游离脂肪酸降至 0.6 mmol/L，血酮降至 1.8 mmol/L，pH 回升至 7.31。实验室观察两项：① 取患者肝组织匀浆，加入等量 ¹⁴C 标记的乙酰乙酸孵育 30 分钟，放射性几乎全部保留在乙酰乙酸中；同法处理的骨骼肌匀浆中，大部分放射性转移到其他产物。② 把 ¹⁴C 标记的脂肪酸加到患者肌组织匀浆中，标记物可在分离出的线粒体组分中被氧化；若先用肉碱转运体抑制剂处理，标记物便停留在胞质组分中。","vignette_title":"情景 3：血糖 22 mmol/L，血酮 5.2 mmol/L","gidx":3,"gn":5,"anchor":"血酮 5.2 mmol/L"},{"id":"gc3-04-4","ch":11,"part":3,"tag":"判读","stem":"再以丙酮酸加苹果酸为底物时耗氧速率同样可被 ADP 刺激，说明","options":["丙酮酸只在胞质中代谢，线粒体不能利用它","三羧酸循环不需要草酰乙酸即可持续运行","丙酮酸可直接被复合体Ⅰ氧化，把电子交给氧","丙酮酸经氧化脱羧与三羧酸循环提供还原当量","苹果酸是呼吸链的直接递电子体，与循环无关"],"answer":3,"explain":"D 对：丙酮酸经丙酮酸脱氢酶复合体氧化脱羧生成乙酰辅酶A，与苹果酸回补的草酰乙酸缩合成柠檬酸进入三羧酸循环，产生 NADH 与 FADH₂ 交给呼吸链，故耗氧增加并能被 ADP 刺激。C 错：丙酮酸不能直接被复合体Ⅰ氧化，须先经脱羧和三羧酸循环。E 错：苹果酸在循环中被脱氢生成草酰乙酸，它不是呼吸链的直接递电子体。A 错：线粒体正是丙酮酸氧化脱羧的场所，加入苹果酸回补草酰乙酸后循环才能运转。B 错：柠檬酸合酶需要草酰乙酸，循环必须有草酰乙酸回补才能持续。","type":"A1","group":"c3-04","kind":"experiment","chs":[13,11,12],"vignette":"深夜的实验台上，研究生用离体大鼠肝线粒体悬液测耗氧量：体系含 ADP、Pi 与 Mg²⁺，25℃ 持续通氧，用氧电极记录。以谷氨酸加苹果酸为底物，加入 ADP 后耗氧速率由 12 升到 42（nmol O·min⁻¹·mg⁻¹），P/O 比约为 2.5；改用琥珀酸为底物的相同条件下，P/O 比约为 1.5。加入 2,4-二硝基苯酚后耗氧速率进一步升高到 78，而体系中 ATP 生成量反而下降到接近零；换一管加入抗霉素A，耗氧迅速降至 4；另一管加入寡霉素，耗氧降至 9，而跨膜质子梯度反而增大。再以丙酮酸加苹果酸为底物，加入 ADP 后耗氧速率由 10 升到 38；以软脂酰肉碱为底物时，耗氧同样可被 ADP 刺激。","vignette_title":"情景 4：氧电极上的一次药物滴定","gidx":4,"gn":6,"anchor":"以丙酮酸加苹果酸为底物"},{"id":"gc6-01-3","ch":11,"part":3,"tag":"机制","stem":"生理血糖约 5 mmol/L 时，突变型葡糖激酶的实际表现是","options":["活性明显低于正常酶，而胰岛 B 细胞功能不受影响","活性与正常酶相同，但胰岛素分泌的阈值明显降低","活性与正常酶相同，但肝糖原分解的速度明显加快","活性明显高于正常酶，肝细胞与胰岛 B 细胞应答增强","活性明显低于正常酶，肝细胞与胰岛 B 细胞应答减弱"],"answer":4,"explain":"E 对：Km 40 mmol/L 远高于生理血糖 5 mmol/L，此时突变酶远未饱和、反应速度明显偏低；肝细胞与胰岛 B 细胞都靠这一步磷酸化来感受葡萄糖，故二者对血糖升高的应答减弱。D 错：Km 升高使低血糖时的反应更慢而非更快。B 错：活性并不相同，而且感受减弱会使分泌阈值上移。C 错：该酶催化的是磷酸化而非糖原分解。A 错：胰岛 B 细胞同样表达葡糖激酶，功能必然受影响。","type":"A1","group":"c6-01","kind":"mechanism","chs":[1,3,11],"vignette":"肝细胞与胰岛 B 细胞中都有葡糖激酶（己糖激酶Ⅳ），它催化葡萄糖磷酸化为葡糖-6-磷酸，是糖酵解的第一个限速步骤，也被看作细胞的葡萄糖感受器：血糖升高后，进入细胞并被磷酸化的葡萄糖增多，胰岛素分泌随之启动。某患者自幼餐后血糖升高而空腹血糖接近正常，测序发现葡糖激酶第 62 位的缬氨酸被甲硫氨酸替换，该残基的侧链原本与葡萄糖的羟基形成氢键。研究者把突变酶与正常酶分别纯化，测得正常酶的 Km 约 8 mmol/L，突变酶约 40 mmol/L，两者 Vmax 相近。","vignette_title":"情景 1：当葡萄糖感受器认错了底物","gidx":3,"gn":5,"anchor":"肝细胞与胰岛 B 细胞中都有葡糖激酶"},{"id":"gc6-01-4","ch":11,"part":3,"tag":"判读","stem":"该患者空腹血糖接近正常而餐后血糖明显升高，合理的解释是","options":["突变酶的 Km 升高，需要较高的血糖才能有效磷酸化葡萄糖","胰高血糖素分泌过多使餐后糖异生的速度明显加快","肝糖原分解过度使餐后肝葡萄糖输出量明显增加","突变酶的 Km 降低，需要较低的血糖就能有效磷酸化葡萄糖","胰岛素抵抗使餐后外周组织摄取葡萄糖的能力明显下降"],"answer":0,"explain":"A 对：Km 升高相当于感受器的阈值上移，血糖低时酶几乎不工作、血糖很高时才被有效饱和，因此空腹血糖大致正常而餐后血糖明显升高。D 错：Km 降低会使低血糖时也更易磷酸化，方向相反。E 错：情景未给胰岛素抵抗或外周摄取障碍的证据，且难以解释空腹血糖正常。C 错：糖原分解过度主要造成空腹低血糖或空腹血糖升高。B 错：糖异生增强同样以空腹血糖升高为突出表现。","type":"A1","group":"c6-01","kind":"mechanism","chs":[1,3,11],"vignette":"肝细胞与胰岛 B 细胞中都有葡糖激酶（己糖激酶Ⅳ），它催化葡萄糖磷酸化为葡糖-6-磷酸，是糖酵解的第一个限速步骤，也被看作细胞的葡萄糖感受器：血糖升高后，进入细胞并被磷酸化的葡萄糖增多，胰岛素分泌随之启动。某患者自幼餐后血糖升高而空腹血糖接近正常，测序发现葡糖激酶第 62 位的缬氨酸被甲硫氨酸替换，该残基的侧链原本与葡萄糖的羟基形成氢键。研究者把突变酶与正常酶分别纯化，测得正常酶的 Km 约 8 mmol/L，突变酶约 40 mmol/L，两者 Vmax 相近。","vignette_title":"情景 1：当葡萄糖感受器认错了底物","gidx":4,"gn":5,"anchor":"餐后血糖升高而空腹血糖接近正常"},{"id":"gc6-02-4","ch":11,"part":3,"tag":"机制","stem":"若胞质中的 NADH 不能被穿梭系统及时氧化，糖酵解将出现的后果是","options":["胞质 NADH 抑制丙酮酸激酶，使磷酸烯醇式丙酮酸大量堆积","胞质 NADH 与 NAD⁺ 比值下降，3-磷酸甘油醛脱氢酶反应加速","胞质 NADH 把电子交给复合体Ⅱ的 FAD，并生成大量 ATP","胞质 NADH 直接进入线粒体基质，被复合体Ⅰ迅速氧化","胞质 NADH 与 NAD⁺ 比值升高，3-磷酸甘油醛脱氢酶反应受阻"],"answer":4,"explain":"E 对：3-磷酸甘油醛脱氢酶催化的反应需要 NAD⁺ 作辅酶，NADH 不能及时再氧化会使 NAD⁺ 相对不足、比值升高，该步受阻，糖酵解整体减慢。B 错：NADH 堆积使比值升高而不是下降。D 错：情景已说明 NADH 不能自由穿过线粒体内膜。C 错：这条路径靠穿梭系统间接完成，不是 NADH 直接与复合体Ⅱ作用。A 错：NADH 并不直接抑制丙酮酸激酶，丙酮酸激酶受 ATP、丙氨酸等调节。","type":"A1","group":"c6-02","kind":"mechanism","chs":[3,11,13],"vignette":"胞质中糖酵解产生的 NADH 不能自由穿过线粒体内膜，它的还原当量要靠穿梭系统送进线粒体。骨骼肌与脑以甘油磷酸穿梭为主：胞质 NADH 先把氢交给磷酸二羟丙酮生成 α-磷酸甘油，后者在线粒体内膜靠胞质一侧被线粒体甘油-3-磷酸脱氢酶重新氧化为磷酸二羟丙酮，脱下的一对电子经该酶的辅基 FAD 与铁硫中心交给泛醌，再沿复合体Ⅲ、细胞色素 c、复合体Ⅳ传给氧。肝与心肌则以苹果酸-天冬氨酸穿梭为主，把还原当量以 NADH 的形式送进基质。按教材口径，1 NADH 约相当于 2.5 ATP，1 FADH₂ 约相当于 1.5 ATP，所以 1 分子葡萄糖彻底氧化时骨骼肌约得 30 ATP、肝约得 32 ATP。","vignette_title":"情景 2：一对氢原子的两条进城路线","gidx":4,"gn":5,"anchor":"胞质中糖酵解产生的 NADH"},{"id":"gc6-03-2","ch":11,"part":3,"tag":"判读","stem":"肝内果糖-2,6-二磷酸水平下降后，糖代谢流向的变化是","options":["糖酵解与糖异生同时减慢，肝葡萄糖输出不变","糖酵解加快而糖异生减慢，肝葡萄糖输出减少","糖酵解加快而糖异生不变，乳酸生成明显增多","糖酵解与糖异生同时加快，底物循环明显增强","糖酵解减慢而糖异生加快，肝葡萄糖输出增多"],"answer":4,"explain":"E 对：该信号分子减少使磷酸果糖激酶-1 的激活减弱、果糖二磷酸酶-1 的抑制解除，糖酵解受抑而糖异生加强，肝把葡糖-6-磷酸用于合成葡萄糖输出。B 错：方向完全写反。D 错：两者同时加快会形成无效的底物循环，与饥饿时节省葡萄糖的需要相反。A 错：糖异生是加快的，肝葡萄糖输出增多。C 错：乳酸生成增多主要出现在缺氧的肌肉，与肝的这条调节方向无关。","type":"A1","group":"c6-03","kind":"mechanism","chs":[3,11],"vignette":"空腹时血糖下降，胰高血糖素通过 cAMP-蛋白激酶 A 级联把磷酸基团加到肝细胞内多个靶酶上。糖原磷酸化酶被磷酸化后活性升高，糖原合酶被磷酸化后活性下降，肝糖原分解释放出葡糖-6-磷酸。磷酸化还作用于双功能酶，使它表现出果糖-2,6-二磷酸酶活性，肝内果糖-2,6-二磷酸的水平随之下降。果糖-2,6-二磷酸是磷酸果糖激酶-1 的别构激活剂，又是果糖二磷酸酶-1 的别构抑制剂；它减少以后，磷酸果糖激酶-1 活性下降、果糖二磷酸酶-1 活性升高，糖酵解受到抑制而糖异生加强，更多葡糖-6-磷酸被用于合成葡萄糖，补充血糖。","vignette_title":"情景 3：饥饿时肝把开关扳向另一边","gidx":2,"gn":5,"anchor":"肝内果糖-2,6-二磷酸的水平随之下降"},{"id":"gc6-03-4","ch":11,"part":3,"tag":"机制","stem":"同一磷酸化修饰使糖原磷酸化酶与糖原合酶表现相反，其生理意义是","options":["使糖原分解产生的葡糖-6-磷酸经糖酵解消耗","使肌糖原可以直接分解为葡萄糖来补充血糖","使肝糖原的合成与分解都加快以维持血糖稳定","避免糖原合成与分解同时高速进行而浪费能量","使两种酶在同一时间内保持较低的催化活性"],"answer":3,"explain":"D 对：磷酸化使分解酶激活、合成酶失活，方向相反、彼此协同，避免底物循环空转造成 ATP 的无效消耗。C 错：两者不可能同时高速进行。B 错：肌细胞缺少葡糖-6-磷酸酶，肌糖原不能直接补充血糖，且与本题调节方向无关。A 错：饥饿时肝把葡糖-6-磷酸用于糖异生和释放入血，而不是经糖酵解消耗。E 错：磷酸化后磷酸化酶活性是升高的，并非都降低。","type":"A1","group":"c6-03","kind":"mechanism","chs":[3,11],"vignette":"空腹时血糖下降，胰高血糖素通过 cAMP-蛋白激酶 A 级联把磷酸基团加到肝细胞内多个靶酶上。糖原磷酸化酶被磷酸化后活性升高，糖原合酶被磷酸化后活性下降，肝糖原分解释放出葡糖-6-磷酸。磷酸化还作用于双功能酶，使它表现出果糖-2,6-二磷酸酶活性，肝内果糖-2,6-二磷酸的水平随之下降。果糖-2,6-二磷酸是磷酸果糖激酶-1 的别构激活剂，又是果糖二磷酸酶-1 的别构抑制剂；它减少以后，磷酸果糖激酶-1 活性下降、果糖二磷酸酶-1 活性升高，糖酵解受到抑制而糖异生加强，更多葡糖-6-磷酸被用于合成葡萄糖，补充血糖。","vignette_title":"情景 3：饥饿时肝把开关扳向另一边","gidx":4,"gn":5,"anchor":"糖原合酶被磷酸化后活性下降"},{"id":"gc8-01-3","ch":11,"part":3,"tag":"机制","stem":"肝内果糖-2,6-二磷酸由 12 降至 2，对糖代谢的直接后果是","options":["果糖-2,6-二磷酸是 PFK-1 的变构抑制剂，其下降使糖酵解增强","PFK-1 与果糖二磷酸酶-1 活性同时升高，底物循环加快","PFK-1 活性升高、果糖二磷酸酶-1 活性下降，糖酵解增强","PFK-1 与果糖二磷酸酶-1 活性同时下降，糖异生减弱","PFK-1 活性下降、果糖二磷酸酶-1 活性升高，糖异生增强"],"answer":4,"explain":"E 对：果糖-2,6-二磷酸是 PFK-1 最强的变构激活剂，同时抑制果糖二磷酸酶-1；它下降使糖酵解减弱、糖异生增强，与应激时肝向血中输出葡萄糖的方向一致。B 方向完全写反。C、D 错在这两个酶处于底物循环的两端，受同一效应物相反调节，不会同升或同降。E 把效应物的性质说反，果糖-2,6-二磷酸是激活剂而不是抑制剂。","type":"A1","group":"c8-01","kind":"mechanism","chs":[25,16,11,12],"vignette":"一名青年因车祸大出血急诊入院。血浆肾上腺素升至正常的 12 倍，胰高血糖素升至 3 倍，胰岛素降至正常的四分之一；血糖 11.2 mmol/L，血游离脂肪酸由 0.4 升至 1.8 mmol/L，血酮体 1.1 mmol/L，尿氮排出明显增多。肝细胞内 cAMP 由 0.5 升至 4.0 μmol/L，PKA 被活化；果糖-2,6-二磷酸由 12 降至 2 nmol/g，糖原磷酸化酶活性升至 90%，糖原合酶活性降至 10%。","vignette_title":"情景 1：一个信号，同时开三条流水线","gidx":3,"gn":6,"anchor":"果糖-2,6-二磷酸由 12 降至 2"},{"id":"gc8-02-5","ch":11,"part":3,"tag":"机制","stem":"试验后进食，肝内脂肪酸合成增强，其碳源与还原力主要来自","options":["血浆游离脂肪酸经肉碱转运入线粒体，呼吸链氧化提供还原力","酮体分解产生的乙酰辅酶A用于合成，糖酵解中间物提供还原力","糖分解生成乙酰辅酶A经柠檬酸运出，磷酸戊糖途径提供还原力","氨基酸脱氨生成的碳骨架直接供合成，氧化磷酸化提供还原力","β 氧化产生的乙酰辅酶A直接用于合成，三羧酸循环提供还原力"],"answer":2,"explain":"C 对：进食后胰岛素升高、糖分解增强，线粒体内乙酰辅酶A与草酰乙酸缩合为柠檬酸后运出，在胞质裂解出乙酰辅酶A供脂肪酸合成，还原力由磷酸戊糖途径生成的 NADPH 提供。B、B 错在合成用的是胞质中的乙酰辅酶A，不是 β 氧化或酮体分解的产物，还原力也不来自三羧酸循环。D 肉碱转运是把脂酰基运入线粒体氧化，方向相反。E 氧化磷酸化不产生 NADPH，氨基酸碳骨架也不是主要碳源。","type":"A1","group":"c8-02","kind":"mechanism","chs":[16,12,11],"vignette":"一名健康志愿者参加 72 小时禁食试验，期间只饮水。禁食 12 小时血糖 4.6 mmol/L，24 小时 4.1 mmol/L，72 小时 3.8 mmol/L，肝糖原由 70 g 降至 24 小时的 8 g。血游离脂肪酸由 0.4 升至 1.9 mmol/L，血酮体由 0.1 升至 5.6 mmol/L，脑组织摄取的酮体约占其耗能的 60%。肝内磷酸烯醇式丙酮酸羧激酶活性升高 3 倍，其 mRNA 含量同步升高 4 倍。尿氮排出在 24 小时达高峰，72 小时比 24 小时减少约 40%。试验结束后口服 100 g 葡萄糖，30 分钟后血浆胰岛素由 6 升至 42 mU/L，血糖 6.8 mmol/L。","vignette_title":"情景 2：禁食 72 小时里，脑换了一种燃料","gidx":5,"gn":6,"anchor":"血浆胰岛素由 6 升至 42"},{"id":"gc8-03-3","ch":11,"part":3,"tag":"判读","stem":"运动中血乳酸仅轻度升高，最合理的解释是","options":["丙酮酸被大量用于合成脂肪酸，故乳酸生成减少","氧供充足时 NADH 经呼吸链氧化，丙酮酸进入线粒体","丙酮酸在肌肉中被转化为酮体，进入血液供其他组织利用","乳酸脱氢酶活性下降，丙酮酸不能还原生成乳酸","肌糖原分解受抑，葡萄糖供应减少使乳酸生成减少"],"answer":1,"explain":"B 对：氧供充足时糖酵解产生的 NADH 经呼吸链氧化使 NAD⁺ 再生，丙酮酸不必还原为乳酸即可进入线粒体氧化，故血乳酸仅轻度升高，这与耗氧量增至 4 倍一致。B 乳酸脱氢酶活性并未下降，无氧时该反应仍能进行。C 运动时肌糖原分解是增强的。D 运动时脂肪酸合成受抑，丙酮酸也不用于合成脂肪酸。E 酮体在肝内生成，肌肉不生成酮体。","type":"A1","group":"c8-03","kind":"mechanism","chs":[13,12,11],"vignette":"一名长跑运动员在 2 小时耐力运动末段接受股四头肌活检。肌内 ATP 由 24 降至 15 mmol/kg，ADP 与 AMP 分别升高 2 倍与 5 倍，柠檬酸由 1.2 降至 0.4 mmol/kg；PFK-1 活性升高约 3 倍，丙酮酸生成速率加快，肌糖原由 110 降至 46 mmol/kg。血游离脂肪酸由 0.3 升至 1.5 mmol/L，血乳酸仅轻度升高。运动全程耗氧量约为静息时的 4 倍，血糖维持在 4.8 mmol/L。","vignette_title":"情景 3：能量不够时，线粒体自己踩刹车与油门","gidx":3,"gn":5,"anchor":"血乳酸仅轻度升高"},{"id":"gc8-04-2","ch":11,"part":3,"tag":"判读","stem":"以 ¹⁴C 标记的乳酸为底物时，放射性葡萄糖比对照升高 2.3 倍，说明","options":["胰高血糖素促进了糖酵解，乳酸被氧化为二氧化碳","胰高血糖素促进了以乳酸为原料的糖异生","放射性乳酸被脂肪酸合成利用，间接使葡萄糖放射性升高","胰高血糖素促进了糖原分解，乳酸经糖原合成途径释放","放射性乳酸先转变为酮体，再由肝内酮体分解生成葡萄糖"],"answer":1,"explain":"B 对：示踪剂是乳酸，放射性出现在葡萄糖中，说明乳酸经糖异生转变为葡萄糖，且加胰高血糖素后转变增多，与糖异生增强一致。B 若乳酸被氧化为二氧化碳，放射性应出现在二氧化碳而不是葡萄糖中，方向不同。C 糖原分解不产生葡萄糖的放射性升高，乳酸也不是糖原合成的中间物。E 错在肝内不能利用酮体生成葡萄糖。C 错在脂肪酸合成不产生葡萄糖，且乳酸碳骨架进入的是糖异生而不是脂质。","type":"A1","group":"c8-04","kind":"experiment","chs":[16,11,13],"vignette":"研究生用离体大鼠肝细胞做三组实验：甲组为对照，乙组加入 10 nmol/L 胰高血糖素，丙组先加入 PKA 抑制剂 H89 再加同样浓度的胰高血糖素。孵育 30 分钟后，乙组细胞内 cAMP 由 0.6 升至 4.8 μmol/L，糖原由 45 降至 20 mg/g 蛋白，培养基中葡萄糖由 0.8 升至 2.4 mmol/L，果糖-2,6-二磷酸由 11 降至 3 nmol/g；丙组各项指标与甲组接近。另取一组以 ¹⁴C 标记的乳酸为底物孵育，加入胰高血糖素后培养基中放射性葡萄糖比对照升高 2.3 倍。分离肝细胞线粒体测定 P/O：以琥珀酸为底物时为 1.5，以谷氨酸加苹果酸为底物时为 2.5。","vignette_title":"情景 4：三组肝细胞与一组放射性计数","gidx":2,"gn":5,"anchor":"放射性葡萄糖比对照升高 2.3 倍"},{"id":"gc8-04-3","ch":11,"part":3,"tag":"方案","stem":"若要判断培养基中新增的葡萄糖来自糖原分解还是糖异生，最有判别力的做法是","options":["测定乳酸脱氢酶活性，据其高低推断葡萄糖的来源","延长孵育时间至 6 小时，观察葡萄糖浓度是否继续升高","换用不含乳酸与氨基酸的孵育液，观察葡萄糖输出是否下降","向孵育液中加入氟化钠，观察培养基中葡萄糖浓度的变化","测定细胞内 cAMP 浓度，看其升高幅度是否与葡萄糖输出平行"],"answer":2,"explain":"C 对：糖异生的原料是乳酸、甘油和生糖氨基酸，去掉这些底物后若葡萄糖输出明显下降，说明糖异生是重要来源，若不变则提示主要来自糖原分解，这是最有判别力的对照。B cAMP 只反映激素信号强弱，与葡萄糖来源无对应关系。C 氟化钠抑制烯醇化酶，是测血糖标本时防止糖被消耗的试剂，不能判别来源。D 乳酸脱氢酶活性高低与葡萄糖来源无关。E 延长孵育时间两种来源都仍在进行，只能看总量变化。","type":"A1","group":"c8-04","kind":"experiment","chs":[16,11,13],"vignette":"研究生用离体大鼠肝细胞做三组实验：甲组为对照，乙组加入 10 nmol/L 胰高血糖素，丙组先加入 PKA 抑制剂 H89 再加同样浓度的胰高血糖素。孵育 30 分钟后，乙组细胞内 cAMP 由 0.6 升至 4.8 μmol/L，糖原由 45 降至 20 mg/g 蛋白，培养基中葡萄糖由 0.8 升至 2.4 mmol/L，果糖-2,6-二磷酸由 11 降至 3 nmol/g；丙组各项指标与甲组接近。另取一组以 ¹⁴C 标记的乳酸为底物孵育，加入胰高血糖素后培养基中放射性葡萄糖比对照升高 2.3 倍。分离肝细胞线粒体测定 P/O：以琥珀酸为底物时为 1.5，以谷氨酸加苹果酸为底物时为 2.5。","vignette_title":"情景 4：三组肝细胞与一组放射性计数","gidx":3,"gn":5,"anchor":"培养基中葡萄糖由 0.8 升至 2.4"},{"ch":11,"part":3,"tag":"糖酵解","stem":"关于糖酵解（glycolysis）的叙述，正确的是？","options":["在细胞质中进行，关键酶是己糖激酶、磷酸果糖激酶-1和丙酮酸激酶，1分子葡萄糖净生成2分子ATP","在细胞质和线粒体中进行，关键酶为己糖激酶、磷酸果糖激酶-1和乳酸脱氢酶","其不可逆反应由己糖激酶、醛缩酶和丙酮酸激酶催化","1分子葡萄糖经糖酵解净生成4分子ATP","糖酵解的全部反应均可逆，故与糖异生共用同一套酶"],"answer":0,"explain":"糖酵解全程在胞质，关键酶为己糖激酶、磷酸果糖激酶-1（最重要）和丙酮酸激酶；投入2 ATP、生成4 ATP，净得2 ATP。","type":"A1","id":"c11-cf70a842"},{"ch":11,"part":3,"tag":"有氧氧化","stem":"按现行教材口径（1 NADH≈2.5 ATP、1 FADH₂≈1.5 ATP），1分子葡萄糖彻底氧化净生成ATP数约为？","options":["24或26","30或32","36或38","12或14","48"],"answer":1,"explain":"糖酵解净2、丙酮酸氧化脱羧5、三羧酸循环20，加上胞质NADH经穿梭生成的3或5，共30（甘油磷酸穿梭）或32（苹果酸穿梭）。","type":"A1","id":"c11-feaed062"},{"ch":11,"part":3,"tag":"三羧酸循环","stem":"关于三羧酸循环（TCA cycle）的叙述，正确的是？","options":["关键酶是琥珀酸脱氢酶、延胡索酸酶和苹果酸脱氢酶","1分子乙酰CoA经循环净生成3分子NADH、1分子FADH₂和2分子ATP","在线粒体中进行，含4次脱氢、2次脱羧和1次底物水平磷酸化，关键酶为柠檬酸合酶、异柠檬酸脱氢酶和α-酮戊二酸脱氢酶复合体","循环产能以底物水平磷酸化为主，不产生还原当量","循环的起始底物是丙酮酸，循环本身可生成CO₂和H₂O"],"answer":2,"explain":"TCA在线粒体进行，1分子乙酰CoA经4次脱氢、2次脱羧和1次底物水平磷酸化生成3 NADH、1 FADH₂和1 GTP，主要经氧化磷酸化产能。","type":"A1","id":"c11-baff46c7"},{"ch":11,"part":3,"tag":"磷酸戊糖途径","stem":"关于磷酸戊糖途径（pentose phosphate pathway, PPP）的叙述，正确的是？","options":["关键酶是6-磷酸葡萄糖酸脱氢酶，主要功能是生成ATP","在线粒体中进行，主要受ADP/ATP比值的调节","其生成的NADPH主要用于氧化供能","关键酶是葡萄糖-6-磷酸脱氢酶，在细胞质中进行，主要生成NADPH和磷酸核糖，不产生ATP","该途径是葡萄糖分解的必经途径，所有葡萄糖均需经此代谢"],"answer":3,"explain":"PPP在胞质进行，关键酶为葡萄糖-6-磷酸脱氢酶并受NADPH/NADP⁺比值调节；NADPH供还原性合成与抗氧化，磷酸核糖供核苷酸合成。","type":"A1","id":"c11-9a7437ce"},{"ch":11,"part":3,"tag":"糖异生","stem":"糖异生（gluconeogenesis）的关键酶是？","options":["己糖激酶、磷酸果糖激酶-1、丙酮酸激酶和葡萄糖-6-磷酸酶","丙酮酸激酶、果糖二磷酸酶-1、葡萄糖-6-磷酸酶和糖原合酶","柠檬酸合酶、异柠檬酸脱氢酶和α-酮戊二酸脱氢酶复合体","丙酮酸脱氢酶复合体、磷酸烯醇式丙酮酸羧激酶和葡萄糖-6-磷酸酶","丙酮酸羧化酶、磷酸烯醇式丙酮酸羧激酶、果糖二磷酸酶-1和葡萄糖-6-磷酸酶"],"answer":4,"explain":"糖异生在肝、肾的线粒体与胞质中进行，由上述4个酶绕过糖酵解的三个不可逆反应；己糖激酶、PFK-1和丙酮酸激酶是糖酵解关键酶。","type":"A1","id":"c11-b493cdbc"},{"ch":11,"part":3,"tag":"糖酵解旁路","stem":"若细胞内磷酸果糖激酶-1（PFK-1）完全缺乏，葡萄糖仍可转变为丙酮酸，其可能的途径是？","options":["葡萄糖直接经三羧酸循环转变为丙酮酸","葡萄糖经磷酸戊糖途径生成甘油醛-3-磷酸，再沿糖酵解后半段转变为丙酮酸","葡萄糖经糖原合成与分解途径转变为丙酮酸","葡萄糖经糖异生途径转变为丙酮酸","葡萄糖不能转变为丙酮酸，只能在细胞内蓄积"],"answer":1,"explain":"PFK-1阻断的是果糖-6-磷酸生成果糖-1,6-二磷酸；磷酸戊糖途径可生成甘油醛-3-磷酸，后者进入糖酵解后半段生成丙酮酸。","type":"A1","id":"c11-d098f7e7"},{"ch":11,"part":3,"tag":"糖原代谢","stem":"关于糖原合成与分解调节的叙述，正确的是？","options":["糖原合酶与糖原磷酸化酶都是磷酸化后活性升高","糖原磷酸化酶去磷酸化后活性升高，糖原合酶磷酸化后活性升高","糖原合酶与糖原磷酸化酶的活性调节彼此相反，主要受磷酸化/去磷酸化修饰调节，胰高血糖素可使磷酸化酶激活、糖原合酶受抑","肌糖原可直接分解为葡萄糖以维持血糖浓度恒定","糖原合成与分解由同一关键酶催化，仅受底物浓度调节"],"answer":2,"explain":"磷酸化使糖原磷酸化酶激活、糖原合酶失活（去磷酸化则相反）；肌细胞缺乏葡萄糖-6-磷酸酶，故肌糖原不能直接补充血糖。","type":"A1","id":"c11-5228bf5c"},{"ch":11,"part":3,"tag":"血糖调节","stem":"关于血糖调节与糖尿病的叙述，正确的是？","options":["胰岛素可升高血糖，胰高血糖素可降低血糖","肌糖原是维持血糖浓度恒定的主要来源","血糖浓度的恒定仅取决于胰岛素的分泌量","胰岛素是唯一能降低血糖的激素，可促进糖原合成、抑制糖异生；胰高血糖素、肾上腺素、糖皮质激素等升高血糖","糖尿病患者血糖升高仅由胰岛素绝对缺乏引起，与胰岛素抵抗无关"],"answer":3,"explain":"胰岛素是唯一降血糖激素，升糖激素包括胰高血糖素、肾上腺素、糖皮质激素和生长激素；2型糖尿病以胰岛素抵抗为主。","type":"A1","id":"c11-3171022d"},{"ch":11,"part":3,"tag":"丙酮酸脱氢酶复合体","stem":"关于丙酮酸脱氢酶复合体（pyruvate dehydrogenase complex）的叙述，正确的是？","options":["该复合体催化丙酮酸生成乙酰CoA，反应可逆，是糖异生的重要步骤","该复合体含丙酮酸脱氢酶、二氢硫辛酰胺转乙酰酶和二氢硫辛酰胺脱氢酶，辅助因子有焦磷酸硫胺素（TPP）、硫辛酸、辅酶A、FAD和NAD⁺；反应不可逆，缺乏维生素B₁可使其活性下降","该复合体的全部辅助因子均由同一种维生素衍生而来","该复合体位于细胞质中，其产物乙酰CoA可直接用于脂肪酸合成","该复合体催化的反应是糖酵解中唯一生成NADH的步骤"],"answer":1,"explain":"丙酮酸脱氢酶复合体在线粒体内，由三种酶和TPP、硫辛酸、CoA、FAD、NAD⁺五种辅助因子组成，反应不可逆；维生素B₁缺乏使TPP不足、酶活性下降。","type":"A1","id":"c11-772bb6dd"},{"ch":11,"part":3,"tag":"糖酵解的调节","stem":"关于磷酸果糖激酶-1（PFK-1）活性调节的叙述，正确的是？","options":["ATP和柠檬酸是该酶的变构激活剂，AMP与果糖-2,6-二磷酸是其变构抑制剂","胰高血糖素通过提高肝细胞内果糖-2,6-二磷酸的水平激活PFK-1","ATP和柠檬酸是该酶的变构抑制剂，AMP、ADP和果糖-2,6-二磷酸是其变构激活剂；胰高血糖素使肝内果糖-2,6-二磷酸减少而抑制糖酵解","该酶是糖异生的关键酶，催化果糖-1,6-二磷酸生成果糖-6-磷酸","该酶活性只受底物浓度影响，不受细胞能量水平与激素调节"],"answer":2,"explain":"PFK-1是糖酵解最重要的调节点：ATP、柠檬酸抑制，AMP、ADP和果糖-2,6-二磷酸激活；胰高血糖素使肝内果糖-2,6-二磷酸减少而抑制糖酵解。","type":"A1","id":"c11-0e7e6f7c"},{"ch":11,"part":3,"tag":"无氧氧化与NAD⁺再生","stem":"剧烈运动的骨骼肌中，糖酵解产生的丙酮酸主要在乳酸脱氢酶催化下还原为乳酸。此反应最主要的意义是？","options":["使NADH重新氧化为NAD⁺，保证3-磷酸甘油醛脱氢酶所催化的反应持续进行，使无氧条件下糖酵解仍能继续供能","生成大量ATP，为肌肉收缩提供主要能量","乳酸可作为合成脂肪酸的直接原料","使细胞内pH升高，有利于多种酶的活性","促进丙酮酸进入线粒体彻底氧化"],"answer":0,"explain":"3-磷酸甘油醛脱氢酶催化的反应需要NAD⁺，而线粒体氧化NADH受阻；乳酸脱氢酶使丙酮酸还原为乳酸并再生NAD⁺，糖酵解得以持续，无氧时仍可净生成2 ATP。","type":"A1","id":"c11-8ccf4b6f"},{"ch":11,"part":3,"tag":"乳酸循环","stem":"关于乳酸循环（Cori循环）的叙述，正确的是？","options":["乳酸循环是指肌肉把乳酸彻底氧化为CO₂和H₂O的过程","肌肉中生成的乳酸在肌肉内直接异生为葡萄糖","肝内乳酸经糖酵解转变为葡萄糖，再经血液运回肌肉","肌肉无氧氧化生成的乳酸经血液运至肝，在肝内经糖异生生成葡萄糖，再运回肌肉利用；该循环既回收乳酸，又防止乳酸堆积引起酸中毒","乳酸循环只在肝内进行，与肌肉的无氧氧化无关"],"answer":3,"explain":"肌肉无氧氧化产乳酸，经血液入肝异生为葡萄糖，再回到肌肉利用；这一循环把不能直接生糖的肌糖原间接补充为血糖，同时避免乳酸酸中毒。","type":"A1","id":"c11-bb48fa02"},{"ch":11,"part":3,"tag":"糖原贮积症","stem":"1岁男童反复空腹低血糖、肝大、乳酸酸中毒，注射胰高血糖素后血糖不升高，确诊为糖原贮积症Ⅰ型（von Gierke病）。该病最可能是下列哪种酶缺陷所致？","options":["肌糖原磷酸化酶缺陷","肝糖原合酶缺陷","磷酸果糖激酶-1缺陷","溶酶体酸性α-葡萄糖苷酶缺陷（Pompe病）","葡糖-6-磷酸酶缺陷，使肝糖原分解和糖异生产生的葡糖-6-磷酸不能水解为葡萄糖释放入血"],"answer":4,"explain":"Ⅰ型糖原贮积症为葡糖-6-磷酸酶缺陷：肝糖原分解与糖异生受阻而致空腹低血糖、肝大；葡糖-6-磷酸堆积使其经糖酵解生成乳酸增多，并伴高脂血症。","type":"A1","id":"c11-53236902"},{"ch":11,"part":3,"tag":"糖酵解抑制剂","stem":"临床检测血糖时，采血管中常加入氟化钠。其生化原理是？","options":["氟化物抑制烯醇化酶，阻断糖酵解，防止血标本中的葡萄糖被血细胞继续分解消耗","氟化物激活己糖激酶，使血糖测定值升高","氟化物抑制乳酸脱氢酶，使乳酸不能生成","氟化物与葡萄糖结合生成不溶物，便于比色测定","氟化物抑制磷酸戊糖途径，防止NADPH生成"],"answer":0,"explain":"烯醇化酶是糖酵解的酶，氟化物可抑制其活性而阻断糖酵解；故测血糖标本中加氟化钠可防止血细胞继续消耗葡萄糖，使测定结果更接近体内真实血糖。","type":"A1","id":"c11-9651f84a"},{"ch":11,"part":3,"tag":"磷酸戊糖途径缺陷与溶血","stem":"葡萄糖-6-磷酸脱氢酶（G6PD）缺乏症患者食用蚕豆或服用某些氧化性药物后可发生急性溶血。其机制是？","options":["G6PD缺乏使葡糖-6-磷酸不能进入糖酵解，红细胞因缺乏ATP而破裂","G6PD缺乏使磷酸戊糖途径生成的磷酸核糖减少，核酸合成障碍导致红细胞死亡","G6PD缺乏使三羧酸循环受阻，红细胞能量供应中断","G6PD缺乏使NADPH生成减少，谷胱甘肽（GSH）难以维持还原型，红细胞膜因氧化损伤而破裂溶血","G6PD缺乏使红细胞内乳酸堆积，导致细胞水肿破裂"],"answer":3,"explain":"红细胞抗氧化依赖磷酸戊糖途径提供的NADPH维持还原型谷胱甘肽；G6PD缺乏时NADPH不足，遇蚕豆或氧化性药物即发生膜脂质与血红蛋白氧化损伤而溶血。","type":"A1","id":"c11-eff2d4ef"},{"ch":11,"part":3,"tag":"血糖的来源与去路","stem":"关于血糖来源与去路的叙述，正确的是？","options":["血糖的唯一来源是食物中糖类的消化吸收","血糖的去路只有氧化供能一条途径","血糖的来源包括食物糖类的消化吸收、肝糖原分解和糖异生；去路包括氧化供能、合成肝糖原与肌糖原、转变为脂肪及非必需氨基酸等非糖物质，血糖超过肾糖阈时还可随尿排出","餐后血糖主要来源于肝糖原的分解","正常人血糖浓度全天恒定不变，与进食和活动无关"],"answer":2,"explain":"血糖浓度是来源与去路动态平衡的结果：来源有食物吸收、肝糖原分解和糖异生，去路有氧化供能、合成糖原、转变为脂肪和非必需氨基酸等，过高时随尿排出。","type":"A1","id":"c11-c9571033"},{"id":"gc14-02-1","ch":12,"part":3,"tag":"机制","stem":"该患者血浆 LDL-胆固醇极高而甘油三酯不高，结合细胞结合量结果，最可能的分子缺陷是","options":["脂蛋白脂肪酶缺陷，乳糜微粒中甘油三酯水解发生障碍","载脂蛋白 C-Ⅱ 缺陷，乳糜微粒不能激活脂蛋白脂肪酶","LDL 受体缺陷，细胞摄取 LDL 减少使血浆清除受阻","载脂蛋白 A-Ⅰ 缺陷，HDL 合成障碍使胆固醇逆向转运减弱","胆固醇 7α-羟化酶活性过高，胆固醇转变为胆汁酸明显增多"],"answer":2,"explain":"C 对：患者总胆固醇与 LDL-胆固醇极高而甘油三酯正常，标记的 LDL 与成纤维细胞结合量只有一半，说明细胞表面识别 LDL 的受体数量不足，LDL 不能被摄取降解而在血浆蓄积。A 错：脂蛋白脂肪酶缺陷时血浆甘油三酯极高，与本例甘油三酯正常不符。B 错：载脂蛋白 C-Ⅱ 缺陷同样以甘油三酯显著升高为特征，属乳糜微粒代谢障碍。D 错：载脂蛋白 A-Ⅰ 缺陷主要使 HDL 减少，不会造成 LDL-胆固醇如此升高。E 错：7α-羟化酶活性过高会加速胆固醇消耗，血浆胆固醇应下降而不是升高。","type":"A1","group":"c14-02","kind":"mechanism","chs":[12,4,16],"vignette":"一名 46 岁男性因双侧跟腱增粗并出现黄色瘤就诊，角膜边缘可见一圈灰白色环。血脂检查：总胆固醇 13.6 mmol/L，LDL-胆固醇 11.2 mmol/L，甘油三酯 1.4 mmol/L，HDL-胆固醇 0.8 mmol/L。取皮肤成纤维细胞培养，以 ¹²⁵I 标记的 LDL 孵育，细胞结合量仅为正常人的一半，而细胞内胆固醇酯的合成速率与正常人接近。给予他汀类药物 6 周后复查，血浆 LDL-胆固醇降至 7.9 mmol/L；肝穿标本同时显示，HMG-CoA 还原酶的 mRNA 比用药前升高 3.1 倍。医生解释，他的细胞表面识别 LDL 的受体数量不足，血浆中的胆固醇因此不能被及时清除。","vignette_title":"情景 2：从一张血脂报告到细胞表面的受体","gidx":1,"gn":5,"anchor":"细胞结合量仅为正常人的一半"},{"id":"gc14-02-3","ch":12,"part":3,"tag":"机制","stem":"给予他汀类药物 6 周后该患者血浆 LDL-胆固醇下降，其作用机制是","options":["激活脂蛋白脂肪酶，加速乳糜微粒中甘油三酯的水解","抑制卵磷脂胆固醇酰基转移酶，使 HDL 的生成减少","抑制胆固醇 7α-羟化酶，使胆汁酸的生成明显减少","抑制 HMG-CoA 还原酶，使肝细胞上调 LDL 受体","抑制 HMG-CoA 合酶，使胆固醇合成的原料大量减少"],"answer":3,"explain":"D 对：他汀抑制胆固醇合成的限速酶 HMG-CoA 还原酶，肝细胞内胆固醇减少，LDL 受体表达随之上调，血浆 LDL 被摄取降解增多，LDL-胆固醇因而下降。A 错：脂蛋白脂肪酶水解的是乳糜微粒与极低密度脂蛋白中的甘油三酯，本例以 LDL-胆固醇升高为主。B 错：抑制卵磷脂胆固醇酰基转移酶会削弱胆固醇逆向转运，无助于降低 LDL。C 错：抑制 7α-羟化酶使胆固醇转变为胆汁酸减少，反而不利于清除。E 错：胆固醇合成的限速酶是 HMG-CoA 还原酶，它还原的是 HMG-CoA，抑制上游的 HMG-CoA 合酶并非他汀的作用点。","type":"A1","group":"c14-02","kind":"mechanism","chs":[12,4,16],"vignette":"一名 46 岁男性因双侧跟腱增粗并出现黄色瘤就诊，角膜边缘可见一圈灰白色环。血脂检查：总胆固醇 13.6 mmol/L，LDL-胆固醇 11.2 mmol/L，甘油三酯 1.4 mmol/L，HDL-胆固醇 0.8 mmol/L。取皮肤成纤维细胞培养，以 ¹²⁵I 标记的 LDL 孵育，细胞结合量仅为正常人的一半，而细胞内胆固醇酯的合成速率与正常人接近。给予他汀类药物 6 周后复查，血浆 LDL-胆固醇降至 7.9 mmol/L；肝穿标本同时显示，HMG-CoA 还原酶的 mRNA 比用药前升高 3.1 倍。医生解释，他的细胞表面识别 LDL 的受体数量不足，血浆中的胆固醇因此不能被及时清除。","vignette_title":"情景 2：从一张血脂报告到细胞表面的受体","gidx":3,"gn":5,"anchor":"给予他汀类药物 6 周后复查"},{"id":"gc14-02-5","ch":12,"part":3,"tag":"判读","stem":"关于该患者的脂蛋白运输与胆固醇稳态，下列判断正确的是（X 型多选）","options":["患者 HDL-胆固醇偏低，胆固醇的逆向转运能力减弱","胆固醇在体内可转变为胆汁酸、类固醇激素与维生素 D₃","胆固醇可被彻底氧化为二氧化碳和水，为机体提供能量","载脂蛋白 C-Ⅱ 激活脂蛋白脂肪酶，载脂蛋白 A-Ⅰ 激活 LCAT","膜中胆固醇含量增高时，对膜流动性的影响具有双向调节作用"],"answer":[0,1,3,4],"explain":"答案 ABDE。A 对：情景给出 HDL-胆固醇仅 0.8 mmol/L，参与胆固醇逆向转运的 HDL 不足，外周胆固醇运回肝的能力下降。B 对：胆固醇在体内不能彻底氧化，其主要去路是转变为胆汁酸、类固醇激素与维生素 D₃，以及构成生物膜。D 对：载脂蛋白既是脂质的运载与结构成分，又调节酶活性并介导受体识别，其中载脂蛋白 C-Ⅱ 激活脂蛋白脂肪酶、载脂蛋白 A-Ⅰ 激活卵磷脂胆固醇酰基转移酶。E 对：膜中胆固醇含量增高对膜流动性有双向调节作用，在相变温度以上降低流动性、在相变温度以下防止膜脂烃链有序排列。C 错：人体不能把胆固醇彻底氧化为二氧化碳和水，它只能转变为其他类固醇物质，把胆固醇当成供能物质是常见误解。","type":"X","group":"c14-02","kind":"mechanism","chs":[12,4,16],"vignette":"一名 46 岁男性因双侧跟腱增粗并出现黄色瘤就诊，角膜边缘可见一圈灰白色环。血脂检查：总胆固醇 13.6 mmol/L，LDL-胆固醇 11.2 mmol/L，甘油三酯 1.4 mmol/L，HDL-胆固醇 0.8 mmol/L。取皮肤成纤维细胞培养，以 ¹²⁵I 标记的 LDL 孵育，细胞结合量仅为正常人的一半，而细胞内胆固醇酯的合成速率与正常人接近。给予他汀类药物 6 周后复查，血浆 LDL-胆固醇降至 7.9 mmol/L；肝穿标本同时显示，HMG-CoA 还原酶的 mRNA 比用药前升高 3.1 倍。医生解释，他的细胞表面识别 LDL 的受体数量不足，血浆中的胆固醇因此不能被及时清除。","vignette_title":"情景 2：从一张血脂报告到细胞表面的受体","gidx":5,"gn":5,"anchor":"角膜边缘可见一圈灰白色环"},{"id":"gc25-03-1","ch":12,"part":3,"tag":"判读","stem":"该患者心肌细胞每分子软脂酸经 7 轮 β 氧化生成 7 分子 FADH₂ 与 7 分子 NADH，按 1 NADH≈2.5 ATP、1 FADH₂≈1.5 ATP 计算，这些还原当量经呼吸链氧化生成的 ATP 约为","options":["21 分子","28 分子","35 分子","42 分子","49 分子"],"answer":1,"explain":"B 对：7 分子 FADH₂ 经复合体Ⅱ进入呼吸链，按 1.5 计为 10.5；7 分子 NADH 经复合体Ⅰ进入，按 2.5 计为 17.5；两者相加为 28 分子 ATP。A 把两种还原当量都按 1.5 计算；C 把两种都按 2.5 计算，忽略了 FADH₂ 从复合体Ⅱ进入；D 相当于把两种都按 3 计算的旧口径结果；E 的数值没有对应的计算依据。","type":"A1","group":"c25-03","kind":"mechanism","chs":[12,13,16],"vignette":"一名 2 型糖尿病患者因胰岛素用量偏大，于凌晨出现心悸、大汗、意识模糊与肢体抽搐。急查：血糖 1.9 mmol/L，血乳酸 1.8 mmol/L，血浆游离脂肪酸 0.9 mmol/L，血酮体 0.2 mmol/L。静脉推注葡萄糖 5 分钟后意识恢复，心电图与心肌酶始终正常。医生分析：血糖下降时胰高血糖素与肾上腺素升高、胰岛素下降，脂肪细胞中激素敏感性甘油三酯脂肪酶被磷酸化而激活，脂肪动员加强，血浆游离脂肪酸升高到平时的两倍多；心肌细胞摄取的脂肪酸在胞质活化为脂酰辅酶A 后，经肉碱转运进入线粒体，经 7 轮 β 氧化生成 7 分子 FADH₂ 与 7 分子 NADH。脑组织的糖原储备很少，其能量几乎全靠血糖，而脂肪酸不能通过血脑屏障；成熟红细胞没有线粒体。","vignette_title":"情景 3：低血糖先打倒大脑，心脏却还在跳","gidx":1,"gn":5,"anchor":"经肉碱转运进入线粒体"},{"id":"gc25-03-5","ch":12,"part":3,"tag":"判读","stem":"关于该患者体内脂质的动员与在不同组织中的利用，下列判断正确的是（X 型多选）","options":["脂肪动员释放的甘油经血液运至肝后可作为糖异生的原料","脑组织在血糖降低时可直接摄取血浆游离脂肪酸氧化供能","脂肪酸在胞质活化生成的脂酰辅酶A 可自由穿过线粒体内膜","心肌细胞可利用脂肪酸 β 氧化供能，与肉碱转运系统活跃有关","血浆游离脂肪酸升高来自脂肪组织中甘油三酯水解的加强"],"answer":[0,3,4],"explain":"答案 ADE。A 对：脂肪细胞缺乏甘油激酶，动员释放的甘油经血液运至肝，在肝内经甘油激酶磷酸化后进入糖代谢，是糖异生的原料之一。D 对：心肌富含肉碱脂酰转移酶系统，能把胞质活化的脂酰辅酶A 转运入线粒体进行 β 氧化。E 对：游离脂肪酸升高源于脂肪组织中甘油三酯被激素敏感性甘油三酯脂肪酶水解。B 错：脂肪酸不能通过血脑屏障。C 错：脂酰辅酶A 不能自由穿膜，须经肉碱转运。","type":"X","group":"c25-03","kind":"mechanism","chs":[12,13,16],"vignette":"一名 2 型糖尿病患者因胰岛素用量偏大，于凌晨出现心悸、大汗、意识模糊与肢体抽搐。急查：血糖 1.9 mmol/L，血乳酸 1.8 mmol/L，血浆游离脂肪酸 0.9 mmol/L，血酮体 0.2 mmol/L。静脉推注葡萄糖 5 分钟后意识恢复，心电图与心肌酶始终正常。医生分析：血糖下降时胰高血糖素与肾上腺素升高、胰岛素下降，脂肪细胞中激素敏感性甘油三酯脂肪酶被磷酸化而激活，脂肪动员加强，血浆游离脂肪酸升高到平时的两倍多；心肌细胞摄取的脂肪酸在胞质活化为脂酰辅酶A 后，经肉碱转运进入线粒体，经 7 轮 β 氧化生成 7 分子 FADH₂ 与 7 分子 NADH。脑组织的糖原储备很少，其能量几乎全靠血糖，而脂肪酸不能通过血脑屏障；成熟红细胞没有线粒体。","vignette_title":"情景 3：低血糖先打倒大脑，心脏却还在跳","gidx":5,"gn":5,"anchor":"激素敏感性甘油三酯脂肪酶被磷酸化而激活"},{"id":"gc3-03-1","ch":12,"part":3,"tag":"机制","stem":"该患者血浆游离脂肪酸升至 1.8 mmol/L，其直接机制是","options":["脂肪细胞内激素敏感性甘油三酯脂肪酶活性升高","脂蛋白脂肪酶活性升高，血浆甘油三酯水解加强","脂肪细胞甘油激酶活性升高，甘油被重新利用","乙酰辅酶A羧化酶活性升高，脂肪酸合成增强","肉碱脂酰转移酶活性下降，脂肪酸氧化受阻"],"answer":0,"explain":"A 对：胰岛素绝对缺乏使脂肪细胞内激素敏感性甘油三酯脂肪酶活性升高（胰岛素对该酶本为抑制性调节），脂肪动员加强，血浆游离脂肪酸随之升高——这也解释了补胰岛素后 6 小时内游离脂肪酸迅速回落到 0.6 mmol/L。B 错：脂蛋白脂肪酶水解的是血浆脂蛋白中的甘油三酯，与细胞内脂肪动员不是同一环节。C 错：脂肪细胞缺乏甘油激酶，甘油不能被再利用，只能运至肝、肾。D 错：胰岛素缺乏时脂肪酸合成受抑，乙酰辅酶A羧化酶活性下降而非升高。E 错：酮症时肉碱脂酰转移酶活性是升高的，β 氧化反而加强。","type":"A1","group":"c3-03","kind":"mechanism","chs":[12,16,11],"vignette":"一名 1 型糖尿病患者中断胰岛素治疗 12 小时后入院，呼吸深快（28 次/分），呼气有烂苹果味，皮肤干燥。化验：血糖 22 mmol/L，血浆游离脂肪酸 1.8 mmol/L（正常 0.4～0.9），血酮 5.2 mmol/L，动脉血 pH 7.22、HCO₃⁻ 8 mmol/L。治疗观察：补液并静脉滴注小剂量胰岛素后 6 小时，血糖降至 11 mmol/L，血浆游离脂肪酸降至 0.6 mmol/L，血酮降至 1.8 mmol/L，pH 回升至 7.31。实验室观察两项：① 取患者肝组织匀浆，加入等量 ¹⁴C 标记的乙酰乙酸孵育 30 分钟，放射性几乎全部保留在乙酰乙酸中；同法处理的骨骼肌匀浆中，大部分放射性转移到其他产物。② 把 ¹⁴C 标记的脂肪酸加到患者肌组织匀浆中，标记物可在分离出的线粒体组分中被氧化；若先用肉碱转运体抑制剂处理，标记物便停留在胞质组分中。","vignette_title":"情景 3：血糖 22 mmol/L，血酮 5.2 mmol/L","gidx":1,"gn":5,"anchor":"血浆游离脂肪酸 1.8 mmol/L"},{"id":"gc3-03-2","ch":12,"part":3,"tag":"机制","stem":"该患者肌组织中脂肪酸进入线粒体进行 β 氧化，必须先","options":["在线粒体活化为脂酰辅酶A，再直接进入基质","在胞质水解为游离脂肪酸，再扩散进入线粒体","经柠檬酸-丙酮酸循环，转运进入线粒体基质","与肉碱结合后，经线粒体外膜自由扩散进入基质","在胞质活化为脂酰辅酶A，再经肉碱转运进入线粒体"],"answer":4,"explain":"E 对：脂肪酸在胞质由脂酰辅酶A合成酶活化为脂酰辅酶A，再与肉碱结合成脂酰肉碱，经线粒体内膜上的肉碱转运体进入基质进行 β 氧化——观察 ② 中抑制剂处理使标记脂肪酸停留在胞质组分，正是该转运环节被阻断的结果。A 错：活化发生在胞质，线粒体内膜也不允许脂酰辅酶A直接通过。B、D 错：转运依赖内膜上的转运体，不是自由扩散。C 错：柠檬酸-丙酮酸循环转运的是乙酰辅酶A，用于脂肪酸合成，与脂肪酸进入线粒体氧化无关。","type":"A1","group":"c3-03","kind":"mechanism","chs":[12,16,11],"vignette":"一名 1 型糖尿病患者中断胰岛素治疗 12 小时后入院，呼吸深快（28 次/分），呼气有烂苹果味，皮肤干燥。化验：血糖 22 mmol/L，血浆游离脂肪酸 1.8 mmol/L（正常 0.4～0.9），血酮 5.2 mmol/L，动脉血 pH 7.22、HCO₃⁻ 8 mmol/L。治疗观察：补液并静脉滴注小剂量胰岛素后 6 小时，血糖降至 11 mmol/L，血浆游离脂肪酸降至 0.6 mmol/L，血酮降至 1.8 mmol/L，pH 回升至 7.31。实验室观察两项：① 取患者肝组织匀浆，加入等量 ¹⁴C 标记的乙酰乙酸孵育 30 分钟，放射性几乎全部保留在乙酰乙酸中；同法处理的骨骼肌匀浆中，大部分放射性转移到其他产物。② 把 ¹⁴C 标记的脂肪酸加到患者肌组织匀浆中，标记物可在分离出的线粒体组分中被氧化；若先用肉碱转运体抑制剂处理，标记物便停留在胞质组分中。","vignette_title":"情景 3：血糖 22 mmol/L，血酮 5.2 mmol/L","gidx":2,"gn":5,"anchor":"肉碱转运体抑制剂处理"},{"id":"gc3-03-4","ch":12,"part":3,"tag":"判读","stem":"肝匀浆与 ¹⁴C 标记的乙酰乙酸孵育后放射性几乎全部保留，而骨骼肌匀浆中大部分转移，说明","options":["肝细胞缺乏利用乙酰乙酸的酶，酮体只能肝外利用","骨骼肌匀浆中乙酰乙酸被直接氧化为二氧化碳与水","肝细胞缺乏肉碱脂酰转移酶，脂肪酸不能被氧化","乙酰乙酸在肝内被大量转化为葡萄糖后释放入血","骨骼肌缺乏合成酮体所需的酶类，只能被动摄取酮体"],"answer":0,"explain":"A 对：肝细胞缺乏琥珀酰CoA转硫酶，不能把乙酰乙酸重新转变为乙酰乙酰辅酶A，故只能生成酮体、不能利用酮体；骨骼肌等肝外组织具备该酶系，能把乙酰乙酸转回乙酰乙酰辅酶A并裂解为两分子乙酰辅酶A进入三羧酸循环——观察 ① 的差异正对应这一点。B 错：肝外组织利用乙酰乙酸要先经转硫酶转变为乙酰乙酰辅酶A，不是直接氧化。C 错：肝内存在肉碱脂酰转移酶，能进行 β 氧化。D 错：肝不能把乙酰乙酸异生为葡萄糖。E 错：肌组织不合成酮体只是现象的一面，观察 ① 的关键差异在于能否\"利用\"酮体。","type":"A1","group":"c3-03","kind":"mechanism","chs":[12,16,11],"vignette":"一名 1 型糖尿病患者中断胰岛素治疗 12 小时后入院，呼吸深快（28 次/分），呼气有烂苹果味，皮肤干燥。化验：血糖 22 mmol/L，血浆游离脂肪酸 1.8 mmol/L（正常 0.4～0.9），血酮 5.2 mmol/L，动脉血 pH 7.22、HCO₃⁻ 8 mmol/L。治疗观察：补液并静脉滴注小剂量胰岛素后 6 小时，血糖降至 11 mmol/L，血浆游离脂肪酸降至 0.6 mmol/L，血酮降至 1.8 mmol/L，pH 回升至 7.31。实验室观察两项：① 取患者肝组织匀浆，加入等量 ¹⁴C 标记的乙酰乙酸孵育 30 分钟，放射性几乎全部保留在乙酰乙酸中；同法处理的骨骼肌匀浆中，大部分放射性转移到其他产物。② 把 ¹⁴C 标记的脂肪酸加到患者肌组织匀浆中，标记物可在分离出的线粒体组分中被氧化；若先用肉碱转运体抑制剂处理，标记物便停留在胞质组分中。","vignette_title":"情景 3：血糖 22 mmol/L，血酮 5.2 mmol/L","gidx":4,"gn":5,"anchor":"放射性几乎全部保留在乙酰乙酸中"},{"id":"gc3-04-5","ch":12,"part":3,"tag":"判读","stem":"以软脂酰肉碱为底物时耗氧同样可被 ADP 刺激，说明","options":["肉碱是呼吸链的组成成分，可直接传递电子","软脂酰肉碱可直接与氧结合并生成水","脂肪酸在胞质中即可完成β氧化并消耗氧","β氧化只生成乙酰辅酶A，不产生还原当量","β氧化在线粒体内生成 FADH₂ 与 NADH"],"answer":4,"explain":"E 对：软脂酰肉碱进入线粒体基质后进行β氧化，每轮从脂酰辅酶A上切下 2 个碳生成 1 分子乙酰辅酶A，同时产生 FADH₂ 与 NADH，还原当量进入呼吸链使耗氧增加，并可被 ADP 刺激。C 错：β氧化在线粒体基质中进行，胞质只完成脂肪酸的活化。A 错：肉碱是把脂酰基带入线粒体的转运载体，不是呼吸链组分。D 错：β氧化除生成乙酰辅酶A外还产生 FADH₂ 与 NADH。B 错：软脂酰肉碱不能直接与氧结合，电子必须经呼吸链传递。","type":"A1","group":"c3-04","kind":"experiment","chs":[13,11,12],"vignette":"深夜的实验台上，研究生用离体大鼠肝线粒体悬液测耗氧量：体系含 ADP、Pi 与 Mg²⁺，25℃ 持续通氧，用氧电极记录。以谷氨酸加苹果酸为底物，加入 ADP 后耗氧速率由 12 升到 42（nmol O·min⁻¹·mg⁻¹），P/O 比约为 2.5；改用琥珀酸为底物的相同条件下，P/O 比约为 1.5。加入 2,4-二硝基苯酚后耗氧速率进一步升高到 78，而体系中 ATP 生成量反而下降到接近零；换一管加入抗霉素A，耗氧迅速降至 4；另一管加入寡霉素，耗氧降至 9，而跨膜质子梯度反而增大。再以丙酮酸加苹果酸为底物，加入 ADP 后耗氧速率由 10 升到 38；以软脂酰肉碱为底物时，耗氧同样可被 ADP 刺激。","vignette_title":"情景 4：氧电极上的一次药物滴定","gidx":5,"gn":6,"anchor":"以软脂酰肉碱为底物时"},{"id":"gc8-01-4","ch":12,"part":3,"tag":"判读","stem":"该患者血游离脂肪酸由 0.4 升至 1.8，其直接机制是","options":["PKA 磷酸化抑制激素敏感性甘油三酯脂肪酶，脂肪动员明显减弱","PKA 磷酸化激活脂蛋白脂肪酶，血浆甘油三酯水解增强","PKA 磷酸化激活激素敏感性甘油三酯脂肪酶，脂肪动员增强","胰岛素升高激活激素敏感性甘油三酯脂肪酶，脂肪动员增强","肾上腺素直接进入脂肪细胞，与胞内受体结合后促进脂肪动员"],"answer":2,"explain":"C 对：PKA 使脂肪细胞内激素敏感性甘油三酯脂肪酶磷酸化而激活，脂肪动员增强，脂肪酸释放入血，与情景数据一致。B 错在脂蛋白脂肪酶水解的是血浆脂蛋白中的甘油三酯，与脂肪细胞内脂肪动员不是同一环节。D 错在情景中胰岛素是降低的，写反了方向。A 错在磷酸化对该酶是激活而不是抑制。E 错在肾上腺素是水溶性激素，经膜受体起作用，不能进入细胞与胞内受体结合。","type":"A1","group":"c8-01","kind":"mechanism","chs":[25,16,11,12],"vignette":"一名青年因车祸大出血急诊入院。血浆肾上腺素升至正常的 12 倍，胰高血糖素升至 3 倍，胰岛素降至正常的四分之一；血糖 11.2 mmol/L，血游离脂肪酸由 0.4 升至 1.8 mmol/L，血酮体 1.1 mmol/L，尿氮排出明显增多。肝细胞内 cAMP 由 0.5 升至 4.0 μmol/L，PKA 被活化；果糖-2,6-二磷酸由 12 降至 2 nmol/g，糖原磷酸化酶活性升至 90%，糖原合酶活性降至 10%。","vignette_title":"情景 1：一个信号，同时开三条流水线","gidx":4,"gn":6,"anchor":"血游离脂肪酸由 0.4 升至 1.8"},{"id":"gc8-02-3","ch":12,"part":3,"tag":"机制","stem":"72 小时血酮体由 0.1 升至 5.6 mmol/L，其机制是","options":["肝内酮体利用酶活性升高，酮体生成与利用同时增强","脂肪酸直接转变为酮体，由肌肉摄取氧化后释放入血","脂肪动员增强，肝内乙酰辅酶A增多，酮体生成超过肝外利用","胰岛素升高促进酮体生成，肝外组织利用酮体能力下降","肝细胞缺乏琥珀酰辅酶A转硫酶，故酮体在肝内大量堆积"],"answer":2,"explain":"C 对：长期禁食时脂肪动员增强，肝内脂肪酸 β 氧化生成大量乙酰辅酶A，酮体生成速度超过肝外组织利用能力，血酮体随之升高。A 错在肝内缺乏利用酮体的酶，不存在生成与利用同步增强。C 描述的是酮体肝内生成、肝外利用的原因，不能解释血中堆积。B 错在酮体在肝内生成，不是肌肉生成后释放入血。E 方向写反，禁食时胰岛素是降低的，胰岛素升高会抑制脂肪动员而减少酮体生成。","type":"A1","group":"c8-02","kind":"mechanism","chs":[16,12,11],"vignette":"一名健康志愿者参加 72 小时禁食试验，期间只饮水。禁食 12 小时血糖 4.6 mmol/L，24 小时 4.1 mmol/L，72 小时 3.8 mmol/L，肝糖原由 70 g 降至 24 小时的 8 g。血游离脂肪酸由 0.4 升至 1.9 mmol/L，血酮体由 0.1 升至 5.6 mmol/L，脑组织摄取的酮体约占其耗能的 60%。肝内磷酸烯醇式丙酮酸羧激酶活性升高 3 倍，其 mRNA 含量同步升高 4 倍。尿氮排出在 24 小时达高峰，72 小时比 24 小时减少约 40%。试验结束后口服 100 g 葡萄糖，30 分钟后血浆胰岛素由 6 升至 42 mU/L，血糖 6.8 mmol/L。","vignette_title":"情景 2：禁食 72 小时里，脑换了一种燃料","gidx":3,"gn":6,"anchor":"血酮体由 0.1 升至 5.6"},{"id":"gc8-03-4","ch":12,"part":3,"tag":"机制","stem":"运动中肌细胞脂肪酸 β 氧化持续进行，其必要条件是","options":["β 氧化所需的 NAD⁺ 由磷酸戊糖途径提供，与呼吸链无关","β 氧化每轮生成 NADPH，供脂肪酸合成与抗氧化使用","脂肪酸在胞质活化后直接穿过线粒体内膜，无需肉碱参与","β 氧化生成的 NADH 在胞质中还原丙酮酸，使乳酸持续生成","β 氧化生成的 NADH 经呼吸链氧化，使 NAD⁺ 得以持续再生"],"answer":4,"explain":"E 对：β 氧化每轮生成的 NADH 与 FADH₂ 必须经呼吸链氧化，才能再生 NAD⁺ 与 FAD 使 β 氧化继续，这条链与耗氧量增至 4 倍是同一过程的两个侧面。D 错在 β 氧化在线粒体内进行，其还原当量交给呼吸链而不是还原丙酮酸。C 错在脂酰辅酶A需经肉碱转运才能进入线粒体。B 错在 β 氧化生成的是 NADH 与 FADH₂，不是 NADPH。A 错在 NAD⁺ 由呼吸链氧化 NADH 再生，与磷酸戊糖途径无关。","type":"A1","group":"c8-03","kind":"mechanism","chs":[13,12,11],"vignette":"一名长跑运动员在 2 小时耐力运动末段接受股四头肌活检。肌内 ATP 由 24 降至 15 mmol/kg，ADP 与 AMP 分别升高 2 倍与 5 倍，柠檬酸由 1.2 降至 0.4 mmol/kg；PFK-1 活性升高约 3 倍，丙酮酸生成速率加快，肌糖原由 110 降至 46 mmol/kg。血游离脂肪酸由 0.3 升至 1.5 mmol/L，血乳酸仅轻度升高。运动全程耗氧量约为静息时的 4 倍，血糖维持在 4.8 mmol/L。","vignette_title":"情景 3：能量不够时，线粒体自己踩刹车与油门","gidx":4,"gn":5,"anchor":"血游离脂肪酸由 0.3 升至 1.5"},{"ch":12,"part":3,"tag":"脂肪分解","stem":"关于甘油三酯（脂肪）分解代谢的叙述，正确的是？","options":["甘油三酯主要在肝细胞中被动员，限速酶是脂蛋白脂肪酶（LPL）","脂肪酸在细胞质中活化后可直接穿过线粒体内膜进入线粒体氧化","脂肪酸β氧化每轮生成1分子乙酰CoA和1分子NADPH","脂肪动员的关键酶是甘油三酯脂肪酶，胰岛素可激活其活性","脂肪动员由激素敏感性甘油三酯脂肪酶催化，脂肪酸在胞质活化为脂酰CoA后经肉碱转运入线粒体进行β氧化"],"answer":4,"explain":"脂肪动员的限速酶是脂肪细胞中的激素敏感性甘油三酯脂肪酶（肾上腺素、胰高血糖素激活，胰岛素抑制）；脂酰CoA须经肉碱转运入线粒体。","type":"A1","id":"c12-bcd12286"},{"ch":12,"part":3,"tag":"脂肪合成","stem":"关于脂肪酸与脂肪合成的叙述，正确的是？","options":["脂肪酸合成在细胞质中进行，限速酶是乙酰CoA羧化酶，所需NADPH主要来自磷酸戊糖途径","脂肪酸合成的限速酶是脂肪酸合酶复合体，其催化的还原反应由FADH₂供氢","脂肪酸合成在线粒体中进行，以乙酰CoA为原料，不需要消耗ATP","乙酰CoA羧化酶催化乙酰CoA与草酰乙酸缩合生成柠檬酸","脂肪合成所需的NADPH主要来自三羧酸循环"],"answer":0,"explain":"脂肪酸合成在胞质，乙酰CoA羧化酶为限速酶（柠檬酸激活、软脂酰CoA抑制），还原力由NADPH提供，主要来自磷酸戊糖途径。","type":"A1","id":"c12-4304953b"},{"ch":12,"part":3,"tag":"酮体","stem":"关于酮体（ketone bodies）代谢的叙述，正确的是？","options":["酮体包括乙酰乙酸、β-羟丁酸和丙酮，其中丙酮是主要的供能形式","酮体在肝细胞线粒体中由乙酰CoA生成，肝细胞缺乏琥珀酰CoA转硫酶，故酮体须运至肝外组织（脑、心、肾等）氧化利用","酮体在肝内生成并在肝内被氧化利用","酮体是脂肪酸合成的中间产物，生成过多即为酮症","糖尿病酮症主要由酮体利用障碍引起，与脂肪动员增强无关"],"answer":1,"explain":"酮体属“肝内生成、肝外利用”，乙酰乙酸和β-羟丁酸是主要供能形式；饥饿或糖尿病时脂肪动员增强致酮体生成过多。","type":"A1","id":"c12-6b093c3b"},{"ch":12,"part":3,"tag":"胆固醇合成","stem":"关于胆固醇代谢的叙述，正确的是？","options":["胆固醇合成的限速酶是HMG-CoA合酶，主要在线粒体中进行","胆固醇合成以乙酰CoA为原料，过程中不消耗ATP与NADPH","胆固醇在体内可彻底氧化为CO₂和H₂O并释放能量","胆固醇合成主要发生在脑组织，其限速酶活性不受食物胆固醇影响","胆固醇合成的限速酶是HMG-CoA还原酶，主要在胞质与内质网中进行，受细胞内胆固醇的反馈抑制，胰岛素可诱导其活性"],"answer":4,"explain":"HMG-CoA还原酶是胆固醇合成的限速酶，受胆固醇反馈抑制、胰高血糖素抑制、胰岛素诱导；胆固醇在体内不能彻底氧化，可转变为胆汁酸、类固醇激素等。","type":"A1","id":"c12-ae87994d"},{"ch":12,"part":3,"tag":"血浆脂蛋白","stem":"关于血浆脂蛋白（plasma lipoprotein）的叙述，正确的是？","options":["密度由大到小依次为CM、VLDL、LDL、HDL","CM主要转运内源性甘油三酯，VLDL主要转运胆固醇","超速离心法可将血浆脂蛋白分为CM、VLDL、LDL和HDL；HDL参与胆固醇逆向转运，故被视为“好”脂蛋白","LDL将外周组织的胆固醇转运回肝，故被视为“好”脂蛋白","血浆脂蛋白中的载脂蛋白仅起结构作用，不参与酶活性调节和受体识别"],"answer":2,"explain":"CM转运外源性甘油三酯、VLDL转运内源性甘油三酯、LDL将胆固醇运至外周、HDL参与胆固醇逆向转运；载脂蛋白还激活酶并介导受体识别。","type":"A1","id":"c12-97405a30"},{"ch":12,"part":3,"tag":"高胆固醇血症","stem":"家族性高胆固醇血症（FH）患者血浆LDL-胆固醇显著升高，其最常见的分子机制是？","options":["脂蛋白脂肪酶（LPL）活性增高","载脂蛋白AⅠ（ApoAⅠ）合成增多","HMG-CoA还原酶完全缺失","LDL受体（LDLR）基因缺陷，LDL不能被细胞摄取降解，血浆LDL-胆固醇升高","HDL受体缺陷导致胆固醇逆向转运过度"],"answer":3,"explain":"LDL受体缺陷使受体介导的LDL摄取减少，血浆LDL升高并易在动脉壁沉积；LPL缺陷主要引起乳糜微粒血症、甘油三酯升高。","type":"A1","id":"c12-d3e2ba09"},{"ch":12,"part":3,"tag":"甘油磷脂","stem":"关于甘油磷脂合成的叙述，正确的是？","options":["甘油磷脂的极性头和疏水尾均直接来自脂肪酸，合成不需活化","合成时胆碱、乙醇胺需与CTP反应生成CDP-胆碱、CDP-乙醇胺；磷脂酸需与CTP反应生成CDP-二酰甘油后，才能与肌醇等反应生成相应磷脂","胆碱活化为CDP-胆碱时由UTP提供能量","甘油磷脂合成的骨架是胆固醇，与磷脂酸无关","甘油磷脂合成只发生在细胞核内，其产物不参与生物膜的构建"],"answer":1,"explain":"胆碱、乙醇胺经CTP活化为CDP-胆碱、CDP-乙醇胺后与二酰甘油反应；磷脂酸经CTP活化为CDP-二酰甘油后与肌醇等反应，活化均由CTP供能。","type":"A1","id":"c12-0f8d700a"},{"ch":12,"part":3,"tag":"脂代谢紊乱","stem":"关于酮症、脂肪肝与动脉粥样硬化发生机制的叙述，正确的是？","options":["三者均由糖代谢障碍直接引起，与脂质代谢紊乱无关","酮症由酮体生成不足引起","动脉粥样硬化的发生与血浆HDL水平升高密切相关","脂肪肝患者肝内蓄积的主要是胆固醇酯","脂肪肝与肝内甘油三酯合成过多或VLDL合成、输出障碍（如磷脂或载脂蛋白不足）有关；动脉粥样硬化与血浆LDL升高及LDL氧化修饰密切相关"],"answer":4,"explain":"脂肪肝是肝内甘油三酯蓄积（合成过多或VLDL输出障碍）；动脉粥样硬化与LDL升高及氧化修饰相关；酮症由酮体生成过多引起。","type":"A1","id":"c12-b25e7c3a"},{"ch":12,"part":3,"tag":"β-氧化与能量计算","stem":"1分子软脂酸（16碳）彻底氧化分解，按现行教材口径（1 NADH≈2.5 ATP、1 FADH₂≈1.5 ATP、1乙酰CoA经三羧酸循环≈10 ATP）计算，净生成ATP约为？","options":["96","100","106","129","131"],"answer":2,"explain":"软脂酸活化消耗2 ATP；经7轮β-氧化生成7 FADH₂、7 NADH和8乙酰CoA：8×10＋7×1.5＋7×2.5－2＝106（ATP）。","type":"A1","id":"c12-49e3decf"},{"ch":12,"part":3,"tag":"脂肪酸合成与氧化的差别","stem":"关于脂肪酸合成与脂肪酸β-氧化差别的叙述，正确的是？","options":["两者均在细胞质中进行，且都以脂酰CoA为直接底物","两者由同一套酶系催化，只是反应方向相反","合成时以FAD和NAD⁺为供氢体，β-氧化时以NADPH为供氢体","合成在细胞质中进行、以丙二酰CoA为原料、由脂肪酸合酶系催化、还原力为NADPH、自甲基端向羧基端延长；β-氧化在线粒体中进行、以脂酰CoA为底物、自羧基端每次切下2个碳并生成FADH₂和NADH","β-氧化过程中脂肪酸碳链每次延长2个碳原子"],"answer":3,"explain":"合成在胞质、用丙二酰CoA和NADPH、由脂肪酸合酶系催化、自甲基端向羧基端延长；β-氧化在线粒体、以脂酰CoA为底物、自羧基端每轮切下2个碳并产生还原当量。","type":"A1","id":"c12-b619ebd0"},{"ch":12,"part":3,"tag":"柠檬酸-丙酮酸循环","stem":"脂肪酸合成所需的乙酰CoA主要在线粒体中产生，但不能直接穿过线粒体内膜。它进入细胞质参与脂肪酸合成的途径是？","options":["乙酰CoA先与草酰乙酸缩合成柠檬酸，经线粒体内膜的柠檬酸转运体进入细胞质，再由ATP-柠檬酸裂解酶裂解为乙酰CoA和草酰乙酸（柠檬酸-丙酮酸循环）","乙酰CoA与肉碱结合后经肉碱转运体直接运入细胞质","乙酰CoA水解为乙酸后自由扩散出线粒体","乙酰CoA经核孔进入细胞质","乙酰CoA经线粒体内膜上的ATP/ADP载体直接转运出线粒体"],"answer":0,"explain":"线粒体内乙酰CoA与草酰乙酸缩合为柠檬酸后经转运体出线粒体，在胞质由ATP-柠檬酸裂解酶裂解释出乙酰CoA，用于脂肪酸合成。","type":"A1","id":"c12-ab2ac240"},{"ch":12,"part":3,"tag":"甘油的代谢","stem":"关于脂肪动员所释放甘油代谢的叙述，正确的是？","options":["甘油可直接经糖异生转变为葡萄糖，不需要酶的催化","甘油在甘油激酶催化下磷酸化为3-磷酸甘油，再脱氢生成磷酸二羟丙酮进入糖酵解或糖异生；脂肪细胞缺乏甘油激酶，故其动员产生的甘油须经血液运至肝利用","甘油在脂肪细胞内直接再酯化为脂肪，不进入血液","甘油经β-氧化分解生成乙酰CoA供能","甘油在肝内转变为酮体，是饥饿时脑组织的主要能源"],"answer":1,"explain":"甘油须先由甘油激酶磷酸化为3-磷酸甘油，再脱氢成磷酸二羟丙酮后进入糖代谢；脂肪细胞缺乏甘油激酶，故甘油经血液运至肝（肾）利用，是糖异生的原料之一。","type":"A1","id":"c12-e2297984"},{"ch":12,"part":3,"tag":"载脂蛋白的功能","stem":"关于血浆载脂蛋白（apolipoprotein）功能的叙述，正确的是？","options":["载脂蛋白仅作为脂质的运载工具，不参与酶活性调节和受体识别","ApoB-100激活脂蛋白脂肪酶（LPL），ApoC-Ⅱ识别LDL受体","ApoA-Ⅰ抑制卵磷脂胆固醇酰基转移酶（LCAT），从而抑制胆固醇逆向转运","ApoE促进乳糜微粒和VLDL的合成，并抑制其残粒被肝细胞摄取","ApoC-Ⅱ激活LPL，ApoB-100介导LDL与LDL受体识别结合，ApoA-Ⅰ激活LCAT，ApoE介导乳糜微粒和VLDL残粒被肝细胞摄取"],"answer":4,"explain":"载脂蛋白既是脂质的运载与结构成分，又调节酶活性并介导受体识别：ApoC-Ⅱ激活LPL、ApoA-Ⅰ激活LCAT，ApoB-100与ApoE介导受体识别。","type":"A1","id":"c12-5d7959a3"},{"ch":12,"part":3,"tag":"高脂蛋白血症","stem":"一名幼儿反复腹痛并发生胰腺炎，血脂检查示血浆甘油三酯极高而胆固醇基本正常，血浆4℃静置过夜后表面出现“奶油层”。其最可能的分子缺陷是？","options":["脂蛋白脂肪酶（LPL）或ApoC-Ⅱ缺陷，使乳糜微粒中甘油三酯水解障碍，导致Ⅰ型高脂蛋白血症","LDL受体缺陷，使血浆LDL不能被摄取降解","ApoA-Ⅰ缺陷，使HDL合成障碍","肝细胞LDL受体表达上调，使LDL清除过度","胆固醇7α-羟化酶缺陷，使胆汁酸合成障碍"],"answer":0,"explain":"LPL或ApoC-Ⅱ缺陷时乳糜微粒中甘油三酯水解障碍，血浆甘油三酯显著升高、静置后上层出现奶油层，即Ⅰ型高脂蛋白血症；LDL受体缺陷引起的是家族性高胆固醇血症。","type":"A1","id":"c12-a0b4ba68"},{"ch":12,"part":3,"tag":"肺表面活性物质","stem":"早产儿易发生新生儿呼吸窘迫综合征（NRDS），其主要机制是？","options":["肺泡上皮细胞磷脂酶A₂活性过高，使甘油磷脂过度降解","肺泡表面活性物质的主要成分是胆固醇，其合成障碍导致肺泡表面张力异常升高","肺泡表面活性物质在线粒体内合成，早产儿线粒体功能不全使其生成减少","肺泡Ⅱ型上皮细胞合成二软脂酰磷脂酰胆碱（DPPC）等表面活性物质不足，肺泡表面张力增大，导致肺泡萎缩不张","表面活性物质缺乏使肺泡表面张力降低，从而引起肺水肿"],"answer":3,"explain":"肺泡Ⅱ型上皮细胞合成的表面活性物质以二软脂酰磷脂酰胆碱（DPPC）为主，可降低肺泡表面张力、防止肺泡塌陷；早产儿合成不足时肺泡表面张力增大，发生呼吸窘迫。","type":"A1","id":"c12-d2e3bcb1"},{"ch":12,"part":3,"tag":"多不饱和脂肪酸衍生物","stem":"关于花生四烯酸等多不饱和脂肪酸衍生物的叙述，正确的是？","options":["花生四烯酸的衍生物均属类固醇激素，通过细胞核受体调节基因转录","花生四烯酸经环加氧酶（COX）生成前列腺素、血栓素，经脂加氧酶生成白三烯；阿司匹林通过抑制COX减少前列腺素生成而解热镇痛","前列腺素由胆固醇转变而来，是胆固醇的重要代谢去路","白三烯是体内唯一的第二信使，可直接激活腺苷酸环化酶","阿司匹林通过激活环加氧酶，使前列腺素生成增多而发挥抗炎作用"],"answer":1,"explain":"花生四烯酸经环加氧酶生成前列腺素和血栓素、经脂加氧酶生成白三烯，参与炎症、发热与血栓形成；阿司匹林抑制环加氧酶，减少前列腺素生成而解热镇痛抗炎。","type":"A1","id":"c12-45f33ab0"},{"id":"gc13-02-1","ch":13,"part":3,"tag":"判读","stem":"测得基质pH比膜间隙高约1.4个单位，最合理的解释是","options":["膜间隙中的质子来自线粒体外膜的主动转运","电子传递把质子泵到膜间隙，形成跨内膜梯度","基质中的质子被ATP合酶泵入膜间隙而富集","膜间隙的质子源自基质中脂肪酸氧化释放的氢离子","质子被泵入基质，使基质的质子浓度高于膜间隙"],"answer":1,"explain":"B 对：按化学渗透假说，呼吸链的电子传递把质子从基质泵到膜间隙，膜间隙质子浓度高、pH 低，跨内膜的质子电化学梯度由此建立。A 错：泵出质子的是内膜上的呼吸链复合体，线粒体外膜不承担这一功能。C 错：ATP 合酶使质子经 F0 回流入基质并驱动 ATP 生成，方向与富集相反。D 错：脂肪酸氧化释放的氢主要以还原当量的形式交给呼吸链，并不直接成为膜间隙的质子。E 错：该说法把泵出方向写反，质子若被泵入基质，基质应偏酸，与实测 pH 相反。","type":"A1","group":"c13-02","kind":"mechanism","chs":[6,13,7],"vignette":"研究者从大鼠心肌中分离线粒体，再用低渗膨胀去掉外膜，得到只保留内膜的颗粒。免疫金标记显示，ATP合酶的F1头部伸向基质一侧，细胞色素c附着在内膜朝向膜间隙的一面；荧光探针测得基质pH比膜间隙高约1.4个单位，膜间隙的质子浓度更高。向悬液加入ADP与Pi后，氧电极上的耗氧速率由12升到48（相对值）；若先加入寡霉素，耗氧回落到15，而跨内膜的质子梯度继续增大。用放线菌酮抑制胞质中的核糖体后，新掺入线粒体基质的多肽几乎消失，仍有少数疏水亚基在合成，这些亚基由线粒体自己的基因组编码。此外，从线粒体表面分离到小块内质网膜，提示两处细胞器之间存在膜接触区。","vignette_title":"情景 2：质子被泵去了哪一侧","gidx":1,"gn":6,"anchor":"膜间隙的质子浓度更高"},{"id":"gc13-02-2","ch":13,"part":3,"tag":"识别","stem":"据F1头部伸向基质一侧判断，ATP合酶催化生成ATP的部位在","options":["膜间隙侧的F0质子通道入口处","内膜的疏水核心中，由质子直接催化","线粒体外膜上，与腺苷酸转运体相邻","伸向基质一侧的F1头部，由β亚基催化","膜间隙侧的F1头部，与质子梯度同侧"],"answer":3,"explain":"D 对：F1 头部伸向基质，其 β 亚基利用质子回流释放的能量催化 ADP 与 Pi 生成 ATP，故催化部位在基质一侧。A 错：F0 嵌在内膜中构成质子通道，本身不催化磷酸化反应。B 错：催化并不在内膜的疏水核心内完成，而由伸向基质的头部承担。C 错：外膜上的腺苷酸转运体负责 ATP 与 ADP 的交换，它不合成 ATP。E 错：F1 头部伸向基质而不是膜间隙，质子浓度高的一侧在膜间隙。","type":"A1","group":"c13-02","kind":"mechanism","chs":[6,13,7],"vignette":"研究者从大鼠心肌中分离线粒体，再用低渗膨胀去掉外膜，得到只保留内膜的颗粒。免疫金标记显示，ATP合酶的F1头部伸向基质一侧，细胞色素c附着在内膜朝向膜间隙的一面；荧光探针测得基质pH比膜间隙高约1.4个单位，膜间隙的质子浓度更高。向悬液加入ADP与Pi后，氧电极上的耗氧速率由12升到48（相对值）；若先加入寡霉素，耗氧回落到15，而跨内膜的质子梯度继续增大。用放线菌酮抑制胞质中的核糖体后，新掺入线粒体基质的多肽几乎消失，仍有少数疏水亚基在合成，这些亚基由线粒体自己的基因组编码。此外，从线粒体表面分离到小块内质网膜，提示两处细胞器之间存在膜接触区。","vignette_title":"情景 2：质子被泵去了哪一侧","gidx":2,"gn":6,"anchor":"ATP合酶的F1头部伸向基质一侧"},{"id":"gc13-02-3","ch":13,"part":3,"tag":"判读","stem":"先加入寡霉素后耗氧回落到15而质子梯度继续增大，说明","options":["寡霉素阻断质子回流，梯度增大使电子传递减慢","寡霉素直接抑制复合体Ⅳ，使电子不能传给氧","寡霉素使质子大量漏回基质，氧化与磷酸化解偶联","寡霉素阻断ADP进入基质，故耗氧速率随之下降","寡霉素抑制底物脱氢，还原当量无法进入呼吸链"],"answer":0,"explain":"A 对：寡霉素抑制 ATP 合酶的质子通道，质子回流受阻使跨膜梯度增大，电子传递受呼吸控制而减慢，耗氧随之降低。B 错：抑制复合体Ⅳ的是氰化物与一氧化碳，并非寡霉素。C 错：质子大量漏回基质是解偶联剂的作用，那会使耗氧升高而不是降低。D 错：ADP 与 ATP 经腺苷酸转运体交换进出基质，寡霉素并不阻断这一交换。E 错：寡霉素不抑制底物脱氢，琥珀酸等底物仍可向呼吸链提供还原当量。","type":"A1","group":"c13-02","kind":"mechanism","chs":[6,13,7],"vignette":"研究者从大鼠心肌中分离线粒体，再用低渗膨胀去掉外膜，得到只保留内膜的颗粒。免疫金标记显示，ATP合酶的F1头部伸向基质一侧，细胞色素c附着在内膜朝向膜间隙的一面；荧光探针测得基质pH比膜间隙高约1.4个单位，膜间隙的质子浓度更高。向悬液加入ADP与Pi后，氧电极上的耗氧速率由12升到48（相对值）；若先加入寡霉素，耗氧回落到15，而跨内膜的质子梯度继续增大。用放线菌酮抑制胞质中的核糖体后，新掺入线粒体基质的多肽几乎消失，仍有少数疏水亚基在合成，这些亚基由线粒体自己的基因组编码。此外，从线粒体表面分离到小块内质网膜，提示两处细胞器之间存在膜接触区。","vignette_title":"情景 2：质子被泵去了哪一侧","gidx":3,"gn":6,"anchor":"而跨内膜的质子梯度继续增大"},{"id":"gc13-02-6","ch":13,"part":3,"tag":"判读","stem":"关于线粒体的结构与其生物氧化装置的空间组织，下列判断正确的是（X 型多选）","options":["复合体Ⅰ、Ⅲ、Ⅳ镶嵌在内膜上，可把质子泵出","复合体Ⅱ只传递电子，不向膜间隙泵出质子","质子经F0通道由基质流向膜间隙完成ATP合成","ATP经腺苷酸转运体与ADP进行1比1交换运出","呼吸链各组分的排列顺序由其在膜上的含量高低决定"],"answer":[0,1,3],"explain":"答案 ABD。A 对：复合体Ⅰ、Ⅲ、Ⅳ都含质子泵结构，可把基质一侧的质子泵到膜间隙，这是跨内膜梯度形成的基础。B 对：复合体Ⅱ即琥珀酸脱氢酶，只把电子交给泛醌，不向膜间隙泵出质子。D 对：ATP 在基质侧生成后经腺苷酸转运体与 ADP 按 1 比 1 交换运出，Pi 另由磷酸载体输入。C 错：质子经 F0 是由膜间隙回流入基质，其释放的能量才用于 ADP 的磷酸化。E 错：呼吸链的排列顺序由各组分的标准氧化还原电位由低到高决定，与膜上的含量高低无关。","type":"X","group":"c13-02","kind":"mechanism","chs":[6,13,7],"vignette":"研究者从大鼠心肌中分离线粒体，再用低渗膨胀去掉外膜，得到只保留内膜的颗粒。免疫金标记显示，ATP合酶的F1头部伸向基质一侧，细胞色素c附着在内膜朝向膜间隙的一面；荧光探针测得基质pH比膜间隙高约1.4个单位，膜间隙的质子浓度更高。向悬液加入ADP与Pi后，氧电极上的耗氧速率由12升到48（相对值）；若先加入寡霉素，耗氧回落到15，而跨内膜的质子梯度继续增大。用放线菌酮抑制胞质中的核糖体后，新掺入线粒体基质的多肽几乎消失，仍有少数疏水亚基在合成，这些亚基由线粒体自己的基因组编码。此外，从线粒体表面分离到小块内质网膜，提示两处细胞器之间存在膜接触区。","vignette_title":"情景 2：质子被泵去了哪一侧","gidx":6,"gn":6,"anchor":"得到只保留内膜的颗粒"},{"id":"gc14-04-4","ch":13,"part":3,"tag":"判读","stem":"为把断点定位到糖异生的末端，本实验测定 P/O 的意义是","options":["提示呼吸链质子泵受损，氧化与磷酸化已发生脱偶联","提示琥珀酸脱氢酶缺陷，三羧酸循环不能正常运转","提示呼吸链与氧化磷酸化正常，断点不在生物氧化环节","提示 ATP 合酶活性过高，线粒体大量水解细胞内的 ATP","提示脂肪酸β氧化受阻，还原当量不能进入呼吸链氧化"],"answer":2,"explain":"C 对：以谷氨酸加苹果酸为底物时电子经复合体Ⅰ进入呼吸链、P/O 约 2.5，以琥珀酸为底物时电子经复合体Ⅱ进入、P/O 约 1.5，两者都与正常值一致，说明电子传递与氧化磷酸化的偶联完好，能量代谢不是本例的阻断点。A 错：脱偶联时 P/O 会明显下降，不会保持 2.5 与 1.5。B 错：琥珀酸脱氢酶若缺陷，以琥珀酸为底物时耗氧与 P/O 都会异常，而不是给出正常的 1.5。D 错：ATP 合酶活性过高不会使 P/O 比值恰好落在正常范围，情景也未提供相关证据。E 错：本次测定用谷氨酸、苹果酸与琥珀酸作底物，与脂肪酸β氧化是否受阻无关。","type":"A1","group":"c14-04","kind":"experiment","chs":[11,13,16],"vignette":"一名 9 个月男婴因清晨反复抽搐、肝大就诊。空腹 6 小时血糖 2.3 mmol/L，血乳酸 7.1 mmol/L。肝穿活检：肝糖原 84 mg/g（正常 30–50），葡糖-6-磷酸酶活性为对照的 4%，其余三个糖异生关键酶活性均在正常范围。静脉注射胰高血糖素 30 分钟后，血糖由 2.3 升至 2.5 mmol/L，血乳酸由 7.1 升至 8.6 mmol/L。用 ¹⁴C 标记的乳酸灌注肝匀浆，掺入葡萄糖的量仅为对照的 6%，而掺入二氧化碳的量与对照接近；另取离体肝线粒体测定，以谷氨酸加苹果酸为底物时 P/O 为 2.5，以琥珀酸为底物时为 1.5。","vignette_title":"情景 4：三项数据指向同一个断点","gidx":4,"gn":5,"anchor":"以琥珀酸为底物时为 1.5"},{"id":"gc20-01-1","ch":13,"part":3,"tag":"机制","stem":"服药者线粒体耗氧速率升高而ATP合成速率下降，其直接机制是","options":["抑制复合体Ⅳ，使电子不能传给氧而在呼吸链中堆积","抑制ATP合酶，使质子经F0通道向基质的回流受阻","作为脂溶性质子载体把质子带回基质，使质子梯度消散","抑制腺苷酸转运体，使ADP不能进入线粒体基质","抑制琥珀酸脱氢酶，使还原当量不能进入呼吸链氧化"],"answer":2,"explain":"C 对：情景给出三项彼此制约的数据——耗氧升到2.5倍、质子梯度只剩10%、ATP合成大幅下降，只有质子被载体带回基质才能同时解释这三项。A 错：抑制复合体Ⅳ时电子不能交给氧，耗氧量应当下降而不是升高。B 错：阻断质子经ATP合酶回流会使梯度升高，与实测的10%相反。D 错：ADP进入基质受阻，氧化磷酸化减慢，耗氧量随之下降。E 错：抑制琥珀酸脱氢酶时，以琥珀酸为底物的耗氧量应明显降低。","type":"A1","group":"c20-01","kind":"mechanism","chs":[13,3,16],"vignette":"20世纪30年代，二硝基苯酚曾作为减肥药公开出售。一名服药一个月的女性体重下降6kg，因持续大汗、发热急诊入院，体温41.2℃。检查：静息耗氧量由每分钟240mL升至520mL，动脉血乳酸由1.0升至4.8mmol/L，血糖6.1mmol/L。取骨骼肌活检分离线粒体，以琥珀酸为底物并加入ADP与Pi测定：耗氧速率为对照的2.5倍（30对12，相对值），跨内膜质子梯度降至对照的10%，ATP合成速率由每分钟每毫克蛋白48nmol降至6nmol，此时电子仍沿呼吸链传给氧分子。另取一管改用谷氨酸加苹果酸为底物，加入鱼藤酮后耗氧降至1以下，质子梯度与ATP合成速率同时下降。向对照线粒体加入丙二酸后耗氧速率下降，把琥珀酸浓度提高10倍，耗氧速率回升至接近对照。","vignette_title":"情景 1：一份减肥药留下的能量账本","gidx":1,"gn":5,"anchor":"跨内膜质子梯度降至对照的10%"},{"id":"gc20-01-2","ch":13,"part":3,"tag":"判读","stem":"另取一管以琥珀酸为底物并加入鱼藤酮，预期的测定结果是","options":["耗氧速率与ATP合成速率同步下降，质子梯度随之消散","耗氧速率不变而ATP合成速率下降，质子梯度显著升高","耗氧速率下降而ATP合成速率不变，质子梯度维持在对照水平","耗氧速率与ATP合成速率同步升高，质子梯度显著升高","耗氧速率与ATP合成速率接近对照，质子梯度保持不变"],"answer":4,"explain":"E 对：鱼藤酮的作用靶点是复合体Ⅰ，琥珀酸脱下的电子经复合体Ⅱ的FAD进入呼吸链，绕过了复合体Ⅰ，因此电子传递与磷酸化都不受影响。A 错：同步下降提示抑制剂作用于复合体Ⅱ或其下游环节，不是鱼藤酮。B 错：梯度升高见于阻断质子经ATP合酶回流的处理，此时耗氧速率下降而非不变。C 错：ATP合成速率不变而耗氧下降的组合与呼吸链被阻断的表现不符。D 错：加入鱼藤酮不会使电子传递与质子泵送同时增加。","type":"A1","group":"c20-01","kind":"mechanism","chs":[13,3,16],"vignette":"20世纪30年代，二硝基苯酚曾作为减肥药公开出售。一名服药一个月的女性体重下降6kg，因持续大汗、发热急诊入院，体温41.2℃。检查：静息耗氧量由每分钟240mL升至520mL，动脉血乳酸由1.0升至4.8mmol/L，血糖6.1mmol/L。取骨骼肌活检分离线粒体，以琥珀酸为底物并加入ADP与Pi测定：耗氧速率为对照的2.5倍（30对12，相对值），跨内膜质子梯度降至对照的10%，ATP合成速率由每分钟每毫克蛋白48nmol降至6nmol，此时电子仍沿呼吸链传给氧分子。另取一管改用谷氨酸加苹果酸为底物，加入鱼藤酮后耗氧降至1以下，质子梯度与ATP合成速率同时下降。向对照线粒体加入丙二酸后耗氧速率下降，把琥珀酸浓度提高10倍，耗氧速率回升至接近对照。","vignette_title":"情景 1：一份减肥药留下的能量账本","gidx":2,"gn":5,"anchor":"加入鱼藤酮后耗氧降至1以下"},{"id":"gc20-01-5","ch":13,"part":3,"tag":"机制","stem":"关于解偶联剂与呼吸链抑制剂对这组指标的影响，下列判断正确的是（X 型多选）","options":["解偶联剂使耗氧速率升高而ATP合成速率下降","呼吸链抑制剂使耗氧速率与跨膜质子梯度同向下降","阻断质子经ATP合酶回流时质子梯度升高而电子传递减慢","两类药物都使ATP合成减少，故对耗氧速率的影响也相同","解偶联剂不阻断电子传递本身，电子仍可沿呼吸链交给氧"],"answer":[0,1,2,4],"explain":"答案 ABCE。A、B、C、E 分别对应三类处理的账目：解偶联剂使耗氧升而ATP降；抑制剂使耗氧与质子梯度同向下落；阻断回流时梯度升而电子传递减慢；解偶联并不阻断电子本身。D 错：两类处理都使ATP合成减少，但耗氧速率的变化方向相反，不能由ATP的变化推断耗氧的变化。","type":"X","group":"c20-01","kind":"mechanism","chs":[13,3,16],"vignette":"20世纪30年代，二硝基苯酚曾作为减肥药公开出售。一名服药一个月的女性体重下降6kg，因持续大汗、发热急诊入院，体温41.2℃。检查：静息耗氧量由每分钟240mL升至520mL，动脉血乳酸由1.0升至4.8mmol/L，血糖6.1mmol/L。取骨骼肌活检分离线粒体，以琥珀酸为底物并加入ADP与Pi测定：耗氧速率为对照的2.5倍（30对12，相对值），跨内膜质子梯度降至对照的10%，ATP合成速率由每分钟每毫克蛋白48nmol降至6nmol，此时电子仍沿呼吸链传给氧分子。另取一管改用谷氨酸加苹果酸为底物，加入鱼藤酮后耗氧降至1以下，质子梯度与ATP合成速率同时下降。向对照线粒体加入丙二酸后耗氧速率下降，把琥珀酸浓度提高10倍，耗氧速率回升至接近对照。","vignette_title":"情景 1：一份减肥药留下的能量账本","gidx":5,"gn":5,"anchor":"耗氧速率为对照的2.5倍"},{"id":"gc20-02-1","ch":13,"part":3,"tag":"机制","stem":"缺血区线粒体的电子传递几乎停止，其直接原因是","options":["缺血使内膜质子通透性升高，质子经非ATP合酶途径大量回漏","氧供应不足使呼吸链末端缺少受氢体，质子梯度不能维持","乳酸堆积使基质pH下降，ATP合酶被乳酸直接抑制而停转","ADP与AMP升高使呼吸链停转，质子不再被泵出内膜","缺血使复合体Ⅳ的血红素辅基被还原，电子无法继续传递"],"answer":1,"explain":"B 对：氧化磷酸化需要氧作为电子传递链末端的受氢体，氧分压降至1.3kPa后电子无处可去，质子泵失去动力，梯度无法维持，ATP合成随之停止。A 错：质子回漏属解偶联的表现，本例的起因是缺氧。C 错：乳酸不是ATP合酶的抑制剂，其堆积是缺氧的后果而非原因。D 错：ADP与AMP升高会加快而不是停止电子传递。E 错：缺氧时细胞色素确实难以维持氧化态，但根本原因是氧分子供应不足，不是辅基受损。","type":"A1","group":"c20-02","kind":"mechanism","chs":[13,11,16],"vignette":"62岁男性因持续胸痛40分钟急诊入院，心电图提示前壁心肌梗死，冠状动脉前降支完全闭塞。心肌活检显示：缺血区氧分压降至1.3kPa（正常约5.3kPa），ATP由24降至8μmol/g，磷酸肌酸由30降至12μmol/g，ADP与AMP分别升高3倍与6倍，乳酸由1.4升至22μmol/g；此时线粒体的电子传递几乎停止，跨内膜质子梯度不能维持。缺血区糖原分解与糖酵解速率提高到原来的8倍，乳酸脱氢酶催化丙酮酸还原为乳酸，使NAD⁺不断再生；血乳酸升至5.2mmol/L，血糖7.8mmol/L。入院后患者心率由78升至120次/分，医师提醒这一变化会进一步加重缺血区的损伤。","vignette_title":"情景 2：冠状动脉堵住后的四十分钟","gidx":1,"gn":5,"anchor":"跨内膜质子梯度不能维持"},{"id":"gc20-02-3","ch":13,"part":3,"tag":"机制","stem":"缺血40分钟内磷酸肌酸由30降至12μmol/g，其意义是","options":["磷酸肌酸是糖酵解的中间产物，缺血时随乳酸一同被大量消耗","磷酸肌酸在缺血时由ADP与肌酸重新合成，其含量因此下降","磷酸肌酸把高能磷酸键转移给ADP，缓冲ATP水平的下降","磷酸肌酸是内膜上的质子载体，缺血时随质子外流而大量丢失","磷酸肌酸的下降说明心肌已耗尽肌酸激酶，不能再生成ATP"],"answer":2,"explain":"C 对：磷酸肌酸是肌肉中的高能磷酸化合物储备，肌酸激酶把它的高能磷酸键转给ADP生成ATP，故ATP水平下降时它同步甚至更早下降。A 错：磷酸肌酸不参与糖酵解，也不是乳酸生成的原料。B 错：缺血时ATP不足，反应方向应是磷酸肌酸分解生成ATP，而不是被大量合成。D 错：磷酸肌酸不在膜上，也不是质子载体。E 错：肌酸激酶在缺血时并未耗尽，其催化方向以生成ATP为主。","type":"A1","group":"c20-02","kind":"mechanism","chs":[13,11,16],"vignette":"62岁男性因持续胸痛40分钟急诊入院，心电图提示前壁心肌梗死，冠状动脉前降支完全闭塞。心肌活检显示：缺血区氧分压降至1.3kPa（正常约5.3kPa），ATP由24降至8μmol/g，磷酸肌酸由30降至12μmol/g，ADP与AMP分别升高3倍与6倍，乳酸由1.4升至22μmol/g；此时线粒体的电子传递几乎停止，跨内膜质子梯度不能维持。缺血区糖原分解与糖酵解速率提高到原来的8倍，乳酸脱氢酶催化丙酮酸还原为乳酸，使NAD⁺不断再生；血乳酸升至5.2mmol/L，血糖7.8mmol/L。入院后患者心率由78升至120次/分，医师提醒这一变化会进一步加重缺血区的损伤。","vignette_title":"情景 2：冠状动脉堵住后的四十分钟","gidx":3,"gn":5,"anchor":"磷酸肌酸由30降至12μmol/g"},{"id":"gc20-03-3","ch":13,"part":3,"tag":"判读","stem":"该患者线粒体以谷氨酸加苹果酸为底物时P/O比仍为2.5，说明","options":["患者线粒体内膜的质子通透性升高，氧化与磷酸化已经解偶联","患者线粒体的氧化与磷酸化仍紧密偶联，产热增多另有原因","患者线粒体的质子梯度已经消失，电子传递以最大速率进行","患者线粒体的ATP合酶活性下降，质子经其他途径大量回漏","患者线粒体的呼吸链复合体数目减少，故P/O比维持不变"],"answer":1,"explain":"B 对：P/O比反映每消耗1个氧原子所合成的ATP数，仍为2.5说明电子传递建立的质子梯度被正常用于磷酸化，氧化与磷酸化没有脱偶联，产热增多另有原因。A 错：质子通透性升高会使P/O比明显下降，与实测的2.5不符。C 错：梯度消失时P/O比同样会下降，而本例比值正常。D 错：ATP合酶活性下降会因质子回流受阻使P/O比降低，呼吸也会减慢。E 错：复合体数目减少会同时降低耗氧与ATP合成，但不改变二者的比值。","type":"A1","group":"c20-03","kind":"mechanism","chs":[13,16,25],"vignette":"32岁女性因怕热、多汗、心悸伴三个月内体重下降6kg就诊。体检：心率110次/分，双手细颤，甲状腺弥漫性肿大。检查：血清游离T4为正常上限的3倍，促甲状腺激素（TSH）降低，基础代谢率+45%，静息耗氧量较同龄女性高约40%，血胆固醇3.1mmol/L，血糖正常。医师解释，血中甲状腺激素绝大部分与结合蛋白结合运输，进入细胞后T4在脱碘酶作用下转变为活性更强的T3；T3与细胞核内的受体结合，受体作为配体依赖的转录因子开启一批基因，其中编码钠钾泵的基因转录明显增强，细胞膜上钠钾泵的数目达到同龄人的2.6倍。治疗6周后复查，基础代谢率降至+8%；治疗前取骨骼肌线粒体测定，以谷氨酸加苹果酸为底物时P/O比仍为2.5。","vignette_title":"情景 3：基础代谢率+45%的那位患者","gidx":3,"gn":5,"anchor":"P/O比仍为2.5"},{"id":"gc20-03-4","ch":13,"part":3,"tag":"机制","stem":"该患者静息耗氧量与产热均明显增加，其分子机制是","options":["甲状腺激素使线粒体内膜的质子通透性升高，氧化与磷酸化解偶联","甲状腺激素抑制呼吸链复合体Ⅳ，电子在链中堆积并以热的形式释放","甲状腺激素使ATP合酶数目减少，质子梯度升高并驱动产热","甲状腺激素直接抑制钠钾泵，胞质中Na⁺升高后刺激产热","钠钾泵增多使ATP水解加快，ADP增多使氧化磷酸化加速产热"],"answer":4,"explain":"E 对：患者细胞膜上钠钾泵的数目达到同龄人的2.6倍，泵水解ATP的速率随之加快，ADP增多反过来加快氧化磷酸化，耗氧量与产热量因此同时升高，而P/O比不变。A 错：解偶联是质子经非ATP合酶途径回漏，会使P/O比下降，与本例不符。B 错：抑制复合体Ⅳ会使耗氧量下降，与患者耗氧升高相反。C 错：ATP合酶数目减少会使P/O比下降，也不能解释产热增加。D 错：甲状腺激素使钠钾泵合成增多而不是抑制，胞质Na⁺升高与产热的关系也不成立。","type":"A1","group":"c20-03","kind":"mechanism","chs":[13,16,25],"vignette":"32岁女性因怕热、多汗、心悸伴三个月内体重下降6kg就诊。体检：心率110次/分，双手细颤，甲状腺弥漫性肿大。检查：血清游离T4为正常上限的3倍，促甲状腺激素（TSH）降低，基础代谢率+45%，静息耗氧量较同龄女性高约40%，血胆固醇3.1mmol/L，血糖正常。医师解释，血中甲状腺激素绝大部分与结合蛋白结合运输，进入细胞后T4在脱碘酶作用下转变为活性更强的T3；T3与细胞核内的受体结合，受体作为配体依赖的转录因子开启一批基因，其中编码钠钾泵的基因转录明显增强，细胞膜上钠钾泵的数目达到同龄人的2.6倍。治疗6周后复查，基础代谢率降至+8%；治疗前取骨骼肌线粒体测定，以谷氨酸加苹果酸为底物时P/O比仍为2.5。","vignette_title":"情景 3：基础代谢率+45%的那位患者","gidx":4,"gn":5,"anchor":"静息耗氧量较同龄女性高约40%"},{"id":"gc20-04-1","ch":13,"part":3,"tag":"判读","stem":"乙组以谷氨酸加苹果酸为底物时耗氧与ATP合成速率都降到约1/5，P/O为2.4，说明","options":["电子传递在复合体Ⅰ一侧受限，氧化与磷酸化仍然紧密偶联","线粒体内膜对质子的通透性升高，氧化与磷酸化已经解偶联","ATP合酶活性下降使质子回流受阻，质子梯度因此显著升高","底物的脱氢反应未受影响，缺陷位于ATP合酶本身","呼吸链复合体Ⅲ与Ⅳ被抑制，电子不能沿呼吸链交给氧分子"],"answer":0,"explain":"A 对：以谷氨酸加苹果酸为底物时耗氧与ATP合成同步降到约1/5，而P/O为2.4、接近对照的2.5，说明电子传入的一侧受限，磷酸化过程本身仍然偶联。B 错：解偶联时耗氧量应升高而P/O比应下降，与本组数据相反。C 错：ATP合酶活性下降会使质子回流减少，P/O比降低而不是维持在2.4。D 错：P/O比正常说明磷酸化环节尚好，缺陷更可能在电子传入的一侧。E 错：若复合体Ⅲ与Ⅳ被抑制，以琥珀酸为底物时耗氧也应明显下降。","type":"A1","group":"c20-04","kind":"experiment","chs":[13,3,16],"vignette":"研究生收到三份来自不同患儿的骨骼肌线粒体样品：甲为年龄匹配的正常对照，乙与丙分别来自两名运动不耐受、肌张力低下的患儿，测定前各样品线粒体蛋白量已配平。她以谷氨酸加苹果酸和琥珀酸两种底物，分别测定加ADP后的耗氧速率与ATP合成速率（单位均为nmol·min⁻¹·mg⁻¹），并计算P/O比。结果：甲组以谷氨酸加苹果酸为底物时耗氧24、ATP60、P/O2.5，以琥珀酸为底物时耗氧24、ATP36、P/O1.5；乙组耗氧5、ATP12、P/O2.4与耗氧23、ATP35、P/O1.5；丙组耗氧27、ATP16、P/O0.6与耗氧26、ATP15、P/O0.6。临床资料：乙组患儿安静时血乳酸4.2mmol/L，丙组为1.3mmol/L。为核对测定条件，她又向甲组体系中加入过量ADP与Pi后重复测定。","vignette_title":"情景 4：三份样品与一张三列表","gidx":1,"gn":5,"anchor":"乙组耗氧5、ATP12、P/O2.4"},{"id":"gc20-04-2","ch":13,"part":3,"tag":"判读","stem":"丙组两种底物下耗氧速率都高于对照而ATP合成速率约为对照的1/4，其机制是","options":["细胞色素c自内膜脱落流失，电子传递因此被加快","ATP合酶数目减少，质子梯度升高后电子传递被动加快","底物脱氢酶活性过高，还原当量超出呼吸链的处理能力","质子经非ATP合酶途径回漏，氧化与磷酸化脱偶联","线粒体蛋白量在提取过程中被高估，测定结果因此偏高"],"answer":3,"explain":"D 对：丙组两种底物下耗氧都高于对照，说明电子传递并未被阻断；同时ATP合成速率降到约1/4、P/O比降到0.6，合理的解释是质子经ATP合酶以外的途径回漏，能量以热的形式散失。A 错：细胞色素c流失会使电子传递减慢、耗氧下降，与丙组的升高相反。B 错：ATP合酶减少时质子回流受阻，电子传递会因梯度升高而减慢。C 错：底物脱氢酶活性高不会使P/O比下降，该比值反映的是偶联程度。E 错：三份样品的蛋白量已配平，结果偏高不能由蛋白量解释。","type":"A1","group":"c20-04","kind":"experiment","chs":[13,3,16],"vignette":"研究生收到三份来自不同患儿的骨骼肌线粒体样品：甲为年龄匹配的正常对照，乙与丙分别来自两名运动不耐受、肌张力低下的患儿，测定前各样品线粒体蛋白量已配平。她以谷氨酸加苹果酸和琥珀酸两种底物，分别测定加ADP后的耗氧速率与ATP合成速率（单位均为nmol·min⁻¹·mg⁻¹），并计算P/O比。结果：甲组以谷氨酸加苹果酸为底物时耗氧24、ATP60、P/O2.5，以琥珀酸为底物时耗氧24、ATP36、P/O1.5；乙组耗氧5、ATP12、P/O2.4与耗氧23、ATP35、P/O1.5；丙组耗氧27、ATP16、P/O0.6与耗氧26、ATP15、P/O0.6。临床资料：乙组患儿安静时血乳酸4.2mmol/L，丙组为1.3mmol/L。为核对测定条件，她又向甲组体系中加入过量ADP与Pi后重复测定。","vignette_title":"情景 4：三份样品与一张三列表","gidx":2,"gn":5,"anchor":"丙组耗氧27、ATP16、P/O0.6"},{"id":"gc20-04-5","ch":13,"part":3,"tag":"方案","stem":"关于本实验这三项指标的综合判断，下列正确的是（X 型多选）","options":["单测耗氧速率不能区分电子传递受阻与质子回漏，须同时测ATP合成速率","乙组琥珀酸途径各指标接近对照，说明复合体Ⅱ及其下游环节完好","丙组P/O比下降，说明其呼吸链的某一复合体被特异性阻断","P/O比是ATP合成速率与耗氧速率的比值，可反映偶联程度","丙组耗氧速率高于对照，说明其ATP需求增大而氧化加快"],"answer":[0,1,3],"explain":"答案 ABD。A、B、D 分别对应本实验的设计逻辑：三项指标联合才能定位损伤位点；以琥珀酸为底物的结果界定了完好的环节；P/O比的定义与意义。C 错：呼吸链被阻断时耗氧与ATP合成同时下降而二者的比值基本不变，丙组的表现是比值下降，指向解偶联。E 错：丙组的氧耗升高来自质子回漏，并非ATP需求增大所致。","type":"X","group":"c20-04","kind":"experiment","chs":[13,3,16],"vignette":"研究生收到三份来自不同患儿的骨骼肌线粒体样品：甲为年龄匹配的正常对照，乙与丙分别来自两名运动不耐受、肌张力低下的患儿，测定前各样品线粒体蛋白量已配平。她以谷氨酸加苹果酸和琥珀酸两种底物，分别测定加ADP后的耗氧速率与ATP合成速率（单位均为nmol·min⁻¹·mg⁻¹），并计算P/O比。结果：甲组以谷氨酸加苹果酸为底物时耗氧24、ATP60、P/O2.5，以琥珀酸为底物时耗氧24、ATP36、P/O1.5；乙组耗氧5、ATP12、P/O2.4与耗氧23、ATP35、P/O1.5；丙组耗氧27、ATP16、P/O0.6与耗氧26、ATP15、P/O0.6。临床资料：乙组患儿安静时血乳酸4.2mmol/L，丙组为1.3mmol/L。为核对测定条件，她又向甲组体系中加入过量ADP与Pi后重复测定。","vignette_title":"情景 4：三份样品与一张三列表","gidx":5,"gn":5,"anchor":"线粒体蛋白量已配平"},{"id":"gc25-03-2","ch":13,"part":3,"tag":"机制","stem":"情景中 β 氧化产生的 7 分子 FADH₂ 进入呼吸链的部位与后果是","options":["经复合体Ⅰ进入呼吸链，泵出的质子较多，生成的 ATP 较多","经复合体Ⅲ进入并直接交给细胞色素 c，泵出的质子较多","经 ATP 合酶的质子通道进入，驱动其旋转生成等量 ATP","经复合体Ⅱ进入并交给泛醌，泵出的质子较少，生成的 ATP 较少","经复合体Ⅳ进入并直接交给氧，生成的 ATP 与 NADH 相当"],"answer":3,"explain":"D 对：FADH₂ 的电子经复合体Ⅱ（琥珀酸-泛醌还原酶）交给泛醌，绕过了复合体Ⅰ这个质子泵，泵出的质子较少，故 P/O 约 1.5，低于 NADH 的 2.5。A 是 NADH 的进入方式；B 泛醌才是两条呼吸链的交汇点，细胞色素 c 位于复合体Ⅲ与Ⅳ之间；C ATP 合酶接受的是质子回流而不是电子；E 复合体Ⅳ是电子传给氧的部位，与 FADH₂ 的入口无关。","type":"A1","group":"c25-03","kind":"mechanism","chs":[12,13,16],"vignette":"一名 2 型糖尿病患者因胰岛素用量偏大，于凌晨出现心悸、大汗、意识模糊与肢体抽搐。急查：血糖 1.9 mmol/L，血乳酸 1.8 mmol/L，血浆游离脂肪酸 0.9 mmol/L，血酮体 0.2 mmol/L。静脉推注葡萄糖 5 分钟后意识恢复，心电图与心肌酶始终正常。医生分析：血糖下降时胰高血糖素与肾上腺素升高、胰岛素下降，脂肪细胞中激素敏感性甘油三酯脂肪酶被磷酸化而激活，脂肪动员加强，血浆游离脂肪酸升高到平时的两倍多；心肌细胞摄取的脂肪酸在胞质活化为脂酰辅酶A 后，经肉碱转运进入线粒体，经 7 轮 β 氧化生成 7 分子 FADH₂ 与 7 分子 NADH。脑组织的糖原储备很少，其能量几乎全靠血糖，而脂肪酸不能通过血脑屏障；成熟红细胞没有线粒体。","vignette_title":"情景 3：低血糖先打倒大脑，心脏却还在跳","gidx":2,"gn":5,"anchor":"7 轮 β 氧化生成"},{"id":"gc3-04-1","ch":13,"part":3,"tag":"判读","stem":"改用琥珀酸为底物时 P/O 比约为 1.5，原因是琥珀酸脱下的电子","options":["经复合体Ⅱ进入呼吸链，跳过复合体Ⅰ而泵出质子较少","直接交给氧分子合成水，不经过任何呼吸链复合体","经复合体Ⅰ进入呼吸链，泵出质子较多而耗能增加","经复合体Ⅱ进入呼吸链，但 ATP 合酶被琥珀酸抑制","直接交给细胞色素 c，绕过了复合体Ⅲ的质子泵"],"answer":0,"explain":"A 对：琥珀酸脱下的电子经复合体Ⅱ（琥珀酸-泛醌还原酶）进入呼吸链，跳过能泵出质子的复合体Ⅰ，建立的质子梯度较小，故 P/O 比约 1.5，低于经复合体Ⅰ的 NADH 途径的 2.5。C 错：琥珀酸的电子不经过复合体Ⅰ。D 错：ATP 合酶不被琥珀酸抑制，差别来自质子泵数目而非酶被抑制。E 错：细胞色素 c 在复合体Ⅲ与Ⅳ之间传递电子，不能直接从复合体Ⅱ接受电子。B 错：氧在复合体Ⅳ被还原，电子并非直接交给氧。","type":"A1","group":"c3-04","kind":"experiment","chs":[13,11,12],"vignette":"深夜的实验台上，研究生用离体大鼠肝线粒体悬液测耗氧量：体系含 ADP、Pi 与 Mg²⁺，25℃ 持续通氧，用氧电极记录。以谷氨酸加苹果酸为底物，加入 ADP 后耗氧速率由 12 升到 42（nmol O·min⁻¹·mg⁻¹），P/O 比约为 2.5；改用琥珀酸为底物的相同条件下，P/O 比约为 1.5。加入 2,4-二硝基苯酚后耗氧速率进一步升高到 78，而体系中 ATP 生成量反而下降到接近零；换一管加入抗霉素A，耗氧迅速降至 4；另一管加入寡霉素，耗氧降至 9，而跨膜质子梯度反而增大。再以丙酮酸加苹果酸为底物，加入 ADP 后耗氧速率由 10 升到 38；以软脂酰肉碱为底物时，耗氧同样可被 ADP 刺激。","vignette_title":"情景 4：氧电极上的一次药物滴定","gidx":1,"gn":6,"anchor":"改用琥珀酸为底物的相同条件下"},{"id":"gc3-04-2","ch":13,"part":3,"tag":"机制","stem":"加入 2,4-二硝基苯酚后耗氧速率升高而 ATP 生成量下降，其机制是","options":["抑制复合体Ⅳ的活性，使电子不能传递给氧分子","抑制底物脱氢，使还原当量不能进入呼吸链","直接抑制 ATP 合酶，使质子回流通道被阻断","抑制腺苷酸转运体，使 ADP 不能进入线粒体基质","作为质子载体把质子带回基质，破坏跨膜质子梯度"],"answer":4,"explain":"E 对：2,4-二硝基苯酚是脂溶性质子载体，可把质子带回基质，消除跨膜质子电化学梯度，使氧化与磷酸化脱偶联，电子传递失去
