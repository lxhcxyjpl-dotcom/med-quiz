限制而加快，故耗氧升高、ATP 生成减少，能量以热释放。A 错：抑制复合体Ⅳ会使耗氧量下降，与现象相反。C 错：寡霉素才抑制 ATP 合酶，二硝基苯酚的作用点在质子梯度而不是质子通道。D 错：抑制腺苷酸转运体使基质内 ADP 不足，耗氧量应下降。B 错：抑制底物脱氢同样使耗氧量下降。","type":"A1","group":"c3-04","kind":"experiment","chs":[13,11,12],"vignette":"深夜的实验台上，研究生用离体大鼠肝线粒体悬液测耗氧量：体系含 ADP、Pi 与 Mg²⁺，25℃ 持续通氧，用氧电极记录。以谷氨酸加苹果酸为底物，加入 ADP 后耗氧速率由 12 升到 42（nmol O·min⁻¹·mg⁻¹），P/O 比约为 2.5；改用琥珀酸为底物的相同条件下，P/O 比约为 1.5。加入 2,4-二硝基苯酚后耗氧速率进一步升高到 78，而体系中 ATP 生成量反而下降到接近零；换一管加入抗霉素A，耗氧迅速降至 4；另一管加入寡霉素，耗氧降至 9，而跨膜质子梯度反而增大。再以丙酮酸加苹果酸为底物，加入 ADP 后耗氧速率由 10 升到 38；以软脂酰肉碱为底物时，耗氧同样可被 ADP 刺激。","vignette_title":"情景 4：氧电极上的一次药物滴定","gidx":2,"gn":6,"anchor":"耗氧速率进一步升高到 78"},{"id":"gc3-04-3","ch":13,"part":3,"tag":"方案","stem":"若要判断某新抑制剂阻断的是复合体Ⅰ还是复合体Ⅲ，最直接的方案是","options":["测定跨膜质子梯度，看该梯度是否被完全破坏","测定耗氧量并比较加入抑制剂前后的变化幅度","测定各呼吸链组分的氧化还原状态，找出被阻断的部位","测定 ATP 的生成量，其下降幅度可直接区分二者","测定线粒体的蛋白含量，看抑制剂是否引起蛋白降解"],"answer":2,"explain":"C 对：电子传递被阻断后，阻断部位上游的组分因不能交出电子而趋于还原态，下游组分因得不到电子而保持氧化态，测定各组分的氧化还原状态即可定位靶点。D 错：两类抑制剂都使 ATP 生成减少，下降幅度无法区分阻断部位。E 错：蛋白含量变化反映的是结构损伤，与抑制靶点无关。B 错：耗氧量只能说明电子传递受阻，不能说明受阻的位置。A 错：两类抑制剂都使质子梯度下降，难以区分复合体Ⅰ与复合体Ⅲ。","type":"A1","group":"c3-04","kind":"experiment","chs":[13,11,12],"vignette":"深夜的实验台上，研究生用离体大鼠肝线粒体悬液测耗氧量：体系含 ADP、Pi 与 Mg²⁺，25℃ 持续通氧，用氧电极记录。以谷氨酸加苹果酸为底物，加入 ADP 后耗氧速率由 12 升到 42（nmol O·min⁻¹·mg⁻¹），P/O 比约为 2.5；改用琥珀酸为底物的相同条件下，P/O 比约为 1.5。加入 2,4-二硝基苯酚后耗氧速率进一步升高到 78，而体系中 ATP 生成量反而下降到接近零；换一管加入抗霉素A，耗氧迅速降至 4；另一管加入寡霉素，耗氧降至 9，而跨膜质子梯度反而增大。再以丙酮酸加苹果酸为底物，加入 ADP 后耗氧速率由 10 升到 38；以软脂酰肉碱为底物时，耗氧同样可被 ADP 刺激。","vignette_title":"情景 4：氧电极上的一次药物滴定","gidx":3,"gn":6,"anchor":"耗氧迅速降至 4"},{"id":"gc3-04-6","ch":13,"part":3,"tag":"判读","stem":"关于本实验各处理的结果与解释，下列判断正确的是（X 型多选）","options":["二硝基苯酚使氧化与磷酸化脱偶联，能量以热释放","以谷氨酸加苹果酸为底物时 P/O 比约为 2.5","线粒体耗氧量可直接换算为生成的 ATP 总量","抗霉素A阻断复合体Ⅲ中细胞色素 b 至 c₁ 的电子传递","寡霉素使质子回流受阻，跨膜质子梯度反而增大"],"answer":[0,1,3,4],"explain":"答案 ABDE。A、B、D、E 分别对应情景中 NADH 途径 P/O 比约 2.5、抗霉素A抑制复合体Ⅲ中细胞色素 b 与 c₁ 之间的电子传递、寡霉素抑制 ATP 合酶使质子回流受阻而跨膜质子梯度增大、二硝基苯酚解偶联使能量以热释放。C 错：耗氧量只反映电子传递的速率，解偶联剂可使耗氧升高而 ATP 生成减少，故耗氧量不能直接换算为 ATP 总量，须同时测定 ATP 的生成量。","type":"X","group":"c3-04","kind":"experiment","chs":[13,11,12],"vignette":"深夜的实验台上，研究生用离体大鼠肝线粒体悬液测耗氧量：体系含 ADP、Pi 与 Mg²⁺，25℃ 持续通氧，用氧电极记录。以谷氨酸加苹果酸为底物，加入 ADP 后耗氧速率由 12 升到 42（nmol O·min⁻¹·mg⁻¹），P/O 比约为 2.5；改用琥珀酸为底物的相同条件下，P/O 比约为 1.5。加入 2,4-二硝基苯酚后耗氧速率进一步升高到 78，而体系中 ATP 生成量反而下降到接近零；换一管加入抗霉素A，耗氧迅速降至 4；另一管加入寡霉素，耗氧降至 9，而跨膜质子梯度反而增大。再以丙酮酸加苹果酸为底物，加入 ADP 后耗氧速率由 10 升到 38；以软脂酰肉碱为底物时，耗氧同样可被 ADP 刺激。","vignette_title":"情景 4：氧电极上的一次药物滴定","gidx":6,"gn":6,"anchor":"而跨膜质子梯度反而增大"},{"id":"gc6-02-2","ch":13,"part":3,"tag":"判读","stem":"骨骼肌与肝以葡萄糖为底物时 ATP 产量相差 2 个，其原因是","options":["骨骼肌的甘油磷酸穿梭把 NADH 直接送入线粒体基质","骨骼肌胞质 NADH 的电子从 FAD 进入，绕过了复合体Ⅰ","肝胞质 NADH 的电子从 FAD 进入，绕过了复合体Ⅰ","肝的苹果酸穿梭把 NADH 的电子交给复合体Ⅱ的 FAD","两种组织的 ATP 合酶催化效率与质子漏的程度不同"],"answer":1,"explain":"B 对：骨骼肌走甘油磷酸穿梭，胞质 NADH 的电子经 FAD 进入，跳过了泵质子的复合体Ⅰ，每对电子只能按 FADH₂ 口径计 1.5 个 ATP，故 2 分子胞质 NADH 比肝脏少 2 个 ATP。C 错：肝走苹果酸穿梭，还原当量以 NADH 形式进入，并不经 FAD。A 错：甘油磷酸穿梭的产物是胞质侧的磷酸二羟丙酮，还原当量留在内膜外侧。D 错：苹果酸穿梭把电子以 NADH 形式交给复合体Ⅰ。E 错：情景的差别来自穿梭方式，而不是 ATP 合酶效率。","type":"A1","group":"c6-02","kind":"mechanism","chs":[3,11,13],"vignette":"胞质中糖酵解产生的 NADH 不能自由穿过线粒体内膜，它的还原当量要靠穿梭系统送进线粒体。骨骼肌与脑以甘油磷酸穿梭为主：胞质 NADH 先把氢交给磷酸二羟丙酮生成 α-磷酸甘油，后者在线粒体内膜靠胞质一侧被线粒体甘油-3-磷酸脱氢酶重新氧化为磷酸二羟丙酮，脱下的一对电子经该酶的辅基 FAD 与铁硫中心交给泛醌，再沿复合体Ⅲ、细胞色素 c、复合体Ⅳ传给氧。肝与心肌则以苹果酸-天冬氨酸穿梭为主，把还原当量以 NADH 的形式送进基质。按教材口径，1 NADH 约相当于 2.5 ATP，1 FADH₂ 约相当于 1.5 ATP，所以 1 分子葡萄糖彻底氧化时骨骼肌约得 30 ATP、肝约得 32 ATP。","vignette_title":"情景 2：一对氢原子的两条进城路线","gidx":2,"gn":5,"anchor":"骨骼肌约得 30 ATP"},{"id":"gc6-02-5","ch":13,"part":3,"tag":"机制","stem":"关于辅基、穿梭系统与 ATP 产量的关系，下列判断正确的是（X 型多选）","options":["经由 FAD 进入呼吸链的电子绕过了复合体Ⅰ的质子泵","甘油磷酸穿梭把胞质 NADH 的还原当量交给了 FAD 辅基","苹果酸穿梭把还原当量以 FADH₂ 形式送入线粒体基质","胞质 NADH 可以直接穿过线粒体内膜进入基质被氧化","两种穿梭方式使等量胞质 NADH 生成不同数量的 ATP"],"answer":[0,1,4],"explain":"答案 ABE。A 与 A 对应情景中甘油磷酸穿梭经 FAD、铁硫中心进入泛醌的路径，电子绕过复合体Ⅰ，泵出的质子更少。E 对应 30 与 32 两个数字的差别。C 错：苹果酸-天冬氨酸穿梭送入基质的是 NADH 形式的还原当量，而不是 FADH₂。D 错：情景一开始就指出 NADH 不能自由穿过线粒体内膜，否则无需穿梭系统。","type":"X","group":"c6-02","kind":"mechanism","chs":[3,11,13],"vignette":"胞质中糖酵解产生的 NADH 不能自由穿过线粒体内膜，它的还原当量要靠穿梭系统送进线粒体。骨骼肌与脑以甘油磷酸穿梭为主：胞质 NADH 先把氢交给磷酸二羟丙酮生成 α-磷酸甘油，后者在线粒体内膜靠胞质一侧被线粒体甘油-3-磷酸脱氢酶重新氧化为磷酸二羟丙酮，脱下的一对电子经该酶的辅基 FAD 与铁硫中心交给泛醌，再沿复合体Ⅲ、细胞色素 c、复合体Ⅳ传给氧。肝与心肌则以苹果酸-天冬氨酸穿梭为主，把还原当量以 NADH 的形式送进基质。按教材口径，1 NADH 约相当于 2.5 ATP，1 FADH₂ 约相当于 1.5 ATP，所以 1 分子葡萄糖彻底氧化时骨骼肌约得 30 ATP、肝约得 32 ATP。","vignette_title":"情景 2：一对氢原子的两条进城路线","gidx":5,"gn":5,"anchor":"把还原当量以 NADH 的形式送进基质"},{"id":"gc8-03-1","ch":13,"part":3,"tag":"机制","stem":"运动中肌肉耗氧量增至静息时的 4 倍，其直接原因是","options":["氧浓度升高直接激活复合体Ⅳ，使电子传递与耗氧量增加","ADP 增多使质子泵停止工作，质子梯度增大而电子传递加快","底物浓度升高使呼吸链各复合体的氧化还原电位差增大","ATP 增多使质子回流加快、跨膜质子梯度减小，电子传递加快","ADP 增多使质子回流加快、跨膜质子梯度减小，电子传递加快"],"answer":4,"explain":"E 对：肌肉收缩大量消耗 ATP 使 ADP 增多，ADP 进入线粒体后被 ATP 合酶利用，质子回流加快、跨膜质子梯度减小，对电子传递的制约解除，耗氧量与氧化磷酸化同步加快，这就是呼吸控制。B 升高的是 ADP 而不是 ATP，ATP 增多反而使呼吸减慢。B 错在 ADP 增多不会使质子泵停止工作。D 在正常氧分压下复合体Ⅳ已接近饱和，氧浓度不是直接原因。E 氧化还原电位差由呼吸链组分本身决定，不随底物浓度改变。","type":"A1","group":"c8-03","kind":"mechanism","chs":[13,12,11],"vignette":"一名长跑运动员在 2 小时耐力运动末段接受股四头肌活检。肌内 ATP 由 24 降至 15 mmol/kg，ADP 与 AMP 分别升高 2 倍与 5 倍，柠檬酸由 1.2 降至 0.4 mmol/kg；PFK-1 活性升高约 3 倍，丙酮酸生成速率加快，肌糖原由 110 降至 46 mmol/kg。血游离脂肪酸由 0.3 升至 1.5 mmol/L，血乳酸仅轻度升高。运动全程耗氧量约为静息时的 4 倍，血糖维持在 4.8 mmol/L。","vignette_title":"情景 3：能量不够时，线粒体自己踩刹车与油门","gidx":1,"gn":5,"anchor":"运动全程耗氧量约为静息时的 4 倍"},{"id":"gc8-03-2","ch":13,"part":3,"tag":"机制","stem":"若骨骼肌细胞内 ATP 大量积累而 ADP 减少，呼吸链的变化是","options":["ATP 直接抑制复合体Ⅳ与氧的结合，电子传递被阻断","质子回流减少、跨膜质子梯度增大，电子传递减慢而耗氧下降","质子回流减少、跨膜质子梯度减小，电子传递加快而耗氧上升","ATP 合酶转为水解 ATP，将质子从基质泵入膜间隙","质子泵数量显著减少，复合体Ⅰ与复合体Ⅲ停止泵出质子"],"answer":1,"explain":"B 对：ATP 积累、ADP 减少时 ATP 合酶回流质子减少，跨膜质子梯度增大，质子泵继续泵出质子所需克服的梯度更大，电子传递因而减慢、耗氧下降，这正是呼吸控制的反向表现。B 把质子梯度与耗氧的变化方向写反。E 错在复合体数量不会随短时能量状态改变。A 错在 ATP 不通过竞争氧的结合位点直接阻断复合体Ⅳ。E 生理条件下 ATP 合酶主要合成 ATP，反向水解不是本例变化。","type":"A1","group":"c8-03","kind":"mechanism","chs":[13,12,11],"vignette":"一名长跑运动员在 2 小时耐力运动末段接受股四头肌活检。肌内 ATP 由 24 降至 15 mmol/kg，ADP 与 AMP 分别升高 2 倍与 5 倍，柠檬酸由 1.2 降至 0.4 mmol/kg；PFK-1 活性升高约 3 倍，丙酮酸生成速率加快，肌糖原由 110 降至 46 mmol/kg。血游离脂肪酸由 0.3 升至 1.5 mmol/L，血乳酸仅轻度升高。运动全程耗氧量约为静息时的 4 倍，血糖维持在 4.8 mmol/L。","vignette_title":"情景 3：能量不够时，线粒体自己踩刹车与油门","gidx":2,"gn":5,"anchor":"肌内 ATP 由 24 降至 15"},{"id":"gc8-03-5","ch":13,"part":3,"tag":"机制","stem":"关于运动时能量代谢的反馈调节，下列判断正确的是（X 型多选）","options":["ATP 与 ADP 的比值升高时，氧化磷酸化速率随之减慢","脂肪酸 β 氧化产生的还原当量须经呼吸链氧化才能持续","ADP 与 AMP 增多可加快电子传递与氧化磷酸化","肌细胞内氧气充足时，丙酮酸在胞质中大量还原为乳酸","AMP 与 ADP 增多可激活 PFK-1，使糖酵解加快"],"answer":[0,1,2,4],"explain":"答案 ABCE。C 对：ADP 增多加快质子回流、解除对电子传递的制约，耗氧与氧化磷酸化同时加快。E 对：AMP 与 ADP 是 PFK-1 的变构激活剂，能量不足时糖酵解被打开，与 PFK-1 活性升高约 3 倍一致。B 对：β 氧化依赖呼吸链再生 NAD⁺ 与 FAD，二者耦联才能持续。A 对：ATP 与 ADP 比值升高使质子回流减少、梯度增大，氧化磷酸化随之减慢，是呼吸控制的核心。D 错：氧供充足时丙酮酸进入线粒体氧化，只有缺氧时乳酸才大量生成。","type":"X","group":"c8-03","kind":"mechanism","chs":[13,12,11],"vignette":"一名长跑运动员在 2 小时耐力运动末段接受股四头肌活检。肌内 ATP 由 24 降至 15 mmol/kg，ADP 与 AMP 分别升高 2 倍与 5 倍，柠檬酸由 1.2 降至 0.4 mmol/kg；PFK-1 活性升高约 3 倍，丙酮酸生成速率加快，肌糖原由 110 降至 46 mmol/kg。血游离脂肪酸由 0.3 升至 1.5 mmol/L，血乳酸仅轻度升高。运动全程耗氧量约为静息时的 4 倍，血糖维持在 4.8 mmol/L。","vignette_title":"情景 3：能量不够时，线粒体自己踩刹车与油门","gidx":5,"gn":5,"anchor":"ADP 与 AMP 分别升高 2 倍"},{"id":"gc8-04-4","ch":13,"part":3,"tag":"判读","stem":"以琥珀酸为底物时 P/O 为 1.5，以谷氨酸加苹果酸为底物时为 2.5，说明","options":["P/O 的差别由 ATP 合酶 β 亚基的数量决定","两种底物的 P/O 差别说明偶联程度不同，琥珀酸属解偶联","琥珀酸的电子经复合体Ⅱ进入呼吸链，越过了复合体Ⅰ","琥珀酸的电子经复合体Ⅰ进入呼吸链，泵出的质子更多","谷氨酸与苹果酸的电子经复合体Ⅱ进入，故 P/O 更高"],"answer":2,"explain":"C 对：琥珀酸的电子经复合体Ⅱ进入呼吸链，越过了能泵出质子的复合体Ⅰ，泵出质子较少，故 P/O 约 1.5；谷氨酸与苹果酸经复合体Ⅰ进入，P/O 约 2.5，差值正好反映复合体Ⅰ的泵质子贡献。B 琥珀酸不经过复合体Ⅰ，方向写反。C 谷氨酸与苹果酸走的是复合体Ⅰ。D P/O 由质子泵出的数量决定，不是 ATP 合酶 β 亚基数量。E 两者都偶联，P/O 不同是电子入口不同造成，不是解偶联。","type":"A1","group":"c8-04","kind":"experiment","chs":[16,11,13],"vignette":"研究生用离体大鼠肝细胞做三组实验：甲组为对照，乙组加入 10 nmol/L 胰高血糖素，丙组先加入 PKA 抑制剂 H89 再加同样浓度的胰高血糖素。孵育 30 分钟后，乙组细胞内 cAMP 由 0.6 升至 4.8 μmol/L，糖原由 45 降至 20 mg/g 蛋白，培养基中葡萄糖由 0.8 升至 2.4 mmol/L，果糖-2,6-二磷酸由 11 降至 3 nmol/g；丙组各项指标与甲组接近。另取一组以 ¹⁴C 标记的乳酸为底物孵育，加入胰高血糖素后培养基中放射性葡萄糖比对照升高 2.3 倍。分离肝细胞线粒体测定 P/O：以琥珀酸为底物时为 1.5，以谷氨酸加苹果酸为底物时为 2.5。","vignette_title":"情景 4：三组肝细胞与一组放射性计数","gidx":4,"gn":5,"anchor":"以琥珀酸为底物时为 1.5"},{"ch":13,"part":3,"tag":"呼吸链组分","stem":"线粒体氧化呼吸链中，能把质子从基质侧泵到膜间隙侧、从而建立跨膜质子电化学梯度的复合体是","options":["复合体Ⅰ、Ⅱ、Ⅲ","复合体Ⅰ、Ⅲ、Ⅳ","复合体Ⅱ、Ⅲ、Ⅳ","仅复合体Ⅰ和Ⅱ","仅复合体Ⅳ"],"answer":1,"explain":"复合体Ⅰ、Ⅲ、Ⅳ均含质子泵结构，可泵出质子；复合体Ⅱ（琥珀酸-泛醌还原酶）只递电子不泵质子。","type":"A1","id":"c13-32467c61"},{"ch":13,"part":3,"tag":"呼吸链交汇","stem":"在两条线粒体氧化呼吸链中，同时接受来自复合体Ⅰ和复合体Ⅱ所传递电子的组分是","options":["FMN","铁硫蛋白（Fe-S）","泛醌（CoQ）","细胞色素c","细胞色素aa3"],"answer":2,"explain":"复合体Ⅰ与Ⅱ的电子均先交给泛醌（CoQ），它是两条呼吸链的交汇点；细胞色素c在复合体Ⅲ与Ⅳ之间传递电子。","type":"A1","id":"c13-213ce522"},{"ch":13,"part":3,"tag":"氧化磷酸化","stem":"一对电子分别经NADH氧化呼吸链和琥珀酸氧化呼吸链传给氧时，生成ATP的分子数（P/O比）分别约为","options":["2.5和1.5","1.5和2.5","3和2","2和3","2.5和2.5"],"answer":0,"explain":"NADH经复合体Ⅰ进入，泵出质子多，P/O约2.5；FADH2经复合体Ⅱ进入，跳过复合体Ⅰ，P/O约1.5。","type":"A1","id":"c13-6326cbd7"},{"ch":13,"part":3,"tag":"ATP合酶","stem":"关于线粒体ATP合酶（F0F1复合体）结构与功能的叙述，正确的是","options":["F1位于膜间隙侧，本身构成质子通道","F0头部含催化亚基，直接结合ADP与Pi","ATP合酶是呼吸链复合体Ⅱ的组成部分","F0构成质子通道，F1头部的β亚基催化ADP与Pi生成ATP","ATP合酶位于线粒体外膜，主要功能是水解ATP"],"answer":3,"explain":"F0嵌于内膜构成质子通道，F1头部伸向基质，其β亚基利用质子回流释放的能量催化ADP磷酸化生成ATP。","type":"A1","id":"c13-a7fed920"},{"ch":13,"part":3,"tag":"解偶联剂","stem":"2,4-二硝基苯酚（DNP）可使线粒体耗氧量明显增加而ATP生成减少，其作用机制是","options":["抑制复合体Ⅳ，使电子不能传给氧","直接抑制ATP合酶F1的催化活性","抑制腺苷酸转运体，使ADP不能进入线粒体","抑制底物脱氢，阻止还原当量进入呼吸链","作为脂溶性质子载体将质子带回基质，破坏跨膜质子电化学梯度"],"answer":4,"explain":"DNP为解偶联剂，携带质子回漏消除电化学梯度，使氧化与磷酸化脱偶联，能量以热释放；它不抑制电子传递或ATP合酶。","type":"A1","id":"c13-12df8f1d"},{"ch":13,"part":3,"tag":"呼吸链抑制剂","stem":"下列氧化磷酸化抑制剂与其作用部位（靶点）配对正确的是","options":["鱼藤酮——复合体Ⅱ","氰化物——细胞色素c氧化酶（复合体Ⅳ）","抗霉素A——复合体Ⅰ","寡霉素——复合体Ⅲ","一氧化碳——ATP合酶"],"answer":1,"explain":"氰化物与复合体Ⅳ的细胞色素aa3结合，阻断电子传给氧；鱼藤酮抑Ⅰ、抗霉素A抑Ⅲ、寡霉素抑ATP合酶、CO抑复合体Ⅳ。","type":"A1","id":"c13-5a4457fc"},{"ch":13,"part":3,"tag":"抗霉素A","stem":"在含琥珀酸、ADP、Pi并通入O2的离体肝线粒体悬液中加入抗霉素A后，电子传递被阻断的部位是","options":["复合体Ⅰ的FMN与铁硫中心之间","复合体Ⅱ的FAD与泛醌之间","复合体Ⅲ的细胞色素b与细胞色素c1之间","复合体Ⅳ的细胞色素a与a3之间","ATP合酶F0的质子通道"],"answer":2,"explain":"抗霉素A抑制复合体Ⅲ中Cyt b与Cyt c1间的电子传递，上游组分（FAD、CoQ、Cyt b）趋于还原态，Cyt c、Cyt aa3仍为氧化态。","type":"A1","id":"c13-52c6f6cf"},{"ch":13,"part":3,"tag":"非线粒体氧化","stem":"关于非线粒体氧化体系（微粒体氧化体系）的叙述，正确的是","options":["微粒体加单氧酶以细胞色素P450为递电子体，需NADPH和O2，使底物羟化","微粒体加单氧酶把O2的两个氧原子全部掺入底物","过氧化物酶体的主要功能是经氧化磷酸化合成ATP","超氧化物歧化酶（SOD）催化超氧阴离子直接生成水","活性氧对机体只有损伤作用，补充抗氧化剂可延缓衰老"],"answer":0,"explain":"微粒体加单氧酶（混合功能氧化酶）由P450传递电子、NADPH供氢，O2中一个氧原子掺入底物、另一个还原成水；SOD催化超氧阴离子歧化为H2O2和O2。","type":"A1","id":"c13-1c77e2b7"},{"ch":13,"part":3,"tag":"递电子体","stem":"关于线粒体氧化呼吸链中递氢体与递电子体传递电子方式的叙述，正确的是","options":["FMN 和 FAD 每次只能传递单电子，不能传递氢","细胞色素类通过辅基血红素中铁的 Fe²⁺⇌Fe³⁺ 互变传递单电子","泛醌（CoQ）只能传递单电子，不能传递质子","铁硫蛋白（Fe-S）通过铁的氧化还原每轮传递双电子","细胞色素 c 是呼吸链中唯一既能传递电子又能传递氢的组分"],"answer":1,"explain":"细胞色素辅基血红素的铁经 Fe²⁺⇌Fe³⁺ 互变传递单电子；FMN、FAD、泛醌可传递双电子（含质子），铁硫蛋白每次传递单电子。","type":"A1","id":"c13-8557902e"},{"ch":13,"part":3,"tag":"呼吸链顺序","stem":"确定线粒体氧化呼吸链中各组分的排列顺序，最主要的依据是","options":["各组分的分子量大小","各组分在线粒体内膜上的含量高低","各组分的标准氧化还原电位由低到高依次排列","各组分与氧的亲和力由大到小依次排列","各组分对解偶联剂的敏感性由强到弱"],"answer":2,"explain":"电子总是从氧化还原电位低的组分流向电位高的组分，据此可确定各组分在呼吸链中的排列顺序。","type":"A1","id":"c13-20a83c00"},{"ch":13,"part":3,"tag":"化学渗透假说","stem":"按照化学渗透假说，氧化磷酸化过程中电子传递所释放能量储存的直接形式是","options":["跨线粒体内膜的质子电化学梯度（质子动力势）","ATP 分子中的高能磷酸键","线粒体基质内 ATP 浓度的升高","膜间隙中 ADP 与 Pi 的聚集","呼吸链蛋白亚基的构象能"],"answer":0,"explain":"化学渗透假说认为电子传递把质子泵出内膜形成跨膜质子电化学梯度，其储存的能量经 ATP 合酶驱动 ADP 与 Pi 生成 ATP。","type":"A1","id":"c13-a3ad4ff1"},{"ch":13,"part":3,"tag":"ATP合酶旋转催化","stem":"关于 ATP 合酶催化 ADP 与 Pi 生成 ATP 机制的叙述，正确的是","options":["F1 头部直接结合质子并水解质子驱动磷酸化","质子流经 F0 使 c 环与 γ 亚基旋转，引起 β 亚基构象改变而催化 ATP 生成","α 亚基是催化亚基，其构象变化直接完成 ATP 的合成","δ 亚基的旋转是 ATP 合成的直接动力","ADP 与 Pi 可自发结合生成 ATP，不需跨膜质子梯度提供能量"],"answer":1,"explain":"F0 的 c 环与 F1 的 γ 亚基构成转子，质子回流驱动其旋转，使 β 亚基在三种构象间互变，完成 ADP 与 Pi 的结合、ATP 的生成与释放。","type":"A1","id":"c13-07aa0b7b"},{"ch":13,"part":3,"tag":"腺苷酸转运体","stem":"线粒体内生成的 ATP 需运至细胞质，同时 ADP 与 Pi 需进入线粒体，其转运机制是","options":["ATP 与 ADP 均以自由扩散方式通过线粒体内膜","ATP 合酶兼作转运通道，直接将 ATP 送至细胞质","ATP 由胞质侧的腺苷酸环化酶转运出线粒体","ATP 与 ADP 经线粒体内膜上的腺苷酸转运体（ATP-ADP 转位酶）1∶1 交换，Pi 由磷酸载体同向转运入基质","ATP 的转运由质子泵直接推动，不需要专门的转运蛋白"],"answer":3,"explain":"腺苷酸转运体使 ATP 运出、ADP 运入（1∶1 交换），Pi 经磷酸载体与 H⁺ 同向转运入基质，共同维持线粒体内外的腺苷酸平衡。","type":"A1","id":"c13-df270dd1"},{"ch":13,"part":3,"tag":"ROS","stem":"正常生理条件下，线粒体呼吸链中活性氧（ROS）产生的主要部位是","options":["复合体Ⅰ和复合体Ⅲ，电子传递过程中电子漏出使 O2 单电子还原生成超氧阴离子","复合体Ⅳ，因其直接以 O2 为底物故产生大量 ROS","复合体Ⅱ，因其辅基 FAD 极易与 O2 反应","线粒体外膜，因外膜缺乏抗氧化酶","ATP 合酶的旋转催化过程，其产生的自由基最多"],"answer":0,"explain":"复合体Ⅰ和复合体Ⅲ是呼吸链电子漏的主要部位，漏出的电子使 O2 单电子还原生成超氧阴离子，再经 SOD 等转化为 H2O2 并清除。","type":"A1","id":"c13-691fa362"},{"ch":13,"part":3,"tag":"呼吸控制","stem":"在含琥珀酸、ADP、Pi 并通入 O2 的离体肝线粒体悬液中加入寡霉素，最可能出现的变化是","options":["电子传递加快，耗氧量增加，ATP 生成增多","复合体Ⅱ被直接抑制，琥珀酸不能脱氢","质子经解偶联途径大量回漏，耗氧量增加而 ATP 生成减少","耗氧量不变，ATP 生成停止","质子回流受阻，跨膜质子梯度增大，电子传递减慢，耗氧量降低"],"answer":4,"explain":"寡霉素抑制 ATP 合酶 F0 的质子通道，质子不能回流，跨膜质子梯度增大使电子传递受阻（呼吸控制），故耗氧量下降、ATP 生成减少。","type":"A1","id":"c13-3b2e9cfa"},{"ch":13,"part":3,"tag":"氧化酶与需氧脱氢酶","stem":"关于氧化酶与需氧脱氢酶的叙述，正确的是","options":["需氧脱氢酶以 O2 为受氢体，其催化产物是 H2O","不需氧脱氢酶以 O2 为直接受氢体，其催化反应必须有分子氧参与","氧化酶以 O2 为受氢体，其催化产物可为 H2O（如细胞色素 c 氧化酶）","氧化酶不能以 O2 为受氢体，只能以 NAD⁺ 为受氢体","需氧脱氢酶的辅基是血红素，故其催化产物为 H2O"],"answer":2,"explain":"氧化酶以 O2 为受氢体，产物为 H2O 或 H2O2；需氧脱氢酶属黄素蛋白，以 O2 为受氢体生成 H2O2；不需氧脱氢酶以 NAD⁺、FAD 等为受氢体。","type":"A1","id":"c13-af46ab44"},{"id":"gc11-02-3","ch":14,"part":3,"tag":"机制","stem":"该患者的肿瘤细胞嘌呤核苷酸合成活跃，从氨基酸代谢看，为嘌呤环直接提供氮原子的是","options":["甘氨酸与丝氨酸，分别提供 N1 与 N3","谷氨酰胺与天冬氨酸，提供 N3、N9 与 N1","丙氨酸与谷氨酸，分别提供 N7 与 N9","丝氨酸与苏氨酸，分别提供 N1 与 N7","精氨酸与组氨酸，分别提供 N3 与 N7"],"answer":1,"explain":"B 对：嘌呤环上的三个氮原子分别由谷氨酰胺与天冬氨酸提供，谷氨酰胺的酰胺氮提供 N3 与 N9，天冬氨酸提供 N1，二者都是氨基酸代谢的中心物质，谷氨酰胺还是氨的无毒运输形式。A 错：甘氨酸提供的是 C4、C5 与 N7，并不提供 N1 与 N3，丝氨酸主要贡献一碳单位。C 错：丙氨酸与谷氨酸参与转氨基作用，并不直接为嘌呤环供氮。D 错：丝氨酸与苏氨酸不是嘌呤环氮原子的供体。E 错：精氨酸与组氨酸在嘌呤环合成中不起供氮作用，组氨酸的分解产物进入一碳单位池。","type":"A1","group":"c11-02","kind":"mechanism","chs":[15,14,5],"vignette":"一位 52 岁男性因弥漫大 B 细胞淋巴瘤接受联合化疗，近三日因恶心呕吐几乎未进食。用药第 3 天出现少尿：血尿酸由 318 μmol/L 升至 620 μmol/L，血肌酐 186 μmol/L，血钾 5.8 mmol/L，尿 pH 5.0。同日右足第一跖趾关节红肿热痛，关节腔穿刺抽出淡黄色滑液，偏振光镜下见大量针状结晶，测得该关节滑液 pH 约 5.4，局部温度低于核心体温。医生分析，化疗后肿瘤细胞大量破坏，而其嘌呤核苷酸的合成与分解原本都很活跃：核酸分解产生的嘌呤碱依次转变为次黄嘌呤与黄嘌呤，人体分解嘌呤的最后一步与多数哺乳动物不同，产物就是血中升高的尿酸；它在体液中溶解度有限，超过饱和度后即在理化条件不利的关节滑液中析出结晶，沉积于关节、软组织与肾。医生给予别嘌呤醇并嘱多饮水。","vignette_title":"情景 2：从一堆破碎的细胞到一个红肿的关节","gidx":3,"gn":6,"anchor":"嘌呤核苷酸的合成与分解原本都很活跃"},{"id":"gc11-03-1","ch":14,"part":3,"tag":"机制","stem":"该患者血清叶酸降低后一碳单位的转运首先受阻，因为一碳单位","options":["由 S-腺苷甲硫氨酸携带转运，叶酸缺乏使该载体生成减少","以二氧化碳形式存在并参与转运，叶酸缺乏不影响这一过程","由磷酸吡哆醛携带转运，叶酸缺乏使该辅酶不能再生","由四氢叶酸携带转运，叶酸缺乏使其生成减少而受阻","由维生素 B12 携带转运，叶酸缺乏时该载体被大量消耗"],"answer":3,"explain":"D 对：一碳单位包括甲基、甲烯基、甲炔基与甲酰基等，由四氢叶酸携带并转运，叶酸缺乏使四氢叶酸生成不足，一碳单位的转运与利用随之受阻，dUMP 甲基化与甲硫氨酸合酶两条去路同时受影响。A 错：S-腺苷甲硫氨酸是体内甲基的直接供体，不是一碳单位的载体。B 错：二氧化碳不属于一碳单位，它只提供嘌呤环的 C6。C 错：磷酸吡哆醛是转氨酶的辅酶，与一碳单位无关。E 错：维生素 B12 是甲硫氨酸合酶的辅酶，也不是一碳单位的载体。","type":"A1","group":"c11-03","kind":"mechanism","chs":[14,15,7],"vignette":"一位 47 岁男性长期酗酒并有严重营养不良：血清同型半胱氨酸 42 μmol/L（正常低于 15），血清叶酸与维生素 B12 低于正常下限；骨髓涂片见红系前体细胞核质发育不同步的巨幼样改变；肝穿刺活检显示肝细胞内质网腔扩张、脂滴明显增多，血中极低密度脂蛋白（VLDL）低于正常。丝氨酸羟甲基转移酶把丝氨酸的羟甲基交给四氢叶酸，生成 N5,N10-甲烯基四氢叶酸，这是一碳单位的主要来源；一碳单位既可由胸苷酸合酶交给 dUMP 生成 dTMP，也可还原为 N5-甲基四氢叶酸后经甲硫氨酸合酶把甲基转给同型半胱氨酸生成甲硫氨酸，进而生成 S-腺苷甲硫氨酸（SAM）。肝内磷脂酰胆碱可由磷脂酰乙醇胺接受 SAM 提供的甲基生成，而它是肝细胞在内质网组装并分泌 VLDL 所必需的。","vignette_title":"情景 3：一份甲基的两个去处","gidx":1,"gn":5,"anchor":"血清叶酸与维生素 B12 低于正常下限"},{"id":"gc11-03-3","ch":14,"part":3,"tag":"机制","stem":"该患者血清同型半胱氨酸升至 42 μmol/L，其直接原因是","options":["同型半胱氨酸不能接受 S-腺苷甲硫氨酸提供的甲基","甲硫氨酸合酶活性下降，同型半胱氨酸不能获得甲基而堆积","胱硫醚的缩合反应增强，同型半胱氨酸被大量生成","丝氨酸羟甲基转移酶活性过高，一碳单位被大量消耗于 dTMP","同型半胱氨酸经转氨基作用生成的 α-酮酸明显减少"],"answer":1,"explain":"B 对：同型半胱氨酸再甲基化生成甲硫氨酸由甲硫氨酸合酶催化，其辅酶是维生素 B12，甲基则由 N5-甲基四氢叶酸提供；患者叶酸与维生素 B12 不足，该酶催化效率下降，同型半胱氨酸不能获得甲基因而堆积。A 错：直接向同型半胱氨酸提供甲基的是 N5-甲基四氢叶酸，S-腺苷甲硫氨酸是甲基的直接供体但方向相反，它由甲硫氨酸与 ATP 反应生成。C 错：同型半胱氨酸与丝氨酸缩合生成胱硫醚是消耗它的反应，增强只会使其降低。D 错：一碳单位转向 dTMP 并不使同型半胱氨酸升高，本例叶酸缺乏时 dTMP 合成反而减少。E 错：转氨基作用不是同型半胱氨酸代谢的主要去路。","type":"A1","group":"c11-03","kind":"mechanism","chs":[14,15,7],"vignette":"一位 47 岁男性长期酗酒并有严重营养不良：血清同型半胱氨酸 42 μmol/L（正常低于 15），血清叶酸与维生素 B12 低于正常下限；骨髓涂片见红系前体细胞核质发育不同步的巨幼样改变；肝穿刺活检显示肝细胞内质网腔扩张、脂滴明显增多，血中极低密度脂蛋白（VLDL）低于正常。丝氨酸羟甲基转移酶把丝氨酸的羟甲基交给四氢叶酸，生成 N5,N10-甲烯基四氢叶酸，这是一碳单位的主要来源；一碳单位既可由胸苷酸合酶交给 dUMP 生成 dTMP，也可还原为 N5-甲基四氢叶酸后经甲硫氨酸合酶把甲基转给同型半胱氨酸生成甲硫氨酸，进而生成 S-腺苷甲硫氨酸（SAM）。肝内磷脂酰胆碱可由磷脂酰乙醇胺接受 SAM 提供的甲基生成，而它是肝细胞在内质网组装并分泌 VLDL 所必需的。","vignette_title":"情景 3：一份甲基的两个去处","gidx":3,"gn":5,"anchor":"血清同型半胱氨酸 42 μmol/L"},{"id":"gc11-04-3","ch":14,"part":3,"tag":"机制","stem":"IMP 中检出 ¹⁵N 而 dTMP 的甲基上没有标记，这说明谷氨酰胺的酰胺氮","options":["进入嘌呤环的 N1 与 N7 位，dTMP 的甲基由甘氨酸提供","进入嘧啶环并成为 CTP 环上的碳原子，与 dTMP 无关","进入嘌呤环的 C4、C5 与 N7 位，而 dTMP 的甲基未被标记","进入嘌呤环的 N3 与 N9 位，dTMP 的甲基来自一碳单位","进入嘌呤环的 N3 与 N9 位，dTMP 的甲基来自 S-腺苷甲硫氨酸"],"answer":3,"explain":"D 对：谷氨酰胺的酰胺氮提供嘌呤环的 N3 与 N9，因此 IMP、GMP 中可检出 ¹⁵N；GMP 的 2-氨基与 CTP 的 4-氨基也来自谷氨酰胺，故 CTP 同样被标记。dTMP 的甲基由 N5,N10-甲烯基四氢叶酸提供，属一碳单位，与谷氨酰胺的酰胺氮无关，所以甲基上没有标记。A 错：N1 由天冬氨酸提供，N7 由甘氨酸提供。B 错：谷氨酰胺为 CTP 提供的是 4-氨基而不是碳原子。C 错：C4、C5 与 N7 由甘氨酸提供。E 错：S-腺苷甲硫氨酸是甲基的直接供体，但 dTMP 的甲基来自一碳单位甲烯基四氢叶酸，而不是 S-腺苷甲硫氨酸。","type":"A1","group":"c11-04","kind":"experiment","chs":[15,14,11,6],"vignette":"为判断一株白血病细胞系的核苷酸原料从哪来，研究生做了三组实验。第一组：分别在 C1 位 ¹⁴C 标记葡萄糖和 C6 位 ¹⁴C 标记葡萄糖的培养基中培养细胞并收集 ¹⁴CO₂，C1 标记组的释放量是 C6 标记组的 8 倍；加入葡萄糖-6-磷酸脱氢酶抑制剂后，¹⁴CO₂ 释放量与细胞增殖速度同步降到原来的三成。第二组：用酰胺氮被 ¹⁵N 标记的谷氨酰胺培养细胞，2 小时后在细胞内的 IMP、GMP 与 CTP 中检出 ¹⁵N，而 dTMP 的甲基上没有标记。第三组：差速离心分离胞质与线粒体组分，胞质组分中可测到以谷氨酰胺为氮源的氨基甲酰磷酸合成酶活性，该活性可被 UTP 抑制；线粒体组分中的同类酶则以游离氨为氮源，并可被 N-乙酰谷氨酸激活。","vignette_title":"情景 4：¹⁴CO₂ 计数器上的三条线索","gidx":3,"gn":5,"anchor":"dTMP 的甲基上没有标记"},{"id":"gc14-03-1","ch":14,"part":3,"tag":"机制","stem":"该患者血氨升至 152 μmol/L 而血尿素仅 1.8 mmol/L，说明","options":["肝细胞减少使鸟氨酸循环受阻，氨不能转变为尿素排出","肾小球滤过率下降，血中的尿素不能被正常排出体外","肠道细菌的腐败作用减弱，氨的生成量随之明显减少","肌肉内的嘌呤核苷酸循环增强，释放出大量游离的氨","肝内转氨酶活性明显下降，氨基酸不能再进行转氨基作用"],"answer":0,"explain":"A 对：血氨升高而血尿素反而降低，提示氨转变为尿素这一环节受阻；肝硬化时肝细胞数量减少，鸟氨酸循环的酶系整体不足，尿素合成能力下降，氨因此在血中蓄积。B 错：若为肾排出障碍，血尿素应升高而不是降低。C 错：情景中肠道积血被细菌分解产氨是增多的，与腐败作用减弱方向相反。D 错：嘌呤核苷酸循环是肌肉脱氨基的方式之一，但它不是本例血氨升高的主要来源，也不能解释血尿素降低。E 错：转氨基作用本身不产生游离氨，转氨酶活性下降也不会使尿素生成减少到这种程度。","type":"A1","group":"c14-03","kind":"mechanism","chs":[14,11,16],"vignette":"一名 58 岁男性，乙型肝炎后肝硬化 8 年，因呕血与黑便入院。入院 48 小时后出现嗜睡与扑翼样震颤。血氨 152 μmol/L（正常 18–72），动脉血 pH 7.49，空腹血糖 2.9 mmol/L，血乳酸 3.4 mmol/L，血尿素仅 1.8 mmol/L，血清白蛋白 26 g/L。医生分析，肠道内积血被细菌分解产氨增多，而肝细胞数量减少使鸟氨酸循环能力下降，氨不能像正常时那样在肝内合成尿素后排出；血中的氨以 NH₄⁺ 与 NH₃ 两种形式存在，二者的比例受血液 pH 影响。患者入院后未进食，肝糖原已近耗竭，肝糖异生能力也随肝细胞减少而下降。","vignette_title":"情景 3：肝硬化患者的一场消化道出血","gidx":1,"gn":5,"anchor":"肝细胞数量减少使鸟氨酸循环能力下降"},{"id":"gc14-03-2","ch":14,"part":3,"tag":"机制","stem":"动脉血 pH 7.49 会加重该患者的氨中毒，其原因是","options":["碱中毒使 NH₄⁺ 增多，铵离子更易透过血脑屏障入脑","碱中毒使肾小管排铵增多，血中的氨被大量地清除","碱中毒使 NH₃ 增多，脂溶性的氨更易透过血脑屏障","碱中毒使肠道细菌产氨增多，血氨的来源随之增加","碱中毒使尿素合成酶活性升高，消耗的氨随之增多"],"answer":2,"explain":"C 对：血氨以 NH₄⁺ 与 NH₃ 两种形式存在，二者互变受 pH 影响，碱中毒时平衡偏向生成脂溶性的 NH₃，氨更容易透过血脑屏障与细胞膜进入脑组织，因而加重昏迷。A 错：碱中毒时 NH₄⁺ 减少而非增多，且带电荷的铵离子不易透过脂质膜。B 错：碱中毒时肾小管排铵减少，氨的排出受阻，血氨反而升高。D 错：肠道细菌产氨主要取决于积血与蛋白质的多少，血液 pH 轻度升高并不会使其明显增加。E 错：碱中毒并不能提高尿素合成酶的活性，尿素合成受肝细胞数量与底物供给的限制。","type":"A1","group":"c14-03","kind":"mechanism","chs":[14,11,16],"vignette":"一名 58 岁男性，乙型肝炎后肝硬化 8 年，因呕血与黑便入院。入院 48 小时后出现嗜睡与扑翼样震颤。血氨 152 μmol/L（正常 18–72），动脉血 pH 7.49，空腹血糖 2.9 mmol/L，血乳酸 3.4 mmol/L，血尿素仅 1.8 mmol/L，血清白蛋白 26 g/L。医生分析，肠道内积血被细菌分解产氨增多，而肝细胞数量减少使鸟氨酸循环能力下降，氨不能像正常时那样在肝内合成尿素后排出；血中的氨以 NH₄⁺ 与 NH₃ 两种形式存在，二者的比例受血液 pH 影响。患者入院后未进食，肝糖原已近耗竭，肝糖异生能力也随肝细胞减少而下降。","vignette_title":"情景 3：肝硬化患者的一场消化道出血","gidx":2,"gn":5,"anchor":"二者的比例受血液 pH 影响"},{"id":"gc14-03-5","ch":14,"part":3,"tag":"判读","stem":"关于该患者血氨的来源、转运与处理，下列判断正确的是（X 型多选）","options":["肠道内积血被细菌分解，是血氨升高的重要来源","脑与肌肉中的氨可以谷氨酰胺形式运往肝和肾处理","血氨升高时禁用碱性肥皂水灌肠，以免加重中毒","氨在肝内只能经鸟氨酸循环合成尿素后随尿排出","肝硬化时肝细胞减少，尿素合成能力随之下降"],"answer":[0,1,2,4],"explain":"答案 ABCE。A 对：肠道积血被细菌分解产生大量氨，经门静脉入肝，是肝硬化患者血氨升高的重要来源。B 对：脑与肌肉中的氨主要与谷氨酸结合生成谷氨酰胺，以无毒形式经血液运往肝、肾处理，谷氨酰胺是氨的运输与储存形式。C 对：血氨以 NH₄⁺ 与 NH₃ 两种形式存在，碱性灌肠会使平衡偏向生成脂溶性的 NH₃，氨更易吸收并透过血脑屏障，故列为禁忌。E 对：肝硬化时肝细胞数量减少，尿素合成的酶系不足，氨的处理能力下降。D 错：氨的去路不止合成尿素，还可用于合成非必需氨基酸与谷氨酰胺，并可经肾小管以铵盐形式随尿排出，说成只能经鸟氨酸循环排出不成立。","type":"X","group":"c14-03","kind":"mechanism","chs":[14,11,16],"vignette":"一名 58 岁男性，乙型肝炎后肝硬化 8 年，因呕血与黑便入院。入院 48 小时后出现嗜睡与扑翼样震颤。血氨 152 μmol/L（正常 18–72），动脉血 pH 7.49，空腹血糖 2.9 mmol/L，血乳酸 3.4 mmol/L，血尿素仅 1.8 mmol/L，血清白蛋白 26 g/L。医生分析，肠道内积血被细菌分解产氨增多，而肝细胞数量减少使鸟氨酸循环能力下降，氨不能像正常时那样在肝内合成尿素后排出；血中的氨以 NH₄⁺ 与 NH₃ 两种形式存在，二者的比例受血液 pH 影响。患者入院后未进食，肝糖原已近耗竭，肝糖异生能力也随肝细胞减少而下降。","vignette_title":"情景 3：肝硬化患者的一场消化道出血","gidx":5,"gn":5,"anchor":"肠道内积血被细菌分解产氨增多"},{"id":"gc16-01-3","ch":14,"part":3,"tag":"机制","stem":"他每天摄入的蛋白质总量并不少，却仍出现胶原合成障碍，从氨基酸代谢看，其合理解释是","options":["饮食中缺少赖氨酸，胶原分子间的交联无法进行","饮食中缺少色氨酸，前α链在核糖体上无法合成","甘氨酸与脯氨酸可在体内合成，缺陷不在氨基酸供应","酪氨酸供应不足，脯氨酸的羟化反应缺少底物","谷氨酸供应不足，胶原分子的糖基化无法完成"],"answer":2,"explain":"C 对：甘氨酸与脯氨酸都能在体内合成，属营养非必需氨基酸，咸肉与饼干已能提供足够原料，因此缺陷不在氨基酸供应，而在羟化这一翻译后修饰环节。A 错在胶原分子间的交联由赖氨酰氧化酶催化，与饮食中赖氨酸的多少无关；B 错在前α链的合成需要各种氨基酸齐全，色氨酸缺乏不是本例的主要矛盾；D 错在羟化反应的底物是肽链中的脯氨酸残基，而不是酪氨酸；E 错在糖基化的连接点通常是天冬酰胺残基，与谷氨酸供应无关。","type":"A1","group":"c16-01","kind":"mechanism","chs":[23,1,14],"vignette":"一名24岁船员随船作业3个月，船上只有咸肉与饼干，几乎没有新鲜蔬菜水果。近两周他牙龈肿胀出血，下肢出现多处瘀斑，小腿上一处旧伤口的裂口迟迟不愈。检查：血小板计数208×10⁹/L，凝血酶原时间与部分凝血活酶时间正常；血浆抗坏血酸5 μmol/L，明显低于正常下限。胶原前α链在粗面内质网中合成，其脯氨酸与赖氨酸残基需要羟化，三股螺旋才能稳定；催化这一步的羟化酶以抗坏血酸为辅因子，抗坏血酸缺乏时羟化不足，前胶原的三股螺旋在体温下不稳定，难以正常分泌并装配成纤维。分泌到细胞外的前胶原还要切除两端前肽，再由赖氨酰氧化酶催化形成共价交联，胶原纤维才具有抗张强度。他每天摄入的蛋白质总量并不少，饮食中缺少的只是新鲜果蔬。","vignette_title":"情景 1：三个月没吃新鲜菜的船员","gidx":3,"gn":5,"anchor":"蛋白质总量并不少"},{"id":"gc24-01-1","ch":14,"part":3,"tag":"机制","stem":"SAM 分子上被转移的那个甲基，其直接来源是","options":["N5-甲基四氢叶酸上的甲基，由四氢叶酸直接交给各种受体","丝氨酸的羟甲基，经丝氨酸羟甲基转移酶转交给各种受体","磷酸吡哆醛携带的甲基，经转氨酶催化后交给各种受体","甲硫氨酸本身的甲基，与 ATP 反应生成 SAM 时被活化","腺苷上的甲基，经甲硫氨酸腺苷转移酶转移给各种受体"],"answer":3,"explain":"D 对：SAM 是甲硫氨酸与 ATP 反应的产物，甲硫氨酸腺苷转移酶把 ATP 的腺苷部分接到甲硫氨酸上，被转移的甲基就来自甲硫氨酸本身，甲基转出后 SAM 变成 SAH，与情景中「SAM 是体内甲基的直接供体」一致。A 错：N5-甲基四氢叶酸只把甲基交给同型半胱氨酸生成甲硫氨酸，是甲基的间接来源，不能直接交给各类受体。B 错：丝氨酸经丝氨酸羟甲基转移酶把羟甲基交给四氢叶酸生成一碳单位，并不直接把甲基交给甲基受体。C 错：磷酸吡哆醛是转氨酶与脱羧酶的辅酶，不携带可转移的甲基。E 错：腺苷提供的是 SAM 分子中的腺苷部分，被转出的甲基来自甲硫氨酸的甲硫基。","type":"A1","group":"c24-01","kind":"mechanism","chs":[14,15,11],"vignette":"肝细胞内甲硫氨酸的周转很快：甲硫氨酸腺苷转移酶消耗 1 分子 ATP，把甲硫氨酸变成 S-腺苷甲硫氨酸（SAM），SAM 是体内甲基的直接供体，把甲基交给受体后变成 S-腺苷同型半胱氨酸（SAH），SAH 再水解为同型半胱氨酸与腺苷。这些受体包括胍乙酸（接受甲基后生成肌酸）、去甲肾上腺素（接受甲基后生成肾上腺素）与 DNA 上的胞嘧啶。SAH 对多种甲基转移酶有强烈的抑制作用，SAM 与 SAH 的比值因此决定甲基化反应的实际速率。同型半胱氨酸要再获得甲基变回甲硫氨酸，只能接受 N5-甲基四氢叶酸提供的甲基，这一步由甲硫氨酸合酶催化，维生素 B12 是其辅酶；甲硫氨酸属必需氨基酸，该患者长期蛋白质摄入不足。检测结果：血浆甲硫氨酸 8 μmol/L，肝细胞内 SAM 与 SAH 的比值由 15 降到 1.8，血浆同型半胱氨酸 26 μmol/L，24 小时尿肌酐排出量比同龄人低 40%。","vignette_title":"情景 1：一份甲基的进项与出项","gidx":1,"gn":5,"anchor":"把甲硫氨酸变成 S-腺苷甲硫氨酸"},{"id":"gc24-01-2","ch":14,"part":3,"tag":"机制","stem":"该患者肝细胞内 SAM 与 SAH 的比值由 15 降到 1.8，对甲基化反应的影响是","options":["甲基的供应量成倍增加，各种甲基化反应的速率随之升高","SAH 堆积后抑制甲基转移酶，甲基化反应的速率随之下降","甲硫氨酸的合成速度加快，把 SAM 的浓度恢复到正常水平","同型半胱氨酸被大量转变为胱硫醚，甲基转移酶抑制被解除","腺苷堆积使甲硫氨酸腺苷转移酶活性升高，SAM 生成增多"],"answer":1,"explain":"B 对：SAM 减少而 SAH 堆积使二者的比值下降，SAH 对多种甲基转移酶有强烈的抑制作用，实际甲基化速率随之降低，故比值而不是 SAM 的绝对量决定转甲基反应快慢。A 错：比值下降意味着可用甲基减少，速率应下降而不是升高。C 错：甲硫氨酸属必需氨基酸，患者蛋白质摄入不足，其合成不会代偿性加快到恢复正常。D 错：转变成胱硫醚是同型半胱氨酸的分解去路，它不会解除 SAH 对甲基转移酶的抑制。E 错：腺苷是 SAH 水解的产物，没有依据表明它能使甲硫氨酸腺苷转移酶活性升高。","type":"A1","group":"c24-01","kind":"mechanism","chs":[14,15,11],"vignette":"肝细胞内甲硫氨酸的周转很快：甲硫氨酸腺苷转移酶消耗 1 分子 ATP，把甲硫氨酸变成 S-腺苷甲硫氨酸（SAM），SAM 是体内甲基的直接供体，把甲基交给受体后变成 S-腺苷同型半胱氨酸（SAH），SAH 再水解为同型半胱氨酸与腺苷。这些受体包括胍乙酸（接受甲基后生成肌酸）、去甲肾上腺素（接受甲基后生成肾上腺素）与 DNA 上的胞嘧啶。SAH 对多种甲基转移酶有强烈的抑制作用，SAM 与 SAH 的比值因此决定甲基化反应的实际速率。同型半胱氨酸要再获得甲基变回甲硫氨酸，只能接受 N5-甲基四氢叶酸提供的甲基，这一步由甲硫氨酸合酶催化，维生素 B12 是其辅酶；甲硫氨酸属必需氨基酸，该患者长期蛋白质摄入不足。检测结果：血浆甲硫氨酸 8 μmol/L，肝细胞内 SAM 与 SAH 的比值由 15 降到 1.8，血浆同型半胱氨酸 26 μmol/L，24 小时尿肌酐排出量比同龄人低 40%。","vignette_title":"情景 1：一份甲基的进项与出项","gidx":2,"gn":5,"anchor":"SAH 对多种甲基转移酶有强烈的抑制作用"},{"id":"gc24-01-3","ch":14,"part":3,"tag":"判读","stem":"该患者 24 小时尿肌酐排出量比同龄人低 40%，最合理的解释是","options":["肌酸由甘氨酸与精氨酸缩合直接生成，不需要接受甲基","肌肉中磷酸肌酸的分解加快，肌酸大量转变为肌酐而排出","肌酸由胍乙酸接受 SAM 的甲基生成，甲基不足使合成减少","肾小球滤过率下降，肌酐不能正常滤过而滞留在血液当中","尿肌酐来自肌酸的分解，排出减少说明肌肉总量明显减小"],"answer":2,"explain":"C 对：肌酸由胍乙酸接受 SAM 提供的甲基生成，肌酸再脱水成为肌酐随尿排出；SAM 不足使肌酸合成减少，尿中肌酐因而低于同龄人，这与甲基账目出项受限相符。A 错：甘氨酸与精氨酸缩合生成的是胍乙酸，还须再接受一个甲基才能成为肌酸。B 错：磷酸肌酸分解加快会使肌酐排出增多，与实测降低相反。D 错：滤过率下降时血中肌酐升高而尿中减少，但本例给出的是一份甲基供体不足的代谢图景。E 错：尿肌酐确与肌肉总量相关，但短期内肌肉总量不会下降四成，情景给出的关键在于甲基转移受阻。","type":"A1","group":"c24-01","kind":"mechanism","chs":[14,15,11],"vignette":"肝细胞内甲硫氨酸的周转很快：甲硫氨酸腺苷转移酶消耗 1 分子 ATP，把甲硫氨酸变成 S-腺苷甲硫氨酸（SAM），SAM 是体内甲基的直接供体，把甲基交给受体后变成 S-腺苷同型半胱氨酸（SAH），SAH 再水解为同型半胱氨酸与腺苷。这些受体包括胍乙酸（接受甲基后生成肌酸）、去甲肾上腺素（接受甲基后生成肾上腺素）与 DNA 上的胞嘧啶。SAH 对多种甲基转移酶有强烈的抑制作用，SAM 与 SAH 的比值因此决定甲基化反应的实际速率。同型半胱氨酸要再获得甲基变回甲硫氨酸，只能接受 N5-甲基四氢叶酸提供的甲基，这一步由甲硫氨酸合酶催化，维生素 B12 是其辅酶；甲硫氨酸属必需氨基酸，该患者长期蛋白质摄入不足。检测结果：血浆甲硫氨酸 8 μmol/L，肝细胞内 SAM 与 SAH 的比值由 15 降到 1.8，血浆同型半胱氨酸 26 μmol/L，24 小时尿肌酐排出量比同龄人低 40%。","vignette_title":"情景 1：一份甲基的进项与出项","gidx":3,"gn":5,"anchor":"24 小时尿肌酐排出量比同龄人低 40%"},{"id":"gc24-02-1","ch":14,"part":3,"tag":"机制","stem":"谷氨酰胺酶催化谷氨酰胺水解，该反应释放的氮与生成的产物是","options":["释放 α-氨基，生成 α-酮戊二酸与游离氨","释放酰胺氮，生成谷氨酸与游离氨","释放酰胺氮，生成 α-酮戊二酸与尿素","释放 α-氨基，生成谷氨酸与天冬酰胺","释放酰胺氮，生成天冬氨酸与游离氨"],"answer":1,"explain":"B 对：谷氨酰胺酶只水解侧链上的酰胺基，把酰胺氮以游离氨的形式释放，碳骨架与 α-氨基都留在分子内，产物是谷氨酸，这一步既是谷氨酰胺为核苷酸合成供氮的起点，也是它充当氨的无毒运输形式的原因。A 错：α-氨基保留在谷氨酸中，生成 α-酮戊二酸要再经谷氨酸脱氢酶催化的氧化脱氨基作用。C 错：水解的产物是谷氨酸而不是 α-酮戊二酸，更不生成尿素。D 错：天冬酰胺由天冬氨酸与谷氨酰胺反应生成，谷氨酰胺水解不能得到它。E 错：谷氨酰胺水解时释放的是酰胺氮，天冬氨酸由草酰乙酸经转氨基作用生成，与水解释放氮的步骤不是同一个反应。","type":"A1","group":"c24-02","kind":"mechanism","chs":[14,15,11],"vignette":"丝裂原刺激后的一株人淋巴细胞进入快速增殖：24 小时内培养基中的谷氨酰胺由 2.0 mmol/L 降到 0.3 mmol/L，葡萄糖由 11.0 mmol/L 降到 9.9 mmol/L，前者的消耗速率约为后者的 1.5 倍。细胞内谷氨酰胺酶活性升到静息细胞的 5 倍，谷氨酸脱氢酶活性升高 3 倍。撤除培养基中的谷氨酰胺后，细胞内 α-酮戊二酸由 1.2 降到 0.2 nmol/mg 蛋白，天冬氨酸由 4.5 降到 1.1，嘌呤与嘧啶核苷酸的合成速率同步降到原来的三成。谷氨酰胺在血浆中浓度最高，是氨的无毒运输形式。谷氨酰胺酶水解其侧链酰胺基，释放出酰胺氮并生成谷氨酸；谷氨酸既可经氧化脱氨基作用变成 α-酮戊二酸，也可把氨基交给草酰乙酸生成天冬氨酸。谷氨酰胺的酰胺氮进入核苷酸环，其碳骨架则经 α-酮戊二酸进入三羧酸循环。","vignette_title":"情景 2：增殖细胞的两笔原料账","gidx":1,"gn":5,"anchor":"谷氨酰胺酶水解其侧链酰胺基"},{"id":"gc24-02-2","ch":14,"part":3,"tag":"机制","stem":"细胞内谷氨酸脱氢酶活性升高 3 倍，该酶催化的反应为增殖细胞提供的是","options":["谷氨酸的碳骨架转变为 α-酮戊二酸，可进入三羧酸循环","α-酮戊二酸与游离氨合成谷氨酸，用于蛋白质的合成","谷氨酸的氨基转给草酰乙酸，生成天冬氨酸与丙酮酸","谷氨酰胺直接氧化为草酰乙酸，以回补三羧酸循环中间物","谷氨酸的氨基转给丙酮酸，生成丙氨酸与草酰乙酸"],"answer":0,"explain":"A 对：谷氨酸脱氢酶催化谷氨酸氧化脱氨基，脱下氨基的同时把碳骨架变成 α-酮戊二酸，后者是三羧酸循环的中间物，既能氧化供能，又能回补循环，为增殖细胞补上被抽走的中间物。B 错：该酶催化的方向在本例是脱氨而非合成，把方向写成由 α-酮戊二酸与氨合成谷氨酸与实测活性升高的意义不符。C 错：把氨基转给草酰乙酸生成天冬氨酸由转氨酶催化，其产物是 α-酮戊二酸而不是丙酮酸，酶与产物都写错了。D 错：谷氨酰胺不能直接氧化为草酰乙酸，要先水解为谷氨酸、再脱氨生成 α-酮戊二酸。E 错：把氨基转给丙酮酸生成丙氨酸由丙氨酸转氨酶催化，其产物是丙氨酸与 α-酮戊二酸而不是草酰乙酸，与本例要考的谷氨酸脱氢酶反应方向不同。","type":"A1","group":"c24-02","kind":"mechanism","chs":[14,15,11],"vignette":"丝裂原刺激后的一株人淋巴细胞进入快速增殖：24 小时内培养基中的谷氨酰胺由 2.0 mmol/L 降到 0.3 mmol/L，葡萄糖由 11.0 mmol/L 降到 9.9 mmol/L，前者的消耗速率约为后者的 1.5 倍。细胞内谷氨酰胺酶活性升到静息细胞的 5 倍，谷氨酸脱氢酶活性升高 3 倍。撤除培养基中的谷氨酰胺后，细胞内 α-酮戊二酸由 1.2 降到 0.2 nmol/mg 蛋白，天冬氨酸由 4.5 降到 1.1，嘌呤与嘧啶核苷酸的合成速率同步降到原来的三成。谷氨酰胺在血浆中浓度最高，是氨的无毒运输形式。谷氨酰胺酶水解其侧链酰胺基，释放出酰胺氮并生成谷氨酸；谷氨酸既可经氧化脱氨基作用变成 α-酮戊二酸，也可把氨基交给草酰乙酸生成天冬氨酸。谷氨酰胺的酰胺氮进入核苷酸环，其碳骨架则经 α-酮戊二酸进入三羧酸循环。","vignette_title":"情景 2：增殖细胞的两笔原料账","gidx":2,"gn":5,"anchor":"谷氨酸脱氢酶活性升高 3 倍"},{"id":"gc24-03-4","ch":14,"part":3,"tag":"机制","stem":"丝氨酸把羟甲基交给四氢叶酸后，剩下的碳骨架成为甘氨酸，甘氨酸进入嘌呤环时提供的是","options":["C2 与 C8 两个碳原子，来自其羟甲基的转移反应","N1 与 N3 两个氮原子，来自其氨基的转移反应","C6 一个碳原子，来自其羧基的脱羧反应","C4、C5 与 N7 三个原子，来自其碳链与氨基","N9 一个氮原子，来自其氨基的转移反应"],"answer":3,"explain":"D 对：甘氨酸以其整个分子参与嘌呤环的装配，提供 C4、C5 两个碳原子与 N7 一个氮原子，其来源正是糖酵解中间产物经丝氨酸转来的碳骨架，这条支路把糖代谢与核苷酸合成连在一起。A 错：C2 与 C8 由一碳单位提供，它们来自四氢叶酸类辅酶携带的甲酰基与甲炔基，不由甘氨酸的羟甲基直接供给。B 错：N1 由天冬氨酸提供，N3 与 N9 由谷氨酰胺的酰胺氮提供。C 错：C6 由二氧化碳提供，甘氨酸的羧基不直接进入该位置。E 错：N9 来自谷氨酰胺的酰胺氮，甘氨酸贡献的是 N7。","type":"A1","group":"c24-03","kind":"mechanism","chs":[11,15,14],"vignette":"快速增殖的细胞并不让葡萄糖走完糖酵解：一部分葡糖-6-磷酸进入磷酸戊糖途径，生成 5-磷酸核糖与 NADPH；该途径的非氧化阶段由转酮醇酶与转醛醇酶催化碳单位的重排，把糖酵解的中间产物果糖-6-磷酸与 3-磷酸甘油醛也转回 5-磷酸核糖，转酮醇酶以焦磷酸硫胺素为辅酶。5-磷酸核糖与 ATP 反应生成磷酸核糖焦磷酸（PRPP），这是嘌呤与嘧啶核苷酸从头合成的共同起点。第二条支路的起点是糖酵解中间产物 3-磷酸甘油酸，它经三步反应生成丝氨酸；丝氨酸把羟甲基交给四氢叶酸，自身剩下的碳骨架成为甘氨酸，甘氨酸与一碳单位分别进入嘌呤环的不同位置。第三条支路的起点是丙酮酸，它经丙酮酸羧化酶生成草酰乙酸，后者接受谷氨酸的氨基成为天冬氨酸。一位以精制糖为主食并长期嗜酒的男性，红细胞转酮醇酶活性为正常的 45%，加入焦磷酸硫胺素后恢复到 90%，其外周血淋巴细胞在丝裂原刺激后的增殖反应明显低于对照。","vignette_title":"情景 3：一条葡萄糖的三个分岔口","gidx":4,"gn":5,"anchor":"自身剩下的碳骨架成为甘氨酸"},{"id":"gc24-03-5","ch":14,"part":3,"tag":"判读","stem":"关于糖代谢中间产物向核苷酸与氨基酸合成的分流，下列判断正确的是（X 型多选）","options":["葡糖-6-磷酸经磷酸戊糖途径生成 5-磷酸核糖，为核苷酸提供原料","丙酮酸羧化生成的草酰乙酸，可进入三羧酸循环或转变为天冬氨酸","丙酮酸羧化酶催化丙酮酸羧化为草酰乙酸，反应在线粒体中进行","丝氨酸的碳骨架来自糖酵解中间产物 3-磷酸甘油酸，可供一碳单位","糖酵解的中间产物用于产生 ATP，不参与核苷酸与氨基酸的合成"],"answer":[0,1,2,3],"explain":"答案 ABCD。A 对：葡糖-6-磷酸进入磷酸戊糖途径生成 5-磷酸核糖，后者经 PRPP 成为嘌呤与嘧啶核苷酸从头合成的共同起点。B 对：丙酮酸羧化生成的草酰乙酸既可进入三羧酸循环，也可经转氨基作用接受谷氨酸的氨基成为天冬氨酸，为核苷酸提供氮源。C 对：丙酮酸羧化酶催化丙酮酸羧化为草酰乙酸，该反应在线粒体中进行，是回补三羧酸循环中间物的关键一步。D 对：丝氨酸的碳骨架来自糖酵解中间产物 3-磷酸甘油酸，它把羟甲基交给四氢叶酸后成为一碳单位的来源。E 错：糖酵解的中间产物正是核苷酸与氨基酸合成的原料，3-磷酸甘油酸的走向即为反例，把糖代谢与这两条合成途径割裂开与情景不符。","type":"X","group":"c24-03","kind":"mechanism","chs":[11,15,14],"vignette":"快速增殖的细胞并不让葡萄糖走完糖酵解：一部分葡糖-6-磷酸进入磷酸戊糖途径，生成 5-磷酸核糖与 NADPH；该途径的非氧化阶段由转酮醇酶与转醛醇酶催化碳单位的重排，把糖酵解的中间产物果糖-6-磷酸与 3-磷酸甘油醛也转回 5-磷酸核糖，转酮醇酶以焦磷酸硫胺素为辅酶。5-磷酸核糖与 ATP 反应生成磷酸核糖焦磷酸（PRPP），这是嘌呤与嘧啶核苷酸从头合成的共同起点。第二条支路的起点是糖酵解中间产物 3-磷酸甘油酸，它经三步反应生成丝氨酸；丝氨酸把羟甲基交给四氢叶酸，自身剩下的碳骨架成为甘氨酸，甘氨酸与一碳单位分别进入嘌呤环的不同位置。第三条支路的起点是丙酮酸，它经丙酮酸羧化酶生成草酰乙酸，后者接受谷氨酸的氨基成为天冬氨酸。一位以精制糖为主食并长期嗜酒的男性，红细胞转酮醇酶活性为正常的 45%，加入焦磷酸硫胺素后恢复到 90%，其外周血淋巴细胞在丝裂原刺激后的增殖反应明显低于对照。","vignette_title":"情景 3：一条葡萄糖的三个分岔口","gidx":5,"gn":5,"anchor":"后者接受谷氨酸的氨基成为天冬氨酸"},{"id":"gc24-04-3","ch":14,"part":3,"tag":"判读","stem":"以 ¹⁵N 标记的甘氨酸孵育时标记进入嘌呤核苷酸而在嘧啶核苷酸中检不出，说明","options":["甘氨酸先转变为丝氨酸，再由丝氨酸参与嘧啶环的合成","甘氨酸在补救合成中被利用，从头合成并不利用甘氨酸","甘氨酸的氨基经转氨基作用生成天冬氨酸后进入嘌呤环","甘氨酸以其氨基参与嘌呤环的装配，不参与嘧啶环的合成","甘氨酸以整个分子掺入嘌呤环，同时为嘧啶环提供氮原子"],"answer":3,"explain":"D 对：甘氨酸以整个分子参与嘌呤环的装配，其中的氨基成为 N7，故标记只出现在嘌呤核苷酸中；嘧啶环的三个供体是谷氨酰胺、二氧化碳与天冬氨酸，甘氨酸不参与其装配，因此嘧啶核苷酸中检不出标记，这与情景给出的结果一致。A 错：甘氨酸与丝氨酸可以互变，但丝氨酸也不为嘧啶环提供氮原子，转变成丝氨酸不能解释标记去向。B 错：甘氨酸是嘌呤从头合成的原料之一，并非只在补救合成中起作用。C 错：甘氨酸的氨基直接进入嘌呤环的 N7，不必先转变为天冬氨酸。E 错：甘氨酸根本不参与嘧啶环的装配，这条判断与实验结果相反。","type":"A1","group":"c24-04","kind":"experiment","chs":[15,11,14],"vignette":"为定位一株人白血病细胞系核苷酸合成受阻的环节，研究生在含 11.0 mmol/L 葡萄糖与 2.0 mmol/L 谷氨酰胺的培养基中做了三组测定，各样品的细胞数已配平。第一组测细胞内代谢物浓度，单位 nmol/mg 蛋白：5-磷酸核糖 0.90（对照 0.90），PRPP 0.05（对照 0.40），α-酮戊二酸 1.2（对照 1.2），天冬氨酸 4.4（对照 4.5）。第二组测酶活性，以对照的百分比表示：PRPP 合成酶 8，葡糖-6-磷酸脱氢酶 96，天冬氨酸转氨酶 101，丝氨酸羟甲基转移酶 99。第三组以 ¹⁴C 标记的葡萄糖孵育 3 小时：细胞内 5-磷酸核糖的放射性比活与对照接近，腺苷酸与尿苷酸的放射性比活降到对照的 10% 以下。补充实验：培养基中加入 0.1 mmol/L 次黄嘌呤 24 小时后，细胞内的腺苷酸含量与增殖速率都没有恢复；另以 ¹⁵N 标记的甘氨酸孵育时，标记进入嘌呤核苷酸而在嘧啶核苷酸中检不出；改以 ¹⁵N 标记的天冬氨酸孵育，嘌呤与嘧啶核苷酸中都可检出标记。","vignette_title":"情景 4：三项指标共同指向的分流点","gidx":3,"gn":5,"anchor":"在嘧啶核苷酸中检不出"},{"id":"gc24-04-4","ch":14,"part":3,"tag":"判读","stem":"以 ¹⁵N 标记的天冬氨酸孵育时，嘌呤与嘧啶核苷酸中都可检出标记，说明","options":["天冬氨酸提供嘌呤环的 N1 与嘧啶环的 N1，是两个环的共同氮源","天冬氨酸提供嘌呤环的 N3 与 N9，嘧啶环的氮原子另有来源","天冬氨酸先转变为谷氨酰胺，再由谷氨酰胺为两个环提供酰胺氮","天冬氨酸的碳骨架进入两个环，其氨基并不参与环的装配","天冬氨酸经脱氨基作用释放游离氨，游离氨再进入两个环中"],"answer":0,"explain":"A 对：天冬氨酸的氨基分别进入嘌呤环的 N1 与嘧啶环的 N1，因此它同时为两类核苷酸供氮，标记在两个环中都出现，这与同一实验中甘氨酸只标记嘌呤的结果正好互为对照，说明各供体的分工是专一的。B 错：N3 与 N9 由谷氨酰胺的酰胺氮提供，天冬氨酸不负责这两个位置。C 错：天冬氨酸不能转变为谷氨酰胺，两者的氮在代谢中各有来源。D 错：进入环的正是天冬氨酸的氨基，其碳骨架有一部分进入嘧啶环的 C4、C5、C6，但不能据此否定氨基的去向。E 错：游离氨不能直接进入嘌呤环与嘧啶环的装配，成环所需的氮以氨基酸或酰胺的形式提供。","type":"A1","group":"c24-04","kind":"experiment","chs":[15,11,14],"vignette":"为定位一株人白血病细胞系核苷酸合成受阻的环节，研究生在含 11.0 mmol/L 葡萄糖与 2.0 mmol/L 谷氨酰胺的培养基中做了三组测定，各样品的细胞数已配平。第一组测细胞内代谢物浓度，单位 nmol/mg 蛋白：5-磷酸核糖 0.90（对照 0.90），PRPP 0.05（对照 0.40），α-酮戊二酸 1.2（对照 1.2），天冬氨酸 4.4（对照 4.5）。第二组测酶活性，以对照的百分比表示：PRPP 合成酶 8，葡糖-6-磷酸脱氢酶 96，天冬氨酸转氨酶 101，丝氨酸羟甲基转移酶 99。第三组以 ¹⁴C 标记的葡萄糖孵育 3 小时：细胞内 5-磷酸核糖的放射性比活与对照接近，腺苷酸与尿苷酸的放射性比活降到对照的 10% 以下。补充实验：培养基中加入 0.1 mmol/L 次黄嘌呤 24 小时后，细胞内的腺苷酸含量与增殖速率都没有恢复；另以 ¹⁵N 标记的甘氨酸孵育时，标记进入嘌呤核苷酸而在嘧啶核苷酸中检不出；改以 ¹⁵N 标记的天冬氨酸孵育，嘌呤与嘧啶核苷酸中都可检出标记。","vignette_title":"情景 4：三项指标共同指向的分流点","gidx":4,"gn":5,"anchor":"嘌呤与嘧啶核苷酸中都可检出标记"},{"id":"gc3-02-3","ch":14,"part":3,"tag":"机制","stem":"肌肉把氨交给丙酮酸生成丙氨酸再运往肝，该过程属于","options":["氧化脱氨基作用，由谷氨酸脱氢酶催化完成","尿素合成反应，在肌肉内直接生成尿素","嘌呤核苷酸循环，在肌肉中释放出游离氨","联合脱氨基作用，由转氨与氧化脱氨偶联","转氨基作用，由转氨酶催化且不产生游离氨"],"answer":4,"explain":"E 对：丙氨酸由丙酮酸接受氨基生成，催化该反应的转氨酶以磷酸吡哆醛为辅酶，转氨基作用本身不产生游离氨，氨因此以无毒形式运往肝，即丙氨酸-葡萄糖循环。A 错：氧化脱氨基由谷氨酸脱氢酶催化，是肝、肾中释放游离氨的步骤，与肌肉输出氨的形式不同。D 错：联合脱氨基是转氨与氧化脱氨的偶联，主要在肝、肾进行。C 错：嘌呤核苷酸循环是肌肉脱氨基的方式之一，但其产物不是丙氨酸。B 错：尿素只在肝内合成，肌肉不合成尿素。","type":"A1","group":"c3-02","kind":"mechanism","chs":[11,14,16],"vignette":"禁食 16 小时后，血糖仍维持在 4.5 mmol/L 左右，而肝糖原由 70 g 降至约 20 g，尿中尿素排出量比餐后增加近一倍。此时骨骼肌蛋白质分解加强，氨经转氨基作用交给丙酮酸生成丙氨酸，随血液运至肝；肝把丙氨酸脱氨后，氨进入鸟氨酸循环合成尿素，剩下的丙酮酸成为糖异生的原料。肝细胞内丙酮酸羧化酶与磷酸烯醇式丙酮酸羧激酶活性明显升高，乳酸、甘油和生糖氨基酸成为血糖的主要来源。血浆游离脂肪酸虽然明显升高，但它并不能大量转变为葡萄糖。","vignette_title":"情景 2：禁食十六小时，血糖从哪里来","gidx":3,"gn":5,"anchor":"氨经转氨基作用交给丙酮酸生成丙氨酸"},{"id":"gc3-02-5","ch":14,"part":3,"tag":"机制","stem":"关于禁食时血糖的来源与氨的转运，下列判断正确的是（X 型多选）","options":["肌肉把氨转给丙酮酸生成丙氨酸运往肝","脂肪动员产生的甘油在脂肪细胞内即可异生为葡萄糖","肝内丙酮酸羧化酶与磷酸烯醇式丙酮酸羧激酶活性升高","尿素合成所需的氨基甲酰磷酸由线粒体的 CPS-Ⅰ 催化","肝糖原减少后，肝糖异生成为血糖的主要来源"],"answer":[0,2,3,4],"explain":"答案 ACDE。A、C、D、E 分别对应情景中肝糖原减少后糖异生成为主要来源、肌肉以丙氨酸形式转运氨、糖异生关键酶活性升高以及尿素合成由线粒体氨基甲酰磷酸合成酶Ⅰ催化。B 错：脂肪细胞缺乏甘油激酶，脂肪动员释放的甘油必须经血液运至肝、肾，先磷酸化为 3-磷酸甘油再脱氢生成磷酸二羟丙酮，才能进入糖异生，不能在脂肪细胞内直接异生为葡萄糖。","type":"X","group":"c3-02","kind":"mechanism","chs":[11,14,16],"vignette":"禁食 16 小时后，血糖仍维持在 4.5 mmol/L 左右，而肝糖原由 70 g 降至约 20 g，尿中尿素排出量比餐后增加近一倍。此时骨骼肌蛋白质分解加强，氨经转氨基作用交给丙酮酸生成丙氨酸，随血液运至肝；肝把丙氨酸脱氨后，氨进入鸟氨酸循环合成尿素，剩下的丙酮酸成为糖异生的原料。肝细胞内丙酮酸羧化酶与磷酸烯醇式丙酮酸羧激酶活性明显升高，乳酸、甘油和生糖氨基酸成为血糖的主要来源。血浆游离脂肪酸虽然明显升高，但它并不能大量转变为葡萄糖。","vignette_title":"情景 2：禁食十六小时，血糖从哪里来","gidx":5,"gn":5,"anchor":"氨进入鸟氨酸循环合成尿素"},{"ch":14,"part":3,"tag":"必需氨基酸","stem":"下列各组氨基酸中，全部属于人体必需氨基酸的是","options":["甘氨酸、丙氨酸、丝氨酸","谷氨酸、天冬氨酸、精氨酸","亮氨酸、赖氨酸、色氨酸","半胱氨酸、酪氨酸、脯氨酸","丝氨酸、苏氨酸、组氨酸"],"answer":2,"explain":"人体必需氨基酸共9种，包括亮氨酸、赖氨酸、色氨酸等；丝氨酸、谷氨酸、天冬氨酸、脯氨酸可在体内合成，属营养非必需。","type":"A1","id":"c14-9fe2b691"},{"ch":14,"part":3,"tag":"联合脱氨基","stem":"关于体内氨基酸脱氨基作用的叙述，正确的是","options":["联合脱氨基作用由转氨基作用和L-谷氨酸氧化脱氨基作用组成，是脱氨基的主要方式","转氨基作用可释放游离氨，是体内氨的主要来源","转氨酶的辅酶是NAD+，其所催化的反应不可逆","联合脱氨基作用只发生在肝细胞线粒体内","嘌呤核苷酸循环是肝内脱氨基的唯一方式"],"answer":0,"explain":"联合脱氨基作用是体内脱氨基的主要方式，即先转氨生成谷氨酸再由L-谷氨酸脱氢酶氧化脱氨；转氨酶以磷酸吡哆醛为辅酶，转氨本身不产生游离氨。","type":"A1","id":"c14-63f9574f"},{"ch":14,"part":3,"tag":"尿素循环","stem":"关于尿素合成（鸟氨酸循环）的叙述，正确的是","options":["鸟氨酸循环的全过程都在肝细胞胞液中进行","尿素分子中的两个氮原子均直接来自游离氨","氨基甲酰磷酸合成酶Ⅰ（CPS-Ⅰ）位于肝细胞线粒体，需N-乙酰谷氨酸变构激活","精氨酸代琥珀酸裂解酶是尿素合成的限速酶","尿素合成增强可使血氨升高并导致肝性脑病"],"answer":2,"explain":"氨基甲酰磷酸合成酶Ⅰ位于肝细胞线粒体、需N-乙酰谷氨酸变构激活；尿素两个氮分别来自氨和天冬氨酸，且全过程跨越线粒体与胞液。","type":"A1","id":"c14-50740ee6"},{"ch":14,"part":3,"tag":"高血氨处理","stem":"对高血氨患者禁用碱性肥皂水灌肠、也不宜使用碱性利尿剂，其生化依据是","options":["碱性药物直接抑制肝内鸟氨酸循环的酶活性","碱性环境使NH4+转变为NH3增多，氨易透过血脑屏障入脑而加重昏迷","碱性环境使血氨全部转变为尿素，加重肝负担","碱性药物促进肠道细菌腐败作用，使血氨进一步升高","碱中毒使尿素排出减少，血氨随之升高"],"answer":1,"explain":"NH3与NH4+的互变受pH影响，碱化使平衡偏向生成脂溶性的NH3，氨更易透过血脑屏障和细胞膜入脑，加重氨中毒。","type":"A1","id":"c14-95781005"},{"ch":14,"part":3,"tag":"一碳单位","stem":"关于一碳单位代谢的叙述，正确的是","options":["一碳单位由S-腺苷甲硫氨酸（SAM）携带和转运","CO2是一碳单位的主要存在形式","一碳单位只能由丝氨酸分解提供","一碳单位直接提供嘌呤环的C4、C5和N7","一碳单位由四氢叶酸（FH4）携带，主要来自丝氨酸、甘氨酸、组氨酸和色氨酸"],"answer":4,"explain":"一碳单位（甲基、甲烯基、甲炔基、甲酰基等）由FH4携带转运，主要来自丝氨酸、甘氨酸、组氨酸、色氨酸的分解；CO2不属一碳单位，嘌呤C4、C5、N7由甘氨酸提供。","type":"A1","id":"c14-bd96c99b"},{"ch":14,"part":3,"tag":"含硫氨基酸","stem":"关于含硫氨基酸代谢的叙述，正确的是","options":["半胱氨酸是必需氨基酸，只能由甲硫氨酸转变生成","同型半胱氨酸直接接受四氢叶酸提供的甲基生成甲硫氨酸","S-腺苷甲硫氨酸（SAM）是体内最重要的甲基直接供体，由甲硫氨酸与ATP反应生成","半胱氨酸经脱羧生成的PAPS是体内活性硫酸根的供体","牛磺酸由甲硫氨酸直接脱羧生成"],"answer":2,"explain":"甲硫氨酸与ATP反应生成SAM，SAM是体内最主要的甲基直接供体；同型半胱氨酸的甲基由N5-甲基四氢叶酸（需维生素B12）提供，PAPS和牛磺酸均来自半胱氨酸。","type":"A1","id":"c14-739f0e08"},{"ch":14,"part":3,"tag":"苯丙酮尿症","stem":"苯丙酮尿症（PKU）发病的生化基础是","options":["肝内苯丙氨酸羟化酶先天缺陷，苯丙氨酸不能正常转变为酪氨酸","酪氨酸酶先天缺陷，黑色素合成障碍","尿黑酸氧化酶缺陷，尿黑酸不能进一步分解","甲硫氨酸循环障碍，同型半胱氨酸堆积","支链α-酮酸脱氢酶复合体缺陷"],"answer":0,"explain":"PKU因肝苯丙氨酸羟化酶（辅酶为四氢生物蝶呤）缺陷，苯丙氨酸转为酪氨酸受阻，血中苯丙氨酸升高并经转氨生成苯丙酮酸从尿排出；酪氨酸酶缺陷引起白化病。","type":"A1","id":"c14-65090ce7"},{"ch":14,"part":3,"tag":"氨基酸脱羧","stem":"下列氨基酸与其脱羧产物（胺类）的配对，正确的是","options":["谷氨酸——组胺","组氨酸——γ-氨基丁酸（GABA）","鸟氨酸——5-羟色胺","色氨酸——5-羟色胺","半胱氨酸——多胺（腐胺）"],"answer":3,"explain":"色氨酸经羟化、脱羧生成5-羟色胺；谷氨酸脱羧生成GABA，组氨酸脱羧生成组胺，鸟氨酸脱羧生成腐胺（多胺）。","type":"A1","id":"c14-b1d25c3a"},{"ch":14,"part":3,"tag":"蛋白质互补作用","stem":"将谷类食物与豆类食物混合食用能提高蛋白质的营养价值，其生化依据是","options":["混合后食物蛋白质总量增加，供能增多","谷类蛋白质含赖氨酸较少而豆类蛋白质含赖氨酸丰富，混合食用使必需氨基酸取长补短、比例更接近人体需要","豆类蛋白质能促进谷类蛋白质在肠道内被直接吸收","混合食用可减少蛋白质的腐败作用，使尿素合成减少","混合食用后蛋白质的消化产物可全部转变为必需氨基酸"],"answer":1,"explain":"不同食物蛋白质的必需氨基酸种类与数量不同，谷类赖氨酸不足、豆类赖氨酸丰富，混合食用可互相补充，即蛋白质的互补作用。","type":"A1","id":"c14-97e9432e"},{"ch":14,"part":3,"tag":"腐败作用","stem":"关于蛋白质腐败作用的叙述，正确的是","options":["腐败作用主要在小肠上段由黏膜细胞完成","腐败作用的产物只有氨，对机体无其他影响","腐败作用产生的胺类全部在肠道内被分解，不会进入体内","腐败作用增强时，肠道内氨基酸的分解产物减少","未消化吸收的蛋白质和氨基酸在大肠下段受细菌作用而腐败，可产生胺、氨、苯酚、吲哚等有害物质"],"answer":4,"explain":"腐败作用是大肠下段细菌对未被吸收的蛋白质及氨基酸的分解，产物包括胺、氨、苯酚、吲哚、硫化氢等，多数有毒，需经肝生物转化解毒。","type":"A1","id":"c14-f086a785"},{"ch":14,"part":3,"tag":"转氨酶临床意义","stem":"关于转氨酶及其临床意义的叙述，正确的是","options":["丙氨酸转氨酶（ALT）催化丙氨酸与 α-酮戊二酸之间的转氨基反应，肝细胞损伤时血清 ALT 明显升高","转氨酶直接催化氨基酸氧化脱氨生成游离氨，故其活性升高可使血氨升高","转氨酶催化的转氨基反应不可逆，生成的 α-酮酸不能再转变为氨基酸","血清 ALT 在心肌梗死时升高最显著，是诊断心肌梗死的首选指标","转氨酶催化的转氨基反应以 NAD⁺ 为辅酶"],"answer":0,"explain":"ALT 催化丙氨酸与 α-酮戊二酸生成丙酮酸和谷氨酸（辅酶为磷酸吡哆醛），肝内活性最高，肝细胞损伤时血清 ALT 升高最敏感。","type":"A1","id":"c14-420dfe82"},{"ch":14,"part":3,"tag":"丙氨酸-葡萄糖循环","stem":"关于丙氨酸-葡萄糖循环（葡萄糖-丙氨酸循环）的叙述，正确的是","options":["肌肉中的氨以谷氨酰胺形式经血液运往肝","肝将丙氨酸转变为尿素后，血氨随之降至零","肌肉中的氨经转氨基作用交给丙酮酸生成丙氨酸运往肝；肝将丙氨酸脱氨后合成尿素，并把生成的丙酮酸用于糖异生，葡萄糖再回到肌肉","该循环中葡萄糖在肌肉内被直接氧化为乳酸后运往肝","该循环的主要意义是向肌肉提供必需氨基酸"],"answer":2,"explain":"该循环既以丙氨酸形式把肌肉中的氨无毒地运往肝，又使肝把丙酮酸异生为葡萄糖回补肌肉，实现氨的转运与血糖的补充。","type":"A1","id":"c14-72c55950"},{"ch":14,"part":3,"tag":"谷氨酰胺运氨","stem":"关于谷氨酰胺在氨转运中作用的叙述，正确的是","options":["谷氨酰胺不能被分解，故不能作为氨的运输形式","谷氨酰胺是必需氨基酸，只能从食物中摄取","脑组织缺乏合成谷氨酰胺的酶，不能以谷氨酰胺形式运氨","脑和肌肉中的氨主要与谷氨酸结合生成谷氨酰胺运往肝、肾；谷氨酰胺是氨的无毒运输和储存形式，肾小管上皮细胞的谷氨酰胺酶可释放 NH3 随尿排出","谷氨酰胺酶释放的氨全部用于合成尿素，不参与尿液酸碱平衡的调节"],"answer":3,"explain":"谷氨酰胺是氨的无毒运输与储存形式，脑、肌肉借此将氨运至肝、肾；肾小管上皮细胞经谷氨酰胺酶释放 NH3 随尿排出，参与酸碱平衡调节。","type":"A1","id":"c14-d237954b"},{"ch":14,"part":3,"tag":"肝性脑病","stem":"严重肝病时血氨升高引起肝性脑病（昏迷）的生化机制中，正确的是","options":["氨入脑增多，与脑内 α-酮戊二酸结合而消耗三羧酸循环中间物，并促进假神经递质生成，干扰脑的能量代谢和神经传导","血氨主要在脑内转变为尿素，尿素沉积引起脑水肿","血氨使脑内谷氨酰胺含量降低，导致神经递质合成增多","血氨促进脑内乙酰胆碱合成，使神经兴奋性异常升高","血氨抑制肠道细菌的腐败作用，使芳香族氨基酸吸收减少"],"answer":0,"explain":"氨入脑与 α-酮戊二酸结合生成谷氨酸，消耗三羧酸循环中间物使脑供能不足；酪胺、苯乙胺等假神经递质生成增多，干扰神经传导而致昏迷。","type":"A1","id":"c14-4044e044"},{"ch":14,"part":3,"tag":"酪氨酸代谢","stem":"关于酪氨酸代谢及其产物的叙述，正确的是","options":["酪氨酸是必需氨基酸，体内完全不能合成","酪氨酸酶是儿茶酚胺合成的限速酶，其缺陷可引起帕金森病","多巴胺、去甲肾上腺素和肾上腺素均由色氨酸转变生成","酪氨酸酶缺陷患者的儿茶酚胺合成完全受阻，表现为尿黑酸尿症","酪氨酸经酪氨酸羟化酶催化生成多巴，这是儿茶酚胺（多巴胺、去甲肾上腺素、肾上腺素）合成的限速步骤"],"answer":4,"explain":"酪氨酸羟化酶是儿茶酚胺合成的限速酶（辅酶为四氢生物蝶呤）；酪氨酸酶催化多巴生成黑色素，其缺陷导致白化病，尿黑酸尿症由尿黑酸氧化酶缺陷引起。","type":"A1","id":"c14-5a6547a7"},{"ch":14,"part":3,"tag":"支链氨基酸","stem":"关于支链氨基酸（缬氨酸、亮氨酸、异亮氨酸）分解代谢特点的叙述，正确的是","options":["支链氨基酸的分解过程与其他氨基酸完全相同，全部在肝细胞内进行","支链氨基酸分解的第一步是氧化脱氨基，直接生成游离氨和 α-酮酸","支链氨基酸主要在肝外组织（如肌肉）分解，先经转氨基作用生成支链 α-酮酸，再由支链 α-酮酸脱氢酶复合体氧化脱羧","支链氨基酸的分解产物不能进入三羧酸循环，故不参与氧化供能","支链 α-酮酸脱氢酶复合体缺陷不影响支链氨基酸代谢，只引起苯丙酮尿症"],"answer":2,"explain":"支链氨基酸先在肝外组织（肌肉）经转氨基生成相应支链 α-酮酸，再经支链 α-酮酸脱氢酶复合体氧化脱羧分解；该酶缺陷导致枫糖尿症。","type":"A1","id":"c14-efdb48f9"},{"id":"gc11-01-1","ch":15,"part":3,"tag":"机制","stem":"患者白血病细胞的谷氨酰胺-PRPP 酰胺转移酶活性是正常淋巴细胞的 6 倍，该酶所催化的反应是","options":["催化核糖-5-磷酸与 ATP 生成 PRPP，为核苷酸合成提供磷酸核糖","催化 IMP 氧化为 XMP，再接受谷氨酰胺的酰胺氮生成 GMP","催化 dUMP 接受甲烯基四氢叶酸的甲基，生成脱氧胸苷酸","催化 UTP 接受谷氨酰胺的酰胺氮，生成胞苷三磷酸（CTP）","催化 PRPP 与谷氨酰胺生成 5-磷酸核糖胺，是嘌呤合成的限速步骤"],"answer":4,"explain":"E 对：谷氨酰胺-PRPP 酰胺转移酶催化 PRPP 与谷氨酰胺生成 5-磷酸核糖胺，是嘌呤核苷酸从头合成的限速步骤，其活性升高 6 倍说明白血病细胞的嘌呤从头合成通路明显活跃，抗代谢物正是从这一步下手。A 描述的是 PRPP 合成酶，负责为两条途径提供磷酸核糖。B 描述的是 IMP 脱氢酶，属于 IMP 转变为 GMP 的环节。C 描述的是胸苷酸合酶，负责把 dUMP 甲基化为 dTMP。D 描述的是 CTP 合成酶，属于嘧啶核苷酸合成的后续步骤。","type":"A1","group":"c11-01","kind":"mechanism","chs":[15,16],"vignette":"一位 58 岁急性淋巴细胞白血病患者接受化疗，方案中含甲氨蝶呤与 6-巯基嘌呤（6-MP）。用药第 7 天，白细胞由 3.2×10⁹/L 降至 0.8×10⁹/L，口腔黏膜出现多处溃疡；骨髓象显示 S 期细胞比例由 34% 降到 11%。进一步检测发现，患者白血病细胞的谷氨酰胺-PRPP 酰胺转移酶活性是正常淋巴细胞的 6 倍，而次黄嘌呤-鸟嘌呤磷酸核糖转移酶（HGPRT）活性正常。医生解释，增殖中的细胞既要从头合成核苷酸，也要靠补救合成回收碱基，抗代谢物恰好卡在这两条路线的关键节点上。连续用药数月后复查，部分残留白血病细胞的二氢叶酸还原酶含量比治疗前升高 4 倍，而该酶的米氏常数没有变化。","vignette_title":"情景 1：为什么化疗药盯着正在分裂的细胞","gidx":1,"gn":5,"anchor":"谷氨酰胺-PRPP 酰胺转移酶活性"},{"id":"gc11-01-2","ch":15,"part":3,"tag":"机制","stem":"患者的 HGPRT 活性正常，这是 6-MP 能够起效的前提，因为 6-MP 必须","options":["先经黄嘌呤氧化酶氧化，生成巯基尿酸才能抑制嘌呤的从头合成","先经补救合成转变为巯基嘌呤核苷酸，才能抑制嘌呤的从头合成","先经二氢叶酸还原酶还原，生成活性型才能抑制胸苷酸合酶","先经胸苷酸合酶催化，转变为脱氧型才能掺入 DNA 链","先经核糖核苷酸还原酶还原，生成脱氧型才能进入细胞核"],"answer":1,"explain":"B 对：6-MP 的结构与次黄嘌呤相似，须经 HGPRT 等补救合成酶催化并与 PRPP 反应，生成 6-巯基嘌呤核苷酸，才能抑制 PRPP 酰胺转移酶与 IMP 脱氢酶，阻断嘌呤核苷酸的从头合成，因此该患者 HGPRT 活性正常是用药有效的前提。A 错：经黄嘌呤氧化酶氧化生成巯基尿酸是 6-MP 的灭活去路，产物没有抗肿瘤活性。C 错：6-MP 不经二氢叶酸还原酶活化，抑制胸苷酸合酶的是 5-氟尿嘧啶的活性产物。D 错：胸苷酸合酶的底物是 dUMP，不能把 6-MP 转变为脱氧核苷酸。E 错：核糖核苷酸还原酶作用于二磷酸核苷，与 6-MP 的活化无关。","type":"A1","group":"c11-01","kind":"mechanism","chs":[15,16],"vignette":"一位 58 岁急性淋巴细胞白血病患者接受化疗，方案中含甲氨蝶呤与 6-巯基嘌呤（6-MP）。用药第 7 天，白细胞由 3.2×10⁹/L 降至 0.8×10⁹/L，口腔黏膜出现多处溃疡；骨髓象显示 S 期细胞比例由 34% 降到 11%。进一步检测发现，患者白血病细胞的谷氨酰胺-PRPP 酰胺转移酶活性是正常淋巴细胞的 6 倍，而次黄嘌呤-鸟嘌呤磷酸核糖转移酶（HGPRT）活性正常。医生解释，增殖中的细胞既要从头合成核苷酸，也要靠补救合成回收碱基，抗代谢物恰好卡在这两条路线的关键节点上。连续用药数月后复查，部分残留白血病细胞的二氢叶酸还原酶含量比治疗前升高 4 倍，而该酶的米氏常数没有变化。","vignette_title":"情景 1：为什么化疗药盯着正在分裂的细胞","gidx":2,"gn":5,"anchor":"磷酸核糖转移酶（HGPRT）活性正常"},{"id":"gc11-01-3","ch":15,"part":3,"tag":"判读","stem":"骨髓 S 期细胞比例下降与甲氨蝶呤的作用直接相关，因为甲氨蝶呤","options":["抑制二氢叶酸还原酶，四氢叶酸不能再生而 dTMP 合成受阻","抑制胸苷酸合酶，使 dUMP 不能接受甲基生成 dTMP","抑制核糖核苷酸还原酶，使二磷酸核苷不能还原为脱氧核苷","抑制黄嘌呤氧化酶，使次黄嘌呤不能转变为黄嘌呤与尿酸","抑制 PRPP 酰胺转移酶，使 5-磷酸核糖胺不能正常生成"],"answer":0,"explain":"A 对：甲氨蝶呤是二氢叶酸还原酶的强抑制剂，二氢叶酸不能还原为四氢叶酸，N5,N10-甲烯基四氢叶酸随之减少，dUMP 无法甲基化为 dTMP，DNA 复制受阻，细胞推进到 S 期前后即被卡住，骨髓象表现为 S 期细胞比例下降。B 错：抑制胸苷酸合酶的是 5-氟尿嘧啶的活性产物。C 错：抑制核糖核苷酸还原酶的是羟基脲。D 错：抑制黄嘌呤氧化酶的是别嘌呤醇。E 错：抑制 PRPP 酰胺转移酶的是 6-巯基嘌呤核苷酸。","type":"A1","group":"c11-01","kind":"mechanism","chs":[15,16],"vignette":"一位 58 岁急性淋巴细胞白血病患者接受化疗，方案中含甲氨蝶呤与 6-巯基嘌呤（6-MP）。用药第 7 天，白细胞由 3.2×10⁹/L 降至 0.8×10⁹/L，口腔黏膜出现多处溃疡；骨髓象显示 S 期细胞比例由 34% 降到 11%。进一步检测发现，患者白血病细胞的谷氨酰胺-PRPP 酰胺转移酶活性是正常淋巴细胞的 6 倍，而次黄嘌呤-鸟嘌呤磷酸核糖转移酶（HGPRT）活性正常。医生解释，增殖中的细胞既要从头合成核苷酸，也要靠补救合成回收碱基，抗代谢物恰好卡在这两条路线的关键节点上。连续用药数月后复查，部分残留白血病细胞的二氢叶酸还原酶含量比治疗前升高 4 倍，而该酶的米氏常数没有变化。","vignette_title":"情景 1：为什么化疗药盯着正在分裂的细胞","gidx":3,"gn":5,"anchor":"S 期细胞比例由 34% 降到 11%"},{"id":"gc11-01-5","ch":15,"part":3,"tag":"判读","stem":"关于这两条合成路线与抗代谢物，下列判断正确的是（X 型多选）","options":["脑组织以补救合成获取核苷酸为主，比从头合成耗能更少","甲氨蝶呤的作用范围限于脱氧胸苷酸的合成","6-巯基嘌呤需经补救合成酶转变为相应核苷酸才起作用","嘌呤从头合成先由 PRPP 提供磷酸核糖，再逐步装配嘌呤环","残留白血病细胞二氢叶酸还原酶含量升高属于酶含量调节"],"answer":[0,2,3,4],"explain":"答案 ACDE。A、C、D、E 分别对应四条经得起推敲的判断：脑与骨髓等组织以补救合成为主，该途径耗能少；6-巯基嘌呤须经 HGPRT 转变为巯基嘌呤核苷酸才能抑制嘌呤的从头合成；嘌呤核苷酸的从头合成是在 PRPP 提供的磷酸核糖上逐步装配嘌呤环，嘧啶核苷酸则先合成嘧啶环再接上磷酸核糖；二氢叶酸还原酶含量升高而米氏常数不变，说明改变的是酶的量而不是酶的结构，属于酶含量调节。B 错：甲氨蝶呤阻断四氢叶酸再生后影响的不止 dTMP 的合成，嘌呤环的 C2 与 C8 来自一碳单位，其合成同样受阻。","type":"X","group":"c11-01","kind":"mechanism","chs":[15,16],"vignette":"一位 58 岁急性淋巴细胞白血病患者接受化疗，方案中含甲氨蝶呤与 6-巯基嘌呤（6-MP）。用药第 7 天，白细胞由 3.2×10⁹/L 降至 0.8×10⁹/L，口腔黏膜出现多处溃疡；骨髓象显示 S 期细胞比例由 34% 降到 11%。进一步检测发现，患者白血病细胞的谷氨酰胺-PRPP 酰胺转移酶活性是正常淋巴细胞的 6 倍，而次黄嘌呤-鸟嘌呤磷酸核糖转移酶（HGPRT）活性正常。医生解释，增殖中的细胞既要从头合成核苷酸，也要靠补救合成回收碱基，抗代谢物恰好卡在这两条路线的关键节点上。连续用药数月后复查，部分残留白血病细胞的二氢叶酸还原酶含量比治疗前升高 4 倍，而该酶的米氏常数没有变化。","vignette_title":"情景 1：为什么化疗药盯着正在分裂的细胞","gidx":5,"gn":5,"anchor":"二氢叶酸还原酶含量比治疗前升高 4 倍"},{"id":"gc11-02-1","ch":15,"part":3,"tag":"机制","stem":"患者血中次黄嘌呤与黄嘌呤浓度升高，二者转变为尿酸所依赖的酶是","options":["腺苷脱氨酶，催化腺苷与脱氧腺苷脱去氨基","次黄嘌呤-鸟嘌呤磷酸核糖转移酶，催化碱基回收为核苷酸","核糖核苷酸还原酶，催化二磷酸核苷还原为脱氧核苷","黄嘌呤氧化酶，催化次黄嘌呤与黄嘌呤氧化为尿酸","尿酸氧化酶，催化尿酸进一步分解为尿囊素"],"answer":3,"explain":"D 对：嘌呤核苷酸分解时，腺嘌呤与鸟嘌呤先脱氨生成次黄嘌呤与黄嘌呤，二者再由黄嘌呤氧化酶依次氧化为尿酸，该酶是这一终末步骤的催化者，也是别嘌呤醇的作用靶点。A 错：腺苷脱氨酶作用于腺苷与脱氧腺苷，位于嘌呤分解的上游，底物不是次黄嘌呤与黄嘌呤。B 错：该酶催化补救合成，方向与分解相反。C 错：核糖核苷酸还原酶负责生成脱氧核苷酸，与尿酸生成无关。E 错：尿酸氧化酶能把尿酸分解为尿囊素，人体缺乏此酶，这正是人体与多数哺乳动物的差别，尿酸因此成为终产物。","type":"A1","group":"c11-02","kind":"mechanism","chs":[15,14,5],"vignette":"一位 52 岁男性因弥漫大 B 细胞淋巴瘤接受联合化疗，近三日因恶心呕吐几乎未进食。用药第 3 天出现少尿：血尿酸由 318 μmol/L 升至 620 μmol/L，血肌酐 186 μmol/L，血钾 5.8 mmol/L，尿 pH 5.0。同日右足第一跖趾关节红肿热痛，关节腔穿刺抽出淡黄色滑液，偏振光镜下见大量针状结晶，测得该关节滑液 pH 约 5.4，局部温度低于核心体温。医生分析，化疗后肿瘤细胞大量破坏，而其嘌呤核苷酸的合成与分解原本都很活跃：核酸分解产生的嘌呤碱依次转变为次黄嘌呤与黄嘌呤，人体分解嘌呤的最后一步与多数哺乳动物不同，产物就是血中升高的尿酸；它在体液中溶解度有限，超过饱和度后即在理化条件不利的关节滑液中析出结晶，沉积于关节、软组织与肾。医生给予别嘌呤醇并嘱多饮水。","vignette_title":"情景 2：从一堆破碎的细胞到一个红肿的关节","gidx":1,"gn":6,"anchor":"依次转变为次黄嘌呤与黄嘌呤"},{"id":"gc11-02-2","ch":15,"part":3,"tag":"判读","stem":"该患者血尿酸在 3 天内由 318 μmol/L 升至 620 μmol/L，最直接的原因是","options":["食物中嘌呤摄入明显增多，外源性嘌呤负荷明显加重","肾小管对尿酸的重吸收减少，随尿排出的尿酸随之减少","肿瘤细胞大量破坏，核酸分解产生的嘌呤碱转变为尿酸增多","嘧啶核苷酸大量分解，其分解终产物在体内转变为尿酸","肝内尿酸氧化酶活性升高，把分解中间物大量转变为尿酸"],"answer":2,"explain":"C 对：化疗后大量肿瘤细胞被杀伤，细胞内的 DNA 与 RNA 分解，嘌呤碱经次黄嘌呤、黄嘌呤生成尿酸，内源性嘌呤负荷骤增，血尿酸因此在 3 天内翻倍。A 错：患者近三日几乎未进食，外源性嘌呤摄入反而减少，与情景矛盾。B 错：重吸收减少应使尿酸排出增多、血尿酸下降，方向与本例相反。D 错：嘧啶核苷酸分解的终产物是 β-丙氨酸、β-氨基异丁酸、CO₂ 与 NH₃，并不生成尿酸。E 错：人体缺乏尿酸氧化酶，该酶也不会把中间物转变为尿酸，生成尿酸的是黄嘌呤氧化酶。","type":"A1","group":"c11-02","kind":"mechanism","chs":[15,14,5],"vignette":"一位 52 岁男性因弥漫大 B 细胞淋巴瘤接受联合化疗，近三日因恶心呕吐几乎未进食。用药第 3 天出现少尿：血尿酸由 318 μmol/L 升至 620 μmol/L，血肌酐 186 μmol/L，血钾 5.8 mmol/L，尿 pH 5.0。同日右足第一跖趾关节红肿热痛，关节腔穿刺抽出淡黄色滑液，偏振光镜下见大量针状结晶，测得该关节滑液 pH 约 5.4，局部温度低于核心体温。医生分析，化疗后肿瘤细胞大量破坏，而其嘌呤核苷酸的合成与分解原本都很活跃：核酸分解产生的嘌呤碱依次转变为次黄嘌呤与黄嘌呤，人体分解嘌呤的最后一步与多数哺乳动物不同，产物就是血中升高的尿酸；它在体液中溶解度有限，超过饱和度后即在理化条件不利的关节滑液中析出结晶，沉积于关节、软组织与肾。医生给予别嘌呤醇并嘱多饮水。","vignette_title":"情景 2：从一堆破碎的细胞到一个红肿的关节","gidx":2,"gn":6,"anchor":"近三日因恶心呕吐几乎未进食"},{"id":"gc11-02-5","ch":15,"part":3,"tag":"方案","stem":"医生给该患者使用别嘌呤醇，其降低血尿酸的机制是","options":["抑制二氢叶酸还原酶，减少一碳单位供应而减少尿酸生成","抑制肾小管对尿酸的重吸收，使尿酸随尿液排出量增多","激活尿酸氧化酶，把血尿酸分解为溶解度较大的尿囊素","抑制 PRPP 酰胺转移酶，阻断嘌呤核苷酸的从头合成","作为次黄嘌呤类似物竞争性抑制黄嘌呤氧化酶，减少尿酸生成"],"answer":4,"explain":"E 对：别嘌呤醇的结构与次黄嘌呤相似，可竞争性抑制黄嘌呤氧化酶，使次黄嘌呤与黄嘌呤转变为尿酸减少，血尿酸下降，尿酸盐在关节与肾的沉积也随之减少。A 错：抑制二氢叶酸还原酶的是甲氨蝶呤，与尿酸生成无关。B 错：抑制肾小管重吸收以促进尿酸排泄的是丙磺舒一类药物，别嘌呤醇作用于生成环节。C 错：人体缺乏尿酸氧化酶，尿囊素不是人的代谢产物，没有可被激活的靶酶。D 错：抑制 PRPP 酰胺转移酶的是 6-巯基嘌呤核苷酸，该药用于抗肿瘤而非降低尿酸。","type":"A1","group":"c11-02","kind":"mechanism","chs":[15,14,5],"vignette":"一位 52 岁男性因弥漫大 B 细胞淋巴瘤接受联合化疗，近三日因恶心呕吐几乎未进食。用药第 3 天出现少尿：血尿酸由 318 μmol/L 升至 620 μmol/L，血肌酐 186 μmol/L，血钾 5.8 mmol/L，尿 pH 5.0。同日右足第一跖趾关节红肿热痛，关节腔穿刺抽出淡黄色滑液，偏振光镜下见大量针状结晶，测得该关节滑液 pH 约 5.4，局部温度低于核心体温。医生分析，化疗后肿瘤细胞大量破坏，而其嘌呤核苷酸的合成与分解原本都很活跃：核酸分解产生的嘌呤碱依次转变为次黄嘌呤与黄嘌呤，人体分解嘌呤的最后一步与多数哺乳动物不同，产物就是血中升高的尿酸；它在体液中溶解度有限，超过饱和度后即在理化条件不利的关节滑液中析出结晶，沉积于关节、软组织与肾。医生给予别嘌呤醇并嘱多饮水。","vignette_title":"情景 2：从一堆破碎的细胞到一个红肿的关节","gidx":5,"gn":6,"anchor":"医生给予别嘌呤醇并嘱多饮水"},{"id":"gc11-02-6","ch":15,"part":3,"tag":"判读","stem":"关于该患者尿酸升高的来源、结晶与处理，下列判断正确的是（X 型多选）","options":["化疗后大量肿瘤细胞破坏，内源性嘌呤负荷是血尿酸骤升的主因","人体缺乏尿酸氧化酶，嘌呤分解的终产物为尿酸而非尿囊素","尿酸盐结晶可沉积于关节、软组织与肾，引起关节炎与肾损害","该患者的尿酸升高主要由嘧啶核苷酸分解过多引起","血尿酸超过饱和度后，在温度与 pH 偏低的关节滑液中更易析出"],"answer":[0,1,2,4],"explain":"答案 ABCE。A、B、C、E 分别对应内源性嘌呤负荷骤增、人体缺乏尿酸氧化酶故终产物为尿酸、尿酸盐结晶的沉积部位，以及温度与 pH 偏低促进结晶析出。D 错：嘧啶核苷酸分解的终产物是 β-丙氨酸、β-氨基异丁酸、CO₂ 与 NH₃，并不包括尿酸，把嘧啶分解当成尿酸来源是常见混淆；本例血尿酸骤升来自大量肿瘤细胞破坏后的嘌呤核苷酸分解。","type":"X","group":"c11-02","kind":"mechanism","chs":[15,14,5],"vignette":"一位 52 岁男性因弥漫大 B 细胞淋巴瘤接受联合化疗，近三日因恶心呕吐几乎未进食。用药第 3 天出现少尿：血尿酸由 318 μmol/L 升至 620 μmol/L，血肌酐 186 μmol/L，血钾 5.8 mmol/L，尿 pH 5.0。同日右足第一跖趾关节红肿热痛，关节腔穿刺抽出淡黄色滑液，偏振光镜下见大量针状结晶，测得该关节滑液 pH 约 5.4，局部温度低于核心体温。医生分析，化疗后肿瘤细胞大量破坏，而其嘌呤核苷酸的合成与分解原本都很活跃：核酸分解产生的嘌呤碱依次转变为次黄嘌呤与黄嘌呤，人体分解嘌呤的最后一步与多数哺乳动物不同，产物就是血中升高的尿酸；它在体液中溶解度有限，超过饱和度后即在理化条件不利的关节滑液中析出结晶，沉积于关节、软组织与肾。医生给予别嘌呤醇并嘱多饮水。","vignette_title":"情景 2：从一堆破碎的细胞到一个红肿的关节","gidx":6,"gn":6,"anchor":"沉积于关节、软组织与肾"},{"id":"gc11-03-2","ch":15,"part":3,"tag":"机制","stem":"骨髓出现红系前体细胞核质发育不同步的巨幼样改变，其分子基础是","options":["血红素合成受阻，血红蛋白不能正常装配进入红细胞胞质","嘌呤核苷酸的合成明显增多，细胞核的体积代偿性增大","细胞膜脂质过氧化增强，使红系前体细胞的膜受损变形","同型半胱氨酸直接抑制核糖体，使蛋白质的合成全面下降","dTMP 生成减少使 DNA 复制受阻，蛋白质合成却相对正常"],"answer":4,"explain":"E 对：四氢叶酸不足使 N5,N10-甲烯基四氢叶酸减少，dUMP 经胸苷酸合酶生成 dTMP 受阻，DNA 复制变慢，而 RNA 与蛋白质合成受影响较小，核与胞质的发育因此不同步，表现为巨幼样变。A 错：血红素合成障碍引起的是小细胞低色素性贫血，与本例的核质发育不同步不符。B 错：嘌呤核苷酸的合成并不增多，一碳单位不足同样使嘌呤环的 C2 与 C8 来源受限。C 错：膜脂质过氧化属于氧化损伤，不能解释核质发育不同步。D 错：同型半胱氨酸升高不是巨幼样变的直接原因，且蛋白质合成并未全面下降。","type":"A1","group":"c11-03","kind":"mechanism","chs":[14,15,7],"vignette":"一位 47 岁男性长期酗酒并有严重营养不良：血清同型半胱氨酸 42 μmol/L（正常低于 15），血清叶酸与维生素 B12 低于正常下限；骨髓涂片见红系前体细胞核质发育不同步的巨幼样改变；肝穿刺活检显示肝细胞内质网腔扩张、脂滴明显增多，血中极低密度脂蛋白（VLDL）低于正常。丝氨酸羟甲基转移酶把丝氨酸的羟甲基交给四氢叶酸，生成 N5,N10-甲烯基四氢叶酸，这是一碳单位的主要来源；一碳单位既可由胸苷酸合酶交给 dUMP 生成 dTMP，也可还原为 N5-甲基四氢叶酸后经甲硫氨酸合酶把甲基转给同型半胱氨酸生成甲硫氨酸，进而生成 S-腺苷甲硫氨酸（SAM）。肝内磷脂酰胆碱可由磷脂酰乙醇胺接受 SAM 提供的甲基生成，而它是肝细胞在内质网组装并分泌 VLDL 所必需的。","vignette_title":"情景 3：一份甲基的两个去处","gidx":2,"gn":5,"anchor":"核质发育不同步的巨幼样改变"},{"id":"gc11-03-5","ch":15,"part":3,"tag":"判读","stem":"关于这位患者体内一碳单位与甲基的流向，下列判断正确的是（X 型多选）","options":["一碳单位由四氢叶酸携带，来自丝氨酸、甘氨酸、组氨酸与色氨酸的分解","SAM 是体内甲基的直接供体，参与磷脂酰胆碱等物质的合成","二氧化碳属于一碳单位，与甲烯基四氢叶酸共同提供嘌呤环的 C2","叶酸与维生素 B12 不足使 dTMP 生成减少，DNA 合成受阻","甲硫氨酸合酶受阻时，四氢叶酸易被留在 N5-甲基形式而难以再生"],"answer":[0,1,3,4],"explain":"答案 ABDE。A、B、D、E 分别对应一碳单位的载体与来源、SAM 作为甲基直接供体的作用、叶酸与维生素 B12 不足导致 dTMP 减少，以及甲硫氨酸合酶受阻造成的四氢叶酸再生障碍。C 错：二氧化碳不属于一碳单位，它提供嘌呤环的 C6，而 C2 与 C8 才来自一碳单位；把二氧化碳与一碳单位混为一谈是常见错误。","type":"X","group":"c11-03","kind":"mechanism","chs":[14,15,7],"vignette":"一位 47 岁男性长期酗酒并有严重营养不良：血清同型半胱氨酸 42 μmol/L（正常低于 15），血清叶酸与维生素 B12 低于正常下限；骨髓涂片见红系前体细胞核质发育不同步的巨幼样改变；肝穿刺活检显示肝细胞内质网腔扩张、脂滴明显增多，血中极低密度脂蛋白（VLDL）低于正常。丝氨酸羟甲基转移酶把丝氨酸的羟甲基交给四氢叶酸，生成 N5,N10-甲烯基四氢叶酸，这是一碳单位的主要来源；一碳单位既可由胸苷酸合酶交给 dUMP 生成 dTMP，也可还原为 N5-甲基四氢叶酸后经甲硫氨酸合酶把甲基转给同型半胱氨酸生成甲硫氨酸，进而生成 S-腺苷甲硫氨酸（SAM）。肝内磷脂酰胆碱可由磷脂酰乙醇胺接受 SAM 提供的甲基生成，而它是肝细胞在内质网组装并分泌 VLDL 所必需的。","vignette_title":"情景 3：一份甲基的两个去处","gidx":5,"gn":5,"anchor":"磷脂酰乙醇胺接受 SAM 提供的甲基生成"},{"id":"gc11-04-2","ch":15,"part":3,"tag":"机制","stem":"加入葡萄糖-6-磷酸脱氢酶抑制剂后细胞增殖同步受抑，最可能的原因是","options":["核糖-5-磷酸生成减少，PRPP 供给不足使核苷酸合成受阻","糖酵解产生的 ATP 减少，细胞因能量不足而停止增殖","NADPH 生成增多，细胞内的还原性环境抑制了细胞增殖","三羧酸循环中间物减少，回补反应不能维持循环运转","谷胱甘肽还原酶活性下降，细胞内过氧化物大量蓄积"],"answer":0,"explain":"A 对：该酶是磷酸戊糖途径的限速酶，被抑制后 5-磷酸核糖生成减少，PRPP 供应不足，嘌呤与嘧啶核苷酸的从头合成同时受阻，故 ¹⁴CO₂ 释放与增殖速度同步下降，说明核糖-5-磷酸是核苷酸合成的关键原料。B 错：该酶不参与糖酵解，抑制它不直接影响糖酵解产能。C 错：NADPH 生成减少而非增多。D 错：三羧酸循环的中间物回补与磷酸戊糖途径的氧化阶段不是同一环节，且抑制剂不直接作用于线粒体。E 错：谷胱甘肽还原酶利用 NADPH，NADPH 减少会影响抗氧化，但过氧化物蓄积不是增殖受抑的直接解释。","type":"A1","group":"c11-04","kind":"experiment","chs":[15,14,11,6],"vignette":"为判断一株白血病细胞系的核苷酸原料从哪来，研究生做了三组实验。第一组：分别在 C1 位 ¹⁴C 标记葡萄糖和 C6 位 ¹⁴C 标记葡萄糖的培养基中培养细胞并收集 ¹⁴CO₂，C1 标记组的释放量是 C6 标记组的 8 倍；加入葡萄糖-6-磷酸脱氢酶抑制剂后，¹⁴CO₂ 释放量与细胞增殖速度同步降到原来的三成。第二组：用酰胺氮被 ¹⁵N 标记的谷氨酰胺培养细胞，2 小时后在细胞内的 IMP、GMP 与 CTP 中检出 ¹⁵N，而 dTMP 的甲基上没有标记。第三组：差速离心分离胞质与线粒体组分，胞质组分中可测到以谷氨酰胺为氮源的氨基甲酰磷酸合成酶活性，该活性可被 UTP 抑制；线粒体组分中的同类酶则以游离氨为氮源，并可被 N-乙酰谷氨酸激活。","vignette_title":"情景 4：¹⁴CO₂ 计数器上的三条线索","gidx":2,"gn":5,"anchor":"加入葡萄糖-6-磷酸脱氢酶抑制剂后"},{"id":"gc11-04-5","ch":15,"part":3,"tag":"判读","stem":"关于本实验的结论与设计，下列判断正确的是（X 型多选）","options":["抑制剂使增殖受抑，支持核糖-5-磷酸是核苷酸合成的关键原料","C1 与 C6 标记葡萄糖释放二氧化碳的比值可估计磷酸戊糖途径通量","dTMP 的甲基由甲烯基四氢叶酸提供，与谷氨酰胺的酰胺氮无关","胞质中被 UTP 抑制的氨基甲酰磷酸合成酶参与嘧啶的从头合成","线粒体中的氨基甲酰磷酸合成酶参与嘌呤核苷酸的从头合成"],"answer":[0,1,2,3],"explain":"答案 ABCD。A、B、C、D 分别对应核糖-5-磷酸供给与增殖的关系、C1 与 C6 比值估计磷酸戊糖途径通量的经典用法、dTMP 甲基来自一碳单位，以及胞质中该酶受 UTP 反馈抑制而参与嘧啶核苷酸的从头合成。E 错：线粒体中以游离氨为氮源、受 N-乙酰谷氨酸激活的氨基甲酰磷酸合成酶参与的是尿素合成，与嘌呤核苷酸的从头合成无关，后者由 PRPP 与谷氨酰胺起始。","type":"X","group":"c11-04","kind":"experiment","chs":[15,14,11,6],"vignette":"为判断一株白血病细胞系的核苷酸原料从哪来，研究生做了三组实验。第一组：分别在 C1 位 ¹⁴C 标记葡萄糖和 C6 位 ¹⁴C 标记葡萄糖的培养基中培养细胞并收集 ¹⁴CO₂，C1 标记组的释放量是 C6 标记组的 8 倍；加入葡萄糖-6-磷酸脱氢酶抑制剂后，¹⁴CO₂ 释放量与细胞增殖速度同步降到原来的三成。第二组：用酰胺氮被 ¹⁵N 标记的谷氨酰胺培养细胞，2 小时后在细胞内的 IMP、GMP 与 CTP 中检出 ¹⁵N，而 dTMP 的甲基上没有标记。第三组：差速离心分离胞质与线粒体组分，胞质组分中可测到以谷氨酰胺为氮源的氨基甲酰磷酸合成酶活性，该活性可被 UTP 抑制；线粒体组分中的同类酶则以游离氨为氮源，并可被 N-乙酰谷氨酸激活。","vignette_title":"情景 4：¹⁴CO₂ 计数器上的三条线索","gidx":5,"gn":5,"anchor":"以谷氨酰胺为氮源的氨基甲酰磷酸合成酶活性"},{"id":"gc24-01-5","ch":15,"part":3,"tag":"判读","stem":"关于这位患者体内甲基与一碳单位的账目，下列判断正确的是（X 型多选）","options":["SAM 转出甲基后生成 SAH，SAH 水解为同型半胱氨酸与腺苷","甲硫氨酸不能由其他物质净合成，需靠食物与再甲基化补充","N5-甲基四氢叶酸可直接把甲基交给胍乙酸以生成肌酸","同型半胱氨酸与丝氨酸缩合生成胱硫醚，是它的另一条去路","一碳单位为嘌呤环提供 C2 与 C8，其供应也影响核苷酸合成"],"answer":[0,1,3,4],"explain":"答案 ABDE。A 对：SAM 转出甲基后成为 SAH，SAH 再水解为同型半胱氨酸与腺苷，这是甲基账目的回款环节。B 对：甲硫氨酸属必需氨基酸，人体不能由其他物质净合成它，只能靠食物摄入与同型半胱氨酸再甲基化两条来源补充，该患者长期蛋白质摄入不足正是进项减少的原因。D 对：同型半胱氨酸除再甲基化外，还可与丝氨酸缩合生成胱硫醚，再分解为半胱氨酸与 α-酮丁酸，这是它的另一条去路。E 对：一碳单位为嘌呤环提供 C2 与 C8，四氢叶酸类辅酶供应不足时核苷酸合成同样受限，说明甲基账目与核苷酸合成共用同一批一碳单位。C 错：N5-甲基四氢叶酸只能把甲基交给同型半胱氨酸，胍乙酸必须由 SAM 提供甲基，把这一形式说成可直接交给甲基受体是常见混淆。","type":"X","group":"c24-01","kind":"mechanism","chs":[14,15,11],"vignette":"肝细胞内甲硫氨酸的周转很快：甲硫氨酸腺苷转移酶消耗 1 分子 ATP，把甲硫氨酸变成 S-腺苷甲硫氨酸（SAM），SAM 是体内甲基的直接供体，把甲基交给受体后变成 S-腺苷同型半胱氨酸（SAH），SAH 再水解为同型半胱氨酸与腺苷。这些受体包括胍乙酸（接受甲基后生成肌酸）、去甲肾上腺素（接受甲基后生成肾上腺素）与 DNA 上的胞嘧啶。SAH 对多种甲基转移酶有强烈的抑制作用，SAM 与 SAH 的比值因此决定甲基化反应的实际速率。同型半胱氨酸要再获得甲基变回甲硫氨酸，只能接受 N5-甲基四氢叶酸提供的甲基，这一步由甲硫氨酸合酶催化，维生素 B12 是其辅酶；甲硫氨酸属必需氨基酸，该患者长期蛋白质摄入不足。检测结果：血浆甲硫氨酸 8 μmol/L，肝细胞内 SAM 与 SAH 的比值由 15 降到 1.8，血浆同型半胱氨酸 26 μmol/L，24 小时尿肌酐排出量比同龄人低 40%。","vignette_title":"情景 1：一份甲基的进项与出项","gidx":5,"gn":5,"anchor":"水解为同型半胱氨酸与腺苷"},{"id":"gc24-02-3","ch":15,"part":3,"tag":"判读","stem":"撤除谷氨酰胺后细胞内天冬氨酸与核苷酸合成同步下降，说明天冬氨酸","options":["由丙酮酸经转氨基作用生成，为嘌呤环提供 N3 与 N9 两个氮","由 α-酮戊二酸经氧化脱氨基生成，为嘧啶环提供碳原子","由草酰乙酸经转氨基作用生成，为嘌呤环提供 N1 与嘧啶环的氮","由谷氨酰胺经水解作用直接生成，为嘌呤环提供 C4 与 C5","由草酰乙酸经氧化脱羧作用生成，为嘌呤环提供 C6 一个碳"],"answer":2,"explain":"C 对：草酰乙酸经转氨基作用接受谷氨酸的氨基生成天冬氨酸，谷氨酰胺被撤除后谷氨酸不足，天冬氨酸随之下降；天冬氨酸是嘌呤环 N1 与嘧啶环氮原子的供体，故核苷酸合成同步降到三成。A 错：丙酮酸经转氨基作用生成的是丙氨酸，N3 与 N9 由谷氨酰胺的酰胺氮提供。B 错：α-酮戊二酸经氧化脱氨基与转氨基得到的是谷氨酸，嘧啶环的碳原子并不由它提供。D 错：谷氨酰胺水解只得到谷氨酸，甘氨酸才提供嘌呤环的 C4、C5 与 N7。E 错：草酰乙酸不能经氧化脱羧生成天冬氨酸，C6 由二氧化碳提供。","type":"A1","group":"c24-02","kind":"mechanism","chs":[14,15,11],"vignette":"丝裂原刺激后的一株人淋巴细胞进入快速增殖：24 小时内培养基中的谷氨酰胺由 2.0 mmol/L 降到 0.3 mmol/L，葡萄糖由 11.0 mmol/L 降到 9.9 mmol/L，前者的消耗速率约为后者的 1.5 倍。细胞内谷氨酰胺酶活性升到静息细胞的 5 倍，谷氨酸脱氢酶活性升高 3 倍。撤除培养基中的谷氨酰胺后，细胞内 α-酮戊二酸由 1.2 降到 0.2 nmol/mg 蛋白，天冬氨酸由 4.5 降到 1.1，嘌呤与嘧啶核苷酸的合成速率同步降到原来的三成。谷氨酰胺在血浆中浓度最高，是氨的无毒运输形式。谷氨酰胺酶水解其侧链酰胺基，释放出酰胺氮并生成谷氨酸；谷氨酸既可经氧化脱氨基作用变成 α-酮戊二酸，也可把氨基交给草酰乙酸生成天冬氨酸。谷氨酰胺的酰胺氮进入核苷酸环，其碳骨架则经 α-酮戊二酸进入三羧酸循环。","vignette_title":"情景 2：增殖细胞的两笔原料账","gidx":3,"gn":5,"anchor":"天冬氨酸由 4.5 降到 1.1"},{"id":"gc24-02-5","ch":15,"part":3,"tag":"判读","stem":"关于谷氨酰胺作为氮与碳的双重供体，下列判断正确的是（X 型多选）","options":["谷氨酰胺的酰胺氮可参与嘌呤环与嘧啶环的合成，是重要氮源","谷氨酰胺脱酰胺生成的谷氨酸，其氨基可经转氨生成天冬氨酸","谷氨酰胺的碳骨架经 α-酮戊二酸进入三羧酸循环，可回补中间物","谷氨酰胺提供氮原子，其碳骨架不进入三羧酸循环","撤除谷氨酰胺后核苷酸合成降到三成，说明它参与供氮"],"answer":[0,1,2,4],"explain":"答案 ABCE。A 对：谷氨酰胺的酰胺氮是嘌呤环 N3 与 N9、嘧啶环 N3 以及胞苷三磷酸 4-氨基的供体，是核苷酸合成中重要的氮源。B 对：谷氨酰胺水解脱酰胺后成为谷氨酸，谷氨酸的氨基经转氨基作用交给草酰乙酸即生成天冬氨酸，这与撤除谷氨酰胺后细胞内天冬氨酸由 4.5 降到 1.1 的现象一致。C 对：其碳骨架经 α-酮戊二酸进入三羧酸循环，既供能又回补循环中间物。E 对：撤除谷氨酰胺后嘌呤与嘧啶核苷酸的合成速率同步降到三成，说明它同时为两个环提供氮。D 错：谷氨酰胺不仅供氮，其碳骨架同样进入三羧酸循环被氧化利用，把它的作用限为供氮与碳骨架的实测变化不符。","type":"X","group":"c24-02","kind":"mechanism","chs":[14,15,11],"vignette":"丝裂原刺激后的一株人淋巴细胞进入快速增殖：24 小时内培养基中的谷氨酰胺由 2.0 mmol/L 降到 0.3 mmol/L，葡萄糖由 11.0 mmol/L 降到 9.9 mmol/L，前者的消耗速率约为后者的 1.5 倍。细胞内谷氨酰胺酶活性升到静息细胞的 5 倍，谷氨酸脱氢酶活性升高 3 倍。撤除培养基中的谷氨酰胺后，细胞内 α-酮戊二酸由 1.2 降到 0.2 nmol/mg 蛋白，天冬氨酸由 4.5 降到 1.1，嘌呤与嘧啶核苷酸的合成速率同步降到原来的三成。谷氨酰胺在血浆中浓度最高，是氨的无毒运输形式。谷氨酰胺酶水解其侧链酰胺基，释放出酰胺氮并生成谷氨酸；谷氨酸既可经氧化脱氨基作用变成 α-酮戊二酸，也可把氨基交给草酰乙酸生成天冬氨酸。谷氨酰胺的酰胺氮进入核苷酸环，其碳骨架则经 α-酮戊二酸进入三羧酸循环。","vignette_title":"情景 2：增殖细胞的两笔原料账","gidx":5,"gn":5,"anchor":"谷氨酰胺的酰胺氮进入核苷酸环"},{"id":"gc24-03-3","ch":15,"part":3,"tag":"机制","stem":"5-磷酸核糖与 ATP 反应生成 PRPP，这一步的意义是","options":["为嘌呤与嘧啶核苷酸的从头合成提供磷酸核糖部分","为嘌呤环提供 N3 与 N9 两个氮原子，参与环的装配","在补救合成中使用，从头合成并不需要 PRPP 参与","由 5-磷酸核糖与 AMP 反应生成，供脱氧核苷酸使用","把 5-磷酸核糖转变为核糖-1-磷酸，进入糖原的合成"],"answer":0,"explain":"A 对：PRPP 由 5-磷酸核糖与 ATP 反应生成，是嘌呤核苷酸从头合成起步的原料，也是在嘧啶环合成之后接上磷酸核糖的供体，因此是两条途径的共同起点，与糖代谢共享同一个中间产物。B 错：嘌呤环的 N3 与 N9 来自谷氨酰胺的酰胺氮，PRPP 提供的是磷酸核糖而不是氮原子。C 错：补救合成与从头合成都需要 PRPP，说从头合成不需要它与教材表述不符。D 错：生成 PRPP 消耗的是 ATP，其产物可用于核糖核苷酸，也可再还原为脱氧核苷酸。E 错：核糖-1-磷酸是糖原分解与合成的中间物，与 PRPP 不是同一个反应。","type":"A1","group":"c24-03","kind":"mechanism","chs":[11,15,14],"vignette":"快速增殖的细胞并不让葡萄糖走完糖酵解：一部分葡糖-6-磷酸进入磷酸戊糖途径，生成 5-磷酸核糖与 NADPH；该途径的非氧化阶段由转酮醇酶与转醛醇酶催化碳单位的重排，把糖酵解的中间产物果糖-6-磷酸与 3-磷酸甘油醛也转回 5-磷酸核糖，转酮醇酶以焦磷酸硫胺素为辅酶。5-磷酸核糖与 ATP 反应生成磷酸核糖焦磷酸（PRPP），这是嘌呤与嘧啶核苷酸从头合成的共同起点。第二条支路的起点是糖酵解中间产物 3-磷酸甘油酸，它经三步反应生成丝氨酸；丝氨酸把羟甲基交给四氢叶酸，自身剩下的碳骨架成为甘氨酸，甘氨酸与一碳单位分别进入嘌呤环的不同位置。第三条支路的起点是丙酮酸，它经丙酮酸羧化酶生成草酰乙酸，后者接受谷氨酸的氨基成为天冬氨酸。一位以精制糖为主食并长期嗜酒的男性，红细胞转酮醇酶活性为正常的 45%，加入焦磷酸硫胺素后恢复到 90%，其外周血淋巴细胞在丝裂原刺激后的增殖反应明显低于对照。","vignette_title":"情景 3：一条葡萄糖的三个分岔口","gidx":3,"gn":5,"anchor":"嘌呤与嘧啶核苷酸从头合成的共同起点"},{"id":"gc24-04-1","ch":15,"part":3,"tag":"判读","stem":"5-磷酸核糖的浓度与放射性比活处于正常水平，而 PRPP 只有对照的 12%，最可能的阻断点是","options":["阻断在葡糖-6-磷酸脱氢酶催化的磷酸戊糖途径氧化阶段","阻断在转酮醇酶催化的非氧化阶段的碳单位重排反应","阻断在 5-磷酸核糖与 ATP 生成 PRPP 的反应这一步","阻断在 PRPP 与谷氨酰胺生成 5-磷酸核糖胺的反应","阻断在天冬氨酸向嘧啶环提供氮原子的转氨基反应"],"answer":2,"explain":"C 对：5-磷酸核糖无论是浓度还是由标记葡萄糖得到的放射性比活都与对照接近，说明磷酸戊糖途径畅通；PRPP 却降到对照的 12%，缺口正好落在 5-磷酸核糖与 ATP 生成 PRPP 这一步，与该细胞 PRPP 合成酶活性只剩 8% 的酶活结果吻合。A 错：氧化阶段受限会使 5-磷酸核糖生成减少，与实测浓度正常矛盾。B 错：非氧化阶段受限同样会使 5-磷酸核糖下降，且葡糖-6-磷酸脱氢酶的活性已提示该途径上游通畅。D 错：这一步在 PRPP 之后，若阻断在此处，PRPP 会因消耗减少而堆积而不是降到 12%。E 错：天冬氨酸的浓度 4.4 与对照 4.5 接近，转氨酶活性正常，不支持阻断在供氮环节。","type":"A1","group":"c24-04","kind":"experiment","chs":[15,11,14],"vignette":"为定位一株人白血病细胞系核苷酸合成受阻的环节，研究生在含 11.0 mmol/L 葡萄糖与 2.0 mmol/L 谷氨酰胺的培养基中做了三组测定，各样品的细胞数已配平。第一组测细胞内代谢物浓度，单位 nmol/mg 蛋白：5-磷酸核糖 0.90（对照 0.90），PRPP 0.05（对照 0.40），α-酮戊二酸 1.2（对照 1.2），天冬氨酸 4.4（对照 4.5）。第二组测酶活性，以对照的百分比表示：PRPP 合成酶 8，葡糖-6-磷酸脱氢酶 96，天冬氨酸转氨酶 101，丝氨酸羟甲基转移酶 99。第三组以 ¹⁴C 标记的葡萄糖孵育 3 小时：细胞内 5-磷酸核糖的放射性比活与对照接近，腺苷酸与尿苷酸的放射性比活降到对照的 10% 以下。补充实验：培养基中加入 0.1 mmol/L 次黄嘌呤 24 小时后，细胞内的腺苷酸含量与增殖速率都没有恢复；另以 ¹⁵N 标记的甘氨酸孵育时，标记进入嘌呤核苷酸而在嘧啶核苷酸中检不出；改以 ¹⁵N 标记的天冬氨酸孵育，嘌呤与嘧啶核苷酸中都可检出标记。","vignette_title":"情景 4：三项指标共同指向的分流点","gidx":1,"gn":5,"anchor":"5-磷酸核糖的放射性比活与对照接近"},{"id":"gc24-04-2","ch":15,"part":3,"tag":"方案","stem":"培养基中加入次黄嘌呤后，细胞内的腺苷酸含量与增殖速率都没有恢复，说明","options":["补救合成途径的酶已经缺失，加入碱基不能发挥作用","补救合成同样需要 PRPP 提供磷酸核糖，因此不能恢复","次黄嘌呤不能进入细胞，加入后未达到有效的浓度","细胞的嘌呤核苷酸合成途径正常，缺陷位于嘧啶一侧","次黄嘌呤在细胞内被迅速分解为尿酸而失去作用"],"answer":1,"explain":"B 对：补救合成由次黄嘌呤-鸟嘌呤磷酸核糖转移酶等催化，反应需要 PRPP 提供磷酸核糖；该细胞 PRPP 只剩对照的 12%，故补加碱基也造不出核苷酸，这正是把阻断点锁定在 PRPP 生成的旁证，说明两种合成路线共用同一份磷酸核糖供应。A 错：酶缺失与 PRPP 不足都会使补加碱基无效，但酶活测定已给出 PRPP 合成酶只有 8%，把原因归为补救酶缺失缺少直接证据。C 错：次黄嘌呤进入细胞并不需要特殊转运，浓度也不是本例的关键。D 错：腺苷酸与尿苷酸的放射性比活同时下降，说明嘌呤与嘧啶两条路线都受影响。E 错：分解为尿酸是嘌呤的终末去路，不能解释加入碱基后腺苷酸含量毫无恢复。","type":"A1","group":"c24-04","kind":"experiment","chs":[15,11,14],"vignette":"为定位一株人白血病细胞系核苷酸合成受阻的环节，研究生在含 11.0 mmol/L 葡萄糖与 2.0 mmol/L 谷氨酰胺的培养基中做了三组测定，各样品的细胞数已配平。第一组测细胞内代谢物浓度，单位 nmol/mg 蛋白：5-磷酸核糖 0.90（对照 0.90），PRPP 0.05（对照 0.40），α-酮戊二酸 1.2（对照 1.2），天冬氨酸 4.4（对照 4.5）。第二组测酶活性，以对照的百分比表示：PRPP 合成酶 8，葡糖-6-磷酸脱氢酶 96，天冬氨酸转氨酶 101，丝氨酸羟甲基转移酶 99。第三组以 ¹⁴C 标记的葡萄糖孵育 3 小时：细胞内 5-磷酸核糖的放射性比活与对照接近，腺苷酸与尿苷酸的放射性比活降到对照的 10% 以下。补充实验：培养基中加入 0.1 mmol/L 次黄嘌呤 24 小时后，细胞内的腺苷酸含量与增殖速率都没有恢复；另以 ¹⁵N 标记的甘氨酸孵育时，标记进入嘌呤核苷酸而在嘧啶核苷酸中检不出；改以 ¹⁵N 标记的天冬氨酸孵育，嘌呤与嘧啶核苷酸中都可检出标记。","vignette_title":"情景 4：三项指标共同指向的分流点","gidx":2,"gn":5,"anchor":"细胞内的腺苷酸含量与增殖速率都没有恢复"},{"ch":15,"part":3,"tag":"嘌呤环来源","stem":"嘌呤核苷酸从头合成时，嘌呤环中的C2和C8由下列哪种物质直接提供","options":["甘氨酸","天冬氨酸","谷氨酰胺","一碳单位（N10-甲酰基四氢叶酸）","CO2"],"answer":3,"explain":"嘌呤环原子来源：甘氨酸提供C4、C5、N7，天冬氨酸提供N1，谷氨酰胺提供N3、N9，CO2提供C6，一碳单位提供C2和C8。","type":"A1","id":"c15-d7f9e67e"},{"ch":15,"part":3,"tag":"从头合成调节","stem":"嘌呤核苷酸从头合成途径中，催化限速步骤并受AMP、GMP等终产物反馈抑制的酶是","options":["二氢乳清酸脱氢酶","谷氨酰胺-PRPP酰胺转移酶","腺苷酸代琥珀酸裂解酶","次黄嘌呤-鸟嘌呤磷酸核糖转移酶（HGPRT）","核糖核苷酸还原酶"],"answer":1,"explain":"嘌呤从头合成的关键调节酶是PRPP合成酶和谷氨酰胺-PRPP酰胺转移酶（限速步骤），AMP、GMP可反馈抑制；HGPRT属补救合成途径的酶。","type":"A1","id":"c15-41314743"},{"ch":15,"part":3,"tag":"补救合成","stem":"关于核苷酸补救合成途径的叙述，正确的是","options":["补救合成只能利用游离的嘧啶碱","补救合成是体内核苷酸的主要来源","补救合成酶系主要位于肝细胞线粒体内","HGPRT催化腺嘌呤与PRPP反应生成AMP","HGPRT催化次黄嘌呤、鸟嘌呤与PRPP反应生成IMP和GMP"],"answer":4,"explain":"补救合成中HGPRT催化次黄嘌呤、鸟嘌呤与PRPP生成IMP、GMP，APRT催化腺嘌呤生成AMP；该途径耗能少，脑和骨髓等组织主要依赖它。","type":"A1","id":"c15-ef74363b"},{"ch":15,"part":3,"tag":"嘧啶合成","stem":"与嘌呤核苷酸从头合成相比，嘧啶核苷酸从头合成途径的特点是","options":["先合成嘧啶环（乳清酸），再与PRPP提供的磷酸核糖结合生成UMP","先由PRPP提供磷酸核糖，再在此基础上逐步合成嘧啶环","其关键酶是位于线粒体的氨基甲酰磷酸合成酶Ⅰ","整个过程不需要谷氨酰胺参与","嘧啶环的氮原子全部由天冬氨酸提供"],"answer":0,"explain":"嘧啶从头合成先由谷氨酰胺、CO2和天冬氨酸合成嘧啶环（乳清酸），再与PRPP提供的磷酸核糖结合成UMP；催化第一步的CPS-Ⅱ位于胞液。","type":"A1","id":"c15-af5da0dc"},{"ch":15,"part":3,"tag":"脱氧核苷酸","stem":"脱氧胸苷酸（dTMP）的生成方式是","options":["由UDP先还原为dUDP，再脱磷酸生成","由胸腺嘧啶与PRPP经补救合成生成","由dUMP在胸苷酸合酶催化下接受N5,N10-甲烯基四氢叶酸的甲基生成","由dCMP直接脱去氨基生成","由核糖核苷酸还原酶直接催化UMP生成"],"answer":2,"explain":"dTMP由dUMP经胸苷酸合酶催化、以N5,N10-甲烯基四氢叶酸提供甲基生成，是一碳单位联系核苷酸代谢的典型反应；核糖核苷酸还原酶催化NDP→dNDP。","type":"A1","id":"c15-79b57184"},{"ch":15,"part":3,"tag":"尿酸生成","stem":"人体内嘌呤核苷酸分解代谢的终产物是","options":["尿素","β-丙氨酸","尿囊素","尿酸","CO2和NH3"],"answer":3,"explain":"人体缺乏尿酸氧化酶，嘌呤核苷酸分解的终产物是尿酸；嘧啶核苷酸分解的终产物才是CO2、NH3及β-丙氨酸、β-氨基异丁酸。","type":"A1","id":"c15-e90ebc69"},{"ch":15,"part":3,"tag":"痛风用药","stem":"痛风患者应用别嘌呤醇治疗的生化机制是","options":["直接促进尿酸从肾小管排泄","其结构与次黄嘌呤相似，竞争性抑制黄嘌呤氧化酶，使尿酸生成减少","抑制PRPP酰胺转移酶，完全阻断嘌呤从头合成","促进嘌呤核苷酸补救合成，加速尿酸清除","激活尿酸氧化酶，使尿酸加速分解"],"answer":1,"explain":"痛风因嘌呤代谢异常使尿酸生成过多，别嘌呤醇为次黄嘌呤类似物，竞争性抑制黄嘌呤氧化酶（催化次黄嘌呤→黄嘌呤→尿酸），减少尿酸生成。","type":"A1","id":"c15-37eae183"},{"ch":15,"part":3,"tag":"抗代谢物","stem":"下列核苷酸抗代谢物与其作用靶点配对正确的是","options":["6-巯基嘌呤——抑制核糖核苷酸还原酶","5-氟尿嘧啶——抑制二氢叶酸还原酶","甲氨蝶呤——抑制胸苷酸合酶","阿糖胞苷——抑制PRPP合成酶","甲氨蝶呤——抑制二氢叶酸还原酶，使四氢叶酸再生受阻"],"answer":4,"explain":"甲氨蝶呤抑制二氢叶酸还原酶，阻断FH4再生，影响dTMP和嘌呤合成；5-FU的活性产物抑制胸苷酸合酶，6-巯基嘌呤抑制PRPP酰胺转移酶及IMP转变。","type":"A1","id":"c15-d49316b8"},{"ch":15,"part":3,"tag":"PRPP生成","stem":"关于磷酸核糖焦磷酸（PRPP）的叙述，正确的是","options":["PRPP 由核糖-5-磷酸与 AMP 在 PRPP 合成酶催化下生成","PRPP 是嘌呤核苷酸从头合成的中间产物，嘧啶核苷酸合成不需要它","PRPP 由核糖-5-磷酸与 ATP 在 PRPP 合成酶催化下生成，为嘌呤、嘧啶核苷酸的从头合成提供磷酸核糖","PRPP 可直接提供嘌呤环的碳原子和氮原子","PRPP 只参与补救合成，在从头合成途径中不起作用"],"answer":2,"explain":"PRPP 合成酶催化核糖-5-磷酸与 ATP 生成 PRPP 并释放 AMP；PRPP 为嘌呤、嘧啶核苷酸的从头合成以及补救合成提供磷酸核糖。","type":"A1","id":"c15-f1ed9de3"},{"ch":15,"part":3,"tag":"IMP转变","stem":"关于嘌呤核苷酸从头合成中 IMP 转变为 AMP 与 GMP 的叙述，正确的是","options":["IMP 先由天冬氨酸提供氨基生成 AMP；IMP 氧化为 XMP 后由谷氨酰胺提供氨基生成 GMP","IMP 先转变为 AMP，再由 AMP 脱氨生成 GMP","IMP 转变为 AMP 时由谷氨酰胺提供氨基，转变为 GMP 时由天冬氨酸提供氨基","IMP 转变为 AMP 和 GMP 均不需要消耗 ATP 或 GTP","IMP 是嘌呤核苷酸从头合成的终产物，不能再进一步转变"],"answer":0,"explain":"IMP 经腺苷酸代琥珀酸（天冬氨酸供氨基，消耗 GTP）生成 AMP；IMP 先氧化为 XMP，再由谷氨酰胺供氨基（消耗 ATP）生成 GMP。","type":"A1","id":"c15-191a9d1d"},{"ch":15,"part":3,"tag":"Lesch-Nyhan综合征","stem":"关于次黄嘌呤-鸟嘌呤磷酸核糖转移酶（HGPRT）完全缺乏所致疾病的叙述，正确的是","options":["患者血尿酸降低，尿中尿酸排出减少","患者因嘌呤核苷酸从头合成减少而出现严重免疫缺陷，神经系统不受累","该病即乳清酸尿症，患者尿中乳清酸大量排出","补充嘌呤核苷酸即可完全纠正患者的神经系统症状","患者表现为自毁容貌综合征（Lesch-Nyhan 综合征）：高尿酸血症伴智力低下、攻击行为和自残，因补救合成障碍使 PRPP 堆积、嘌呤从头合成加速"],"answer":4,"explain":"HGPRT 完全缺乏使次黄嘌呤、鸟嘌呤不能经补救合成回收，PRPP 堆积并加速嘌呤从头合成，尿酸生成增多，表现为自毁容貌综合征。","type":"A1","id":"c15-0516d8ee"},{"ch":15,"part":3,"tag":"乳清酸尿症","stem":"遗传性乳清酸尿症患者尿中乳清酸大量排出，其生化机制是","options":["尿酸氧化酶缺陷，使尿酸转变为乳清酸","乳清酸磷酸核糖转移酶和（或）乳清酸核苷酸脱羧酶缺陷，乳清酸不能转变为 UMP 而在体内堆积、随尿排出","HGPRT 缺陷使嘌呤补救合成障碍，乳清酸生成增多","尿素循环障碍使血氨升高，氨在肝内转变为乳清酸","胸苷酸合酶缺陷使 dTMP 生成减少，乳清酸因而增多"],"answer":1,"explain":"乳清酸与 PRPP 经乳清酸磷酸核糖转移酶生成 OMP，再由 OMP 脱羧酶生成 UMP；这两种酶遗传性缺陷使乳清酸堆积并随尿排出。","type":"A1","id":"c15-d40a7a86"},{"ch":15,"part":3,"tag":"核糖核苷酸还原酶","stem":"关于脱氧核糖核苷酸生成的叙述，正确的是","options":["核糖核苷酸还原酶直接催化 NTP 还原为 dNTP，且不受任何调节","脱氧核苷酸只能由食物中的脱氧核苷经补救合成提供","核糖核苷酸还原酶催化的还原反应不消耗还原当量","核糖核苷酸还原酶在二磷酸核苷（NDP）水平催化还原生成 dNDP，还原当量由 NADPH 经还原型硫氧还蛋白（或谷氧还蛋白）提供，其活性受 dATP 抑制、受 ATP 激活","脱氧胸苷酸（dTMP）由 dUDP 直接脱磷酸生成"],"answer":3,"explain":"核糖核苷酸还原酶以 NDP 为底物生成 dNDP，还原当量由 NADPH 经硫氧还蛋白或谷氧还蛋白传递；dATP 抑制、ATP 激活该酶。","type":"A1","id":"c15-5de912ec"},{"ch":15,"part":3,"tag":"嘧啶分解","stem":"关于嘧啶核苷酸分解代谢终产物的叙述，正确的是","options":["胞嘧啶、尿嘧啶分解生成 β-丙氨酸、CO2 和 NH3，胸腺嘧啶分解生成 β-氨基异丁酸","嘧啶核苷酸分解的终产物与嘌呤核苷酸相同，均为尿酸","嘧啶核苷酸分解的终产物为尿素和尿酸","嘧啶碱在体内不能分解，只能以原形随尿排出","胸腺嘧啶分解生成 β-丙氨酸，而尿嘧啶分解生成 β-氨基异丁酸"],"answer":0,"explain":"嘧啶碱分解时环被打开：胞嘧啶、尿嘧啶生成 β-丙氨酸，胸腺嘧啶生成 β-氨基异丁酸，同时产生 CO2 和 NH3，与嘌呤的终产物尿酸不同。","type":"A1","id":"c15-1ddaabe8"},{"ch":15,"part":3,"tag":"6-巯基嘌呤","stem":"6-巯基嘌呤（6-MP）作为抗肿瘤药物的生化机制是","options":["直接抑制二氢叶酸还原酶，阻断四氢叶酸的再生","在体内转变为氟尿嘧啶脱氧核苷酸，抑制胸苷酸合酶","直接抑制核糖核苷酸还原酶，使 dNTP 生成减少","经 HGPRT 转变为 6-巯基嘌呤核苷酸，抑制 PRPP 酰胺转移酶和 IMP 脱氢酶，阻断嘌呤核苷酸的从头合成","激活黄嘌呤氧化酶，加速尿酸生成而抑制肿瘤"],"answer":3,"explain":"6-MP 结构与次黄嘌呤相似，经补救合成转变为 6-巯基嘌呤核苷酸，反馈抑制 PRPP 酰胺转移酶和 IMP 脱氢酶，阻断 IMP 及 AMP、GMP 的生成。","type":"A1","id":"c15-e7e15321"},{"ch":15,"part":3,"tag":"CTP生成","stem":"关于嘧啶核苷酸从头合成的调节及 CTP 生成的叙述，正确的是","options":["氨基甲酰磷酸合成酶Ⅱ（CPS-Ⅱ）位于线粒体，以游离氨为氮源","UTP 直接接受天冬氨酸提供的氨基生成 CTP，该反应不消耗能量","CPS-Ⅱ 不受终产物反馈调节，其活性只取决于底物浓度","嘧啶核苷酸从头合成的第一个核苷酸是 CTP","胞液中的 CPS-Ⅱ 以谷氨酰胺为氮源，其活性受 UTP 反馈抑制、受 ATP 和 PRPP 激活；UTP 经 CTP 合成酶催化接受谷氨酰胺的酰胺氮生成 CTP"],"answer":4,"explain":"CPS-Ⅱ 位于胞液，以谷氨酰胺为氮源合成氨基甲酰磷酸，受 UTP 抑制、ATP 与 PRPP 激活；UTP 经 CTP 合成酶催化生成 CTP。","type":"A1","id":"c15-7e78830a"},{"id":"gc11-01-4","ch":16,"part":3,"tag":"判读","stem":"抗代谢物对口腔黏膜与骨髓的损伤重于多数静止组织，从代谢调节的角度看，其原因是","options":["这些组织的补救合成酶活性低，核苷酸主要依靠从头合成","这些组织的四氢叶酸含量较高，药物更容易在其中蓄积","这些组织的细胞膜通透性高，药物进入细胞的数量更多","这些组织的细胞增殖活跃，对核苷酸供应的依赖性更高","这些组织的糖酵解速率较低，药物不能被及时灭活"],"answer":3,"explain":"D 对：口腔黏膜与骨髓属更新快的组织，细胞分裂频繁、核苷酸需求量大，一旦 dTMP 与嘌呤核苷酸的供应被切断，DNA 复制立刻受阻，损伤因此比静止组织明显，这体现的是组织器官代谢特点的差异。A 错：骨髓等组织恰恰以补救合成为主，该途径耗能少。B 错：叶酸含量高并不等于药物蓄积多，杀伤取决于四氢叶酸再生被阻断的程度。C 错：药物进入细胞的量不是本例差异的主要原因。E 错：糖酵解速率不影响抗代谢物在细胞内的作用强度，甲氨蝶呤也不靠糖酵解灭活。","type":"A1","group":"c11-01","kind":"mechanism","chs":[15,16],"vignette":"一位 58 岁急性淋巴细胞白血病患者接受化疗，方案中含甲氨蝶呤与 6-巯基嘌呤（6-MP）。用药第 7 天，白细胞由 3.2×10⁹/L 降至 0.8×10⁹/L，口腔黏膜出现多处溃疡；骨髓象显示 S 期细胞比例由 34% 降到 11%。进一步检测发现，患者白血病细胞的谷氨酰胺-PRPP 酰胺转移酶活性是正常淋巴细胞的 6 倍，而次黄嘌呤-鸟嘌呤磷酸核糖转移酶（HGPRT）活性正常。医生解释，增殖中的细胞既要从头合成核苷酸，也要靠补救合成回收碱基，抗代谢物恰好卡在这两条路线的关键节点上。连续用药数月后复查，部分残留白血病细胞的二氢叶酸还原酶含量比治疗前升高 4 倍，而该酶的米氏常数没有变化。","vignette_title":"情景 1：为什么化疗药盯着正在分裂的细胞","gidx":4,"gn":5,"anchor":"口腔黏膜出现多处溃疡"},{"id":"gc14-01-1","ch":16,"part":3,"tag":"机制","stem":"该患者 180 分钟血糖已降至 3.0 mmol/L 而胰岛素仍为 52 mU/L，最直接的机制是","options":["胰岛素分泌高峰延迟，血糖回落后其降糖作用仍在持续","胰岛素分泌量不足，外周组织摄取与利用葡萄糖减少","胰高血糖素分泌不足，肝糖原分解与糖异生明显减弱","胰岛素受体数目增多，外周组织摄取葡萄糖的速率加快","糖皮质激素分泌减少，肝内糖异生的原料来源随之减少"],"answer":0,"explain":"A 对：情景给出胰岛素 120 分钟才达峰值、180 分钟仍有 52 mU/L，说明分泌高峰向后延迟，血糖已经回落而降糖作用仍在持续，这就是反应性低血糖。B 错：若胰岛素分泌不足，血糖应持续偏高，与 180 分钟的低血糖矛盾。C 错：低血糖发作时胰高血糖素是升高的，把低血糖归为它分泌不足与情景不符。D 错：胰岛素抵抗时受体数目并不增多，受体增多也不能解释血糖先高后低这种时相错位。E 错：糖皮质激素减少不利于血糖回升，但本例血糖骤降的直接原因是胰岛素高峰延迟。","type":"A1","group":"c14-01","kind":"mechanism","chs":[16,11],"vignette":"一名 49 岁男性，体重 92 kg，腰围 101 cm。口服 75 g 葡萄糖后 3 小时内同步测血糖与胰岛素：血糖 30 分钟升至 11.8 mmol/L，180 分钟降至 3.0 mmol/L，此刻出现心慌、出汗与手抖；胰岛素 120 分钟才达峰值 71 mU/L，180 分钟仍为 52 mU/L。医生解释，他的脂肪与肌肉组织对胰岛素的反应减弱，胰岛β细胞只能分泌更多胰岛素来代偿，而分泌高峰的时相向后推移。低血糖发作时，血中胰高血糖素、肾上腺素与生长激素升高，肝内糖原分解与糖异生被动员；同一时刻测得的血乳酸为 2.6 mmol/L，但肝外的肌肉并不能直接把糖原变成血中的葡萄糖。","vignette_title":"情景 1：餐后三小时，血糖为什么反而掉下去了","gidx":1,"gn":5,"anchor":"而分泌高峰的时相向后推移"},{"id":"gc14-01-2","ch":16,"part":3,"tag":"机制","stem":"该患者发作时胰高血糖素、肾上腺素与生长激素同时升高，与胰岛素相比，它们的作用特点是","options":["通过降低肝内 cAMP 水平，抑制糖原分解与糖异生","与胰岛素结合同一个受体，竞争后产生相反的效应","升高血糖，与胰岛素降低血糖的作用方向正好相反","由胰岛α细胞分泌，与胰岛素来自同一群内分泌细胞","是体内唯一能升高血糖的激素，故升糖作用最为强大"],"answer":2,"explain":"C 对：胰岛素是体内唯一能降低血糖的激素，而胰高血糖素、肾上腺素、生长激素与糖皮质激素都升高血糖，两者方向相反，故低血糖时升糖激素增多可使血糖回升。A 错：胰高血糖素与肾上腺素恰恰是升高肝内 cAMP 并经蛋白激酶 A 促进糖原分解，方向写反。B 错：各类激素各有自己的受体，不与胰岛素共用同一受体。D 错：胰岛素由胰岛β细胞分泌，胰高血糖素由胰岛α细胞分泌，并非同一群细胞。E 错：升糖激素不止一种，把其中一种说成唯一且最强，不符合激素之间的协同关系。","type":"A1","group":"c14-01","kind":"mechanism","chs":[16,11],"vignette":"一名 49 岁男性，体重 92 kg，腰围 101 cm。口服 75 g 葡萄糖后 3 小时内同步测血糖与胰岛素：血糖 30 分钟升至 11.8 mmol/L，180 分钟降至 3.0 mmol/L，此刻出现心慌、出汗与手抖；胰岛素 120 分钟才达峰值 71 mU/L，180 分钟仍为 52 mU/L。医生解释，他的脂肪与肌肉组织对胰岛素的反应减弱，胰岛β细胞只能分泌更多胰岛素来代偿，而分泌高峰的时相向后推移。低血糖发作时，血中胰高血糖素、肾上腺素与生长激素升高，肝内糖原分解与糖异生被动员；同一时刻测得的血乳酸为 2.6 mmol/L，但肝外的肌肉并不能直接把糖原变成血中的葡萄糖。","vignette_title":"情景 1：餐后三小时，血糖为什么反而掉下去了","gidx":2,"gn":5,"anchor":"胰高血糖素、肾上腺素与生长激素升高"},{"id":"gc14-01-4","ch":16,"part":3,"tag":"判读","stem":"关于该患者的血糖调节与随访，下列判断正确的是（X 型多选）","options":["他的组织对胰岛素反应减弱，属于胰岛素抵抗的表现","他的胰岛β细胞分泌的胰岛素总量低于正常人群水平","餐后 180 分钟的低血糖与胰岛素分泌高峰延迟有关","发作时胰高血糖素、肾上腺素与生长激素均已升高","他血中的乳酸在肝内不能再经糖异生转变为葡萄糖"],"answer":[0,2,3],"explain":"答案 ACD。A 对：情景写明他的脂肪与肌肉组织对胰岛素的反应减弱，即胰岛素抵抗，2 型糖尿病常以此为主要环节。C 对：胰岛素 120 分钟才达峰值、180 分钟仍为 52 mU/L，高峰延迟使血糖回落后降糖作用仍强，形成反应性低血糖。D 对：情景给出胰高血糖素、肾上腺素与生长激素均已升高，多种升糖激素共同对抗低血糖。B 错：情景给出胰岛β细胞分泌更多胰岛素来代偿，其总量高于而非低于正常。E 错：乳酸循环的主要场所在肝，血乳酸可以在肝内经糖异生转变为葡萄糖，只是肌肉自身不能完成这一步。","type":"X","group":"c14-01","kind":"mechanism","chs":[16,11],"vignette":"一名 49 岁男性，体重 92 kg，腰围 101 cm。口服 75 g 葡萄糖后 3 小时内同步测血糖与胰岛素：血糖 30 分钟升至 11.8 mmol/L，180 分钟降至 3.0 mmol/L，此刻出现心慌、出汗与手抖；胰岛素 120 分钟才达峰值 71 mU/L，180 分钟仍为 52 mU/L。医生解释，他的脂肪与肌肉组织对胰岛素的反应减弱，胰岛β细胞只能分泌更多胰岛素来代偿，而分泌高峰的时相向后推移。低血糖发作时，血中胰高血糖素、肾上腺素与生长激素升高，肝内糖原分解与糖异生被动员；同一时刻测得的血乳酸为 2.6 mmol/L，但肝外的肌肉并不能直接把糖原变成血中的葡萄糖。","vignette_title":"情景 1：餐后三小时，血糖为什么反而掉下去了","gidx":4,"gn":5,"anchor":"对胰岛素的反应减弱"},{"id":"gc14-02-4","ch":16,"part":3,"tag":"判读","stem":"用药后肝内 HMG-CoA 还原酶的 mRNA 比用药前升高 3.1 倍，说明","options":["细胞内胆固醇增多，对该酶合成的反馈抑制被加强","细胞内胆固醇减少，对该酶合成的反馈抑制被解除","该酶被磷酸化修饰后活性升高，属化学修饰调节","该酶位于线粒体内膜，mRNA 升高提示线粒体增殖","该酶催化的是胆固醇降解的第一步，故分解加快"],"answer":1,"explain":"B 对：HMG-CoA 还原酶是胆固醇合成的限速酶，受细胞内胆固醇的反馈抑制；他汀阻断该酶后肝细胞内胆固醇减少，反馈抑制被解除，酶基因表达增强，故 mRNA 升高 3.1 倍。A 把方向写反，胆固醇增多时该酶合成受抑，mRNA 应下降。C 错：mRNA 升高说明酶蛋白的合成速率改变，属于酶含量调节，不是磷酸化这类快速修饰。D 错：该酶位于胞质与内质网，并不在线粒体内膜，其 mRNA 升高也不代表线粒体增殖。E 错：该酶催化的是胆固醇合成的早期步骤，并非降解反应。","type":"A1","group":"c14-02","kind":"mechanism","chs":[12,4,16],"vignette":"一名 46 岁男性因双侧跟腱增粗并出现黄色瘤就诊，角膜边缘可见一圈灰白色环。血脂检查：总胆固醇 13.6 mmol/L，LDL-胆固醇 11.2 mmol/L，甘油三酯 1.4 mmol/L，HDL-胆固醇 0.8 mmol/L。取皮肤成纤维细胞培养，以 ¹²⁵I 标记的 LDL 孵育，细胞结合量仅为正常人的一半，而细胞内胆固醇酯的合成速率与正常人接近。给予他汀类药物 6 周后复查，血浆 LDL-胆固醇降至 7.9 mmol/L；肝穿标本同时显示，HMG-CoA 还原酶的 mRNA 比用药前升高 3.1 倍。医生解释，他的细胞表面识别 LDL 的受体数量不足，血浆中的胆固醇因此不能被及时清除。","vignette_title":"情景 2：从一张血脂报告到细胞表面的受体","gidx":4,"gn":5,"anchor":"比用药前升高 3.1 倍"},{"id":"gc14-03-4","ch":16,"part":3,"tag":"判读","stem":"该患者同时出现血氨升高、空腹低血糖与血乳酸升高，最能说明","options":["这三个指标之间没有关联，分别由三种独立的疾病所引起","肝在糖异生、尿素合成与乳酸利用中处于中心的地位","肾脏已完全替代肝完成糖异生，只是尿素合成能力下降","血氨升高是低血糖的直接原因，氨能抑制肝糖原的分解","血乳酸升高说明肌肉仍在向血液中大量释放游离葡萄糖"],"answer":1,"explain":"B 对：肝既是糖原分解与糖异生、维持空腹血糖的主要器官，又是体内合成尿素的主要场所，同时还摄取乳酸异生为葡萄糖，因此肝功能严重受损时血氨升高、低血糖与乳酸蓄积会同时出现。A 错：三项异常都指向同一个器官的功能衰竭，用三种独立疾病解释不符合情景。C 错：肾可进行糖异生，但长期饥饿时才明显增强，且它不能替代肝的尿素合成功能，说法前后矛盾。D 错：血氨升高主要影响脑的能量代谢与神经递质，并不是抑制肝糖原分解的直接原因。E 错：血乳酸升高说明肌肉生成乳酸增多而肝利用乳酸的能力下降，与肌肉释放葡萄糖是两回事。","type":"A1","group":"c14-03","kind":"mechanism","chs":[14,11,16],"vignette":"一名 58 岁男性，乙型肝炎后肝硬化 8 年，因呕血与黑便入院。入院 48 小时后出现嗜睡与扑翼样震颤。血氨 152 μmol/L（正常 18–72），动脉血 pH 7.49，空腹血糖 2.9 mmol/L，血乳酸 3.4 mmol/L，血尿素仅 1.8 mmol/L，血清白蛋白 26 g/L。医生分析，肠道内积血被细菌分解产氨增多，而肝细胞数量减少使鸟氨酸循环能力下降，氨不能像正常时那样在肝内合成尿素后排出；血中的氨以 NH₄⁺ 与 NH₃ 两种形式存在，二者的比例受血液 pH 影响。患者入院后未进食，肝糖原已近耗竭，肝糖异生能力也随肝细胞减少而下降。","vignette_title":"情景 3：肝硬化患者的一场消化道出血","gidx":4,"gn":5,"anchor":"空腹血糖 2.9 mmol/L"},{"id":"gc14-04-5","ch":16,"part":3,"tag":"判读","stem":"关于该患儿的血糖来源、去路与处理，下列判断正确的是（X 型多选）","options":["他的空腹低血糖与肝糖原分解、糖异生受阻有关","肝糖原因不能分解而不断堆积，肝脏体积随之增大","注射胰高血糖素可使他的血糖迅速回升至正常水平","血糖过低会影响脑组织供能，应避免长时间处于空腹","他的血乳酸升高与肝内糖异生通路受阻有关"],"answer":[0,1,3,4],"explain":"答案 ABDE。A 对：肝糖原分解与糖异生生成的葡糖-6-磷酸都要经葡糖-6-磷酸酶水解才能释放葡萄糖入血，该酶活性只剩 4%，故空腹时血糖来源不足。B 对：水解受阻使肝糖原不断堆积，与肝糖原 84 mg/g 及肝大体征相符。D 对：脑组织主要依靠葡萄糖供能，患儿需少量多餐、夜间加餐，避免长时间空腹诱发低血糖与抽搐。E 对：肝把乳酸异生为葡萄糖的通路受阻，乳酸生成增多而清除减少，因而升高。C 错：实验室结果显示注射胰高血糖素后血糖几乎不动，说明该通路已被阻断，注射胰高血糖素不能让血糖迅速回升。","type":"X","group":"c14-04","kind":"experiment","chs":[11,13,16],"vignette":"一名 9 个月男婴因清晨反复抽搐、肝大就诊。空腹 6 小时血糖 2.3 mmol/L，血乳酸 7.1 mmol/L。肝穿活检：肝糖原 84 mg/g（正常 30–50），葡糖-6-磷酸酶活性为对照的 4%，其余三个糖异生关键酶活性均在正常范围。静脉注射胰高血糖素 30 分钟后，血糖由 2.3 升至 2.5 mmol/L，血乳酸由 7.1 升至 8.6 mmol/L。用 ¹⁴C 标记的乳酸灌注肝匀浆，掺入葡萄糖的量仅为对照的 6%，而掺入二氧化碳的量与对照接近；另取离体肝线粒体测定，以谷氨酸加苹果酸为底物时 P/O 为 2.5，以琥珀酸为底物时为 1.5。","vignette_title":"情景 4：三项数据指向同一个断点","gidx":5,"gn":5,"anchor":"葡糖-6-磷酸酶活性为对照的 4%"},{"id":"gc20-01-4","ch":16,"part":3,"tag":"判读","stem":"该患者体温升至41.2℃而体重明显下降，从能量代谢看其原因是","options":["底物氧化释出的能量被保存于ATP，ATP水解为ADP时释出大量热","质子梯度消失后内膜两侧电势能增大，这部分能量以热的形式释出","电子传递受阻使底物不能被氧化，未氧化的底物在血中直接产热","底物氧化释出的能量不再保存于ATP，而以热能的形式散失","乳酸在肝内异生为葡萄糖的过程中大量产热，使体温随之升高"],"answer":3,"explain":"D 对：ATP合成速率由每分钟每毫克蛋白48nmol降到6nmol，说明底物氧化释出的能量没有得到保存，只能以热的形式散失，体温因而升至41.2℃。A 错：若能量保存于ATP，ATP合成速率不应大幅下降。B 错：情景中质子梯度已降至对照的10%，不存在电势能增大。C 错：服药者线粒体的耗氧量反而升高，说明底物仍在被氧化。E 错：乳酸异生主要在肝内进行，释出的能量有限，不足以解释体温的升高。","type":"A1","group":"c20-01","kind":"mechanism","chs":[13,3,16],"vignette":"20世纪30年代，二硝基苯酚曾作为减肥药公开出售。一名服药一个月的女性体重下降6kg，因持续大汗、发热急诊入院，体温41.2℃。检查：静息耗氧量由每分钟240mL升至520mL，动脉血乳酸由1.0升至4.8mmol/L，血糖6.1mmol/L。取骨骼肌活检分离线粒体，以琥珀酸为底物并加入ADP与Pi测定：耗氧速率为对照的2.5倍（30对12，相对值），跨内膜质子梯度降至对照的10%，ATP合成速率由每分钟每毫克蛋白48nmol降至6nmol，此时电子仍沿呼吸链传给氧分子。另取一管改用谷氨酸加苹果酸为底物，加入鱼藤酮后耗氧降至1以下，质子梯度与ATP合成速率同时下降。向对照线粒体加入丙二酸后耗氧速率下降，把琥珀酸浓度提高10倍，耗氧速率回升至接近对照。","vignette_title":"情景 1：一份减肥药留下的能量账本","gidx":4,"gn":5,"anchor":"因持续大汗、发热急诊入院"},{"id":"gc20-02-4","ch":16,"part":3,"tag":"判读","stem":"入院后心率由78升至120次/分，医师判断这会加重缺血，其机制是","options":["心率加快使心肌糖酵解受到抑制，缺血区ATP生成减少","心率加快使血中游离脂肪酸升高，脂肪酸氧化抑制葡萄糖利用","心率加快使心室充盈时间缩短，缺血区内乳酸不能被及时清除","心率加快使血液pH下降，血红蛋白释放氧的能力随之降低","心率加快使心肌耗氧量增加，而闭塞的冠脉不能相应增加供氧"],"answer":4,"explain":"E 对：心肌耗氧量随心率和收缩力的升高而增加，而闭塞的冠状动脉无法相应增加供氧，缺血区的氧供需矛盾因此加重。A 错：心率加快时心肌糖酵解反而增强，不是受抑。B 错：血中游离脂肪酸升高是应激的结果，不是心率加快加重缺血的直接机制。C 错：乳酸清除减慢属于次要环节，主要矛盾仍是氧的供需失衡。D 错：血液pH下降会使血红蛋白释氧增多，不是加重缺血的原因。","type":"A1","group":"c20-02","kind":"mechanism","chs":[13,11,16],"vignette":"62岁男性因持续胸痛40分钟急诊入院，心电图提示前壁心肌梗死，冠状动脉前降支完全闭塞。心肌活检显示：缺血区氧分压降至1.3kPa（正常约5.3kPa），ATP由24降至8μmol/g，磷酸肌酸由30降至12μmol/g，ADP与AMP分别升高3倍与6倍，乳酸由1.4升至22μmol/g；此时线粒体的电子传递几乎停止，跨内膜质子梯度不能维持。缺血区糖原分解与糖酵解速率提高到原来的8倍，乳酸脱氢酶催化丙酮酸还原为乳酸，使NAD⁺不断再生；血乳酸升至5.2mmol/L，血糖7.8mmol/L。入院后患者心率由78升至120次/分，医师提醒这一变化会进一步加重缺血区的损伤。","vignette_title":"情景 2：冠状动脉堵住后的四十分钟","gidx":4,"gn":5,"anchor":"心率由78升至120次/分"},{"id":"gc20-02-5","ch":16,"part":3,"tag":"机制","stem":"关于该患者缺血区的能量代谢，下列判断正确的是（X 型多选）","options":["缺血区ATP的生成转而主要依赖糖酵解中的底物水平磷酸化","缺血区线粒体的氧化磷酸化停止，三羧酸循环仍正常运转","缺血区NAD⁺的再生依靠乳酸脱氢酶催化的反应维持","缺血区肝外组织酮体生成增加，可替代葡萄糖供应能量","血中乳酸可运至肝，经糖异生转变为葡萄糖供其他组织利用"],"answer":[0,2,4],"explain":"答案 ACE。A、C、E 对应情景中的三条信息：氧化磷酸化停止后底物水平磷酸化成为主要来源；NAD⁺靠乳酸脱氢酶催化的反应再生；乳酸随血液运至肝进行糖异生。B 错：三羧酸循环同样依赖NAD⁺与FAD的再生，缺氧时不能正常运转。D 错：酮体由肝生成，心肌等肝外组织只利用酮体，并不生成酮体来替代葡萄糖。","type":"X","group":"c20-02","kind":"mechanism","chs":[13,11,16],"vignette":"62岁男性因持续胸痛40分钟急诊入院，心电图提示前壁心肌梗死，冠状动脉前降支完全闭塞。心肌活检显示：缺血区氧分压降至1.3kPa（正常约5.3kPa），ATP由24降至8μmol/g，磷酸肌酸由30降至12μmol/g，ADP与AMP分别升高3倍与6倍，乳酸由1.4升至22μmol/g；此时线粒体的电子传递几乎停止，跨内膜质子梯度不能维持。缺血区糖原分解与糖酵解速率提高到原来的8倍，乳酸脱氢酶催化丙酮酸还原为乳酸，使NAD⁺不断再生；血乳酸升至5.2mmol/L，血糖7.8mmol/L。入院后患者心率由78升至120次/分，医师提醒这一变化会进一步加重缺血区的损伤。","vignette_title":"情景 2：冠状动脉堵住后的四十分钟","gidx":5,"gn":5,"anchor":"使NAD⁺不断再生"},{"id":"gc20-03-5","ch":16,"part":3,"tag":"机制","stem":"关于该患者的代谢改变与治疗反应，下列判断正确的是（X 型多选）","options":["基础代谢率升高，静息耗氧量与产热量随之增加","蛋白质与脂肪分解加强，是其体重明显下降的原因之一","血胆固醇偏低说明其肝内胆固醇合成速率明显升高","甲状腺激素使线粒体的氧化磷酸化解偶联，故产热效率下降","治疗6周后基础代谢率才下降，与该效应依赖基因表达有关"],"answer":[0,1,4],"explain":"答案 ABE。A、B、E 对应情景中的三条线索：基础代谢率+45%；三个月内体重下降6kg；治疗6周后才复查到代谢率下降。C 错：甲状腺激素促进胆固醇的分解与清除，血胆固醇偏低并不意味着肝内合成速率升高。D 错：本例P/O比仍为2.5，氧化与磷酸化并未解偶联，产热增多来自ATP周转加快。","type":"X","group":"c20-03","kind":"mechanism","chs":[13,16,25],"vignette":"32岁女性因怕热、多汗、心悸伴三个月内体重下降6kg就诊。体检：心率110次/分，双手细颤，甲状腺弥漫性肿大。检查：血清游离T4为正常上限的3倍，促甲状腺激素（TSH）降低，基础代谢率+45%，静息耗氧量较同龄女性高约40%，血胆固醇3.1mmol/L，血糖正常。医师解释，血中甲状腺激素绝大部分与结合蛋白结合运输，进入细胞后T4在脱碘酶作用下转变为活性更强的T3；T3与细胞核内的受体结合，受体作为配体依赖的转录因子开启一批基因，其中编码钠钾泵的基因转录明显增强，细胞膜上钠钾泵的数目达到同龄人的2.6倍。治疗6周后复查，基础代谢率降至+8%；治疗前取骨骼肌线粒体测定，以谷氨酸加苹果酸为底物时P/O比仍为2.5。","vignette_title":"情景 3：基础代谢率+45%的那位患者","gidx":5,"gn":5,"anchor":"基础代谢率+45%"},{"id":"gc20-04-4","ch":16,"part":3,"tag":"判读","stem":"乙组患儿安静时血乳酸达4.2mmol/L而丙组仅1.3mmol/L，其原因是","options":["乙组患儿乳酸脱氢酶活性降低，乳酸生成后不能被继续代谢","乙组患儿丙酮酸脱氢酶复合体活性升高，丙酮酸大量转向乳酸","乙组NADH不能经复合体Ⅰ氧化，NAD⁺靠生成乳酸再生","乙组患儿肝糖异生关键酶缺陷，血中乳酸不能被转变为葡萄糖","乙组患儿红细胞数目增多，乳酸的生成量随之明显增加"],"answer":2,"explain":"C 对：乙组复合体Ⅰ一侧的电子传递受阻，NADH不能正常氧化，胞质中的NAD⁺主要靠丙酮酸还原为乳酸的反应再生，糖酵解持续进行，乳酸因而堆积。A 错：乳酸脱氢酶活性降低会使乳酸堆积更明显，但本例的关键是NAD⁺再生受阻。B 错：丙酮酸脱氢酶复合体活性升高会减少而不是增加乳酸生成。D 错：肝糖异生障碍会使血乳酸升高，但不能解释乙组以NADH氧化障碍为主的表现。E 错：红细胞数目增多不是本例血乳酸升高的机制。","type":"A1","group":"c20-04","kind":"experiment","chs":[13,3,16],"vignette":"研究生收到三份来自不同患儿的骨骼肌线粒体样品：甲为年龄匹配的正常对照，乙与丙分别来自两名运动不耐受、肌张力低下的患儿，测定前各样品线粒体蛋白量已配平。她以谷氨酸加苹果酸和琥珀酸两种底物，分别测定加ADP后的耗氧速率与ATP合成速率（单位均为nmol·min⁻¹·mg⁻¹），并计算P/O比。结果：甲组以谷氨酸加苹果酸为底物时耗氧24、ATP60、P/O2.5，以琥珀酸为底物时耗氧24、ATP36、P/O1.5；乙组耗氧5、ATP12、P/O2.4与耗氧23、ATP35、P/O1.5；丙组耗氧27、ATP16、P/O0.6与耗氧26、ATP15、P/O0.6。临床资料：乙组患儿安静时血乳酸4.2mmol/L，丙组为1.3mmol/L。为核对测定条件，她又向甲组体系中加入过量ADP与Pi后重复测定。","vignette_title":"情景 4：三份样品与一张三列表","gidx":4,"gn":5,"anchor":"乙组患儿安静时血乳酸4.2mmol/L"},{"id":"gc22-03-4","ch":16,"part":3,"tag":"判读","stem":"肿瘤组织大量摄取葡萄糖并生成乳酸，而心肌以有氧氧化供能，从代谢整合的角度看，最恰当的判断是","options":["肿瘤组织的代谢方式与起源的正常组织基本一致","糖酵解是这些组织共有的主要供能方式","各组织器官的能量代谢各有其主导的方式与特点","组织之间的代谢差异由细胞的增殖速度单独决定","心肌在有氧条件下不进行糖的有氧氧化供能"],"answer":2,"explain":"C 对：情景中肿瘤组织的葡萄糖摄取与乳酸生成都明显升高，而心肌以有氧氧化为主，这正是各组织器官在能量代谢上各有其主导方式与特点的体现，属代谢整合中的组织差异。A 错在肿瘤组织的代谢方式与起源组织并不一致；B 错在心肌以有氧氧化为主，糖酵解并非这些组织共有的主要供能方式；D 错在代谢差异还受激素、酶系表达等多方面影响；E 错在心肌在有氧时同样进行糖的有氧氧化。","type":"A1","group":"c22-03","kind":"mechanism","chs":[26,18,16],"vignette":"一位患者接受两种药物联合治疗：甲药从红豆杉中提取，进入细胞后与微管蛋白结合，使微管一旦聚合就难以解聚；乙药抑制拓扑异构酶，该酶原本通过切断并重新连接磷酸二酯键来消除复制叉前方的正超螺旋。检测显示，该患者肿瘤组织中处于S期的细胞约占45%、G2/M期约占18%；用药24小时后，肿瘤组织的G2/M期细胞升到62%，免疫荧光可见Mad2蛋白在未能正确连接的动粒上聚集，而S期细胞的比例下降到9%。这位患者的心肌细胞与神经元几乎没有损伤，骨髓与口腔黏膜上皮却出现明显的抑制与溃疡。同时测得肿瘤组织摄取葡萄糖的速率约为邻近正常组织的9倍，外周血乳酸升高，而心肌的能量供应仍以有氧氧化为主。停药三周后骨髓抑制逐渐恢复。","vignette_title":"情景 3：两种药只打正在分裂的细胞","gidx":4,"gn":5,"anchor":"心肌的能量供应仍以有氧氧化为主"},{"id":"gc25-03-3","ch":16,"part":3,"tag":"判读","stem":"该患者出现意识模糊与抽搐而心肌酶与心电图始终正常，最合理的解释是","options":["脑组织几乎全靠血糖供能，脂肪酸不能通过血脑屏障进入脑内","心肌不摄取葡萄糖，其能量全部来自脂肪酸的 β 氧化供能","脑组织的糖原储备丰富，低血糖时脑内能量供应不受影响","心肌细胞对低血糖更敏感，但心电图的改变出现得比较晚","血浆游离脂肪酸升高使心肌的能量供应不受血糖影响"],"answer":0,"explain":"A 对：脑组织的糖原储备很少，几乎完全依靠血糖供能，而脂肪酸不能通过血脑屏障，血糖降至 1.9 mmol/L 时脑首先出现功能障碍。B 心肌同样摄取葡萄糖，只是燃料谱较宽；C 与脑糖原储备很少矛盾；D 心肌对低血糖的耐受性高于脑，心电图与心肌酶正常不支持心肌受损；E 心肌在血糖偏低时仍可利用脂肪酸，但这不能解释神经系统症状的出现。","type":"A1","group":"c25-03","kind":"mechanism","chs":[12,13,16],"vignette":"一名 2 型糖尿病患者因胰岛素用量偏大，于凌晨出现心悸、大汗、意识模糊与肢体抽搐。急查：血糖 1.9 mmol/L，血乳酸 1.8 mmol/L，血浆游离脂肪酸 0.9 mmol/L，血酮体 0.2 mmol/L。静脉推注葡萄糖 5 分钟后意识恢复，心电图与心肌酶始终正常。医生分析：血糖下降时胰高血糖素与肾上腺素升高、胰岛素下降，脂肪细胞中激素敏感性甘油三酯脂肪酶被磷酸化而激活，脂肪动员加强，血浆游离脂肪酸升高到平时的两倍多；心肌细胞摄取的脂肪酸在胞质活化为脂酰辅酶A 后，经肉碱转运进入线粒体，经 7 轮 β 氧化生成 7 分子 FADH₂ 与 7 分子 NADH。脑组织的糖原储备很少，其能量几乎全靠血糖，而脂肪酸不能通过血脑屏障；成熟红细胞没有线粒体。","vignette_title":"情景 3：低血糖先打倒大脑，心脏却还在跳","gidx":3,"gn":5,"anchor":"脂肪酸不能通过血脑屏障"},{"id":"gc25-03-4","ch":16,"part":3,"tag":"识别","stem":"该患者血乳酸为 1.8 mmol/L，其成熟红细胞在低血糖期间的能量来源是","options":["依靠葡萄糖的有氧氧化，在线粒体中彻底氧化为二氧化碳","依靠血浆游离脂肪酸的 β 氧化，产生的乳酸运至肝内利用","依靠酮体的氧化，酮体是红细胞在低血糖时的主要燃料","依靠糖原的分解，其糖原储备可维持数小时的能量供应","依靠葡萄糖的无氧酵解，净生成 2 分子 ATP 并产生乳酸"],"answer":4,"explain":"E 对：成熟红细胞没有线粒体，不能进行有氧氧化，也不能氧化脂肪酸与酮体，只能靠葡萄糖的无氧酵解供能，1 分子葡萄糖净生成 2 分子 ATP，同时把丙酮酸还原为乳酸。A、B、C 三条途径都需要线粒体；D 成熟红细胞没有糖原储备，其葡萄糖直接来自血浆。","type":"A1","group":"c25-03","kind":"mechanism","chs":[12,13,16],"vignette":"一名 2 型糖尿病患者因胰岛素用量偏大，于凌晨出现心悸、大汗、意识模糊与肢体抽搐。急查：血糖 1.9 mmol/L，血乳酸 1.8 mmol/L，血浆游离脂肪酸 0.9 mmol/L，血酮体 0.2 mmol/L。静脉推注葡萄糖 5 分钟后意识恢复，心电图与心肌酶始终正常。医生分析：血糖下降时胰高血糖素与肾上腺素升高、胰岛素下降，脂肪细胞中激素敏感性甘油三酯脂肪酶被磷酸化而激活，脂肪动员加强，血浆游离脂肪酸升高到平时的两倍多；心肌细胞摄取的脂肪酸在胞质活化为脂酰辅酶A 后，经肉碱转运进入线粒体，经 7 轮 β 氧化生成 7 分子 FADH₂ 与 7 分子 NADH。脑组织的糖原储备很少，其能量几乎全靠血糖，而脂肪酸不能通过血脑屏障；成熟红细胞没有线粒体。","vignette_title":"情景 3：低血糖先打倒大脑，心脏却还在跳","gidx":4,"gn":5,"anchor":"成熟红细胞没有线粒体"},{"id":"gc3-01-4","ch":16,"part":3,"tag":"判读","stem":"同一时刻肝细胞 PFK-1 活性反而下降，肝内糖代谢的流向变化是","options":["糖酵解增强而糖异生减弱，肝内葡萄糖消耗加快","糖酵解减弱而糖异生增强，肝得以维持血糖","糖酵解减弱而磷酸戊糖途径增强，肝内 NADPH 增多","糖酵解与糖异生同时减弱，肝内葡萄糖净生成减少","糖酵解与糖异生同时增强，肝内葡萄糖更新加快"],"answer":1,"explain":"B 对：PFK-1 是糖酵解最重要的限速酶，其活性下降使糖酵解减弱，糖异生因不受该酶限制而得以增强，肝因此能在肌肉大量耗糖时维持血糖。E 错：PFK-1 受抑时糖酵解不可能同时增强，二者方向相反。A 错：流向与情景描述正好相反。D 错：两条途径同时减弱无法解释血糖的维持。C 错：PFK-1 受抑并不引起磷酸戊糖途径增强，情景也未给出 NADPH 增多的依据。","type":"A1","group":"c3-01","kind":"mechanism","chs":[11,16,3],"vignette":"短跑冲刺 30 秒，骨骼肌细胞内 ATP 由 5.2 mmol/L 降到 3.1 mmol/L，AMP 升高约 5 倍，柠檬酸由 1.1 mmol/L 降到 0.3 mmol/L，实测 PFK-1 活性升高约 8 倍；乳酸脱氢酶把丙酮酸还原为乳酸，使 NAD⁺ 不断再生，糖酵解在无氧条件下仍可净生成 2 分子 ATP。把底物果糖-6-磷酸浓度提高 10 倍，被 ATP 与柠檬酸抑制的 PFK-1 活性仍无明显回升。同一时刻肝细胞 ATP 与柠檬酸水平偏高，胰高血糖素经 cAMP 通路使肝内果糖-2,6-二磷酸减少，肝细胞 PFK-1 活性反而下降，糖异生得以维持血糖；骨骼肌则缺乏葡糖-6-磷酸酶，糖原分解产物不能直接补充血糖。","vignette_title":"情景 1：冲刺三十秒里的两个 PFK-1","gidx":4,"gn":5,"anchor":"糖异生得以维持血糖"},{"id":"gc3-02-4","ch":16,"part":3,"tag":"判读","stem":"禁食 16 小时肝内尿素合成与糖异生同时增强，其共同的上游调节是","options":["血中游离脂肪酸降低，肝内酯化增强","血中葡萄糖浓度升高，肝细胞摄取增多","胰高血糖素与糖皮质激素分泌增多","血氨浓度降低，氨甲酰磷酸合成减少","胰岛素分泌增多，肝内 cAMP 水平升高"],"answer":2,"explain":"C 对：禁食时胰高血糖素与糖皮质激素分泌增多，前者经 cAMP 通路促进糖异生并加速尿素合成，后者诱导糖异生关键酶的基因表达，两条途径因此同时增强。E 错：胰岛素是饱食状态下的激素，分泌增多会促进合成代谢、抑制糖异生。B 错：血糖升高说明糖异生已被抑制，与饥饿状态的激素背景不符。A 错：禁食时脂肪动员加强，血浆游离脂肪酸不降反升。D 错：血氨降低不会使尿素合成增强，尿素合成增多恰恰是因为进入肝的氨增多。","type":"A1","group":"c3-02","kind":"mechanism","chs":[11,14,16],"vignette":"禁食 16 小时后，血糖仍维持在 4.5 mmol/L 左右，而肝糖原由 70 g 降至约 20 g，尿中尿素排出量比餐后增加近一倍。此时骨骼肌蛋白质分解加强，氨经转氨基作用交给丙酮酸生成丙氨酸，随血液运至肝；肝把丙氨酸脱氨后，氨进入鸟氨酸循环合成尿素，剩下的丙酮酸成为糖异生的原料。肝细胞内丙酮酸羧化酶与磷酸烯醇式丙酮酸羧激酶活性明显升高，乳酸、甘油和生糖氨基酸成为血糖的主要来源。血浆游离脂肪酸虽然明显升高，但它并不能大量转变为葡萄糖。","vignette_title":"情景 2：禁食十六小时，血糖从哪里来","gidx":4,"gn":5,"anchor":"尿中尿素排出量比餐后增加近一倍"},{"id":"gc3-03-5","ch":16,"part":3,"tag":"判读","stem":"关于胰岛素缺乏时的代谢整合与酮体代谢，下列判断正确的是（X 型多选）","options":["乙酰乙酸与 β-羟丁酸在血中堆积，可引起代谢性酸中毒","肝细胞既能生成酮体，也能氧化利用酮体","酮体随血流运至脑、心、肾等肝外组织氧化利用","胰岛素缺乏使脂肪动员加强，肝内酮体生成随之增多","当肝内酮体生成超过肝外组织利用能力时，血酮升高"],"answer":[0,2,3,4],"explain":"答案 ACDE。A 对：乙酰乙酸与 β-羟丁酸都是有机酸，堆积后大量消耗 HCO₃⁻，形成代谢性酸中毒（本例 pH 7.22、HCO₃⁻ 8 mmol/L）。C 对：酮体在肝内生成后经血流运至脑、心、肾等肝外组织氧化利用，长期饥饿时脑尤其依赖酮体。D 对：胰岛素缺乏使激素敏感性甘油三酯脂肪酶活性升高、脂肪动员加强，肝内 β 氧化与酮体生成随之增多。E 对：血酮水平取决于生成与利用的平衡，生成超过肝外利用能力时血酮升高。B 错：肝细胞缺乏琥珀酰CoA转硫酶，只能生成酮体、不能利用酮体，观察 ① 已给出直接证据（本题不在材料里给结论，需要自己判断）。","type":"X","group":"c3-03","kind":"mechanism","chs":[12,16,11],"vignette":"一名 1 型糖尿病患者中断胰岛素治疗 12 小时后入院，呼吸深快（28 次/分），呼气有烂苹果味，皮肤干燥。化验：血糖 22 mmol/L，血浆游离脂肪酸 1.8 mmol/L（正常 0.4～0.9），血酮 5.2 mmol/L，动脉血 pH 7.22、HCO₃⁻ 8 mmol/L。治疗观察：补液并静脉滴注小剂量胰岛素后 6 小时，血糖降至 11 mmol/L，血浆游离脂肪酸降至 0.6 mmol/L，血酮降至 1.8 mmol/L，pH 回升至 7.31。实验室观察两项：① 取患者肝组织匀浆，加入等量 ¹⁴C 标记的乙酰乙酸孵育 30 分钟，放射性几乎全部保留在乙酰乙酸中；同法处理的骨骼肌匀浆中，大部分放射性转移到其他产物。② 把 ¹⁴C 标记的脂肪酸加到患者肌组织匀浆中，标记物可在分离出的线粒体组分中被氧化；若先用肉碱转运体抑制剂处理，标记物便停留在胞质组分中。","vignette_title":"情景 3：血糖 22 mmol/L，血酮 5.2 mmol/L","gidx":5,"gn":5,"anchor":"呼气有烂苹果味"},{"id":"gc8-01-2","ch":16,"part":3,"tag":"机制","stem":"同一 PKA 的磷酸化修饰使两种糖原代谢酶活性反向变化，正确的是","options":["磷酸化使糖原磷酸化酶与糖原合酶同时被激活","磷酸化使糖原磷酸化酶激活，同时使糖原合酶失活","磷酸化使糖原磷酸化酶与糖原合酶同时被抑制","磷酸化使糖原磷酸化酶失活，同时使糖原合酶激活","磷酸化使磷酸化酶失活，而糖原合酶的去磷酸化使其失活"],"answer":1,"explain":"B 对：PKA 使糖原磷酸化酶磷酸化而激活、使糖原合酶磷酸化而失活，正好解释情景中 90% 与 10% 的反向变化，一次修饰即可同时调度分解与合成两条通路。B 两个方向都写反。C、C 错在这两个酶受同一修饰但效应相反，不会同时被激活或同时被抑制。E 把两酶的修饰方向对调，是磷酸化调节中最常见的混淆。","type":"A1","group":"c8-01","kind":"mechanism","chs":[25,16,11,12],"vignette":"一名青年因车祸大出血急诊入院。血浆肾上腺素升至正常的 12 倍，胰高血糖素升至 3 倍，胰岛素降至正常的四分之一；血糖 11.2 mmol/L，血游离脂肪酸由 0.4 升至 1.8 mmol/L，血酮体 1.1 mmol/L，尿氮排出明显增多。肝细胞内 cAMP 由 0.5 升至 4.0 μmol/L，PKA 被活化；果糖-2,6-二磷酸由 12 降至 2 nmol/g，糖原磷酸化酶活性升至 90%，糖原合酶活性降至 10%。","vignette_title":"情景 1：一个信号，同时开三条流水线","gidx":2,"gn":6,"anchor":"糖原磷酸化酶活性升至 90%"},{"id":"gc8-01-5","ch":16,"part":3,"tag":"判读","stem":"该患者尿氮排出明显增多，最合理的解释是","options":["胰岛素降低、升糖激素升高，肌肉蛋白质分解加强供糖异生","脂肪动员增强，脂肪分解产生的含氮产物随尿排出增多","肝脏合成蛋白质增强，血浆蛋白分解加快生成大量氮","肾小球滤过功能受损，血中尿素氮不能正常排出而蓄积","血糖升高超过肾糖阈，葡萄糖随尿排出带走大量氮"],"answer":0,"explain":"A 对：应激时胰岛素降低而胰高血糖素、糖皮质激素升高，外周蛋白质分解加强，氨基酸运至肝异生为葡萄糖，多余的氮以尿素形式排出，故尿氮增多。B 若为排出障碍，尿素氮会蓄积在血中，与尿氮增多相反。C 肝内蛋白质合成增强时尿氮应当减少。D 葡萄糖随尿排出并不携带氮，尿糖与尿氮是两回事。E 脂肪分子中不含氮，脂肪分解不会产生含氮产物。","type":"A1","group":"c8-01","kind":"mechanism","chs":[25,16,11,12],"vignette":"一名青年因车祸大出血急诊入院。血浆肾上腺素升至正常的 12 倍，胰高血糖素升至 3 倍，胰岛素降至正常的四分之一；血糖 11.2 mmol/L，血游离脂肪酸由 0.4 升至 1.8 mmol/L，血酮体 1.1 mmol/L，尿氮排出明显增多。肝细胞内 cAMP 由 0.5 升至 4.0 μmol/L，PKA 被活化；果糖-2,6-二磷酸由 12 降至 2 nmol/g，糖原磷酸化酶活性升至 90%，糖原合酶活性降至 10%。","vignette_title":"情景 1：一个信号，同时开三条流水线","gidx":5,"gn":6,"anchor":"尿氮排出明显增多"},{"id":"gc8-01-6","ch":16,"part":3,"tag":"机制","stem":"关于该患者的代谢整合，下列判断正确的是（X 型多选）","options":["果糖-2,6-二磷酸下降使肝由糖酵解转向糖异生","胰高血糖素与胰岛素在该患者体内呈相反方向的浓度变化","胰岛素降
