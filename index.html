up":"c11-03","kind":"mechanism","chs":[14,15,7],"vignette":"一位 47 岁男性长期酗酒并有严重营养不良：血清同型半胱氨酸 42 μmol/L（正常低于 15），血清叶酸与维生素 B12 低于正常下限；骨髓涂片见红系前体细胞核质发育不同步的巨幼样改变；肝穿刺活检显示肝细胞内质网腔扩张、脂滴明显增多，血中极低密度脂蛋白（VLDL）低于正常。丝氨酸羟甲基转移酶把丝氨酸的羟甲基交给四氢叶酸，生成 N5,N10-甲烯基四氢叶酸，这是一碳单位的主要来源；一碳单位既可由胸苷酸合酶交给 dUMP 生成 dTMP，也可还原为 N5-甲基四氢叶酸后经甲硫氨酸合酶把甲基转给同型半胱氨酸生成甲硫氨酸，进而生成 S-腺苷甲硫氨酸（SAM）。肝内磷脂酰胆碱可由磷脂酰乙醇胺接受 SAM 提供的甲基生成，而它是肝细胞在内质网组装并分泌 VLDL 所必需的。","vignette_title":"情景 3：一份甲基的两个去处","gidx":4,"gn":5,"anchor":"肝细胞内质网腔扩张、脂滴明显增多"},{"id":"gc12-01-4","ch":7,"part":2,"tag":"识别","stem":"该糖链的加工是由下列哪两种细胞器先后完成的","options":["内质网与高尔基复合体","细胞核与细胞质基质","溶酶体与过氧化物酶体","线粒体与细胞质基质","高尔基复合体与细胞膜"],"answer":0,"explain":"A 对：N-连接糖链在内质网中起始合成，随后进入高尔基复合体进一步加工修剪，这正是两种细胞器先后参与的含义，也解释了按序列推算 22 kDa 的肽链为何在电泳上表现为 32 kDa。B 错在细胞核与细胞质基质不参与糖链加工。C 错在溶酶体与过氧化物酶体承担的是降解与氧化反应。D 错在线粒体不参与分泌蛋白的糖链加工。E 错在高尔基复合体与细胞膜之间是运输与分泌环节，不是糖链的两步加工部位。","type":"A1","group":"c12-01","kind":"mechanism","chs":[1,21,7],"vignette":"细胞因子刺激 15 分钟后，研究者提取一种分子量为 45 kDa 的调节蛋白做双向电泳：第一向按等电点分离，第二向按分子量分离。未刺激的细胞只在等电点 6.8 处出现一个斑点；刺激后出现的三个斑点落在同一条分子量水平线上，等电点依次为 6.5、6.2 与 5.9。把刺激后的样品先经蛋白磷酸酶处理，这三个斑点又并回 6.8 处的那一个斑点。质谱分析显示，刺激后该蛋白的一个胰蛋白酶肽段由 1452 Da 变为 1532 Da。同一细胞分泌的另一种蛋白按氨基酸序列推算为 22 kDa，在 SDS-聚丙烯酰胺凝胶电泳上却在 32 kDa 处显带，用切除 N-连接糖链的糖苷酶处理后该条带回到 22 kDa，这条糖链的加工需要两种细胞器先后参与。","vignette_title":"情景 1：一个斑点变成三个斑点","gidx":4,"gn":5,"anchor":"这条糖链的加工需要两种细胞器先后参与"},{"id":"gc13-02-5","ch":7,"part":2,"tag":"机制","stem":"线粒体与内质网之间存在膜接触区，这一结构的意义是","options":["通过囊泡在两处细胞器之间运输蛋白质与脂质","使两处细胞器的膜相互融合，腔内成分彼此混合","为线粒体提供由内质网合成的呼吸链亚基","把线粒体内生成的ATP直接送入内质网腔内","在两处细胞器之间直接交换脂质与Ca²⁺等物质"],"answer":4,"explain":"E 对：膜接触区使两处细胞器的膜相互贴近但并不融合，可在此直接交换脂质与钙离子等，是囊泡运输之外的另一条物质交流途径。A 错：膜接触区的特点恰恰是不依赖囊泡，脂质经膜间的直接转移完成。B 错：膜接触区只让两膜靠近，并不发生膜的融合与腔内容物的混合。C 错：呼吸链亚基由核基因编码、在胞质核糖体上合成后经 TOM 与 TIM 运入，不经过膜接触区。D 错：ATP 经腺苷酸转运体运出线粒体进入细胞质，不会被直接送入内质网腔。","type":"A1","group":"c13-02","kind":"mechanism","chs":[6,13,7],"vignette":"研究者从大鼠心肌中分离线粒体，再用低渗膨胀去掉外膜，得到只保留内膜的颗粒。免疫金标记显示，ATP合酶的F1头部伸向基质一侧，细胞色素c附着在内膜朝向膜间隙的一面；荧光探针测得基质pH比膜间隙高约1.4个单位，膜间隙的质子浓度更高。向悬液加入ADP与Pi后，氧电极上的耗氧速率由12升到48（相对值）；若先加入寡霉素，耗氧回落到15，而跨内膜的质子梯度继续增大。用放线菌酮抑制胞质中的核糖体后，新掺入线粒体基质的多肽几乎消失，仍有少数疏水亚基在合成，这些亚基由线粒体自己的基因组编码。此外，从线粒体表面分离到小块内质网膜，提示两处细胞器之间存在膜接触区。","vignette_title":"情景 2：质子被泵去了哪一侧","gidx":5,"gn":6,"anchor":"两处细胞器之间存在膜接触区"},{"id":"gc13-03-1","ch":7,"part":2,"tag":"识别","stem":"双层膜结构与溶酶体融合后形成的结构，在教材中称为","options":["自噬溶酶体，属于次级溶酶体","初级溶酶体，其中尚无被消化的底物","异噬溶酶体，由吞噬体与溶酶体融合而成","残余体，其中蓄积着不能消化的残渣","内体，由质膜内陷出芽后与溶酶体无关"],"answer":0,"explain":"A 对：包裹自身细胞成分的双层膜结构即自噬体，它与溶酶体融合后形成自噬溶酶体，属次级溶酶体，其中的底物被酸性水解酶降解。B 错：初级溶酶体由高尔基复合体出芽形成，只含水解酶而尚无底物。C 错：异噬溶酶体由吞噬体或胞饮体与溶酶体融合而成，降解的是外源物质。D 错：残余体是消化后不能降解的残渣所形成的结构，与本例中正在被消化的结构不同。E 错：内体由质膜内陷形成，可进一步与溶酶体融合，并非与溶酶体无关。","type":"A1","group":"c13-03","kind":"mechanism","chs":[7,8,6],"vignette":"培养的大鼠肝细胞换入不含氨基酸的培养液，饥饿4小时后，电镜下每个细胞出现约400个双层膜结构，内含线粒体碎片与内质网断片；长寿命蛋白的降解速率由1.2%/h升至4.5%/h。处理6小时：甲组加3-甲基腺嘌呤后双层膜结构减至90个、降解速率回落到1.3%；乙组加巴弗洛霉素A1后溶酶体pH由5.0升到6.8，双层膜结构增至1200个、降解速率降到0.9%；丙组补回氨基酸后双层膜结构减至120个。另一组细胞先用解偶联剂使线粒体受损，胞质中PINK1蓄积并招募Parkin，受损线粒体随后被双层膜结构包裹。把标记的胞外颗粒加入培养基，可见颗粒经吞噬体进入细胞并与溶酶体融合。","vignette_title":"情景 3：饿出来的双层膜结构","gidx":1,"gn":6,"anchor":"每个细胞出现约400个双层膜结构"},{"id":"gc13-03-2","ch":7,"part":2,"tag":"机制","stem":"乙组双层膜结构大量堆积、降解速率反而下降，最合理的解释是巴弗洛霉素A1","options":["促进双层膜结构与溶酶体的融合，使底物被快速清除","抑制胞质中蛋白酶体对底物的识别与降解","使溶酶体内pH升高，酸性水解酶不能发挥降解作用","抑制内质网到高尔基复合体的运输，酶无法被合成","阻断细胞对氨基酸的吸收，使细胞进入更深的饥饿"],"answer":2,"explain":"C 对：巴弗洛霉素 A1 使溶酶体内 pH 由 5.0 升到 6.8，酸性水解酶在偏中性的环境中活性明显下降，底物不能被水解而堆积在双层膜结构中。A 错：若融合与清除被促进，堆积应减少、降解速率应升高，与实测相反。B 错：蛋白酶体位于细胞质中，降解的是泛素化的短寿命蛋白，自噬途径的底物由溶酶体处理。D 错：情景未显示水解酶的合成受阻，实测的 pH 变化才是降解下降的直接原因。E 错：细胞换用的是不含氨基酸的培养液，进入更深的饥饿并不能解释溶酶体 pH 的升高。","type":"A1","group":"c13-03","kind":"mechanism","chs":[7,8,6],"vignette":"培养的大鼠肝细胞换入不含氨基酸的培养液，饥饿4小时后，电镜下每个细胞出现约400个双层膜结构，内含线粒体碎片与内质网断片；长寿命蛋白的降解速率由1.2%/h升至4.5%/h。处理6小时：甲组加3-甲基腺嘌呤后双层膜结构减至90个、降解速率回落到1.3%；乙组加巴弗洛霉素A1后溶酶体pH由5.0升到6.8，双层膜结构增至1200个、降解速率降到0.9%；丙组补回氨基酸后双层膜结构减至120个。另一组细胞先用解偶联剂使线粒体受损，胞质中PINK1蓄积并招募Parkin，受损线粒体随后被双层膜结构包裹。把标记的胞外颗粒加入培养基，可见颗粒经吞噬体进入细胞并与溶酶体融合。","vignette_title":"情景 3：饿出来的双层膜结构","gidx":2,"gn":6,"anchor":"溶酶体pH由5.0升到6.8"},{"id":"gc13-03-3","ch":7,"part":2,"tag":"判读","stem":"甲组与丙组的结果共同说明","options":["自噬水平与细胞外的营养状态没有关系","3-甲基腺嘌呤处理后自噬体的形成被促进","补充氨基酸后细胞的蛋白质降解随即停止","降解依赖双层膜结构的形成，并受营养状态调节","3-甲基腺嘌呤与巴弗洛霉素A1作用于同一环节"],"answer":3,"explain":"D 对：甲组抑制双层膜结构形成后降解速率回落，说明降解依赖该结构的形成；丙组补回氨基酸后双层膜结构减少，说明自噬水平随营养状态而调节。A 错：丙组补回氨基酸后自噬明显回落，正说明自噬与营养状态密切相关。B 错：甲组中双层膜结构由 400 个减至 90 个，说明其形成被抑制而不是被促进。C 错：补充氨基酸后降解速率回落，但细胞的基础蛋白降解仍在进行，并不会随即停止。E 错：甲组的处理抑制双层膜结构的形成，乙组的处理改变溶酶体内的酸化，两者作用环节并不相同。","type":"A1","group":"c13-03","kind":"mechanism","chs":[7,8,6],"vignette":"培养的大鼠肝细胞换入不含氨基酸的培养液，饥饿4小时后，电镜下每个细胞出现约400个双层膜结构，内含线粒体碎片与内质网断片；长寿命蛋白的降解速率由1.2%/h升至4.5%/h。处理6小时：甲组加3-甲基腺嘌呤后双层膜结构减至90个、降解速率回落到1.3%；乙组加巴弗洛霉素A1后溶酶体pH由5.0升到6.8，双层膜结构增至1200个、降解速率降到0.9%；丙组补回氨基酸后双层膜结构减至120个。另一组细胞先用解偶联剂使线粒体受损，胞质中PINK1蓄积并招募Parkin，受损线粒体随后被双层膜结构包裹。把标记的胞外颗粒加入培养基，可见颗粒经吞噬体进入细胞并与溶酶体融合。","vignette_title":"情景 3：饿出来的双层膜结构","gidx":3,"gn":6,"anchor":"补回氨基酸后双层膜结构减至120个"},{"id":"gc13-03-6","ch":7,"part":2,"tag":"判读","stem":"关于溶酶体、自噬与细胞内消化，下列判断正确的是（X 型多选）","options":["饥饿时自噬水平升高，可把自身成分降解以提供原料","溶酶体内的酸性环境是酸性水解酶发挥作用的条件","溶酶体的水解酶在细胞质的中性环境中活性最高","不能消化的残余物形成残余体，长期累积为脂褐素","新合成的溶酶体酶不经高尔基复合体即进入溶酶体"],"answer":[0,1,3],"explain":"答案 ABD。A 对：饥饿时细胞通过自噬降解自身成分，为蛋白质合成与能量代谢提供氨基酸等原料，丙组补回氨基酸后自噬回落正印证这一点。B 对：酸性水解酶的最适 pH 偏酸，溶酶体腔内的酸性环境是其发挥作用的条件，乙组升高 pH 后降解速率随之下降。D 对：消化不了的残渣形成残余体，在心肌与神经细胞中长期累积即成为脂褐素。C 错：水解酶在酸性环境中活性最高，细胞质的中性环境并不适合其工作，这也正是水解酶漏出会损伤细胞的原因。E 错：新合成的溶酶体酶在高尔基复合体顺面获得分选信号，再经囊泡送入溶酶体，并不绕过高尔基复合体。","type":"X","group":"c13-03","kind":"mechanism","chs":[7,8,6],"vignette":"培养的大鼠肝细胞换入不含氨基酸的培养液，饥饿4小时后，电镜下每个细胞出现约400个双层膜结构，内含线粒体碎片与内质网断片；长寿命蛋白的降解速率由1.2%/h升至4.5%/h。处理6小时：甲组加3-甲基腺嘌呤后双层膜结构减至90个、降解速率回落到1.3%；乙组加巴弗洛霉素A1后溶酶体pH由5.0升到6.8，双层膜结构增至1200个、降解速率降到0.9%；丙组补回氨基酸后双层膜结构减至120个。另一组细胞先用解偶联剂使线粒体受损，胞质中PINK1蓄积并招募Parkin，受损线粒体随后被双层膜结构包裹。把标记的胞外颗粒加入培养基，可见颗粒经吞噬体进入细胞并与溶酶体融合。","vignette_title":"情景 3：饿出来的双层膜结构","gidx":6,"gn":6,"anchor":"长寿命蛋白的降解速率"},{"id":"gc13-04-2","ch":7,"part":2,"tag":"判读","stem":"未加去垢剂时P2的酸性磷酸酶活性只有19，加去垢剂或冻融后明显升高，说明","options":["该酶在匀浆过程中被水解，活性随放置时间下降","该酶的活性由膜上的转运体决定，与膜无关","该酶被完整溶酶体膜包裹，膜破损后活性才充分显示","该酶在酸性条件下失活，去垢剂提高了溶液的pH","该酶在线粒体内膜上，去垢剂使内膜通透性升高"],"answer":2,"explain":"C 对：完整溶酶体的膜使底物难以与水解酶接触，去垢剂或反复冻融破坏膜后酶活性才充分显示，这种潜伏性正说明该酶位于溶酶体腔内。A 错：若酶在操作过程中被水解，活性不会因加入去垢剂而升高 4 倍。B 错：酸性磷酸酶是腔内的水解酶，其活性不取决于膜上的转运体。D 错：酸性磷酸酶的最适 pH 偏酸，去垢剂并不会提高溶液的 pH。E 错：线粒体内膜并不富含酸性磷酸酶，若该酶来自线粒体，提高膜通透性也不能解释如此大的活性差距。","type":"A1","group":"c13-04","kind":"experiment","chs":[6,7,9],"vignette":"研究生把大鼠肝组织在等渗蔗糖溶液中匀浆，按600g 10分钟、15000g 20分钟、100000g 60分钟依次离心，得到沉淀P1、P2、P3与上清S。标志酶相对活性：P1中Na⁺-K⁺-ATP酶为92；P2中细胞色素c氧化酶为88、酸性磷酸酶为76；P3中葡萄糖-6-磷酸酶为85、半乳糖基转移酶为70；S中乳酸脱氢酶为95。未加去垢剂时P2的酸性磷酸酶活性只有19，加入0.1%Triton X-100后升到76，反复冻融三次后升至71。把P3经去垢剂与高盐洗涤后仍能检出波形蛋白；在其中先加秋水仙素再置于4℃ 30分钟，一种约55kDa的蛋白转入上清，而波形蛋白仍留在沉淀中。","vignette_title":"情景 4：四个组分里的标志酶","gidx":2,"gn":6,"anchor":"酸性磷酸酶活性只有19"},{"id":"gc13-04-4","ch":7,"part":2,"tag":"判读","stem":"P3中葡萄糖-6-磷酸酶与半乳糖基转移酶活性高，说明P3主要来自","options":["线粒体内膜与线粒体外膜形成的碎片","内质网与高尔基复合体形成的膜碎片","质膜与细胞外被在匀浆中脱落的碎片","细胞核膜与核仁在匀浆中破碎的碎片","溶酶体膜与吞噬体膜融合后的残余结构"],"answer":1,"explain":"B 对：葡萄糖-6-磷酸酶是内质网的标志酶，半乳糖基转移酶是高尔基复合体的标志酶，两者在 100000 g 沉淀中活性最高，说明该微粒体组分主要由内质网与高尔基复合体的膜碎片构成。A 错：线粒体内外膜碎片的标志酶是细胞色素 c 氧化酶，其活性主要在 P2 中。C 错：质膜碎片与未破碎细胞主要沉降在 P1，可与 Na⁺-K⁺-ATP 酶的结果对照。D 错：核膜碎片随细胞核进入 P1，核仁并不是膜性结构。E 错：溶酶体膜及其标志酶酸性磷酸酶主要集中在 P2，与 P3 的酶谱不符。","type":"A1","group":"c13-04","kind":"experiment","chs":[6,7,9],"vignette":"研究生把大鼠肝组织在等渗蔗糖溶液中匀浆，按600g 10分钟、15000g 20分钟、100000g 60分钟依次离心，得到沉淀P1、P2、P3与上清S。标志酶相对活性：P1中Na⁺-K⁺-ATP酶为92；P2中细胞色素c氧化酶为88、酸性磷酸酶为76；P3中葡萄糖-6-磷酸酶为85、半乳糖基转移酶为70；S中乳酸脱氢酶为95。未加去垢剂时P2的酸性磷酸酶活性只有19，加入0.1%Triton X-100后升到76，反复冻融三次后升至71。把P3经去垢剂与高盐洗涤后仍能检出波形蛋白；在其中先加秋水仙素再置于4℃ 30分钟，一种约55kDa的蛋白转入上清，而波形蛋白仍留在沉淀中。","vignette_title":"情景 4：四个组分里的标志酶","gidx":4,"gn":6,"anchor":"P3中葡萄糖-6-磷酸酶为85"},{"id":"gc16-03-2","ch":7,"part":2,"tag":"机制","stem":"综合丙组与加药组的结果可知，葡糖-6-磷酸必须先进入内质网腔才能水解为葡萄糖，其原因是","options":["内质网腔内的pH偏酸，是水解反应发生的必要条件","胞质中的ATP浓度过高，会抑制水解酶的催化活性","内质网腔内的钙离子浓度高，可激活该水解酶","葡糖-6-磷酸带负电荷，不能自由穿过内质网膜的脂双层","糖原颗粒位于内质网腔内，水解反应只能在腔内进行"],"answer":3,"explain":"D 对：葡糖-6-磷酸带负电荷，无法自由穿过内质网膜的脂双层，必须先经膜上的转运体进入腔内，再由葡糖-6-磷酸酶水解；加药组胞质中葡糖-6-磷酸堆积（0.06→0.21）而培养液中标记葡萄糖降到 16%，正说明这一步被卡在膜转运上。A 错：内质网腔并不依靠偏酸环境完成这一步，偏酸是溶酶体的特点。B 错：胞质 ATP 浓度不会以这种方式抑制该水解酶。C 错：腔内钙离子浓度高不是该酶的激活条件。E 错：糖原颗粒位于胞质中，而不是内质网腔内。","type":"A1","group":"c16-03","kind":"mechanism","chs":[6,7,11],"vignette":"取同一批肝细胞分三组。甲组培养液含 25 mmol/L 葡萄糖，培养 4 小时；乙组先在无糖培养液中培养 12 小时，再补加葡萄糖培养 4 小时。电镜定量：甲组胞质中无膜包裹的颗粒约占胞质面积的 12%，该颗粒的数量随营养状态消长，过碘酸雪夫染色阳性；乙组补糖前降到 1% 以下，补糖后回升到 9%。丙组以 ¹⁴C 标记的乳酸为唯一碳源，其培养液中出现标记葡萄糖。若加入一种抑制葡糖-6-磷酸转运体的药物，培养液中标记葡萄糖降到 16%，胞质中葡糖-6-磷酸由 0.06 升到 0.21，培养液中乳酸升到对照的 2.4 倍；细胞活力仍在 95% 以上，培养液中测不到乳酸脱氢酶，线粒体结构完好。","vignette_title":"情景 3：胞质里那堆会消失的颗粒","gidx":2,"gn":5,"anchor":"胞质中葡糖-6-磷酸由 0.06 升到 0.21"},{"id":"gc18-02-1","ch":7,"part":2,"tag":"机制","stem":"衣霉素处理4小时后BiP转录本上调5倍，这一反应的意义是","options":["加快内质网中蛋白质的翻译速度以补充损耗","结合新生肽链的疏水区段，协助其正确折叠","把错误折叠蛋白直接水解为氨基酸并排出内质网","使内质网腔内pH升高，从而抑制水解酶的活性","将未折叠蛋白经核孔运入细胞核内进行降解"],"answer":1,"explain":"B 对：BiP 属内质网分子伴侣，它结合新生肽链的疏水区段，防止其聚集并协助正确折叠，转录本上调是未折叠蛋白反应的保护性表现。A 错：未折叠蛋白反应初期抑制整体翻译以减少进入内质网的蛋白量，不会加快翻译。C 错：内质网并不把错误折叠蛋白直接水解排出，这类蛋白经 ERAD 逆向转运到胞质由蛋白酶体降解。D 错：BiP 靠结合肽链发挥作用，并不通过改变腔内 pH 影响水解酶。E 错：折叠异常的蛋白不会被送入细胞核，核内也没有降解此类蛋白的途径。","type":"A1","group":"c18-02","kind":"mechanism","chs":[29,7,6],"vignette":"用阻断N-连接糖基化起始的衣霉素处理HeLa细胞，4小时后内质网腔中未折叠蛋白增多，分子伴侣BiP的转录本上调5倍；胞质中LC3B-II与LC3B-I的比值由0.2升到1.6、p62由1.0降到0.3，电镜下可见双层膜结构；一部分错误折叠蛋白经ERAD逆向转运至细胞质，由26S蛋白酶体降解。12小时后活化caspase-3阳性细胞占45%，电泳可见梯状条带。若在加药时用RNA干扰敲低Atg5，LC3B-II不再升高，而凋亡率升到72%、存活率由58%降到26%。另一组细胞过表达Bcl-2后凋亡率降到12%，LC3B-II也由1.6降到0.4；该组再表达BH3突变、不能被Bcl-2结合的Beclin-1，LC3B-II回到1.4而凋亡率仍为12%。","vignette_title":"情景 2：错误折叠蛋白的两种去处","gidx":1,"gn":6,"anchor":"分子伴侣BiP的转录本上调5倍"},{"id":"gc19-03-2","ch":7,"part":2,"tag":"机制","stem":"PERK 使 eIF2α 磷酸化后全局翻译下降约 70%，其意义是","options":["加快内质网中蛋白的折叠速度，尽快清除未折叠蛋白","阻止未折叠蛋白被运出内质网，避免其堆积在高尔基体","提高内质网中分子伴侣的合成量，增强其折叠能力","减少新合成蛋白进入内质网，缓解腔内的折叠负荷","使已经折叠错误的蛋白被泛素标记并送入蛋白酶体"],"answer":3,"explain":"D 对：PERK 通路的首要作用是通过磷酸化 eIF2α 抑制翻译起始，使进入内质网的新生肽链减少，从而降低腔内的折叠负荷，为处理已积累的未折叠蛋白争取时间。A 错：翻译下降不会加快蛋白的折叠速率。B 错：新生肽链减少并不等于把已堆积的蛋白转运出去。C 错：分子伴侣合成增加主要由 ATF6 分支介导，与翻译下降的直接意义不同。E 错：泛素化降解属于内质网相关降解，不是 eIF2α 磷酸化的即时效应。","type":"A1","group":"c19-03","kind":"mechanism","chs":[1,7,19],"vignette":"把培养细胞从 37℃ 分别移到 42℃ 与 45℃ 水浴：42℃ 处理 1 小时后回到 37℃，热休克因子 HSF1 由单体聚合并转入核内，HSP70 与 HSP90 的 mRNA 在 2 小时内升高约 8 倍，细胞存活率超过 90%。45℃ 处理 3 小时则不同：胞质中出现大量泛素化蛋白聚集体，HSP70 结合到聚集体上却无法使其重新溶解。同时测得内质网腔内未折叠蛋白增多，分子伴侣 BiP 从 PERK、ATF6 与 IRE1 三种感受器上解离，PERK 使 eIF2α 磷酸化，全局蛋白质翻译下降约 70%，ATF4 与 CHOP 的表达上调。24 小时后约 35% 的细胞出现 caspase-3 活化；若事先用小干扰 RNA 降低 p53 水平，同一处理下这一比例降至 14%。","vignette_title":"情景 3：42℃ 能救回来，45℃ 却启动了死亡程序","gidx":2,"gn":5,"anchor":"PERK 使 eIF2α 磷酸化"},{"id":"gc19-03-3","ch":7,"part":2,"tag":"判读","stem":"BiP 从三种感受器上解离这一现象说明","options":["腔内未折叠蛋白超过了 BiP 的结合容量，应激被启动","三种感受器被蛋白酶切掉，内质网应激随之终止","BiP 自身发生错误折叠，失去了结合感受器的能力","内质网中的蛋白多数已折叠正确，BiP 因此被释放","细胞正在合成大量 BiP，解离是为其腾出结合位点"],"answer":0,"explain":"A 对：BiP 平时与三种感受器结合并使其保持无活性，腔内未折叠蛋白增多时 BiP 优先结合这些蛋白，感受器因此解离并被激活，应激反应随之启动。B 错：感受器是被激活而不是被切掉，应激也不会终止。C 错：解离由未折叠蛋白竞争结合引起，不是 BiP 自身折叠错误。D 错：蛋白折叠正确时 BiP 仍与感受器结合，不会解离。E 错：BiP 合成增加属于下游的适应性反应，不是它解离的原因。","type":"A1","group":"c19-03","kind":"mechanism","chs":[1,7,19],"vignette":"把培养细胞从 37℃ 分别移到 42℃ 与 45℃ 水浴：42℃ 处理 1 小时后回到 37℃，热休克因子 HSF1 由单体聚合并转入核内，HSP70 与 HSP90 的 mRNA 在 2 小时内升高约 8 倍，细胞存活率超过 90%。45℃ 处理 3 小时则不同：胞质中出现大量泛素化蛋白聚集体，HSP70 结合到聚集体上却无法使其重新溶解。同时测得内质网腔内未折叠蛋白增多，分子伴侣 BiP 从 PERK、ATF6 与 IRE1 三种感受器上解离，PERK 使 eIF2α 磷酸化，全局蛋白质翻译下降约 70%，ATF4 与 CHOP 的表达上调。24 小时后约 35% 的细胞出现 caspase-3 活化；若事先用小干扰 RNA 降低 p53 水平，同一处理下这一比例降至 14%。","vignette_title":"情景 3：42℃ 能救回来，45℃ 却启动了死亡程序","gidx":3,"gn":5,"anchor":"内质网腔内未折叠蛋白增多"},{"id":"gc19-03-5","ch":7,"part":2,"tag":"判读","stem":"关于本组实验中细胞的应激与取舍，下列判断正确的是（X 型多选）","options":["42℃ 时 HSP 合成增加，应激强度在伴侣容量之内","45℃ 时错误折叠蛋白超过伴侣容量，救援转为放弃","提高 HSP70 表达就能使 45℃ 处理下的细胞免于死亡","CHOP 表达上调与 caspase-3 活化提示细胞启动凋亡","内质网应激与热应激可通过共同的下游通路决定生死"],"answer":[0,1,3,4],"explain":"答案 ABDE。A 对：42℃ 时 HSP70 与 HSP90 明显升高，损伤被伴侣系统处理，存活率超过 90%。B 对：45℃ 时聚集体无法被重新溶解，说明负荷超过伴侣容量，细胞转向死亡程序。D 对：CHOP 上调与 caspase-3 活化都是启动凋亡的标志。E 对：热应激与内质网应激的信号最终汇入同一套凋亡决策，与损伤过重时的取舍逻辑一致。C 错：提高 HSP70 增强的是对可挽救蛋白的处理能力，损伤过重时无法保证细胞存活。","type":"X","group":"c19-03","kind":"mechanism","chs":[1,7,19],"vignette":"把培养细胞从 37℃ 分别移到 42℃ 与 45℃ 水浴：42℃ 处理 1 小时后回到 37℃，热休克因子 HSF1 由单体聚合并转入核内，HSP70 与 HSP90 的 mRNA 在 2 小时内升高约 8 倍，细胞存活率超过 90%。45℃ 处理 3 小时则不同：胞质中出现大量泛素化蛋白聚集体，HSP70 结合到聚集体上却无法使其重新溶解。同时测得内质网腔内未折叠蛋白增多，分子伴侣 BiP 从 PERK、ATF6 与 IRE1 三种感受器上解离，PERK 使 eIF2α 磷酸化，全局蛋白质翻译下降约 70%，ATF4 与 CHOP 的表达上调。24 小时后约 35% 的细胞出现 caspase-3 活化；若事先用小干扰 RNA 降低 p53 水平，同一处理下这一比例降至 14%。","vignette_title":"情景 3：42℃ 能救回来，45℃ 却启动了死亡程序","gidx":5,"gn":5,"anchor":"胞质中出现大量泛素化蛋白聚集体"},{"id":"gc2-02-2","ch":7,"part":2,"tag":"机制","stem":"磷酸转移酶能选择性地给水解酶加上磷酸标签，其识别依据是","options":["水解酶N端的信号肽序列","水解酶mRNA上的特殊序列","水解酶C端的KDEL序列","水解酶特有的三维结构标志","水解酶上连接的多聚泛素链"],"answer":3,"explain":"D 对：情景明确磷酸转移酶识别的是水解酶特有的三维标志，这正是分选特异性的来源，也是分泌蛋白不被误加标签的原因。B 信号肽只负责把肽链送进内质网，与高尔基复合体中的分选无关；C KDEL 是内质网驻留信号，用于逆向回收；D 多聚泛素链是蛋白酶体降解的标签；E 分选发生在蛋白质层面，与 mRNA 序列无关。","type":"A1","group":"c2-02","kind":"mechanism","chs":[7,8,6],"vignette":"溶酶体内数十种酸性水解酶都在粗面内质网的核糖体上合成，进入内质网腔后切去信号肽、加上糖链，再由COPII包被囊泡送到高尔基复合体。与它们同行的一批内质网驻留蛋白靠C端的KDEL序列被KDEL受体捕获，经COPI包被囊泡逆向运回内质网。决定水解酶去向的关键一步发生在高尔基复合体顺面：磷酸转移酶识别水解酶特有的三维标志，在糖链的甘露糖上添加磷酸，生成甘露糖-6-磷酸标签；反面网络上的M6P受体识别标签，把它们装入网格蛋白包被囊泡送往溶酶体。少数患儿该磷酸转移酶活性缺失，水解酶拿不到M6P标签，只能按默认途径经组成型分泌排出细胞，血浆中溶酶体酶活性反而升高，而溶酶体内底物大量蓄积，出现骨骼畸形与发育迟缓。","vignette_title":"情景 2：酶造出来了，却送错了门","gidx":2,"gn":6,"anchor":"水解酶特有的三维标志"},{"id":"gc2-02-6","ch":7,"part":2,"tag":"判读","stem":"关于这条从合成到分选的链条，下列判断正确的是（X 型多选）","options":["M6P标签在高尔基复合体顺面生成","水解酶在粗面内质网上合成并切去信号肽","血浆中酶活性升高说明溶酶体内水解酶增多","M6P受体在粗面内质网腔中完成分选","缺少M6P标签的水解酶沿默认分泌途径排出"],"answer":[0,1,4],"explain":"答案 ABE。A、B、E 分别对应情景中的三条信息：在粗面内质网合成并切去信号肽、在高尔基复合体顺面加上 M6P 标签、拿不到标签的酶沿默认途径排出细胞。D 错：M6P 受体位于高尔基复合体反面网络，分选包装在膜系统中完成，不在内质网腔内；C 错：血浆酶活性升高恰恰说明酶被分泌到了细胞外，患儿溶酶体内的水解酶是不足的。","type":"X","group":"c2-02","kind":"mechanism","chs":[7,8,6],"vignette":"溶酶体内数十种酸性水解酶都在粗面内质网的核糖体上合成，进入内质网腔后切去信号肽、加上糖链，再由COPII包被囊泡送到高尔基复合体。与它们同行的一批内质网驻留蛋白靠C端的KDEL序列被KDEL受体捕获，经COPI包被囊泡逆向运回内质网。决定水解酶去向的关键一步发生在高尔基复合体顺面：磷酸转移酶识别水解酶特有的三维标志，在糖链的甘露糖上添加磷酸，生成甘露糖-6-磷酸标签；反面网络上的M6P受体识别标签，把它们装入网格蛋白包被囊泡送往溶酶体。少数患儿该磷酸转移酶活性缺失，水解酶拿不到M6P标签，只能按默认途径经组成型分泌排出细胞，血浆中溶酶体酶活性反而升高，而溶酶体内底物大量蓄积，出现骨骼畸形与发育迟缓。","vignette_title":"情景 2：酶造出来了，却送错了门","gidx":6,"gn":6,"anchor":"生成甘露糖-6-磷酸标签"},{"ch":7,"part":2,"tag":"内膜系统","stem":"内膜系统是真核细胞内由生物膜包裹且互相关联的细胞器与区室的总称。下列均属于内膜系统组分的是","options":["内质网、高尔基复合体、溶酶体、内体","线粒体、叶绿体、细胞核","核糖体、中心体、蛋白酶体","质膜、细胞外基质、细胞皮质","过氧化物酶体、核糖体、溶酶体"],"answer":0,"explain":"内膜系统主要包括内质网、高尔基复合体、内体、溶酶体及其间转运囊泡；线粒体为半自主性细胞器，核糖体与蛋白酶体无膜，过氧化物酶体相对独立。","type":"A1","id":"c7-0bfd13b9"},{"ch":7,"part":2,"tag":"粗面内质网","stem":"分泌活动旺盛的细胞中，粗面内质网比滑面内质网丰富得多，原因是","options":["粗面内质网负责脂质与类固醇激素的合成","粗面内质网表面附着核糖体，是分泌蛋白与膜蛋白合成及初步加工的场所","滑面内质网不能合成任何蛋白质，也不参与物质代谢","粗面内质网是细胞内钙离子的主要储存场所","粗面内质网负责药物与毒物的氧化解毒"],"answer":1,"explain":"粗面内质网表面附核糖体，承担分泌蛋白、膜蛋白与驻留蛋白的合成及初步加工；脂质合成、生物转化与钙储存主要由滑面内质网完成。","type":"A1","id":"c7-4cadd6a9"},{"ch":7,"part":2,"tag":"滑面内质网","stem":"下列功能主要由滑面内质网承担的是","options":["分泌蛋白的N-连接糖基化起始","分泌蛋白信号肽的切除","溶酶体酶的甘露糖-6-磷酸修饰","磷脂与胆固醇合成、类固醇激素合成以及药物毒物的氧化解毒","蛋白质的泛素化与降解"],"answer":3,"explain":"滑面内质网是脂质与类固醇激素合成及生物转化（解毒）的场所；N-连接糖基化起始与信号肽切除在粗面内质网，M6P修饰在顺面高尔基体。","type":"A1","id":"c7-57c3e0a9"},{"ch":7,"part":2,"tag":"M6P分选","stem":"溶酶体水解酶能被准确分选并运送到溶酶体，主要依赖","options":["在顺面高尔基体生成甘露糖-6-磷酸（M6P）标签，由M6P受体识别并包装入囊泡转运","其N端特有的信号肽序列","其C端所含的KDEL序列","底物蛋白上连接的多聚泛素链","溶酶体膜上存在的M6P合成酶"],"answer":0,"explain":"溶酶体酶在高尔基体顺面获得M6P标签，被M6P受体识别后包装运输至溶酶体；KDEL是内质网驻留信号，信号肽指引共翻译转运入内质网。","type":"A1","id":"c7-d005eb6a"},{"ch":7,"part":2,"tag":"溶酶体与硅肺","stem":"硅肺（肺硅沉着症）的发生与溶酶体密切相关，其核心机制是","options":["硅尘抑制溶酶体水解酶基因表达，使细胞无法消化营养物质","硅尘使溶酶体酶分泌到细胞外，直接消化肺泡上皮","硅尘被肺泡巨噬细胞吞噬后进入溶酶体，因难以降解而破坏溶酶体膜，水解酶漏出致细胞死亡并引发肺纤维化","硅尘激活过氧化物酶体，引起脂质过氧化损伤","硅尘使高尔基复合体糖基化功能完全丧失"],"answer":2,"explain":"硅尘不能被溶酶体酶降解，反使溶酶体膜破坏、水解酶漏入胞质，导致巨噬细胞死亡并释放致纤维化因子，最终形成肺纤维化。","type":"A1","id":"c7-b603a1c8"},{"ch":7,"part":2,"tag":"糖基化","stem":"关于蛋白质糖基化发生部位的叙述，正确的是","options":["N-连接糖基化全部在高尔基复合体完成，O-连接糖基化在内质网起始","N-连接与O-连接糖基化均起始于细胞质基质","N-连接与O-连接糖基化均起始于溶酶体","糖基化只发生在溶酶体水解酶上","N-连接糖基化起始于内质网并在高尔基复合体进一步加工，O-连接糖基化主要在高尔基复合体进行"],"answer":4,"explain":"N-连接糖链在内质网起始（连于天冬酰胺）后在高尔基体加工；O-连接糖链（连于丝氨酸/苏氨酸）主要在高尔基复合体逐一添加。","type":"A1","id":"c7-bb3ea64b"},{"ch":7,"part":2,"tag":"过氧化物酶体","stem":"关于过氧化物酶体的叙述，正确的是","options":["由溶酶体直接出芽形成，含丰富的酸性水解酶","含过氧化氢酶等标志酶，参与极长链脂肪酸等的氧化并分解过氧化氢，是脂质代谢的重要场所","通过M6P受体途径获得其全部酶蛋白","是分泌蛋白合成与加工的场所","是细胞内唯一能产生ATP的细胞器"],"answer":1,"explain":"过氧化物酶体以过氧化氢酶为标志酶，参与脂肪酸氧化与H2O2分解，相对独立于经典内膜系统；溶酶体才富含酸性水解酶并经M6P途径获得酶。","type":"A1","id":"c7-163171a8"},{"ch":7,"part":2,"tag":"胶原蛋白合成","stem":"胶原蛋白的合成与加工体现了内膜系统是一个统一的整体，下列叙述正确的是","options":["胶原蛋白自始至终在细胞质基质中合成并直接组装成纤维","胶原蛋白前α链在溶酶体内合成，在细胞核内羟基化","前胶原经核孔直接分泌到细胞外，不经过内质网和高尔基复合体","前α链在内质网中合成并羟基化、糖基化，在高尔基复合体进一步加工包装，分泌到细胞外组装成胶原纤维","胶原纤维在粗面内质网腔内组装完成后才被分泌"],"answer":3,"explain":"胶原前α链在粗面内质网合成并修饰，经高尔基复合体加工包装后分泌，最终在细胞外组装成胶原纤维，体现各区室的分工与连续。","type":"A1","id":"c7-6bae04f8"},{"ch":7,"part":2,"tag":"分子伴侣","stem":"在粗面内质网腔中，新生肽链的正确折叠需要分子伴侣参与。关于内质网分子伴侣的叙述，正确的是","options":["分子伴侣通过共价键固定肽链构象，并可催化肽键的形成","BiP（GRP78）等分子伴侣结合新生肽链的疏水区段，防止其聚集并协助折叠；反复折叠失败的蛋白经 ERAD 逆向转运至细胞质由蛋白酶体降解","分子伴侣只存在于细胞质基质，内质网中的蛋白质靠自发折叠完成","内质网中错误折叠的蛋白质在高尔基复合体中被直接降解","分子伴侣能为蛋白质折叠提供 ATP 之外的能源，如 GTP"],"answer":1,"explain":"内质网分子伴侣（BiP、钙连蛋白等）结合新生肽链疏水区段，防止聚集并协助折叠；折叠失败者经 ERAD 逆向转运入胞质、由蛋白酶体降解。","type":"A1","id":"c7-9fd35216"},{"ch":7,"part":2,"tag":"未折叠蛋白反应","stem":"当内质网中错误折叠蛋白蓄积（内质网应激）时，细胞会启动未折叠蛋白反应。关于该反应的叙述，正确的是","options":["通过加快把所有错误折叠蛋白分泌到细胞外来解除应激","主要机制是增加核糖体数量，加快全部蛋白质的翻译速度","该反应发生在线粒体，与内质网的功能状态无关","经 PERK、ATF6、IRE1 等感受器减少蛋白质翻译、增加分子伴侣表达并促进错误折叠蛋白降解；应激过强或持续则诱导细胞凋亡","一旦启动该反应，细胞必然走向凋亡"],"answer":3,"explain":"内质网应激经 PERK/ATF6/IRE1 三条通路降低翻译、上调分子伴侣与降解系统以恢复稳态；应激无法缓解时转向凋亡。","type":"A1","id":"c7-a1dbe550"},{"ch":7,"part":2,"tag":"高尔基分区","stem":"关于高尔基复合体分区结构与其加工功能的叙述，正确的是","options":["由顺面、中间、反面（TGN）多个扁囊叠成，各层所含加工酶不同，蛋白质随囊泡自顺面向反面移动而依次完成糖链的修剪与添加","各层扁囊所含的酶相同，蛋白质的加工与所处层次无关","高尔基复合体只负责蛋白质的磷酸化，不参与糖链的加工","高尔基复合体表面附着核糖体，是蛋白质合成的主要场所","高尔基复合体由双层膜包被，其形成与内质网无关"],"answer":0,"explain":"高尔基复合体自顺面至反面由多个扁囊叠成，各层酶分布不同，糖链修剪与添加按顺序进行，TGN 还承担分选与包装功能。","type":"A1","id":"c7-870972b2"},{"ch":7,"part":2,"tag":"溶酶体形成","stem":"关于溶酶体形成与类型的叙述，正确的是","options":["溶酶体由内质网直接出芽形成，不经过高尔基复合体","初级溶酶体已含有正在被消化的底物，故又称异噬溶酶体","由高尔基复合体出芽形成初级溶酶体，与内体或自噬体等融合后成为次级溶酶体，不能消化的残余物形成残余体","溶酶体由双层膜包被，膜上有 ATP 合酶维持其酸性内环境","溶酶体只存在于巨噬细胞、中性粒细胞等吞噬细胞中"],"answer":2,"explain":"溶酶体由高尔基复合体出芽形成初级溶酶体（尚不含底物），与内体、自噬体融合后成为次级溶酶体，消化不了的残余物形成残余体。","type":"A1","id":"c7-d9e01327"},{"ch":7,"part":2,"tag":"溶酶体贮积症","stem":"关于溶酶体贮积症的叙述，正确的是","options":["由溶酶体膜上 M6P 受体过度表达、酶被提前分泌入血所致","属显性遗传病，患者的父母中必有一人发病","因溶酶体过度消化细胞自身成分，导致细胞内容物丢失","贮积物只堆积在细胞质基质中，并不进入溶酶体","多因某种溶酶体水解酶基因缺陷，底物不能被降解而在溶酶体内蓄积，如己糖胺酶 A 缺陷致 GM2 神经节苷脂堆积（Tay-Sachs 病）"],"answer":4,"explain":"溶酶体贮积症多因溶酶体水解酶基因突变（隐性遗传），底物无法降解而在溶酶体内蓄积，如己糖胺酶 A 缺乏使 GM2 堆积。","type":"A1","id":"c7-12f14ce9"},{"ch":7,"part":2,"tag":"过氧化物酶体生物发生","stem":"过氧化物酶体的酶蛋白由核基因编码、在细胞质核糖体上合成后输入。关于其靶向运输与相关疾病的叙述，正确的是","options":["酶蛋白凭借 M6P 标签经 M6P 受体输入过氧化物酶体","酶蛋白依靠 C 端的 PTS1（或 N 端的 PTS2）信号被受体识别后输入；PEX 基因突变使过氧化物酶体不能形成，导致 Zellweger 综合征","酶蛋白在过氧化物酶体内合成，其 mRNA 由过氧化物酶体自身携带","过氧化物酶体由内质网腔出芽形成，其中的酶均来自内质网","PTS 信号缺失只使酶被分泌到细胞外，并不引起疾病"],"answer":1,"explain":"过氧化物酶体酶靠 PTS1/PTS2 信号被受体识别后输入；PEX 基因突变致过氧化物酶体缺失（Zellweger 综合征），其功能障碍还与 X-ALD 相关。","type":"A1","id":"c7-816bc75f"},{"ch":7,"part":2,"tag":"膜接触区","stem":"内膜系统各区室之间需要不断交换膜成分与腔内物质。关于这种交流方式的叙述，正确的是","options":["只能通过转运囊泡实现，各区室之间不存在其他交流途径","各区室通过管状结构彼此完全连通，故腔内成分完全相同","区室之间靠核孔复合体交换蛋白质与脂质","既经转运囊泡运输（如内质网到高尔基复合体），也可通过膜接触区直接交换脂质与 Ca2+ 等（如内质网与线粒体之间），以维持各区室的特性","各区室的膜可自由融合，故内膜系统各区室的膜成分没有差别"],"answer":3,"explain":"内膜系统区室间既通过囊泡运输传递膜与内容物，也经膜接触区进行非囊泡式的脂质、钙交换，从而维持区室化与各自的特性。","type":"A1","id":"c7-44f28a12"},{"ch":7,"part":2,"tag":"膜蛋白拓扑","stem":"膜蛋白在粗面内质网上合成并插入内质网膜，其跨膜拓扑在此时即已确定。关于该过程的叙述，正确的是","options":["疏水的跨膜区段作为停止转移序列使肽链锚定于膜内，含糖链的区段朝向内质网腔侧（即细胞外侧面）","膜蛋白在细胞质中完全合成并折叠后，再整体插入膜内","跨膜区段由亲水性氨基酸组成，以便与膜两侧的水相接触","膜蛋白的糖链都连接在朝向细胞质基质的区段上","膜蛋白的 N 端一定位于内质网腔侧，与其跨膜区段的位置无关"],"answer":0,"explain":"膜蛋白在粗面内质网合成时，疏水跨膜区段作为停止转移序列使其锚定于膜中，糖基化发生在腔侧（相当于细胞外侧）的区段。","type":"A1","id":"c7-00556651"},{"id":"gc10-01-2","ch":8,"part":2,"tag":"机制","stem":"从内质网到高尔基复合体的这一步运输，其囊泡的衣被与装配部位是","options":["由 COPI 与 ARF1 装配，起始于高尔基复合体的膜上","由 COPII 与 ARF1 装配，起始于内质网的出口位点","由网格蛋白与 AP-2 装配，起始于高尔基复合体膜上","由 COPII 与 Sar1 装配，起始于内质网的出口位点","由网格蛋白与 Sar1 装配，起始于细胞质膜的胞质侧"],"answer":3,"explain":"D 对：内质网到高尔基复合体的顺向运输由 Sar1 活化后招募 Sec23/Sec24 与 Sec13/Sec31 组成的 COPII 衣被完成，装配发生在内质网的出口位点。A 错：COPI 与 ARF1 介导的是高尔基复合体到内质网的逆向运输，方向与部位都不对；B 错：ARF1 属 COPI 系统，不与 COPII 配伍；C 错：网格蛋白与衔接蛋白参与受体介导的胞吞与反面网络向溶酶体、内体的运输；E 错：网格蛋白衣被在细胞质膜的胞质侧装配，与 Sar1 无关。","type":"A1","group":"c10-01","kind":"mechanism","chs":[7,8,24],"vignette":"在人表皮角质形成细胞中，一种单次跨膜的黏附蛋白（桥粒芯蛋白）在粗面内质网上边合成边插入内质网膜：N 端信号肽被切除，跨膜的疏水区段作为停止转移序列把肽链锚定在膜中，N-连接的糖链则加在朝向内质网腔的一侧。该蛋白随后由 COPII 囊泡运到高尔基复合体，糖链被进一步修剪，表观分子量由 130 kDa 变为 160 kDa，再由囊泡送到相邻细胞相互接触的部位；免疫电镜显示其胞内段经桥粒斑蛋白与角蛋白中间纤维相连。寻常型天疱疮患者的血清中含有识别该蛋白胞外段的抗体，把该抗体加入培养的角质形成细胞单层，12 小时后细胞间黏附丧失、细胞彼此分离；若先用含胞外段的可溶性蛋白预吸附抗体，细胞单层则保持完整。","vignette_title":"情景 1：新合成的桥要搭在哪里","gidx":2,"gn":5,"anchor":"由 COPII 囊泡运到高尔基复合体"},{"id":"gc10-02-3","ch":8,"part":2,"tag":"判读","stem":"载有膜蛋白的囊泡在轴突中段堆积增多，而末梢区域明显减少，说明受阻的环节最可能是","options":["囊泡在内质网出口位点的出芽与脱衣被","囊泡与突触前膜的锚定与膜融合","膜蛋白在粗面内质网上的合成与折叠","囊泡沿细胞骨架被马达蛋白定向运输","囊泡融合后膜成分的回收与再循环"],"answer":3,"explain":"D 对：囊泡已经形成并出现在轴突中段，却不能继续向末梢推进，说明出芽、脱衣被与分选正常，卡住的是沿细胞骨架由马达蛋白驱动的定向运输。A 错：出芽或脱衣被障碍时囊泡难以形成或滞留在内质网附近；B 错：锚定与融合障碍会使囊泡堆积在末梢而不是中段；C 错：合成与折叠异常主要使蛋白滞留于内质网，不会造成囊泡在中段聚集；E 错：回收障碍影响膜成分的再利用，与囊泡在中段增多的现象不符。","type":"A1","group":"c10-02","kind":"mechanism","chs":[9,8,24],"vignette":"在运动神经元的轴突中，微管排成长束，正极统一背离胞体、指向末梢；微管结合蛋白 tau 结合在微管壁上，使微管保持稳定。胞体合成的膜蛋白被装入囊泡，沿微管被马达蛋白牵向末梢；末梢内吞形成的信号内体则被反向运回胞体，两者方向相反。取阿尔茨海默病患者的脑组织做免疫荧光：tau 过度磷酸化后从微管上脱落，聚集成神经原纤维缠结；轴突内微管数量减少、排列紊乱，载有膜蛋白的囊泡在轴突中段堆积增多，末梢区域的囊泡明显减少，轴突末梢因得不到新的膜成分而变性。神经元是高度极化的细胞，其轴突与树突在形态和膜成分上都有明显差别。","vignette_title":"情景 2：轴突传送带上的堵塞","gidx":3,"gn":5,"anchor":"载有膜蛋白的囊泡在轴突中段堆积增多"},{"id":"gc10-02-5","ch":8,"part":2,"tag":"判读","stem":"关于轴突内货物的定向运输与细胞极性，下列判断正确的是（X 型多选）","options":["马达蛋白沿微管运输货物时需水解ATP提供能量","tau属微管结合蛋白，可结合并稳定轴突中的微管","顺行与逆行运输由同一种马达蛋白完成，只是方向不同","轴突内微管正极的统一排列是定向运输的结构基础","微管解聚后，tau仍可结合微丝维持轴突运输"],"answer":[0,1,3],"explain":"答案 ABD。A 对：马达蛋白是 ATP 酶，沿微管运输货物时水解 ATP 提供能量；B 对：tau 属微管结合蛋白，结合并稳定轴突中的微管，其异常脱落与聚集正是本病的起点；D 对：轴突内微管正极统一背离胞体，是顺行与逆行运输各有方向的结构基础。C 错：顺行运输由驱动蛋白承担，逆行运输由动力蛋白承担，两者并非同一种马达蛋白；E 错：tau 从微管脱落后聚集成缠结，既不结合微丝，也不能替代微管完成轴突运输。","type":"X","group":"c10-02","kind":"mechanism","chs":[9,8,24],"vignette":"在运动神经元的轴突中，微管排成长束，正极统一背离胞体、指向末梢；微管结合蛋白 tau 结合在微管壁上，使微管保持稳定。胞体合成的膜蛋白被装入囊泡，沿微管被马达蛋白牵向末梢；末梢内吞形成的信号内体则被反向运回胞体，两者方向相反。取阿尔茨海默病患者的脑组织做免疫荧光：tau 过度磷酸化后从微管上脱落，聚集成神经原纤维缠结；轴突内微管数量减少、排列紊乱，载有膜蛋白的囊泡在轴突中段堆积增多，末梢区域的囊泡明显减少，轴突末梢因得不到新的膜成分而变性。神经元是高度极化的细胞，其轴突与树突在形态和膜成分上都有明显差别。","vignette_title":"情景 2：轴突传送带上的堵塞","gidx":5,"gn":5,"anchor":"正极统一背离胞体、指向末梢"},{"id":"gc10-03-3","ch":8,"part":2,"tag":"机制","stem":"膜脂被递送到质膜后，质膜的面积仍能保持相对稳定，其原因是","options":["新合成的膜脂被直接分泌到细胞外的液体中","膜脂一旦插入质膜就不再被回收或降解","质膜面积由细胞核内的基因拷贝数决定","胞吐加入的膜与胞吞回收的膜相互平衡","膜脂在高尔基复合体中被降解后经核孔排出"],"answer":3,"explain":"D 对：囊泡与质膜融合把膜成分加进质膜，胞吞又把膜成分连同内容物一并回收，两者相互平衡，膜成分还可再循环利用，故质膜面积保持相对稳定。A 错：膜脂不会以分泌到细胞外液的方式被清除；B 错：质膜成分处于不断更新之中，可经胞吞被回收；C 错：质膜面积由膜的加入与回收决定，与基因拷贝数无关；E 错：膜脂不能经核孔通过，核孔运输的是蛋白质与 RNA 等大分子。","type":"A1","group":"c10-03","kind":"mechanism","chs":[4,8,9],"vignette":"培养的 HeLa 细胞中，带负电荷的磷脂酰丝氨酸集中在质膜脂双层的内侧小叶，糖脂与糖蛋白的糖链则伸向细胞外侧。用荧光标记的脂质类似物追踪可见：它在质膜上以侧向扩散为主，30 分钟内发生跨层翻转的分子不足 2%。膜脂主要在滑面内质网合成，随后经囊泡运输与膜接触区被递送到质膜，而胞吞又不断把质膜成分回收进细胞。若用药物破坏膜下的肌动蛋白皮质，原本集中在细胞表面的某些膜蛋白，其侧向扩散范围明显扩大，分布逐渐趋于均匀。把这批细胞置于凋亡诱导条件下 2 小时，细胞皱缩、膜表面出现大量小泡，原本只在内侧小叶的磷脂酰丝氨酸翻到了外侧。","vignette_title":"情景 3：为什么内层的磷脂不会自己翻出来","gidx":3,"gn":5,"anchor":"经囊泡运输与膜接触区被递送到质膜"},{"id":"gc10-04-2","ch":8,"part":2,"tag":"判读","stem":"甲组中快速恢复不受影响而缓慢恢复明显延迟，说明缓慢恢复","options":["依赖沿微管进行的囊泡定向运输与再循环","依赖受体在质膜上的侧向扩散与翻转运动","依赖膜脂在滑面内质网中的重新合成","依赖漂白区膜蛋白的降解与重新合成","依赖紧密连接对膜蛋白扩散的限制作用"],"answer":0,"explain":"A 对：甲组快速相不变而缓慢相明显延迟，同时囊泡不再由细胞中央向外周定向移动，说明缓慢相依赖沿微管进行的定向囊泡运输与受体再循环。B 错：侧向扩散与翻转属于快速相，不受微管解聚影响；C 错：膜脂的合成是持续过程，与 5 分钟内荧光缓慢回升不匹配；D 错：降解与重新合成耗时远超 5 分钟，且抑制蛋白质合成不影响恢复；E 错：成纤维细胞之间没有紧密连接，其栅栏功能不参与本例。","type":"A1","group":"c10-04","kind":"experiment","chs":[9,8,4],"vignette":"研究生小郑在培养的成纤维细胞中表达一种 GFP 标记的膜受体，它在细胞表面呈点状分布，并不断经囊泡在质膜与内体之间循环。对照组：把细胞表面一片区域的荧光光漂白，荧光先在半分钟内快速恢复约 40%，随后在 5 分钟内缓慢恢复到约 90%。甲组：加 10 μmol/L 诺考达唑 2 小时使微管解聚，半分钟内的快速恢复不受影响，而随后的缓慢恢复明显延迟，同时胞质中载有该受体的囊泡不再由细胞中央向外周定向移动。乙组：加细胞松弛素 B 后，细胞变圆、片状伪足回缩，半分钟内的快速恢复加快到约 60%。丙组：先用叠氮钠加脱氧葡萄糖处理耗竭 ATP，再复温到 37℃ 做光漂白，只有半分钟内的快速恢复出现，缓慢恢复几乎消失。","vignette_title":"情景 4：光漂白以后，荧光是怎么回来的","gidx":2,"gn":6,"anchor":"载有该受体的囊泡不再由细胞中央向外周定向移动"},{"id":"gc13-01-6","ch":8,"part":2,"tag":"判读","stem":"关于本实验涉及的膜域、膜蛋白与囊泡运输，下列判断正确的是（X 型多选）","options":["脂筏上的蛋白可侧向扩散，并与周围膜交换","GPI锚定蛋白的肽链部分朝向细胞外侧","低密度组分主要由细胞核膜的碎片组成","小窝蛋白介导的胞吞依赖脂筏而不依赖网格蛋白","抽走胆固醇后膜蛋白的侧向扩散受到抑制"],"answer":[0,1,3],"explain":"答案 ABD。A 对：保温后的组分转移与单分子追踪都显示脂筏蛋白持续与周围膜交换，说明其可在膜上侧向扩散。B 对：GPI 锚插在外侧小叶，蛋白部分伸向细胞外，故抗体只能从细胞外侧与之结合。D 对：小窝蛋白介导的胞吞依赖脂筏与 caveolin-1，与网格蛋白包被囊泡的装配机制不同。C 错：低密度组分来自质膜的脂筏区，核膜碎片带核孔结构，其沉降性质与脂筏区不同。E 错：情景中抽走胆固醇后两种蛋白的扩散系数反而趋于一致，限制是被解除而不是受到抑制。","type":"X","group":"c13-01","kind":"mechanism","chs":[4,5,8],"vignette":"小肠上皮细胞的刷状缘由质膜与细胞皮质共同形成的微绒毛构成。研究者把刷状缘膜分离后，在4℃用1% Triton X-100提取并做密度梯度离心：GPI锚定的碱性磷酸酶与Src家族激酶几乎都出现在低密度组分，而Na⁺-葡萄糖协同转运体留在高密度组分，两者在37℃下的侧向扩散系数相差约3倍。把样品升到37℃保温2分钟后重新提取，低密度组分中约一半的蛋白已转移到高密度组分；单分子追踪显示，37℃下这些蛋白平均每秒约有5%的分子离开所在膜域。若先用甲基-β-环糊精抽走膜上约60%的胆固醇，低密度组分几乎测不到，两种蛋白的扩散系数也随之接近。免疫电镜显示，抗碱性磷酸酶的金颗粒只结合在朝向肠腔的一侧。","vignette_title":"情景 1：低密度组分里的那批蛋白","gidx":6,"gn":6,"anchor":"两者在37℃下的侧向扩散系数相差约3倍"},{"id":"gc13-03-5","ch":8,"part":2,"tag":"判读","stem":"标记的胞外颗粒经吞噬体进入细胞后最终也被降解，这一结果说明","options":["吞噬体与自噬体的膜来源相同，两者是同一结构","两条降解途径起点不同，最终都依赖溶酶体水解酶","胞外颗粒进入细胞后可绕过吞噬体直接进入溶酶体","胞外颗粒的降解与溶酶体的酸性环境没有关系","自噬体与吞噬体都由网格蛋白包被从质膜出芽形成"],"answer":1,"explain":"B 对：胞外颗粒经吞噬体进入细胞，而饥饿诱导的双层膜结构包裹的是自身成分，两条途径起点不同，但最终都要与溶酶体融合并由酸性水解酶完成降解。A 错：吞噬体的膜来自质膜，双层膜结构的膜来自细胞内部，两者来源并不相同。C 错：颗粒必须先被吞噬体包裹，与溶酶体融合后才被降解。D 错：颗粒的降解发生在溶酶体内，依赖其酸性环境与酸性水解酶。E 错：胞吞与吞噬可经网格蛋白衣被装配，而包裹自身成分的结构来自细胞内部，并不由质膜出芽形成。","type":"A1","group":"c13-03","kind":"mechanism","chs":[7,8,6],"vignette":"培养的大鼠肝细胞换入不含氨基酸的培养液，饥饿4小时后，电镜下每个细胞出现约400个双层膜结构，内含线粒体碎片与内质网断片；长寿命蛋白的降解速率由1.2%/h升至4.5%/h。处理6小时：甲组加3-甲基腺嘌呤后双层膜结构减至90个、降解速率回落到1.3%；乙组加巴弗洛霉素A1后溶酶体pH由5.0升到6.8，双层膜结构增至1200个、降解速率降到0.9%；丙组补回氨基酸后双层膜结构减至120个。另一组细胞先用解偶联剂使线粒体受损，胞质中PINK1蓄积并招募Parkin，受损线粒体随后被双层膜结构包裹。把标记的胞外颗粒加入培养基，可见颗粒经吞噬体进入细胞并与溶酶体融合。","vignette_title":"情景 3：饿出来的双层膜结构","gidx":5,"gn":6,"anchor":"颗粒经吞噬体进入细胞并与溶酶体融合"},{"id":"gc2-02-3","ch":8,"part":2,"tag":"机制","stem":"患儿血浆中溶酶体水解酶活性反而升高，原因是这些酶","options":["不能被内体接收，反向经高尔基体排出细胞","不能获得M6P标签，随组成型分泌排出细胞","溶酶体膜破损后漏出，经细胞质进入血液","被网格蛋白包被囊泡误送到细胞外液","在细胞质基质中大量合成，直接进入血液"],"answer":1,"explain":"B 对：缺少 M6P 标签的水解酶无法被 M6P 受体分选，只能沿默认途径随组成型分泌持续排出细胞，故血浆中酶活性反而升高。B 溶酶体膜并未破损，底物仍蓄积在溶酶体内；C 水解酶并非在胞质基质合成，也不会直接入血；D 问题出在分选标签而不是内体接收，方向也写反了；E 组成型分泌不经网格蛋白包被囊泡。","type":"A1","group":"c2-02","kind":"mechanism","chs":[7,8,6],"vignette":"溶酶体内数十种酸性水解酶都在粗面内质网的核糖体上合成，进入内质网腔后切去信号肽、加上糖链，再由COPII包被囊泡送到高尔基复合体。与它们同行的一批内质网驻留蛋白靠C端的KDEL序列被KDEL受体捕获，经COPI包被囊泡逆向运回内质网。决定水解酶去向的关键一步发生在高尔基复合体顺面：磷酸转移酶识别水解酶特有的三维标志，在糖链的甘露糖上添加磷酸，生成甘露糖-6-磷酸标签；反面网络上的M6P受体识别标签，把它们装入网格蛋白包被囊泡送往溶酶体。少数患儿该磷酸转移酶活性缺失，水解酶拿不到M6P标签，只能按默认途径经组成型分泌排出细胞，血浆中溶酶体酶活性反而升高，而溶酶体内底物大量蓄积，出现骨骼畸形与发育迟缓。","vignette_title":"情景 2：酶造出来了，却送错了门","gidx":3,"gn":6,"anchor":"经组成型分泌排出细胞"},{"id":"gc2-02-4","ch":8,"part":2,"tag":"机制","stem":"若内质网驻留蛋白被误带到高尔基复合体，细胞回收它们的机制是","options":["KDEL受体识别并装入COPI包被囊泡运回","随组成型分泌排出细胞后再经胞吞回收","在高尔基复合体的反面被蛋白酶体降解清除","M6P受体识别并装入网格蛋白包被囊泡运回","经核孔复合体进入细胞核后被降解清除"],"answer":0,"explain":"A 对：KDEL 是内质网驻留信号，被高尔基体膜上的 KDEL 受体识别后，经 COPI 包被囊泡逆向运回内质网，这就是驻留蛋白的回收机制。B M6P 受体负责溶酶体酶的分选，标签与方向都不对；C 核孔运输与内质网驻留蛋白的回收无关；D 腔内蛋白不在高尔基复合体被蛋白酶体降解，溶解度也不允许蛋白酶体进入腔面；E 驻留蛋白不会先分泌出去再被回收。","type":"A1","group":"c2-02","kind":"mechanism","chs":[7,8,6],"vignette":"溶酶体内数十种酸性水解酶都在粗面内质网的核糖体上合成，进入内质网腔后切去信号肽、加上糖链，再由COPII包被囊泡送到高尔基复合体。与它们同行的一批内质网驻留蛋白靠C端的KDEL序列被KDEL受体捕获，经COPI包被囊泡逆向运回内质网。决定水解酶去向的关键一步发生在高尔基复合体顺面：磷酸转移酶识别水解酶特有的三维标志，在糖链的甘露糖上添加磷酸，生成甘露糖-6-磷酸标签；反面网络上的M6P受体识别标签，把它们装入网格蛋白包被囊泡送往溶酶体。少数患儿该磷酸转移酶活性缺失，水解酶拿不到M6P标签，只能按默认途径经组成型分泌排出细胞，血浆中溶酶体酶活性反而升高，而溶酶体内底物大量蓄积，出现骨骼畸形与发育迟缓。","vignette_title":"情景 2：酶造出来了，却送错了门","gidx":4,"gn":6,"anchor":"被KDEL受体捕获"},{"id":"gc2-02-5","ch":8,"part":2,"tag":"方案","stem":"要验证水解酶进入溶酶体确实依赖 M6P 标签，最合适的做法是","options":["用放线菌素D抑制rRNA转录后观察酶分布","用诺考达唑破坏微管后观察水解酶分布","用M6P竞争阻断M6P受体后观察酶分布","加入蛋白酶体抑制剂后观察水解酶分布","降低培养温度至4℃后观察水解酶分布"],"answer":2,"explain":"C 对：加入游离 M6P 与标签竞争 M6P 受体，若水解酶随即改走分泌途径、溶酶体内酶量减少，就证明进入溶酶体依赖这一标签。B 抑制 rRNA 转录只影响核糖体生成，与标签无关；C 破坏微管影响的是运输方向，不能特异性地检验 M6P 标签；D 蛋白酶体抑制剂作用于胞质内的降解途径；E 低温会让多种运输同时受阻，缺乏特异性。","type":"A1","group":"c2-02","kind":"mechanism","chs":[7,8,6],"vignette":"溶酶体内数十种酸性水解酶都在粗面内质网的核糖体上合成，进入内质网腔后切去信号肽、加上糖链，再由COPII包被囊泡送到高尔基复合体。与它们同行的一批内质网驻留蛋白靠C端的KDEL序列被KDEL受体捕获，经COPI包被囊泡逆向运回内质网。决定水解酶去向的关键一步发生在高尔基复合体顺面：磷酸转移酶识别水解酶特有的三维标志，在糖链的甘露糖上添加磷酸，生成甘露糖-6-磷酸标签；反面网络上的M6P受体识别标签，把它们装入网格蛋白包被囊泡送往溶酶体。少数患儿该磷酸转移酶活性缺失，水解酶拿不到M6P标签，只能按默认途径经组成型分泌排出细胞，血浆中溶酶体酶活性反而升高，而溶酶体内底物大量蓄积，出现骨骼畸形与发育迟缓。","vignette_title":"情景 2：酶造出来了，却送错了门","gidx":5,"gn":6,"anchor":"M6P受体识别标签"},{"id":"gc2-03-1","ch":8,"part":2,"tag":"机制","stem":"囊泡与靶膜融合时，SNARE 蛋白的配对方式是","options":["由网格蛋白与衔接蛋白拉近两膜并完成融合","靶膜上的v-SNARE与囊泡上的t-SNARE配对成束","由Rab蛋白替代SNARE拉近两膜并完成融合","囊泡上的v-SNARE与胞质中的t-SNARE共价连接","囊泡上的v-SNARE与靶膜上的t-SNARE配对成束"],"answer":4,"explain":"E 对：情景给出囊泡膜上的 v-SNARE 与突触前膜（即靶膜）上的 t-SNARE 配对并拉成螺旋束，正是这一配对把两膜拉近、驱动融合。B 把两种 SNARE 的膜归属对调；D 错在 t-SNARE 位于靶膜而非胞质，配对靠螺旋束缠绕而不是共价连接；D Rab 负责锚定与融合特异性的调控，不直接催化膜融合；E 网格蛋白参与囊泡衣被的装配，与膜融合无关。","type":"A1","group":"c2-03","kind":"mechanism","chs":[8,9,4],"vignette":"神经肌肉接头处，运动神经末梢的突触囊泡内装着乙酰胆碱。囊泡在胞体形成后由驱动蛋白牵着沿轴突微管向正极运输，抵达末梢后，囊泡膜上的v-SNARE与突触前膜上的t-SNARE拉成螺旋束，把两膜拉近并驱动融合。这一步属调节型分泌：只有动作电位到达、胞质Ca²⁺升高，囊泡才与突触前膜融合并释放递质，随后膜成分被回收再利用。肉毒毒素由重链与轻链组成，轻链进入末梢后行使锌依赖的蛋白酶活性，把SNARE蛋白切断；囊泡因此停靠在膜旁却不能融合，乙酰胆碱无法释放，患者出现进行性、对称性的弛缓性麻痹。","vignette_title":"情景 3：被抓断的分子拉链","gidx":1,"gn":5,"anchor":"与突触前膜上的t-SNARE拉成螺旋束"},{"id":"gc2-03-2","ch":8,"part":2,"tag":"机制","stem":"该末梢的递质释放属于调节型分泌，其触发信号是","options":["胞质Ca²⁺浓度降低使囊泡解除锚定","突触前膜超极化使囊泡与膜融合","胞质cAMP浓度下降使囊泡与膜融合","囊泡内乙酰胆碱浓度升高触发融合","动作电位到达使胞质Ca²⁺浓度升高"],"answer":4,"explain":"E 对：情景说明只有动作电位到达、胞质 Ca²⁺ 升高时囊泡才与突触前膜融合并释放递质，这正是调节型分泌的触发条件，也为后续膜成分回收留出调控余地。B 把 Ca²⁺ 的变化方向写反；C cAMP 下降不是本例的触发信号；D 囊泡内递质浓度并不决定融合时机；E 动作电位到达末梢引起的是去极化而不是超极化。","type":"A1","group":"c2-03","kind":"mechanism","chs":[8,9,4],"vignette":"神经肌肉接头处，运动神经末梢的突触囊泡内装着乙酰胆碱。囊泡在胞体形成后由驱动蛋白牵着沿轴突微管向正极运输，抵达末梢后，囊泡膜上的v-SNARE与突触前膜上的t-SNARE拉成螺旋束，把两膜拉近并驱动融合。这一步属调节型分泌：只有动作电位到达、胞质Ca²⁺升高，囊泡才与突触前膜融合并释放递质，随后膜成分被回收再利用。肉毒毒素由重链与轻链组成，轻链进入末梢后行使锌依赖的蛋白酶活性，把SNARE蛋白切断；囊泡因此停靠在膜旁却不能融合，乙酰胆碱无法释放，患者出现进行性、对称性的弛缓性麻痹。","vignette_title":"情景 3：被抓断的分子拉链","gidx":2,"gn":5,"anchor":"只有动作电位到达、胞质Ca²⁺升高"},{"id":"gc2-03-4","ch":8,"part":2,"tag":"判读","stem":"中毒后末梢内突触囊泡堆积在突触前膜附近而递质不释放，这一现象说明","options":["乙酰胆碱酯酶活性升高使递质被水解","突触后膜的乙酰胆碱受体被降解","锚定已能发生，融合需要SNARE参与","囊泡内乙酰胆碱的合成已被抑制","囊泡的定向运输环节被毒素阻断"],"answer":2,"explain":"C 对：囊泡能到达并停靠在突触前膜附近，说明定向运输与锚定已经完成，卡住的是 SNARE 介导的融合这一步，与毒素切断 SNARE 的结果吻合。B 若运输被阻断，囊泡不会聚集到膜旁；C 递质合成减少与囊泡在膜旁堆积的现象不符；D 突触后膜受体被降解不会让末梢内的囊泡堆积；E 酯酶活性升高只影响已释放到间隙的递质，不改变囊泡的去向。","type":"A1","group":"c2-03","kind":"mechanism","chs":[8,9,4],"vignette":"神经肌肉接头处，运动神经末梢的突触囊泡内装着乙酰胆碱。囊泡在胞体形成后由驱动蛋白牵着沿轴突微管向正极运输，抵达末梢后，囊泡膜上的v-SNARE与突触前膜上的t-SNARE拉成螺旋束，把两膜拉近并驱动融合。这一步属调节型分泌：只有动作电位到达、胞质Ca²⁺升高，囊泡才与突触前膜融合并释放递质，随后膜成分被回收再利用。肉毒毒素由重链与轻链组成，轻链进入末梢后行使锌依赖的蛋白酶活性，把SNARE蛋白切断；囊泡因此停靠在膜旁却不能融合，乙酰胆碱无法释放，患者出现进行性、对称性的弛缓性麻痹。","vignette_title":"情景 3：被抓断的分子拉链","gidx":4,"gn":5,"anchor":"停靠在膜旁却不能融合"},{"id":"gc23-02-4","ch":8,"part":2,"tag":"判读","stem":"阻断囊泡与质膜的融合后，分裂沟加深到一半便停住，这一结果说明","options":["分裂沟的最后断开需要囊泡把膜成分送到沟底并融合","囊泡运输为收缩环提供收缩所需的 ATP，阻断后收缩停止","囊泡运输把肌动蛋白单体送到沟底，供收缩环持续装配","囊泡运输把细胞核搬回细胞中央，否则分裂沟会偏移","囊泡融合释放的钙离子是收缩环持续收缩所需的信号"],"answer":0,"explain":"A 对：情景显示沟底部的质膜仍在与囊泡融合、膜面积增加约 30%，阻断融合后分裂沟停在半途、两个子细胞以细胞质桥相连，说明最后断开这一步需要囊泡把膜成分送到沟底并与之融合。B 错：ATP 由细胞代谢提供，囊泡运输是消耗 ATP 而非提供 ATP；C 错：肌动蛋白单体可在细胞内扩散，收缩环的装配并不依赖囊泡投递；D 错：分裂期细胞核不发生这样的搬移；E 错：情景阻断的是膜融合环节，与钙信号无关，且收缩环已收缩到一半。","type":"A1","group":"c23-02","kind":"mechanism","chs":[9,26,8],"vignette":"同步化培养的 HeLa 细胞进入有丝分裂后期，姐妹染色单体在纺锤体的牵引下移向两极。此时位于两极之间的纺锤体中央区向细胞赤道面的皮层发出位置信号，赤道面下的肌动蛋白微丝与肌球蛋白 II 组装成一条环绕细胞的收缩环；荧光测量显示，环的直径在 10 分钟内由约 20 μm 缩到 8 μm，质膜随之内陷形成分裂沟。若在收缩环装配前用抑制肌球蛋白 II 的药物处理，染色体照常分离、核膜照常重建，分裂沟却不出现，最后形成含两个细胞核的大细胞。另有一组细胞在后期启动前加入蛋白酶体抑制剂，姐妹染色单体停留在中期不能分离，分裂沟也不出现。分裂沟加深到只剩一条细的细胞质桥时，沟底部的质膜仍在与囊泡融合、膜面积增加约 30%，随后桥断开，形成两个独立的子细胞；若用药物阻断囊泡与质膜的融合，分裂沟加深到一半便停住，两个子细胞长期以细胞质桥相连。","vignette_title":"情景 2：把细胞一分为二的三件事","gidx":4,"gn":5,"anchor":"两个子细胞长期以细胞质桥相连"},{"id":"gc23-03-3","ch":8,"part":2,"tag":"判读","stem":"追踪 1 小时后 70% 的新合成顶端膜蛋白出现在顶端膜、6% 出现在侧面膜，这一分布说明","options":["膜蛋白到达顶端膜的比例由其合成速度决定","膜蛋白在质膜上可自由地从顶端扩散到侧面膜","顶端膜蛋白被侧面膜大量降解后由新合成蛋白补足","囊泡在细胞质中随机扩散，恰好先遇到顶端膜","囊泡的投递有目的地选择性，属定向运输与定点融合"],"answer":4,"explain":"E 对：情景中绝大多数新合成顶端膜蛋白被送到顶端膜，说明囊泡运输是有序并受精确调控的定向运输过程，囊泡沿细胞骨架被运到特定区域并与该处质膜定点融合。A 错：合成速度只决定蛋白的总量，不决定它被送到哪个膜域；B 错：质膜上的膜蛋白虽能侧向扩散，但不会自由地从顶端域跨到侧面域；C 错：情景没有侧面膜大量降解的证据，降解也不能解释这种定向分布；D 错：囊泡并非随机扩散后再碰到靶膜，其运输由细胞骨架与马达蛋白定向完成。","type":"A1","group":"c23-03","kind":"mechanism","chs":[8,24,9],"vignette":"培养的肾上皮细胞在滤膜上长成致密单层后表现出顶底极性，朝向培养液的顶端膜与朝向基底面的膜在蛋白组成上明显不同。该细胞的高尔基复合体位于细胞核上方、靠近顶端膜一侧。免疫荧光显示，Par3、Par6 与 aPKC 组成的复合体集中在顶端膜下方的皮层，侧面与基底面则富集另一类极性蛋白，两类分子的分布界限清晰。新合成的顶端膜蛋白在高尔基复合体反面网络被分选入囊泡，随后沿细胞质中的微管被马达蛋白运往细胞顶端，与顶端质膜融合；追踪 1 小时，约 70% 的新合成顶端膜蛋白出现在顶端膜上，只有 6% 出现在侧面膜。若表达一种激酶失活的 aPKC 突变体，Par 复合体仍能定位到顶端皮层，但顶端与侧面标志蛋白的分布界限变得模糊，新合成顶端膜蛋白出现在顶端膜的比例降到 25%、出现在侧面的比例升到 40%，而囊泡的出芽与沿微管运输的速度都没有明显改变。","vignette_title":"情景 3：顶端膜上的地址是怎么写上的","gidx":3,"gn":5,"anchor":"约 70% 的新合成顶端膜蛋白出现在顶端膜上"},{"id":"gc23-03-5","ch":8,"part":2,"tag":"判读","stem":"关于该上皮细胞极性蛋白与顶端膜定向投递的关系，下列判断正确的是（X 型多选）","options":["新合成的顶端膜蛋白需先在高尔基复合体反面网络被分选入囊泡","aPKC 的激酶活性丧失后囊泡沿微管的运输速度明显下降","顶端域与侧面域的分子界限由极性蛋白之间的相互排斥维持","若极性装置的定位被打乱，新合成膜蛋白仍能准确到达顶端膜","囊泡与顶端质膜的融合是膜成分被加入顶端膜的主要方式"],"answer":[0,2,4],"explain":"答案 ACE。A 对：情景给出新合成的顶端膜蛋白在高尔基复合体反面网络被分选入囊泡；C 对：aPKC 激酶失活后两个膜域的界限模糊，说明界限依靠极性蛋白之间的相互排斥来维持；E 对：囊泡与顶端质膜融合，即把膜成分加入顶端膜。B 错：情景明确给出囊泡的出芽与沿微管运输的速度并没有明显改变；D 错：极性装置被打乱后，新合成顶端膜蛋白出现在侧面的比例由 6% 升到 40%，投递已失去准确性。","type":"X","group":"c23-03","kind":"mechanism","chs":[8,24,9],"vignette":"培养的肾上皮细胞在滤膜上长成致密单层后表现出顶底极性，朝向培养液的顶端膜与朝向基底面的膜在蛋白组成上明显不同。该细胞的高尔基复合体位于细胞核上方、靠近顶端膜一侧。免疫荧光显示，Par3、Par6 与 aPKC 组成的复合体集中在顶端膜下方的皮层，侧面与基底面则富集另一类极性蛋白，两类分子的分布界限清晰。新合成的顶端膜蛋白在高尔基复合体反面网络被分选入囊泡，随后沿细胞质中的微管被马达蛋白运往细胞顶端，与顶端质膜融合；追踪 1 小时，约 70% 的新合成顶端膜蛋白出现在顶端膜上，只有 6% 出现在侧面膜。若表达一种激酶失活的 aPKC 突变体，Par 复合体仍能定位到顶端皮层，但顶端与侧面标志蛋白的分布界限变得模糊，新合成顶端膜蛋白出现在顶端膜的比例降到 25%、出现在侧面的比例升到 40%，而囊泡的出芽与沿微管运输的速度都没有明显改变。","vignette_title":"情景 3：顶端膜上的地址是怎么写上的","gidx":5,"gn":5,"anchor":"集中在顶端膜下方的皮层"},{"id":"gc23-04-1","ch":8,"part":2,"tag":"判读","stem":"甲组中红色囊泡改为随机扩散、到达前缘的比例降到 8%，这一结果说明","options":["囊泡到前缘的定向运输依赖完整的微管网络","囊泡到前缘的定向运输同时依赖微管与微丝的完整","诺考达唑使囊泡膜上的融合蛋白被降解而无法融合","诺考达唑使马达蛋白失去水解 ATP 的能力","囊泡在高尔基体区的出芽被诺考达唑直接阻断"],"answer":0,"explain":"A 对：诺考达唑抑制微管蛋白聚合使微管解聚，囊泡失去定向运输的轨道而改为随机扩散，说明这一段运输依赖完整的微管网络。B 错：乙组微丝解聚后囊泡仍沿原方向被运到细胞外周，说明长距离定向运输并不需要微丝的完整；C 错：诺考达唑作用于微管蛋白，与囊泡膜上的融合蛋白无关；D 错：马达蛋白水解 ATP 的能力并未被该药抑制，失去的是轨道；E 错：情景中囊泡仍能在胞质中扩散，说明出芽并未被直接阻断。","type":"A1","group":"c23-04","kind":"experiment","chs":[8,9,24],"vignette":"研究生的课题是追踪迁移细胞前缘膜成分的来源。他在成纤维细胞中表达一种光转化荧光蛋白，用 405 nm 光照射细胞中央高尔基体所在的区域，把这批蛋白的荧光由绿色转为红色，再用活细胞成像连续追踪红色囊泡 30 分钟。对照组：约 65% 的红色囊泡沿固定方向移到前缘并与质膜融合，前缘质膜面积增加约 20%。甲组：加 10 μmol/L 诺考达唑 2 小时使微管解聚，红色囊泡改为在胞质中随机扩散，到达前缘的比例降到 8%。乙组：加细胞松弛素 B 使微丝解聚，红色囊泡仍被运到细胞外周、方向与速度接近对照，但前缘不再伸出片状伪足，前缘质膜面积只增加约 4%，囊泡在皮层下方堆积。丙组：加抑制肌球蛋白 II 的药物，伪足伸出与囊泡融合都接近对照，但细胞体不再前移、尾部不能回缩。另在细胞侧面用蓝光局部照射，使一种光控蛋白在该处活化并引起肌动蛋白聚合，5 分钟内该侧伸出新的片状伪足，原前缘在 20 分钟内回缩，细胞的迁移方向随之改变。","vignette_title":"情景 4：绿变红之后，囊泡去了哪里","gidx":1,"gn":6,"anchor":"红色囊泡改为在胞质中随机扩散"},{"id":"gc23-04-4","ch":8,"part":2,"tag":"方案","stem":"与光漂白相比，本实验用光转化标记新合成囊泡的主要优点是","options":["可提高被照射区域的荧光强度，使囊泡更容易被分辨","可把已有荧光分子由绿改红，再追踪这批分子的去向","可杀死被照射区域的细胞，便于观察剩余细胞的迁移","可标记蛋白质的合成部位，从而判断囊泡的生成速度","可测定囊泡与质膜融合时释放到胞外的钙离子量"],"answer":1,"explain":"B 对：光转化是把已存在的荧光蛋白分子的发光颜色改为另一种，改色后这批分子仍可被追踪，因而能直接观察它们随后的移动方向、速度与终点。A 错：光漂白才是把荧光不可逆地淬灭，单纯提高亮度并非本实验的目的；C 错：光转化不杀死细胞，本实验所做的正是活细胞成像；D 错：被照射的是高尔基体区，标记的是已合成并到达该处的蛋白，测不出合成部位；E 错：光转化本身不能报告融合时钙离子的释放量。","type":"A1","group":"c23-04","kind":"experiment","chs":[8,9,24],"vignette":"研究生的课题是追踪迁移细胞前缘膜成分的来源。他在成纤维细胞中表达一种光转化荧光蛋白，用 405 nm 光照射细胞中央高尔基体所在的区域，把这批蛋白的荧光由绿色转为红色，再用活细胞成像连续追踪红色囊泡 30 分钟。对照组：约 65% 的红色囊泡沿固定方向移到前缘并与质膜融合，前缘质膜面积增加约 20%。甲组：加 10 μmol/L 诺考达唑 2 小时使微管解聚，红色囊泡改为在胞质中随机扩散，到达前缘的比例降到 8%。乙组：加细胞松弛素 B 使微丝解聚，红色囊泡仍被运到细胞外周、方向与速度接近对照，但前缘不再伸出片状伪足，前缘质膜面积只增加约 4%，囊泡在皮层下方堆积。丙组：加抑制肌球蛋白 II 的药物，伪足伸出与囊泡融合都接近对照，但细胞体不再前移、尾部不能回缩。另在细胞侧面用蓝光局部照射，使一种光控蛋白在该处活化并引起肌动蛋白聚合，5 分钟内该侧伸出新的片状伪足，原前缘在 20 分钟内回缩，细胞的迁移方向随之改变。","vignette_title":"情景 4：绿变红之后，囊泡去了哪里","gidx":4,"gn":6,"anchor":"把这批蛋白的荧光由绿色转为红色"},{"id":"gc5-02-4","ch":8,"part":2,"tag":"机制","stem":"新合成的顶端膜蛋白能被包装入囊泡却无法在顶端定位，其缺陷最可能在","options":["网格蛋白包被囊泡的出芽与切割释放环节","核糖体上蛋白质合成的起始与延伸环节","内质网到高尔基体的COPII顺向运输环节","内质网腔中蛋白质折叠与质量检查环节","Rab蛋白介导的囊泡锚定与融合特异性环节"],"answer":4,"explain":"E对：情景的关键细节是蛋白能被包装、也被运到细胞表面，却不能定位到顶端，说明出芽与分选正常，缺陷在Rab等小GTP酶介导的定向运输、锚定与融合特异性环节。C错：COPII介导内质网到高尔基体的顺向运输，其障碍会使蛋白根本不能被包装输出。A错：网格蛋白主要参与受体介导的胞吞及向溶酶体的运输，不是顶端膜蛋白的投递环节。B错：蛋白既已合成并被包装入囊泡，说明翻译环节正常。D错：折叠与质量检查异常会使蛋白滞留于内质网，不会出现在囊泡中。","type":"A1","group":"c5-02","kind":"mechanism","chs":[24,8,27],"vignette":"把培养的单层肠上皮细胞置于无钙培养液中，30分钟后电镜下可见相邻细胞之间的黏着连接解体、细胞间隙增宽，位于细胞顶端的封闭带也随之断裂。荧光标记显示：原本只分布在顶端膜上的转运体，此时扩散到了基底面；基底面的钠钾泵也出现在顶端膜上。细胞新合成的顶端膜蛋白仍能被包装入囊泡并运往细胞表面，但囊泡无法在顶端定位。研究者改用低浓度钙离子培养液（0.1mmol/L）后，上述变化在2小时内才缓慢出现。","vignette_title":"情景 2：把钙离子拿走之后","gidx":4,"gn":5,"anchor":"囊泡无法在顶端定位"},{"ch":8,"part":2,"tag":"囊泡运输","stem":"关于囊泡运输对细胞意义的叙述，正确的是","options":["仅负责把物质排出细胞，与膜成分更新无关","是有序并受精确调控的定向运输过程，使细胞膜与内膜系统各结构间的膜和内容物相互转换与更新","属于不消耗能量的被动扩散过程","只能运输小分子与离子","与信号转导、免疫应答等细胞活动无关"],"answer":1,"explain":"囊泡运输既是有序可控的定向运输与质量筛选过程，又是细胞膜与内膜系统相互转换、更新的基础，并参与分泌、免疫、信号转导等活动。","type":"A1","id":"c8-e92821bd"},{"ch":8,"part":2,"tag":"COPII","stem":"COPII包被蛋白介导的囊泡运输方向是","options":["高尔基复合体至内质网（逆向运输）","细胞膜至细胞质（胞吞）","内质网至高尔基复合体（顺向运输）","高尔基复合体至溶酶体","细胞核至细胞质"],"answer":2,"explain":"COPII介导内质网到高尔基体的顺向运输；COPI介导高尔基体到内质网的逆向运输，网格蛋白参与胞吞及TGN到溶酶体/内体的运输。","type":"A1","id":"c8-f3ce80c0"},{"ch":8,"part":2,"tag":"KDEL回收","stem":"若带有KDEL序列的内质网驻留蛋白被错误运输到高尔基复合体，细胞将如何处理","options":["由KDEL受体识别，包装入COPI包被囊泡逆向运回内质网","在高尔基复合体中被磷酸化后运往溶酶体降解","直接经分泌途径排出细胞外","经核孔进入细胞核被降解","在高尔基复合体中滞留直至细胞死亡"],"answer":0,"explain":"KDEL是内质网驻留信号，被高尔基体膜上的KDEL受体识别后经COPI包被囊泡逆向运回内质网，实现错误定位驻留蛋白的回收。","type":"A1","id":"c8-eaed2864"},{"ch":8,"part":2,"tag":"网格蛋白","stem":"关于网格蛋白（clathrin）包被囊泡的叙述，正确的是","options":["是内质网到高尔基复合体顺向运输的包被蛋白","只存在于细胞核内，参与核孔运输","其组成中包含甘露糖-6-磷酸受体","参与内质网驻留蛋白的逆向回收","参与受体介导的胞吞以及高尔基体反面网络（TGN）向溶酶体/内体的运输"],"answer":4,"explain":"网格蛋白包被囊泡参与受体介导的胞吞及TGN到溶酶体/内体的运输；COPII负责内质网到高尔基体的顺向运输，COPI负责逆向回收。","type":"A1","id":"c8-16d7c68d"},{"ch":8,"part":2,"tag":"胞吞类型","stem":"细胞胞吞作用的主要类型包括","options":["吞噬作用、胞饮作用与受体介导的胞吞","单纯扩散与易化扩散","原发性主动转运与继发性主动转运","组成型分泌与调节型分泌","内质网到高尔基体的顺向运输与逆向运输"],"answer":0,"explain":"胞吞主要包括吞噬（大颗粒）、胞饮（液体与溶质）和受体介导的胞吞（如LDL经网格蛋白包被囊泡内吞）；B、C为跨膜转运，D属胞吐。","type":"A1","id":"c8-2b0bbf09"},{"ch":8,"part":2,"tag":"胞吐","stem":"关于胞吐（exocytosis）的叙述，正确的是","options":["胞吐不消耗能量，囊泡膜不与质膜融合","组成型分泌只存在于神经细胞和内分泌细胞","调节型分泌不需要任何信号触发","组成型分泌持续进行；调节型分泌需信号（如胞质Ca2+升高）触发，二者均通过囊泡膜与质膜融合释放内容物","胞吐释放的物质不能作为信号分子"],"answer":3,"explain":"胞吐通过囊泡膜与质膜融合释放内容物并需耗能；组成型分泌持续进行，调节型分泌需Ca2+等信号触发，如神经递质与胰岛素的释放。","type":"A1","id":"c8-895303b7"},{"ch":8,"part":2,"tag":"质量检查","stem":"囊泡运输对运输物质进行严格的“质量检查和筛选分选”，其含义是","options":["囊泡随机包装所遇到的任意蛋白质，没有选择性","质量检查发生在细胞核内，与内膜系统无关","只有正确折叠并携带正确分选信号的蛋白质才被包装进入相应囊泡，未正确折叠的蛋白质被滞留并被降解","错误折叠的蛋白质一律直接分泌到细胞外","分选过程不依赖受体蛋白与包被蛋白"],"answer":2,"explain":"囊泡运输同时是质量控制与分选过程：正确折叠且带分选信号的蛋白被包装入特定囊泡，错误折叠蛋白被滞留后经蛋白酶体等途径降解。","type":"A1","id":"c8-c5f92353"},{"ch":8,"part":2,"tag":"囊泡与疾病","stem":"囊泡运输障碍最可能直接影响下列哪一项细胞活动","options":["DNA复制叉的延伸","核糖体的组装","氨基酸的活化","mRNA前体的剪接","分泌蛋白与神经递质的释放、营养物质的摄取等"],"answer":4,"explain":"囊泡运输参与细胞分泌、神经兴奋、营养摄取、信号转导与免疫应答，其障碍直接损害分泌与摄取功能，与多种疾病的发生发展相关。","type":"A1","id":"c8-dee2ff79"},{"ch":8,"part":2,"tag":"运输步骤","stem":"关于囊泡运输基本过程的叙述，正确的是","options":["囊泡在细胞质中随机扩散，只要与任意膜接触即可融合，无方向性与特异性","衣被蛋白在囊泡与靶膜融合之后才组装，其作用是关闭融合孔","一般先后经供体膜出芽（衣被组装）、脱衣被、沿细胞骨架定向运输、与靶膜锚定和融合等步骤，马达蛋白参与定向运输","囊泡运输不需要细胞骨架与马达蛋白参与","囊泡与靶膜融合后其膜成分随即被降解，不再被利用"],"answer":2,"explain":"囊泡运输的基本步骤为出芽（衣被组装）、脱衣被、定向运输（细胞骨架与马达蛋白）、锚定与融合；融合后膜成分可再循环利用。","type":"A1","id":"c8-77d95400"},{"ch":8,"part":2,"tag":"COPII组成","stem":"关于 COPII 包被蛋白的组成与装配的叙述，正确的是","options":["COPII 由 ARF1 与 coatomer 组成，介导高尔基体到内质网的运输","COPII 的衣被由网格蛋白与衔接蛋白组装而成","COPII 囊泡在内质网腔中形成，再经核孔输出到细胞质基质","COPII 的组装不消耗能量，Sar1 结合 GDP 或 GTP 均可完成装配","小 GTP 酶 Sar1 活化后结合内质网膜，招募 Sec23/Sec24（结合货物、形成内层）与 Sec13/Sec31（形成外层），在内质网出口位点完成出芽"],"answer":4,"explain":"COPII 由 Sar1 与 Sec23/24、Sec13/31 组成，在内质网出口位点装配衣被、介导顺向运输；ARF1/coatomer 则属 COPI。","type":"A1","id":"c8-7856fa1d"},{"ch":8,"part":2,"tag":"网格蛋白装配","stem":"关于网格蛋白包被囊泡装配机制的叙述，正确的是","options":["衔接蛋白 AP-2 结合膜上受体胞质侧的胞吞信号与磷脂，招募网格蛋白三腿复合体在膜的胞质侧装配成篮网状衣被，囊泡颈部的 dynamin 收缩切割完成释放","网格蛋白直接与受体的胞质区共价结合，不需要衔接蛋白参与","网格蛋白在膜的胞质侧内表面装配，由 dynamin 负责衣被的组装","网格蛋白衣被囊泡在细胞核内装配，再经核孔运出到细胞质","网格蛋白衣被在囊泡释放前即已脱落，故释放的囊泡表面不存在衣被"],"answer":0,"explain":"AP-2 识别受体胞质侧的胞吞信号并招募网格蛋白三腿复合体在膜的胞质侧装配，dynamin 于囊泡颈部收缩切割释放囊泡，随后衣被脱落。","type":"A1","id":"c8-6e9fa7fc"},{"ch":8,"part":2,"tag":"Rab蛋白","stem":"关于 Rab 蛋白在囊泡运输中作用的叙述，正确的是","options":["Rab 是一种跨膜蛋白，其构象变化由 Ca2+ 结合触发膜融合","Rab 属小 GTP 酶，结合 GTP 活化后定位到特定膜并招募效应蛋白，参与囊泡的定向运输、锚定与融合的特异性，其家族成员众多、各司其职","Rab 通过水解 ATP 直接驱动囊泡沿微管移动","Rab 与 SNARE 的作用相同，均能直接催化膜脂双层的融合","人体只有一种 Rab 蛋白，负责全部囊泡运输过程"],"answer":1,"explain":"Rab 是调控囊泡运输的小 GTP 酶分子开关：Rab-GTP 招募锚定因子、马达蛋白等效应蛋白，保证囊泡在正确部位锚定与融合。","type":"A1","id":"c8-acf46a24"},{"ch":8,"part":2,"tag":"SNARE","stem":"关于 SNARE 蛋白介导膜融合的叙述，正确的是","options":["SNARE 的配对没有特异性，任何囊泡膜与任何靶膜均可融合","SNARE 通过共价连接供体膜与靶膜，使两膜永久结合","SNARE 只参与细胞内区室间的运输，与神经递质释放无关","囊泡上的 v-SNARE 与靶膜上的 t-SNARE 特异性配对形成螺旋束，拉近两膜并驱动融合；融合后经 NSF/α-SNAP 作用使 SNARE 复合体解离并循环使用","SNARE 复合体的解离不需要能量，由 Ca2+ 直接触发"],"answer":3,"explain":"v-SNARE 与 t-SNARE 配对形成螺旋束驱动膜融合，融合后由 NSF/α-SNAP 解离；肉毒毒素切割 SNARE 即阻断递质释放。","type":"A1","id":"c8-a3c23839"},{"ch":8,"part":2,"tag":"非网格蛋白胞吞","stem":"除网格蛋白介导的胞吞外，细胞还有多种胞吞途径。关于这些途径的叙述，正确的是","options":["小窝蛋白介导的胞吞需要网格蛋白与 AP-2 参与衣被组装，与脂筏无关","巨胞饮由受体与配体的特异性结合触发，具有高度选择性","小窝蛋白介导的胞吞依赖脂筏与 caveolin-1，参与信号转导及某些病原体的入胞；巨胞饮经质膜皱褶形成大囊泡，非选择性地摄取大量胞外液体","巨胞饮形成的囊泡直径很小，只摄取水与离子","各类胞吞途径最终都不与溶酶体发生联系，被吞物质只在细胞质中被降解"],"answer":2,"explain":"小窝蛋白（caveolin-1）型胞吞依赖脂筏，参与信号转导与病原体入胞；巨胞饮由质膜皱褶形成大囊泡，非选择性摄取胞外液体，二者均不依赖网格蛋白。","type":"A1","id":"c8-c7834e9e"},{"ch":8,"part":2,"tag":"吞噬作用","stem":"关于吞噬作用的叙述，正确的是","options":["吞噬作用是摄取细胞外液中可溶性小分子的主要方式，不需要肌动蛋白参与","吞噬体形成后直接与高尔基复合体融合完成消化","吞噬作用是被动的、不耗能的过程，体内所有细胞都能进行","吞噬作用与受体无关，被吞颗粒的表面性质不影响吞噬效率","吞噬细胞以肌动蛋白驱动的伪足包裹细菌等大颗粒形成吞噬体，再与溶酶体融合将其消灭，主要由中性粒细胞和巨噬细胞执行"],"answer":4,"explain":"吞噬作用摄取大颗粒，靠受体识别与肌动蛋白驱动的伪足包裹形成吞噬体，再与溶酶体融合消化，主要由中性粒细胞、巨噬细胞完成。","type":"A1","id":"c8-5f2330b5"},{"ch":8,"part":2,"tag":"运输异常疾病","stem":"某些疾病由囊泡运输与细胞器运输障碍引起。下列叙述正确的是","options":["Chediak-Higashi 综合征因编码 SNARE 蛋白的基因突变，使神经递质不能释放","Chediak-Higashi 综合征因 LYST 基因突变，使黑素体、细胞毒颗粒等溶酶体相关细胞器不能正常运输与分泌，表现为白化、免疫缺陷与反复感染","该类疾病只累及神经系统，患者的免疫与色素完全正常","囊泡运输障碍只影响蛋白质的合成，不涉及细胞分泌与摄取","神经递质释放障碍与 SNARE 无关，主要因核糖体功能异常所致"],"answer":1,"explain":"LYST 基因突变使黑素体、细胞毒颗粒等溶酶体相关细胞器不能正常运输与分泌，出现白化与免疫缺陷；破伤风毒素则通过切割 SNARE 致病。","type":"A1","id":"c8-7091cc4b"},{"id":"gc10-02-1","ch":9,"part":2,"tag":"机制","stem":"末梢内吞形成的信号内体被运回胞体，其马达蛋白与移动方向是","options":["驱动蛋白沿微管向正极移动","动力蛋白沿微丝向负极移动","动力蛋白沿微管向负极移动","肌球蛋白沿微管向负极移动","驱动蛋白沿微丝向正极移动"],"answer":2,"explain":"C 对：信号内体要从末梢运回胞体，方向由微管正极指向负极，承担这一逆行运输的马达蛋白是动力蛋白。A 错：驱动蛋白朝微管正极移动，方向与运回胞体相反；B 错：动力蛋白沿微管运动，并不在微丝上运输；D 错：沿微管运输的马达蛋白是驱动蛋白与动力蛋白，肌球蛋白沿微丝运动；E 错：驱动蛋白沿微管而不沿微丝运动，方向也与本例相反。","type":"A1","group":"c10-02","kind":"mechanism","chs":[9,8,24],"vignette":"在运动神经元的轴突中，微管排成长束，正极统一背离胞体、指向末梢；微管结合蛋白 tau 结合在微管壁上，使微管保持稳定。胞体合成的膜蛋白被装入囊泡，沿微管被马达蛋白牵向末梢；末梢内吞形成的信号内体则被反向运回胞体，两者方向相反。取阿尔茨海默病患者的脑组织做免疫荧光：tau 过度磷酸化后从微管上脱落，聚集成神经原纤维缠结；轴突内微管数量减少、排列紊乱，载有膜蛋白的囊泡在轴突中段堆积增多，末梢区域的囊泡明显减少，轴突末梢因得不到新的膜成分而变性。神经元是高度极化的细胞，其轴突与树突在形态和膜成分上都有明显差别。","vignette_title":"情景 2：轴突传送带上的堵塞","gidx":1,"gn":5,"anchor":"末梢内吞形成的信号内体则被反向运回胞体"},{"id":"gc10-02-2","ch":9,"part":2,"tag":"机制","stem":"tau 过度磷酸化后从微管上脱落，对轴突运输最直接的后果是","options":["微管失去稳定而解聚，运输通道被破坏","马达蛋白水解ATP的能力随之下滑","囊泡与靶膜之间的锚定过程发生障碍","肌动蛋白微丝过度聚合，堵塞运输通道","轴突内微管的极性反转，运输方向颠倒"],"answer":0,"explain":"A 对：tau 是神经元中重要的微管结合蛋白，促进微管组装并维持其稳定；它脱落后微管失去稳定而解聚，轴突内的运输通道被破坏。B 错：马达蛋白水解 ATP 的能力并未因 tau 脱落而下降；C 错：锚定障碍会使囊泡堆积在靶膜附近，与微管减少的现象不符；D 错：情景中没有微丝过度聚合的任何证据；E 错：微管的极性由成核时确定，不会因 tau 脱落而反转。","type":"A1","group":"c10-02","kind":"mechanism","chs":[9,8,24],"vignette":"在运动神经元的轴突中，微管排成长束，正极统一背离胞体、指向末梢；微管结合蛋白 tau 结合在微管壁上，使微管保持稳定。胞体合成的膜蛋白被装入囊泡，沿微管被马达蛋白牵向末梢；末梢内吞形成的信号内体则被反向运回胞体，两者方向相反。取阿尔茨海默病患者的脑组织做免疫荧光：tau 过度磷酸化后从微管上脱落，聚集成神经原纤维缠结；轴突内微管数量减少、排列紊乱，载有膜蛋白的囊泡在轴突中段堆积增多，末梢区域的囊泡明显减少，轴突末梢因得不到新的膜成分而变性。神经元是高度极化的细胞，其轴突与树突在形态和膜成分上都有明显差别。","vignette_title":"情景 2：轴突传送带上的堵塞","gidx":2,"gn":5,"anchor":"tau 过度磷酸化后从微管上脱落"},{"id":"gc10-03-4","ch":9,"part":2,"tag":"机制","stem":"破坏膜下肌动蛋白皮质后，膜蛋白的侧向扩散范围明显扩大，这说明","options":["膜蛋白在质膜上的分布由中间纤维直接决定","膜蛋白能够自发聚集形成稳定的膜域结构","膜蛋白在质膜上的分布受膜下微丝网络的限制","膜蛋白的侧向扩散速度由脂筏中的胆固醇决定","肌动蛋白微丝为膜蛋白的跨膜转运直接提供能量"],"answer":2,"explain":"C 对：膜下的肌动蛋白皮质与膜蛋白的胞内段相连，把膜蛋白限制在特定膜域；皮质被破坏后限制解除，膜蛋白的侧向扩散范围随之扩大。A 错：中间纤维主要提供机械支撑，决定膜蛋白分布的是膜下微丝网络；B 错：扩散范围扩大是限制被解除的结果，与自发聚集的方向相反；D 错：脂筏影响膜蛋白的分布偏好，但本例的变化由皮质被破坏引起；E 错：微丝不为跨膜转运提供能量，跨膜转运由 ATP 驱动的泵与载体完成。","type":"A1","group":"c10-03","kind":"mechanism","chs":[4,8,9],"vignette":"培养的 HeLa 细胞中，带负电荷的磷脂酰丝氨酸集中在质膜脂双层的内侧小叶，糖脂与糖蛋白的糖链则伸向细胞外侧。用荧光标记的脂质类似物追踪可见：它在质膜上以侧向扩散为主，30 分钟内发生跨层翻转的分子不足 2%。膜脂主要在滑面内质网合成，随后经囊泡运输与膜接触区被递送到质膜，而胞吞又不断把质膜成分回收进细胞。若用药物破坏膜下的肌动蛋白皮质，原本集中在细胞表面的某些膜蛋白，其侧向扩散范围明显扩大，分布逐渐趋于均匀。把这批细胞置于凋亡诱导条件下 2 小时，细胞皱缩、膜表面出现大量小泡，原本只在内侧小叶的磷脂酰丝氨酸翻到了外侧。","vignette_title":"情景 3：为什么内层的磷脂不会自己翻出来","gidx":4,"gn":5,"anchor":"其侧向扩散范围明显扩大"},{"id":"gc10-04-3","ch":9,"part":2,"tag":"识别","stem":"诺考达唑使微管解聚，其作用机制是","options":["与肌动蛋白单体结合，抑制微丝的聚合","与肌动蛋白结合，使微丝异常稳定而不解聚","与微管蛋白结合，稳定微管并阻止其解聚","抑制中间纤维的装配，使细胞失去机械强度","与微管蛋白结合，抑制微管蛋白的聚合"],"answer":4,"explain":"E 对：诺考达唑与秋水仙素、长春碱类同属抑制微管蛋白聚合的药物，微管因不能聚合而解聚，细胞分裂受阻。A、B 错：作用于肌动蛋白微丝的是细胞松弛素 B 与鬼笔环肽，作用对象不是微管；C 错：稳定微管并阻止其解聚的是紫杉醇，与诺考达唑的方向相反；D 错：中间纤维的装配不受诺考达唑影响，该说法与药物靶点不符。","type":"A1","group":"c10-04","kind":"experiment","chs":[9,8,4],"vignette":"研究生小郑在培养的成纤维细胞中表达一种 GFP 标记的膜受体，它在细胞表面呈点状分布，并不断经囊泡在质膜与内体之间循环。对照组：把细胞表面一片区域的荧光光漂白，荧光先在半分钟内快速恢复约 40%，随后在 5 分钟内缓慢恢复到约 90%。甲组：加 10 μmol/L 诺考达唑 2 小时使微管解聚，半分钟内的快速恢复不受影响，而随后的缓慢恢复明显延迟，同时胞质中载有该受体的囊泡不再由细胞中央向外周定向移动。乙组：加细胞松弛素 B 后，细胞变圆、片状伪足回缩，半分钟内的快速恢复加快到约 60%。丙组：先用叠氮钠加脱氧葡萄糖处理耗竭 ATP，再复温到 37℃ 做光漂白，只有半分钟内的快速恢复出现，缓慢恢复几乎消失。","vignette_title":"情景 4：光漂白以后，荧光是怎么回来的","gidx":3,"gn":6,"anchor":"加 10 μmol/L 诺考达唑 2 小时使微管解聚"},{"id":"gc10-04-4","ch":9,"part":2,"tag":"判读","stem":"乙组细胞变圆、伪足回缩，同时快速恢复加快，这两点共同说明","options":["微管解聚使细胞失去形态支撑，膜蛋白扩散随之加快","微丝解聚既破坏形态支撑，又解除对膜蛋白扩散的限制","膜脂的流动性升高，使细胞变圆并且膜蛋白扩散加快","中间纤维解聚使细胞变圆，膜蛋白扩散随之加快","受体被大量运入内体，细胞变圆且膜蛋白扩散加快"],"answer":1,"explain":"B 对：细胞松弛素 B 与微丝结合并抑制肌动蛋白单体聚合，既使细胞失去形态支撑而变圆、伪足回缩，又解除了膜下微丝网络对膜蛋白侧向扩散的限制。A 错：乙组并未破坏微管，微管解聚是甲组的处理；C 错：膜脂流动性升高不能解释细胞变圆与伪足回缩；D 错：伪足的伸出与回缩由肌动蛋白微丝驱动，与中间纤维无关；E 错：受体运入内体增多会使表面荧光下降，与快速恢复加快不符。","type":"A1","group":"c10-04","kind":"experiment","chs":[9,8,4],"vignette":"研究生小郑在培养的成纤维细胞中表达一种 GFP 标记的膜受体，它在细胞表面呈点状分布，并不断经囊泡在质膜与内体之间循环。对照组：把细胞表面一片区域的荧光光漂白，荧光先在半分钟内快速恢复约 40%，随后在 5 分钟内缓慢恢复到约 90%。甲组：加 10 μmol/L 诺考达唑 2 小时使微管解聚，半分钟内的快速恢复不受影响，而随后的缓慢恢复明显延迟，同时胞质中载有该受体的囊泡不再由细胞中央向外周定向移动。乙组：加细胞松弛素 B 后，细胞变圆、片状伪足回缩，半分钟内的快速恢复加快到约 60%。丙组：先用叠氮钠加脱氧葡萄糖处理耗竭 ATP，再复温到 37℃ 做光漂白，只有半分钟内的快速恢复出现，缓慢恢复几乎消失。","vignette_title":"情景 4：光漂白以后，荧光是怎么回来的","gidx":4,"gn":6,"anchor":"细胞变圆、片状伪足回缩"},{"id":"gc10-04-5","ch":9,"part":2,"tag":"方案","stem":"若要判断乙组中快速恢复加快确由微丝网络的破坏引起，最有判别力的补充实验是","options":["用破坏微管的药物处理细胞后再测光漂白的恢复","降低培养温度到 4℃ 后再测光漂白的恢复","洗去细胞松弛素 B 并复温后再测光漂白的恢复","用抑制蛋白质合成的药物处理后再测恢复","用去除培养液中钙离子的方法处理后再测恢复"],"answer":2,"explain":"C 对：若快速恢复加快确由微丝网络被破坏引起，洗去细胞松弛素 B 后微丝重新聚合，细胞形态与恢复时间应随之回落，这一可逆性对照最有判别力。A 错：破坏微管对应的是甲组结果，与快速相的变化无关；B 错：低温会同时改变膜脂流动性与多种运输过程，缺乏特异性；D 错：抑制蛋白质合成不影响本例中半分钟内出现的快速相；E 错：去除培养液中的钙离子影响钙依赖的黏附等过程，不能检验微丝的作用。","type":"A1","group":"c10-04","kind":"experiment","chs":[9,8,4],"vignette":"研究生小郑在培养的成纤维细胞中表达一种 GFP 标记的膜受体，它在细胞表面呈点状分布，并不断经囊泡在质膜与内体之间循环。对照组：把细胞表面一片区域的荧光光漂白，荧光先在半分钟内快速恢复约 40%，随后在 5 分钟内缓慢恢复到约 90%。甲组：加 10 μmol/L 诺考达唑 2 小时使微管解聚，半分钟内的快速恢复不受影响，而随后的缓慢恢复明显延迟，同时胞质中载有该受体的囊泡不再由细胞中央向外周定向移动。乙组：加细胞松弛素 B 后，细胞变圆、片状伪足回缩，半分钟内的快速恢复加快到约 60%。丙组：先用叠氮钠加脱氧葡萄糖处理耗竭 ATP，再复温到 37℃ 做光漂白，只有半分钟内的快速恢复出现，缓慢恢复几乎消失。","vignette_title":"情景 4：光漂白以后，荧光是怎么回来的","gidx":5,"gn":6,"anchor":"半分钟内的快速恢复加快到约 60%"},{"id":"gc13-04-3","ch":9,"part":2,"tag":"判读","stem":"秋水仙素加低温使约55kDa的蛋白转入上清，而波形蛋白留在沉淀中，这一对比说明","options":["波形蛋白由55kDa的蛋白聚合而成，两者是同一种蛋白","秋水仙素促使中间纤维解聚，而微管保持稳定","两种蛋白都以共价键交联，去垢剂无法使其溶解","55kDa的蛋白是高尔基复合体的膜蛋白，随膜碎片沉降","微管由非共价聚合而可解聚，中间纤维在洗涤后更稳定"],"answer":4,"explain":"E 对：秋水仙素抑制微管蛋白聚合，低温又促进解聚，约 55 kDa 的微管蛋白因而转入上清；波形蛋白属中间纤维，在去垢剂与高盐洗涤后仍留在沉淀中，说明中间纤维更稳定。A 错：波形蛋白与微管蛋白分子量不同，也不是同一种蛋白，二者分属中间纤维与微管。B 错：秋水仙素作用于微管，中间纤维既不解聚也不与其结合。C 错：两种纤维都靠非共价键聚合，去垢剂与高盐使可溶性蛋白溶解，聚合的纤维仍留在沉淀中。D 错：该蛋白随微管解聚进入上清，说明它来自微管而不是高尔基复合体的膜碎片。","type":"A1","group":"c13-04","kind":"experiment","chs":[6,7,9],"vignette":"研究生把大鼠肝组织在等渗蔗糖溶液中匀浆，按600g 10分钟、15000g 20分钟、100000g 60分钟依次离心，得到沉淀P1、P2、P3与上清S。标志酶相对活性：P1中Na⁺-K⁺-ATP酶为92；P2中细胞色素c氧化酶为88、酸性磷酸酶为76；P3中葡萄糖-6-磷酸酶为85、半乳糖基转移酶为70；S中乳酸脱氢酶为95。未加去垢剂时P2的酸性磷酸酶活性只有19，加入0.1%Triton X-100后升到76，反复冻融三次后升至71。把P3经去垢剂与高盐洗涤后仍能检出波形蛋白；在其中先加秋水仙素再置于4℃ 30分钟，一种约55kDa的蛋白转入上清，而波形蛋白仍留在沉淀中。","vignette_title":"情景 4：四个组分里的标志酶","gidx":3,"gn":6,"anchor":"一种约55kDa的蛋白转入上清"},{"id":"gc16-04-2","ch":9,"part":2,"tag":"机制","stem":"乙组细胞胞质中出现的平行排列的肌动蛋白束，其结构与作用特点是","options":["由肌动蛋白与肌球蛋白组装成束，两端经黏着斑锚定于基质","由微管蛋白聚合成的中空管，与马达蛋白共同运输囊泡","由角蛋白等中间纤维组装成束，是三种骨架中最稳定的","由肌动蛋白单体聚合成束，但不与基质或质膜发生连接","由肌动蛋白与肌球蛋白组装成束，主要分布在细胞核内"],"answer":0,"explain":"A 对：平行排列的肌动蛋白束即应力纤维，由肌动蛋白与肌球蛋白组装成束，两端经黏着斑锚定在基质上，是细胞产生并传递张力的结构基础。B 错在微管是中空管，主要承担运输与细胞器定位；C 错在角蛋白等中间纤维虽然稳定，却不形成应力纤维；D 错在应力纤维必须经黏着斑与基质相连才能产生张力；E 错在应力纤维位于胞质中，而不在细胞核内。","type":"A1","group":"c16-04","kind":"experiment","chs":[23,9,25],"vignette":"把同一批成纤维细胞接种到两种基质胶上：甲组胶的弹性模量为0.5 kPa（接近脂肪），乙组为25 kPa（接近肌肉）。两组胶的蛋白质成分完全相同，都含层粘连蛋白与Ⅳ型胶原，培养基也相同。24小时后固定染色：甲组细胞小而圆，黏着斑面积约为乙组的1/5；乙组铺展良好，胞质出现大量平行排列的肌动蛋白束，黏着斑内聚集的整合素明显增多。丙组在乙组基础上加入含RGD序列的可溶性多肽，2小时后细胞变圆、肌动蛋白束解聚。另取乙组细胞接种于可拉伸硅胶膜，施加10%、0.5 Hz的周期性牵张30分钟，胞质钙离子荧光强度升高3.2倍；提前加入机械敏感通道阻断剂后升幅被抑制85%，牵张5分钟后MAPK磷酸化升高4倍。阳性对照加入表皮生长因子5分钟后MAPK磷酸化也升高4倍。","vignette_title":"情景 4：软胶、硬胶和一张被拉伸的膜","gidx":2,"gn":6,"anchor":"大量平行排列的肌动蛋白束"},{"id":"gc2-01-5","ch":9,"part":2,"tag":"机制","stem":"胞质 Ca²⁺ 升高后引起心肌收缩力增强，其直接环节是","options":["肌动蛋白单体聚合成微丝，肌节被动缩短","细肌丝自身缩短，粗肌丝的长度保持不变","肌球蛋白头部水解GTP，牵引细肌丝向M线滑行","原肌球蛋白移位暴露位点，肌球蛋白横桥摆动","中间纤维牵拉肌原纤维，使肌节整体缩短"],"answer":3,"explain":"D 对：胞质 Ca²⁺ 升高后与肌钙蛋白结合，原肌球蛋白移位、暴露肌动蛋白上的结合位点，肌球蛋白头部水解 ATP 引起横桥摆动，粗细肌丝相互滑行而肌节缩短。B 能源是 ATP 而非 GTP；C 滑行时粗细肌丝长度都不变；D 肌节缩短靠滑行而非微丝聚合；E 中间纤维起支撑作用，不产生收缩力。","type":"A1","group":"c2-01","kind":"mechanism","chs":[4,5,9],"vignette":"心力衰竭患者使用的强心药地高辛提取自毛花洋地黄，它的靶点很单一，就是心肌细胞质膜上的钠-钾泵。治疗浓度下，地高辛结合钠-钾泵的α亚基，使这台泵每分解1分子ATP所能转运的离子数目减少，胞质内Na⁺因而逐渐升高。心肌细胞排出Ca²⁺依赖Na⁺-Ca²⁺交换体：它借Na⁺顺浓度梯度内流的势能把Ca²⁺反向运出细胞，本身并不水解ATP。胞内Na⁺升高后，该交换体排出Ca²⁺的效率下降，胞质Ca²⁺随之上升，心肌收缩力增强。剂量过大时泵受抑过重，细胞无法维持正常的离子梯度与体积，可出现细胞肿胀与心律失常。","vignette_title":"情景 1：强心药锁住的那台泵","gidx":5,"gn":6,"anchor":"胞质Ca²⁺随之上升，心肌收缩力增强"},{"id":"gc2-03-3","ch":9,"part":2,"tag":"机制","stem":"突触囊泡沿轴突从胞体运向末梢，所依靠的马达蛋白与移动方向是","options":["驱动蛋白沿微管向负极移动","驱动蛋白沿微管向正极移动","肌球蛋白沿微管向正极移动","动力蛋白沿微丝向正极移动","动力蛋白沿微管向正极移动"],"answer":1,"explain":"B 对：情景指出囊泡由驱动蛋白牵着沿轴突微管向正极运输；微管正极背离胞体，正对应由胞体到末梢的方向。B 动力蛋白朝微管负极运输，方向相反；C 方向写反；D 肌球蛋白沿微丝运动，不在微管上运输；E 动力蛋白同样沿微管运动，微丝上运行的马达蛋白是肌球蛋白。","type":"A1","group":"c2-03","kind":"mechanism","chs":[8,9,4],"vignette":"神经肌肉接头处，运动神经末梢的突触囊泡内装着乙酰胆碱。囊泡在胞体形成后由驱动蛋白牵着沿轴突微管向正极运输，抵达末梢后，囊泡膜上的v-SNARE与突触前膜上的t-SNARE拉成螺旋束，把两膜拉近并驱动融合。这一步属调节型分泌：只有动作电位到达、胞质Ca²⁺升高，囊泡才与突触前膜融合并释放递质，随后膜成分被回收再利用。肉毒毒素由重链与轻链组成，轻链进入末梢后行使锌依赖的蛋白酶活性，把SNARE蛋白切断；囊泡因此停靠在膜旁却不能融合，乙酰胆碱无法释放，患者出现进行性、对称性的弛缓性麻痹。","vignette_title":"情景 3：被抓断的分子拉链","gidx":3,"gn":5,"anchor":"由驱动蛋白牵着沿轴突微管向正极"},{"id":"gc2-04-5","ch":9,"part":2,"tag":"判读","stem":"关于本实验涉及的核内结构与分裂期变化，下列判断正确的是（X 型多选）","options":["分裂期核纤层蛋白磷酸化，核纤层解聚","分裂期核孔复合体保持完整并继续运输","核仁的形成不需要rRNA转录，药物无效","分裂期rRNA转录停止，核仁解体消失","分裂末期核膜与核仁在原有部位重新组装"],"answer":[0,3,4],"explain":"答案 ADE。A、B、D 与情景中的分裂期现象一致：核纤层蛋白磷酸化使核纤层解聚、核膜崩解，rRNA 合成停止使核仁解体，末期去磷酸化后核膜与核仁在原有部位重建。B 错：核膜崩解时核孔复合体随之解体，核质之间的运输中断，这正是分裂期转录与运输受限的原因；C 错：抑制 rRNA 转录后核仁迅速消失，恰恰说明核仁的形成依赖 rRNA 的合成与加工。","type":"X","group":"c2-04","kind":"experiment","chs":[10,6,9],"vignette":"研究生小陈把糖皮质激素受体的编码序列接上GFP后转染培养细胞。血清饥饿后荧光均匀分布在细胞质与细胞核；加入100 nmol/L地塞米松，30分钟后荧光集中到核内，核质比由0.4升至3.1。随后几组处理：把受体核定位信号的碱性氨基酸换成丙氨酸，加激素后荧光仍留在胞质；用叠氮钠加脱氧葡萄糖耗竭ATP，入核同样被阻断；向胞质注入70 kDa的惰性葡聚糖，1小时后仍不见核内聚集；用放线菌素D抑制rRNA转录，2小时后荧光标记的核仁蛋白从核仁内散入核质、核仁消失，光漂白后其荧光半恢复时间仅约20秒。另一组细胞加诺考达唑破坏微管，细胞停滞在分裂期，核膜崩解、核仁消失。","vignette_title":"情景 4：半小时后，绿色荧光聚到了核里","gidx":5,"gn":5,"anchor":"细胞停滞在分裂期，核膜崩解"},{"id":"gc23-01-1","ch":9,"part":2,"tag":"机制","stem":"片状伪足中新长出的这批分支微丝，其极性取向与延长方式是","options":["正极端朝向质膜一侧，单体在该端聚合把膜向前推","负极端朝向质膜一侧，单体在该端聚合把膜向前推","两端都朝向质膜一侧，单体从两端同时聚合延长","正极端朝向细胞核一侧，单体在该端解聚把膜前推","微丝无极性，单体可从任意一端聚合把膜向前推"],"answer":0,"explain":"A 对：迁移前缘的分支微丝以正极端朝向质膜一侧，Arp2/3 复合体在已有微丝侧面成核形成的分支保持同样取向，单体在正极端聚合把质膜向前推。B 错：负极端朝向质膜与该取向相反，负极端聚合速度也慢；C 错：微丝两端极性不同，不会同时朝向同一侧；D 错：正极端朝向细胞核一侧，其聚合方向与细胞迁移方向相反；E 错：微丝具有极性，单体主要从正极端聚合。","type":"A1","group":"c23-01","kind":"mechanism","chs":[9,24,4],"vignette":"人真皮成纤维细胞在培养皿中长满单层后，用移液器尖划出一道宽约 1 mm 的无细胞区。6 小时后边缘细胞向空缺处迁移：前缘伸出扁平的片状伪足，其中的微丝由 Arp2/3 复合体在已有微丝的侧面成核、长出分支，把质膜向前推；前缘的微丝在正极端不断聚合、在负极端不断解聚，其净长度却保持稳定。伪足后方不断形成新的黏着斑，经整合素与基质中的纤连蛋白相连，充当牵引支点；细胞体中央的肌球蛋白 II 沿微丝滑行产生收缩，把细胞体向前拖；尾部的黏着斑解聚，尾部随之回缩。荧光定量显示，1 小时内前缘新增黏着斑约 40 个、尾部消失约 35 个。迁移前沿的质膜在 30 分钟内增加约 20%，这些膜来自胞质中囊泡与质膜的融合。","vignette_title":"情景 1：划痕边缘的四步循环","gidx":1,"gn":5,"anchor":"在已有微丝的侧面成核"},{"id":"gc23-01-2","ch":9,"part":2,"tag":"判读","stem":"前缘微丝持续在正极端聚合，细胞却不会被无限拉长，其原因是","options":["微丝聚合到一定长度后即停止，亚基之间不再发生交换","微丝两端单体聚合速度保持相同，因而其长度保持不变","前缘微丝受到皮层下中间纤维网络的固定而无法延长","微丝在正极端聚合的同时于负极端解聚，表现为踏车行为","微丝靠微管正极端的持续聚合来补偿自身的延长"],"answer":3,"explain":"D 对：微丝具极性，正极端单体亲和力高、聚合快，负极端解聚快；两端净聚合速度相等时长度不变，即踏车行为，此时亚基仍在不断交换。A 错：踏车状态下亚基并未停止交换，只是净长度稳定；B 错：两端聚合速度并不相同，是净速度相等才使长度稳定；C 错：前缘微丝并不与中间纤维网络相连而被固定；E 错：微管的聚合不能补偿微丝的延长，两者是各自独立的骨架系统。","type":"A1","group":"c23-01","kind":"mechanism","chs":[9,24,4],"vignette":"人真皮成纤维细胞在培养皿中长满单层后，用移液器尖划出一道宽约 1 mm 的无细胞区。6 小时后边缘细胞向空缺处迁移：前缘伸出扁平的片状伪足，其中的微丝由 Arp2/3 复合体在已有微丝的侧面成核、长出分支，把质膜向前推；前缘的微丝在正极端不断聚合、在负极端不断解聚，其净长度却保持稳定。伪足后方不断形成新的黏着斑，经整合素与基质中的纤连蛋白相连，充当牵引支点；细胞体中央的肌球蛋白 II 沿微丝滑行产生收缩，把细胞体向前拖；尾部的黏着斑解聚，尾部随之回缩。荧光定量显示，1 小时内前缘新增黏着斑约 40 个、尾部消失约 35 个。迁移前沿的质膜在 30 分钟内增加约 20%，这些膜来自胞质中囊泡与质膜的融合。","vignette_title":"情景 1：划痕边缘的四步循环","gidx":2,"gn":5,"anchor":"在正极端不断聚合、在负极端不断解聚"},{"id":"gc23-01-5","ch":9,"part":2,"tag":"判读","stem":"关于该细胞四步迁移循环中的骨架与黏附变化，下列判断正确的是（X 型多选）","options":["片状伪足的向前推进依赖肌动蛋白在正极端的聚合","细胞体前移的收缩力由肌球蛋白 II 水解 ATP 提供","尾部黏着斑的解聚与前端新黏着斑的形成交替进行","迁移前沿膜面积的增加依赖囊泡与质膜的融合","前缘伪足的伸出由微管在细胞前缘的聚合延长推动"],"answer":[0,1,2,3],"explain":"答案 ABCD。A 对：片状伪足由肌动蛋白在微丝正极端聚合推动，与情景中 Arp2/3 在已有微丝侧面成核形成分支的描述一致；B 对：肌球蛋白 II 是 ATP 酶，水解 ATP 后沿微丝滑行产生收缩力，把细胞体向前拖；C 对：情景给出 1 小时内前缘新增黏着斑约 40 个、尾部消失约 35 个，说明牵引支点处于不断更替之中；D 对：迁移前沿质膜面积的增加来自胞质中囊泡与质膜的融合。E 错：片状伪足由肌动蛋白聚合推动，微管主要参与极性与定向，不在前缘聚合延长形成伪足。","type":"X","group":"c23-01","kind":"mechanism","chs":[9,24,4],"vignette":"人真皮成纤维细胞在培养皿中长满单层后，用移液器尖划出一道宽约 1 mm 的无细胞区。6 小时后边缘细胞向空缺处迁移：前缘伸出扁平的片状伪足，其中的微丝由 Arp2/3 复合体在已有微丝的侧面成核、长出分支，把质膜向前推；前缘的微丝在正极端不断聚合、在负极端不断解聚，其净长度却保持稳定。伪足后方不断形成新的黏着斑，经整合素与基质中的纤连蛋白相连，充当牵引支点；细胞体中央的肌球蛋白 II 沿微丝滑行产生收缩，把细胞体向前拖；尾部的黏着斑解聚，尾部随之回缩。荧光定量显示，1 小时内前缘新增黏着斑约 40 个、尾部消失约 35 个。迁移前沿的质膜在 30 分钟内增加约 20%，这些膜来自胞质中囊泡与质膜的融合。","vignette_title":"情景 1：划痕边缘的四步循环","gidx":5,"gn":5,"anchor":"尾部的黏着斑解聚，尾部随之回缩"},{"id":"gc23-02-1","ch":9,"part":2,"tag":"判读","stem":"据情景判断，分裂沟在细胞表面的位置由什么决定","options":["由细胞核在细胞内的位置与朝向共同决定","由两极之间的纺锤体中央区的位置信号决定","由细胞膜上受体蛋白的聚集位置共同决定","由细胞质中高尔基复合体的空间位置所决定","由皮层下中间纤维网络的分布与走向所决定"],"answer":1,"explain":"B 对：情景给出的信号来源是两极之间的纺锤体中央区，收缩环正是按这一信号在赤道面皮层装配、质膜随之内陷，故分裂沟的位置由该信号决定。A 错：细胞核的位置并不是决定分裂沟位置的信号来源；C 错：情景没有膜上受体蛋白聚集的任何依据，其聚集位置不是分裂沟的定位信号；D 错：高尔基复合体的空间位置不参与胞质分裂沟的定位；E 错：中间纤维提供机械支撑，其分布不决定分裂沟的位置。","type":"A1","group":"c23-02","kind":"mechanism","chs":[9,26,8],"vignette":"同步化培养的 HeLa 细胞进入有丝分裂后期，姐妹染色单体在纺锤体的牵引下移向两极。此时位于两极之间的纺锤体中央区向细胞赤道面的皮层发出位置信号，赤道面下的肌动蛋白微丝与肌球蛋白 II 组装成一条环绕细胞的收缩环；荧光测量显示，环的直径在 10 分钟内由约 20 μm 缩到 8 μm，质膜随之内陷形成分裂沟。若在收缩环装配前用抑制肌球蛋白 II 的药物处理，染色体照常分离、核膜照常重建，分裂沟却不出现，最后形成含两个细胞核的大细胞。另有一组细胞在后期启动前加入蛋白酶体抑制剂，姐妹染色单体停留在中期不能分离，分裂沟也不出现。分裂沟加深到只剩一条细的细胞质桥时，沟底部的质膜仍在与囊泡融合、膜面积增加约 30%，随后桥断开，形成两个独立的子细胞；若用药物阻断囊泡与质膜的融合，分裂沟加深到一半便停住，两个子细胞长期以细胞质桥相连。","vignette_title":"情景 2：把细胞一分为二的三件事","gidx":1,"gn":5,"anchor":"向细胞赤道面的皮层发出位置信号"},{"id":"gc23-02-2","ch":9,"part":2,"tag":"机制","stem":"收缩环直径由约 20 μm 缩到 8 μm，其收缩力的直接来源是","options":["微丝单体不断解聚使微丝缩短，从而把环收紧","微管解聚所释放的能量直接驱动收缩环收紧","中间纤维在环内侧交联成束并产生向内的拉力","细胞渗透压下降使细胞皱缩，从而带动收缩环收紧","肌球蛋白 II 水解 ATP 并沿微丝滑行产生收缩力"],"answer":4,"explain":"E 对：收缩环由肌动蛋白微丝与肌球蛋白 II 构成，肌球蛋白头部是 ATP 酶，水解 ATP 后沿微丝滑行，使微丝之间相互滑行、环径缩小；滑行时微丝本身的长度并不改变。A 错：收缩靠微丝之间相互滑行，微丝自身并不缩短；B 错：微管解聚不释放可用于收缩的能量，抑制微管聚合也不阻止分裂沟形成；C 错：中间纤维无收缩功能，也不构成收缩环；D 错：渗透压改变不能产生收缩环所需的定向收缩力。","type":"A1","group":"c23-02","kind":"mechanism","chs":[9,26,8],"vignette":"同步化培养的 HeLa 细胞进入有丝分裂后期，姐妹染色单体在纺锤体的牵引下移向两极。此时位于两极之间的纺锤体中央区向细胞赤道面的皮层发出位置信号，赤道面下的肌动蛋白微丝与肌球蛋白 II 组装成一条环绕细胞的收缩环；荧光测量显示，环的直径在 10 分钟内由约 20 μm 缩到 8 μm，质膜随之内陷形成分裂沟。若在收缩环装配前用抑制肌球蛋白 II 的药物处理，染色体照常分离、核膜照常重建，分裂沟却不出现，最后形成含两个细胞核的大细胞。另有一组细胞在后期启动前加入蛋白酶体抑制剂，姐妹染色单体停留在中期不能分离，分裂沟也不出现。分裂沟加深到只剩一条细的细胞质桥时，沟底部的质膜仍在与囊泡融合、膜面积增加约 30%，随后桥断开，形成两个独立的子细胞；若用药物阻断囊泡与质膜的融合，分裂沟加深到一半便停住，两个子细胞长期以细胞质桥相连。","vignette_title":"情景 2：把细胞一分为二的三件事","gidx":2,"gn":5,"anchor":"组装成一条环绕细胞的收缩环"},{"id":"gc23-02-5","ch":9,"part":2,"tag":"判读","stem":"关于本组细胞胞质分裂的过程与实验判读，下列判断正确的是（X 型多选）","options":["收缩环由肌动蛋白微丝与肌球蛋白 II 组装而成","染色体向两极的移动依赖肌球蛋白 II 产生的收缩力","核膜的重建需要收缩环提供机械张力才能完成","抑制肌球蛋白 II 后细胞成为含两个细胞核的大细胞","分裂沟的最后断开依赖囊泡与沟底部质膜的融合"],"answer":[0,3,4],"explain":"答案 ADE。A 对：情景给出赤道面下的肌动蛋白微丝与肌球蛋白 II 组装成环绕细胞的收缩环；D 对：抑制肌球蛋白 II 后分裂沟不出现，最后形成含两个细胞核的大细胞；E 对：阻断囊泡与质膜的融合后分裂沟停在半途，说明最后断开依赖囊泡把膜送到沟底并融合。B 错：同一药物处理下染色体照常分离，说明移向两极由微管纺锤体完成；C 错：该条件下核膜照常重建，说明核膜重建并不需要收缩环的张力。","type":"X","group":"c23-02","kind":"mechanism","chs":[9,26,8],"vignette":"同步化培养的 HeLa 细胞进入有丝分裂后期，姐妹染色单体在纺锤体的牵引下移向两极。此时位于两极之间的纺锤体中央区向细胞赤道面的皮层发出位置信号，赤道面下的肌动蛋白微丝与肌球蛋白 II 组装成一条环绕细胞的收缩环；荧光测量显示，环的直径在 10 分钟内由约 20 μm 缩到 8 μm，质膜随之内陷形成分裂沟。若在收缩环装配前用抑制肌球蛋白 II 的药物处理，染色体照常分离、核膜照常重建，分裂沟却不出现，最后形成含两个细胞核的大细胞。另有一组细胞在后期启动前加入蛋白酶体抑制剂，姐妹染色单体停留在中期不能分离，分裂沟也不出现。分裂沟加深到只剩一条细的细胞质桥时，沟底部的质膜仍在与囊泡融合、膜面积增加约 30%，随后桥断开，形成两个独立的子细胞；若用药物阻断囊泡与质膜的融合，分裂沟加深到一半便停住，两个子细胞长期以细胞质桥相连。","vignette_title":"情景 2：把细胞一分为二的三件事","gidx":5,"gn":5,"anchor":"分裂沟加深到只剩一条细的细胞质桥"},{"id":"gc23-03-4","ch":9,"part":2,"tag":"机制","stem":"囊泡沿微管被定向运送到细胞顶端，其方向性的来源是","options":["囊泡自身携带的衣被蛋白决定了它在微管上的移动方向","微管具有极性，马达蛋白沿其只朝正极或负极一个方向移动","细胞质中钙离子的浓度梯度为囊泡提供了移动的方向","中间纤维的极性决定了囊泡在细胞质中的移动方向","微管的正极端在运输过程中可以随时反向，从而改变方向"],"answer":1,"explain":"B 对：微管由 α、β 微管蛋白异二聚体聚合而成，具有极性；驱动蛋白朝正极端、动力蛋白朝负极端运输货物，囊泡随所结合的马达蛋白被送往特定方向。A 错：决定方向的是马达蛋白与微管的极性，不是囊泡的衣被蛋白；C 错：细胞质中不存在能定向牵引囊泡的钙离子浓度梯度；D 错：中间纤维无极性，也不承担囊泡的定向运输；E 错：微管的正负极端由成核时的排列决定，运输途中不会随时反转。","type":"A1","group":"c23-03","kind":"mechanism","chs":[8,24,9],"vignette":"培养的肾上皮细胞在滤膜上长成致密单层后表现出顶底极性，朝向培养液的顶端膜与朝向基底面的膜在蛋白组成上明显不同。该细胞的高尔基复合体位于细胞核上方、靠近顶端膜一侧。免疫荧光显示，Par3、Par6 与 aPKC 组成的复合体集中在顶端膜下方的皮层，侧面与基底面则富集另一类极性蛋白，两类分子的分布界限清晰。新合成的顶端膜蛋白在高尔基复合体反面网络被分选入囊泡，随后沿细胞质中的微管被马达蛋白运往细胞顶端，与顶端质膜融合；追踪 1 小时，约 70% 的新合成顶端膜蛋白出现在顶端膜上，只有 6% 出现在侧面膜。若表达一种激酶失活的 aPKC 突变体，Par 复合体仍能定位到顶端皮层，但顶端与侧面标志蛋白的分布界限变得模糊，新合成顶端膜蛋白出现在顶端膜的比例降到 25%、出现在侧面的比例升到 40%，而囊泡的出芽与沿微管运输的速度都没有明显改变。","vignette_title":"情景 3：顶端膜上的地址是怎么写上的","gidx":4,"gn":5,"anchor":"沿细胞质中的微管被马达蛋白运往细胞顶端"},{"id":"gc23-04-2","ch":9,"part":2,"tag":"判读","stem":"乙组中囊泡仍能被运到细胞外周，前缘却不再伸出片状伪足，这一对比说明","options":["微丝解聚使囊泡失去轨道，故不能到达细胞外周","前缘伪足的伸出由微管在质膜下的聚合所推动","长距离定向运输依赖微管，而前缘的局部伸出依赖微丝","囊泡到达细胞外周后即自行与质膜融合，无需微丝","微丝解聚使细胞的整体形态与质膜面积同步增大"],"answer":2,"explain":"C 对：乙组中囊泡的定向运输不受影响，而前缘的片状伪足与膜面积增加消失，说明长距离定向运输由微管承担，前缘的局部骨架装配依赖微丝。A 错：乙组中囊泡仍被运到细胞外周，说明运输并未受微丝解聚影响；B 错：片状伪足由肌动蛋白聚合推动，微管不参与其形成；D 错：情景显示乙组前缘质膜面积只增加约 4%，说明融合并未照常发生；E 错：微丝解聚不会使细胞形态与质膜面积同步增大，与观察结果相反。","type":"A1","group":"c23-04","kind":"experiment","chs":[8,9,24],"vignette":"研究生的课题是追踪迁移细胞前缘膜成分的来源。他在成纤维细胞中表达一种光转化荧光蛋白，用 405 nm 光照射细胞中央高尔基体所在的区域，把这批蛋白的荧光由绿色转为红色，再用活细胞成像连续追踪红色囊泡 30 分钟。对照组：约 65% 的红色囊泡沿固定方向移到前缘并与质膜融合，前缘质膜面积增加约 20%。甲组：加 10 μmol/L 诺考达唑 2 小时使微管解聚，红色囊泡改为在胞质中随机扩散，到达前缘的比例降到 8%。乙组：加细胞松弛素 B 使微丝解聚，红色囊泡仍被运到细胞外周、方向与速度接近对照，但前缘不再伸出片状伪足，前缘质膜面积只增加约 4%，囊泡在皮层下方堆积。丙组：加抑制肌球蛋白 II 的药物，伪足伸出与囊泡融合都接近对照，但细胞体不再前移、尾部不能回缩。另在细胞侧面用蓝光局部照射，使一种光控蛋白在该处活化并引起肌动蛋白聚合，5 分钟内该侧伸出新的片状伪足，原前缘在 20 分钟内回缩，细胞的迁移方向随之改变。","vignette_title":"情景 4：绿变红之后，囊泡去了哪里","gidx":2,"gn":6,"anchor":"但前缘不再伸出片状伪足"},{"id":"gc23-04-3","ch":9,"part":2,"tag":"机制","stem":"丙组中伪足伸出与囊泡融合都接近对照，细胞体却不前移，这一结果说明","options":["肌球蛋白 II 参与前缘伪足的伸出与囊泡的融合","肌球蛋白 II 的收缩是囊泡沿微管运输的动力来源","细胞体前移依靠黏着斑与基质之间的相对滑动","细胞体前移依靠微管在细胞后部的定向牵拉来完成","细胞体前移依靠肌球蛋白 II 水解 ATP 沿微丝滑行"],"answer":4,"explain":"E 对：肌球蛋白 II 被抑制后前缘伪足伸出与囊泡融合都接近对照，只有细胞体前移与尾部回缩消失，说明这一步由肌球蛋白 II 水解 ATP、沿微丝滑行所产生的收缩力驱动。A 错：情景中伪足伸出与囊泡融合均接近对照，说明它们并不依赖肌球蛋白 II；B 错：囊泡沿微管的运输由驱动蛋白与动力蛋白完成；C 错：黏着斑是牵引支点，其与基质之间不发生相对滑动来拖拽细胞体；D 错：微管主要参与极性与定向，不负责细胞体后部的牵拉。","type":"A1","group":"c23-04","kind":"experiment","chs":[8,9,24],"vignette":"研究生的课题是追踪迁移细胞前缘膜成分的来源。他在成纤维细胞中表达一种光转化荧光蛋白，用 405 nm 光照射细胞中央高尔基体所在的区域，把这批蛋白的荧光由绿色转为红色，再用活细胞成像连续追踪红色囊泡 30 分钟。对照组：约 65% 的红色囊泡沿固定方向移到前缘并与质膜融合，前缘质膜面积增加约 20%。甲组：加 10 μmol/L 诺考达唑 2 小时使微管解聚，红色囊泡改为在胞质中随机扩散，到达前缘的比例降到 8%。乙组：加细胞松弛素 B 使微丝解聚，红色囊泡仍被运到细胞外周、方向与速度接近对照，但前缘不再伸出片状伪足，前缘质膜面积只增加约 4%，囊泡在皮层下方堆积。丙组：加抑制肌球蛋白 II 的药物，伪足伸出与囊泡融合都接近对照，但细胞体不再前移、尾部不能回缩。另在细胞侧面用蓝光局部照射，使一种光控蛋白在该处活化并引起肌动蛋白聚合，5 分钟内该侧伸出新的片状伪足，原前缘在 20 分钟内回缩，细胞的迁移方向随之改变。","vignette_title":"情景 4：绿变红之后，囊泡去了哪里","gidx":3,"gn":6,"anchor":"细胞体不再前移、尾部不能回缩"},{"id":"gc23-04-6","ch":9,"part":2,"tag":"判读","stem":"关于本组实验的药物处理、方法选择与结果判读，下列判断正确的是（X 型多选）","options":["诺考达唑抑制微管蛋白聚合，使囊泡失去定向运输的轨道","细胞松弛素 B 抑制肌动蛋白单体聚合，使微丝解聚","丙组结果说明肌球蛋白 II 参与囊泡与质膜的融合过程","光转化可用于追踪一批已存在的分子随后的运动与去向","光遗传实验说明局部信号能够重塑细胞的迁移方向"],"answer":[0,1,3,4],"explain":"答案 ABDE。A 对：诺考达唑与秋水仙素、长春碱类同属抑制微管蛋白聚合的药物，微管解聚后囊泡失去轨道而随机扩散；B 对：细胞松弛素 B 与肌动蛋白单体结合并抑制其聚合，微丝解聚、前缘无法伸出片状伪足；D 对：光转化把已有荧光分子的颜色改变，可用于追踪这批分子随后的运动与终点；E 对：在侧面局部活化光控蛋白后出现新的前缘，说明局部信号能重塑细胞的迁移方向。C 错：丙组中囊泡融合接近对照，只有细胞体前移与尾部回缩消失，说明肌球蛋白 II 承担的是收缩步骤而非膜融合。","type":"X","group":"c23-04","kind":"experiment","chs":[8,9,24],"vignette":"研究生的课题是追踪迁移细胞前缘膜成分的来源。他在成纤维细胞中表达一种光转化荧光蛋白，用 405 nm 光照射细胞中央高尔基体所在的区域，把这批蛋白的荧光由绿色转为红色，再用活细胞成像连续追踪红色囊泡 30 分钟。对照组：约 65% 的红色囊泡沿固定方向移到前缘并与质膜融合，前缘质膜面积增加约 20%。甲组：加 10 μmol/L 诺考达唑 2 小时使微管解聚，红色囊泡改为在胞质中随机扩散，到达前缘的比例降到 8%。乙组：加细胞松弛素 B 使微丝解聚，红色囊泡仍被运到细胞外周、方向与速度接近对照，但前缘不再伸出片状伪足，前缘质膜面积只增加约 4%，囊泡在皮层下方堆积。丙组：加抑制肌球蛋白 II 的药物，伪足伸出与囊泡融合都接近对照，但细胞体不再前移、尾部不能回缩。另在细胞侧面用蓝光局部照射，使一种光控蛋白在该处活化并引起肌动蛋白聚合，5 分钟内该侧伸出新的片状伪足，原前缘在 20 分钟内回缩，细胞的迁移方向随之改变。","vignette_title":"情景 4：绿变红之后，囊泡去了哪里","gidx":6,"gn":6,"anchor":"在该处活化并引起肌动蛋白聚合"},{"id":"gc5-01-4","ch":9,"part":2,"tag":"机制","stem":"B株细胞能够在基质上铺展并向前移动，其细胞骨架基础是","options":["中间纤维解聚重组，牵拉细胞体整体向前滑动","黏着斑一旦形成即永久稳定，细胞迁移靠其水解","收缩环由肌动蛋白微丝组成，推动细胞向前移动","前缘肌动蛋白聚合成片状伪足，黏着斑提供牵引支点","前缘微管聚合延长，形成片状伪足并推动细胞前移"],"answer":3,"explain":"D对：迁移细胞前缘由肌动蛋白聚合成片状伪足与丝状伪足，黏着斑把细胞连接在基质上并提供牵引支点，其解聚与重组使细胞体向前移动。E错：片状伪足由肌动蛋白聚合推动，微管主要参与极性与定向。A错：中间纤维不承担细胞整体前移的牵拉作用。C错：收缩环参与胞质分裂，不是迁移的动力来源。B错：黏着斑处于不断装配与解聚之中，其水解ATP也不能直接推动细胞体。","type":"A1","group":"c5-01","kind":"mechanism","chs":[23,24,9],"vignette":"研究者把两株人源上皮肿瘤细胞接种到铺有基底膜提取物的培养皿中：A株取自原位癌，B株取自同一患者的淋巴结转移灶。24小时后，A株在缺乏基质附着的区域大量变圆、核浓缩，逐渐脱落死亡；B株却继续铺展良好，培养基中可检出其分泌的基质金属蛋白酶。检测显示，A株细胞膜上的E-钙黏素表达正常，而B株的E-钙黏素几乎检测不到，其整合素与纤连蛋白的结合反而增强。加入基质金属蛋白酶抑制剂后，B株穿过基底膜的比例从62%降到9%。","vignette_title":"情景 1：一株脱落，一株钻了过去","gidx":4,"gn":5,"anchor":"B株却继续铺展良好"},{"ch":9,"part":2,"tag":"微管","stem":"关于微管（microtubule）的结构与组装，叙述正确的是？","options":["微管的组装无极性，两端均可同时以相同速度延长","秋水仙素（colchicine）通过稳定微管、抑制其解聚而阻断细胞分裂","微管由α、β微管蛋白异二聚体聚合而成，二聚体首尾相接形成原纤维，一般由13条原纤维围成中空管壁","微管的主要功能是赋予细胞抗张强度，其抗张能力在三种细胞骨架中最强","微管的踏车行为（treadmilling）由肌球蛋白沿微管移动实现"],"answer":2,"explain":"微管由α/β微管蛋白异二聚体聚合、具极性，13条原纤维围成中空管壁；秋水仙素抑制微管聚合，抗张强度主要由中间纤维提供。","type":"A1","id":"c9-d93e30ae"},{"ch":9,"part":2,"tag":"马达蛋白","stem":"关于细胞内马达蛋白（motor protein）的叙述，正确的是？","options":["驱动蛋白（kinesin）沿微管向负极移动，动力蛋白（dynein）向正极移动","肌球蛋白（myosin）沿微管向正极移动，参与膜泡运输","三类马达蛋白均以GTP水解为能源","马达蛋白只能运输膜性细胞器，不能运输mRNA等非膜性物质","驱动蛋白一般朝微管正极运输货物（如由细胞中央向细胞外周），动力蛋白则朝负极运输"],"answer":4,"explain":"驱动蛋白朝微管正极、动力蛋白朝负极运输货物，二者均为ATP酶；肌球蛋白沿微丝运动，马达蛋白也可运输mRNA等非膜性物质。","type":"A1","id":"c9-5dcda596"},{"ch":9,"part":2,"tag":"抗肿瘤药","stem":"下列作用于细胞骨架的抗肿瘤药物与其作用机制，对应正确的是？","options":["紫杉醇（taxol）结合并稳定微管、抑制其解聚，使细胞分裂阻滞于有丝分裂期","秋水仙素与微管蛋白结合并促进微管聚合，稳定纺锤体","长春新碱（vincristine）稳定微管，阻止微管解聚","细胞松弛素B（cytochalasin B）与微丝结合并使之稳定，使细胞不能收缩","鬼笔环肽（phalloidin）与微管蛋白结合，抑制纺锤体的形成"],"answer":0,"explain":"紫杉醇稳定微管，秋水仙素与长春碱类则抑制微管聚合；细胞松弛素B与鬼笔环肽作用于微丝（前者抑制聚合、后者稳定微丝）。","type":"A1","id":"c9-713b9537"},{"ch":9,"part":2,"tag":"微丝","stem":"关于微丝（microfilament）的叙述，正确的是？","options":["微丝由α、β微管蛋白异二聚体聚合而成，直径约7nm","微丝无极性，肌动蛋白单体可从任意一端加入","微丝是构成纺锤体和中心粒的主要成分","微丝由肌动蛋白（actin）单体聚合为F-actin，具极性，参与胞质分裂收缩环的形成","微丝是三种细胞骨架中最稳定的成分，不参与细胞运动"],"answer":3,"explain":"微丝由肌动蛋白单体聚合、具极性，参与收缩环与细胞运动；纺锤体、中心粒由微管构成，微丝的稳定性弱于中间纤维。","type":"A1","id":"c9-33a345fe"},{"ch":9,"part":2,"tag":"中间纤维","stem":"关于中间纤维（intermediate filament）的叙述，正确的是？","options":["中间纤维由α、β微管蛋白聚合而成，直径介于微管与微丝之间","中间纤维由多种组织细胞类型特异的蛋白组成，无极性、不结合核苷酸，是三种细胞骨架中最稳定的","中间纤维具有极性，可表现踏车行为","中间纤维的装配依赖GTP水解，其解聚与磷酸化修饰无关","中间纤维在有丝分裂期形成收缩环，完成胞质分裂"],"answer":1,"explain":"中间纤维由角蛋白、波形蛋白等组织特异蛋白构成，无极性、不结合核苷酸、最稳定；收缩环由微丝构成，踏车行为见于微管和微丝。","type":"A1","id":"c9-b1d8cb96"},{"ch":9,"part":2,"tag":"核纤层","stem":"核纤层（nuclear lamina）在有丝分裂中的作用，正确的是？","options":["核纤层由微管构成，分裂期牵引染色体移向两极","核纤层属细胞质骨架，与核膜的稳定性无关","核纤层由核纤层蛋白（lamin，属中间纤维）构成，分裂前期其磷酸化导致核纤层解聚、核膜崩解，分裂末期去磷酸化后重新组装","核纤层的解聚依赖去磷酸化，其重新组装依赖磷酸化","核纤层在整个细胞周期中始终保持完整，仅在分裂末期重新组装"],"answer":2,"explain":"核纤层是内核膜下的lamin中间纤维网络，分裂期磷酸化解聚致核膜崩解、末期去磷酸化参与核膜重建；它属细胞核骨架而非细胞质骨架。","type":"A1","id":"c9-c468c58e"},{"ch":9,"part":2,"tag":"骨架与疾病","stem":"关于细胞骨架异常与疾病的关系，叙述正确的是？","options":["原发性纤毛运动障碍（Kartagener综合征）由微丝装配异常引起","遗传性球形红细胞增多症由微管蛋白基因突变引起","Duchenne型肌营养不良由驱动蛋白基因突变引起，与微丝无关","中间纤维异常只影响细胞分裂，一般不引起疾病","Duchenne型肌营养不良与抗肌萎缩蛋白（dystrophin）缺陷有关，该蛋白连接微丝与细胞膜，维持肌细胞膜稳定"],"answer":4,"explain":"dystrophin连接微丝与肌膜，缺陷致肌膜不稳定；Kartagener综合征为纤毛动力蛋白臂缺陷，球形红细胞增多症为血影蛋白/锚蛋白异常。","type":"A1","id":"c9-57c1dd2b"},{"ch":9,"part":2,"tag":"微管与细胞器","stem":"用内质网特异性抗体标记培养细胞，间期细胞胞质中内质网分布均匀有序，而分裂期这种有序分布消失。最合理的解释是？","options":["内质网的有序分布依赖微管网络，分裂期微管解聚重排为纺锤体，故原有分布消失","内质网的有序分布依赖中间纤维，分裂期中间纤维解聚所致","内质网分布随细胞周期改变属随机现象，与细胞骨架无关","内质网在分裂期被核膜包裹进入子细胞核内，故胞质中分布消失","内质网的有序分布依赖肌动蛋白收缩环的牵拉，分裂期收缩环断裂所致"],"answer":0,"explain":"内质网等细胞器的空间分布依赖微管，破坏微管可致内质网塌陷；中间纤维并非决定内质网分布的主要骨架，收缩环的变化也不改变内质网的分布方式。","type":"A1","id":"c9-4cc8042d"},{"ch":9,"part":2,"tag":"中心体与微管组织中心","stem":"关于中心体（centrosome）与微管组织中心（MTOC）的叙述，正确的是？","options":["中心粒由9组双联微管构成，其结构与纤毛轴丝的中央对微管完全相同","中心体中的γ-微管蛋白是构成微管管壁的主要成分，因而决定微管的直径","中心体由一对相互垂直的中心粒与中心粒周围物质组成，γ-微管蛋白参与微管的成核，成核后微管的正极背离中心体向外延伸","中心体成核的微管以负极向外、正极朝向中心体的方式排列","中心体只出现于细胞分裂期，间期细胞中不存在微管组织中心"],"answer":2,"explain":"中心粒为9组三联体微管构成的圆筒，是微管组织中心的核心；γ-微管蛋白负责成核，成核后微管正极背离中心体向外生长，故微管极性由中心体决定。","type":"A1","id":"c9-1724fc3f"},{"ch":9,"part":2,"tag":"微管结合蛋白与神经退行性变","stem":"阿尔茨海默病患者神经元内出现由过度磷酸化tau蛋白聚集形成的神经原纤维缠结。据此推断，tau蛋白的生理功能最可能是？","options":["作为马达蛋白驱动轴突内的逆向膜泡运输","催化微管蛋白二聚体的GTP水解，促进微管解聚","与角蛋白共同组装成中间纤维，维持轴突的机械强度","属微管结合蛋白，结合并稳定神经元轴突中的微管，促进微管组装、维持微管稳定性","是构成髓鞘的主要蛋白，参与神经冲动的跳跃式传导"],"answer":3,"explain":"tau是神经元中重要的微管结合蛋白，可促进微管组装并稳定微管；其过度磷酸化后从微管上脱落、聚集成缠结，使微管解聚、轴突运输障碍。","type":"A1","id":"c9-ef241ca9"},{"ch":9,"part":2,"tag":"纤毛与鞭毛","stem":"关于纤毛与鞭毛轴丝（axoneme）结构与摆动的叙述，正确的是？","options":["轴丝由9组双联微管环绕1对中央微管构成（即“9+2”结构），其外侧的动力蛋白臂水解ATP驱动相邻双联微管相互滑动，使纤毛摆动","轴丝由9组三联体微管构成，与中心粒的结构完全相同","轴丝的中央微管为一对双联微管，其滑动由驱动蛋白（kinesin）驱动","纤毛摆动所需的能量来自微管蛋白二聚体所结合的GTP水解","基体呈“9+2”结构，其微管直接延伸形成轴丝"],"answer":0,"explain":"纤毛轴丝为“9+2”结构（9组双联微管＋中央1对单微管），由轴丝动力蛋白臂水解ATP驱动双联微管滑动；基体为“9+0”的三联体结构。","type":"A1","id":"c9-d17a02eb"},{"ch":9,"part":2,"tag":"微丝结合蛋白","stem":"关于微丝结合蛋白（actin-binding protein）作用的叙述，正确的是？","options":["加帽蛋白结合于微丝负极端，促进肌动蛋白单体继续在该端聚合而延长微丝","Arp2/3复合体在已有微丝侧面成核形成分支网络；加帽蛋白封闭微丝末端，切断蛋白（如cofilin）割断微丝，二者共同调控微丝的组装与解聚","交联蛋白如α-辅肌动蛋白通过水解ATP将微丝交联成束","切断蛋白（cofilin）通过稳定微丝结构，使细胞不能运动","微丝结合蛋白只能改变微丝的长度，不能影响细胞形态与运动"],"answer":1,"explain":"Arp2/3在微丝侧面成核形成分支，加帽蛋白封闭末端、cofilin割断微丝促解聚，交联蛋白则把微丝连成束或网，共同决定细胞形态与运动。","type":"A1","id":"c9-e781f746"},{"ch":9,"part":2,"tag":"肌球蛋白与肌肉收缩","stem":"关于骨骼肌收缩时肌球蛋白（myosin）与肌动蛋白相互作用的叙述，正确的是？","options":["肌球蛋白头部结合微管，沿微管向负极移动，从而引起肌节缩短","肌肉收缩时细肌丝（肌动蛋白丝）本身缩短，而粗肌丝长度不变","肌浆中Ca²⁺浓度降低时，原肌球蛋白移位并暴露肌动蛋白上的结合位点，收缩加强","肌肉收缩的能量直接来自肌动蛋白单体的GTP水解","肌球蛋白头部具有ATP酶活性，与肌动蛋白结合后水解ATP引起横桥摆动，使粗、细肌丝相互滑行而肌节缩短"],"answer":4,"explain":"肌球蛋白头部为ATP酶，水解ATP引起横桥摆动，牵引细肌丝沿粗肌丝滑行；滑行时粗、细肌丝长度均不变，Ca²⁺升高使原肌球蛋白移位、位点暴露。","type":"A1","id":"c9-9f2fc885"},{"ch":9,"part":2,"tag":"细胞骨架与细胞运动","stem":"关于细胞迁移（cell migration）中细胞骨架作用的叙述，正确的是？","options":["迁移前缘的片状伪足与丝状伪足由肌动蛋白聚合推动形成，黏着斑将细胞与基质连接并作为牵引支点，其解聚与重组使细胞体向前移动","片状伪足的形成依赖微管在细胞前缘的聚合延长","细胞迁移的方向由中间纤维的重排决定，与肌动蛋白无关","黏着斑一旦形成即永久稳定，细胞迁移依靠其水解ATP直接推动","细胞运动时前缘伸出伪足、后部收缩前移，其过程与肌动蛋白的聚合、解聚无关"],"answer":0,"explain":"迁移细胞前缘由肌动蛋白聚合成片状、丝状伪足，新形成的黏着斑提供牵引支点，尾部黏着斑解聚、肌动蛋白收缩使细胞体前移；微管参与极性与定向。","type":"A1","id":"c9-6eb71295"},{"ch":9,"part":2,"tag":"中间纤维的种类与组织特异性","stem":"关于中间纤维（intermediate filament）组织特异性表达的叙述，正确的是？","options":["上皮细胞的中间纤维是波形蛋白，间充质细胞的中间纤维是角蛋白","上皮细胞主要表达角蛋白，肌肉细胞表达结蛋白，星形胶质细胞表达GFAP，神经元表达神经丝蛋白","各种细胞的中间纤维组成相同，故不能用于肿瘤组织来源的鉴别","神经丝蛋白表达于肝细胞，结蛋白表达于上皮细胞","中间纤维的种类由细胞外基质成分决定，与细胞类型无关"],"answer":1,"explain":"中间纤维具严格的组织特异性：上皮为角蛋白、肌肉为结蛋白、星形胶质细胞为GFAP、神经元为神经丝蛋白、间充质细胞为波形蛋白，故可用于肿瘤来源鉴别。","type":"A1","id":"c9-4469ca2f"},{"ch":9,"part":2,"tag":"微丝踏车行为","stem":"关于微丝组装动力学与踏车行为（treadmilling）的叙述，正确的是？","options":["肌动蛋白单体在微丝正、负两端的聚合与解聚速度始终相同","微丝两端都能以相同速度延长，说明微丝没有极性","ATP-肌动蛋白与ADP-肌动蛋白聚合到微丝正极端的亲和力完全相同","微丝正极端单体净聚合、负极端单体净解聚，当两端净聚合速度相等时微丝长度不变，表现为踏车；ATP-肌动蛋白更易聚合到正极端","出现踏车行为说明微丝处于静止状态，其亚基不再发生交换"],"answer":3,"explain":"微丝具极性：正极端单体亲和力高、聚合快，负极端解聚快；两端净速度相等时长度不变，即踏车，此时亚基仍在不断交换、属动态平衡。","type":"A1","id":"c9-11d4b9f0"},{"id":"gc1-03-4","ch":10,"part":2,"tag":"机制","stem":"核小体中组蛋白富含赖氨酸和精氨酸，其意义是","options":["这些氨基酸与 DNA 形成共价键，把 DNA 固定在核内","这些氨基酸呈疏水性，便于插入双螺旋的碱基之间","这些氨基酸能催化磷酸二酯键水解，使 DNA 弯曲","这些碱性氨基酸带负电，便于与 DNA 的碱基直接结合","这些碱性氨基酸带正电，便于与 DNA 的磷酸骨架结合"],"answer":4,"explain":"E 对：赖氨酸与精氨酸的侧链带正电荷，而 DNA 的磷酸骨架带负电荷，两者靠静电作用结合，DNA 才能缠绕在组蛋白八聚体上形成核小体。B 电荷方向说反，碱性氨基酸带正电；C 组蛋白与 DNA 之间是静电结合，不是疏水插入碱基之间；D 组蛋白没有水解磷酸二酯键的催化功能；E 这种结合是非共价的、可逆的，并非共价固定。","type":"A1","group":"c1-03","kind":"mechanism","chs":[2,10],"vignette":"两种细菌的 DNA 分别放入石英比色皿，用 260 nm 的光监测吸光度并缓慢升温。样品甲的 G+C 含量为 68%，样品乙的 G+C 含量为 32%，两者分子长度相近。常温下两种溶液的吸光度都较低；升到某一温度后吸光度迅速升高约 30%，甲出现这一变化对应的温度为 92℃，乙为 78℃。若把加热后的溶液缓慢冷却，吸光度基本回落；若迅速投入冰浴，吸光度却停在原来的高位。在真核细胞核内，DNA 并不裸露：每约 147 个碱基对缠绕组蛋白八聚体形成核小体，组蛋白富含赖氨酸和精氨酸。","vignette_title":"情景 3：为什么甲样品要热到 92℃","gidx":4,"gn":5,"anchor":"组蛋白富含赖氨酸和精氨酸"},{"id":"gc12-02-5","ch":10,"part":2,"tag":"判读","stem":"关于 DNA 高级结构与蛋白质对它的识别，下列判断正确的是（X 型多选）","options":["同一种质粒中，超螺旋构象在琼脂糖凝胶中迁移快于开环构象","该序列若被包装成更紧密的异染色质，阻遏蛋白的结合会减弱","组蛋白的乙酰化使染色质构象疏松，有利于蛋白与 DNA 结合","蛋白质识别 DNA 序列时，大沟与小沟提供的信息没有差别","常染色质与异染色质的 DNA 碱基序列并不相同"],"answer":[0,1,2],"explain":"答案 ABC。A 对：超螺旋构象最为致密，在琼脂糖凝胶中迁移快于同分子量的开环构象。B 对：包装紧密的异染色质把序列遮蔽起来，阻遏蛋白难以接近结合位点。C 对：组蛋白乙酰化使染色质构象疏松，蛋白与 DNA 的结合因而更容易发生。D 错：大沟与小沟中碱基对边缘暴露的化学基团不同，提供的信息并不相同。E 错：常染色质与异染色质的碱基序列相同，差别在于包装与修饰状态。","type":"X","group":"c12-02","kind":"mechanism","chs":[2,10],"vignette":"某细菌的阻遏蛋白 R 识别启动子上游一段 21 个碱基对、富含 A-T 的回文序列，结合后关闭下游基因。足迹实验显示，结合使该区段不再被核酸酶切断；把其中第 5 位的 A-T 碱基对换成 G-C 对，结合随之消失，下游基因的转录提高约 8 倍；换用另一段长度相同、碱基组成也相同但顺序打乱的片段，阻遏蛋白 R 同样不结合。电镜观察到结合后该段 DNA 出现约 90 度的弯折。把含该序列的同一个质粒分别做成松弛型与负超螺旋型，结合实验测得的结合量后者是前者的 5 倍。该基因平时被包装得较为紧密，只在特定条件下才被打开。","vignette_title":"情景 2：21 个碱基对的回文序列","gidx":5,"gn":5,"anchor":"该基因平时被包装得较为紧密"},{"id":"gc15-01-3","ch":10,"part":2,"tag":"机制","stem":"情景中间期核内那个紧贴核膜内缘、深染的小体，其本质是","options":["核仁组织区转录rRNA后残留的致密纤维组分","由核纤层蛋白异常聚集形成的核内包涵体","着丝粒区高度重复的卫星DNA构成的组成型异染色质","一条多余的常染色体，来自减数分裂时的不分离","一条失活的X染色体，属于兼性异染色质"],"answer":4,"explain":"E 对：女性两条X染色体中的一条在间期高度螺旋化而失活、紧贴核膜内缘形成巴氏小体，它属于兼性异染色质，由Xist等非编码RNA介导，实现雌雄个体间X连锁基因的剂量补偿。A 错：致密纤维组分位于核仁内部，不是贴核膜的深染小体。B 错：核纤层蛋白异常聚集见于早老症等核纤层蛋白病，与本例所见无关。C 错：着丝粒区的组成型异染色质位于染色体着丝粒处，不会出现在间期核膜内缘。D 错：本例核型为46,XX，没有多余的常染色体，该小体也不是整条染色体。","type":"A1","group":"c15-01","kind":"mechanism","chs":[17,10],"vignette":"一名3岁女童因生长迟缓与特殊面容就诊。取外周血接种于含植物血凝素的培养基，72小时后加秋水仙素处理，经低渗、固定后滴片，再用胰蛋白酶消化并染色，分析20个中期分裂象：常规G显带核型为46,XX，在400条带水平未见结构异常。结合临床表现，改用22q11区段特异性探针做荧光原位杂交：正常对照细胞的间期核中，每个核可见2个荧光信号，而本例的100个核中有92个只见到1个信号。同一张标本的间期核内，可见一个紧贴核膜内缘、深染的小体，核仁染色明显且体积增大。","vignette_title":"情景 1：显带看不见的那一段缺失","gidx":3,"gn":5,"anchor":"紧贴核膜内缘、深染的小体"},{"id":"gc15-01-4","ch":10,"part":2,"tag":"识别","stem":"情景中核仁染色明显且体积增大，与该细胞核仁形成直接相关的结构是","options":["22对常染色体的短臂末端，含成串的rRNA基因","5对近端着丝粒染色体短臂的次级缢痕，含rRNA基因","核被膜上核孔集中分布的区域，核仁由此穿出核膜","核仁是单位膜包裹的细胞器，其内合成核糖体蛋白","核纤层与核基质构成的核内网架，为核仁提供锚定"],"answer":1,"explain":"B 对：核仁组织区位于5对近端着丝粒染色体短臂的次级缢痕处，该处含成串的rRNA基因，间期在它的周围形成核仁，核仁明显而体积增大提示rRNA的合成与加工活跃。A 错：rRNA基因并不分布在22对常染色体的短臂末端，该处是端粒所在。C 错：核仁是没有膜包裹的结构，也不经核孔穿出核膜。D 错：核仁无单位膜，核糖体蛋白在细胞质中合成后运入核仁参与组装。E 错：核纤层与核基质构成核骨架并为染色质提供锚定，不是核仁形成的部位。","type":"A1","group":"c15-01","kind":"mechanism","chs":[17,10],"vignette":"一名3岁女童因生长迟缓与特殊面容就诊。取外周血接种于含植物血凝素的培养基，72小时后加秋水仙素处理，经低渗、固定后滴片，再用胰蛋白酶消化并染色，分析20个中期分裂象：常规G显带核型为46,XX，在400条带水平未见结构异常。结合临床表现，改用22q11区段特异性探针做荧光原位杂交：正常对照细胞的间期核中，每个核可见2个荧光信号，而本例的100个核中有92个只见到1个信号。同一张标本的间期核内，可见一个紧贴核膜内缘、深染的小体，核仁染色明显且体积增大。","vignette_title":"情景 1：显带看不见的那一段缺失","gidx":4,"gn":5,"anchor":"核仁染色明显且体积增大"},{"id":"gc17-01-1","ch":10,"part":2,"tag":"识别","stem":"关于该基因座中核小体核心颗粒的组成，下列叙述正确的是","options":["核心颗粒由 H3、H4 各两分子组成四聚体，盘绕约 146 bp 的 DNA","核心颗粒由 H2A、H2B、H3、H4 各两分子组成八聚体，盘绕约 146 bp","核心颗粒由 H2A、H2B、H3、H4 各一分子组成，盘绕约 146 bp 的 DNA","核心颗粒由 H1、H2A、H2B、H3、H4 各一分子组成，盘绕约 146 bp","核心颗粒由 H2A、H2B、H3、H4 各两分子组成八聚体，盘绕约 200 bp"],"answer":1,"explain":"B 对：核小体核心颗粒由 H2A、H2B、H3、H4 各两分子组成八聚体，盘绕约 146 bp 的 DNA。A 少了 H2A 与 H2B，只剩 H3 与 H4 组成的四聚体；C 把四种组蛋白各写成一分子，凑不成八聚体；D 把 H1 算进核心颗粒，而 H1 是与连接 DNA 结合的；E 的 200 bp 是核小体连同连接 DNA 的长度，不是核心颗粒盘绕的长度。","type":"A1","group":"c17-01","kind":"mechanism","chs":[10,17,22],"vignette":"人二倍体细胞中约 2 m 长的 DNA 必须装进直径只有 5～8 μm 的细胞核，靠的是核小体、30 nm 纤维、襻环到中期染色体的逐级折叠。某基因受激素诱导：刺激前，它的启动子区缠着两个核小体，基因座紧贴核膜内缘、染色致密；刺激后 15 分钟，染色质重塑复合物水解 ATP，把这两个核小体沿 DNA 向下游滑动约 60 个碱基对，启动子区让出一段约 200 bp 的核小体缺失区，转录因子随即结合，该基因的转录在 1 小时内升高 9 倍；若用不能水解的 ATP 类似物代替 ATP，核小体不再移动。用高盐溶液洗去 H1 后，电镜下该基因座只剩直径约 11 nm 的串珠结构。","vignette_title":"情景 1：核小体滑了 60 个碱基对之后","gidx":1,"gn":5,"anchor":"启动子区缠着两个核小体"},{"id":"gc17-01-4","ch":10,"part":2,"tag":"机制","stem":"洗去 H1 后 30 nm 纤维解体、只剩串珠结构，据此判断 H1 的作用是","options":["组成核小体核心颗粒，与约 146 bp 的 DNA 直接盘绕","识别启动子区的特异序列，招募 RNA 聚合酶起始转录","结合连接 DNA 并参与 30 nm 纤维等更高层次的折叠","水解 ATP 驱动核小体沿 DNA 滑动，让出核小体缺失区","乙酰化组蛋白尾部使染色质疏松，从而促进该基因转录"],"answer":2,"explain":"C 对：H1 与连接 DNA 结合，把相邻核小体拉近，参与 30 nm 纤维及更高层次的折叠，去除后只剩直径约 11 nm 的串珠。A 把 H1 当成核心颗粒的成分；B 描述的是特异转录因子的作用；D 描述的是染色质重塑复合物的作用；E 描述的是组蛋白乙酰化带来的构象变化，都不是 H1 本身的功能。","type":"A1","group":"c17-01","kind":"mechanism","chs":[10,17,22],"vignette":"人二倍体细胞中约 2 m 长的 DNA 必须装进直径只有 5～8 μm 的细胞核，靠的是核小体、30 nm 纤维、襻环到中期染色体的逐级折叠。某基因受激素诱导：刺激前，它的启动子区缠着两个核小体，基因座紧贴核膜内缘、染色致密；刺激后 15 分钟，染色质重塑复合物水解 ATP，把这两个核小体沿 DNA 向下游滑动约 60 个碱基对，启动子区让出一段约 200 bp 的核小体缺失区，转录因子随即结合，该基因的转录在 1 小时内升高 9 倍；若用不能水解的 ATP 类似物代替 ATP，核小体不再移动。用高盐溶液洗去 H1 后，电镜下该基因座只剩直径约 11 nm 的串珠结构。","vignette_title":"情景 1：核小体滑了 60 个碱基对之后","gidx":4,"gn":5,"anchor":"只剩直径约 11 nm 的串珠结构"},{"id":"gc17-01-5","ch":10,"part":2,"tag":"判读","stem":"关于该基因座的染色质包装与核小体定位，下列判断正确的是（X 型多选）","options":["2 m 长的 DNA 装入直径 5～8 μm 的核，靠核小体等多级折叠实现","核小体沿 DNA 滑动，改变的是核小体的位置而不是碱基序列","洗去 H1 后 30 nm 纤维解体，说明 H1 参与更高层次的折叠","刺激前该基因座紧贴核膜内缘、染色致密，属转录不活跃的异染色质","加入不能水解的 ATP 类似物后核小体不移动，说明核小体定位不需能量"],"answer":[0,1,2,3],"explain":"答案 ABCD。A 对应 2 m 长的 DNA 装入 5～8 μm 核的多级压缩；B 与滑动后序列不变这一事实一致；C 由去 H1 后 30 nm 纤维解体这一现象得出；D 对应刺激前该基因座紧贴核膜、染色致密、转录很低的描述。E 错：用不能水解的 ATP 类似物代替 ATP 后核小体不再移动，恰好说明核小体定位需要消耗能量。","type":"X","group":"c17-01","kind":"mechanism","chs":[10,17,22],"vignette":"人二倍体细胞中约 2 m 长的 DNA 必须装进直径只有 5～8 μm 的细胞核，靠的是核小体、30 nm 纤维、襻环到中期染色体的逐级折叠。某基因受激素诱导：刺激前，它的启动子区缠着两个核小体，基因座紧贴核膜内缘、染色致密；刺激后 15 分钟，染色质重塑复合物水解 ATP，把这两个核小体沿 DNA 向下游滑动约 60 个碱基对，启动子区让出一段约 200 bp 的核小体缺失区，转录因子随即结合，该基因的转录在 1 小时内升高 9 倍；若用不能水解的 ATP 类似物代替 ATP，核小体不再移动。用高盐溶液洗去 H1 后，电镜下该基因座只剩直径约 11 nm 的串珠结构。","vignette_title":"情景 1：核小体滑了 60 个碱基对之后","gidx":5,"gn":5,"anchor":"紧贴核膜内缘、染色致密"},{"id":"gc17-03-2","ch":10,"part":2,"tag":"机制","stem":"短脉冲标记先见于纤维中心与致密纤维组分、30 分钟后才在颗粒组分大量出现，这一顺序说明","options":["核糖体蛋白先在颗粒组分中合成，随后回到纤维中心组装","rRNA 的合成与加工在前两组分进行，亚基组装在颗粒组分","三种组分是同一种结构的三种名称，彼此之间并无分工","标记出现的顺序由核仁外的转运速率决定，与加工无关","颗粒组分是 rRNA 转录的场所，纤维中心是亚基的储存处"],"answer":1,"explain":"B 对：纤维中心与致密纤维组分是 rRNA 合成与加工的场所，颗粒组分则是核糖体亚基前体组装的场所，标记由先到后正好对应这一加工流程。A 把核糖体蛋白的合成地点搬进核仁，实际它在细胞质中合成；C 否认三种组分的功能分工；D 把顺序归因于转运速率，忽略了加工本身；E 把转录场所与组装场所对调。","type":"A1","group":"c17-03","kind":"mechanism","chs":[10,20],"vignette":"核仁没有膜包裹，它的形成与 rDNA 的转录活动密切相关。人的 rDNA 成串分布在第 13、14、15、21、22 号染色体的短臂次级缢痕处，即核仁组织区。核仁内转录出 45S rRNA 前体，它在核仁内被加工成 18S、5.8S 与 28S rRNA；5S rRNA 则由另一种 RNA 聚合酶在核仁外转录后运入核仁。用短脉冲标记尿苷做自显影：标记最早出现在纤维中心与致密纤维组分，30 分钟后大量出现在颗粒组分。已在细胞质中合成的核糖体蛋白经核孔进入核仁，与 rRNA 一起组装成核糖体亚基前体，再经核孔输出到细胞质中进一步成熟。该细胞中紧贴核膜内缘与核仁周边的染色质染色致密、复制较晚，转录不活跃。","vignette_title":"情景 3：脉冲标记落在核仁的哪一层","gidx":2,"gn":5,"anchor":"标记最早出现在纤维中心与致密纤维组分"},{"id":"gc17-03-3","ch":10,"part":2,"tag":"判读","stem":"情景中核糖体亚基前体在核仁组装后还要经核孔输出到细胞质继续成熟，据此判断","options":["核糖体的组装与成熟在核仁内完成，输出的是成熟亚基","核糖体的组装与成熟在细胞质中完成，核仁提供 rRNA","核糖体蛋白在核仁内合成，rRNA 在细胞质中合成后运入核仁","核仁完成 rRNA 的加工与亚基前体组装，成熟在细胞质中进行","核糖体亚基前体经核膜直接进入细胞质，不经过核孔复合体"],"answer":3,"explain":"D 对：核仁承担 rRNA 的合成加工与核糖体亚基前体的组装，亚基前体经核孔输出后还要在细胞质中进一步成熟。A 与情景中输出后继续成熟矛盾；B 把组装地点整体搬到细胞质；C 把核糖体蛋白与 rRNA 的合成地点对调；E 错在核内大分子与亚基前体的进出都要经核孔复合体，而不经核膜脂双层。","type":"A1","group":"c17-03","kind":"mechanism","chs":[10,20],"vignette":"核仁没有膜包裹，它的形成与 rDNA 的转录活动密切相关。人的 rDNA 成串分布在第 13、14、15、21、22 号染色体的短臂次级缢痕处，即核仁组织区。核仁内转录出 45S rRNA 前体，它在核仁内被加工成 18S、5.8S 与 28S rRNA；5S rRNA 则由另一种 RNA 聚合酶在核仁外转录后运入核仁。用短脉冲标记尿苷做自显影：标记最早出现在纤维中心与致密纤维组分，30 分钟后大量出现在颗粒组分。已在细胞质中合成的核糖体蛋白经核孔进入核仁，与 rRNA 一起组装成核糖体亚基前体，再经核孔输出到细胞质中进一步成熟。该细胞中紧贴核膜内缘与核仁周边的染色质染色致密、复制较晚，转录不活跃。","vignette_title":"情景 3：脉冲标记落在核仁的哪一层","gidx":3,"gn":5,"anchor":"再经核孔输出到细胞质中进一步成熟"},{"id":"gc17-03-4","ch":10,"part":2,"tag":"判读","stem":"该细胞中染色致密、复制较晚、转录不活跃的染色质多紧贴核膜内缘与核仁周边，这一分布说明","options":["核内位置由碱基序列直接决定，与蛋白质因素无关","转录活跃的染色质体积较大，因而被挤到细胞核中央","染色质的转录活性与其在核内的空间位置相互关联","核膜内缘的染色质含基因最多，因而转录活性最高","核仁周边的染色质由 rRNA 基因组成，不与蛋白质结合"],"answer":2,"explain":"C 对：染色致密、复制较晚、转录不活跃的区域多分布在核膜内缘与核仁周边，而转录活跃的常染色质多位于核的内部，说明染色质的转录活性与其核内空间位置相互关联。A 把位置归因于碱基序列，忽略了核骨架等蛋白质因素；B 与情景的描述方向相反；D 与该区转录不活跃矛盾；E 错在核内染色质始终与组蛋白等蛋白质结合。","type":"A1","group":"c17-03","kind":"mechanism","chs":[10,20],"vignette":"核仁没有膜包裹，它的形成与 rDNA 的转录活动密切相关。人的 rDNA 成串分布在第 13、14、15、21、22 号染色体的短臂次级缢痕处，即核仁组织区。核仁内转录出 45S rRNA 前体，它在核仁内被加工成 18S、5.8S 与 28S rRNA；5S rRNA 则由另一种 RNA 聚合酶在核仁外转录后运入核仁。用短脉冲标记尿苷做自显影：标记最早出现在纤维中心与致密纤维组分，30 分钟后大量出现在颗粒组分。已在细胞质中合成的核糖体蛋白经核孔进入核仁，与 rRNA 一起组装成核糖体亚基前体，再经核孔输出到细胞质中进一步成熟。该细胞中紧贴核膜内缘与核仁周边的染色质染色致密、复制较晚，转录不活跃。","vignette_title":"情景 3：脉冲标记落在核仁的哪一层","gidx":4,"gn":5,"anchor":"紧贴核膜内缘与核仁周边的染色质"},{"id":"gc17-04-2","ch":10,"part":2,"tag":"方案","stem":"连接之前必须把 DNA 稀释到极低浓度，这样做的目的是","options":["提高限制性内切酶的切割效率，使酶切更为彻底","减少不同分子间的随机连接，保证连接来自同一片段","使组蛋白与 DNA 解离，便于引物与模板充分结合","降低连接酶的催化活性，避免连接产物超出检测范围","使 DNA 变性为单链，便于甲醛重新交联邻近的区段"],"answer":1,"explain":"B 对：稀释成极低浓度后，不同 DNA 分子彼此相遇的机会大幅下降，连接便主要发生在同一染色质片段内部原已被交联固定的两个区段之间，这样的连接产物才携带空间邻近的信息。A 酶切在稀释之前已完成；C 组蛋白的解离与此处的连接反应无关；D 目的是减少分子间随机连接，而不是单纯压低产物量；E 连接酶需要双链末端，变性成单链反而无法连接。","type":"A1","group":"c17-04","kind":"experiment","chs":[10,17,22],"vignette":"为弄清某红系特异基因的增强子（位于启动子上游约 80 kb）怎样与启动子接触，研究生做了三组实验。甲：先用甲醛交联细胞，再以限制性内切酶消化染色质，随后把 DNA 稀释到极低浓度并加入 DNA 连接酶，最后用锚定在启动子区的引物作定量 PCR；红系细胞中该连接产物的量是宫颈癌细胞的 12 倍。乙：用 DNase I 处理细胞核，该增强子所在区段在红系细胞中出现超敏位点，在宫颈癌细胞中不出现。丙：用高盐溶液抽提细胞核去除组蛋白后离心，该基因的启动子区段随核基质组分一起沉淀，而多数编码区片段留在上清中。","vignette_title":"情景 4：连接频率高出 12 倍之后","gidx":2,"gn":5,"anchor":"稀释到极低浓度并加入 DNA 连接酶"},{"id":"gc17-04-4","ch":10,"part":2,"tag":"判读","stem":"丙组中该基因的启动子区段随核基质组分沉淀，这一结果说明","options":["该区段与核基质的蛋白网架结合，为染色质提供空间锚定","该区段的 DNA 与组蛋白结合牢固，高盐抽提无法去除","该区段在抽提中发生断裂，以片段形式留在沉淀组分中","该区段富含串联重复序列，在高盐中形成不溶的沉淀","该区段与核膜的脂质结合，随膜性组分一起被离心沉淀"],"answer":0,"explain":"A 对：高盐抽提已除去组蛋白，该区段仍随核基质沉淀，说明它与核基质的蛋白网架结合，把染色质锚定在核内特定空间位置。B 高盐抽提的目的正是去除组蛋白，与描述矛盾；C 区段若发生断裂，其分布不会如此集中；D 沉淀来自与核基质蛋白的结合，而不是重复序列本身不溶；E 离心沉淀的是核基质这一非膜性网架，不是膜性组分。","type":"A1","group":"c17-04","kind":"experiment","chs":[10,17,22],"vignette":"为弄清某红系特异基因的增强子（位于启动子上游约 80 kb）怎样与启动子接触，研究生做了三组实验。甲：先用甲醛交联细胞，再以限制性内切酶消化染色质，随后把 DNA 稀释到极低浓度并加入 DNA 连接酶，最后用锚定在启动子区的引物作定量 PCR；红系细胞中该连接产物的量是宫颈癌细胞的 12 倍。乙：用 DNase I 处理细胞核，该增强子所在区段在红系细胞中出现超敏位点，在宫颈癌细胞中不出现。丙：用高盐溶液抽提细胞核去除组蛋白后离心，该基因的启动子区段随核基质组分一起沉淀，而多数编码区片段留在上清中。","vignette_title":"情景 4：连接频率高出 12 倍之后","gidx":4,"gn":5,"anchor":"随核基质组分一起沉淀"},{"id":"gc2-04-1","ch":10,"part":2,"tag":"机制","stem":"加激素后受体在 30 分钟内集中到核内，最可能的机制是","options":["激素使受体核定位信号暴露，经输入蛋白入核","激素使受体水解ATP后直接穿过核膜","激素使核纤层解聚，受体随核膜破口流入","激素使核孔孔径扩大，受体被动扩散入核","激素使核糖体停止工作，受体在胞质降解"],"answer":0,"explain":"A 对：受体与激素结合后核定位信号暴露，被输入蛋白识别后经核孔复合体耗能入核，与 30 分钟内出现明显核内聚集的时相吻合。B 核孔不会因激素而扩大孔径，被动扩散也无法解释 70 kDa 葡聚糖始终不能入核；C 核纤层解聚发生在分裂期，与加激素无关；D 胞质受体被降解会使总荧光明显下降，与核质比升高不符；E 蛋白质不能直接穿过核膜的脂双层，核孔才是运输通道。","type":"A1","group":"c2-04","kind":"experiment","chs":[10,6,9],"vignette":"研究生小陈把糖皮质激素受体的编码序列接上GFP后转染培养细胞。血清饥饿后荧光均匀分布在细胞质与细胞核；加入100 nmol/L地塞米松，30分钟后荧光集中到核内，核质比由0.4升至3.1。随后几组处理：把受体核定位信号的碱性氨基酸换成丙氨酸，加激素后荧光仍留在胞质；用叠氮钠加脱氧葡萄糖耗竭ATP，入核同样被阻断；向胞质注入70 kDa的惰性葡聚糖，1小时后仍不见核内聚集；用放线菌素D抑制rRNA转录，2小时后荧光标记的核仁蛋白从核仁内散入核质、核仁消失，光漂白后其荧光半恢复时间仅约20秒。另一组细胞加诺考达唑破坏微管，细胞停滞在分裂期，核膜崩解、核仁消失。","vignette_title":"情景 4：半小时后，绿色荧光聚到了核里","gidx":1,"gn":5,"anchor":"30分钟后荧光集中到核内"},{"id":"gc2-04-2","ch":10,"part":2,"tag":"判读","stem":"核定位信号突变后受体不再入核，这一结果说明","options":["受体入核依赖胞质中的核糖体","大分子入核需核定位信号介导","该突变使受体不能再与激素结合","突变的受体在胞质中被快速降解","该突变使受体分子量明显变小"],"answer":1,"explain":"B 对：仅仅替换核定位信号中的碱性氨基酸就使入核完全停止，说明该信号是大分子经核孔入核所必需的。B 突变位于核定位信号而不是激素结合结构域，受体仍能被激素激活；C 单个氨基酸替换几乎不改变分子量，而且分子量变小更有利于扩散入核；D 入核与核糖体无关；E 若受体被快速降解，胞质荧光应减弱消失，而实测只是不入核。","type":"A1","group":"c2-04","kind":"experiment","chs":[10,6,9],"vignette":"研究生小陈把糖皮质激素受体的编码序列接上GFP后转染培养细胞。血清饥饿后荧光均匀分布在细胞质与细胞核；加入100 nmol/L地塞米松，30分钟后荧光集中到核内，核质比由0.4升至3.1。随后几组处理：把受体核定位信号的碱性氨基酸换成丙氨酸，加激素后荧光仍留在胞质；用叠氮钠加脱氧葡萄糖耗竭ATP，入核同样被阻断；向胞质注入70 kDa的惰性葡聚糖，1小时后仍不见核内聚集；用放线菌素D抑制rRNA转录，2小时后荧光标记的核仁蛋白从核仁内散入核质、核仁消失，光漂白后其荧光半恢复时间仅约20秒。另一组细胞加诺考达唑破坏微管，细胞停滞在分裂期，核膜崩解、核仁消失。","vignette_title":"情景 4：半小时后，绿色荧光聚到了核里","gidx":2,"gn":5,"anchor":"把受体核定位信号的碱性氨基酸换成丙氨酸"},{"id":"gc2-04-3","ch":10,"part":2,"tag":"方案
