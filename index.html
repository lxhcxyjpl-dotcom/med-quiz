饱和时的最大反应速度，与酶的浓度成正比","酶对底物亲和力的倒数，数值越大表示亲和力越低","酶被底物饱和的程度，数值越大表示越接近饱和状态","每个酶分子每秒钟催化底物转化的分子个数，即转换数"],"answer":0,"explain":"A 对：转换数与 Km 之比即催化效率，底物浓度远低于 Km 时反应速度近似由该比值决定，因此常用来比较不同酶或同一种酶不同突变体的性能。B 错在底物饱和时的最大速度是 Vmax，它与酶浓度成正比，与 Km 无关。C 错在底物的亲和力由 Km 反映，而且 Km 越小亲和力越大，不能把这个比值当作亲和力的倒数。D 错在被底物饱和的程度取决于底物浓度与 Km 的相对大小。E 错在转换数只描述底物饱和时每个酶分子的催化次数，不包含 Km 的信息。","type":"A1","group":"c12-03","kind":"mechanism","chs":[3,1],"vignette":"一种从细菌中纯化的水解酶催化酯键水解。测活得到：转换数为 100 次每秒，Km 为 0.1 mmol/L，二者之比约为 10⁶ L·mol⁻¹·s⁻¹。晶体结构显示，活性中心位于一个疏水裂隙中：一个谷氨酸残基与一个组氨酸残基组成电荷中继网络，能向底物的酯键提供一个质子；底物的酯键与进攻的水分子被两个精氨酸残基固定在相邻位置上，相距不到 0.3 nm。用一种与反应过渡态结构相似的化合物做抑制剂，其解离常数为 0.01 μmol/L，而底物的 Km 为 100 μmol/L，两者相差约一万倍。该酶与底物的结合依靠氢键与离子键，结合后底物构象只发生轻微改变。","vignette_title":"情景 3：一万倍之差","gidx":4,"gn":5,"anchor":"测活得到：转换数为 100 次每秒"},{"id":"gc12-03-5","ch":3,"part":1,"tag":"判读","stem":"关于该酶的催化效率来源与动力学参数，下列判断正确的是（X 型多选）","options":["酶通过降低活化能加快反应，反应的平衡常数不因此改变","把酯键与进攻的水分子固定在相邻位置，可提高有效碰撞概率","结合后底物构象发生明显改变，产生的张力是速率提高的主要原因","转换数表示每个酶分子每秒钟催化底物转化的分子数","过渡态类似物与酶结合牢固，说明活性中心与过渡态结构互补"],"answer":[0,1,3,4],"explain":"答案 ABDE。A 对：酶降低活化能、加快反应速度，但不改变反应的平衡常数。B 对：把酯键与进攻的水分子固定在相邻位置，正是邻近与定向效应，可提高有效碰撞概率。D 对：转换数即每个酶分子每秒钟催化底物转化的分子数。E 对：过渡态类似物与酶结合牢固，说明活性中心与过渡态在结构上互补。C 错：情景明确指出结合后底物构象只发生轻微改变，速率提高主要来自邻近定向、酸碱催化与过渡态互补，而不是明显的构象扭曲。","type":"X","group":"c12-03","kind":"mechanism","chs":[3,1],"vignette":"一种从细菌中纯化的水解酶催化酯键水解。测活得到：转换数为 100 次每秒，Km 为 0.1 mmol/L，二者之比约为 10⁶ L·mol⁻¹·s⁻¹。晶体结构显示，活性中心位于一个疏水裂隙中：一个谷氨酸残基与一个组氨酸残基组成电荷中继网络，能向底物的酯键提供一个质子；底物的酯键与进攻的水分子被两个精氨酸残基固定在相邻位置上，相距不到 0.3 nm。用一种与反应过渡态结构相似的化合物做抑制剂，其解离常数为 0.01 μmol/L，而底物的 Km 为 100 μmol/L，两者相差约一万倍。该酶与底物的结合依靠氢键与离子键，结合后底物构象只发生轻微改变。","vignette_title":"情景 3：一万倍之差","gidx":5,"gn":5,"anchor":"结合后底物构象只发生轻微改变"},{"id":"gc12-04-1","ch":3,"part":1,"tag":"判读","stem":"突变体甲的 Km 与解离常数同时升高，转换数基本不变，说明它","options":["底物结合能力下降，催化步骤本身基本未受影响","催化步骤受损，底物结合能力本身基本未受影响","底物结合与催化步骤两者同时受到严重破坏","酶的稳定性下降，在测定过程中被降解而失活","底物的结构发生变化，与酶结合的能力因而减弱"],"answer":0,"explain":"A 对：突变体甲的 Km 与解离常数同时大幅升高，说明底物与酶的结合明显变弱；转换数几乎不变，说明它完成催化步骤的本领没有受损，缺陷主要在结合环节。B 错在方向正好相反，若催化受损应表现为转换数下降而 Km 与解离常数基本不变。C 错在两组参数并未同时恶化，转换数仍接近野生型。D 错在测活与电泳都没有降解的迹象，而且降解本身不会改变 Km。E 错在测活时加入的是同一份底物，底物结构不可能只对突变体不利。","type":"A1","group":"c12-04","kind":"experiment","chs":[1,3],"vignette":"研究生小许要判断三个定点突变分别破坏了底物结合还是催化步骤。他把野生型酶与三个突变体分别纯化，在同一缓冲液中测定：野生型的转换数为 50 次每秒，Km 为 20 μmol/L，用超滤法测得的底物解离常数为 15 μmol/L；突变体甲把活性中心的赖氨酸换成了丙氨酸，转换数为 48 次每秒，Km 升到 800 μmol/L，解离常数升到 700 μmol/L；突变体乙把组氨酸换成了丙氨酸，Km 为 25 μmol/L，解离常数为 18 μmol/L，转换数却降到 0.5 次每秒；突变体丙的突变位于远离活性中心的二聚化界面上，Km、转换数与解离常数都与野生型相当，但它在细胞内的活性只有野生型的 10%，凝胶过滤显示它以单体形式存在。三个突变体的表达量与野生型没有明显差别。","vignette_title":"情景 4：三个突变体，两种缺陷","gidx":1,"gn":6,"anchor":"突变体甲把活性中心的赖氨酸换成了丙氨酸"},{"id":"gc12-04-2","ch":3,"part":1,"tag":"判读","stem":"突变体乙的 Km 与解离常数接近野生型，转换数却大幅下降，说明它","options":["底物结合基本正常，酶的稳定性下降而被降解","催化步骤基本正常，受损的环节是底物的结合","底物结合基本正常，受损的环节是催化步骤本身","底物结合与催化步骤两者同时受到严重破坏","催化步骤基本正常，底物在缓冲液中自行分解"],"answer":2,"explain":"C 对：突变体乙的 Km 与解离常数都与野生型接近，说明底物照样能结合；转换数降到原来的百分之一，说明受损的是化学反应这一步。A 错在若酶被降解，测得的活性蛋白量会减少，但每分子酶的转换数不会改变。B 错在方向相反，结合受损应表现为 Km 与解离常数升高。D 错在两组参数并不同时恶化。E 错在底物在缓冲液中自发分解会同样影响野生型的测定，也无法解释转换数下降。","type":"A1","group":"c12-04","kind":"experiment","chs":[1,3],"vignette":"研究生小许要判断三个定点突变分别破坏了底物结合还是催化步骤。他把野生型酶与三个突变体分别纯化，在同一缓冲液中测定：野生型的转换数为 50 次每秒，Km 为 20 μmol/L，用超滤法测得的底物解离常数为 15 μmol/L；突变体甲把活性中心的赖氨酸换成了丙氨酸，转换数为 48 次每秒，Km 升到 800 μmol/L，解离常数升到 700 μmol/L；突变体乙把组氨酸换成了丙氨酸，Km 为 25 μmol/L，解离常数为 18 μmol/L，转换数却降到 0.5 次每秒；突变体丙的突变位于远离活性中心的二聚化界面上，Km、转换数与解离常数都与野生型相当，但它在细胞内的活性只有野生型的 10%，凝胶过滤显示它以单体形式存在。三个突变体的表达量与野生型没有明显差别。","vignette_title":"情景 4：三个突变体，两种缺陷","gidx":2,"gn":6,"anchor":"转换数却降到 0.5 次每秒"},{"id":"gc12-04-5","ch":3,"part":1,"tag":"判读","stem":"细胞内游离底物的浓度约为 30 μmol/L，据此判断突变体甲在细胞内催化反应的速度","options":["与野生型相同，因为突变体与野生型的转换数相同","高于野生型，因为突变体对底物的亲和力更弱","略低于野生型，因为突变体的 Km 高出约四十倍","远低于野生型，因为底物浓度远未达到突变体的 Km","无法判断，因为细胞内底物浓度会随时间波动"],"answer":3,"explain":"D 对：细胞内底物浓度约 30 μmol/L，与野生型的 Km 20 μmol/L 接近，野生型已接近饱和；突变体甲的 Km 升到 800 μmol/L，在同一浓度下远未饱和，反应速度因而远低于野生型。A 错在转换数相同并不能保证速度相同，速度还取决于底物浓度与 Km 的相对大小。B 错在亲和力下降只会使速度降低而不是升高。C 错在低估了差距，Km 相差四十倍时两者的速度相差远不止一点点。E 错在底物浓度的波动不影响这一量级上的判断。","type":"A1","group":"c12-04","kind":"experiment","chs":[1,3],"vignette":"研究生小许要判断三个定点突变分别破坏了底物结合还是催化步骤。他把野生型酶与三个突变体分别纯化，在同一缓冲液中测定：野生型的转换数为 50 次每秒，Km 为 20 μmol/L，用超滤法测得的底物解离常数为 15 μmol/L；突变体甲把活性中心的赖氨酸换成了丙氨酸，转换数为 48 次每秒，Km 升到 800 μmol/L，解离常数升到 700 μmol/L；突变体乙把组氨酸换成了丙氨酸，Km 为 25 μmol/L，解离常数为 18 μmol/L，转换数却降到 0.5 次每秒；突变体丙的突变位于远离活性中心的二聚化界面上，Km、转换数与解离常数都与野生型相当，但它在细胞内的活性只有野生型的 10%，凝胶过滤显示它以单体形式存在。三个突变体的表达量与野生型没有明显差别。","vignette_title":"情景 4：三个突变体，两种缺陷","gidx":5,"gn":6,"anchor":"野生型的转换数为 50 次每秒"},{"id":"gc12-04-6","ch":3,"part":1,"tag":"判读","stem":"关于这三个突变体的判读，下列正确的是（X 型多选）","options":["解离常数直接反映底物与酶的结合，可与 Km 相互印证","Km 升高说明催化步骤受损，与底物的结合能力无关","转换数下降而 Km 不变，提示结合正常而催化步骤受损","突变体丙的缺陷发生在分子之间的结合，而不在活性中心","突变体丙在细胞内活性偏低，说明它的催化步骤也受到破坏"],"answer":[0,2,3],"explain":"答案 ACD。A 对：解离常数由直接的结合实验测得，与动力学得到的 Km 相互印证，是区分结合受损与催化受损的关键证据。C 对：突变体乙转换数下降而 Km 不变，支持结合正常、催化受损的判断。D 对：突变体丙参数正常却只能以单体存在，缺陷落在分子之间的结合上。B 错：Km 升高反映的是结合变弱，不能据此认定催化步骤受损。E 错：突变体丙的参数与野生型相当，恰恰说明它的催化步骤并未受损。","type":"X","group":"c12-04","kind":"experiment","chs":[1,3],"vignette":"研究生小许要判断三个定点突变分别破坏了底物结合还是催化步骤。他把野生型酶与三个突变体分别纯化，在同一缓冲液中测定：野生型的转换数为 50 次每秒，Km 为 20 μmol/L，用超滤法测得的底物解离常数为 15 μmol/L；突变体甲把活性中心的赖氨酸换成了丙氨酸，转换数为 48 次每秒，Km 升到 800 μmol/L，解离常数升到 700 μmol/L；突变体乙把组氨酸换成了丙氨酸，Km 为 25 μmol/L，解离常数为 18 μmol/L，转换数却降到 0.5 次每秒；突变体丙的突变位于远离活性中心的二聚化界面上，Km、转换数与解离常数都与野生型相当，但它在细胞内的活性只有野生型的 10%，凝胶过滤显示它以单体形式存在。三个突变体的表达量与野生型没有明显差别。","vignette_title":"情景 4：三个突变体，两种缺陷","gidx":6,"gn":6,"anchor":"三个突变体的表达量与野生型没有明显差别"},{"id":"gc20-01-3","ch":3,"part":1,"tag":"判读","stem":"把琥珀酸浓度提高10倍后耗氧速率回升，这一结果说明丙二酸","options":["丙二酸与琥珀酸竞争底物结合位点，属可逆性抑制","丙二酸结合在酶活性中心以外的部位，属非竞争性抑制","丙二酸与酶-底物复合物结合后使酶失活，属反竞争性抑制","丙二酸与琥珀酸脱氢酶形成共价复合物，属不可逆性抑制","丙二酸使线粒体内膜的质子通透性升高，属解偶联作用"],"answer":0,"explain":"A 对：把底物浓度提高10倍后抑制被解除，说明丙二酸与琥珀酸争夺同一个底物结合位点，二者的结合是可逆的。B 错：非竞争性抑制结合在活性中心以外的部位，增大底物浓度不能使抑制解除。C 错：反竞争性抑制与酶-底物复合物结合，其活性同样不随底物浓度升高而恢复。D 错：形成共价修饰的不可逆抑制，再提高底物浓度也无法恢复活性。E 错：解偶联改变的是内膜对质子的通透性，与酶活性中心的竞争无关。","type":"A1","group":"c20-01","kind":"mechanism","chs":[13,3,16],"vignette":"20世纪30年代，二硝基苯酚曾作为减肥药公开出售。一名服药一个月的女性体重下降6kg，因持续大汗、发热急诊入院，体温41.2℃。检查：静息耗氧量由每分钟240mL升至520mL，动脉血乳酸由1.0升至4.8mmol/L，血糖6.1mmol/L。取骨骼肌活检分离线粒体，以琥珀酸为底物并加入ADP与Pi测定：耗氧速率为对照的2.5倍（30对12，相对值），跨内膜质子梯度降至对照的10%，ATP合成速率由每分钟每毫克蛋白48nmol降至6nmol，此时电子仍沿呼吸链传给氧分子。另取一管改用谷氨酸加苹果酸为底物，加入鱼藤酮后耗氧降至1以下，质子梯度与ATP合成速率同时下降。向对照线粒体加入丙二酸后耗氧速率下降，把琥珀酸浓度提高10倍，耗氧速率回升至接近对照。","vignette_title":"情景 1：一份减肥药留下的能量账本","gidx":3,"gn":5,"anchor":"把琥珀酸浓度提高10倍"},{"id":"gc20-04-3","ch":3,"part":1,"tag":"方案","stem":"测定P/O比时向体系中加入过量ADP与Pi，其主要目的是","options":["为呼吸链提供底物，使复合体Ⅰ的电子来源保持充足","使氧化磷酸化处于最大速率，避免ADP不足使P/O被低估","抑制ATP合酶的回流，使质子梯度维持在稳定的水平","破坏线粒体内膜的质子梯度，便于单独测定电子传递速率","使线粒体吸水膨胀破裂，把内膜上的复合体释放到上清"],"answer":1,"explain":"B 对：测定P/O比要让氧化磷酸化在最大速率下进行，过量ADP与Pi可避免磷酸化一侧成为限速步骤，否则测得的ATP合成速率偏低、P/O比被低估。A 错：底物由谷氨酸加苹果酸或琥珀酸提供，ADP与Pi不是呼吸链的底物。C 错：加入过量ADP是促进而不是抑制质子经ATP合酶回流。D 错：破坏质子梯度会使氧化与磷酸化解偶联，测得的P/O比反而失真。E 错：低渗处理会破坏线粒体结构，不是测定P/O比所需的正常条件。","type":"A1","group":"c20-04","kind":"experiment","chs":[13,3,16],"vignette":"研究生收到三份来自不同患儿的骨骼肌线粒体样品：甲为年龄匹配的正常对照，乙与丙分别来自两名运动不耐受、肌张力低下的患儿，测定前各样品线粒体蛋白量已配平。她以谷氨酸加苹果酸和琥珀酸两种底物，分别测定加ADP后的耗氧速率与ATP合成速率（单位均为nmol·min⁻¹·mg⁻¹），并计算P/O比。结果：甲组以谷氨酸加苹果酸为底物时耗氧24、ATP60、P/O2.5，以琥珀酸为底物时耗氧24、ATP36、P/O1.5；乙组耗氧5、ATP12、P/O2.4与耗氧23、ATP35、P/O1.5；丙组耗氧27、ATP16、P/O0.6与耗氧26、ATP15、P/O0.6。临床资料：乙组患儿安静时血乳酸4.2mmol/L，丙组为1.3mmol/L。为核对测定条件，她又向甲组体系中加入过量ADP与Pi后重复测定。","vignette_title":"情景 4：三份样品与一张三列表","gidx":3,"gn":5,"anchor":"加入过量ADP与Pi后重复测定"},{"id":"gc25-04-2","ch":3,"part":1,"tag":"判读","stem":"丙组 Akt 与糖原合酶激酶磷酸化均接近甲组，糖原合酶活性却只有 110%，最合理的解释是","options":["糖原合酶磷酸化后活性受抑，须由蛋白磷酸酶去磷酸化才恢复","蛋白磷酸酶抑制剂直接与糖原合酶结合并占据其活性中心","糖原合酶的活性调节属于别构调节，与磷酸化修饰没有关系","丙组细胞的胰岛素没有与受体结合，故下游信号未能传递","糖原合酶在胰岛素作用下被磷酸化，磷酸化使其活性升高"],"answer":0,"explain":"A 对：信号已传到糖原合酶激酶，但磷酸酶被抑制，糖原合酶无法去磷酸化，故活性提不起来，说明糖原合酶被磷酸化时活性低、去磷酸化后活性高。B 抑制剂作用于磷酸酶而不占据糖原合酶的活性中心；C 本实验中酶活性改变明确由磷酸化修饰引起，不是别构调节；D 丙组 Akt 磷酸化与甲组接近，说明信号传递正常；E 把磷酸化对糖原合酶的作用方向说反了。","type":"A1","group":"c25-04","kind":"experiment","chs":[1,3,25,11],"vignette":"为追踪胰岛素把葡萄糖送进糖原的分子链条，研究生用同一批大鼠肝细胞做四组实验，各组细胞数与培养条件一致。甲组加 10 nmol/L 胰岛素；乙组先加 PI3K 抑制剂再加等量胰岛素；丙组先加蛋白磷酸酶抑制剂再加等量胰岛素；丁组不加药。孵育 30 分钟后测定，结果以丁组为 100%：甲组受体自身磷酸化升到 620%，Akt 磷酸化升到 480%，糖原合酶激酶磷酸化升到 510%，糖原合酶活性升到 260%，细胞内 UDP-葡萄糖升到 380%，¹⁴C 标记的葡萄糖掺入糖原的量升到 340%；乙组受体自身磷酸化仍为 590%，而 Akt 磷酸化只有 90%，糖原合酶活性为 100%；丙组 Akt 磷酸化与糖原合酶激酶磷酸化均与甲组接近，糖原合酶活性却只有 110%。另一组细胞在胰岛素作用前导入一个不能被 Akt 磷酸化的糖原合酶激酶突变体，该突变体持续保持活性，其糖原合酶活性只有 120%，¹⁴C 掺入糖原只有 140%。","vignette_title":"情景 4：三个抑制剂与一条通往糖原的链条","gidx":2,"gn":6,"anchor":"糖原合酶活性却只有"},{"id":"gc25-04-6","ch":3,"part":1,"tag":"判读","stem":"关于本实验中信号传递与酶活性调节的方式，下列判断正确的是（X 型多选）","options":["磷酸化与去磷酸化对酶活性的调节属于共价修饰，作用快速并可级联放大","本实验中糖原合酶的活性变化属于别构调节，调节物与酶非共价结合","Akt 使糖原合酶激酶磷酸化，改变了它的构象而使其活性下降","酶含量调节比共价修饰调节更快，本实验测得的变化由其引起","糖原合酶的去磷酸化由蛋白磷酸酶催化，反应方向与蛋白激酶相反"],"answer":[0,2,4],"explain":"答案 ACE。A 对：磷酸化与去磷酸化属共价修饰调节，通过级联反应放大信号，起效快。C 对：Akt 把磷酸基加到糖原合酶激酶上，共价修饰改变其构象而使活性下降。E 对：蛋白激酶加磷酸基、蛋白磷酸酶去磷酸基，两者方向相反。B 错：本实验的调节物以共价方式结合，属共价修饰而非别构调节。D 错：酶含量调节改变的是酶蛋白的合成与降解速率，作用缓慢持久，30 分钟内出现的变化来自共价修饰。","type":"X","group":"c25-04","kind":"experiment","chs":[1,3,25,11],"vignette":"为追踪胰岛素把葡萄糖送进糖原的分子链条，研究生用同一批大鼠肝细胞做四组实验，各组细胞数与培养条件一致。甲组加 10 nmol/L 胰岛素；乙组先加 PI3K 抑制剂再加等量胰岛素；丙组先加蛋白磷酸酶抑制剂再加等量胰岛素；丁组不加药。孵育 30 分钟后测定，结果以丁组为 100%：甲组受体自身磷酸化升到 620%，Akt 磷酸化升到 480%，糖原合酶激酶磷酸化升到 510%，糖原合酶活性升到 260%，细胞内 UDP-葡萄糖升到 380%，¹⁴C 标记的葡萄糖掺入糖原的量升到 340%；乙组受体自身磷酸化仍为 590%，而 Akt 磷酸化只有 90%，糖原合酶活性为 100%；丙组 Akt 磷酸化与糖原合酶激酶磷酸化均与甲组接近，糖原合酶活性却只有 110%。另一组细胞在胰岛素作用前导入一个不能被 Akt 磷酸化的糖原合酶激酶突变体，该突变体持续保持活性，其糖原合酶活性只有 120%，¹⁴C 掺入糖原只有 140%。","vignette_title":"情景 4：三个抑制剂与一条通往糖原的链条","gidx":6,"gn":6,"anchor":"先加蛋白磷酸酶抑制剂"},{"id":"gc3-01-2","ch":3,"part":1,"tag":"机制","stem":"把果糖-6-磷酸浓度提高 10 倍后 PFK-1 活性仍无明显回升，据此判断 ATP 与柠檬酸对该酶的抑制属于","options":["不可逆抑制，抑制剂与酶形成稳定的共价键","竞争性抑制，提高底物浓度即可解除这种抑制","反竞争性抑制，抑制剂仅与酶底物复合物结合","变构抑制，抑制剂结合在活性中心以外的调节部位","化学修饰调节，通过磷酸化改变酶的共价结构"],"answer":3,"explain":"D 对：底物浓度提高 10 倍仍不能解除抑制，说明抑制剂并不与底物争夺活性中心，而是结合在活性中心以外的调节部位，属变构抑制。B 错：竞争性抑制可被高浓度底物解除，与实验结果正好矛盾。A 错：不可逆抑制要求抑制剂与酶形成共价键，而 ATP 与柠檬酸的抑制是可逆的。C 错：反竞争性抑制只能与酶-底物复合物结合，提高底物反而应使抑制增强，与本例不符。E 错：化学修饰调节涉及共价结构的改变，与 ATP、柠檬酸这类小分子效应物的快速可逆抑制不同。","type":"A1","group":"c3-01","kind":"mechanism","chs":[11,16,3],"vignette":"短跑冲刺 30 秒，骨骼肌细胞内 ATP 由 5.2 mmol/L 降到 3.1 mmol/L，AMP 升高约 5 倍，柠檬酸由 1.1 mmol/L 降到 0.3 mmol/L，实测 PFK-1 活性升高约 8 倍；乳酸脱氢酶把丙酮酸还原为乳酸，使 NAD⁺ 不断再生，糖酵解在无氧条件下仍可净生成 2 分子 ATP。把底物果糖-6-磷酸浓度提高 10 倍，被 ATP 与柠檬酸抑制的 PFK-1 活性仍无明显回升。同一时刻肝细胞 ATP 与柠檬酸水平偏高，胰高血糖素经 cAMP 通路使肝内果糖-2,6-二磷酸减少，肝细胞 PFK-1 活性反而下降，糖异生得以维持血糖；骨骼肌则缺乏葡糖-6-磷酸酶，糖原分解产物不能直接补充血糖。","vignette_title":"情景 1：冲刺三十秒里的两个 PFK-1","gidx":2,"gn":5,"anchor":"PFK-1 活性仍无明显回升"},{"id":"gc6-01-2","ch":3,"part":1,"tag":"判读","stem":"综合 Km 与 Vmax 的测定结果，该突变对酶动力学的影响是","options":["使 Km 与 Vmax 同时减小，即亲和力升高","使 Km 增大而 Vmax 不变，即亲和力下降","使 Km 减小而 Vmax 不变，即亲和力升高","使 Km 不变而 Vmax 减小，即催化效率下降","使底物特异性改变，酶转而催化其他底物"],"answer":1,"explain":"B 对：Km 是反应速度达半最大速度时的底物浓度，由 8 升至 40 mmol/L 说明底物亲和力下降；Vmax 相近说明最大催化能力未受影响。C 错：Km 是升高而不是减小。A 错：情景给出两者 Vmax 相近，且 Km 也是升高而非减小。D 错：Vmax 未改变。E 错：Km 与亲和力的改变不等于底物特异性的改变，突变酶催化的仍是葡萄糖的磷酸化。","type":"A1","group":"c6-01","kind":"mechanism","chs":[1,3,11],"vignette":"肝细胞与胰岛 B 细胞中都有葡糖激酶（己糖激酶Ⅳ），它催化葡萄糖磷酸化为葡糖-6-磷酸，是糖酵解的第一个限速步骤，也被看作细胞的葡萄糖感受器：血糖升高后，进入细胞并被磷酸化的葡萄糖增多，胰岛素分泌随之启动。某患者自幼餐后血糖升高而空腹血糖接近正常，测序发现葡糖激酶第 62 位的缬氨酸被甲硫氨酸替换，该残基的侧链原本与葡萄糖的羟基形成氢键。研究者把突变酶与正常酶分别纯化，测得正常酶的 Km 约 8 mmol/L，突变酶约 40 mmol/L，两者 Vmax 相近。","vignette_title":"情景 1：当葡萄糖感受器认错了底物","gidx":2,"gn":5,"anchor":"突变酶约 40 mmol/L"},{"id":"gc6-01-5","ch":3,"part":1,"tag":"机制","stem":"关于这一突变影响酶功能的链条，下列判断正确的是（X 型多选）","options":["提高葡萄糖浓度可使突变酶的 Vmax 超过正常酶","Km 升高的酶在低血糖时仍能有效磷酸化葡萄糖","一级结构中一个残基被替换即可改变底物亲和力","Km 升高意味着达到半最大速度需要更高的葡萄糖浓度","该突变最终改变了细胞对葡萄糖的感受能力"],"answer":[2,3,4],"explain":"答案 CDE。C 对应一级结构中单个残基被替换；B 是 Km 的定义与 8→40 mmol/L 的直接推论；E 对应葡萄糖感受器功能受损。B 错：Km 升高表示要更高的葡萄糖浓度才达到半最大速度，低血糖时突变酶工作得更差。A 错：情景已给出两者 Vmax 相近，提高底物浓度只能使速度趋近于同一个最大值。","type":"X","group":"c6-01","kind":"mechanism","chs":[1,3,11],"vignette":"肝细胞与胰岛 B 细胞中都有葡糖激酶（己糖激酶Ⅳ），它催化葡萄糖磷酸化为葡糖-6-磷酸，是糖酵解的第一个限速步骤，也被看作细胞的葡萄糖感受器：血糖升高后，进入细胞并被磷酸化的葡萄糖增多，胰岛素分泌随之启动。某患者自幼餐后血糖升高而空腹血糖接近正常，测序发现葡糖激酶第 62 位的缬氨酸被甲硫氨酸替换，该残基的侧链原本与葡萄糖的羟基形成氢键。研究者把突变酶与正常酶分别纯化，测得正常酶的 Km 约 8 mmol/L，突变酶约 40 mmol/L，两者 Vmax 相近。","vignette_title":"情景 1：当葡萄糖感受器认错了底物","gidx":5,"gn":5,"anchor":"两者 Vmax 相近"},{"id":"gc6-02-1","ch":3,"part":1,"tag":"机制","stem":"线粒体甘油-3-磷酸脱氢酶的辅基 FAD 在该反应中的作用是","options":["与磷酸二羟丙酮竞争活性中心，从而抑制该酶的活性","接受底物上脱下的两个氢被还原，并把电子交给下游","结合在活性中心以外，通过构象改变调节酶的活性","作为第二底物被酶逐渐消耗，需要不断从食物中补充","接受底物上脱下的两个电子，但不接受同时脱下的质子"],"answer":1,"explain":"B 对：FAD 是结合酶的辅基，位于活性中心内，接受底物脱下的两个氢而被还原为 FADH₂，再把电子经铁硫中心交给泛醌。E 错：黄素类辅基接受的是氢原子（两个电子与两个质子），电子与质子一并被接受。D 错：辅基与酶蛋白结合牢固，反应后可反复使用，不需按化学计量不断补充。C 错：该作用发生在活性中心之内，是催化基团的一部分，不是别构调节部位。A 错：磷酸二羟丙酮是该反应的产物，不是与它竞争的抑制剂。","type":"A1","group":"c6-02","kind":"mechanism","chs":[3,11,13],"vignette":"胞质中糖酵解产生的 NADH 不能自由穿过线粒体内膜，它的还原当量要靠穿梭系统送进线粒体。骨骼肌与脑以甘油磷酸穿梭为主：胞质 NADH 先把氢交给磷酸二羟丙酮生成 α-磷酸甘油，后者在线粒体内膜靠胞质一侧被线粒体甘油-3-磷酸脱氢酶重新氧化为磷酸二羟丙酮，脱下的一对电子经该酶的辅基 FAD 与铁硫中心交给泛醌，再沿复合体Ⅲ、细胞色素 c、复合体Ⅳ传给氧。肝与心肌则以苹果酸-天冬氨酸穿梭为主，把还原当量以 NADH 的形式送进基质。按教材口径，1 NADH 约相当于 2.5 ATP，1 FADH₂ 约相当于 1.5 ATP，所以 1 分子葡萄糖彻底氧化时骨骼肌约得 30 ATP、肝约得 32 ATP。","vignette_title":"情景 2：一对氢原子的两条进城路线","gidx":1,"gn":5,"anchor":"经该酶的辅基 FAD 与铁硫中心交给泛醌"},{"id":"gc6-02-3","ch":3,"part":1,"tag":"机制","stem":"该反应中，FAD 与铁硫中心在传递还原当量时的分工是","options":["FAD 与铁硫中心接受氢原子后，把氢直接交给氧","FAD 接受氢原子，铁硫中心把电子继续传给泛醌","FAD 与铁硫中心都通过共价修饰改变自身的活性","FAD 接受氢原子后生成 FMN，再由铁硫中心传递质子","FAD 传递电子，铁硫中心接受氢原子后把氢交给泛醌"],"answer":1,"explain":"B 对：FAD 属递氢体，接受两个氢被还原为 FADH₂；铁硫蛋白属递电子体，通过铁离子的价态变化只传递电子，把电子交给泛醌。E 错：把两者的分工写反了。A 错：铁硫中心不传递氢，而且电子交给泛醌而不是直接交给氧。D 错：FAD 与 FMN 是两种不同的黄素辅基，FAD 不会转变为 FMN。C 错：共价修饰是酶活性调节的方式，与呼吸链内辅基的递氢递电子功能无关。","type":"A1","group":"c6-02","kind":"mechanism","chs":[3,11,13],"vignette":"胞质中糖酵解产生的 NADH 不能自由穿过线粒体内膜，它的还原当量要靠穿梭系统送进线粒体。骨骼肌与脑以甘油磷酸穿梭为主：胞质 NADH 先把氢交给磷酸二羟丙酮生成 α-磷酸甘油，后者在线粒体内膜靠胞质一侧被线粒体甘油-3-磷酸脱氢酶重新氧化为磷酸二羟丙酮，脱下的一对电子经该酶的辅基 FAD 与铁硫中心交给泛醌，再沿复合体Ⅲ、细胞色素 c、复合体Ⅳ传给氧。肝与心肌则以苹果酸-天冬氨酸穿梭为主，把还原当量以 NADH 的形式送进基质。按教材口径，1 NADH 约相当于 2.5 ATP，1 FADH₂ 约相当于 1.5 ATP，所以 1 分子葡萄糖彻底氧化时骨骼肌约得 30 ATP、肝约得 32 ATP。","vignette_title":"情景 2：一对氢原子的两条进城路线","gidx":3,"gn":5,"anchor":"被线粒体甘油-3-磷酸脱氢酶重新氧化"},{"id":"gc6-03-1","ch":3,"part":1,"tag":"机制","stem":"胰高血糖素使肝糖原磷酸化酶活性升高，其调节方式属于","options":["酶原激活，切除特定肽段后形成或暴露活性中心","共价修饰调节，磷酸化后酶构象改变而活性升高","酶蛋白合成增多，短时间内酶的总量明显升高","竞争性抑制解除，底物更容易占据酶的活性中心","别构调节，效应物与调节部位非共价结合而生效"],"answer":1,"explain":"B 对：情景明确给出磷酸基团被加到靶酶上、酶活性随之改变，属于由蛋白激酶催化的共价修饰调节，可被磷酸酶逆转。E 错：别构调节靠非共价结合的效应物，不涉及磷酸基团的共价连接。A 错：酶原激活是切除肽段的一次性过程，与激素级联反复调节不同。D 错：这里没有抑制剂被解除，磷酸化是直接改变酶分子本身。C 错：级联磷酸化改变的是已有酶分子的活性，而不是合成量。","type":"A1","group":"c6-03","kind":"mechanism","chs":[3,11],"vignette":"空腹时血糖下降，胰高血糖素通过 cAMP-蛋白激酶 A 级联把磷酸基团加到肝细胞内多个靶酶上。糖原磷酸化酶被磷酸化后活性升高，糖原合酶被磷酸化后活性下降，肝糖原分解释放出葡糖-6-磷酸。磷酸化还作用于双功能酶，使它表现出果糖-2,6-二磷酸酶活性，肝内果糖-2,6-二磷酸的水平随之下降。果糖-2,6-二磷酸是磷酸果糖激酶-1 的别构激活剂，又是果糖二磷酸酶-1 的别构抑制剂；它减少以后，磷酸果糖激酶-1 活性下降、果糖二磷酸酶-1 活性升高，糖酵解受到抑制而糖异生加强，更多葡糖-6-磷酸被用于合成葡萄糖，补充血糖。","vignette_title":"情景 3：饥饿时肝把开关扳向另一边","gidx":1,"gn":5,"anchor":"糖原磷酸化酶被磷酸化后活性升高"},{"id":"gc6-03-3","ch":3,"part":1,"tag":"机制","stem":"果糖-2,6-二磷酸对磷酸果糖激酶-1 的作用方式是","options":["作为别构抑制剂结合于活性中心以外的调节部位","作为底物与果糖-6-磷酸竞争该酶的活性中心","作为别构激活剂结合于活性中心以外的调节部位","作为第二信使先激活蛋白激酶 A 再调节该酶活性","作为磷酸基团的供体参与该酶的共价修饰调节"],"answer":2,"explain":"C 对：情景直接指出它是别构激活剂，别构效应物通过非共价方式结合在活性中心以外的调节部位，引起酶构象改变而改变活性。A 错：它是激活剂而不是抑制剂，对果糖二磷酸酶-1 才是抑制剂。B 错：它不是该酶的底物，不占据活性中心，故不属于竞争性抑制。E 错：它是糖代谢的调节信号，不为酶提供磷酸基团。D 错：第二信使是 cAMP，果糖-2,6-二磷酸本身不激活蛋白激酶 A。","type":"A1","group":"c6-03","kind":"mechanism","chs":[3,11],"vignette":"空腹时血糖下降，胰高血糖素通过 cAMP-蛋白激酶 A 级联把磷酸基团加到肝细胞内多个靶酶上。糖原磷酸化酶被磷酸化后活性升高，糖原合酶被磷酸化后活性下降，肝糖原分解释放出葡糖-6-磷酸。磷酸化还作用于双功能酶，使它表现出果糖-2,6-二磷酸酶活性，肝内果糖-2,6-二磷酸的水平随之下降。果糖-2,6-二磷酸是磷酸果糖激酶-1 的别构激活剂，又是果糖二磷酸酶-1 的别构抑制剂；它减少以后，磷酸果糖激酶-1 活性下降、果糖二磷酸酶-1 活性升高，糖酵解受到抑制而糖异生加强，更多葡糖-6-磷酸被用于合成葡萄糖，补充血糖。","vignette_title":"情景 3：饥饿时肝把开关扳向另一边","gidx":3,"gn":5,"anchor":"是磷酸果糖激酶-1 的别构激活剂"},{"id":"gc6-03-5","ch":3,"part":1,"tag":"机制","stem":"关于别构调节与共价修饰调节的比较，下列判断正确的是（X 型多选）","options":["别构效应物以非共价方式结合于活性中心以外部位","别构效应物的结构与底物相似并与底物竞争活性中心","两种调节方式都通过改变酶的构象来改变其活性","共价修饰由另一种酶催化，因此这一调节可以逆转","共价修饰把磷酸基团加到酶上，属于不可逆的调节"],"answer":[0,2,3],"explain":"答案 ACD。A 与 B 分别对应别构调节和共价修饰的两个基本特征，可逆性来自磷酸酶催化的去磷酸化。C 是三者的共同点：酶活性改变都以构象改变为基础。E 错：磷酸化可被磷酸酶水解去除，是可逆的调节方式。B 错：与底物结构相似、竞争活性中心是竞争性抑制剂的特征，别构效应物结合在活性中心以外的调节部位。","type":"X","group":"c6-03","kind":"mechanism","chs":[3,11],"vignette":"空腹时血糖下降，胰高血糖素通过 cAMP-蛋白激酶 A 级联把磷酸基团加到肝细胞内多个靶酶上。糖原磷酸化酶被磷酸化后活性升高，糖原合酶被磷酸化后活性下降，肝糖原分解释放出葡糖-6-磷酸。磷酸化还作用于双功能酶，使它表现出果糖-2,6-二磷酸酶活性，肝内果糖-2,6-二磷酸的水平随之下降。果糖-2,6-二磷酸是磷酸果糖激酶-1 的别构激活剂，又是果糖二磷酸酶-1 的别构抑制剂；它减少以后，磷酸果糖激酶-1 活性下降、果糖二磷酸酶-1 活性升高，糖酵解受到抑制而糖异生加强，更多葡糖-6-磷酸被用于合成葡萄糖，补充血糖。","vignette_title":"情景 3：饥饿时肝把开关扳向另一边","gidx":5,"gn":5,"anchor":"磷酸化还作用于双功能酶"},{"id":"gc6-04-4","ch":3,"part":1,"tag":"方案","stem":"若要把复性率由 15% 进一步提高，最合理的做法是","options":["延长超声破碎时间使包涵体颗粒变得更细更均匀","提高复性时的蛋白浓度并快速稀释除去变性剂","降低复性时的蛋白浓度并缓慢梯度除去变性剂","把透析温度由 4℃ 提高到 37℃ 以加快折叠速度","在复性缓冲液中加入 SDS 帮助蛋白保持可溶状态"],"answer":2,"explain":"C 对：折叠中间体之间的疏水相互作用是聚集失去活性的主要原因，降低蛋白浓度可减少分子间碰撞，缓慢梯度去除变性剂给肽链留出折叠时间，是提高复性率的常规策略。B 错：蛋白浓度高、变性剂撤除快都会加剧聚集，复性率更低。D 错：升温会加快聚集和蛋白酶降解，实验已在 4℃ 下进行。E 错：SDS 是变性剂，会使蛋白变性并干扰活性测定。A 错：超声只用于破碎细菌释放包涵体，对后面的复性折叠没有帮助。","type":"A1","group":"c6-04","kind":"experiment","chs":[1,3],"vignette":"研究者把一种人源酶基因克隆到表达载体中，转入大肠杆菌后诱导表达 4 小时再超声破碎。离心后上清几乎测不到活性，沉淀经洗涤后作 SDS-PAGE，在预期分子量约 45 kDa 处出现一条很浓的条带。他用 8 mol/L 尿素把沉淀溶解，装进透析袋后梯度降低尿素浓度，24 小时后测得复性样品的比活性只有天然酶的 15%。圆二色谱显示复性样品的 α-螺旋含量与天然酶相近；非还原 SDS-PAGE 上除 45 kDa 条带外，还有一条约 90 kDa 的条带，加入二硫苏糖醇后该条带消失。全过程都在 4℃ 下操作。","vignette_title":"情景 4：把折叠错误的酶重新哄回来","gidx":4,"gn":5,"anchor":"梯度降低尿素浓度"},{"id":"gc6-04-5","ch":3,"part":1,"tag":"方案","stem":"关于这一包涵体复性实验的判断，下列正确的是（X 型多选）","options":["复性时降低蛋白浓度可减少分子间的聚集","包涵体中的目的蛋白一级结构通常保持完整","二级结构恢复不等于酶的催化活性同步恢复","在 4℃ 下操作有利于减慢聚集与降解的速率","只要延长透析时间，复性率就必然达到天然酶水平"],"answer":[0,1,2,3],"explain":"答案 ABCD。B 对应电泳条带位置与预期分子量一致；B 是抑制聚集的基本策略；C 对应圆二色谱正常而比活性只有 15% 的矛盾；D 对应低温操作，可降低分子热运动，减慢聚集与降解。E 错：复性是一个部分成功的过程，错配二硫键与聚集体难以完全纠正，延长透析时间并不能保证活性回到天然酶水平。","type":"X","group":"c6-04","kind":"experiment","chs":[1,3],"vignette":"研究者把一种人源酶基因克隆到表达载体中，转入大肠杆菌后诱导表达 4 小时再超声破碎。离心后上清几乎测不到活性，沉淀经洗涤后作 SDS-PAGE，在预期分子量约 45 kDa 处出现一条很浓的条带。他用 8 mol/L 尿素把沉淀溶解，装进透析袋后梯度降低尿素浓度，24 小时后测得复性样品的比活性只有天然酶的 15%。圆二色谱显示复性样品的 α-螺旋含量与天然酶相近；非还原 SDS-PAGE 上除 45 kDa 条带外，还有一条约 90 kDa 的条带，加入二硫苏糖醇后该条带消失。全过程都在 4℃ 下操作。","vignette_title":"情景 4：把折叠错误的酶重新哄回来","gidx":5,"gn":5,"anchor":"全过程都在 4℃ 下操作"},{"ch":3,"part":1,"tag":"全酶组成","stem":"关于结合酶（全酶）组成的叙述，正确的是","options":["酶蛋白决定反应的类型和性质，辅因子决定反应的特异性","酶蛋白决定酶促反应的特异性，辅因子参与活性中心的组成，决定反应的类型和性质","辅因子均为小分子蛋白质","酶蛋白单独即具有催化活性，辅因子不参与催化","金属离子不能作为酶的辅因子"],"answer":1,"explain":"全酶由酶蛋白与辅因子组成；酶蛋白决定特异性，辅因子（辅酶、金属离子等）决定反应的类型和性质。","type":"A1","id":"c3-f4f3b152"},{"ch":3,"part":1,"tag":"活性中心","stem":"关于酶活性中心的叙述，正确的是","options":["活性中心占酶分子总体积的绝大部分","组成活性中心的必需基团在一级结构上必定彼此相邻","活性中心只能由亲水性氨基酸残基构成","辅酶不参与活性中心的组成","活性中心由结合基团与催化基团组成，多位于酶分子表面的疏水裂隙中"],"answer":4,"explain":"活性中心只占酶分子很小部分，由结合基团和催化基团构成，多位于疏水裂隙；必需基团在一级结构上可相距较远。","type":"A1","id":"c3-8cbeb831"},{"ch":3,"part":1,"tag":"催化机制","stem":"关于酶促反应特点及催化机制的叙述，正确的是","options":["酶通过降低反应活化能加速反应，不改变反应的平衡常数","酶能提高反应活化能，使底物更易被活化","酶能改变反应的平衡点，使产物生成增多","酶在催化过程中被消耗，故需不断补充","酶的催化活性与温度和 pH 无关"],"answer":0,"explain":"酶降低活化能、加快反应速度但不改变平衡常数；反应前后酶的质量和数量不变；其活性受温度和 pH 显著影响。","type":"A1","id":"c3-2687cb98"},{"ch":3,"part":1,"tag":"酶动力学","stem":"关于米氏常数 Km 与最大反应速度 Vmax 的叙述，正确的是","options":["Km 随酶浓度的增加而增大","Km 越小，表示酶与底物的亲和力越小","Vmax 随底物浓度升高而无限增大","Km 等于反应速度为最大速度一半时的底物浓度，与酶浓度无关","Km 是表示酶促反应速度大小的物理量"],"answer":3,"explain":"Km 为反应速度达 ½Vmax 时的底物浓度，是酶的特征性常数、与酶浓度无关；Km 越小亲和力越大，底物饱和后 Vmax 不再增大。","type":"A1","id":"c3-0d958513"},{"ch":3,"part":1,"tag":"可逆性抑制","stem":"关于可逆性抑制作用的叙述，正确的是","options":["竞争性抑制时 Vmax 降低而 Km 不变","非竞争性抑制时 Km 增大而 Vmax 不变","竞争性抑制剂与酶活性中心结合，增加底物浓度可减轻抑制，表现为 Km 增大、Vmax 不变","沙奎那韦抑制 HIV-1 蛋白酶，其抑制程度随底物浓度升高而增强","磺胺类药物是二氢叶酸合成酶的不可逆抑制剂"],"answer":2,"explain":"竞争性抑制可被增加底物浓度解除（Km 增大、Vmax 不变）；沙奎那韦竞争性结合 HIV-1 蛋白酶活性中心，底物增多则抑制减弱。","type":"A1","id":"c3-4ee2085b"},{"ch":3,"part":1,"tag":"酶活性调节","stem":"关于酶活性调节方式的叙述，正确的是","options":["共价修饰调节（如磷酸化）是一种不可逆的调节方式","别构效应物与酶活性中心以外的调节部位非共价结合，引起酶构象改变而调节活性","酶原激活属于别构调节，不涉及肽键断裂","酶的磷酸化修饰只能由蛋白激酶催化，不能被逆转","别构抑制剂通过与酶活性中心结合而抑制酶的活性"],"answer":1,"explain":"别构调节经活性中心以外的部位结合而改变构象；共价修饰（磷酸化/去磷酸化）可逆；酶原激活是肽键断裂的不可逆过程。","type":"A1","id":"c3-1559cd39"},{"ch":3,"part":1,"tag":"同工酶","stem":"肝细胞中的葡萄糖激酶与己糖激酶的比较，正确的是","options":["葡萄糖激酶 Km 较低，对葡萄糖亲和力高，低血糖时仍能高效催化","己糖激酶不受其产物葡萄糖-6-磷酸的反馈抑制","己糖激酶仅存在于肝和胰岛 B 细胞","同工酶是指催化不同化学反应的酶","二者催化同一反应，葡萄糖激酶 Km 较高、亲和力较低，且受胰岛素诱导"],"answer":4,"explain":"同工酶催化同一反应而分子结构不同；葡萄糖激酶 Km 高、亲和力低，仅见于肝和胰岛 B 细胞，受胰岛素诱导。","type":"A1","id":"c3-10e1aaab"},{"ch":3,"part":1,"tag":"阿斯巴甜","stem":"阿斯巴甜（天冬氨酰苯丙氨酸甲酯）甜度高、热值低，但有一类患者不宜食用，其原因是","options":["该人群缺乏苯丙氨酸羟化酶，阿斯巴甜水解产生的苯丙氨酸不能正常代谢，血苯丙氨酸升高可损害神经系统","该人群乳糖酶缺乏，不能水解阿斯巴甜","该人群葡萄糖-6-磷酸脱氢酶缺陷，食用后易发生溶血","该人群胰岛素分泌不足，阿斯巴甜可显著升高血糖","该人群钠-钾泵功能缺陷，食用后出现电解质紊乱"],"answer":0,"explain":"阿斯巴甜可水解产生苯丙氨酸；苯丙酮尿症患者苯丙氨酸羟化酶缺陷，血苯丙氨酸升高损伤神经系统，故不宜食用。","type":"A1","id":"c3-d594afbf"},{"ch":3,"part":1,"tag":"辅酶与维生素","stem":"关于辅酶与 B 族维生素对应关系的叙述，正确的是","options":["烟酰胺腺嘌呤二核苷酸（NAD+）由维生素 B1 转变而来","辅酶 A 由维生素 B12 转变而来","四氢叶酸由维生素 C 转变而来","焦磷酸硫胺素（TPP）由维生素 PP 转变而来","黄素腺嘌呤二核苷酸（FAD）由维生素 B2 转变而来"],"answer":4,"explain":"FAD、FMN 由维生素 B2 转变；NAD+、NADP+ 来自维生素 PP；辅酶 A、四氢叶酸、TPP 分别来源于泛酸、叶酸、维生素 B1。","type":"A1","id":"c3-53220c03"},{"ch":3,"part":1,"tag":"辅酶作用","stem":"关于辅酶在酶促反应中作用的叙述，正确的是","options":["NAD+ 在氧化还原反应中作为递氢体，起传递氢和电子的作用，反应中其本身被还原","FMN 在氧化还原反应中只起传递电子的作用，其本身不能被还原","四氢叶酸是转氨酶的辅酶，参与氨基酸的转氨基作用","辅酶在催化过程中被消耗，故需不断从食物中大量补充","金属离子可取代酶的辅基，故金属离子属于辅酶"],"answer":0,"explain":"NAD+ 是递氢体，接受氢和电子而被还原；FMN、FAD 也可被还原；四氢叶酸是一碳单位载体，生物素是羧化酶辅酶，转氨酶辅酶为磷酸吡哆醛。","type":"A1","id":"c3-515d0162"},{"ch":3,"part":1,"tag":"辅酶NADP+","stem":"关于 NADP+ 的叙述，正确的是","options":["NADP+ 与 NAD+ 的功能完全相同，在细胞内的分布也无差别","NADP+ 主要作为氧化供能时递氢的辅酶","NADP+ 不能接受氢，只能作为结构辅基","NADP+ 是脱羧酶的辅酶，参与 α-酮酸的氧化脱羧","NADP+ 含维生素 PP，主要作为还原当量的供体参与合成代谢中的还原反应"],"answer":4,"explain":"NADP+ 含维生素 PP，接受氢生成 NADPH；NADPH 主要作为还原当量供体参与脂肪酸、胆固醇等合成代谢的还原反应，而 NADH 参与氧化供能。","type":"A1","id":"c3-1763eb23"},{"ch":3,"part":1,"tag":"双倒数作图","stem":"用 Lineweaver-Burk 双倒数作图法分析酶促反应动力学，以 1/v 对 1/[S] 作图，所得直线的纵轴截距与横轴截距分别代表","options":["纵轴截距为 Km/Vmax，横轴截距为 Vmax","纵轴截距为 1/Km，横轴截距为 1/Vmax","纵轴截距为 1/Vmax，横轴截距为 -1/Km","纵轴截距为 Vmax，横轴截距为 Km","纵轴截距为 Km，横轴截距为 Vmax"],"answer":2,"explain":"由 1/v=(Km/Vmax)(1/[S])+1/Vmax 可知，纵轴截距为 1/Vmax，横轴截距为 -1/Km，斜率为 Km/Vmax，可用于求 Km 与 Vmax。","type":"A1","id":"c3-b3023c7b"},{"ch":3,"part":1,"tag":"反竞争性抑制","stem":"某抑制剂只与酶-底物复合物（ES）结合，不与游离酶结合，使双倒数作图的直线与无抑制剂时平行。该抑制作用属于","options":["竞争性抑制，Km 增大而 Vmax 不变","反竞争性抑制，Km 减小、Vmax 降低，底物浓度升高时抑制程度加重","非竞争性抑制，Km 不变而 Vmax 降低","不可逆抑制，使酶活性永久丧失","该抑制剂可与游离酶结合，因此提高底物浓度即可解除抑制"],"answer":1,"explain":"反竞争性抑制剂仅与 ES 结合，使表观 Km 减小、Vmax 降低；底物浓度升高使 ES 增多，抑制反而增强；双倒数直线与无抑制时平行。","type":"A1","id":"c3-e393e17f"},{"ch":3,"part":1,"tag":"温度与pH","stem":"关于温度、pH 对酶促反应影响的叙述，正确的是","options":["酶促反应速度随温度升高而持续增大，不存在最适温度","在低于最适温度时，温度升高反应加快；超过最适温度后，酶蛋白逐渐变性，反应速度反而下降","pH 对酶促反应速度没有影响，只影响酶蛋白的溶解度","胃蛋白酶的最适 pH 约为 1.8，胰蛋白酶的最适 pH 也约为 1.8","酶的最适 pH 是一个恒定值，与底物种类、缓冲液成分及酶的纯度无关"],"answer":1,"explain":"温度对酶的作用有双重性：升温加快反应，过高则酶变性失活，故存在最适温度；pH 影响必需基团解离，胃蛋白酶最适 pH 约 1.8，胰蛋白酶约 7.8。","type":"A1","id":"c3-e14c01c7"},{"ch":3,"part":1,"tag":"酶原激活","stem":"胰蛋白酶原随胰液分泌入小肠后，被肠激酶激活为胰蛋白酶，胰蛋白酶又可激活其他酶原。关于酶原激活实质的叙述，正确的是","options":["激活的本质是酶原发生别构调节，不涉及肽键断裂","激活的本质是酶原被磷酸化修饰，导致构象改变","激活时酶原因水解掉一个或几个特定肽段，使分子构象发生改变，从而形成或暴露活性中心；该过程不可逆","激活过程只是酶原浓度升高，其分子结构和构象均不改变","酶原激活只能在细胞内进行，与酶的转运和分泌过程无关"],"answer":2,"explain":"酶原激活是特异性的肽键水解，切除特定肽段后构象改变、形成或暴露活性中心，属不可逆过程，也可在分泌后于细胞外进行。","type":"A1","id":"c3-c2b3a33a"},{"ch":3,"part":1,"tag":"同工酶与临床","stem":"关于同工酶的叙述，正确的是","options":["乳酸脱氢酶（LDH）的 5 种同工酶均由同一条多肽链的不同修饰形式生成","LDH 同工酶血清谱的改变无临床意义","心肌梗死时血清中升高的主要是 LDH5，故检测 LDH5 最有价值","同工酶是指催化相同化学反应但分子结构、理化性质及免疫学性质不同的一组酶；心肌富含 LDH1，心肌梗死时血清 LDH1 活性升高","同工酶催化的化学反应不同，故不能用于判断组织损伤的部位"],"answer":3,"explain":"同工酶催化相同反应而结构不同，可实现代谢的组织特异性调节；LDH 由 H、M 两类亚基组成 5 种四聚体，心肌以 LDH1 为主，心梗时 LDH1 升高。","type":"A1","id":"c3-7617642e"},{"id":"gc10-03-1","ch":4,"part":2,"tag":"机制","stem":"脂质类似物在 30 分钟内跨层翻转的分子不足 2%，这一结果说明","options":["膜脂在脂双层两侧的分布本来就是均匀对称的","膜脂的跨层翻转速度明显高于侧向扩散速度","膜脂在质膜上不能运动，因而无法改变位置","膜脂在质膜上的运动属于逆浓度梯度的主动转运","膜脂在两侧的不对称分布难以靠快速翻转来维持"],"answer":4,"explain":"E 对：膜脂在质膜上以侧向扩散为主而跨层翻转极少，说明两侧脂质的不对称分布不可能靠快速翻转来维持。A 错：情景给出磷脂酰丝氨酸集中在内侧小叶、糖链伸向外侧，分布本就不均匀；B 错：数据恰恰说明翻转远慢于侧向扩散；C 错：膜脂能在脂双层中侧向扩散，并非固定不动；D 错：侧向扩散属被动运动，与逆浓度梯度的主动转运无关。","type":"A1","group":"c10-03","kind":"mechanism","chs":[4,8,9],"vignette":"培养的 HeLa 细胞中，带负电荷的磷脂酰丝氨酸集中在质膜脂双层的内侧小叶，糖脂与糖蛋白的糖链则伸向细胞外侧。用荧光标记的脂质类似物追踪可见：它在质膜上以侧向扩散为主，30 分钟内发生跨层翻转的分子不足 2%。膜脂主要在滑面内质网合成，随后经囊泡运输与膜接触区被递送到质膜，而胞吞又不断把质膜成分回收进细胞。若用药物破坏膜下的肌动蛋白皮质，原本集中在细胞表面的某些膜蛋白，其侧向扩散范围明显扩大，分布逐渐趋于均匀。把这批细胞置于凋亡诱导条件下 2 小时，细胞皱缩、膜表面出现大量小泡，原本只在内侧小叶的磷脂酰丝氨酸翻到了外侧。","vignette_title":"情景 3：为什么内层的磷脂不会自己翻出来","gidx":1,"gn":5,"anchor":"30 分钟内发生跨层翻转的分子不足 2%"},{"id":"gc10-03-2","ch":4,"part":2,"tag":"判读","stem":"凋亡时磷脂酰丝氨酸翻到外侧，其意义在于","options":["使细胞膜的流动性升高，细胞因此皱缩变小","作为被吞噬细胞识别并清除的信号","把细胞内多余的磷脂排出以减轻细胞负担","为膜蛋白的跨膜转运提供所需的能量","使细胞表面电荷消失，细胞彼此聚集成团"],"answer":1,"explain":"B 对：磷脂酰丝氨酸由内侧小叶翻到外侧，成为吞噬细胞识别凋亡细胞的标志，使这类细胞被及时清除。A 错：凋亡细胞的皱缩由细胞骨架收缩引起，与膜的流动性升高无关；C 错：该过程是膜内脂质在两层之间的重分布，并非把磷脂排出细胞；D 错：磷脂本身不是能量供体，跨膜转运的能量来自 ATP 水解；E 错：磷脂外翻使膜的负电荷出现在外侧，电荷并未消失，也不是细胞聚集的原因。","type":"A1","group":"c10-03","kind":"mechanism","chs":[4,8,9],"vignette":"培养的 HeLa 细胞中，带负电荷的磷脂酰丝氨酸集中在质膜脂双层的内侧小叶，糖脂与糖蛋白的糖链则伸向细胞外侧。用荧光标记的脂质类似物追踪可见：它在质膜上以侧向扩散为主，30 分钟内发生跨层翻转的分子不足 2%。膜脂主要在滑面内质网合成，随后经囊泡运输与膜接触区被递送到质膜，而胞吞又不断把质膜成分回收进细胞。若用药物破坏膜下的肌动蛋白皮质，原本集中在细胞表面的某些膜蛋白，其侧向扩散范围明显扩大，分布逐渐趋于均匀。把这批细胞置于凋亡诱导条件下 2 小时，细胞皱缩、膜表面出现大量小泡，原本只在内侧小叶的磷脂酰丝氨酸翻到了外侧。","vignette_title":"情景 3：为什么内层的磷脂不会自己翻出来","gidx":2,"gn":5,"anchor":"原本只在内侧小叶的磷脂酰丝氨酸翻到了外侧"},{"id":"gc10-03-5","ch":4,"part":2,"tag":"判读","stem":"关于细胞膜的不对称性及其维持方式，下列判断正确的是（X 型多选）","options":["磷脂酰丝氨酸平时位于内侧小叶，外翻可作为凋亡标志","糖脂与糖蛋白的糖链都伸向细胞外侧","膜的不对称性依靠膜脂的快速跨层翻转来维持","膜下微丝网络与膜蛋白的胞内段相连，限制其扩散","膜脂与膜蛋白在脂双层两侧的分布完全对称"],"answer":[0,1,3],"explain":"答案 ABD。A 对：磷脂酰丝氨酸带负电荷，平时集中在内侧小叶，凋亡时外翻成为被识别的标志；B 对：糖脂与糖蛋白的糖链伸向细胞外侧，是膜不对称性的重要表现；D 对：膜下微丝网络与膜蛋白的胞内段相连，限制膜蛋白的侧向扩散。C 错：膜脂的自发跨层翻转极少，不对称性恰恰不能靠快速翻转维持；E 错：膜脂、膜蛋白与糖类在脂双层两侧的分布是不对称的。","type":"X","group":"c10-03","kind":"mechanism","chs":[4,8,9],"vignette":"培养的 HeLa 细胞中，带负电荷的磷脂酰丝氨酸集中在质膜脂双层的内侧小叶，糖脂与糖蛋白的糖链则伸向细胞外侧。用荧光标记的脂质类似物追踪可见：它在质膜上以侧向扩散为主，30 分钟内发生跨层翻转的分子不足 2%。膜脂主要在滑面内质网合成，随后经囊泡运输与膜接触区被递送到质膜，而胞吞又不断把质膜成分回收进细胞。若用药物破坏膜下的肌动蛋白皮质，原本集中在细胞表面的某些膜蛋白，其侧向扩散范围明显扩大，分布逐渐趋于均匀。把这批细胞置于凋亡诱导条件下 2 小时，细胞皱缩、膜表面出现大量小泡，原本只在内侧小叶的磷脂酰丝氨酸翻到了外侧。","vignette_title":"情景 3：为什么内层的磷脂不会自己翻出来","gidx":5,"gn":5,"anchor":"带负电荷的磷脂酰丝氨酸集中在质膜脂双层的内侧小叶"},{"id":"gc10-04-1","ch":4,"part":2,"tag":"判读","stem":"丙组中快速恢复依然出现而缓慢恢复几乎消失，说明快速恢复","options":["依赖新合成受体自高尔基复合体的持续投递","依赖细胞质中受体经核孔向细胞表面的运输","依赖受体由内体向质膜的囊泡再循环过程","来自受体在质膜上的侧向扩散，不需消耗ATP","来自漂白区膜脂的降解以及膜结构的重建"],"answer":3,"explain":"D 对：丙组耗竭 ATP 后快速恢复照常出现，说明该相不耗能，与半分钟内即可完成的时相一起指向膜蛋白在质膜上的侧向扩散。A 错：新合成受体经高尔基复合体的投递需要时间与能量，不会在半分钟内完成；B 错：受体是膜蛋白，不经核孔运输；C 错：内体向质膜的再循环需要消耗 ATP，正是丙组所阻断的缓慢相；E 错：光漂白并不引起膜脂降解，膜结构重建也无法解释快速恢复。","type":"A1","group":"c10-04","kind":"experiment","chs":[9,8,4],"vignette":"研究生小郑在培养的成纤维细胞中表达一种 GFP 标记的膜受体，它在细胞表面呈点状分布，并不断经囊泡在质膜与内体之间循环。对照组：把细胞表面一片区域的荧光光漂白，荧光先在半分钟内快速恢复约 40%，随后在 5 分钟内缓慢恢复到约 90%。甲组：加 10 μmol/L 诺考达唑 2 小时使微管解聚，半分钟内的快速恢复不受影响，而随后的缓慢恢复明显延迟，同时胞质中载有该受体的囊泡不再由细胞中央向外周定向移动。乙组：加细胞松弛素 B 后，细胞变圆、片状伪足回缩，半分钟内的快速恢复加快到约 60%。丙组：先用叠氮钠加脱氧葡萄糖处理耗竭 ATP，再复温到 37℃ 做光漂白，只有半分钟内的快速恢复出现，缓慢恢复几乎消失。","vignette_title":"情景 4：光漂白以后，荧光是怎么回来的","gidx":1,"gn":6,"anchor":"缓慢恢复几乎消失"},{"id":"gc10-04-6","ch":4,"part":2,"tag":"判读","stem":"关于本组实验的处理与结果解释，下列判断正确的是（X 型多选）","options":["丙组的处理耗竭了ATP，阻断了依赖能量的囊泡运输","甲组的结果说明受体的侧向扩散依赖完整的微管","乙组的结果说明膜下微丝网络限制膜蛋白的侧向扩散","恢复曲线的快速相与缓慢相分别对应不同的机制","这两种药物都通过水解ATP来破坏细胞骨架"],"answer":[0,2,3],"explain":"答案 ACD。A 对：丙组用叠氮钠与脱氧葡萄糖耗竭 ATP，阻断了依赖能量的囊泡运输，缓慢相因而消失；C 对：乙组破坏微丝后快速相加快，说明膜下微丝网络限制膜蛋白的侧向扩散；D 对：快速相与缓慢相分别对应膜内扩散与囊泡再循环两种机制。B 错：甲组快速相并未受微管解聚影响，说明侧向扩散不依赖微管；E 错：诺考达唑与细胞松弛素 B 分别作用于微管蛋白与肌动蛋白，并非通过水解 ATP 破坏骨架。","type":"X","group":"c10-04","kind":"experiment","chs":[9,8,4],"vignette":"研究生小郑在培养的成纤维细胞中表达一种 GFP 标记的膜受体，它在细胞表面呈点状分布，并不断经囊泡在质膜与内体之间循环。对照组：把细胞表面一片区域的荧光光漂白，荧光先在半分钟内快速恢复约 40%，随后在 5 分钟内缓慢恢复到约 90%。甲组：加 10 μmol/L 诺考达唑 2 小时使微管解聚，半分钟内的快速恢复不受影响，而随后的缓慢恢复明显延迟，同时胞质中载有该受体的囊泡不再由细胞中央向外周定向移动。乙组：加细胞松弛素 B 后，细胞变圆、片状伪足回缩，半分钟内的快速恢复加快到约 60%。丙组：先用叠氮钠加脱氧葡萄糖处理耗竭 ATP，再复温到 37℃ 做光漂白，只有半分钟内的快速恢复出现，缓慢恢复几乎消失。","vignette_title":"情景 4：光漂白以后，荧光是怎么回来的","gidx":6,"gn":6,"anchor":"荧光先在半分钟内快速恢复约 40%"},{"id":"gc13-01-1","ch":4,"part":2,"tag":"识别","stem":"低密度组分中富集的这批膜蛋白所在的膜域，其组成特点是","options":["富含胆固醇与鞘脂，排列较有序的膜域","富含不饱和磷脂，流动性较高的膜域","由网格蛋白与衔接蛋白交联而成的膜域","由糖链在膜外侧交联而成的膜域","富含磷脂酰丝氨酸，带负电荷的膜域"],"answer":0,"explain":"A 对：情景中这批蛋白富集在冷去垢剂提取的低密度组分，而脂筏正是富含胆固醇与鞘脂、排列较有序并富集脂锚定蛋白与信号分子的膜域。B 错：富含不饱和磷脂、流动性较高的是脂筏之外的膜区，与低密度组分的富集规律相反。C 错：网格蛋白与衔接蛋白装配的是包被囊泡的衣被，不是质膜上的脂质膜域。D 错：糖链交联发生在细胞外被，与膜内脂质的有序排列无关。E 错：磷脂酰丝氨酸带负电并集中在内侧小叶，不能解释低密度组分的富集。","type":"A1","group":"c13-01","kind":"mechanism","chs":[4,5,8],"vignette":"小肠上皮细胞的刷状缘由质膜与细胞皮质共同形成的微绒毛构成。研究者把刷状缘膜分离后，在4℃用1% Triton X-100提取并做密度梯度离心：GPI锚定的碱性磷酸酶与Src家族激酶几乎都出现在低密度组分，而Na⁺-葡萄糖协同转运体留在高密度组分，两者在37℃下的侧向扩散系数相差约3倍。把样品升到37℃保温2分钟后重新提取，低密度组分中约一半的蛋白已转移到高密度组分；单分子追踪显示，37℃下这些蛋白平均每秒约有5%的分子离开所在膜域。若先用甲基-β-环糊精抽走膜上约60%的胆固醇，低密度组分几乎测不到，两种蛋白的扩散系数也随之接近。免疫电镜显示，抗碱性磷酸酶的金颗粒只结合在朝向肠腔的一侧。","vignette_title":"情景 1：低密度组分里的那批蛋白","gidx":1,"gn":6,"anchor":"GPI锚定的碱性磷酸酶与Src家族激酶"},{"id":"gc13-01-2","ch":4,"part":2,"tag":"机制","stem":"升到37℃保温后，低密度组分中约一半蛋白转移到高密度组分，这一结果说明","options":["这些蛋白在保温过程中被蛋白酶体降解清除","这些蛋白在保温过程中从膜上脱落进入水相","脂筏与周围膜之间持续交换蛋白，属动态膜域","保温同时抽走了膜上约60%的胆固醇，使脂筏消失","低密度组分由鞘脂单独构成，其中不含蛋白质"],"answer":2,"explain":"C 对：保温后约一半蛋白离开低密度组分，单分子追踪又显示这些蛋白每秒都有分子离开所在膜域，说明脂筏是与其他膜区持续交换蛋白的动态结构。A 错：若被蛋白酶体降解，蛋白总量应下降，而不是在两种组分之间重新分配。B 错：蛋白仍留在膜组分中，并未脱落进入水相。D 错：抽提胆固醇是另一组实验处理，与单纯保温这一步无关。E 错：低密度组分中恰好检出碱性磷酸酶与激酶等蛋白质，可见它并非只有脂质。","type":"A1","group":"c13-01","kind":"mechanism","chs":[4,5,8],"vignette":"小肠上皮细胞的刷状缘由质膜与细胞皮质共同形成的微绒毛构成。研究者把刷状缘膜分离后，在4℃用1% Triton X-100提取并做密度梯度离心：GPI锚定的碱性磷酸酶与Src家族激酶几乎都出现在低密度组分，而Na⁺-葡萄糖协同转运体留在高密度组分，两者在37℃下的侧向扩散系数相差约3倍。把样品升到37℃保温2分钟后重新提取，低密度组分中约一半的蛋白已转移到高密度组分；单分子追踪显示，37℃下这些蛋白平均每秒约有5%的分子离开所在膜域。若先用甲基-β-环糊精抽走膜上约60%的胆固醇，低密度组分几乎测不到，两种蛋白的扩散系数也随之接近。免疫电镜显示，抗碱性磷酸酶的金颗粒只结合在朝向肠腔的一侧。","vignette_title":"情景 1：低密度组分里的那批蛋白","gidx":2,"gn":6,"anchor":"约一半的蛋白已转移到高密度组分"},{"id":"gc13-01-3","ch":4,"part":2,"tag":"判读","stem":"抽走约60%胆固醇后低密度组分几乎测不到，两种蛋白扩散系数接近，说明","options":["胆固醇是膜蛋白合成与折叠所必需的条件","胆固醇增多会降低膜蛋白的侧向扩散速度","胆固醇通过共价键把脂筏蛋白固定在膜上","磷脂酰丝氨酸的外翻取决于胆固醇的含量","胆固醇是维持脂筏有序结构域所必需的条件"],"answer":4,"explain":"E 对：抽走胆固醇后低密度组分消失、两种蛋白的扩散行为趋于一致，说明胆固醇的有序化作用正是脂筏得以维持的条件。A 错：胆固醇属膜脂，不参与膜蛋白的合成与折叠，后者在核糖体与内质网中完成。B 错：情景抽走的是胆固醇，并未提供胆固醇增多会降低扩散速度的证据。C 错：胆固醇以疏水作用与范德华力参与膜脂排列，不与蛋白形成共价键。D 错：磷脂酰丝氨酸外翻是凋亡细胞的标志，与胆固醇含量没有直接关系。","type":"A1","group":"c13-01","kind":"mechanism","chs":[4,5,8],"vignette":"小肠上皮细胞的刷状缘由质膜与细胞皮质共同形成的微绒毛构成。研究者把刷状缘膜分离后，在4℃用1% Triton X-100提取并做密度梯度离心：GPI锚定的碱性磷酸酶与Src家族激酶几乎都出现在低密度组分，而Na⁺-葡萄糖协同转运体留在高密度组分，两者在37℃下的侧向扩散系数相差约3倍。把样品升到37℃保温2分钟后重新提取，低密度组分中约一半的蛋白已转移到高密度组分；单分子追踪显示，37℃下这些蛋白平均每秒约有5%的分子离开所在膜域。若先用甲基-β-环糊精抽走膜上约60%的胆固醇，低密度组分几乎测不到，两种蛋白的扩散系数也随之接近。免疫电镜显示，抗碱性磷酸酶的金颗粒只结合在朝向肠腔的一侧。","vignette_title":"情景 1：低密度组分里的那批蛋白","gidx":3,"gn":6,"anchor":"低密度组分几乎测不到"},{"id":"gc13-01-4","ch":4,"part":2,"tag":"机制","stem":"抗碱性磷酸酶的金颗粒只结合在朝向肠腔的一侧，据此判断该蛋白的锚定方式是","options":["其肽链贯穿脂双层，N端伸向细胞质基质","通过糖基磷脂酰肌醇锚定在脂双层外侧小叶","通过疏水跨膜段锚定在脂双层内侧小叶上","与膜下的肌动蛋白微丝共价结合而固定于膜上","通过一条脂肪酸链插入脂双层内侧小叶之中"],"answer":1,"explain":"B 对：GPI 锚定蛋白以糖基磷脂酰肌醇插入脂双层的外侧小叶，蛋白本体伸向细胞外，故金颗粒只出现在朝向肠腔的一面。A 错：贯穿脂双层的跨膜蛋白两端分别位于膜的内外两侧，与只在一侧检出不符。C 错：脂双层内侧小叶朝向细胞质，若锚在此侧，朝向肠腔的一面就检不到金颗粒。D 错：微丝结合发生在膜的胞质侧，属膜骨架连接，抗体无法把金颗粒带到肠腔面。E 错：脂肪酸链修饰同样位于面向胞质的区域，不能解释金颗粒只出现在外侧。","type":"A1","group":"c13-01","kind":"mechanism","chs":[4,5,8],"vignette":"小肠上皮细胞的刷状缘由质膜与细胞皮质共同形成的微绒毛构成。研究者把刷状缘膜分离后，在4℃用1% Triton X-100提取并做密度梯度离心：GPI锚定的碱性磷酸酶与Src家族激酶几乎都出现在低密度组分，而Na⁺-葡萄糖协同转运体留在高密度组分，两者在37℃下的侧向扩散系数相差约3倍。把样品升到37℃保温2分钟后重新提取，低密度组分中约一半的蛋白已转移到高密度组分；单分子追踪显示，37℃下这些蛋白平均每秒约有5%的分子离开所在膜域。若先用甲基-β-环糊精抽走膜上约60%的胆固醇，低密度组分几乎测不到，两种蛋白的扩散系数也随之接近。免疫电镜显示，抗碱性磷酸酶的金颗粒只结合在朝向肠腔的一侧。","vignette_title":"情景 1：低密度组分里的那批蛋白","gidx":4,"gn":6,"anchor":"金颗粒只结合在朝向肠腔的一侧"},{"id":"gc14-02-2","ch":4,"part":2,"tag":"机制","stem":"标记的 LDL 能够进入细胞并被降解，其跨膜转运的方式是","options":["与膜上 LDL 受体结合，经网格蛋白包被小窝内吞入胞","以单纯扩散的方式穿过脂双层，进入细胞质基质之中","由膜上的离子通道介导，顺电化学梯度进入细胞质","由膜上载体蛋白介导，逆浓度梯度消耗 ATP 转运","与膜受体结合后，经 G 蛋白激活腺苷酸环化酶入胞"],"answer":0,"explain":"A 对：LDL 与细胞膜上的受体特异性结合后，膜内陷形成网格蛋白包被小窝，再形成包被囊泡，经内体分选后送往溶酶体，胆固醇酯被水解为游离胆固醇供细胞利用，受体多被回收返回质膜。B 错：LDL 是体积极大的脂蛋白颗粒，不能靠单纯扩散穿过脂双层。C 错：离子通道只转运无机离子，不转运脂蛋白颗粒。D 错：LDL 是大分子复合物，其摄取并非载体介导的主动转运。E 错：受体介导的胞吞依靠网格蛋白与内体分选，并不经 G 蛋白与腺苷酸环化酶。","type":"A1","group":"c14-02","kind":"mechanism","chs":[12,4,16],"vignette":"一名 46 岁男性因双侧跟腱增粗并出现黄色瘤就诊，角膜边缘可见一圈灰白色环。血脂检查：总胆固醇 13.6 mmol/L，LDL-胆固醇 11.2 mmol/L，甘油三酯 1.4 mmol/L，HDL-胆固醇 0.8 mmol/L。取皮肤成纤维细胞培养，以 ¹²⁵I 标记的 LDL 孵育，细胞结合量仅为正常人的一半，而细胞内胆固醇酯的合成速率与正常人接近。给予他汀类药物 6 周后复查，血浆 LDL-胆固醇降至 7.9 mmol/L；肝穿标本同时显示，HMG-CoA 还原酶的 mRNA 比用药前升高 3.1 倍。医生解释，他的细胞表面识别 LDL 的受体数量不足，血浆中的胆固醇因此不能被及时清除。","vignette_title":"情景 2：从一张血脂报告到细胞表面的受体","gidx":2,"gn":5,"anchor":"取皮肤成纤维细胞培养"},{"id":"gc2-01-1","ch":4,"part":2,"tag":"识别","stem":"正常工作时，钠-钾泵每分解 1 分子 ATP 的转运结果是","options":["泵出2个Na⁺并泵入2个K⁺","泵出3个Na⁺并泵入2个Ca²⁺","泵出2个Na⁺并泵入3个K⁺","泵出3个Na⁺并泵入2个K⁺","泵出3个K⁺并泵入2个Na⁺"],"answer":3,"explain":"D 对：钠-钾泵属原发性主动转运，每分解 1 分子 ATP 把 3 个 Na⁺ 泵出细胞、2 个 K⁺ 泵入细胞，维系的正是被地高辛破坏的跨膜离子梯度。B、D 的化学计量写错；C 把 K⁺ 换成 Ca²⁺，Ca²⁺ 的排出由钙泵或 Na⁺-Ca²⁺ 交换体负责；E 把两种离子的转运方向对调。","type":"A1","group":"c2-01","kind":"mechanism","chs":[4,5,9],"vignette":"心力衰竭患者使用的强心药地高辛提取自毛花洋地黄，它的靶点很单一，就是心肌细胞质膜上的钠-钾泵。治疗浓度下，地高辛结合钠-钾泵的α亚基，使这台泵每分解1分子ATP所能转运的离子数目减少，胞质内Na⁺因而逐渐升高。心肌细胞排出Ca²⁺依赖Na⁺-Ca²⁺交换体：它借Na⁺顺浓度梯度内流的势能把Ca²⁺反向运出细胞，本身并不水解ATP。胞内Na⁺升高后，该交换体排出Ca²⁺的效率下降，胞质Ca²⁺随之上升，心肌收缩力增强。剂量过大时泵受抑过重，细胞无法维持正常的离子梯度与体积，可出现细胞肿胀与心律失常。","vignette_title":"情景 1：强心药锁住的那台泵","gidx":1,"gn":6,"anchor":"每分解1分子ATP"},{"id":"gc2-01-2","ch":4,"part":2,"tag":"机制","stem":"地高辛使心肌细胞胞质内 Na⁺ 浓度升高，其直接原因是","options":["Na⁺-Ca²⁺交换体被激活，Na⁺内流增多","钠通道开放时间延长，Na⁺内流增多","钠-钾泵被抑制，Na⁺的主动外排减少","钠-葡萄糖协同转运增强，Na⁺内流增多","质膜对Na⁺的通透性升高，Na⁺内流增多"],"answer":2,"explain":"C 对：情景给出药物结合的正是钠-钾泵的 α 亚基，泵被抑制后 Na⁺ 的主动外排减少，胞质内 Na⁺ 因而逐渐升高。B、C 说的是 Na⁺ 内流增多，地高辛并不改变钠通道的门控或质膜通透性；D 交换体并未被药物直接激活，它是被 Na⁺ 梯度推动的下游环节；E 协同转运体与强心苷的作用靶点无关。","type":"A1","group":"c2-01","kind":"mechanism","chs":[4,5,9],"vignette":"心力衰竭患者使用的强心药地高辛提取自毛花洋地黄，它的靶点很单一，就是心肌细胞质膜上的钠-钾泵。治疗浓度下，地高辛结合钠-钾泵的α亚基，使这台泵每分解1分子ATP所能转运的离子数目减少，胞质内Na⁺因而逐渐升高。心肌细胞排出Ca²⁺依赖Na⁺-Ca²⁺交换体：它借Na⁺顺浓度梯度内流的势能把Ca²⁺反向运出细胞，本身并不水解ATP。胞内Na⁺升高后，该交换体排出Ca²⁺的效率下降，胞质Ca²⁺随之上升，心肌收缩力增强。剂量过大时泵受抑过重，细胞无法维持正常的离子梯度与体积，可出现细胞肿胀与心律失常。","vignette_title":"情景 1：强心药锁住的那台泵","gidx":2,"gn":6,"anchor":"地高辛结合钠-钾泵的α亚基"},{"id":"gc2-01-3","ch":4,"part":2,"tag":"机制","stem":"心肌细胞排出 Ca²⁺ 的 Na⁺-Ca²⁺ 交换体，其转运方式属于","options":["经载体的易化扩散，两种离子同向转运","原发性主动转运，直接水解ATP提供能量","单纯扩散，Ca²⁺由高浓度一侧向低浓度一侧移动","继发性主动转运，能量来自Na⁺的浓度梯度势能","经通道的易化扩散，Ca²⁺顺浓度梯度外流"],"answer":3,"explain":"D 对：交换体本身不水解 ATP，其动力来自 Na⁺ 顺浓度梯度内流所释放的势能，属继发性主动转运，且两种离子方向相反。B 把能量来源误当作直接水解 ATP；C、D 把反向交换写成顺梯度的通道或载体易化扩散；E 混淆了单纯扩散与继发性主动转运。","type":"A1","group":"c2-01","kind":"mechanism","chs":[4,5,9],"vignette":"心力衰竭患者使用的强心药地高辛提取自毛花洋地黄，它的靶点很单一，就是心肌细胞质膜上的钠-钾泵。治疗浓度下，地高辛结合钠-钾泵的α亚基，使这台泵每分解1分子ATP所能转运的离子数目减少，胞质内Na⁺因而逐渐升高。心肌细胞排出Ca²⁺依赖Na⁺-Ca²⁺交换体：它借Na⁺顺浓度梯度内流的势能把Ca²⁺反向运出细胞，本身并不水解ATP。胞内Na⁺升高后，该交换体排出Ca²⁺的效率下降，胞质Ca²⁺随之上升，心肌收缩力增强。剂量过大时泵受抑过重，细胞无法维持正常的离子梯度与体积，可出现细胞肿胀与心律失常。","vignette_title":"情景 1：强心药锁住的那台泵","gidx":3,"gn":6,"anchor":"借Na⁺顺浓度梯度内流的势能"},{"id":"gc2-01-6","ch":4,"part":2,"tag":"判读","stem":"关于从地高辛结合钠-钾泵到心肌收缩增强的这条链条，下列判断正确的是（X 型多选）","options":["胞内Na⁺升高使交换体排出Ca²⁺的效率下降","地高辛增强收缩力是因为它激活了肌球蛋白ATP酶","Na⁺-Ca²⁺交换体的动力来自Na⁺的跨膜梯度","钠-钾泵直接水解ATP供能，属原发性主动转运","胞质Ca²⁺升高最终通过横桥摆动增强收缩力"],"answer":[0,2,3,4],"explain":"答案 ACDE。D、C、A、E 逐一对应情景中的四步链条：泵直接水解 ATP 属原发性主动转运、交换体借用 Na⁺ 的跨膜梯度、Na⁺ 升高使 Ca²⁺ 排出减少、胞质 Ca²⁺ 升高经横桥摆动增强收缩。B 错：地高辛直接作用的是钠-钾泵，并不与肌球蛋白 ATP 酶结合，收缩装置的激活是 Ca²⁺ 升高的下游结果。","type":"X","group":"c2-01","kind":"mechanism","chs":[4,5,9],"vignette":"心力衰竭患者使用的强心药地高辛提取自毛花洋地黄，它的靶点很单一，就是心肌细胞质膜上的钠-钾泵。治疗浓度下，地高辛结合钠-钾泵的α亚基，使这台泵每分解1分子ATP所能转运的离子数目减少，胞质内Na⁺因而逐渐升高。心肌细胞排出Ca²⁺依赖Na⁺-Ca²⁺交换体：它借Na⁺顺浓度梯度内流的势能把Ca²⁺反向运出细胞，本身并不水解ATP。胞内Na⁺升高后，该交换体排出Ca²⁺的效率下降，胞质Ca²⁺随之上升，心肌收缩力增强。剂量过大时泵受抑过重，细胞无法维持正常的离子梯度与体积，可出现细胞肿胀与心律失常。","vignette_title":"情景 1：强心药锁住的那台泵","gidx":6,"gn":6,"anchor":"排出Ca²⁺的效率下降"},{"id":"gc2-03-5","ch":4,"part":2,"tag":"判读","stem":"关于突触囊泡与突触前膜融合这一步，下列判断正确的是（X 型多选）","options":["该融合属胞吐，需要消耗能量才能完成","网格蛋白负责该融合处的膜拉近与融合","融合由v-SNARE与t-SNARE配对直接驱动","融合后质膜面积一直增大而不再减少","囊泡膜与质膜融合，膜成分可再循环利用"],"answer":[0,2,4],"explain":"答案 ACE。A、B、E 与情景一致：融合后膜成分被回收再利用、胞吐过程需要耗能、融合由 v-SNARE 与 t-SNARE 配对驱动。B 错：网格蛋白参与的是衣被囊泡的装配，突触囊泡的融合不经网格蛋白；D 错：融合的同时存在膜的回收，质膜面积不会单调增大。","type":"X","group":"c2-03","kind":"mechanism","chs":[8,9,4],"vignette":"神经肌肉接头处，运动神经末梢的突触囊泡内装着乙酰胆碱。囊泡在胞体形成后由驱动蛋白牵着沿轴突微管向正极运输，抵达末梢后，囊泡膜上的v-SNARE与突触前膜上的t-SNARE拉成螺旋束，把两膜拉近并驱动融合。这一步属调节型分泌：只有动作电位到达、胞质Ca²⁺升高，囊泡才与突触前膜融合并释放递质，随后膜成分被回收再利用。肉毒毒素由重链与轻链组成，轻链进入末梢后行使锌依赖的蛋白酶活性，把SNARE蛋白切断；囊泡因此停靠在膜旁却不能融合，乙酰胆碱无法释放，患者出现进行性、对称性的弛缓性麻痹。","vignette_title":"情景 3：被抓断的分子拉链","gidx":5,"gn":5,"anchor":"囊泡才与突触前膜融合并释放递质"},{"id":"gc22-01-2","ch":4,"part":2,"tag":"机制","stem":"据情景判断，该受体在膜上相互靠近并发生二聚化，所依赖的膜结构基础是","options":["膜脂可快速跨层翻转，膜蛋白随之在两小叶间往返移动","膜具有流动性，内在膜蛋白可在脂双层中发生侧向扩散","膜蛋白以共价键锚定于膜脂，其分布被脂双层所固定","脂筏为静态有序膜域，其中的膜蛋白不参与侧向扩散","膜的不对称性由糖链维持，膜蛋白的移动受糖链限制"],"answer":1,"explain":"B 对：脂双层构成膜的基本骨架并具有流动性，内在膜蛋白可在膜内发生侧向扩散，受体数目增多时彼此相遇与二聚化的概率随之升高，这是受体在膜上相互靠近的结构基础。A 错在膜脂的跨层翻转极少发生，与膜蛋白的侧向相遇无关；C 错在膜蛋白并不以共价键固定于膜脂；D 错在脂筏中的膜蛋白仍处于动态交换之中，并非不能扩散；E 错在糖链伸向膜外侧，并不限制膜蛋白在膜内的侧向移动。","type":"A1","group":"c22-01","kind":"mechanism","chs":[25,4,26],"vignette":"一名患者的手术标本做免疫印迹检测，其乳腺肿瘤细胞膜上的HER2蛋白量约为同一患者正常乳腺上皮的12倍，荧光原位杂交显示相应的基因拷贝数明显增加。血清中能与之结合的配体浓度低于正常下限，肿瘤细胞内该配体的mRNA也几乎检测不到。研究者把肿瘤细胞放在无血清培养液中培养24小时并洗去全部可溶因子，细胞内的MAPK磷酸化水平仍为正常上皮的6倍；用荧光能量转移法测得，质膜上约40%的该受体分子以二聚体形式存在，而正常细胞这一比例不足5%。该受体为单次跨膜的内在膜蛋白，胞外段结合配体，胞内段具有酪氨酸激酶活性，两个受体靠近后彼此的酪氨酸残基被磷酸化。核提取物中，Myc与CyclinD的mRNA分别升高。向培养液中加入一种分子结构与ATP相似的抑制剂后，受体的自身磷酸化下降80%，细胞在G1期的比例由42%升到76%。","vignette_title":"情景 1：血清里查不到配体，受体却一直亮着","gidx":2,"gn":5,"anchor":"该受体为单次跨膜的内在膜蛋白"},{"id":"gc22-02-1","ch":4,"part":2,"tag":"判读","stem":"原发灶细胞处理24小时后质膜上的受体只剩处理前的40%，其机制是","options":["受体被蛋白酶体降解，故质膜上的受体数目减少","受体在质膜上被蛋白酶水解，可溶胞外段释放入培养液","受体基因的转录被关闭，新合成的受体补充不足","受体被磷酸酶去磷酸化后从质膜上脱落进入胞质","受体经网格蛋白包被小窝内吞后被送入溶酶体降解"],"answer":4,"explain":"E 对：受体与配体结合后经网格蛋白包被小窝内吞，在内体中被分选送入溶酶体降解，膜上受体数目因此下降，这就是受体下调；氯喹使溶酶体水解酶失活后这一下降被阻断，免疫电镜也见受体集中在溶酶体样囊泡中。A 错在膜受体主要经溶酶体途径降解，26S 蛋白酶体降解的是胞内蛋白；B 与培养液中测不到可溶胞外段相矛盾；C 无法解释 24 小时内数目的快速下降，且不能解释氯喹的阻断效应；D 错在去磷酸化并不使受体从膜上脱落。","type":"A1","group":"c22-02","kind":"mechanism","chs":[25,4,26],"vignette":"同一名患者的原发灶与复发灶细胞分别在含表皮生长因子的培养液中连续培养。原发灶细胞受体的自身磷酸化在15分钟达到峰值，60分钟后降到峰值的12%，24小时后质膜上的受体数目只剩处理前的40%；向培养液中加入氯喹（一种使溶酶体腔内pH升高、水解酶失活的弱碱）后，质膜上的受体数目不再下降，免疫电镜显示受体集中在内体与溶酶体样的囊泡中，而培养液里自始至终测不到受体的可溶胞外段。复发灶细胞受体的胞内段泛素化位点发生突变，受体被内吞后不能被泛素标记，24小时后质膜上的受体数目仍为处理前的95%，其自身磷酸化在12小时内维持不降；该细胞中还有一种能使MAPK去磷酸化的蛋白磷酸酶，表达量降到原发灶细胞的20%。该细胞的PTEN表达缺失，Akt的磷酸化持续处于高位。撤除生长因子24小时后，复发灶细胞仍有38%进入S期，原发灶细胞只有9%。","vignette_title":"情景 2：受体降不下去的那株细胞","gidx":1,"gn":5,"anchor":"质膜上的受体数目不再下降"},{"id":"gc22-04-4","ch":4,"part":2,"tag":"识别","stem":"关于该细胞膜上表皮生长因子受体的结构特点，下列叙述正确的是","options":["单次跨膜的内在膜蛋白，胞内段具有酪氨酸激酶活性","七次跨膜的G蛋白偶联受体，经Gs激活腺苷酸环化酶","胞内受体，配体进入细胞后作为转录因子调控转录","离子通道型受体，配体结合后开放阳离子通道","脂锚定蛋白，通过糖基磷脂酰肌醇锚定于膜外侧"],"answer":0,"explain":"A 对：表皮生长因子受体是单次跨膜的内在膜蛋白，其胞外段识别并结合配体，胞内段具有酪氨酸激酶活性，配体结合后受体二聚化并相互磷酸化，这正是第二线中受体自身磷酸化升高的结构基础。B 错在它是受体酪氨酸激酶，不是七次跨膜的 G 蛋白偶联受体；C 错在它是膜受体，而不是结合脂溶性配体的胞内受体；D 错在它不属离子通道型受体；E 错在它以跨膜段插在脂双层中，并不依靠糖基磷脂酰肌醇锚定。","type":"A1","group":"c22-04","kind":"experiment","chs":[25,26,4],"vignette":"研究生小赵用一株需要表皮生长因子刺激才能进入S期的人上皮细胞做三线联合测定。第一线：把含CyclinD启动子驱动荧光素酶的质粒转入细胞，无血清培养24小时后加生长因子，6小时后荧光素酶活性升到基线的7倍；先加化合物X再加生长因子，活性只有基线的1.2倍。第二线：免疫印迹显示，单加生长因子15分钟后受体自身磷酸化升到8倍、MAPK磷酸化升到9倍、Akt磷酸化升到6倍；先加X再加生长因子，受体自身磷酸化仍为7.5倍，MAPK磷酸化只有1.1倍，Akt磷酸化仍为6倍。第三线：流式测DNA含量，单加生长因子组G1期由45%降到32%、S期由30%升到48%；先加X组G1期由45%升到78%、S期由30%降到9%。另设一组先加X再加生长因子并同时导入组成性活化的MEK突变体，荧光素酶活性回到6倍，S期比例回到44%。","vignette_title":"情景 4：三份数据把阻断点夹在了哪里","gidx":4,"gn":5,"anchor":"需要表皮生长因子刺激才能进入S期"},{"id":"gc23-01-4","ch":4,"part":2,"tag":"判读","stem":"迁移前沿质膜面积在 30 分钟内增加约 20%，其直接来源是","options":["膜脂在质膜两侧的快速跨层翻转使膜面积增大","细胞外液中的游离膜脂直接插入质膜使面积增大","中间纤维网络伸长把质膜向细胞边缘推开","膜脂在滑面内质网合成后随即自行扩散到质膜","胞质中的囊泡与质膜融合，属耗能的膜泡运输"],"answer":4,"explain":"E 对：胞吞与胞吐即膜泡运输，囊泡膜与质膜融合可把膜成分加入质膜，该过程消耗能量并需要细胞骨架参与，是迁移前沿膜面积增加的直接来源。A 错：膜脂的跨层翻转极少发生，而且翻转只是分子在两层之间重排，不能净增膜面积；B 错：膜脂是两亲性分子，不会以游离形式存在于细胞外液并直接插入质膜；C 错：中间纤维提供机械支撑，其伸长不能把质膜推向细胞边缘；D 错：膜脂在滑面内质网合成后需经囊泡运输与膜接触区递送到质膜，不能自行扩散。","type":"A1","group":"c23-01","kind":"mechanism","chs":[9,24,4],"vignette":"人真皮成纤维细胞在培养皿中长满单层后，用移液器尖划出一道宽约 1 mm 的无细胞区。6 小时后边缘细胞向空缺处迁移：前缘伸出扁平的片状伪足，其中的微丝由 Arp2/3 复合体在已有微丝的侧面成核、长出分支，把质膜向前推；前缘的微丝在正极端不断聚合、在负极端不断解聚，其净长度却保持稳定。伪足后方不断形成新的黏着斑，经整合素与基质中的纤连蛋白相连，充当牵引支点；细胞体中央的肌球蛋白 II 沿微丝滑行产生收缩，把细胞体向前拖；尾部的黏着斑解聚，尾部随之回缩。荧光定量显示，1 小时内前缘新增黏着斑约 40 个、尾部消失约 35 个。迁移前沿的质膜在 30 分钟内增加约 20%，这些膜来自胞质中囊泡与质膜的融合。","vignette_title":"情景 1：划痕边缘的四步循环","gidx":4,"gn":5,"anchor":"这些膜来自胞质中囊泡与质膜的融合"},{"id":"gc25-01-2","ch":4,"part":2,"tag":"机制","stem":"氯离子经顶膜氯通道进入管腔、水随之进入黏液层，这一过程说明","options":["氯离子经通道顺电化学梯度扩散，管腔渗透压升高使水进入","氯离子经通道逆电化学梯度转运，需要水解 ATP 释放能量","氯离子与钠离子经同一载体同向转运，属继发性主动转运","水的跨膜移动由氯通道蛋白直接完成，不依赖渗透压梯度","氯离子进入管腔后与黏蛋白结合，使黏液层的水含量升高"],"answer":0,"explain":"A 对：氯通道属通道蛋白介导的易化扩散，氯离子顺电化学梯度经通道进入管腔，管腔侧渗透压随之升高，水被动跟进，使黏液层保持水化。B 方向与通道扩散相反，通道不消耗 ATP；C 把氯通道说成同向转运体，钠离子走的是另一条通道；D 水不靠氯通道蛋白搬运，其移动由渗透压梯度驱动；E 氯离子并不与黏蛋白结合，水化程度取决于管腔的渗透压。","type":"A1","group":"c25-01","kind":"mechanism","chs":[5,4,6],"vignette":"呼吸道上皮表面由纤毛细胞、杯状细胞与基细胞构成。纤毛细胞顶部伸出约 200 根纤毛，纤毛轴心是 9 组二联微管围着 2 根中央微管，二联微管上的动力蛋白臂水解 ATP，使相邻二联体相互滑动，纤毛由此以约 12 Hz 的频率摆动，每根纤毛的基体锚定在顶部的细胞皮质中。纤毛上方覆盖的黏液层由杯状细胞分泌的黏蛋白与水构成，黏蛋白伸出的糖链与质膜外表面的糖萼同属细胞外被。黏液的稠度取决于细胞顶膜上氯通道与钠通道的活动：氯离子经通道进入管腔后，水随之进入黏液层。电镜显示，纤毛基部的胞质中密集聚集着线粒体，而纤毛内部看不到线粒体与核糖体。用糖酵解抑制剂处理后，纤毛摆动频率由 12 Hz 降到 3 Hz；另一株氯通道缺陷细胞的黏液层厚度只有对照的 40%，顶膜钠通道活性则为对照的 3 倍。","vignette_title":"情景 1：黏液纤毛清除系统里的三重配合","gidx":2,"gn":5,"anchor":"水随之进入黏液层"},{"id":"gc25-01-4","ch":4,"part":2,"tag":"判读","stem":"氯通道缺陷细胞的黏液层厚度只有对照的 40%，而顶膜钠通道活性为对照的 3 倍，最合理的解释是","options":["氯通道缺陷使杯状细胞分泌的黏蛋白减少，故黏液层厚度下降","氯离子分泌减少使进入管腔的水减少，钠重吸收增强带走管腔液","钠通道活性升高使进入管腔的水增多，黏液层被稀释而厚度下降","氯通道缺陷使纤毛摆动频率下降，黏液不能被有效推动而变薄","氯通道缺陷使钠通道活性代偿升高，黏液层的水含量随之增加"],"answer":1,"explain":"B 对：黏液层的厚度取决于管腔液的量。氯离子分泌减少使管腔渗透压下降、进入黏液层的水减少，同时钠离子被重新吸收会带走管腔液，两项变化同向叠加，使黏液脱水变稠、厚度下降。A 黏蛋白的合成与氯通道无关；C 把钠通道的方向说反，重吸收是带走水而非加水；D 厚度变化来自水化程度而非纤毛推动；E 水含量是减少而不是增加。","type":"A1","group":"c25-01","kind":"mechanism","chs":[5,4,6],"vignette":"呼吸道上皮表面由纤毛细胞、杯状细胞与基细胞构成。纤毛细胞顶部伸出约 200 根纤毛，纤毛轴心是 9 组二联微管围着 2 根中央微管，二联微管上的动力蛋白臂水解 ATP，使相邻二联体相互滑动，纤毛由此以约 12 Hz 的频率摆动，每根纤毛的基体锚定在顶部的细胞皮质中。纤毛上方覆盖的黏液层由杯状细胞分泌的黏蛋白与水构成，黏蛋白伸出的糖链与质膜外表面的糖萼同属细胞外被。黏液的稠度取决于细胞顶膜上氯通道与钠通道的活动：氯离子经通道进入管腔后，水随之进入黏液层。电镜显示，纤毛基部的胞质中密集聚集着线粒体，而纤毛内部看不到线粒体与核糖体。用糖酵解抑制剂处理后，纤毛摆动频率由 12 Hz 降到 3 Hz；另一株氯通道缺陷细胞的黏液层厚度只有对照的 40%，顶膜钠通道活性则为对照的 3 倍。","vignette_title":"情景 1：黏液纤毛清除系统里的三重配合","gidx":4,"gn":5,"anchor":"黏液层厚度只有对照的"},{"id":"gc5-03-2","ch":4,"part":2,"tag":"机制","stem":"M3受体激活后生成的IP3与DAG，其直接来源是","options":["膜内侧的胆固醇分子被酯酶水解后释放","膜脂中的磷脂酰肌醇二磷酸（PIP2）被水解","膜外侧糖蛋白的糖链被水解后释放入胞质","内在膜蛋白的胞内段被蛋白酶水解","膜脂中的磷脂酰丝氨酸与鞘磷脂被水解破坏"],"answer":1,"explain":"B对：Gq活化磷脂酶Cβ后水解膜脂中的PIP2，生成IP3与DAG，故第二信使的直接来源是膜脂质而非膜蛋白。E错：磷脂酰丝氨酸与鞘磷脂不是磷脂酶Cβ的底物，也不生成IP3与DAG。C错：糖链的水解产物不参与第二信使的生成。A错：胆固醇是膜脂成分之一，但水解胆固醇不产生IP3与DAG。D错：内在膜蛋白的胞内段被水解既不产生IP3，也不产生DAG，与第二信使的生成无关。","type":"A1","group":"c5-03","kind":"mechanism","chs":[25,4],"vignette":"支气管平滑肌细胞膜上分布着几种不同的受体。沙丁胺醇占据β2肾上腺素受体后，Gs的α亚基活化腺苷酸环化酶，胞内cAMP在2分钟内升高约6倍，PKA被激活，肌细胞舒张；乙酰胆碱占据M3受体后，经Gq激活磷脂酶Cβ，水解膜脂中的PIP2生成IP3与DAG，胞内钙离子升高，肌细胞收缩。该细胞膜上还有胰岛素受体；胞内的糖皮质激素受体也参与调节。用霍乱毒素处理后，Gs的α亚基被ADP-核糖基化，cAMP持续升高到基线的12倍。相邻的副交感神经节细胞上，乙酰胆碱作用于烟碱型受体，该受体本身就是配体门控的阳离子通道，结合后钠离子内流，细胞在20毫秒内去极化。","vignette_title":"情景 3：同一张膜上的几种受体","gidx":2,"gn":6,"anchor":"水解膜脂中的PIP2生成IP3与DAG"},{"ch":4,"part":2,"tag":"膜脂流动性","stem":"关于细胞膜脂质组成与膜流动性的叙述，正确的是","options":["膜中胆固醇含量增加可提高所有温度下的膜流动性","膜脂中饱和脂肪酸比例增加可提高膜的流动性","磷脂为两亲性分子，其亲水头部朝向脂双层内部、疏水尾部朝向膜两侧的水相","膜脂分子以侧向扩散为主，极少发生翻转运动","膜脂在脂双层内外两侧的分布完全对称"],"answer":3,"explain":"膜脂以侧向扩散为主、翻转极少；胆固醇对流动性有双向调节；饱和脂肪酸增多使流动性降低；膜脂分布不对称。","type":"A1","id":"c4-c680678d"},{"ch":4,"part":2,"tag":"膜蛋白","stem":"关于细胞膜蛋白的叙述，正确的是","options":["外周膜蛋白需用去垢剂破坏膜结构才能分离","脂锚定蛋白以 α-螺旋贯穿脂双层","内在膜蛋白的跨膜结构域常为 α-螺旋，朝向脂双层内部的氨基酸残基多为疏水性","膜蛋白在脂双层中完全不能侧向移动","膜蛋白都贯穿膜的两侧，同时暴露于膜内外"],"answer":2,"explain":"内在膜蛋白以 α-螺旋或 β-片层插膜，跨膜段为疏水残基；外周膜蛋白以非共价键结合于膜表面，改变离子强度或 pH 即可分离。","type":"A1","id":"c4-4a3baec0"},{"ch":4,"part":2,"tag":"脂筏","stem":"关于脂筏的叙述，正确的是","options":["脂筏区域的膜脂排列比周围更无序，流动性更高","脂筏是富含胆固醇和鞘脂的有序微结构域，富集特定膜蛋白和信号分子","脂筏是膜脂与膜蛋白以共价键交联形成的固定结构","脂筏只存在于内质网膜，不存在于细胞质膜","GPI 锚定蛋白不分布于脂筏中"],"answer":1,"explain":"脂筏富含胆固醇与鞘脂，排列较有序、流动性较低，富集 GPI 锚定蛋白和信号分子，参与信号转导与物质转运。","type":"A1","id":"c4-e2dc5a8b"},{"ch":4,"part":2,"tag":"跨膜转运","stem":"关于物质跨膜转运方式的叙述，正确的是","options":["葡萄糖进入红细胞属于单纯扩散","易化扩散可逆浓度梯度进行","经离子通道的转运属于主动转运","单纯扩散需要载体蛋白协助","O2、CO2 等小分子气体通过单纯扩散跨膜，顺浓度梯度，既不耗能也不需要膜蛋白"],"answer":4,"explain":"单纯扩散无载体、不耗能；葡萄糖进入红细胞为经载体（GLUT）的易化扩散，顺浓度梯度；离子通道转运属被动转运。","type":"A1","id":"c4-53ea0625"},{"ch":4,"part":2,"tag":"钠钾泵","stem":"低温、缺氧或使用代谢抑制剂时，细胞的钠-钾泵活动受到抑制。关于钠-钾泵的叙述，正确的是","options":["每分解 1 分子 ATP，将 3 个 Na+ 泵出细胞、2 个 K+ 泵入细胞，属于主动转运","每分解 1 分子 ATP，将 2 个 Na+ 泵出细胞、3 个 K+ 泵入细胞","钠-钾泵顺浓度梯度转运离子，属于易化扩散","钠-钾泵的活动与 ATP 的供应无关","哇巴因（乌本苷）可增强钠-钾泵的活性"],"answer":0,"explain":"钠-钾泵为 ATP 驱动的主动转运（3 个 Na+ 出、2 个 K+ 入）；泵受抑时跨膜离子梯度减小，静息电位难以维持。","type":"A1","id":"c4-08e93859"},{"ch":4,"part":2,"tag":"协同转运","stem":"腹泻患者口服含葡萄糖的糖盐水比单纯生理盐水更能有效纠正脱水，其主要原因是","options":["葡萄糖经单纯扩散进入肠上皮细胞，带动水的吸收","葡萄糖可直接为钠-钾泵提供能量，促进 Na+ 泵出","葡萄糖能中和肠腔内的毒素，减少肠液分泌","葡萄糖与 Na+ 经 Na+-葡萄糖协同转运体（SGLT）同向转运进入肠上皮细胞，Na+ 和葡萄糖的吸收带动水被动吸收","葡萄糖可抑制肠蠕动，延长吸收时间"],"answer":3,"explain":"SGLT 介导 Na+ 与葡萄糖同向协同转运（继发性主动转运），两者进入细胞后形成渗透梯度，带动水被动吸收。","type":"A1","id":"c4-2e737eac"},{"ch":4,"part":2,"tag":"膜泡运输","stem":"关于膜泡运输的叙述，正确的是","options":["膜泡运输只能转运小分子和离子","受体介导的胞吞（如 LDL 摄取）不需要消耗能量","出胞和入胞均需消耗能量，并依赖膜的出芽与融合","膜泡运输过程不需要细胞骨架参与","胞吞形成的囊泡不经过内体即直接与溶酶体融合"],"answer":2,"explain":"膜泡运输是大分子和颗粒物质的转运方式，依赖膜出芽与融合、消耗能量，并需细胞骨架及多种蛋白参与。","type":"A1","id":"c4-1e664506"},{"ch":4,"part":2,"tag":"膜与疾病","stem":"下列细胞膜结构与功能异常与疾病的对应关系，正确的是","options":["肾性糖尿病由胰岛 B 细胞分泌胰岛素不足引起","胱氨酸尿症由肾小管上皮细胞膜上转运载体功能缺陷引起","肿瘤细胞表面黏附分子表达增多，细胞间黏附性增强","自身免疫病的发生与细胞膜表面抗原无关","家族性高胆固醇血症由细胞膜上 LDL 受体数量增多引起"],"answer":1,"explain":"胱氨酸尿症为膜转运载体缺陷；肾性糖尿病是肾小管重吸收葡萄糖障碍；肿瘤细胞黏附分子减少、易于转移。","type":"A1","id":"c4-06309385"},{"ch":4,"part":2,"tag":"膜脂种类","stem":"关于细胞膜脂质的叙述，正确的是","options":["胆固醇的极性头部为磷酸基团，属磷脂的一种","磷脂酰丝氨酸和磷脂酰胆碱均属磷酸甘油酯；鞘脂以鞘氨醇为骨架，可分为鞘磷脂和糖脂两类","鞘磷脂属于糖脂，其极性头部为半乳糖残基","脑苷脂是含磷酸的磷脂，属磷酸甘油酯","膜脂均不带电荷，故在脂双层两侧的分布完全对称"],"answer":1,"explain":"膜脂包括磷脂（磷酸甘油酯与鞘磷脂）、糖脂和胆固醇；鞘磷脂为鞘脂而非糖脂，脑苷脂属糖脂、不含磷酸；胆固醇极性头部为羟基。","type":"A1","id":"c4-7439ad5a"},{"ch":4,"part":2,"tag":"去垢剂","stem":"关于去垢剂在膜蛋白研究中的应用，叙述正确的是","options":["去垢剂只能溶解处于膜外侧的外周膜蛋白","SDS 是非离子型去垢剂，作用温和，不引起蛋白质变性","Triton X-100 为离子型去垢剂，可使蛋白质完全变性","去垢剂是两亲性分子，能与膜蛋白的疏水跨膜区结合形成可溶性复合物，使内在膜蛋白从膜上溶解下来","去垢剂通过水解磷脂的酯键来溶解细胞膜"],"answer":3,"explain":"去垢剂是两亲性分子，可插入脂双层并形成混合微团，使内在膜蛋白溶解；SDS 为离子型（使蛋白变性），Triton X-100 为非离子型，作用较温和。","type":"A1","id":"c4-c54f7877"},{"ch":4,"part":2,"tag":"膜的不对称性","stem":"关于细胞膜不对称性的叙述，正确的是","options":["膜脂、膜蛋白和糖类在脂双层两侧的分布都是对称的","磷脂酰丝氨酸主要分布于脂双层外侧，其外翻是细胞凋亡的标志之一","膜的不对称性由膜脂的快速翻转运动维持","膜的流动性越高，膜的不对称性越明显","糖脂和糖蛋白的糖链均伸向膜外侧，磷脂酰丝氨酸主要分布于内侧小叶，内在膜蛋白嵌入膜的方向也不对称"],"answer":4,"explain":"膜脂、膜蛋白与糖类在脂双层两侧分布不对称：糖链位于膜外表面，磷脂酰丝氨酸等带负电磷脂主要在内侧小叶，其外翻是凋亡信号。","type":"A1","id":"c4-ec228dc7"},{"ch":4,"part":2,"tag":"载体与通道","stem":"关于经膜转运蛋白介导的被动转运（易化扩散）的叙述，正确的是","options":["经载体介导的转运具有结构特异性、饱和现象和竞争性抑制；离子通道常呈高速转运而无明显饱和，且具门控特性","经通道的转运具有饱和现象，其转运速率随浓度升高而达到最大值","经载体的转运不需要膜蛋白构象改变","易化扩散可逆浓度梯度进行，因而需要消耗 ATP","离子通道持续开放，其开闭不受细胞信号调节"],"answer":0,"explain":"载体转运需结合底物并改变构象，速度较慢、有饱和与竞争；通道转运速率高、无明显饱和，并受化学、电压等门控调节而开放或关闭。","type":"A1","id":"c4-f321a461"},{"ch":4,"part":2,"tag":"主动转运类型","stem":"关于主动转运的叙述，正确的是","options":["继发性主动转运直接水解 ATP 供能","两者均逆浓度梯度转运，故均为被动转运","原发性主动转运直接消耗 ATP，继发性主动转运所需能量来自另一种物质顺浓度梯度转运所释放的势能","原发性主动转运不需要膜蛋白参与","继发性主动转运只能同向转运，不能反向转运"],"answer":2,"explain":"原发性主动转运（如钠-钾泵、钙泵）直接水解 ATP 供能；继发性主动转运利用 Na+ 等离子的电化学梯度势能，可同向协同转运，也可反向交换。","type":"A1","id":"c4-ed94d9de"},{"ch":4,"part":2,"tag":"受体介导内吞","stem":"关于低密度脂蛋白（LDL）受体介导的胞吞，叙述正确的是","options":["LDL 与受体结合后经非包被小窝随机形成囊泡，不依赖网格蛋白","受体介导的胞吞只能转运营养物质，不能摄取信号分子或病原体","LDL 受体介导的胞吞过程不需要消耗能量","LDL 与细胞膜上的 LDL 受体特异性结合，膜内陷形成网格蛋白包被小窝、进而形成包被囊泡，经内体分选后进入溶酶体降解","所有被胞吞的受体均在溶酶体内被降解，无一可被回收再利用"],"answer":3,"explain":"LDL 与受体结合后聚集于有被小窝，由网格蛋白包被形成囊泡，经内体分选将 LDL 送往溶酶体降解，受体常被回收返回质膜继续利用。","type":"A1","id":"c4-ef0c4e98"},{"ch":4,"part":2,"tag":"膜受体病","stem":"家族性高胆固醇血症患者血中胆固醇显著升高，其分子机制主要是","options":["细胞膜上 LDL 受体数量显著增多，使细胞摄取胆固醇过多","细胞膜上 LDL 受体数量减少或功能缺陷，细胞摄取 LDL 障碍，血中胆固醇不能被有效清除","肝细胞 HMG-CoA 还原酶活性完全丧失，胆固醇合成停止","细胞膜上 LDL 受体结构完全正常，仅因饮食脂肪过多而致病","溶酶体水解酶缺乏，使细胞内胆固醇不能被水解而堆积"],"answer":1,"explain":"该病多为 LDL 受体基因突变所致：受体减少或功能缺陷使细胞摄取 LDL 障碍，血浆胆固醇清除受阻而显著升高，是典型的膜受体病。","type":"A1","id":"c4-747d9835"},{"ch":4,"part":2,"tag":"流动镶嵌模型","stem":"关于细胞膜流动镶嵌模型的叙述，正确的是","options":["脂双层是静态结构，膜脂和膜蛋白均不能移动","膜蛋白通过共价键均匀地铺满脂双层表面","该模型认为膜表面完全由蛋白质覆盖，脂质位于膜的内部核心","该模型不承认膜结构的不对称性","脂双层构成膜的骨架，具有流动性；蛋白质以不同方式镶嵌于脂双层中，多数可侧向移动，膜呈不对称结构"],"answer":4,"explain":"流动镶嵌模型的核心是：脂双层为基本骨架并具流动性，蛋白质镶嵌或贯穿其中、可侧向扩散，膜内外两侧在组成与功能上不对称。","type":"A1","id":"c4-d4da6bc3"},{"id":"gc11-02-4","ch":5,"part":2,"tag":"判读","stem":"尿酸盐结晶在关节滑液中析出，与该处细胞外微环境理化条件的关系是","options":["滑液温度偏低且 pH 偏低，尿酸盐的溶解度下降","滑液温度偏高且 pH 偏高，尿酸盐的溶解度下降","滑液渗透压升高，尿酸盐被浓缩后析出结晶","滑液中钙离子浓度升高，与尿酸盐形成不溶钙盐","滑液的氧分压升高，尿酸被氧化为难溶的产物"],"answer":0,"explain":"A 对：尿酸盐的溶解度随温度与 pH 下降而降低，第一跖趾关节位置表浅、温度低于核心体温，滑液 pH 约 5.4 也偏酸，尿酸盐在此处先达到过饱和并析出针状结晶，沉积后引起红肿热痛。B 错：温度与 pH 升高都使溶解度上升，与结晶析出矛盾。C 错：滑液渗透压升高并不使尿酸盐大量析出，结晶的直接前提是过饱和。D 错：尿酸盐结晶不是钙盐，滑液中的钙不会与尿酸形成不溶沉淀。E 错：尿酸的氧化需要尿酸氧化酶，人体缺乏此酶，氧分压升高也不会生成难溶的氧化产物。","type":"A1","group":"c11-02","kind":"mechanism","chs":[15,14,5],"vignette":"一位 52 岁男性因弥漫大 B 细胞淋巴瘤接受联合化疗，近三日因恶心呕吐几乎未进食。用药第 3 天出现少尿：血尿酸由 318 μmol/L 升至 620 μmol/L，血肌酐 186 μmol/L，血钾 5.8 mmol/L，尿 pH 5.0。同日右足第一跖趾关节红肿热痛，关节腔穿刺抽出淡黄色滑液，偏振光镜下见大量针状结晶，测得该关节滑液 pH 约 5.4，局部温度低于核心体温。医生分析，化疗后肿瘤细胞大量破坏，而其嘌呤核苷酸的合成与分解原本都很活跃：核酸分解产生的嘌呤碱依次转变为次黄嘌呤与黄嘌呤，人体分解嘌呤的最后一步与多数哺乳动物不同，产物就是血中升高的尿酸；它在体液中溶解度有限，超过饱和度后即在理化条件不利的关节滑液中析出结晶，沉积于关节、软组织与肾。医生给予别嘌呤醇并嘱多饮水。","vignette_title":"情景 2：从一堆破碎的细胞到一个红肿的关节","gidx":4,"gn":6,"anchor":"局部温度低于核心体温"},{"id":"gc13-01-5","ch":5,"part":2,"tag":"识别","stem":"情景中刷状缘微绒毛的结构基础是","options":["由微管构成的运动性突起，可推动肠腔内容物","由质膜内陷形成的管状结构，与溶酶体相互连通","由细胞外基质的突起构成，其中不含骨架成分","由质膜与细胞皮质构成的指状突起，轴心为微丝束","由脂筏与网格蛋白包被组装而成的膜性突起"],"answer":3,"explain":"D 对：微绒毛是质膜与细胞皮质共同向外伸出的指状突起，轴心为平行排列的肌动蛋白微丝束，因而能大幅扩大吸收面积，如小肠的刷状缘。A 错：由微管构成的运动性突起是纤毛与鞭毛，不是微绒毛。B 错：质膜内陷形成的管状结构属胞吞与内体系统，与微绒毛的伸出方向相反。C 错：微绒毛属细胞表面的突起，其中含丰富的骨架成分。E 错：网格蛋白装配的是包被囊泡的衣被，与微绒毛的骨架基础无关。","type":"A1","group":"c13-01","kind":"mechanism","chs":[4,5,8],"vignette":"小肠上皮细胞的刷状缘由质膜与细胞皮质共同形成的微绒毛构成。研究者把刷状缘膜分离后，在4℃用1% Triton X-100提取并做密度梯度离心：GPI锚定的碱性磷酸酶与Src家族激酶几乎都出现在低密度组分，而Na⁺-葡萄糖协同转运体留在高密度组分，两者在37℃下的侧向扩散系数相差约3倍。把样品升到37℃保温2分钟后重新提取，低密度组分中约一半的蛋白已转移到高密度组分；单分子追踪显示，37℃下这些蛋白平均每秒约有5%的分子离开所在膜域。若先用甲基-β-环糊精抽走膜上约60%的胆固醇，低密度组分几乎测不到，两种蛋白的扩散系数也随之接近。免疫电镜显示，抗碱性磷酸酶的金颗粒只结合在朝向肠腔的一侧。","vignette_title":"情景 1：低密度组分里的那批蛋白","gidx":5,"gn":6,"anchor":"由质膜与细胞皮质共同形成的微绒毛"},{"id":"gc2-01-4","ch":5,"part":2,"tag":"判读","stem":"中毒剂量下患者出现细胞肿胀，与之联系最紧密的环节是","options":["钙泵受抑使胞内Ca²⁺升高，细胞骨架解聚而肿胀","胞内ATP蓄积使蛋白质合成加快，细胞体积增大","胞外Na⁺蓄积使渗透压升高，水外流而细胞皱缩","胞内K⁺蓄积使渗透压升高，水内流而细胞肿胀","胞内Na⁺蓄积使渗透压升高，水内流而细胞肿胀"],"answer":4,"explain":"E 对：泵受抑使 Na⁺ 不能外排而在胞内蓄积，胞内渗透压升高、水随之内流，细胞体积调节失效而肿胀。B 泵受抑时 K⁺ 是泵不进来而不是蓄积在胞内；C 写反了水的流向，且 Na⁺ 升高发生在胞内；D 地高辛不抑制钙泵；E 泵受抑时 ATP 消耗减少，也谈不上蛋白质合成加快。","type":"A1","group":"c2-01","kind":"mechanism","chs":[4,5,9],"vignette":"心力衰竭患者使用的强心药地高辛提取自毛花洋地黄，它的靶点很单一，就是心肌细胞质膜上的钠-钾泵。治疗浓度下，地高辛结合钠-钾泵的α亚基，使这台泵每分解1分子ATP所能转运的离子数目减少，胞质内Na⁺因而逐渐升高。心肌细胞排出Ca²⁺依赖Na⁺-Ca²⁺交换体：它借Na⁺顺浓度梯度内流的势能把Ca²⁺反向运出细胞，本身并不水解ATP。胞内Na⁺升高后，该交换体排出Ca²⁺的效率下降，胞质Ca²⁺随之上升，心肌收缩力增强。剂量过大时泵受抑过重，细胞无法维持正常的离子梯度与体积，可出现细胞肿胀与心律失常。","vignette_title":"情景 1：强心药锁住的那台泵","gidx":4,"gn":6,"anchor":"可出现细胞肿胀与心律失常"},{"id":"gc25-01-1","ch":5,"part":2,"tag":"识别","stem":"情景所述纤毛轴心的微管排列方式是","options":["9 组三联微管围在 2 根中央微管的外周","2 组二联微管围在 9 根中央微管的外周","9 组二联微管围在 2 根中央微管的外周","9 组二联微管围在 1 根中央微管的外周","9 组单管微管围在 2 根中央微管的外周"],"answer":2,"explain":"C 对：情景直接写出纤毛轴心是 9 组二联微管围着 2 根中央微管，即通常所说的 9 加 2 排列，二联微管上附有动力蛋白臂。A 把二联微管误作三联微管，三联微管是中心体与基体的排列方式；B 把二联微管与中央微管的数目写反；D 把中央微管写成 1 根；E 把成对的二联微管误作单管微管。","type":"A1","group":"c25-01","kind":"mechanism","chs":[5,4,6],"vignette":"呼吸道上皮表面由纤毛细胞、杯状细胞与基细胞构成。纤毛细胞顶部伸出约 200 根纤毛，纤毛轴心是 9 组二联微管围着 2 根中央微管，二联微管上的动力蛋白臂水解 ATP，使相邻二联体相互滑动，纤毛由此以约 12 Hz 的频率摆动，每根纤毛的基体锚定在顶部的细胞皮质中。纤毛上方覆盖的黏液层由杯状细胞分泌的黏蛋白与水构成，黏蛋白伸出的糖链与质膜外表面的糖萼同属细胞外被。黏液的稠度取决于细胞顶膜上氯通道与钠通道的活动：氯离子经通道进入管腔后，水随之进入黏液层。电镜显示，纤毛基部的胞质中密集聚集着线粒体，而纤毛内部看不到线粒体与核糖体。用糖酵解抑制剂处理后，纤毛摆动频率由 12 Hz 降到 3 Hz；另一株氯通道缺陷细胞的黏液层厚度只有对照的 40%，顶膜钠通道活性则为对照的 3 倍。","vignette_title":"情景 1：黏液纤毛清除系统里的三重配合","gidx":1,"gn":5,"anchor":"9 组二联微管围着 2 根中央微管"},{"id":"gc25-01-5","ch":5,"part":2,"tag":"判读","stem":"关于本情景中细胞表面的特化结构与其功能，下列判断正确的是（X 型多选）","options":["纤毛摆动时基体承受剪切力，细胞皮质为其提供机械支撑","黏液层本身就是细胞外被，两者是同一结构的不同称呼","细胞皮质由胶原纤维构成，为细胞提供细胞外的支撑","糖萼位于质膜外表面，参与细胞识别、黏附与保护","氯离子经通道进入管腔，改变黏液层的水化程度"],"answer":[0,3,4],"explain":"答案 ADE。A 对：基体锚定在顶部的细胞皮质中，细胞皮质是质膜内侧的膜骨架，为纤毛摆动提供机械支撑。D 对：糖萼由质膜表面糖蛋白与糖脂伸出的糖链构成，参与识别、黏附与保护。E 对：氯离子经通道进入管腔改变管腔渗透压，从而改变黏液层的水化程度。B 错：细胞外被是质膜外表面的糖链层，黏液层是杯状细胞分泌的黏蛋白与水，来源不同；C 错：胶原纤维属细胞外基质，细胞皮质以肌动蛋白微丝为主。","type":"X","group":"c25-01","kind":"mechanism","chs":[5,4,6],"vignette":"呼吸道上皮表面由纤毛细胞、杯状细胞与基细胞构成。纤毛细胞顶部伸出约 200 根纤毛，纤毛轴心是 9 组二联微管围着 2 根中央微管，二联微管上的动力蛋白臂水解 ATP，使相邻二联体相互滑动，纤毛由此以约 12 Hz 的频率摆动，每根纤毛的基体锚定在顶部的细胞皮质中。纤毛上方覆盖的黏液层由杯状细胞分泌的黏蛋白与水构成，黏蛋白伸出的糖链与质膜外表面的糖萼同属细胞外被。黏液的稠度取决于细胞顶膜上氯通道与钠通道的活动：氯离子经通道进入管腔后，水随之进入黏液层。电镜显示，纤毛基部的胞质中密集聚集着线粒体，而纤毛内部看不到线粒体与核糖体。用糖酵解抑制剂处理后，纤毛摆动频率由 12 Hz 降到 3 Hz；另一株氯通道缺陷细胞的黏液层厚度只有对照的 40%，顶膜钠通道活性则为对照的 3 倍。","vignette_title":"情景 1：黏液纤毛清除系统里的三重配合","gidx":5,"gn":5,"anchor":"黏蛋白伸出的糖链"},{"ch":5,"part":2,"tag":"三层结构","stem":"细胞表面具有三层基本结构，由细胞外向内依次是","options":["细胞皮质、质膜、细胞外被（糖萼）","质膜、细胞外被（糖萼）、细胞皮质","细胞外被（糖萼）、质膜、细胞皮质","细胞外被（糖萼）、细胞皮质、质膜","质膜、细胞皮质、细胞外被（糖萼）"],"answer":2,"explain":"细胞表面自外向内为细胞外被（糖萼）、质膜、细胞皮质；细胞皮质位于质膜内侧，含微丝等膜骨架成分。","type":"A1","id":"c5-c7568011"},{"ch":5,"part":2,"tag":"糖萼","stem":"关于细胞外被（糖萼）的叙述，正确的是","options":["位于质膜内侧，主要由肌动蛋白微丝构成","是跨膜蛋白形成的通道结构，负责离子的跨膜转运","仅在细胞有丝分裂期出现，间期消失","由纤维素和几丁质构成，与细胞识别无关","由质膜表面糖蛋白和糖脂伸出的糖链构成，参与细胞识别、黏附、保护与信息感受"],"answer":4,"explain":"糖萼是质膜外表面的糖链层，介导细胞识别、黏附与微环境感受；微丝构成的膜骨架属细胞皮质而非糖萼。","type":"A1","id":"c5-917aadc1"},{"ch":5,"part":2,"tag":"细胞皮质","stem":"细胞皮质（细胞膜骨架）的主要组成及其功能是","options":["由肌动蛋白微丝等构成的膜骨架，维持细胞形态并赋予质膜机械支撑","由脂双层构成，是物质跨膜转运的主要屏障","由糖链构成，主要介导白细胞与血管内皮细胞的暂时性黏附","由胶原纤维构成，为细胞提供细胞外支撑","由核纤层蛋白构成，维持细胞核的形态"],"answer":0,"explain":"细胞皮质是紧贴质膜内侧的膜骨架，以肌动蛋白微丝为主；脂双层属质膜，胶原纤维属细胞外基质，核纤层属细胞核。","type":"A1","id":"c5-ba8703c4"},{"ch":5,"part":2,"tag":"微环境","stem":"关于细胞表面与其微环境的相互关系，叙述正确的是","options":["微环境只能单向影响细胞，细胞不能改变微环境","细胞表面只能感受化学信号，不能感受生物电等物理因素","细胞表面与微环境的相互作用仅见于病理状态","微环境中的氧还状态、生物电、渗透压、细胞因子等既能影响细胞功能，其水平也受细胞感受与调控","细胞微环境即细胞外液，其成分在生理条件下完全恒定"],"answer":3,"explain":"小结指出细胞表面是细胞与微环境相互作用、感受并调控氧还状态、生物电、渗透压、细胞因子的场所，这种双向作用持续存在。","type":"A1","id":"c5-c55601f0"},{"ch":5,"part":2,"tag":"生物尺度律","stem":"医学生小李将小鼠的有效剂量按体重线性外推至人体，结果发现自己的推测并不准确。关于生物尺度律，叙述正确的是","options":["代谢率与体重成正比，故按体重折算剂量最为可靠","体表面积与体重不成线性关系，小动物单位体重代谢率高于大动物，故跨物种剂量常按体表面积折算","体表面积随体重增加而线性增加","生物尺度律只适用于药物剂量计算，与能量代谢无关","大型哺乳动物的单位体重代谢率高于小型哺乳动物"],"answer":1,"explain":"体表面积约与体重的2/3次方相关，代谢率与体表面积的相关性优于与体重的相关性，故跨物种剂量常按体表面积折算。","type":"A1","id":"c5-0e3c8546"},{"ch":5,"part":2,"tag":"表面标志物","stem":"正常细胞、病原体与受损细胞表达的分子不同，可被模式识别受体（PRRs）识别以区分自己与异己、正常与病变。下列组合正确的是","options":["正常细胞表达PAMPs，病原体表达SAMPs","正常细胞表达DAMPs，受损细胞表达SAMPs","正常细胞表达SAMPs，病原体表达PAMPs，细胞表面受损时产生和释放DAMPs，三者均可被PRRs识别","SAMPs、PAMPs、DAMPs均由病原体产生","PRRs只能识别病原体来源的PAMPs"],"answer":2,"explain":"小结明确正常细胞表达SAMPs、病原体表达PAMPs、细胞表面受损时释放DAMPs，三者均可被PRRs识别，是识别自己与异己的依据。","type":"A1","id":"c5-f721576d"},{"ch":5,"part":2,"tag":"胞外ATP","stem":"促进细胞释放ATP与抑制细胞释放ATP均可用于疾病治疗，其合理解释是","options":["ATP仅是细胞内能量货币，与细胞外信号无关","细胞外ATP与炎症、免疫反应无关，故两种策略互不相干","促进与抑制同一过程作用相反，不可能都产生疗效","细胞外ATP只能抑制免疫细胞，故仅用于免疫抑制治疗","细胞外ATP可作为信号分子启动炎症、免疫与组织修复，增强其释放可用于抗感染、抗肿瘤；当其过度释放引起病理性炎症或疼痛时，抑制释放或阻断其受体则可用于治疗"],"answer":4,"explain":"细胞外ATP具有信号分子作用，参与炎症、免疫与修复，作用呈双面性，因此增强或抑制其释放均可能成为治疗策略。","type":"A1","id":"c5-582a744c"},{"ch":5,"part":2,"tag":"渗透压调节","stem":"长期高盐饮食引起渗透质与电解质紊乱，参与高血压、代谢综合征等病理进程，其细胞学基础主要是","options":["高盐直接溶解细胞膜的脂双层，使细胞破裂","细胞外液渗透压升高时细胞完全不发生调节，被动皱缩死亡","高盐只作用于肾小管，与细胞表面无关","细胞外液渗透压升高时，细胞通过转运及合成、释放渗透质（如Na+、K+、山梨醇、肌醇等）调节体积，长期紊乱影响细胞功能","高盐饮食使细胞内渗透质浓度升高而细胞外液渗透压不变"],"answer":3,"explain":"细胞面对高渗环境需靠渗透质（电解质与有机小分子）的转运、合成与释放维持体积；长期高盐导致渗透质与电解质紊乱，参与高血压等疾病。","type":"A1","id":"c5-0838010e"},{"ch":5,"part":2,"tag":"凝集素","stem":"细胞表面的糖链参与细胞识别，其携带的信息常由一类能特异性结合糖链的蛋白质来解读。关于这类蛋白（凝集素）的叙述，正确的是","options":["凝集素是一类以糖链为底物、催化糖链水解的酶，其活性中心含丝氨酸残基","凝集素是可特异性结合糖链的非酶、非抗体蛋白，参与细胞识别、黏附以及对病原体糖链的识别与清除","凝集素仅由病原体表达，是宿主免疫细胞识别与攻击的靶标","凝集素只能识别单糖的种类，不能辨别糖链的连接方式与空间构型","凝集素与糖链结合时需水解 ATP，属于逆浓度梯度的主动转运"],"answer":1,"explain":"凝集素特异性识别并结合糖链，本身既不是酶也不是抗体，是糖链-凝集素识别系统的基础，参与细胞识别、黏附与病原体清除。","type":"A1","id":"c5-137a8c00"},{"ch":5,"part":2,"tag":"膜骨架蛋白","stem":"红细胞在血流剪切力作用下仍能维持双凹盘形并保持变形性，这与质膜内侧的膜骨架密切相关。关于该膜骨架的叙述，正确的是","options":["由微管与中间纤维交织成网，通过共价键与质膜脂双层结合","由跨膜蛋白带 3 蛋白自身聚合成刚性网架，不需要其他连接蛋白参与","血影蛋白四聚体经锚蛋白与带 3 蛋白相连、经 4.1 蛋白与肌动蛋白及糖蛋白 A 相连，形成支撑质膜的网状结构","主要由胆固醇与鞘脂组成的有序膜结构域，位于糖萼的外侧","位于细胞外被中，通过与血浆纤维蛋白交联维持细胞形态"],"answer":2,"explain":"红细胞膜骨架是血影蛋白-肌动蛋白网络，经锚蛋白、4.1 蛋白与带 3 蛋白和糖蛋白 A 连接，赋予质膜机械支撑与变形能力。","type":"A1","id":"c5-cf67fe47"},{"ch":5,"part":2,"tag":"微绒毛","stem":"小肠上皮细胞朝向肠腔的一面有大量微绒毛。关于微绒毛的叙述，正确的是","options":["是质膜与细胞皮质共同形成的指状突起，轴心为平行排列的肌动蛋白微丝束（含绒毛蛋白），可显著扩大细胞表面面积","是由微管构成的运动性突起，其摆动可推动肠腔内容物前进","是质膜内陷形成的管状结构，内与溶酶体相通，用于摄取大分子物质","由脂筏与网格蛋白包被组装而成，其数量随细胞胞吞活动的强弱而增减","是细胞外基质向细胞表面的突起，不含细胞骨架成分"],"answer":0,"explain":"微绒毛以平行排列的肌动蛋白微丝束为核心，由质膜与细胞皮质向外突出，极大增加上皮细胞的吸收面积，如小肠刷状缘。","type":"A1","id":"c5-e646d918"},{"ch":5,"part":2,"tag":"机械感受","stem":"血管内皮细胞、成骨细胞等在血流剪切力、牵张力作用下可改变自身的形态与功能。细胞感受这类机械刺激最直接的机制是","options":["机械力使质膜脂双层发生相变，进而直接磷酸化细胞质中的蛋白质","机械力经糖萼直接进入细胞核，调控基因的转录","机械力必须经胞吞作用转变为化学信号后才能被细胞感知","机械敏感离子通道被牵张开放，引起 Ca2+ 等内流并触发胞内信号转导","机械力只通过细胞外液渗透压的变化传递，与膜蛋白无关"],"answer":3,"explain":"细胞表面的机械敏感离子通道（辅以膜-细胞骨架连接）可直接把牵张、剪切力转变为 Ca2+ 内流等信号，是感受力学微环境的基本机制。","type":"A1","id":"c5-32d8da40"},{"ch":5,"part":2,"tag":"表面积体积比","stem":"细胞体积增大时，其表面积与体积之比（表面积/体积）随之下降。关于这一关系及其意义的叙述，正确的是","options":["细胞体积越大，单位体积可用的膜表面越多，物质交换效率越高","表面积/体积比随细胞体积增大而下降，限制细胞不能无限增大，也解释了许多细胞以细长、扁平或带突起的形态存在","对球形细胞而言其表面积与直径成正比，故表面积/体积比与体积无关","表面积/体积比只影响细胞的机械稳定性，不影响物质跨膜交换的速率","细胞越小物质交换效率越低，故细胞体积越大对代谢越有利"],"answer":1,"explain":"表面积/体积比与细胞半径成反比：体积越大，单位体积可用的膜面积越小，物质交换与散热效率越低，故细胞体积受到限制。","type":"A1","id":"c5-d734c14b"},{"ch":5,"part":2,"tag":"缺血再灌注","stem":"心肌梗死后尽早恢复血流是救治的关键，但再灌注本身也可加重细胞损伤。下列机制与再灌注损伤关系最密切的是","options":["再灌注时细胞内 ATP 才开始迅速耗竭，钠-钾泵立即失活","再灌注时细胞外渗透压骤降，细胞吸水膨胀而破裂","再灌注使细胞外被的糖链被完全水解，细胞失去识别能力","再灌注造成的损伤纯粹由血流的机械冲刷引起，与活性氧无关","缺血时钙泵、钠泵失调导致钙超载，再灌注时氧供恢复引发活性氧爆发、膜脂质过氧化并激活白细胞与补体，加重细胞表面与细胞的损伤"],"answer":4,"explain":"缺血-再灌注损伤的核心是钙超载与活性氧爆发：膜脂质过氧化、白细胞与补体激活共同导致细胞表面及细胞结构的损伤加重。","type":"A1","id":"c5-308f69a4"},{"ch":5,"part":2,"tag":"补体调节蛋白","stem":"补体活化的终末阶段可形成膜攻击复合物（MAC）而在细胞膜上打孔。正常自身细胞通常不被自身补体溶解，其主要原因是","options":["自身细胞表面不表达任何可与补体成分结合的膜蛋白","自身细胞膜不含磷脂，补体无法在膜上完成组装","自身细胞膜上存在 CD59、DAF（CD55）等补体调节蛋白，可抑制补体级联反应与 MAC 的组装","补体只在病原体表面被激活，与自身细胞表面的性质无关","自身细胞通过胞吐把已结合的补体成分排出细胞外"],"answer":2,"explain":"自身细胞依靠膜上的 CD59、DAF、MCP 等补体调节蛋白限制自身补体的活化与 MAC 形成；这类 GPI 锚定蛋白缺失可致阵发性睡眠性血红蛋白尿。","type":"A1","id":"c5-974b1548"},{"ch":5,"part":2,"tag":"生物电","stem":"皮肤、角膜损伤后，创面附近可测到内源性直流电场，上皮细胞会朝特定方向迁移而加速愈合。关于细胞表面与生物电的叙述，正确的是","options":["细胞可感受内源性电场并发生定向迁移，该过程与膜电位变化、离子通道及细胞骨架的参与有关","内源性电场由损伤细胞的膜电位梯度形成，细胞并不能感受该电场","细胞静息电位只由钠-钾泵决定，与膜上离子通道的通透性无关","生物电只影响神经、肌肉等可兴奋细胞，对上皮细胞没有影响","细胞内外的电位差主要由细胞外液中的蛋白质产生"],"answer":0,"explain":"损伤处形成的内源性电场可被细胞感受并引导定向迁移（电趋向性），涉及膜电位、离子通道与细胞骨架，参与伤口愈合与组织修复。","type":"A1","id":"c5-80db4cdf"},{"id":"gc11-04-4","ch":6,"part":2,"tag":"判读","stem":"同一细胞内的两种氨基甲酰磷酸合成酶分别位于胞质与线粒体且调节方式不同，这说明","options":["两种酶由同一个基因编码，差别在于翻译后的定位信号","细胞质基质与线粒体各自区室化，同名反应服务于不同途径","细胞质基质与线粒体的代谢彼此隔离，中间物不能相互交换","酶在细胞内的分布由底物浓度随机决定，与区室结构没有关系","线粒体膜通透性很高，小分子与酶能在区室之间自由往返"],"answer":1,"explain":"B 对：胞质中以谷氨酰胺为氮源、受 UTP 反馈抑制的酶参与嘧啶核苷酸的从头合成，线粒体中以游离氨为氮源、受 N-乙酰谷氨酸激活的酶参与尿素合成；同一类反应被分置两个区室，各自接受不同的底物与调节信号，这正是细胞质基质与线粒体代谢区室化的体现。A 错：两种酶由不同基因编码，并非同一产物。C 错：区室之间通过穿梭系统交换中间物，并非彼此隔离。D 错：酶的分布由分选信号决定，不是随机的。E 错：线粒体内膜通透性低，小分子与酶不能自由往返，才需要专门的转运系统。","type":"A1","group":"c11-04","kind":"experiment","chs":[15,14,11,6],"vignette":"为判断一株白血病细胞系的核苷酸原料从哪来，研究生做了三组实验。第一组：分别在 C1 位 ¹⁴C 标记葡萄糖和 C6 位 ¹⁴C 标记葡萄糖的培养基中培养细胞并收集 ¹⁴CO₂，C1 标记组的释放量是 C6 标记组的 8 倍；加入葡萄糖-6-磷酸脱氢酶抑制剂后，¹⁴CO₂ 释放量与细胞增殖速度同步降到原来的三成。第二组：用酰胺氮被 ¹⁵N 标记的谷氨酰胺培养细胞，2 小时后在细胞内的 IMP、GMP 与 CTP 中检出 ¹⁵N，而 dTMP 的甲基上没有标记。第三组：差速离心分离胞质与线粒体组分，胞质组分中可测到以谷氨酰胺为氮源的氨基甲酰磷酸合成酶活性，该活性可被 UTP 抑制；线粒体组分中的同类酶则以游离氨为氮源，并可被 N-乙酰谷氨酸激活。","vignette_title":"情景 4：¹⁴CO₂ 计数器上的三条线索","gidx":4,"gn":5,"anchor":"该活性可被 UTP 抑制"},{"id":"gc13-02-4","ch":6,"part":2,"tag":"机制","stem":"放线菌酮处理后基质多肽几乎消失而少数疏水亚基仍在合成，说明","options":["线粒体基质中的蛋白质由线粒体基因组编码","放线菌酮抑制线粒体内的核糖体，故抑制作用有限","线粒体是半自主性细胞器，多数蛋白由核基因编码","疏水亚基由胞质核糖体合成后靠囊泡运输进入内膜","线粒体基因组编码的蛋白需经核孔进入线粒体"],"answer":2,"explain":"C 对：抑制胞质核糖体后多数线粒体蛋白的合成中断，而少数由自身基因组编码的疏水亚基仍在线粒体内合成，正说明线粒体只具备部分自主性。A 错：多数线粒体蛋白由核基因编码，在胞质核糖体上合成后运入，并非由线粒体基因组编码。B 错：放线菌酮作用于胞质核糖体，其明显效果恰好说明线粒体蛋白主要依赖胞质合成。D 错：疏水亚基在线粒体内部合成并就地插入内膜，不经囊泡运输。E 错：核孔复合体负责核质之间的运输，线粒体蛋白经 TOM 与 TIM 复合体进入线粒体。","type":"A1","group":"c13-02","kind":"mechanism","chs":[6,13,7],"vignette":"研究者从大鼠心肌中分离线粒体，再用低渗膨胀去掉外膜，得到只保留内膜的颗粒。免疫金标记显示，ATP合酶的F1头部伸向基质一侧，细胞色素c附着在内膜朝向膜间隙的一面；荧光探针测得基质pH比膜间隙高约1.4个单位，膜间隙的质子浓度更高。向悬液加入ADP与Pi后，氧电极上的耗氧速率由12升到48（相对值）；若先加入寡霉素，耗氧回落到15，而跨内膜的质子梯度继续增大。用放线菌酮抑制胞质中的核糖体后，新掺入线粒体基质的多肽几乎消失，仍有少数疏水亚基在合成，这些亚基由线粒体自己的基因组编码。此外，从线粒体表面分离到小块内质网膜，提示两处细胞器之间存在膜接触区。","vignette_title":"情景 2：质子被泵去了哪一侧","gidx":4,"gn":6,"anchor":"仍有少数疏水亚基在合成"},{"id":"gc13-03-4","ch":6,"part":2,"tag":"机制","stem":"解偶联剂使线粒体受损后被选择性清除，其分子基础是","options":["受损线粒体被26S蛋白酶体整体降解，无需膜结构参与","受损线粒体外膜蛋白被泛素化后由溶酶体直接吞入降解","PINK1与Parkin使线粒体DNA降解，线粒体随之消失","受损线粒体在细胞质中自行解体，碎片随后被排出细胞","外膜蛋白被泛素化后经自噬受体识别，由双层膜结构包裹降解"],"answer":4,"explain":"E 对：线粒体受损后 PINK1 在膜上蓄积并招募 Parkin，使外膜蛋白泛素化，随后被自噬受体识别，由双层膜结构包裹后送入溶酶体降解。A 错：26S 蛋白酶体降解的是单个多肽链，无法整体降解整个细胞器。B 错：溶酶体不能直接吞入线粒体，必须先由双层膜结构包裹再与之融合。C 错：PINK1 与 Parkin 标记的是外膜蛋白，并不降解线粒体 DNA。D 错：线粒体不会在细胞质中自行解体，其清除依赖选择性的自噬过程。","type":"A1","group":"c13-03","kind":"mechanism","chs":[7,8,6],"vignette":"培养的大鼠肝细胞换入不含氨基酸的培养液，饥饿4小时后，电镜下每个细胞出现约400个双层膜结构，内含线粒体碎片与内质网断片；长寿命蛋白的降解速率由1.2%/h升至4.5%/h。处理6小时：甲组加3-甲基腺嘌呤后双层膜结构减至90个、降解速率回落到1.3%；乙组加巴弗洛霉素A1后溶酶体pH由5.0升到6.8，双层膜结构增至1200个、降解速率降到0.9%；丙组补回氨基酸后双层膜结构减至120个。另一组细胞先用解偶联剂使线粒体受损，胞质中PINK1蓄积并招募Parkin，受损线粒体随后被双层膜结构包裹。把标记的胞外颗粒加入培养基，可见颗粒经吞噬体进入细胞并与溶酶体融合。","vignette_title":"情景 3：饿出来的双层膜结构","gidx":4,"gn":6,"anchor":"PINK1蓄积并招募Parkin"},{"id":"gc13-04-1","ch":6,"part":2,"tag":"判读","stem":"乳酸脱氢酶主要出现在上清S，这一结果说明","options":["该酶是细胞质基质中的可溶性酶，离心后留在上清","该酶是线粒体外膜上的标志酶，随线粒体一同沉降","该酶在匀浆中被蛋白酶降解，因而不进入沉淀","该酶存在于质膜内表面，随质膜碎片沉入P1","该酶是溶酶体的标志酶，其活性依赖膜结构的完整"],"answer":0,"explain":"A 对：乳酸脱氢酶是糖酵解途径的可溶性酶，存在于细胞质基质中，匀浆后不随任何膜性细胞器沉降，故在 100000 g 的上清中活性最高。B 错：线粒体的标志酶是细胞色素 c 氧化酶与琥珀酸脱氢酶，不含乳酸脱氢酶。C 错：若酶在匀浆中被降解，其活性会普遍降低，而不是集中出现在某一组分。D 错：质膜内表面的酶会随质膜碎片进入 P1，与上清中活性最高的结果不符。E 错：溶酶体的标志酶是酸性磷酸酶，乳酸脱氢酶与溶酶体无关。","type":"A1","group":"c13-04","kind":"experiment","chs":[6,7,9],"vignette":"研究生把大鼠肝组织在等渗蔗糖溶液中匀浆，按600g 10分钟、15000g 20分钟、100000g 60分钟依次离心，得到沉淀P1、P2、P3与上清S。标志酶相对活性：P1中Na⁺-K⁺-ATP酶为92；P2中细胞色素c氧化酶为88、酸性磷酸酶为76；P3中葡萄糖-6-磷酸酶为85、半乳糖基转移酶为70；S中乳酸脱氢酶为95。未加去垢剂时P2的酸性磷酸酶活性只有19，加入0.1%Triton X-100后升到76，反复冻融三次后升至71。把P3经去垢剂与高盐洗涤后仍能检出波形蛋白；在其中先加秋水仙素再置于4℃ 30分钟，一种约55kDa的蛋白转入上清，而波形蛋白仍留在沉淀中。","vignette_title":"情景 4：四个组分里的标志酶","gidx":1,"gn":6,"anchor":"S中乳酸脱氢酶为95"},{"id":"gc13-04-5","ch":6,"part":2,"tag":"方案","stem":"P1中除细胞核外还检出较高的Na⁺-K⁺-ATP酶活性，最合理的解释是","options":["细胞核膜上也存在钠钾泵，故P1中活性偏高","低转速离心使可溶性酶发生沉淀，与膜无关","该酶在匀浆中由可溶性酶聚集成颗粒后沉降","部分未破碎细胞与质膜碎片一并沉降，组分有交叉","该酶实际位于细胞核内，是核的标志酶之一"],"answer":3,"explain":"D 对：在 600 g 的低速离心中，未破碎的细胞与较大的质膜碎片会与细胞核一并沉降，各组分之间因此存在交叉，判断定位时需结合多种标志酶。A 错：钠钾泵位于质膜而不在核膜上，核膜中并无该酶。B 错：钠钾泵是膜整合蛋白，不会以可溶性蛋白的形式聚集沉降。C 错：该酶始终结合在膜上，其沉降行为取决于膜碎片的大小而不是自身的聚集。E 错：钠钾泵是质膜的标志酶，出现在 P1 是组分交叉的结果，不能据此把它归入细胞核。","type":"A1","group":"c13-04","kind":"experiment","chs":[6,7,9],"vignette":"研究生把大鼠肝组织在等渗蔗糖溶液中匀浆，按600g 10分钟、15000g 20分钟、100000g 60分钟依次离心，得到沉淀P1、P2、P3与上清S。标志酶相对活性：P1中Na⁺-K⁺-ATP酶为92；P2中细胞色素c氧化酶为88、酸性磷酸酶为76；P3中葡萄糖-6-磷酸酶为85、半乳糖基转移酶为70；S中乳酸脱氢酶为95。未加去垢剂时P2的酸性磷酸酶活性只有19，加入0.1%Triton X-100后升到76，反复冻融三次后升至71。把P3经去垢剂与高盐洗涤后仍能检出波形蛋白；在其中先加秋水仙素再置于4℃ 30分钟，一种约55kDa的蛋白转入上清，而波形蛋白仍留在沉淀中。","vignette_title":"情景 4：四个组分里的标志酶","gidx":5,"gn":6,"anchor":"P1中Na⁺-K⁺-ATP酶为92"},{"id":"gc13-04-6","ch":6,"part":2,"tag":"判读","stem":"关于差速离心分级分离与标志酶的应用，下列判断正确的是（X 型多选）","options":["细胞核与未破碎的细胞主要出现在低速的P1中","线粒体的标志酶包括细胞色素c氧化酶与琥珀酸脱氢酶","某组分检出标志酶即可确定该细胞器的定位","酸性磷酸酶活性升高说明溶酶体的膜结构受到损伤","乳酸脱氢酶是线粒体基质的标志酶之一"],"answer":[0,1,3],"explain":"答案 ABD。A 对：低速离心时细胞核与未破碎的细胞沉降最早，构成 P1 的主要成分。B 对：细胞色素 c 氧化酶与琥珀酸脱氢酶都位于线粒体内膜，可作为线粒体的标志酶。D 对：未加去垢剂时活性偏低而破坏膜后活性升高，正是溶酶体膜受损、腔内酶得以与底物接触的表现。C 错：单一标志酶的检出只能提示该组分的富集情况，组分之间常有交叉，需结合多种标志酶综合判断。E 错：乳酸脱氢酶是细胞质基质的标志酶，把它当作线粒体基质的标志酶会把上清 S 的来源判断错。","type":"X","group":"c13-04","kind":"experiment","chs":[6,7,9],"vignette":"研究生把大鼠肝组织在等渗蔗糖溶液中匀浆，按600g 10分钟、15000g 20分钟、100000g 60分钟依次离心，得到沉淀P1、P2、P3与上清S。标志酶相对活性：P1中Na⁺-K⁺-ATP酶为92；P2中细胞色素c氧化酶为88、酸性磷酸酶为76；P3中葡萄糖-6-磷酸酶为85、半乳糖基转移酶为70；S中乳酸脱氢酶为95。未加去垢剂时P2的酸性磷酸酶活性只有19，加入0.1%Triton X-100后升到76，反复冻融三次后升至71。把P3经去垢剂与高盐洗涤后仍能检出波形蛋白；在其中先加秋水仙素再置于4℃ 30分钟，一种约55kDa的蛋白转入上清，而波形蛋白仍留在沉淀中。","vignette_title":"情景 4：四个组分里的标志酶","gidx":6,"gn":6,"anchor":"得到沉淀P1、P2、P3与上清S"},{"id":"gc16-03-1","ch":6,"part":2,"tag":"识别","stem":"甲组胞质中那批随营养状态消长的无膜颗粒，在细胞学上属于","options":["细胞质内含物，是糖原在胞质中的聚集形式","无膜细胞器，由蛋白质与RNA经相分离组装而成","内膜系统区室，由单层膜包裹并含有水解酶","细胞骨架聚合物，由肌动蛋白单体聚合而成","膜性细胞器，由高尔基复合体出芽后形成"],"answer":0,"explain":"A 对：这批颗粒无膜包裹，随葡萄糖的有无而消长，过碘酸雪夫染色呈强阳性，符合糖原在胞质中聚集形成的细胞质内含物。B 错在无膜细胞器由蛋白质与 RNA 经相分离组装并执行特定功能，不是营养储备颗粒；C 错在内膜系统区室由生物膜包裹；D 错在肌动蛋白聚合形成的是微丝，而不是颗粒；E 错在膜性细胞器有膜包裹，与本例的无膜颗粒不符。","type":"A1","group":"c16-03","kind":"mechanism","chs":[6,7,11],"vignette":"取同一批肝细胞分三组。甲组培养液含 25 mmol/L 葡萄糖，培养 4 小时；乙组先在无糖培养液中培养 12 小时，再补加葡萄糖培养 4 小时。电镜定量：甲组胞质中无膜包裹的颗粒约占胞质面积的 12%，该颗粒的数量随营养状态消长，过碘酸雪夫染色阳性；乙组补糖前降到 1% 以下，补糖后回升到 9%。丙组以 ¹⁴C 标记的乳酸为唯一碳源，其培养液中出现标记葡萄糖。若加入一种抑制葡糖-6-磷酸转运体的药物，培养液中标记葡萄糖降到 16%，胞质中葡糖-6-磷酸由 0.06 升到 0.21，培养液中乳酸升到对照的 2.4 倍；细胞活力仍在 95% 以上，培养液中测不到乳酸脱氢酶，线粒体结构完好。","vignette_title":"情景 3：胞质里那堆会消失的颗粒","gidx":1,"gn":5,"anchor":"胞质中无膜包裹的颗粒"},{"id":"gc16-03-4","ch":6,"part":2,"tag":"判读","stem":"细胞活力在95%以上、培养液中测不到乳酸脱氢酶，这两项结果在本实验中的作用是","options":["说明培养液中的葡萄糖来自细胞破碎后释放的成分","证明葡萄糖的释放依靠细胞膜两侧的浓度差所驱动","说明细胞内ATP供应充足，糖异生可以持续进行","证明乳酸脱氢酶的活性与糖异生的强度成正比","排除细胞膜破损，说明葡糖-6-磷酸并未漏到细胞外"],"answer":4,"explain":"E 对：细胞活力在 95% 以上、培养液中测不到乳酸脱氢酶，说明细胞膜完整，培养液中的标记葡萄糖不可能来自胞质成分的漏出，只能来自膜上转运体介导的释放。A 错在细胞膜完整已排除这种可能；B 错在葡萄糖的释放在内质网腔内完成水解之后，并不单纯由浓度差驱动；C 错在 ATP 是否充足不是这两项对照所能证明的；D 错在乳酸脱氢酶只是胞质标志酶，与糖异生强度没有定量关系。","type":"A1","group":"c16-03","kind":"mechanism","chs":[6,7,11],"vignette":"取同一批肝细胞分三组。甲组培养液含 25 mmol/L 葡萄糖，培养 4 小时；乙组先在无糖培养液中培养 12 小时，再补加葡萄糖培养 4 小时。电镜定量：甲组胞质中无膜包裹的颗粒约占胞质面积的 12%，该颗粒的数量随营养状态消长，过碘酸雪夫染色阳性；乙组补糖前降到 1% 以下，补糖后回升到 9%。丙组以 ¹⁴C 标记的乳酸为唯一碳源，其培养液中出现标记葡萄糖。若加入一种抑制葡糖-6-磷酸转运体的药物，培养液中标记葡萄糖降到 16%，胞质中葡糖-6-磷酸由 0.06 升到 0.21，培养液中乳酸升到对照的 2.4 倍；细胞活力仍在 95% 以上，培养液中测不到乳酸脱氢酶，线粒体结构完好。","vignette_title":"情景 3：胞质里那堆会消失的颗粒","gidx":4,"gn":5,"anchor":"培养液中测不到乳酸脱氢酶"},{"id":"gc16-03-5","ch":6,"part":2,"tag":"判读","stem":"关于本实验反映的细胞质区室化与内含物，下列判断正确的是（X 型多选）","options":["糖原颗粒的数量随营养状态消长，属可变的细胞质内含物","细胞质基质中各种酶混合分布，各区室之间没有分工","胞质与内质网腔之间通过转运体交换底物与产物","同一份葡糖-6-磷酸在胞质与内质网腔中有不同的去向","无膜包裹的结构在细胞质中不能执行任何代谢功能"],"answer":[0,2,3],"explain":"答案 ACD。A 对：甲组与乙组的颗粒数量随葡萄糖供应而消长，说明内含物是可变的。C 对：葡糖-6-磷酸经转运体入腔、葡萄糖经转运体出腔，说明两个区室之间靠转运体交换底物与产物。D 对：同一份葡糖-6-磷酸在胞质中可进入糖酵解，在内质网腔中被水解为葡萄糖，去向不同。B 错在细胞质基质的成分与酶分布并不均匀，糖酵解与糖异生在胞质与线粒体、内质网之间分工进行；E 错在核糖体与蛋白酶体等无膜结构同样执行重要的代谢功能。","type":"X","group":"c16-03","kind":"mechanism","chs":[6,7,11],"vignette":"取同一批肝细胞分三组。甲组培养液含 25 mmol/L 葡萄糖，培养 4 小时；乙组先在无糖培养液中培养 12 小时，再补加葡萄糖培养 4 小时。电镜定量：甲组胞质中无膜包裹的颗粒约占胞质面积的 12%，该颗粒的数量随营养状态消长，过碘酸雪夫染色阳性；乙组补糖前降到 1% 以下，补糖后回升到 9%。丙组以 ¹⁴C 标记的乳酸为唯一碳源，其培养液中出现标记葡萄糖。若加入一种抑制葡糖-6-磷酸转运体的药物，培养液中标记葡萄糖降到 16%，胞质中葡糖-6-磷酸由 0.06 升到 0.21，培养液中乳酸升到对照的 2.4 倍；细胞活力仍在 95% 以上，培养液中测不到乳酸脱氢酶，线粒体结构完好。","vignette_title":"情景 3：胞质里那堆会消失的颗粒","gidx":5,"gn":5,"anchor":"数量随营养状态消长"},{"id":"gc18-01-2","ch":6,"part":2,"tag":"识别","stem":"细胞色素c在正常情况下定位于","options":["线粒体基质中，参与三羧酸循环的脱羧反应","线粒体内膜上，作为ATP合酶的组成亚基","线粒体膜间隙中，是呼吸链中传递电子的载体","线粒体外膜上，构成外膜的物质转运孔道","细胞质基质中，平时与Apaf1结合而失活"],"answer":2,"explain":"C 对：细胞色素 c 位于线粒体膜间隙，是呼吸链中传递电子的载体，线粒体外膜通透化后它才被释放到胞质。A 错：线粒体基质中是三羧酸循环的酶，细胞色素 c 不在基质。B 错：ATP 合酶位于线粒体内膜，细胞色素 c 并非其组成亚基。D 错：线粒体外膜的孔道由 Bax 与 Bak 等形成，细胞色素 c 不是外膜成分。E 错：细胞色素 c 平时不在胞质中，只有释放后才与 Apaf1 组装凋亡体。","type":"A1","group":"c18-01","kind":"mechanism","chs":[29,26,6],"vignette":"实验室拿到两株人B淋巴瘤细胞，表面都表达Fas。加入同浓度的抗Fas抗体后，甲株6小时内78%的细胞出现膜出泡与核浓缩，乙株只有12%。检测显示：甲株在30分钟内出现caspase-8的活化片段，2小时后胞质中细胞色素c由0.3升到5.1ng/µg蛋白，同时检测到tBid；乙株的caspase-8同样被活化，胞质细胞色素c却始终低于0.4ng/µg，其Bcl-2表达量是甲株的9倍，Bcl-2基因旁侧因染色体易位而带有一段活跃的增强子。把乙株的Bcl-2用小干扰RNA下调后，凋亡率回到71%；在甲株中敲除Bax与Bak，凋亡率降到15%。两株细胞在凋亡后期都出现核纤层蛋白的切割片段。","vignette_title":"情景 1：同一个受体，两种结局","gidx":2,"gn":5,"anchor":"细胞色素c由0.3升到5.1"},{"id":"gc18-02-3","ch":6,"part":2,"tag":"识别","stem":"经ERAD运至细胞质的错误折叠蛋白由26S蛋白酶体降解，该降解过程的特点是","options":["识别底物的多聚泛素链，并依赖ATP将其降解","在溶酶体的酸性环境中由组织蛋白酶完成","不需要泛素标记，按底物N端的氨基酸序列降解","由20S催化核心单独完成，不消耗细胞内的能量","把底物水解为氨基酸后运回内质网腔再利用"],"answer":0,"explain":"A 对：26S 蛋白酶体识别底物上的多聚泛素链，去折叠并耗 ATP 把底物送入 20S 催化核心降解，正是 ERAD 的最后一环。B 错：溶酶体的酸性水解酶处理的是经自噬或胞吞进入的底物，与这条胞质降解途径不同。C 错：该途径必须先由泛素标记底物，N 端氨基酸序列不是其识别依据。D 错：20S 只是催化核心，需要 19S 调节颗粒识别泛素链，整个过程依赖 ATP。E 错：底物被水解为短肽与氨基酸后进入胞质代谢池，不会被运回内质网腔再利用。","type":"A1","group":"c18-02","kind":"mechanism","chs":[29,7,6],"vignette":"用阻断N-连接糖基化起始的衣霉素处理HeLa细胞，4小时后内质网腔中未折叠蛋白增多，分子伴侣BiP的转录本上调5倍；胞质中LC3B-II与LC3B-I的比值由0.2升到1.6、p62由1.0降到0.3，电镜下可见双层膜结构；一部分错误折叠蛋白经ERAD逆向转运至细胞质，由26S蛋白酶体降解。12小时后活化caspase-3阳性细胞占45%，电泳可见梯状条带。若在加药时用RNA干扰敲低Atg5，LC3B-II不再升高，而凋亡率升到72%、存活率由58%降到26%。另一组细胞过表达Bcl-2后凋亡率降到12%，LC3B-II也由1.6降到0.4；该组再表达BH3突变、不能被Bcl-2结合的Beclin-1，LC3B-II回到1.4而凋亡率仍为12%。","vignette_title":"情景 2：错误折叠蛋白的两种去处","gidx":3,"gn":6,"anchor":"经ERAD逆向转运至细胞质"},{"id":"gc2-02-1","ch":6,"part":2,"tag":"识别","stem":"这些酸性水解酶在细胞内的合成部位是","options":["由细胞质基质中游离的核糖体合成","由高尔基复合体扁囊表面的核糖体合成","由溶酶体膜内侧附着的核糖体合成","由线粒体外膜上附着的核糖体合成","由附着在粗面内质网上的核糖体合成"],"answer":4,"explain":"E 对：情景指出水解酶都在粗面内质网的核糖体上合成，属共翻译转运，N 端信号肽引导肽链边合成边进入内质网腔。B 游离核糖体合成的是留在细胞质中的蛋白；B、C、D 都错：核糖体不附着在高尔基复合体扁囊、溶酶体膜或线粒体外膜上，线粒体蛋白也是由胞质游离核糖体合成后再经 TOM/TIM 转运进去的。","type":"A1","group":"c2-02","kind":"mechanism","chs":[7,8,6],"vignette":"溶酶体内数十种酸性水解酶都在粗面内质网的核糖体上合成，进入内质网腔后切去信号肽、加上糖链，再由COPII包被囊泡送到高尔基复合体。与它们同行的一批内质网驻留蛋白靠C端的KDEL序列被KDEL受体捕获，经COPI包被囊泡逆向运回内质网。决定水解酶去向的关键一步发生在高尔基复合体顺面：磷酸转移酶识别水解酶特有的三维标志，在糖链的甘露糖上添加磷酸，生成甘露糖-6-磷酸标签；反面网络上的M6P受体识别标签，把它们装入网格蛋白包被囊泡送往溶酶体。少数患儿该磷酸转移酶活性缺失，水解酶拿不到M6P标签，只能按默认途径经组成型分泌排出细胞，血浆中溶酶体酶活性反而升高，而溶酶体内底物大量蓄积，出现骨骼畸形与发育迟缓。","vignette_title":"情景 2：酶造出来了，却送错了门","gidx":1,"gn":6,"anchor":"都在粗面内质网的核糖体上合成"},{"id":"gc2-04-4","ch":6,"part":2,"tag":"判读","stem":"核仁蛋白在核仁内快速交换、转录停止后迅速散开，这一现象支持的判断是","options":["核仁的散开说明细胞已进入分裂期","核仁由蛋白质与RNA经相分离聚集而成","核仁是被膜包裹的细胞器，膜被破坏","核仁蛋白在核仁内被降解而荧光消失","核仁是染色质浓缩形成的临时结构"],"answer":1,"explain":"B 对：核仁蛋白能快速进出核仁（半恢复约 20 秒），抑制 rRNA 转录后又迅速散入核质，说明核仁是依靠蛋白质与 RNA 之间多价弱相互作用经相分离形成的无膜区室，属动态结构。B 核仁没有膜包裹；C 若被降解，荧光应不可逆消失，而实测随转录状态可逆地散开；D 核仁围绕 rRNA 基因形成，不能归结为染色质浓缩；E 加放线菌素 D 的细胞并未进入分裂期，核仁散开是转录被抑制的直接结果。","type":"A1","group":"c2-04","kind":"experiment","chs":[10,6,9],"vignette":"研究生小陈把糖皮质激素受体的编码序列接上GFP后转染培养细胞。血清饥饿后荧光均匀分布在细胞质与细胞核；加入100 nmol/L地塞米松，30分钟后荧光集中到核内，核质比由0.4升至3.1。随后几组处理：把受体核定位信号的碱性氨基酸换成丙氨酸，加激素后荧光仍留在胞质；用叠氮钠加脱氧葡萄糖耗竭ATP，入核同样被阻断；向胞质注入70 kDa的惰性葡聚糖，1小时后仍不见核内聚集；用放线菌素D抑制rRNA转录，2小时后荧光标记的核仁蛋白从核仁内散入核质、核仁消失，光漂白后其荧光半恢复时间仅约20秒。另一组细胞加诺考达唑破坏微管，细胞停滞在分裂期，核膜崩解、核仁消失。","vignette_title":"情景 4：半小时后，绿色荧光聚到了核里","gidx":4,"gn":5,"anchor":"核仁蛋白从核仁内散入核质"},{"id":"gc25-01-3","ch":6,"part":2,"tag":"判读","stem":"加入糖酵解抑制剂后纤毛摆动频率由 12 Hz 降到 3 Hz，最合理的解释是","options":["纤毛内部能自行合成所需的蛋白质与 ATP，摆动与胞质代谢无关","抑制剂直接与动力蛋白臂结合，使 ATP 水解与二联体滑动停止","线粒体需先进入纤毛内部为其供能，抑制剂阻断了它们的进入","纤毛摆动所需的 ATP 由周围胞质供应，抑制糖酵解后供应减少","纤毛摆动并不消耗 ATP，频率下降是细胞能量耗竭的后果"],"answer":3,"explain":"D 对：情景提示纤毛内部看不到线粒体与核糖体，其摆动所需 ATP 只能由周围胞质供应；细胞质基质中的糖酵解是胞质 ATP 的来源之一，被抑制后摆动频率随之下降。A 与纤毛内看不到核糖体和线粒体矛盾；B 抑制剂作用于糖酵解酶而非动力蛋白臂；C 线粒体并不进入纤毛内部；E 动力蛋白臂本身就是 ATP 酶，摆动必然消耗 ATP。","type":"A1","group":"c25-01","kind":"mechanism","chs":[5,4,6],"vignette":"呼吸道上皮表面由纤毛细胞、杯状细胞与基细胞构成。纤毛细胞顶部伸出约 200 根纤毛，纤毛轴心是 9 组二联微管围着 2 根中央微管，二联微管上的动力蛋白臂水解 ATP，使相邻二联体相互滑动，纤毛由此以约 12 Hz 的频率摆动，每根纤毛的基体锚定在顶部的细胞皮质中。纤毛上方覆盖的黏液层由杯状细胞分泌的黏蛋白与水构成，黏蛋白伸出的糖链与质膜外表面的糖萼同属细胞外被。黏液的稠度取决于细胞顶膜上氯通道与钠通道的活动：氯离子经通道进入管腔后，水随之进入黏液层。电镜显示，纤毛基部的胞质中密集聚集着线粒体，而纤毛内部看不到线粒体与核糖体。用糖酵解抑制剂处理后，纤毛摆动频率由 12 Hz 降到 3 Hz；另一株氯通道缺陷细胞的黏液层厚度只有对照的 40%，顶膜钠通道活性则为对照的 3 倍。","vignette_title":"情景 1：黏液纤毛清除系统里的三重配合","gidx":3,"gn":5,"anchor":"纤毛基部的胞质中密集聚集着线粒体"},{"ch":6,"part":2,"tag":"无膜细胞器","stem":"真核细胞细胞质中既有膜性细胞器也有无膜细胞器。下列组合均属于无膜细胞器的是","options":["内质网与高尔基复合体","溶酶体与过氧化物酶体","核糖体与蛋白酶体","线粒体与内体","细胞核与内质网"],"answer":2,"explain":"核糖体与蛋白酶体由生物大分子组装而成、无生物膜包裹，属无膜细胞器；内质网、高尔基复合体、溶酶体、线粒体、内体均有膜包裹。","type":"A1","id":"c6-c20f1778"},{"ch":6,"part":2,"tag":"泛素化","stem":"关于蛋白质泛素化修饰的叙述，正确的是","options":["泛素通过其N端与底物蛋白的丝氨酸残基形成酯键","泛素通过其C端甘氨酸与底物蛋白赖氨酸残基的ε-氨基形成异肽键，是多聚泛素化标记的核心","泛素化修饰只发生在细胞核内，与细胞质蛋白质降解无关","泛素是一种小分子糖类，可共价结合到蛋白质上","泛素化修饰不可逆，被修饰的蛋白质只能被降解"],"answer":1,"explain":"泛素是小分子蛋白质，其C端甘氨酸与底物赖氨酸ε-氨基共价连接；多聚泛素链是26S蛋白酶体识别并降解底物的标签。","type":"A1","id":"c6-59e365a5"},{"ch":6,"part":2,"tag":"蛋白酶体","stem":"关于26S蛋白酶体结构与作用的叙述，正确的是","options":["由40S和60S两个亚基组成，负责蛋白质合成","位于溶酶体内，在酸性pH下水解蛋白质","由一条多肽链构成，降解蛋白质不消耗能量","通过识别底物蛋白N端甲硫氨酸决定降解特异性","由20S催化核心颗粒与19S调节颗粒组成，识别多聚泛素化链并依赖ATP降解蛋白质"],"answer":4,"explain":"26S蛋白酶体含20S催化核心与19S调节颗粒（识别多聚泛素链、去折叠并耗能转运底物）；40S/60S是核糖体亚基，酸性水解酶属溶酶体。","type":"A1","id":"c6-ea2ce6a2"},{"ch":6,"part":2,"tag":"蛋白降解途径","stem":"细胞内蛋白质降解主要有溶酶体途径与泛素-蛋白酶体途径。下列关于泛素-蛋白酶体途径特点的叙述，正确的是","options":["无选择性，对细胞内所有蛋白质同步降解","高度选择性地降解短寿命蛋白、异常蛋白与调节性蛋白，需消耗ATP，是胞质内蛋白质质量与数量调控的重要场所","只能降解经胞吞进入细胞的外源蛋白质","不消耗能量，在细胞质基质的酸性环境中进行","是细胞质中唯一的蛋白质降解方式"],"answer":1,"explain":"泛素-蛋白酶体途径高度选择且耗能，是胞质内蛋白质质量与数量调控的核心；经胞吞进入的外源蛋白主要在溶酶体降解。","type":"A1","id":"c6-bcd926bb"},{"ch":6,"part":2,"tag":"核糖体结构","stem":"核糖体的结构与其功能相适应，下列叙述正确的是","options":["由DNA和蛋白质组成，可直接转录mRNA","大亚基负责结合mRNA，小亚基催化肽键形成","是膜性细胞器，必须附着在内质网表面才能工作","由rRNA与蛋白质组成，小亚基结合mRNA，大亚基含肽基转移酶中心并容纳A、P、E位点","只有催化中心，不含mRNA结合位点"],"answer":3,"explain":"核糖体由rRNA与蛋白质组成，小亚基负责mRNA结合与密码子识别，大亚基含肽基转移酶中心和A、P、E位点，rRNA参与催化。","type":"A1","id":"c6-6d042271"},{"ch":6,"part":2,"tag":"核糖体组装","stem":"关于真核细胞核糖体生物合成的叙述，正确的是","options":["始于核仁，rRNA在此转录加工并与核糖体蛋白组装成大小亚基前体，再经核孔输出到细胞质","完全在细胞质中由游离rRNA自发组装，与核仁无关","在粗面内质网膜上完成全部组装","在高尔基复合体中加工成为成熟核糖体","由线粒体基因组编码全部核糖体组分"],"answer":0,"explain":"核糖体生物合成始于核仁，rRNA转录加工并与核糖体蛋白组装成前体颗粒，再经核孔运至细胞质成熟。","type":"A1","id":"c6-09decbf0"},{"ch":6,"part":2,"tag":"线粒体","stem":"说线粒体是半自主性细胞器，其主要依据是","options":["线粒体不含DNA，其全部蛋白质均由核基因编码","线粒体能独立完成全部蛋白质合成，完全不依赖核基因","线粒体有自身mtDNA与蛋白质合成系统，可合成部分自身蛋白质，但多数蛋白质由核基因编码、在细胞质中合成后转运入线粒体","线粒体只能在细胞核内进行分裂","线粒体与细胞凋亡、钙稳态等过程无关"],"answer":2,"explain":"线粒体拥有mtDNA和独立转录翻译系统，但多数线粒体蛋白由核基因编码、在胞质核糖体合成后定向运入，故为半自主性细胞器。","type":"A1","id":"c6-b6f3d9ea"},{"ch":6,"part":2,"tag":"细胞质与疾病","stem":"细胞质中细胞器功能异常与疾病的关系，下列叙述正确的是","options":["泛素-蛋白酶体系统功能异常只引起感染性疾病","核糖体功能异常只影响红细胞的生成","线粒体功能异常只导致骨骼肌疾病，不累及其他系统","细胞质细胞器的异常与疾病发生无关","泛素-蛋白酶体系统功能异常可致错误折叠蛋白聚集，核糖体与线粒体功能异常可致蛋白质合成与能量代谢障碍，均与神经退行性疾病、肿瘤等相关"],"answer":4,"explain":"小结指出蛋白酶体、核糖体及线粒体功能异常可导致神经退行性疾病、癌症等；错误折叠蛋白聚集与能量代谢障碍是典型机制。","type":"A1","id":"c6-7a0d9617"},{"ch":6,"part":2,"tag":"细胞质基质","stem":"关于细胞质基质（胞质溶胶）的叙述，正确的是","options":["是几乎不含蛋白质的稀薄水溶液，黏度与纯水相近","成分与细胞外液完全相同，只是离子浓度略有差异","含水量约 70%，含大量可溶性蛋白（多为酶）与各种代谢物，是多种中间代谢与蛋白质合成等生命活动的场所","只含细胞骨架纤维，不含酶类与代谢中间产物","是均匀无结构的体系，各部位的酶分布与 pH 完全相同"],"answer":2,"explain":"细胞质基质含大量可溶性蛋白与代谢物，是糖酵解、脂肪酸合成等中间代谢及蛋白质合成等活动的场所，其成分并非均匀分布。","type":"A1","id":"c6-c835e679"},{"ch":6,"part":2,"tag":"相分离","stem":"核仁、应激颗粒、P 颗粒等无膜细胞器可在细胞质中形成，并能快速地组装与解聚。关于其形成机制的叙述，正确的是","options":["通过蛋白质与 RNA 间的多价弱相互作用发生液-液相分离，形成与周围胞质性质不同的液相区室","由脂双层包裹形成，与膜性细胞器的形成方式相同","由质膜内陷形成后再经囊泡运输与溶酶体融合","由核糖体在 mRNA 上聚集并共价交联而成，一旦形成即不可逆","只在病理状态下出现，生理条件下细胞内不存在"],"answer":0,"explain":"核仁、应激颗粒等无膜细胞器经液-液相分离形成：蛋白质/RNA 的多价弱相互作用聚集成独立液相区室，可快速组装与解聚。","type":"A1","id":"c6-20798c2a"},{"ch":6,"part":2,"tag":"E1E2E3","stem":"关于泛素-蛋白酶体系统中泛素连接酶级联（E1、E2、E3）的叙述，正确的是","options":["E1 直接识别待降解的底物蛋白，决定降解的特异性","E2 是泛素连接酶，人体中 E2 种类最多，决定底物的特异性","该级联不消耗能量，泛素可自发地与底物蛋白结合","E1 耗能活化泛素并转移给 E2，E3 识别底物、决定特异性，人体中 E3 的种类最多","三者中只有 E3 能与泛素形成共价中间体"],"answer":3,"explain":"E1（泛素激活酶）耗 ATP 活化泛素并交给 E2（结合酶），E3（连接酶）识别底物并决定特异性；人体 E3 有数百种，数量最多。","type":"A1","id":"c6-bc75ee6d"},{"ch":6,"part":2,"tag":"多聚核糖体","stem":"电镜下常见多条核糖体沿同一条 mRNA 串联排列，形成多聚核糖体（多核糖体）。关于多聚核糖体的叙述，正确的是","options":["多个核糖体同时翻译不同的 mRNA，故属多顺反子结构","多个核糖体先后结合同一条 mRNA 并同时进行翻译，可在短时间内合成多条相同的多肽链，提高翻译效率","只有附着在粗面内质网上的核糖体才能形成多聚核糖体","多聚核糖体是核糖体亚基在核仁内组装时的中间形式","多聚核糖体由 mRNA 与核糖体共价交联形成，不能被解聚"],"answer":1,"explain":"多聚核糖体是多个核糖体沿同一条 mRNA 依次翻译所形成的结构，可同时合成多条相同的多肽链，显著提高翻译效率。","type":"A1","id":"c6-4bbb41e9"},{"ch":6,"part":2,"tag":"mtDNA特点","stem":"关于线粒体 DNA（mtDNA）特点的叙述，正确的是","options":["为线性双链 DNA，与组蛋白结合形成核小体","每个线粒体只含 1 个拷贝，一旦发生突变必然发病","由父方与母方各提供一半，故其遗传方式与核基因相同","mtDNA 编码线粒体的全部蛋白质，其突变只影响能量代谢","为裸露的环状双链 DNA，多拷贝、无内含子，突变率高于核 DNA，并呈母系遗传"],"answer":4,"explain":"mtDNA 是裸露的环状双链多拷贝基因组，无内含子、突变率高，由母亲传递给子代；其编码的蛋白仅约 13 种。","type":"A1","id":"c6-aefdc702"},{"ch":6,"part":2,"tag":"线粒体蛋白转运","stem":"由核基因编码的线粒体基质蛋白在细胞质核糖体上合成后，被准确地运入线粒体基质。关于该过程的叙述，正确的是","options":["蛋白必须以完全折叠的成熟构象才能通过线粒体膜","转运靠浓度梯度驱动，不消耗能量，也与跨内膜电位无关","蛋白 N 端的信号序列被外膜受体识别，在分子伴侣协助下保持伸展状态，经 TOM/TIM 复合体转运入基质后信号肽被切除并折叠","全部线粒体蛋白均在游离核糖体上合成，再经囊泡运输送入线粒体","信号序列位于肽链的 C 端，转运完成后仍保留在成熟蛋白上"],"answer":2,"explain":"线粒体基质蛋白以 N 端导肽为信号，经 TOM/TIM 转运，转运时需分子伴侣保持伸展、消耗 ATP 并依赖膜电位，入基质后切除导肽并折叠。","type":"A1","id":"c6-24310f99"},{"ch":6,"part":2,"tag":"蛋白酶体抑制剂","stem":"多发性骨髓瘤患者使用蛋白酶体抑制剂（如硼替佐米）治疗。该药能选择性地杀伤肿瘤细胞，主要是因为","options":["26S 蛋白酶体被抑制后 IκB 不能被降解，NF-κB 通路激活受阻，同时错误折叠蛋白蓄积引起内质网应激，诱导肿瘤细胞凋亡","蛋白酶体被抑制后细胞内 ATP 迅速耗竭，肿瘤细胞因能量不足而死亡","该药抑制蛋白酶体后可阻断 DNA 复制，使肿瘤细胞停滞于 S 期","该药抑制蛋白酶体后溶酶体酶大量漏出，导致肿瘤细胞自溶","该药抑制蛋白酶体后核糖体无法组装，蛋白质合成全面停止"],"answer":0,"explain":"蛋白酶体抑制使 IκB 蓄积、NF-κB 活化受阻，并引起错误折叠蛋白堆积与内质网应激，对骨髓瘤细胞尤为敏感。","type":"A1","id":"c6-f5e01ee1"},{"ch":6,"part":2,"tag":"线粒体自噬","stem":"细胞可选择性清除受损的线粒体。关于该过程（线粒体自噬）的叙述，正确的是","options":["受损线粒体由 26S 蛋白酶体直接整体降解，不需要自噬体参与","该过程不依赖泛素化，属于非选择性的降解过程","溶酶体水解酶直接进入线粒体基质完成降解","线粒体损伤后 PINK1 蓄积并招募 Parkin，使外膜蛋白泛素化，被自噬受体识别后经自噬体与溶酶体融合降解","该过程只在细胞死亡时发生，与帕金森病等疾病无关"],"answer":3,"explain":"PINK1/Parkin 通路使受损线粒体外膜蛋白泛素化，经自噬受体识别后由自噬体-溶酶体选择性清除；该通路缺陷与帕金森病相关。","type":"A1","id":"c6-f3998603"},{"id":"gc0-01-4","ch":7,"part":2,"tag":"机制","stem":"关于这一机制链条，下列判断正确的是（X 型多选）","options":["患者肺气肿的本质是蛋白酶活性相对过强","患者的肝损伤说明该突变改变了酶的催化活性中心","α1-AT 与弹性蛋白酶构成蛋白酶-抗蛋白酶平衡","Z 型突变先改变一级结构，再影响折叠与分泌","滞留于内质网的聚合蛋白可造成肝细胞损伤"],"answer":[0,2,3,4],"explain":"答案 ACDE。C、D、E、A 逐一对应情景中的四条信息：平衡关系、一级结构→折叠、内质网滞留、肺气肿与肝硬化。B 错：α1-AT 是抑制剂而不是催化酶，肝损伤来自错误折叠蛋白在内质网内聚合与应激，谈不上改变催化活性中心。","type":"X","group":"c0-01","kind":"mechanism","chs":[1,3,7],"vignette":"血浆中有一种叫 α1-抗胰蛋白酶（α1-AT）的蛋白，由肝细胞合成后分泌入血，专门看住中性粒细胞释放的弹性蛋白酶——两者构成一对平衡：蛋白酶负责清理受损组织，抗蛋白酶负责不让它把肺组织一并拆掉。α1-AT 属 serpin 家族，它的反应中心环像一个诱饵：被弹性蛋白酶识别切割后，二者形成不可逆的共价复合物，酶被永久锁死。部分人的 SERPINA1 基因带 Z 型突变（第 342 位谷氨酸变为赖氨酸），突变蛋白仍能合成，却在肝细胞内质网中折叠错误、彼此聚合而无法分泌，血浆 α1-AT 因此只剩正常的 10%–15%。这类人常在三四十岁出现肺气肿，一部分还会发生肝硬化。","vignette_title":"情景 1：当「看门人」自己出不了门","gidx":4,"gn":4,"anchor":"一部分还会发生肝硬化"},{"id":"gc1-04-5","ch":7,"part":2,"tag":"机制","stem":"关于该酶的合成、分泌与鉴定，下列判断正确的是（X 型多选）","options":["比活力越高的组分，其总活性也越高","该酶经高尔基体加工后装入分泌囊泡运出细胞","凝胶过滤中分子量大的蛋白先被洗脱出来","该酶在附着于糙面内质网的核糖体上合成","SDS 使蛋白质带负电，电泳迁移率主要取决于分子量"],"answer":[1,2,3,4],"explain":"答案 BCDE。A、B 是分泌蛋白的合成与运输途径：在糙面内质网上的核糖体合成，进入内质网腔加工，再经高尔基体加工分选、装入分泌囊泡运至细胞膜排出。C、D 是两种分离技术的原理：SDS 使蛋白带上大量负电荷、消除电荷与形状差异，迁移率主要取决于分子量；凝胶过滤中不能进入凝胶颗粒孔道的大分子先被洗脱。A 错：比活力是单位质量蛋白的活力，与总活性是两回事，纯化提高比活力时总活性往往下降。","type":"X","group":"c1-04","kind":"experiment","chs":[1,3,7],"vignette":"小陈要纯化一种由培养细胞分泌到培养液中的酶。他先把培养液浓缩，做硫酸铵分级沉淀，再上凝胶过滤柱，收集活性最高的洗脱峰；该峰在 SDS-聚丙烯酰胺凝胶电泳上出现 2 条带，分子量为 40 kDa 和 60 kDa；用 β-巯基乙醇还原后，2 条带的位置都不变。他接着用离子交换层析，把含 40 kDa 条带的组分单独收集并测活：该组分的比活力为 250 U/mg，而最初粗提液的比活力为 25 U/mg。让他不解的是，这个组分的凝胶过滤洗脱体积对应的分子量是 160 kDa，与电泳结果对不上。","vignette_title":"情景 4：160 kDa 与 40 kDa 对不上","gidx":5,"gn":5,"anchor":"由培养细胞分泌到培养液中的酶"},{"id":"gc10-01-1","ch":7,"part":2,"tag":"机制","stem":"该蛋白的 N-连接糖链加在朝向内质网腔的一侧，据此可知它成熟后","options":["糖链位于膜的胞质侧，并与细胞骨架相连","糖链位于膜的胞外侧，与内质网腔侧相通","糖链埋在脂双层内部，不与水相接触","糖链在膜的两侧分布，各占一半左右","糖链朝向细胞质基质，参与胞内信号转导"],"answer":1,"explain":"B 对：膜蛋白在粗面内质网上合成插入时跨膜取向即已确定，糖链加在内质网腔侧，而腔侧与细胞外侧相通，故成熟后糖链伸向细胞外。A 错：朝向胞质侧的区段不带 N-连接糖链；C 错：糖链是亲水的，不会埋在疏水的脂双层内部；D 错：膜蛋白两侧的组成高度不对称，糖链不会在两侧各占一半；E 错：朝向细胞质基质、参与胞内信号转导的是胞内段，与糖链无关。","type":"A1","group":"c10-01","kind":"mechanism","chs":[7,8,24],"vignette":"在人表皮角质形成细胞中，一种单次跨膜的黏附蛋白（桥粒芯蛋白）在粗面内质网上边合成边插入内质网膜：N 端信号肽被切除，跨膜的疏水区段作为停止转移序列把肽链锚定在膜中，N-连接的糖链则加在朝向内质网腔的一侧。该蛋白随后由 COPII 囊泡运到高尔基复合体，糖链被进一步修剪，表观分子量由 130 kDa 变为 160 kDa，再由囊泡送到相邻细胞相互接触的部位；免疫电镜显示其胞内段经桥粒斑蛋白与角蛋白中间纤维相连。寻常型天疱疮患者的血清中含有识别该蛋白胞外段的抗体，把该抗体加入培养的角质形成细胞单层，12 小时后细胞间黏附丧失、细胞彼此分离；若先用含胞外段的可溶性蛋白预吸附抗体，细胞单层则保持完整。","vignette_title":"情景 1：新合成的桥要搭在哪里","gidx":1,"gn":5,"anchor":"N-连接的糖链则加在朝向内质网腔的一侧"},{"id":"gc10-01-5","ch":7,"part":2,"tag":"判读","stem":"关于这一蛋白从合成到在细胞间形成连接的链条，下列判断正确的是（X 型多选）","options":["膜蛋白的跨膜取向在粗面内质网合成插入时即已确定","该蛋白需要获得甘露糖-6-磷酸标签才能送到细胞表面","该蛋白的胞外段在细胞间隙与相邻细胞的同类蛋白结合","自身抗体识别的是该蛋白朝向细胞质的胞内段","细胞间黏附丧失可使皮肤黏膜出现水疱"],"answer":[0,2,4],"explain":"答案 ACE。A 对：膜蛋白的跨膜取向由粗面内质网合成插入时的停止转移序列决定，此后不再改变；C 对：该蛋白属钙黏素家族，以胞外段与相邻细胞的同类分子进行同亲性结合；E 对：细胞间黏附丧失使表皮细胞彼此分离，皮肤黏膜出现水疱。B 错：甘露糖-6-磷酸是溶酶体水解酶的分选标签，与膜蛋白投递到细胞表面无关；D 错：情景给出的抗体识别的是胞外段，不是胞内段。","type":"X","group":"c10-01","kind":"mechanism","chs":[7,8,24],"vignette":"在人表皮角质形成细胞中，一种单次跨膜的黏附蛋白（桥粒芯蛋白）在粗面内质网上边合成边插入内质网膜：N 端信号肽被切除，跨膜的疏水区段作为停止转移序列把肽链锚定在膜中，N-连接的糖链则加在朝向内质网腔的一侧。该蛋白随后由 COPII 囊泡运到高尔基复合体，糖链被进一步修剪，表观分子量由 130 kDa 变为 160 kDa，再由囊泡送到相邻细胞相互接触的部位；免疫电镜显示其胞内段经桥粒斑蛋白与角蛋白中间纤维相连。寻常型天疱疮患者的血清中含有识别该蛋白胞外段的抗体，把该抗体加入培养的角质形成细胞单层，12 小时后细胞间黏附丧失、细胞彼此分离；若先用含胞外段的可溶性蛋白预吸附抗体，细胞单层则保持完整。","vignette_title":"情景 1：新合成的桥要搭在哪里","gidx":5,"gn":5,"anchor":"把该抗体加入培养的角质形成细胞单层"},{"id":"gc11-03-4","ch":7,"part":2,"tag":"判读","stem":"该患者肝细胞内脂滴增多而血中 VLDL 低于正常，最合理的解释是","options":["肝内脂肪酸的β氧化增强，乙酰辅酶A大量转向酮体生成","载脂蛋白在溶酶体内被大量降解，不能在内质网组装 VLDL","SAM 不足使磷脂酰胆碱合成减少，VLDL 组装与分泌受阻","高尔基复合体的糖基化功能增强，VLDL 被过度修饰而滞留","甘油三酯合成酶活性下降，肝内脂肪不能被正常酯化"],"answer":2,"explain":"C 对：甲硫氨酸循环受阻使 S-腺苷甲硫氨酸生成减少，磷脂酰乙醇胺接受甲基生成磷脂酰胆碱的原料不足；磷脂酰胆碱是肝细胞在内质网组装 VLDL 所必需的，组装与随后的分泌受阻，甘油三酯只能以脂滴形式在肝内堆积，故出现肝内脂滴增多而血中 VLDL 偏低，内质网腔扩张也与此相关。A 错：脂肪酸β氧化增强会减少酯化，不会造成肝内脂滴增多。B 错：载脂蛋白属分泌蛋白，不在溶酶体内被大量降解。D 错：糖基化增强不会使 VLDL 滞留在肝内。E 错：甘油三酯合成酶活性下降应使肝内脂滴减少，与情景相反。","type":"A1","gro
