":"情景 3：隔着一层滤膜的两个结果","gidx":2,"gn":5,"anchor":"甲组中保持未分化表型的细胞占82%"},{"id":"gc18-03-3","ch":28,"part":5,"tag":"判读","stem":"给丙组补加干细胞因子后干性细胞也只升到34%，这一结果说明","options":["干细胞因子对造血干细胞干性的维持作用很弱","乙组细胞已走向终末分化，难以再回到干性","滤膜的孔径过小，把干细胞因子也一并阻挡在外","可溶因子的作用有限，不能替代接触依赖的信号","造血干细胞的自我更新主要由细胞因子浓度决定"],"answer":3,"explain":"D 对：丙组补加干细胞因子只升到 34%，远低于甲组的 82%，说明可溶因子的作用有限，不能替代需要细胞接触的信号。A 错：丙组由 9% 升到 34%，说明干细胞因子确有作用，只是作用有限。B 错：乙组细胞仍在分裂，并未全部走向终末分化。C 错：滤膜孔径为 0.4µm，细胞因子等可溶分子能自由通过，不会被挡住。E 错：若自我更新只由细胞因子浓度决定，丙组补足因子后应与甲组接近，实测并非如此。","type":"A1","group":"c18-03","kind":"mechanism","chs":[28,25,27],"vignette":"研究者把小鼠造血干细胞分为三组培养：甲组与成骨细胞在同一培养皿中直接接触；乙组与成骨细胞之间隔一层孔径0.4µm的滤膜，培养液可自由通过而细胞不能接触；丙组不铺成骨细胞，仅用基础培养液培养。7天后，甲组中保持未分化表型的细胞占82%，乙组降到21%，丙组只有9%；给丙组补加干细胞因子后也只升到34%。甲组细胞中Notch受体的胞内段进入细胞核，其靶基因Hes1的转录本比乙组高6倍；加入γ-分泌酶抑制剂DAPT后，甲组该比例降到18%。稀释实验显示，甲组细胞每4次分裂中有3次产生一个保持干性的子细胞与一个开始表达髓系标志的子细胞，乙组细胞则大多分裂成两个走向分化的子细胞。","vignette_title":"情景 3：隔着一层滤膜的两个结果","gidx":3,"gn":5,"anchor":"给丙组补加干细胞因子后也只升到34%"},{"id":"gc18-04-5","ch":28,"part":5,"tag":"判读","stem":"CD44阳性亚群克隆形成率为12%、阴性亚群为0.8%，该结果提示","options":["CD44是结肠癌细胞特有的分化标志物","该细胞系中各类细胞的致瘤能力大致相同","克隆形成率的高低由培养基的血清浓度决定","肿瘤细胞群体存在异质性，少数细胞克隆能力很强","CD44阴性细胞已丧失自我更新的能力"],"answer":3,"explain":"D 对：同一株细胞中两个亚群的克隆形成率相差 15 倍，说明肿瘤细胞群体存在功能异质性，只有少数细胞的克隆能力很强，符合肿瘤干细胞的认识。A 错：CD44 并非结肠癌特有的分化标志物，多种正常细胞也表达它，本实验只把它当作分选标记。B 错：两个亚群克隆形成率相差悬殊，说明各类细胞的致瘤与克隆能力并不相同。C 错：两个亚群在同一培养条件下接种，血清浓度相同，差异不来自培养基。E 错：CD44 阴性亚群仍有 0.8% 的克隆形成率，说明其中仍有能自我更新的细胞。","type":"A1","group":"c18-04","kind":"experiment","chs":[29,26,28],"vignette":"把同一株人结肠癌细胞分成四组：甲组加凋亡诱导剂，乙组反复冻融，丙组换入无血清培养液，丁组不加药。24小时后检测：甲组亚二倍体DNA峰由2%升到31%，活化caspase-3阳性率42%，线粒体膜电位下降的细胞占39%，PI阳性率11%；乙组PI阳性率86%，上清乳酸脱氢酶活性为对照的7倍，活化caspase-3阳性率4%；丙组LC3B-II与LC3B-I的比值由0.3升到2.1、p62由1.0降到0.4，PI阳性率9%，电镜下见双层膜结构包裹线粒体断片。随后四组各按每皿500个接种，10天后计数集落：甲组42个，乙组0个，丙组168个，丁组205个，即丙组克隆形成率约为丁组的82%、甲组约为20%。分选出的CD44阳性亚群克隆形成率为12%，阴性亚群为0.8%。","vignette_title":"情景 4：四组细胞与一次克隆计数","gidx":5,"gn":6,"anchor":"CD44阳性亚群克隆形成率为12%"},{"id":"gc25-02-2","ch":28,"part":5,"tag":"判读","stem":"丙组撤除 LIF 后仍呈碱性磷酸酶染色阳性并能连续传代，这一结果说明","options":["持续活化的 STAT3 可以替代 LIF 维持胚胎干细胞的自我更新","LIF 通过抑制 STAT3 的活性来维持胚胎干细胞的未分化状态","碱性磷酸酶阳性细胞已经进入终末分化，只是形态尚未改变","撤除 LIF 后胚胎干细胞会走向凋亡，丙组细胞的死亡速度较慢","STAT3 突变体改变了细胞的基因组序列，使细胞获得干性"],"answer":0,"explain":"A 对：丙组撤除 LIF 却补上了持续活化的 STAT3，结果与含 LIF 的甲组相同，说明 LIF 维持干性的关键下游环节就是 STAT3 的活化，活化 STAT3 可替代 LIF。B 与丙组结果方向相反；C 碱性磷酸酶染色阳性是未分化状态的判据，与终末分化矛盾；D 丙组并未死亡；E 导入的是表达质粒与点突变，干性来自表达程序的改变，并非基因组序列被改写。","type":"A1","group":"c25-02","kind":"mechanism","chs":[27,28,25],"vignette":"把小鼠胚胎干细胞分成三组培养：甲组培养液中含白血病抑制因子（LIF）；乙组撤除 LIF；丙组撤除 LIF，同时导入一个持续活化的 STAT3 突变体。培养 5 天后，甲组与丙组仍呈碱性磷酸酶染色阳性，Oct4 与 Sox2 的转录本维持在高水平，形成的克隆能连续传代；乙组 Oct4 转录本降到原来的 15%，细胞内出现三个胚层的标志分子，克隆变为铺展的扁平细胞。检测显示，LIF 作用 10 分钟后 STAT3 在酪氨酸残基上被磷酸化，由细胞质转入细胞核；甲组 Oct4 基因启动子区的 H3K4 三甲基化水平高、DNA 甲基化只有 12%，乙组同一区域的 H3K27 三甲基化升高、DNA 甲基化升到 68%。乙组在撤除 LIF 第 5 天再补回 LIF，Oct4 的转录本只回升到原来的 20%。","vignette_title":"情景 2：把干性开关按下去以后","gidx":2,"gn":5,"anchor":"形成的克隆能连续传代"},{"id":"gc25-02-5","ch":28,"part":5,"tag":"判读","stem":"关于本实验中干细胞的自我更新与分化，下列判断正确的是（X 型多选）","options":["碱性磷酸酶染色阳性可作为细胞保持未分化状态的判据","乙组出现三个胚层的标志分子，说明该细胞的基因组仍然完整","撤除 LIF 后细胞的基因组发生改变，故出现三个胚层的标志分子","Oct4 与 Sox2 等核心转录因子维持细胞的多潜能性","丙组的结果说明 LIF 维持干性的作用与 STAT3 的活化无关"],"answer":[0,1,3],"explain":"答案 ABD。A 对：胚胎干细胞未分化时碱性磷酸酶染色阳性，可作为未分化状态的判据。B 对：同一个细胞能出现三个胚层的标志分子，说明其基因组完整、分化来自选择性表达而非基因丢失。D 对：Oct4、Sox2 与 Nanog 组成的核心网络激活干性基因、抑制分化基因。C 错：分化不改变基因组序列。E 错：丙组撤除 LIF 而仅活化 STAT3 即可维持干性，恰恰说明该作用依赖 STAT3 的活化。","type":"X","group":"c25-02","kind":"mechanism","chs":[27,28,25],"vignette":"把小鼠胚胎干细胞分成三组培养：甲组培养液中含白血病抑制因子（LIF）；乙组撤除 LIF；丙组撤除 LIF，同时导入一个持续活化的 STAT3 突变体。培养 5 天后，甲组与丙组仍呈碱性磷酸酶染色阳性，Oct4 与 Sox2 的转录本维持在高水平，形成的克隆能连续传代；乙组 Oct4 转录本降到原来的 15%，细胞内出现三个胚层的标志分子，克隆变为铺展的扁平细胞。检测显示，LIF 作用 10 分钟后 STAT3 在酪氨酸残基上被磷酸化，由细胞质转入细胞核；甲组 Oct4 基因启动子区的 H3K4 三甲基化水平高、DNA 甲基化只有 12%，乙组同一区域的 H3K27 三甲基化升高、DNA 甲基化升到 68%。乙组在撤除 LIF 第 5 天再补回 LIF，Oct4 的转录本只回升到原来的 20%。","vignette_title":"情景 2：把干性开关按下去以后","gidx":5,"gn":5,"anchor":"细胞内出现三个胚层的标志分子"},{"id":"gc9-03-1","ch":28,"part":5,"tag":"识别","stem":"该实验中四种因子使成纤维细胞形成 iPS 集落，其本质是","options":["成纤维细胞与残存的胚胎干细胞发生自发融合","成纤维细胞的基因组发生定向突变而获得干性","成纤维细胞被诱导凋亡后由干细胞重新填充","体细胞在因子作用下被重编程为多潜能干细胞","导入的因子直接替换了成纤维细胞原有的细胞核"],"answer":3,"explain":"D 对：只导入四种转录因子就使成体成纤维细胞获得多潜能性，这正是 iPS 技术的核心，属于体细胞重编程。A 错：实验中没有与胚胎干细胞共培养，集落来自被导入因子的成纤维细胞。B 错：重编程不改变基因组序列，情景也已说明基因组序列没有改变。E 错：导入的是转录因子蛋白，细胞核并未被替换，这与核移植完全不同。C 错：集落是存活并增殖的细胞，不是凋亡后由外源干细胞填充形成的。","type":"A1","group":"c9-03","kind":"mechanism","chs":[28,22,10],"vignette":"研究者取小鼠尾尖成纤维细胞，导入 Oct4、Sox2、Klf4、c-Myc 四种转录因子，表达出的目的蛋白约 45 kDa，需从细胞质进入细胞核才能结合基因组。培养约两周后，约 0.1% 的细胞形成碱性磷酸酶染色阳性的集落。检测显示：成纤维细胞标志基因的转录本在第 3 天开始下降，第 10 天几乎检测不到，其启动子区 DNA 甲基化由 15% 升至 75%、组蛋白乙酰化降低；与此同时，内源 Oct4 基因的启动子区 DNA 甲基化由 70% 降至 20%，内源 Oct4、Sox2 与 Nanog 依次被激活。这些细胞的基因组序列没有改变，被重置的是基因表达程序；它们在形态、标志与三胚层分化能力上与胚胎干细胞相似，但仍保留部分成纤维细胞的表观遗传记忆。","vignette_title":"情景 3：把成纤维细胞改写成干细胞","gidx":1,"gn":5,"anchor":"形成碱性磷酸酶染色阳性的集落"},{"id":"gc9-03-4","ch":28,"part":5,"tag":"判读","stem":"对获得的 iPS 细胞与胚胎干细胞的比较，最恰当的叙述是","options":["由囊胚内细胞团分离获得，与导入因子无关","由胚胎成纤维细胞获得，成体细胞无法被重编程","由成体干细胞直接扩增获得，无需重编程过程","与胚胎干细胞高度相似，两者在应用上可互换","生物学功能与胚胎干细胞相似，保留表观记忆"],"answer":4,"explain":"E 对：情景给出这些细胞在形态、标志与三胚层分化能力上与胚胎干细胞相似，同时保留来源细胞的表观遗传记忆，这正是 iPS 与 ESC 的差异所在。D 错：两者来源不同（体细胞重编程与囊胚内细胞团），还存在表观记忆与致瘤风险，不能简单互换使用。A 错：本实验细胞来自小鼠尾尖成纤维细胞，不是囊胚内细胞团。C 错：成体干细胞扩增不能产生多潜能性，必须经过重编程。B 错：本实验用的正是成体（尾尖）成纤维细胞，说明成体细胞可以被重编程。","type":"A1","group":"c9-03","kind":"mechanism","chs":[28,22,10],"vignette":"研究者取小鼠尾尖成纤维细胞，导入 Oct4、Sox2、Klf4、c-Myc 四种转录因子，表达出的目的蛋白约 45 kDa，需从细胞质进入细胞核才能结合基因组。培养约两周后，约 0.1% 的细胞形成碱性磷酸酶染色阳性的集落。检测显示：成纤维细胞标志基因的转录本在第 3 天开始下降，第 10 天几乎检测不到，其启动子区 DNA 甲基化由 15% 升至 75%、组蛋白乙酰化降低；与此同时，内源 Oct4 基因的启动子区 DNA 甲基化由 70% 降至 20%，内源 Oct4、Sox2 与 Nanog 依次被激活。这些细胞的基因组序列没有改变，被重置的是基因表达程序；它们在形态、标志与三胚层分化能力上与胚胎干细胞相似，但仍保留部分成纤维细胞的表观遗传记忆。","vignette_title":"情景 3：把成纤维细胞改写成干细胞","gidx":4,"gn":5,"anchor":"仍保留部分成纤维细胞的表观遗传记忆"},{"id":"gc9-04-4","ch":28,"part":5,"tag":"方案","stem":"判定分选出的 CD34 阳性 CD38 阴性细胞为造血干细胞，最可靠的依据是","options":["细胞形态与骨髓基质细胞相似且核型正常","细胞在流式图上位于 CD38 阴性区域","体外培养中可形成三系集落并可贴壁生长","细胞表面 CD34 表达阳性即可作出判定","移植后长期重建受者造血，连续移植仍可重建"],"answer":4,"explain":"E 对：造血干细胞鉴定的功能金标准是移植后能长期重建受者的全部造血与免疫系统，并以连续移植证实其自我更新能力，与情景所述一致。C 错：集落形成与贴壁生长只是体外特性，不能证明体内长期重建能力。D 错：CD34 也表达于定向祖细胞，单凭 CD34 阳性不能判定为造血干细胞。A 错：形态相似与核型正常不能说明功能，骨髓基质细胞并非造血干细胞。B 错：CD38 阴性只是表型特征，必须与功能实验结合，不能单独作为判据。","type":"A1","group":"c9-04","kind":"experiment","chs":[22,27,28],"vignette":"研究生小陈把 β-珠蛋白基因上游 2 kb 的增强子片段接到荧光素酶报告基因上，分别转入红系细胞与宫颈癌细胞。红系中荧光素酶活性是宫颈癌细胞的 40 倍；把片段中一段 12 bp 序列定点突变后，红系中的活性倍数降到 3 倍。EMSA 中，红系核提取物与该 12 bp 探针孵育出现一条滞后条带，加入 50 倍未标记的同源探针后条带消失，加入抗 GATA-1 抗体后出现迁移更慢的条带。ChIP 显示抗 GATA-1 抗体沉淀的 DNA 中，该增强子片段富集 25 倍，对照抗体为 1 倍。另一部分实验里，流式分选出的 CD34 阳性 CD38 阴性细胞在受照小鼠体内能长期重建全部血细胞，连续移植仍可重建；把同一报告基因转入正在向红系分化的 CD34 阳性细胞后，活性随培养天数逐步升高。","vignette_title":"情景 4：一条滞后条带引出的四个实验","gidx":4,"gn":6,"anchor":"在受照小鼠体内能长期重建全部血细胞"},{"id":"gc9-04-6","ch":28,"part":5,"tag":"判读","stem":"关于上述报告基因、EMSA、ChIP 与分选实验，下列判断正确的是（X 型多选）","options":["ChIP 结果与 EMSA 结果在结论上可以相互支持","报告基因活性差异提示该片段具有红系特异增强子活性","CD34 阳性细胞群中可能混有非干细胞的祖细胞成分","EMSA 的竞争实验说明蛋白与探针的结合具有序列特异性","报告基因实验可证明导入片段改变了细胞基因组序列"],"answer":[0,1,2,3],"explain":"答案 ABCD。B 对应同一片段在红系与宫颈癌细胞间的活性差异，说明增强子活性具有细胞类型特异性；D 对应竞争实验结果；C 说明 ChIP 与 EMSA 分别从染色质与体外结合两个层面给出一致的证据；D 说明 CD34 也标志定向祖细胞，分选群并非纯的干细胞。E 错：报告基因实验只反映调控活性，不改变细胞的基因组序列，该片段位于质粒上。","type":"X","group":"c9-04","kind":"experiment","chs":[22,27,28],"vignette":"研究生小陈把 β-珠蛋白基因上游 2 kb 的增强子片段接到荧光素酶报告基因上，分别转入红系细胞与宫颈癌细胞。红系中荧光素酶活性是宫颈癌细胞的 40 倍；把片段中一段 12 bp 序列定点突变后，红系中的活性倍数降到 3 倍。EMSA 中，红系核提取物与该 12 bp 探针孵育出现一条滞后条带，加入 50 倍未标记的同源探针后条带消失，加入抗 GATA-1 抗体后出现迁移更慢的条带。ChIP 显示抗 GATA-1 抗体沉淀的 DNA 中，该增强子片段富集 25 倍，对照抗体为 1 倍。另一部分实验里，流式分选出的 CD34 阳性 CD38 阴性细胞在受照小鼠体内能长期重建全部血细胞，连续移植仍可重建；把同一报告基因转入正在向红系分化的 CD34 阳性细胞后，活性随培养天数逐步升高。","vignette_title":"情景 4：一条滞后条带引出的四个实验","gidx":6,"gn":6,"anchor":"该增强子片段富集 25 倍"},{"ch":28,"part":5,"tag":"干细胞分类","stem":"关于干细胞分类与生物学特性的叙述，正确的是：","options":["根据来源不同可将干细胞分为全能干细胞、多能干细胞和单能干细胞","成体干细胞均具有全能性，可分化为完整个体","单能干细胞只能自我更新而不能分化","干细胞的定义只强调无限增殖能力，与分化潜能无关","胚胎干细胞属于多潜能性干细胞，可分化为三个胚层的细胞，但不能形成完整个体所需的胚外组织（如胎盘）"],"answer":4,"explain":"按分化潜能分为全能、多潜能性、多能和单能干细胞；按来源分为胚胎干细胞与成体干细胞，成体干细胞不具全能性。","type":"A1","id":"c28-f94657ed"},{"ch":28,"part":5,"tag":"造血干细胞","stem":"关于造血干细胞（HSC）的叙述，正确的是：","options":["HSC 主要存在于骨髓，具有自我更新和多向分化能力，是能重建受照动物全部造血与免疫系统的成体干细胞，常用 CD34 等标志加以鉴定","HSC 只存在于外周血中，骨髓中不存在","HSC 只能分化为红细胞，不能分化为淋巴细胞","HSC 缺乏自我更新能力，需由胚胎干细胞持续补充","HSC 用于移植治疗前必须先在体外去除细胞核"],"answer":0,"explain":"HSC 是骨髓中的成体干细胞，具自我更新与多向分化能力，可分化为红系、粒系、淋巴系等全部血细胞。","type":"A1","id":"c28-186db0d6"},{"ch":28,"part":5,"tag":"间充质干细胞","stem":"关于间充质干细胞（MSC）的临床应用及其原理，下列叙述正确的是：","options":["MSC 只能分化为成骨细胞，故临床仅用于骨折愈合","MSC 可从骨髓、脐带、脂肪等组织获得，具有多向分化能力，并通过分泌细胞因子和免疫调节作用促进组织修复，可用于移植物抗宿主病等治疗","MSC 的治疗作用完全依赖于植入后长期存活并直接替换受损组织","MSC 免疫原性很强，应用前必须严格配型并长期使用免疫抑制剂","MSC 属于胚胎干细胞，须从囊胚内细胞团分离获得"],"answer":1,"explain":"MSC 属成体干细胞，具有多向分化、低免疫原性及免疫调节与旁分泌作用，是临床应用最广的干细胞之一。","type":"A1","id":"c28-759f75dc"},{"ch":28,"part":5,"tag":"ESC鉴定","stem":"证明胚胎干细胞（ESC）具有多潜能性的关键技术或实验是：","options":["核型分析证明染色体数目正常即可证明其多潜能性","检测端粒长度可证明其多潜能性","流式检测 CD34 表达是鉴定 ESC 多潜能性的经典方法","通过碱性磷酸酶染色、SSEA-3/4 等标志检测，以及体外形成拟胚体、定向诱导分化和体内形成畸胎瘤来证明其多潜能性","通过核移植形成克隆胚胎是鉴定 ESC 多潜能性的关键技术"],"answer":3,"explain":"ESC 多潜能性需体外分化实验与体内畸胎瘤实验等综合判定；CD34 是 HSC 标志，核移植证明的是细胞核全能性。","type":"A1","id":"c28-b0ec01c2"},{"ch":28,"part":5,"tag":"核心因子","stem":"关于维持胚胎干细胞干性的核心网络调控分子，下列叙述正确的是：","options":["Oct4、Sox2、Nanog 是促分化因子，其表达下调有利于维持干性","Oct4（POU5F1）、Sox2 与 Nanog 构成核心转录因子网络，激活干性相关基因、抑制分化相关基因，共同维持 ESC 的自我更新与多潜能性","只要单独表达 Oct4 即可维持 ESC 的干性，与其他因子无关","这些核心因子通过改变 DNA 序列来维持细胞干性","核心调控因子只在成体干细胞中表达，ESC 中并不表达"],"answer":1,"explain":"Oct4/Sox2/Nanog 形成自调控环路维持干性，任一因子表达失衡都会导致分化倾向改变。","type":"A1","id":"c28-c6520cf9"},{"ch":28,"part":5,"tag":"iPS细胞","stem":"关于诱导性多潜能干细胞（iPS 细胞）的叙述，正确的是：","options":["iPS 细胞由体细胞导入 Oct4、Sox2、Klf4、c-Myc 等重编程因子获得，与 ESC 生物学功能相似，但供体细胞来自体细胞（可为患者自体），规避了胚胎使用的伦理争议","iPS 细胞来源于囊胚内细胞团，与 ESC 的来源完全相同","iPS 细胞与 ESC 完全等同，不存在任何表观遗传学差异","iPS 细胞的应用不存在致瘤风险","iPS 细胞只能由胚胎成纤维细胞获得，成体细胞不能被重编程"],"answer":0,"explain":"iPS 与 ESC 来源不同（体细胞重编程 vs 囊胚内细胞团），功能相似但存在表观遗传记忆与致瘤风险。","type":"A1","id":"c28-e148fb2e"},{"ch":28,"part":5,"tag":"肿瘤干细胞","stem":"关于肿瘤干细胞学说的叙述，正确的是：","options":["肿瘤组织中所有细胞都具有相同的致瘤能力","肿瘤干细胞不具有自我更新能力，仅由普通肿瘤细胞随机产生","肿瘤干细胞对化疗药物高度敏感，因此化疗可根治肿瘤","肿瘤组织中存在一小群具有自我更新和多向分化能力的肿瘤干细胞，是肿瘤发生、转移、耐药与复发的根源，靶向该群细胞有望改善疗效","肿瘤干细胞与正常干细胞无关，也不受微环境调控"],"answer":3,"explain":"肿瘤干细胞学说认为肿瘤细胞存在异质性，仅少数细胞具致瘤与自我更新能力，其对常规治疗耐受导致复发。","type":"A1","id":"c28-cb819858"},{"ch":28,"part":5,"tag":"微环境","stem":"关于干细胞微环境（niche）的叙述，正确的是：","options":["干细胞微环境仅提供机械支撑，不参与信号调控","干细胞微环境由相邻细胞、细胞外基质和细胞因子等组成，通过信号分子精密调控干细胞数量以及自我更新与分化的平衡，其异常可导致干细胞功能紊乱","干细胞在体外无需添加任何因子即可无限保持干性","微环境只影响干细胞的分化，不影响其数量","微环境异常与干细胞相关疾病的发生无关"],"answer":1,"explain":"干细胞的增殖与分化受微环境精密调控，niche 信号失衡会导致干细胞耗竭或过度增殖。","type":"A1","id":"c28-fc17932b"},{"ch":28,"part":5,"tag":"干细胞定义","stem":"干细胞具有的两大基本生物学特征是：","options":["无限增殖能力与永生化表型","高度的迁移能力与免疫豁免特性","染色体数目异常与端粒持续延长","自我更新能力与多向分化潜能","只进行对称分裂与不进入 G0 期"],"answer":3,"explain":"干细胞通过自我更新维持自身数量、通过多向分化产生多种功能细胞，这是其两大基本特征。","type":"A1","id":"c28-0198f728"},{"ch":28,"part":5,"tag":"不对称分裂","stem":"造血干细胞通过不对称分裂产生一个干细胞和一个定向祖细胞，其生物学意义是：","options":["使干细胞数量成倍增加，迅速扩大干细胞池","使全部子代细胞都立即走向终末分化，干细胞被耗竭","使干细胞完全退出细胞周期而长期处于 G0 期，不再产生血细胞","在维持干细胞数量相对稳定的同时持续提供可用于分化的祖细胞，保证组织更新与稳态","通过改变基因组使两个子代细胞获得不同的遗传信息"],"answer":3,"explain":"不对称分裂一个子代保持干性、另一个进入分化，兼顾干细胞池维持与组织细胞供应，由微环境信号决定。","type":"A1","id":"c28-fdf6a95e"},{"ch":28,"part":5,"tag":"HSC鉴定","stem":"鉴定和评价造血干细胞（HSC）时最可靠的功能标准是：","options":["CD34 是造血干细胞的特异性标志，凡 CD34 阳性细胞均为 HSC","只要细胞在体外能贴壁生长即可判定为 HSC","HSC 缺乏自我更新能力，体外培养中会很快全部消失","移植后能长期重建受者全部造血与免疫系统，并经连续移植实验证实其自我更新能力，同时结合 CD34、CD38、Lin 等标志鉴定","HSC 表面标志与人胚胎干细胞（ESC）完全相同，可用 SSEA-4 单独鉴定"],"answer":3,"explain":"CD34 也表达于祖细胞，HSC 鉴定需多种标志联合，并以体内长期多系重建与连续移植作为功能金标准。","type":"A1","id":"c28-2dbb95e5"},{"ch":28,"part":5,"tag":"骨髓移植","stem":"关于造血干细胞移植（骨髓移植）的关键环节与原理，正确的是：","options":["移植前必须用药物彻底清除受者全部骨髓基质细胞，否则干细胞不能归巢","移植物中起治疗作用的成分是成熟红细胞，与干细胞无关","供者与受者必须为同卵双生，否则一定发生移植排斥","移植后受者造血功能由输注的成熟血细胞直接提供，可持续终身","植入的 HSC 需经静脉输注并归巢至骨髓龛，凭借自我更新与多向分化重建受者造血与免疫系统"],"answer":4,"explain":"HSC 经静脉输注后归巢到骨髓龛，靠自我更新和多向分化长期重建造血与免疫；移植物抗宿主病是主要并发症。","type":"A1","id":"c28-94dc768b"},{"ch":28,"part":5,"tag":"ESC建系","stem":"关于胚胎干细胞（ESC）的建系来源与特性，正确的是：","options":["ESC 来自囊胚内细胞团或原始生殖细胞，在体外可保持未分化状态并具有正常二倍体核型，可分化为三个胚层来源的细胞","ESC 来自成体骨髓基质，取材方便且无伦理争议","ESC 在体外培养中会自动分化为神经细胞，无法保持未分化状态","ESC 的核型多为非整倍体，这是其多潜能性的标志","ESC 只能分化为中胚层来源的细胞，不能形成内胚层与神经组织"],"answer":0,"explain":"ESC 源于囊胚内细胞团，体外可维持未分化、正常核型及三胚层分化潜能；其使用涉及胚胎来源的伦理争议。","type":"A1","id":"c28-041df292"},{"ch":28,"part":5,"tag":"iPS应用","stem":"诱导性多潜能干细胞（iPS 细胞）在再生医学与疾病研究中的主要优势是：","options":["诱导过程不引入外源基因，可直接用于体内而不存在致瘤风险","iPS 细胞的表观遗传状态与来源体细胞完全相同，不保留任何记忆","iPS 细胞可直接在体内分化为所需细胞，无需体外定向诱导","可由患者自身体细胞重编程获得，用于疾病建模与个体化细胞治疗，规避了胚胎使用的伦理争议","iPS 细胞来源于成体干细胞，无需导入任何重编程因子即可获得"],"answer":3,"explain":"iPS 由体细胞重编程获得，可用患者自体细胞规避伦理争议；但仍存在致瘤风险与表观遗传记忆问题。","type":"A1","id":"c28-a856f077"},{"ch":28,"part":5,"tag":"干细胞微环境","stem":"关于干细胞微环境（niche）组成与作用的典型模式，正确的是：","options":["niche 仅由细胞外基质构成，不包含任何细胞成分","niche 通过直接改变干细胞 DNA 序列来决定其分化方向","成体干细胞不需要 niche，可在体内任意位置生存并保持干性","骨髓 HSC 的 niche 由成骨细胞、血管内皮细胞等细胞成分及细胞外基质、细胞因子共同组成，其信号失衡可使干细胞耗竭或过度增殖","niche 只影响干细胞的分化方向，对干细胞的增殖与数量毫无影响"],"answer":3,"explain":"niche 包括细胞成分（成骨细胞、内皮细胞等）、细胞外基质和细胞因子，维持干细胞数量与自我更新-分化平衡。","type":"A1","id":"c28-523c65f3"},{"ch":28,"part":5,"tag":"成体干细胞","stem":"关于成体干细胞的分布与分化特点，正确的是：","options":["成体干细胞分布于多种组织，其分化方向通常局限于所在组织的谱系，并需以各自的标志物加以鉴定","成体干细胞只存在于骨髓，其他组织如神经、皮肤、肠道中均不含干细胞","不同组织中的成体干细胞具有完全相同的分化方向和标志物，可以通用","成体干细胞均为多潜能性干细胞，可分化为三个胚层来源的全部细胞","成体干细胞不具有自我更新能力，只能由胚胎干细胞持续补充"],"answer":0,"explain":"成体干细胞分布广泛但分化潜能多为单能或多能，局限于所在组织谱系，需用各自特异标志鉴定。","type":"A1","id":"c28-42ac4d15"},{"id":"gc18-01-1","ch":29,"part":5,"tag":"机制","stem":"甲株中线粒体途径被放大，其关键环节是","options":["活化的caspase-8切割Bid，生成的tBid激活Bax","活化的caspase-8切割ICAD，释放CAD进入细胞核","活化的caspase-8直接切割细胞色素c，使其外漏","活化的caspase-8抑制线粒体呼吸链，使细胞色素c外漏","活化的caspase-8降解Bcl-2，解除其对Bax的钳制"],"answer":0,"explain":"A 对：情景中的 tBid 正是 caspase-8 切割 Bid 的产物，它使 Bax 活化并在线粒体外膜成孔，内源途径由此被放大。B 错：切割 ICAD 释放 CAD 是效应酶在执行相完成的核内事件，与线粒体途径的放大无关。C 错：细胞色素 c 并非 caspase 的底物，它是被 Bax 与 Bak 形成的孔道释放的。D 错：caspase-8 不直接抑制呼吸链，细胞色素 c 的外漏依赖线粒体外膜通透化。E 错：caspase-8 并不降解 Bcl-2，Bcl-2 反而抑制这条放大途径。","type":"A1","group":"c18-01","kind":"mechanism","chs":[29,26,6],"vignette":"实验室拿到两株人B淋巴瘤细胞，表面都表达Fas。加入同浓度的抗Fas抗体后，甲株6小时内78%的细胞出现膜出泡与核浓缩，乙株只有12%。检测显示：甲株在30分钟内出现caspase-8的活化片段，2小时后胞质中细胞色素c由0.3升到5.1ng/µg蛋白，同时检测到tBid；乙株的caspase-8同样被活化，胞质细胞色素c却始终低于0.4ng/µg，其Bcl-2表达量是甲株的9倍，Bcl-2基因旁侧因染色体易位而带有一段活跃的增强子。把乙株的Bcl-2用小干扰RNA下调后，凋亡率回到71%；在甲株中敲除Bax与Bak，凋亡率降到15%。两株细胞在凋亡后期都出现核纤层蛋白的切割片段。","vignette_title":"情景 1：同一个受体，两种结局","gidx":1,"gn":5,"anchor":"同时检测到tBid"},{"id":"gc18-01-3","ch":29,"part":5,"tag":"判读","stem":"两株细胞后期都出现核纤层蛋白的切割片段，完成该切割的酶与相应后果是","options":["起始酶caspase-9，切割后线粒体外膜发生通透化","起始酶caspase-8，切割后死亡受体在膜上聚集成簇","效应酶caspase-3，切割后磷脂酰丝氨酸翻到膜外","效应酶caspase-3，切割后DNA被切成梯状条带","效应酶caspase-3，切割后核纤层解体并致核碎裂"],"answer":4,"explain":"E 对：核纤层蛋白由效应酶 caspase-3 等切割，核纤层解体后核被膜崩解、染色质碎裂，这正是核碎裂的分子基础。A 错：caspase-9 是内源途径的起始酶，其作用是激活下游效应酶，并不切割核纤层蛋白。B 错：caspase-8 是外源途径的起始酶，死亡受体的聚集发生在它活化的上游。C 错：磷脂酰丝氨酸翻到膜外是膜不对称性丧失的表现，与核纤层蛋白的切割不是一回事。D 错：DNA 被切成梯状条带由 CAD 入核完成，并非核纤层蛋白切割的直接后果。","type":"A1","group":"c18-01","kind":"mechanism","chs":[29,26,6],"vignette":"实验室拿到两株人B淋巴瘤细胞，表面都表达Fas。加入同浓度的抗Fas抗体后，甲株6小时内78%的细胞出现膜出泡与核浓缩，乙株只有12%。检测显示：甲株在30分钟内出现caspase-8的活化片段，2小时后胞质中细胞色素c由0.3升到5.1ng/µg蛋白，同时检测到tBid；乙株的caspase-8同样被活化，胞质细胞色素c却始终低于0.4ng/µg，其Bcl-2表达量是甲株的9倍，Bcl-2基因旁侧因染色体易位而带有一段活跃的增强子。把乙株的Bcl-2用小干扰RNA下调后，凋亡率回到71%；在甲株中敲除Bax与Bak，凋亡率降到15%。两株细胞在凋亡后期都出现核纤层蛋白的切割片段。","vignette_title":"情景 1：同一个受体，两种结局","gidx":3,"gn":5,"anchor":"核纤层蛋白的切割片段"},{"id":"gc18-01-5","ch":29,"part":5,"tag":"判读","stem":"关于两株细胞的凋亡途径与实验判读，下列判断正确的是（X 型多选）","options":["抗Fas抗体经死亡受体途径激活caspase-8","乙株的抵抗说明其凋亡不依赖线粒体途径的放大","甲株敲除Bax与Bak后凋亡率降低，说明内源途径参与","Bcl-2过表达可阻断线粒体外膜通透化这一环节","两株细胞凋亡的执行都依赖效应caspase的活化"],"answer":[0,2,3,4],"explain":"答案 ACDE。A 对：抗 Fas 抗体结合死亡受体后经其胞内段招募桥接蛋白与 caspase-8 酶原，属外源途径。C 对：敲除 Bax 与 Bak 使甲株凋亡率降到 15%，说明内源途径参与了放大。D 对：Bcl-2 过表达抑制线粒体外膜通透化，正是乙株凋亡率仅 12% 的原因。E 对：两株细胞最终的形态学改变都属凋亡，其执行依赖效应 caspase 的活化。B 错：乙株恰恰需要线粒体途径的放大，把 Bcl-2 下调后凋亡率回到 71%，说明其抵抗来自内源途径被抑制，而不是不依赖它。","type":"X","group":"c18-01","kind":"mechanism","chs":[29,26,6],"vignette":"实验室拿到两株人B淋巴瘤细胞，表面都表达Fas。加入同浓度的抗Fas抗体后，甲株6小时内78%的细胞出现膜出泡与核浓缩，乙株只有12%。检测显示：甲株在30分钟内出现caspase-8的活化片段，2小时后胞质中细胞色素c由0.3升到5.1ng/µg蛋白，同时检测到tBid；乙株的caspase-8同样被活化，胞质细胞色素c却始终低于0.4ng/µg，其Bcl-2表达量是甲株的9倍，Bcl-2基因旁侧因染色体易位而带有一段活跃的增强子。把乙株的Bcl-2用小干扰RNA下调后，凋亡率回到71%；在甲株中敲除Bax与Bak，凋亡率降到15%。两株细胞在凋亡后期都出现核纤层蛋白的切割片段。","vignette_title":"情景 1：同一个受体，两种结局","gidx":5,"gn":5,"anchor":"加入同浓度的抗Fas抗体后"},{"id":"gc18-02-2","ch":29,"part":5,"tag":"判读","stem":"敲低Atg5后凋亡率由45%升到72%，说明在该处理条件下自噬","options":["是细胞死亡的直接执行机制，其增强导致凋亡","通过切割caspase-3酶原，加速凋亡的启动","在凋亡完成之后才被激活，属伴随现象","通过清除错误折叠蛋白维持稳态而保护细胞","为细胞提供ATP，使线粒体途径不能启动"],"answer":3,"explain":"D 对：敲低 Atg5 阻断自噬后凋亡率由 45% 升到 72%、存活率明显下降，说明该条件下自噬通过清除错误折叠蛋白维持稳态而保护细胞。A 错：若自噬是死亡的执行机制，抑制它应当减轻死亡，与结果相反。B 错：自噬不切割 caspase-3 酶原，caspase 的活化由凋亡体或 DISC 等平台完成。C 错：自噬在 4 小时内就已出现，明显早于 12 小时的凋亡，并非凋亡后的伴随现象。E 错：自噬虽可提供代谢底物，但线粒体途径能否启动由 Bcl-2 家族等决定，不能归结为 ATP。","type":"A1","group":"c18-02","kind":"mechanism","chs":[29,7,6],"vignette":"用阻断N-连接糖基化起始的衣霉素处理HeLa细胞，4小时后内质网腔中未折叠蛋白增多，分子伴侣BiP的转录本上调5倍；胞质中LC3B-II与LC3B-I的比值由0.2升到1.6、p62由1.0降到0.3，电镜下可见双层膜结构；一部分错误折叠蛋白经ERAD逆向转运至细胞质，由26S蛋白酶体降解。12小时后活化caspase-3阳性细胞占45%，电泳可见梯状条带。若在加药时用RNA干扰敲低Atg5，LC3B-II不再升高，而凋亡率升到72%、存活率由58%降到26%。另一组细胞过表达Bcl-2后凋亡率降到12%，LC3B-II也由1.6降到0.4；该组再表达BH3突变、不能被Bcl-2结合的Beclin-1，LC3B-II回到1.4而凋亡率仍为12%。","vignette_title":"情景 2：错误折叠蛋白的两种去处","gidx":2,"gn":6,"anchor":"用RNA干扰敲低Atg5"},{"id":"gc18-02-4","ch":29,"part":5,"tag":"机制","stem":"过表达的Bcl-2同时使凋亡率降到12%、LC3B-II由1.6降到0.4，其分子基础是","options":["Bcl-2降解ATG5蛋白，使自噬体无法装配","Bcl-2抑制caspase-8的活化，从而阻断自噬","Bcl-2使溶酶体的酸性水解酶进入失活状态","Bcl-2加快p62的降解，使自噬体无法被清除","Bcl-2结合Beclin-1，抑制自噬的起始"],"answer":4,"explain":"E 对：Bcl-2 通过其 BH3 结合槽结合含 BH3 结构域的 Beclin-1，使自噬起始受阻；同时它抑制 Bax 与 Bak 而阻断凋亡，一个蛋白因此同时看住两条通路。A 错：情景未显示 Bcl-2 影响 Atg5 的量，且 Bcl-2 的作用点在自噬起始而非自噬体装配。B 错：抑制 caspase-8 只影响凋亡的启动，解释不了自噬水平下降。C 错：Bcl-2 不改变溶酶体水解酶的活性状态，本例自噬下降发生在自噬体形成阶段。D 错：p62 是自噬的底物，自噬被抑制时 p62 应蓄积而不是被加快降解。","type":"A1","group":"c18-02","kind":"mechanism","chs":[29,7,6],"vignette":"用阻断N-连接糖基化起始的衣霉素处理HeLa细胞，4小时后内质网腔中未折叠蛋白增多，分子伴侣BiP的转录本上调5倍；胞质中LC3B-II与LC3B-I的比值由0.2升到1.6、p62由1.0降到0.3，电镜下可见双层膜结构；一部分错误折叠蛋白经ERAD逆向转运至细胞质，由26S蛋白酶体降解。12小时后活化caspase-3阳性细胞占45%，电泳可见梯状条带。若在加药时用RNA干扰敲低Atg5，LC3B-II不再升高，而凋亡率升到72%、存活率由58%降到26%。另一组细胞过表达Bcl-2后凋亡率降到12%，LC3B-II也由1.6降到0.4；该组再表达BH3突变、不能被Bcl-2结合的Beclin-1，LC3B-II回到1.4而凋亡率仍为12%。","vignette_title":"情景 2：错误折叠蛋白的两种去处","gidx":4,"gn":6,"anchor":"过表达Bcl-2"},{"id":"gc18-02-5","ch":29,"part":5,"tag":"判读","stem":"在Bcl-2过表达的细胞中表达BH3突变的Beclin-1，自噬恢复而凋亡仍低，说明","options":["Bcl-2抑制凋亡与抑制自噬依赖同一处结合位点","Beclin-1的BH3突变使其转为抑制凋亡的蛋白","Bcl-2抑制自噬靠结合Beclin-1，抑制凋亡另循他途","凋亡与自噬两条通路由同一套caspase共同执行","BH3突变使Beclin-1不能再与Atg5发生结合"],"answer":2,"explain":"C 对：BH3 突变使 Beclin-1 不能被 Bcl-2 结合，自噬因而恢复；而凋亡率仍为 12%，说明 Bcl-2 抑制凋亡靠的是另一条作用方式，即阻止 Bax 与 Bak 的活化。A 错：若两个功能共用同一位点，突变体应同时解除对两条通路的抑制。B 错：BH3 突变的 Beclin-1 仍是自噬起始蛋白，并不转变为抑制凋亡的蛋白。D 错：自噬的执行不依赖 caspase，两条通路各有各的执行分子。E 错：Bcl-2 与 Atg5 并不竞争，情景中的关键界面是 Beclin-1 的 BH3 结构域。","type":"A1","group":"c18-02","kind":"mechanism","chs":[29,7,6],"vignette":"用阻断N-连接糖基化起始的衣霉素处理HeLa细胞，4小时后内质网腔中未折叠蛋白增多，分子伴侣BiP的转录本上调5倍；胞质中LC3B-II与LC3B-I的比值由0.2升到1.6、p62由1.0降到0.3，电镜下可见双层膜结构；一部分错误折叠蛋白经ERAD逆向转运至细胞质，由26S蛋白酶体降解。12小时后活化caspase-3阳性细胞占45%，电泳可见梯状条带。若在加药时用RNA干扰敲低Atg5，LC3B-II不再升高，而凋亡率升到72%、存活率由58%降到26%。另一组细胞过表达Bcl-2后凋亡率降到12%，LC3B-II也由1.6降到0.4；该组再表达BH3突变、不能被Bcl-2结合的Beclin-1，LC3B-II回到1.4而凋亡率仍为12%。","vignette_title":"情景 2：错误折叠蛋白的两种去处","gidx":5,"gn":6,"anchor":"不能被Bcl-2结合的Beclin-1"},{"id":"gc18-02-6","ch":29,"part":5,"tag":"判读","stem":"关于本实验中自噬与凋亡的关系，下列判断正确的是（X 型多选）","options":["衣霉素引起的未折叠蛋白反应可同时启动自噬与凋亡","敲低Atg5后凋亡加重，说明该条件下自噬具保护作用","LC3B-II升高即可判定细胞走向自噬性死亡","凋亡的执行必须依赖caspase级联，而自噬的起始不依赖它","Bcl-2是凋亡与自噬两条通路的共同交叉调控点"],"answer":[0,1,3,4],"explain":"答案 ABDE。A 对：衣霉素使内质网中未折叠蛋白蓄积，既上调 BiP、启动自噬来清除，也在应激持续时启动凋亡。B 对：敲低 Atg5 后凋亡加重、存活率下降，说明此时自噬是保护性的。D 对：凋亡的执行必须依赖 caspase 级联，而自噬的起始与执行由 Atg 家族完成，并不依赖 caspase。E 对：Bcl-2 过表达同时压低凋亡率与 LC3B-II，正是两条通路交叉调控的证据。C 错：LC3B-II 升高只说明自噬体数量增多，本例中自噬增强反而伴随存活，不能据此判定细胞走向自噬性死亡。","type":"X","group":"c18-02","kind":"mechanism","chs":[29,7,6],"vignette":"用阻断N-连接糖基化起始的衣霉素处理HeLa细胞，4小时后内质网腔中未折叠蛋白增多，分子伴侣BiP的转录本上调5倍；胞质中LC3B-II与LC3B-I的比值由0.2升到1.6、p62由1.0降到0.3，电镜下可见双层膜结构；一部分错误折叠蛋白经ERAD逆向转运至细胞质，由26S蛋白酶体降解。12小时后活化caspase-3阳性细胞占45%，电泳可见梯状条带。若在加药时用RNA干扰敲低Atg5，LC3B-II不再升高，而凋亡率升到72%、存活率由58%降到26%。另一组细胞过表达Bcl-2后凋亡率降到12%，LC3B-II也由1.6降到0.4；该组再表达BH3突变、不能被Bcl-2结合的Beclin-1，LC3B-II回到1.4而凋亡率仍为12%。","vignette_title":"情景 2：错误折叠蛋白的两种去处","gidx":6,"gn":6,"anchor":"LC3B-II与LC3B-I的比值"},{"id":"gc18-04-1","ch":29,"part":5,"tag":"判读","stem":"甲组细胞的死亡方式及判读依据是","options":["坏死，因为膜完整性丧失并释放乳酸脱氢酶","凋亡，因出现亚二倍体峰与活化caspase-3","自噬性死亡，因电镜下出现大量双层膜结构","焦亡，因细胞膜成孔并释放白细胞介素","单纯坏死，因细胞肿胀破裂且无caspase活化"],"answer":1,"explain":"B 对：亚二倍体峰说明 DNA 已被切割并使小片段丢失，加上活化 caspase-3 阳性率高达 42%，而 PI 阳性率只有 11%，符合凋亡且膜在早期仍完整。A 错：坏死应有膜完整性早期丧失与乳酸脱氢酶释放，那是乙组的表现。C 错：双层膜结构见于丙组而非甲组，甲组的各项指标都不支持自噬性死亡。D 错：焦亡需炎症小体与 GSDMD 成孔并释放白细胞介素，本例没有这些证据。E 错：甲组有明确的 caspase-3 活化，与膜破裂引起的被动死亡不符。","type":"A1","group":"c18-04","kind":"experiment","chs":[29,26,28],"vignette":"把同一株人结肠癌细胞分成四组：甲组加凋亡诱导剂，乙组反复冻融，丙组换入无血清培养液，丁组不加药。24小时后检测：甲组亚二倍体DNA峰由2%升到31%，活化caspase-3阳性率42%，线粒体膜电位下降的细胞占39%，PI阳性率11%；乙组PI阳性率86%，上清乳酸脱氢酶活性为对照的7倍，活化caspase-3阳性率4%；丙组LC3B-II与LC3B-I的比值由0.3升到2.1、p62由1.0降到0.4，PI阳性率9%，电镜下见双层膜结构包裹线粒体断片。随后四组各按每皿500个接种，10天后计数集落：甲组42个，乙组0个，丙组168个，丁组205个，即丙组克隆形成率约为丁组的82%、甲组约为20%。分选出的CD44阳性亚群克隆形成率为12%，阴性亚群为0.8%。","vignette_title":"情景 4：四组细胞与一次克隆计数","gidx":1,"gn":6,"anchor":"亚二倍体DNA峰由2%升到31%"},{"id":"gc18-04-2","ch":29,"part":5,"tag":"判读","stem":"乙组细胞的死亡方式与判读依据是","options":["凋亡，因出现亚二倍体峰并有caspase活化","自噬性死亡，因LC3B-II比值明显升高","焦亡，因caspase-1活化并释放白细胞介素","坏死性凋亡，因RIPK1与MLKL被激活","坏死，因膜完整性丧失且caspase未被活化"],"answer":4,"explain":"E 对：乙组 PI 阳性率高达 86%，上清乳酸脱氢酶活性为对照的 7 倍，而活化 caspase-3 阳性率仅 4%，符合膜完整性丧失、不依赖 caspase 的坏死。A 错：凋亡应有亚二倍体峰与 caspase 活化，乙组两项都缺。B 错：LC3B-II 比值升高是丙组的结果，乙组没有自噬增强的证据。C 错：焦亡需 caspase-1 活化与 GSDMD 成孔，情景中并未检测到这些变化。D 错：坏死性凋亡由 RIPK1、RIPK3 与 MLKL 介导，本例没有相应证据。","type":"A1","group":"c18-04","kind":"experiment","chs":[29,26,28],"vignette":"把同一株人结肠癌细胞分成四组：甲组加凋亡诱导剂，乙组反复冻融，丙组换入无血清培养液，丁组不加药。24小时后检测：甲组亚二倍体DNA峰由2%升到31%，活化caspase-3阳性率42%，线粒体膜电位下降的细胞占39%，PI阳性率11%；乙组PI阳性率86%，上清乳酸脱氢酶活性为对照的7倍，活化caspase-3阳性率4%；丙组LC3B-II与LC3B-I的比值由0.3升到2.1、p62由1.0降到0.4，PI阳性率9%，电镜下见双层膜结构包裹线粒体断片。随后四组各按每皿500个接种，10天后计数集落：甲组42个，乙组0个，丙组168个，丁组205个，即丙组克隆形成率约为丁组的82%、甲组约为20%。分选出的CD44阳性亚群克隆形成率为12%，阴性亚群为0.8%。","vignette_title":"情景 4：四组细胞与一次克隆计数","gidx":2,"gn":6,"anchor":"乙组PI阳性率86%"},{"id":"gc18-04-3","ch":29,"part":5,"tag":"判读","stem":"丙组自噬水平明显升高，克隆形成率却仍有82%，这一结果说明","options":["自噬体增多会直接导致细胞发生自噬性死亡","无血清培养对细胞的增殖能力影响很小","该条件下自噬是适应性反应，不是死亡执行者","克隆形成率反映贴壁能力，与细胞增殖无关","丙组细胞已进入G0期而不再分裂"],"answer":2,"explain":"C 对：丙组自噬明显增强，克隆形成率却仍有 82%，说明此时自噬是适应性的存活反应，而不是死亡的执行者。A 错：若自噬体增多就直接导致自噬性死亡，丙组不可能保留大部分增殖能力。B 错：无血清培养对增殖能力确有影响，甲组与丙组克隆形成率的差距正说明细胞状态不同。D 错：克隆形成率反映的是接种后能形成集落并持续增殖的细胞比例，贴壁只是前提之一。E 错：丙组克隆形成率高达 82%，说明大部分细胞仍在分裂，并未进入不再分裂的 G0 期。","type":"A1","group":"c18-04","kind":"experiment","chs":[29,26,28],"vignette":"把同一株人结肠癌细胞分成四组：甲组加凋亡诱导剂，乙组反复冻融，丙组换入无血清培养液，丁组不加药。24小时后检测：甲组亚二倍体DNA峰由2%升到31%，活化caspase-3阳性率42%，线粒体膜电位下降的细胞占39%，PI阳性率11%；乙组PI阳性率86%，上清乳酸脱氢酶活性为对照的7倍，活化caspase-3阳性率4%；丙组LC3B-II与LC3B-I的比值由0.3升到2.1、p62由1.0降到0.4，PI阳性率9%，电镜下见双层膜结构包裹线粒体断片。随后四组各按每皿500个接种，10天后计数集落：甲组42个，乙组0个，丙组168个，丁组205个，即丙组克隆形成率约为丁组的82%、甲组约为20%。分选出的CD44阳性亚群克隆形成率为12%，阴性亚群为0.8%。","vignette_title":"情景 4：四组细胞与一次克隆计数","gidx":3,"gn":6,"anchor":"双层膜结构包裹线粒体断片"},{"id":"gc18-04-6","ch":29,"part":5,"tag":"判读","stem":"关于本实验中各组现象与克隆形成实验，下列判断正确的是（X 型多选）","options":["亚二倍体峰、活化caspase-3与膜电位下降共同支持凋亡","PI阳性率低说明凋亡细胞的膜在早期仍保持完整","克隆形成率反映接种后仍能持续增殖的细胞比例","乙组乳酸脱氢酶大量释放说明其死亡不依赖caspase","短期凋亡指标下降即可证明细胞的增殖能力恢复"],"answer":[0,1,2,3],"explain":"答案 ABCD。A 对：亚二倍体峰、活化 caspase-3 阳性率升高与线粒体膜电位下降三项一致支持甲组发生凋亡。B 对：PI 只能进入膜完整性丧失的细胞，甲组 PI 阳性率低而凋亡指标高，说明凋亡早期膜仍完整。C 对：克隆形成率统计的是接种后能贴壁、增殖并形成集落的细胞比例，适合反映较长期的增殖能力。D 对：乙组在膜破裂并释放乳酸脱氢酶的同时 caspase-3 活化率极低，说明其死亡不依赖 caspase。E 错：短期凋亡指标下降可能只说明死亡被推迟或转向其他死亡方式，判断增殖能力是否恢复还需克隆形成实验这类长期功能指标。","type":"X","group":"c18-04","kind":"experiment","chs":[29,26,28],"vignette":"把同一株人结肠癌细胞分成四组：甲组加凋亡诱导剂，乙组反复冻融，丙组换入无血清培养液，丁组不加药。24小时后检测：甲组亚二倍体DNA峰由2%升到31%，活化caspase-3阳性率42%，线粒体膜电位下降的细胞占39%，PI阳性率11%；乙组PI阳性率86%，上清乳酸脱氢酶活性为对照的7倍，活化caspase-3阳性率4%；丙组LC3B-II与LC3B-I的比值由0.3升到2.1、p62由1.0降到0.4，PI阳性率9%，电镜下见双层膜结构包裹线粒体断片。随后四组各按每皿500个接种，10天后计数集落：甲组42个，乙组0个，丙组168个，丁组205个，即丙组克隆形成率约为丁组的82%、甲组约为20%。分选出的CD44阳性亚群克隆形成率为12%，阴性亚群为0.8%。","vignette_title":"情景 4：四组细胞与一次克隆计数","gidx":6,"gn":6,"anchor":"四组各按每皿500个接种"},{"id":"gc19-02-3","ch":29,"part":5,"tag":"机制","stem":"过氧化氢处理组的死亡方式及其关键通路是","options":["死亡受体途径，配体结合 Fas 后激活 caspase-8","坏死性死亡，细胞膜先行破裂而线粒体保持完整","自噬性死亡，细胞在溶酶体内消化掉自身成分","细胞被阻滞于 G1 期，最后因无法完成分裂而死亡","线粒体途径，细胞色素 c 释放后激活 caspase-9"],"answer":4,"explain":"E 对：Bcl-2 下降、Bax 升高使线粒体外膜通透性增加，细胞色素 c 释放到胞质并激活 caspase-9，进而活化 caspase-3；磷脂酰丝氨酸外翻是凋亡的早期标志。A 错：死亡受体途径由 Fas 等受体与配体结合启动，本例由胞内损伤信号触发。B 错：坏死时细胞膜先破裂，而本例出现 caspase-3 活化，属于程序性死亡。C 错：自噬性死亡以自噬体大量形成为特征，不出现磷脂酰丝氨酸外翻。D 错：此处细胞死亡是主动执行的程序，而不是周期阻滞本身。","type":"A1","group":"c19-02","kind":"mechanism","chs":[18,19,29],"vignette":"一株正常人二倍体成纤维细胞在体外连续传代：前 20 代每代群体倍增时间约 20 小时，第 40 代延长到 32 小时，第 52 代以后细胞数量不再增加，但仍贴附在培养皿底，体积明显变大、扁平铺展，在 pH 6.0 条件下 β-半乳糖苷酶染色呈阳性。流式检测显示这些细胞的 DNA 含量仍为 2C，掺入胸腺嘧啶脱氧核苷的标记率低于 1%，而培养液中检出高水平的白细胞介素 6。同期另一份平行样本只接受一次低剂量过氧化氢处理：48 小时后细胞出现磷脂酰丝氨酸外翻、caspase-3 活化，Bcl-2 表达下降而 Bax 表达升高。若在处理前让该细胞高表达 Bcl-2，磷脂酰丝氨酸外翻的细胞比例由 30% 降到 6%，多数细胞转而呈现体积增大、扁平铺展的形态。","vignette_title":"情景 2：第 52 代之后，细胞为何选择衰老而不是死亡","gidx":3,"gn":5,"anchor":"磷脂酰丝氨酸外翻、caspase-3"},{"id":"gc19-02-4","ch":29,"part":5,"tag":"机制","stem":"Bcl-2 高表达使外翻细胞比例由 30% 降到 6%，最合理的解释是","options":["Bcl-2 促进 Bax 活化，使细胞更快完成凋亡","Bcl-2 抑制 caspase-9 的表达，从而阻断凋亡","Bcl-2 提高凋亡阈值，细胞在同等损伤下转为衰老","Bcl-2 修复了过氧化氢造成的 DNA 损伤","Bcl-2 使细胞周期重新启动，细胞恢复增殖"],"answer":2,"explain":"C 对：Bcl-2 抑制 Bax 与 Bak 的促凋亡作用，使细胞对凋亡信号的阈值升高，同等损伤下更多细胞转入衰老而不是凋亡，这与情景中转为体积增大、扁平铺展的形态一致。A 错：Bcl-2 抑制而不是促进 Bax 活化。B 错：Bcl-2 主要作用于线粒体外膜通透性，并不是抑制 caspase-9 的表达。D 错：Bcl-2 不参与 DNA 损伤的修复过程。E 错：细胞并未恢复增殖，而是进入稳定的停滞状态。","type":"A1","group":"c19-02","kind":"mechanism","chs":[18,19,29],"vignette":"一株正常人二倍体成纤维细胞在体外连续传代：前 20 代每代群体倍增时间约 20 小时，第 40 代延长到 32 小时，第 52 代以后细胞数量不再增加，但仍贴附在培养皿底，体积明显变大、扁平铺展，在 pH 6.0 条件下 β-半乳糖苷酶染色呈阳性。流式检测显示这些细胞的 DNA 含量仍为 2C，掺入胸腺嘧啶脱氧核苷的标记率低于 1%，而培养液中检出高水平的白细胞介素 6。同期另一份平行样本只接受一次低剂量过氧化氢处理：48 小时后细胞出现磷脂酰丝氨酸外翻、caspase-3 活化，Bcl-2 表达下降而 Bax 表达升高。若在处理前让该细胞高表达 Bcl-2，磷脂酰丝氨酸外翻的细胞比例由 30% 降到 6%，多数细胞转而呈现体积增大、扁平铺展的形态。","vignette_title":"情景 2：第 52 代之后，细胞为何选择衰老而不是死亡","gidx":4,"gn":5,"anchor":"让该细胞高表达 Bcl-2"},{"id":"gc19-02-5","ch":29,"part":5,"tag":"判读","stem":"关于端粒、损伤累积与两种细胞命运，下列判断正确的是（X 型多选）","options":["端粒缩短属于复制中累积的损伤，可被检查点识别","衰老细胞的 DNA 含量仍为 2C，说明它未进入 S 期","这些衰老细胞已经死亡，因此不再分泌白细胞介素 6","Bcl-2 高表达提高了凋亡阈值，细胞更易走向衰老","同等损伤下，细胞可在衰老与凋亡之间做出选择"],"answer":[0,1,3,4],"explain":"答案 ABDE。A 对：每次复制末端的缩短是累积性损伤，达到临界长度后可被检查点识别。B 对：DNA 含量为 2C 说明细胞未进入 S 期。D 对：Bcl-2 高表达提高阈值，细胞在同等损伤下选择衰老。E 对：衰老与凋亡是同一损伤下游的两种命运选择。C 错：衰老细胞仍存活且代谢活跃，可分泌白细胞介素 6 等因子，这也是其影响周围组织的途径。","type":"X","group":"c19-02","kind":"mechanism","chs":[18,19,29],"vignette":"一株正常人二倍体成纤维细胞在体外连续传代：前 20 代每代群体倍增时间约 20 小时，第 40 代延长到 32 小时，第 52 代以后细胞数量不再增加，但仍贴附在培养皿底，体积明显变大、扁平铺展，在 pH 6.0 条件下 β-半乳糖苷酶染色呈阳性。流式检测显示这些细胞的 DNA 含量仍为 2C，掺入胸腺嘧啶脱氧核苷的标记率低于 1%，而培养液中检出高水平的白细胞介素 6。同期另一份平行样本只接受一次低剂量过氧化氢处理：48 小时后细胞出现磷脂酰丝氨酸外翻、caspase-3 活化，Bcl-2 表达下降而 Bax 表达升高。若在处理前让该细胞高表达 Bcl-2，磷脂酰丝氨酸外翻的细胞比例由 30% 降到 6%，多数细胞转而呈现体积增大、扁平铺展的形态。","vignette_title":"情景 2：第 52 代之后，细胞为何选择衰老而不是死亡","gidx":5,"gn":5,"anchor":"体积明显变大、扁平铺展"},{"id":"gc19-04-4","ch":29,"part":5,"tag":"判读","stem":"24 小时在 2C 峰之前出现占 28% 的亚二倍体峰，提示","options":["细胞发生了多倍体化，形成 DNA 含量更高的群体","部分细胞的 DNA 被降解成小于 2C 的片段，属凋亡","部分细胞停滞在 G1 期，尚未开始 DNA 的合成","部分细胞发生坏死，细胞膜破裂后释放出碎片","部分细胞的染色体数目减少，属于染色体畸变"],"answer":1,"explain":"B 对：凋亡时 DNA 被降解成小片段，染色后荧光低于正常的 2C 细胞，形成亚二倍体峰，这是凋亡的典型流式表现。A 错：多倍体细胞的 DNA 含量高于 2C，应出现在 2C 峰之后。C 错：G1 期细胞的 DNA 含量恰为 2C，落在 2C 峰上而不是峰之前。D 错：坏死细胞的膜完整性丧失，不会呈现位置明确的亚二倍体峰。E 错：染色体数目减少不会形成这样一个荧光强度成比例降低的峰。","type":"A1","group":"c19-04","kind":"experiment","chs":[19,26,29],"vignette":"研究生用一种抑制拓扑异构酶Ⅱ的药物处理 HeLa 细胞，药物在培养基中持续存在 24 小时，于 0、2、12、24 小时取样做三套检测。碱性彗星实验：尾矩由 1.2 升至 18（2 小时），12 小时回落到 4，24 小时为 3.5。γH2AX 免疫荧光：每核平均焦点数 2 小时为 32 个，12 小时为 9 个，24 小时为 5 个。流式细胞术测 DNA 含量：0 小时 G1 期 55%、S 期 30%、G2/M 期 12%；12 小时变为 G1 期 20%、S 期 22%、G2/M 期 55%；24 小时在 2C 峰之前出现一个占 28% 的亚二倍体峰。另设一组在给药同时加入 ATM 激酶抑制剂，2 小时时每核焦点数只有 6 个，而碱性彗星实验的尾矩仍为 17。","vignette_title":"情景 4：三张图对不上时，断裂到底修好了没有","gidx":4,"gn":6,"anchor":"出现一个占 28% 的亚二倍体峰"},{"id":"gc5-04-5","ch":29,"part":5,"tag":"判读","stem":"第48小时B组出现38%双阳性细胞，说明这些细胞","options":["磷脂酰丝氨酸外翻，膜完整性已丧失","是活细胞，只是染料进入了细胞质内","DNA尚未断裂，不能判为细胞死亡","属于早期凋亡，细胞膜仍然保持完整","属于单纯坏死细胞，与凋亡通路无关"],"answer":0,"explain":"A对：Annexin V结合外翻到膜外的磷脂酰丝氨酸，PI只能进入膜完整性丧失的细胞，双阳性说明磷脂酰丝氨酸外翻同时膜已受损，属晚期凋亡。D错：早期凋亡细胞膜完整、拒染PI，只应表现为Annexin V单阳性。E错：情景中同时出现180～200bp整数倍梯状条带，说明是caspase级联介导的程序性死亡，不是与凋亡通路无关的单纯坏死。B错：活细胞不结合Annexin V，也不会出现DNA梯状条带。C错：DNA电泳已呈梯状条带，说明DNA已被切割断裂。","type":"A1","group":"c5-04","kind":"experiment","chs":[26,29,10],"vignette":"研究生小周把同一株Rb野生型人乳腺癌细胞分成三组：A组加CDK4/6抑制剂，B组加紫杉醇，C组不加药。24小时后做流式：A组G1期细胞由46%升到79%，S期由32%降到8%，EdU掺入率同步由34%降到7%，Annexin V单阳性细胞仅3%；B组G2/M期由18%升到61%，EdU掺入率几乎不变，镜下可见核膜崩解、核仁消失的细胞；C组周期分布与加药前基本一致。第48小时B组经Annexin V/PI双染示38%双阳性细胞，同时DNA电泳呈梯状条带（180～200bp整数倍）。另一株Rb缺失细胞用同样的抑制剂处理，周期分布毫无变化。","vignette_title":"情景 4：三组细胞，三种结局","gidx":5,"gn":6,"anchor":"38%双阳性细胞"},{"ch":29,"part":5,"tag":"凋亡形态","stem":"属于细胞凋亡特征性形态学改变的是：","options":["细胞皱缩、染色质浓缩边集、核碎裂，形成膜包裹的凋亡小体并被相邻细胞或巨噬细胞吞噬，不引起炎症反应","细胞肿胀、细胞膜破裂、内容物外泄并引起明显炎症反应","细胞质中出现大量自噬体和自噬溶酶体","细胞膜完整性早期即丧失，线粒体肿胀、嵴断裂","细胞膜成孔、细胞肿胀破裂并释放 IL-1β 等炎症因子"],"answer":0,"explain":"凋亡以皱缩、染色质浓缩和凋亡小体为特征且无炎症；肿胀破裂伴炎症见于坏死或焦亡，自噬体是自噬的特征。","type":"A1","id":"c29-455b35a5"},{"ch":29,"part":5,"tag":"凋亡机制","stem":"细胞凋亡的核心分子机制是：","options":["溶酶体组织蛋白酶大量释放导致细胞自溶","补体膜攻击复合物在细胞膜上打孔引起细胞死亡","caspase（天冬氨酸特异性半胱氨酸蛋白酶）家族经级联激活，切割 ICAD/DFF45、核纤层蛋白和细胞骨架蛋白等特定底物，导致凋亡的形态与生化改变","通过 MAPK 通路磷酸化组蛋白引起染色质凝集","通过泛素-蛋白酶体途径一次性降解细胞内全部蛋白质"],"answer":2,"explain":"凋亡的执行者是 caspase 级联，只切割特定底物而非全部蛋白，也不依赖溶酶体释放或补体打孔。","type":"A1","id":"c29-a42d9231"},{"ch":29,"part":5,"tag":"起始与效应酶","stem":"关于凋亡起始酶（如 caspase-8、caspase-9）与效应酶（如 caspase-3、caspase-7）的比较，正确的是：","options":["起始酶以活性形式存在，无需切割即可直接作用于底物","起始酶以酶原形式存在，含较长的 N 端原结构域（如 DED、CARD），通过 DISC 或凋亡体等复合物被招募并活化；效应酶原结构域较短，由起始酶切割激活后水解底物","效应酶含有 CARD 或 DED 结构域，负责招募并激活起始酶","起始酶和效应酶均由线粒体释放的细胞色素 C 直接激活","效应酶对底物的切割是可逆的，因此凋亡过程可以逆转"],"answer":1,"explain":"起始酶靠长原结构域被复合物招募活化，效应酶原结构域短、由起始酶切割激活；凋亡的蛋白水解不可逆。","type":"A1","id":"c29-f5fa9e09"},{"ch":29,"part":5,"tag":"凋亡通路","stem":"关于凋亡外源性途径与内源性途径的比较，下列叙述正确的是：","options":["外源性途径激活 caspase-9，内源性途径激活 caspase-8","内源性途径中细胞色素 C 由线粒体外膜受体释放，不需要 Apaf1 参与","外源性途径不依赖 caspase，仅由死亡受体直接引起细胞破裂","两条通路彼此完全独立，不存在任何交叉","外源性途径中死亡受体（Fas、TNFR1）经 FADD/TRADD 等桥接蛋白形成 DISC 并激活 caspase-8；内源性途径中细胞色素 C 释放后与 Apaf1、ATP 及 caspase-9 酶原组成凋亡体，激活 caspase-9"],"answer":4,"explain":"死亡受体通路激活 caspase-8，线粒体通路经凋亡体激活 caspase-9；caspase-8 可切割 Bid，使两条通路交叉。","type":"A1","id":"c29-31c83419"},{"ch":29,"part":5,"tag":"Bcl-2","stem":"通过显微注射将细胞色素 C 注入 Bax 和 Bak 双基因缺陷细胞的胞质中，其最可能的结果及机制是：","options":["细胞不发生凋亡，因为 Bax/Bak 缺陷时 caspase 无法被激活","细胞发生坏死性凋亡而非凋亡","细胞不发生凋亡，因为缺乏 Bax/Bak 时线粒体不能提供 ATP","细胞仍会发生凋亡，因为细胞色素 C 直接作用于下游的 Apaf1/caspase-9 凋亡体，而 Bax/Bak 的作用是介导线粒体释放细胞色素 C","细胞仍会发生凋亡，因为 Bax/Bak 位于细胞色素 C 释放的下游"],"answer":3,"explain":"Bax/Bak 是线粒体外膜通透化的效应分子，位于细胞色素 C 释放上游；胞质中直接给予细胞色素 C 可绕过该环节。","type":"A1","id":"c29-df3b871b"},{"ch":29,"part":5,"tag":"其他死亡方式","stem":"下列调节性细胞死亡类型与其主要特征的对应，正确的是：","options":["坏死性凋亡——完全依赖 caspase-8 的凋亡通路，细胞皱缩并形成凋亡小体","焦亡——由 GSDMD 介导膜成孔并释放 IL-1β、IL-18，但不依赖炎症小体和 caspase-1","自噬性细胞死亡——以凋亡小体形成和 DNA 梯状条带为主要特征","铁死亡——由髓过氧化物酶催化产生次氯酸，导致细胞膜穿孔","铁死亡——以铁依赖的脂质过氧化产物堆积（GPX4 活性下降）为特征，线粒体变小、膜密度增高，可被铁螯合剂和亲脂性抗氧化剂抑制，不依赖 caspase"],"answer":4,"explain":"焦亡由炎症小体-caspase-1-GSDMD 介导；坏死性凋亡为 caspase 非依赖的 RIPK1/RIPK3-MLKL 通路；铁死亡核心是脂质过氧化。","type":"A1","id":"c29-a170f1e5"},{"ch":29,"part":5,"tag":"凋亡检测","stem":"在实验中证明细胞发生了凋亡，可采用的生化和形态学检测方法是：","options":["检测培养上清中乳酸脱氢酶（LDH）大量释放即可确诊细胞凋亡","用碘化丙啶（PI）单染可检测早期凋亡细胞外翻的磷脂酰丝氨酸","流式检测中 Annexin V 单阳性细胞即代表晚期凋亡细胞","琼脂糖凝胶电泳出现 180~200 bp 整数倍的 DNA 梯状条带、Annexin V/PI 双染检测磷脂酰丝氨酸外翻、TUNEL 检测 DNA 断裂，均可用于证明细胞凋亡","Western blot 检测 caspase-3 总蛋白表达量即可反映其酶活性高低"],"answer":3,"explain":"Annexin V 单阳为早期凋亡、双阳为晚期；LDH 释放反映膜损伤不特异；应检测 caspase-3 的剪切活化形式。","type":"A1","id":"c29-6433444a"},{"ch":29,"part":5,"tag":"死亡与疾病","stem":"关于细胞死亡与人类疾病的关系，下列叙述正确的是：","options":["肿瘤的发生主要与细胞凋亡过度有关","神经退行性疾病的发生与细胞凋亡不足有关","细胞凋亡不足与肿瘤、自身免疫性疾病相关，凋亡过度与神经退行性疾病、缺血再灌注损伤相关，故凋亡通路是重要的药物靶点","缺血再灌注损伤以细胞凋亡显著减少为特征","细胞死亡只参与胚胎发育，与人类疾病无关"],"answer":2,"explain":"凋亡失衡双向致病：不足导致肿瘤与自身免疫病，过度导致神经退行性疾病与缺血再灌注损伤。","type":"A1","id":"c29-3ed10f49"},{"ch":29,"part":5,"tag":"磷脂酰丝氨酸外翻","stem":"凋亡细胞表面磷脂酰丝氨酸（PS）外翻的生物学意义是：","options":["使细胞膜完整性立即丧失，引起细胞内容物外泄和炎症反应","直接激活 caspase-3 的级联反应，加速 DNA 断裂","使细胞膜形成孔道，释放 IL-1β 等炎症因子","作为吞噬信号被巨噬细胞表面的 PS 受体识别，介导凋亡细胞被清除而不引发炎症","标志线粒体外膜通透性增加，细胞色素 C 即将释放"],"answer":3,"explain":"PS 正常位于膜内侧，凋亡时外翻，被巨噬细胞 PS 受体识别，实现凋亡细胞的无炎症清除。","type":"A1","id":"c29-c732bc9e"},{"ch":29,"part":5,"tag":"caspase抑制剂","stem":"关于细胞凋亡的负性调控，正确的是：","options":["IAP 通过促进 caspase 酶原的切割而增强凋亡","IAP 家族通过其 BIR 结构域结合并抑制 caspase 的活性，Smac/DIABLO 从线粒体释放后可拮抗 IAP","Bcl-2 是促凋亡蛋白，通过促进细胞色素 C 释放加速凋亡","凋亡通路不存在负性调控机制，caspase 一旦生成即被激活","Smac/DIABLO 通过抑制 Bcl-2 促进凋亡，与 IAP 无关"],"answer":1,"explain":"IAP 以 BIR 结构域抑制 caspase；Smac/DIABLO 自线粒体释放后结合 IAP 解除抑制，是凋亡的负性调控要点。","type":"A1","id":"c29-a3f5c3ef"},{"ch":29,"part":5,"tag":"细胞色素c释放","stem":"内源性凋亡途径中细胞色素 C 从线粒体释放到胞质的分子机制是：","options":["细胞色素 C 通过线粒体内膜的 ATP 合成酶通道主动转运至胞质","caspase-3 直接切割线粒体外膜蛋白，使细胞色素 C 外漏","BH3-only 蛋白被激活后抑制抗凋亡蛋白并激活 Bax/Bak，Bax/Bak 在线粒体外膜形成孔道，使细胞色素 C 释放","抗凋亡蛋白 Bcl-2 在膜上形成孔道，促进细胞色素 C 释放","细胞色素 C 由胞质合成后反向进入线粒体再释放，该过程与 Bcl-2 家族无关"],"answer":2,"explain":"BH3-only 蛋白解除抗凋亡蛋白的抑制并激活 Bax/Bak，后者在线粒体外膜成孔，细胞色素 C 释放入胞质。","type":"A1","id":"c29-862c7729"},{"ch":29,"part":5,"tag":"凋亡体","stem":"内源性凋亡途径中凋亡体的组成及作用是：","options":["由 FADD、TRADD 与 caspase-8 酶原组成，负责激活外源性凋亡途径","由 Bcl-2、Bax 与细胞色素 C 组成的膜通道复合体","由 IAP 与 Smac/DIABLO 组成的复合体，功能是抑制 caspase","由细胞色素 C、Apaf1、ATP 与 caspase-9 酶原组装而成，激活 caspase-9，进而活化下游效应酶","由 Fas 与 FasL 结合后形成的死亡诱导信号复合体 DISC"],"answer":3,"explain":"凋亡体为胞质中细胞色素 C-Apaf1-ATP-caspase-9 复合体，是内源性途径激活起始酶的平台。","type":"A1","id":"c29-252372ea"},{"ch":29,"part":5,"tag":"自噬","stem":"关于细胞自噬的类型与形态学特征，正确的是：","options":["巨自噬由溶酶体膜直接内陷包裹底物，形成单膜结构后直接降解","自噬的主要形态特征是细胞皱缩、染色质浓缩边集并形成凋亡小体","分子伴侣介导的自噬通过自噬体包裹大分子复合物完成降解","细胞发生自噬时胞质中出现大量脂滴和铁沉积，线粒体膜密度增高","巨自噬形成双膜结构的自噬体，包裹胞质成分后与溶酶体融合形成自噬溶酶体，依赖 Atg 家族蛋白"],"answer":4,"explain":"巨自噬以双膜自噬体为特征，与溶酶体融合后降解底物；微自噬由溶酶体膜内陷，CMA 依赖分子伴侣。","type":"A1","id":"c29-d2a645ad"},{"ch":29,"part":5,"tag":"铁死亡","stem":"关于铁死亡的分子机制与特征，正确的是：","options":["铁死亡因 GPX4 活性下降导致铁依赖的脂质过氧化产物堆积，线粒体变小、膜密度增高，可被铁螯合剂和亲脂性抗氧化剂抑制","铁死亡由 caspase-1 与 GSDMD 介导，细胞膜成孔并释放 IL-1β","铁死亡由 RIPK1/RIPK3-MLKL 通路介导，可被 necrostatin-1 抑制","铁死亡由 GPX4 活性显著升高引起，细胞抗氧化能力增强，不能被铁螯合剂抑制","铁死亡以 DNA 断裂形成 180~200 bp 梯状条带为主要生化特征"],"answer":0,"explain":"铁死亡核心是 GPX4 下降致的铁依赖脂质过氧化，形态上线粒体变小、膜密度增高，不依赖 caspase。","type":"A1","id":"c29-bd982ae4"},{"ch":29,"part":5,"tag":"坏死性凋亡","stem":"关于坏死性凋亡（necroptosis）的分子机制与形态特征，正确的是：","options":["坏死性凋亡依赖 caspase-8 的级联激活，细胞皱缩并形成凋亡小体","坏死性凋亡由炎症小体激活 caspase-1 后经 GSDMD 成孔引起","坏死性凋亡由 GPX4 活性下降引起的脂质过氧化驱动","坏死性凋亡由 RIPK1/RIPK3 形成坏死体并激活 MLKL，MLKL 在膜上打孔导致细胞肿胀破裂，可被 necrostatin-1 抑制","坏死性凋亡是细胞受灾难性损伤瞬间发生的被动死亡，无任何信号参与"],"answer":3,"explain":"坏死性凋亡是 caspase 非依赖的调节性死亡：RIPK1/RIPK3 坏死体激活 MLKL 使膜成孔，细胞肿胀破裂并引发炎症。","type":"A1","id":"c29-7769e292"},{"ch":29,"part":5,"tag":"颗粒酶通路","stem":"细胞毒性 T 细胞杀伤靶细胞时，颗粒酶 B 进入靶细胞后引起凋亡的机制是：","options":["直接切割靶细胞 DNA 形成 180~200 bp 梯状条带","在靶细胞膜上形成孔道，使细胞内容物外泄引起坏死","激活靶细胞炎症小体并释放 IL-1β，引起焦亡","经穿孔素协助进入胞质后直接切割并激活 caspase-3、caspase-7 等效应酶，也可经 Bid 放大线粒体途径","通过抑制 Bcl-2 家族抗凋亡蛋白的转录而诱导凋亡"],"answer":3,"explain":"颗粒酶 B 是丝氨酸蛋白酶，可绕过起始酶直接切割效应酶原，也可切割 Bid 放大线粒体途径。","type":"A1","id":"c29-67c00445"}]},"zl":{"short":"总论","name":"人体形态与功能总论","lskey":"quiz-zl-v1","partUnit":"章","chUnit":"节","parts":[{"no":1,"name":"绪论"},{"no":2,"name":"人体的形态与功能"},{"no":3,"name":"疾病与药物"},{"no":4,"name":"肿瘤"}],"chTitles":{"1":"绪论","2":"人体的形态结构概述","3":"人体的功能概述","4":"能量代谢与体温调节","5":"细胞的基本结构与功能","6":"基本组织","7":"人体胚胎发育","8":"疾病概述","9":"细胞和组织的适应、损伤与修复","10":"炎症","11":"发热","12":"药物与药理","13":"肿瘤概述","14":"肿瘤发生发展的结构基础","15":"肿瘤的分子遗传基础","16":"肿瘤免疫","17":"肿瘤治疗"},"qb":[{"unit":"U01","ch":1,"part":1,"tag":"医学模式演变","stem":"医学模式是一定时期内人们对疾病和健康的总体认识，也是当时医学发展的指导思想。被视为人类历史上第一个有结构的医术体系、以巫医和巫术为代表的医学模式是","options":["神灵主义医学模式","自然哲学医学模式","机械论医学模式","生物医学模式","生物-心理-社会医学模式"],"answer":0,"explain":"神灵主义医学模式起源于原始社会，将疾病视为神灵的惩罚或恶魔作祟，是人类历史上第一个有结构的医术体系；其余模式均为其后的发展阶段。","id":"z1-938eed27","type":"A1"},{"unit":"U01","ch":1,"part":1,"tag":"自然哲学医学模式","stem":"以中国古代中医“天人合一”思想和古希腊希波克拉底“体液学说”为代表，其哲学观以朴素唯物论、整体观和心身一元论为基础的医学模式是","options":["神灵主义医学模式","自然哲学医学模式","机械论医学模式","生物医学模式","“医学+X”交叉发展医学模式"],"answer":1,"explain":"自然哲学医学模式约出现于公元前300年，以中医“天人合一”和希波克拉底“体液学说”为代表，哲学观为朴素唯物论、整体观和心身一元论。","id":"z1-d7dcdfc2","type":"A1"},{"unit":"U01","ch":1,"part":1,"tag":"机械论医学模式","stem":"下列关于医学模式的叙述，属于机械论医学模式的是","options":["起源于原始社会，将疾病归因于神灵的惩罚或恶魔作祟","哲学观以朴素唯物论、整体观和心身一元论为基础","以机械运动的原理解释生命现象，促进了解剖学和生理学的发展，将医学引入实验医学时代","把人看作单纯的生物或生物机器，只注重生物学指标的测量","提倡在系统论框架下，以身心一元论为指导思想开展医学工作"],"answer":2,"explain":"机械论医学模式基于机械唯物主义，以机械运动原理解释生命现象，促进了解剖学和生理学的发展；其余选项分别属于神灵主义、自然哲学、生物医学和生物-心理-社会医学模式。","id":"z1-a551a746","type":"A1"},{"unit":"U01","ch":1,"part":1,"tag":"生物医学模式","stem":"生物医学模式曾极大推动了现代医学的发展，但其局限性主要表现为","options":["完全不重视疾病的生物学因素","无法在器官、组织和生物大分子上找到病变依据","仅关注患者的心理与社会因素，忽视生物学指标","受“还原论”和“心身二元论”主导，忽视人的社会属性以及心理、社会因素的致病作用","否认急慢性传染病和寄生虫病可以防治"],"answer":3,"explain":"生物医学模式把人看作单纯的生物或生物机器，只注重生物学指标的测量，因“还原论”和“心身二元论”而忽视心理与社会因素。","id":"z1-9e1d9e3d","type":"A1"},{"unit":"U01","ch":1,"part":1,"tag":"生物-心理-社会医学模式","stem":"1977年在美国《科学》杂志撰文批评生物医学模式的“还原论”和“心身二元论”局限，并提出“生物-心理-社会医学模式”的学者是","options":["恩格尔（Engel）","盖伦（Galen）","维萨里（Vesalius）","菲尔绍（Virchow）","布赫海姆（Buchheim）"],"answer":0,"explain":"1977年美国医生恩格尔在《科学》杂志撰文批评生物医学模式的局限，并提出生物-心理-社会医学模式，该模式成为医学心理学发展的重要基础。","id":"z1-19b453b5","type":"A1"},{"unit":"U01","ch":1,"part":1,"tag":"医学+X交叉模式","stem":"“医学+X”交叉发展医学模式中，X代表工程学、计算机科学、生物学、心理学等不同学科领域。下列属于该模式特点的是","options":["强调由单一学科独立解决医学中的复杂问题","鼓励跨学科合作与创新，综合多学科的知识与技术解决复杂的医学问题","排斥生物医学研究，不再关注疾病本身","仅用于医学教育，不涉及临床与产业应用","以替代临床实践为目的，减少医生在诊疗中的参与"],"answer":1,"explain":"“医学+X”模式强调跨学科合作、创新驱动和解决复杂问题，已应用于生物医学工程、计算医学和生物信息学等领域，而非排斥生物医学或替代临床。","id":"z1-4770c9bd","type":"A1"},{"unit":"U01","ch":1,"part":1,"tag":"医学教育体系","stem":"现代医学教育体系在长期发展中形成了若干特点，其中“综合性教学”主要指","options":["以教会经典文献和神学为主要教学内容","由师傅以口传心授的方式传授医学知识","只重视临床实习，不讲授基础医学课程","强调医学科学理论与实践的紧密结合","包括基础医学、临床医学和医学技术等多个学科的综合教学"],"answer":4,"explain":"现代医学教育体系的“综合性教学”指包括基础医学、临床医学和医学技术等多个学科的综合教学；强调理论与实践相结合属于其“科学化教学”的特点。","id":"z1-70187da4","type":"A1"},{"unit":"U01","ch":1,"part":1,"tag":"解剖学发展史","stem":"1543年出版《人体的构造》一书，革新之处在于直接解剖人体而非单纯研读前人书本，被誉为现代解剖学奠基人的学者是","options":["盖伦（Galen）","达芬奇（Leonardo da Vinci）","哈维（Harvey）","维萨里（Vesalius）","王清任"],"answer":3,"explain":"维萨里于1543年出版《人体的构造》，这是人类历史上第一部科学而系统的人体解剖学著作；盖伦的研究资料主要来自动物解剖，因而存在许多错误。","id":"z1-1cb2411b","type":"A1"},{"unit":"U01","ch":1,"part":1,"tag":"解剖学分科","stem":"按人体器官功能系统阐述人体器官形态结构的科学，也是通常所说的人体解剖学，称为","options":["局部解剖学","断层解剖学","组织学","胚胎学","系统解剖学"],"answer":4,"explain":"系统解剖学按人体器官功能系统阐述器官的形态结构，通常所说的人体解剖学即指它；局部解剖学按局部分区研究，断层解剖学结合切片与影像技术研究不同层面。","id":"z1-a6f85e7c","type":"A1"},{"unit":"U01","ch":1,"part":1,"tag":"生理学发展史","stem":"我国近代生理学的奠基人之一，创立了定量分析乙酰胆碱的生物测定法（蛙腹直肌法），并最早提出中枢神经内存在化学传递、证明乙酰胆碱是一种介质的生理学家是","options":["张锡钧","林可胜","蔡翘","朱洗","童第周"],"answer":0,"explain":"张锡钧创立定量分析乙酰胆碱的蛙腹直肌法，最早提出中枢神经内化学传递的存在；林可胜、蔡翘同为我国近代生理学奠基人，朱洗、童第周为胚胎学家。","id":"z1-7f9d902c","type":"A1"},{"unit":"U01","ch":1,"part":1,"tag":"组织学与胚胎学","stem":"组成人体的四大基本组织是","options":["上皮组织、结缔组织、肌组织和骨组织","上皮组织、结缔组织、肌组织和神经组织","上皮组织、脂肪组织、软骨组织和神经组织","细胞、组织、器官和系统","结缔组织、肌组织、神经组织和血液"],"answer":1,"explain":"人体四大基本组织为上皮组织、结缔组织、肌组织和神经组织；细胞、组织、器官和系统是人体结构的层次，而不是组织类型。","id":"z1-f427592a","type":"A1"},{"unit":"U01","ch":1,"part":1,"tag":"病理学发展史","stem":"19世纪中叶创立细胞病理学，认为细胞的形态及功能改变是一切疾病的基础，对病理学乃至整个医学发展做出划时代贡献的德国病理学家是","options":["摩根尼（Morgagni）","伯纳德（Bernard）","菲尔绍（Virchow）","宋慈","施万（Schwann）"],"answer":2,"explain":"菲尔绍创立细胞病理学，认为细胞形态及功能改变是一切疾病的基础；摩根尼创立器官病理学，伯纳德倡导的实验病理学是病理生理学的前身。","id":"z1-0a58c9d8","type":"A1"},{"unit":"U01","ch":1,"part":1,"tag":"病理生理学","stem":"病理生理学主要研究疾病对生理功能的影响以及疾病机制与生理过程之间的关系。它是下列哪两门学科的交叉学科","options":["人体解剖学与组织学","药理学与病理学","生理学与生物化学","病理学与生理学","组织学与胚胎学"],"answer":3,"explain":"病理生理学是病理学与生理学的交叉学科，研究疾病对生理功能的影响及疾病机制与生理过程的关系；其前身为伯纳德倡导的实验病理学。","id":"z1-abc41fdc","type":"A1"},{"unit":"U01","ch":1,"part":1,"tag":"健康中国战略","stem":"“健康中国2030”战略的推进要求医学模式随之改变。与之相适应，现代医学的任务是","options":["仅针对已经发生的疾病进行诊断和治疗","以临终关怀和康复为主，不涉及疾病预防","由公共卫生机构独立承担，临床医生不参与","只关注住院患者，不关注社区人群","集疾病发生前的“预防”与发生后的“治疗”“康养”于一体，为人们提供“生命全周期、健康全过程”的医疗服务"],"answer":4,"explain":"“健康中国2030”战略要求医学任务不再囿于疾病诊疗，而要融预防、治疗与康养于一体，提供“生命全周期、健康全过程”的医疗服务。","id":"z1-38e17dfa","type":"A1"},{"unit":"U01","ch":1,"part":1,"tag":"总论与各论关系","stem":"关于《人体形态与功能》总论与各论的关系，下列叙述正确的是","options":["总论与各论有密切的内在联系，学好总论是学习各论的必要基础，两者互相联系、不可偏废","各论是总论的基础，应先学完各论再学总论","总论只介绍研究方法，与各论的器官系统内容无关","总论与各论内容重复，掌握其中一方即可","学习各论时不必再联系运用总论知识"],"answer":0,"explain":"总论与各论密切相关：学好总论是学习各论的必要基础，学习各论也必须联系运用总论知识并反过来加深对总论的理解，两者不可偏废。","id":"z1-b34d2e28","type":"A1"},{"unit":"U01","ch":1,"part":1,"tag":"总论学习方法","stem":"观察组织切片时，管腔性结构在横断面、斜断面和纵断面上的二维图像各不相同，有的切面甚至看不到细胞核。这提示学习时应特别注意","options":["理论与实践相结合","二维与三维相结合","静态与动态相结合","局部与整体相结合","形态与功能相结合"],"answer":1,"explain":"显微图片是取材时刻的平面结构，同一结构因切面不同可呈现不同图像，故应由二维图片建立三维立体图像，即二维与三维相结合。","id":"z1-b6b2afc6","type":"A1"},{"unit":"U02","ch":2,"part":2,"tag":"人体的分部","stem":"人体从外形上可分为头、颈、躯干和四肢4部，其中躯干部包括","options":["颅部和面部","颈部和项部","胸部、腹盆部、背部和腰部","上肢带部和自由上肢部","臂、前臂和手"],"answer":2,"explain":"躯干部包括胸部、腹盆部、背部和腰部；颅部与面部属于头部，颈部与项部属于颈部，上肢带部和自由上肢部（臂、前臂、手）属于四肢。","id":"z2-dfd58ac2","type":"A1"},{"unit":"U02","ch":2,"part":2,"tag":"九大系统","stem":"关于人体九大系统，下列叙述正确的是","options":["循环系统包括心血管系统和淋巴系统，具有输送血液和淋巴的功能","免疫系统是人体九大系统之一","感觉器不属于人体九大系统","运动系统仅由骨骼肌构成","泌尿系统的主要功能是与外界进行气体交换"],"answer":0,"explain":"九大系统为运动、消化、呼吸、泌尿、生殖、循环、感觉器、神经和内分泌系统；循环系统由心血管系统和淋巴系统组成，输送血液和淋巴。","id":"z2-8e52b434","type":"A1"},{"unit":"U02","ch":2,"part":2,"tag":"人体组织层次","stem":"关于人体由细胞到系统的结构层次，下列叙述正确的是","options":["细胞是人体结构和功能的基本单位，由多种组织构成","许多结构、功能、来源相似的细胞结合形成组织，不同的组织按特定形式结合成为具有一定功能的器官","完成不同生理功能的一些器官组合成系统","系统由器官构成，器官由组织构成，故组织是人体结构和功能的基本单位","人体四大基本组织是上皮组织、结缔组织、肌组织和骨组织"],"answer":1,"explain":"人体基本结构单位是细胞，相似细胞构成组织，组织结合成器官，完成共同生理功能的一些器官组合成系统；四大基本组织含神经组织而非骨组织。","id":"z2-2a6aeeef","type":"A1"},{"unit":"U02","ch":2,"part":2,"tag":"器官的位置描述","stem":"关于内脏器官的位置和结构特点，下列叙述正确的是","options":["内脏各系统的器官全部位于胸腔内","内脏器官均属实质性器官","肾、肝等中空性器官均位于盆腔内","内脏包括消化、呼吸、泌尿和生殖4个系统，其器官大多位于胸腔、腹腔和盆腔内，按基本结构可分为中空性器官和实质性器官","内脏包括运动系统、神经系统和感觉器"],"answer":3,"explain":"内脏指消化、呼吸、泌尿和生殖4个系统，其器官大多位于胸腔、腹腔和盆腔内，按基本结构分为中空性器官和实质性器官，如肾为实质性器官。","id":"z2-53a8573f","type":"A1"},{"unit":"U02","ch":2,"part":2,"tag":"骨的形态分类","stem":"按外形，骨可分为长骨、短骨、扁骨和不规则骨。下列配对正确的是","options":["长骨——腕骨","扁骨——椎骨","短骨——腕骨和跗骨","长骨——颅的顶骨","扁骨——跗骨"],"answer":2,"explain":"短骨形似立方体，如手的腕骨和足的跗骨；椎骨属不规则骨，颅的顶骨属扁骨，长骨呈管状、主要分布于四肢。","id":"z2-ca6ce9e3","type":"A1"},{"unit":"U02","ch":2,"part":2,"tag":"骨连结与关节","stem":"构成滑膜关节（关节）的基本结构是","options":["关节面、关节腔和关节囊","关节盘、关节唇和韧带","骨膜、骨质和骨髓","腱鞘、滑膜囊和筋膜","关节软骨、滑膜襞和滑膜囊"],"answer":0,"explain":"关节的基本结构为关节面、关节腔和关节囊；韧带、关节盘、关节唇、滑膜襞和滑膜囊属关节的辅助结构，骨膜、骨质和骨髓则是骨的构成。","id":"z2-544f526d","type":"A1"},{"unit":"U02","ch":2,"part":2,"tag":"骨骼肌","stem":"关于运动系统的肌（骨骼肌），下列叙述正确的是","options":["属平滑肌，不能随意志而收缩","仅附着于皮肤，不附着于骨","其总重量约占体重的10%","腱可以主动收缩，牵拉骨产生运动","属横纹肌，可随意志而收缩，又称随意肌，其总重量约占体重的40%"],"answer":4,"explain":"骨骼肌属横纹肌，可随意志收缩，又称随意肌，总重量约占体重40%；腱由结缔组织构成，没有收缩功能，肌腹才是收缩的部分。","id":"z2-f3217e3a","type":"A1"},{"unit":"U02","ch":2,"part":2,"tag":"消化系统","stem":"关于消化系统的组成与临床分部，下列叙述正确的是","options":["消化管包括口腔、咽、食管、胃、肝和大肠","消化系统由消化管和消化腺组成，临床上通常将口腔至十二指肠的一段称为上消化道","临床上通常将空肠及以下的部分称为上消化道","消化腺仅包括肝和胰","大肠属于上消化道"],"answer":1,"explain":"消化系统由消化管和消化腺组成，上消化道为口腔至十二指肠的一段，空肠及以下称下消化道；消化腺还包括大唾液腺及消化管壁内的无数小腺体。","id":"z2-9658bf2f","type":"A1"},{"unit":"U02","ch":2,"part":2,"tag":"呼吸系统","stem":"呼吸系统由呼吸道和肺两部分组成。临床上通常把气管及以下的部分称为","options":["上呼吸道","上消化道","肺的组成部分","下呼吸道","呼吸道附属结构"],"answer":3,"explain":"临床上将鼻、咽、喉称为上呼吸道，气管及以下的部分称为下呼吸道；肺由肺泡及肺内各级支气管构成，上、下消化道则属于消化系统的临床分部。","id":"z2-2291ee78","type":"A1"},{"unit":"U02","ch":2,"part":2,"tag":"循环系统","stem":"关于静脉的叙述，下列正确的是","options":["浅静脉位于深筋膜浅面的皮下组织内，也称皮下静脉，不与动脉伴行，最终均归入深静脉","深静脉位于深筋膜浅面，均不与动脉伴行","静脉瓣由静脉管壁内膜形成，可促进静脉血逆流","四肢的静脉均无瓣，头部和胸部的静脉多数有瓣","静脉是由心室发出的血管，将血液从心送到全身各器官"],"answer":0,"explain":"浅静脉位于深筋膜浅面的皮下组织内，不与动脉伴行，最终归入深静脉；静脉瓣防止血液逆流，四肢静脉多瓣而头部和胸部静脉多数无瓣，由心室发出的是动脉。","id":"z2-25ff9f3c","type":"A1"},{"unit":"U02","ch":2,"part":2,"tag":"神经系统","stem":"关于神经系统的组成，下列叙述正确的是","options":["中枢神经系统包括脑神经和脊神经","周围神经系统包括脑和脊髓","中枢部包括脑和脊髓，周围部包括脑神经和脊神经；内脏神经的运动成分又称自主神经，可分为交感部和副交感部","神经胶质的数量远少于神经细胞，负责产生和传递神经冲动","反射弧由感受器、感觉神经和效应器三部分组成"],"answer":2,"explain":"中枢部为脑和脊髓，周围部为脑神经和脊神经；神经胶质数量远多于神经细胞且无产生和传递冲动的功能；反射弧包括感受器、感觉神经、中枢、运动神经和效应器。","id":"z2-6d43f3ad","type":"A1"},{"unit":"U02","ch":2,"part":2,"tag":"体格测量与体型","stem":"案例2-1中，患者身高165 cm、体重42 kg，较病前明显下降，查体见体型消瘦、体毛稀疏、乳房萎缩，并出现闭经。按体格测量判断，该患者的体型属于","options":["肥胖","超重","正常","匀称","消瘦"],"answer":4,"explain":"该患者身高165 cm而体重仅42 kg，明显低于同身高正常水平，案例描述其体型为消瘦；闭经、骨密度降低还提示生殖系统和运动系统（骨）受累。","id":"z2-77361819","type":"A1"},{"unit":"U02","ch":2,"part":2,"tag":"解剖学姿势","stem":"解剖学姿势（标准姿势）要求","options":["取仰卧位，两眼闭合，双足外旋，掌心向后","身体直立，两眼向前平视，两腿并拢，足尖向前，上肢下垂于躯干两侧，掌心向前","身体直立，两腿分开与肩同宽，掌心向后","取俯卧位，上肢前伸，掌心向下","取侧卧位，两眼向前平视，掌心向内"],"answer":1,"explain":"解剖学姿势为身体直立、两眼向前平视、两腿并拢、足尖向前、上肢下垂于躯干两侧、掌心向前；无论人体处于何位，均按此姿势描述方位。","id":"z2-fc32762a","type":"A1"},{"unit":"U02","ch":2,"part":2,"tag":"方位术语","stem":"关于解剖学方位术语，下列叙述正确的是","options":["近头者为下（尾侧），近足者为上（颅侧）","近背侧者为前（腹侧），近腹侧者为后（背侧）","前臂的桡侧相当于前臂的内侧，尺侧相当于前臂的外侧","近正中矢状面者为内侧，远者为外侧；四肢近躯干者为近侧，远躯干者为远侧","足的上面称跖侧，足的下面称背侧"],"answer":3,"explain":"内侧指近正中矢状面者，四肢近躯干者为近侧、远躯干者为远侧；近头者为上（颅侧），近腹侧者为前，前臂桡侧相当于外侧，足下面为跖侧。","id":"z2-7ef3f037","type":"A1"},{"unit":"U02","ch":2,"part":2,"tag":"轴与面","stem":"关于解剖学的轴和面，下列叙述正确的是","options":["垂直轴为前后方向、垂直于地平面的轴","矢状轴为左右方向、垂直于垂直轴的轴","冠状轴又称额状轴，为左右方向且垂直于垂直轴和矢状轴的轴","水平面是将人体分为左、右两部分的断面","矢状面为左右方向将人体纵切为前、后两部分的断面"],"answer":2,"explain":"垂直轴为上下方向，矢状轴为前后方向，冠状轴（额状轴）为左右方向；水平面（横切面）将人体分为上、下两部分，矢状面则将人体分为左、右两部分。","id":"z2-58ffdf4d","type":"A1"},{"unit":"U02","ch":2,"part":2,"tag":"Langer线","stem":"关于皮肤张力线（Langer线）及其临床意义，下列叙述正确的是","options":["躯干和颈部的Langer线一般纵行排列，四肢者一般横行排列","手术切口平行于Langer线时，愈合后瘢痕较宽","Langer线仅见于手掌、足底和指（趾）掌面的皮肤","手术切口应尽量横断Langer线，以缩小瘢痕","躯干和颈部的Langer线一般横行排列，四肢者一般纵行排列，切口平行于Langer线时愈合后瘢痕组织小"],"answer":4,"explain":"Langer线又称皮肤张力线，躯干和颈部一般横行、四肢一般纵行；手术切口平行于Langer线时愈合后瘢痕组织小，若横断Langer线则瘢痕较宽。","id":"z2-e5367639","type":"A1"},{"unit":"U03","ch":3,"part":2,"tag":"生命活动的基本特征","stem":"在机体的各种生命活动基本特征中，被称为生命活动最基本特征、且一旦停止生命即随之终结的是","options":["新陈代谢","兴奋性","适应性","生殖","衰老"],"answer":0,"explain":"新陈代谢包含物质代谢与能量代谢，是一切生命活动的基础，一旦停止生命即终结；其余各项虽也是生命活动的基本特征，但都建立在新陈代谢的基础上。","id":"z3-1fcb6702","type":"A1"},{"unit":"U03","ch":3,"part":2,"tag":"兴奋性","stem":"关于组织细胞兴奋性与刺激阈值的叙述，正确的是","options":["刺激阈值越大，组织细胞的兴奋性越高","阈下刺激也能引起组织细胞产生兴奋","组织细胞兴奋性的高低与阈值大小呈反变关系","阈强度是引起组织细胞产生最大反应的最小刺激强度","同一组织细胞的兴奋性在任何情况下都恒定不变"],"answer":2,"explain":"兴奋性高低与阈值呈反变关系，兴奋性高者阈值低；阈值是刚能引起反应的最小刺激强度，阈下刺激不引起兴奋，组织兴奋性可随情况而变化。","id":"z3-65922324","type":"A1"},{"unit":"U03","ch":3,"part":2,"tag":"内环境","stem":"机体的内环境是指","options":["细胞内液","组织液","血浆","淋巴和脑脊液","细胞外液"],"answer":4,"explain":"人体绝大多数细胞不与外环境直接接触，而是浸浴在细胞外液中，故将细胞外液称为内环境；组织液、血浆、淋巴和脑脊液等是其组成成分。","id":"z3-b16c2211","type":"A1"},{"unit":"U03","ch":3,"part":2,"tag":"稳态","stem":"关于内环境稳态（homeostasis）的叙述，正确的是","options":["稳态是指内环境的理化性质固定不变","稳态是内环境理化性质保持相对恒定的动态平衡状态","“稳态”一词是由法国生理学家伯纳德首先提出的","稳态的维持与各器官系统的活动无关","老年人的稳态调节机制与年轻人完全相同"],"answer":1,"explain":"稳态并非静止不变，而是各种理化因素在调节下达到动态平衡的相对恒定状态，是细胞乃至整个机体正常生命活动的必要条件；提出“稳态”一词的是坎农。","id":"z3-bfec30a2","type":"A1"},{"unit":"U03","ch":3,"part":2,"tag":"神经调节","stem":"神经调节的基本方式是反射，完成反射的结构基础即反射弧，其组成是","options":["感受器、传入神经、神经中枢、传出神经","感受器、传出神经、神经中枢、效应器、内分泌腺","感受器、传入神经、神经递质、传出神经、效应器","感受器、传入神经、神经中枢、传出神经、效应器","感受器、传入神经、神经中枢、传出神经、靶细胞"],"answer":3,"explain":"反射弧由感受器、传入神经、神经中枢、传出神经和效应器五部分组成，其中任何一个部分的结构或功能受损，反射活动均不能完成。","id":"z3-b6c806f8","type":"A1"},{"unit":"U03","ch":3,"part":2,"tag":"体液调节","stem":"与神经调节相比较，体液调节的特点是","options":["反应缓慢、作用持续时间较长、作用范围较广泛","反应迅速、调节精确、持续时间短暂","调节强度较弱、影响范围较小、灵敏度较低","反应迅速、作用持久、作用范围局限","不需要化学物质参与，由组织器官的自身特性决定"],"answer":0,"explain":"体液调节依靠激素等化学物质经体液途径作用于靶细胞，反应缓慢、作用持久、范围广泛；B为神经调节的特点，C为自身调节的特点。","id":"z3-e163566f","type":"A1"},{"unit":"U03","ch":3,"part":2,"tag":"自身调节","stem":"下列生理现象属于自身调节的是","options":["强光照射人眼引起瞳孔缩小","寒冷刺激引起甲状腺激素分泌增多","一定范围内心肌纤维被伸展得越长，其收缩力越强","进餐时进食动作引起胰岛素分泌","分娩时子宫肌肉收缩不断加强"],"answer":2,"explain":"自身调节由组织器官自身特性决定、不依赖神经和体液因素，离体灌流心脏中心肌伸展越长收缩越强即属此类；A为神经调节，B为体液调节，E为正反馈。","id":"z3-25803f56","type":"A1"},{"unit":"U03","ch":3,"part":2,"tag":"负反馈","stem":"下列生理过程属于负反馈调节的是","options":["排尿时尿液刺激尿道感受器，加强膀胱逼尿肌收缩","分娩时子宫肌肉收缩不断加强直至胎儿娩出","血管破损后凝血因子相继激活，引起血液凝固","进餐时进食动作在血糖升高之前即引起胰岛素分泌","血压升高时通过反馈信息使心脏和血管活动减弱，血压回降"],"answer":4,"explain":"负反馈是受控部分的反馈信息抑制控制部分的活动，血压、pH、渗透压和循环血量等均靠它保持稳定；A、B、C为正反馈，D为前馈控制。","id":"z3-c012df04","type":"A1"},{"unit":"U03","ch":3,"part":2,"tag":"正反馈","stem":"关于正反馈控制的叙述，正确的是","options":["正反馈的反馈信息使控制部分的活动减弱","正反馈使原有效应不断促进和加强，迅速达到预期顶点","正反馈是体内维持内环境稳态最重要的控制机制","正反馈在机体各种功能的调节中普遍存在","正反馈所建立的稳态都有利于机体，不会引起病理变化"],"answer":1,"explain":"正反馈是受控部分的反馈信息加强控制部分的活动，使原效应迅速达到预期顶点；维持内环境稳态主要靠负反馈，体内正反馈为数不多，过强时可致病理变化。","id":"z3-385b0379","type":"A1"},{"unit":"U03","ch":3,"part":2,"tag":"前馈控制","stem":"下列属于前馈控制（feed-forward control）的是","options":["餐后血糖升高刺激胰岛素分泌，血糖降低后胰岛素分泌被抑制","排尿时尿液刺激尿道感受器加强膀胱收缩","血液凝固过程中凝血因子相继被激活","进餐时进餐环境和进食动作在血糖升高之前即引起胰岛素分泌","一定范围内心肌纤维被伸展越长其收缩力越强"],"answer":3,"explain":"前馈控制中控制部分在发出指令的同时或稍前，经另一快捷通路通知受控部分，使活动具有预见性，机体各种条件反射都属于前馈控制；A为负反馈，B、C为正反馈。","id":"z3-e6353db6","type":"A1"},{"unit":"U03","ch":3,"part":2,"tag":"免疫概念","stem":"目前对免疫的正确理解是，免疫是指机体","options":["防御外来病原体、监视和清除体内突变或衰老细胞以及维持机体稳态的能力","抵抗传染病的能力","产生抗体以中和毒素的能力","对自身组织细胞产生免疫应答的能力","清除体内衰老和损伤红细胞的能力"],"answer":0,"explain":"免疫的传统含义仅是抵抗传染病，现代概念涵盖免疫防御、免疫监视和免疫自稳三方面功能；产生抗体、清除衰老红细胞只是其中部分环节。","id":"z3-a6ced15a","type":"A1"},{"unit":"U03","ch":3,"part":2,"tag":"免疫防御","stem":"免疫防御功能过强或持续时间过长时，可导致","options":["免疫缺陷病","恶性肿瘤发生风险增加","超敏反应性疾病","病毒持续性感染","自身免疫病"],"answer":2,"explain":"免疫防御过强或持续过久可造成组织损伤和功能异常，如过敏反应；A为防御功能低下，B、D为免疫监视功能低下，E为免疫自稳或免疫耐受失衡。","id":"z3-ea682418","type":"A1"},{"unit":"U03","ch":3,"part":2,"tag":"适应性免疫","stem":"与固有免疫（天然免疫）相比，适应性免疫的主要特点是","options":["由模式识别受体识别病原体相关分子模式和损伤相关分子模式","作用时相为即刻至96小时","无须抗原刺激即可迅速活化并产生免疫效应","不发生再次应答，没有免疫记忆功能","具有特异性、记忆性和耐受性"],"answer":4,"explain":"适应性免疫由T、B淋巴细胞介导，经克隆选择、增殖分化为效应细胞，具有特异性、记忆性和耐受性，可产生更快速强烈的再次应答；A、B、D为固有免疫特点。","id":"z3-3a782940","type":"A1"},{"unit":"U03","ch":3,"part":2,"tag":"免疫耐受","stem":"关于免疫耐受（immunological tolerance）的叙述，正确的是","options":["免疫耐受是指免疫系统对所有抗原都不产生应答","免疫耐受是指免疫系统对特定抗原呈现“免疫无反应”状态","免疫耐受只能在胚胎期接触抗原时建立","免疫耐受是固有免疫应答特有的性质","免疫耐受一旦被打破，机体抗感染能力必然增强"],"answer":1,"explain":"免疫耐受是免疫系统对特定抗原的“免疫无反应”状态，既可经胚胎期或新生期接触抗原建立，也可后天形成；耐受或免疫平衡被打破可引起自身免疫病或过敏性疾病。","id":"z3-f275da9f","type":"A1"},{"unit":"U03","ch":3,"part":2,"tag":"中枢免疫耐受","stem":"中枢免疫耐受形成的主要机制是","options":["自身反应性淋巴细胞在外周被调节性T细胞抑制","自身抗原表达水平过低而产生的免疫忽视","自身抗原位于脑、胎盘和眼前房等免疫豁免部位","发育中的T、B细胞与自身抗原高亲和力结合后发生凋亡，相应细胞克隆被清除","免疫细胞活化后表达Fas增多，经FasL诱导凋亡"],"answer":3,"explain":"中枢免疫耐受指T、B细胞在胸腺和骨髓发育过程中经阴性选择，使识别自身抗原的细胞克隆凋亡清除；A、B、C属外周免疫耐受机制，E为活化诱导的细胞死亡。","id":"z3-d4215254","type":"A1"},{"unit":"U03","ch":3,"part":2,"tag":"整体协调","stem":"关于神经、内分泌与免疫系统相互调节的叙述，正确的是","options":["免疫细胞不表达神经递质受体和内分泌激素受体","免疫系统不能影响神经、内分泌系统的功能","免疫细胞可产生IL-1、IL-6、TNF-α等细胞因子，作用于神经元或内分泌细胞","神经和内分泌系统只能通过细胞间直接接触调节免疫细胞","神经、内分泌与免疫系统之间的调节是单向的"],"answer":2,"explain":"几乎所有免疫细胞均表达神经递质受体和激素受体并可被其调节；免疫细胞也能分泌细胞因子、激素和神经肽影响神经内分泌系统，三者相互调节共同维持机体稳态。","id":"z3-b153f16c","type":"A1"},{"unit":"U04","ch":4,"part":2,"tag":"能量代谢","stem":"关于机体能量来源和利用的叙述，正确的是","options":["一般情况下人体所需的能量50%～70%由糖的氧化分解提供，ATP是体内直接的供能物质","脂质是体内直接的供能物质，糖是主要的储能形式","蛋白质是正常情况下机体最主要的供能物质","ATP只能储存能量，不能直接供能","物质在体内氧化所释放的能量全部转变为热能"],"answer":0,"explain":"正常时人体所需能量的50%～70%由糖氧化分解提供，脂质是主要储能形式，ATP既储能又直接供能；氧化释放的能量50%以上转为热能，其余储存于ATP中。","id":"z4-b782b2d5","type":"A1"},{"unit":"U04","ch":4,"part":2,"tag":"能量代谢测定","stem":"关于能量代谢测定的叙述，正确的是","options":["直接测热法是通过测定耗氧量和CO2产生量来计算机体产热量","间接测热法的装置复杂，主要用于研究肥胖和内分泌系统功能障碍疾病","能量代谢率的高低与体重成正比","间接测热法通过测定耗氧量和CO2产生量，据此计算得出机体释放的能量","直接测热法的依据是人体内营养物质氧化供能符合定比定律"],"answer":3,"explain":"间接测热法测定耗氧量和CO2产生量以计算释放的能量，依据是定比定律；直接测热法装置复杂，主要用于研究肥胖和内分泌疾病，能量代谢率与体表面积基本成正比。","id":"z4-181505e0","type":"A1"},{"unit":"U04","ch":4,"part":2,"tag":"呼吸商","stem":"关于呼吸商（respiratory quotient，RQ）的叙述，正确的是","options":["呼吸商是指一定时间内机体吸入的O2量与呼出的CO2量的比值","糖、蛋白质和脂质的呼吸商分别为1.0、0.80和0.71，正常进食时一般在0.85左右","三种营养物质中脂质的呼吸商最高","呼吸商是指某种食物氧化时消耗1L氧所产生的能量","呼吸商不能用于推测机体利用能量的主要来源"],"answer":1,"explain":"呼吸商是一定时限内呼出CO2量与吸入O2量的比值，糖为1.0、蛋白质0.8、脂质0.71，正常进食约0.85，可用以推测能量来源；D描述的是氧热价。","id":"z4-0e1dbf41","type":"A1"},{"unit":"U04","ch":4,"part":2,"tag":"影响能量代谢因素","stem":"在影响能量代谢的诸因素中，作用最显著的是","options":["食物的特殊动力效应","环境温度","精神紧张","性别与年龄","肌肉活动"],"answer":4,"explain":"肌肉活动对能量代谢的影响十分显著，任何轻微活动都可提高代谢率，剧烈运动时产热量可达安静状态时的10～20倍；其余因素对代谢也有影响，但不如肌肉活动显著。","id":"z4-6a273c03","type":"A1"},{"unit":"U04","ch":4,"part":2,"tag":"基础代谢率","stem":"关于基础代谢率（basal metabolic rate，BMR）的叙述，正确的是","options":["基础代谢是指进食后处于安静状态时所测得的能量代谢","基础代谢率随年龄增长而逐渐升高","基础代谢率在相对值±15%以内属正常范围，超过20%时可能是病理性变化","同年龄段的女子基础代谢率高于男子","体温每升高1℃，基础代谢率约降低13%"],"answer":2,"explain":"基础状态指清晨、清醒、安静、空腹；BMR随年龄增长而降低、同龄男子高于女子，正常范围在相对值±15%以内，发热时体温每升高1℃BMR约升高13%。","id":"z4-8f19023a","type":"A1"},{"unit":"U04","ch":4,"part":2,"tag":"体温波动","stem":"关于正常体温生理波动的叙述，正确的是","options":["体温呈昼夜周期性波动，清晨最低、午后最高，波动幅度一般不超过1℃","体温的昼夜波动幅度通常可达2～3℃","成年男性平均体温比成年女性高约0.3℃","新生儿特别是早产儿体温调节机制发育完善，体温不易受环境温度影响","老年人因基础代谢率高，体温偏高"],"answer":0,"explain":"正常体温昼夜波动以清晨最低、午后最高，幅度一般不超过1℃；成年女性平均比男性高约0.3℃，新生儿调节机制不完善，老年人基础代谢率低、体温偏低。","id":"z4-977e45c6","type":"A1"},{"unit":"U04","ch":4,"part":2,"tag":"产热","stem":"关于机体产热反应和产热形式的叙述，正确的是","options":["安静时机体产热量最大的器官是骨骼肌","战栗产热又称为代谢产热","非战栗产热以白色脂肪组织产热量最大","非战栗产热以棕色脂肪组织产热量最大，约占非战栗产热总量的70%","调节产热活动最重要的体液因素是肾上腺素"],"answer":3,"explain":"安静时肝产热量最大，运动时骨骼肌产热明显增加；非战栗产热又称代谢产热，以棕色脂肪组织产热量最大（约70%），调节产热最重要的体液因素是甲状腺激素。","id":"z4-bcc4b5dd","type":"A1"},{"unit":"U04","ch":4,"part":2,"tag":"散热","stem":"关于机体散热方式的叙述，正确的是","options":["辐射散热的多少取决于机体的体重和身高","当环境温度升高到接近或高于皮肤温度时，蒸发是唯一有效的散热形式","发汗是汗腺被动滤过汗液的过程，不受神经调节","临床上用冰帽、冰袋给高热患者降温主要利用对流散热","不感蒸发只有环境温度较高时才会发生"],"answer":1,"explain":"辐射散热取决于皮肤与环境的温度差及有效散热面积；冰帽冰袋降温利用传导散热；发汗是汗腺主动分泌、受交感胆碱能纤维支配的反射活动，不感蒸发在低温下也持续存在。","id":"z4-9e4b876b","type":"A1"},{"unit":"U04","ch":4,"part":2,"tag":"调定点","stem":"关于体温调节中枢和调定点（set point）的叙述，正确的是","options":["体温调节中枢位于延髓","调定点是由脊髓温度敏感神经元的工作特性决定的","调定点学说认为调定点的水平随环境温度而改变","当体温高于调定点水平时，机体产热增加、散热减少","视前区-下丘脑前部（POAH）被认为是体温调节中枢，正常调定点约为37℃"],"answer":4,"explain":"POAH被认为是哺乳动物的体温调节中枢，调定点由其温度敏感神经元特性决定，正常约37℃；体温高于调定点时加强散热、降低产热，低于调定点时产热增加、散热减少。","id":"z4-5908d9de","type":"A1"},{"unit":"U04","ch":4,"part":2,"tag":"发热与体温调节","stem":"患者感染后出现发热，体温维持在39℃左右，用调定点学说解释其发生机制是","options":["调定点下移，机体散热增加而产热减少","调定点水平不变，只是产热器官活动增强","致热原使调定点上移，机体产热增加、散热减少，体温升高到新的调定点水平","体温调节中枢的功能完全丧失","皮肤血管广泛舒张，散热明显增加"],"answer":2,"explain":"感染时前列腺素E等致热原作用于POAH使调定点上移，当中枢温度低于新调定点水平时产热增加、散热减少，体温因而升高至新的调定点水平。","id":"z4-95a8f300","type":"A1"},{"unit":"U05","ch":5,"part":2,"tag":"细胞膜的结构","stem":"关于细胞膜的液态镶嵌模型，下列叙述正确的是","options":["细胞膜以脂质双分子层为基架，在体温条件下呈液态并具有流动性，膜蛋白镶嵌于其中或附着于其表面","细胞膜内的脂质和蛋白质位置固定，膜呈固态，不能流动","膜蛋白仅覆盖在脂质双分子层的表面，不嵌入膜内","膜糖链只与脂质分子结合，与膜蛋白无关","细胞膜只起分隔细胞内外环境的作用，不参与物质交换和信息传递"],"answer":0,"explain":"液态镶嵌模型认为细胞膜以脂质双分子层为基架、呈液态且具有流动性，蛋白质镶嵌其中或附着于表面；膜糖链可与脂质、膜蛋白结合。","id":"z5-2be2e794","type":"A1"},{"unit":"U05","ch":5,"part":2,"tag":"单纯扩散","stem":"关于单纯扩散的叙述，正确的是","options":["需要载体蛋白参与，并具有结构特异性","逆浓度梯度转运，需要消耗ATP","脂溶性物质从膜的高浓度一侧向低浓度一侧转运，无膜蛋白参与、不消耗能量","转运速率只取决于膜的通透性，与膜两侧的浓度差无关","是葡萄糖、氨基酸等水溶性小分子进入细胞的主要方式"],"answer":2,"explain":"单纯扩散是脂溶性物质顺浓度差的被动转运，无生物学转运机制参与、不耗能，速率取决于浓度差和膜通透性；葡萄糖、氨基酸需载体转运。","id":"z5-f64dc9bb","type":"A1"},{"unit":"U05","ch":5,"part":2,"tag":"易化扩散","stem":"关于经通道介导的易化扩散的叙述，正确的是","options":["离子通道对通过的离子没有选择性","离子通道开放时，离子在浓度差和(或)电位差驱动下经孔道跨膜转运，属于被动转运","通道开放需要分解ATP提供能量","所有离子通道都持续开放，不具有门控性","葡萄糖经载体蛋白顺浓度梯度进入细胞属于经通道易化扩散"],"answer":1,"explain":"经通道易化扩散不耗能，离子顺浓度梯度和(或)电位梯度经孔道转运；通道对离子有选择性且多有门控性，葡萄糖经载体转运而非通道。","id":"z5-33058a92","type":"A1"},{"unit":"U05","ch":5,"part":2,"tag":"易化扩散","stem":"关于经载体介导的易化扩散的叙述，正确的是","options":["被转运物质逆浓度梯度转运，需要消耗能量","载体转运不具有结构特异性","载体转运不存在竞争性抑制现象","被转运物质浓度升高到一定程度后，转运速率不再增大，出现饱和现象","葡萄糖经葡萄糖转运体顺浓度梯度进入细胞属于原发性主动转运"],"answer":3,"explain":"载体转运具有结构特异性、饱和现象和竞争性抑制，属被动转运；葡萄糖经GLUT顺浓度梯度进入细胞是经载体易化扩散，不是原发性主动转运。","id":"z5-ba336f5e","type":"A1"},{"unit":"U05","ch":5,"part":2,"tag":"主动转运","stem":"关于钠泵（Na+-K+-ATP酶）的叙述，正确的是","options":["每分解1分子ATP，可将2个Na+移出胞外，同时将3个K+移入胞内","钠泵活动不消耗能量，属于被动转运","钠泵活动与细胞内高K+环境的维持无关","毒毛花苷G可增强钠泵的转运活动","每分解1分子ATP，可将3个Na+移出胞外、2个K+移入胞内，其活动具有生电性"],"answer":4,"explain":"钠泵每分解1分子ATP移出3个Na+、移入2个K+，产生净正电荷外流（生电性），维持细胞内高K+；毒毛花苷G可阻断钠泵活动。","id":"z5-5ae47bb6","type":"A1"},{"unit":"U05","ch":5,"part":2,"tag":"主动转运","stem":"关于继发性主动转运的叙述，正确的是","options":["小肠黏膜上皮细胞吸收葡萄糖时，Na+顺浓度梯度内流的同时将葡萄糖逆浓度梯度转入细胞","继发性主动转运所需的能量直接来自ATP的分解","被转运物质与Na+的转运方向相反者称为同向转运","心肌细胞Na+-Ca2+交换体使Na+内流、Ca2+外流，属于同向转运","继发性主动转运不依赖钠泵活动建立的Na+跨膜浓度梯度"],"answer":0,"explain":"继发性主动转运间接利用ATP，借钠泵建立的Na+浓度梯度供能，如小肠和肾小管的Na+-葡萄糖同向转运；同向指与Na+同方向，Na+-Ca2+交换属逆向转运。","id":"z5-8b87ec82","type":"A1"},{"unit":"U05","ch":5,"part":2,"tag":"静息电位","stem":"关于细胞静息电位的叙述，正确的是","options":["安静状态下膜主要对Na+通透，Na+内流是静息电位产生的主要原因","静息时细胞内K+浓度约为细胞外液的1/30","细胞外液K+浓度降低时，静息电位的绝对值减小","钠泵活动对静息电位没有影响","安静状态下膜主要对K+通透，K+外流是静息电位产生的主要原因，其数值接近K+平衡电位"],"answer":4,"explain":"静息时膜主要对K+通透，细胞内高K+外流形成外正内负的电位，数值接近K+平衡电位；少量Na+内流和钠泵生电性也参与，细胞外K+降低使静息电位绝对值增大。","id":"z5-b65fb00e","type":"A1"},{"unit":"U05","ch":5,"part":2,"tag":"动作电位","stem":"关于神经纤维动作电位产生机制的叙述，正确的是","options":["去极相由K+外流形成，复极相由Na+内流形成","动作电位的去极相主要由Na+内流形成，复极相主要由K+外流形成","电压门控Na+通道只有关闭和激活两种功能状态","Na+通道被激活后可直接恢复到静息态，不必经过失活态","复极化过程中细胞膜对Na+的通透性进一步增大"],"answer":1,"explain":"有效刺激使Na+通道开放、Na+内流形成去极相和超射，随后Na+通道迅速失活、K+通道开放引起K+外流形成复极相；Na+通道有静息、激活、失活三态。","id":"z5-1021f65f","type":"A1"},{"unit":"U05","ch":5,"part":2,"tag":"动作电位的传导","stem":"关于动作电位传导的叙述，正确的是","options":["有髓神经纤维上动作电位沿轴突膜连续产生，传导速度慢于无髓神经纤维","动作电位的幅度随传导距离的增加而逐渐减小","相邻细胞之间因电阻大，不能通过缝隙连接实现动作电位的直接传播","无髓神经纤维上，兴奋部位与邻近静息部位之间产生局部电流，使邻近静息部位去极化而产生新的动作电位","神经纤维的传导速度与轴突直径、髓鞘厚度无关"],"answer":3,"explain":"局部电流学说是动作电位传导的基础；有髓纤维的冲动在郎飞结间跳跃式传导，速度快，且轴突越粗、髓鞘越厚、结间体越长传导越快。","id":"z5-0dcffddb","type":"A1"},{"unit":"U05","ch":5,"part":2,"tag":"局部电位","stem":"关于局部电位的叙述，正确的是","options":["局部电位具有全或无的特点","局部电位由阈上刺激引起，可沿细胞膜不衰减地远距离传播","局部电位的幅度随刺激强度增大而增大，相距较近或先后产生的局部反应可发生总和","局部电位与动作电位一样呈脉冲式发放，不会融合","局部电位产生后不能影响邻近部位的膜电位"],"answer":2,"explain":"局部电位由阈下刺激引起，具有等级性、衰减性传导（扩布半径不超过1mm）及空间总和与时间总和三个特点，与动作电位的全或无不同。","id":"z5-f1bccf20","type":"A1"},{"unit":"U06","ch":6,"part":2,"tag":"上皮组织","stem":"关于上皮组织（epithelial tissue）的叙述，正确的是","options":["上皮组织内含有丰富的毛细血管，其营养由自身血管供应","腺上皮是由以分泌功能为主的腺细胞组成的上皮，被覆上皮主要分布在身体表面或有腔器官的腔面","上皮细胞的游离面朝向深部结缔组织，基底面朝向体表或腔面","上皮组织由大量细胞外基质和少量细胞构成，细胞排列疏松","上皮组织内不含感觉神经末梢，故感觉迟钝"],"answer":1,"explain":"被覆上皮分布于体表和有腔器官腔面，腺上皮由腺细胞组成；上皮内无血管（营养靠深部结缔组织血管）、细胞排列紧密、富含感觉神经末梢。","id":"z6-4fd2ba07","type":"A1"},{"unit":"U06","ch":6,"part":2,"tag":"被覆上皮","stem":"下列器官（或部位）与其腔面被覆上皮类型的对应，正确的是","options":["膀胱腔面——变移上皮","气管腔面——复层扁平上皮","食管腔面——单层柱状上皮","小肠腔面——假复层纤毛柱状上皮","心脏和血管腔面——复层柱状上皮"],"answer":0,"explain":"膀胱腔面为变移上皮（表层细胞称盖细胞）；气管为假复层纤毛柱状上皮，食管为未角化复层扁平上皮，小肠为单层柱状上皮，心与血管腔面为内皮。","id":"z6-ea29edfa","type":"A1"},{"unit":"U06","ch":6,"part":2,"tag":"上皮细胞特化结构","stem":"关于上皮细胞游离面特化结构的叙述，正确的是","options":["微绒毛是能定向节律性摆动的较长突起，光镜下即可清晰分辨","微绒毛内含有许多纵行的微管，其伸缩与微管滑动有关","纤毛基部没有基体，其摆动与动力蛋白无关","纤毛中央为2条单独的微管，周围为9组成对的双联微管，其摆动与动力蛋白分解ATP使微管滑动有关","静纤毛与纤毛结构相同，具有定向摆动功能"],"answer":3,"explain":"纤毛为9+2排列的微管结构，动力蛋白分解ATP使双联微管滑动而产生摆动；微绒毛含肌动蛋白微丝、需电镜观察，静纤毛似微绒毛而无摆动功能。","id":"z6-d64c4fe3","type":"A1"},{"unit":"U06","ch":6,"part":2,"tag":"上皮细胞特化结构","stem":"关于上皮细胞基底面特化结构的叙述，正确的是","options":["基膜由上皮细胞分泌的网板和结缔组织成纤维细胞分泌的基板构成","半桥粒为完整的桥粒结构，位于上皮细胞侧面，主要起通信作用","质膜内褶是基底面的细胞膜折向细胞质形成的内褶，主要见于肾小管，有利于水和电解质的迅速转运","基膜为完全不通透的膜，上皮与深部结缔组织之间不能进行物质交换","基膜只有支持作用，不能影响上皮细胞的增殖和分化"],"answer":2,"explain":"质膜内褶扩大细胞基底部的表面积，利于水和电解质转运，主要见于肾小管；基膜中基板由上皮细胞分泌、网板由成纤维细胞产生，是半透膜。","id":"z6-cb8e1a6f","type":"A1"},{"unit":"U06","ch":6,"part":2,"tag":"细胞连接","stem":"关于上皮细胞侧面细胞连接的叙述，正确的是","options":["紧密连接又称黏着小带，位于细胞侧面深部，主要起黏着作用","黏着小带呈斑状，细胞质内有张力丝附着于附着板上","缝隙连接的细胞间隙宽20～30nm，中央有一条致密的中间线","桥粒位于细胞侧面顶部，呈带状环绕细胞，具有屏障作用","缝隙连接由相邻细胞膜上的连接小体构成，有利于小分子物质和离子的交换及电信号转导"],"answer":4,"explain":"缝隙连接的连接小体管腔彼此通连，是细胞间直接交通的管道；紧密连接位于侧面顶部起屏障作用，桥粒以张力丝牢固连接细胞。","id":"z6-1d3e3a90","type":"A1"},{"unit":"U06","ch":6,"part":2,"tag":"疏松结缔组织","stem":"关于疏松结缔组织细胞的叙述，正确的是","options":["成纤维细胞是疏松结缔组织的主要细胞，能合成和分泌胶原蛋白、弹性蛋白和蛋白聚糖，参与创伤修复","巨噬细胞由B细胞分化而来，主要功能是合成和分泌免疫球蛋白","浆细胞来源于单核细胞，细胞质呈强嗜酸性，无核周晕","肥大细胞颗粒内主要含免疫球蛋白IgE，其释放可使细支气管平滑肌舒张","纤维细胞功能活跃，粗面内质网和高尔基复合体发达"],"answer":0,"explain":"成纤维细胞数量多、合成细胞外基质能力强，损伤修复时纤维细胞可转化为成纤维细胞；巨噬细胞来自单核细胞，浆细胞来自B细胞并分泌抗体。","id":"z6-d54ec63e","type":"A1"},{"unit":"U06","ch":6,"part":2,"tag":"疏松结缔组织","stem":"关于肥大细胞（mast cell）的叙述，正确的是","options":["肥大细胞颗粒内主要贮存免疫球蛋白IgE","颗粒内含组胺、肝素和嗜酸性粒细胞趋化因子等，释放后可引起过敏反应","组胺可使微静脉和毛细血管收缩、通透性降低","白三烯贮存于颗粒内，随颗粒脱粒一起迅速释放","肝素能促进血液凝固，参与止血"],"answer":1,"explain":"肥大细胞颗粒含组胺、肝素及趋化因子，组胺使微静脉和毛细血管扩张、通透性增加而致过敏反应；白三烯不在颗粒内贮存，肝素具有抗凝血作用。","id":"z6-5b4023ac","type":"A1"},{"unit":"U06","ch":6,"part":2,"tag":"疏松结缔组织","stem":"关于疏松结缔组织三种纤维的叙述，正确的是","options":["弹性纤维具有64nm的周期性横纹","胶原纤维由弹性蛋白构成，弹性强而韧性差","网状纤维主要分布在肌腱和腱膜，粗大而排列紧密","胶原原纤维由原胶原蛋白分子平行聚合而成，具有64nm的周期性横纹","疏松结缔组织内纤维数量多、排列紧密，故又称蜂窝组织"],"answer":3,"explain":"胶原原纤维由原胶原分子错位聚合，呈64nm周期性横纹；弹性纤维由弹性蛋白构成，网状纤维主要分布于结缔组织与其他组织的交界处。","id":"z6-2938fc28","type":"A1"},{"unit":"U06","ch":6,"part":2,"tag":"疏松结缔组织","stem":"关于疏松结缔组织基质的叙述，正确的是","options":["基质的主要成分是纤维粘连蛋白和层粘连蛋白","糖胺聚糖分子带大量阳离子，故不能结合水","蛋白聚糖复合物形成有微孔的分子筛，小于孔隙的水和营养物质可自由通过，细菌等大分子物质不能通过","组织液由毛细血管静脉端渗出，经动脉端回流入血","透明质酸含量最少，不构成蛋白聚糖复合物的主干"],"answer":2,"explain":"基质主要成分为蛋白聚糖，透明质酸含量最多并构成复合物主干，其分子筛利于物质交换、限制细菌扩散；组织液由毛细血管动脉端渗出。","id":"z6-920ffecc","type":"A1"},{"unit":"U06","ch":6,"part":2,"tag":"脂肪组织","stem":"关于脂肪组织的叙述，正确的是","options":["黄色脂肪组织的脂肪细胞含许多小脂滴，细胞核位于细胞中央","黄色脂肪组织主要分布在肩胛间区和腋窝","棕色脂肪组织在成人含量最多，约占体重的10%","脂肪细胞在HE染色标本中胞质呈强嗜酸性，脂滴保存完好","棕色脂肪组织含多泡脂肪细胞，线粒体较多，寒冷刺激下氧化脂质释放热能维持体温"],"answer":4,"explain":"棕色脂肪组织为多泡脂肪细胞，血管神经丰富，新生儿较多，寒冷时产热维持体温；黄色脂肪组织为单泡脂肪细胞，约占体重的10%。","id":"z6-5c0a63fd","type":"A1"},{"unit":"U06","ch":6,"part":2,"tag":"软骨","stem":"关于软骨的叙述，正确的是","options":["透明软骨基质内含大量弹性纤维，故新鲜时呈半透明状","纤维软骨基质内含有大量平行或交错排列的胶原纤维束，分布于椎间盘、关节盘及耻骨联合等处","弹性软骨分布于肋软骨和呼吸道，其基质内含大量胶原纤维束","三种软骨中只有透明软骨含有软骨细胞","软骨组织内血管丰富，软骨细胞由血液直接供血"],"answer":1,"explain":"纤维软骨富含胶原纤维束、韧性较强，见于椎间盘、关节盘和耻骨联合；肋软骨与呼吸道软骨为透明软骨，耳郭和会厌为弹性软骨，软骨内无血管。","id":"z6-d0a8b005","type":"A1"},{"unit":"U06","ch":6,"part":2,"tag":"骨组织","stem":"关于骨组织细胞的叙述，正确的是","options":["骨细胞数量最多，分散于骨板内或骨板间，其胞体所在腔隙称骨陷窝，突起所在腔隙称骨小管","成骨细胞由破骨细胞分化而来，主要功能是溶解吸收骨基质","破骨细胞由多个成骨细胞融合而成，光镜下细胞质呈强嗜碱性","骨祖细胞位于骨基质深部，是不能分裂的成熟细胞","骨细胞的突起之间没有连接，骨小管互不相通"],"answer":0,"explain":"骨细胞最多，位于骨陷窝内、突起伸入骨小管并借缝隙连接相通；成骨细胞成骨、破骨细胞（多个单核细胞融合）溶骨，骨祖细胞位于骨膜内层。","id":"z6-479fc761","type":"A1"},{"unit":"U06","ch":6,"part":2,"tag":"骨组织","stem":"关于骨基质的叙述，正确的是","options":["骨基质有机成分占骨重的65%，主要为羟基磷灰石结晶","骨基质无机成分占骨重的35%，主要为胶原纤维","类骨质是已经钙化的坚硬骨基质","有机成分中主要是胶原纤维（约占95%），新生的未钙化细胞外基质称为类骨质","板层骨中同一层骨板内胶原纤维相互垂直，相邻骨板的纤维相互平行"],"answer":3,"explain":"骨基质有机成分占35%、以胶原纤维为主，无机骨盐占65%；类骨质是未钙化的新生基质，板层骨同一层骨板纤维平行、相邻骨板纤维垂直。","id":"z6-0832ae39","type":"A1"},{"unit":"U06","ch":6,"part":2,"tag":"骨组织","stem":"关于长骨密质骨骨单位（哈弗斯系统）的叙述，正确的是","options":["骨单位位于内、外环骨板之间，其中轴为穿通管，内含血管和神经","骨单位周围有4～20层同心圆排列的骨板，各骨单位的骨小管彼此相通","骨单位呈长筒形，中轴为纵行的中央管，周围为同心圆排列的骨板，是长骨骨干内起主要支持作用的结构单位","间骨板环绕中央管呈同心圆排列，是长骨骨干的主要支持结构","内环骨板较厚、有10～40层，外环骨板较薄、仅有数层"],"answer":2,"explain":"骨单位中轴为纵行中央管，内含血管、神经和骨内膜，周围为同心圆骨板，是骨干的主要支持结构；间骨板无中央管，各骨单位骨小管在黏合线处折返。","id":"z6-4c785702","type":"A1"},{"unit":"U06","ch":6,"part":2,"tag":"骨骼肌","stem":"关于骨骼肌纤维光镜结构的叙述，正确的是","options":["细胞核位于细胞中央，每个细胞只有一个细胞核","横切面呈圆形，中央可见一个圆形细胞核","肌纤维分支多，互相连接成网","肌质内没有肌原纤维，横纹由肌膜折叠形成","呈长圆柱形，有明暗相间的横纹，多个细胞核位于肌质周边（肌膜下方）"],"answer":4,"explain":"骨骼肌纤维为多核细胞，核位于肌膜下方，肌质内含平行排列的肌原纤维，各肌原纤维的明带暗带排列在同一平面形成横纹；分支成网是心肌的特点。","id":"z6-4fb20c0f","type":"A1"},{"unit":"U06","ch":6,"part":2,"tag":"骨骼肌","stem":"关于骨骼肌肌节的叙述，正确的是","options":["肌节由1/2 A带＋I带＋1/2 A带组成","肌节由1/2 I带＋A带＋1/2 I带组成，是肌原纤维结构和功能的基本单位","明带中央有M线，暗带中央有Z线","粗肌丝一端固定于Z线，细肌丝借M线固定","肌节长度恒定，不随肌纤维的收缩和舒张而改变"],"answer":1,"explain":"肌节是相邻两条Z线之间的一段肌原纤维，由1/2 I带＋A带＋1/2 I带组成；粗肌丝位于A带并借M线固定，细肌丝一端固定于Z线。","id":"z6-8232e773","type":"A1"},{"unit":"U06","ch":6,"part":2,"tag":"骨骼肌","stem":"关于骨骼肌纤维横小管、肌质网及收缩机制的叙述，正确的是","options":["每条横小管与其两侧的终池共同组成三联体，肌质网膜上的钙通道开放使Ca2+涌入肌质，触发肌丝滑动","横小管的走向与肌纤维长轴平行，可将兴奋直接传给肌质网","人与哺乳动物骨骼肌纤维的横小管位于Z线水平","肌质网是肌纤维内特化的粗面内质网，主要参与蛋白质合成","肌质网内Ca2+浓度低于肌质，钙泵将Ca2+泵入肌质"],"answer":0,"explain":"横小管位于A带与I带交界处，与两侧终池组成三联体，其钙通道开放释放Ca2+触发肌丝滑动；肌质网为滑面内质网，钙泵使网内Ca2+浓度远高于肌质。","id":"z6-d2004fa0","type":"A1"},{"unit":"U06","ch":6,"part":2,"tag":"心肌","stem":"关于心肌纤维结构特点的叙述，正确的是","options":["心肌纤维呈长圆柱形、无分支，细胞核位于肌膜下方","心肌纤维肌质网发达，终池大而多，贮存Ca2+的能力强","心肌闰盘的横向连接部位为缝隙连接，纵向连接部位为桥粒","心肌纤维横小管位于Z线水平，多与一侧终池紧贴形成二联体，闰盘位于Z线水平","心肌纤维受躯体神经支配，属于随意肌"],"answer":3,"explain":"心肌横小管较粗短、位于Z线水平，多见二联体，肌质网稀疏，收缩前需从细胞外摄取Ca2+；闰盘横向为黏着小带和桥粒、纵向有缝隙连接。","id":"z6-85b8478c","type":"A1"},{"unit":"U06","ch":6,"part":2,"tag":"平滑肌","stem":"关于平滑肌纤维的叙述，正确的是","options":["平滑肌纤维呈长圆柱形，有多个细胞核位于周边","平滑肌纤维内有明显的肌原纤维和周期性横纹","平滑肌纤维肌膜凹陷形成小凹，胞质内有密斑、密体和中间丝构成的细胞骨架，属不随意肌","平滑肌纤维肌质网非常发达，贮存的Ca2+充足","平滑肌纤维之间没有缝隙连接，不能同步收缩"],"answer":2,"explain":"平滑肌为长梭形单核细胞，肌膜凹陷形成小凹（相当于横小管），肌质网不发达，无肌原纤维；纤维间发达的缝隙连接使许多肌纤维同步收缩。","id":"z6-cd32f1f8","type":"A1"},{"unit":"U06","ch":6,"part":2,"tag":"神经元","stem":"关于神经元结构的叙述，正确的是","options":["尼氏体在电镜下由许多平行排列的滑面内质网构成","轴丘处尼氏体丰富，在光镜下呈虎斑样","树突表面光滑无棘，轴突表面有大量树突棘","轴突内含有丰富的尼氏体，是合成神经递质的主要部位","尼氏体在电镜下由平行排列的粗面内质网和游离核糖体构成，主要功能是合成蛋白质"],"answer":4,"explain":"尼氏体为粗面内质网和游离核糖体，合成结构蛋白、神经递质合成酶及神经调质；轴丘和轴质内无尼氏体，树突表面有树突棘。","id":"z6-534791bb","type":"A1"},{"unit":"U06","ch":6,"part":2,"tag":"神经元","stem":"关于神经元分类的叙述，正确的是","options":["假单极神经元从胞体发出一个突起，在距胞体不远处呈T形分为两支，脊神经节内的感觉神经元属此类","双极神经元有两个以上突起，脊髓前角运动神经元属此类","高尔基Ⅰ型神经元胞体小、轴突短","运动神经元又称传入神经元，将外周信息传入中枢","中间神经元又称联络神经元，其轴突直接支配肌细胞"],"answer":0,"explain":"按突起数目分为假单极（一个突起呈T形分支，如脊神经节细胞）、双极（两个突起）和多极神经元；高尔基Ⅰ型神经元胞体大、轴突长。","id":"z6-630ae03b","type":"A1"},{"unit":"U06","ch":6,"part":2,"tag":"突触","stem":"关于突触的叙述，正确的是","options":["电突触通过缝隙连接传递信息，具有单向、缓慢传递的特点","化学突触由突触前成分、突触间隙和突触后成分组成，神经冲动使突触前膜钙通道开放、Ca2+内流，触发神经递质释放","突触前成分通常是神经元的树突终末","突触小泡膜外的突触素1磷酸化后与细胞骨架结合得更牢固","神经递质与突触后膜受体结合后引起化学门控通道关闭"],"answer":1,"explain":"化学突触由突触前成分、突触间隙和突触后成分构成，Ca2+内流使突触素1磷酸化、小泡与细胞骨架分离并出胞释放递质；电突触双向快速传递。","id":"z6-5003d2f9","type":"A1"},{"unit":"U06","ch":6,"part":2,"tag":"神经胶质细胞","stem":"关于神经胶质细胞的叙述，正确的是","options":["中枢神经系统的髓鞘由施万细胞形成","星形胶质细胞体积最小，具有变形运动和吞噬功能","室管膜细胞包绕在神经纤维轴突周围形成髓鞘","少突胶质细胞的突起末端包卷轴突形成中枢有髓神经纤维的髓鞘，小胶质细胞具有吞噬功能","胶质细胞有树突和轴突之分，能传导神经冲动"],"answer":3,"explain":"中枢髓鞘由少突胶质细胞形成、周围髓鞘由施万细胞形成；小胶质细胞最小且有吞噬功能，星形胶质细胞起支持和绝缘作用，胶质细胞无树突和轴突之分。","id":"z6-8d3bb726","type":"A1"},{"unit":"U06","ch":6,"part":2,"tag":"神经纤维","stem":"关于有髓神经纤维的叙述，正确的是","options":["中枢有髓神经纤维外表面有基膜，髓鞘内有切迹","有髓神经纤维上神经冲动沿轴突膜连续传导，速度慢于无髓神经纤维","周围有髓神经纤维由施万细胞呈长卷筒状一个接一个地包绕轴突形成节段性髓鞘，相邻施万细胞间轴突裸露处称郎飞结","髓鞘含大量类脂而具有亲水性，对轴突没有绝缘和保护作用","无髓神经纤维也有髓鞘和郎飞结，故传导速度更快"],"answer":2,"explain":"周围有髓纤维的髓鞘由施万细胞节段性包卷形成，冲动在郎飞结间跳跃式传导，速度快；中枢髓鞘由少突胶质细胞形成，无基膜、无切迹。","id":"z6-39c0416a","type":"A1"},{"unit":"U07","ch":7,"part":2,"tag":"受精部位","stem":"自然情况下，正常受精（fertilization）发生的部位是","options":["子宫腔","子宫颈管","输卵管伞部","输卵管峡部","输卵管壶腹部"],"answer":4,"explain":"获能精子与卵子在输卵管壶腹部相遇并融合；输卵管伞部只捡拾卵子，子宫腔是胚泡植入的部位。","id":"z7-ae7d7e54","type":"A1"},{"unit":"U07","ch":7,"part":2,"tag":"精子获能","stem":"关于精子获能（sperm capacitation），下列叙述正确的是","options":["精子在附睾内运行8～17天即可完成获能","精子在女性生殖管道内运行过程中，其头部抑制顶体释放水解酶的糖蛋白被降解，从而获得受精能力","获能是指精子获得运动能力的过程","精子获能后其受精能力可维持1周以上","未获能的精子仍具有与卵子融合的能力"],"answer":1,"explain":"附睾内的精子仅发育成熟，能运动但无受精能力，须在女性生殖管道内获能，其受精能力约维持24小时。","id":"z7-7e2b718e","type":"A1"},{"unit":"U07","ch":7,"part":2,"tag":"单精受精","stem":"第一个精子进入卵细胞后，皮质颗粒内容物进入透明带使ZP3分子变性，阻止其他精子穿越透明带，此过程称为","options":["顶体反应","皮质反应","透明带反应","精子获能","卵裂球致密化"],"answer":2,"explain":"透明带反应与皮质反应共同保证人卵单精受精；顶体反应指精子顶体释放水解酶解离放射冠、分解透明带。","id":"z7-7f3e84a0","type":"A1"},{"unit":"U07","ch":7,"part":2,"tag":"卵裂","stem":"关于卵裂（cleavage）的叙述，正确的是","options":["卵裂是受精卵早期进行的有丝分裂，卵裂球数目增多而细胞体积逐渐变小","卵裂自受精后第4天开始","卵裂过程中透明带迅速消失，卵裂球直接与子宫腔接触","受精后72小时，胚形成由50～60个细胞构成的实心细胞团","人胚第一次卵裂约在受精后30分钟完成"],"answer":0,"explain":"卵裂至胚泡孵出前胚外面始终包裹透明带；受精后约30小时完成第一次卵裂，72小时形成12～16个卵裂球的桑椹胚。","id":"z7-d07ab6c2","type":"A1"},{"unit":"U07","ch":7,"part":2,"tag":"胚泡","stem":"关于人胚泡（blastocyst）的叙述，正确的是","options":["胚泡腔位于内细胞群内，腔内充满母体血液","滋养层是一层立方形细胞，将来形成胚体的始基","内细胞群将来主要形成胎盘和胎膜","紧贴内细胞群一侧的滋养层称极端滋养层，内细胞群是胚体发生的原基","内细胞群细胞已失去分化潜能，只能形成一种组织"],"answer":3,"explain":"胚泡腔为滋养层围成的腔，腔内充满液体；滋养层为扁平细胞，将来形成胚外组织；内细胞群可分化为全身所有细胞。","id":"z7-2058b5c2","type":"A1"},{"unit":"U07","ch":7,"part":2,"tag":"植入","stem":"关于胚泡植入（implantation）的叙述，正确的是","options":["植入开始于受精后第3天，第5天完成","植入自受精后第5～6天开始，第11～12天完成，植入过程中滋养层分化为合体滋养层和细胞滋养层","植入时滋养层尚未分化，胚泡以整个滋养层侵入子宫内膜","植入过程中子宫内膜上皮缺口始终不修复，保持开放状态","植入后子宫内膜功能层改称蜕膜，蜕膜在分娩后保留并再生"],"answer":1,"explain":"滋养层分化为外层的合体滋养层与内层的细胞滋养层；植入完成后子宫内膜上皮增生、缺口修复，蜕膜于分娩时脱落。","id":"z7-eb7c6e8b","type":"A1"},{"unit":"U07","ch":7,"part":2,"tag":"植入部位","stem":"正常受精的部位与异位妊娠最常发生的部位分别是","options":["子宫腔、输卵管壶腹部","输卵管伞部、输卵管壶腹部","输卵管壶腹部、输卵管","输卵管壶腹部、卵巢表面","子宫颈管、子宫阔韧带"],"answer":2,"explain":"受精在输卵管壶腹部完成；胚泡植入子宫以外部位即异位妊娠，多见于输卵管；若植入靠近子宫颈处则形成前置胎盘。","id":"z7-11be1982","type":"A1"},{"unit":"U07","ch":7,"part":2,"tag":"二胚层胚盘","stem":"关于二胚层胚盘及其附属结构的叙述，正确的是","options":["下胚层又称初级内胚层，上胚层又称初级外胚层，两者紧密相贴构成椭圆形的二胚层胚盘","下胚层上方的柱状细胞为滋养层细胞","羊膜腔位于下胚层细胞之间，其内液体来自母体血液","初级卵黄囊由下胚层与羊膜共同围成","胚外中胚层位于胚盘内，由外胚层细胞迁移形成"],"answer":0,"explain":"上胚层是下胚层上方的一层柱状细胞；羊膜腔出现于上胚层细胞之间；初级卵黄囊由下胚层与外体腔膜（Heuser膜）围成。","id":"z7-ebb08c37","type":"A1"},{"unit":"U07","ch":7,"part":2,"tag":"三胚层胚盘","stem":"关于三胚层胚盘形成的叙述，正确的是","options":["原条出现的一端为胚体头端","原结位于原条尾端，其细胞向尾端迁移形成脊索","脊索由内胚层细胞增殖形成，将来演变为脊柱","原条头端膨大形成原结，脊索由原结细胞向下、向头端迁移形成；三胚层胚盘的内、中、外胚层均来源于上胚层细胞","胚内中胚层由下胚层细胞转化而来"],"answer":3,"explain":"原条所在的一端为胚体尾端；脊索形成后诱导其背侧外胚层演变为神经管，脊索大部分退化，残存部分演化为椎间盘髓核。","id":"z7-728f1897","type":"A1"},{"unit":"U07","ch":7,"part":2,"tag":"外胚层","stem":"关于外胚层分化的叙述，正确的是","options":["神经板由中胚层细胞在脊索背侧聚集形成","神经沟两侧的隆起称神经褶，前神经孔约在人胚发育第27天闭合","神经管头端发育为脊髓，尾端发育为脑","神经嵴细胞分化为脑和脊髓的神经元","若前神经孔未闭合可发育成无脑儿，后神经孔未闭合可致脊柱裂或脊髓裂"],"answer":4,"explain":"前神经孔约第25天闭合、头端发育为脑，后神经孔约第27天闭合、尾端发育为脊髓；神经嵴分化为周围神经节、施万细胞、肾上腺髓质和黑素细胞。","id":"z7-9b230d32","type":"A1"},{"unit":"U07","ch":7,"part":2,"tag":"中胚层","stem":"中胚层分化形成的三部分中，将来分化为泌尿系统和生殖系统主要器官的是","options":["轴旁中胚层","侧中胚层的体壁中胚层","间介中胚层","侧中胚层的脏壁中胚层","中胚层间充质"],"answer":2,"explain":"轴旁中胚层形成体节，分化为真皮、中轴骨和骨骼肌；体壁中胚层分化为体壁的骨骼、肌和结缔组织，脏壁中胚层覆盖原始消化管。","id":"z7-f87049ad","type":"A1"},{"unit":"U07","ch":7,"part":2,"tag":"内胚层","stem":"内胚层卷折形成原始消化管后，可分化形成下列哪种结构的上皮","options":["皮肤的表皮","视网膜","肾上腺髓质","甲状腺、甲状旁腺上皮","皮肤真皮"],"answer":3,"explain":"原始消化管分化为消化管与消化腺上皮、呼吸道上皮、甲状腺与甲状旁腺上皮、胸腺上皮及膀胱、尿道、阴道上皮等；表皮和视网膜来自外胚层，真皮来自中胚层。","id":"z7-6054e8f0","type":"A1"},{"unit":"U07","ch":7,"part":2,"tag":"胎膜","stem":"人胎膜（fetal membrane）的组成是","options":["卵黄囊、尿囊、羊膜、绒毛膜和脐带","卵黄囊、尿囊、羊膜和胎盘","羊膜、绒毛膜、脐带和底蜕膜","羊膜、平滑绒毛膜和丛密绒毛膜","卵黄囊、尿囊、羊膜、绒毛膜、脐带和胎盘"],"answer":0,"explain":"胎膜与胎盘均为胎儿附属结构，但胎盘由胎儿的丛密绒毛膜与母体的底蜕膜构成，不属于胎膜；两者与子宫蜕膜分娩后一并排出，总称胞衣。","id":"z7-1acc9e67","type":"A1"},{"unit":"U07","ch":7,"part":2,"tag":"胎盘结构与功能","stem":"关于人胎盘结构与功能的叙述，正确的是","options":["胎盘由胎儿的平滑绒毛膜与母体的包蜕膜共同构成","胎盘母体面光滑并覆盖羊膜，可见15～30个胎盘小叶","胎盘的内分泌功能由细胞滋养层细胞完成","胎儿血与母体血在绒毛间隙内直接混合，胎盘是两者的混合场所","胎盘由胎儿的丛密绒毛膜与母体的底蜕膜共同构成，其功能相当于出生后小肠、肺和肾"],"answer":4,"explain":"胎盘母体面粗糙，为剥离后的底蜕膜，可见胎盘小叶；激素主要由合体滋养层细胞分泌；胎儿血与母体血在各自封闭管道内循环，互不相混。","id":"z7-b542f947","type":"A1"},{"unit":"U07","ch":7,"part":2,"tag":"胎盘膜","stem":"关于胎盘膜（placental membrane）的叙述，正确的是","options":["胎盘膜由羊膜、平滑绒毛膜和底蜕膜三层构成","胎盘膜由合体滋养层、细胞滋养层及其基膜、绒毛结缔组织、绒毛毛细血管基膜及内皮构成，胚胎发育后期变薄、通透性增强","胎盘膜随胚胎发育逐渐增厚，通透性逐渐降低","胎盘膜能阻止所有药物、毒素和激素进入胎儿体内","胎盘膜即绒毛膜板，脐血管分支走行其中"],"answer":1,"explain":"早期胎盘膜较厚，后期细胞滋养层逐渐消失、胎盘膜变薄；某些毒素、药物和激素仍可通过胎盘膜进入胎儿体内，故孕妇用药须谨慎。","id":"z7-a76455c7","type":"A1"},{"unit":"U07","ch":7,"part":2,"tag":"胎盘血液循环","stem":"关于胎盘内胎儿血循环与母体血循环的叙述，正确的是","options":["胎儿血与母体血在各自的封闭管道内循环，互不相混，但可进行物质交换","脐动脉将含氧丰富的血液运送入胎儿体内","子宫螺旋动脉开口于绒毛间隙，胎儿血在此与母体血混合","胎儿血液经脐静脉流入绒毛内毛细血管，与母体血进行物质交换","绒毛间隙内的血液直接来自子宫静脉"],"answer":0,"explain":"胎儿静脉血经脐动脉及其分支流入绒毛内毛细血管，交换后由脐静脉把氧和营养物质运回胎儿；绒毛间隙的母血来自子宫螺旋动脉，经子宫静脉回流。","id":"z7-87f11fce","type":"A1"},{"unit":"U08","ch":8,"part":3,"tag":"健康概念","stem":"世界卫生组织（WHO）1946年在其宪章前言中对健康的表述是","options":["健康是指躯体没有疾病或体弱现象","健康不仅是没有疾病或体弱，而且是躯体上、精神上和社会适应上的一种完好状态","健康是指机体内环境理化性质保持相对稳定","健康是指机体各器官系统具有良好的生理功能","健康是指人体能够适应各种环境变化而不发生疾病"],"answer":1,"explain":"健康的定义已由生物医学模式转向生物-心理-社会医学模式，仅躯体无病或功能正常不足以涵盖精神和社会适应方面的完好状态。","id":"z8-27c402a0","type":"A1"},{"unit":"U08","ch":8,"part":3,"tag":"疾病概念","stem":"目前认为，疾病是指","options":["机体在一定病因作用下，自稳态调节紊乱而导致的异常生命活动过程","机体出现症状和体征的状态","机体形态结构发生不可逆改变的过程","由遗传因素决定的机体功能异常","机体衰老过程中必然出现的功能减退"],"answer":0,"explain":"疾病强调病因作用和自稳态调节紊乱两个要素，并具有功能、代谢及形态结构改变，是一个动态过程；仅凭症状体征或遗传因素不能概括疾病。","id":"z8-14fa7914","type":"A1"},{"unit":"U08","ch":8,"part":3,"tag":"病因类型","stem":"下列疾病与其主要病因因素的对应，正确的是","options":["血友病A——营养性因素","佝偻病——遗传性因素","唐氏综合征——染色体畸变","过敏性休克——免疫功能不足","地方性甲状腺肿——心理和社会因素"],"answer":2,"explain":"唐氏综合征由第21对染色体畸变引起；血友病A为单基因突变所致，佝偻病由维生素D缺乏引起，过敏性休克属免疫过强（超敏反应）。","id":"z8-0d105dca","type":"A1"},{"unit":"U08","ch":8,"part":3,"tag":"条件与诱因","stem":"关于疾病发生的条件及其相关概念，下列叙述正确的是","options":["条件即病因，可直接引起疾病并决定疾病的特异性","条件是指不直接导致疾病，但能够促进或阻碍疾病发生、发展的机体状态、自然环境或社会因素","条件与原因在不同疾病中只能独立存在，不能相互转化","危险因素是指能够明确区分是病因还是诱因的因素","诱因是指疾病发展过程中形成的病理结果"],"answer":1,"explain":"病因直接导致疾病并决定其特异性；诱因是加强病因作用或促进疾病发生的因素，危险因素与疾病明显相关但分不清是病因还是诱因。","id":"z8-82e1ccdd","type":"A1"},{"unit":"U08","ch":8,"part":3,"tag":"神经-体液机制","stem":"长期应激状态引起血压升高的神经-体液机制，下列叙述正确的是","options":["副交感神经系统兴奋使心率加快、心排血量增加","交感神经系统兴奋使儿茶酚胺类释放减少","交感神经系统兴奋使儿茶酚胺类释放增加，经肾素-血管紧张素-醛固酮系统激活使血压升高","肾小动脉舒张促使肾素释放增加","体液因子只能经血液循环在全身发挥作用，不能局部作用"],"answer":2,"explain":"长期应激使交感兴奋、儿茶酚胺增多，心率与心排血量增加、小动脉收缩；肾小动脉收缩促使肾素释放，激活肾素-血管紧张素-醛固酮系统使血压升高。","id":"z8-04d48b1f","type":"A1"},{"unit":"U08","ch":8,"part":3,"tag":"细胞机制","stem":"关于疾病发生的细胞机制，下列叙述正确的是","options":["各种致病因素对组织细胞的损伤均无选择性","细胞膜离子泵功能失调仅引起细胞水肿，不造成细胞信号与代谢失调","细胞器功能障碍中以溶酶体功能障碍对细胞及机体的影响最为突出","线粒体功能障碍时氧化磷酸化障碍、能量生成不足而氧自由基生成增多，对细胞影响最为突出","致病因素不能直接作用于细胞，只能通过神经反射引起细胞损伤"],"answer":3,"explain":"烧伤等可非选择性损伤组织细胞，而各种病原微生物可选择性损伤特定靶细胞；线粒体是氧化磷酸化供能和氧自由基产生的主要部位。","id":"z8-97b549e2","type":"A1"},{"unit":"U08","ch":8,"part":3,"tag":"分子机制","stem":"镰状细胞贫血的分子机制是","options":["血红蛋白β链N端第6位缬氨酸被谷氨酸替代","血红蛋白α链缺失致血红蛋白合成障碍","多个基因共同改变引起的多基因病","致病因素影响基因转录后修饰所致","血红蛋白β链N端第6位谷氨酸被缬氨酸替代，形成异常血红蛋白"],"answer":4,"explain":"该病是单个基因改变导致异常血红蛋白的典型例子；血友病A亦为单基因突变所致，而高血压、糖尿病等与多个基因改变相关。","id":"z8-481f6ce3","type":"A1"},{"unit":"U08","ch":8,"part":3,"tag":"疾病进程与转归","stem":"关于疾病的进程与转归，下列叙述正确的是","options":["所有疾病的潜伏期均很短，一般不超过数小时","不完全康复是指机体功能、代谢和结构完全恢复正常","完全康复（痊愈）的患者仍遗留某些病理改变","潜伏期是指病因作用于机体后到出现症状前的一段时期","疾病一旦发生，其转归必然是死亡"],"answer":3,"explain":"潜伏期长短不一，可短至数分钟、长至数年；不完全康复时主要症状体征消失，但功能代谢结构未完全恢复，如急性心肌梗死后的室壁瘤。","id":"z8-11115358","type":"A1"},{"unit":"U08","ch":8,"part":3,"tag":"脑死亡概念","stem":"关于脑死亡（brain death）的叙述，正确的是","options":["脑死亡是指大脑和脑干功能的完全和不可逆转的丧失，以及机体作为一个整体功能的永久性停止","脑死亡与植物状态是同一概念，患者均无自主呼吸","脑死亡是可逆的深度昏迷，经积极抢救多数患者可恢复","脑死亡后身体其他部位的组织器官均立即丧失功能，故不能用于器官捐献","我国目前已立法，将脑死亡作为法定的死亡标准"],"answer":0,"explain":"植物状态是大脑半球严重受损而脑干功能相对保留，患者仍保持自主呼吸，与脑死亡根本不同；我国尚未立法，仍采用综合死亡标准。","id":"z8-73d2455f","type":"A1"},{"unit":"U08","ch":8,"part":3,"tag":"脑死亡判定与意义","stem":"关于脑死亡的判定标准及其意义，下列叙述正确的是","options":["脑死亡的判定以脑电波消失为唯一标准","脑死亡后心肌立即停止收缩，故心搏停止是判定脑死亡的首要指标","判定脑死亡会浪费医疗卫生资源，不利于医疗资源的合理利用","被确定脑死亡的患者，其尚有功能的器官不能用于器官捐献","自主呼吸停止是临床脑死亡的首要指标，判定脑死亡有助于判断死亡时间、适时终止复苏抢救"],"answer":4,"explain":"脑干是控制呼吸和心搏的中枢，因心肌具有自发收缩特性，脑干死亡后一定时间内仍可有微弱心搏，故以自主呼吸停止为首要指标。","id":"z8-807fa757","type":"A1"},{"unit":"U09","ch":9,"part":3,"tag":"萎缩类型","stem":"患者因尿路梗阻导致肾盂积水，肾实质长期受压而体积缩小、功能减退。该患者肾的萎缩属于","options":["失用性萎缩","去神经性萎缩","内分泌性萎缩","营养不良性萎缩","压迫性萎缩"],"answer":4,"explain":"器官长期受压、缺血缺氧所致的萎缩为压迫性萎缩；失用性萎缩由长期工作负荷减小引起，去神经性萎缩由运动神经元或轴突损伤所致。","id":"z9-3591d584","type":"A1"},{"unit":"U09","ch":9,"part":3,"tag":"肥大与增生","stem":"高血压患者长期后负荷增加，左心室发生心肌肥大。关于该适应性改变，正确的是","options":["以心肌细胞数量增多（增生）为主","以心肌细胞体积增大为主","以心肌间质纤维组织增生为主","属于内分泌性肥大","心肌细胞发生化生"],"answer":1,"explain":"增殖能力弱或无增殖能力的细胞（如心肌）负荷增加时只能以细胞体积增大来适应，即肥大；心肌细胞不能分裂增生，也不属内分泌性肥大。","id":"z9-1252f75d","type":"A1"},{"unit":"U09","ch":9,"part":3,"tag":"化生","stem":"长期吸烟者支气管黏膜的假复层纤毛柱状上皮被鳞状上皮取代。该适应性改变属于","options":["鳞状上皮化生","柱状上皮化生","肠上皮化生","鳞状上皮增生","上皮-间质转化"],"answer":0,"explain":"一种分化成熟的细胞被另一种分化成熟细胞取代的过程称为化生，支气管假复层纤毛柱状上皮转变为鳞状上皮属鳞状上皮化生（鳞化），可减弱黏膜自净能力。","id":"z9-77bd491a","type":"A1"},{"unit":"U09","ch":9,"part":3,"tag":"损伤原因与机制","stem":"引起细胞和组织损伤最常见、最主要的因素是","options":["化学性因素","物理性因素","缺氧及缺血","免疫性因素","遗传性缺陷"],"answer":2,"explain":"缺氧及缺血是引起细胞和组织损伤最常见、最主要的因素，可致ATP减少、细胞内Ca²⁺稳态失衡并破坏细胞膜完整性（后者是早期不可逆损伤的关键环节）。","id":"z9-fac6fc24","type":"A1"},{"unit":"U09","ch":9,"part":3,"tag":"细胞水肿","stem":"细胞内水和钠离子过多聚集，多见于心、肝和肾等器官的实质细胞，是细胞损伤中最早出现、最常见的变性。该病变是","options":["脂肪变性","玻璃样变性","淀粉样变性","细胞水肿（水变性）","黏液样变性"],"answer":3,"explain":"缺氧、感染、中毒损伤线粒体使ATP生成减少、细胞膜Na⁺-K⁺泵功能障碍，细胞内水和钠增多，形成细胞水肿，严重时细胞膨大如气球，称气球样变。","id":"z9-aefbe3a0","type":"A1"},{"unit":"U09","ch":9,"part":3,"tag":"脂肪变性","stem":"心肌脂肪变性时心肌呈黄红相间的条纹，形似虎斑，故称“虎斑心”。该病变最显著的发生部位是","options":["室间隔","乳头肌和心内膜下心肌","左心室前壁","右心室流出道","心外膜下心肌"],"answer":1,"explain":"心肌脂肪变性时，因心肌内动、静脉分布使各处缺氧程度不一，最显著部位为乳头肌和心内膜下心肌，黄色条纹与暗红色心肌相间横向排列，似虎斑。","id":"z9-2318ffad","type":"A1"},{"unit":"U09","ch":9,"part":3,"tag":"玻璃样变性","stem":"缓进型高血压患者肾、脑、脾等器官的细动脉管壁增厚、管腔狭窄甚至闭塞，弹性下降。该病变的本质是","options":["细胞水肿","脂肪变性","黏液样变性","淀粉样变性","玻璃样变性"],"answer":4,"explain":"血管壁玻璃样变性时血浆蛋白渗入并沉积于血管内膜下，管壁增厚、管腔狭窄甚至闭塞、弹性下降，故又称小动脉硬化，其蓄积物本质为蛋白质。","id":"z9-1d506cc4","type":"A1"},{"unit":"U09","ch":9,"part":3,"tag":"淀粉样变性","stem":"组织内淀粉样物质沉积时，在偏光显微镜下呈现苹果绿色并具有双折光性。产生这一特征性表现所采用的染色方法是","options":["苏丹Ⅲ染色","普鲁士蓝染色","碘液染色","刚果红染色","HE染色"],"answer":3,"explain":"刚果红染色后，淀粉样物质在偏光显微镜下呈苹果绿色并具双折光性，是其诊断依据；苏丹Ⅲ染脂滴、普鲁士蓝染含铁血黄素、HE为常规染色。","id":"z9-b392cc12","type":"A1"},{"unit":"U09","ch":9,"part":3,"tag":"病理性色素沉着","stem":"老年人及慢性消耗性疾病患者萎缩的心肌细胞、肝细胞内，核周或核两端可见黄褐色细颗粒，该物质是","options":["含铁血黄素","黑色素","胆红素","淀粉样物质","脂褐素"],"answer":4,"explain":"脂褐素是细胞内自噬溶酶体中未被消化的细胞器碎片形成的残体，多见于萎缩的心肌细胞、肝细胞，故又称消耗性色素；含铁血黄素来自红细胞破坏。","id":"z9-74a3e876","type":"A1"},{"unit":"U09","ch":9,"part":3,"tag":"病理性钙化","stem":"结核坏死灶、动脉粥样硬化斑块及寄生虫卵内出现钙盐沉积，而患者钙、磷代谢正常。该病变属于","options":["营养不良性钙化","转移性钙化","病理性色素沉着","淀粉样变性","玻璃样变性"],"answer":0,"explain":"钙盐沉积于局部变性、坏死组织或异物内而机体钙磷代谢正常者为营养不良性钙化；转移性钙化由高血钙引起，钙盐沉积于肾小管、肺泡等正常组织。","id":"z9-cfcf46cb","type":"A1"},{"unit":"U09","ch":9,"part":3,"tag":"坏死与凋亡","stem":"关于细胞凋亡与坏死的区别，下列叙述正确的是","options":["凋亡时细胞膜破裂、细胞溶解，并引起明显的周围炎症反应","凋亡时细胞核呈现核固缩、核碎裂、核溶解","坏死多累及单个细胞，而凋亡常累及成片细胞","凋亡细胞皱缩，形成凋亡小体，一般不引起周围炎症反应及增生修复反应","凋亡属被动死亡，坏死属主动死亡"],"answer":3,"explain":"凋亡细胞皱缩、染色质凝聚、形成有膜包被的凋亡小体，不引起周围炎症反应，也不诱发增生修复；核固缩、核碎裂、核溶解是坏死的标志。","id":"z9-924f98d4","type":"A1"},{"unit":"U09","ch":9,"part":3,"tag":"坏死类型","stem":"脑组织富含水分和磷脂、可凝固的蛋白质较少，其缺血性坏死灶呈液态。该坏死类型是","options":["凝固性坏死","干酪样坏死","液化性坏死","纤维素样坏死","湿性坏疽"],"answer":2,"explain":"脑组织缺血坏死为液化性坏死，又称脑软化；凝固性坏死多见于心、脾、肾的缺血性坏死，干酪样坏死是凝固性坏死的特殊类型，常见于结核病。","id":"z9-fe26d06f","type":"A1"},{"unit":"U09","ch":9,"part":3,"tag":"坏死结局","stem":"坏死灶较大，难以被完全溶解吸收或分离排出时，由新生的肉芽组织将其取代，该过程称为","options":["溶解吸收","分离排出","机化","包裹","钙化"],"answer":2,"explain":"坏死灶由新生的肉芽组织取代的过程称为机化；若坏死灶过大不能被完全机化，则由纤维结缔组织将其包绕，称为包裹。","id":"z9-12062bc6","type":"A1"},{"unit":"U09","ch":9,"part":3,"tag":"肉芽组织","stem":"肉芽组织是纤维性修复的主要成分，其镜下形态结构是","options":["大量平行或交错排列的胶原纤维束，其间仅有少量纤维细胞","新生的毛细血管、增生的成纤维细胞及炎性细胞浸润","增生的实质细胞及纤维结缔组织","大量中性粒细胞及坏死组织碎片","单核巨噬细胞及其衍生细胞构成的界限清楚的结节状病灶"],"answer":1,"explain":"肉芽组织由新生的毛细血管和增生的成纤维细胞构成，常伴炎性细胞浸润；大量平行胶原纤维束加少量纤维细胞是瘢痕组织的镜下特点。","id":"z9-9992409f","type":"A1"},{"unit":"U09","ch":9,"part":3,"tag":"创伤愈合","stem":"关于皮肤创伤一期愈合的特点，下列叙述正确的是","options":["缺损少、创缘整齐、无感染、对合好，愈合快且瘢痕小","见于缺损大、创缘不齐或伴有感染的创口","需大量肉芽组织填平创口，愈合时间长、瘢痕大","须待坏死组织清除、感染控制后再生才能开始","愈合后常形成突出于皮肤表面的瘢痕疙瘩"],"answer":0,"explain":"一期愈合见于缺损少、创缘整齐、无感染、对合好的创口，24～48小时表皮再生，5～7天胶原纤维连接可行拆线，瘢痕小；其余各项为二期愈合特点。","id":"z9-da73df57","type":"A1"},{"unit":"U09","ch":9,"part":3,"tag":"骨折愈合","stem":"骨折愈合过程的正确顺序是","options":["血肿形成→骨性骨痂形成→纤维性骨痂形成→骨痂改建","血肿形成→纤维性骨痂形成→骨性骨痂形成→骨痂改建","纤维性骨痂形成→血肿形成→骨性骨痂形成→骨痂改建","血肿形成→纤维性骨痂形成→骨痂改建→骨性骨痂形成","骨性骨痂形成→纤维性骨痂形成→血肿形成→骨痂改建"],"answer":1,"explain":"骨折愈合依次为血肿形成、纤维性骨痂形成（第2～3天开始，需2～3周）、骨性骨痂形成（4～8周）和骨痂改建，改建需数月甚至数年完成。","id":"z9-e0b3b46d","type":"A1"},{"unit":"U10","ch":10,"part":3,"tag":"炎症概念","stem":"关于炎症的概念，下列叙述正确的是","options":["炎症是具有血管系统的活体组织对各种损伤因子所发生的以防御反应为主的基本病理过程","炎症仅发生于病原微生物感染时，无血管组织亦可发生","炎症是损伤因子直接引起的组织坏死，与机体反应无关","炎症反应对机体只有利、没有害","炎症是免疫系统针对自身抗原的专属反应"],"answer":0,"explain":"炎症是具有血管系统的活体组织对各种损伤因子的防御反应，凡引起组织损伤的因子均可引起；炎症也具“双刃剑”作用，可致组织损伤、纤维化甚至肿瘤。","id":"z10-a56a06cf","type":"A1"},{"unit":"U10","ch":10,"part":3,"tag":"基本病理变化","stem":"炎症局部组织的三大基本病理变化是","options":["充血、水肿、出血","变性、坏死、凋亡","萎缩、肥大、化生","变质、渗出、增生","血管反应、白细胞反应、纤维化"],"answer":3,"explain":"变质、渗出和增生是炎症的三大基本病理变化，其中以血管反应为中心的渗出最具特征性；炎症初期以变质、渗出为主，后期以增生为主。","id":"z10-a0b911ac","type":"A1"},{"unit":"U10","ch":10,"part":3,"tag":"血管反应","stem":"急性炎症时局部组织出现发红和发热，其主要原因是","options":["血管通透性增高、血浆渗出形成炎性水肿","血流减慢甚至停滞","白细胞边集与游出","组织坏死分解产热","细动脉和毛细血管扩张、局部血流量增加（动脉性充血）"],"answer":4,"explain":"炎症时血管扩张、血流加速形成动脉性充血，是局部发红、发热的原因；水肿由血管通透性增高、血浆渗出所致，血流停滞与白细胞游出发生在其后。","id":"z10-b70c7e48","type":"A1"},{"unit":"U10","ch":10,"part":3,"tag":"血管通透性","stem":"急性炎症时血管通透性增高，其主要机制是","options":["细动脉短暂收缩","炎症介质刺激内皮细胞收缩，内皮细胞间隙增宽","血流停滞、血液黏稠度增加","白细胞边集与黏附","红细胞漏出到血管外"],"answer":1,"explain":"炎症介质刺激内皮细胞收缩、间隙增宽是血管通透性增高的主要机制；穿胞作用增强、内皮细胞损伤等亦可致之，其余各项属血流动力学改变或渗出结果。","id":"z10-108de25f","type":"A1"},{"unit":"U10","ch":10,"part":3,"tag":"白细胞渗出","stem":"白细胞游出血管后，以阿米巴运动方式沿化学物质浓度梯度向化学刺激物做定向移动，这一现象称为","options":["白细胞边集","白细胞滚动","白细胞黏附","白细胞游出","趋化作用"],"
