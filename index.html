<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MCG 选择题刷题</title>
<style>
:root{
  --card:#fff; --ink:#17212e; --sub:#69788a; --faint:#93a2b4;
  --line:#e5eaf2; --line2:#d7e0ec;
  --brand:#2563eb; --brand2:#5b53e8; --brand-soft:#eef3ff; --brand-line:#c9dbff;
  --ok:#0f9d68; --ok-soft:#e8f8f1; --ok-line:#a9e2c8;
  --bad:#da2f47; --bad-soft:#fdedef; --bad-line:#f6c3ca;
  --warm:#a26a15; --warm-soft:#fdf8ee; --warm-line:#ecdcbf;
  --sh:0 1px 2px rgba(15,30,55,.04), 0 12px 28px -18px rgba(15,30,55,.35);
  --sh-lg:0 2px 4px rgba(15,30,55,.05), 0 24px 48px -28px rgba(15,30,55,.42);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0}
body{
  background:
    radial-gradient(1100px 520px at 12% -8%, #ffffff 0%, rgba(255,255,255,0) 62%),
    radial-gradient(900px 480px at 108% 4%, #e7eeff 0%, rgba(231,238,255,0) 60%),
    linear-gradient(180deg,#f2f5fa 0%,#e9eef7 100%);
  color:var(--ink);
  font-family:"Segoe UI","Source Han Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.75; padding-bottom:96px;
  -webkit-font-smoothing:antialiased;
}
.topbar{position:sticky; top:0; z-index:30; background:#fff; border-bottom:1px solid var(--line);
  box-shadow:0 10px 28px -24px rgba(15,30,55,.7); padding:13px 18px 0}
.topbar h1{margin:0; font-size:16.5px; font-weight:700; letter-spacing:.2px; display:flex; align-items:center; gap:9px}
.topbar h1 .mcq{background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff; border-radius:7px;
  font-size:11px; padding:2px 8px; font-weight:700; letter-spacing:1.2px; box-shadow:0 4px 10px -4px rgba(37,99,235,.6)}
.h1sub{color:var(--faint); font-weight:500; font-size:13px}
.courses{display:flex; gap:7px; margin-top:9px; flex-wrap:wrap}
.cbtn{font-family:inherit; font-size:12.5px; font-weight:600; border-radius:999px; padding:5px 15px; cursor:pointer;
  border:1px solid var(--line2); background:#fff; color:#41536a; transition:.16s}
.cbtn:hover{border-color:var(--brand-line); color:var(--brand); background:var(--brand-soft)}
.cbtn.on{background:linear-gradient(135deg,var(--brand),var(--brand2)); border-color:transparent; color:#fff;
  box-shadow:0 6px 14px -9px rgba(37,99,235,.9)}
.metrics{display:flex; align-items:center; gap:8px; margin-top:10px; font-size:12.5px; color:var(--sub); flex-wrap:wrap}
.metrics>span{background:#f5f8fc; border:1px solid var(--line); border-radius:999px; padding:3px 11px;
  display:inline-flex; align-items:center; gap:5px}
.metrics b{color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums}
.tools{display:flex; gap:7px; margin-left:auto; flex-wrap:wrap}
.tbtn{background:#fff; color:#41536a; border:1px solid var(--line2); border-radius:999px; font-size:12.5px;
  padding:5px 13px; cursor:pointer; font-family:inherit; font-weight:600; transition:.16s}
.tbtn:hover{border-color:var(--brand-line); color:var(--brand); background:var(--brand-soft)}
.tbtn.on{background:linear-gradient(135deg,var(--brand),var(--brand2)); border-color:transparent; color:#fff;
  box-shadow:0 6px 14px -8px rgba(37,99,235,.85)}
.bar{height:4px; background:#eaeff6; border-radius:99px; overflow:hidden; margin-top:11px}
.bar>i{display:block; height:100%; width:0; border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--brand2)); transition:width .3s ease}
.wrap{max-width:860px; margin:0 auto; padding:18px}
.panel{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px;
  margin-bottom:16px; display:none; box-shadow:var(--sh)}
.panel.show{display:block; animation:fade .25s ease}
.panel h3{margin:0 0 11px; font-size:11.5px; color:var(--faint); letter-spacing:1.8px; font-weight:700}
.prow{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:11px; align-items:center}
.prow .lbl{font-size:12px; color:var(--faint); min-width:42px; font-weight:600; letter-spacing:.5px}
.chip{border:1px solid var(--line2); background:#fff; color:#43566d; border-radius:999px; font-size:12.5px;
  padding:5px 12px; cursor:pointer; font-family:inherit; white-space:nowrap; transition:.16s; font-weight:500}
.chip:hover{border-color:var(--brand-line); color:var(--brand); background:var(--brand-soft)}
.chip.on{background:linear-gradient(135deg,var(--brand),var(--brand2)); border-color:transparent; color:#fff;
  font-weight:600; box-shadow:0 6px 14px -9px rgba(37,99,235,.9)}
.chip.part{font-weight:600}
.chbox{margin:0 0 11px}
.chbox summary{cursor:pointer; font-size:12px; color:var(--faint); font-weight:600;
  letter-spacing:.4px; padding:5px 0; list-style:none}
.chbox summary::-webkit-details-marker{display:none}
.chbox summary:before{content:"▸ "; color:var(--brand); font-weight:700}
.chbox[open] summary:before{content:"▾ "}
.chbox .prow{margin:8px 0 0}
.card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px 24px;
  box-shadow:var(--sh-lg); animation:fade .3s ease}
@keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
.qhead{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; font-size:12px; color:var(--faint)}
.tag{background:var(--brand-soft); color:var(--brand); border-radius:7px; padding:2px 9px; font-size:11.5px; font-weight:700}
.tag.ch{background:#f2f5f9; color:#54677d}
.tag.xt{background:#fdf3e6; color:#9a5b06}
.stem{font-size:19px; font-weight:700; line-height:1.85; margin:0 0 18px; letter-spacing:.1px}
.opts{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
.opt{display:flex; gap:13px; align-items:flex-start; border:1.5px solid var(--line2); background:#fff;
  border-radius:13px; padding:13px 16px; cursor:pointer; transition:.16s ease}
.opt:hover{border-color:var(--brand-line); background:#fafcff; transform:translateY(-1px);
  box-shadow:0 10px 20px -16px rgba(37,99,235,.7)}
.opt .k{flex:0 0 26px; height:26px; border-radius:9px; background:#f1f4f9; color:#5b6d82; font-size:13px;
  font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px; transition:.16s}
.opt .v{flex:1; font-size:15.5px; line-height:1.8}
.opt.sel{border-color:var(--brand); background:var(--brand-soft)}
.opt.sel .k{background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff}
.opt.right{border-color:var(--ok-line); background:var(--ok-soft)}
.opt.right .k{background:var(--ok); color:#fff}
.opt.wrong{border-color:var(--bad-line); background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad); color:#fff}
.opt.locked{cursor:default}
.opt.locked:hover{transform:none; box-shadow:none; background:inherit}
.exp{border-left:4px solid var(--brand); background:#f7faff; border-radius:0 13px 13px 0; padding:13px 16px;
  margin-top:14px; font-size:14.5px; line-height:1.9}
.exp .who{font-weight:700; color:var(--brand); font-size:12.5px; letter-spacing:.6px; display:inline-block; margin-bottom:3px}
.exp.bad{border-left-color:var(--bad); background:var(--bad-soft)}
.exp.bad .who{color:var(--bad)}
.exp.good{border-left-color:var(--ok); background:var(--ok-soft)}
.exp.good .who{color:var(--ok)}
.vig{border:1px solid var(--warm-line); background:linear-gradient(180deg,#fffdf8,#fdf9f0); border-radius:14px;
  padding:15px 18px; margin-bottom:16px; position:relative; overflow:hidden}
.vig:before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
  background:linear-gradient(180deg,#e2a54a,#c98a2c)}
.vigh{font-size:12px; font-weight:700; color:var(--warm); letter-spacing:.4px; margin-bottom:7px;
  display:flex; align-items:center; gap:6px}
.vigh span{margin-left:auto; font-weight:500; color:#b09a7c; font-size:11.5px}
.vigt{font-size:14.5px; line-height:2; color:#463c2c; text-indent:2em}
.xbar{display:flex; align-items:center; gap:13px; margin-top:14px; flex-wrap:wrap}
.kbd{display:inline-block; background:#f1f4f9; border:1px solid var(--line2); border-bottom-width:2px;
  border-radius:6px; padding:0 6px; font-size:11.5px; color:#54677d; font-family:ui-monospace,Consolas,monospace}
.foot{position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line);
  box-shadow:0 -12px 32px -26px rgba(15,30,55,.8); padding:11px 16px; display:flex; gap:10px;
  align-items:center; justify-content:center; z-index:20}
.btn{background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff; border:none; border-radius:11px;
  padding:11px 22px; font-size:15px; font-family:inherit; cursor:pointer; font-weight:600;
  box-shadow:0 10px 20px -12px rgba(37,99,235,.9); transition:.16s}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:#fff; color:#41536a; border:1px solid var(--line2); box-shadow:none}
.btn.ghost:hover{border-color:var(--brand-line); color:var(--brand)}
.btn:disabled{opacity:.42; cursor:default; box-shadow:none}
.btn.sm{padding:8px 15px; font-size:13.5px; border-radius:10px}
.empty{text-align:center; color:var(--sub); padding:52px 12px; font-size:15px}
.summary{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:24px; box-shadow:var(--sh-lg)}
.summary .big{font-size:40px; font-weight:800; line-height:1.15;
  background:linear-gradient(135deg,var(--brand),var(--brand2)); -webkit-background-clip:text;
  background-clip:text; color:transparent}
.wronglist{margin-top:16px; border-top:1px dashed var(--line2); padding-top:14px}
.wronglist .item{padding:10px 0; border-bottom:1px dashed #eef2f7; font-size:14.5px}
.wronglist .item .m{color:var(--faint); font-size:12.5px}
@media(max-width:600px){
  .wrap{padding:12px}
  .card{padding:16px 15px; border-radius:15px}
  .stem{font-size:17px}
  .opt{padding:12px 13px} .opt .v{font-size:15px}
  .metrics{font-size:12px; gap:6px}
  .topbar{padding:11px 14px 0} .topbar h1{font-size:15px} .h1sub{display:none}
  .vig{padding:13px 14px} .vigt{font-size:14px} .summary .big{font-size:34px}
}
@media(prefers-color-scheme:dark){
  :root{
    --card:#151e2a; --ink:#e8eef7; --sub:#9aabbf; --faint:#7d8fa3;
    --line:#233043; --line2:#2b3a4f;
    --brand:#5b8dff; --brand2:#8b7bff; --brand-soft:#1b2942; --brand-line:#39527d;
    --ok:#3ecf9a; --ok-soft:#132b25; --ok-line:#2c5c4b;
    --bad:#ff7b8c; --bad-soft:#31191f; --bad-line:#6b3340;
    --warm:#e0b070; --warm-soft:#241d13; --warm-line:#4a3b23;
    --sh:0 1px 2px rgba(0,0,0,.3), 0 14px 30px -20px rgba(0,0,0,.8);
    --sh-lg:0 2px 6px rgba(0,0,0,.35), 0 26px 50px -30px rgba(0,0,0,.9);
  }
  body{background:radial-gradient(1000px 480px at 10% -10%, #16202e 0%, rgba(22,32,46,0) 60%),
    linear-gradient(180deg,#101822 0%,#0d141d 100%)}
  .topbar,.foot{background:#121a25}
  .opt{background:#131b27}
  .opt:hover{background:#16202f}
  .exp{background:#141d2b}
  .vig{background:linear-gradient(180deg,#1c1a13,#191710)}
  .vigt{color:#e6d9c0}
  .chip,.tbtn{background:#151e2a; color:#c3d0e0}
  .chip.on,.tbtn.on{color:#fff}
  .metrics>span{background:#151e2a}
  .kbd{background:#1a2432}
  .btn.ghost{background:#151e2a; color:#c3d0e0}
  .summary .big{background:linear-gradient(135deg,#5b8dff,#8b7bff);
    -webkit-background-clip:text; background-clip:text; color:transparent}
}
@media print{.topbar,.foot,.panel,.tools{display:none} body{padding:0; background:#fff}}
</style>
</head>
<body>
<div class="topbar">
  <h1><span class="mcq" id="courseBadge">刷</span>医学题库<span class="h1sub">多课程合集 · 可切换</span></h1>
  <div class="courses" id="courseRow"></div>
  <div class="metrics">
    <span>进度 <b id="mDone">0</b>/<b id="mTotal">0</b></span>
    <span>正确率 <b id="mAcc">—</b></span>
    <span>连对 <b id="mStreak">0</b></span>
    <span id="mScope" style="color:#7f96ad"></span>
    <div class="tools">
      <button class="tbtn" id="btnScope">范围</button>
      <button class="tbtn" id="btnWrong">只刷错题</button>
      <button class="tbtn" id="btnReset">重置</button>
    </div>
  </div>
  <div class="bar"><i id="bar"></i></div>
</div>
<div class="wrap">
  <div class="panel" id="panel">
    <h3>选择范围</h3>
    <div class="prow" id="partRow"><span class="lbl" id="partLbl">篇</span></div>
    <details class="chbox">
      <summary id="chSummary">按章筛选（可多选，不选=全部）</summary>
      <div class="prow" id="chRow"></div>
    </details>
    <div class="prow">
      <span class="lbl">顺序</span>
      <button class="chip on" data-order="seq">按章节顺序</button>
      <button class="chip" data-order="rand">随机打乱</button>
    </div>
    <div class="prow">
      <span class="lbl">范围</span>
      <button class="chip on" data-filter="all">全部题</button>
      <button class="chip" data-filter="undone">只刷没做过的</button>
      <button class="chip" data-filter="wrong">只刷错题</button>
    </div>
    <div class="prow">
      <span class="lbl">题型</span>
      <button class="chip on" data-qt="all">全部</button>
      <button class="chip" data-qt="case">综合情景组</button>
      <button class="chip" data-qt="plain">传统题</button>
    </div>
    <div class="prow" style="margin-bottom:0">
      <button class="btn sm" id="btnApply">应用并开始</button>
      <button class="btn ghost sm" id="btnAllCh">全选章节</button>
      <button class="btn ghost sm" id="btnNoneCh">清空章节</button>
    </div>
  </div>
  <div id="stage"></div>
</div>
<div class="foot">
  <button class="btn ghost" id="btnPrev">上一题</button>
  <button class="btn" id="btnNext">下一题</button>
  <button class="btn ghost" id="btnBack">回首页</button>
</div>
<script>
const COURSES = {"mcg":{"short":"MCG","name":"医学分子细胞遗传基础","lskey":"quiz-mcg-v1","partUnit":"篇","chUnit":"章","parts":[{"no":1,"name":"生物大分子的结构与功能"},{"no":2,"name":"细胞的结构与功能"},{"no":3,"name":"物质代谢与调节"},{"no":4,"name":"遗传信息与传递"},{"no":5,"name":"细胞的社会性与细胞命运"}],"chTitles":{"1":"蛋白质的结构与功能","2":"核酸的结构与功能","3":"酶与酶促反应","4":"细胞膜的结构与功能","5":"细胞表面与细胞微环境","6":"细胞质","7":"细胞的内膜系统","8":"囊泡运输","9":"细胞骨架","10":"细胞核","11":"糖代谢","12":"脂质代谢","13":"生物氧化","14":"氨基酸代谢","15":"核苷酸代谢","16":"代谢的整合与调节","17":"人类基因组和染色体","18":"DNA的合成","19":"DNA损伤与修复","20":"RNA的合成","21":"蛋白质的合成","22":"基因表达调控","23":"细胞外基质","24":"细胞黏附、细胞连接与细胞极性","25":"细胞信号转导","26":"细胞增殖与调控","27":"细胞分化","28":"干细胞与医学","29":"细胞死亡"},"qb":[{"id":"gc0-01-2","ch":1,"part":1,"tag":"机制","stem":"Z 型突变使血浆 α1-AT 只剩 10%–15%，直接原因是","options":["突变蛋白的氨基酸序列正常，只是翻译后修饰缺失","突变蛋白折叠错误并在内质网中聚合，无法分泌","突变蛋白被正常分泌，但在血浆里被迅速降解清除","突变基因的转录效率显著下降，mRNA 水平随之降低","突变使蛋白分子量明显变小，被肾小球滤过而排出"],"answer":1,"explain":"B 对：一级结构改变（谷氨酸→赖氨酸）→ 折叠异常 → 滞留于内质网并聚合成包涵体 → 无法分泌，是构象病的典型链条。B 与情景中无法分泌矛盾；C 说转录下降，但情景强调仍能合成；D 与第 342 位氨基酸被替换矛盾；E 错在单个氨基酸替换几乎不改变分子量。","type":"A1","group":"c0-01","kind":"mechanism","chs":[1,3,7],"vignette":"血浆中有一种叫 α1-抗胰蛋白酶（α1-AT）的蛋白，由肝细胞合成后分泌入血，专门看住中性粒细胞释放的弹性蛋白酶——两者构成一对平衡：蛋白酶负责清理受损组织，抗蛋白酶负责不让它把肺组织一并拆掉。α1-AT 属 serpin 家族，它的反应中心环像一个诱饵：被弹性蛋白酶识别切割后，二者形成不可逆的共价复合物，酶被永久锁死。部分人的 SERPINA1 基因带 Z 型突变（第 342 位谷氨酸变为赖氨酸），突变蛋白仍能合成，却在肝细胞内质网中折叠错误、彼此聚合而无法分泌，血浆 α1-AT 因此只剩正常的 10%–15%。这类人常在三四十岁出现肺气肿，一部分还会发生肝硬化。","vignette_title":"情景 1：当「看门人」自己出不了门","gidx":2,"gn":4,"anchor":"在肝细胞内质网中折叠错误、彼此聚合而无法分泌"},{"id":"gc0-03-1","ch":1,"part":1,"tag":"机制","stem":"该酶活性几乎完全丧失，其结构基础最可能是","options":["辅基丢失，但蛋白质部分的构象保持不变","肽键被水解，一级结构断裂成若干小片段","氨基酸序列发生改变，产生了错义突变蛋白","亚基之间二硫键全部断裂，四级结构解离","空间构象被破坏，而肽键与一级结构仍然完好"],"answer":4,"explain":"E 对：常温放置变性主要破坏次级键（疏水作用、氢键、离子键），空间构象瓦解而肽键未断，絮状物正是变性聚集的结果。B 需要蛋白酶或强酸水解才会发生；C 与放置过夜无关；D 二硫键断裂需还原剂，且本例无亚基解离证据；E 与絮状沉淀、活性近乎全失都不符。","type":"A1","group":"c0-03","kind":"experiment","chs":[1,3],"vignette":"周五晚 10 点，研究生小周终于把酶纯化完。他把装着酶溶液的离心管往实验台上一搁，心想明天再测活，就锁门走了——忘了放进 4℃ 冰箱。周六早 9 点，他回到实验室测活性：只剩 8%。他盯着那管原本澄清的溶液，发现里面浮着一点絮状物。这时他想起导师说过的一句话：这种酶活性中心附近有个关键半胱氨酸。","vignette_title":"情景 3：一夜之后只剩 8% 的活性","gidx":1,"gn":4,"anchor":"里面浮着一点絮状物"},{"id":"gc0-03-4","ch":1,"part":1,"tag":"方案","stem":"关于实验现象与后续处理，下列判断正确的是（X 型多选）","options":["若 SDS-PAGE 条带位置不变，则支持变性失活而非降解","只要加入 β-巯基乙醇，该酶的活性就一定完全恢复","测残余活性前宜先离心去除絮状物，避免浊度干扰比色","溶液出现絮状物，提示蛋白发生变性聚集或沉淀","低温可降低分子热运动，从而减慢变性发生的速率"],"answer":[0,2,3,4],"explain":"答案 ACDE。A、C、D、E 分别对应急聚现象、低温保存原理、实验操作规范、分子量判据（与上一题呼应）。B 错：变性常不可逆，还原剂只能挽回涉及二硫键错误氧化的那一部分，一定完全恢复不成立。","type":"X","group":"c0-03","kind":"experiment","chs":[1,3],"vignette":"周五晚 10 点，研究生小周终于把酶纯化完。他把装着酶溶液的离心管往实验台上一搁，心想明天再测活，就锁门走了——忘了放进 4℃ 冰箱。周六早 9 点，他回到实验室测活性：只剩 8%。他盯着那管原本澄清的溶液，发现里面浮着一点絮状物。这时他想起导师说过的一句话：这种酶活性中心附近有个关键半胱氨酸。","vignette_title":"情景 3：一夜之后只剩 8% 的活性","gidx":4,"gn":4,"anchor":"忘了放进 4℃ 冰箱"},{"id":"gc1-01-3","ch":1,"part":1,"tag":"机制","stem":"X 与底物都带羧基且落在同一个口袋，这一事实说明蛋白质与配体的结合","options":["这种结合由静电引力决定，与结合部位的形状无关","这种结合不可逆，配体一旦结合就不再解离","这种结合没有特异性，分子带电就能与酶的表面结合","这种结合靠共价键维持，与次级键的作用无关","这种结合具有特异性，取决于结合部位的空间结构"],"answer":4,"explain":"E 对：配体能否结合取决于结合部位的空间结构是否互补，X 与底物结构相似、带同类基团，才能落在同一个口袋，这正是结合特异性的表现。B 若无特异性，任何带电小分子都能抑制该酶，与实验观察不符；C 竞争性抑制属于可逆抑制，配体会解离；D 静电引力只是次级键的一种，形状互补才是决定性的；E 这种结合靠氢键、离子键、疏水作用等次级键维持，并非共价键。","type":"A1","group":"c1-01","kind":"mechanism","chs":[3,1],"vignette":"某实验室用一种从肝组织纯化的脱氢酶筛选新合成的候选药物 X。在 pH 7.4、25℃ 条件下测定反应初速度：不加 X 时米氏常数 Km 为 0.50 mmol/L，最大反应速度 Vmax 为 100 U/mg；加入 2.0 mmol/L 的 X 后，Km 升到 2.0 mmol/L，而 Vmax 仍为 100 U/mg。比较结构发现，X 与底物都带有一个羧基，二者能占据酶分子表面同一个结合底物的口袋。同一批酶液在 60℃ 水浴中放置 10 分钟后活性完全丧失，冷却到 25℃ 再测仍不回升，但用抗体检出蛋白还在，肽键含量也没有减少。","vignette_title":"情景 1：Km 涨了四倍，Vmax 却纹丝不动","gidx":3,"gn":5,"anchor":"X 与底物都带有一个羧基"},{"id":"gc1-02-1","ch":1,"part":1,"tag":"机制","stem":"肌红蛋白的双曲线与血红蛋白的 S 形曲线不同，结构基础是","options":["血红蛋白有4个亚基，亚基之间存在协同效应","肌红蛋白的血红素含三价铁，结合氧后不释放","肌红蛋白分子更大，与氧的结合更牢固","血红蛋白没有四级结构，氧的结合位点更多","血红蛋白的每个亚基能结合2个氧分子"],"answer":0,"explain":"A 对：血红蛋白是四聚体，第 1 个氧结合后诱导盐桥断裂与亚基相对转动，其余亚基的亲和力随之升高，故曲线呈 S 形；肌红蛋白是单链，只有一个结合位点，只能给出双曲线。B 分子量大小与曲线形状无关，而且肌红蛋白反而更小；C 每个亚基含 1 个血红素、结合 1 个氧分子；D 功能状态的血红素铁为二价，三价铁不能结合氧；E 血红蛋白有四级结构，S 形曲线正来自亚基间的相互作用。","type":"A1","group":"c1-02","kind":"mechanism","chs":[1,3],"vignette":"血红蛋白由 2 条 α 链和 2 条 β 链组成，每条链含 1 个血红素；肌红蛋白只有 1 条链和 1 个血红素。把两者的氧饱和度对氧分压作图，肌红蛋白得到一条双曲线，血红蛋白得到 S 形曲线。血红蛋白的 4 个亚基之间靠盐桥等非共价键维持一种对氧亲和力低的紧张态，第 1 个氧分子结合后这些盐桥逐次断裂，亚基之间发生相对转动，其余亚基对氧的亲和力随之升高。红细胞内的 2,3-二磷酸甘油酸结合在两条 β 链之间的中央孔，使紧张态更稳定；剧烈运动时肌肉局部 pH 由 7.4 降到 7.2，血红蛋白的曲线相应右移。这种把调节部位与结合部位分开的调节方式，在代谢途径的关键酶上同样存在。","vignette_title":"情景 2：一条 S 形曲线的来历","gidx":1,"gn":5,"anchor":"肌红蛋白得到一条双曲线"},{"id":"gc1-02-2","ch":1,"part":1,"tag":"判读","stem":"红细胞内 2,3-二磷酸甘油酸增多使曲线右移，其生理意义是","options":["血红蛋白对氧的亲和力升高，有利于在肺内结合氧","血红蛋白对氧的亲和力下降，不利于向组织释放氧","血红蛋白对氧的亲和力下降，有利于向组织释放氧","血红蛋白对氧的亲和力不变，结合氧的容量增加","肌红蛋白对氧的亲和力下降，肌肉获得氧更少"],"answer":2,"explain":"C 对：2,3-二磷酸甘油酸结合在两条 β 链之间的中央孔，稳定低亲和力的紧张态，曲线右移意味着同一氧分压下饱和度更低，氧更容易在组织处释放。B 方向相反，亲和力升高会使曲线左移；C 该物质改变的是亲和力，不是最大结合容量；D 前半句对，后半句把生理后果说反了；E 肌红蛋白是单链蛋白，不受这种结合调节。","type":"A1","group":"c1-02","kind":"mechanism","chs":[1,3],"vignette":"血红蛋白由 2 条 α 链和 2 条 β 链组成，每条链含 1 个血红素；肌红蛋白只有 1 条链和 1 个血红素。把两者的氧饱和度对氧分压作图，肌红蛋白得到一条双曲线，血红蛋白得到 S 形曲线。血红蛋白的 4 个亚基之间靠盐桥等非共价键维持一种对氧亲和力低的紧张态，第 1 个氧分子结合后这些盐桥逐次断裂，亚基之间发生相对转动，其余亚基对氧的亲和力随之升高。红细胞内的 2,3-二磷酸甘油酸结合在两条 β 链之间的中央孔，使紧张态更稳定；剧烈运动时肌肉局部 pH 由 7.4 降到 7.2，血红蛋白的曲线相应右移。这种把调节部位与结合部位分开的调节方式，在代谢途径的关键酶上同样存在。","vignette_title":"情景 2：一条 S 形曲线的来历","gidx":2,"gn":5,"anchor":"结合在两条 β 链之间的中央孔"},{"id":"gc1-02-3","ch":1,"part":1,"tag":"机制","stem":"剧烈运动时 pH 由 7.4 降到 7.2 使曲线右移，其原因是","options":["氢离子使血红素中的二价铁氧化为三价铁而失活","氢离子使血红蛋白解离成游离的单个亚基","氢离子占据血红素铁的位点，与氧直接竞争结合","氢离子使血红蛋白在肺内结合氧的能力提高","氢离子与血红蛋白结合后稳定紧张态，氧更易解离"],"answer":4,"explain":"E 对：氢离子与血红蛋白的某些基团结合，促进盐桥形成、稳定紧张态，使氧亲和力下降，这就是波尔效应，其意义是在产酸多的组织中多释放氧。B 血红素的配位位点由氧占据，氢离子并不与之竞争；C 三价铁的血红蛋白不能结合氧，那不是生理性调节；D 四聚体在生理条件下并不解离；E 与曲线右移的方向相反。","type":"A1","group":"c1-02","kind":"mechanism","chs":[1,3],"vignette":"血红蛋白由 2 条 α 链和 2 条 β 链组成，每条链含 1 个血红素；肌红蛋白只有 1 条链和 1 个血红素。把两者的氧饱和度对氧分压作图，肌红蛋白得到一条双曲线，血红蛋白得到 S 形曲线。血红蛋白的 4 个亚基之间靠盐桥等非共价键维持一种对氧亲和力低的紧张态，第 1 个氧分子结合后这些盐桥逐次断裂，亚基之间发生相对转动，其余亚基对氧的亲和力随之升高。红细胞内的 2,3-二磷酸甘油酸结合在两条 β 链之间的中央孔，使紧张态更稳定；剧烈运动时肌肉局部 pH 由 7.4 降到 7.2，血红蛋白的曲线相应右移。这种把调节部位与结合部位分开的调节方式，在代谢途径的关键酶上同样存在。","vignette_title":"情景 2：一条 S 形曲线的来历","gidx":3,"gn":5,"anchor":"肌肉局部 pH 由 7.4 降到 7.2"},{"id":"gc1-04-1","ch":1,"part":1,"tag":"判读","stem":"结合电泳与凝胶过滤的结果，该 40 kDa 组分在天然状态下最可能是","options":["由4个相同的40 kDa亚基组成的四聚体","由2个相同的40 kDa亚基组成的二聚体","由3个相同的40 kDa亚基组成的三聚体","由5个相同的40 kDa亚基组成的五聚体","由40 kDa与60 kDa亚基各2个组成的四聚体"],"answer":0,"explain":"A 对：凝胶过滤给出的是天然状态下的分子量 160 kDa，而 SDS 电泳把亚基拆开后只有 40 kDa 一条带，160 除以 40 正好为 4，说明该酶由 4 个相同亚基组成。B、C、D 的倍数分别对应 80、120、200 kDa，与 160 kDa 不符；E 的组合为 200 kDa，而且该组分中并不含 60 kDa 条带，与电泳结果矛盾。","type":"A1","group":"c1-04","kind":"experiment","chs":[1,3,7],"vignette":"小陈要纯化一种由培养细胞分泌到培养液中的酶。他先把培养液浓缩，做硫酸铵分级沉淀，再上凝胶过滤柱，收集活性最高的洗脱峰；该峰在 SDS-聚丙烯酰胺凝胶电泳上出现 2 条带，分子量为 40 kDa 和 60 kDa；用 β-巯基乙醇还原后，2 条带的位置都不变。他接着用离子交换层析，把含 40 kDa 条带的组分单独收集并测活：该组分的比活力为 250 U/mg，而最初粗提液的比活力为 25 U/mg。让他不解的是，这个组分的凝胶过滤洗脱体积对应的分子量是 160 kDa，与电泳结果对不上。","vignette_title":"情景 4：160 kDa 与 40 kDa 对不上","gidx":1,"gn":5,"anchor":"对应的分子量是 160 kDa"},{"id":"gc1-04-2","ch":1,"part":1,"tag":"判读","stem":"加入 β-巯基乙醇还原后两条带的位置都不变，说明","options":["该酶在纯化过程中已经变性失活","该酶的两条肽链在电泳中发生了聚合","该酶的两条肽链之间不靠二硫键相互连接","该酶分子中不含半胱氨酸残基，无法形成二硫键","该酶的两条肽链之间靠二硫键相互连接"],"answer":2,"explain":"C 对：若亚基之间靠二硫键相连，还原剂会把二硫键打开，非还原条件下的大分子条带应消失或下移到单体位置；条带位置完全不变说明这些肽链之间没有链间二硫键。B 与实验结果相反；C 变性会使条带位置或回收率改变，而这里位置不变；D 没有链间二硫键不等于分子中没有半胱氨酸，链内二硫键仍可能存在；E 聚合应表现为条带上移，而非位置不变。","type":"A1","group":"c1-04","kind":"experiment","chs":[1,3,7],"vignette":"小陈要纯化一种由培养细胞分泌到培养液中的酶。他先把培养液浓缩，做硫酸铵分级沉淀，再上凝胶过滤柱，收集活性最高的洗脱峰；该峰在 SDS-聚丙烯酰胺凝胶电泳上出现 2 条带，分子量为 40 kDa 和 60 kDa；用 β-巯基乙醇还原后，2 条带的位置都不变。他接着用离子交换层析，把含 40 kDa 条带的组分单独收集并测活：该组分的比活力为 250 U/mg，而最初粗提液的比活力为 25 U/mg。让他不解的是，这个组分的凝胶过滤洗脱体积对应的分子量是 160 kDa，与电泳结果对不上。","vignette_title":"情景 4：160 kDa 与 40 kDa 对不上","gidx":2,"gn":5,"anchor":"2 条带的位置都不变"},{"id":"gc1-04-4","ch":1,"part":1,"tag":"方案","stem":"要确证该组分在天然状态下是四聚体，最合理的做法是","options":["把样品加热到100℃后重新测定凝胶过滤的分子量","在非变性条件下做电泳或交联后电泳，检测大分子条带","测定该组分在 280 nm 的吸光度并推算蛋白浓度","把该组分与 60 kDa 组分等量混合后重复 SDS 电泳","用更强的还原剂处理后再次进行 SDS 电泳"],"answer":1,"explain":"B 对：非变性电泳不加 SDS、不加热，亚基间的非共价结合得以保留，若出现对应 160 kDa 的条带，即可证实天然状态下为四聚体；化学交联后再电泳也是同一思路。B 加热会使蛋白变性并破坏亚基间的结合，测得的只是变性聚集体的分子量；C 更强的还原剂只能再确认有无二硫键，与亚基聚合无关；D 280 nm 吸光度只能估算蛋白浓度，给不出分子量；E 60 kDa 组分是杂蛋白，混合后仍无法说明亚基组成。","type":"A1","group":"c1-04","kind":"experiment","chs":[1,3,7],"vignette":"小陈要纯化一种由培养细胞分泌到培养液中的酶。他先把培养液浓缩，做硫酸铵分级沉淀，再上凝胶过滤柱，收集活性最高的洗脱峰；该峰在 SDS-聚丙烯酰胺凝胶电泳上出现 2 条带，分子量为 40 kDa 和 60 kDa；用 β-巯基乙醇还原后，2 条带的位置都不变。他接着用离子交换层析，把含 40 kDa 条带的组分单独收集并测活：该组分的比活力为 250 U/mg，而最初粗提液的比活力为 25 U/mg。让他不解的是，这个组分的凝胶过滤洗脱体积对应的分子量是 160 kDa，与电泳结果对不上。","vignette_title":"情景 4：160 kDa 与 40 kDa 对不上","gidx":4,"gn":5,"anchor":"与电泳结果对不上"},{"id":"gc12-01-1","ch":1,"part":1,"tag":"机制","stem":"磷酸化使该蛋白的等电点由 6.8 移到 5.9，直接原因是","options":["磷酸基团带正电荷，使分子所带的正电荷增多","磷酸基团带负电荷，使分子所带的负电荷增多","磷酸基团与碱性残基结合，使分子带正电荷","磷酸基团使肽键断裂，暴露出更多酸性残基","磷酸基团使分子变大，等电点随之发生改变"],"answer":1,"explain":"B 对：磷酸基团带负电荷，每加上一个就使分子的净负电荷增多、等电点向酸性方向移动，斑点才由 6.8 依次移到 6.5、6.2 与 5.9。A 错在磷酸基团带的是负电荷而不是正电荷，方向写反。C 错在磷酸基团并没有被碱性残基中和掉。D 错在磷酸化不水解肽键，三个斑点仍落在同一条分子量水平线上。E 错在等电点改变来自电荷变化，而不是分子量变大。","type":"A1","group":"c12-01","kind":"mechanism","chs":[1,21,7],"vignette":"细胞因子刺激 15 分钟后，研究者提取一种分子量为 45 kDa 的调节蛋白做双向电泳：第一向按等电点分离，第二向按分子量分离。未刺激的细胞只在等电点 6.8 处出现一个斑点；刺激后出现的三个斑点落在同一条分子量水平线上，等电点依次为 6.5、6.2 与 5.9。把刺激后的样品先经蛋白磷酸酶处理，这三个斑点又并回 6.8 处的那一个斑点。质谱分析显示，刺激后该蛋白的一个胰蛋白酶肽段由 1452 Da 变为 1532 Da。同一细胞分泌的另一种蛋白按氨基酸序列推算为 22 kDa，在 SDS-聚丙烯酰胺凝胶电泳上却在 32 kDa 处显带，用切除 N-连接糖链的糖苷酶处理后该条带回到 22 kDa，这条糖链的加工需要两种细胞器先后参与。","vignette_title":"情景 1：一个斑点变成三个斑点","gidx":1,"gn":5,"anchor":"未刺激的细胞只在等电点 6.8 处"},{"id":"gc12-01-3","ch":1,"part":1,"tag":"判读","stem":"刺激后出现的三个斑点分子量相同、等电点依次降低，说明","options":["细胞合成了三种不同的蛋白，它们的分子量相同","该蛋白被切成三段，每一段的等电点各不相同","三条肽链的氨基酸序列不同，但修饰程度相同","同一条肽链被逐步磷酸化，形成不同电荷形式","该蛋白与三种不同的配体结合，形成三种复合物"],"answer":3,"explain":"D 对：三个斑点的分子量相同而等电点依次降低，说明同一条肽链上被加上了数目不等的磷酸基团，磷酸基团越多分子越酸。A 错在细胞并没有合成新的蛋白，斑点只是同一蛋白的不同修饰形式。B 错在斑点分子量相同，肽链并没有被切成片段。C 错在三条肽链的氨基酸序列相同，差别在修饰程度而不在序列。E 错在与配体结合通常不会使等电点呈逐级降低的规律。","type":"A1","group":"c12-01","kind":"mechanism","chs":[1,21,7],"vignette":"细胞因子刺激 15 分钟后，研究者提取一种分子量为 45 kDa 的调节蛋白做双向电泳：第一向按等电点分离，第二向按分子量分离。未刺激的细胞只在等电点 6.8 处出现一个斑点；刺激后出现的三个斑点落在同一条分子量水平线上，等电点依次为 6.5、6.2 与 5.9。把刺激后的样品先经蛋白磷酸酶处理，这三个斑点又并回 6.8 处的那一个斑点。质谱分析显示，刺激后该蛋白的一个胰蛋白酶肽段由 1452 Da 变为 1532 Da。同一细胞分泌的另一种蛋白按氨基酸序列推算为 22 kDa，在 SDS-聚丙烯酰胺凝胶电泳上却在 32 kDa 处显带，用切除 N-连接糖链的糖苷酶处理后该条带回到 22 kDa，这条糖链的加工需要两种细胞器先后参与。","vignette_title":"情景 1：一个斑点变成三个斑点","gidx":3,"gn":5,"anchor":"落在同一条分子量水平线上"},{"id":"gc12-04-3","ch":1,"part":1,"tag":"判读","stem":"突变体丙的各项动力学参数正常，却以单体形式存在，最合理的解释是它","options":["在细胞内被迅速降解，剩余的蛋白仍保持正常活性","无法形成有活性的二聚体，缺陷在蛋白之间的结合","底物特异性发生改变，细胞内出现了别的底物","在细胞内被修饰而失活，体外纯化后修饰被去除","需要另一种蛋白激活，而该激活蛋白在细胞内不足"],"answer":1,"explain":"B 对：突变体丙的各项动力学参数与解离常数都正常，说明活性中心本身完好；凝胶过滤显示它以单体形式存在，而该酶需要形成二聚体才有活性，缺陷因此落在蛋白与蛋白之间的结合上。A 错在凝胶过滤检出的是完整的单体，蛋白并未被大量降解。C 错在底物特异性改变不会使分子以单体形式存在。D 错在体外纯化的样品参数正常，说明并非修饰状态造成的差异。E 错在细胞内活性偏低已由单体状态给出直接解释，与是否缺少激活蛋白无关。","type":"A1","group":"c12-04","kind":"experiment","chs":[1,3],"vignette":"研究生小许要判断三个定点突变分别破坏了底物结合还是催化步骤。他把野生型酶与三个突变体分别纯化，在同一缓冲液中测定：野生型的转换数为 50 次每秒，Km 为 20 μmol/L，用超滤法测得的底物解离常数为 15 μmol/L；突变体甲把活性中心的赖氨酸换成了丙氨酸，转换数为 48 次每秒，Km 升到 800 μmol/L，解离常数升到 700 μmol/L；突变体乙把组氨酸换成了丙氨酸，Km 为 25 μmol/L，解离常数为 18 μmol/L，转换数却降到 0.5 次每秒；突变体丙的突变位于远离活性中心的二聚化界面上，Km、转换数与解离常数都与野生型相当，但它在细胞内的活性只有野生型的 10%，凝胶过滤显示它以单体形式存在。三个突变体的表达量与野生型没有明显差别。","vignette_title":"情景 4：三个突变体，两种缺陷","gidx":3,"gn":6,"anchor":"凝胶过滤显示它以单体形式存在"},{"id":"gc12-04-4","ch":1,"part":1,"tag":"方案","stem":"若只用 SDS-聚丙烯酰胺凝胶电泳，无法判断突变体丙能否形成二聚体，原因是","options":["电泳时的电场强度不足，二聚体与单体的条带重叠在一起","SDS 会把肽键水解，二聚体被切成两条相同的短肽链","加热使亚基之间形成新的共价交联，两者再也无法分开","电泳缓冲液的 pH 使二聚体解离为两条不同的肽链","SDS 与加热破坏亚基间的非共价结合，只显示单条肽链"],"answer":4,"explain":"E 对：SDS 与加热会破坏亚基之间的非共价结合，并消除电荷与形状差异，条带只反映单条肽链的分子量，因而看不出该酶在天然状态下是否成对。A 错在电场强度不足只使区带变宽或变慢，不会把二聚体变成单体。B 错在 SDS 不会水解肽键，肽链不会被切成两半。C 错在加热并不会让亚基之间形成共价交联。D 错在真正使亚基解离的是 SDS 与加热，而不是缓冲液的 pH。","type":"A1","group":"c12-04","kind":"experiment","chs":[1,3],"vignette":"研究生小许要判断三个定点突变分别破坏了底物结合还是催化步骤。他把野生型酶与三个突变体分别纯化，在同一缓冲液中测定：野生型的转换数为 50 次每秒，Km 为 20 μmol/L，用超滤法测得的底物解离常数为 15 μmol/L；突变体甲把活性中心的赖氨酸换成了丙氨酸，转换数为 48 次每秒，Km 升到 800 μmol/L，解离常数升到 700 μmol/L；突变体乙把组氨酸换成了丙氨酸，Km 为 25 μmol/L，解离常数为 18 μmol/L，转换数却降到 0.5 次每秒；突变体丙的突变位于远离活性中心的二聚化界面上，Km、转换数与解离常数都与野生型相当，但它在细胞内的活性只有野生型的 10%，凝胶过滤显示它以单体形式存在。三个突变体的表达量与野生型没有明显差别。","vignette_title":"情景 4：三个突变体，两种缺陷","gidx":4,"gn":6,"anchor":"突变位于远离活性中心的二聚化界面上"},{"id":"gc16-01-2","ch":1,"part":1,"tag":"机制","stem":"抗坏血酸缺乏使前胶原的三股螺旋难以稳定，其结构基础是","options":["甘氨酸残基不再位于螺旋轴心，三条肽链无法相互靠拢","羟脯氨酸残基减少，链间氢键不足，螺旋稳定性下降","肽键被水解，前α链断裂成许多小分子肽段","链间二硫键无法形成，三条肽链失去共价连接","天冬酰胺残基不能加上糖链，肽链无法完成折叠"],"answer":1,"explain":"B 对：三股螺旋主要依靠链间氢键维持，羟脯氨酸残基减少使氢键不足，螺旋在体温下不稳定，前胶原难以正常分泌与装配。A 错在抗坏血酸缺乏并不改变甘氨酸在序列中的位置；C 错在断裂肽键需要蛋白酶参与，与羟化无关；D 错在Ⅰ型胶原的链间并不依靠二硫键连接；E 错在糖链连到天冬酰胺残基上属于糖基化，与螺旋稳定性没有直接关系。","type":"A1","group":"c16-01","kind":"mechanism","chs":[23,1,14],"vignette":"一名24岁船员随船作业3个月，船上只有咸肉与饼干，几乎没有新鲜蔬菜水果。近两周他牙龈肿胀出血，下肢出现多处瘀斑，小腿上一处旧伤口的裂口迟迟不愈。检查：血小板计数208×10⁹/L，凝血酶原时间与部分凝血活酶时间正常；血浆抗坏血酸5 μmol/L，明显低于正常下限。胶原前α链在粗面内质网中合成，其脯氨酸与赖氨酸残基需要羟化，三股螺旋才能稳定；催化这一步的羟化酶以抗坏血酸为辅因子，抗坏血酸缺乏时羟化不足，前胶原的三股螺旋在体温下不稳定，难以正常分泌并装配成纤维。分泌到细胞外的前胶原还要切除两端前肽，再由赖氨酰氧化酶催化形成共价交联，胶原纤维才具有抗张强度。他每天摄入的蛋白质总量并不少，饮食中缺少的只是新鲜果蔬。","vignette_title":"情景 1：三个月没吃新鲜菜的船员","gidx":2,"gn":5,"anchor":"三股螺旋才能稳定"},{"id":"gc19-03-1","ch":1,"part":1,"tag":"机制","stem":"HSP70 大量合成后帮助变性蛋白恢复折叠，其作用方式是","options":["直接催化肽键的重新形成，把断开的肽链接回去","结合部分折叠的中间体，阻止聚集并靠 ATP 供能","把错误折叠的蛋白送入溶酶体，在其中被逐步降解","为新生肽链提供模板，决定其最终的氨基酸序列","改变局部 pH 值，为正确折叠创造合适的化学环境"],"answer":1,"explain":"B 对：HSP70 属于分子伴侣，通过结合部分折叠的中间体遮盖暴露的疏水区，阻止其相互聚集，并以 ATP 水解供能反复尝试折叠。A 错：分子伴侣不催化肽键形成，肽键由核糖体催化合成。C 错：送入溶酶体降解属于自噬等清除途径，不是伴侣的直接作用。D 错：氨基酸序列由 mRNA 的密码子决定，伴侣不提供模板。E 错：伴侣依靠结合与释放帮助折叠，并不改变局部的酸碱环境。","type":"A1","group":"c19-03","kind":"mechanism","chs":[1,7,19],"vignette":"把培养细胞从 37℃ 分别移到 42℃ 与 45℃ 水浴：42℃ 处理 1 小时后回到 37℃，热休克因子 HSF1 由单体聚合并转入核内，HSP70 与 HSP90 的 mRNA 在 2 小时内升高约 8 倍，细胞存活率超过 90%。45℃ 处理 3 小时则不同：胞质中出现大量泛素化蛋白聚集体，HSP70 结合到聚集体上却无法使其重新溶解。同时测得内质网腔内未折叠蛋白增多，分子伴侣 BiP 从 PERK、ATF6 与 IRE1 三种感受器上解离，PERK 使 eIF2α 磷酸化，全局蛋白质翻译下降约 70%，ATF4 与 CHOP 的表达上调。24 小时后约 35% 的细胞出现 caspase-3 活化；若事先用小干扰 RNA 降低 p53 水平，同一处理下这一比例降至 14%。","vignette_title":"情景 3：42℃ 能救回来，45℃ 却启动了死亡程序","gidx":1,"gn":5,"anchor":"热休克因子 HSF1 由单体聚合"},{"id":"gc25-04-4","ch":1,"part":1,"tag":"机制","stem":"从蛋白质结构的角度看，胰岛素作用下糖原合酶活性升高的直接原因是","options":["糖原合酶的一级结构被部分水解，肽键断裂后活性中心暴露","糖原合酶与辅基结合，辅基的丢失与获得调节着它的活性","糖原合酶亚基发生解聚，由四聚体解离为有活性的单体","丝氨酸残基上的磷酸基被水解移除，局部电荷与构象随之改变","糖原合酶变性后重新折叠，折叠过程中形成了新的活性中心"],"answer":3,"explain":"D 对：糖原合酶通过丝氨酸残基上的磷酸基共价结合而被抑制，磷酸基被蛋白磷酸酶水解移除后，局部电荷与空间构象改变，活性中心恢复对底物的结合与催化能力。A 一级结构水解属降解而不是调节；B 该酶的活性不由辅基得失决定；C 没有亚基解聚的证据，其调节是共价修饰；E 变性会破坏构象并使活性丧失，与活性升高相反。","type":"A1","group":"c25-04","kind":"experiment","chs":[1,3,25,11],"vignette":"为追踪胰岛素把葡萄糖送进糖原的分子链条，研究生用同一批大鼠肝细胞做四组实验，各组细胞数与培养条件一致。甲组加 10 nmol/L 胰岛素；乙组先加 PI3K 抑制剂再加等量胰岛素；丙组先加蛋白磷酸酶抑制剂再加等量胰岛素；丁组不加药。孵育 30 分钟后测定，结果以丁组为 100%：甲组受体自身磷酸化升到 620%，Akt 磷酸化升到 480%，糖原合酶激酶磷酸化升到 510%，糖原合酶活性升到 260%，细胞内 UDP-葡萄糖升到 380%，¹⁴C 标记的葡萄糖掺入糖原的量升到 340%；乙组受体自身磷酸化仍为 590%，而 Akt 磷酸化只有 90%，糖原合酶活性为 100%；丙组 Akt 磷酸化与糖原合酶激酶磷酸化均与甲组接近，糖原合酶活性却只有 110%。另一组细胞在胰岛素作用前导入一个不能被 Akt 磷酸化的糖原合酶激酶突变体，该突变体持续保持活性，其糖原合酶活性只有 120%，¹⁴C 掺入糖原只有 140%。","vignette_title":"情景 4：三个抑制剂与一条通往糖原的链条","gidx":4,"gn":6,"anchor":"糖原合酶激酶磷酸化升到"},{"id":"gc6-01-1","ch":1,"part":1,"tag":"机制","stem":"该氨基酸替换使 Km 由 8 mmol/L 升至 40 mmol/L，其结构基础最可能是","options":["亚基之间解离使四级结构丧失而活性下降","二级结构解体使酶蛋白转变为无规卷曲构象","侧链氢键丧失使结合口袋对葡萄糖的亲和力下降","肽键被水解使酶的一级结构断裂成多个片段","辅基丢失使酶失去传递氢与电子的能力"],"answer":2,"explain":"C 对：突变残基位于底物结合口袋附近，其侧链原本与葡萄糖形成氢键，氢键丧失使酶与底物结合变弱，宏观表现为 Km 升高。D 错：单个氨基酸替换不涉及肽键水解，一级结构仍然完整。B 错：若二级结构整体解体，通常伴严重失活与聚集，与仅 Km 改变、Vmax 相近不符。A 错：葡糖激酶在细胞内以单体形式存在，不存在亚基解离的问题。E 错：该酶催化的是磷酸基团转移，并不需要传递氢与电子的辅基。","type":"A1","group":"c6-01","kind":"mechanism","chs":[1,3,11],"vignette":"肝细胞与胰岛 B 细胞中都有葡糖激酶（己糖激酶Ⅳ），它催化葡萄糖磷酸化为葡糖-6-磷酸，是糖酵解的第一个限速步骤，也被看作细胞的葡萄糖感受器：血糖升高后，进入细胞并被磷酸化的葡萄糖增多，胰岛素分泌随之启动。某患者自幼餐后血糖升高而空腹血糖接近正常，测序发现葡糖激酶第 62 位的缬氨酸被甲硫氨酸替换，该残基的侧链原本与葡萄糖的羟基形成氢键。研究者把突变酶与正常酶分别纯化，测得正常酶的 Km 约 8 mmol/L，突变酶约 40 mmol/L，两者 Vmax 相近。","vignette_title":"情景 1：当葡萄糖感受器认错了底物","gidx":1,"gn":5,"anchor":"该残基的侧链原本与葡萄糖的羟基形成氢键"},{"id":"gc6-04-1","ch":1,"part":1,"tag":"判读","stem":"沉淀在预期分子量处出现很浓的条带，说明包涵体中目的蛋白的","options":["被糖基化修饰，分子量比预期值明显偏大","一级结构已被破坏，被降解为若干较小的肽段","与分子伴侣结合，形成稳定的可溶性复合物","一级结构完整，只是没有折叠成有活性的空间构象","空间构象正常，只是被脂质包裹而测不到活性"],"answer":3,"explain":"D 对：SDS-PAGE 上条带位置与预期分子量一致，说明肽链没有断裂、一级结构完整；蛋白以不溶形式存在于沉淀中而无活性，是折叠错误相互聚集的结果。B 错：若被降解会出现多条更小的条带，与只有一条预期分子量条带不符。E 错：构象正常的酶应具有活性，且不会以不溶的包涵体形式存在。A 错：分子量与预期一致，不存在明显偏大的修饰产物。C 错：可溶性复合物应留在上清中，不会出现在沉淀里。","type":"A1","group":"c6-04","kind":"experiment","chs":[1,3],"vignette":"研究者把一种人源酶基因克隆到表达载体中，转入大肠杆菌后诱导表达 4 小时再超声破碎。离心后上清几乎测不到活性，沉淀经洗涤后作 SDS-PAGE，在预期分子量约 45 kDa 处出现一条很浓的条带。他用 8 mol/L 尿素把沉淀溶解，装进透析袋后梯度降低尿素浓度，24 小时后测得复性样品的比活性只有天然酶的 15%。圆二色谱显示复性样品的 α-螺旋含量与天然酶相近；非还原 SDS-PAGE 上除 45 kDa 条带外，还有一条约 90 kDa 的条带，加入二硫苏糖醇后该条带消失。全过程都在 4℃ 下操作。","vignette_title":"情景 4：把折叠错误的酶重新哄回来","gidx":1,"gn":5,"anchor":"在预期分子量约 45 kDa 处"},{"id":"gc6-04-2","ch":1,"part":1,"tag":"机制","stem":"非还原电泳上约 90 kDa 的条带在加入二硫苏糖醇后消失，提示","options":["复性样品中的肽链被二硫苏糖醇水解为更小的片段","复性样品中存在分子间二硫键交联形成的二聚体","复性样品中存在因分子内二硫键而构象改变的产物","复性样品中的二聚体靠疏水作用维持，被还原剂拆开","复性样品中的 90 kDa 条带是杂蛋白，与该酶无关"],"answer":1,"explain":"B 对：二硫苏糖醇是还原剂，能使二硫键断裂；分子量约为单体两倍的条带在还原后消失，说明它是两条肽链之间错配二硫键交联成的二聚体，这是复性效率低的重要原因。C 错：分子内二硫键只改变构象，不会让分子量变成约两倍。A 错：还原剂不能水解肽键。D 错：疏水作用靠变性剂或去垢剂破坏，还原剂对它没有作用，该条带消失正说明不是它维持的。E 错：情景中该条带与目的蛋白条带同时出现、又能被还原剂消除，指向目的蛋白自身的聚集体。","type":"A1","group":"c6-04","kind":"experiment","chs":[1,3],"vignette":"研究者把一种人源酶基因克隆到表达载体中，转入大肠杆菌后诱导表达 4 小时再超声破碎。离心后上清几乎测不到活性，沉淀经洗涤后作 SDS-PAGE，在预期分子量约 45 kDa 处出现一条很浓的条带。他用 8 mol/L 尿素把沉淀溶解，装进透析袋后梯度降低尿素浓度，24 小时后测得复性样品的比活性只有天然酶的 15%。圆二色谱显示复性样品的 α-螺旋含量与天然酶相近；非还原 SDS-PAGE 上除 45 kDa 条带外，还有一条约 90 kDa 的条带，加入二硫苏糖醇后该条带消失。全过程都在 4℃ 下操作。","vignette_title":"情景 4：把折叠错误的酶重新哄回来","gidx":2,"gn":5,"anchor":"还有一条约 90 kDa 的条带"},{"id":"gc6-04-3","ch":1,"part":1,"tag":"判读","stem":"复性样品 α-螺旋含量接近天然酶而比活性只有 15%，最合理的解释是","options":["二级结构尚未恢复，而活性中心的空间排布已经恢复","酶的催化活性与二级结构无关，取决于底物浓度高低","二级结构与活性中心恢复良好，剩余失活来自降解","二级结构已部分恢复，而活性中心的空间排布尚未恢复","圆二色谱只反映三级结构，不能说明二级结构的恢复"],"answer":3,"explain":"D 对：圆二色谱说明二级结构恢复得不错，但催化活性依赖活性中心若干残基在空间上的精确排布，这部分属于三级结构层次，仍可能没有恢复，故活性只有 15%。A 错：与圆二色谱结果矛盾。C 错：电泳上未见降解条带，剩余失活不是降解所致。E 错：圆二色谱在远紫外区正是测二级结构（α-螺旋、β-折叠）的常用手段。B 错：催化活性来自特定空间构象，底物浓度只能影响反应速度而不能改变酶的内在活性。","type":"A1","group":"c6-04","kind":"experiment","chs":[1,3],"vignette":"研究者把一种人源酶基因克隆到表达载体中，转入大肠杆菌后诱导表达 4 小时再超声破碎。离心后上清几乎测不到活性，沉淀经洗涤后作 SDS-PAGE，在预期分子量约 45 kDa 处出现一条很浓的条带。他用 8 mol/L 尿素把沉淀溶解，装进透析袋后梯度降低尿素浓度，24 小时后测得复性样品的比活性只有天然酶的 15%。圆二色谱显示复性样品的 α-螺旋含量与天然酶相近；非还原 SDS-PAGE 上除 45 kDa 条带外，还有一条约 90 kDa 的条带，加入二硫苏糖醇后该条带消失。全过程都在 4℃ 下操作。","vignette_title":"情景 4：把折叠错误的酶重新哄回来","gidx":3,"gn":5,"anchor":"α-螺旋含量与天然酶相近"},{"ch":1,"part":1,"tag":"氨基酸组成","stem":"关于组成人体蛋白质的氨基酸的叙述，正确的是","options":["含硫的氨基酸有半胱氨酸与甲硫氨酸，两者的侧链均含巯基","除甘氨酸外，组成人体蛋白质的氨基酸均为 L-α-氨基酸","芳香族氨基酸有苯丙氨酸、酪氨酸与色氨酸，均含两个苯环","脯氨酸为亚氨基酸，其侧链与 α-氨基成环，故不能形成肽键","碱性氨基酸有赖氨酸、精氨酸与组氨酸，均含两个氨基"],"answer":1,"explain":"B 对：20 种标准氨基酸中除甘氨酸外均为 L-α-氨基酸。A 错在甲硫氨酸侧链为硫醚而非巯基；C 错在色氨酸含吲哚环，并非两个苯环；D 错在脯氨酸虽为亚氨基酸，仍能参与形成肽键；E 错在组氨酸侧链为咪唑基，只含一个氨基。","type":"A1","id":"c1-5ea7df2d"},{"ch":1,"part":1,"tag":"一级结构","stem":"关于蛋白质一级结构及其与功能关系的叙述，正确的是","options":["一级结构指肽链中氨基酸的排列顺序，由氢键维系骨架","不同种属来源的同一功能蛋白质，一级结构完全相同","一级结构即肽链氨基酸序列，决定全部残基的空间排布","蛋白质变性时其一级结构与空间构象同时被破坏","一级结构改变即引起空间构象改变并导致功能异常"],"answer":2,"explain":"C 对：一级结构是氨基酸的排列顺序，由肽键维系，并决定空间构象（镰状细胞贫血即 β 链第 6 位残基改变所致）。A 错在一级结构由肽键而非氢键维系；B 错在同源蛋白质存在种属差异；D 错在变性只破坏空间构象、不动一级结构；E 错在一级结构改变未必改变整体构象（如 HbS 构象基本不变，仅表面电荷改变）。","type":"A1","id":"c1-d3eca5af"},{"ch":1,"part":1,"tag":"二级结构","stem":"关于蛋白质二级结构的叙述，正确的是","options":["β-折叠的氢键由相邻肽段的主链之间形成，肽段走向必须相反","α-螺旋的氢键由氨基酸侧链之间形成，故侧链性质决定其稳定性","β-转角多由 6 个残基构成，位于肽链末端并使其回折","α-螺旋每圈含 3.6 个氨基酸残基，其氢键均平行于螺旋长轴","无规卷曲是肽链中没有规则的构象，完全不属于蛋白质的二级结构"],"answer":3,"explain":"D 对：α-螺旋每圈 3.6 个残基、螺距 0.54 nm，链内氢键平行于螺旋长轴。A 错在 β-折叠两条肽段可平行也可反平行；B 错在 α-螺旋的氢键在主链 C=O 与 N-H 之间；C 错在 β-转角由 4 个残基构成；E 错在无规卷曲也是二级结构的一种。","type":"A1","id":"c1-1e331773"},{"ch":1,"part":1,"tag":"三级结构","stem":"关于蛋白质三级结构与结构域的叙述，正确的是","options":["三级结构由两条以上肽链通过非共价键聚合而成","结构域指二级结构之间形成的超二级结构组合","肌红蛋白由 4 个亚基组成，其三级与四级结构均完整","三级结构主要依靠肽键维持，故加热时不易被破坏","三级结构指整条肽链中全部氨基酸残基的相对空间位置"],"answer":4,"explain":"E 对：三级结构是整条肽链全部残基的空间排布，由疏水作用等次级键维系，加热易被破坏。A 错在描述的是四级结构（且由二级结构组合、多肽链上可独立折叠的是结构域）；B 错在结构域是可独立折叠的功能区域，超二级结构是另一概念；C 错在肌红蛋白为单链蛋白、无四级结构；D 错在三级结构靠次级键而非肽键维持。","type":"A1","id":"c1-3f206db0"},{"ch":1,"part":1,"tag":"四级结构","stem":"关于蛋白质四级结构的叙述，正确的是","options":["各亚基之间主要通过肽键相连，故四级结构的稳定性很高","血红蛋白的 4 个亚基均结合氧，其氧解离曲线呈 S 形","所有具有四级结构的蛋白质，其活性都高于单体蛋白","蛋白质变性时只解聚亚基，亚基内部的构象完全不受影响","四级结构中各亚基的一级结构必须完全相同，且空间排布对称"],"answer":1,"explain":"B 对：血红蛋白 4 个亚基之间存在正协同效应，曲线呈 S 形。A 错在亚基间靠非共价键（疏水作用、氢键、离子键）结合；C 错在四级结构并非高活性的必要条件（肌红蛋白有活性）；D 错在变性时亚基解聚且亚基自身构象也被破坏；E 错在亚基可相同也可不同（如血红蛋白的 α、β 链）。","type":"A1","id":"c1-6890b959"},{"ch":1,"part":1,"tag":"变性沉淀","stem":"硫酸铵盐析得到的蛋白质沉淀与加热煮沸形成的蛋白质沉淀相比，最主要的差别是","options":["盐析破坏肽键使蛋白质沉淀，加热破坏氢键使蛋白质沉淀","盐析使蛋白质变性失活，加热仅使其沉淀而不发生变性","盐析与加热均使蛋白质沉淀，区别在于前者不变性而后者变性","盐析所得沉淀加水后完全不再溶解，加热所得沉淀反而可以复溶","两者都破坏一级结构，仅沉淀颗粒的大小与形态不同"],"answer":2,"explain":"C 对：盐析是中和电荷、破坏水化膜的可逆沉淀，不改变构象、可复溶且保持活性；加热使次级键断裂、空间构象破坏而变性失活。A 错在两者都不破坏肽键；B 错在说反了；D 错在盐析沉淀可复溶、加热沉淀不可复溶；E 错在二者均不破坏一级结构。","type":"A1","id":"c1-b37b5bd9"},{"ch":1,"part":1,"tag":"理化性质","stem":"关于蛋白质理化性质的叙述，正确的是","options":["蛋白质在 280 nm 的紫外吸收完全由肽键产生","蛋白质溶液的 pH 高于其等电点时，蛋白质一定带正电荷","双缩脲反应是各种氨基酸共有的呈色反应","蛋白质在其等电点时净电荷完全为零，溶解度最小","蛋白质的紫外吸收峰在 260 nm，与核酸的吸收峰相同"],"answer":3,"explain":"D 对：等电点时蛋白质净电荷为零，分子间排斥最小、溶解度最低。A 错在 280 nm 吸收主要来自色氨酸、酪氨酸等芳香族残基；B 错在 pH 高于 pI 时带负电荷；C 错在双缩脲反应需两个以上肽键，游离氨基酸不显色；E 错在蛋白质吸收峰为 280 nm，260 nm 是核酸的吸收峰。","type":"A1","id":"c1-085c5f1a"},{"ch":1,"part":1,"tag":"分离纯化","stem":"某分子量 400 kD 的蛋白质在 SDS-PAGE（不含还原剂）上可见 180 kD、160 kD 和 60 kD 三条带；加入 DTT 后 180 kD 条带消失并出现 90 kD 条带。据此可以判断","options":["该蛋白质由 3 个完全相同的亚基组成，亚基间无二硫键","DTT 使蛋白质迅速变性并沉淀，从而改变电泳条带","160 kD 与 60 kD 两条带之间也存在链间二硫键连接","SDS-PAGE 测得的 400 kD 是完整蛋白质的分子量，与亚基无关","180 kD 条带由两条 90 kD 肽链通过链间二硫键连接而成"],"answer":4,"explain":"E 对：加还原剂后 180 kD 条带消失、出现 90 kD 条带，说明原条带是两条 90 kD 肽链经链间二硫键连接的二聚体。A 错在三条带说明至少 3 种亚基且分子量不同，谈不上完全相同；B 错在 DTT 只断裂二硫键，并不引起沉淀；C 错在 160 kD 与 60 kD 条带在加 DTT 前后不变，无二硫键连接；D 错在 SDS-PAGE 测得的 400 kD 是各亚基分子量之和相近值，测得的是亚基分子量而非完整蛋白。","type":"A1","id":"c1-2d23ed78"},{"ch":1,"part":1,"tag":"综合·变性沉淀","stem":"关于蛋白质的变性、沉淀与复性，下列叙述正确的是（X 型多选）","options":["变性主要破坏维持空间构象的次级键，不涉及肽键断裂","变性后蛋白质溶解度降低、黏度增加，生物学活性丧失","蛋白质在等电点时最易沉淀，同时也最易发生变性","变性程度较轻时，去除变性因素后蛋白质可恢复原有构象","蛋白质经硫酸铵盐析后完全变性，加水稀释也不能复溶"],"answer":[0,1,3],"explain":"答案 ABD。A 对：变性只破坏次级键，一级结构与肽键完好。B 对：变性使疏水基团暴露，溶解度下降、黏度上升、活性丧失。C 错：等电点时确实最易沉淀，但变性难易与等电点无关。D 对：轻度变性去除变性因素可复性（如 DNA 复性、部分酶复性）。E 错：盐析是可逆沉淀，未变性，稀释或透析除盐后可复溶并恢复活性。","type":"X","id":"c1-efedf590"},{"ch":1,"part":1,"tag":"综合·氧合与变构","stem":"关于血红蛋白与肌红蛋白的结构与功能，下列叙述正确的是（X 型多选）","options":["血红蛋白为四聚体，肌红蛋白为单链蛋白，后者无四级结构","血红蛋白的氧解离曲线呈 S 形，肌红蛋白的呈双曲线形","血红蛋白的 P50 小于肌红蛋白，故其氧亲和力更高","2,3-BPG 与血红蛋白结合后，可使其氧解离曲线右移","肌红蛋白与血红蛋白均能可逆结合氧，也都具有变构效应"],"answer":[0,1,3],"explain":"答案 ABD。A 对：肌红蛋白为单链，只有三级结构。B 对：血红蛋白有正协同效应，曲线呈 S 形；肌红蛋白为双曲线形。C 错：血红蛋白 P50 约 26 mmHg，明显大于肌红蛋白的约 1 mmHg，故氧亲和力更低。D 对：2,3-BPG 稳定去氧构象，降低氧亲和力、曲线右移，利于组织释氧。E 错：肌红蛋白结合氧不表现变构效应与协同效应。","type":"X","id":"c1-706d8379"},{"ch":1,"part":1,"tag":"综合·分离纯化","stem":"关于蛋白质的分离与纯化技术，下列叙述正确的是（X 型多选）","options":["凝胶过滤层析中大分子不能进入凝胶微孔，故先被洗脱","离子交换层析主要依据蛋白质所带电荷的差异进行分离","亲和层析利用蛋白质与配体间特异的生物学亲和作用","SDS-PAGE 中蛋白质的迁移率主要取决于其等电点高低","盐析与有机溶剂沉淀均通过破坏空间构象实现蛋白质分离"],"answer":[0,1,2],"explain":"答案 ABC。A 对：凝胶过滤（分子筛）按分子大小分离，大分子被排阻先洗脱。B 对：离子交换层析依据电荷性质（pI 与缓冲液 pH 的关系）分离。C 对：亲和层析依据特异的生物学亲和作用。D 错：SDS-PAGE 中 SDS 使蛋白带大量负电荷，迁移率主要取决于分子量。E 错：盐析不破坏空间构象（可逆），有机溶剂在低温下也尽量保持天然构象。","type":"X","id":"c1-67420ac5"},{"ch":1,"part":1,"tag":"二级结构·参数","stem":"关于蛋白质 α-螺旋的主要结构参数，正确的是","options":["α-螺旋每圈含 3.6 个残基，螺距 0.34 nm，氢键平行于螺旋长轴","α-螺旋每圈含 3.6 个残基，螺距 5.4 nm，氢键平行于螺旋长轴","α-螺旋每圈含 3.6 个残基，螺距 0.54 nm，氢键平行于螺旋长轴","α-螺旋每圈含 3.6 个残基，螺距 0.54 nm，氢键垂直于螺旋长轴","α-螺旋每圈含 3.6 个残基，螺距 0.54 nm，氢键由侧链之间形成"],"answer":2,"explain":"C 对：α-螺旋每圈 3.6 个残基，螺距 0.54 nm，链内氢键由第 n 位残基的 C=O 与第 n+4 位残基的 N-H 形成、方向平行于螺旋长轴。A 错在螺距（0.34 nm 是 B 型 DNA 相邻碱基对间距的近似值）；B 错在 5.4 nm 放大了十倍；D 错在氢键方向（垂直于长轴是 β-折叠的特征）；E 错在氢键由主链之间而非侧链之间形成。","type":"A1","id":"c1-d59b77e9"},{"ch":1,"part":1,"tag":"电泳·SDS-PAGE","stem":"关于 SDS-PAGE 测定蛋白质分子量的原理，正确的是","options":["SDS 使蛋白质带大量正电荷，迁移率取决于亚基分子量","SDS 使蛋白质带大量负电荷，迁移率取决于亚基分子量","SDS 使蛋白质带大量负电荷，迁移率取决于蛋白质等电点","SDS 使蛋白质带大量负电荷，迁移率取决于亚基空间构象","SDS 使蛋白质带大量负电荷，迁移率取决于二硫键数目"],"answer":1,"explain":"B 对：SDS 使蛋白质变性并带上大量负电荷，掩盖其本身电荷差异，迁移率主要取决于亚基分子量。A 错在电荷符号；C 错在等电点差异已被 SDS 掩盖（等电聚焦才是按 pI 分离）；D 错在 SDS 使蛋白质伸展为棒状，构象差异被消除；E 错在二硫键只影响是否有亚基聚合，需还原剂断裂，本身不决定迁移率。","type":"A1","id":"c1-1d47f861"},{"ch":1,"part":1,"tag":"层析·凝胶过滤","stem":"关于凝胶过滤层析的洗脱规律，正确的是","options":["大分子不能进入凝胶微孔，洗脱体积大、先被洗脱","小分子不能进入凝胶微孔，洗脱体积小、先被洗脱","大分子能进入凝胶微孔，洗脱体积大、后被洗脱","大分子不能进入凝胶微孔，洗脱体积小、先被洗脱","小分子能进入凝胶微孔，洗脱体积小、后被洗脱"],"answer":3,"explain":"D 对：凝胶过滤按分子大小分离，大分子被排阻在凝胶颗粒外、只走颗粒间空隙，洗脱体积小（等于外水体积），先被洗脱；小分子可进入微孔、路程长，后被洗脱。A 错在洗脱体积；B 错在是小分子能进入微孔；C 错在是大分子不能进入微孔；E 错在小分子洗脱体积大（接近总柱体积）、后被洗脱。","type":"A1","id":"c1-6f8458ee"},{"ch":1,"part":1,"tag":"综合·结构参数","stem":"关于蛋白质各级结构参数与维系力的叙述，下列叙述正确的是（X 型多选）","options":["α-螺旋每圈含 3.6 个氨基酸残基，螺距约为 0.54 nm","β-折叠中相邻肽段间形成氢键，肽段可平行也可反平行","β-转角由 4 个氨基酸残基构成，靠第 1、4 位残基间氢键回折","肽单元中的 6 个原子共处一个平面，肽键不能自由旋转","三级结构的维系主要依靠肽键，次级键只起辅助作用"],"answer":[0,1,2,3],"explain":"答案 ABCD。A 对：α-螺旋每圈 3.6 个残基、螺距 0.54 nm。B 对：β-折叠的氢键在相邻肽段主链之间形成，两种走向均存在。C 对：β-转角由 4 个残基构成，Gly、Pro 常见。D 对：肽键具部分双键性质，肽单元 6 个原子共平面。E 错：三级结构靠疏水作用、氢键、离子键、范德华力等次级键维系，肽键维持的是一级结构。","type":"X","id":"c1-eaf1e2a2"},{"ch":1,"part":1,"tag":"氨基酸侧链基团","stem":"某蛋白激酶可将 ATP 的 γ-磷酸基转移到底物蛋白的羟基上。研究者把底物分子表面的一个 Ser 定点突变为 Ala 后，该位点的磷酸化信号完全消失。据此推断，该激酶修饰的氨基酸侧链特征是","options":["侧链含羧基，如 Asp 与 Glu 残基","侧链含氨基，如 Lys 与 Arg 残基","侧链含羟基，如 Ser、Thr 与 Tyr","侧链含巯基，如 Cys 与 Met 残基","侧链含苯环，如 Phe 与 Trp 残基"],"answer":2,"explain":"情景线索：突变 Ser→Ala 后磷酸化消失，说明被修饰的是羟基。C 对：Ser、Thr、Tyr 侧链含羟基，是蛋白激酶磷酸化的位点。A 错在羧基（Asp、Glu）带负电，不是磷酸化位点；B 错在氨基（Lys、Arg）带正电；D 错在 Met 侧链为硫醚、不含巯基（且巯基也不是磷酸化位点）；E 错在 Phe 无羟基、Trp 侧链为吲哚环。","type":"A1","id":"c1-7cae0ede"},{"ch":1,"part":1,"tag":"肽键与肽链方向性","stem":"某实验室用固相法合成了一条 12 肽，随后经 Edman 降解法从游离 α-氨基端开始逐一无损测定其序列。关于该肽链中肽键的性质与肽链的方向性，叙述正确的是","options":["肽键可自由旋转，其合成方向由 C 端到 N 端","肽键为刚性平面结构，其合成方向由 N 端到 C 端","肽单元 6 个原子共平面，其合成方向由 C 端到 N 端","肽键可绕 C—N 键自由旋转，故肽链柔性极大","肽键具有部分单键性质，可在平面内自由旋转"],"answer":1,"explain":"情景线索：Edman 降解从游离 α-氨基端开始，该端即 N 端。B 对：肽键具部分双键性质，肽单元 6 个原子共平面、不能自由旋转；体内蛋白质合成方向为 N 端→C 端。A 错在“可自由旋转”且合成方向反了；C 错在合成方向反了（共平面本身正确）；D 错在肽键不能绕 C—N 键自由旋转、肽链并不柔软；E 错在肽键是部分双键而非单键，同样不能自由旋转。","type":"A1","id":"c1-3894c53b"},{"ch":1,"part":1,"tag":"β-转角","stem":"某球状蛋白含 150 个氨基酸残基，其晶体结构显示肽链在分子表面多次发生急剧回折，回折处常出现 Gly 与 Pro。关于这些回折部位的结构，正确的是","options":["属 β-折叠，由相邻肽段间的氢键维系并呈片层状结构","属 α-螺旋结构，每圈 3.6 个残基并以链内氢键维系","属无规卷曲结构，其构象并不依赖任何氢键维系","属 β-转角，由 4 个残基构成并经 1、4 位残基氢键回折","属超二级结构，由 2 个以上的二级结构单元组合"],"answer":3,"explain":"情景线索：肽链急剧回折、Gly 与 Pro 富集，正是 β-转角的特征。D 对：β-转角由 4 个残基构成，靠第 1 个残基的 C=O 与第 4 个残基的 N-H 形成氢键回折。A 错在 β-折叠是相邻肽段间的片层结构；B 错在 α-螺旋每圈 3.6 个残基、不回折；C 错在无规卷曲也由主链构象决定、并非“不依赖氢键”的独立结构；E 错在超二级结构是二级结构单元的组合，不是单处回折。","type":"A1","id":"c1-edb62961"},{"ch":1,"part":1,"tag":"空间结构的维系力","stem":"研究者对某纯化蛋白分别作如下处理：① 60℃ 保温 30 min；② 8 mol/L 尿素；③ 1% SDS；④ SDS 加 β-巯基乙醇。四种处理均使该蛋白失活，但只有 ④ 能将其完全解离为亚基。关于该蛋白空间构象的维系，正确的是","options":["完全依靠肽键维系，而次级键在其中只起辅助作用","主要依靠二硫键维系，次级键在其中起辅助作用","主要依靠氢键维系，疏水作用与二硫键并不起作用","主要依靠离子键维系，故改变离子强度即可解离亚基","由疏水作用、氢键、离子键等次级键与二硫键共同维系"],"answer":4,"explain":"情景线索：单独变性可失活，但只有同时加 SDS 与还原剂才能解离亚基，说明亚基间除次级键外还有二硫键。E 对：空间构象由疏水作用、氢键、离子键、范德华力等次级键协同维系，二硫键进一步共价锁定。A 错在肽键只维持一级结构；B 错在二硫键数目有限、非唯一力量；C 错在疏水作用是维持三级结构的主要驱动力；D 错在仅改变离子强度不足以解离亚基。","type":"A1","id":"c1-40ad2962"},{"ch":1,"part":1,"tag":"氧解离曲线","stem":"某实验室分别从肌肉组织与红细胞中纯化出两种可结合氧的蛋白质：肌肉来源者为单链，其氧解离曲线呈双曲线形，P50 约 1 mmHg；红细胞来源者为四聚体，曲线呈 S 形，P50 约 26 mmHg。下列判断正确的是","options":["前者为血红蛋白，后者为肌红蛋白，前者具有协同效应","二者均为血红蛋白，仅亚基数目有所不同","前者为肌红蛋白，后者为血红蛋白，后者具有协同效应","后者为血红蛋白，其 P50 较大故氧亲和力较高","前者为肌红蛋白，其 P50 较小故氧亲和力较低"],"answer":2,"explain":"情景线索：单链 + 双曲线形 + P50 极低 = 肌红蛋白；四聚体 + S 形 + P50 较高 = 血红蛋白。C 对：血红蛋白亚基间存在正协同效应，故曲线呈 S 形。A 错在把两者对调；B 错在肌红蛋白为单链、非血红蛋白；D 错在 P50 越大氧亲和力越低；E 错在 P50 越小氧亲和力越高。","type":"A1","id":"c1-be6442e8"},{"ch":1,"part":1,"tag":"2,3-BPG与变构效应","stem":"某登山队在海拔 4500 m 处驻扎两周，队员血氧饱和度由 98% 降至 88%，但活动耐力逐渐改善；复查发现红细胞内 2,3-二磷酸甘油酸较出发前升高约 30%。这一变化的意义是","options":["使血红蛋白氧解离曲线右移，组织获氧增多","使血红蛋白氧解离曲线左移，肺部摄氧增多","使血红蛋白的 P50 减小，对氧的亲和力升高","使血红蛋白四聚体解聚，失去协同效应","使血红蛋白与氧的结合变为不可逆反应"],"answer":0,"explain":"情景线索：高原慢性缺氧时 2,3-BPG 升高是适应机制。A 对：2,3-BPG 作为变构效应物稳定去氧构象，降低氧亲和力、曲线右移、P50 增大，利于组织释氧。B 错在曲线右移而非左移；C 错在 P50 增大而非减小；D 错在血红蛋白仍为四聚体、协同效应保留；E 错在结合氧始终是可逆的。","type":"A1","id":"c1-fa8318d5"},{"ch":1,"part":1,"tag":"电泳","stem":"一名来自疟疾流行区的患儿反复贫血、脾大，血涂片见大量镰状红细胞。实验室将其血红蛋白（HbS，pI 7.2）与正常人血红蛋白（HbA，pI 7.0）分别点样，在 pH 8.6 缓冲液中作醋酸纤维素薄膜电泳。下列判断正确的是","options":["二者均带负电荷，HbS 向正极移动较快","二者均带正电荷，HbA 向负极移动较快","二者均带正电荷，HbS 向负极移动较快","二者均带负电荷，HbA 向正极移动较快","二者所带电荷相同，电泳后谱带完全重叠"],"answer":3,"explain":"情景线索：缓冲液 pH 8.6 高于两种血红蛋白的等电点（7.0 与 7.2）。D 对：pH > pI 时蛋白质带负电、向正极移动；HbS 的 pI 更接近 8.6，所带负电荷较少，所以 HbA 迁移更快、两条谱带可分开（这正是电泳诊断 HbS 的原理）。A 错在迁移快慢颠倒；B、C 错在电荷符号与移动方向；E 错在两者电荷不同、可被分离。","type":"A1","id":"c1-be080b71"},{"ch":1,"part":1,"tag":"层析原理","stem":"研究生需从混合样品中分离一种带较强负电荷的酶，并要求全程保持其天然活性。实验室备有凝胶过滤、离子交换层析、亲和层析与 SDS-PAGE，下列方案中最合适的是","options":["先用阳离子交换层析，再用 SDS-PAGE 鉴定纯度","先用阴离子交换层析，再用亲和层析进一步纯化","先用 SDS-PAGE 分离，切胶回收目标蛋白条带","先用凝胶过滤按分子大小分离，再作等电聚焦","先用硫酸铵沉淀并加热处理，再作凝胶过滤"],"answer":1,"explain":"情景线索：目标带较强负电荷，且须保持天然活性。B 对：带负电的蛋白质结合于带正电的阴离子交换树脂，可用盐梯度洗脱；亲和层析依赖特异的生物学亲和作用，条件温和、纯化倍数高。A 错在阳离子交换树脂带负电、不能结合带负电的目标蛋白，且 SDS-PAGE 使其变性；C 错在 SDS-PAGE 是变性电泳、样品失活；D 错在等电聚焦常在变性/高电压条件下进行、回收困难；E 错在加热使酶变性失活。","type":"A1","id":"c1-bf60e39e"},{"ch":1,"part":1,"tag":"综合·各级结构","stem":"关于蛋白质一级结构与空间结构的关系，下列叙述正确的是（X 型多选）","options":["一级结构由肽键维系，是空间构象形成的决定因素","空间构象的维系依赖氢键、离子键、疏水作用等次级键","二硫键属于共价键，可稳定蛋白质的空间构象","蛋白质变性时肽键断裂，其一级结构随之被破坏","一级结构不变时，空间构象在任何条件下都不改变"],"answer":[0,1,2],"explain":"答案 ABC。A 对：一级结构（氨基酸排列顺序）决定空间构象，是 Anfinsen 原理的核心。B 对：次级键虽弱，靠数量协同稳定构象。C 对：二硫键由两个半胱氨酸残基的巯基氧化形成，是共价键，可锁定折叠状态。D 错：变性只破坏次级键，肽键完好、一级结构不变。E 错：构象还受 pH、温度、离子强度、分子伴侣等影响，并非只由一级结构决定。","type":"X","id":"c1-e7a2adef"},{"ch":1,"part":1,"tag":"综合·理化性质与电泳","stem":"关于蛋白质的理化性质与分离分析，下列叙述正确的是（X 型多选）","options":["蛋白质的紫外吸收峰在 280 nm，主要由芳香族残基贡献","等电点时蛋白质净电荷为零，溶解度最低，最易沉淀","SDS-PAGE 测定的分子量是亚基分子量，而非完整蛋白质分子量","双缩脲反应可用于检测溶液中游离氨基酸的含量","蛋白质溶液 pH 高于等电点时带正电荷，电泳时移向负极"],"answer":[0,1,2],"explain":"答案 ABC。A 对：280 nm 吸收主要来自色氨酸、酪氨酸（及苯丙氨酸）的芳香环。B 对：等电点时分子间静电排斥最小、水化膜最薄，溶解度最低。C 对：SDS 使蛋白变性并带大量负电荷，迁移率取决于亚基分子量。D 错：双缩脲反应需两个以上肽键，游离氨基酸不显色。E 错：pH 高于 pI 时带负电荷、移向正极。","type":"X","id":"c1-8b6f9e85"},{"id":"gc0-02-1","ch":2,"part":1,"tag":"机制","stem":"紫外线特别容易造成这种损伤，直接与核酸的哪一性质相关","options":["碱基堆积力在紫外光照射下首先被破坏","脱氧核糖 2′ 位缺少羟基，因而容易被氧化","磷酸二酯键在 260 nm 附近极易发生断裂","碱基对 260 nm 附近的紫外光有最大吸收","双螺旋的大沟在紫外光下优先发生解链"],"answer":3,"explain":"D 对：碱基（尤其嘧啶）在 260 nm 有最大吸收，吸收的光能转化为光化学反应，才形成嘧啶二聚体。C 错在磷酸二酯键不因紫外吸收而断裂；C 讲的是脱氧核糖的构型差异，与损伤类型无关；D、E 描述的是加热或碱引起的变性，不是紫外光化学损伤。","type":"A1","group":"c0-02","kind":"mechanism","chs":[2,19],"vignette":"阳光里的紫外线，波长正好落在核酸吸收最强的 260 nm 附近。当它照到皮肤细胞时，同一条链上相邻的两个胸腺嘧啶之间会形成环丁烷型嘧啶二聚体，DNA 双螺旋在这一处被顶得扭曲，复制与转录到此处都会停下。细胞有一套修复系统：核苷酸切除修复（NER）先由蛋白质识别这种扭曲、在损伤两侧各切一刀，切除约 25–30 个核苷酸的片段，再由 DNA 聚合酶以对侧完整链为模板补齐缺口，最后由连接酶封口。着色性干皮病患者正是因为 NER 通路（如 XPA、XPC 等）缺陷，晒到的部位反复出现色素沉着、皮肤萎缩，并在很年轻的年龄发生皮肤癌。","vignette_title":"情景 2：为什么晒出来的损伤偏偏卡在胸腺嘧啶上","gidx":1,"gn":4,"anchor":"波长正好落在核酸吸收最强的 260 nm 附近"},{"id":"gc0-02-4","ch":2,"part":1,"tag":"机制","stem":"关于这条从「光」到「癌」的链条，下列判断正确的是（X 型多选）","options":["患者皮肤癌集中发生在曝光部位，与损伤来源一致","NER 缺陷使损伤不断累积，基因突变率显著升高","修复过程中对侧链提供了恢复正确序列的信息","该病说明 DNA 损伤只能依靠 NER 这一条通路修复","嘧啶二聚体使局部双螺旋扭曲，阻断复制与转录"],"answer":[0,1,2,4],"explain":"答案 ABCE。A–D 都能在情景中找到对应句：损伤形态、修复缺陷与突变累积、曝光部位发病、对侧链作模板。D 错：DNA 损伤修复至少还有碱基切除修复、错配修复、双链断裂修复（同源重组、非同源末端连接）等通路，NER 主要处理使螺旋扭曲的大块损伤，并非唯一通路。","type":"X","group":"c0-02","kind":"mechanism","chs":[2,19],"vignette":"阳光里的紫外线，波长正好落在核酸吸收最强的 260 nm 附近。当它照到皮肤细胞时，同一条链上相邻的两个胸腺嘧啶之间会形成环丁烷型嘧啶二聚体，DNA 双螺旋在这一处被顶得扭曲，复制与转录到此处都会停下。细胞有一套修复系统：核苷酸切除修复（NER）先由蛋白质识别这种扭曲、在损伤两侧各切一刀，切除约 25–30 个核苷酸的片段，再由 DNA 聚合酶以对侧完整链为模板补齐缺口，最后由连接酶封口。着色性干皮病患者正是因为 NER 通路（如 XPA、XPC 等）缺陷，晒到的部位反复出现色素沉着、皮肤萎缩，并在很年轻的年龄发生皮肤癌。","vignette_title":"情景 2：为什么晒出来的损伤偏偏卡在胸腺嘧啶上","gidx":4,"gn":4,"anchor":"环丁烷型嘧啶二聚体"},{"id":"gc1-03-1","ch":2,"part":1,"tag":"机制","stem":"甲的变性温度高于乙，最直接的原因是","options":["甲中 A-T 碱基对比例高，A 与 T 间有三个氢键","甲是环状分子，两条链之间的缠绕更紧密","甲中 G-C 碱基对比例高，G 与 C 间有三个氢键","甲的分子更长，碱基之间的堆积作用更强","甲中磷酸二酯键更多，糖磷酸骨架更稳定"],"answer":2,"explain":"C 对：G 与 C 之间形成 3 个氢键，A 与 T 之间只有 2 个，甲样品 G+C 含量高、氢键多且碱基堆积更紧密，因此需要更高温度才能解链。B 碱基对种类判错，而且 A-T 之间是 2 个氢键；C 情景已说明两者分子长度相近，长度不是变量；D 两种都是环状双链 DNA，结构类型相同；E 骨架成分在两类 DNA 中没有差别，不解释变性温度的不同。","type":"A1","group":"c1-03","kind":"mechanism","chs":[2,10],"vignette":"两种细菌的 DNA 分别放入石英比色皿，用 260 nm 的光监测吸光度并缓慢升温。样品甲的 G+C 含量为 68%，样品乙的 G+C 含量为 32%，两者分子长度相近。常温下两种溶液的吸光度都较低；升到某一温度后吸光度迅速升高约 30%，甲出现这一变化对应的温度为 92℃，乙为 78℃。若把加热后的溶液缓慢冷却，吸光度基本回落；若迅速投入冰浴，吸光度却停在原来的高位。在真核细胞核内，DNA 并不裸露：每约 147 个碱基对缠绕组蛋白八聚体形成核小体，组蛋白富含赖氨酸和精氨酸。","vignette_title":"情景 3：为什么甲样品要热到 92℃","gidx":1,"gn":5,"anchor":"两者分子长度相近"},{"id":"gc1-03-2","ch":2,"part":1,"tag":"判读","stem":"升温过程中 260 nm 吸光度升高约 30%，说明","options":["碱基之间的氢键断开，双螺旋解链成两条单链","磷酸二酯键大量断裂，DNA 被降解为核苷酸","碱基被水解脱落，生成无嘌呤的核酸片段","双螺旋由右手型变成左手型，碱基暴露在外","碱基发生脱氨反应，生成尿嘧啶使吸光度升高"],"answer":0,"explain":"A 对：这是增色效应，加热使碱基由紧密堆积变为暴露状态，260 nm 吸光度随之升高，同时氢键断裂、双螺旋解旋为两条单链。B 磷酸二酯键的断裂要靠核酸酶或强碱，吸光度升高本身并不表示链被切断；C 脱嘌呤需要酸性条件，也不是增色效应的原因；D 左手螺旋仍然是双链结构，不会使吸光度大幅升高；E 脱氨改变的是碱基种类，与吸光度升高的直接原因无关。","type":"A1","group":"c1-03","kind":"mechanism","chs":[2,10],"vignette":"两种细菌的 DNA 分别放入石英比色皿，用 260 nm 的光监测吸光度并缓慢升温。样品甲的 G+C 含量为 68%，样品乙的 G+C 含量为 32%，两者分子长度相近。常温下两种溶液的吸光度都较低；升到某一温度后吸光度迅速升高约 30%，甲出现这一变化对应的温度为 92℃，乙为 78℃。若把加热后的溶液缓慢冷却，吸光度基本回落；若迅速投入冰浴，吸光度却停在原来的高位。在真核细胞核内，DNA 并不裸露：每约 147 个碱基对缠绕组蛋白八聚体形成核小体，组蛋白富含赖氨酸和精氨酸。","vignette_title":"情景 3：为什么甲样品要热到 92℃","gidx":2,"gn":5,"anchor":"吸光度迅速升高约 30%"},{"id":"gc1-03-3","ch":2,"part":1,"tag":"机制","stem":"缓慢冷却时吸光度回落，而迅速投入冰浴则不能，说明","options":["复性需要互补链重新配对，缓慢降温提供了配对时间","快速降温使两条链之间形成共价交联，无法再分开","缓慢降温使 DNA 被降解成小片段，吸光度因而回落","复性程度取决于溶液中的盐浓度，与降温快慢无关","快速降温减轻了 DNA 的变性程度，吸光度不再回落"],"answer":0,"explain":"A 对：复性依赖互补碱基重新配对，缓慢降温给两条链足够时间碰撞并找到正确配对，吸光度因此回落；骤冷时链内链间形成大量无规则配对，吸光度停在高位，这正是核酸杂交要缓慢退火的原因。B 骤冷不会产生共价交联；C 加热与冷却过程中 DNA 并未被降解；D 盐浓度影响复性速率，但本例的变量是降温快慢；E 骤冷只是把变性状态冻结下来，并没有减轻变性程度。","type":"A1","group":"c1-03","kind":"mechanism","chs":[2,10],"vignette":"两种细菌的 DNA 分别放入石英比色皿，用 260 nm 的光监测吸光度并缓慢升温。样品甲的 G+C 含量为 68%，样品乙的 G+C 含量为 32%，两者分子长度相近。常温下两种溶液的吸光度都较低；升到某一温度后吸光度迅速升高约 30%，甲出现这一变化对应的温度为 92℃，乙为 78℃。若把加热后的溶液缓慢冷却，吸光度基本回落；若迅速投入冰浴，吸光度却停在原来的高位。在真核细胞核内，DNA 并不裸露：每约 147 个碱基对缠绕组蛋白八聚体形成核小体，组蛋白富含赖氨酸和精氨酸。","vignette_title":"情景 3：为什么甲样品要热到 92℃","gidx":3,"gn":5,"anchor":"若迅速投入冰浴，吸光度却停在原来的高位"},{"id":"gc1-03-5","ch":2,"part":1,"tag":"判读","stem":"关于该 DNA 的变性与复性，下列判断正确的是（X 型多选）","options":["变性后的 DNA 两条链被水解为游离核苷酸","变性后的 DNA 与变性前碱基组成不同","缓慢降温时互补链能重新配对并恢复双螺旋","G+C 含量越高，解链所需的温度就越高","增色效应来自碱基由有序堆积变为无规则暴露"],"answer":[2,3,4],"explain":"答案 CDE。C、D、E 分别对应增色效应的本质、G+C 含量与解链温度的关系、复性的条件，都能在情景中找到依据。B 错：变性只破坏氢键与碱基堆积，碱基组成并没有改变；A 错：变性不等于水解，两条链本身仍然完整，只是彼此分开，测核苷酸组成也看不出差别。","type":"X","group":"c1-03","kind":"mechanism","chs":[2,10],"vignette":"两种细菌的 DNA 分别放入石英比色皿，用 260 nm 的光监测吸光度并缓慢升温。样品甲的 G+C 含量为 68%，样品乙的 G+C 含量为 32%，两者分子长度相近。常温下两种溶液的吸光度都较低；升到某一温度后吸光度迅速升高约 30%，甲出现这一变化对应的温度为 92℃，乙为 78℃。若把加热后的溶液缓慢冷却，吸光度基本回落；若迅速投入冰浴，吸光度却停在原来的高位。在真核细胞核内，DNA 并不裸露：每约 147 个碱基对缠绕组蛋白八聚体形成核小体，组蛋白富含赖氨酸和精氨酸。","vignette_title":"情景 3：为什么甲样品要热到 92℃","gidx":5,"gn":5,"anchor":"样品甲的 G+C 含量为 68%"},{"id":"gc12-02-1","ch":2,"part":1,"tag":"机制","stem":"阻遏蛋白 R 能识别 21 个碱基对的特异序列，这一识别的基础是","options":["两种片段的磷酸骨架所带电荷不同，静电作用因而不等","碱基对在大沟中排列的氢键供体与受体模式不同","两种片段的双螺旋直径不同，蛋白结合依赖螺旋的粗细","打乱顺序的片段柔性更大，更容易被蛋白诱导出弯曲","打乱顺序的片段碱基堆积更紧密，蛋白无法插入碱基之间"],"answer":1,"explain":"B 对：两段片段长度与碱基组成都相同，DNA 的磷酸骨架与螺旋形状也没有差别，唯一不同的是碱基排列顺序；蛋白质正是通过大沟中碱基对边缘的氢键供体与受体模式来区分序列。A 错在两种片段的骨架电荷没有差别。C 错在 B 型 DNA 的直径与序列无关，无法解释特异性。D 错在顺序打乱并不使片段柔性明显增大，不能解释它完全不结合。E 错在碱基堆积的紧密程度由碱基组成决定，而两者组成相同。","type":"A1","group":"c12-02","kind":"mechanism","chs":[2,10],"vignette":"某细菌的阻遏蛋白 R 识别启动子上游一段 21 个碱基对、富含 A-T 的回文序列，结合后关闭下游基因。足迹实验显示，结合使该区段不再被核酸酶切断；把其中第 5 位的 A-T 碱基对换成 G-C 对，结合随之消失，下游基因的转录提高约 8 倍；换用另一段长度相同、碱基组成也相同但顺序打乱的片段，阻遏蛋白 R 同样不结合。电镜观察到结合后该段 DNA 出现约 90 度的弯折。把含该序列的同一个质粒分别做成松弛型与负超螺旋型，结合实验测得的结合量后者是前者的 5 倍。该基因平时被包装得较为紧密，只在特定条件下才被打开。","vignette_title":"情景 2：21 个碱基对的回文序列","gidx":1,"gn":5,"anchor":"长度相同、碱基组成也相同但顺序打乱"},{"id":"gc12-02-2","ch":2,"part":1,"tag":"判读","stem":"只把第 5 位的 A-T 碱基对换成 G-C 对就失去结合，这一结果说明","options":["该蛋白识别的是 DNA 的长度，21 个碱基对少一个也无法结合","A-T 碱基对比 G-C 碱基对更稳定，替换后该段 DNA 发生解链","该蛋白结合的是 G-C 碱基对较少的区域，替换后该区段失去特异性","该蛋白的识别依赖特定碱基对的化学基团，而非整体形状","该蛋白识别的是磷酸骨架上的甲基，替换改变了甲基的排列"],"answer":3,"explain":"D 对：只换掉一个碱基对就失去结合，说明识别依赖特定碱基对在大沟中提供的化学基团，而不是螺旋的整体形状或片段长度。A 错在片段长度没有改变，仍是 21 个碱基对。B 错在 G-C 碱基对之间有三个氢键，比 A-T 碱基对更稳定，替换不会造成解链。C 错在替换只发生在特定位点，并不使整段变成非特异序列。E 错在甲基位于碱基上而不是磷酸骨架上，替换改变的是碱基的化学基团。","type":"A1","group":"c12-02","kind":"mechanism","chs":[2,10],"vignette":"某细菌的阻遏蛋白 R 识别启动子上游一段 21 个碱基对、富含 A-T 的回文序列，结合后关闭下游基因。足迹实验显示，结合使该区段不再被核酸酶切断；把其中第 5 位的 A-T 碱基对换成 G-C 对，结合随之消失，下游基因的转录提高约 8 倍；换用另一段长度相同、碱基组成也相同但顺序打乱的片段，阻遏蛋白 R 同样不结合。电镜观察到结合后该段 DNA 出现约 90 度的弯折。把含该序列的同一个质粒分别做成松弛型与负超螺旋型，结合实验测得的结合量后者是前者的 5 倍。该基因平时被包装得较为紧密，只在特定条件下才被打开。","vignette_title":"情景 2：21 个碱基对的回文序列","gidx":2,"gn":5,"anchor":"其中第 5 位的 A-T 碱基对换成 G-C 对"},{"id":"gc12-02-3","ch":2,"part":1,"tag":"机制","stem":"结合后该段 DNA 出现约 90 度的弯折，这种形变的意义是","options":["使 DNA 上的碱基对之间形成共价交联，结合更加牢固","使该段 DNA 的解链温度升高，转录因此受到抑制","使 DNA 上相距较远的位点靠近，便于蛋白之间的接触","使双螺旋由右手型局部转为左手型，碱基因而暴露","使组蛋白八聚体更易结合，染色质变得更加紧密"],"answer":2,"explain":"C 对：蛋白质结合诱导 DNA 弯曲，可使同一分子上原本相距较远的位点相互靠近，便于结合在该序列两侧的蛋白质之间发生接触，富含 A-T 的区段柔性较大，更容易被诱导弯曲。A 错在弯曲不涉及共价交联。B 错在该区段并未解链，解链温度也不会因弯曲而升高。D 错在弯曲不等于局部变成左手螺旋。E 错在本题讨论的是阻遏蛋白的结合，而不是染色质的包装状态。","type":"A1","group":"c12-02","kind":"mechanism","chs":[2,10],"vignette":"某细菌的阻遏蛋白 R 识别启动子上游一段 21 个碱基对、富含 A-T 的回文序列，结合后关闭下游基因。足迹实验显示，结合使该区段不再被核酸酶切断；把其中第 5 位的 A-T 碱基对换成 G-C 对，结合随之消失，下游基因的转录提高约 8 倍；换用另一段长度相同、碱基组成也相同但顺序打乱的片段，阻遏蛋白 R 同样不结合。电镜观察到结合后该段 DNA 出现约 90 度的弯折。把含该序列的同一个质粒分别做成松弛型与负超螺旋型，结合实验测得的结合量后者是前者的 5 倍。该基因平时被包装得较为紧密，只在特定条件下才被打开。","vignette_title":"情景 2：21 个碱基对的回文序列","gidx":3,"gn":5,"anchor":"该段 DNA 出现约 90 度的弯折"},{"id":"gc12-02-4","ch":2,"part":1,"tag":"机制","stem":"负超螺旋型的结合量是松弛型的 5 倍，合理的解释是","options":["负超螺旋使双螺旋处于欠旋状态，更易被解开或弯曲","负超螺旋使该段的碱基组成改变，出现了新的识别位点","负超螺旋使 DNA 分子变短，单位体积内的位点更多","负超螺旋使磷酸骨架的负电荷减少，静电排斥随之减弱","松弛型质粒已被核酸酶降解，结合量因而明显偏低"],"answer":0,"explain":"A 对：负超螺旋使双螺旋处于欠旋状态，局部更易被解开或弯曲，蛋白结合所要付出的形变代价因而减小，这与该序列富含 A-T、柔性较大相互吻合。B 错在超螺旋改变的是拓扑状态，不改变碱基序列与组成。C 错在质粒的碱基对数与分子长度不会因拓扑状态而改变。D 错在超螺旋并不减少磷酸骨架上的负电荷。E 错在两组实验用的是同一份质粒样品，不存在降解程度的差别。","type":"A1","group":"c12-02","kind":"mechanism","chs":[2,10],"vignette":"某细菌的阻遏蛋白 R 识别启动子上游一段 21 个碱基对、富含 A-T 的回文序列，结合后关闭下游基因。足迹实验显示，结合使该区段不再被核酸酶切断；把其中第 5 位的 A-T 碱基对换成 G-C 对，结合随之消失，下游基因的转录提高约 8 倍；换用另一段长度相同、碱基组成也相同但顺序打乱的片段，阻遏蛋白 R 同样不结合。电镜观察到结合后该段 DNA 出现约 90 度的弯折。把含该序列的同一个质粒分别做成松弛型与负超螺旋型，结合实验测得的结合量后者是前者的 5 倍。该基因平时被包装得较为紧密，只在特定条件下才被打开。","vignette_title":"情景 2：21 个碱基对的回文序列","gidx":4,"gn":5,"anchor":"结合量后者是前者的 5 倍"},{"id":"gc21-01-2","ch":2,"part":1,"tag":"识别","stem":"关于tRNA与氨基酸之间的连接方式，下列叙述正确的是","options":["氨基酸的羧基与tRNA3′端CCA末位腺苷酸的3′-羟基形成酯键","氨基酸的羧基与tRNA3′端CCA末位腺苷酸的5′-磷酸形成酯键","氨基酸的氨基与tRNA5′端CCA末位腺苷酸的5′-羟基形成肽键","氨基酸的羧基与tRNA反密码子环上第34位碱基形成氢键","氨基酸以糖苷键连在tRNA3′端CCA末位腺苷酸的碱基上"],"answer":0,"explain":"A 对：氨基酸经酯键连于tRNA3′端CCA末位腺苷酸的3′-羟基，这是氨基酸臂的标准连接方式。B 错：5′-磷酸不提供装载位点，该处的磷酸参与核苷酸间的磷酸二酯键。C 错：氨基不参与氨基酸与tRNA的连接，肽键是肽链中氨基酸之间的连接。D 错：反密码子环碱基参与的是与密码子的氢键配对，不用于装载氨基酸。E 错：糖苷键连接碱基与戊糖，与氨基酸的装载无关。","type":"A1","group":"c21-01","kind":"mechanism","chs":[2,21,20],"vignette":"体外翻译体系里有一类经典的「换头」实验。研究者先用¹⁴C标记半胱氨酸，由氨酰-tRNA合成酶把它接到识别半胱氨酸密码子UGU的那种tRNA上，得到Cys-tRNA；随后用镍催化剂把tRNA上这个半胱氨酸还原成丙氨酸，tRNA本身没有改动，它的反密码子仍然指向UGU。把这种带错货的tRNA与血红蛋白mRNA一起加入兔网状红细胞裂解物，新合成的肽链上，本该由半胱氨酸占据的位置出现了丙氨酸，其余位置的序列不变。氨基酸与核苷酸三联体之间并没有可供识别的化学联系，真正完成接头任务的是tRNA的双手：一端是反密码子环上的三个碱基，按反向平行方式与mRNA的密码子形成氢键；另一端是氨基酸臂3′端的CCA，末位腺苷酸的3′-羟基与氨基酸的羧基形成酯键，装载过程由氨酰-tRNA合成酶催化并消耗ATP。tRNA前体由RNA聚合酶Ⅲ转录，在核内加工成熟后才参与翻译。","vignette_title":"情景 1：氨基酸认不出自己的密码子","gidx":2,"gn":5,"anchor":"与氨基酸的羧基形成酯键"},{"id":"gc21-01-3","ch":2,"part":1,"tag":"机制","stem":"这种tRNA能把丙氨酸送到UGU的位置，起识别作用的结构是","options":["氨基酸臂上暴露的三个碱基，与密码子形成互补的氢键配对","DHU环上暴露的三个碱基，与密码子形成互补的氢键配对","TψC环上暴露的三个碱基，与密码子形成互补的氢键配对","反密码子环上暴露的七个碱基，与密码子逐一形成氢键配对","反密码子环上暴露的三个碱基，与密码子形成互补的氢键配对"],"answer":4,"explain":"E 对：反密码子环上的三个碱基以互补氢键识别密码子，这就是适配器的识别端。A 错：氨基酸臂末端的CCA负责携带氨基酸，不参与密码子识别。B 错：DHU环参与tRNA与合成酶及核糖体的相互识别，不直接读密码子。C 错：TψC环同样参与识别与核糖体结合，不是解码部位。D 错：反密码子环含七个碱基，但参与配对的只是其中三个，逐一配对不成立。","type":"A1","group":"c21-01","kind":"mechanism","chs":[2,21,20],"vignette":"体外翻译体系里有一类经典的「换头」实验。研究者先用¹⁴C标记半胱氨酸，由氨酰-tRNA合成酶把它接到识别半胱氨酸密码子UGU的那种tRNA上，得到Cys-tRNA；随后用镍催化剂把tRNA上这个半胱氨酸还原成丙氨酸，tRNA本身没有改动，它的反密码子仍然指向UGU。把这种带错货的tRNA与血红蛋白mRNA一起加入兔网状红细胞裂解物，新合成的肽链上，本该由半胱氨酸占据的位置出现了丙氨酸，其余位置的序列不变。氨基酸与核苷酸三联体之间并没有可供识别的化学联系，真正完成接头任务的是tRNA的双手：一端是反密码子环上的三个碱基，按反向平行方式与mRNA的密码子形成氢键；另一端是氨基酸臂3′端的CCA，末位腺苷酸的3′-羟基与氨基酸的羧基形成酯键，装载过程由氨酰-tRNA合成酶催化并消耗ATP。tRNA前体由RNA聚合酶Ⅲ转录，在核内加工成熟后才参与翻译。","vignette_title":"情景 1：氨基酸认不出自己的密码子","gidx":3,"gn":5,"anchor":"反密码子环上的三个碱基"},{"id":"gc21-02-2","ch":2,"part":1,"tag":"机制","stem":"摆动性允许配对不严格，却不会改变肽链的氨基酸序列，其原因是","options":["摆动配对发生在密码子第1位与反密码子第3位，与氨基酸的种类无关","摆动配对发生在密码子第3位与反密码子第1位，密码子前两位仍严格配对","摆动配对以共价键取代氢键，使配对不再受碱基互补规则的约束","摆动配对使密码子与反密码子改为同向平行结合，读出的仍是同一氨基酸","摆动配对由氨酰-tRNA合成酶事后校正，把错误的氨基酸水解后重装"],"answer":1,"explain":"B 对：摆动性指密码子第3位与反密码子第1位配对不严格，而密码子前两位仍严格互补，故读出的仍是同义密码子。A 错：两个位置写反了，密码子第1位与反密码子第3位不是摆动配对的位置。C 错：密码子与反密码子之间靠氢键配对，不是共价键。D 错：两者始终反向平行，改为同向平行则不成立。E 错：事后水解误载产物是合成酶编辑位点的作用，与摆动性无关。","type":"A1","group":"c21-02","kind":"mechanism","chs":[21,2,22],"vignette":"链霉素能结合大肠埃希菌核糖体的小亚基。在含链霉素的培养基中，该菌新合成的某酶在第210位出现了3种不同的氨基酸，其余位置的序列基本正确，测得整体错读率由10⁻⁴升到10⁻²。解码中心位于小亚基的rRNA上，正常情况下，只有密码子与反密码子正确配对，才会引发延伸因子所携GTP的水解，核糖体随之改变构象并接纳这个氨酰-tRNA；药物结合后这道关卡被削弱。细菌还有两重保险：氨酰-tRNA合成酶的编辑位点会水解误载的氨基酸；摆动性虽然允许密码子第3位与反密码子第1位配对不严格，读出的仍是同义密码子。对照实验中，同一浓度的药物处理人细胞后，细胞质中的掺入速率仍为对照的96%；而在细菌中，加药5分钟后即可见核糖体紧随RNA聚合酶附着在正在延长的转录本上，人细胞的核内则始终检测不到核糖体。","vignette_title":"情景 2：错读率从万分之一升到百分之一","gidx":2,"gn":5,"anchor":"读出的仍是同义密码子"},{"id":"gc21-04-2","ch":2,"part":1,"tag":"机制","stem":"依地酸处理后多聚核糖体峰消失并出现两个较小峰，这一结果说明","options":["核糖体两个亚基之间靠3′,5′-磷酸二酯键连接，被螯合剂水解后断开","多聚核糖体由mRNA与核糖体共价交联形成，螯合剂使这种交联键断裂","依地酸使mRNA降解为游离核苷酸，核糖体因此从模板上脱落下来","核糖体两个亚基之间靠Mg²⁺参与的非共价作用结合，螯合后即解离","依地酸抑制了起始因子的活性，使核糖体无法组装成有活性的单体"],"answer":3,"explain":"D 对：依地酸螯合Mg²⁺后，两个亚基之间依赖无机离子与氢键等非共价作用维持的结合被破坏，80S解离为60S与40S两个沉降较小的峰。A 错：亚基之间不是共价连接，磷酸二酯键存在于核苷酸之间。B 错：多聚核糖体由mRNA与多个核糖体以非共价方式组装，并非共价交联。C 错：依地酸螯合的是二价阳离子，不降解mRNA。E 错：出现核糖体亚基峰说明发生了亚基解离，而不是起始因子被抑制。","type":"A1","group":"c21-04","kind":"experiment","chs":[21,20,2],"vignette":"用兔网状红细胞裂解物搭一个体外翻译体系：每50 μL含裂解物20 μL、血红蛋白mRNA 0.5 μg（5′端带有m7G帽、3′端带多聚腺苷酸尾）、20种氨基酸各50 μmol/L（其中³H-亮氨酸1000 Bq）、ATP与GTP各1 mmol/L、MgCl₂ 2 mmol/L、KCl 100 mmol/L以及RNase抑制剂，37℃保温60分钟。取5 μL点于滤纸片，用10%三氯乙酸沉淀并洗涤后计放射性：全体系为24000 cpm，不加mRNA的对照为380 cpm。另取样品做蔗糖密度梯度离心，260 nm监测可见单体峰与多聚核糖体峰。加入放线菌酮100 μmol/L后放射性降到500 cpm，而多聚核糖体峰反高于对照、单体峰低于对照；加入25 mmol/L依地酸后放射性为300 cpm，多聚核糖体峰消失，出现两个沉降系数较小的峰；加入氯霉素400 μmol/L后放射性为22000 cpm。","vignette_title":"情景 4：梯度里那三个峰与三次计数","gidx":2,"gn":5,"anchor":"多聚核糖体峰消失"},{"id":"gc4-01-3","ch":2,"part":1,"tag":"机制","stem":"关于模板链的读取方向与新生链的延长方向，正确的是","options":["沿模板链 5′→3′ 方向读取，新生链按 3′→5′ 方向延长","沿模板链 5′→3′ 方向读取，新生链按 5′→3′ 方向延长","沿模板链 3′→5′ 方向读取，新生链按 5′→3′ 方向延长","沿模板链 3′→5′ 方向读取，新生链按 3′→5′ 方向延长","以模板链为引物，新生链从 5′-OH 端按 5′→3′ 方向延长"],"answer":2,"explain":"C 对：聚合酶只能把核苷酸加到游离的 3′-OH 上，新生链按 5′→3′ 方向延长，模板链就必须按 3′→5′ 方向被读取，两条反向平行。A、B 把读取方向写成 5′→3′，模板无法被正常读取；D 延长方向错了，链不能从 3′ 端生长；E 有两处错，模板链不能充当引物，新生链也不是从 5′-OH 端起延长。","type":"A1","group":"c4-01","kind":"mechanism","chs":[18,19,2],"vignette":"大肠埃希菌基因组约 4.6×10⁶ 个碱基对，按碱基配对规则复制一轮，最终留在子代 DNA 中的错误不足一个，碱基掺入的错误率低至十亿分之一。复制时 DNA 聚合酶Ⅲ把脱氧核苷酸加到新生链游离的 3′-OH 上，偶尔凑错的碱基会被聚合酶自身的 3′→5′ 外切酶活性切掉，再重新掺入正确的那一个，这一步使错误率下降约两个数量级。若错配核苷酸躲过校对，复制叉继续前进，子链上便留下一个错配。错配修复系统随后扫描新合成的链，识别尚未甲基化的那一股，切掉含错配的片段，再以母链为模板补齐缺口。若 MutS 等错配修复蛋白失活，突变率可升高上百倍。","vignette_title":"情景 1：一个错配碱基要过三道关卡","gidx":3,"gn":4,"anchor":"加到新生链游离的 3′-OH 上"},{"id":"gc7-01-5","ch":2,"part":1,"tag":"机制","stem":"关于从碱基损伤到克隆扩增的这条链条，下列判断正确的是（X 型多选）","options":["单碱基改变必然使该细胞 DNA 的紫外吸收峰偏移","修复失败时错误碱基经复制被固定为替换突变","该损伤的修复起始于糖苷酶切除碱基形成 AP 位点","8-氧代鸟嘌呤属于氧化性碱基损伤，可经修复清除","突变累积使细胞增殖加快并形成优势克隆"],"answer":[1,2,3,4],"explain":"答案 BCDE。D 对应情景中的氧化来源与氧化碱基；C 对应糖苷酶切碱基留 AP 位点；B 对应复制把错配固定成替换突变；E 对应点突变累积后 S 期比例升高、克隆形成率升高。A 错：紫外吸收来自碱基的共轭双键体系，单个碱基被修饰对整条 DNA 的 260 nm 吸收峰几乎没有影响，增色效应反映的是双螺旋解开的程度。","type":"X","group":"c7-01","kind":"mechanism","chs":[2,19,26],"vignette":"细胞在有氧代谢中不断产生活性氧。鸟嘌呤被氧化后变成 8-氧代鸟嘌呤，这种碱基的构象发生变化，不再与胞嘧啶配对，而是与腺嘌呤配对；若它出现在模板链上，复制时对侧就会掺入腺嘌呤，G-C 碱基对被替换成 T-A，形成一种难以回复的替换突变。细胞对此有专门的清除机制：由糖苷酶识别并切除这个氧化碱基，形成无碱基位点，再由后续酶补上正确的鸟嘌呤。若这套机制失灵，突变就会在基因组中逐代累积。某位患者结肠肿瘤组织测序发现 APC 与 KRAS 基因同时带有点突变，肿瘤细胞体积小、增殖快，克隆形成率明显高于正常肠上皮，流式检测显示其 G1 期细胞比例下降、S 期比例升高。","vignette_title":"情景 1：从一次氧化损伤到一群失控的细胞","gidx":5,"gn":5,"anchor":"克隆形成率明显高于正常肠上皮"},{"id":"gc7-02-2","ch":2,"part":1,"tag":"识别","stem":"胞嘧啶脱氨后仅由一个氢键数目变化被识别，该变化是","options":["产物与鸟嘌呤配对，氢键由 2 个减为 3 个","产物与腺嘌呤配对，氢键由 3 个减为 2 个","产物与腺嘌呤配对，氢键由 2 个减为 3 个","产物与胸腺嘧啶配对，氢键由 3 个减为 2 个","产物与鸟嘌呤配对，氢键由 3 个减为 2 个"],"answer":1,"explain":"B 对：胞嘧啶脱氨生成尿嘧啶，尿嘧啶仍与腺嘌呤配对，但 G-C 对有 3 个氢键、A-U 对只有 2 个，局部配对的氢键数目减少，双螺旋在该处稳定性下降。B、D 把配对对象换成鸟嘌呤，与情景中仍与腺嘌呤配对矛盾；C 把氢键数说成增加，方向相反；E 胸腺嘧啶是 DNA 的固有碱基，不是该脱氨产物。","type":"A1","group":"c7-02","kind":"mechanism","chs":[19,2],"vignette":"化疗药替莫唑胺属烷化剂，它把甲基加到鸟嘌呤的 O6 位上，生成 O6-甲基鸟嘌呤；这个碱基不再与胞嘧啶配对，转而与胸腺嘧啶配对，复制一次就留下 G-C 到 A-T 的替换。细胞里专门有位修补者 MGMT：它不切除碱基，而是把甲基直接搬到自身的一个半胱氨酸残基上，自身随之失活被降解。问题在于这套直接修复是定量消耗的，每修好一个损伤就少一分活性；当 O6-甲基鸟嘌呤的数目超过 MGMT 分子数时，剩余损伤只能由错配修复系统反复无效识别，最终走向凋亡。与此不同，胞嘧啶自发脱氨生成的尿嘧啶仍与腺嘌呤配对，只是把原来的 G-C 换成了 G-U；这类小损伤由糖苷酶切掉碱基、留下无碱基位点后补齐。临床上 MGMT 启动子甲基化的胶质瘤对替莫唑胺敏感，而 MGMT 高表达的肿瘤则明显耐药。","vignette_title":"情景 2：为什么同是 DNA 损伤，走的却是不同的修复路","gidx":2,"gn":5,"anchor":"仍与腺嘌呤配对"},{"ch":2,"part":1,"tag":"核苷酸组成","stem":"关于核苷酸与核酸分子组成的叙述，正确的是","options":["DNA 与 RNA 共有的碱基是腺嘌呤、鸟嘌呤和胞嘧啶，即 A、G、C 三种。","DNA 的戊糖是核糖，RNA 的戊糖是脱氧核糖，故二者的差别在戊糖种类。","稀有碱基主要存在于 DNA 分子中，故 DNA 的碱基种类多于 RNA。","核苷酸中的磷酸基团直接连接在碱基上，不参与形成骨架。","RNA 分子中只含 A、G、C、U 四种碱基，不含 T 与稀有碱基。"],"answer":0,"explain":"A 对：DNA 与 RNA 共有的碱基是腺嘌呤（A）、鸟嘌呤（G）与胞嘧啶（C），T 为 DNA 特有、U 为 RNA 特有。B 错在说反了：DNA 的戊糖是脱氧核糖，RNA 的戊糖才是核糖。C 错在稀有碱基（如假尿嘧啶、二氢尿嘧啶）主要存在于 tRNA 等 RNA 分子中，不是 DNA。D 错在核苷酸中磷酸与戊糖的羟基相连，并非直接连接在碱基上。E 错在 RNA 除 A、G、C、U 外还含多种稀有（修饰）碱基，tRNA 中含量最高。","type":"A1","id":"c2-3205779a"},{"ch":2,"part":1,"tag":"双螺旋","stem":"关于 B 型 DNA 双螺旋结构的叙述，正确的是","options":["两条多核苷酸链的方向相同，都从 5'端走向 3'端，故两条链相互平行。","碱基对位于螺旋的外侧，糖-磷酸骨架位于螺旋的内侧。","每圈螺旋含 10 对碱基，螺距约 3.4 nm，直径约 2 nm。","A-T 碱基对之间形成 3 个氢键，G-C 之间形成 2 个氢键。","碱基堆积力不利于双螺旋的稳定，双螺旋主要靠氢键维系。"],"answer":2,"explain":"C 对：B 型 DNA 每圈螺旋含 10 对碱基，螺距约 3.4 nm，直径约 2 nm。A 错在两条链反向平行，一条为 5'→3'、另一条为 3'→5'。B 错在糖-磷酸骨架位于螺旋外侧，碱基对位于内侧。D 错在 A-T 之间为 2 个氢键，G-C 之间才是 3 个氢键。E 错在碱基堆积力是稳定双螺旋的主要作用力之一，并非不利因素。","type":"A1","id":"c2-063a6c9a"},{"ch":2,"part":1,"tag":"DNA变性","stem":"关于 DNA 变性、复性与分子杂交的叙述，正确的是","options":["变性时 DNA 的磷酸二酯键断裂，生成大量短小的片段。","变性后 DNA 溶液对 260 nm 紫外光的吸收值反而降低。","复性速度与 DNA 分子的大小无关，只取决于溶液的离子强度。","DNA 的 Tm 值随 G+C 含量的增加而升高，碱基对越稳定。","分子杂交发生于两条 DNA 链之间，RNA 不能参与杂交。"],"answer":3,"explain":"D 对：G+C 含量越高，碱基对间氢键与堆积作用越强，DNA 的 Tm 值越高。A 错在变性只断裂碱基对之间的氢键，磷酸二酯键与一级结构完好。B 错在变性使碱基暴露，对 260 nm 紫外光的吸收升高（增色效应）而非降低。C 错在复性速度与分子大小、浓度、温度、离子强度均有关，分子越大复性越慢。E 错在 DNA 也能与 RNA 杂交形成 DNA-RNA 杂合链。","type":"A1","id":"c2-fd7cb556"},{"ch":2,"part":1,"tag":"mRNA结构","stem":"成熟真核 mRNA 在细胞质中相对稳定，其主要的保护性结构因素是","options":["5'端有 poly(A) 尾，3'端有 m7G 帽结构，可保护 mRNA。","5'端有 m7G 帽结构，3'端有 poly(A) 尾，可保护 mRNA。","分子为环状的双链结构，不易被细胞内的核酸外切酶识别与降解。","与组蛋白结合形成核小体结构，从而免受细胞内核酸酶的降解。","成熟 mRNA 的稳定性取决于其分子大小，与两端的结构无关。"],"answer":1,"explain":"B 对：5'端 m7G 帽结构可防止 5'端被核酸酶降解并参与翻译起始，3'端 poly(A) 尾可保护 3'端并参与核输出与稳定性调节。A 错在帽与尾的端位写反了。C 错在 mRNA 为单链线状分子，不是环状双链结构。D 错在与组蛋白结合形成核小体的是核 DNA，mRNA 不与组蛋白结合。E 错在 mRNA 的稳定性主要取决于两端的帽与尾结构，与其分子大小无直接关系。","type":"A1","id":"c2-a69b74bb"},{"ch":2,"part":1,"tag":"核小体","stem":"电镜下真核细胞染色质呈现串珠状结构，其分子基础是","options":["核小体核心颗粒由 H1、H2A、H2B、H3、H4 各 2 分子共同组成的十聚体核心颗粒。","核小体由 DNA 自身反复折叠形成，不与组蛋白结合，故其中不含碱性蛋白。","组蛋白 H1 位于核心颗粒八聚体的内部中央，起稳定核心颗粒构象的作用。","核小体是 DNA 的一级结构，即脱氧核苷酸的排列顺序及其连接方式。","核小体核心颗粒由 H2A、H2B、H3、H4 各 2 分子与约 146 bp DNA 组成。"],"answer":4,"explain":"E 对：核小体核心颗粒由 H2A、H2B、H3、H4 各 2 分子组成的组蛋白八聚体与约 146 bp DNA 缠绕构成，故电镜下呈串珠状。A 错在核心颗粒不含 H1，H1 结合在核心颗粒之外。B 错在核小体由 DNA 与组蛋白共同组成，组蛋白属碱性蛋白。C 错在 H1 位于 DNA 进出核心颗粒的部位，并不在八聚体内部。D 错在核小体是染色质的一级结构，DNA 的一级结构是核苷酸的排列顺序。","type":"A1","id":"c2-cf73e177"},{"ch":2,"part":1,"tag":"DNA与RNA","stem":"关于 DNA 与 RNA 在结构和功能上的比较，正确的是","options":["DNA 为双链，是遗传信息的储存者；某些病毒以 RNA 为遗传物质。","DNA 与 RNA 的碱基组成相同，都含有 A、G、C 与 T 四种碱基成分。","RNA 分子中不含稀有碱基，其分子内也不存在局部的双链区段。","DNA 分子中含有 2'-羟基，故其化学性质比 RNA 更加稳定。","RNA 不能参与遗传信息的传递和表达，其功能限于细胞结构的组成。"],"answer":0,"explain":"A 对：DNA 通常为双链、含脱氧核糖与 T，是遗传信息的储存者；某些病毒以 RNA 作为遗传物质。B 错在两类核酸的碱基组成不同，DNA 含 T，RNA 含 U。C 错在 RNA 含较多稀有碱基（tRNA 中最丰富），tRNA 与 rRNA 中还有局部双链区段。D 错在 2'-羟基存在于 RNA 的核糖上，DNA 的脱氧核糖无 2'-羟基。E 错在 mRNA 传递遗传信息，tRNA、rRNA 参与蛋白质合成，RNA 广泛参与遗传信息的传递与表达。","type":"A1","id":"c2-6af52dd0"},{"ch":2,"part":1,"tag":"核酸纯化","stem":"关于核酸的分离与纯化，正确的是","options":["酚-氯仿抽提蛋白质时，DNA 溶解在有机相中，而蛋白质留在水相中。","提取的总 RNA 中，rRNA 的含量最少，mRNA 的含量则最多。","碱变性法分离质粒 DNA 时，利用质粒 DNA 变性后不能复性的特点。","乙醇沉淀核酸时加乙酸钠等盐，可中和核酸的负电荷而促沉淀。","琼脂糖凝胶电泳中，DNA 分子越大则迁移越快，小分子迁移较慢。"],"answer":3,"explain":"D 对：加盐（如乙酸钠）可中和核酸磷酸基团的负电荷，削弱核酸分子与水的作用，使核酸在乙醇中沉淀析出。A 错在酚-氯仿抽提后 DNA 留在水相，变性蛋白质留在有机相或两相界面。B 错在总 RNA 中 rRNA 含量最多（约占 80%），mRNA 含量最少。C 错在碱变性法利用的是质粒 DNA 变性后能迅速复性，而染色体 DNA 难以复性。E 错在琼脂糖凝胶电泳中 DNA 分子越大受到的阻力越大，迁移越慢。","type":"A1","id":"c2-0aa7f0d0"},{"ch":2,"part":1,"tag":"分子杂交","stem":"关于核酸分子杂交及其应用的叙述，正确的是","options":["Southern 印迹检测 RNA，Northern 印迹检测 DNA。","分子杂交需在 0℃ 以下的低温中进行，温度升高会破坏碱基配对。","杂交的本质是变性后的互补碱基序列复性配对，可用于基因诊断。","探针只能是带放射性标记的双链 DNA，RNA 片段不能用作探针。","PCR 反应中引物与模板的碱基配对并非必要，DNA 聚合酶即可延伸。"],"answer":2,"explain":"C 对：分子杂交的本质是变性后的互补碱基序列复性配对形成杂合链，可用于基因定位与基因诊断。A 错在 Southern 印迹检测 DNA、Northern 印迹检测 RNA。B 错在杂交在一定的温度与离子强度下进行，并不需要 0℃ 以下的低温。D 错在探针可为 DNA 或 RNA、单链或双链，也可用非放射性标记。E 错在 PCR 中引物必须与模板互补配对，才能起始 DNA 的延伸。","type":"A1","id":"c2-fe1a95f0"},{"ch":2,"part":1,"tag":"核苷酸的连接方式","stem":"关于核苷酸之间连接方式的叙述，正确的是","options":["相邻核苷酸之间通过碱基与碱基之间的氢键相连，因此两条多核苷酸链方向相反。","相邻核苷酸通过前一个核苷酸的 3'-羟基与后一个的 5'-磷酸形成 3',5'-磷酸二酯键。","多核苷酸链的 5'端是指含有游离羟基的一端，而 3'端则含有游离的磷酸基团。","相邻核苷酸之间通过 2',5'-磷酸二酯键相连，由 2'位的羟基与磷酸基团成键。","磷酸二酯键是维系双螺旋结构稳定的主要作用力，碱基对则位于螺旋结构的内侧位置。"],"answer":1,"explain":"B 对：相邻核苷酸由前一个核苷酸的 3'-羟基与后一个核苷酸的 5'-磷酸脱水形成 3',5'-磷酸二酯键相连。A 错在核苷酸之间由磷酸二酯键（共价键）相连，碱基间氢键只出现在两条链之间。C 错在多核苷酸链的 5'端含游离磷酸基团，3'端含游离羟基。D 错在核酸中核苷酸之间是 3',5'-磷酸二酯键，2',5'-连接不属于正常连接方式。E 错在维系双螺旋的主要是碱基对间氢键与碱基堆积力，磷酸二酯键维系的是核苷酸之间的连接。","type":"A1","id":"c2-2479f7f1"},{"ch":2,"part":1,"tag":"Chargaff规则","stem":"某双链 DNA 分子的碱基组成为：A 占 30%，G 占 20%。下列叙述正确的是","options":["该 DNA 中 A 与 G 的摩尔数相等，二者各占碱基总数的 25%。","该 DNA 中 G 与 C 之和占总碱基的 20%，故 G 与 C 各占 10%。","该 DNA 中 A 与 U 的摩尔数相等，即 U 也占碱基总数的 30%。","该 DNA 的一条单链中 A+G 必定等于 T+C，两条链中也都必定如此。","该 DNA 中 A+G 与 T+C 的摩尔数相等，均占碱基总数的 50%。"],"answer":4,"explain":"E 对：双链 DNA 中 A=T、G=C，故 A+G 与 T+C 的摩尔数相等，各占碱基总数的 50%。A 错在题给 A 占 30%、G 占 20%，二者摩尔数并不相等。B 错在 G+C=20%+20%=40%，不是 20%。C 错在 DNA 中不含尿嘧啶 U。D 错在单链中 A+G 与 T+C 一般并不相等，A+G=T+C 只对双链整体成立。","type":"A1","id":"c2-abe9269f"},{"ch":2,"part":1,"tag":"DNA双螺旋结构与沟","stem":"B 型 DNA 的两条链围绕同一中心轴形成右手螺旋，螺旋表面形成大沟与小沟。其意义是","options":["大沟与小沟由每条单链自身反复折叠而形成，故每条链上各含一个大沟与一个小沟。","大沟与小沟由两条链之间的氢键直接构成，沟的内部并不暴露碱基的化学基团。","大沟与小沟是螺旋表面因碱基对与骨架的相对位置形成的凹槽，可供蛋白质识别。","碱基对恰好位于大沟或小沟的内侧，因此沟的内部没有可供识别的碱基边缘。","大沟与小沟仅存在于 Z 型 DNA 中，生理条件下的 B 型 DNA 表面则光滑无沟。"],"answer":2,"explain":"C 对：大沟（宽而深）与小沟（窄而浅）是螺旋表面因碱基对与糖-磷酸骨架的相对位置而形成的凹槽，沟内暴露碱基边缘的化学基团，是蛋白质等序列特异性识别 DNA 的结构基础。A 错在沟由两条链共同形成，不是每条单链自身折叠的产物。B 错在氢键位于双螺旋内部以连接两条链，不是沟的构成成分。D 错在碱基对位于螺旋内部，沟内仍暴露可供识别的碱基边缘。E 错在 Z 型 DNA 同样有沟，B 型 DNA 的大沟与小沟更为典型。","type":"A1","id":"c2-e0de8970"},{"ch":2,"part":1,"tag":"A-DNA与Z-DNA","stem":"关于 A 型、B 型与 Z 型 DNA 的比较，正确的是","options":["A 型 DNA 为右手螺旋，其碱基对倾斜于螺旋轴，低湿度时更易出现。","B 型 DNA 的碱基对倾斜于螺旋轴，每圈螺旋含有 11 对碱基。","Z 型 DNA 为右手螺旋，每圈螺旋含 12 对碱基，在高盐条件下稳定存在。","B 型 DNA 为左手螺旋，是生理条件下最常见、含量最多的构象。","A 型与 B 型 DNA 均为右手螺旋，其碱基对与螺旋轴的倾角完全相同。"],"answer":0,"explain":"A 对：A 型 DNA 为右手螺旋，碱基对倾斜于螺旋轴，在相对湿度较低时更易出现。B 错在 B 型 DNA 的碱基对近似垂直于螺旋轴，每圈含 10 对碱基，不是 11 对。C 错在 Z 型 DNA 为左手螺旋（每圈 12 对碱基、高盐条件下稳定）。D 错在 B 型 DNA 是右手螺旋，左手螺旋的是 Z 型 DNA。E 错在 A 型与 B 型虽均为右手螺旋，但碱基对的倾角明显不同。","type":"A1","id":"c2-d197020d"},{"ch":2,"part":1,"tag":"tRNA结构","stem":"关于 tRNA 结构与功能的叙述，正确的是","options":["tRNA 的二级结构为三叶草形，其 3'端为 CCA，氨基酸以酯键连于 3'-羟基。","tRNA 的氨基酸臂位于反密码子环处，其 5'端可携带活化的氨基酸残基。","反密码子环上含有 5 个碱基，可直接与 mRNA 的密码子之间以氢键互补配对。","tRNA 分子中不含有稀有碱基，故不能被特定的酶识别并装载氨基酸分子。","tRNA 分子的 5'端可携带活化的氨基酸，其 3'端含有游离的磷酸基团。"],"answer":0,"explain":"A 对：tRNA 二级结构呈三叶草形（三级结构呈倒 L 形），3'端为 CCA，活化的氨基酸以酯键连接于末端腺苷酸的 3'-羟基。B 错在氨基酸臂在 3'端 CCA 处，与反密码子环是两个不同部位。C 错在反密码子环由 7 个碱基构成，不是 5 个。D 错在 tRNA 含假尿嘧啶、二氢尿嘧啶等稀有碱基，其含量在各类 RNA 中最高。E 错在携带氨基酸的是 3'端 CCA 的 3'-羟基，不是 5'端。","type":"A1","id":"c2-86ba5244"},{"ch":2,"part":1,"tag":"核酶","stem":"关于核酶（ribozyme）的叙述，正确的是","options":["核酶是只存在于细胞核内的蛋白质类生物催化剂，可水解多种底物分子。","核酶是某些具有催化作用的一类 DNA 分子，其化学本质属于脱氧核糖核酸分子。","rRNA 起骨架作用而不直接参与催化反应，肽键的形成靠蛋白质酶完成。","核酶是某些具有催化作用的 RNA，如 rRNA 可催化肽键形成，也能自我剪接。","细胞内的各种催化反应由蛋白质酶完成，RNA 不具有催化肽键的活性。"],"answer":3,"explain":"D 对：核酶是某些具有催化活性的 RNA 分子，如 rRNA 的肽基转移酶中心可催化肽键形成，某些内含子 RNA 可自我剪接。A 错在核酶的本质是 RNA 而不是蛋白质，也不局限于细胞核内。B 错在核酶的化学本质是核糖核酸，不是脱氧核糖核酸。C 错在 rRNA 不只起骨架作用，其肽基转移酶中心本身就是具有催化活性的核酶。E 错在 RNA 具有催化活性，并非细胞内所有催化反应都由蛋白质酶完成。","type":"A1","id":"c2-22649e2b"},{"ch":2,"part":1,"tag":"增色效应","stem":"关于“增色效应”的叙述，正确的是","options":["DNA 变性后对 260 nm 紫外光的吸收值降低，称为增色效应。","DNA 变性后对 260 nm 紫外光的吸收值升高，称为增色效应。","增色效应源于变性时碱基的紫外吸收特性发生了根本性的改变。","增色效应指变性时磷酸二酯键断裂，生成大量游离的核苷酸分子。","增色效应只在蛋白质发生变性时出现，与核酸分子的变性没有任何关系。"],"answer":1,"explain":"B 对：DNA 变性后双螺旋解开、碱基由堆积状态转为暴露状态，对 260 nm 紫外光的吸收值升高，称为增色效应。A 错在变性后吸收值是升高而不是降低。C 错在增色效应源于碱基从堆积状态暴露，碱基自身的紫外吸收特性并未改变。D 错在变性只断裂碱基对间的氢键，不涉及磷酸二酯键断裂与游离核苷酸产生。E 错在增色效应是核酸变性的特征现象，与蛋白质变性无关。","type":"A1","id":"c2-2d042cc3"},{"ch":2,"part":1,"tag":"核酸分离分析技术","stem":"关于核酸分离与分析技术的叙述，正确的是","options":["超速离心法可用于分离蛋白质，但不能用于分离 DNA 分子。","琼脂糖凝胶电泳中，不带电荷的 DNA 分子才能进入凝胶内部进行分离。","荧光原位杂交需先将染色体 DNA 变性，再与标记探针杂交定位序列。","琼脂糖凝胶电泳中，超螺旋质粒 DNA 的迁移速率慢于开环构象的质粒。","分子杂交只能用于溶液中的游离核酸，不能用于组织切片与染色体标本。"],"answer":2,"explain":"C 对：荧光原位杂交（FISH）需先将染色体或切片上的 DNA 变性解离，再与标记探针杂交，从而对特定核酸序列进行细胞定位。A 错在超速离心法（如密度梯度离心）也可用于分离 DNA。B 错在琼脂糖凝胶电泳中 DNA 带负电荷，向正极移动进入凝胶。D 错在超螺旋构象致密，迁移速率快于同分子量的开环构象。E 错在分子杂交既可用于溶液中的游离核酸，也可用于组织切片与染色体标本。","type":"A1","id":"c2-9cd74f8d"},{"ch":2,"part":1,"tag":"综合·变性与复性","stem":"关于 DNA 的变性、复性与增色效应，下列叙述正确的是（X 型多选）","options":["变性只破坏碱基对之间的氢键，不涉及磷酸二酯键的断裂。","变性后碱基由堆积状态转为暴露状态，A260 值升高即增色效应。","复性速度与 DNA 分子的大小无关，仅取决于溶液的离子强度。","Tm 值随 G+C 含量的增加而升高，G+C 越多双螺旋越稳定。","A260 值升高是碱基吸收特性改变所致，与碱基暴露程度无关。"],"answer":[0,1,3],"explain":"答案 ABD。A 对：变性只破坏碱基对之间的氢键，磷酸二酯键与一级结构不受影响。B 对：变性使碱基由堆积状态转为暴露状态，260 nm 吸收值升高即增色效应。C 错在复性速度与 DNA 分子大小（复杂度）、浓度、温度、离子强度均有关，分子越大复性越慢。D 对：Tm 值随 G+C 含量增加而升高，G+C 越多双螺旋越稳定。E 错在增色效应源于碱基从堆积状态暴露，碱基自身的吸收特性并未改变。","type":"X","id":"c2-b6b28baf"},{"ch":2,"part":1,"tag":"综合·杂交与印迹","stem":"关于核酸分子杂交与印迹技术，下列叙述正确的是（X 型多选）","options":["Southern 印迹检测 DNA，Northern 印迹检测 RNA。","杂交的本质是变性后的互补碱基序列复性配对，可用于基因诊断。","探针只能采用放射性标记的双链 DNA，RNA 片段不能用作探针。","FISH 将染色体或切片上的核酸变性后与标记探针杂交，可定位序列。","杂交发生于 DNA 与 DNA 之间，DNA 与 RNA 不能形成杂合双链。"],"answer":[0,1,3],"explain":"答案 ABD。A 对：Southern 印迹检测 DNA，Northern 印迹检测 RNA。B 对：杂交的本质是变性后的互补碱基序列复性配对，可用于基因定位与基因诊断。C 错在探针可为 DNA 或 RNA、单链或双链，也可采用非放射性标记。D 对：FISH 将染色体或切片上的核酸变性后与标记探针杂交，实现序列的细胞定位。E 错在杂交不限于 DNA-DNA，DNA 与 RNA 也能形成杂合双链。","type":"X","id":"c2-5fdc4ef6"},{"ch":2,"part":1,"tag":"综合·组成与连接","stem":"关于核酸的组成与核苷酸的连接方式，下列叙述正确的是（X 型多选）","options":["核苷酸由碱基、戊糖与磷酸三种成分组成，其中的戊糖为五碳糖。","相邻核苷酸通过 3',5'-磷酸二酯键相连，由 3'-羟基与 5'-磷酸形成。","多核苷酸链的 5'端含游离羟基，3'端含游离磷酸，书写方向为 3'→5'。","双链 DNA 中 A 与 T 的摩尔数相等，G 与 C 的摩尔数也相等。","DNA 中戊糖的 2'位均含羟基，而 RNA 中戊糖的 2'位不含羟基。"],"answer":[0,1,3],"explain":"答案 ABD。A 对：核苷酸由碱基、戊糖（核糖或脱氧核糖，均为五碳糖）与磷酸三种成分组成。B 对：相邻核苷酸由 3'-羟基与 5'-磷酸形成 3',5'-磷酸二酯键相连。C 错在多核苷酸链的 5'端含游离磷酸、3'端含游离羟基，书写方向为 5'→3'。D 对：双链 DNA 中 A 与 T、G 与 C 的摩尔数分别相等（Chargaff 规则）。E 错在 2'-羟基存在于 RNA 的核糖上，DNA 的脱氧核糖 2'位无羟基。","type":"X","id":"c2-00e5e617"},{"id":"gc0-01-1","ch":3,"part":1,"tag":"机制","stem":"α1-AT 抑制弹性蛋白酶的方式属于","options":["可逆竞争性抑制，与底物竞争酶的活性中心","可逆非竞争性抑制，结合在酶活性中心以外的部位","变构激活，使酶构象稳定并提高其催化效率","反竞争性抑制，只与酶-底物复合物结合后使其失活","不可逆抑制，与酶形成稳定的共价复合物"],"answer":4,"explain":"E 对：情景已给出关键描述——二者形成不可逆的共价复合物、酶被永久锁死。A、B、D 均为可逆抑制（稀释或透析后活性可恢复），与永久锁死矛盾；E 是激活而非抑制，方向相反。","type":"A1","group":"c0-01","kind":"mechanism","chs":[1,3,7],"vignette":"血浆中有一种叫 α1-抗胰蛋白酶（α1-AT）的蛋白，由肝细胞合成后分泌入血，专门看住中性粒细胞释放的弹性蛋白酶——两者构成一对平衡：蛋白酶负责清理受损组织，抗蛋白酶负责不让它把肺组织一并拆掉。α1-AT 属 serpin 家族，它的反应中心环像一个诱饵：被弹性蛋白酶识别切割后，二者形成不可逆的共价复合物，酶被永久锁死。部分人的 SERPINA1 基因带 Z 型突变（第 342 位谷氨酸变为赖氨酸），突变蛋白仍能合成，却在肝细胞内质网中折叠错误、彼此聚合而无法分泌，血浆 α1-AT 因此只剩正常的 10%–15%。这类人常在三四十岁出现肺气肿，一部分还会发生肝硬化。","vignette_title":"情景 1：当「看门人」自己出不了门","gidx":1,"gn":4,"anchor":"形成不可逆的共价复合物"},{"id":"gc0-01-3","ch":3,"part":1,"tag":"判读","stem":"血浆 α1-AT 降低会导致肺气肿，其机制是","options":["免疫复合物沉积于肺泡壁，引起慢性炎症与纤维化","弹性蛋白合成受抑制，肺泡壁张力下降并相互融合","弹性蛋白酶合成减少，肺内弹性纤维得不到正常更新","α1-AT 在肺泡内沉积，直接破坏肺泡壁的细胞结构","弹性蛋白酶失去抑制，肺组织弹性蛋白被过度分解"],"answer":4,"explain":"E 对：平衡被打破的方向是蛋白酶相对过强——α1-AT 减少使弹性蛋白酶活性失控，肺泡壁弹性蛋白被降解，肺泡融合成肺气肿。B 把方向写反；D 错在 α1-AT 恰恰分泌不出去、不在肺泡沉积；D 是另一条致病途径，非本例机制；B 错在弹性蛋白合成并非主要矛盾。","type":"A1","group":"c0-01","kind":"mechanism","chs":[1,3,7],"vignette":"血浆中有一种叫 α1-抗胰蛋白酶（α1-AT）的蛋白，由肝细胞合成后分泌入血，专门看住中性粒细胞释放的弹性蛋白酶——两者构成一对平衡：蛋白酶负责清理受损组织，抗蛋白酶负责不让它把肺组织一并拆掉。α1-AT 属 serpin 家族，它的反应中心环像一个诱饵：被弹性蛋白酶识别切割后，二者形成不可逆的共价复合物，酶被永久锁死。部分人的 SERPINA1 基因带 Z 型突变（第 342 位谷氨酸变为赖氨酸），突变蛋白仍能合成，却在肝细胞内质网中折叠错误、彼此聚合而无法分泌，血浆 α1-AT 因此只剩正常的 10%–15%。这类人常在三四十岁出现肺气肿，一部分还会发生肝硬化。","vignette_title":"情景 1：当「看门人」自己出不了门","gidx":3,"gn":4,"anchor":"抗蛋白酶负责不让它把肺组织一并拆掉"},{"id":"gc0-03-2","ch":3,"part":1,"tag":"方案","stem":"他要最快区分「变性失活」还是「被蛋白酶降解失活」，最该做的是","options":["作 SDS-PAGE，比较条带位置与分子量是否改变","测 280 nm 吸光度，看溶液中总蛋白量是否明显减少","加底物后测反应初速度，看活性能否自行回升","用圆二色谱测定 α-螺旋含量是否明显下降","用双缩脲反应测定肽键数目是否发生变化"],"answer":0,"explain":"A 对：SDS-PAGE 直接看分子量——条带位置不变提示变性失活，出现更小条带提示被降解。B 蛋白总量在两种情况下都可能减少（沉淀、吸附）；C 变性通常不可逆，活性不回升不能排除降解；D 双缩脲只反映肽键总量，降解后仍有大量肽键；E 二级结构下降在两种情况下都会出现。","type":"A1","group":"c0-03","kind":"experiment","chs":[1,3],"vignette":"周五晚 10 点，研究生小周终于把酶纯化完。他把装着酶溶液的离心管往实验台上一搁，心想明天再测活，就锁门走了——忘了放进 4℃ 冰箱。周六早 9 点，他回到实验室测活性：只剩 8%。他盯着那管原本澄清的溶液，发现里面浮着一点絮状物。这时他想起导师说过的一句话：这种酶活性中心附近有个关键半胱氨酸。","vignette_title":"情景 3：一夜之后只剩 8% 的活性","gidx":2,"gn":4,"anchor":"测活性：只剩 8%"},{"id":"gc0-03-3","ch":3,"part":1,"tag":"机制","stem":"若加入 β-巯基乙醇后活性部分恢复，最合理的解释是","options":["失活源于肽键水解，还原剂可使断键重新连接","失活过程涉及二硫键的错误氧化，还原剂可部分挽回","失活源于亚基解聚，还原剂可促进亚基重新聚合","失活源于辅基丢失，还原剂可代替辅基起作用","失活源于氨基酸突变，还原剂可修复突变的残基"],"answer":1,"explain":"B 对：导师的提示是伏笔——暴露的巯基在空气中被氧化，与另一巯基形成非天然二硫键或发生错配，构象改变而失活；β-巯基乙醇还原二硫键后构象部分恢复，故活性部分回升。B 还原剂不能重建肽键；C 不能替代辅基；D 亚基聚合靠非共价作用，与还原剂无关；E 还原剂不能修复突变。","type":"A1","group":"c0-03","kind":"experiment","chs":[1,3],"vignette":"周五晚 10 点，研究生小周终于把酶纯化完。他把装着酶溶液的离心管往实验台上一搁，心想明天再测活，就锁门走了——忘了放进 4℃ 冰箱。周六早 9 点，他回到实验室测活性：只剩 8%。他盯着那管原本澄清的溶液，发现里面浮着一点絮状物。这时他想起导师说过的一句话：这种酶活性中心附近有个关键半胱氨酸。","vignette_title":"情景 3：一夜之后只剩 8% 的活性","gidx":3,"gn":4,"anchor":"活性中心附近有个关键半胱氨酸"},{"id":"gc1-01-1","ch":3,"part":1,"tag":"机制","stem":"药物 X 对该脱氢酶的抑制作用属于","options":["变构激活，抑制剂使酶与底物的结合变得更容易","竞争性抑制，抑制剂与底物竞争同一个结合部位","不可逆抑制，抑制剂与酶形成稳定的共价结合物","非竞争性抑制，抑制剂结合在活性中心以外的部位","反竞争性抑制，抑制剂与酶和底物的复合物结合"],"answer":1,"explain":"B 对：Km 增大而 Vmax 不变是竞争性抑制的典型动力学特征，情景又给出 X 与底物同带羧基、占据同一个结合口袋，正是竞争同一部位的结构基础。B 非竞争性抑制的 Km 不变、Vmax 下降；C 反竞争性抑制使 Km 与 Vmax 同时减小；D 不可逆抑制减少有活性的酶量，表现为 Vmax 降低；E 方向相反，变构激活应使底物结合更容易、活性升高而不是被抑制。","type":"A1","group":"c1-01","kind":"mechanism","chs":[3,1],"vignette":"某实验室用一种从肝组织纯化的脱氢酶筛选新合成的候选药物 X。在 pH 7.4、25℃ 条件下测定反应初速度：不加 X 时米氏常数 Km 为 0.50 mmol/L，最大反应速度 Vmax 为 100 U/mg；加入 2.0 mmol/L 的 X 后，Km 升到 2.0 mmol/L，而 Vmax 仍为 100 U/mg。比较结构发现，X 与底物都带有一个羧基，二者能占据酶分子表面同一个结合底物的口袋。同一批酶液在 60℃ 水浴中放置 10 分钟后活性完全丧失，冷却到 25℃ 再测仍不回升，但用抗体检出蛋白还在，肽键含量也没有减少。","vignette_title":"情景 1：Km 涨了四倍，Vmax 却纹丝不动","gidx":1,"gn":5,"anchor":"二者能占据酶分子表面同一个结合底物的口袋"},{"id":"gc1-01-2","ch":3,"part":1,"tag":"判读","stem":"在该抑制剂存在下，Km 由 0.50 升到 2.0 mmol/L，直接说明","options":["底物与酶的结合由可逆转为不可逆，产物不再解离","酶对底物的表观亲和力不变，催化能力上限下降","酶对底物的表观亲和力下降，催化能力上限升高","酶对底物的表观亲和力升高，催化能力上限不变","酶对底物的表观亲和力下降，催化能力上限不变"],"answer":4,"explain":"E 对：Km 是达到最大速度一半时所需的底物浓度，Km 增大意味着表观亲和力下降；Vmax 仍是 100 U/mg，说明酶的量和催化上限都没变。B 把 Km 变化的含义说反了；C 若是 Vmax 下降，应考虑非竞争性抑制或不可逆抑制；D 与情景中 Vmax 仍为 100 U/mg 直接矛盾；E 结合是否可逆要看有无共价修饰，Km 增大推不出结合不可逆。","type":"A1","group":"c1-01","kind":"mechanism","chs":[3,1],"vignette":"某实验室用一种从肝组织纯化的脱氢酶筛选新合成的候选药物 X。在 pH 7.4、25℃ 条件下测定反应初速度：不加 X 时米氏常数 Km 为 0.50 mmol/L，最大反应速度 Vmax 为 100 U/mg；加入 2.0 mmol/L 的 X 后，Km 升到 2.0 mmol/L，而 Vmax 仍为 100 U/mg。比较结构发现，X 与底物都带有一个羧基，二者能占据酶分子表面同一个结合底物的口袋。同一批酶液在 60℃ 水浴中放置 10 分钟后活性完全丧失，冷却到 25℃ 再测仍不回升，但用抗体检出蛋白还在，肽键含量也没有减少。","vignette_title":"情景 1：Km 涨了四倍，Vmax 却纹丝不动","gidx":2,"gn":5,"anchor":"Km 升到 2.0 mmol/L"},{"id":"gc1-01-4","ch":3,"part":1,"tag":"方案","stem":"若要区分该抑制属于竞争性还是非竞争性，最关键的实验设计是","options":["固定抑制剂浓度，改变底物浓度作双倒数图，看交点位置","把反应温度升到60℃后加抑制剂，观察抑制是否仍存在","固定底物浓度，把抑制剂浓度提高十倍后再测初速度","用电泳比较加入抑制剂前后酶的分子量变化","用透析法把抑制剂去除，再测定酶的活性是否回升"],"answer":0,"explain":"A 对：竞争性抑制时增大底物浓度可把抑制剂竞争下去，双倒数图中各直线交于纵轴一点，表现为 Vmax 不变、Km 增大；非竞争性抑制则交于横轴。B 只测一个底物浓度下的速度，无从判断抑制类型；C 透析只能说明抑制是否可逆，不能区分竞争性与非竞争性；D 该抑制剂不形成共价结合，分子量不会改变；E 高温使酶本身变性，结果无法归因于抑制剂。","type":"A1","group":"c1-01","kind":"mechanism","chs":[3,1],"vignette":"某实验室用一种从肝组织纯化的脱氢酶筛选新合成的候选药物 X。在 pH 7.4、25℃ 条件下测定反应初速度：不加 X 时米氏常数 Km 为 0.50 mmol/L，最大反应速度 Vmax 为 100 U/mg；加入 2.0 mmol/L 的 X 后，Km 升到 2.0 mmol/L，而 Vmax 仍为 100 U/mg。比较结构发现，X 与底物都带有一个羧基，二者能占据酶分子表面同一个结合底物的口袋。同一批酶液在 60℃ 水浴中放置 10 分钟后活性完全丧失，冷却到 25℃ 再测仍不回升，但用抗体检出蛋白还在，肽键含量也没有减少。","vignette_title":"情景 1：Km 涨了四倍，Vmax 却纹丝不动","gidx":4,"gn":5,"anchor":"加入 2.0 mmol/L 的 X 后"},{"id":"gc1-01-5","ch":3,"part":1,"tag":"机制","stem":"关于该脱氢酶及其抑制剂，下列判断正确的是（X 型多选）","options":["该酶失活是肽键水解、一级结构被破坏所致","60℃ 处理后活性不回升，提示酶已变性","增大底物浓度可以削弱 X 对该酶的抑制","X 与底物结构相似，因而能占据同一个结合部位","Km 增大而 Vmax 不变，符合竞争性抑制"],"answer":[1,2,3,4],"explain":"答案 BCDE。C、D、E 分别对应结构基础、竞争性抑制的可逆性、双倒数特征；B 对：加热失活后冷却不回升、抗体仍能检出蛋白，说明空间构象被破坏而一级结构完好，属变性。A 错：变性只破坏次级键，肽键并没有被水解，情景已给出肽键含量没有减少。","type":"X","group":"c1-01","kind":"mechanism","chs":[3,1],"vignette":"某实验室用一种从肝组织纯化的脱氢酶筛选新合成的候选药物 X。在 pH 7.4、25℃ 条件下测定反应初速度：不加 X 时米氏常数 Km 为 0.50 mmol/L，最大反应速度 Vmax 为 100 U/mg；加入 2.0 mmol/L 的 X 后，Km 升到 2.0 mmol/L，而 Vmax 仍为 100 U/mg。比较结构发现，X 与底物都带有一个羧基，二者能占据酶分子表面同一个结合底物的口袋。同一批酶液在 60℃ 水浴中放置 10 分钟后活性完全丧失，冷却到 25℃ 再测仍不回升，但用抗体检出蛋白还在，肽键含量也没有减少。","vignette_title":"情景 1：Km 涨了四倍，Vmax 却纹丝不动","gidx":5,"gn":5,"anchor":"60℃ 水浴中放置 10 分钟"},{"id":"gc1-02-4","ch":3,"part":1,"tag":"识别","stem":"情景中「把调节部位与结合部位分开」的调节方式，在酶学上属于","options":["竞争性抑制，调节物与底物竞争同一个活性中心","变构调节，调节物结合在活性中心以外的部位","酶原激活，切除一段肽链后暴露活性中心","反馈抑制，产物增多后直接占据酶的活性中心","共价修饰调节，通过磷酸化改变酶的结构"],"answer":1,"explain":"B 对：调节物与底物结合在酶的不同部位、靠构象改变传递效应，正是变构（别构）调节的定义，血红蛋白是典型的变构蛋白。B 共价修饰涉及磷酸化等共价改变，情景只描述非共价结合；C 酶原激活靠切除肽段，与调节部位无关；D 竞争性抑制中抑制剂与底物争夺同一部位，与部位分开正好相反；E 反馈抑制说的是调节的生理逻辑，其作用部位仍须是变构部位而非活性中心。","type":"A1","group":"c1-02","kind":"mechanism","chs":[1,3],"vignette":"血红蛋白由 2 条 α 链和 2 条 β 链组成，每条链含 1 个血红素；肌红蛋白只有 1 条链和 1 个血红素。把两者的氧饱和度对氧分压作图，肌红蛋白得到一条双曲线，血红蛋白得到 S 形曲线。血红蛋白的 4 个亚基之间靠盐桥等非共价键维持一种对氧亲和力低的紧张态，第 1 个氧分子结合后这些盐桥逐次断裂，亚基之间发生相对转动，其余亚基对氧的亲和力随之升高。红细胞内的 2,3-二磷酸甘油酸结合在两条 β 链之间的中央孔，使紧张态更稳定；剧烈运动时肌肉局部 pH 由 7.4 降到 7.2，血红蛋白的曲线相应右移。这种把调节部位与结合部位分开的调节方式，在代谢途径的关键酶上同样存在。","vignette_title":"情景 2：一条 S 形曲线的来历","gidx":4,"gn":5,"anchor":"把调节部位与结合部位分开"},{"id":"gc1-02-5","ch":3,"part":1,"tag":"判读","stem":"关于血红蛋白与变构酶的变构调节，下列判断正确的是（X 型多选）","options":["变构调节通过改变酶的空间构象来改变活性","变构调节需要磷酸化修饰并消耗一分子 ATP","变构剂结合的部位不是底物结合的部位","变构剂与酶之间形成稳定的共价键","变构酶的动力学曲线常呈 S 形而非双曲线"],"answer":[0,2,4],"explain":"答案 ACE。A、B、C 是变构调节的三条要点：结合部位与活性中心分开、靠构象改变传递效应、动力学曲线呈 S 形且不服从典型米氏方程。B 错：磷酸化属于共价修饰调节，与变构调节是两种不同的调节方式，情景中也没有 ATP 消耗的信息；D 错：变构剂与酶之间靠非共价键结合，可逆且不形成共价键。","type":"X","group":"c1-02","kind":"mechanism","chs":[1,3],"vignette":"血红蛋白由 2 条 α 链和 2 条 β 链组成，每条链含 1 个血红素；肌红蛋白只有 1 条链和 1 个血红素。把两者的氧饱和度对氧分压作图，肌红蛋白得到一条双曲线，血红蛋白得到 S 形曲线。血红蛋白的 4 个亚基之间靠盐桥等非共价键维持一种对氧亲和力低的紧张态，第 1 个氧分子结合后这些盐桥逐次断裂，亚基之间发生相对转动，其余亚基对氧的亲和力随之升高。红细胞内的 2,3-二磷酸甘油酸结合在两条 β 链之间的中央孔，使紧张态更稳定；剧烈运动时肌肉局部 pH 由 7.4 降到 7.2，血红蛋白的曲线相应右移。这种把调节部位与结合部位分开的调节方式，在代谢途径的关键酶上同样存在。","vignette_title":"情景 2：一条 S 形曲线的来历","gidx":5,"gn":5,"anchor":"在代谢途径的关键酶上同样存在"},{"id":"gc1-04-3","ch":3,"part":1,"tag":"判读","stem":"该组分的比活力由 25 U/mg 提高到 250 U/mg，说明","options":["该酶的总活性提高了约10倍，回收率随之提高","该酶对底物的 Km 下降了约10倍，亲和力升高","单位质量蛋白质中目标酶的含量提高了约10倍","单位质量蛋白质中目标酶的含量提高了约100倍","该酶催化反应的转换数提高了约10倍"],"answer":2,"explain":"C 对：比活力是单位质量蛋白质所含的酶活力，纯化使它提高约 10 倍，说明杂蛋白被大量去除、目标酶在总蛋白中的比例升高。B 数量级算错，250 与 25 相差 10 倍而不是 100 倍；C 转换数是酶本身的催化常数，纯化不会改变它；D 比活力与总活性是两个独立指标，纯化过程中总活性通常下降；E Km 反映酶对底物的亲和力，纯化不改变它。","type":"A1","group":"c1-04","kind":"experiment","chs":[1,3,7],"vignette":"小陈要纯化一种由培养细胞分泌到培养液中的酶。他先把培养液浓缩，做硫酸铵分级沉淀，再上凝胶过滤柱，收集活性最高的洗脱峰；该峰在 SDS-聚丙烯酰胺凝胶电泳上出现 2 条带，分子量为 40 kDa 和 60 kDa；用 β-巯基乙醇还原后，2 条带的位置都不变。他接着用离子交换层析，把含 40 kDa 条带的组分单独收集并测活：该组分的比活力为 250 U/mg，而最初粗提液的比活力为 25 U/mg。让他不解的是，这个组分的凝胶过滤洗脱体积对应的分子量是 160 kDa，与电泳结果对不上。","vignette_title":"情景 4：160 kDa 与 40 kDa 对不上","gidx":3,"gn":5,"anchor":"该组分的比活力为 250 U/mg"},{"id":"gc12-03-1","ch":3,"part":1,"tag":"机制","stem":"底物的酯键与进攻的水分子被固定在相邻位置上，这一效应的作用是","options":["酶提高了体系温度，使分子的运动速度加快而更易反应","邻近与定向效应提高有效碰撞概率，减小反应熵变","酶使底物的肽键断裂，生成活性更高的中间产物","酶把底物包埋在疏水口袋中，阻断了水分子进入活性中心","酶降低了产物的自由能，使反应的平衡点向产物方向移动"],"answer":1,"explain":"B 对：酶把底物的酯键与进攻的水分子固定在相邻位置上，减少了反应所需的熵损失、提高了有效碰撞的概率，属于邻近与定向效应，这是酶提高催化效率的重要来源。A 错在酶并不提高体系温度，反应在恒定温度下进行。C 错在这是一步酯键水解反应，并没有肽键断裂或共价中间产物。D 错在若阻断水分子进入，酯键反而无法被水解。E 错在酶只加快达到平衡的速度，不改变反应的平衡点。","type":"A1","group":"c12-03","kind":"mechanism","chs":[3,1],"vignette":"一种从细菌中纯化的水解酶催化酯键水解。测活得到：转换数为 100 次每秒，Km 为 0.1 mmol/L，二者之比约为 10⁶ L·mol⁻¹·s⁻¹。晶体结构显示，活性中心位于一个疏水裂隙中：一个谷氨酸残基与一个组氨酸残基组成电荷中继网络，能向底物的酯键提供一个质子；底物的酯键与进攻的水分子被两个精氨酸残基固定在相邻位置上，相距不到 0.3 nm。用一种与反应过渡态结构相似的化合物做抑制剂，其解离常数为 0.01 μmol/L，而底物的 Km 为 100 μmol/L，两者相差约一万倍。该酶与底物的结合依靠氢键与离子键，结合后底物构象只发生轻微改变。","vignette_title":"情景 3：一万倍之差","gidx":1,"gn":5,"anchor":"被两个精氨酸残基固定在相邻位置上"},{"id":"gc12-03-2","ch":3,"part":1,"tag":"识别","stem":"谷氨酸与组氨酸残基组成电荷中继网络并向底物提供质子，这属于","options":["邻近与定向效应，把两个底物基团固定在相邻位置","共价催化，酶与底物暂时形成不稳定的共价中间产物","酸碱催化，通过质子的转移降低反应的活化能","表面效应，酶为底物提供了疏水的反应微环境","过渡态互补，活性中心与过渡态在结构上相互契合"],"answer":2,"explain":"C 对：谷氨酸与组氨酸残基通过质子的给予与接受来稳定过渡态、降低反应活化能，这是典型的酸碱催化。A 错在邻近与定向效应描述的是把底物基团固定在相邻位置，与质子转移无关。B 错在共价催化要形成暂时性的共价中间产物，情景中没有这样的证据。D 错在疏水微环境属于表面效应，本题问的是电荷中继网络转移质子的作用。E 错在过渡态互补说的是活性中心与过渡态在结构上契合，与质子转移不是同一机制。","type":"A1","group":"c12-03","kind":"mechanism","chs":[3,1],"vignette":"一种从细菌中纯化的水解酶催化酯键水解。测活得到：转换数为 100 次每秒，Km 为 0.1 mmol/L，二者之比约为 10⁶ L·mol⁻¹·s⁻¹。晶体结构显示，活性中心位于一个疏水裂隙中：一个谷氨酸残基与一个组氨酸残基组成电荷中继网络，能向底物的酯键提供一个质子；底物的酯键与进攻的水分子被两个精氨酸残基固定在相邻位置上，相距不到 0.3 nm。用一种与反应过渡态结构相似的化合物做抑制剂，其解离常数为 0.01 μmol/L，而底物的 Km 为 100 μmol/L，两者相差约一万倍。该酶与底物的结合依靠氢键与离子键，结合后底物构象只发生轻微改变。","vignette_title":"情景 3：一万倍之差","gidx":2,"gn":5,"anchor":"一个组氨酸残基组成电荷中继网络"},{"id":"gc12-03-3","ch":3,"part":1,"tag":"判读","stem":"过渡态类似物的解离常数为 0.01 μmol/L，比底物的 Km 小约一万倍，说明","options":["酶对底物的亲和力高于对过渡态的亲和力，二者相差一万倍","过渡态类似物是酶的不可逆抑制剂，与酶形成了共价键","底物与过渡态类似物的结构相同，因而结合在同一个部位","该化合物通过降低底物浓度减慢反应，属于竞争性抑制","酶与过渡态结构互补，因而对过渡态的亲和力远高于底物"],"answer":4,"explain":"E 对：解离常数远小于底物的 Km，说明酶与过渡态的结合比与底物的结合牢固得多，活性中心对过渡态在结构上互补，这正是酶降低活化能的核心机制。A 错在方向相反，酶对过渡态的亲和力更高。B 错在解离常数小只说明结合牢固，并不表示形成了共价键。C 错在过渡态类似物与底物结构相似但并不相同，两个常数相差一万倍正说明结合部位对二者的亲和力不同。D 错在该化合物直接与酶结合，并不是通过降低底物浓度发挥作用。","type":"A1","group":"c12-03","kind":"mechanism","chs":[3,1],"vignette":"一种从细菌中纯化的水解酶催化酯键水解。测活得到：转换数为 100 次每秒，Km 为 0.1 mmol/L，二者之比约为 10⁶ L·mol⁻¹·s⁻¹。晶体结构显示，活性中心位于一个疏水裂隙中：一个谷氨酸残基与一个组氨酸残基组成电荷中继网络，能向底物的酯键提供一个质子；底物的酯键与进攻的水分子被两个精氨酸残基固定在相邻位置上，相距不到 0.3 nm。用一种与反应过渡态结构相似的化合物做抑制剂，其解离常数为 0.01 μmol/L，而底物的 Km 为 100 μmol/L，两者相差约一万倍。该酶与底物的结合依靠氢键与离子键，结合后底物构象只发生轻微改变。","vignette_title":"情景 3：一万倍之差","gidx":3,"gn":5,"anchor":"用一种与反应过渡态结构相似的化合物"},{"id":"gc12-03-4","ch":3,"part":1,"tag":"识别","stem":"转换数与 Km 之比约为 10⁶ L·mol⁻¹·s⁻¹，这一比值反映的是","options":["酶在底物浓度很低时的催化效率，可作为酶的性能指标","酶在底物
