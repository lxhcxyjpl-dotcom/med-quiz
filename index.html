合酶加上尾，这一步不需要模板。随后剪接体识别内含子 5′ 端的 GU 与 3′ 端的 AG，经两次转酯反应把内含子以套索形式切除，并把相邻外显子连接起来。某基因第 2 内含子 5′ 端的 GU 突变为 AU，患者成熟 mRNA 中该内含子被完整保留。","vignette_title":"情景 3：一个 GU 变成 AU 之后","gidx":3,"gn":5,"anchor":"5′ 端的 GU 突变为 AU"},{"id":"gc4-03-5","ch":20,"part":4,"tag":"机制","stem":"关于该基因从转录到成熟 mRNA 的过程，下列判断正确的是（X 型多选）","options":["内含子的 5′ 端为 GU、3′ 端为 AG，由剪接体识别","5′ 帽在转录开始不久加上，与翻译起始识别有关","RNA 聚合酶Ⅱ以模板链为模板，合成方向为 5′→3′","剪接位点突变后，细胞只能靠 RNA 编辑予以修复","剪接经两次转酯反应，内含子以套索形式被切除"],"answer":[0,1,2,4],"explain":"答案 ABCE。C 对：转录沿模板链按碱基互补规则进行，RNA 合成方向为 5′→3′。B 对：5′ 帽在转录开始不久即加上，是翻译起始识别与 mRNA 稳定的基础。A 对：GU-AG 规则是剪接体识别内含子边界的依据，5′ 端突变即本例病因。E 对：剪接通过两次转酯反应完成，内含子以套索形式被切除。D 错：剪接位点属于顺式元件，突变存在于 DNA 上，RNA 编辑通常不能把它改回可识别的位点，这种表述过于绝对。","type":"X","group":"c4-03","kind":"mechanism","chs":[20,21],"vignette":"真核生物编码蛋白质的基因由外显子与内含子交替排列组成。转录时，RNA 聚合酶Ⅱ以模板链为模板、按碱基互补规则合成 pre-mRNA，合成方向为 5′→3′，因此 RNA 的序列与编码链一致（只是 U 取代 T），而与模板链互补且反向平行。转录开始不久，pre-mRNA 的 5′ 端就加上 7-甲基鸟苷帽；转录终止后，3′ 端在 AAUAAA 信号下游约 10–20 个核苷酸处被切开，再由多聚腺苷酸聚合酶加上尾，这一步不需要模板。随后剪接体识别内含子 5′ 端的 GU 与 3′ 端的 AG，经两次转酯反应把内含子以套索形式切除，并把相邻外显子连接起来。某基因第 2 内含子 5′ 端的 GU 突变为 AU，患者成熟 mRNA 中该内含子被完整保留。","vignette_title":"情景 3：一个 GU 变成 AU 之后","gidx":5,"gn":5,"anchor":"把内含子以套索形式切除"},{"id":"gc4-04-3","ch":20,"part":4,"tag":"机制","stem":"加入利福平后 lac mRNA 也几乎检测不到，说明利福平","options":["抑制核糖体的肽基转移酶，使 mRNA 不能被翻译","抑制细菌 RNA 聚合酶的转录终止，使 mRNA 不能释放","抑制细菌 DNA 聚合酶的催化活性，使模板不能被复制","结合启动子 DNA，使 RNA 聚合酶不能识别终止子序列","抑制细菌 RNA 聚合酶的转录起始，使 mRNA 不能合成"],"answer":4,"explain":"E 对：利福平专一抑制细菌 RNA 聚合酶的转录起始，转录不能启动，lac mRNA 与酶都测不到，这正是第三组所见。A 若只抑制终止，mRNA 会合成但不能释放，与检测不到矛盾；B 作用对象是 DNA 聚合酶，与 mRNA 水平下降不对应；C 把结合位点与终止子混为一谈；E 是氯霉素一类翻译抑制剂的作用，与本题药物错位。","type":"A1","group":"c4-04","kind":"experiment","chs":[22,20,21],"vignette":"研究大肠埃希菌乳糖利用调控的研究生做了三组实验。第一组把同一菌株分别培养在三种培养基中，测定 β-半乳糖苷酶活性：乳糖加葡萄糖组为 8 U，只加乳糖组为 420 U，只加葡萄糖组为 5 U。第二组用乳糖操纵子的阻遏蛋白与含操纵基因序列的 DNA 探针做 EMSA：不加乳糖时出现蛋白与 DNA 的结合条带，体系中加入乳糖后该条带消失。第三组在只加乳糖的培养物中分别加入两种抑制剂：加入利福平后，lac mRNA 与 β-半乳糖苷酶都几乎检测不到；加入氯霉素后，lac mRNA 仍持续合成，而 β-半乳糖苷酶几乎为零。","vignette_title":"情景 4：三组培养基与两种抑制剂","gidx":3,"gn":5,"anchor":"lac mRNA 与 β-半乳糖苷酶都"},{"id":"gc9-01-3","ch":20,"part":4,"tag":"机制","stem":"红系祖细胞中该基因转录起始效率高，其转录起始的特点是","options":["增强子位于启动子的下游时才有起始活性","增强子结合的反式因子与起始复合物相互作用","启动子的 TATA 盒被 RNA 聚合酶 II 直接识别","该基因以 DNA 的两条链同时作为模板起始转录","启动子先被核糖体识别并组装翻译起始复合物"],"answer":1,"explain":"B 对：情景显示该位点富集 GATA-1，即增强子结合的特异反式因子与启动子上组装的起始复合物相互作用，提高转录起始频率。C 错：真核 RNA 聚合酶 II 不能直接识别 TATA 盒，需先由 TFIID 的 TATA 结合蛋白识别。E 错：核糖体参与的是翻译起始，与启动子没有关系。D 错：转录属不对称转录，只以一条链为模板，不存在两条链同时作模板。A 错：增强子的位置与方向都不固定，位于启动子下游同样能提高起始活性。","type":"A1","group":"c9-01","kind":"mechanism","chs":[22,27,20],"vignette":"从同一份骨髓样本中分选出红系祖细胞与粒系祖细胞，在同一培养条件下同步培养。两者的核型正常，STR 分型一致，全基因组测序未发现序列差异。检测显示：红系祖细胞中 β-珠蛋白基因启动子上游的增强子区组蛋白 H3 乙酰化水平很高，GATA-1 在该区富集，该基因 mRNA 占总 mRNA 的 30%；粒系祖细胞中同一区域 DNA 甲基化程度高、乙酰化水平很低，GATA-1 几乎不结合，该基因 mRNA 不足 1%。两细胞内 RNA 聚合酶 II 的总量、TATA 结合蛋白的水平以及通用转录因子的种类并无差别。","vignette_title":"情景 1：同一份基因组，两套表达程序","gidx":3,"gn":5,"anchor":"通用转录因子的种类并无差别"},{"ch":20,"part":4,"tag":"RNA聚合酶","stem":"关于真核生物三种RNA聚合酶的转录产物，下列叙述正确的是","options":["RNA聚合酶I转录mRNA前体","RNA聚合酶II转录45S rRNA前体","RNA聚合酶III转录mRNA和大多数snRNA","三种RNA聚合酶均可直接结合启动子启动转录","RNA聚合酶I转录45S rRNA前体，RNA聚合酶II转录mRNA前体等，RNA聚合酶III转录tRNA、5S rRNA和U6 snRNA"],"answer":4,"explain":"Pol I负责45S rRNA前体，Pol II负责mRNA前体及多数snRNA，Pol III负责tRNA、5S rRNA与U6 snRNA。","type":"A1","id":"c20-9c28f213"},{"ch":20,"part":4,"tag":"σ因子","stem":"关于大肠埃希菌RNA聚合酶sigma因子的作用，下列叙述正确的是","options":["sigma因子与核心酶结合成全酶，负责识别启动子并启动转录，起始后即与核心酶解离","sigma因子具有催化磷酸二酯键形成的活性，是聚合酶的催化中心","sigma因子全程结合核心酶，负责转录的终止","sigma因子可与启动子DNA序列直接互补配对并充当引物","sigma因子只在真核细胞中存在，原核生物无sigma因子"],"answer":0,"explain":"原核全酶由核心酶加sigma因子组成，sigma因子识别启动子（-10与-35区）启动转录，起始后即解离，由核心酶继续延长。","type":"A1","id":"c20-147dc56b"},{"ch":20,"part":4,"tag":"通用转录因子","stem":"真核生物RNA聚合酶II起始转录时，首先识别TATA盒的因子是","options":["sigma因子","TFIID中的TATA结合蛋白（TBP）","转录因子TFIIB","rho（Rho）因子","TFIIH的解旋酶亚基"],"answer":1,"explain":"真核Pol II不能直接结合启动子，先由TFIID的TBP识别TATA盒，再依次组装其他通用转录因子形成起始复合物；sigma因子与Rho因子是原核成分。","type":"A1","id":"c20-0811c6d4"},{"ch":20,"part":4,"tag":"转录特性","stem":"关于转录作用的特点，下列叙述正确的是","options":["转录需要引物提供3'-OH，与DNA复制相同","转录以DNA两条链同时为模板，故称对称转录","转录沿模板链5'到3'方向移动，产物RNA沿3'到5'方向延长","转录不需要引物，RNA聚合酶可从头起始；只以DNA双链中的一条链为模板，属不对称转录","转录产物与模板链序列完全相同，只是T被U取代"],"answer":3,"explain":"RNA聚合酶不需引物可从头起始，沿模板3'到5'移动合成5'到3'的RNA；模板链只有一条，产物序列与编码链（非模板链）一致。","type":"A1","id":"c20-3f8de228"},{"ch":20,"part":4,"tag":"加帽加尾","stem":"关于真核mRNA的5'帽与3'多聚腺苷酸（polyA）尾，下列叙述正确的是","options":["5'帽通过普通3',5'-磷酸二酯键连接于mRNA的5'端","polyA尾由RNA聚合酶II在AAUAAA序列处直接延伸合成，长度固定不变","5'帽（m7G）在转录早期即加上，可保护mRNA免受降解并参与翻译起始识别；polyA尾加于3'端切割位点，有助于稳定性和翻译效率","5'帽和polyA尾均在翻译完成后才加上","只有rRNA和tRNA才需要5'帽和polyA尾"],"answer":2,"explain":"5'帽为m7G经5',5'-三磷酸连接，转录早期即加上，参与稳定与翻译起始识别；polyA尾由polyA聚合酶加于切割位点，长约200 nt。","type":"A1","id":"c20-345ed6dd"},{"ch":20,"part":4,"tag":"剪接","stem":"关于真核生物pre-mRNA的剪接，下列叙述正确的是","options":["剪接体由多种snRNP组成，内含子5'端为GU、3'端为AG，切除的内含子形成套索结构","剪接由限制性内切酶催化，按GU-AG规则水解内含子","剪接发生在翻译之后，故成熟mRNA中仍保留内含子","内含子的5'端为AG、3'端为GU，剪接后内含子以线性形式释放","剪接过程不消耗能量，也不需要分支点腺苷酸参与"],"answer":0,"explain":"剪接体（U1、U2、U4与U6、U5等snRNP）识别内含子5'端GU与3'端AG，经两次转酯反应切除内含子，分支点A形成套索结构。","type":"A1","id":"c20-ee599cb3"},{"ch":20,"part":4,"tag":"RNA编辑","stem":"关于RNA编辑，下列叙述正确的是","options":["RNA编辑指转录过程中RNA聚合酶掺入错误核苷酸，属于DNA损伤","小肠载脂蛋白B（ApoB）mRNA发生C到U编辑生成提前终止密码，翻译出较短的ApoB-48","RNA编辑只能改变个别碱基，不能插入或删除核苷酸","RNA编辑发生在DNA水平，会改变基因组序列","RNA编辑只存在于原核生物，真核生物不存在"],"answer":1,"explain":"RNA编辑是转录后加工方式之一，包括碱基替换与核苷酸插入或删除；小肠ApoB mRNA经C到U编辑产生终止密码子，翻译出ApoB-48。","type":"A1","id":"c20-035cac8b"},{"ch":20,"part":4,"tag":"RNA复制","stem":"关于RNA病毒的RNA复制，下列叙述正确的是","options":["由宿主细胞的DNA聚合酶催化合成RNA","以DNA为模板，由RNA聚合酶催化合成RNA","所有RNA病毒均通过逆转录酶完成基因组复制","由RNA依赖的RNA聚合酶（RdRp）催化，以RNA为模板合成RNA；逆转录病毒不通过此方式复制","RNA复制严格遵守半保留复制规则，产物为RNA-DNA杂交双链"],"answer":3,"explain":"除逆转录病毒外，RNA病毒以RNA依赖的RNA聚合酶（RdRp）复制RNA；逆转录病毒先逆转录为DNA并整合入宿主基因组，再转录出子代RNA。","type":"A1","id":"c20-cd9fc764"},{"ch":20,"part":4,"tag":"启动子","stem":"关于原核启动子与真核启动子元件的结构，下列叙述正确的是","options":["大肠埃希菌启动子的-10区（Pribnow盒）共有序列为TATAAT、富含AT，-35区共有序列为TTGACA，两者的间距会影响转录起始效率","真核生物所有基因的启动子都含有TATA盒","原核启动子的-10区富含GC，不易解链","真核启动子中的CAAT盒与GC盒位于转录起始位点下游","启动子位于转录区内部，其序列改变不影响转录"],"answer":0,"explain":"-10区TATAAT与-35区TTGACA是原核启动子的共有序列，富含AT易解链，两者间距决定起始效率；真核启动子元件更为多样。","type":"A1","id":"c20-669333b4"},{"ch":20,"part":4,"tag":"转录终止","stem":"关于转录的终止，下列叙述正确的是","options":["大肠埃希菌所有基因的转录终止都需要ρ因子参与","ρ因子通过催化磷酸二酯键水解使RNA链缩短而终止转录","不依赖ρ因子的终止子转录出富含GC的反向重复序列，形成发夹结构，其后的polyU序列使聚合酶暂停并解离；依赖ρ因子的终止则需要ρ因子的解旋酶（ATP酶）活性","真核mRNA的转录终止与polyA加尾信号无关","发夹结构的形成促进RNA聚合酶继续延长转录"],"answer":2,"explain":"发夹结构加polyU序列使聚合酶暂停、转录泡解离，属不依赖ρ因子的终止；ρ因子具解旋酶活性，参与另一类终止。","type":"A1","id":"c20-fd581ae3"},{"ch":20,"part":4,"tag":"转录因子","stem":"关于转录因子及其作用方式，下列叙述正确的是","options":["通用转录因子决定基因表达的组织特异性","通用转录因子参与所有Pol II基因的起始组装，特异转录因子决定基因表达的组织与时空特异性；转录因子多为反式作用因子，通过锌指、螺旋-转角-螺旋、亮氨酸拉链等结构域识别顺式作用元件","顺式作用元件是编码转录因子的基因，反式作用因子是DNA序列","所有转录因子都必须直接结合DNA才能发挥作用","转录因子只在转录终止阶段发挥作用"],"answer":1,"explain":"通用转录因子为所有Pol II基因起始所需，特异转录因子决定时空特异性；反式作用因子经DNA结合结构域或蛋白互作调控顺式元件。","type":"A1","id":"c20-3ad0856c"},{"ch":20,"part":4,"tag":"tRNA加工","stem":"关于tRNA前体的转录后加工，下列叙述正确的是","options":["tRNA前体的加工由剪接体完成","tRNA前体5'端的前导序列由DNA聚合酶切除","成熟tRNA的3'端为CCC序列","RNase P切除tRNA前体5'端的前导序列（其RNA亚基具有催化活性），3'端由核苷酸转移酶加上CCA，部分碱基被修饰为假尿苷、二氢尿苷等","tRNA前体不需加工即以成熟形式参与翻译"],"answer":3,"explain":"RNase P切除5'端前导序列、3'端加上CCA、碱基修饰与内含子切除共同完成tRNA成熟；RNase P的RNA亚基即为核酶。","type":"A1","id":"c20-5766252e"},{"ch":20,"part":4,"tag":"可变剪接","stem":"关于真核pre-mRNA的可变剪接，下列叙述正确的是","options":["可变剪接改变的是DNA上的剪接位点序列","可变剪接只能通过外显子跳跃这一种方式实现","可变剪接产生的mRNA序列相同，只是翻译效率不同","所有组织中的剪接方式完全一致，故一个基因只产生一种mRNA","同一pre-mRNA可通过选择不同的剪接位点、外显子跳跃或内含子保留等方式产生多种mRNA，剪接方式具有组织与发育阶段特异性，是蛋白质多样性的重要来源"],"answer":4,"explain":"可变剪接在转录后水平选择不同的外显子组合，产生多种mRNA与蛋白质，常具有组织与发育阶段特异性。","type":"A1","id":"c20-5e65339f"},{"ch":20,"part":4,"tag":"CTD","stem":"关于真核RNA聚合酶II最大亚基的C端结构域（CTD），下列叙述正确的是","options":["CTD由Tyr-Ser-Pro-Thr-Ser-Pro-Ser七肽重复序列构成，其Ser5磷酸化与转录起始及5'加帽偶联，Ser2磷酸化则与转录延长、剪接和加尾偶联","CTD由七肽重复序列构成，其磷酸化对转录过程没有影响","CTD位于RNA聚合酶I和RNA聚合酶III的最大亚基上","CTD的磷酸化使聚合酶丧失与加帽酶结合的能力","CTD属于DNA结合结构域，直接识别TATA盒"],"answer":0,"explain":"Pol II的CTD以七肽重复序列为基础，经Ser5、Ser2磷酸化修饰作为招募平台，实现转录与加帽、剪接、加尾的偶联。","type":"A1","id":"c20-492f7053"},{"ch":20,"part":4,"tag":"转录抑制剂","stem":"关于转录抑制剂的作用靶点，下列叙述正确的是","options":["利福平特异性抑制真核生物RNA聚合酶II","α-鹅膏蕈碱在低浓度即可抑制细菌RNA聚合酶","α-鹅膏蕈碱低浓度特异性抑制真核RNA聚合酶II；利福平结合细菌RNA聚合酶β亚基抑制转录；放线菌素D嵌入DNA双螺旋而阻碍转录延伸","嘌呤霉素通过抑制转录起始而抑制蛋白质合成","放线菌素D只抑制翻译，不影响转录"],"answer":2,"explain":"α-鹅膏蕈碱抑制真核Pol II，利福平抑制细菌RNA聚合酶，放线菌素D嵌入DNA阻断转录延伸；嘌呤霉素作用于翻译阶段。","type":"A1","id":"c20-f47b2714"},{"ch":20,"part":4,"tag":"自我剪接","stem":"关于具有催化活性的RNA（核酶）与自我剪接内含子，下列叙述正确的是","options":["I类内含子的剪接必须由snRNP组成的剪接体催化","I类内含子的自我剪接以游离鸟苷酸为辅助因子，经两次转酯反应完成，不需要剪接体与ATP；II类内含子的自我剪接则形成套索状中间体","核酶的本质是蛋白质，其催化活性依赖蛋白酶","核酶催化的反应均需ATP水解供能","II类内含子的自我剪接不产生套索结构"],"answer":1,"explain":"I类内含子以游离鸟苷酸起始、经两次转酯反应完成自剪接；II类内含子自剪接形成套索；核酶是具有催化活性的RNA。","type":"A1","id":"c20-a8eabf20"},{"id":"gc12-01-2","ch":21,"part":4,"tag":"识别","stem":"质谱显示该肽段由 1452 Da 变为 1532 Da，说明它发生了","options":["甲基化修饰，相对分子质量增加 80 Da","乙酰化修饰，相对分子质量增加 80 Da","磷酸化修饰，相对分子质量增加 80 Da","羟基化修饰，相对分子质量增加 80 Da","糖基化修饰，相对分子质量增加 80 Da"],"answer":2,"explain":"C 对：1452 Da 与 1532 Da 相差 80 Da，正好是一个磷酸基团的相对质量，与磷酸酶处理能去掉该修饰相互印证。A 错在甲基化只增加约 14 Da。B 错在乙酰化约增加 42 Da。D 错在羟基化约增加 16 Da。E 错在接上一条糖链会增加数百道尔顿，远大于 80 Da。把质量差与修饰类型对应起来，是质谱鉴定修饰位点的基本思路。","type":"A1","group":"c12-01","kind":"mechanism","chs":[1,21,7],"vignette":"细胞因子刺激 15 分钟后，研究者提取一种分子量为 45 kDa 的调节蛋白做双向电泳：第一向按等电点分离，第二向按分子量分离。未刺激的细胞只在等电点 6.8 处出现一个斑点；刺激后出现的三个斑点落在同一条分子量水平线上，等电点依次为 6.5、6.2 与 5.9。把刺激后的样品先经蛋白磷酸酶处理，这三个斑点又并回 6.8 处的那一个斑点。质谱分析显示，刺激后该蛋白的一个胰蛋白酶肽段由 1452 Da 变为 1532 Da。同一细胞分泌的另一种蛋白按氨基酸序列推算为 22 kDa，在 SDS-聚丙烯酰胺凝胶电泳上却在 32 kDa 处显带，用切除 N-连接糖链的糖苷酶处理后该条带回到 22 kDa，这条糖链的加工需要两种细胞器先后参与。","vignette_title":"情景 1：一个斑点变成三个斑点","gidx":2,"gn":5,"anchor":"刺激后该蛋白的一个胰蛋白酶肽段"},{"id":"gc12-01-5","ch":21,"part":4,"tag":"判读","stem":"关于该蛋白的翻译后修饰与鉴定，下列判断正确的是（X 型多选）","options":["磷酸化使该蛋白在电泳中向正极移动的速率加快","磷酸酶处理后斑点回到原位，说明该修饰可以逆转","同一分子量上出现三个斑点，说明细胞合成了三种蛋白","每加上一个磷酸基团，肽段的相对分子质量约增加 80 Da","N-连接糖链连接在天冬酰胺残基的酰胺氮原子上"],"answer":[0,1,3,4],"explain":"答案 ABDE。A 对：磷酸化使分子净负电荷增多，在 pH 7.4 的电泳中向正极移动更快。B 对：磷酸酶水解磷酸酯键后斑点回到 6.8 处，说明该修饰可以被逆转，属可逆的共价修饰。D 对：一个磷酸基团使肽段质量增加约 80 Da，与质谱数据吻合。E 对：N-连接糖链结合在天冬酰胺残基的酰胺氮上。C 错：三个斑点是同一蛋白的不同磷酸化形式，并不是三种不同的蛋白。","type":"X","group":"c12-01","kind":"mechanism","chs":[1,21,7],"vignette":"细胞因子刺激 15 分钟后，研究者提取一种分子量为 45 kDa 的调节蛋白做双向电泳：第一向按等电点分离，第二向按分子量分离。未刺激的细胞只在等电点 6.8 处出现一个斑点；刺激后出现的三个斑点落在同一条分子量水平线上，等电点依次为 6.5、6.2 与 5.9。把刺激后的样品先经蛋白磷酸酶处理，这三个斑点又并回 6.8 处的那一个斑点。质谱分析显示，刺激后该蛋白的一个胰蛋白酶肽段由 1452 Da 变为 1532 Da。同一细胞分泌的另一种蛋白按氨基酸序列推算为 22 kDa，在 SDS-聚丙烯酰胺凝胶电泳上却在 32 kDa 处显带，用切除 N-连接糖链的糖苷酶处理后该条带回到 22 kDa，这条糖链的加工需要两种细胞器先后参与。","vignette_title":"情景 1：一个斑点变成三个斑点","gidx":5,"gn":5,"anchor":"切除 N-连接糖链的糖苷酶处理"},{"id":"gc15-03-1","ch":21,"part":4,"tag":"机制","stem":"白喉毒素A链使肽链延长中断，其直接作用的分子是","options":["原核细胞的延伸因子EF-G，被修饰后无法催化移位","核糖体大亚基的肽基转移酶中心，使肽键不能形成","氨酰-tRNA合成酶，使氨基酸无法与tRNA连接","真核细胞的延伸因子eEF2，被修饰后丧失活性","真核细胞的翻译起始因子，使起始复合物无法装配"],"answer":3,"explain":"D 对：情景已给出A链催化的是真核延伸因子eEF2的ADP-核糖基化，被修饰的eEF2失活后肽链延长中断，因此毒素直接作用的分子是eEF2。A 错：EF-G是原核细胞的延伸因子，白喉毒素作用的却是真核细胞的翻译机器，靶点被偷换。B 错：肽基转移酶中心由大亚基的rRNA构成，催化的成肽步骤并不是ADP-核糖基化的靶点。C 错：氨酰-tRNA合成酶负责氨基酸的活化与连接，与毒素的作用位点无关。E 错：起始因子参与起始复合物的装配，而毒素阻断的是延长阶段。","type":"A1","group":"c15-03","kind":"mechanism","chs":[21,22],"vignette":"白喉棒状杆菌在咽部繁殖并分泌白喉毒素。毒素由A、B两条肽链经二硫键相连：B链结合细胞表面的受体并介导A链进入细胞质，A链催化真核延伸因子eEF2的ADP-核糖基化修饰；被修饰的eEF2失活，核糖体循环卡在同一位置，肽链延长由此中断，心肌与周围神经细胞受损尤为明显。实验室里用体外翻译体系比较几种药物：加入四环素时氨酰-tRNA进不了核糖体A位，加入链霉素时出现大量氨基酸序列错误的短肽，加入嘌呤霉素时肽链提前释放。白喉患儿除注射抗毒素外，还需使用抑制细菌蛋白质合成的抗生素。","vignette_title":"情景 3：一个二硫键连着两处损伤","gidx":1,"gn":5,"anchor":"真核延伸因子eEF2"},{"id":"gc15-03-2","ch":21,"part":4,"tag":"判读","stem":"被修饰的eEF2失活后，核糖体循环中停滞的步骤是","options":["氨酰-tRNA与起始密码子的配对","肽基转移酶催化A位与P位之间的肽键形成","核糖体沿mRNA前移一个密码子","释放因子识别终止密码子并使肽链水解","空载tRNA从核糖体的E位排出"],"answer":2,"explain":"C 对：延伸因子的功能是催化移位，也就是核糖体沿mRNA向3′方向前移一个密码子的距离；eEF2被修饰失活后核糖体停在原位，A位上的肽酰-tRNA无法进入P位，肽链不能继续延长。A 错：进位指的是氨酰-tRNA进入A位，是移位的上一步，本身没有被毒素阻断。B 错：成肽由大亚基的肽基转移酶催化，不消耗延伸因子。D 错：终止由释放因子识别终止密码子完成，属于延长之后的阶段。E 错：空载tRNA排出发生在移位之后，不是被卡住的步骤本身。","type":"A1","group":"c15-03","kind":"mechanism","chs":[21,22],"vignette":"白喉棒状杆菌在咽部繁殖并分泌白喉毒素。毒素由A、B两条肽链经二硫键相连：B链结合细胞表面的受体并介导A链进入细胞质，A链催化真核延伸因子eEF2的ADP-核糖基化修饰；被修饰的eEF2失活，核糖体循环卡在同一位置，肽链延长由此中断，心肌与周围神经细胞受损尤为明显。实验室里用体外翻译体系比较几种药物：加入四环素时氨酰-tRNA进不了核糖体A位，加入链霉素时出现大量氨基酸序列错误的短肽，加入嘌呤霉素时肽链提前释放。白喉患儿除注射抗毒素外，还需使用抑制细菌蛋白质合成的抗生素。","vignette_title":"情景 3：一个二硫键连着两处损伤","gidx":2,"gn":5,"anchor":"核糖体循环卡在同一位置"},{"id":"gc15-03-3","ch":21,"part":4,"tag":"判读","stem":"情景中加入嘌呤霉素后肽链提前释放，其原因是","options":["它使释放因子提前结合到A位，把肽链水解下来","它的结构与氨酰-tRNA相似，掺入后肽链提前释放","它抑制肽基转移酶，使肽键无法形成而停在A位","它与核糖体30S亚基结合，阻断氨酰-tRNA的进位","它引起密码子错读，使合成的肽链氨基酸序列改变"],"answer":1,"explain":"B 对：嘌呤霉素的结构与氨酰-tRNA的末端相似，能够进入A位并接受肽链，随后因缺少继续延伸所需的结构而使肽链提前从核糖体上脱落，它对原核与真核核糖体都能起作用。A 错：释放因子识别的是终止密码子，情景并未涉及终止密码子的提前出现。C 错：抑制肽基转移酶是氯霉素一类药物的作用，其结果是肽键不能形成而不是肽链提前释放。D 错：与30S亚基结合并阻断进位的是四环素，现象与本例不符。E 错：引起密码子错读、出现序列错误短肽的是链霉素。","type":"A1","group":"c15-03","kind":"mechanism","chs":[21,22],"vignette":"白喉棒状杆菌在咽部繁殖并分泌白喉毒素。毒素由A、B两条肽链经二硫键相连：B链结合细胞表面的受体并介导A链进入细胞质，A链催化真核延伸因子eEF2的ADP-核糖基化修饰；被修饰的eEF2失活，核糖体循环卡在同一位置，肽链延长由此中断，心肌与周围神经细胞受损尤为明显。实验室里用体外翻译体系比较几种药物：加入四环素时氨酰-tRNA进不了核糖体A位，加入链霉素时出现大量氨基酸序列错误的短肽，加入嘌呤霉素时肽链提前释放。白喉患儿除注射抗毒素外，还需使用抑制细菌蛋白质合成的抗生素。","vignette_title":"情景 3：一个二硫键连着两处损伤","gidx":3,"gn":5,"anchor":"加入嘌呤霉素时肽链提前释放"},{"id":"gc15-03-5","ch":21,"part":4,"tag":"判读","stem":"关于蛋白质合成各环节与药物的作用位点，下列判断正确的是（X 型多选）","options":["四环素与细菌核糖体30S亚基结合，阻止氨酰-tRNA进位","氯霉素与细菌核糖体50S亚基结合，抑制肽基转移酶","细菌核糖体为70S、真核为80S，是药物选择性的基础","白喉毒素修饰细菌的延伸因子，使肽链延长中断","链霉素引起真核细胞核糖体的密码子错读，产生错误肽链"],"answer":[0,1,2],"explain":"答案 ABC。A 对：四环素与细菌核糖体30S亚基结合，使氨酰-tRNA不能进入A位，正是情景中进位受阻现象的分子解释。B 对：氯霉素的靶点是细菌核糖体50S亚基，抑制肽基转移酶的活性。C 对：细菌核糖体为70S、真核为80S，两者结构与rRNA组成不同，抗生素才能选择性作用于细菌而不损伤宿主细胞。D 错：白喉毒素修饰的是真核细胞的延伸因子eEF2，不是细菌的延伸因子。E 错：链霉素引起读码错误的作用对象是原核核糖体，而不是真核细胞的核糖体。","type":"X","group":"c15-03","kind":"mechanism","chs":[21,22],"vignette":"白喉棒状杆菌在咽部繁殖并分泌白喉毒素。毒素由A、B两条肽链经二硫键相连：B链结合细胞表面的受体并介导A链进入细胞质，A链催化真核延伸因子eEF2的ADP-核糖基化修饰；被修饰的eEF2失活，核糖体循环卡在同一位置，肽链延长由此中断，心肌与周围神经细胞受损尤为明显。实验室里用体外翻译体系比较几种药物：加入四环素时氨酰-tRNA进不了核糖体A位，加入链霉素时出现大量氨基酸序列错误的短肽，加入嘌呤霉素时肽链提前释放。白喉患儿除注射抗毒素外，还需使用抑制细菌蛋白质合成的抗生素。","vignette_title":"情景 3：一个二硫键连着两处损伤","gidx":5,"gn":5,"anchor":"氨酰-tRNA进不了核糖体A位"},{"id":"gc21-01-1","ch":21,"part":4,"tag":"机制","stem":"丙氨酸最终出现在本该由半胱氨酸占据的位置，最合理的解释是","options":["核糖体识别的是氨基酸的侧链结构，而tRNA仅承担运载氨基酸的角色","核糖体识别的是氨酰-tRNA合成酶的构象，与反密码子的序列无关","核糖体识别的是tRNA的反密码子，而不是tRNA所载氨基酸的种类","核糖体识别的是mRNA的二级结构，与反密码子的碱基配对无关","核糖体识别的是大亚基肽基转移酶中心的构象，不与tRNA直接作用"],"answer":2,"explain":"C 对：情景中tRNA的反密码子未变，所载氨基酸被换成丙氨酸，掺入位置却仍在UGU处，说明核糖体识别的是tRNA的反密码子，而不是所载氨基酸本身。A 错：侧链与密码子之间没有可供识别的化学联系，若靠侧链识别，换头后位置必然改变。B 错：合成酶负责装载，不参与核糖体对密码子的识别。D 错：mRNA二级结构不是解码依据，密码子以单链形式被读取。E 错：肽基转移酶中心催化成肽，不直接读取密码子。","type":"A1","group":"c21-01","kind":"mechanism","chs":[2,21,20],"vignette":"体外翻译体系里有一类经典的「换头」实验。研究者先用¹⁴C标记半胱氨酸，由氨酰-tRNA合成酶把它接到识别半胱氨酸密码子UGU的那种tRNA上，得到Cys-tRNA；随后用镍催化剂把tRNA上这个半胱氨酸还原成丙氨酸，tRNA本身没有改动，它的反密码子仍然指向UGU。把这种带错货的tRNA与血红蛋白mRNA一起加入兔网状红细胞裂解物，新合成的肽链上，本该由半胱氨酸占据的位置出现了丙氨酸，其余位置的序列不变。氨基酸与核苷酸三联体之间并没有可供识别的化学联系，真正完成接头任务的是tRNA的双手：一端是反密码子环上的三个碱基，按反向平行方式与mRNA的密码子形成氢键；另一端是氨基酸臂3′端的CCA，末位腺苷酸的3′-羟基与氨基酸的羧基形成酯键，装载过程由氨酰-tRNA合成酶催化并消耗ATP。tRNA前体由RNA聚合酶Ⅲ转录，在核内加工成熟后才参与翻译。","vignette_title":"情景 1：氨基酸认不出自己的密码子","gidx":1,"gn":5,"anchor":"本该由半胱氨酸占据的位置出现了丙氨酸"},{"id":"gc21-01-5","ch":21,"part":4,"tag":"机制","stem":"关于tRNA作为适配器所依赖的结构基础，下列判断正确的是（X 型多选）","options":["反密码子环上的三个碱基与mRNA密码子按反向平行方式互补配对","氨基酸与密码子之间缺少可直接识别的化学联系，必须由tRNA中介","tRNA的二级结构为倒L形，三级结构为三叶草形，两个名称可以互换","氨酰-tRNA合成酶能特异识别氨基酸与tRNA，连接反应消耗ATP","tRNA分子只由A、U、G、C四种碱基构成，不含假尿嘧啶等修饰成分"],"answer":[0,1,3],"explain":"答案 ABD。A 对：密码子与反密码子按反向平行方式互补配对，是适配器的识别基础。B 对：氨基酸与三联体之间没有可直接识别的化学联系，必须由tRNA中介。D 对：合成酶能特异识别氨基酸与tRNA，连接反应消耗ATP。C 错：tRNA二级结构为三叶草形、三级结构为倒L形，两个名称不能互换。E 错：tRNA含假尿嘧啶、二氢尿嘧啶等修饰碱基，并非只有四种碱基。","type":"X","group":"c21-01","kind":"mechanism","chs":[2,21,20],"vignette":"体外翻译体系里有一类经典的「换头」实验。研究者先用¹⁴C标记半胱氨酸，由氨酰-tRNA合成酶把它接到识别半胱氨酸密码子UGU的那种tRNA上，得到Cys-tRNA；随后用镍催化剂把tRNA上这个半胱氨酸还原成丙氨酸，tRNA本身没有改动，它的反密码子仍然指向UGU。把这种带错货的tRNA与血红蛋白mRNA一起加入兔网状红细胞裂解物，新合成的肽链上，本该由半胱氨酸占据的位置出现了丙氨酸，其余位置的序列不变。氨基酸与核苷酸三联体之间并没有可供识别的化学联系，真正完成接头任务的是tRNA的双手：一端是反密码子环上的三个碱基，按反向平行方式与mRNA的密码子形成氢键；另一端是氨基酸臂3′端的CCA，末位腺苷酸的3′-羟基与氨基酸的羧基形成酯键，装载过程由氨酰-tRNA合成酶催化并消耗ATP。tRNA前体由RNA聚合酶Ⅲ转录，在核内加工成熟后才参与翻译。","vignette_title":"情景 1：氨基酸认不出自己的密码子","gidx":5,"gn":5,"anchor":"氨基酸与核苷酸三联体之间"},{"id":"gc21-02-1","ch":21,"part":4,"tag":"机制","stem":"该药使整体错读率由10⁻⁴升到10⁻²，其作用环节是","options":["结合大亚基抑制肽基转移酶活性，使肽链延长在错误处停止延伸","结合小亚基阻断氨酰-tRNA进入A位，使翻译在起始后无法继续进行","修饰延伸因子使其不能水解GTP，核糖体因无法移位而读码出错","结合小亚基削弱解码中心的校对，使错误配对的氨酰-tRNA也能进位","结合起始因子使起始密码子的选择发生偏移，从错误的阅读框开始翻译"],"answer":3,"explain":"D 对：链霉素结合小亚基，削弱解码中心对密码子与反密码子配对的校对，使错误配对的氨酰-tRNA也能进位，整体错读率因此升高。A 错：抑制肽基转移酶会使延长变慢或停滞，不会造成错读。B 错：阻断进位使翻译停止，不会产生错配掺入。C 错：使延伸因子不能水解GTP并阻断移位，是另一类作用于真核细胞的毒素，并非本情景的药物。E 错：起始偏移会改变阅读框，与只有第210位出现多种氨基酸不符。","type":"A1","group":"c21-02","kind":"mechanism","chs":[21,2,22],"vignette":"链霉素能结合大肠埃希菌核糖体的小亚基。在含链霉素的培养基中，该菌新合成的某酶在第210位出现了3种不同的氨基酸，其余位置的序列基本正确，测得整体错读率由10⁻⁴升到10⁻²。解码中心位于小亚基的rRNA上，正常情况下，只有密码子与反密码子正确配对，才会引发延伸因子所携GTP的水解，核糖体随之改变构象并接纳这个氨酰-tRNA；药物结合后这道关卡被削弱。细菌还有两重保险：氨酰-tRNA合成酶的编辑位点会水解误载的氨基酸；摆动性虽然允许密码子第3位与反密码子第1位配对不严格，读出的仍是同义密码子。对照实验中，同一浓度的药物处理人细胞后，细胞质中的掺入速率仍为对照的96%；而在细菌中，加药5分钟后即可见核糖体紧随RNA聚合酶附着在正在延长的转录本上，人细胞的核内则始终检测不到核糖体。","vignette_title":"情景 2：错读率从万分之一升到百分之一","gidx":1,"gn":5,"anchor":"测得整体错读率由10⁻⁴升到10⁻²"},{"id":"gc21-02-3","ch":21,"part":4,"tag":"机制","stem":"缬氨酸被误接到异亮氨酸的tRNA上后能被及时纠正，依靠的是","options":["核糖体A位在进位前识别反密码子，把错误tRNA排入E位并水解其酯键","小亚基rRNA在解码中心识别错误配对，切除该tRNA上连接的氨基酸","延伸因子在携tRNA进位前水解其酯键，把游离氨基酸释放回细胞质","释放因子识别错误的密码子，提前终止翻译并释放未完成的肽链","氨酰-tRNA合成酶的编辑位点水解误载产物，再重新装载正确氨基酸"],"answer":4,"explain":"E 对：氨酰-tRNA合成酶的编辑位点可水解误载的产物并重新装载正确氨基酸，保证tRNA带对货。A 错：A位负责识别与接纳，不负责水解发生在合成酶上的装载错误。B 错：解码中心判断的是配对是否正确，并不切除已连接的氨基酸。C 错：延伸因子只是把氨酰-tRNA送入A位，不水解其酯键。D 错：释放因子识别终止密码子，与误载校正无关。","type":"A1","group":"c21-02","kind":"mechanism","chs":[21,2,22],"vignette":"链霉素能结合大肠埃希菌核糖体的小亚基。在含链霉素的培养基中，该菌新合成的某酶在第210位出现了3种不同的氨基酸，其余位置的序列基本正确，测得整体错读率由10⁻⁴升到10⁻²。解码中心位于小亚基的rRNA上，正常情况下，只有密码子与反密码子正确配对，才会引发延伸因子所携GTP的水解，核糖体随之改变构象并接纳这个氨酰-tRNA；药物结合后这道关卡被削弱。细菌还有两重保险：氨酰-tRNA合成酶的编辑位点会水解误载的氨基酸；摆动性虽然允许密码子第3位与反密码子第1位配对不严格，读出的仍是同义密码子。对照实验中，同一浓度的药物处理人细胞后，细胞质中的掺入速率仍为对照的96%；而在细菌中，加药5分钟后即可见核糖体紧随RNA聚合酶附着在正在延长的转录本上，人细胞的核内则始终检测不到核糖体。","vignette_title":"情景 2：错读率从万分之一升到百分之一","gidx":3,"gn":5,"anchor":"水解误载的氨基酸"},{"id":"gc21-02-5","ch":21,"part":4,"tag":"判读","stem":"关于翻译保真性与药物作用靶点的选择性，下列判断正确的是（X 型多选）","options":["药物对细菌有效而人细胞质几乎不受影响，与70S和80S核糖体的差异有关","四环素结合原核小亚基，阻断氨酰-tRNA进入A位，从而抑制肽链延长","氯霉素结合真核大亚基并抑制肽基转移酶，故对细菌与人细胞同样有作用","药物的选择性说明原核与真核的核糖体存在可被药物利用的结构差异","药物只作用于正在进行的翻译，对细胞内已合成的肽链没有任何影响"],"answer":[0,1,3],"explain":"答案 ABD。A 对：真核核糖体为80S、原核为70S，两者在rRNA与蛋白质组成上的差异是选择性的结构基础。B 对：四环素结合原核小亚基，阻断氨酰-tRNA进入A位，从而抑制延长。D 对：选择性本身说明两种核糖体存在可被药物利用的结构差异。C 错：氯霉素作用于原核核糖体的大亚基，对真核核糖体影响很小。E 错：药物阻断正在进行的翻译，但已合成肽链的后续加工与靶向也会受影响，该说法把范围说得过于绝对。","type":"X","group":"c21-02","kind":"mechanism","chs":[21,2,22],"vignette":"链霉素能结合大肠埃希菌核糖体的小亚基。在含链霉素的培养基中，该菌新合成的某酶在第210位出现了3种不同的氨基酸，其余位置的序列基本正确，测得整体错读率由10⁻⁴升到10⁻²。解码中心位于小亚基的rRNA上，正常情况下，只有密码子与反密码子正确配对，才会引发延伸因子所携GTP的水解，核糖体随之改变构象并接纳这个氨酰-tRNA；药物结合后这道关卡被削弱。细菌还有两重保险：氨酰-tRNA合成酶的编辑位点会水解误载的氨基酸；摆动性虽然允许密码子第3位与反密码子第1位配对不严格，读出的仍是同义密码子。对照实验中，同一浓度的药物处理人细胞后，细胞质中的掺入速率仍为对照的96%；而在细菌中，加药5分钟后即可见核糖体紧随RNA聚合酶附着在正在延长的转录本上，人细胞的核内则始终检测不到核糖体。","vignette_title":"情景 2：错读率从万分之一升到百分之一","gidx":5,"gn":5,"anchor":"解码中心位于小亚基的rRNA上"},{"id":"gc21-03-4","ch":21,"part":4,"tag":"机制","stem":"补上多聚腺苷酸尾后翻译效率仍低于正常mRNA，最可能的原因是","options":["多聚腺苷酸尾本身即为翻译模板，尾长不足会直接限制肽链的延长速度","多聚腺苷酸尾需与结合蛋白协同，与5′帽结合蛋白共同提高起始效率","该转录本缺少5′帽，40S亚基无法被招募到起始密码子的正确位置上","该转录本的剪接位点已被突变破坏，内含子序列使翻译提前终止","细胞质中的起始因子只识别帽子结构，完全不识别多聚腺苷酸尾"],"answer":1,"explain":"B 对：多聚腺苷酸尾需与多聚腺苷酸结合蛋白结合，再与5′帽结合蛋白协同，提高40S亚基的招募效率，故仅补尾而不恢复这种协同，翻译效率仍偏低。A 错：尾不是翻译模板，模板是编码区序列。C 错：情景已说明抗m7G抗体可沉淀该转录本，帽是存在的。D 错：情景明确剪接位点序列本身并未改变，剪接异常不是主因。E 错：起始因子识别帽结构，但并非完全不识别尾与结合蛋白的协同作用。","type":"A1","group":"c21-03","kind":"mechanism","chs":[20,21,10],"vignette":"某分泌蛋白基因的3′端加尾信号由AAUAAA突变为AAGAAA。把该基因转入培养细胞后做核质分离：细胞核内该基因的转录本比正常长约1.2 kb，其3′端一直延伸到下游一个隐蔽位点；细胞质中对应的成熟mRNA只剩正常水平的15%，蛋白质合成量约为正常的12%。用抗m7G抗体做沉淀，核内那份长转录本可被沉淀下来；而用寡聚dT探针杂交时，长转录本几乎没有信号。该转录本的剪接位点序列本身并未改变，聚合酶Ⅱ最大亚基C端结构域的第5位丝氨酸磷酸化水平也与正常细胞一致。若人为给这种转录本补上多聚腺苷酸尾、再注入细胞质，其翻译效率仍低于正常mRNA，约为正常的40%。","vignette_title":"情景 3：加不上尾的那条转录本","gidx":4,"gn":5,"anchor":"其翻译效率仍低于正常mRNA"},{"id":"gc21-04-1","ch":21,"part":4,"tag":"判读","stem":"放线菌酮组的放射性几乎为零而多聚核糖体峰反高于对照，最合理的解释是","options":["该药阻断真核核糖体的肽链延长，核糖体仍结合在mRNA上而不脱落","该药阻断真核核糖体的翻译起始，游离的mRNA聚集成更大的多聚体","该药使mRNA被核酸酶迅速降解，核糖体因失去模板而停留在顶部","该药促使核糖体与mRNA解离，解离后的核糖体在梯度中重新聚集","该药阻断氨酰-tRNA的合成，使空载核糖体堆积在mRNA的起始处"],"answer":0,"explain":"A 对：放线菌酮阻断真核核糖体的肽链延长，核糖体与mRNA的结合不受影响，故掺入停止而多聚核糖体因核糖体不解离反而更多。B 错：若阻断起始，已形成的多聚核糖体会逐渐解聚、单体峰升高，与结果相反。C 错：mRNA被降解时多聚核糖体峰会下降，不会高于对照。D 错：促使核糖体与mRNA解离同样会使多聚核糖体峰下降。E 错：氨酰-tRNA的合成发生在核糖体之外的活化步骤，其受阻不会使多聚核糖体峰反高于对照。","type":"A1","group":"c21-04","kind":"experiment","chs":[21,20,2],"vignette":"用兔网状红细胞裂解物搭一个体外翻译体系：每50 μL含裂解物20 μL、血红蛋白mRNA 0.5 μg（5′端带有m7G帽、3′端带多聚腺苷酸尾）、20种氨基酸各50 μmol/L（其中³H-亮氨酸1000 Bq）、ATP与GTP各1 mmol/L、MgCl₂ 2 mmol/L、KCl 100 mmol/L以及RNase抑制剂，37℃保温60分钟。取5 μL点于滤纸片，用10%三氯乙酸沉淀并洗涤后计放射性：全体系为24000 cpm，不加mRNA的对照为380 cpm。另取样品做蔗糖密度梯度离心，260 nm监测可见单体峰与多聚核糖体峰。加入放线菌酮100 μmol/L后放射性降到500 cpm，而多聚核糖体峰反高于对照、单体峰低于对照；加入25 mmol/L依地酸后放射性为300 cpm，多聚核糖体峰消失，出现两个沉降系数较小的峰；加入氯霉素400 μmol/L后放射性为22000 cpm。","vignette_title":"情景 4：梯度里那三个峰与三次计数","gidx":1,"gn":5,"anchor":"而多聚核糖体峰反高于对照"},{"id":"gc21-04-4","ch":21,"part":4,"tag":"判读","stem":"氯霉素组放射性几乎不受影响，而放线菌酮组几乎为零，这一对比说明","options":["该体系中的核糖体来自兔网状红细胞，属于细菌型的70S核糖体","该体系同时含有70S与80S核糖体，两者各承担约一半的翻译","氯霉素的浓度过低，未达到抑制原核核糖体所需的有效浓度","放线菌酮的抑制作用可被过量氯霉素竞争性逆转，故结果相反","该体系中承担翻译的是真核80S核糖体，而非细菌的70S核糖体"],"answer":4,"explain":"E 对：放线菌酮作用于真核80S核糖体却使掺入几乎完全停止，而抑制原核70S的氯霉素几乎不影响掺入，说明体系中承担翻译的是真核80S核糖体。A 错：兔网状红细胞提供的是真核80S核糖体，不是细菌型70S。B 错：若70S与80S各承担约一半翻译，加氯霉素后掺入应明显下降而不是几乎不变。C 错：氯霉素已达到很高浓度，浓度不足不能解释两种药物的相反结果。D 错：两种药物的作用靶点不同，不存在竞争性逆转的关系。","type":"A1","group":"c21-04","kind":"experiment","chs":[21,20,2],"vignette":"用兔网状红细胞裂解物搭一个体外翻译体系：每50 μL含裂解物20 μL、血红蛋白mRNA 0.5 μg（5′端带有m7G帽、3′端带多聚腺苷酸尾）、20种氨基酸各50 μmol/L（其中³H-亮氨酸1000 Bq）、ATP与GTP各1 mmol/L、MgCl₂ 2 mmol/L、KCl 100 mmol/L以及RNase抑制剂，37℃保温60分钟。取5 μL点于滤纸片，用10%三氯乙酸沉淀并洗涤后计放射性：全体系为24000 cpm，不加mRNA的对照为380 cpm。另取样品做蔗糖密度梯度离心，260 nm监测可见单体峰与多聚核糖体峰。加入放线菌酮100 μmol/L后放射性降到500 cpm，而多聚核糖体峰反高于对照、单体峰低于对照；加入25 mmol/L依地酸后放射性为300 cpm，多聚核糖体峰消失，出现两个沉降系数较小的峰；加入氯霉素400 μmol/L后放射性为22000 cpm。","vignette_title":"情景 4：梯度里那三个峰与三次计数","gidx":4,"gn":5,"anchor":"放射性降到500 cpm"},{"id":"gc21-04-5","ch":21,"part":4,"tag":"判读","stem":"关于本实验的体系组成、检测与数据判读，下列判断正确的是（X 型多选）","options":["三氯乙酸可沉淀掺入肽链的放射性，并把游离的标记氨基酸洗去","不加mRNA的对照计数接近本底，说明掺入依赖外加的模板","多聚核糖体是多个核糖体先后结合同一条mRNA并同时翻译形成的","体系中只要加入ATP与GTP，即使没有核糖体也能合成肽链","多聚核糖体峰代表的是未与mRNA结合的游离核糖体"],"answer":[0,1,2],"explain":"答案 ABC。A 对：三氯乙酸使掺入肽链的蛋白质沉淀在滤纸片上，洗涤可除去游离的标记氨基酸，从而只计掺入的放射性。B 对：不加mRNA的对照接近本底，说明掺入依赖外加模板。C 对：多聚核糖体是同一条mRNA上先后结合多个核糖体、同时翻译所形成的。D 错：没有核糖体就无法形成肽键，只有能量物质不能合成肽链。E 错：多聚核糖体峰代表结合在mRNA上的核糖体，未结合mRNA的游离核糖体构成单体峰。","type":"X","group":"c21-04","kind":"experiment","chs":[21,20,2],"vignette":"用兔网状红细胞裂解物搭一个体外翻译体系：每50 μL含裂解物20 μL、血红蛋白mRNA 0.5 μg（5′端带有m7G帽、3′端带多聚腺苷酸尾）、20种氨基酸各50 μmol/L（其中³H-亮氨酸1000 Bq）、ATP与GTP各1 mmol/L、MgCl₂ 2 mmol/L、KCl 100 mmol/L以及RNase抑制剂，37℃保温60分钟。取5 μL点于滤纸片，用10%三氯乙酸沉淀并洗涤后计放射性：全体系为24000 cpm，不加mRNA的对照为380 cpm。另取样品做蔗糖密度梯度离心，260 nm监测可见单体峰与多聚核糖体峰。加入放线菌酮100 μmol/L后放射性降到500 cpm，而多聚核糖体峰反高于对照、单体峰低于对照；加入25 mmol/L依地酸后放射性为300 cpm，多聚核糖体峰消失，出现两个沉降系数较小的峰；加入氯霉素400 μmol/L后放射性为22000 cpm。","vignette_title":"情景 4：梯度里那三个峰与三次计数","gidx":5,"gn":5,"anchor":"不加mRNA的对照为380 cpm"},{"id":"gc4-03-4","ch":21,"part":4,"tag":"判读","stem":"内含子被完整保留之后，最直接的翻译后果是","options":["成熟 mRNA 变短，肽链相应缩短但功能正常","内含子序列被 tRNA 识别，翻译成一串氨基酸","内含子序列中出现终止密码子，翻译提前终止","mRNA 无法出核，因而不能与核糖体结合","阅读框保持不变，仅插入一段氨基酸不影响功能"],"answer":2,"explain":"C 对：保留的内含子序列中常出现终止密码子，核糖体翻译到此处提前终止，生成无功能或功能异常的短肽。A 说 mRNA 变短与内含子被保留的事实相反；B 只有在内含子长度为 3 的整倍数时才可能不移码，并非一般情形，功能正常更无从谈起；D 出核与否不由内含子保留决定；E 把 tRNA 的识别对象错当成内含子序列。","type":"A1","group":"c4-03","kind":"mechanism","chs":[20,21],"vignette":"真核生物编码蛋白质的基因由外显子与内含子交替排列组成。转录时，RNA 聚合酶Ⅱ以模板链为模板、按碱基互补规则合成 pre-mRNA，合成方向为 5′→3′，因此 RNA 的序列与编码链一致（只是 U 取代 T），而与模板链互补且反向平行。转录开始不久，pre-mRNA 的 5′ 端就加上 7-甲基鸟苷帽；转录终止后，3′ 端在 AAUAAA 信号下游约 10–20 个核苷酸处被切开，再由多聚腺苷酸聚合酶加上尾，这一步不需要模板。随后剪接体识别内含子 5′ 端的 GU 与 3′ 端的 AG，经两次转酯反应把内含子以套索形式切除，并把相邻外显子连接起来。某基因第 2 内含子 5′ 端的 GU 突变为 AU，患者成熟 mRNA 中该内含子被完整保留。","vignette_title":"情景 3：一个 GU 变成 AU 之后","gidx":4,"gn":5,"anchor":"该内含子被完整保留"},{"id":"gc4-04-4","ch":21,"part":4,"tag":"机制","stem":"加入氯霉素后 lac mRNA 仍在合成而酶几乎为零，说明氯霉素","options":["作用于肽链延长，因其结构与氨酰-tRNA 相似","作用于核糖体 30S 亚基，使 mRNA 与核糖体不能结合","作用于核糖体 50S 亚基，抑制氨酰-tRNA 进入 A 位","作用于核糖体 50S 亚基，抑制肽基转移酶而阻断延长","作用于转录起始阶段，使 lac mRNA 的合成被抑制"],"answer":3,"explain":"D 对：氯霉素与核糖体 50S 亚基结合，抑制肽基转移酶活性，肽键不能形成，肽链延长受阻，故 mRNA 照常合成而酶几乎为零。A 把亚基写成 30S，与 50S 的作用位点不符；C 作用于 50S 却把环节说成 A 位取氨酰-tRNA，属另一类抑制剂的作用；D 若抑制转录，lac mRNA 也应减少，与数据矛盾；E 描述的是嘌呤霉素，其结构与氨酰-tRNA 相似而致肽链提前释放。","type":"A1","group":"c4-04","kind":"experiment","chs":[22,20,21],"vignette":"研究大肠埃希菌乳糖利用调控的研究生做了三组实验。第一组把同一菌株分别培养在三种培养基中，测定 β-半乳糖苷酶活性：乳糖加葡萄糖组为 8 U，只加乳糖组为 420 U，只加葡萄糖组为 5 U。第二组用乳糖操纵子的阻遏蛋白与含操纵基因序列的 DNA 探针做 EMSA：不加乳糖时出现蛋白与 DNA 的结合条带，体系中加入乳糖后该条带消失。第三组在只加乳糖的培养物中分别加入两种抑制剂：加入利福平后，lac mRNA 与 β-半乳糖苷酶都几乎检测不到；加入氯霉素后，lac mRNA 仍持续合成，而 β-半乳糖苷酶几乎为零。","vignette_title":"情景 4：三组培养基与两种抑制剂","gidx":4,"gn":5,"anchor":"lac mRNA 仍持续合成"},{"ch":21,"part":4,"tag":"遗传密码","stem":"关于遗传密码（genetic code）的特点，下列叙述正确的是？","options":["密码子的简并性是指一种氨基酸只能由一种密码子编码","遗传密码具有连续性，即相邻密码子之间由不编码的核苷酸隔开","终止密码子UAA、UAG、UGA分别由相应的tRNA识别并携带氨基酸","密码子第3位碱基与tRNA反密码子第1位碱基配对时不够严格，这一现象称为摆动性","遗传密码的通用性是指同一密码子在不同生物中可编码不同的氨基酸"],"answer":3,"explain":"摆动性指密码子第3位与反密码子第1位配对不严格；简并性为一种氨基酸可由多个密码子编码，终止密码子由释放因子而非tRNA识别。","type":"A1","id":"c21-e317406b"},{"ch":21,"part":4,"tag":"tRNA","stem":"关于tRNA与氨酰-tRNA合成酶（aminoacyl-tRNA synthetase）的叙述，正确的是？","options":["tRNA的3′端为CCA序列，氨基酸以肽键连接于末端腺苷酸上","氨酰-tRNA合成酶能特异性识别氨基酸和相应的tRNA，催化二者结合，反应需消耗ATP","tRNA三叶草形二级结构进一步折叠成三股螺旋，反密码子环位于分子的一端","一种tRNA的反密码子可识别mRNA上全部同义密码子，故tRNA种类远少于密码子种类","起始tRNA与延伸tRNA是同一类分子，均可进入核糖体A位参与肽链延长"],"answer":1,"explain":"氨酰-tRNA合成酶特异性识别氨基酸与tRNA并以酯键连接，耗ATP；tRNA三级结构为倒L形，起始tRNA另有特点，二者不可混同。","type":"A1","id":"c21-60ffd9ce"},{"ch":21,"part":4,"tag":"翻译起始","stem":"关于大肠埃希菌蛋白质合成的起始阶段，下列叙述正确的是？","options":["起始密码子AUG无需起始因子参与即可与fMet-tRNAfMet直接结合","起始时30S亚基先与50S亚基结合形成70S核糖体，再招募mRNA","起始复合体由30S亚基、mRNA、fMet-tRNAfMet、起始因子和GTP装配形成，随后50S亚基加入","mRNA上的Shine-Dalgarno序列位于3′端，与16S rRNA互补配对后启动翻译","原核生物起始阶段消耗ATP，真核生物起始阶段消耗GTP，二者正好相反"],"answer":2,"explain":"原核起始由30S、mRNA、fMet-tRNA、起始因子和GTP装配成起始复合体，再结合50S；SD序列位于起始密码子上游5′端。","type":"A1","id":"c21-646dc838"},{"ch":21,"part":4,"tag":"肽链延长","stem":"关于肽链延长（核糖体循环）过程，下列叙述正确的是？","options":["进位时氨酰-tRNA进入A位，成肽由大亚基的肽基转移酶催化，移位时核糖体沿mRNA 5′→3′方向移动并需GTP供能","成肽过程中，A位上肽酰-tRNA的肽链转移到P位氨酰-tRNA上形成肽键","移位由延伸因子EF-G催化，所需能量来自ATP水解","核糖体E位是氨酰-tRNA进位的位点，A位是空载tRNA离开核糖体的位点","每延长一个氨基酸残基只需消耗1个高能磷酸键"],"answer":0,"explain":"延伸中氨酰-tRNA在A位进位、P位成肽后移入，空载tRNA由E位排出；移位由EF-G催化耗GTP，每个肽键至少耗4个高能磷酸键。","type":"A1","id":"c21-073c5977"},{"ch":21,"part":4,"tag":"翻译终止","stem":"关于肽链合成的终止，下列叙述正确的是？","options":["终止密码子UAA由相应的tRNA识别并携带氨基酸","释放因子结合终止密码子后核糖体直接解离，肽链仍以肽酰-tRNA形式存在","核糖体沿mRNA继续移动至3′端非翻译区末端后自动停止翻译","终止过程需ATP水解使释放因子与核糖体结合，但不需要肽基转移酶参与","释放因子识别终止密码子并结合于A位，使肽基转移酶表现出水解活性，肽链被水解释放"],"answer":4,"explain":"终止密码子不被任何tRNA识别，而由释放因子结合A位，使大亚基肽基转移酶转为水解活性，水解释放肽链并解体翻译复合物。","type":"A1","id":"c21-b23d9b6a"},{"ch":21,"part":4,"tag":"合成阻断剂","stem":"关于蛋白质合成阻断剂及其作用靶点，下列叙述正确的是？","options":["四环素与大肠埃希菌核糖体30S亚基结合，阻止氨酰-tRNA进入A位","氯霉素与30S亚基结合，抑制肽基转移酶的活性","链霉素与真核生物核糖体结合，引起密码子错读","白喉毒素修饰原核生物的延伸因子，抑制肽链的移位","嘌呤霉素只抑制原核生物的肽链延长，对真核生物没有影响"],"answer":0,"explain":"四环素作用于原核30S阻止氨酰-tRNA进位；氯霉素作用于50S，链霉素引起原核读码错误，白喉毒素修饰真核eEF2，嘌呤霉素抑原核与真核。","type":"A1","id":"c21-02fe1ea8"},{"ch":21,"part":4,"tag":"翻译比较","stem":"试比较大肠埃希菌与酵母细胞的蛋白质合成过程。下列叙述正确的是？","options":["两者翻译的起始氨基酸均为甲硫氨酸，起始过程没有任何差别","两者核糖体均由60S大亚基与40S小亚基组成","两者都在同一空间内使转录与翻译同时耦联进行","原核起始复合体的装配先由核糖体小亚基与mRNA结合，真核则先形成Met-tRNAi与前起始复合物，再识别mRNA的5′帽","原核每延长一个氨基酸残基消耗4个高能磷酸键，真核只需消耗2个"],"answer":3,"explain":"原核起始氨基酸为fMet、核糖体为70S且转录与翻译耦联；真核起始氨基酸为Met、核糖体为80S，转录与翻译在时空上分开。","type":"A1","id":"c21-3e45aff2"},{"ch":21,"part":4,"tag":"翻译后加工","stem":"关于蛋白质合成后的加工修饰与靶向运输，下列叙述正确的是？","options":["信号肽位于肽链的羧基端，引导分泌蛋白进入内质网","分泌蛋白在信号肽引导下边合成边进入内质网腔，属共翻译转运，随后经高尔基复合体加工并分泌","蛋白质的糖基化只能发生在天冬酰胺残基上，丝氨酸和苏氨酸残基不能连接糖链","蛋白质的磷酸化只在线粒体内进行，与细胞信号转导无关","所有蛋白质的翻译后修饰都在内质网腔中完成"],"answer":1,"explain":"信号肽位于N端，引导肽链共翻译进入内质网，故分泌蛋白在粗面内质网合成；糖基化有N-连接与O-连接，修饰可发生在多种细胞器。","type":"A1","id":"c21-858d19ec"},{"ch":21,"part":4,"tag":"阅读框","stem":"关于mRNA上阅读框（reading frame）与移码突变的叙述，正确的是？","options":["阅读框由mRNA的5′端第一个核苷酸决定，与起始密码子无关","在编码区插入3个核苷酸必然使阅读框移位，肽链从突变点起氨基酸序列全部改变","阅读框由起始密码子确定，编码区内插入或缺失非3倍数个核苷酸会使阅读框移位，突变点之后的氨基酸序列随之改变","移码突变只改变突变位点所编码的单个氨基酸，不影响其下游序列","密码子之间无核苷酸间隔，故编码区任何点突变都会造成阅读框移位"],"answer":2,"explain":"阅读框由起始密码子确定，编码区插入或缺失非3n个核苷酸才引起移码，其下游氨基酸序列全部改变；置换突变不改变阅读框。","type":"A1","id":"c21-8831d46f"},{"ch":21,"part":4,"tag":"起始密码子","stem":"关于起始密码子及其作用的叙述，正确的是？","options":["AUG既作为起始密码子，又编码甲硫氨酸；原核生物偶尔也可用GUG或UUG起始","AUG只作为翻译起始信号，不编码任何氨基酸","原核生物以AUG起始，真核生物以GUG起始，两者恰好相反","mRNA上任何位置的AUG都能启动翻译，阅读框可任意选择","终止密码子也可在特殊情况下兼作起始密码子启动翻译"],"answer":0,"explain":"AUG是最常见的起始密码子并编码甲硫氨酸（原核为fMet），原核偶可用GUG、UUG起始，但阅读框仍由起始密码子确定。","type":"A1","id":"c21-d907cc61"},{"ch":21,"part":4,"tag":"反密码子","stem":"关于密码子与反密码子配对方式的叙述，正确的是？","options":["密码子与反密码子以同向平行方式配对，即二者均按5′→3′方向一一对应","反密码子的三个碱基与密码子的三个碱基之间以共价键相连","配对严格遵循A-U、G-C，任何位置的错配都会使翻译立即终止","反密码子中除三个碱基外，其余碱基也参与对密码子的识别","密码子与反密码子反向平行配对，即密码子5′→3′的方向与反密码子3′→5′的方向对应"],"answer":4,"explain":"反密码子以反向平行方式与mRNA密码子互补配对，即密码子按5′→3′与反密码子3′→5′对应，配对基础为氢键而非共价键。","type":"A1","id":"c21-6ecf1ac1"},{"ch":21,"part":4,"tag":"tRNA结构","stem":"关于tRNA二级结构中各部分的功能，下列叙述正确的是？","options":["反密码子环位于tRNA的3′端，与氨基酸结合位点相邻","三叶草形结构中，DHU环和TψC环参与tRNA与氨酰-tRNA合成酶、核糖体的相互识别，反密码子环位于分子的另一端","tRNA分子不含修饰碱基，全部由A、U、G、C四种碱基组成","tRNA的二级结构为倒L形，三级结构为三叶草形","同一种tRNA可同时结合两种不同的氨基酸，其种类由反密码子以外的序列决定"],"answer":1,"explain":"tRNA二级结构为三叶草形、三级结构为倒L形；DHU环与TψC环参与识别合成酶和核糖体，分子中含多种修饰碱基。","type":"A1","id":"c21-e9bb2068"},{"ch":21,"part":4,"tag":"核糖体组成","stem":"关于核糖体的组成及其催化活性的叙述，正确的是？","options":["核糖体由蛋白质和rRNA组成，催化肽键形成的活性完全来自核糖体蛋白","原核生物核糖体为80S，由60S大亚基和40S小亚基组成","rRNA只起结构支架作用，不参与肽链合成的任何催化反应","原核生物核糖体为70S，由30S与50S亚基组成；大亚基中的23S rRNA构成肽基转移酶中心，故核糖体是一种核酶","5S rRNA位于核糖体小亚基中，直接负责起始密码子的识别"],"answer":3,"explain":"原核核糖体70S含16S、23S和5S rRNA，肽基转移酶中心由大亚基rRNA构成，催化肽键形成，故核糖体属于核酶。","type":"A1","id":"c21-4c96a117"},{"ch":21,"part":4,"tag":"翻译后加工","stem":"关于蛋白质前体的剪切加工，下列叙述正确的是？","options":["许多蛋白质先合成无活性的前体，再经特异的蛋白水解酶切除部分肽段而成熟，如胰岛素原切除C肽后生成胰岛素","蛋白质前体的剪切均发生在细胞核内，由限制性内切酶完成","前体剪切只切除羧基端的氨基酸，不涉及肽链内部的肽段","胰岛素原转变成胰岛素时，C肽被保留在成熟胰岛素分子中","所有蛋白质一经合成即具有活性，不需要经蛋白酶水解加工"],"answer":0,"explain":"胰岛素原经蛋白酶切除C肽后生成由A、B链经二硫键相连的胰岛素；多种酶、激素和分泌蛋白均先合成无活性前体再经剪切成熟。","type":"A1","id":"c21-a65b199e"},{"ch":21,"part":4,"tag":"蛋白折叠","stem":"关于新生肽链的折叠与亚基组装，下列叙述正确的是？","options":["所有蛋白质的折叠均在核糖体上自发完成，不需要其他蛋白质协助","分子伴侣通过提供能量直接催化肽键形成，本身不与被折叠的肽链结合","分子伴侣能改变肽链的氨基酸序列，从而纠正折叠错误","只有分泌蛋白需要分子伴侣协助折叠，细胞内蛋白质均不需要","分子伴侣（如热激蛋白Hsp70、伴侣蛋白）能与新生或未折叠肽链结合，防止其错误聚集并协助正确折叠与亚基组装，此过程消耗ATP"],"answer":4,"explain":"分子伴侣与新生或未折叠肽链结合，防止错误折叠和聚集，协助其形成正确构象并组装为多亚基蛋白，该过程需要消耗ATP。","type":"A1","id":"c21-7d57e499"},{"ch":21,"part":4,"tag":"靶向运输","stem":"关于蛋白质向线粒体的靶向运输，下列叙述正确的是？","options":["线粒体蛋白的靶向序列位于肽链羧基端，进入线粒体后被保留下来","多数线粒体蛋白在细胞质游离核糖体上合成后，由N端信号序列引导进行翻译后转运；转运时肽链需保持未折叠状态，依赖分子伴侣、ATP及线粒体内膜的膜电位","线粒体蛋白与分泌蛋白一样，在信号肽引导下边合成边进入线粒体，属共翻译转运","线粒体蛋白进入线粒体后，N端信号序列仍保留在成熟蛋白上并决定其定位","线粒体蛋白的转运不需要任何能量，仅靠浓度梯度即可完成"],"answer":1,"explain":"多数线粒体蛋白由细胞质游离核糖体合成，以未折叠状态经N端信号序列翻译后转运入线粒体，需分子伴侣、ATP与膜电位，入内后信号序列被切除。","type":"A1","id":"c21-12198a7b"},{"id":"gc15-03-4","ch":22,"part":4,"tag":"识别","stem":"毒素蛋白由细菌合成后分泌到胞外，关于这一过程涉及的基因表达调控，下列叙述正确的是","options":["基因表达调控只发生在转录水平，翻译阶段不再受调节","翻译后修饰不影响蛋白质活性，故不属于表达调控","管家基因的表达需要诱导剂存在，否则不被转录","原核细胞的转录与翻译在时空上分开，比真核更复杂","转录起始是原核与真核基因表达调控最关键的控制点"],"answer":4,"explain":"E 对：基因表达调控贯穿转录、转录后、翻译与翻译后各个层次，但无论原核生物还是真核生物，转录起始都是最关键的控制点，毒素基因的开启同样首先取决于起始。A 错：调控是多层次的，翻译阶段同样受调节，例如起始因子的磷酸化就影响翻译效率。B 错：翻译后修饰改变蛋白质的活性与寿命，正是表达调控的层次之一，ADP-核糖基化使eEF2失活就是例子。C 错：管家基因是组成性表达，不需要诱导剂。D 错：原核细胞没有核膜，转录与翻译在同一场所耦联进行，其转录后加工远比真核简单。","type":"A1","group":"c15-03","kind":"mechanism","chs":[21,22],"vignette":"白喉棒状杆菌在咽部繁殖并分泌白喉毒素。毒素由A、B两条肽链经二硫键相连：B链结合细胞表面的受体并介导A链进入细胞质，A链催化真核延伸因子eEF2的ADP-核糖基化修饰；被修饰的eEF2失活，核糖体循环卡在同一位置，肽链延长由此中断，心肌与周围神经细胞受损尤为明显。实验室里用体外翻译体系比较几种药物：加入四环素时氨酰-tRNA进不了核糖体A位，加入链霉素时出现大量氨基酸序列错误的短肽，加入嘌呤霉素时肽链提前释放。白喉患儿除注射抗毒素外，还需使用抑制细菌蛋白质合成的抗生素。","vignette_title":"情景 3：一个二硫键连着两处损伤","gidx":4,"gn":5,"anchor":"白喉棒状杆菌在咽部繁殖并分泌白喉毒素"},{"id":"gc15-04-4","ch":22,"part":4,"tag":"识别","stem":"情景中-150至+50的区段能被RNA聚合酶II与TATA结合蛋白结合，该区段属于","options":["反式作用因子，由蛋白质构成并识别特异的DNA序列","操纵序列，通过与阻遏蛋白结合控制结构基因转录","顺式作用元件中的启动子，决定转录的起始位点","顺式作用元件中的增强子，位置与方向都不固定","沉默子，与特异蛋白结合后抑制该基因的转录起始"],"answer":2,"explain":"C 对：启动子是决定RNA聚合酶转录起始位点的DNA序列，属顺式作用元件；本例中该区段既富集RNA聚合酶II又富集TATA结合蛋白，并被截短实验证明为核心启动子区，正符合这一定义。A 错：反式作用因子是蛋白质，而该区段是DNA序列。B 错：操纵序列是原核操纵子的组成部分，真核基因不采用这种调控方式。D 错：增强子能增强启动子活性，其位置与方向不固定，但不决定起始位点所在。E 错：沉默子抑制转录，而该区段富集了聚合酶与TATA结合蛋白，说明它在启动转录。","type":"A1","group":"c15-04","kind":"experiment","chs":[20,22],"vignette":"研究生小许把某基因转录起始位点上游1.5kb的片段接到不含启动子的荧光素酶基因前，转染HeLa细胞后测荧光素酶活性。以转录起始位点为+1，做4个5′端系列截短：-1500、-600、-150三者活性相近，而-45的活性降到本底的1.2倍。用抗RNA聚合酶II的抗体做染色质免疫沉淀，-150至+50区段的富集是对照抗体的30倍；换用抗TATA结合蛋白的抗体，同一区段富集18倍。体外足迹实验中，HeLa细胞核提取物保护了-30至-24的一段富含A-T的序列。向培养液加入低浓度α-鹅膏蕈碱后，荧光素酶活性下降90%；加入利福平则活性不变。","vignette_title":"情景 4：把启动子一段一段剪短之后","gidx":4,"gn":5,"anchor":"-150至+50区段的富集"},{"id":"gc17-01-3","ch":22,"part":4,"tag":"判读","stem":"启动子区让出核小体缺失区后该基因转录明显升高，最合理的解释是","options":["缺失区使该基因的复制起点暴露，模板拷贝数随之增加","缺失区使 RNA 聚合酶直接识别该段 DNA，无需转录因子协助","缺失区使该段组蛋白被降解，DNA 转为单链而便于转录","缺失区使该处染色质结构疏松，顺式元件得以与反式因子结合","缺失区使该基因的模板链发生碱基替换，转录效率提高"],"answer":3,"explain":"D 对：核小体让开后染色质结构变得疏松，启动子上的顺式作用元件才能与反式作用因子结合，进而形成转录起始复合物。A 把缺失区当成复制起点，方向不对；B 与真核转录起始需要反式作用因子参与的事实矛盾；C 组蛋白并未被降解，DNA 也没有变成单链；E 缺失区不改变碱基序列，转录效率的改变来自可及性而不是突变。","type":"A1","group":"c17-01","kind":"mechanism","chs":[10,17,22],"vignette":"人二倍体细胞中约 2 m 长的 DNA 必须装进直径只有 5～8 μm 的细胞核，靠的是核小体、30 nm 纤维、襻环到中期染色体的逐级折叠。某基因受激素诱导：刺激前，它的启动子区缠着两个核小体，基因座紧贴核膜内缘、染色致密；刺激后 15 分钟，染色质重塑复合物水解 ATP，把这两个核小体沿 DNA 向下游滑动约 60 个碱基对，启动子区让出一段约 200 bp 的核小体缺失区，转录因子随即结合，该基因的转录在 1 小时内升高 9 倍；若用不能水解的 ATP 类似物代替 ATP，核小体不再移动。用高盐溶液洗去 H1 后，电镜下该基因座只剩直径约 11 nm 的串珠结构。","vignette_title":"情景 1：核小体滑了 60 个碱基对之后","gidx":3,"gn":5,"anchor":"转录在 1 小时内升高 9 倍"},{"id":"gc17-02-3","ch":22,"part":4,"tag":"判读","stem":"该基因的前体 RNA 不减少而成熟 mRNA 锐减，这一组合提示缺陷最可能发生在","options":["转录起始频率下降，前体 RNA 的合成量随之减少","基因组的拷贝数减少，可供转录的模板量明显不足","翻译起始受阻，成熟 mRNA 在细胞质中被大量消耗","转录后加工或稳定性受损，前体 RNA 未被正常处理","DNA 复制受阻，合成成熟 mRNA 所需的原料供应不足"],"answer":3,"explain":"D 对：前体 RNA 不减少说明转录起始并未下降，成熟 mRNA 锐减则把缺陷定位到转录后加工或 mRNA 稳定性这一层次。A 若转录起始下降，前体 RNA 也应随之减少；B 拷贝数减少同样会减少前体 RNA；C 属翻译环节，其后果是蛋白质减少而不是成熟 mRNA 减少；E 讲的是 DNA 复制，与成熟 mRNA 的含量无直接关系。","type":"A1","group":"c17-02","kind":"mechanism","chs":[17,22],"vignette":"一名甲型血友病患儿的凝血因子Ⅷ基因第 14 内含子中插入了一段约 6 kb 的序列：它两端各有一小段相同的短序列，内部有两个可编码蛋白质的开放阅读框，其产物之一兼有核酸内切酶与逆转录酶活性。患儿细胞内该基因的前体 RNA 含量与正常人接近，成熟 mRNA 却只有正常人的 15%，血浆凝血因子Ⅷ活性不足 1%。在该患儿的基因组中，还能检出大量长约 300 bp、拷贝数以百万计的散在重复序列，以及成串排列于着丝粒、拷贝数成千上万的 α 卫星 DNA。","vignette_title":"情景 2：一个 6 kb 插入与 15% 的成熟 mRNA","gidx":3,"gn":5,"anchor":"成熟 mRNA 却只有正常人的 15%"},{"id":"gc17-04-1","ch":22,"part":4,"tag":"判读","stem":"甲组把交联、酶切、连接与定量 PCR 组合起来，其检测的直接对象是","options":["两个区段在染色体上的线性距离，即相隔多少碱基对","增强子区段的碱基序列，即是否含共有的调控序列","两个区段在细胞核内三维空间上的邻近与接触频率","启动子区段的组蛋白修饰类型，即乙酰化与甲基化水平","该基因转录出的成熟 mRNA 在细胞内的含量与半衰期"],"answer":2,"explain":"C 对：交联把空间上邻近的区段固定在一起，酶切后用锚定在启动子区的引物测连接产物，测到的是两个区段在核内三维空间上的接触频率，而不是它们在染色体上的线性距离。A 测线性距离应直接看序列位置，不必交联与连接；B 测序列用测序或足迹等方法；D 测组蛋白修饰常用特异抗体；E 测成熟 mRNA 用定量 PCR 或印迹，与本实验的模板不同。","type":"A1","group":"c17-04","kind":"experiment","chs":[10,17,22],"vignette":"为弄清某红系特异基因的增强子（位于启动子上游约 80 kb）怎样与启动子接触，研究生做了三组实验。甲：先用甲醛交联细胞，再以限制性内切酶消化染色质，随后把 DNA 稀释到极低浓度并加入 DNA 连接酶，最后用锚定在启动子区的引物作定量 PCR；红系细胞中该连接产物的量是宫颈癌细胞的 12 倍。乙：用 DNase I 处理细胞核，该增强子所在区段在红系细胞中出现超敏位点，在宫颈癌细胞中不出现。丙：用高盐溶液抽提细胞核去除组蛋白后离心，该基因的启动子区段随核基质组分一起沉淀，而多数编码区片段留在上清中。","vignette_title":"情景 4：连接频率高出 12 倍之后","gidx":1,"gn":5,"anchor":"锚定在启动子区的引物作定量 PCR"},{"id":"gc17-04-3","ch":22,"part":4,"tag":"判读","stem":"综合甲、乙两组结果，下列判断最合理的是","options":["该增强子的活性由染色体上的线性距离决定，与接触无关","宫颈癌细胞中该增强子区段缺失，因而检测不到连接产物","该增强子区段在 DNA 复制时才与启动子接触并发挥作用","DNase I 超敏位点由基因突变造成，与该细胞的表达状态无关","该增强子与启动子在红系细胞中的接触与其染色质开放状态相关"],"answer":4,"explain":"E 对：红系细胞中连接产物的量高出 12 倍，同时该区段出现 DNase I 超敏位点，说明远距离接触与该细胞中染色质处于开放、活跃状态相关。A 与情景中两个区段相隔约 80 kb 却仍能接触矛盾；B 宫颈癌细胞只是连接与超敏信号低，情景并未提示区段缺失；C 把接触限定在复制时，缺乏依据；D 超敏位点反映染色质结构状态，并非突变所致。","type":"A1","group":"c17-04","kind":"experiment","chs":[10,17,22],"vignette":"为弄清某红系特异基因的增强子（位于启动子上游约 80 kb）怎样与启动子接触，研究生做了三组实验。甲：先用甲醛交联细胞，再以限制性内切酶消化染色质，随后把 DNA 稀释到极低浓度并加入 DNA 连接酶，最后用锚定在启动子区的引物作定量 PCR；红系细胞中该连接产物的量是宫颈癌细胞的 12 倍。乙：用 DNase I 处理细胞核，该增强子所在区段在红系细胞中出现超敏位点，在宫颈癌细胞中不出现。丙：用高盐溶液抽提细胞核去除组蛋白后离心，该基因的启动子区段随核基质组分一起沉淀，而多数编码区片段留在上清中。","vignette_title":"情景 4：连接频率高出 12 倍之后","gidx":3,"gn":5,"anchor":"在红系细胞中出现超敏位点"},{"id":"gc21-02-4","ch":22,"part":4,"tag":"判读","stem":"据人细胞核内始终检测不到核糖体这一结果，下列叙述正确的是","options":["原核细胞无核膜，转录与翻译在同一场所耦联进行，真核细胞则分开","真核细胞的转录与翻译同样耦联进行，核糖体只是不易被该方法检出","真核细胞的核糖体在核内完成组装，组装好以后随成熟mRNA一起出核","原核细胞的核糖体在核仁中完成组装，故能紧随RNA聚合酶结合转录本","真核细胞的mRNA在核内完成翻译后才输出，因此核内不需要核糖体"],"answer":0,"explain":"A 对：原核细胞没有核膜，转录与翻译在同一场所耦联进行，核糖体可紧随RNA聚合酶结合到正在延长的转录本上；真核细胞在核内转录、在细胞质中翻译，故核内检测不到核糖体。B 错：真核细胞的转录与翻译在时空上分开，不会在同一场所耦联。C 错：核糖体亚基在核仁组装后输出到细胞质，不随mRNA一起出核。D 错：原核细胞没有核仁，其核糖体在细胞质中组装。E 错：真核mRNA在核内完成加工后输出，翻译在细胞质中完成。","type":"A1","group":"c21-02","kind":"mechanism","chs":[21,2,22],"vignette":"链霉素能结合大肠埃希菌核糖体的小亚基。在含链霉素的培养基中，该菌新合成的某酶在第210位出现了3种不同的氨基酸，其余位置的序列基本正确，测得整体错读率由10⁻⁴升到10⁻²。解码中心位于小亚基的rRNA上，正常情况下，只有密码子与反密码子正确配对，才会引发延伸因子所携GTP的水解，核糖体随之改变构象并接纳这个氨酰-tRNA；药物结合后这道关卡被削弱。细菌还有两重保险：氨酰-tRNA合成酶的编辑位点会水解误载的氨基酸；摆动性虽然允许密码子第3位与反密码子第1位配对不严格，读出的仍是同义密码子。对照实验中，同一浓度的药物处理人细胞后，细胞质中的掺入速率仍为对照的96%；而在细菌中，加药5分钟后即可见核糖体紧随RNA聚合酶附着在正在延长的转录本上，人细胞的核内则始终检测不到核糖体。","vignette_title":"情景 2：错读率从万分之一升到百分之一","gidx":4,"gn":5,"anchor":"人细胞的核内则始终检测不到核糖体"},{"id":"gc4-04-1","ch":22,"part":4,"tag":"判读","stem":"第一组中乳糖加葡萄糖组的活性只有 8 U，原因是","options":["葡萄糖使细胞内 cAMP 降低，CRP 结合后转录被抑制","葡萄糖使细胞内 cAMP 升高，CRP 不能结合而转录效率低","葡萄糖使细胞内 cAMP 升高，CRP 结合后抑制转录","葡萄糖使细胞内 cAMP 降低，CRP 不能结合而转录效率低","葡萄糖与乳糖竞争性结合 β-半乳糖苷酶，使其活性被抑制"],"answer":3,"explain":"D 对：葡萄糖充足时细胞内 cAMP 水平降低，CRP 不能与启动子结合，即使乳糖已使阻遏蛋白脱落，转录缺少正调控而效率很低。A、E 把 cAMP 的变化方向写反；C 承认 cAMP 降低，却让 CRP 结合并抑制转录，与 CRP 是激活蛋白的事实矛盾；D 把调控层次搬到酶活性上，葡萄糖并不竞争性抑制该酶的催化。","type":"A1","group":"c4-04","kind":"experiment","chs":[22,20,21],"vignette":"研究大肠埃希菌乳糖利用调控的研究生做了三组实验。第一组把同一菌株分别培养在三种培养基中，测定 β-半乳糖苷酶活性：乳糖加葡萄糖组为 8 U，只加乳糖组为 420 U，只加葡萄糖组为 5 U。第二组用乳糖操纵子的阻遏蛋白与含操纵基因序列的 DNA 探针做 EMSA：不加乳糖时出现蛋白与 DNA 的结合条带，体系中加入乳糖后该条带消失。第三组在只加乳糖的培养物中分别加入两种抑制剂：加入利福平后，lac mRNA 与 β-半乳糖苷酶都几乎检测不到；加入氯霉素后，lac mRNA 仍持续合成，而 β-半乳糖苷酶几乎为零。","vignette_title":"情景 4：三组培养基与两种抑制剂","gidx":1,"gn":5,"anchor":"乳糖加葡萄糖组为 8 U"},{"id":"gc4-04-2","ch":22,"part":4,"tag":"判读","stem":"第二组中加入乳糖后结合条带消失，说明","options":["乳糖使阻遏蛋白构象改变，因而与操纵基因结合更强","乳糖与 DNA 探针结合，使探针无法再与蛋白结合","乳糖使阻遏蛋白被蛋白酶降解，因而结合条带消失","乳糖结合阻遏蛋白，使其构象改变而不能结合操纵基因","乳糖结合操纵基因，使阻遏蛋白被竞争性地置换下来"],"answer":3,"explain":"D 对：乳糖作为诱导物与阻遏蛋白结合，使阻遏蛋白构象改变、不能结合操纵基因，探针上便不再有蛋白滞留，故结合条带消失。A 让乳糖直接占据操纵基因，作用对象错了；B 说乳糖与 DNA 探针结合，干扰的是探针而非蛋白；D 需要蛋白酶参与，实验并无此条件；E 把构象改变的结果写反，结合更强时条带应更明显。","type":"A1","group":"c4-04","kind":"experiment","chs":[22,20,21],"vignette":"研究大肠埃希菌乳糖利用调控的研究生做了三组实验。第一组把同一菌株分别培养在三种培养基中，测定 β-半乳糖苷酶活性：乳糖加葡萄糖组为 8 U，只加乳糖组为 420 U，只加葡萄糖组为 5 U。第二组用乳糖操纵子的阻遏蛋白与含操纵基因序列的 DNA 探针做 EMSA：不加乳糖时出现蛋白与 DNA 的结合条带，体系中加入乳糖后该条带消失。第三组在只加乳糖的培养物中分别加入两种抑制剂：加入利福平后，lac mRNA 与 β-半乳糖苷酶都几乎检测不到；加入氯霉素后，lac mRNA 仍持续合成，而 β-半乳糖苷酶几乎为零。","vignette_title":"情景 4：三组培养基与两种抑制剂","gidx":2,"gn":5,"anchor":"体系中加入乳糖后该条带消失"},{"id":"gc4-04-5","ch":22,"part":4,"tag":"机制","stem":"关于这三组实验的现象与解释，下列判断正确的是（X 型多选）","options":["乳糖加葡萄糖组活性低，与 cAMP-CRP 正调控失效有关","该操纵子的转录调控与细胞内葡萄糖的浓度没有关系","乳糖作为诱导物，结合阻遏蛋白而解除对转录的抑制","氯霉素组几乎没有酶，说明其作用位点在核糖体","氯霉素组 lac mRNA 仍增加，说明氯霉素促进 lac 转录"],"answer":[0,2,3],"explain":"答案 ACD。A 对：葡萄糖使 cAMP 降低、CRP 不能结合，正调控失效，所以只有 8 U。C 对：第二组的条带消失说明乳糖结合阻遏蛋白、解除对转录的抑制。D 对：氯霉素组 mRNA 照常而蛋白缺失，作用点落在翻译机器即核糖体上。E 错：mRNA 增加是转录未被抑制的表现，氯霉素抑制的是翻译，说它促进转录没有依据。B 错：第一组三种培养基的酶活性差异正说明葡萄糖浓度参与调控。","type":"X","group":"c4-04","kind":"experiment","chs":[22,20,21],"vignette":"研究大肠埃希菌乳糖利用调控的研究生做了三组实验。第一组把同一菌株分别培养在三种培养基中，测定 β-半乳糖苷酶活性：乳糖加葡萄糖组为 8 U，只加乳糖组为 420 U，只加葡萄糖组为 5 U。第二组用乳糖操纵子的阻遏蛋白与含操纵基因序列的 DNA 探针做 EMSA：不加乳糖时出现蛋白与 DNA 的结合条带，体系中加入乳糖后该条带消失。第三组在只加乳糖的培养物中分别加入两种抑制剂：加入利福平后，lac mRNA 与 β-半乳糖苷酶都几乎检测不到；加入氯霉素后，lac mRNA 仍持续合成，而 β-半乳糖苷酶几乎为零。","vignette_title":"情景 4：三组培养基与两种抑制剂","gidx":5,"gn":5,"anchor":"测定 β-半乳糖苷酶活性"},{"id":"gc9-01-2","ch":22,"part":4,"tag":"机制","stem":"红系祖细胞中该增强子区乙酰化水平高，促进转录的机制是","options":["招募 DNA 甲基转移酶使该区的甲基化水平明显升高","中和组蛋白赖氨酸的正电荷而减弱其与 DNA 的结合","使增强子区的 DNA 双链断裂后按新序列重新连接","促使 RNA 聚合酶 II 与模板链的碱基直接配对结合","直接改变增强子区的碱基序列而产生新的调控元件"],"answer":1,"explain":"B 对：组蛋白乙酰化中和赖氨酸残基的正电荷，减弱组蛋白与 DNA 的结合，染色质变疏松，反式因子与起始复合物更易结合，转录增强。C 错：乙酰化不引起 DNA 断裂与重接，那是重组过程。E 错：乙酰化修饰的是组蛋白，不改变 DNA 的碱基序列。D 错：碱基配对发生在新生 RNA 与模板链之间，聚合酶本身不与模板碱基配对。A 错：DNA 甲基化通常抑制转录，且乙酰化不会招募甲基转移酶。","type":"A1","group":"c9-01","kind":"mechanism","chs":[22,27,20],"vignette":"从同一份骨髓样本中分选出红系祖细胞与粒系祖细胞，在同一培养条件下同步培养。两者的核型正常，STR 分型一致，全基因组测序未发现序列差异。检测显示：红系祖细胞中 β-珠蛋白基因启动子上游的增强子区组蛋白 H3 乙酰化水平很高，GATA-1 在该区富集，该基因 mRNA 占总 mRNA 的 30%；粒系祖细胞中同一区域 DNA 甲基化程度高、乙酰化水平很低，GATA-1 几乎不结合，该基因 mRNA 不足 1%。两细胞内 RNA 聚合酶 II 的总量、TATA 结合蛋白的水平以及通用转录因子的种类并无差别。","vignette_title":"情景 1：同一份基因组，两套表达程序","gidx":2,"gn":5,"anchor":"组蛋白 H3 乙酰化水平很高"},{"id":"gc9-01-5","ch":22,"part":4,"tag":"判读","stem":"若用组蛋白去乙酰化酶抑制剂处理粒系祖细胞，最可能出现的变化是","options":["该基因的碱基序列改变，产生新的启动子元件","通用转录因子种类改变，该基因转为组成性表达","该基因的 mRNA 被迅速降解，翻译水平随之下降","该基因位点甲基化升高，转录活性进一步降低","该基因位点乙酰化升高，转录活性有所恢复"],"answer":4,"explain":"E 对：抑制组蛋白去乙酰化酶可使组蛋白乙酰化水平升高、染色质变疏松，被表观修饰沉默的基因可以重新表达，这是教材明确给出的结论。D 错：该抑制剂作用于乙酰化，与 DNA 甲基化水平没有直接关系，方向也写反了。A 错：抑制剂不改变 DNA 的碱基序列。B 错：通用转录因子为所有 Pol II 基因共用，不会因抑制剂而改变种类，该基因也不会转为组成性表达。C 错：mRNA 的降解速率不由组蛋白乙酰化状态直接决定。","type":"A1","group":"c9-01","kind":"mechanism","chs":[22,27,20],"vignette":"从同一份骨髓样本中分选出红系祖细胞与粒系祖细胞，在同一培养条件下同步培养。两者的核型正常，STR 分型一致，全基因组测序未发现序列差异。检测显示：红系祖细胞中 β-珠蛋白基因启动子上游的增强子区组蛋白 H3 乙酰化水平很高，GATA-1 在该区富集，该基因 mRNA 占总 mRNA 的 30%；粒系祖细胞中同一区域 DNA 甲基化程度高、乙酰化水平很低，GATA-1 几乎不结合，该基因 mRNA 不足 1%。两细胞内 RNA 聚合酶 II 的总量、TATA 结合蛋白的水平以及通用转录因子的种类并无差别。","vignette_title":"情景 1：同一份基因组，两套表达程序","gidx":5,"gn":5,"anchor":"DNA 甲基化程度高"},{"id":"gc9-02-1","ch":22,"part":4,"tag":"识别","stem":"该异常融合受体调控靶基因的方式属于","options":["作为启动子序列决定靶基因的转录起始位点","作为通用转录因子参与该类基因的起始组装","作为顺式作用元件被反式作用因子识别与结合","作为信号肽引导靶蛋白进入内质网进行加工","作为反式作用因子识别靶基因的顺式作用元件"],"answer":4,"explain":"E 对：情景明确该融合受体是反式作用因子，它通过 DNA 结合结构域识别靶基因的顺式作用元件（启动子、增强子等）而发挥调控作用。C 错：顺式作用元件是 DNA 序列而不是蛋白质，把两者的关系写反了。B 错：通用转录因子为所有 Pol II 基因共用，不决定基因的组织特异性，该融合受体属特异转录因子。D 错：该受体在核内作用于 DNA，不经分泌途径，与信号肽无关。A 错：启动子序列是 DNA 元件，不是受体蛋白本身。","type":"A1","group":"c9-02","kind":"mechanism","chs":[22,27,25],"vignette":"一名急性早幼粒细胞白血病患者的外周血中，异常早幼粒细胞占 85%，这些细胞停滞在该阶段不再成熟。患者的维A酸受体 α（RARα）基因因染色体易位形成异常融合受体：它是一种反式作用因子，在生理浓度维A酸下仍与共阻遏物结合，并招募组蛋白去乙酰化酶，使粒细胞分化相关基因启动子区的乙酰化水平偏低、转录受抑。给予治疗浓度全反式维A酸（维A酸属脂溶性配体，可直接穿过细胞膜进入细胞）后，融合受体构象改变，释放共阻遏物、招募共激活物与组蛋白乙酰转移酶，靶基因重新转录。用药 4 周后，外周血早幼粒细胞降至 5%，中性粒细胞逐步恢复。","vignette_title":"情景 2：把抑制器换成激活器","gidx":1,"gn":5,"anchor":"它是一种反式作用因子"},{"id":"gc9-02-2","ch":22,"part":4,"tag":"机制","stem":"该融合受体使靶基因转录受抑的直接原因是","options":["直接切除靶基因启动子区的组蛋白八聚体","招募组蛋白去乙酰化酶，使启动子区染色质紧缩","促使靶基因的 mRNA 在细胞质中被快速降解","使靶基因的 DNA 甲基化并在复制后稳定传递","使通用转录因子无法与启动子的 TATA 盒结合"],"answer":1,"explain":"B 对：情景已给出共阻遏物招募组蛋白去乙酰化酶，使启动子区乙酰化水平偏低、染色质紧缩，转录受抑。A 错：共阻遏物改变的是组蛋白的修饰状态，并不是把组蛋白八聚体切掉。E 错：通用转录因子仍可组装，抑制发生在染色质与修饰层面，不是 TATA 盒不能结合。C 错：该受体位于核内、作用点在转录起始，不是细胞质中 mRNA 的降解。D 错：情景描述的是去乙酰化而不是 DNA 甲基化，且甲基化不是该融合受体的直接作用。","type":"A1","group":"c9-02","kind":"mechanism","chs":[22,27,25],"vignette":"一名急性早幼粒细胞白血病患者的外周血中，异常早幼粒细胞占 85%，这些细胞停滞在该阶段不再成熟。患者的维A酸受体 α（RARα）基因因染色体易位形成异常融合受体：它是一种反式作用因子，在生理浓度维A酸下仍与共阻遏物结合，并招募组蛋白去乙酰化酶，使粒细胞分化相关基因启动子区的乙酰化水平偏低、转录受抑。给予治疗浓度全反式维A酸（维A酸属脂溶性配体，可直接穿过细胞膜进入细胞）后，融合受体构象改变，释放共阻遏物、招募共激活物与组蛋白乙酰转移酶，靶基因重新转录。用药 4 周后，外周血早幼粒细胞降至 5%，中性粒细胞逐步恢复。","vignette_title":"情景 2：把抑制器换成激活器","gidx":2,"gn":5,"anchor":"招募组蛋白去乙酰化酶"},{"id":"gc9-03-3","ch":22,"part":4,"tag":"机制","stem":"重编程过程中成纤维细胞标志基因表达下降，其分子基础是","options":["该基因的 mRNA 被剪接加工成多种异构体","启动子区 DNA 甲基化升高、组蛋白乙酰化降低","该基因的编码区发生缺失而无法转录出 mRNA","该基因的启动子被 RNA 聚合酶 III 识别而低效转录","该基因的模板链发生转换，导致转录方向改变"],"answer":1,"explain":"B 对：情景给出该基因启动子区 DNA 甲基化由 15% 升至 75%、组蛋白乙酰化降低，二者都使染色质紧缩、转录受抑，与该基因表达下降相符。C 错：这是表达调控水平的改变，不涉及编码区序列缺失。A 错：可变剪接改变的是产物种类，不能解释转录本整体消失。E 错：转录的模板链由启动子方向决定，不会在重编程中随意转换。D 错：RNA 聚合酶 III 转录 tRNA 等小 RNA，不负责蛋白编码基因。","type":"A1","group":"c9-03","kind":"mechanism","chs":[28,22,10],"vignette":"研究者取小鼠尾尖成纤维细胞，导入 Oct4、Sox2、Klf4、c-Myc 四种转录因子，表达出的目的蛋白约 45 kDa，需从细胞质进入细胞核才能结合基因组。培养约两周后，约 0.1% 的细胞形成碱性磷酸酶染色阳性的集落。检测显示：成纤维细胞标志基因的转录本在第 3 天开始下降，第 10 天几乎检测不到，其启动子区 DNA 甲基化由 15% 升至 75%、组蛋白乙酰化降低；与此同时，内源 Oct4 基因的启动子区 DNA 甲基化由 70% 降至 20%，内源 Oct4、Sox2 与 Nanog 依次被激活。这些细胞的基因组序列没有改变，被重置的是基因表达程序；它们在形态、标志与三胚层分化能力上与胚胎干细胞相似，但仍保留部分成纤维细胞的表观遗传记忆。","vignette_title":"情景 3：把成纤维细胞改写成干细胞","gidx":3,"gn":5,"anchor":"DNA 甲基化由 15% 升至 75%"},{"id":"gc9-03-5","ch":22,"part":4,"tag":"判读","stem":"关于该重编程过程，下列判断正确的是（X 型多选）","options":["导入的因子需入核后才能调控内源基因转录","重编程说明已分化细胞的基因被选择性丢失","细胞基因组序列未变，改变的是基因表达程序","内源干性基因启动子去甲基化与其激活相符","成纤维细胞标志基因的沉默伴随染色质紧缩"],"answer":[0,2,3,4],"explain":"答案 ACDE。A、C、D、E 分别对应情景中的基因组序列不变、内源干性基因启动子去甲基化、标志基因沉默伴随表观修饰改变、外源因子须入核后才能作用。B 错：分化细胞的基因组保持完整，核移植与重编程实验都证明潜能受限来自表达调控状态，而不是基因的选择性丢失。","type":"X","group":"c9-03","kind":"mechanism","chs":[28,22,10],"vignette":"研究者取小鼠尾尖成纤维细胞，导入 Oct4、Sox2、Klf4、c-Myc 四种转录因子，表达出的目的蛋白约 45 kDa，需从细胞质进入细胞核才能结合基因组。培养约两周后，约 0.1% 的细胞形成碱性磷酸酶染色阳性的集落。检测显示：成纤维细胞标志基因的转录本在第 3 天开始下降，第 10 天几乎检测不到，其启动子区 DNA 甲基化由 15% 升至 75%、组蛋白乙酰化降低；与此同时，内源 Oct4 基因的启动子区 DNA 甲基化由 70% 降至 20%，内源 Oct4、Sox2 与 Nanog 依次被激活。这些细胞的基因组序列没有改变，被重置的是基因表达程序；它们在形态、标志与三胚层分化能力上与胚胎干细胞相似，但仍保留部分成纤维细胞的表观遗传记忆。","vignette_title":"情景 3：把成纤维细胞改写成干细胞","gidx":5,"gn":5,"anchor":"被重置的是基因表达程序"},{"id":"gc9-04-1","ch":22,"part":4,"tag":"判读","stem":"红系中报告基因活性远高于宫颈癌细胞，说明该片段","options":["含红系特异反式因子识别的增强子元件","在两种细胞中的碱基序列存在明显差异","能直接切割报告基因转录出的 mRNA","可提高报告基因 mRNA 的翻译效率","在两种细胞中结合的组蛋白种类不同"],"answer":0,"explain":"A 对：同一片段在红系细胞中的活性高 40 倍，说明它含有红系特异的增强子元件，能被红系细胞中的特异反式因子识别。B 错：报告基因实验用的是同一段质粒 DNA，两种细胞中的序列完全一致。D 错：荧光素酶活性反映的是转录产生的 mRNA 量，不能说明翻译效率提高。C 错：该片段是 DNA 调控序列，不会切割 mRNA。E 错：不同细胞中组蛋白种类基本相同，差别在修饰状态，且组蛋白种类不是增强子活性的直接判据。","type":"A1","group":"c9-04","kind":"experiment","chs":[22,27,28],"vignette":"研究生小陈把 β-珠蛋白基因上游 2 kb 的增强子片段接到荧光素酶报告基因上，分别转入红系细胞与宫颈癌细胞。红系中荧光素酶活性是宫颈癌细胞的 40 倍；把片段中一段 12 bp 序列定点突变后，红系中的活性倍数降到 3 倍。EMSA 中，红系核提取物与该 12 bp 探针孵育出现一条滞后条带，加入 50 倍未标记的同源探针后条带消失，加入抗 GATA-1 抗体后出现迁移更慢的条带。ChIP 显示抗 GATA-1 抗体沉淀的 DNA 中，该增强子片段富集 25 倍，对照抗体为 1 倍。另一部分实验里，流式分选出的 CD34 阳性 CD38 阴性细胞在受照小鼠体内能长期重建全部血细胞，连续移植仍可重建；把同一报告基因转入正在向红系分化的 CD34 阳性细胞后，活性随培养天数逐步升高。","vignette_title":"情景 4：一条滞后条带引出的四个实验","gidx":1,"gn":6,"anchor":"红系中荧光素酶活性是宫颈癌细胞的 40 倍"},{"id":"gc9-04-2","ch":22,"part":4,"tag":"判读","stem":"加入 50 倍未标记同源探针后条带消失，最合理的解释是","options":["滞后条带说明探针序列在核提取物中被甲基化","滞后条带说明核提取物中含有核酸酶活性","滞后条带是蛋白与探针特异性结合形成的复合物","滞后条带是未标记探针自身聚集形成的聚合物","滞后条带是探针与 DNA 聚合酶结合形成的复合物"],"answer":2,"explain":"C 对：未标记的同源探针竞争结合了核提取物中的同一种蛋白，使标记探针游离，故条带消失，说明该结合具有序列特异性。D 错：未标记探针不产生信号，其自身聚集解释不了标记条带的消失。E 错：DNA 聚合酶与该段双链探针的结合没有序列特异性，也解释不了竞争现象。A 错：甲基化改变的是 DNA 的修饰状态，不会使蛋白与探针的复合物解离。B 错：核酸酶会降解探针使信号整体减弱，而不是被未标记同源探针竞争性抑制。","type":"A1","group":"c9-04","kind":"experiment","chs":[22,27,28],"vignette":"研究生小陈把 β-珠蛋白基因上游 2 kb 的增强子片段接到荧光素酶报告基因上，分别转入红系细胞与宫颈癌细胞。红系中荧光素酶活性是宫颈癌细胞的 40 倍；把片段中一段 12 bp 序列定点突变后，红系中的活性倍数降到 3 倍。EMSA 中，红系核提取物与该 12 bp 探针孵育出现一条滞后条带，加入 50 倍未标记的同源探针后条带消失，加入抗 GATA-1 抗体后出现迁移更慢的条带。ChIP 显示抗 GATA-1 抗体沉淀的 DNA 中，该增强子片段富集 25 倍，对照抗体为 1 倍。另一部分实验里，流式分选出的 CD34 阳性 CD38 阴性细胞在受照小鼠体内能长期重建全部血细胞，连续移植仍可重建；把同一报告基因转入正在向红系分化的 CD34 阳性细胞后，活性随培养天数逐步升高。","vignette_title":"情景 4：一条滞后条带引出的四个实验","gidx":2,"gn":6,"anchor":"加入 50 倍未标记的同源探针后条带消失"},{"id":"gc9-04-3","ch":22,"part":4,"tag":"方案","stem":"若要确认 GATA-1 是直接结合该 12 bp 序列，最该补充的实验是","options":["用抗 GATA-1 抗体做免疫共沉淀检测蛋白互作","用抗 GATA-1 抗体做蛋白质印迹检测表达量","用核提取物做双向电泳观察蛋白质点阵变化","用该探针转染细胞后检测报告基因的活性","把该 12 bp 序列突变后重做 EMSA 结合实验"],"answer":4,"explain":"E 对：把结合位点突变后若滞后条带消失，说明该 12 bp 序列是蛋白结合的必需位点，这与突变后红系报告基因活性由 40 倍降到 3 倍的结果相互印证。A 错：免疫共沉淀检测的是蛋白质之间的相互作用，不能证明蛋白与该 DNA 序列的直接结合。B 错：蛋白质印迹只测蛋白的表达量，与结合位点无关。C 错：双向电泳分离蛋白质，给不出 DNA 结合序列的信息。D 错：该探针本身不含报告基因，须先连入报告基因载体再测定，且此类报告基因实验已经做过。","type":"A1","group":"c9-04","kind":"experiment","chs":[22,27,28],"vignette":"研究生小陈把 β-珠蛋白基因上游 2 kb 的增强子片段接到荧光素酶报告基因上，分别转入红系细胞与宫颈癌细胞。红系中荧光素酶活性是宫颈癌细胞的 40 倍；把片段中一段 12 bp 序列定点突变后，红系中的活性倍数降到 3 倍。EMSA 中，红系核提取物与该 12 bp 探针孵育出现一条滞后条带，加入 50 倍未标记的同源探针后条带消失，加入抗 GATA-1 抗体后出现迁移更慢的条带。ChIP 显示抗 GATA-1 抗体沉淀的 DNA 中，该增强子片段富集 25 倍，对照抗体为 1 倍。另一部分实验里，流式分选出的 CD34 阳性 CD38 阴性细胞在受照小鼠体内能长期重建全部血细胞，连续移植仍可重建；把同一报告基因转入正在向红系分化的 CD34 阳性细胞后，活性随培养天数逐步升高。","vignette_title":"情景 4：一条滞后条带引出的四个实验","gidx":3,"gn":6,"anchor":"把片段中一段 12 bp 序列定点突变"},{"ch":22,"part":4,"tag":"表达调控概念","stem":"关于基因表达调控的基本概念，下列叙述正确的是？","options":["组成性表达是指在特定环境因素刺激下基因表达水平升高的现象","操纵子是真核生物基因表达调控的基本单位","基因表达调控涉及中心法则的多个环节，但无论真核还是原核生物，转录起始都是最关键的控制点","基因表达调控只发生在转录水平，不影响mRNA的加工和降解","管家基因的表达必须依赖诱导剂的存在"],"answer":2,"explain":"转录起始是原核与真核基因表达调控最关键的控制点，调控贯穿转录、转录后、翻译及翻译后各层次；组成性表达无需诱导剂。","type":"A1","id":"c22-8addcd27"},{"ch":22,"part":4,"tag":"乳糖操纵子","stem":"关于乳糖操纵子（lac operon）的组成，下列叙述正确的是？","options":["乳糖操纵子由启动序列P、操纵序列O和调节基因lacI组成，不含结构基因","阻遏蛋白由结构基因Z编码，与操纵序列O结合后激活结构基因转录","结构基因编码阻遏蛋白、β-半乳糖苷酶和半乳糖苷乙酰转移酶","乳糖是乳糖操纵子的真正诱导物，可直接结合阻遏蛋白使其失活","乳糖操纵子由启动序列P、操纵序列O和结构基因Z、Y、A组成，其调控关键是对P和O两个开关的控制"],"answer":4,"explain":"乳糖操纵子由P、O和Z、Y、A结构基因组成，调控关键在P与O两个开关；调节基因lacI位于上游，真正诱导物是异乳糖。","type":"A1","id":"c22-33c1a0dc"},{"ch":22,"part":4,"tag":"操纵子调控","stem":"当培养基中葡萄糖缺乏而乳糖充足时，大肠埃希菌乳糖操纵子的状态是？","options":["细胞内cAMP升高，cAMP-CAP复合物与启动序列上游位点结合；同时异乳糖使阻遏蛋白失活，结构基因高效转录","阻遏蛋白与操纵序列O结合，结构基因不转录","阻遏蛋白与操纵序列O结合，但cAMP-CAP复合物促进转录，结构基因仍高效表达","细胞内cAMP水平降低，cAMP-CAP不结合，但阻遏蛋白失活，结构基因高效转录","调节基因lacI停止表达，细胞内无阻遏蛋白，结构基因低水平表达"],"answer":0,"explain":"葡萄糖缺乏时cAMP升高，cAMP-CAP促进转录；乳糖生成的异乳糖使阻遏蛋白失活，P与O开关同时开放，结构基因高表达。","type":"A1","id":"c22-580d7a35"},{"ch":22,"part":4,"tag":"顺式元件","stem":"关于真核基因的顺式作用元件与反式作用因子，下列叙述正确的是？","options":["增强子必须位于启动子上游且方向固定才能发挥作用","TATA框位于转录起始位点下游，本身属于反式作用因子","启动子是可位于基因任意位置、能增强转录活性的DNA序列","启动子是决定RNA聚合酶转录起始位点的DNA序列，增强子是能增强启动子转录活性的DNA序列","顺式作用元件是蛋白质，反式作用因子是DNA序列"],"answer":3,"explain":"启动子决定转录起始位点，增强子增强启动子活性且位置与方向不固定；顺式元件是DNA序列，反式因子是蛋白质。","type":"A1","id":"c22-4f73d31a"},{"ch":22,"part":4,"tag":"调控层次","stem":"关于真核基因表达调控的层次，下列叙述正确的是？","options":["真核基因表达调控的主要环节是翻译起始","真核基因转录激活受顺式作用元件与反式作用因子相互作用的调节，其主要环节是转录起始复合物的形成","DNA甲基化程度越高，该基因的转录活性越强","mRNA的加工与运输不属于基因表达调控的范畴","翻译后修饰不影响蛋白质的活性与寿命，故不属于表达调控"],"answer":1,"explain":"真核基因表达调控的主要环节是转录起始复合物的形成，并受染色质构象与表观修饰影响；DNA甲基化通常抑制转录。","type":"A1","id":"c22-01d99f3a"},{"ch":22,"part":4,"tag":"转录后调控","stem":"真核生物的tRNA和rRNA相对稳定且半衰期长，而mRNA不稳定、很快被降解。关于影响mRNA稳定性因素的叙述，正确的是？","options":["mRNA的5′帽子只参与翻译起始，与其稳定性无关","mRNA的3′端Poly(A)尾越短，mRNA越稳定","mRNA的稳定性由其编码蛋白质的种类决定，与mRNA自身序列和结构无关","mRNA的3′非翻译区（3′-UTR）中的特定序列可与miRNA等结合，从而加速mRNA的降解","mRNA前体的内含子被剪接去除后，mRNA随即被降解"],"answer":3,"explain":"mRNA的5′帽与3′Poly(A)尾可保护mRNA，而3′-UTR序列元件与miRNA结合可促进脱腺苷酸化与降解，故mRNA半衰期短。","type":"A1","id":"c22-838a4251"},{"ch":22,"part":4,"tag":"非编码RNA","stem":"关于siRNA、miRNA与lncRNA对基因表达的调控，下列叙述正确的是？","options":["siRNA与miRNA均由细胞自身基因编码，作用机制完全相同","miRNA与靶mRNA完全互补配对，直接切割降解mRNA","siRNA通过抑制转录起始复合物的形成发挥作用，与mRNA降解无关","lncRNA只能作为翻译的模板，不能调控基因表达","miRNA主要通过碱基互补配对识别靶mRNA，抑制其翻译或促进其降解"],"answer":4,"explain":"miRNA多以不完全互补方式结合靶mRNA的3′-UTR，抑制翻译或促其降解；siRNA常与靶mRNA完全互补并诱导其切割降解。","type":"A1","id":"c22-7d0b106d"},{"ch":22,"part":4,"tag":"调控比较","stem":"试分析比较原核生物与真核生物基因转录调控的特点。下列叙述正确的是？","options":["原核生物多以操纵子形式对相关基因进行协调调控，真核生物则以顺式作用元件与反式作用因子相互作用为主，并受染色质构象影响","原核生物的转录与翻译在同一场所耦联进行，真核生物也是如此","真核生物基因的转录调控只存在正调控，不存在负调控","原核生物基因的转录后加工过程比真核生物更为复杂","真核生物的转录起始不需要反式作用因子参与，只取决于RNA聚合酶"],"answer":0,"explain":"原核以操纵子实现协调调控，真核依赖顺式元件与反式因子并受染色质与表观修饰影响；真核转录与翻译在时空上分开。","type":"A1","id":"c22-c3a38606"},{"ch":22,"part":4,"tag":"色氨酸操纵子","stem":"关于色氨酸操纵子的衰减作用（attenuation），下列叙述正确的是？","options":["色氨酸充足时阻遏蛋白不能与操纵序列结合，结构基因的转录反而增强","色氨酸充足时核糖体快速通过前导序列，使前导mRNA形成3-4配对的终止子结构而提前终止转录；色氨酸缺乏时核糖体停滞于前导肽的色氨酸密码子，形成2-3配对的抗终止子结构使转录继续","衰减作用发生在翻译水平，与转录是否提前终止无关","前导序列的翻译速度不影响转录能否继续进行","色氨酸操纵子只有阻遏这一种调控方式，不存在其他层次的调控"],"answer":1,"explain":"Trp充足时核糖体迅速通过前导序列，前导mRNA形成3-4终止子结构使转录提前终止；Trp缺乏时核糖体停滞，形成2-3抗终止子结构使转录继续。","type":"A1","id":"c22-49be200e"},{"ch":22,"part":4,"tag":"表达特点","stem":"关于基因表达调控的特点，下列叙述正确的是？","options":["同一个体的不同组织细胞基因组DNA序列不同，因而合成的蛋白质种类不同","基因表达调控没有时空特异性，同一基因在所有细胞中的表达水平相同","基因表达调控一旦启动便不可逆，细胞分化后表达模式不再改变","基因表达具有时间与空间特异性，同一个体的不同细胞含相同的基因组，但表达基因的种类和水平不同，从而形成不同的细胞表型","管家基因的表达具有高度组织特异性，只在特定组织细胞中表达"],"answer":3,"explain":"基因表达调控具有多级性、时空特异性和可逆性；同一机体各细胞基因组相同，通过差别基因表达形成不同表型，管家基因则普遍表达。","type":"A1","id":"c22-1395f06e"},{"ch":22,"part":4,"tag":"RNA聚合酶","stem":"关于真核生物三种RNA聚合酶及其转录产物的叙述，正确的是？","options":["RNA聚合酶Ⅰ转录rRNA前体，RNA聚合酶Ⅱ转录mRNA前体，RNA聚合酶Ⅲ转录tRNA和5S rRNA等小分子RNA","RNA聚合酶Ⅱ转录tRNA，RNA聚合酶Ⅲ转录mRNA前体","三种RNA聚合酶均位于核仁中，转录产物均为mRNA前体","真核生物各种RNA均由同一种RNA聚合酶转录，只是加工方式不同","RNA聚合酶Ⅰ的转录产物需加5′帽和Poly(A)尾后才能成熟"],"answer":0,"explain":"真核RNA聚合酶Ⅰ、Ⅱ、Ⅲ分别转录rRNA前体、mRNA前体和tRNA、5S rRNA等小RNA，三者对α-鹅膏蕈碱的敏感性不同。","type":"A1","id":"c22-4b6b4917"},{"ch":22,"part":4,"tag":"反式因子结构域","stem":"关于反式作用因子的结构与功能，下列叙述正确的是？","options":["反式作用因子是一类特殊的DNA序列，可通过对启动子发挥作用影响转录","反式作用因子只能以单体形式与DNA结合，不存在二聚化","反式作用因子与DNA的结合不具特异性，可识别任何序列","反式作用因子只能通过直接结合DNA发挥效应，不能通过蛋白质-蛋白质相互作用影响转录","反式作用因子通常含DNA结合结构域与转录激活结构域等相互独立的模块，锌指、亮氨酸拉链、螺旋-转角-螺旋是常见的DNA结合结构域"],"answer":4,"explain":"反式作用因子是蛋白质，常由DNA结合、转录激活、二聚化等独立模块组成，锌指、亮氨酸拉链、螺旋-转角-螺旋等基序可特异性结合DNA。","type":"A1","id":"c22-78970d7a"},{"ch":22,"part":4,"tag":"表观调控","stem":"关于染色质重塑与组蛋白修饰对基因转录的调控，下列叙述正确的是？","options":["组蛋白乙酰化使染色质结构更为紧密，通常抑制基因转录","组蛋白修饰只影响染色质结构，不影响其他蛋白质与DNA的结合","组蛋白乙酰化可减弱组蛋白与DNA的结合、使染色质疏松，通常促进转录；组蛋白去乙酰化则相反","组蛋白的共价修饰一旦建立即不可逆，也不能影响染色质构象","染色质重塑复合物只改变组蛋白的共价修饰，不改变核小体的位置"],"answer":2,"explain":"组蛋白乙酰化中和赖氨酸正电荷、减弱其与DNA结合，使染色质疏松而促进转录；去乙酰化则抑制转录，染色质重塑复合物还可改变核小体位置。","type":"A1","id":"c22-93bd6cb1"},{"ch":22,"part":4,"tag":"可变剪接","stem":"关于mRNA前体的可变剪接，下列叙述正确的是？","options":["同一mRNA前体通过选择不同的剪接位点可生成多种成熟mRNA，翻译出功能不同的蛋白质，是转录后调控的重要方式","可变剪接只发生在原核生物，真核生物mRNA前体只有一种剪接方式","可变剪接改变的是蛋白质翻译后的修饰方式，不改变成熟mRNA的序列","剪接过程中内含子被保留在成熟mRNA中，外显子被切除","一个基因只能编码一种蛋白质，可变剪接不改变蛋白质的种类"],"answer":0,"explain":"可变剪接通过选择不同剪接位点使同一前体生成多种成熟mRNA和蛋白质，是真核基因转录后调控的重要方式；剪接时内含子被切除、外显子相连。","type":"A1","id":"c22-c9b8d564"},{"ch":22,"part":4,"tag":"RNAi","stem":"关于RNA干扰（RNAi）的分子机制，下列叙述正确的是？","options":["外源双链RNA在细胞核内被直接整合到基因组中发挥作用","Dicer是一种蛋白酶，可直接降解靶mRNA","siRNA与靶mRNA结合后只阻止其翻译，不引起mRNA降解","双链RNA被Dicer切割成siRNA，siRNA掺入RNA诱导沉默复合物（RISC），由其中的Argonaute蛋白切割降解互补的靶mRNA","RNAi只作用于转录水平，与细胞质中的成熟mRNA无关"],"answer":3,"explain":"RNAi中长双链RNA经Dicer切割成siRNA，siRNA的引导链掺入RISC，由Argonaute蛋白切割与siRNA互补的靶mRNA使其降解。","type":"A1","id":"c22-4e7ddfff"},{"ch":22,"part":4,"tag":"lncRNA","stem":"关于长链非编码RNA（lncRNA）的作用，下列叙述正确的是？","options":["lncRNA是指长度短于200个核苷酸的非编码RNA","lncRNA均可作为翻译模板翻译出蛋白质","lncRNA可通过与DNA、RNA或蛋白质结合，以招募、支架或引导等方式调控基因表达，如Xist参与X染色体失活","lncRNA的作用方式与miRNA相同，均通过与靶mRNA完全互补配对切割mRNA","lncRNA不参与染色质水平的调控，只影响翻译过程"],"answer":2,"explain":"lncRNA一般长于200个核苷酸且不编码蛋白质，可通过与DNA、RNA或蛋白质结合发挥招募、支架、引导等作用，如Xist介导X染色体失活。","type":"A1","id":"c22-cb498edb"},{"id":"gc16-01-1","ch":23,"part":5,"tag":"识别","stem":"该患者的血小板计数与两项凝血时间测定都在正常范围，这一结果说明","options":["出血并非由凝血因子或血小板数量异常所致","出血由维生素K缺乏使凝血因子合成减少所致","出血由血管内压力升高使红细胞被动渗出所致","出血由纤维蛋白溶解过度使血凝块被溶解所致","出血由血小板功能亢进使微血栓形成所致"],"answer":0,"explain":"A 对：血小板计数与两项凝血时间测定都正常，说明出血并非凝血因子缺乏或血小板数量减少所致，结合血浆抗坏血酸明显降低，问题指向血管壁与伤口的胶原。B 错在维生素 K 缺乏会使凝血酶原时间延长；C 错在毛细血管内压升高并不是本例的机制；D 错在纤维蛋白溶解过度无法由这三项正常结果推出；E 错在血小板功能亢进引起的是血栓而不是出血。","type":"A1","group":"c16-01","kind":"mechanism","chs":[23,1,14],"vignette":"一名24岁船员随船作业3个月，船上只有咸肉与饼干，几乎没有新鲜蔬菜水果。近两周他牙龈肿胀出血，下肢出现多处瘀斑，小腿上一处旧伤口的裂口迟迟不愈。检查：血小板计数208×10⁹/L，凝血酶原时间与部分凝血活酶时间正常；血浆抗坏血酸5 μmol/L，明显低于正常下限。胶原前α链在粗面内质网中合成，其脯氨酸与赖氨酸残基需要羟化，三股螺旋才能稳定；催化这一步的羟化酶以抗坏血酸为辅因子，抗坏血酸缺乏时羟化不足，前胶原的三股螺旋在体温下不稳定，难以正常分泌并装配成纤维。分泌到细胞外的前胶原还要切除两端前肽，再由赖氨酰氧化酶催化形成共价交联，胶原纤维才具有抗张强度。他每天摄入的蛋白质总量并不少，饮食中缺少的只是新鲜果蔬。","vignette_title":"情景 1：三个月没吃新鲜菜的船员","gidx":1,"gn":5,"anchor":"凝血酶原时间与部分凝血活酶时间正常"},{"id":"gc16-01-4","ch":23,"part":5,"tag":"机制","stem":"分泌到细胞外的前胶原要成为有抗张强度的纤维，还必须经过","options":["在细胞外重新羟化，并由二硫键异构酶催化形成交联","被内吞回细胞，在高尔基复合体中加糖后再次分泌","由蛋白酶切去三段肽链，再由连接酶把断口连接起来","切除两端前肽，并由赖氨酰氧化酶催化形成共价交联","由整合素牵引成束，再由肌动蛋白把纤维拉直缩短"],"answer":3,"explain":"D 对：前胶原分泌到细胞外后，两端的前肽被前肽酶切除，胶原分子自发聚集，再由赖氨酰氧化酶催化形成共价交联，纤维才具有很高的抗张强度。A 错在羟化发生在前α链合成时的内质网中，而不是细胞外；B 错在前胶原不会再次被内吞回细胞加工；C 错在胶原并非切去三段肽链再连接成纤维；E 错在整合素与肌动蛋白参与的是细胞迁移的牵引，与胶原纤维的装配无关。","type":"A1","group":"c16-01","kind":"mechanism","chs":[23,1,14],"vignette":"一名24岁船员随船作业3个月，船上只有咸肉与饼干，几乎没有新鲜蔬菜水果。近两周他牙龈肿胀出血，下肢出现多处瘀斑，小腿上一处旧伤口的裂口迟迟不愈。检查：血小板计数208×10⁹/L，凝血酶原时间与部分凝血活酶时间正常；血浆抗坏血酸5 μmol/L，明显低于正常下限。胶原前α链在粗面内质网中合成，其脯氨酸与赖氨酸残基需要羟化，三股螺旋才能稳定；催化这一步的羟化酶以抗坏血酸为辅因子，抗坏血酸缺乏时羟化不足，前胶原的三股螺旋在体温下不稳定，难以正常分泌并装配成纤维。分泌到细胞外的前胶原还要切除两端前肽，再由赖氨酰氧化酶催化形成共价交联，胶原纤维才具有抗张强度。他每天摄入的蛋白质总量并不少，饮食中缺少的只是新鲜果蔬。","vignette_title":"情景 1：三个月没吃新鲜菜的船员","gidx":4,"gn":5,"anchor":"赖氨酰氧化酶催化形成共价交联"},{"id":"gc16-01-5","ch":23,"part":5,"tag":"判读","stem":"关于该船员的胶原合成障碍与临床表现，下列判断正确的是（X 型多选）","options":["抗坏血酸是脯氨酸与赖氨酸羟化酶的辅因子","羟化不足只影响三股螺旋稳定，不影响胶原的分泌","牙龈出血与旧伤口不愈都与胶原支持不足有关","补充抗坏血酸后，已经沉积的异常胶原可被修复","交联不足会使胶原纤维的抗张强度明显下降"],"answer":[0,2,4],"explain":"答案 ACE。A 对：情景已给出羟化酶以抗坏血酸为辅因子。C 对：牙龈出血与伤口不愈都属于胶原支持不足的表现。E 对：交联不足会直接降低胶原纤维的抗张强度。B 错在羟化不足不仅影响螺旋稳定，还使前胶原难以正常分泌；D 错在已经沉积的异常胶原不能靠补充抗坏血酸修复，补充只能保证新合成的胶原正常。","type":"X","group":"c16-01","kind":"mechanism","chs":[23,1,14],"vignette":"一名24岁船员随船作业3个月，船上只有咸肉与饼干，几乎没有新鲜蔬菜水果。近两周他牙龈肿胀出血，下肢出现多处瘀斑，小腿上一处旧伤口的裂口迟迟不愈。检查：血小板计数208×10⁹/L，凝血酶原时间与部分凝血活酶时间正常；血浆抗坏血酸5 μmol/L，明显低于正常下限。胶原前α链在粗面内质网中合成，其脯氨酸与赖氨酸残基需要羟化，三股螺旋才能稳定；催化这一步的羟化酶以抗坏血酸为辅因子，抗坏血酸缺乏时羟化不足，前胶原的三股螺旋在体温下不稳定，难以正常分泌并装配成纤维。分泌到细胞外的前胶原还要切除两端前肽，再由赖氨酰氧化酶催化形成共价交联，胶原纤维才具有抗张强度。他每天摄入的蛋白质总量并不少，饮食中缺少的只是新鲜果蔬。","vignette_title":"情景 1：三个月没吃新鲜菜的船员","gidx":5,"gn":5,"anchor":"旧伤口的裂口迟迟不愈"},{"id":"gc16-02-2","ch":23,"part":5,"tag":"机制","stem":"酶原蛋白总量几乎没有变化而胶原降解活性升至8倍，最合理的解释是","options":["该酶的基因发生扩增，酶蛋白的合成速度明显加快","该酶被磷酸化修饰后催化活性成倍升高，蛋白量不变","底物胶原被大量降解后，测得酶的比活性被动升高","该酶在溶酶体的酸性环境中被激活，故活性成倍升高","酶原被激活的比例升高，同时天然抑制剂的含量下降"],"answer":4,"explain":"E 对：抗体测得的酶原蛋白总量不变，说明酶蛋白的合成并未增加，活性升高只能来自酶原被激活的比例升高与抑制剂减少这两条途径，情景中 TIMP-1 由 1.0 降至 0.35 正与此相符。A 错在基因扩增会使酶蛋白总量明显增加；B 错在该类降解酶的活性并不靠磷酸化修饰调控；C 错在测定时加入足量底物，比活性不会因残留胶原减少而被动升高；D 错在免疫组化显示该酶位于细胞外的胶原纤维周围，而不是在溶酶体内被激活。","type":"A1","group":"c16-02","kind":"mechanism","chs":[23,24,25],"vignette":"一位28岁产妇产后6周复查，子宫湿重已由分娩时的约1000 g降至约60 g，肌层中Ⅰ型与Ⅲ型胶原的含量约为分娩时的10%。比较产后1周与6周的肌层活检：组织提取物的胶原降解活性由12 U/mg升至96 U/mg，而用抗体测得的酶原蛋白总量几乎没有变化；同期其天然抑制剂TIMP-1的含量由1.0降至0.35。体外加入外源的TIMP-1后，提取物的降解活性下降92%。免疫组化显示，该酶主要分布在胶原纤维周围，而子宫肌细胞经跨膜受体与基质中的胶原、纤连蛋白相连。复旧过程中肌细胞由肥大的铺展状态变回细长，与基质的黏附点随之重建。哺乳时吸吮刺激使神经垂体释放催产素，与子宫平滑肌细胞膜上的受体结合后引起强烈收缩。","vignette_title":"情景 2：产后六周缩回去的子宫","gidx":2,"gn":5,"anchor":"酶原蛋白总量几乎没有变化"},{"id":"gc16-02-3","ch":23,"part":5,"tag":"判读","stem":"向提取物中加入外源TIMP-1后降解活性下降92%，这一结果说明","options":["降解活性可被其天然抑制剂抑制，净降解取决于两者的平衡","该天然抑制剂直接降解了胶原，故测得的降解活性下降","该天然抑制剂与底物胶原结合，阻止降解酶靠近底物","该天然抑制剂使降解酶的前肽复位，酶原恢复无活性状态","该天然抑制剂抑制了胶原合成，故降解活性相对下降"],"answer":0,"explain":"A 对：加入外源 TIMP-1 后降解活性下降 92%，说明它能与降解酶结合并抑制其催化活性，基质净降解取决于酶原激活与抑制剂之间的平衡。B 错在抑制剂本身不能降解胶原；C 错在 TIMP-1 的作用对象是降解酶而不是底物胶原；D 错在抑制剂不能使已切除的前肽复位；E 错在胶原合成由细胞完成，抑制合成不会使测得的降解活性立刻下降。","type":"A1","group":"c16-02","kind":"mechanism","chs":[23,24,25],"vignette":"一位28岁产妇产后6周复查，子宫湿重已由分娩时的约1000 g降至约60 g，肌层中Ⅰ型与Ⅲ型胶原的含量约为分娩时的10%。比较产后1周与6周的肌层活检：组织提取物的胶原降解活性由12 U/mg升至96 U/mg，而用抗体测得的酶原蛋白总量几乎没有变化；同期其天然抑制剂TIMP-1的含量由1.0降至0.35。体外加入外源的TIMP-1后，提取物的降解活性下降92%。免疫组化显示，该酶主要分布在胶原纤维周围，而子宫肌细胞经跨膜受体与基质中的胶原、纤连蛋白相连。复旧过程中肌细胞由肥大的铺展状态变回细长，与基质的黏附点随之重建。哺乳时吸吮刺激使神经垂体释放催产素，与子宫平滑肌细胞膜上的受体结合后引起强烈收缩。","vignette_title":"情景 2：产后六周缩回去的子宫","gidx":3,"gn":5,"anchor":"降解活性下降92%"},{"id":"gc16-02-5","ch":23,"part":5,"tag":"判读","stem":"关于这例产后子宫复旧中的基质重塑，下列判断正确的是（X 型多选）","options":["复旧完成后，肌层基质不再发生任何合成与降解","复旧以基质的净降解大于合成为特征","降解酶以酶原形式分泌，其活性受天然抑制剂制约","基质降解酶属于丝氨酸蛋白酶，催化中心不含金属离子","胶原被降解后，细胞与基质的黏附及信号随之改变"],"answer":[1,2,4],"explain":"答案 BCE。B 对：子宫湿重与胶原含量同步大幅下降，说明净降解大于合成。C 对：该酶以酶原形式分泌并被 TIMP-1 抑制，外源抑制剂使活性下降 92% 即为证据。E 对：情景中肌细胞与基质的黏附点随复旧重建，说明黏附与信号随之改变。A 错在基质重塑贯穿一生，复旧完成后合成与降解仍在低水平持续；D 错在该酶是锌离子依赖的内肽酶，并不属于丝氨酸蛋白酶家族。","type":"X","group":"c16-02","kind":"mechanism","chs":[23,24,25],"vignette":"一位28岁产妇产后6周复查，子宫湿重已由分娩时的约1000 g降至约60 g，肌层中Ⅰ型与Ⅲ型胶原的含量约为分娩时的10%。比较产后1周与6周的肌层活检：组织提取物的胶原降解活性由12 U/mg升至96 U/mg，而用抗体测得的酶原蛋白总量几乎没有变化；同期其天然抑制剂TIMP-1的含量由1.0降至0.35。体外加入外源的TIMP-1后，提取物的降解活性下降92%。免疫组化显示，该酶主要分布在胶原纤维周围，而子宫肌细胞经跨膜受体与基质中的胶原、纤连蛋白相连。复旧过程中肌细胞由肥大的铺展状态变回细长，与基质的黏附点随之重建。哺乳时吸吮刺激使神经垂体释放催产素，与子宫平滑肌细胞膜上的受体结合后引起强烈收缩。","vignette_title":"情景 2：产后六周缩回去的子宫","gidx":5,"gn":5,"anchor":"与基质的黏附点随之重建"},{"id":"gc16-04-1","ch":23,"part":5,"tag":"方案","stem":"两组胶的蛋白质成分与培养基完全相同，唯一差别是弹性模量，这一设计的意义是","options":["把基质的蛋白成分作为自变量，排除力学性质的干扰","说明细胞在两种胶上的差异由培养时间的不同所引起","把基质的力学性质作为自变量，排除可溶蛋白成分的干扰","说明两种胶的成分并不相同，故两组结果不能比较","证明细胞在体外培养时必须使用基质胶铺底才能存活"],"answer":2,"explain":"C 对：两组胶的蛋白成分与培养基完全相同，只有弹性模量不同，故弹性模量是自变量，这一设计排除了可溶蛋白成分与培养条件对结果的干扰。A 错在把自变量与需要控制的变量写反；B 错在两组细胞的培养时间相同；D 错在按设计两组胶的成分是相同的；E 错在本实验比较的是刚度差异，并不能证明铺底是细胞存活的必要条件。","type":"A1","group":"c16-04","kind":"experiment","chs":[23,9,25],"vignette":"把同一批成纤维细胞接种到两种基质胶上：甲组胶的弹性模量为0.5 kPa（接近脂肪），乙组为25 kPa（接近肌肉）。两组胶的蛋白质成分完全相同，都含层粘连蛋白与Ⅳ型胶原，培养基也相同。24小时后固定染色：甲组细胞小而圆，黏着斑面积约为乙组的1/5；乙组铺展良好，胞质出现大量平行排列的肌动蛋白束，黏着斑内聚集的整合素明显增多。丙组在乙组基础上加入含RGD序列的可溶性多肽，2小时后细胞变圆、肌动蛋白束解聚。另取乙组细胞接种于可拉伸硅胶膜，施加10%、0.5 Hz的周期性牵张30分钟，胞质钙离子荧光强度升高3.2倍；提前加入机械敏感通道阻断剂后升幅被抑制85%，牵张5分钟后MAPK磷酸化升高4倍。阳性对照加入表皮生长因子5分钟后MAPK磷酸化也升高4倍。","vignette_title":"情景 4：软胶、硬胶和一张被拉伸的膜","gidx":1,"gn":6,"anchor":"两组胶的蛋白质成分完全相同"},{"id":"gc16-04-3","ch":23,"part":5,"tag":"机制","stem":"丙组加入含RGD序列的可溶性多肽后细胞变圆、肌动蛋白束解聚，这一结果说明","options":["可溶多肽进入细胞后，直接抑制了肌动蛋白的聚合过程","可溶多肽降解了胶中的层粘连蛋白，使基质结构被破坏","可溶多肽与钙离子结合，使整合素失去与配体结合的能力","可溶多肽竞争性占据整合素位点，使细胞与基质的黏附中断","可溶多肽激活细胞内的蛋白酶，使黏着斑蛋白被降解掉"],"answer":3,"explain":"D 对：含 RGD 序列的可溶性多肽能与整合素结合，竞争性占据其配体结合位点，使细胞与基质之间的黏附中断，故细胞变圆、应力纤维解聚。A 错在 RGD 多肽作用于细胞表面的整合素，并不进入细胞；B 错在多肽不会降解胶中的层粘连蛋白；C 错在整合素对 RGD 的识别不依靠钙离子螯合；E 错在该结果没有涉及胞内蛋白酶对黏着斑蛋白的降解。","type":"A1","group":"c16-04","kind":"experiment","chs":[23,9,25],"vignette":"把同一批成纤维细胞接种到两种基质胶上：甲组胶的弹性模量为0.5 kPa（接近脂肪），乙组为25 kPa（接近肌肉）。两组胶的蛋白质成分完全相同，都含层粘连蛋白与Ⅳ型胶原，培养基也相同。24小时后固定染色：甲组细胞小而圆，黏着斑面积约为乙组的1/5；乙组铺展良好，胞质出现大量平行排列的肌动蛋白束，黏着斑内聚集的整合素明显增多。丙组在乙组基础上加入含RGD序列的可溶性多肽，2小时后细胞变圆、肌动蛋白束解聚。另取乙组细胞接种于可拉伸硅胶膜，施加10%、0.5 Hz的周期性牵张30分钟，胞质钙离子荧光强度升高3.2倍；提前加入机械敏感通道阻断剂后升幅被抑制85%，牵张5分钟后MAPK磷酸化升高4倍。阳性对照加入表皮生长因子5分钟后MAPK磷酸化也升高4倍。","vignette_title":"情景 4：软胶、硬胶和一张被拉伸的膜","gidx":3,"gn":6,"anchor":"细胞变圆、肌动蛋白束解聚"},{"id":"gc16-04-6","ch":23,"part":5,"tag":"判读","stem":"关于本组实验的设计与结论，下列判断正确的是（X 型多选）","options":["细胞能感受基质弹性模量的差异，并据此改变铺展与骨架装配","丙组结果支持细胞与基质的黏附依赖整合素识别RGD序列","该实验证明细胞形态完全由基质的力学性质所决定","阻断剂抑制钙升高，提示机械敏感通道参与力学信号转导","甲组细胞小而圆，说明接种在软胶上的细胞已经发生凋亡"],"answer":[0,1,3],"explain":"答案 ABD。A 对：成分相同而刚度不同的两种胶上，细胞铺展与骨架装配明显不同，说明细胞能感受基质的弹性模量。B 对：RGD 多肽竞争整合素后黏附丧失，支持整合素识别 RGD 序列。D 对：通道阻断剂使牵张引起的钙离子升高被抑制 85%，提示机械敏感通道参与把力学刺激转变为胞内信号。C 错在细胞形态还受可溶因子与细胞自身状态影响，本实验不能证明力学性质是唯一的决定因素；E 错在细胞变圆是黏附与骨架改变的表现，情景并未提供凋亡的证据。","type":"X","group":"c16-04","kind":"experiment","chs":[23,9,25],"vignette":"把同一批成纤维细胞接种到两种基质胶上：甲组胶的弹性模量为0.5 kPa（接近脂肪），乙组为25 kPa（接近肌肉）。两组胶的蛋白质成分完全相同，都含层粘连蛋白与Ⅳ型胶原，培养基也相同。24小时后固定染色：甲组细胞小而圆，黏着斑面积约为乙组的1/5；乙组铺展良好，胞质出现大量平行排列的肌动蛋白束，黏着斑内聚集的整合素明显增多。丙组在乙组基础上加入含RGD序列的可溶性多肽，2小时后细胞变圆、肌动蛋白束解聚。另取乙组细胞接种于可拉伸硅胶膜，施加10%、0.5 Hz的周期性牵张30分钟，胞质钙离子荧光强度升高3.2倍；提前加入机械敏感通道阻断剂后升幅被抑制85%，牵张5分钟后MAPK磷酸化升高4倍。阳性对照加入表皮生长因子5分钟后MAPK磷酸化也升高4倍。","vignette_title":"情景 4：软胶、硬胶和一张被拉伸的膜","gidx":6,"gn":6,"anchor":"黏着斑内聚集的整合素明显增多"},{"id":"gc5-01-1","ch":23,"part":5,"tag":"机制","stem":"B株降解基底膜结构成分所依赖的酶，其性质是","options":["丝氨酸蛋白酶，以活性形式分泌，催化中心不含任何金属离子","金属蛋白酶，由细胞核内合成后以酶原形式分泌并激活","锌离子依赖的内肽酶，多以酶原形式分泌，活性受抑制剂调控","半胱氨酸蛋白酶，由细胞内质网合成后直接分泌到细胞外","天冬氨酸蛋白酶，在溶酶体内水解基质成分并使其降解"],"answer":2,"explain":"C对：情景指出B株分泌的是基质金属蛋白酶，该类酶属锌离子依赖的内肽酶，多以酶原形式分泌并被激活，活性受TIMP等抑制，可降解胶原等多种基质成分。A错：丝氨酸蛋白酶是另一类蛋白酶，不是基质金属蛋白酶的类别。E错：在溶酶体内酸性水解的是被吞入的物质，不是分泌到细胞外降解基膜的酶。D错：半胱氨酸蛋白酶与基质金属蛋白酶无关。B错：该酶在核糖体上合成，不在细胞核内合成。","type":"A1","group":"c5-01","kind":"mechanism","chs":[23,24,9],"vignette":"研究者把两株人源上皮肿瘤细胞接种到铺有基底膜提取物的培养皿中：A株取自原位癌，B株取自同一患者的淋巴结转移灶。24小时后，A株在缺乏基质附着的区域大量变圆、核浓缩，逐渐脱落死亡；B株却继续铺展良好，培养基中可检出其分泌的基质金属蛋白酶。检测显示，A株细胞膜上的E-钙黏素表达正常，而B株的E-钙黏素几乎检测不到，其整合素与纤连蛋白的结合反而增强。加入基质金属蛋白酶抑制剂后，B株穿过基底膜的比例从62%降到9%。","vignette_title":"情景 1：一株脱落，一株钻了过去","gidx":1,"gn":5,"anchor":"可检出其分泌的基质金属蛋白酶"},{"id":"gc5-01-2","ch":23,"part":5,"tag":"判读","stem":"加入抑制剂后B株穿膜比例由62%降至9%，这一结果说明","options":["降解基底膜是细胞穿过基膜屏障的必要环节","细胞穿膜的能力主要由其自身的增殖速度决定","细胞穿膜依赖钙离子，而蛋白酶抑制剂只影响黏附","基底膜对细胞的迁移不构成有效的机械屏障","细胞穿膜依靠黏附分子牵引，与蛋白水解无关"],"answer":0,"explain":"A对：抑制剂把穿膜比例从62%压到9%，直接说明水解基底膜是穿膜的必要环节，基膜成分被降解后细胞才能通过。D错：基膜恰恰是阻挡细胞扩散的屏障，若不起屏障作用则抑制剂不会有效。E错：若穿膜只靠黏附分子牵引，抑制蛋白酶不应使比例大幅下降。C错：抑制剂作用于酶而不作用于黏附，其效应无法用钙离子解释。B错：抑制剂并未改变增殖速度，结果只反映水解环节被阻断。","type":"A1","group":"c5-01","kind":"mechanism","chs":[23,24,9],"vignette":"研究者把两株人源上皮肿瘤细胞接种到铺有基底膜提取物的培养皿中：A株取自原位癌，B株取自同一患者的淋巴结转移灶。24小时后，A株在缺乏基质附着的区域大量变圆、核浓缩，逐渐脱落死亡；B株却继续铺展良好，培养基中可检出其分泌的基质金属蛋白酶。检测显示，A株细胞膜上的E-钙黏素表达正常，而B株的E-钙黏素几乎检测不到，其整合素与纤连蛋白的结合反而增强。加入基质金属蛋白酶抑制剂后，B株穿过基底膜的比例从62%降到9%。","vignette_title":"情景 1：一株脱落，一株钻了过去","gidx":2,"gn":5,"anchor":"穿过基底膜的比例从62%降到9%"},{"ch":23,"part":5,"tag":"基质成分","stem":"关于细胞外基质（ECM）的主要成分及其生理作用，下列叙述正确的是？","options":["弹性蛋白赋予组织抗张强度，胶原赋予组织弹性","胶原构成纤维网架赋予组织抗张强度，蛋白聚糖高度水化形成凝胶赋予组织抗压性，二者是基质的主要结构成分","纤连蛋白是基底膜的主要成分，层粘连蛋白主要存在于血浆中","细胞外基质只提供机械支撑，不参与细胞增殖、分化与迁移的调控","细胞外基质的组成在各组织中完全相同，且一旦形成即不再改变"],"answer":1,"explain":"胶原提供抗张强度、弹性蛋白提供弹性，蛋白聚糖形成水化凝胶赋予抗压性；ECM还经受体传递信号并被不断重塑。","type":"A1","id":"c23-8d6b2c46"},{"ch":23,"part":5,"tag":"胶原","stem":"胶原（collagen）是人体中含量最多的蛋白质。关于其结构与合成的叙述，正确的是？","options":["胶原肽链中甘氨酸残基位于三股螺旋外侧，脯氨酸位于螺旋轴心","胶原分子由两条α链缠绕成三股螺旋，链间主要以二硫键维持稳定","胶原肽链具有Gly-X-Y特征性重复序列，三条α链缠绕成三股螺旋；脯氨酸和赖氨酸残基的羟化需要维生素C参与","胶原的羟化修饰发生在细胞外，缺乏维生素C时胶原合成不受影响","所有类型的胶原都形成典型的周期性横纹纤维"],"answer":2,"explain":"胶原为人体含量最多的蛋白质，具Gly-X-Y重复序列，三条α链形成三股螺旋，脯氨酸羟化需维生素C，缺乏时三股螺旋不稳定。","type":"A1","id":"c23-ae4228a6"},{"ch":23,"part":5,"tag":"弹性蛋白","stem":"关于弹性蛋白与蛋白聚糖的叙述，正确的是？","options":["弹性蛋白富含羟脯氨酸，与胶原一样形成三股螺旋结构","蛋白聚糖由核心蛋白与糖胺聚糖共价连接而成，主要赋予组织抗张强度和弹性","弹性蛋白由细胞分泌后立即形成纤维，不需要交联","弹性蛋白由原弹性蛋白分泌后经交联形成弹性纤维网，赋予组织弹性；蛋白聚糖高度水化，赋予组织抗压性","蛋白聚糖只存在于细胞外基质中，不能与细胞膜结合"],"answer":3,"explain":"弹性蛋白经交联形成纤维网赋予组织弹性，蛋白聚糖高度水化赋予抗压性；两者与胶原共同决定基质的力学特性。","type":"A1","id":"c23-03b009c3"},{"ch":23,"part":5,"tag":"黏附糖蛋白","stem":"关于纤连蛋白（fibronectin）与层粘连蛋白（laminin）的叙述，正确的是？","options":["纤连蛋白含RGD序列，可被整合素识别，介导细胞与基质的黏附并影响细胞迁移；层粘连蛋白是基底膜的主要成分","层粘连蛋白由两条肽链构成，是血浆中的主要黏附蛋白","纤连蛋白的受体是选择素，故其黏附依赖钙离子","纤连蛋白只由肝细胞合成，仅存在于血浆中","层粘连蛋白与纤连蛋白均只起机械连接作用，不参与信号转导"],"answer":0,"explain":"纤连蛋白的RGD序列被整合素识别，介导黏附与迁移；层粘连蛋白由α、β、γ三条链构成，是基底膜的主要成分。","type":"A1","id":"c23-428eb971"},{"ch":23,"part":5,"tag":"整合素","stem":"整联蛋白（integrin）也被称为细胞黏附分子，其原因是？","options":["整联蛋白只与细胞外基质配体结合，不参与细胞间的黏附","整联蛋白是存在于细胞外基质中的可溶性蛋白","整联蛋白是由α、β亚基组成的跨膜异二聚体，既能与细胞外基质配体结合，又经胞内结构与细胞骨架相连，介导细胞与基质及细胞间的黏附","整联蛋白通过糖链识别配体，其黏附不依赖蛋白质与蛋白质的相互作用","整联蛋白只表达于血细胞和内皮细胞表面"],"answer":2,"explain":"整联蛋白为αβ跨膜异二聚体，胞外结合基质配体、胞内连接细胞骨架，同时介导细胞-基质与细胞-细胞黏附，故属黏附分子。","type":"A1","id":"c23-69cc0d76"},{"ch":23,"part":5,"tag":"体外培养铺底","stem":"某些细胞在体外培养时必须用含细胞外基质成分的材料铺底，其原因是？","options":["细胞外基质成分可作为主要营养物质被细胞摄取利用","铺底材料只提供机械支撑，与细胞信号转导无关","铺底材料可抑制细胞增殖，使细胞保持静止状态","铺底材料可改变培养基的渗透压和pH值","铺底基质经整合素等受体为细胞提供黏附与存活、增殖信号，缺少时细胞易发生失巢凋亡"],"answer":4,"explain":"细胞通过整合素等受体与基质成分结合，获得黏附与存活、增殖信号；失去基质附着时细胞发生失巢凋亡，故须铺底。","type":"A1","id":"c23-e1eb7daf"},{"ch":23,"part":5,"tag":"基质与疾病","stem":"肝纤维化的发生与细胞外基质密切相关，其机制是？","options":["肝内细胞外基质合成减少，肝组织失去支撑结构","肝星状细胞活化后大量合成胶原等基质成分，同时基质降解减少，导致细胞外基质在肝内过度沉积","肝纤维化仅由炎症细胞浸润引起，与细胞外基质沉积无关","肝纤维化时基质金属蛋白酶活性显著升高，基质被大量降解","肝纤维化时沉积的基质成分与正常肝脏完全相同，仅是数量略减"],"answer":1,"explain":"肝损伤后肝星状细胞活化为肌成纤维细胞样细胞，胶原等基质合成增加而降解减少，基质在肝内过度沉积形成纤维化。","type":"A1","id":"c23-8a2a9ba9"},{"ch":23,"part":5,"tag":"基质与细胞","stem":"关于细胞与细胞外基质之间的相互作用，下列叙述正确的是？","options":["细胞外基质是惰性的被动支架，细胞不参与其合成与降解","细胞与细胞外基质的相互作用只发生在胚胎发育阶段","细胞外基质仅通过机械支撑影响细胞，不经受体传递信号","细胞外基质一旦形成便终身保持不变","细胞对细胞外基质的合成、分泌、组装、重塑和降解有决定性作用，基质又通过细胞表面受体调控细胞增殖、分化、迁移与凋亡"],"answer":4,"explain":"细胞与细胞外基质是双向相互作用：细胞决定基质的合成与重塑，基质经受体引发信号转导，调控增殖、分化、迁移与凋亡。","type":"A1","id":"c23-272510cd"},{"ch":23,"part":5,"tag":"胶原类型","stem":"关于胶原的类型及其组织分布，下列叙述正确的是？","options":["人体内含量最多的胶原是Ⅳ型胶原，主要分布于皮肤和肌腱","Ⅱ型胶原是构成骨与肌腱的主要胶原，Ⅰ型胶原主要存在于软骨","Ⅳ型胶原以粗大的纤维束形式存在，是软骨的主要胶原成分","胶原的类型与其组织分布无关，任何组织中都只含有一种胶原","Ⅰ型胶原分布最广、含量最多，主要存在于皮肤、肌腱和骨；Ⅳ型胶原不形成纤维束，以网状结构构成基底膜"],"answer":4,"explain":"Ⅰ型胶原含量最多，见于皮肤、肌腱与骨；Ⅱ型主要在软骨，Ⅳ型不形成纤维而以网状结构构成基膜；各组织所含胶原类型不同。","type":"A1","id":"c23-9babbc00"},{"ch":23,"part":5,"tag":"胶原组装","stem":"关于胶原分子在细胞外的组装与稳定，下列叙述正确的是？","options":["前胶原分泌到细胞外后，其N端和C端前肽被切除，胶原分子自发聚集并经赖氨酰氧化酶催化形成共价交联","前胶原的前肽在细胞内即被全部切除，故细胞外不存在前肽酶活性","胶原分子的共价交联由二硫键异构酶催化，与赖氨酸残基无关","胶原纤维一旦形成即不再发生任何共价修饰，因而不能被降解","胶原的共价交联发生在细胞内，由核糖体催化完成"],"answer":0,"explain":"前胶原分泌到细胞外后经前肽酶切除N端、C端前肽，再自发装配成原纤维并由赖氨酰氧化酶催化形成共价交联，使胶原具有很高抗张力。","type":"A1","id":"c23-e22eb1a9"},{"ch":23,"part":5,"tag":"糖胺聚糖","stem":"关于糖胺聚糖（GAG）的叙述，正确的是？","options":["糖胺聚糖由核心蛋白与糖链共价连接而成，故又称黏多糖蛋白","透明质酸是硫酸化程度最高的糖胺聚糖，与核心蛋白共价结合","糖胺聚糖由重复的二糖单位构成，多经硫酸化而带大量负电荷，能结合水和阳离子形成凝胶；透明质酸不与核心蛋白共价结合","糖胺聚糖不带电荷，故不能结合水和阳离子","糖胺聚糖只存在于关节软骨，其他组织中不存在"],"answer":2,"explain":"糖胺聚糖由重复二糖单位组成，多经硫酸化带大量负电荷，可结合水与阳离子形成水化凝胶；透明质酸不含硫酸、不与核心蛋白共价连接。","type":"A1","id":"c23-406899b6"},{"ch":23,"part":5,"tag":"基膜","stem":"关于基底膜（基膜）的组成与组装，下列叙述正确的是？","options":["基膜由Ⅰ型胶原和弹性蛋白构成，不含层粘连蛋白","基膜主要由Ⅳ型胶原、层粘连蛋白、巢蛋白和蛋白聚糖等组成，层粘连蛋白与Ⅳ型胶原等相互作用形成网络","层粘连蛋白是基膜中唯一的成分，其作用仅为机械支撑","基膜只存在于上皮组织下方，血管内皮细胞和肌细胞周围没有基膜","基膜一旦形成便不再更新，也不影响细胞的黏附与极性"],"answer":1,"explain":"基膜以Ⅳ型胶原网状结构和层粘连蛋白网络为主，并含巢蛋白、蛋白聚糖，广泛存在于上皮下、血管内皮及肌细胞周围，影响细胞黏附、极性与分化。","type":"A1","id":"c23-eca25ab6"},{"ch":23,"part":5,"tag":"基质金属蛋白酶","stem":"关于基质金属蛋白酶（MMP）的叙述，正确的是？","options":["MMP属于丝氨酸蛋白酶，其催化中心不含金属离子","MMP只能降解胶原以外的其他基质成分，不能降解胶原","MMP的活性由组织金属蛋白酶抑制剂（TIMP）激活而增强","MMP是Zn²⁺依赖的内肽酶，可降解多种细胞外基质成分，参与组织重塑、炎症与肿瘤侵袭，其活性受TIMP等抑制","MMP在细胞核内合成后直接分泌，不需要以酶原形式存在"],"answer":3,"explain":"MMP为Zn²⁺依赖性内肽酶，多以酶原形式分泌并被激活，可降解胶原等多种基质成分，参与组织重塑与肿瘤侵袭，活性受TIMP抑制。","type":"A1","id":"c23-ab1f4825"},{"ch":23,"part":5,"tag":"肿瘤转移","stem":"关于细胞外基质与肿瘤侵袭转移的关系，下列叙述正确的是？","options":["肿瘤细胞转移时细胞外基质完全不起作用，仅取决于肿瘤细胞自身的增殖速度","肿瘤细胞可分泌MMP等降解基底膜与基质、发生上皮-间质转化并改变整合素表达，从而穿过基膜侵入血管并在远处形成转移灶","肿瘤细胞离开原发灶后因失去基质黏附必然迅速发生失巢凋亡，故不会形成转移","肿瘤转移只与基因突变有关，与细胞外基质成分及基质降解酶无关","基底膜是阻止肿瘤细胞扩散的屏障，肿瘤细胞无法将其降解"],"answer":1,"explain":"肿瘤细胞分泌MMP降解基膜与基质，经上皮-间质转化获得迁移能力并改变黏附分子表达、抵抗失巢凋亡，从而侵入血管并在远处形成转移灶。","type":"A1","id":"c23-875a04ac"},{"ch":23,"part":5,"tag":"弹性纤维与疾病","stem":"关于弹性纤维与马方综合征（Marfan syndrome），下列叙述正确的是？","options":["马方综合征由胶原基因突变引起，患者胶原合成障碍","马方综合征为常染色体隐性遗传病，患者弹性纤维过度增生","原纤维蛋白（fibrillin）本身就是弹性蛋白，与微纤维无关","马方综合征的主动脉夹层与弹性纤维无关，仅由血压升高引起","马方综合征多由FBN1基因突变引起，原纤维蛋白构成的微纤维是弹性纤维的支架，突变使弹性纤维结构异常，导致骨骼、眼和心血管（如主动脉瘤）病变"],"answer":4,"explain":"FBN1编码原纤维蛋白，其微纤维是弹性纤维沉积与组装的支架；突变使弹性纤维结构异常，引起马方综合征的骨骼、眼和主动脉病变，为常染色体显性遗传。","type":"A1","id":"c23-7d3bf8e3"},{"ch":23,"part":5,"tag":"蛋白聚糖功能","stem":"关于蛋白聚糖（proteoglycan）在细胞外基质中的作用，下列叙述正确的是？","options":["蛋白聚糖除作为基质结构成分外，还可作为膜型共受体参与细胞与生长因子的结合，并可作为生长因子的储存库调节其活性","蛋白聚糖只提供机械支撑，不参与任何信号转导过程","蛋白聚糖与生长因子结合后使其完全失活，从而抑制细胞增殖","蛋白聚糖的水化作用很弱，对组织的抗压性没有贡献","蛋白聚糖的功能仅限于关节软骨，与细胞增殖和迁移无关"],"answer":0,"explain":"蛋白聚糖既可形成水化凝胶赋予组织抗压性，又可作为膜型共受体和生长因子储存库，参与细胞增殖、迁移与分化的调控。","type":"A1","id":"c23-55f0213a"},{"id":"gc10-01-3","ch":24,"part":5,"tag":"识别","stem":"该蛋白在细胞间形成的连接结构，其分子组成与骨架连接是","options":["由整合素与中间纤维相连，属半桥粒的分子组成","由连接蛋白与中间纤维相连，属缝隙连接的分子组成","由选择素与肌动蛋白微丝相连，属黏着连接的分子组成","由钙黏素与肌动蛋白微丝相连，属黏着连接的分子组成","由桥粒钙黏素与中间纤维相连，属锚定连接的分子组成"],"answer":4,"explain":"E 对：情景中该蛋白的胞内段经桥粒斑蛋白与角蛋白中间纤维相连，说明它形成的是桥粒；桥粒由桥粒芯蛋白、桥粒胶蛋白等桥粒钙黏素与桥粒斑蛋白构成，属锚定连接。A 错：整合素与中间纤维相连是半桥粒的组成，它把细胞锚定在基底膜上；B 错：连接蛋白构成缝隙连接，与中间纤维不相连；C 错：选择素介导白细胞与内皮细胞的暂时性黏附，不参与该连接；D 错：钙黏素经连环蛋白与肌动蛋白微丝相连是黏着连接的组成，与本例的中间纤维不符。","type":"A1","group":"c10-01","kind":"mechanism","chs":[7,8,24],"vignette":"在人表皮角质形成细胞中，一种单次跨膜的黏附蛋白（桥粒芯蛋白）在粗面内质网上边合成边插入内质网膜：N 端信号肽被切除，跨膜的疏水区段作为停止转移序列把肽链锚定在膜中，N-连接的糖链则加在朝向内质网腔的一侧。该蛋白随后由 COPII 囊泡运到高尔基复合体，糖链被进一步修剪，表观分子量由 130 kDa 变为 160 kDa，再由囊泡送到相邻细胞相互接触的部位；免疫电镜显示其胞内段经桥粒斑蛋白与角蛋白中间纤维相连。寻常型天疱疮患者的血清中含有识别该蛋白胞外段的抗体，把该抗体加入培养的角质形成细胞单层，12 小时后细胞间黏附丧失、细胞彼此分离；若先用含胞外段的可溶性蛋白预吸附抗体，细胞单层则保持完整。","vignette_title":"情景 1：新合成的桥要搭在哪里","gidx":3,"gn":5,"anchor":"其胞内段经桥粒斑蛋白与角蛋白中间纤维相连"},{"id":"gc10-01-4","ch":24,"part":5,"tag":"判读","stem":"用可溶性胞外段预吸附抗体后细胞单层保持完整，这一对照说明","options":["水疱形成依赖抗体结合胞外段，属自身免疫损伤","水疱形成源于抗体进入细胞后降解角蛋白丝","水疱形成源于抗体阻断糖链加工使蛋白错位","水疱形成源于抗体抑制囊泡运输使连接缺料","水疱形成源于细胞毒性淋巴细胞对靶细胞的杀伤"],"answer":0,"explain":"A 对：先用含胞外段的可溶性蛋白吸走抗体，细胞单层便保持完整，说明损伤由抗体与胞外段的结合引起，属自身抗体介导的细胞间黏附丧失。B 错：抗体识别的是胞外段，无法进入细胞去降解角蛋白丝；C 错：若糖链加工受阻，蛋白不能被正常加工与投递，与预吸附后细胞完整的结果不符；D 错：情景显示囊泡运输并未被抗体阻断；E 错：该对照用的是患者血清中的抗体，并未涉及细胞毒性淋巴细胞的杀伤。","type":"A1","group":"c10-01","kind":"mechanism","chs":[7,8,24],"vignette":"在人表皮角质形成细胞中，一种单次跨膜的黏附蛋白（桥粒芯蛋白）在粗面内质网上边合成边插入内质网膜：N 端信号肽被切除，跨膜的疏水区段作为停止转移序列把肽链锚定在膜中，N-连接的糖链则加在朝向内质网腔的一侧。该蛋白随后由 COPII 囊泡运到高尔基复合体，糖链被进一步修剪，表观分子量由 130 kDa 变为 160 kDa，再由囊泡送到相邻细胞相互接触的部位；免疫电镜显示其胞内段经桥粒斑蛋白与角蛋白中间纤维相连。寻常型天疱疮患者的血清中含有识别该蛋白胞外段的抗体，把该抗体加入培养的角质形成细胞单层，12 小时后细胞间黏附丧失、细胞彼此分离；若先用含胞外段的可溶性蛋白预吸附抗体，细胞单层则保持完整。","vignette_title":"情景 1：新合成的桥要搭在哪里","gidx":4,"gn":5,"anchor":"若先用含胞外段的可溶性蛋白预吸附抗体"},{"id":"gc10-02-4","ch":24,"part":5,"tag":"识别","stem":"关于神经元这类高度极化细胞的细胞极性，下列叙述正确的是","options":["细胞极性主要出现在分裂期细胞，与间期细胞关系不大","极性表现为顶底极性与前后极性等模式，与骨架装置相关","细胞极性的建立与微丝、微管和高尔基复合体没有关系","细胞极性一旦形成就不再改变，也不受细胞外因素影响","极化细胞质膜上的蛋白质可在整个细胞表面均匀分布"],"answer":1,"explain":"B 对：细胞极性表现为分裂间期细胞的顶底极性、前后极性与平面极性等模式，在细胞内与微丝、微管、高尔基复合体等有极性的装置高度关联。A 错：顶底极性等模式主要出现在分裂间期细胞，分裂期细胞表现为 OCD 与 ACD 等极性模式；C 错：极性的建立恰恰依赖微丝、微管与高尔基复合体等有极性的结构；D 错：细胞极性可被微环境因素重塑，形态发生素 WNTs 即参与其中；E 错：极化细胞的质膜蛋白是分域分布的，不会在整个表面均匀分布。","type":"A1","group":"c10-02","kind":"mechanism","chs":[9,8,24],"vignette":"在运动神经元的轴突中，微管排成长束，正极统一背离胞体、指向末梢；微管结合蛋白 tau 结合在微管壁上，使微管保持稳定。胞体合成的膜蛋白被装入囊泡，沿微管被马达蛋白牵向末梢；末梢内吞形成的信号内体则被反向运回胞体，两者方向相反。取阿尔茨海默病患者的脑组织做免疫荧光：tau 过度磷酸化后从微管上脱落，聚集成神经原纤维缠结；轴突内微管数量减少、排列紊乱，载有膜蛋白的囊泡在轴突中段堆积增多，末梢区域的囊泡明显减少，轴突末梢因得不到新的膜成分而变性。神经元是高度极化的细胞，其轴突与树突在形态和膜成分上都有明显差别。","vignette_title":"情景 2：轴突传送带上的堵塞","gidx":4,"gn":5,"anchor":"神经元是高度极化的细胞"},{"id":"gc16-02-1","ch":24,"part":5,"tag":"识别","stem":"子宫肌细胞经跨膜受体与基质中的胶原、纤连蛋白相连，该受体是","options":["钙黏素，以同亲性方式连接相邻细胞的同类分子","整合素，由α与β两条亚基组成的跨膜异二聚体","选择素，识别细胞表面唾液酸化的糖链配体","免疫球蛋白超家族分子，胞外含免疫球蛋白样折叠域","连接蛋白，组成连接子并在相邻细胞间形成通道"],"answer":1,"explain":"B 对：介导细胞与基质成分结合并向胞内传递信号的跨膜受体是整合素，它由 α 与 β 两条亚基组成异二聚体，胞外识别配体、胞内与细胞骨架相连。A 错在钙黏素介导的是细胞与细胞之间的同亲性黏附；C 错在选择素识别糖链并介导白细胞与内皮的暂时黏附；D 错在免疫球蛋白超家族分子多介导细胞之间的黏附；E 错在连接蛋白构成的是缝隙连接的通道。","type":"A1","group":"c16-02","kind":"mechanism","chs":[23,24,25],"vignette":"一位28岁产妇产后6周复查，子宫湿重已由分娩时的约1000 g降至约60 g，肌层中Ⅰ型与Ⅲ型胶原的含量约为分娩时的10%。比较产后1周与6周的肌层活检：组织提取物的胶原降解活性由12 U/mg升至96 U/mg，而用抗体测得的酶原蛋白总量几乎没有变化；同期其天然抑制剂TIMP-1的含量由1.0降至0.35。体外加入外源的TIMP-1后，提取物的降解活性下降92%。免疫组化显示，该酶主要分布在胶原纤维周围，而子宫肌细胞经跨膜受体与基质中的胶原、纤连蛋白相连。复旧过程中肌细胞由肥大的铺展状态变回细长，与基质的黏附点随之重建。哺乳时吸吮刺激使神经垂体释放催产素，与子宫平滑肌细胞膜上的受体结合后引起强烈收缩。","vignette_title":"情景 2：产后六周缩回去的子宫","gidx":1,"gn":5,"anchor":"与基质中的胶原、纤连蛋白相连"},{"id":"gc23-01-3","ch":24,"part":5,"tag":"机制","stem":"迁移细胞前缘新形成的黏着斑能在数分钟内由弱结合转为强结合，这一变化属于","options":["由外向内信号，配体结合后直接改变整合素的构象","由内向外信号，细胞内信号改变整合素构象而亲和力升高","同亲性黏附，相邻细胞表面的同类整合素彼此结合","钙依赖黏附，细胞外钙离子升高使整合素亲和力升高","选择素介导的暂时性黏附被整合素介导的牢固黏附取代"],"answer":1,"explain":"B 对：细胞内信号蛋白结合整合素 β 亚基的胞内段，使整合素由弯曲的低亲和力构象变为伸展的高亲和力构象，与配体的结合随之增强，属由内向外信号。A 错：由外向内信号是配体结合后向细胞内传递，方向恰好相反；C 错：整合素识别的是基质中的蛋白配体，并非与相邻细胞的同类分子结合；D 错：整合素与配体的结合依赖二价阳离子，但数分钟内的亲和力升高由胞内信号引起；E 错：选择素介导白细胞与内皮的暂时性黏附，与黏着斑的增强不是同一回事。","type":"A1","group":"c23-01","kind":"mechanism","chs":[9,24,4],"vignette":"人真皮成纤维细胞在培养皿中长满单层后，用移液器尖划出一道宽约 1 mm 的无细胞区。6 小时后边缘细胞向空缺处迁移：前缘伸出扁平的片状伪足，其中的微丝由 Arp2/3 复合体在已有微丝的侧面成核、长出分支，把质膜向前推；前缘的微丝在正极端不断聚合、在负极端不断解聚，其净长度却保持稳定。伪足后方不断形成新的黏着斑，经整合素与基质中的纤连蛋白相连，充当牵引支点；细胞体中央的肌球蛋白 II 沿微丝滑行产生收缩，把细胞体向前拖；尾部的黏着斑解聚，尾部随之回缩。荧光定量显示，1 小时内前缘新增黏着斑约 40 个、尾部消失约 35 个。迁移前沿的质膜在 30 分钟内增加约 20%，这些膜来自胞质中囊泡与质膜的融合。","vignette_title":"情景 1：划痕边缘的四步循环","gidx":3,"gn":5,"anchor":"经整合素与基质中的纤连蛋白相连"},{"id":"gc23-03-1","ch":24,"part":5,"tag":"机制","stem":"表达激酶失活的 aPKC 突变体后界限变模糊而囊泡运输未受影响，这说明","options":["aPKC 的激酶活性负责把 Par 复合体招募到顶端","aPKC 通过水解 ATP 直接为囊泡沿微管的运输供能","aPKC 的激酶活性通过磷酸化底物维持膜域界限","aPKC 是构成微管马达蛋白复合物的必需亚基","aPKC 的激酶活性决定有丝分裂时纺锤体的朝向"],"answer":2,"explain":"C 对：情景显示 aPKC 的激酶活性丧失后，Par 复合体的定位与囊泡运输都不受影响，唯一改变的是两个膜域标志蛋白的界限，说明该激酶通过磷酸化底物把不属于顶端域的分子排斥出去，从而维持膜域的界限。A 错：Par 复合体仍能定位到顶端皮层，说明其招募不依赖该激酶活性；B 错：囊泡沿微管的运输由马达蛋白水解 ATP 驱动，与 aPKC 无关；D 错：aPKC 并不是马达蛋白复合物的亚基；E 错：分裂期纺锤体的朝向与本情景中膜域界限的表型无关。","type":"A1","group":"c23-03","kind":"mechanism","chs":[8,24,9],"vignette":"培养的肾上皮细胞在滤膜上长成致密单层后表现出顶底极性，朝向培养液的顶端膜与朝向基底面的膜在蛋白组成上明显不同。该细胞的高尔基复合体位于细胞核上方、靠近顶端膜一侧。免疫荧光显示，Par3、Par6 与 aPKC 组成的复合体集中在顶端膜下方的皮层，侧面与基底面则富集另一类极性蛋白，两类分子的分布界限清晰。新合成的顶端膜蛋白在高尔基复合体反面网络被分选入囊泡，随后沿细胞质中的微管被马达蛋白运往细胞顶端，与顶端质膜融合；追踪 1 小时，约 70% 的新合成顶端膜蛋白出现在顶端膜上，只有 6% 出现在侧面膜。若表达一种激酶失活的 aPKC 突变体，Par 复合体仍能定位到顶端皮层，但顶端与侧面标志蛋白的分布界限变得模糊，新合成顶端膜蛋白出现在顶端膜的比例降到 25%、出现在侧面的比例升到 40%，而囊泡的出芽与沿微管运输的速度都没有明显改变。","vignette_title":"情景 3：顶端膜上的地址是怎么写上的","gidx":1,"gn":5,"anchor":"但顶端与侧面标志蛋白的分布界限变得模糊"},{"id":"gc23-03-2","ch":24,"part":5,"tag":"判读","stem":"该细胞中高尔基复合体靠近顶端膜一侧，这一空间安排的意义是","options":["使新合成的膜蛋白能就近、有方向地被送往顶端域","使高尔基复合体免受细胞质中蛋白酶体的降解","使细胞内的膜蛋白集中到顶端膜上再行分配","使微管的正极端统一朝向基底面而负极朝向顶端","使细胞核被固定在细胞中央，便于染色体的分离"],"answer":0,"explain":"A 对：细胞极性在细胞内与微丝、微管、高尔基复合体等有极性的装置高度关联，高尔基复合体靠近顶端一侧，使新合成的膜蛋白与分泌蛋白能就近、有方向地经囊泡送往顶端域。B 错：高尔基复合体的空间位置与蛋白酶体的降解无关；C 错：膜蛋白并非先集中到顶端膜再分配，侧面膜与基底面膜蛋白另有投递路线；D 错：上皮细胞中微管的极性取向不能由高尔基复合体的位置一概而论；E 错：细胞核的位置由微管与核骨架等维持，与分裂期染色体的分离无直接联系。","type":"A1","group":"c23-03","kind":"mechanism","chs":[8,24,9],"vignette":"培养的肾上皮细胞在滤膜上长成致密单层后表现出顶底极性，朝向培养液的顶端膜与朝向基底面的膜在蛋白组成上明显不同。该细胞的高尔基复合体位于细胞核上方、靠近顶端膜一侧。免疫荧光显示，Par3、Par6 与 aPKC 组成的复合体集中在顶端膜下方的皮层，侧面与基底面则富集另一类极性蛋白，两类分子的分布界限清晰。新合成的顶端膜蛋白在高尔基复合体反面网络被分选入囊泡，随后沿细胞质中的微管被马达蛋白运往细胞顶端，与顶端质膜融合；追踪 1 小时，约 70% 的新合成顶端膜蛋白出现在顶端膜上，只有 6% 出现在侧面膜。若表达一种激酶失活的 aPKC 突变体，Par 复合体仍能定位到顶端皮层，但顶端与侧面标志蛋白的分布界限变得模糊，新合成顶端膜蛋白出现在顶端膜的比例降到 25%、出现在侧面的比例升到 40%，而囊泡的出芽与沿微管运输的速度都没有明显改变。","vignette_title":"情景 3：顶端膜上的地址是怎么写上的","gidx":2,"gn":5,"anchor":"位于细胞核上方、靠近顶端膜一侧"},{"id":"gc23-04-5","ch":24,"part":5,"tag":"判读","stem":"在细胞侧面局部活化光控蛋白后，该处伸出新的片状伪足、原前缘回缩，这说明","options":["细胞的前后极性一旦建立便不再改变，与局部信号无关","迁移方向由细胞核与中心体的空间位置预先决定","新前缘的形成需要微管在质膜下先行聚合延长","细胞的极性可被局部信号重塑，迁移方向随之改变","细胞迁移方向由基质中黏附配体的浓度梯度唯一决定"],"answer":3,"explain":"D 对：在非前缘的部位局部活化光控蛋白就能诱导出新的片状伪足，并使原前缘回缩，说明细胞的前后极性并非固定不变，局部信号可以重塑极性、改变迁移方向。A 错：本实验正是极性与迁移方向被改变的反例；B 错：迁移方向并不是由细胞核与中心体的空间位置预先决定的；C 错：片状伪足由肌动蛋白聚合推动，与微管无关；E 错：基质中的黏附配体影响黏附强度，但本实验中方向随局部信号改变，并非由配体浓度单独决定。","type":"A1","group":"c23-04","kind":"experiment","chs":[8,9,24],"vignette":"研究生的课题是追踪迁移细胞前缘膜成分的来源。他在成纤维细胞中表达一种光转化荧光蛋白，用 405 nm 光照射细胞中央高尔基体所在的区域，把这批蛋白的荧光由绿色转为红色，再用活细胞成像连续追踪红色囊泡 30 分钟。对照组：约 65% 的红色囊泡沿固定方向移到前缘并与质膜融合，前缘质膜面积增加约 20%。甲组：加 10 μmol/L 诺考达唑 2 小时使微管解聚，红色囊泡改为在胞质中随机扩散，到达前缘的比例降到 8%。乙组：加细胞松弛素 B 使微丝解聚，红色囊泡仍被运到细胞外周、方向与速度接近对照，但前缘不再伸出片状伪足，前缘质膜面积只增加约 4%，囊泡在皮层下方堆积。丙组：加抑制肌球蛋白 II 的药物，伪足伸出与囊泡融合都接近对照，但细胞体不再前移、尾部不能回缩。另在细胞侧面用蓝光局部照射，使一种光控蛋白在该处活化并引起肌动蛋白聚合，5 分钟内该侧伸出新的片状伪足，原前缘在 20 分钟内回缩，细胞的迁移方向随之改变。","vignette_title":"情景 4：绿变红之后，囊泡去了哪里","gidx":5,"gn":6,"anchor":"细胞的迁移方向随之改变"},{"id":"gc5-01-3","ch":24,"part":5,"tag":"机制","stem":"A株细胞脱离基质附着后变圆、核浓缩并脱落死亡，其起始原因是","options":["基质金属蛋白酶在细胞内被大量激活而死亡","整合素失去配体结合，由外向内信号随之中断","细胞核内基因表达程序被直接关闭而死亡","整合素构象由弯曲变为伸展，与配体亲和力升高","钙黏素与钙离子结合减少，细胞之间黏附丧失"],"answer":1,"explain":"B对：整合素与基质配体结合后向胞内传递由外向内信号，为细胞提供存活信号；失去附着后该信号中断，细胞发生失巢凋亡，表现为变圆、核浓缩、脱落。D错：由内向外信号是胞内信号改变整合素构象以升高亲和力，与死亡无关。E错：A株的E-钙黏素表达正常，细胞间黏附并未减少。C错：核内基因表达改变是下游结果，不是起始原因。A错：基质金属蛋白酶在细胞外降解基质，且B株该酶更多却未死亡。","type":"A1","group":"c5-01","kind":"mechanism","chs":[23,24,9],"vignette":"研究者把两株人源上皮肿瘤细胞接种到铺有基底膜提取物的培养皿中：A株取自原位癌，B株取自同一患者的淋巴结转移灶。24小时后，A株在缺乏基质附着的区域大量变圆、核浓缩，逐渐脱落死亡；B株却继续铺展良好，培养基中可检出其分泌的基质金属蛋白酶。检测显示，A株细胞膜上的E-钙黏素表达正常，而B株的E-钙黏素几乎检测不到，其整合素与纤连蛋白的结合反而增强。加入基质金属蛋白酶抑制剂后，B株穿过基底膜的比例从62%降到9%。","vignette_title":"情景 1：一株脱落，一株钻了过去","gidx":3,"gn":5,"anchor":"在缺乏基质附着的区域大量变圆"},{"id":"gc5-01-5","ch":24,"part":5,"tag":"判读","stem":"关于本实验中两株细胞的差异，下列判断正确的是（X 型多选）","options":["细胞脱离基质后存活信号中断，可启动凋亡程序","整合素既能结合基质配体，又经胞内结构与骨架相连","基质金属蛋白酶降解基膜成分，参与肿瘤的侵袭","B株细胞间黏附减弱，与其E-钙黏素表达下调一致","细胞分化程度越高，其基因组丢失的基因就越多"],"answer":[0,1,2,3],"explain":"答案 ABCD。D对：B株E-钙黏素几乎检测不到，与上皮-间质转化时细胞间黏附减弱相一致。A对：失去基质附着使整合素介导的存活信号中断，可启动凋亡程序，即失巢凋亡。B对：整合素是α、β亚基组成的跨膜异二聚体，胞外结合基质配体，胞内经胞内结构与细胞骨架相连。C对：基质金属蛋白酶可降解Ⅳ型胶原、层粘连蛋白等基膜成分，是肿瘤侵袭转移的重要环节。E错：细胞分化不涉及基因组丢失，基因组保持完整，差异来自组织特异性基因的选择性表达。","type":"X","group":"c5-01","kind":"mechanism","chs":[23,24,9],"vignette":"研究者把两株人源上皮肿瘤细胞接种到铺有基底膜提取物的培养皿中：A株取自原位癌，B株取自同一患者的淋巴结转移灶。24小时后，A株在缺乏基质附着的区域大量变圆、核浓缩，逐渐脱落死亡；B株却继续铺展良好，培养基中可检出其分泌的基质金属蛋白酶。检测显示，A株细胞膜上的E-钙黏素表达正常，而B株的E-钙黏素几乎检测不到，其整合素与纤连蛋白的结合反而增强。加入基质金属蛋白酶抑制剂后，B株穿过基底膜的比例从62%降到9%。","vignette_title":"情景 1：一株脱落，一株钻了过去","gidx":5,"gn":5,"anchor":"E-钙黏素几乎检测不到"},{"id":"gc5-02-1","ch":24,"part":5,"tag":"机制","stem":"无钙培养液使黏着连接解体，其分子基础是","options":["钙离子升高胞质黏度，使相邻细胞被机械地粘在一起","钙离子直接催化肌动蛋白聚合成微丝而维持细胞形态","整合素与基质配体的结合需要钙离子参与才能完成","钙离子通过激活蛋白激酶使连接蛋白磷酸化而稳定","钙黏素胞外段需结合钙离子才能介导同亲性黏附"],"answer":4,"explain":"E对：钙黏素是钙离子依赖的同亲性黏附分子，胞外段结合钙离子后才具有刚性并介导相邻细胞间的黏附，无钙时黏着连接解体。C错：整合素介导细胞与基质的黏附，不是相邻细胞之间的黏着连接。B错：钙离子不催化肌动蛋白聚合，微丝组装依靠ATP-肌动蛋白的聚合与解聚动力学。D错：钙离子并非通过激活蛋白激酶使连接蛋白磷酸化来稳定连接。A错：黏附依靠分子的特异识别与结合，不是胞质黏度造成的机械粘连。","type":"A1","group":"c5-02","kind":"mechanism","chs":[24,8,27],"vignette":"把培养的单层肠上皮细胞置于无钙培养液中，30分钟后电镜下可见相邻细胞之间的黏着连接解体、细胞间隙增宽，位于细胞顶端的封闭带也随之断裂。荧光标记显示：原本只分布在顶端膜上的转运体，此时扩散到了基底面；基底面的钠钾泵也出现在顶端膜上。细胞新合成的顶端膜蛋白仍能被包装入囊泡并运往细胞表面，但囊泡无法在顶端定位。研究者改用低浓度钙离子培养液（0.1mmol/L）后，上述变化在2小时内才缓慢出现。","vignette_title":"情景 2：把钙离子拿走之后","gidx":1,"gn":5,"anchor":"相邻细胞之间的黏着连接解体"},{"id":"gc5-02-2","ch":24,"part":5,"tag":"机制","stem":"顶端膜的转运体扩散到了基底面，其直接原因是","options":["高尔基体停止加工，膜蛋白的糖链被全部切除","紧密连接的栅栏功能丧失，膜蛋白得以侧向扩散","紧密连接通道开放，顶端膜蛋白经通道流向基底面","细胞骨架解聚，使膜蛋白被随机地重新分配到两侧","黏着连接解体使细胞间隙增宽，膜蛋白随之外漏"],"answer":1,"explain":"B对：紧密连接位于上皮细胞顶端，其栅栏功能把顶端膜与基底面的膜蛋白分隔开并限制其侧向扩散；封闭带断裂后，顶端膜蛋白便扩散到基底面。C错：紧密连接封闭细胞间隙，并不存在供膜蛋白通过的通道。E错：细胞间隙增宽是黏着连接解体的结果，膜蛋白不是经间隙漏出。D错：情景中并未出现细胞骨架解聚，膜蛋白的移动也不需要随机再分配。A错：新合成的顶端膜蛋白仍能被包装入囊泡，说明高尔基体加工正常。","type":"A1","group":"c5-02","kind":"mechanism","chs":[24,8,27],"vignette":"把培养的单层肠上皮细胞置于无钙培养液中，30分钟后电镜下可见相邻细胞之间的黏着连接解体、细胞间隙增宽，位于细胞顶端的封闭带也随之断裂。荧光标记显示：原本只分布在顶端膜上的转运体，此时扩散到了基底面；基底面的钠钾泵也出现在顶端膜上。细胞新合成的顶端膜蛋白仍能被包装入囊泡并运往细胞表面，但囊泡无法在顶端定位。研究者改用低浓度钙离子培养液（0.1mmol/L）后，上述变化在2小时内才缓慢出现。","vignette_title":"情景 2：把钙离子拿走之后","gidx":2,"gn":5,"anchor":"此时扩散到了基底面"},{"id":"gc5-02-3","ch":24,"part":5,"tag":"机制","stem":"调控上皮细胞顶底极性的核心装置是","options":["黏着连接复合体，由钙黏素与连环蛋白共同组成","缝隙连接复合体，由六个连接蛋白亚基共同组成","中间纤维网络，由角蛋白与波形蛋白共同组成","CPP复合体，由Par与Scribble等组成","紧密连接复合体，由闭合蛋白与咬合蛋白
