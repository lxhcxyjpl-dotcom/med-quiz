低直接使脂肪动员减弱，血游离脂肪酸下降","同一 PKA 通过磷酸化开启糖原分解并关闭糖原合成","血酮体升高提示肝内酮体生成超过肝外组织利用能力"],"answer":[0,1,3,4],"explain":"答案 ABDE。D 对：同一磷酸化修饰对糖原磷酸化酶与糖原合酶作用相反，实现分解与合成的单向调度。B 对：情景数据即为胰高血糖素升高、胰岛素降低。A 对：果糖-2,6-二磷酸下降抑制 PFK-1 并激活果糖二磷酸酶-1，肝转向糖异生。E 对：酮体升高说明生成速度超过肝外组织利用能力。C 错：胰岛素降低是解除对激素敏感性甘油三酯脂肪酶的抑制，脂肪动员应增强、血游离脂肪酸升高。","type":"X","group":"c8-01","kind":"mechanism","chs":[25,16,11,12],"vignette":"一名青年因车祸大出血急诊入院。血浆肾上腺素升至正常的 12 倍，胰高血糖素升至 3 倍，胰岛素降至正常的四分之一；血糖 11.2 mmol/L，血游离脂肪酸由 0.4 升至 1.8 mmol/L，血酮体 1.1 mmol/L，尿氮排出明显增多。肝细胞内 cAMP 由 0.5 升至 4.0 μmol/L，PKA 被活化；果糖-2,6-二磷酸由 12 降至 2 nmol/g，糖原磷酸化酶活性升至 90%，糖原合酶活性降至 10%。","vignette_title":"情景 1：一个信号，同时开三条流水线","gidx":6,"gn":6,"anchor":"胰岛素降至正常的四分之一"},{"id":"gc8-02-1","ch":16,"part":3,"tag":"判读","stem":"禁食 12 至 24 小时维持血糖的主要机制是","options":["脂肪动员产生的脂肪酸在肝内直接异生为葡萄糖","血酮体转变为葡萄糖，成为空腹血糖的主要来源","肝糖原减少后肝糖异生增强，原料为乳酸、甘油和氨基酸","肝糖原持续大量分解入血，足以让血糖数天不下降","肌糖原直接分解为葡萄糖入血，可稳定补充血糖"],"answer":2,"explain":"C 对：禁食 12 至 24 小时后肝糖原明显减少，糖异生增强并成为血糖的主要来源，原料是乳酸、甘油和生糖氨基酸，与肝糖原降至 8 g 仍能维持血糖相符。B 肝糖原总量有限，不可能维持数天。C 肌细胞缺乏葡糖-6-磷酸酶，肌糖原不能直接补充血糖。D 脂肪酸不能大量异生为葡萄糖，丙酮酸脱氢酶反应不可逆使乙酰辅酶A不能净生糖。E 酮体不能被转变为葡萄糖，只能被氧化利用。","type":"A1","group":"c8-02","kind":"mechanism","chs":[16,12,11],"vignette":"一名健康志愿者参加 72 小时禁食试验，期间只饮水。禁食 12 小时血糖 4.6 mmol/L，24 小时 4.1 mmol/L，72 小时 3.8 mmol/L，肝糖原由 70 g 降至 24 小时的 8 g。血游离脂肪酸由 0.4 升至 1.9 mmol/L，血酮体由 0.1 升至 5.6 mmol/L，脑组织摄取的酮体约占其耗能的 60%。肝内磷酸烯醇式丙酮酸羧激酶活性升高 3 倍，其 mRNA 含量同步升高 4 倍。尿氮排出在 24 小时达高峰，72 小时比 24 小时减少约 40%。试验结束后口服 100 g 葡萄糖，30 分钟后血浆胰岛素由 6 升至 42 mU/L，血糖 6.8 mmol/L。","vignette_title":"情景 2：禁食 72 小时里，脑换了一种燃料","gidx":1,"gn":6,"anchor":"禁食 12 小时血糖 4.6"},{"id":"gc8-02-2","ch":16,"part":3,"tag":"机制","stem":"该酶活性与 mRNA 同步升高，说明其调节方式主要是","options":["效应物与酶结合引起构象改变，属快速可逆的别构调节","激素诱导酶蛋白合成增多，属缓慢而持久的酶含量调节","磷酸化修饰改变酶活性，属级联放大的化学修饰调节","细胞内温度与 pH 变化影响酶活性，属环境因素的调节","底物浓度升高直接加快反应速度，属不受调控的被动过程"],"answer":1,"explain":"B 对：禁食时胰高血糖素等诱导糖异生关键酶基因表达，mRNA 与酶活性同步升高，属改变酶合成速率的酶含量调节，作用缓慢而持久。B 别构调节靠效应物结合、秒级起效，不涉及 mRNA 增多。C 化学修饰调节改变的是已有酶的活性，不会使 mRNA 升高。D 底物浓度变化不引起 mRNA 与酶蛋白同步增多。E 温度与 pH 属体外实验条件，不能解释体内持续数天的酶量升高。","type":"A1","group":"c8-02","kind":"mechanism","chs":[16,12,11],"vignette":"一名健康志愿者参加 72 小时禁食试验，期间只饮水。禁食 12 小时血糖 4.6 mmol/L，24 小时 4.1 mmol/L，72 小时 3.8 mmol/L，肝糖原由 70 g 降至 24 小时的 8 g。血游离脂肪酸由 0.4 升至 1.9 mmol/L，血酮体由 0.1 升至 5.6 mmol/L，脑组织摄取的酮体约占其耗能的 60%。肝内磷酸烯醇式丙酮酸羧激酶活性升高 3 倍，其 mRNA 含量同步升高 4 倍。尿氮排出在 24 小时达高峰，72 小时比 24 小时减少约 40%。试验结束后口服 100 g 葡萄糖，30 分钟后血浆胰岛素由 6 升至 42 mU/L，血糖 6.8 mmol/L。","vignette_title":"情景 2：禁食 72 小时里，脑换了一种燃料","gidx":2,"gn":6,"anchor":"mRNA 含量同步升高 4 倍"},{"id":"gc8-02-4","ch":16,"part":3,"tag":"判读","stem":"72 小时尿氮排出比 24 小时减少约 40%，最合理的解释是","options":["肌肉蛋白质分解加剧，但生成的氨基酸多用于合成蛋白","肾小球滤过率下降，血中尿素不能正常排出而在体内蓄积","脑组织改用酮体供能，糖异生需求下降，蛋白质分解被节约","脂肪动员取代糖异生，氨基酸不再参与葡萄糖的生成","肝内尿素合成酶活性下降，氮不能转变为尿素排出体外"],"answer":2,"explain":"C 对：长期禁食时脑组织以酮体为主要能源，对葡萄糖的需求下降，机体减少糖异生而节约蛋白质，尿氮反而减少，与脑摄取酮体占其耗能 60% 相互印证。B 若为排出障碍，血中尿素氮会升高，与尿氮减少不符。C 尿素合成并未停止，且氮排出减少提示生成减少而非合成障碍。D 长期禁食时蛋白质分解实际是减少的。E 糖异生仍在进行，仍以甘油、乳酸和少量氨基酸为原料维持血糖。","type":"A1","group":"c8-02","kind":"mechanism","chs":[16,12,11],"vignette":"一名健康志愿者参加 72 小时禁食试验，期间只饮水。禁食 12 小时血糖 4.6 mmol/L，24 小时 4.1 mmol/L，72 小时 3.8 mmol/L，肝糖原由 70 g 降至 24 小时的 8 g。血游离脂肪酸由 0.4 升至 1.9 mmol/L，血酮体由 0.1 升至 5.6 mmol/L，脑组织摄取的酮体约占其耗能的 60%。肝内磷酸烯醇式丙酮酸羧激酶活性升高 3 倍，其 mRNA 含量同步升高 4 倍。尿氮排出在 24 小时达高峰，72 小时比 24 小时减少约 40%。试验结束后口服 100 g 葡萄糖，30 分钟后血浆胰岛素由 6 升至 42 mU/L，血糖 6.8 mmol/L。","vignette_title":"情景 2：禁食 72 小时里，脑换了一种燃料","gidx":4,"gn":6,"anchor":"72 小时比 24 小时减少约 40%"},{"id":"gc8-02-6","ch":16,"part":3,"tag":"判读","stem":"关于禁食与进食切换中的代谢调节，下列判断正确的是（X 型多选）","options":["肝糖原在禁食 24 小时后已明显减少，糖异生成为血糖主要来源","禁食时胰高血糖素升高，经 cAMP-PKA 促进糖原分解与糖异生","长期禁食时脑以酮体供能，可减少糖异生对蛋白质的消耗","进食后胰岛素升高，肝糖原合成与脂肪合成增强，糖异生受抑","禁食期间血中游离脂肪酸下降，肝内酮体生成随之减少"],"answer":[0,1,2,3],"explain":"答案 ABCD。B 对：胰高血糖素经 cAMP-PKA 级联激活糖原磷酸化酶、促进糖异生关键酶表达。C 对：脑改用酮体后葡萄糖需求下降，蛋白质分解减少，尿氮降低正是节约蛋白质的表现。D 对：进食后胰岛素升高，促进肝糖原与脂肪合成并抑制糖异生与脂肪动员。A 对：肝糖原由 70 g 降至 8 g，血糖仍能维持，说明糖异生已接替成为主要来源。E 错：禁食时脂肪动员增强，血游离脂肪酸升高而不是下降，酮体生成也随之增多。","type":"X","group":"c8-02","kind":"mechanism","chs":[16,12,11],"vignette":"一名健康志愿者参加 72 小时禁食试验，期间只饮水。禁食 12 小时血糖 4.6 mmol/L，24 小时 4.1 mmol/L，72 小时 3.8 mmol/L，肝糖原由 70 g 降至 24 小时的 8 g。血游离脂肪酸由 0.4 升至 1.9 mmol/L，血酮体由 0.1 升至 5.6 mmol/L，脑组织摄取的酮体约占其耗能的 60%。肝内磷酸烯醇式丙酮酸羧激酶活性升高 3 倍，其 mRNA 含量同步升高 4 倍。尿氮排出在 24 小时达高峰，72 小时比 24 小时减少约 40%。试验结束后口服 100 g 葡萄糖，30 分钟后血浆胰岛素由 6 升至 42 mU/L，血糖 6.8 mmol/L。","vignette_title":"情景 2：禁食 72 小时里，脑换了一种燃料","gidx":6,"gn":6,"anchor":"尿氮排出在 24 小时达高峰"},{"id":"gc8-04-1","ch":16,"part":3,"tag":"判读","stem":"丙组各项指标与甲组接近，这一结果说明","options":["H89 直接抑制糖原磷酸化酶，与 PKA 无关","胰高血糖素的代谢效应需经 cAMP 激活 PKA 才能传递","cAMP 是胰高血糖素的受体，二者结合后启动级联","胰高血糖素的代谢效应由受体酪氨酸激酶通路独立完成","胰高血糖素通过降低 cAMP 浓度而发挥上述代谢效应"],"answer":1,"explain":"B 对：先用 H89 抑制 PKA，胰高血糖素引起的糖原减少、葡萄糖输出与果糖-2,6-二磷酸下降全部消失，说明 cAMP 升高后的效应由 PKA 传递。D 错在胰高血糖素受体是 G 蛋白偶联受体，不经受体酪氨酸激酶通路。C 若 H89 直接抑制磷酸化酶，则不应同时抹掉葡萄糖输出与果糖-2,6-二磷酸的变化。C 错在 cAMP 是第二信使而不是受体。E 方向写反，胰高血糖素使 cAMP 升高而不是降低。","type":"A1","group":"c8-04","kind":"experiment","chs":[16,11,13],"vignette":"研究生用离体大鼠肝细胞做三组实验：甲组为对照，乙组加入 10 nmol/L 胰高血糖素，丙组先加入 PKA 抑制剂 H89 再加同样浓度的胰高血糖素。孵育 30 分钟后，乙组细胞内 cAMP 由 0.6 升至 4.8 μmol/L，糖原由 45 降至 20 mg/g 蛋白，培养基中葡萄糖由 0.8 升至 2.4 mmol/L，果糖-2,6-二磷酸由 11 降至 3 nmol/g；丙组各项指标与甲组接近。另取一组以 ¹⁴C 标记的乳酸为底物孵育，加入胰高血糖素后培养基中放射性葡萄糖比对照升高 2.3 倍。分离肝细胞线粒体测定 P/O：以琥珀酸为底物时为 1.5，以谷氨酸加苹果酸为底物时为 2.5。","vignette_title":"情景 4：三组肝细胞与一组放射性计数","gidx":1,"gn":5,"anchor":"丙组各项指标与甲组接近"},{"id":"gc8-04-5","ch":16,"part":3,"tag":"判读","stem":"关于该实验的设计与结论，下列判断正确的是（X 型多选）","options":["放射性底物法属于核素示踪，可用于追踪代谢物的转变","丙组说明 PKA 被抑制后，胰高血糖素的代谢效应随之消失","该实验足以证明培养基中新增葡萄糖全部来自糖异生","P/O 的测定用离体线粒体，与肝细胞的孵育实验不冲突","甲组为空白对照，用于判断胰高血糖素处理引起的改变"],"answer":[0,1,3,4],"explain":"答案 ABDE。E 对：甲组不加任何处理，是判断乙组各项指标变化的空白对照。B 对：丙组在 PKA 被抑制后指标回到对照水平，说明效应经 PKA 传递。A 对：用放射性核素标记底物追踪其转变与分布即核素示踪法，是研究代谢途径的经典方法。D 对：P/O 比值需用离体线粒体测定，与整体细胞孵育测代谢物互不冲突，可互为补充。C 错：加胰高血糖素后葡萄糖输出增多只说明糖异生被促进，并未证明新增葡萄糖全部来自糖异生，该结论过于绝对。","type":"X","group":"c8-04","kind":"experiment","chs":[16,11,13],"vignette":"研究生用离体大鼠肝细胞做三组实验：甲组为对照，乙组加入 10 nmol/L 胰高血糖素，丙组先加入 PKA 抑制剂 H89 再加同样浓度的胰高血糖素。孵育 30 分钟后，乙组细胞内 cAMP 由 0.6 升至 4.8 μmol/L，糖原由 45 降至 20 mg/g 蛋白，培养基中葡萄糖由 0.8 升至 2.4 mmol/L，果糖-2,6-二磷酸由 11 降至 3 nmol/g；丙组各项指标与甲组接近。另取一组以 ¹⁴C 标记的乳酸为底物孵育，加入胰高血糖素后培养基中放射性葡萄糖比对照升高 2.3 倍。分离肝细胞线粒体测定 P/O：以琥珀酸为底物时为 1.5，以谷氨酸加苹果酸为底物时为 2.5。","vignette_title":"情景 4：三组肝细胞与一组放射性计数","gidx":5,"gn":5,"anchor":"丙组先加入 PKA 抑制剂 H89"},{"ch":16,"part":3,"tag":"糖脂蛋白互变","stem":"关于糖、脂质、蛋白质在体内相互转变的叙述，正确的是","options":["脂肪可大量转变为葡萄糖，故禁食时血糖主要来自脂肪","蛋白质可完全转变为糖和脂肪，且转变不受限制","糖可以大量转变为必需氨基酸","脂肪酸可直接经糖异生途径转变为葡萄糖","糖易转变为脂肪，而脂肪不能大量转变为糖，因乙酰辅酶A不能净生成丙酮酸"],"answer":4,"explain":"糖分解产生的乙酰CoA可合成脂肪酸和甘油，故糖易转变为脂肪；但丙酮酸脱氢酶反应不可逆，乙酰CoA不能净生糖，故脂肪不能大量转变为糖。","type":"A1","id":"c16-b5761e64"},{"ch":16,"part":3,"tag":"糖异生关键酶","stem":"下列全部属于糖异生关键酶的一组是","options":["丙酮酸羧化酶、磷酸烯醇式丙酮酸羧激酶、果糖二磷酸酶-1、葡糖-6-磷酸酶","己糖激酶、磷酸果糖激酶-1、丙酮酸激酶","丙酮酸激酶、果糖二磷酸酶-1、葡糖-6-磷酸酶","乙酰辅酶A羧化酶、HMG-CoA还原酶、柠檬酸合酶","磷酸果糖激酶-1、丙酮酸羧化酶、乳酸脱氢酶"],"answer":0,"explain":"糖异生的4个关键酶是丙酮酸羧化酶、PEP羧激酶、果糖二磷酸酶-1和葡糖-6-磷酸酶；己糖激酶、磷酸果糖激酶-1、丙酮酸激酶是糖酵解的关键酶。","type":"A1","id":"c16-c29f19ec"},{"ch":16,"part":3,"tag":"化学修饰调节","stem":"关于化学修饰（共价修饰）调节关键酶活性的叙述，正确的是","options":["通过改变酶蛋白的合成速率发挥作用，缓慢而持久","本质上属于别构调节，不涉及酶分子共价键的改变","以磷酸化与去磷酸化为主，经级联反应具有放大效应，调节快速","修饰后酶活性的改变不可逆","同一个酶不可能同时受别构调节和化学修饰调节"],"answer":2,"explain":"化学修饰调节以磷酸化/去磷酸化为主，经级联放大快速改变酶活性；改变酶合成或降解速率的是酶含量调节，作用缓慢持久，且两种快速调节方式常相辅相成。","type":"A1","id":"c16-61fd0f75"},{"ch":16,"part":3,"tag":"激素调节","stem":"关于激素对物质代谢调节的叙述，正确的是","options":["胰高血糖素通过降低细胞内cAMP水平抑制糖原分解","胰岛素促进肝糖原分解，使血糖升高","肾上腺素通过激活蛋白磷酸酶使糖原合酶活化","胰高血糖素与肝细胞膜受体结合，激活腺苷酸环化酶使cAMP升高，促进糖原分解和糖异生","胰岛素与受体结合后主要通过cAMP-PKA途径传递信号"],"answer":3,"explain":"胰高血糖素经cAMP-PKA级联使糖原磷酸化酶活化、糖原合酶受抑，升高血糖；胰岛素受体为酪氨酸激酶型，促进糖原合成、抑制糖异生而降低血糖。","type":"A1","id":"c16-a1f32dd0"},{"ch":16,"part":3,"tag":"饥饿代谢","stem":"长期饥饿（数天以上）时，体内代谢变化正确的是","options":["肝糖原大量分解，成为血糖的主要来源","脂肪动员增强，酮体成为脑组织的主要能源，蛋白质分解减少","肌肉蛋白质大量分解，糖异生显著增强","血中游离脂肪酸下降，肝内酮体生成减少","脑组织改以脂肪酸为主要能源"],"answer":1,"explain":"长期饥饿时肝糖原已耗尽，脂肪动员增强，肝生成大量酮体供脑组织利用，机体减少蛋白质分解以节约蛋白质；脂肪酸不能透过血脑屏障。","type":"A1","id":"c16-31ed4b3b"},{"ch":16,"part":3,"tag":"器官代谢特点","stem":"关于各组织器官能量代谢特点的叙述，正确的是","options":["成熟红细胞含丰富线粒体，可彻底氧化葡萄糖供能","骨骼肌含葡糖-6-磷酸酶，可直接补充血糖","脑组织糖原储备丰富，并可利用脂肪酸供能","肝是唯一能进行糖异生的器官，且不能生成酮体","成熟红细胞无线粒体，只能靠糖酵解供能；肝是糖异生和酮体生成的重要器官"],"answer":4,"explain":"成熟红细胞无线粒体，只能经无氧糖酵解供能；肝富含葡糖-6-磷酸酶，是糖异生、尿素合成和酮体生成的重要器官，骨骼肌缺乏该酶故不能直接补血糖。","type":"A1","id":"c16-03a6dd27"},{"ch":16,"part":3,"tag":"糖尿病酮症","stem":"糖尿病患者容易发生酮症酸中毒的生化机制是","options":["胰岛素绝对或相对不足，脂肪动员加强，肝生成酮体超过肝外组织利用能力","胰岛素分泌过多促进脂肪合成，使酮体生成增加","血糖降低使脑组织改用酮体供能，造成酮体堆积","肝内脂肪酸β氧化受抑制，酮体不能生成而血中堆积","糖异生作用减弱，使酮体成为机体主要能源"],"answer":0,"explain":"胰岛素不足时糖利用障碍、脂肪动员加强，肝内脂肪酸β氧化产生大量乙酰CoA，酮体生成超过肝外利用能力，血酮升高引起酮症酸中毒。","type":"A1","id":"c16-8157cf38"},{"ch":16,"part":3,"tag":"代谢中枢","stem":"称三羧酸循环是物质代谢的中枢（共同通路），其主要依据是","options":["三羧酸循环只能在肝细胞线粒体中进行","三羧酸循环本身直接生成大量ATP，占机体ATP来源的一半","糖、脂质、蛋白质分解代谢均生成乙酰辅酶A，经三羧酸循环彻底氧化，其产物又为相互转变提供共同中间物","三羧酸循环是所有合成代谢途径的共同起点","三羧酸循环中的每一种酶都是调节代谢的关键酶"],"answer":2,"explain":"三大营养物质分解产生的乙酰CoA均进入三羧酸循环彻底氧化，循环中间物又是糖异生、脂肪酸和非必需氨基酸合成的原料；ATP主要由氧化磷酸化生成。","type":"A1","id":"c16-5f0d2517"},{"ch":16,"part":3,"tag":"饱食状态","stem":"饱食（餐后）状态下机体物质代谢的主要变化是","options":["胰岛素分泌减少，胰高血糖素分泌增多","肝糖原分解增强，血糖浓度明显升高","胰岛素分泌增多，组织对葡萄糖的摄取和利用增加，肝糖原合成与脂肪合成增强，糖异生受抑制","脂肪动员增强，血中游离脂肪酸明显升高","蛋白质分解增强，尿素生成明显增多"],"answer":2,"explain":"餐后血糖升高刺激胰岛素分泌，促进葡萄糖摄取利用、肝糖原与脂肪合成，抑制糖异生和脂肪动员，机体以合成代谢为主。","type":"A1","id":"c16-d8ab3b96"},{"ch":16,"part":3,"tag":"酶含量调节","stem":"关于代谢调节中酶含量调节（酶量调节）的叙述，正确的是","options":["通过别构效应物与酶结合，在数秒内改变酶活性","通过磷酸化与去磷酸化修饰改变酶活性，具有放大效应","酶含量只取决于酶的降解速率，与酶的合成速率无关","酶含量调节作用迅速而短暂，是快速调节的主要形式","通过改变酶的合成和（或）降解速率实现，常由激素或底物诱导（阻遏）基因表达引起，作用缓慢而持久"],"answer":4,"explain":"酶含量调节属慢速调节，经诱导或阻遏改变酶蛋白的合成与降解速率，作用缓慢但持久；别构调节与化学修饰调节才是快速调节。","type":"A1","id":"c16-cb43f29f"},{"ch":16,"part":3,"tag":"乳酸循环","stem":"关于肌肉与肝之间乳酸循环（Cori 循环）的叙述，正确的是","options":["肌肉中葡萄糖经有氧氧化生成乳酸，再运往肝","肌肉糖酵解生成的乳酸随血液运至肝，肝将其异生为葡萄糖再回到肌肉，可避免乳酸丢失并补充血糖","肝内生成的乳酸运至肌肉，在肌肉中异生为葡萄糖","乳酸循环中肝摄取的是游离氨，而不是乳酸","乳酸循环只在长期饥饿时才启动，饱食状态下完全不进行"],"answer":1,"explain":"肌肉糖酵解产生的乳酸经血入肝，肝以乳酸为原料进行糖异生生成葡萄糖（消耗 ATP），葡萄糖再供肌肉利用，既回收乳酸又补充血糖。","type":"A1","id":"c16-f37d9481"},{"ch":16,"part":3,"tag":"糖皮质激素","stem":"关于糖皮质激素对物质代谢调节作用的叙述，正确的是","options":["促进外周组织摄取和利用葡萄糖，使血糖降低","抑制肝糖异生关键酶的基因表达，减少糖异生","促进蛋白质合成，使机体呈正氮平衡","促进肝糖异生（诱导相关关键酶）并抑制肝外组织摄取利用葡萄糖使血糖升高，同时促进脂肪动员并引起脂肪重新分布","抑制脂肪动员，使血中游离脂肪酸降低"],"answer":3,"explain":"糖皮质激素通过诱导 PEPCK 等促进肝糖异生、抑制肝外组织利用葡萄糖而升高血糖；促进脂肪动员与重新分布，并使蛋白质分解加强。","type":"A1","id":"c16-22b4856e"},{"ch":16,"part":3,"tag":"脂肪组织代谢","stem":"关于脂肪组织代谢特点的叙述，正确的是","options":["脂肪组织缺乏甘油激酶，不能利用脂肪动员产生的甘油；其酯化所需的磷酸二羟丙酮主要来自糖酵解","脂肪组织含丰富的甘油激酶，可直接利用甘油合成甘油三酯","脂肪组织是脂肪酸氧化供能的主要场所，含大量肉碱脂酰转移酶","脂肪组织不能合成脂肪，脂肪只能在肝内合成后运入","脂肪组织中甘油三酯的合成与分解由同一种酶催化，二者始终同时增强"],"answer":0,"explain":"脂肪细胞缺乏甘油激酶，脂肪动员产生的甘油须运至肝等组织利用；脂肪组织中甘油三酯酯化所需的磷酸二羟丙酮来自糖酵解。","type":"A1","id":"c16-b0b637c6"},{"ch":16,"part":3,"tag":"短期饥饿","stem":"短期饥饿（禁食 12～24 小时）时，维持血糖浓度的主要机制是","options":["肝糖原大量分解，足以持续供糖数天以上","肌糖原直接分解为葡萄糖补充血糖","肝糖原逐渐减少，肝糖异生增强并成为血糖的主要来源，原料为乳酸、甘油和生糖氨基酸","脂肪动员受抑制，血中游离脂肪酸降低","酮体大量转变为葡萄糖以维持血糖"],"answer":2,"explain":"禁食 12～24 小时后肝糖原明显减少，糖异生成为维持血糖的主要途径，原料为乳酸、甘油和生糖氨基酸；脂肪不能大量转变为葡萄糖。","type":"A1","id":"c16-0a3f6d30"},{"ch":16,"part":3,"tag":"代谢研究方法","stem":"研究某种物质在整体机体内的代谢途径、转变与分布，最常用的方法是","options":["用电子显微镜直接观察代谢物分子","测定该物质的分子量大小","用免疫印迹法检测该物质的含量变化","以体外细胞培养完全替代整体代谢研究","用放射性核素（如 ¹⁴C、³H）标记该物质或其前体，追踪其在体内的转变与分布（核素示踪法）"],"answer":4,"explain":"核素示踪法用放射性或稳定性核素标记代谢物或其前体，追踪其在体内的转变途径、分布与代谢速度，是研究代谢途径的经典方法。","type":"A1","id":"c16-5e53f48d"},{"ch":16,"part":3,"tag":"整体水平调节","stem":"关于机体代谢整体水平调节的叙述，正确的是","options":["整体水平调节仅靠细胞内的别构调节完成，不需神经系统参与","整体水平调节只通过改变关键酶的含量实现","各组织器官的代谢彼此独立，不需神经和激素的统一调节","在中枢神经系统主导下，机体通过调节激素的释放整合各组织器官的代谢，以适应饱食、空腹、饥饿、应激等状态","整体水平调节完全由血液中底物浓度被动决定，无调节中枢参与"],"answer":3,"explain":"代谢调节分细胞水平、激素水平和整体水平三级；整体水平调节以神经系统为主导，通过激素分泌的变化整合各组织器官的代谢，适应内外环境变化。","type":"A1","id":"c16-b4bfd124"},{"id":"gc15-01-1","ch":17,"part":4,"tag":"判读","stem":"本例常规G显带核型正常，却不能排除该病的遗传学原因，最合理的解释是","options":["光镜分辨率有限，染色体的微小缺失不能在带纹水平上分辨","常规G显带用于分析间期细胞，中期染色体上显示不出带纹","该缺失使染色体数目发生改变，需用核型分析之外的方法检出","常规G显带显示着丝粒区，染色体臂上的带纹难以显示出来","常规G显带检测的是蛋白质，而该病源于DNA序列的缺失"],"answer":0,"explain":"A 对：常规G显带观察的是中期染色体的带纹格局，分辨力受光镜限制，小于分辨极限的区段缺失不会改变带纹数目与位置，所以核型正常不能排除该病，本例正是靠更高灵敏度的荧光原位杂交才检出。B 错：G显带分析的正是经培养、秋水仙素处理得到的中期染色体，不是间期细胞。C 错：荧光信号由两个减为一个，提示区段丢失，染色体数目并未改变。D 错：显示着丝粒区结构异染色质的是C显带，G显带显示的是染色体臂上深浅相间的带纹。E 错：显带来源于染色质与DNA的差异染色，并不是对蛋白质的检测。","type":"A1","group":"c15-01","kind":"mechanism","chs":[17,10],"vignette":"一名3岁女童因生长迟缓与特殊面容就诊。取外周血接种于含植物血凝素的培养基，72小时后加秋水仙素处理，经低渗、固定后滴片，再用胰蛋白酶消化并染色，分析20个中期分裂象：常规G显带核型为46,XX，在400条带水平未见结构异常。结合临床表现，改用22q11区段特异性探针做荧光原位杂交：正常对照细胞的间期核中，每个核可见2个荧光信号，而本例的100个核中有92个只见到1个信号。同一张标本的间期核内，可见一个紧贴核膜内缘、深染的小体，核仁染色明显且体积增大。","vignette_title":"情景 1：显带看不见的那一段缺失","gidx":1,"gn":5,"anchor":"在400条带水平未见结构异常"},{"id":"gc15-01-2","ch":17,"part":4,"tag":"判读","stem":"本例荧光原位杂交的结果，最合理的解释是","options":["该信号减少来自杂交效率下降，与染色体结构无关","两条同源染色体上该区段同时存在，信号彼此重叠","该区段在一条同源染色体上缺失，拷贝数由两份减为一份","细胞中多出一条22号染色体，探针位点被稀释而信号减弱","探针序列与22号染色体以外的区域发生了交叉杂交"],"answer":2,"explain":"C 对：正常二倍体细胞在该区段应给出2个荧光信号，92%的核只剩1个信号，说明一条同源染色体上的这段序列已经丢失，即杂合性微缺失，与患儿的临床表现相符。A 错：杂交效率下降会使两个信号同步减弱变暗，不会稳定地由2个变成1个。B 错：两个位点重叠时信号通常更亮更大，而不是数目减少。D 错：多一条22号染色体会使探针位点增多，信号应当增加而不是减弱。E 错：交叉杂交会带来额外信号，与本例信号丢失的方向相反。","type":"A1","group":"c15-01","kind":"mechanism","chs":[17,10],"vignette":"一名3岁女童因生长迟缓与特殊面容就诊。取外周血接种于含植物血凝素的培养基，72小时后加秋水仙素处理，经低渗、固定后滴片，再用胰蛋白酶消化并染色，分析20个中期分裂象：常规G显带核型为46,XX，在400条带水平未见结构异常。结合临床表现，改用22q11区段特异性探针做荧光原位杂交：正常对照细胞的间期核中，每个核可见2个荧光信号，而本例的100个核中有92个只见到1个信号。同一张标本的间期核内，可见一个紧贴核膜内缘、深染的小体，核仁染色明显且体积增大。","vignette_title":"情景 1：显带看不见的那一段缺失","gidx":2,"gn":5,"anchor":"有92个只见到1个信号"},{"id":"gc15-01-5","ch":17,"part":4,"tag":"判读","stem":"关于本例所用的检查与所见，下列判断正确的是（X 型多选）","options":["G显带分析需先经细胞培养与中期染色体标本制备","荧光原位杂交用荧光标记探针与变性染色体原位杂交","该患儿的临床表现由22q11区段的两份拷贝缺失引起","染色体微阵列杂交可检出平衡易位这类结构重排","间期核内紧贴核膜的小体由Xist介导形成"],"answer":[0,1,4],"explain":"答案 ABE。A 对：常规核型分析必须先经外周血培养、秋水仙素处理与低渗固定制片，才能在中期分裂象上观察染色体。B 对：荧光原位杂交的原理就是荧光标记的核酸探针与变性的染色体DNA原位杂交，灵敏度高于带纹分析。E 对：间期核内贴核膜的深染小体是失活的X染色体，其形成由Xist介导。C 错：本例荧光信号由2个减为1个，属杂合性微缺失，只有一份拷贝丢失，不是两份都缺失。D 错：微阵列比较基因组杂交检出的是拷贝数变异，对拷贝数中性的平衡易位不敏感。","type":"X","group":"c15-01","kind":"mechanism","chs":[17,10],"vignette":"一名3岁女童因生长迟缓与特殊面容就诊。取外周血接种于含植物血凝素的培养基，72小时后加秋水仙素处理，经低渗、固定后滴片，再用胰蛋白酶消化并染色，分析20个中期分裂象：常规G显带核型为46,XX，在400条带水平未见结构异常。结合临床表现，改用22q11区段特异性探针做荧光原位杂交：正常对照细胞的间期核中，每个核可见2个荧光信号，而本例的100个核中有92个只见到1个信号。同一张标本的间期核内，可见一个紧贴核膜内缘、深染的小体，核仁染色明显且体积增大。","vignette_title":"情景 1：显带看不见的那一段缺失","gidx":5,"gn":5,"anchor":"22q11区段特异性探针做荧光原位杂交"},{"id":"gc17-01-2","ch":17,"part":4,"tag":"机制","stem":"刺激后核小体沿 DNA 移动，而该基因的碱基序列并未改变，这一现象说明","options":["核小体在 DNA 上的位置可以被改变，而碱基序列不变","核小体滑动时该段 DNA 的碱基序列被重新排列","核小体在 DNA 上的位置固定，滑动是制片造成的假象","核小体滑动依赖组蛋白与 DNA 之间共价键的断裂与重接","核小体滑动使该段 DNA 的碱基被修饰，可及性随之改变"],"answer":0,"explain":"A 对：核小体沿 DNA 移动只改变它的位置，进而改变该段染色质的可及性，碱基序列并不改变。B 说序列被重新排列，与题意直接冲突；C 与实验组和对照组出现的差异矛盾；D 错在组蛋白与 DNA 之间靠氢键、离子键等非共价作用结合；E 描述的是碱基修饰，情景中并无此类修饰的证据。","type":"A1","group":"c17-01","kind":"mechanism","chs":[10,17,22],"vignette":"人二倍体细胞中约 2 m 长的 DNA 必须装进直径只有 5～8 μm 的细胞核，靠的是核小体、30 nm 纤维、襻环到中期染色体的逐级折叠。某基因受激素诱导：刺激前，它的启动子区缠着两个核小体，基因座紧贴核膜内缘、染色致密；刺激后 15 分钟，染色质重塑复合物水解 ATP，把这两个核小体沿 DNA 向下游滑动约 60 个碱基对，启动子区让出一段约 200 bp 的核小体缺失区，转录因子随即结合，该基因的转录在 1 小时内升高 9 倍；若用不能水解的 ATP 类似物代替 ATP，核小体不再移动。用高盐溶液洗去 H1 后，电镜下该基因座只剩直径约 11 nm 的串珠结构。","vignette_title":"情景 1：核小体滑了 60 个碱基对之后","gidx":2,"gn":5,"anchor":"向下游滑动约 60 个碱基对"},{"id":"gc17-02-1","ch":17,"part":4,"tag":"识别","stem":"关于该插入元件的类型与转座方式，下列叙述正确的是","options":["属短散在核元件，长约 300 bp，需借用其他元件编码的酶转座","属长散在核元件，长约 6 kb，可编码逆转录酶，以 RNA 为中间体转座","属 DNA 转座子，从基因组切离后以 DNA 为中间体插入另一位置","属串联重复序列，成串排列于着丝粒区，复制较晚且一般不转录","属加工型假基因，由 mRNA 逆转录生成 cDNA 后整合，缺少内含子"],"answer":1,"explain":"B 对：长约 6 kb、自带可编码核酸内切酶与逆转录酶阅读框的元件属长散在核元件，它以 RNA 为中间体逆转录后整合到基因组新位置。A 的 300 bp 与短散在核元件对应，是 Alu 一类序列的特征；C 描述的是以 DNA 为中间体的 DNA 转座子；D 描述的是着丝粒区串联重复的卫星 DNA；E 的加工型假基因来自 mRNA 逆转录整合，不具备编码上述酶的能力。","type":"A1","group":"c17-02","kind":"mechanism","chs":[17,22],"vignette":"一名甲型血友病患儿的凝血因子Ⅷ基因第 14 内含子中插入了一段约 6 kb 的序列：它两端各有一小段相同的短序列，内部有两个可编码蛋白质的开放阅读框，其产物之一兼有核酸内切酶与逆转录酶活性。患儿细胞内该基因的前体 RNA 含量与正常人接近，成熟 mRNA 却只有正常人的 15%，血浆凝血因子Ⅷ活性不足 1%。在该患儿的基因组中，还能检出大量长约 300 bp、拷贝数以百万计的散在重复序列，以及成串排列于着丝粒、拷贝数成千上万的 α 卫星 DNA。","vignette_title":"情景 2：一个 6 kb 插入与 15% 的成熟 mRNA","gidx":1,"gn":5,"anchor":"兼有核酸内切酶与逆转录酶活性"},{"id":"gc17-02-2","ch":17,"part":4,"tag":"机制","stem":"关于情景中那段短散在重复序列的转座方式，下列叙述正确的是","options":["以 RNA 为中间体，依赖自身编码的逆转录酶完成转座","以 DNA 为中间体，依赖自身编码的转座酶切离后插回","以 RNA 为中间体，借用其他元件编码的酶完成转座","以 RNA 为模板，由细胞内的 RNA 聚合酶合成 DNA 后插入","由剪接体从转录本中切除后，经连接酶整合进基因组"],"answer":2,"explain":"C 对：这类短散在核元件自身不带编码酶的能力，它借用长散在核元件编码的核酸内切酶与逆转录酶，经 RNA 中间体逆转录后插入基因组。A 错在自身不编码逆转录酶；B 的 DNA 中间体与转座酶属 DNA 转座子的特征；D 错在合成 DNA 的是逆转录酶而不是 RNA 聚合酶；E 的剪接体只加工 RNA 转录本，不负责把序列插入基因组。","type":"A1","group":"c17-02","kind":"mechanism","chs":[17,22],"vignette":"一名甲型血友病患儿的凝血因子Ⅷ基因第 14 内含子中插入了一段约 6 kb 的序列：它两端各有一小段相同的短序列，内部有两个可编码蛋白质的开放阅读框，其产物之一兼有核酸内切酶与逆转录酶活性。患儿细胞内该基因的前体 RNA 含量与正常人接近，成熟 mRNA 却只有正常人的 15%，血浆凝血因子Ⅷ活性不足 1%。在该患儿的基因组中，还能检出大量长约 300 bp、拷贝数以百万计的散在重复序列，以及成串排列于着丝粒、拷贝数成千上万的 α 卫星 DNA。","vignette_title":"情景 2：一个 6 kb 插入与 15% 的成熟 mRNA","gidx":2,"gn":5,"anchor":"拷贝数以百万计的散在重复序列"},{"id":"gc17-02-4","ch":17,"part":4,"tag":"识别","stem":"情景中成串排列于着丝粒、拷贝数成千上万的 α 卫星 DNA，其序列类型与分布特征是","options":["散在重复序列，分散于基因之间，可经 RNA 中间体转座","串联重复序列，位于染色体末端，随细胞分裂而缩短","串联重复序列，分散于不同染色体，编码逆转录酶","散在重复序列，集中于着丝粒区，由蛋白质而非 DNA 构成","串联重复序列，成串排列于着丝粒，复制较晚且一般不转录"],"answer":4,"explain":"E 对：α 卫星 DNA 是串联重复序列，成串排列在着丝粒区，属结构异染色质，复制较晚且一般不转录。A 与 D 把串联重复误说成散在重复，其中 D 还说它由蛋白质构成；B 描述的是位于染色体末端的另一类重复序列；C 把编码逆转录酶这一长散在核元件的特征安到了串联重复上。","type":"A1","group":"c17-02","kind":"mechanism","chs":[17,22],"vignette":"一名甲型血友病患儿的凝血因子Ⅷ基因第 14 内含子中插入了一段约 6 kb 的序列：它两端各有一小段相同的短序列，内部有两个可编码蛋白质的开放阅读框，其产物之一兼有核酸内切酶与逆转录酶活性。患儿细胞内该基因的前体 RNA 含量与正常人接近，成熟 mRNA 却只有正常人的 15%，血浆凝血因子Ⅷ活性不足 1%。在该患儿的基因组中，还能检出大量长约 300 bp、拷贝数以百万计的散在重复序列，以及成串排列于着丝粒、拷贝数成千上万的 α 卫星 DNA。","vignette_title":"情景 2：一个 6 kb 插入与 15% 的成熟 mRNA","gidx":4,"gn":5,"anchor":"成串排列于着丝粒"},{"id":"gc17-02-5","ch":17,"part":4,"tag":"判读","stem":"关于本情景涉及的重复序列与转座元件，下列判断正确的是（X 型多选）","options":["插入序列以 RNA 为中间体，经逆转录后整合进基因组","该插入使成熟 mRNA 明显减少，而前体 RNA 并未减少","加工型假基因由 mRNA 逆转录生成 cDNA 后整合，缺少内含子","散在重复序列的拷贝数远多于编码蛋白质的基因数目","该元件插入内含子后不影响成熟 mRNA，故与本病的发生无关"],"answer":[0,1,2,3],"explain":"答案 ABCD。A 对应插入序列以 RNA 为中间体整合；B 与情景中前体 RNA 不减少、成熟 mRNA 锐减这一组合一致；C 是加工型假基因的特征，它与逆转录转座共用同一种机制；D 与情景中散在重复序列拷贝数以百万计的描写一致。E 错：患儿成熟 mRNA 只剩 15%、凝血因子Ⅷ活性不足 1%，说明该插入与本病有明确的因果关系。","type":"X","group":"c17-02","kind":"mechanism","chs":[17,22],"vignette":"一名甲型血友病患儿的凝血因子Ⅷ基因第 14 内含子中插入了一段约 6 kb 的序列：它两端各有一小段相同的短序列，内部有两个可编码蛋白质的开放阅读框，其产物之一兼有核酸内切酶与逆转录酶活性。患儿细胞内该基因的前体 RNA 含量与正常人接近，成熟 mRNA 却只有正常人的 15%，血浆凝血因子Ⅷ活性不足 1%。在该患儿的基因组中，还能检出大量长约 300 bp、拷贝数以百万计的散在重复序列，以及成串排列于着丝粒、拷贝数成千上万的 α 卫星 DNA。","vignette_title":"情景 2：一个 6 kb 插入与 15% 的成熟 mRNA","gidx":5,"gn":5,"anchor":"前体 RNA 含量与正常人接近"},{"id":"gc17-04-5","ch":17,"part":4,"tag":"方案","stem":"关于本组三份实验的设计与解读，下列判断正确的是（X 型多选）","options":["甲组出现连接产物，说明两个区段在空间上曾经彼此靠近","乙组的超敏位点提示该区段染色质结构疏松，更易被核酸酶作用","丙组说明部分染色质区段通过特定序列结合在核基质上","丙组沉淀中的区段与核基质结合，说明该区段属于编码区","甲组的连接频率高，足以证明该增强子为该基因表达所必需"],"answer":[0,1,2],"explain":"答案 ABC。A 是交联结合连接的原理，连接产物只在空间邻近时形成；B 中 DNase I 超敏位点反映该处染色质结构疏松、核小体排列改变；C 与丙组高盐抽提后仍随核基质沉淀一致，提示存在与核基质结合的区段。D 错在启动子区段属调控区而不是编码区；E 错在连接频率高只说明空间邻近，是否必需还需缺失突变、报告基因等功能实验来判断。","type":"X","group":"c17-04","kind":"experiment","chs":[10,17,22],"vignette":"为弄清某红系特异基因的增强子（位于启动子上游约 80 kb）怎样与启动子接触，研究生做了三组实验。甲：先用甲醛交联细胞，再以限制性内切酶消化染色质，随后把 DNA 稀释到极低浓度并加入 DNA 连接酶，最后用锚定在启动子区的引物作定量 PCR；红系细胞中该连接产物的量是宫颈癌细胞的 12 倍。乙：用 DNase I 处理细胞核，该增强子所在区段在红系细胞中出现超敏位点，在宫颈癌细胞中不出现。丙：用高盐溶液抽提细胞核去除组蛋白后离心，该基因的启动子区段随核基质组分一起沉淀，而多数编码区片段留在上清中。","vignette_title":"情景 4：连接频率高出 12 倍之后","gidx":5,"gn":5,"anchor":"该增强子所在区段在红系细胞中出现超敏位点"},{"id":"gc4-02-2","ch":17,"part":4,"tag":"识别","stem":"人类端粒 DNA 的组成特征是","options":["以 TTGGGG 为单元的串联重复序列，不编码功能蛋白","以 AATAAA 为单元的串联重复序列，参与转录终止","以 TTAGGG 为单元的串联重复序列，不编码功能蛋白","以 TTAGGG 为单元的高度可变微卫星，编码端粒酶亚基","以 TTAGGG 为单元的反向重复序列，编码端粒结合蛋白"],"answer":2,"explain":"C 对：人类端粒是真核染色体末端以 TTAGGG 为单元的高度重复序列，重复数百至数千次，本身不编码蛋白质。A 的重复单元写成了 TTGGGG，与人类序列不符；B 把重复序列说成反向重复并赋予编码功能；C 微卫星的单元通常更短且拷贝数高度可变，也不能编码端粒酶亚基；E 的 AATAAA 是加尾信号相关序列，不是端粒序列。","type":"A1","group":"c4-02","kind":"mechanism","chs":[18,17,26],"vignette":"真核生物的线性染色体末端是一段串联重复序列，人类为 5′-TTAGGG-3′ 重复数百至数千次，与一组端粒结合蛋白共同构成端粒。DNA 聚合酶不能从头起始合成，只能沿 5′→3′ 方向延伸，并需要一段 RNA 引物提供 3′-OH；当复制叉到达染色体末端，引物被切除后留下的空隙无法填补，子链因此比母链短 50–100 个核苷酸，这就是末端复制问题。端粒酶是一种核糖核蛋白，自带一段 RNA 作为模板，能以逆转录方式延长染色体 DNA 的 3′ 末端，随后由 DNA 聚合酶补齐另一条链。端粒酶在生殖细胞、干细胞和多数肿瘤细胞中活性较高，在普通体细胞中几乎不表达；体细胞每分裂一次端粒就缩短一些，缩短到临界长度后细胞退出细胞周期，进入复制性衰老。","vignette_title":"情景 2：染色体末端那道补不上的缺口","gidx":2,"gn":5,"anchor":"人类为 5′-TTAGGG-3′ 重复数百至数千次"},{"ch":17,"part":4,"tag":"线粒体基因组","stem":"关于人类线粒体基因组的结构与遗传特点，下列叙述正确的是","options":["为线性双链DNA，长约16.6 kb，含有多个内含子","由父方传递给子代，表现为父系遗传","为环状双链DNA，长约16.6 kb，共37个基因且几乎不含内含子","每个细胞仅含一个拷贝，复制与核基因组完全同步","编码线粒体呼吸链全部复合物的所有亚基，完全不依赖核基因"],"answer":2,"explain":"人线粒体基因组为环状双链DNA，16.6 kb、37个基因、无内含子，母系遗传且每细胞多拷贝；多数呼吸链亚基仍由核基因编码。","type":"A1","id":"c17-c3853a58"},{"ch":17,"part":4,"tag":"基因概念","stem":"随着人类基因组计划完成及后基因组研究的深入，基因的概念也在演进。下列叙述与现代基因概念相符的是","options":["一个基因只能编码一种蛋白质，基因与蛋白质一一对应","基因是染色体上编码蛋白质的DNA序列，非编码序列不具基因功能","基因在染色体上彼此不能重叠，基因之间均以非编码序列隔开","基因是编码蛋白质或功能RNA的DNA序列，可通过重叠、可变剪接等方式产生多种产物","人类基因组的蛋白编码序列占绝大部分，其余序列均无功能"],"answer":3,"explain":"现代基因概念涵盖编码蛋白质或功能RNA的序列及调控区，一个基因可产生多种产物；人类基因组中蛋白编码序列仅占很小比例，其余序列并非均无功能。","type":"A1","id":"c17-86018c8c"},{"ch":17,"part":4,"tag":"基因组计划","stem":"关于人类基因组计划（HGP）的成就与局限，下列叙述正确的是","options":["HGP已完成人类全部染色体（含着丝粒、端粒及异染色质区）的无间隙序列组装","HGP测定了基因组序列并绘制了基因图谱，但着丝粒、端粒等区域当时尚未完成，且不能直接阐明基因功能与个体差异","HGP证明人类基因组中约有20万个蛋白编码基因","HGP完成后基因组学研究即告结束，无须再开展后基因组计划","HGP已明确每个基因的功能及其与疾病的对应关系"],"answer":1,"explain":"HGP完成了常染色质区序列测定与基因图谱绘制，着丝粒、异染色质等区域直到T2T计划才补齐，且未阐明全部基因功能与个体差异。","type":"A1","id":"c17-df02f533"},{"ch":17,"part":4,"tag":"基因结构","stem":"关于人类蛋白编码基因的结构，下列叙述正确的是","options":["内含子序列存在于初级转录本（hnRNA）中，在剪接过程中被切除","内含子保留在成熟mRNA中，翻译时被核糖体跳过","外显子仅指编码氨基酸的序列，5'非翻译区不属于外显子","3'非翻译区不能被转录，仅存在于DNA上","启动子位于基因3'端下游，决定转录的终止"],"answer":0,"explain":"内含子只出现在hnRNA中，经剪接被切除；外显子还包括5'、3'非翻译区，启动子位于基因5'端上游。","type":"A1","id":"c17-f6d88cd7"},{"ch":17,"part":4,"tag":"染色体鉴定","stem":"关于染色体鉴定技术的原理与适用范围，下列叙述正确的是","options":["常规G显带核型分析的分辨率可达单个碱基水平，能直接检出点突变","光谱核型分析（SKY）以荧光标记探针杂交，可检出单基因点突变","微阵列比较基因组杂交（aCGH）能可靠检出平衡易位等拷贝数中性的结构重排","上述技术均必须在细胞培养、中期染色体标本制备之后才能进行","FISH以荧光标记的核酸探针与变性染色体原位杂交，可检出常规核型难以发现的微缺失"],"answer":4,"explain":"FISH用荧光探针原位杂交，分辨率和灵敏度高于常规核型，可检出微缺失；核型与SKY都不能检出点突变，aCGH只能检出拷贝数变异。","type":"A1","id":"c17-743bea72"},{"ch":17,"part":4,"tag":"细胞分裂","stem":"关于人类基因组传递所依赖的细胞分裂方式，下列叙述正确的是","options":["有丝分裂中同源染色体配对并发生交换，保证子细胞遗传组成相同","减数分裂只进行一次分裂，染色体数目减半发生在其后期","有丝分裂后期姐妹染色单体分离，两个子细胞的遗传组成与母细胞相同","减数分裂I中姐妹染色单体分离，减数分裂II中同源染色体分离","减数分裂产生的配子为二倍体，受精后才恢复单倍体状态"],"answer":2,"explain":"有丝分裂后期姐妹染色单体分离，子细胞与母细胞遗传组成相同；减数分裂I分离同源染色体、II分离姐妹染色单体，配子为单倍体。","type":"A1","id":"c17-4bc1b142"},{"ch":17,"part":4,"tag":"遗传学诊断","stem":"临床遇到一例表型鲜明的罕见遗传病患儿，对其进行遗传学分析的合理策略是","options":["直接行全基因组测序，无需家系调查与体格检查","只做常规核型分析，核型正常即可排除遗传学病因","只检测线粒体DNA，因罕见遗传病多由线粒体突变所致","先经家系调查与体检明确表型，再按分辨率由低到高选择核型分析/aCGH、靶向测序或全外显子组测序","直接测定端粒长度以确定病因"],"answer":3,"explain":"罕见病例应先做表型与家系分析，再依分辨率高低依次选用核型、aCGH、靶向测序或外显子组测序；核型正常并不能排除遗传病。","type":"A1","id":"c17-08ced904"},{"ch":17,"part":4,"tag":"基因编辑","stem":"下列技术中，能够对基因组DNA进行定点、可设计的序列改造的是","options":["聚合酶链反应（PCR）","CRISPR/Cas9基因编辑技术","荧光原位杂交（FISH）","微阵列比较基因组杂交（aCGH）","常规染色体G显带技术"],"answer":1,"explain":"CRISPR/Cas9由向导RNA引导Cas9在特定位点切割DNA，实现定点编辑；PCR、FISH、aCGH与显带技术均只用于扩增或检测。","type":"A1","id":"c17-ea9af34c"},{"ch":17,"part":4,"tag":"线粒体异质性","stem":"关于线粒体DNA（mtDNA）的异质性与阈值效应，下列叙述正确的是","options":["细胞内所有mtDNA拷贝的序列完全一致，突变一旦发生即引起功能障碍","同一细胞可同时存在野生型与突变型mtDNA，突变拷贝比例超过一定阈值才出现功能缺陷，卵子发生过程中的遗传瓶颈可改变子代的突变负荷","mtDNA异质性仅见于肿瘤细胞，正常体细胞中不存在","mtDNA拷贝在有丝分裂时按孟德尔定律精确均分，子细胞突变比例恒定","异质性突变呈典型孟德尔显性遗传，家系中男女患病比例一致"],"answer":1,"explain":"mtDNA为多拷贝，突变型与野生型可共存；突变比例超过阈值才致病，卵子发生瓶颈使子代突变负荷波动。","type":"A1","id":"c17-b71f820e"},{"ch":17,"part":4,"tag":"增强子","stem":"关于真核基因转录调控中的增强子与沉默子，下列叙述正确的是","options":["增强子必须紧邻启动子上游才能发挥作用","增强子序列方向颠倒后即完全失去活性","增强子可位于启动子上游或下游、相距数千甚至数十万碱基对，位置与方向均不固定，通过染色质空间成环与启动子接触；沉默子则抑制转录","沉默子是编码阻遏蛋白的基因序列","增强子对基因表达的调控没有组织特异性"],"answer":2,"explain":"增强子属顺式作用元件，位置与方向不定，经染色质成环远距离激活启动子；沉默子负调控，二者多具组织特异性。","type":"A1","id":"c17-b03bf8c0"},{"ch":17,"part":4,"tag":"假基因","stem":"关于人类基因组中的假基因，下列叙述正确的是","options":["假基因均能翻译出有功能的蛋白质","假基因与对应的功能基因序列毫无相似性","所有假基因都由基因组DNA串联重复产生并保留完整内含子","加工型假基因由mRNA逆转录生成cDNA后整合入基因组，通常缺少内含子，也不带自身的启动子","假基因不能被转录，因而是基因组中完全无意义的序列"],"answer":3,"explain":"加工型假基因来自mRNA逆转录整合，无内含子、无自身启动子；另有基因重复后失活的未加工假基因，部分仍可转录。","type":"A1","id":"c17-88b8aa5b"},{"ch":17,"part":4,"tag":"基因家族","stem":"关于基因家族与超基因家族，下列叙述正确的是","options":["基因家族成员必须位于同一染色体并串联排列","超基因家族成员之间序列高度一致且功能完全相同","人类rRNA基因在基因组中仅有单拷贝","基因家族成员只能编码蛋白质，不能编码RNA","基因家族指由共同祖先基因经重复与变异形成的一组同源基因，成员可成簇也可分散于不同染色体，如α与β珠蛋白基因簇分别位于不同染色体"],"answer":4,"explain":"基因家族成员同源，可成簇或分散；α、β珠蛋白基因簇分处不同染色体，超基因家族成员序列相似性低、功能多样。","type":"A1","id":"c17-797db101"},{"ch":17,"part":4,"tag":"转座子","stem":"关于人类基因组中的散在重复序列与转座子，下列叙述正确的是","options":["Alu序列属短散在核元件（SINE），长约300 bp、拷贝数上百万；L1属长散在核元件（LINE），可编码逆转录酶，Alu自身不编码酶而借用L1的产物进行转座","Alu序列长约6 kb，属长散在核元件（LINE）","L1属短散在核元件（SINE），每个基因组只有几个拷贝","散在重复序列只存在于着丝粒区，不参与基因表达调控","转座子只能以DNA为中间体，从基因组一处切离后插入另一处"],"answer":0,"explain":"Alu为约300 bp的SINE，L1为可自主编码逆转录酶的LINE，二者均经RNA中间体逆转录转座；DNA转座子才以DNA为中间体。","type":"A1","id":"c17-fca5f5be"},{"ch":17,"part":4,"tag":"核小体","stem":"关于核小体与染色质的包装，下列叙述正确的是","options":["核小体核心由H3、H4各两分子组成，不含H2A与H2B","核小体核心由H2A、H2B、H3、H4各两分子组成的八聚体与约146 bp的DNA构成，H1与连接DNA结合参与更高层次的折叠","常染色质高度压缩、转录不活跃，异染色质结构松散、转录活跃","组蛋白富含酸性氨基酸并带负电荷，与DNA的磷酸基团相互排斥","人类中期染色体由裸露的DNA折叠而成，不含蛋白质"],"answer":1,"explain":"核小体核心为H2A、H2B、H3、H4各两分子的八聚体，盘绕约146 bp DNA；H1参与高级折叠，异染色质压缩、转录不活跃。","type":"A1","id":"c17-4cf8e5aa"},{"ch":17,"part":4,"tag":"着丝粒","stem":"关于人类染色体的着丝粒与染色体形态，下列叙述正确的是","options":["正常人类染色体均含两个功能着丝粒，以保证分裂时染色体稳定分配","近端着丝粒染色体的随体位于长臂末端","着丝粒区含α卫星DNA与动粒，一条染色体只含一个功能着丝粒；含双着丝粒的染色体在有丝分裂中易被拉断，属不稳定畸变","端粒位于着丝粒两侧，由蛋白质构成，不含DNA","人类D组、G组染色体的短臂上不含rRNA基因"],"answer":2,"explain":"着丝粒是动粒组装与纺锤体连接的位点，含高度重复α卫星DNA；双着丝粒染色体不稳定，D、G组短臂随体柄含rRNA基因。","type":"A1","id":"c17-79e4279c"},{"ch":17,"part":4,"tag":"显带技术","stem":"关于染色体显带标本中各带纹的分子基础，下列叙述正确的是","options":["C显带显示的是染色体两端的端粒DNA","G显带的深带富含GC、基因密度高、复制较早","高分辨显带所显示的带纹数目少于常规G显带","结构异染色质主要位于着丝粒区，由高度重复的卫星DNA组成，复制较晚且一般不转录；C显带即显示这一区域","各显带技术显示的带纹均由基因编码序列构成，与非编码的高度重复序列无关"],"answer":3,"explain":"着丝粒区结构异染色质由卫星DNA组成，复制晚、不转录，由C显带显示；G带深带富含AT、基因密度低，高分辨显带带纹更多。","type":"A1","id":"c17-4ba8bf1b"},{"id":"gc15-02-2","ch":18,"part":4,"tag":"机制","stem":"使一个细胞周期内每条染色体只复制一次的关键机制是","options":["DNA聚合酶在S期合成，其他时期细胞内没有该酶","G1期组装前复制复合体，CDK活化后阻止其再组装","每个周期随机启用一个起始点，其余的起始点随之灭活","复制从染色体两端的端粒起始，再向染色体中央推进","细胞在S期合成DNA聚合酶，非S期该酶被蛋白酶体降解"],"answer":1,"explain":"B 对：真核细胞的复制许可在G1期完成，起始点上先组装前复制复合体；CDK活化后既启动复制，又抑制前复制复合体的再次组装，因此同一起点在一个周期内只能起始一次。A 错：DNA聚合酶并非只在S期出现，酶量的波动不是限制一次复制的原因。C 错：真核基因组有多个起始点并同时启用，并非每个周期随机启用一个。D 错：复制由染色体内部的多个起始点双向进行，端粒不是复制起点。E 错：聚合酶在非S期被蛋白酶体降解的说法没有依据，且与第三组结果无关。","type":"A1","group":"c15-02","kind":"mechanism","chs":[18,26],"vignette":"研究者把培养的人细胞用无血清培养基培养48小时，使其停在G1期，随后换回含血清的培养基并在0、6、12、18小时取样。6小时起CyclinE相关激酶活性升高、Rb被磷酸化，细胞越过G1/S限制点；12小时流式细胞术显示DNA含量由2C升至4C。第二组细胞在换液的同时加入蛋白酶体抑制剂，p27不能被降解，18小时后DNA含量仍为2C。第三组细胞在G1期把前复制复合体的一个必需组分过量表达，结果S期之后仍不断出现DNA含量高于4C的细胞，Giemsa染色下可见染色体断裂。","vignette_title":"情景 2：一个周期里只许复制一次","gidx":2,"gn":5,"anchor":"前复制复合体的一个必需组分过量表达"},{"id":"gc15-02-4","ch":18,"part":4,"tag":"判读","stem":"第三组细胞出现DNA含量高于4C的细胞，最合理的解释是","options":["起点在同一周期内被再次起始，局部DNA被重复复制","细胞把多余的dNTP直接掺入DNA，不经过模板复制","细胞把损伤的DNA大量切除后重新合成，含量随之升高","细胞停留在G2期不再分裂，DNA含量因此超过4C","核膜提前破裂，染色体在S期被机械拉断后重接"],"answer":0,"explain":"A 对：前复制复合体的组分过量表达可绕开CDK对再组装的抑制，同一起点在一个周期内被再次起始，局部DNA被重复复制，总含量超过4C，重复复制叉之间的冲突还会造成染色体断裂。B 错：DNA合成必须以模板为依据，dNTP不会凭空掺入链中。C 错：切除修复只把被切掉的片段补回来，含量不会超过正常复制的水平。D 错：G2期细胞的DNA含量正好为4C，停在G2期不会使含量继续升高。E 错：核膜在分裂前期才解体，机械拉断改变的是染色体形态而不是DNA含量。","type":"A1","group":"c15-02","kind":"mechanism","chs":[18,26],"vignette":"研究者把培养的人细胞用无血清培养基培养48小时，使其停在G1期，随后换回含血清的培养基并在0、6、12、18小时取样。6小时起CyclinE相关激酶活性升高、Rb被磷酸化，细胞越过G1/S限制点；12小时流式细胞术显示DNA含量由2C升至4C。第二组细胞在换液的同时加入蛋白酶体抑制剂，p27不能被降解，18小时后DNA含量仍为2C。第三组细胞在G1期把前复制复合体的一个必需组分过量表达，结果S期之后仍不断出现DNA含量高于4C的细胞，Giemsa染色下可见染色体断裂。","vignette_title":"情景 2：一个周期里只许复制一次","gidx":4,"gn":5,"anchor":"DNA含量高于4C的细胞"},{"id":"gc15-02-5","ch":18,"part":4,"tag":"判读","stem":"关于本组实验所反映的复制与周期调控，下列判断正确的是（X 型多选）","options":["真核细胞的复制有多个起始点，且复制仅限S期进行","前复制复合体在G1期组装，相当于授予复制许可","DNA含量高于4C说明起点在同一周期内被再次起始","DNA复制与组蛋白合成的时间分开，前者在S期后者在G2期","细胞越过G1/S限制点后，CDK1随即被激活并启动有丝分裂"],"answer":[0,1,2],"explain":"答案 ABC。A 对：真核基因组有多个起始点，复制被严格限制在S期，第二组停在2C正说明细胞没有越过限制点。B 对：前复制复合体在G1期组装即复制许可，第三组的结果提示这一环节被过量表达所扰乱。C 对：DNA含量高于4C只能来自同一周期内的再次起始与重复复制，与情景中染色体断裂的所见一致。D 错：DNA复制与组蛋白合成都发生在S期，便于新合成的DNA及时包装，两者并非分处S期与G2期。E 错：越过限制点只解决进入S期的问题，CDK1要到G2/M才被激活，之间还隔着整个S期与G2期。","type":"X","group":"c15-02","kind":"mechanism","chs":[18,26],"vignette":"研究者把培养的人细胞用无血清培养基培养48小时，使其停在G1期，随后换回含血清的培养基并在0、6、12、18小时取样。6小时起CyclinE相关激酶活性升高、Rb被磷酸化，细胞越过G1/S限制点；12小时流式细胞术显示DNA含量由2C升至4C。第二组细胞在换液的同时加入蛋白酶体抑制剂，p27不能被降解，18小时后DNA含量仍为2C。第三组细胞在G1期把前复制复合体的一个必需组分过量表达，结果S期之后仍不断出现DNA含量高于4C的细胞，Giemsa染色下可见染色体断裂。","vignette_title":"情景 2：一个周期里只许复制一次","gidx":5,"gn":5,"anchor":"p27不能被降解"},{"id":"gc19-01-4","ch":18,"part":4,"tag":"机制","stem":"骨髓与口腔黏膜上皮同样受损，其分子基础是","options":["这些组织的细胞更新慢，损伤容易在细胞内累积","这些组织的细胞更新快，处于 S 期的细胞比例高","这些组织的细胞缺乏修复酶，损伤无法被切除","这些组织的细胞端粒较短，药物使其加速衰老","这些组织的细胞多处于 G0 期，药物在其中蓄积"],"answer":1,"explain":"B 对：烷化剂造成的损伤在复制时最易转化为致命断裂，更新快的组织 S 期细胞比例高、暴露机会多，因此骨髓与黏膜最先出现毒性。A 错：更新慢的组织反而相对耐受。C 错：这些组织并不缺乏修复酶，毒性来自损伤量大而不是修复能力缺失。D 错：端粒缩短导致衰老属于另一条通路，与急性药物毒性无关。E 错：G0 期细胞对烷化剂相对耐受，这与情景中体外实验的结论一致。","type":"A1","group":"c19-01","kind":"mechanism","chs":[19,26,18],"vignette":"某化疗方案联合两种药物：一种烷化剂能与鸟嘌呤的 N7 位结合，并在 DNA 两条链之间形成交联，使复制与转录在损伤处停下；另一种药物抑制胸苷酸合成酶，使 dTMP 供应中断，S 期细胞的复制因原料不足而停步。用药后肿瘤明显缩小，但患者同时出现骨髓抑制与口腔黏膜溃疡。检测显示，肿瘤组织中处于 S 期的细胞约占 45%，而骨髓与黏膜上皮的更新同样活跃；该肿瘤细胞的 TP53 基因缺失，p53 蛋白检测不到，患者的造血细胞则 p53 功能完好。体外实验还显示，把培养细胞先阻滞在 G0 期，同样浓度的烷化剂几乎不引起死亡。","vignette_title":"情景 1：化疗药为何偏偏挑中正在复制的细胞","gidx":4,"gn":5,"anchor":"骨髓与黏膜上皮的更新同样活跃"},{"id":"gc19-02-1","ch":18,"part":4,"tag":"机制","stem":"端粒缩短到临界长度后被当作损伤信号，其分子基础是","options":["端粒末端暴露的单链被核酸外切酶降解，留下缺口","端粒重复序列在缩短过程中发生碱基错配与突变","端粒缩短使端粒酶失去模板，末端无法再被延长","端粒末端失去保护性结合蛋白，被当作双链断裂","端粒缩短使着丝粒功能丧失，染色体无法被分离"],"answer":3,"explain":"D 对：端粒末端平时由端粒结合蛋白保护，缩短到临界长度后保护不足，末端被细胞识别为 DNA 双链断裂，经 ATM 与 p53 通路把细胞阻滞下来。A 错：末端单链被降解是损伤的结果之一，不是它被识别为损伤的原因。B 错：碱基错配属于复制错误，与末端失去保护无关。C 错：端粒酶以自带的 RNA 为模板延长末端，端粒缩短并不会使该模板消失。E 错：着丝粒位于染色体中部，与末端缩短没有关系。","type":"A1","group":"c19-02","kind":"mechanism","chs":[18,19,29],"vignette":"一株正常人二倍体成纤维细胞在体外连续传代：前 20 代每代群体倍增时间约 20 小时，第 40 代延长到 32 小时，第 52 代以后细胞数量不再增加，但仍贴附在培养皿底，体积明显变大、扁平铺展，在 pH 6.0 条件下 β-半乳糖苷酶染色呈阳性。流式检测显示这些细胞的 DNA 含量仍为 2C，掺入胸腺嘧啶脱氧核苷的标记率低于 1%，而培养液中检出高水平的白细胞介素 6。同期另一份平行样本只接受一次低剂量过氧化氢处理：48 小时后细胞出现磷脂酰丝氨酸外翻、caspase-3 活化，Bcl-2 表达下降而 Bax 表达升高。若在处理前让该细胞高表达 Bcl-2，磷脂酰丝氨酸外翻的细胞比例由 30% 降到 6%，多数细胞转而呈现体积增大、扁平铺展的形态。","vignette_title":"情景 2：第 52 代之后，细胞为何选择衰老而不是死亡","gidx":1,"gn":5,"anchor":"第 52 代以后细胞数量不再增加"},{"id":"gc22-03-1","ch":18,"part":4,"tag":"机制","stem":"乙药抑制拓扑异构酶后，S期细胞的DNA复制不能继续，其直接原因是","options":["解旋酶的水解活性被抑制，双链间的氢键不能被打开","单链结合蛋白从单链上脱落，暴露的单链被降解","DNA连接酶无法封闭缺口，冈崎片段堆积在复制叉处","复制叉前方的正超螺旋不能被消除，复制叉无法前进","引物酶不能合成RNA引物，DNA聚合酶无从起始延伸"],"answer":3,"explain":"D 对：拓扑异构酶通过切断并重新连接磷酸二酯键，消除复制叉前方的正超螺旋；它被抑制后正超螺旋不断累积，复制叉无法继续前进，复制随即停滞。A、E 分别讲解旋酶与引物酶，二者都不是该药的作用对象；B 错在单链结合蛋白的功能是稳定单链，而不是防止单链被降解；C 的冈崎片段连接发生在后随链合成之后，不能解释复制叉前进受阻。","type":"A1","group":"c22-03","kind":"mechanism","chs":[26,18,16],"vignette":"一位患者接受两种药物联合治疗：甲药从红豆杉中提取，进入细胞后与微管蛋白结合，使微管一旦聚合就难以解聚；乙药抑制拓扑异构酶，该酶原本通过切断并重新连接磷酸二酯键来消除复制叉前方的正超螺旋。检测显示，该患者肿瘤组织中处于S期的细胞约占45%、G2/M期约占18%；用药24小时后，肿瘤组织的G2/M期细胞升到62%，免疫荧光可见Mad2蛋白在未能正确连接的动粒上聚集，而S期细胞的比例下降到9%。这位患者的心肌细胞与神经元几乎没有损伤，骨髓与口腔黏膜上皮却出现明显的抑制与溃疡。同时测得肿瘤组织摄取葡萄糖的速率约为邻近正常组织的9倍，外周血乳酸升高，而心肌的能量供应仍以有氧氧化为主。停药三周后骨髓抑制逐渐恢复。","vignette_title":"情景 3：两种药只打正在分裂的细胞","gidx":1,"gn":5,"anchor":"消除复制叉前方的正超螺旋"},{"id":"gc4-01-1","ch":18,"part":4,"tag":"机制","stem":"DNA 聚合酶Ⅲ纠正刚掺入的错误核苷酸，依靠的是","options":["5′→3′ 聚合酶活性，在错配处重新起始合成新片段","5′→3′ 外切酶活性，切去模板链末端错配的核苷酸","3′→5′ 外切酶活性，切去新生链末端错配的核苷酸","核酸内切酶活性，从错配位点两侧同时切断双链","3′→5′ 聚合酶活性，把错配核苷酸就地改成正确碱基"],"answer":2,"explain":"C 对：情景给出该酶自身带 3′→5′ 外切酶活性，掺错后能切掉新生链末端的错误核苷酸再重新掺入，属即时校对。A 把外切方向写成 5′→3′，且切的是模板链，方向与链身份双错；C、D 把聚合活性误当成纠错方式，聚合酶只会继续延伸而不能自行改碱基；E 是核苷酸切除修复式的双切口内切，不是聚合酶校对。","type":"A1","group":"c4-01","kind":"mechanism","chs":[18,19,2],"vignette":"大肠埃希菌基因组约 4.6×10⁶ 个碱基对，按碱基配对规则复制一轮，最终留在子代 DNA 中的错误不足一个，碱基掺入的错误率低至十亿分之一。复制时 DNA 聚合酶Ⅲ把脱氧核苷酸加到新生链游离的 3′-OH 上，偶尔凑错的碱基会被聚合酶自身的 3′→5′ 外切酶活性切掉，再重新掺入正确的那一个，这一步使错误率下降约两个数量级。若错配核苷酸躲过校对，复制叉继续前进，子链上便留下一个错配。错配修复系统随后扫描新合成的链，识别尚未甲基化的那一股，切掉含错配的片段，再以母链为模板补齐缺口。若 MutS 等错配修复蛋白失活，突变率可升高上百倍。","vignette_title":"情景 1：一个错配碱基要过三道关卡","gidx":1,"gn":4,"anchor":"聚合酶自身的 3′→5′ 外切酶活性切掉"},{"id":"gc4-02-1","ch":18,"part":4,"tag":"机制","stem":"末端复制问题产生的直接原因是","options":["末端双链在复制前已发生大量碱基的脱氨损伤","末端序列的 GC 含量过高，使局部双链难以解链","DNA 聚合酶在末端停顿，无法切除错误掺入的碱基","端粒结合蛋白阻碍了复制叉向染色体末端推进","引物被切除后，子链末端留下的空隙无法被填补"],"answer":4,"explain":"E 对：聚合酶不能从头起始，末端 RNA 引物去除后子链 5′ 端留下的空隙既无上游 3′-OH 可延伸，也无法由聚合酶补上，子链才变短。A 讲的是碱基自发损伤，与末端复制无关；C 把校对功能错位到末端空隙上；D 端粒结合蛋白保护末端而非阻断复制叉；E 说的是一般解链难易，GC 含量并不决定末端空隙能否填补。","type":"A1","group":"c4-02","kind":"mechanism","chs":[18,17,26],"vignette":"真核生物的线性染色体末端是一段串联重复序列，人类为 5′-TTAGGG-3′ 重复数百至数千次，与一组端粒结合蛋白共同构成端粒。DNA 聚合酶不能从头起始合成，只能沿 5′→3′ 方向延伸，并需要一段 RNA 引物提供 3′-OH；当复制叉到达染色体末端，引物被切除后留下的空隙无法填补，子链因此比母链短 50–100 个核苷酸，这就是末端复制问题。端粒酶是一种核糖核蛋白，自带一段 RNA 作为模板，能以逆转录方式延长染色体 DNA 的 3′ 末端，随后由 DNA 聚合酶补齐另一条链。端粒酶在生殖细胞、干细胞和多数肿瘤细胞中活性较高，在普通体细胞中几乎不表达；体细胞每分裂一次端粒就缩短一些，缩短到临界长度后细胞退出细胞周期，进入复制性衰老。","vignette_title":"情景 2：染色体末端那道补不上的缺口","gidx":1,"gn":5,"anchor":"段 RNA 引物提供 3′-OH；当"},{"id":"gc4-02-3","ch":18,"part":4,"tag":"机制","stem":"端粒酶延长染色体末端的方式是","options":["以自身携带的蛋白质为模板，直接合成端粒重复序列","以对侧 DNA 链的 3′ 末端为引物，连接端粒重复序列","以自身携带的 RNA 为模板，逆转录延伸 DNA 的 5′ 末端","以自身携带的 RNA 为模板，逆转录延伸 DNA 的 3′ 末端","以染色体末端的 DNA 为模板，转录出新的端粒重复序列"],"answer":3,"explain":"D 对：端粒酶是核糖核蛋白，以自身携带的 RNA 为模板，按逆转录方式延长染色体 DNA 的 3′ 末端，随后由 DNA 聚合酶补齐另一条链。A 把被延伸的末端写成 5′ 端，方向颠倒；B 把酶的模板说成 DNA 并说成转录；D 说模板是蛋白质，逆转录酶必须以核酸为模板；E 连接酶式机制不能增加重复单元的拷贝数。","type":"A1","group":"c4-02","kind":"mechanism","chs":[18,17,26],"vignette":"真核生物的线性染色体末端是一段串联重复序列，人类为 5′-TTAGGG-3′ 重复数百至数千次，与一组端粒结合蛋白共同构成端粒。DNA 聚合酶不能从头起始合成，只能沿 5′→3′ 方向延伸，并需要一段 RNA 引物提供 3′-OH；当复制叉到达染色体末端，引物被切除后留下的空隙无法填补，子链因此比母链短 50–100 个核苷酸，这就是末端复制问题。端粒酶是一种核糖核蛋白，自带一段 RNA 作为模板，能以逆转录方式延长染色体 DNA 的 3′ 末端，随后由 DNA 聚合酶补齐另一条链。端粒酶在生殖细胞、干细胞和多数肿瘤细胞中活性较高，在普通体细胞中几乎不表达；体细胞每分裂一次端粒就缩短一些，缩短到临界长度后细胞退出细胞周期，进入复制性衰老。","vignette_title":"情景 2：染色体末端那道补不上的缺口","gidx":3,"gn":5,"anchor":"自带一段 RNA 作为模板"},{"id":"gc4-02-5","ch":18,"part":4,"tag":"机制","stem":"关于端粒、端粒酶与末端复制问题，下列判断正确的是（X 型多选）","options":["端粒酶是一种核糖核蛋白，含 RNA 与蛋白质组分","端粒酶在生殖细胞与多数肿瘤细胞中活性较高","DNA 聚合酶不能从头起始，需要引物提供 3′-OH","切除引物留下的空隙由端粒酶直接填补而完成","DNA 聚合酶只能沿 5′→3′ 方向延长新生链"],"answer":[0,1,2,4],"explain":"答案 ABCE。A、E 对：聚合酶的两个基本限制——不能从头起始、只能按 5′→3′ 延长，正是末端复制问题的根源。B 对：情景指出端粒酶在生殖细胞、干细胞与多数肿瘤细胞中活性较高。A 对：端粒酶由蛋白质与 RNA 组成，RNA 充当模板。D 错：端粒酶只延长染色体 DNA 的 3′ 末端，引物切除后的空隙由 DNA 聚合酶补齐，并非由端粒酶直接填补。","type":"X","group":"c4-02","kind":"mechanism","chs":[18,17,26],"vignette":"真核生物的线性染色体末端是一段串联重复序列，人类为 5′-TTAGGG-3′ 重复数百至数千次，与一组端粒结合蛋白共同构成端粒。DNA 聚合酶不能从头起始合成，只能沿 5′→3′ 方向延伸，并需要一段 RNA 引物提供 3′-OH；当复制叉到达染色体末端，引物被切除后留下的空隙无法填补，子链因此比母链短 50–100 个核苷酸，这就是末端复制问题。端粒酶是一种核糖核蛋白，自带一段 RNA 作为模板，能以逆转录方式延长染色体 DNA 的 3′ 末端，随后由 DNA 聚合酶补齐另一条链。端粒酶在生殖细胞、干细胞和多数肿瘤细胞中活性较高，在普通体细胞中几乎不表达；体细胞每分裂一次端粒就缩短一些，缩短到临界长度后细胞退出细胞周期，进入复制性衰老。","vignette_title":"情景 2：染色体末端那道补不上的缺口","gidx":5,"gn":5,"anchor":"端粒酶是一种核糖核蛋白"},{"id":"gc7-03-3","ch":18,"part":4,"tag":"机制","stem":"若复制在损伤处停滞又不触发检查点，最可能的后果是","options":["停滞的复制叉由 DNA 连接酶直接连接成完整链","停滞的复制叉跳过损伤处，合成出序列正确的 DNA","复制叉停滞过久发生崩解，断裂由同源重组修复","停滞的复制叉自行倒退，损伤随之被彻底清除","复制叉停滞只能使细胞停止生长，不产生断裂"],"answer":2,"explain":"C 对：复制叉长时间停滞会发生崩解，形成 DNA 双链断裂，这类断裂需同源重组修复，以姐妹染色单体提供正确模板，保真性较高。B 复制叉倒退不能消除损伤本身；C 跳过损伤需要跨损伤合成参与，且必然可能掺入错误碱基，不可能保证序列完全正确；D 长期停滞正是断裂与染色体畸变的来源；E 连接酶只能封闭缺口，无法把停滞的复制叉救活。","type":"A1","group":"c7-03","kind":"mechanism","chs":[18,19,26],"vignette":"培养细胞中加入羟基脲后，核糖核苷酸还原酶被抑制，四种 dNTP 的供应在 40 分钟内降到不足原来的 10%，S 期的复制叉被迫停在半路，暴露出的单链 DNA 被 RPA 包裹。这一信号由 ATR 感知，它磷酸化下游的 CHK1，经 Cdc25 磷酸酶受抑使 CDK1 的抑制性磷酸化无法去除，细胞因此不能启动有丝分裂。研究者同时观察到，处理 12 小时后细胞累积在 S 期，2N 与 4N 峰之间的 S 期细胞比例由 28% 升至 63%，而 G2/M 并没有出现相应的峰值。把 DNA 双链断裂诱导剂阿霉素加到细胞中，ATM 通路被激活，被磷酸化的组蛋白变体形成焦点，细胞阻滞于 G2/M。若检查点失效，细胞会带着未完成复制的 DNA 强行进入分裂，随后出现染色体断裂与微核。","vignette_title":"情景 3：当复制叉撞上未修好的损伤","gidx":3,"gn":5,"anchor":"S 期的复制叉被迫停在半路"},{"ch":18,"part":4,"tag":"半保留复制","stem":"将大肠埃希菌先在含15N的培养基中培养多代，再转入含14N的培养基中繁殖两代，提取DNA作CsCl密度梯度离心。其结果是","options":["出现一条杂交密度带和一条轻密度带，二者含量各占一半","出现一条重密度带和一条杂交密度带，二者各占一半","只出现一条杂交密度带","出现重、杂交、轻三条密度带","只出现一条轻密度带"],"answer":0,"explain":"半保留复制两代后共4个DNA分子，其中2个为15N/14N杂交分子、2个为14N/14N轻分子，故杂交带与轻带各占一半。","type":"A1","id":"c18-f7fb55f9"},{"ch":18,"part":4,"tag":"复制起始调控","stem":"真核生物能保证一个细胞周期中染色体只复制一次，其关键机制是","options":["细胞仅在S期才合成DNA聚合酶，其他时期该酶完全缺失","G1期在复制起始点组装前复制复合体（pre-RC），CDK激活后起始复制并阻止pre-RC重新组装","每个细胞周期只随机启用一个复制起始点，其余起始点永久失活","DNA复制只能从染色体两端（端粒）起始，形成单向复制叉","原核生物同样严格遵守一次细胞分裂仅复制一次的规律"],"answer":1,"explain":"pre-RC在G1期完成复制许可，CDK激活后起始复制并抑制其重新组装；而大肠埃希菌营养充足时可在一次分裂中连续多轮起始。","type":"A1","id":"c18-1b3c590a"},{"ch":18,"part":4,"tag":"端粒酶","stem":"关于端粒与端粒酶，下列叙述正确的是","options":["端粒酶是一种DNA聚合酶，以DNA为模板延伸端粒","端粒缩短只与细胞衰老有关，与肿瘤发生无关","端粒酶活性在人体所有体细胞中均很高，故体细胞端粒不缩短","端粒酶可直接延伸染色体末端的5'端，解决末端复制问题","端粒酶本质是逆转录酶，以自身携带的RNA为模板合成端粒重复序列，延伸染色体3'端"],"answer":4,"explain":"端粒酶是逆转录酶，以自身RNA为模板逆转录合成TTAGGG重复序列以延伸3'端；体细胞端粒酶活性低，端粒随分裂逐渐缩短。","type":"A1","id":"c18-8875855b"},{"ch":18,"part":4,"tag":"DNA聚合酶","stem":"关于DNA聚合酶的作用特性，下列叙述正确的是","options":["能以游离的dNTP为起点从头起始DNA链的合成","催化dNTP加到生长链的5'端，沿5'到3'方向延伸模板","需要引物提供3'-OH，多数DNA聚合酶还具有3'到5'外切酶校对活性","以NTP为底物，产物为RNA链","只能沿模板链5'到3'方向移动，故合成方向为3'到5'"],"answer":2,"explain":"DNA聚合酶不能从头起始，需引物提供3'-OH，以dNTP为底物沿5'到3'合成；其3'到5'外切活性可切除错配核苷酸。","type":"A1","id":"c18-9cb681ed"},{"ch":18,"part":4,"tag":"真核复制特点","stem":"与原核生物相比，真核生物DNA复制的特点是","options":["只有一个复制起始点，从该点向两个方向形成复制叉","复制发生在整个细胞周期，无严格的时期限制","复制速度快（约1000 nt/s），且不受核小体影响","有多个复制起始点，仅S期进行复制，复制叉移动速度较慢","真核复制不需要引物，也不需要DNA连接酶"],"answer":3,"explain":"真核基因组大，含多个复制起始点（复制子），复制限于S期，复制叉移动较慢；原核单一起始点、速度快，可贯穿细胞周期。","type":"A1","id":"c18-8dff4197"},{"ch":18,"part":4,"tag":"D环复制","stem":"人类线粒体DNA（mtDNA）的复制方式是","options":["D环复制","theta型双向复制","滚环复制","以RNA为中间体的逆转录复制","不进行复制，仅随细胞分裂随机分配"],"answer":0,"explain":"真核线粒体DNA以D环方式复制：重链先起始合成形成D环，轻链随后起始；逆转录复制是逆转录病毒RNA的复制形式。","type":"A1","id":"c18-ae257d38"},{"ch":18,"part":4,"tag":"逆转录病毒","stem":"关于逆转录病毒的结构与其致病机制，下列叙述正确的是","options":["逆转录病毒以DNA为基因组，通过RNA聚合酶完成复制","两端的长末端重复序列（LTR）负责编码病毒包膜蛋白","所有逆转录病毒均携带癌基因，均能引起细胞恶性转化","逆转录病毒复制时不形成DNA中间体，不整合入宿主基因组","两端为LTR（用于整合），含Gag、Env等编码序列及逆转录酶；致癌逆转录病毒还额外携带癌基因"],"answer":4,"explain":"逆转录病毒是RNA病毒，两端LTR用于整合，编码Gag、Env及逆转录酶；只有致癌逆转录病毒额外携带癌基因，可致细胞恶性转化。","type":"A1","id":"c18-0c0c6538"},{"ch":18,"part":4,"tag":"链终止","stem":"若在DNA复制体系中加入缺乏3'-OH的核苷酸类似物标记新合成的链，其结果是","options":["类似物被错配修复系统识别并替换为正常核苷酸，链可正常延长","类似物掺入后因缺少3'-OH不能与下一个dNTP形成磷酸二酯键，链延伸终止","类似物只能掺入RNA链，对DNA复制没有影响","类似物掺入后由DNA聚合酶3'到5'外切酶活性将其切除，链继续延长","类似物掺入后使DNA双链立即解旋，复制叉解体"],"answer":1,"explain":"DNA链延伸依赖末端3'-OH攻击下一dNTP的alpha-磷酸；无3'-OH的类似物（如ddNTP）掺入后无法形成磷酸二酯键，链延伸终止。","type":"A1","id":"c18-b5e0700c"},{"ch":18,"part":4,"tag":"冈崎片段","stem":"关于DNA复制的半不连续性与冈崎片段，下列叙述正确的是","options":["前导链与后随链都以冈崎片段的形式不连续合成","前导链沿复制叉前进方向连续合成，后随链则先合成一系列短的冈崎片段，引物去除、缺口填补后再由DNA连接酶连成完整链","冈崎片段以DNA为引物直接起始合成","冈崎片段只出现于线粒体DNA的复制","冈崎片段的连接由拓扑异构酶完成，不需要DNA连接酶"],"answer":1,"explain":"两条链的模板方向相反，后随链只能背离复制叉方向分段合成冈崎片段，片段之间的缺口由DNA连接酶封闭。","type":"A1","id":"c18-ee42d6c1"},{"ch":18,"part":4,"tag":"复制蛋白","stem":"关于参与DNA复制的蛋白因子及其作用，下列叙述正确的是","options":["解旋酶水解ATP解开双链间的氢键，单链结合蛋白稳定单链，拓扑异构酶通过切断与重接磷酸二酯键消除复制叉前方的正超螺旋","单链结合蛋白具有DNA聚合酶活性，可直接延伸新链","引物酶必须依赖已有的3'-OH才能起始合成","拓扑异构酶负责合成RNA引物","解旋酶的主要功能是催化磷酸二酯键的形成"],"answer":0,"explain":"解旋酶打开氢键、单链结合蛋白稳定单链、拓扑异构酶消除正超螺旋，共同保证复制叉推进；引物酶可从头起始合成引物。","type":"A1","id":"c18-393cb139"},{"ch":18,"part":4,"tag":"原核复制起始","stem":"关于大肠埃希菌染色体复制起始点（oriC）及其起始调控，下列叙述正确的是","options":["oriC富含GC，需在高温下才能解开双链","oriC在细胞周期中只被甲基化一次，其后永久失活","oriC含多个DnaA结合重复序列与富含AT的重复区，DnaA结合后使AT区双链局部解开并加载解旋酶启动复制；复制后的新起点保持半甲基化状态，可防止同一周期内再次起始","大肠埃希菌染色体含多个复制起始点，同时起始以加快复制","oriC的起始不需要DnaA蛋白参与"],"answer":2,"explain":"oriC为单一起始点，AT富集区易解链；DnaA结合后加载解旋酶起始复制，半甲基化状态使新起点暂时不能被再次起始。","type":"A1","id":"c18-66473079"},{"ch":18,"part":4,"tag":"聚合酶分工","stem":"关于真核生物DNA复制中DNA聚合酶的分工，下列叙述正确的是","options":["DNA聚合酶α兼具解旋酶活性，负责解开双链","DNA聚合酶β负责前导链的连续合成","DNA聚合酶γ负责细胞核DNA的复制","真核复制不需要滑动夹，一种聚合酶即可持续合成整条染色体","DNA聚合酶α具有引物酶活性，合成引物并起始新链；聚合酶ε主要合成前导链、聚合酶δ主要合成后随链，二者借PCNA滑动夹提高持续合成能力"],"answer":4,"explain":"Pol α合成RNA引物并起始，Pol ε与Pol δ分别主要负责前导链与后随链，PCNA滑动夹增强持续性；Pol γ复制线粒体DNA，Pol β参与修复。","type":"A1","id":"c18-0747036f"},{"ch":18,"part":4,"tag":"逆转录酶","stem":"关于逆转录酶的酶学特性，下列叙述正确的是","options":["逆转录酶以RNA为模板，但不能以DNA为模板合成DNA","逆转录酶可从头起始DNA链的合成，不需要引物","逆转录酶水解DNA-RNA杂合双链中的DNA链","逆转录酶同时具有RNA依赖和DNA依赖的DNA聚合酶活性以及RNase H活性，通常以tRNA等提供引物，产物为与模板互补的DNA","逆转录酶的催化产物是RNA，反应不需要dNTP参与"],"answer":3,"explain":"逆转录酶兼具两种DNA聚合酶活性与RNase H活性，需引物起始，产物为cDNA；端粒酶本质上也属于逆转录酶。","type":"A1","id":"c18-a7c2bad1"},{"ch":18,"part":4,"tag":"PCR","stem":"关于聚合酶链反应（PCR）的原理，下列叙述正确的是","options":["以一对寡核苷酸引物、耐热DNA聚合酶和dNTP为基本条件，反复进行模板变性、引物退火与延伸，产物按2的n次方指数扩增","PCR不需要引物，由DNA聚合酶从头起始合成","PCR产物随循环次数线性增加","PCR使用不耐热的大肠埃希菌DNA聚合酶，故退火温度可自由提高","PCR中模板只需变性一次，其后各轮循环只做延伸"],"answer":0,"explain":"PCR需引物与耐热聚合酶，每轮变性、退火、延伸使产物倍增，n轮后约为2的n次方，其原理源于体内DNA复制。","type":"A1","id":"c18-1894eb1d"},{"ch":18,"part":4,"tag":"DNA连接酶","stem":"关于DNA连接酶的作用，下列叙述正确的是","options":["DNA连接酶催化两个游离的3'-OH之间形成磷酸二酯键","DNA连接酶催化相邻的3'-OH与5'-磷酸基团形成磷酸二酯键，封闭冈崎片段之间或修复、重组中的缺口，反应需ATP或NAD+供能","DNA连接酶能解开双链，因此复制不需要解旋酶","DNA连接酶只能连接RNA链，不能连接DNA链","DNA连接酶只参与复制起始，不参与缺口封闭"],"answer":1,"explain":"连接酶封闭3'-OH与5'-磷酸之间的缺口并需ATP或NAD+供能，在复制、修复与重组中均起作用。","type":"A1","id":"c18-652a178f"},{"ch":18,"part":4,"tag":"滚环复制","stem":"关于滚环复制，下列叙述正确的是","options":["滚环复制是双链环状DNA双向等速复制形成θ结构的过程","滚环复制不需要切开任何链，也不产生单链中间体","滚环复制中一条链被切开产生3'-OH，以未切开的环状链为模板连续延伸，被置换的单链随后合成互补链，可产生多联体","滚环复制以RNA为模板，由逆转录酶催化","滚环复制过程中被置换的单链立即被降解，不用于合成互补链"],"answer":2,"explain":"滚环复制在一条链上切开产生3'-OH，以环状链为模板连续延伸并置换单链，常见于φX174等环状DNA及细菌接合转移。","type":"A1","id":"c18-ed8696b9"},{"id":"gc0-02-2","ch":19,"part":4,"tag":"机制","stem":"NER 切除一段含损伤的 DNA 后，把缺口补回正确序列依据的是","options":["以对侧完整链为模板，由 DNA 聚合酶延伸、连接酶封口","由核酸外切酶从两端降解后随机拼接出等价序列","由逆转录酶以损伤位点为引物，反向合成新的片段","由 DNA 连接酶直接连接断裂两端，不需重新合成","以受损链自身为模板，由 RNA 聚合酶重新合成该片段"],"answer":0,"explain":"A 对：切除修复之所以准确，关键在于对侧链完好、可作为模板。B 若用受损链作模板会把错误固定下来；C 逆转录酶不参与核内切除修复；D 只连接不合成，缺口仍在；E 随机拼接不可能保证序列正确。","type":"A1","group":"c0-02","kind":"mechanism","chs":[2,19],"vignette":"阳光里的紫外线，波长正好落在核酸吸收最强的 260 nm 附近。当它照到皮肤细胞时，同一条链上相邻的两个胸腺嘧啶之间会形成环丁烷型嘧啶二聚体，DNA 双螺旋在这一处被顶得扭曲，复制与转录到此处都会停下。细胞有一套修复系统：核苷酸切除修复（NER）先由蛋白质识别这种扭曲、在损伤两侧各切一刀，切除约 25–30 个核苷酸的片段，再由 DNA 聚合酶以对侧完整链为模板补齐缺口，最后由连接酶封口。着色性干皮病患者正是因为 NER 通路（如 XPA、XPC 等）缺陷，晒到的部位反复出现色素沉着、皮肤萎缩，并在很年轻的年龄发生皮肤癌。","vignette_title":"情景 2：为什么晒出来的损伤偏偏卡在胸腺嘧啶上","gidx":2,"gn":4,"anchor":"以对侧完整链为模板补齐缺口"},{"id":"gc0-02-3","ch":19,"part":4,"tag":"判读","stem":"若 NER 通路缺陷，最直接的后果是","options":["DNA 双链断裂无法连接，染色体发生易位与丢失","胞嘧啶自发脱氨生成的尿嘧啶无法被切除修复","嘧啶二聚体长期保留，复制时掺入错误碱基而致突变","端粒随每次复制持续缩短，细胞提前进入衰老期","复制时的错配碱基无法被识别，微卫星序列不稳定"],"answer":2,"explain":"C 对：二聚体不被切除时，复制经过该处会因模板扭曲而错误掺入碱基，突变累积最终致癌。B 双链断裂由同源重组或非同源末端连接处理；C 是错配修复缺陷的表现；D 属碱基切除修复范畴；E 与端粒酶机制相关，均与 NER 无关。","type":"A1","group":"c0-02","kind":"mechanism","chs":[2,19],"vignette":"阳光里的紫外线，波长正好落在核酸吸收最强的 260 nm 附近。当它照到皮肤细胞时，同一条链上相邻的两个胸腺嘧啶之间会形成环丁烷型嘧啶二聚体，DNA 双螺旋在这一处被顶得扭曲，复制与转录到此处都会停下。细胞有一套修复系统：核苷酸切除修复（NER）先由蛋白质识别这种扭曲、在损伤两侧各切一刀，切除约 25–30 个核苷酸的片段，再由 DNA 聚合酶以对侧完整链为模板补齐缺口，最后由连接酶封口。着色性干皮病患者正是因为 NER 通路（如 XPA、XPC 等）缺陷，晒到的部位反复出现色素沉着、皮肤萎缩，并在很年轻的年龄发生皮肤癌。","vignette_title":"情景 2：为什么晒出来的损伤偏偏卡在胸腺嘧啶上","gidx":3,"gn":4,"anchor":"复制与转录到此处都会停下"},{"id":"gc19-01-1","ch":19,"part":4,"tag":"机制","stem":"交联型损伤使复制在损伤处停下，其直接的分子原因是","options":["交联使模板碱基被逐个脱去，配对无法正常进行","交联改变组蛋白的修饰，染色质无法被松解","交联把两条链钉在一起，局部解链受阻而停步","交联使引物酶无法合成引物，复制无法起始","交联使复制起点失效，聚合酶无法被招募"],"answer":2,"explain":"C 对：交联把两条链共价连在一起，复制叉前进之前必须解链，双螺旋分不开，复制与转录都在此处停下。A 错：碱基脱去形成无碱基位点属于碱基损伤，不是交联的直接后果。B 错：组蛋白修饰改变影响的是染色质状态，并非复制停步的原因。D 错：引物酶合成引物发生在复制起始阶段，链间交联与之无直接关系。E 错：复制起点在 S 期被激活属于起始调控，交联并不会使起点失效。","type":"A1","group":"c19-01","kind":"mechanism","chs":[19,26,18],"vignette":"某化疗方案联合两种药物：一种烷化剂能与鸟嘌呤的 N7 位结合，并在 DNA 两条链之间形成交联，使复制与转录在损伤处停下；另一种药物抑制胸苷酸合成酶，使 dTMP 供应中断，S 期细胞的复制因原料不足而停步。用药后肿瘤明显缩小，但患者同时出现骨髓抑制与口腔黏膜溃疡。检测显示，肿瘤组织中处于 S 期的细胞约占 45%，而骨髓与黏膜上皮的更新同样活跃；该肿瘤细胞的 TP53 基因缺失，p53 蛋白检测不到，患者的造血细胞则 p53 功能完好。体外实验还显示，把培养细胞先阻滞在 G0 期，同样浓度的烷化剂几乎不引起死亡。","vignette_title":"情景 1：化疗药为何偏偏挑中正在复制的细胞","gidx":1,"gn":5,"anchor":"在 DNA 两条链之间形成交联"},{"id":"gc19-01-5","ch":19,"part":4,"tag":"判读","stem":"关于放化疗的选择性与损伤应答，下列判断正确的是（X 型多选）","options":["肿瘤细胞增殖快，进入 S 期的比例高而更易被杀伤","正常细胞 p53 功能完好，可在检查点停滞并修复损伤","p53 缺失使肿瘤对损伤更耐受，因而用药后预后更好","检查点失灵使损伤细胞带着错误进入分裂而死亡","烷化剂需细胞进入复制才充分发挥杀伤，静止细胞耐受"],"answer":[0,1,3,4],"explain":"答案 ABDE。A、B、D、E 分别对应情景中的四条线索：S 期细胞比例高、正常细胞检查点完好、检查点失灵使细胞死亡、G0 期细胞几乎不死亡。C 错：p53 缺失使肿瘤对损伤更敏感而不是更耐受，预后判断与情景给出的检测结果相反。","type":"X","group":"c19-01","kind":"mechanism","chs":[19,26,18],"vignette":"某化疗方案联合两种药物：一种烷化剂能与鸟嘌呤的 N7 位结合，并在 DNA 两条链之间形成交联，使复制与转录在损伤处停下；另一种药物抑制胸苷酸合成酶，使 dTMP 供应中断，S 期细胞的复制因原料不足而停步。用药后肿瘤明显缩小，但患者同时出现骨髓抑制与口腔黏膜溃疡。检测显示，肿瘤组织中处于 S 期的细胞约占 45%，而骨髓与黏膜上皮的更新同样活跃；该肿瘤细胞的 TP53 基因缺失，p53 蛋白检测不到，患者的造血细胞则 p53 功能完好。体外实验还显示，把培养细胞先阻滞在 G0 期，同样浓度的烷化剂几乎不引起死亡。","vignette_title":"情景 1：化疗药为何偏偏挑中正在复制的细胞","gidx":5,"gn":5,"anchor":"先阻滞在 G0 期"},{"id":"gc19-02-2","ch":19,"part":4,"tag":"判读","stem":"第 52 代以后的细胞 DNA 含量仍为 2C 且掺入率极低，说明它们","options":["细胞在 G1 期停滞并退出周期，但仍保持代谢活跃","细胞已发生凋亡，DNA 断裂使其含量低于 2C","细胞停滞在 G2 期，尚未完成 DNA 的复制","细胞进入 G0 期后重新开始合成 DNA 并分裂","细胞为多倍体，DNA 含量升高后才被检出"],"answer":0,"explain":"A 对：DNA 含量为 2C 说明细胞没有完成复制，掺入率低于 1% 说明它已不进入 S 期，β-半乳糖苷酶阳性与体积增大提示细胞退出周期但仍存活，属于复制性衰老。B 错：凋亡细胞的 DNA 被降解，含量会低于 2C 并出现亚二倍体峰。C 错：G2 期细胞的 DNA 含量应为 4C。D 错：衰老细胞不再合成 DNA，也不会重新分裂。E 错：多倍体细胞的 DNA 含量高于 4C，与 2C 不符。","type":"A1","group":"c19-02","kind":"mechanism","chs":[18,19,29],"vignette":"一株正常人二倍体成纤维细胞在体外连续传代：前 20 代每代群体倍增时间约 20 小时，第 40 代延长到 32 小时，第 52 代以后细胞数量不再增加，但仍贴附在培养皿底，体积明显变大、扁平铺展，在 pH 6.0 条件下 β-半乳糖苷酶染色呈阳性。流式检测显示这些细胞的 DNA 含量仍为 2C，掺入胸腺嘧啶脱氧核苷的标记率低于 1%，而培养液中检出高水平的白细胞介素 6。同期另一份平行样本只接受一次低剂量过氧化氢处理：48 小时后细胞出现磷脂酰丝氨酸外翻、caspase-3 活化，Bcl-2 表达下降而 Bax 表达升高。若在处理前让该细胞高表达 Bcl-2，磷脂酰丝氨酸外翻的细胞比例由 30% 降到 6%，多数细胞转而呈现体积增大、扁平铺展的形态。","vignette_title":"情景 2：第 52 代之后，细胞为何选择衰老而不是死亡","gidx":2,"gn":5,"anchor":"DNA 含量仍为 2C"},{"id":"gc19-03-4","ch":19,"part":4,"tag":"机制","stem":"降低 p53 水平后凋亡比例由 35% 降至 14%，说明","options":["p53 缺失使细胞从此不再发生程序性死亡","p53 的作用限于 DNA 修复，与凋亡程序无关","p53 在热应激中充当分子伴侣帮助蛋白折叠","p53 下调使 HSP70 表达升高而抑制了凋亡","p53 是应激信号转向凋亡通路的关键枢纽之一"],"answer":4,"explain":"E 对：降低 p53 后凋亡比例由 35% 降至 14%，说明 p53 是把应激信号导向凋亡的重要枢纽之一，它可被多种应激激活并上调促凋亡基因。A 错：凋亡比例显著下降并不等于程序性死亡完全消失，其余通路仍在起作用。B 错：p53 既参与修复调控，也参与凋亡调控，两者并不互斥。C 错：p53 没有分子伴侣活性，不能帮助蛋白重新折叠。D 错：情景中没有 HSP70 表达升高的检测结果，p53 下调也不会由此抑制凋亡。","type":"A1","group":"c19-03","kind":"mechanism","chs":[1,7,19],"vignette":"把培养细胞从 37℃ 分别移到 42℃ 与 45℃ 水浴：42℃ 处理 1 小时后回到 37℃，热休克因子 HSF1 由单体聚合并转入核内，HSP70 与 HSP90 的 mRNA 在 2 小时内升高约 8 倍，细胞存活率超过 90%。45℃ 处理 3 小时则不同：胞质中出现大量泛素化蛋白聚集体，HSP70 结合到聚集体上却无法使其重新溶解。同时测得内质网腔内未折叠蛋白增多，分子伴侣 BiP 从 PERK、ATF6 与 IRE1 三种感受器上解离，PERK 使 eIF2α 磷酸化，全局蛋白质翻译下降约 70%，ATF4 与 CHOP 的表达上调。24 小时后约 35% 的细胞出现 caspase-3 活化；若事先用小干扰 RNA 降低 p53 水平，同一处理下这一比例降至 14%。","vignette_title":"情景 3：42℃ 能救回来，45℃ 却启动了死亡程序","gidx":4,"gn":5,"anchor":"用小干扰 RNA 降低 p53 水平"},{"id":"gc19-04-1","ch":19,"part":4,"tag":"判读","stem":"2 小时时尾矩升至 18、焦点数达到 32 个，最合理的解释是","options":["2 小时时断裂尚未出现，两项指标反映的是细胞凋亡","2 小时时药物抑制拓扑异构酶Ⅱ，使复制无法完成","2 小时时已形成大量双链断裂，两项指标互相印证","2 小时时细胞大量死亡，碎片被误读为 DNA 损伤","2 小时时损伤集中在 S 期细胞，其他细胞不受影响"],"answer":2,"explain":"C 对：碱性彗星实验检测断裂使 DNA 在电泳中形成尾矩，γH2AX 则是断裂位点处组蛋白 H2AX 被磷酸化的标志，两项在 2 小时同步升高，说明断裂已在早期大量形成。A 错：凋亡出现在 24 小时，与 2 小时的数据不符。B 错：抑制拓扑异构酶Ⅱ会稳定酶与 DNA 的断裂复合物，本身即造成断裂，而非仅仅使复制无法完成。D 错：细胞大量死亡应伴随亚二倍体峰，2 小时的流式结果中并没有。E 错：彗星实验反映的是全群体的断裂水平，不能据此认定其他细胞未受损伤。","type":"A1","group":"c19-04","kind":"experiment","chs":[19,26,29],"vignette":"研究生用一种抑制拓扑异构酶Ⅱ的药物处理 HeLa 细胞，药物在培养基中持续存在 24 小时，于 0、2、12、24 小时取样做三套检测。碱性彗星实验：尾矩由 1.2 升至 18（2 小时），12 小时回落到 4，24 小时为 3.5。γH2AX 免疫荧光：每核平均焦点数 2 小时为 32 个，12 小时为 9 个，24 小时为 5 个。流式细胞术测 DNA 含量：0 小时 G1 期 55%、S 期 30%、G2/M 期 12%；12 小时变为 G1 期 20%、S 期 22%、G2/M 期 55%；24 小时在 2C 峰之前出现一个占 28% 的亚二倍体峰。另设一组在给药同时加入 ATM 激酶抑制剂，2 小时时每核焦点数只有 6 个，而碱性彗星实验的尾矩仍为 17。","vignette_title":"情景 4：三张图对不上时，断裂到底修好了没有","gidx":1,"gn":6,"anchor":"每核平均焦点数 2 小时为 32 个"},{"id":"gc19-04-2","ch":19,"part":4,"tag":"判读","stem":"12 小时尾矩回落到 4、焦点数降到 9 个，最合理的解释是","options":["断裂在 12 小时时已基本修复，损伤负荷明显回落","细胞在 12 小时时大量死亡，残余信号来自碎片","药物在 12 小时时被代谢清除，不再产生新的断裂","γH2AX 焦点减少是因为细胞被阻滞在 G2/M 期","两项指标的回落说明最初的升高是实验噪声"],"answer":0,"explain":"A 对：药物在培养基中持续存在 24 小时，12 小时两项指标同步回落，只能说明断裂已被修复，损伤负荷下降。B 错：若细胞大量死亡，亚二倍体峰应提前出现，而 12 小时的流式结果中仍未见到。C 错：情景已说明药物持续存在 24 小时，不会被代谢清除。D 错：G2/M 阻滞说明细胞停在分裂之前，而焦点减少反映的是断裂位点本身在减少。E 错：两种原理不同的方法给出先升后降的一致结果，不能用噪声解释。","type":"A1","group":"c19-04","kind":"experiment","chs":[19,26,29],"vignette":"研究生用一种抑制拓扑异构酶Ⅱ的药物处理 HeLa 细胞，药物在培养基中持续存在 24 小时，于 0、2、12、24 小时取样做三套检测。碱性彗星实验：尾矩由 1.2 升至 18（2 小时），12 小时回落到 4，24 小时为 3.5。γH2AX 免疫荧光：每核平均焦点数 2 小时为 32 个，12 小时为 9 个，24 小时为 5 个。流式细胞术测 DNA 含量：0 小时 G1 期 55%、S 期 30%、G2/M 期 12%；12 小时变为 G1 期 20%、S 期 22%、G2/M 期 55%；24 小时在 2C 峰之前出现一个占 28% 的亚二倍体峰。另设一组在给药同时加入 ATM 激酶抑制剂，2 小时时每核焦点数只有 6 个，而碱性彗星实验的尾矩仍为 17。","vignette_title":"情景 4：三张图对不上时，断裂到底修好了没有","gidx":2,"gn":6,"anchor":"12 小时回落到 4"},{"id":"gc19-04-5","ch":19,"part":4,"tag":"判读","stem":"关于 ATM 抑制剂组的 γH2AX 焦点与彗星尾矩结果，下列判断正确的是（X 型多选）","options":["ATM 被抑制后 H2AX 的磷酸化减少，焦点因此变少","尾矩没有下降说明断裂仍然存在，两项结果并不矛盾","焦点数降到 6 个说明药物没有造成 DNA 断裂","两项指标反映不同层面，判断损伤程度时应结合使用","ATM 抑制剂直接切除了断裂末端，所以焦点消失"],"answer":[0,1,3],"explain":"答案 ABD。A 对：H2AX 的磷酸化主要由 ATM 等激酶催化，抑制 ATM 后焦点自然减少。B 对：碱性彗星实验直接检测断裂，尾矩仍为 17 说明断裂确实存在，与焦点减少并不矛盾。D 对：两项指标分别反映断裂量与损伤应答，联合判读才能得出可靠结论。C 错：焦点是磷酸化 H2AX 的聚集，焦点减少并不等于没有断裂。E 错：ATM 抑制剂抑制的是激酶活性，不会切除断裂的末端。","type":"X","group":"c19-04","kind":"experiment","chs":[19,26,29],"vignette":"研究生用一种抑制拓扑异构酶Ⅱ的药物处理 HeLa 细胞，药物在培养基中持续存在 24 小时，于 0、2、12、24 小时取样做三套检测。碱性彗星实验：尾矩由 1.2 升至 18（2 小时），12 小时回落到 4，24 小时为 3.5。γH2AX 免疫荧光：每核平均焦点数 2 小时为 32 个，12 小时为 9 个，24 小时为 5 个。流式细胞术测 DNA 含量：0 小时 G1 期 55%、S 期 30%、G2/M 期 12%；12 小时变为 G1 期 20%、S 期 22%、G2/M 期 55%；24 小时在 2C 峰之前出现一个占 28% 的亚二倍体峰。另设一组在给药同时加入 ATM 激酶抑制剂，2 小时时每核焦点数只有 6 个，而碱性彗星实验的尾矩仍为 17。","vignette_title":"情景 4：三张图对不上时，断裂到底修好了没有","gidx":5,"gn":6,"anchor":"每核焦点数只有 6 个"},{"id":"gc4-01-2","ch":19,"part":4,"tag":"机制","stem":"错配修复系统决定切掉哪一股，其判断依据是","options":["模板链暂时未甲基化，被识别为需要切除的链","两条链的错配位点都切除，再各自以自身为模板补齐","新生链暂时未甲基化，被识别为需要切除的链","错配碱基本身较小，是判断切除哪一股的主要依据","新生链甲基化程度更高，被识别为需要切除的链"],"answer":2,"explain":"C 对：复制后短时间内只有模板链已甲基化，新生链尚未甲基化，错配修复据此把新生链认作待切除的一股。A 把两条链的身份写反，模板链恰恰是已甲基化的那一股；B 甲基化程度高的是模板链，切除它便失去正确模板；C 只看碱基大小无法判断新旧链，也与半甲基化的事实不符；E 两条链都切就没有恢复正确序列的模板。","type":"A1","group":"c4-01","kind":"mechanism","chs":[18,19,2],"vignette":"大肠埃希菌基因组约 4.6×10⁶ 个碱基对，按碱基配对规则复制一轮，最终留在子代 DNA 中的错误不足一个，碱基掺入的错误率低至十亿分之一。复制时 DNA 聚合酶Ⅲ把脱氧核苷酸加到新生链游离的 3′-OH 上，偶尔凑错的碱基会被聚合酶自身的 3′→5′ 外切酶活性切掉，再重新掺入正确的那一个，这一步使错误率下降约两个数量级。若错配核苷酸躲过校对，复制叉继续前进，子链上便留下一个错配。错配修复系统随后扫描新合成的链，识别尚未甲基化的那一股，切掉含错配的片段，再以母链为模板补齐缺口。若 MutS 等错配修复蛋白失活，突变率可升高上百倍。","vignette_title":"情景 1：一个错配碱基要过三道关卡","gidx":2,"gn":4,"anchor":"识别尚未甲基化的那一股"},{"id":"gc4-01-4","ch":19,"part":4,"tag":"机制","stem":"关于这条从错配到突变的链条，下列判断正确的是（X 型多选）","options":["校对由 DNA 聚合酶自身的 3′→5′ 外切酶活性完成","错配修复切除的是模板链，新生链的序列保持不变","碱基配对依靠氢键维持，A 与 T 之间形成两个氢键","复制中掺入的错误可由校对与错配修复两条通路纠正","错配修复蛋白失活时，细胞的突变率会显著升高"],"answer":[0,2,3,4],"explain":"答案 ACDE。C 对：A 与 T 之间两个氢键、G 与 C 之间三个，是碱基配对的化学基础。A 对：情景写明错配核苷酸被聚合酶自身的 3′→5′ 外切酶活性切掉。E 对：MutS 等错配修复蛋白失活后突变率升高上百倍，说明该通路的把关作用。D 对：先校对、残存错配再经错配修复，两条通路依次降低错误。B 错：被切除的是尚未甲基化的新生链，切模板链就无从补齐正确序列。","type":"X","group":"c4-01","kind":"mechanism","chs":[18,19,2],"vignette":"大肠埃希菌基因组约 4.6×10⁶ 个碱基对，按碱基配对规则复制一轮，最终留在子代 DNA 中的错误不足一个，碱基掺入的错误率低至十亿分之一。复制时 DNA 聚合酶Ⅲ把脱氧核苷酸加到新生链游离的 3′-OH 上，偶尔凑错的碱基会被聚合酶自身的 3′→5′ 外切酶活性切掉，再重新掺入正确的那一个，这一步使错误率下降约两个数量级。若错配核苷酸躲过校对，复制叉继续前进，子链上便留下一个错配。错配修复系统随后扫描新合成的链，识别尚未甲基化的那一股，切掉含错配的片段，再以母链为模板补齐缺口。若 MutS 等错配修复蛋白失活，突变率可升高上百倍。","vignette_title":"情景 1：一个错配碱基要过三道关卡","gidx":4,"gn":4,"anchor":"突变率可升高上百倍"},{"id":"gc7-01-1","ch":19,"part":4,"tag":"机制","stem":"8-氧代鸟嘌呤在复制时能固定为突变，直接原因是它","options":["与胞嘧啶配对，取代了原来的 A-T 配对","与腺嘌呤配对，取代了原来的 G-C 配对","与尿嘧啶配对，取代了原来的 A-T 配对","与胸腺嘧啶配对，取代了原来的 A-T 配对","与鸟嘌呤配对，取代了原来的 G-C 配对"],"answer":1,"explain":"B 对：情景已给出氧化鸟嘌呤改变了配对偏好，改与腺嘌呤配对，复制后原来的 G-C 对被换成 T-A，形成固定的替换突变。A、D 都把配对对象写成了正常伙伴，突变无从产生；D 若仍与鸟嘌呤配对，序列不变；E 尿嘧啶是胞嘧啶脱氨的产物，与氧化鸟嘌呤无关。","type":"A1","group":"c7-01","kind":"mechanism","chs":[2,19,26],"vignette":"细胞在有氧代谢中不断产生活性氧。鸟嘌呤被氧化后变成 8-氧代鸟嘌呤，这种碱基的构象发生变化，不再与胞嘧啶配对，而是与腺嘌呤配对；若它出现在模板链上，复制时对侧就会掺入腺嘌呤，G-C 碱基对被替换成 T-A，形成一种难以回复的替换突变。细胞对此有专门的清除机制：由糖苷酶识别并切除这个氧化碱基，形成无碱基位点，再由后续酶补上正确的鸟嘌呤。若这套机制失灵，突变就会在基因组中逐代累积。某位患者结肠肿瘤组织测序发现 APC 与 KRAS 基因同时带有点突变，肿瘤细胞体积小、增殖快，克隆形成率明显高于正常肠上皮，流式检测显示其 G1 期细胞比例下降、S 期比例升高。","vignette_title":"情景 1：从一次氧化损伤到一群失控的细胞","gidx":1,"gn":5,"anchor":"不再与胞嘧啶配对，而是与腺嘌呤配对"},{"id":"gc7-01-2","ch":19,"part":4,"tag":"机制","stem":"细胞清除这一氧化碱基所依赖的修复途径及核心酶是","options":["碱基切除修复，由 DNA 糖苷酶切除碱基形成 AP 位点","核苷酸切除修复，由 uvrABC 复合物切除含损伤片段","直接修复，由甲基转移酶把氧化基团直接转移走","同源重组修复，由姐妹染色单体提供正确序列模板","错配修复，由 MutS 识别错配后切除新合成链片段"],"answer":0,"explain":"A 对：情景点明由糖苷酶切除单个氧化碱基、留下无碱基位点，这是碱基切除修复的起点，适用于脱氨、氧化等小损伤。A 的核苷酸切除修复切除的是含损伤的寡核苷酸片段，主要对付使螺旋扭曲的嘧啶二聚体；B 的甲基转移酶处理的是 O6-甲基鸟嘌呤；C 的错配修复针对复制错配与滑移环；E 的同源重组修复处理双链断裂。","type":"A1","group":"c7-01","kind":"mechanism","chs":[2,19,26],"vignette":"细胞在有氧代谢中不断产生活性氧。鸟嘌呤被氧化后变成 8-氧代鸟嘌呤，这种碱基的构象发生变化，不再与胞嘧啶配对，而是与腺嘌呤配对；若它出现在模板链上，复制时对侧就会掺入腺嘌呤，G-C 碱基对被替换成 T-A，形成一种难以回复的替换突变。细胞对此有专门的清除机制：由糖苷酶识别并切除这个氧化碱基，形成无碱基位点，再由后续酶补上正确的鸟嘌呤。若这套机制失灵，突变就会在基因组中逐代累积。某位患者结肠肿瘤组织测序发现 APC 与 KRAS 基因同时带有点突变，肿瘤细胞体积小、增殖快，克隆形成率明显高于正常肠上皮，流式检测显示其 G1 期细胞比例下降、S 期比例升高。","vignette_title":"情景 1：从一次氧化损伤到一群失控的细胞","gidx":2,"gn":5,"anchor":"由糖苷酶识别并切除这个氧化碱基"},{"id":"gc7-01-3","ch":19,"part":4,"tag":"判读","stem":"若上述修复失灵，氧化损伤转化为固定突变的关键环节是","options":["损伤未修复时细胞退出周期走向凋亡而不突变","逆转录酶以损伤 RNA 为模板合成突变的 cDNA","复制叉在损伤处永久停滞，该细胞随即死亡","核酸外切酶从损伤处降解新链后由连接酶连接","跨损伤合成在损伤处掺入错误碱基使复制继续"],"answer":4,"explain":"E 对：损伤未被切除时，跨损伤合成由低保真聚合酶在损伤位点插入核苷酸使复制继续进行，以牺牲保真性换取存活，错误碱基因此被固定为突变。B 若细胞在损伤处死亡，突变便无从固定；C 描述的是切除修复中间步骤，并不能产生错误碱基；D 凋亡同样不会留下突变；E 逆转录酶不参与核内 DNA 损伤的复制旁路。","type":"A1","group":"c7-01","kind":"mechanism","chs":[2,19,26],"vignette":"细胞在有氧代谢中不断产生活性氧。鸟嘌呤被氧化后变成 8-氧代鸟嘌呤，这种碱基的构象发生变化，不再与胞嘧啶配对，而是与腺嘌呤配对；若它出现在模板链上，复制时对侧就会掺入腺嘌呤，G-C 碱基对被替换成 T-A，形成一种难以回复的替换突变。细胞对此有专门的清除机制：由糖苷酶识别并切除这个氧化碱基，形成无碱基位点，再由后续酶补上正确的鸟嘌呤。若这套机制失灵，突变就会在基因组中逐代累积。某位患者结肠肿瘤组织测序发现 APC 与 KRAS 基因同时带有点突变，肿瘤细胞体积小、增殖快，克隆形成率明显高于正常肠上皮，流式检测显示其 G1 期细胞比例下降、S 期比例升高。","vignette_title":"情景 1：从一次氧化损伤到一群失控的细胞","gidx":3,"gn":5,"anchor":"突变就会在基因组中逐代累积"},{"id":"gc7-02-1","ch":19,"part":4,"tag":"机制","stem":"MGMT 对 O6-甲基鸟嘌呤的修复方式属于","options":["核苷酸切除修复，切除含损伤的一段寡核苷酸片段","错配修复，由 MutS 识别后切除新合成的链片段","碱基切除修复，由糖苷酶切掉受损碱基形成 AP 位点","同源重组修复，以姐妹染色单体为模板重新合成片段","直接修复，把甲基不可逆地转移到自身残基上"],"answer":4,"explain":"E 对：MGMT 是甲基转移酶，把甲基共价转移到自身半胱氨酸上使碱基恢复，自身因此失活并被降解，正因如此修复能力是定量消耗的。B 碱基切除修复由糖苷酶切下碱基形成 AP 位点，不转移甲基；C 核苷酸切除修复切除的是含损伤的片段；B 错配修复针对复制错配与滑移环；E 同源重组修复处理双链断裂。","type":"A1","group":"c7-02","kind":"mechanism","chs":[19,2],"vignette":"化疗药替莫唑胺属烷化剂，它把甲基加到鸟嘌呤的 O6 位上，生成 O6-甲基鸟嘌呤；这个碱基不再与胞嘧啶配对，转而与胸腺嘧啶配对，复制一次就留下 G-C 到 A-T 的替换。细胞里专门有位修补者 MGMT：它不切除碱基，而是把甲基直接搬到自身的一个半胱氨酸残基上，自身随之失活被降解。问题在于这套直接修复是定量消耗的，每修好一个损伤就少一分活性；当 O6-甲基鸟嘌呤的数目超过 MGMT 分子数时，剩余损伤只能由错配修复系统反复无效识别，最终走向凋亡。与此不同，胞嘧啶自发脱氨生成的尿嘧啶仍与腺嘌呤配对，只是把原来的 G-C 换成了 G-U；这类小损伤由糖苷酶切掉碱基、留下无碱基位点后补齐。临床上 MGMT 启动子甲基化的胶质瘤对替莫唑胺敏感，而 MGMT 高表达的肿瘤则明显耐药。","vignette_title":"情景 2：为什么同是 DNA 损伤，走的却是不同的修复路","gidx":1,"gn":5,"anchor":"把甲基直接搬到自身的一个半胱氨酸残基上"},{"id":"gc7-02-3","ch":19,"part":4,"tag":"判读","stem":"脱氨生成的尿嘧啶采用碱基切除修复，其分子依据是","options":["损伤只改变碱基本身，不改变双螺旋的局部轮廓","该损伤使局部螺旋严重扭曲，需一次切除整段片段","该损伤只发生在转录链上，需由 RNA 聚合酶识别","该损伤把两条互补链交联起来，需重组才能解除","尿嘧啶与腺嘌呤配对后阻断了复制叉的前进"],"answer":0,"explain":"A 对：碱基切除修复的适用条件是损伤只涉及碱基本身、螺旋轮廓大体不变，糖苷酶能进入沟内把碱基翻转出来切除，切除范围小、代价低。B 描述的是嘧啶二聚体造成的体积性扭曲，对应核苷酸切除修复；C 尿嘧啶与腺嘌呤配对并不阻断复制叉；D 转录偶联修复的触发信号是 RNA 聚合酶 II 在损伤处停滞；E 链间交联的修复需核苷酸切除修复与同源重组协同。","type":"A1","group":"c7-02","kind":"mechanism","chs":[19,2],"vignette":"化疗药替莫唑胺属烷化剂，它把甲基加到鸟嘌呤的 O6 位上，生成 O6-甲基鸟嘌呤；这个碱基不再与胞嘧啶配对，转而与胸腺嘧啶配对，复制一次就留下 G-C 到 A-T 的替换。细胞里专门有位修补者 MGMT：它不切除碱基，而是把甲基直接搬到自身的一个半胱氨酸残基上，自身随之失活被降解。问题在于这套直接修复是定量消耗的，每修好一个损伤就少一分活性；当 O6-甲基鸟嘌呤的数目超过 MGMT 分子数时，剩余损伤只能由错配修复系统反复无效识别，最终走向凋亡。与此不同，胞嘧啶自发脱氨生成的尿嘧啶仍与腺嘌呤配对，只是把原来的 G-C 换成了 G-U；这类小损伤由糖苷酶切掉碱基、留下无碱基位点后补齐。临床上 MGMT 启动子甲基化的胶质瘤对替莫唑胺敏感，而 MGMT 高表达的肿瘤则明显耐药。","vignette_title":"情景 2：为什么同是 DNA 损伤，走的却是不同的修复路","gidx":3,"gn":5,"anchor":"这类小损伤由糖苷酶切掉碱基"},{"id":"gc7-02-4","ch":19,"part":4,"tag":"机制","stem":"若 O6-甲基鸟嘌呤未被修复，复制时最可能形成","options":["两条互补链被共价连接成链间交联","同一条链上相邻嘧啶形成环丁烷二聚体","复制叉被彻底阻断，细胞立即走向坏死","G-C 碱基对被替换为 A-T 碱基对","A-T 碱基对被替换为 G-C 碱基对"],"answer":3,"explain":"D 对：甲基化鸟嘌呤改与胸腺嘧啶配对，复制一轮后模板上的 G-C 被读成 T-A，形成替换突变，这也是烷化剂的致突变机制。B、C 方向与损伤性质均不符：胸腺嘧啶配对不会反向生成 A-T 到 G-C 的替换，烷基加合物也不造成链间交联；D 环丁烷型嘧啶二聚体由紫外线照射引起；E 该损伤可以由错配修复反复识别、也可以被跨损伤合成绕过，并非立即阻断复制叉。","type":"A1","group":"c7-02","kind":"mechanism","chs":[19,2],"vignette":"化疗药替莫唑胺属烷化剂，它把甲基加到鸟嘌呤的 O6 位上，生成 O6-甲基鸟嘌呤；这个碱基不再与胞嘧啶配对，转而与胸腺嘧啶配对，复制一次就留下 G-C 到 A-T 的替换。细胞里专门有位修补者 MGMT：它不切除碱基，而是把甲基直接搬到自身的一个半胱氨酸残基上，自身随之失活被降解。问题在于这套直接修复是定量消耗的，每修好一个损伤就少一分活性；当 O6-甲基鸟嘌呤的数目超过 MGMT 分子数时，剩余损伤只能由错配修复系统反复无效识别，最终走向凋亡。与此不同，胞嘧啶自发脱氨生成的尿嘧啶仍与腺嘌呤配对，只是把原来的 G-C 换成了 G-U；这类小损伤由糖苷酶切掉碱基、留下无碱基位点后补齐。临床上 MGMT 启动子甲基化的胶质瘤对替莫唑胺敏感，而 MGMT 高表达的肿瘤则明显耐药。","vignette_title":"情景 2：为什么同是 DNA 损伤，走的却是不同的修复路","gidx":4,"gn":5,"anchor":"不再与胞嘧啶配对，转而与胸腺嘧啶配对"},{"id":"gc7-02-5","ch":19,"part":4,"tag":"方案","stem":"关于损伤类型与修复途径的匹配，下列判断正确的是（X 型多选）","options":["核苷酸切除修复由 XPC 等识别并切除含损伤的寡核苷酸片段","烷基转移酶把甲基转移到自身残基，自身随之失活被降解","碱基切除修复由糖苷酶起始，适用于脱氨、氧化等小损伤","错配修复由 MutS 起始，负责切除嘧啶二聚体等体积性损伤","胞嘧啶脱氨生成的尿嘧啶由糖苷酶切除并经碱基切除修复补齐"],"answer":[0,1,2,4],"explain":"答案 ABCE。A 与 B 分别对应碱基切除修复的实例与适用面；A 对应核苷酸切除修复的起始识别与切除片段方式；B 对应直接修复的甲基转移机制，也解释了 MGMT 表达水平决定药敏。D 错：错配修复修复的是复制产生的碱基错配与滑移环，嘧啶二聚体这类使螺旋扭曲的体积性损伤走核苷酸切除修复。","type":"X","group":"c7-02","kind":"mechanism","chs":[19,2],"vignette":"化疗药替莫唑胺属烷化剂，它把甲基加到鸟嘌呤的 O6 位上，生成 O6-甲基鸟嘌呤；这个碱基不再与胞嘧啶配对，转而与胸腺嘧啶配对，复制一次就留下 G-C 到 A-T 的替换。细胞里专门有位修补者 MGMT：它不切除碱基，而是把甲基直接搬到自身的一个半胱氨酸残基上，自身随之失活被降解。问题在于这套直接修复是定量消耗的，每修好一个损伤就少一分活性；当 O6-甲基鸟嘌呤的数目超过 MGMT 分子数时，剩余损伤只能由错配修复系统反复无效识别，最终走向凋亡。与此不同，胞嘧啶自发脱氨生成的尿嘧啶仍与腺嘌呤配对，只是把原来的 G-C 换成了 G-U；这类小损伤由糖苷酶切掉碱基、留下无碱基位点后补齐。临床上 MGMT 启动子甲基化的胶质瘤对替莫唑胺敏感，而 MGMT 高表达的肿瘤则明显耐药。","vignette_title":"情景 2：为什么同是 DNA 损伤，走的却是不同的修复路","gidx":5,"gn":5,"anchor":"MGMT 启动子甲基化的胶质瘤对替莫唑胺敏感"},{"id":"gc7-03-4","ch":19,"part":4,"tag":"判读","stem":"本例中细胞最终出现染色体断裂与微核，说明","options":["细胞越过了检查点，带着未完成复制的 DNA 进入分裂","细胞进入 G0 期，长期停止分裂而不损伤染色体","细胞在阻滞期间完成修复，恢复后染色体正常分离","细胞被永久阻滞于 S 期，DNA 无法完成复制","细胞核膜提前破裂，染色体在 S 期内被机械拉断"],"answer":0,"explain":"A 对：染色体断裂与微核是带着未完成复制的 DNA 或未修复断裂强行进入 M 期的标志，说明检查点这道关卡已经失守。B 与情景中细胞持续增殖、出现微核不符；C 若修复完成则不会出现断裂；D G0 期细胞不分裂，也解释不了微核；E 核膜在 S 期并未破裂，核膜解体是 M 期前期的正常事件。","type":"A1","group":"c7-03","kind":"mechanism","chs":[18,19,26],"vignette":"培养细胞中加入羟基脲后，核糖核苷酸还原酶被抑制，四种 dNTP 的供应在 40 分钟内降到不足原来的 10%，S 期的复制叉被迫停在半路，暴露出的单链 DNA 被 RPA 包裹。这一信号由 ATR 感知，它磷酸化下游的 CHK1，经 Cdc25 磷酸酶受抑使 CDK1 的抑制性磷酸化无法去除，细胞因此不能启动有丝分裂。研究者同时观察到，处理 12 小时后细胞累积在 S 期，2N 与 4N 峰之间的 S 期细胞比例由 28% 升至 63%，而 G2/M 并没有出现相应的峰值。把 DNA 双链断裂诱导剂阿霉素加到细胞中，ATM 通路被激活，被磷酸化的组蛋白变体形成焦点，细胞阻滞于 G2/M。若检查点失效，细胞会带着未完成复制的 DNA 强行进入分裂，随后出现染色体断裂与微核。","vignette_title":"情景 3：当复制叉撞上未修好的损伤","gidx":4,"gn":5,"anchor":"2N 与 4N 峰之间的 S 期细胞比例"},{"id":"gc7-03-5","ch":19,"part":4,"tag":"机制","stem":"关于本组实验中两条损伤应答通路的分工，下列判断正确的是（X 型多选）","options":["复制压力由 ATR 感知，双链断裂由 ATM 感知并激活下游","检查点失效后进入分裂，会造成染色体断裂与微核形成","被磷酸化的组蛋白焦点数目与细胞存活率呈正相关","ATR 与 ATM 均通过抑制 Cdc25 使 CDK1 保持抑制状态","复制叉崩解产生的双链断裂主要经同源重组完成修复"],"answer":[0,1,3,4],"explain":"答案 ABDE。A 对应抑制剂来源与损伤类型的不同触发者；D 对应两条通路汇合于 Cdc25 与 CDK1 的抑制；E 对应复制叉崩解后断裂由同源重组处理；B 对应情景末句的观察。C 错：被磷酸化的组蛋白变体焦点标记的是 DNA 双链断裂位点，焦点越多提示断裂越多、损伤越重，与存活率应呈负相关。","type":"X","group":"c7-03","kind":"mechanism","chs":[18,19,26],"vignette":"培养细胞中加入羟基脲后，核糖核苷酸还原酶被抑制，四种 dNTP 的供应在 40 分钟内降到不足原来的 10%，S 期的复制叉被迫停在半路，暴露出的单链 DNA 被 RPA 包裹。这一信号由 ATR 感知，它磷酸化下游的 CHK1，经 Cdc25 磷酸酶受抑使 CDK1 的抑制性磷酸化无法去除，细胞因此不能启动有丝分裂。研究者同时观察到，处理 12 小时后细胞累积在 S 期，2N 与 4N 峰之间的 S 期细胞比例由 28% 升至 63%，而 G2/M 并没有出现相应的峰值。把 DNA 双链断裂诱导剂阿霉素加到细胞中，ATM 通路被激活，被磷酸化的组蛋白变体形成焦点，细胞阻滞于 G2/M。若检查点失效，细胞会带着未完成复制的 DNA 强行进入分裂，随后出现染色体断裂与微核。","vignette_title":"情景 3：当复制叉撞上未修好的损伤","gidx":5,"gn":5,"anchor":"若检查点失效，细胞会带着未完成复制的 DNA 强行进入分裂"},{"id":"gc7-04-1","ch":19,"part":4,"tag":"判读","stem":"患者细胞表现出紫外线高度敏感而电离辐射不敏感，最合理的缺陷定位是","options":["核苷酸切除修复缺陷，无法切除嘧啶二聚体","错配修复缺陷，复制错配无法被定向切除","碱基切除修复缺陷，无法切除氧化的碱基损伤","同源重组修复缺陷，无法修复双链断裂损伤","非同源末端连接缺陷，断端无法被重新连接"],"answer":0,"explain":"A 对：紫外线的主要损伤是嘧啶二聚体，属核苷酸切除修复的底物；该通路缺陷时紫外线敏感性升高，而电离辐射所致双链断裂与交联剂损伤走别的通路，故存活曲线与野生型重合。B 与 C 若缺陷，则电离辐射处理也应出现明显敏感性差异；D 碱基切除修复缺陷主要影响氧化、脱氨类小损伤；B 错配修复缺陷表现为微卫星不稳定与肿瘤易感，并不造成紫外线敏感。","type":"A1","group":"c7-04","kind":"experiment","chs":[19,26],"vignette":"实验室拿到两株成纤维细胞：野生型与一名光敏患者的细胞。用 254 nm 紫外线照射后做克隆形成实验，随剂量加大，患者细胞的存活曲线下降得远比野生型陡峭；把同一批细胞改用电离辐射或丝裂霉素 C 处理，两株细胞的存活曲线几乎重合。随后做 γH2AX 焦点计数与单细胞凝胶电泳：紫外线 10 J/m2 后 30 分钟，两组每核焦点都在 20 个左右，6 小时后野生型降至 3 个以下，而患者细胞几乎不恢复；电泳中未修复的 DNA 断裂会迁移形成尾矩，照射后即刻两组的尾矩都升高，4 小时后野生型尾矩明显缩短，患者细胞的尾矩仍维持在高位。流式细胞术显示紫外线照射 24 小时后，患者细胞大量累积在 G2/M，S 期比例反而低于野生型。","vignette_title":"情景 4：一张存活曲线背后的修复缺陷","gidx":1,"gn":5,"anchor":"用电离辐射或丝裂霉素 C 处理，两株细胞的存活曲线几乎重合"},{"id":"gc7-04-2","ch":19,"part":4,"tag":"判读","stem":"紫外线后患者细胞的焦点与尾矩长时间不回落，说明","options":["尾矩升高代表 DNA 被修复后片段变短更容易迁移","焦点的出现说明损伤已被修复，只是标记未褪去","损伤灶未被切除，断裂持续存在并不断累积","两组差异来自染色质凝集程度不同，与修复能力无关","患者细胞发生了凋亡，焦点数随之维持在较高水平"],"answer":2,"explain":"C 对：γH2AX 焦点标记断端或修复中间产物，单细胞凝胶电泳的尾矩反映未修复的断裂量；两者在患者细胞中持续存在，说明损伤识别或切除环节受阻，损伤灶长期残留。B 焦点的持续存在恰恰提示修复未完成；C 断裂被修复后片段应变长、尾矩下降，方向写反；D 凋亡不会是焦点维持的原因，且解释不了尾矩不降；E 两组同样处理，染色质状态不构成系统性差异。","type":"A1","group":"c7-04","kind":"experiment","chs":[19,26],"vignette":"实验室拿到两株成纤维细胞：野生型与一名光敏患者的细胞。用 254 nm 紫外线照射后做克隆形成实验，随剂量加大，患者细胞的存活曲线下降得远比野生型陡峭；把同一批细胞改用电离辐射或丝裂霉素 C 处理，两株细胞的存活曲线几乎重合。随后做 γH2AX 焦点计数与单细胞凝胶电泳：紫外线 10 J/m2 后 30 分钟，两组每核焦点都在 20 个左右，6 小时后野生型降至 3 个以下，而患者细胞几乎不恢复；电泳中未修复的 DNA 断裂会迁移形成尾矩，照射后即刻两组的尾矩都升高，4 小时后野生型尾矩明显缩短，患者细胞的尾矩仍维持在高位。流式细胞术显示紫外线照射 24 小时后，患者细胞大量累积在 G2/M，S 期比例反而低于野生型。","vignette_title":"情景 4：一张存活曲线背后的修复缺陷","gidx":2,"gn":5,"anchor":"而患者细胞几乎不恢复"},{"id":"gc7-04-3","ch":19,"part":4,"tag":"方案","stem":"若要进一步区分全基因组修复与转录偶联修复缺陷，最合理的做法是","options":["检测细胞周期各时相比例是否出现变化","提高紫外线剂量后重新测定细胞的存活曲线","分别检测转录链与非转录链上损伤的清除速率","改用交联剂处理细胞后重新计数 γH2AX 焦点","直接测序 XPA 基因的全部外显子寻找突变"],"answer":2,"explain":"C 对：全基因组修复由 XPC 等识别损伤、对两条链无明显偏好；转录偶联修复由停滞的 RNA 聚合酶 II 触发，优先清除转录链上的损伤，因此分链比较清除速率正是区分两条分支的实验判据。B 只是改变剂量，仍在同一通路上；C 交联剂所诱导的损伤与本节缺陷通路无关；D 周期分布只能提示损伤应答，不能定位分支；E 直接测序只查一个基因，无法判断哪条分支真正失活。","type":"A1","group":"c7-04","kind":"experiment","chs":[19,26],"vignette":"实验室拿到两株成纤维细胞：野生型与一名光敏患者的细胞。用 254 nm 紫外线照射后做克隆形成实验，随剂量加大，患者细胞的存活曲线下降得远比野生型陡峭；把同一批细胞改用电离辐射或丝裂霉素 C 处理，两株细胞的存活曲线几乎重合。随后做 γH2AX 焦点计数与单细胞凝胶电泳：紫外线 10 J/m2 后 30 分钟，两组每核焦点都在 20 个左右，6 小时后野生型降至 3 个以下，而患者细胞几乎不恢复；电泳中未修复的 DNA 断裂会迁移形成尾矩，照射后即刻两组的尾矩都升高，4 小时后野生型尾矩明显缩短，患者细胞的尾矩仍维持在高位。流式细胞术显示紫外线照射 24 小时后，患者细胞大量累积在 G2/M，S 期比例反而低于野生型。","vignette_title":"情景 4：一张存活曲线背后的修复缺陷","gidx":3,"gn":5,"anchor":"患者细胞大量累积在 G2/M"},{"id":"gc7-04-5","ch":19,"part":4,"tag":"方案","stem":"关于本组实验设计与结果解读，下列判断正确的是（X 型多选）","options":["焦点与尾矩反映残留损伤，二者变化趋势可以相互印证","转录偶联修复缺陷可用转录链损伤清除速率低来判定","断裂修复定量应统一在照射后同样时间点测定取平均值","双链断裂的修复速度与集落形成率通常呈负相关关系","克隆形成实验比较的是经不同处理后仍能增殖的细胞比例"],"answer":[0,1,2,4],"explain":"答案 ABCE。E 对应存活曲线的基本含义；C 对应修复动力学比较必须固定时间点，否则时间因素与修复能力混淆；B 对应转录偶联修复优先清除转录链损伤这一特征；A 对应两类独立指标在本例中同向变化、互相支持。D 错：修复越快，残留断裂越少、细胞存活越好，两者应呈正相关而非负相关。","type":"X","group":"c7-04","kind":"experiment","chs":[19,26],"vignette":"实验室拿到两株成纤维细胞：野生型与一名光敏患者的细胞。用 254 nm 紫外线照射后做克隆形成实验，随剂量加大，患者细胞的存活曲线下降得远比野生型陡峭；把同一批细胞改用电离辐射或丝裂霉素 C 处理，两株细胞的存活曲线几乎重合。随后做 γH2AX 焦点计数与单细胞凝胶电泳：紫外线 10 J/m2 后 30 分钟，两组每核焦点都在 20 个左右，6 小时后野生型降至 3 个以下，而患者细胞几乎不恢复；电泳中未修复的 DNA 断裂会迁移形成尾矩，照射后即刻两组的尾矩都升高，4 小时后野生型尾矩明显缩短，患者细胞的尾矩仍维持在高位。流式细胞术显示紫外线照射 24 小时后，患者细胞大量累积在 G2/M，S 期比例反而低于野生型。","vignette_title":"情景 4：一张存活曲线背后的修复缺陷","gidx":5,"gn":5,"anchor":"每核焦点都在 20 个左右"},{"ch":19,"part":4,"tag":"嘧啶二聚体","stem":"紫外线照射使DNA相邻嘧啶形成环丁烷型嘧啶二聚体。大肠埃希菌修复该类损伤的方式包括","options":["只能通过错配修复系统识别并切除二聚体","只能通过碱基切除修复由DNA糖苷酶切除二聚体","通过同源重组以姐妹染色单体为模板直接去除二聚体","光复活酶（DNA光解酶）直接逆转二聚体，以及由uvrABC进行的核苷酸切除修复","通过跨损伤合成将二聚体碱基直接还原为正常碱基"],"answer":3,"explain":"大肠埃希菌可用光复活酶直接修复（光复活）切开嘧啶二聚体，或以uvrABC复合物切除含损伤的寡核苷酸片段（NER）；糖苷酶只切单个碱基。","type":"A1","id":"c19-0632ee84"},{"ch":19,"part":4,"tag":"碱基切除修复","stem":"关于碱基切除修复（BER）与核苷酸切除修复（NER）的比较，下列叙述正确的是","options":["BER由DNA糖苷酶切除受损碱基形成AP位点，主要修复紫外嘧啶二聚体等体积性损伤","NER由DNA糖苷酶识别并切除单个受损碱基","BER切除含损伤的约25至30个核苷酸的片段","NER只能修复复制过程中产生的碱基错配","BER由DNA糖苷酶切除受损碱基形成AP位点，修复脱氨、氧化等小损伤；NER切除含损伤的寡核苷酸片段，修复嘧啶二聚体等体积性损伤"],"answer":4,"explain":"BER由糖苷酶切除单个受损碱基形成AP位点，适用于脱氨、氧化等小损伤；NER切除约25到30个核苷酸的损伤片段，用于嘧啶二聚体等体积性损伤。","type":"A1","id":"c19-ce10768f"},{"ch":19,"part":4,"tag":"错配修复","stem":"碱基错配修复（MMR）能够修复的DNA损伤类型是","options":["复制过程中产生的碱基错配以及滑移错配形成的短插入与缺失环","紫外线照射产生的环丁烷型嘧啶二聚体","电离辐射产生的DNA双链断裂","烷化剂造成的O6-甲基鸟嘌呤","顺铂等交联剂造成的链间交联"],"answer":0,"explain":"MMR主要修复复制错配和滑移产生的短插入与缺失环；嘧啶二聚体靠NER，双链断裂靠HR与NHEJ，O6-甲基鸟嘌呤由MGMT直接修复。","type":"A1","id":"c19-c59b3e5a"},{"ch":19,"part":4,"tag":"跨损伤合成","stem":"关于跨损伤合成（TLS），下列叙述正确的是","options":["TLS由高保真的复制型DNA聚合酶催化，可无差错地修复损伤","TLS在损伤处停止复制叉前进，待损伤完全修复后再继续复制","TLS由Y家族等低保真DNA聚合酶催化，允许复制在损伤处继续，易引入突变","TLS只发生在G1期，且必须先完成同源重组","TLS可直接切除嘧啶二聚体，属于直接修复的一种"],"answer":2,"explain":"TLS在损伤未修复时由低保真聚合酶（如Pol eta）在损伤位点插入核苷酸使复制继续，以牺牲保真性换取细胞存活，易致突变。","type":"A1","id":"c19-60aa1bde"},{"ch":19,"part":4,"tag":"修复缺陷病","stem":"着色性干皮病（XP）患者对紫外线极度敏感、皮肤癌高发，其分子基础是","options":["错配修复基因（如MSH2、MLH1）缺陷","核苷酸切除修复基因（如XPA、XPC等）缺陷，不能有效切除嘧啶二聚体","同源重组修复基因（如BRCA1）缺陷","O6-甲基鸟嘌呤-DNA甲基转移酶活性过高","端粒酶基因突变导致端粒过度延长"],"answer":1,"explain":"XP由NER通路基因（XPA至XPG等）突变所致，紫外线嘧啶二聚体无法切除；错配修复缺陷则表现为微卫星不稳定与林奇综合征。","type":"A1","id":"c19-36f6120a"},{"ch":19,"part":4,"tag":"双链断裂修复","stem":"关于DNA双链断裂（DSB）的修复，下列叙述正确的是","options":["同源重组修复以受损DNA自身的另一条链为模板，不发生链交换","非同源末端连接（NHEJ）保真性最高，不产生任何序列改变","同源重组修复主要发生在G1期，NHEJ主要发生在S与G2期","同源重组修复以姐妹染色单体为模板，保真性高；NHEJ直接连接断端，易造成缺失或易位","DSB只能通过跨损伤合成修复"],"answer":3,"explain":"HR以姐妹染色单体为模板，主要在S与G2期进行、保真性高；NHEJ直接把断端连接，贯穿细胞周期但易产生缺失、插入或易位。","type":"A1","id":"c19-a16baf29"},{"ch":19,"part":4,"tag":"损伤与修复","stem":"下列DNA损伤与其主要修复方式的对应，正确的是","options":["紫外线嘧啶二聚体主要经碱基切除修复","O6-甲基鸟嘌呤主要经核苷酸切除修复","胞嘧啶自发脱氨生成的尿嘧啶由尿嘧啶DNA糖苷酶切除，经碱基切除修复完成","DNA双链断裂主要经光复活直接修复","复制产生的碱基错配主要经同源重组修复"],"answer":2,"explain":"胞嘧啶脱氨生成尿嘧啶，由尿嘧啶DNA糖苷酶切除并经碱基切除修复；嘧啶二聚体靠核苷酸切除修复，O6-甲基鸟嘌呤由MGMT直接修复，双链断裂靠HR与NHEJ。","type":"A1","id":"c19-9f9a1716"},{"ch":19,"part":4,"tag":"损伤应答","stem":"细胞发生DNA双链断裂时，DNA损伤应答导致细胞周期阻滞的主要途径是","options":["ATM等激酶被激活，磷酸化并稳定p53，诱导p21表达，抑制CDK使细胞阻滞于G1与S交界","ATM激酶被抑制，p53迅速降解，细胞加速进入S期","直接由DNA连接酶IV识别断裂并终止细胞周期","由端粒酶感知断裂并延长端粒以阻滞细胞周期","由错配修复蛋白MutS直接阻滞M期纺锤体组装"],"answer":0,"explain":"双链断裂由ATM（复制压力由ATR）感知，激活CHK并磷酸化p53，p53上调p21抑制CDK，使细胞阻滞于G1与S交界以便修复或走向凋亡。","type":"A1","id":"c19-7a654dfc"},{"ch":19,"part":4,"tag":"自发损伤","stem":"关于DNA的自发性（内源性）损伤，下列叙述正确的是","options":["嘌呤碱基与脱氧核糖之间的糖苷键可自发水解形成无碱基（AP）位点，胞嘧啶自发脱氨生成尿嘧啶，二者均属常见的自发性损伤","DNA损伤只由外界理化因素引起，细胞内代谢不产生损伤","胞嘧啶脱氨后仍为正常配对碱基，不引起突变","脱嘌呤只发生在细胞死亡之后，与活细胞无关","自发性损伤发生率极低，每个细胞每天不超过1个"],"answer":0,"explain":"脱嘌呤形成AP位点、胞嘧啶脱氨生成尿嘧啶是最常见的内源性损伤，可导致突变，由碱基切除修复等途径清除。","type":"A1","id":"c19-6da350e0"},{"ch":19,"part":4,"tag":"损伤诱因","stem":"关于电离辐射与活性氧所致DNA损伤，下列叙述正确的是","options":["电离辐射只能引起碱基替换，不引起链断裂","活性氧主要水解磷酸二酯键，使碱基脱落","电离辐射既可直接打断脱氧核糖-磷酸骨架造成双链断裂，也可通过辐解水产生的自由基间接损伤DNA；活性氧可氧化碱基生成8-氧代鸟嘌呤","8-氧代鸟嘌呤仍与胞嘧啶正常配对，不引起突变","辐射所致的DNA损伤不能被细胞修复，必然导致细胞死亡"],"answer":2,"explain":"电离辐射可直接断裂骨架或经自由基间接损伤DNA，活性氧氧化碱基生成8-氧代鸟嘌呤，后者与腺嘌呤错配引起G:C至T:A突变。","type":"A1","id":"c19-fe7e1452"},{"ch":19,"part":4,"tag":"交联修复","stem":"关于DNA链间交联及其修复与相关疾病，下列叙述正确的是","options":["链间交联只阻断转录，不影响DNA复制","链间交联共价连接两条互补链，阻断复制与转录，其修复需核苷酸切除修复与同源重组协同；范可尼贫血由交联修复通路基因缺陷引起，患者对丝裂霉素C等交联剂高度敏感","链间交联可由光复活酶直接逆转","范可尼贫血由错配修复基因突变引起","交联剂顺铂通过与碱基形成氢键而发挥抗肿瘤作用"],"answer":1,"explain":"链间交联共价连接两条链，需核苷酸切除修复与同源重组协同清除；交联修复通路缺陷者表现为范可尼贫血并易患肿瘤。","type":"A1","id":"c19-770a80cf"},{"ch":19,"part":4,"tag":"转录偶联修复","stem":"关于转录偶联核苷酸切除修复（TC-NER）及科凯恩综合征，下列叙述正确的是","options":["TC-NER只修复非转录链上的损伤","TC-NER的起始不依赖RNA聚合酶II","科凯恩综合征由XPA基因突变引起，患者皮肤癌高发","RNA聚合酶II在损伤处停滞是TC-NER的起始信号，由CSA、CSB等因子招募NER蛋白优先修复转录链；CSA或CSB缺陷导致科凯恩综合征，表现为光敏、发育迟缓与神经退行，而皮肤癌并不高发","TC-NER与全基因组NER由完全相同的起始识别因子启动"],"answer":3,"explain":"转录链损伤由停滞的RNA聚合酶II触发TC-NER，CSA、CSB缺陷导致科凯恩综合征；全基因组NER由XPC识别损伤，缺陷则表现为着色性干皮病。","type":"A1","id":"c19-3a4f4b34"},{"ch":19,"part":4,"tag":"MMR链识别","stem":"关于错配修复中模板链与新链的区分机制，下列叙述正确的是","options":["大肠埃希菌MutS直接切除含错配的新链片段","大肠埃希菌以错配碱基本身的甲基化状态区分两条链","真核细胞借助MutH切开错配位点以区分新链","错配修复切除的是模板链，再以新链为模板重合成","大肠埃希菌MutS识别错配、MutL辅助，MutH在错配附近半甲基化的GATC位点切开未甲基化的新链；真核细胞无MutH，主要依靠新链上的缺口等信号区分"],"answer":4,"explain":"GATC位点的半甲基化状态标记新链、MutH据此切开新链，是定向切除的关键；真核细胞改用新链缺口等信号，避免误切模板链。","type":"A1","id":"c19-4e5d2231"},{"ch":19,"part":4,"tag":"合成致死","stem":"关于BRCA缺陷肿瘤对PARP抑制剂敏感（合成致死）的原理，下列叙述正确的是","options":["BRCA1/2缺陷使同源重组修复障碍，PARP抑制剂阻断单链断裂的修复，复制叉崩解产生双链断裂，肿瘤细胞因无法修复而死亡，正常细胞同源重组完好仍可存活","PARP抑制剂直接抑制同源重组的关键酶，故对全部肿瘤细胞均有效","BRCA缺陷细胞因核苷酸切除修复缺陷而对PARP抑制剂敏感","PARP抑制剂通过抑制微管聚合使肿瘤细胞阻滞于M期","合成致死指两种药物合用产生叠加毒性，与修复通路状态无关"],"answer":0,"explain":"PARP参与单链断裂修复，BRCA缺陷细胞同源重组障碍，两种修复同时失能造成双链断裂累积而致死，体现合成致死策略。","type":"A1","id":"c19-6c1d4cb6"},{"ch":19,"part":4,"tag":"SOS反应","stem":"关于大肠埃希菌的SOS反应，下列叙述正确的是","options":["SOS反应由LexA蛋白直接感知DNA损伤并激活修复基因","SOS反应属于高保真修复途径，不增加突变率","DNA损伤产生的单链DNA与RecA结合并激活RecA，促使其促使LexA阻遏蛋白自切，SOS基因去阻遏表达，其中umuC、umuD编码的易错聚合酶使突变率升高","SOS反应只修复双链断裂，不涉及跨损伤合成","SOS反应在真核细胞中同样由RecA与LexA介导"],"answer":2,"explain":"RecA结合单链DNA后被激活，促使LexA自切解除阻遏，SOS基因（含umuC、umuD）表达，进行易错修复而使突变率升高。","type":"A1","id":"c19-ae53c9c3"},{"ch":19,"part":4,"tag":"基因组不稳定综合征","stem":"关于DNA修复相关基因缺陷所致的基因组不稳定综合征，下列叙述正确的是","options":["Bloom综合征由核苷酸切除修复缺陷引起，患者对紫外线极度敏感","基因组不稳定综合征患者的染色体畸变发生率与正常人相同","Werner综合征由端粒酶基因突变引起，表现为端粒过度延长","基因组不稳定综合征均为常染色体显性遗传，且不增加肿瘤风险","Bloom综合征由BLM基因缺陷引起，BLM是RecQ家族解旋酶，患者细胞染色体断裂与姐妹染色单体交换显著增多，肿瘤易感"],"answer":4,"explain":"BLM编码RecQ家族解旋酶，缺陷使姐妹染色单体交换与染色体断裂增多，属基因组不稳定综合征，患者肿瘤易感。","type":"A1","id":"c19-3d69bfa6"},{"id":"gc15-04-1","ch":20,"part":4,"tag":"判读","stem":"对比-150与-45两个截短体的结果，可以得出的结论是","options":["决定起始活性的核心元件位于-150与-45之间","该基因没有启动子，-45的活性来自质粒背景序列","增强子位于-45以内，截短后增强作用随之消失","转录起始位点位于-45上游，截短把起始位点切掉","-1500截短体活性最高，说明远端存在强增强子"],"answer":0,"explain":"A 对：-1500、-600、-150三者的活性相近，说明这一段里没有关键元件；一旦截到-45活性骤降，说明决定转录起始的核心元件落在-150与-45之间，随截短被去掉。B 错：-45仍有本底1.2倍的活性，说明质粒本身不含强启动子，而该基因确有启动子，只是核心元件被切掉了。C 错：增强子通常远离核心启动子，本例活性下降来自核心启动子元件缺失。D 错：-45仍位于转录起始位点上游，截短不会把起始位点本身切掉。E 错：三者活性相近恰恰说明远端没有起作用的强增强子。","type":"A1","group":"c15-04","kind":"experiment","chs":[20,22],"vignette":"研究生小许把某基因转录起始位点上游1.5kb的片段接到不含启动子的荧光素酶基因前，转染HeLa细胞后测荧光素酶活性。以转录起始位点为+1，做4个5′端系列截短：-1500、-600、-150三者活性相近，而-45的活性降到本底的1.2倍。用抗RNA聚合酶II的抗体做染色质免疫沉淀，-150至+50区段的富集是对照抗体的30倍；换用抗TATA结合蛋白的抗体，同一区段富集18倍。体外足迹实验中，HeLa细胞核提取物保护了-30至-24的一段富含A-T的序列。向培养液加入低浓度α-鹅膏蕈碱后，荧光素酶活性下降90%；加入利福平则活性不变。","vignette_title":"情景 4：把启动子一段一段剪短之后","gidx":1,"gn":5,"anchor":"-45的活性降到本底的1.2倍"},{"id":"gc15-04-2","ch":20,"part":4,"tag":"机制","stem":"足迹实验中被保护的那段富含A-T的序列，其功能是","options":["作为增强子与特异的反式因子结合，提高起始频率","是TATA盒，由TFIID中的TATA结合蛋白识别","作为终止子，转录出反向重复序列使聚合酶停顿","作为沉默子，招募去乙酰化酶使染色质变得紧密","作为转录起点，新生RNA沿模板链的5′→3′方向延长"],"answer":1,"explain":"B 对：位于-30至-24的富含A-T序列是TATA盒，真核RNA聚合酶II不能直接识别它，须先由TFIID中的TATA结合蛋白结合，再依次组装通用转录因子与聚合酶，其位置决定转录的起始位点，被核提取物保护正说明有蛋白结合在此。A 错：增强子位置与方向不固定，也不决定起始位点。C 错：终止子在转录区下游，靠发夹结构与polyU序列使聚合酶停顿。D 错：沉默子抑制转录，与足迹实验中被保护的核心启动子元件不符。E 错：转录起点位于该序列的下游，且聚合酶沿模板链的3′→5′方向移动，新生RNA才按5′→3′延长。","type":"A1","group":"c15-04","kind":"experiment","chs":[20,22],"vignette":"研究生小许把某基因转录起始位点上游1.5kb的片段接到不含启动子的荧光素酶基因前，转染HeLa细胞后测荧光素酶活性。以转录起始位点为+1，做4个5′端系列截短：-1500、-600、-150三者活性相近，而-45的活性降到本底的1.2倍。用抗RNA聚合酶II的抗体做染色质免疫沉淀，-150至+50区段的富集是对照抗体的30倍；换用抗TATA结合蛋白的抗体，同一区段富集18倍。体外足迹实验中，HeLa细胞核提取物保护了-30至-24的一段富含A-T的序列。向培养液加入低浓度α-鹅膏蕈碱后，荧光素酶活性下降90%；加入利福平则活性不变。","vignette_title":"情景 4：把启动子一段一段剪短之后","gidx":2,"gn":5,"anchor":"-30至-24的一段富含A-T的序列"},{"id":"gc15-04-3","ch":20,"part":4,"tag":"判读","stem":"低浓度α-鹅膏蕈碱使荧光素酶活性下降90%、利福平则活性不变，说明","options":["该基因由RNA聚合酶I转录，对利福平天然不敏感","两种药物作用于翻译阶段，与转录起始无关","利福平抑制真核聚合酶，但被培养基的血清中和","该基因由RNA聚合酶II转录，利福平只作用于细菌","α-鹅膏蕈碱使聚合酶沿模板链的5′→3′方向停滞"],"answer":3,"explain":"D 对：低浓度α-鹅膏蕈碱特异抑制真核RNA聚合酶II，转录被抑制后荧光素酶基因的mRNA减少，酶活性随之下降；利福平结合细菌RNA聚合酶的β亚基，对真核细胞没有作用，所以活性不变。A 错：RNA聚合酶I负责转录rRNA前体，而且低浓度α-鹅膏蕈碱对它并不敏感。B 错：α-鹅膏蕈碱作用于转录环节，报告基因活性下降反映的是转录水平降低。C 错：利福平的靶点是细菌聚合酶，其无效并非血清中和所致。E 错：RNA聚合酶沿模板链的3′→5′方向移动，5′→3′是新生RNA链的延长方向。","type":"A1","group":"c15-04","kind":"experiment","chs":[20,22],"vignette":"研究生小许把某基因转录起始位点上游1.5kb的片段接到不含启动子的荧光素酶基因前，转染HeLa细胞后测荧光素酶活性。以转录起始位点为+1，做4个5′端系列截短：-1500、-600、-150三者活性相近，而-45的活性降到本底的1.2倍。用抗RNA聚合酶II的抗体做染色质免疫沉淀，-150至+50区段的富集是对照抗体的30倍；换用抗TATA结合蛋白的抗体，同一区段富集18倍。体外足迹实验中，HeLa细胞核提取物保护了-30至-24的一段富含A-T的序列。向培养液加入低浓度α-鹅膏蕈碱后，荧光素酶活性下降90%；加入利福平则活性不变。","vignette_title":"情景 4：把启动子一段一段剪短之后","gidx":3,"gn":5,"anchor":"加入利福平则活性不变"},{"id":"gc15-04-5","ch":20,"part":4,"tag":"方案","stem":"关于上述报告基因、足迹与免疫沉淀实验，下列判断正确的是（X 型多选）","options":["报告基因的活性反映所接片段对转录起始的调控能力","5′端系列截短是确定启动子区段的常用策略","染色质免疫沉淀检测的是蛋白质在基因组上的结合位置","足迹实验在细胞内进行，可直接反映活细胞中的蛋白结合","低浓度α-鹅膏蕈碱同样抑制RNA聚合酶I的转录"],"answer":[0,1,2],"explain":"答案 ABC。A 对：报告基因的编码区本身没有启动子，活性高低由接在它前面的片段决定，因此酶活性可以反映该片段对转录起始的调控能力。B 对：从远端向近端做5′端系列截短，观察活性在何处骤降，是定位核心启动子区段的常用策略，本例活性在-150与-45之间跌落。C 对：染色质免疫沉淀用抗体把与DNA结合的蛋白质拉下来，再检测共沉淀的DNA序列，反映的是蛋白质在基因组上的结合位置。D 错：足迹实验用的是细胞核提取物与标记探针，属体外结合实验，不能直接反映活细胞内的结合状态。E 错：低浓度α-鹅膏蕈碱特异抑制RNA聚合酶II，对RNA聚合酶I的转录影响很小。","type":"X","group":"c15-04","kind":"experiment","chs":[20,22],"vignette":"研究生小许把某基因转录起始位点上游1.5kb的片段接到不含启动子的荧光素酶基因前，转染HeLa细胞后测荧光素酶活性。以转录起始位点为+1，做4个5′端系列截短：-1500、-600、-150三者活性相近，而-45的活性降到本底的1.2倍。用抗RNA聚合酶II的抗体做染色质免疫沉淀，-150至+50区段的富集是对照抗体的30倍；换用抗TATA结合蛋白的抗体，同一区段富集18倍。体外足迹实验中，HeLa细胞核提取物保护了-30至-24的一段富含A-T的序列。向培养液加入低浓度α-鹅膏蕈碱后，荧光素酶活性下降90%；加入利福平则活性不变。","vignette_title":"情景 4：把启动子一段一段剪短之后","gidx":5,"gn":5,"anchor":"接到不含启动子的荧光素酶基因前"},{"id":"gc17-03-1","ch":20,"part":4,"tag":"机制","stem":"情景中 45S rRNA 前体与 5S rRNA 的合成部位不同，其直接原因是","options":["45S rRNA 前体由 RNA 聚合酶 I 转录，5S rRNA 由 RNA 聚合酶 III 转录","45S rRNA 前体由 RNA 聚合酶 II 转录，5S rRNA 由 RNA 聚合酶 I 转录","45S rRNA 前体由 RNA 聚合酶 III 转录，5S rRNA 由 RNA 聚合酶 II 转录","45S rRNA 前体由 RNA 聚合酶 I 转录，5S rRNA 也由 RNA 聚合酶 I 转录","45S rRNA 前体由 RNA 聚合酶 III 转录，5S rRNA 也由 RNA 聚合酶 III 转录"],"answer":0,"explain":"A 对：45S rRNA 前体由 RNA 聚合酶 I 在核仁内转录，5S rRNA 由 RNA 聚合酶 III 在核仁外转录后再运入核仁，两者分工不同，部位自然不同。B 与 C 把两种聚合酶的产物错配或对调；D 与 E 认为两种 rRNA 由同一种聚合酶转录，无法解释情景中一个在核仁内、一个在核仁外的差别。","type":"A1","group":"c17-03","kind":"mechanism","chs":[10,20],"vignette":"核仁没有膜包裹，它的形成与 rDNA 的转录活动密切相关。人的 rDNA 成串分布在第 13、14、15、21、22 号染色体的短臂次级缢痕处，即核仁组织区。核仁内转录出 45S rRNA 前体，它在核仁内被加工成 18S、5.8S 与 28S rRNA；5S rRNA 则由另一种 RNA 聚合酶在核仁外转录后运入核仁。用短脉冲标记尿苷做自显影：标记最早出现在纤维中心与致密纤维组分，30 分钟后大量出现在颗粒组分。已在细胞质中合成的核糖体蛋白经核孔进入核仁，与 rRNA 一起组装成核糖体亚基前体，再经核孔输出到细胞质中进一步成熟。该细胞中紧贴核膜内缘与核仁周边的染色质染色致密、复制较晚，转录不活跃。","vignette_title":"情景 3：脉冲标记落在核仁的哪一层","gidx":1,"gn":5,"anchor":"由另一种 RNA 聚合酶在核仁外转录"},{"id":"gc17-03-5","ch":20,"part":4,"tag":"判读","stem":"关于核仁与核糖体的生成，下列判断正确的是（X 型多选）","options":["核仁没有膜包裹，其形成与 rDNA 的转录活动有关","45S rRNA 前体在细胞质中加工为 18S 与 28S rRNA","人类 rDNA 成串分布于 5 对近端着丝粒染色体短臂","分裂期 rRNA 合成停止、核仁消失，末期在核仁组织区重建","核糖体蛋白在核仁内合成后与 rRNA 组装成核糖体亚基"],"answer":[0,2,3],"explain":"答案 ACD。A 与情景中核仁无膜、依赖 rDNA 转录活动一致；C 与情景中 rDNA 位于第 13、14、15、21、22 号染色体短臂次级缢痕、即 5 对近端着丝粒染色体核仁组织区的描写一致；D 是核仁周期的表现，分裂期核仁解体、末期在 rDNA 所在的核仁组织区重新形成。B 错在 45S rRNA 前体的加工发生在核仁内而不是细胞质；E 错在核糖体蛋白由细胞质中的核糖体合成后运入核仁。","type":"X","group":"c17-03","kind":"mechanism","chs":[10,20],"vignette":"核仁没有膜包裹，它的形成与 rDNA 的转录活动密切相关。人的 rDNA 成串分布在第 13、14、15、21、22 号染色体的短臂次级缢痕处，即核仁组织区。核仁内转录出 45S rRNA 前体，它在核仁内被加工成 18S、5.8S 与 28S rRNA；5S rRNA 则由另一种 RNA 聚合酶在核仁外转录后运入核仁。用短脉冲标记尿苷做自显影：标记最早出现在纤维中心与致密纤维组分，30 分钟后大量出现在颗粒组分。已在细胞质中合成的核糖体蛋白经核孔进入核仁，与 rRNA 一起组装成核糖体亚基前体，再经核孔输出到细胞质中进一步成熟。该细胞中紧贴核膜内缘与核仁周边的染色质染色致密、复制较晚，转录不活跃。","vignette_title":"情景 3：脉冲标记落在核仁的哪一层","gidx":5,"gn":5,"anchor":"它的形成与 rDNA 的转录活动密切相关"},{"id":"gc21-01-4","ch":20,"part":4,"tag":"判读","stem":"该体系中的tRNA由前体加工而来，成熟过程必需的一步是","options":["剪接体切除内含子，5′端加m7G帽，3′端加上多聚腺苷酸尾","RNase P切除5′端前导序列，3′端由核苷酸转移酶加上CCA","RNA聚合酶Ⅲ切除5′端前导序列，并在3′端补上CCA三核苷酸","RNase P切除3′端尾随序列，5′端由核苷酸转移酶加上CCA","氨酰-tRNA合成酶切除前导序列，并把氨基酸接到3′端CCA上"],"answer":1,"explain":"B 对：tRNA前体由RNase P切除5′端前导序列，3′端再由核苷酸转移酶补上CCA，这是成熟必需的一步。A 错：加帽、加尾与剪接体剪接属于mRNA前体的加工方式，tRNA并不加m7G帽与多聚腺苷酸尾。C 错：RNA聚合酶Ⅲ只负责转录，切除前导序列由RNase P完成。D 错：RNase P切的是5′端前导序列，CCA加在3′端，方向恰好写反。E 错：氨酰-tRNA合成酶负责装载氨基酸，不参与前体加工。","type":"A1","group":"c21-01","kind":"mechanism","chs":[2,21,20],"vignette":"体外翻译体系里有一类经典的「换头」实验。研究者先用¹⁴C标记半胱氨酸，由氨酰-tRNA合成酶把它接到识别半胱氨酸密码子UGU的那种tRNA上，得到Cys-tRNA；随后用镍催化剂把tRNA上这个半胱氨酸还原成丙氨酸，tRNA本身没有改动，它的反密码子仍然指向UGU。把这种带错货的tRNA与血红蛋白mRNA一起加入兔网状红细胞裂解物，新合成的肽链上，本该由半胱氨酸占据的位置出现了丙氨酸，其余位置的序列不变。氨基酸与核苷酸三联体之间并没有可供识别的化学联系，真正完成接头任务的是tRNA的双手：一端是反密码子环上的三个碱基，按反向平行方式与mRNA的密码子形成氢键；另一端是氨基酸臂3′端的CCA，末位腺苷酸的3′-羟基与氨基酸的羧基形成酯键，装载过程由氨酰-tRNA合成酶催化并消耗ATP。tRNA前体由RNA聚合酶Ⅲ转录，在核内加工成熟后才参与翻译。","vignette_title":"情景 1：氨基酸认不出自己的密码子","gidx":4,"gn":5,"anchor":"在核内加工成熟后才参与翻译"},{"id":"gc21-03-1","ch":20,"part":4,"tag":"机制","stem":"细胞核内该基因的转录本比正常长约1.2 kb，其直接原因是","options":["转录起始位点向上游偏移，使转录本从更靠5′端的位置开始合成","剪接体识别到突变序列后保留了内含子，使转录本的序列明显变长","3′端切割与加尾无法在突变位点进行，聚合酶Ⅱ继续转录到下游位点","RNA聚合酶Ⅱ失去校对功能，在3′端连续掺入多余的核苷酸","多聚腺苷酸聚合酶在3′端反复延伸，合成了远超正常长度的尾"],"answer":2,"explain":"C 对：加尾信号突变使3′端切割与加尾无法在该位点进行，RNA聚合酶Ⅱ继续转录到下游的隐蔽位点，转录本因此变长。A 错：起始位点向上游偏移会改变5′端序列，不会使3′端延长1.2 kb。B 错：保留内含子只造成与内含子等长的增加，且情景已说明剪接位点序列未变。D 错：RNA聚合酶Ⅱ本身没有校对活性，但也不会因此连续掺入多余核苷酸。E 错：多聚腺苷酸尾属于尾长变化，与转录本向3′端下游延伸1.2 kb不符。","type":"A1","group":"c21-03","kind":"mechanism","chs":[20,21,10],"vignette":"某分泌蛋白基因的3′端加尾信号由AAUAAA突变为AAGAAA。把该基因转入培养细胞后做核质分离：细胞核内该基因的转录本比正常长约1.2 kb，其3′端一直延伸到下游一个隐蔽位点；细胞质中对应的成熟mRNA只剩正常水平的15%，蛋白质合成量约为正常的12%。用抗m7G抗体做沉淀，核内那份长转录本可被沉淀下来；而用寡聚dT探针杂交时，长转录本几乎没有信号。该转录本的剪接位点序列本身并未改变，聚合酶Ⅱ最大亚基C端结构域的第5位丝氨酸磷酸化水平也与正常细胞一致。若人为给这种转录本补上多聚腺苷酸尾、再注入细胞质，其翻译效率仍低于正常mRNA，约为正常的40%。","vignette_title":"情景 3：加不上尾的那条转录本","gidx":1,"gn":5,"anchor":"其3′端一直延伸到下游一个隐蔽位点"},{"id":"gc21-03-2","ch":20,"part":4,"tag":"机制","stem":"该长转录本的5′端已带帽而3′端尚未加尾，与下列哪种偶联关系相符","options":["C端结构域Ser5磷酸化招募加帽酶，Ser2磷酸化则与加尾偶联","C端结构域Ser2磷酸化招募加帽酶，Ser5磷酸化则与加尾偶联","聚合酶Ⅲ最大亚基C端结构域在延伸中同时招募加帽酶与加尾相关因子","σ因子在转录起始后仍结合核心酶，负责招募加帽酶与加尾相关因子","C端结构域属于DNA结合结构域，通过识别TATA盒启动加帽与加尾"],"answer":0,"explain":"A 对：加帽发生在转录早期，由聚合酶Ⅱ最大亚基C端结构域Ser5磷酸化招募加帽酶；与延长、剪接和加尾偶联的是Ser2磷酸化，故3′端未加尾并不影响已经加上的帽。B 错：两种磷酸化对应的加工步骤写反了。C 错：C端结构域属于RNA聚合酶Ⅱ，RNA聚合酶Ⅲ不通过该结构域组织加帽。D 错：σ因子是原核成分，且转录起始后即与核心酶解离，不参与加帽招募。E 错：C端结构域不是DNA结合结构域，也不识别TATA盒。","type":"A1","group":"c21-03","kind":"mechanism","chs":[20,21,10],"vignette":"某分泌蛋白基因的3′端加尾信号由AAUAAA突变为AAGAAA。把该基因转入培养细胞后做核质分离：细胞核内该基因的转录本比正常长约1.2 kb，其3′端一直延伸到下游一个隐蔽位点；细胞质中对应的成熟mRNA只剩正常水平的15%，蛋白质合成量约为正常的12%。用抗m7G抗体做沉淀，核内那份长转录本可被沉淀下来；而用寡聚dT探针杂交时，长转录本几乎没有信号。该转录本的剪接位点序列本身并未改变，聚合酶Ⅱ最大亚基C端结构域的第5位丝氨酸磷酸化水平也与正常细胞一致。若人为给这种转录本补上多聚腺苷酸尾、再注入细胞质，其翻译效率仍低于正常mRNA，约为正常的40%。","vignette_title":"情景 3：加不上尾的那条转录本","gidx":2,"gn":5,"anchor":"核内那份长转录本可被沉淀下来"},{"id":"gc21-04-3","ch":20,"part":4,"tag":"方案","stem":"若要进一步确认该体系的翻译起始依赖5′帽的识别，最合理的做法是","options":["再加入氯霉素，观察放射性掺入是否仍保持在22000 cpm","加入m7G帽类似物竞争帽结合蛋白，观察放射性掺入是否明显下降","加入25 mmol/L依地酸，观察多聚核糖体峰是否消失并出现小峰","提高MgCl₂浓度到10 mmol/L，观察单体峰是否向更大的沉降系数移动","把保温时间缩短到10分钟，观察多聚核糖体峰是否整体向顶部移动"],"answer":1,"explain":"B 对：若起始依赖5′帽的识别，加入m7G帽类似物会竞争帽结合蛋白，放射性掺入应明显下降，这是判别该环节最直接的做法。A 错：氯霉素在本体系中几乎没有抑制作用，重复该组得不到关于帽的信息。C 错：依地酸组只反映核糖体亚基的解离，不能判断起始是否依赖帽。D 错：改变Mg²⁺浓度影响的是核糖体的组装与解离，与帽识别环节不对应。E 错：缩短保温时间只是改变反应进程，无法区分起始依赖的是哪一种元件。","type":"A1","group":"c21-04","kind":"experiment","chs":[21,20,2],"vignette":"用兔网状红细胞裂解物搭一个体外翻译体系：每50 μL含裂解物20 μL、血红蛋白mRNA 0.5 μg（5′端带有m7G帽、3′端带多聚腺苷酸尾）、20种氨基酸各50 μmol/L（其中³H-亮氨酸1000 Bq）、ATP与GTP各1 mmol/L、MgCl₂ 2 mmol/L、KCl 100 mmol/L以及RNase抑制剂，37℃保温60分钟。取5 μL点于滤纸片，用10%三氯乙酸沉淀并洗涤后计放射性：全体系为24000 cpm，不加mRNA的对照为380 cpm。另取样品做蔗糖密度梯度离心，260 nm监测可见单体峰与多聚核糖体峰。加入放线菌酮100 μmol/L后放射性降到500 cpm，而多聚核糖体峰反高于对照、单体峰低于对照；加入25 mmol/L依地酸后放射性为300 cpm，多聚核糖体峰消失，出现两个沉降系数较小的峰；加入氯霉素400 μmol/L后放射性为22000 cpm。","vignette_title":"情景 4：梯度里那三个峰与三次计数","gidx":3,"gn":5,"anchor":"5′端带有m7G帽"},{"id":"gc4-03-1","ch":20,"part":4,"tag":"机制","stem":"该基因的 pre-mRNA 与模板链、编码链的关系是","options":["与编码链序列一致仅 U 代 T，与模板链方向相同","与模板链和编码链均互补，因而与两条链都不相同","与模板链互补且反向平行，与编码链序列一致仅 U 代 T","与模板链序列一致仅 U 代 T，与编码链互补且反向平行","与模板链互补且方向相同，与编码链互补且反向平行"],"answer":2,"explain":"C 对：转录按碱基互补规则进行，RNA 与模板链互补且反向平行，与编码链序列一致，只是 U 取代 T。A、D 把模板链与编码链的位置对调，方向也随之写错；C 说与模板链方向相同，忽略了反平行关系；E 说与两条链都互补，若如此 RNA 就不能与编码链序列一致，与转录事实不符。","type":"A1","group":"c4-03","kind":"mechanism","chs":[20,21],"vignette":"真核生物编码蛋白质的基因由外显子与内含子交替排列组成。转录时，RNA 聚合酶Ⅱ以模板链为模板、按碱基互补规则合成 pre-mRNA，合成方向为 5′→3′，因此 RNA 的序列与编码链一致（只是 U 取代 T），而与模板链互补且反向平行。转录开始不久，pre-mRNA 的 5′ 端就加上 7-甲基鸟苷帽；转录终止后，3′ 端在 AAUAAA 信号下游约 10–20 个核苷酸处被切开，再由多聚腺苷酸聚合酶加上尾，这一步不需要模板。随后剪接体识别内含子 5′ 端的 GU 与 3′ 端的 AG，经两次转酯反应把内含子以套索形式切除，并把相邻外显子连接起来。某基因第 2 内含子 5′ 端的 GU 突变为 AU，患者成熟 mRNA 中该内含子被完整保留。","vignette_title":"情景 3：一个 GU 变成 AU 之后","gidx":1,"gn":5,"anchor":"而与模板链互补且反向平行"},{"id":"gc4-03-2","ch":20,"part":4,"tag":"机制","stem":"该 pre-mRNA 的 3′ 端多聚腺苷酸尾是","options":["以转录终止时形成的发夹结构为引物，直接延伸而成","在 AAUAAA 信号上游切开，由聚合酶加尾而不需模板","在剪接完成之后，由剪接体在 3′ 端逐个添加而成","以 DNA 上的 polyT 序列为模板，由聚合酶转录生成","在 AAUAAA 信号下游切开，由聚合酶加尾而不需模板"],"answer":4,"explain":"E 对：3′ 端在 AAUAAA 信号下游约 10–20 个核苷酸处被切开，再由多聚腺苷酸聚合酶以不依赖模板的方式逐个加上腺苷酸。A 切点位置写到了信号上游；B 说以 DNA 的 polyT 为模板，等于把加尾误当成转录；C 的发夹结构是原核不依赖 ρ 因子终止的特征，与加尾无关；E 把加尾的执行者错写成剪接体，剪接体只负责切除内含子。","type":"A1","group":"c4-03","kind":"mechanism","chs":[20,21],"vignette":"真核生物编码蛋白质的基因由外显子与内含子交替排列组成。转录时，RNA 聚合酶Ⅱ以模板链为模板、按碱基互补规则合成 pre-mRNA，合成方向为 5′→3′，因此 RNA 的序列与编码链一致（只是 U 取代 T），而与模板链互补且反向平行。转录开始不久，pre-mRNA 的 5′ 端就加上 7-甲基鸟苷帽；转录终止后，3′ 端在 AAUAAA 信号下游约 10–20 个核苷酸处被切开，再由多聚腺苷酸聚合酶加上尾，这一步不需要模板。随后剪接体识别内含子 5′ 端的 GU 与 3′ 端的 AG，经两次转酯反应把内含子以套索形式切除，并把相邻外显子连接起来。某基因第 2 内含子 5′ 端的 GU 突变为 AU，患者成熟 mRNA 中该内含子被完整保留。","vignette_title":"情景 3：一个 GU 变成 AU 之后","gidx":2,"gn":5,"anchor":"这一步不需要模板"},{"id":"gc4-03-3","ch":20,"part":4,"tag":"机制","stem":"该突变使成熟 mRNA 中内含子被保留，原因是","options":["3′ 剪接位点被新序列激活，剪接速度显著加快","5′ 剪接位点不能被剪接体正常识别，剪接无法进行","多聚腺苷酸尾无法加上，使内含子不能被切除","内含子中出现新的终止密码子，使转录提前终止","加帽酶无法识别该 pre-mRNA，使剪接体不能装配"],"answer":1,"explain":"B 对：内含子 5′ 端的 GU 是剪接体识别与装配的必需位点，突变为 AU 后该位点失效，内含子无法被切除而保留在成熟 mRNA 中。A 与结果方向相反，位点被破坏不会使剪接加快；B 终止密码子影响的是翻译而非转录终止；D 加帽与剪接体的装配是两件事，加帽异常不导致内含子保留；E 加尾异常同样不决定内含子能否被切除。","type":"A1","group":"c4-03","kind":"mechanism","chs":[20,21],"vignette":"真核生物编码蛋白质的基因由外显子与内含子交替排列组成。转录时，RNA 聚合酶Ⅱ以模板链为模板、按碱基互补规则合成 pre-mRNA，合成方向为 5′→3′，因此 RNA 的序列与编码链一致（只是 U 取代 T），而与模板链互补且反向平行。转录开始不久，pre-mRNA 的 5′ 端就加上 7-甲基鸟苷帽；转录终止后，3′ 端在 AAUAAA 信号下游约 10–20 个核苷酸处被切开，再由多聚腺苷酸聚
