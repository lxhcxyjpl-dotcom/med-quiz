共同组成通道"],"answer":3,"explain":"D对：CPP复合体包括Par复合体、Scribble复合体、Crumbs复合体与PCP核心组分，是调控细胞极性的核心装置，其中Par复合体定位于顶端。E错：紧密连接由闭合蛋白、咬合蛋白等构成，提供屏障与栅栏功能，不是极性的核心调控者。A错：黏着连接由钙黏素与连环蛋白构成，负责机械连接与信号传递。B错：缝隙连接由六个连接蛋白亚基围成通道，介导相邻细胞间的电耦联与代谢耦联。C错：中间纤维网络属细胞骨架成分，不构成极性调控复合体。","type":"A1","group":"c5-02","kind":"mechanism","chs":[24,8,27],"vignette":"把培养的单层肠上皮细胞置于无钙培养液中，30分钟后电镜下可见相邻细胞之间的黏着连接解体、细胞间隙增宽，位于细胞顶端的封闭带也随之断裂。荧光标记显示：原本只分布在顶端膜上的转运体，此时扩散到了基底面；基底面的钠钾泵也出现在顶端膜上。细胞新合成的顶端膜蛋白仍能被包装入囊泡并运往细胞表面，但囊泡无法在顶端定位。研究者改用低浓度钙离子培养液（0.1mmol/L）后，上述变化在2小时内才缓慢出现。","vignette_title":"情景 2：把钙离子拿走之后","gidx":3,"gn":5,"anchor":"位于细胞顶端的封闭带也随之断裂"},{"ch":24,"part":5,"tag":"钙黏素","stem":"关于钙黏素（cadherin）的叙述，正确的是？","options":["钙黏素的黏附不依赖细胞外Ca²⁺，在无钙培养基中仍能维持细胞间黏附","钙黏素识别RGD序列，属于异亲性黏附分子","钙黏素主要介导血流中白细胞与血管内皮的暂时性黏附","钙黏素介导Ca²⁺依赖的同亲性黏附，其胞内段通过连接蛋白与细胞骨架相连，在胚胎发育、组织分化与器官构筑中起重要作用","E-钙黏素表达升高是肿瘤细胞发生上皮-间质转化（EMT）和转移的关键"],"answer":3,"explain":"钙黏素为Ca²⁺依赖的同亲性黏附分子，胞内经连接蛋白连于细胞骨架；E-钙黏素下调才是EMT与肿瘤转移的关键。","type":"A1","id":"c24-e0abbb04"},{"ch":24,"part":5,"tag":"选择素","stem":"关于选择素（selectin）和免疫球蛋白超家族黏附分子（IgSF-CAM）的叙述，正确的是？","options":["选择素通过识别RGD序列与配体结合，介导稳定的永久黏附","选择素介导的黏附不依赖Ca²⁺，也不识别糖链","选择素识别细胞表面的糖链配体，介导血液中白细胞与内皮细胞的暂时性黏附；IgSF大多介导淋巴细胞与免疫应答细胞间的黏附，亦在神经系统发育中起重要作用","IgSF黏附分子与配体的结合全部依赖Ca²⁺","IgSF只表达于神经系统，不参与免疫细胞的黏附"],"answer":2,"explain":"选择素识别糖链配体并依赖Ca²⁺，介导白细胞滚动等暂时性黏附；IgSF多介导免疫细胞间黏附，也参与神经发育。","type":"A1","id":"c24-147b4df6"},{"ch":24,"part":5,"tag":"整合素信号","stem":"关于整合素（integrin）介导的双向信号传递，下列叙述正确的是？","options":["由外向内信号指细胞外配体与整合素结合后向细胞内传递信号；由内向外信号指细胞内信号使整合素构象改变、与配体亲和力升高","由内向外信号是指细胞外配体结合后激活细胞内激酶","整合素与配体的亲和力固定不变，不随细胞内信号改变","整合素只能传递由内向外信号，不能传递由外向内信号","整合素仅存在于脊椎动物的内皮细胞和血细胞表面"],"answer":0,"explain":"由外向内为配体结合后向胞内传信号，由内向外为胞内信号改变整合素构象与亲和力；整合素在脊椎动物细胞表面普遍存在。","type":"A1","id":"c24-f7af8ca6"},{"ch":24,"part":5,"tag":"紧密连接","stem":"关于紧密连接（tight junction）的叙述，正确的是？","options":["紧密连接由连接蛋白（connexin）构成，形成细胞间的物质通道","紧密连接位于细胞侧面，允许大分子自由通过细胞间隙","紧密连接只存在于血管内皮细胞之间","紧密连接不具有封闭细胞间隙的作用，也不参与细胞极性的建立","紧密连接位于上皮细胞顶端，封闭相邻细胞间隙，具有屏障与栅栏功能，并与细胞极性的建立密切相关"],"answer":4,"explain":"紧密连接由claudin、occludin等构成，位于上皮细胞顶端，封闭细胞间隙并限制膜蛋白扩散，与细胞极性关系紧密。","type":"A1","id":"c24-e5d159eb"},{"ch":24,"part":5,"tag":"缝隙连接","stem":"2岁男婴听力测试提示轻度听力损失，耳检排除感染与畸形。拟通过基因检测寻找病因，下列叙述正确的是？","options":["最可能的突变基因是FBN1，其编码的原纤维蛋白是弹性纤维的组成成分","应重点关注GJB2基因，其编码的连接蛋白26（connexin 26）构成缝隙连接的连接子，突变使内耳细胞间通讯异常而致耳聋","应重点关注COL1A1基因，其突变使胶原合成障碍并引起听力损失","缝隙连接不允许离子和小分子通过，故连接蛋白突变与听力无关","缝隙连接由相邻细胞膜的钙黏素分子直接对接形成，与连接蛋白无关"],"answer":1,"explain":"GJB2编码连接蛋白26，6个连接蛋白构成连接子并在细胞间对接形成缝隙连接，突变使内耳细胞间通讯异常，引起遗传性耳聋。","type":"A1","id":"c24-fb4dbfde"},{"ch":24,"part":5,"tag":"锚定连接","stem":"关于锚定连接（anchoring junction）的叙述，正确的是？","options":["黏着连接与桥粒均属锚定连接，前者经钙黏素与微丝相连，后者经桥粒钙黏素与中间纤维相连","黏着连接与中间纤维相连，桥粒与微丝相连","桥粒主要介导细胞与细胞外基质之间的黏附","桥粒由整合素和蛋白聚糖构成，不含钙黏素","锚定连接只起信号传递作用，与组织的机械强度无关"],"answer":0,"explain":"黏着连接与桥粒均为锚定连接：前者连接微丝、后者连接中间纤维，赋予组织抵抗机械力的能力；半桥粒才连接细胞与基质。","type":"A1","id":"c24-f83c329b"},{"ch":24,"part":5,"tag":"细胞极性","stem":"关于细胞极性的叙述，正确的是？","options":["细胞极性仅表现为分裂期细胞的极性，与分裂间期细胞无关","细胞极性与微丝、微管、高尔基复合体等有极性的装置无关","CPP复合体是调控细胞极性的核心，包括Par复合体、Scribble复合体、Crumbs复合体和PCP核心组分复合体","WNT通路与细胞极性调控无关，形态发生素WNTs不参与极性的建立","顶底极性是分裂期细胞的极性模式，OCD/ACD是间期细胞的极性模式"],"answer":2,"explain":"CPP复合体包括Par、Scribble、Crumbs与PCP核心组分，调控顶底极性、PCP及前后极性；顶底极性属间期，OCD/ACD属分裂期。","type":"A1","id":"c24-c11d30d1"},{"ch":24,"part":5,"tag":"极性相关疾病","stem":"9岁女童因唇部褐色斑块就诊，查体见口腔黏膜、舌下及手指亦有多发性色素斑，父母无相同病变。医生建议先做消化科检查并做基因检测。下列判断正确的是？","options":["最可能为神经纤维瘤病I型，由NF1基因突变引起，属常染色体隐性遗传","最可能为黑斑息肉综合征（Peutz-Jeghers综合征），由STK11（LKB1）基因突变引起，属常染色体显性遗传，该激酶参与细胞极性调控，患者胃肠息肉有癌变风险","最可能为家族性腺瘤性息肉病，由APC基因突变引起，唇部色素斑为其典型表现","最可能为白化病，由TYR基因突变引起，只需避免日晒，无需胃肠检查","最可能为GJB2基因突变所致遗传性耳聋，与消化道病变无关"],"answer":1,"explain":"口唇、口腔黏膜与指端色素斑伴胃肠息肉提示黑斑息肉综合征，STK11（LKB1）突变为常染色体显性遗传，该激酶参与细胞极性调控。","type":"A1","id":"c24-a14fd34c"},{"ch":24,"part":5,"tag":"钙黏素家族","stem":"关于钙黏素家族（cadherin family）的成员及其分布，下列叙述正确的是？","options":["E-钙黏素主要分布于神经组织，N-钙黏素主要分布于上皮组织","桥粒中的桥粒芯蛋白、桥粒胶蛋白不属于钙黏素家族","钙黏素家族只有E-钙黏素一种成员，不存在组织特异性表达","钙黏素家族包括E-、N-、P-钙黏素以及桥粒中的桥粒芯蛋白等，各成员在不同组织细胞中表达，其胞外段含EC重复域并介导同亲性黏附","钙黏素家族成员均以胞内段识别配体，故其黏附不需要胞外结构域"],"answer":3,"explain":"钙黏素家族成员众多：E-钙黏素主要在上皮，N-钙黏素在神经与肌肉，P-钙黏素在胎盘，桥粒芯蛋白和桥粒胶蛋白亦属该家族，均以胞外域介导同亲性黏附。","type":"A1","id":"c24-3b10c3e3"},{"ch":24,"part":5,"tag":"选择素家族","stem":"关于选择素（selectin）家族及其配体，下列叙述正确的是？","options":["L-选择素表达于白细胞，P-选择素和E-选择素表达于活化内皮细胞（P-选择素也见于血小板），其配体是细胞表面含唾液酸化的路易斯寡糖等糖链结构","三种选择素均表达于白细胞，其配体是含RGD序列的蛋白质","选择素与其配体的结合是永久性的，白细胞一旦黏附即停止滚动","P-选择素储存于中性粒细胞的颗粒中，炎症时在白细胞膜上表达","选择素介导的黏附不依赖Ca²⁺，属于同亲性黏附"],"answer":0,"explain":"选择素为Ca²⁺依赖的凝集素样分子，识别唾液酸化的路易斯寡糖等配体，结合快解离也快，使白细胞沿内皮滚动；L-选择素在白细胞，P-、E-选择素在内皮。","type":"A1","id":"c24-6c748998"},{"ch":24,"part":5,"tag":"免疫球蛋白超家族","stem":"关于免疫球蛋白超家族黏附分子（IgSF-CAM），下列叙述正确的是？","options":["IgSF黏附分子通过识别糖链与配体结合，故属于凝集素类","IgSF黏附分子的胞外段含免疫球蛋白样折叠域，如ICAM-1、VCAM-1可分别与白细胞表面的整合素结合，介导白细胞与内皮的牢固黏附及跨内皮迁移","IgSF黏附分子的配体是细胞外基质中的胶原和蛋白聚糖","IgSF黏附分子的免疫球蛋白样结构域位于胞内，用于结合细胞骨架","IgSF黏附分子只起黏附作用而无信号功能，因为其胞内段不与任何胞内蛋白结合"],"answer":1,"explain":"IgSF黏附分子胞外含免疫球蛋白样折叠域，以蛋白质-蛋白质方式识别配体；ICAM-1、VCAM-1等与白细胞整合素结合，介导牢固黏附及跨内皮迁移。","type":"A1","id":"c24-7fe75497"},{"ch":24,"part":5,"tag":"整合素活化","stem":"关于整合素与配体亲和力的调节，下列叙述正确的是？","options":["整合素与配体的亲和力固定不变，细胞无法调节其黏附强度","整合素亲和力的升高直接由细胞外配体浓度增加引起，与细胞内信号无关","整合素的α、β两个亚基各自独立地与配体结合，不存在构象联动","整合素的胞内段不与细胞骨架或胞内蛋白结合，故不能传递构象变化","细胞内信号蛋白（如talin、kindlin）与整合素β亚基胞内段结合，可使整合素由弯曲的低亲和力构象变为伸展的高亲和力构象，从而增强与配体的结合"],"answer":4,"explain":"细胞内信号蛋白（如talin、kindlin）结合整合素β亚基胞内段，使整合素构象由弯曲（低亲和力）变为伸展（高亲和力），从而增强与配体的结合。","type":"A1","id":"c24-53a9fb21"},{"ch":24,"part":5,"tag":"紧密连接屏障","stem":"关于紧密连接的选择性屏障作用，下列叙述正确的是？","options":["紧密连接对所有离子和大分子均完全不通透，故又称绝对封闭连接","紧密连接位于细胞基底面，主要功能是使细胞与基膜牢固结合","紧密连接由claudin、occludin等组成，不同组织中claudin的种类和数量不同，形成对不同离子选择性通透的屏障，如在血脑屏障中限制物质自由通过","紧密连接一旦形成即固定不变，其通透性不能被细胞内信号调节","构成紧密连接的膜蛋白在全身所有组织器官中种类完全相同"],"answer":2,"explain":"紧密连接由claudin、occludin等跨膜蛋白及胞质蛋白（如ZO-1）组成；不同组织claudin组成不同，形成对离子具选择性的屏障，参与血脑屏障等功能。","type":"A1","id":"c24-83c020b7"},{"ch":24,"part":5,"tag":"黏着连接与catenin","stem":"关于黏着连接（adherens junction）的分子组成及其功能，下列叙述正确的是？","options":["黏着连接的胞内部分经桥粒芯蛋白与角蛋白中间纤维相连","黏着连接只起机械连接作用，其组分不参与任何信号通路","E-钙黏素的胞内段直接与肌动蛋白结合，不需要连接蛋白参与","β-连环蛋白（β-catenin）只存在于细胞膜内侧，不能进入细胞核","E-钙黏素经β-连环蛋白、α-连环蛋白与肌动蛋白微丝相连；β-连环蛋白还是WNT信号通路的关键分子，可在WNT信号作用下入核调节基因表达"],"answer":4,"explain":"黏着连接中E-钙黏素经β-连环蛋白、α-连环蛋白连接肌动蛋白微丝；β-连环蛋白同时是WNT通路的核心组分，可入核作为转录调节因子。","type":"A1","id":"c24-3e6c2342"},{"ch":24,"part":5,"tag":"桥粒与疾病","stem":"关于桥粒（desmosome）及其相关疾病，下列叙述正确的是？","options":["桥粒由桥粒芯蛋白、桥粒胶蛋白等桥粒钙黏素及桥粒斑蛋白等构成，与中间纤维相连；天疱疮患者产生的抗桥粒芯蛋白自身抗体使细胞间黏附丧失，形成皮肤黏膜水疱","天疱疮是桥粒钙黏素基因突变所致的隐性遗传病，与自身抗体无关","桥粒将细胞锚定在基底膜上，其结构分子主要为整合素","桥粒与肌动蛋白微丝相连，主要分布于上皮细胞的顶端","桥粒只存在于皮肤，心肌细胞之间没有桥粒"],"answer":0,"explain":"桥粒属锚定连接，由桥粒钙黏素（桥粒芯蛋白、桥粒胶蛋白）与桥粒斑蛋白等构成并连接中间纤维，赋予组织抗机械力；天疱疮为抗桥粒芯蛋白自身抗体所致水疱病。","type":"A1","id":"c24-7837906d"},{"ch":24,"part":5,"tag":"缝隙连接功能","stem":"关于缝隙连接（gap junction）的功能，下列叙述正确的是？","options":["缝隙连接通道允许蛋白质和核酸等大分子在细胞间自由通过","缝隙连接通道可允许离子、cAMP、IP₃等分子质量小于约1kD的小分子通过，从而在相邻细胞间形成电耦联和代谢耦联，如心肌细胞间借此实现同步收缩","缝隙连接只存在于上皮细胞之间，心肌和神经细胞间不存在","缝隙连接的信号传递依赖细胞外液中化学递质的扩散","缝隙连接形成的耦联是永久性的，细胞无法通过调节其开放状态改变通讯"],"answer":1,"explain":"缝隙连接由相邻细胞膜上的连接子对接形成通道，可通透离子与小分子（如cAMP、IP₃），实现细胞间电耦联与代谢耦联，其开放状态受pH、Ca²⁺等调节。","type":"A1","id":"c24-b2d92b08"},{"id":"gc16-02-4","ch":25,"part":5,"tag":"机制","stem":"催产素与子宫平滑肌细胞膜上的受体结合后引起收缩，该受体及其通路是","options":["胞内受体，配体入胞后作为转录因子调控基因表达","细胞因子受体，经JAK-STAT通路使平滑肌收缩","离子通道型受体，开放后钠离子内流引起细胞去极化","G蛋白偶联受体，经Gq激活磷脂酶Cβ生成IP3","受体酪氨酸激酶，经Ras-MAPK通路使细胞发生收缩"],"answer":3,"explain":"D 对：催产素受体是 G 蛋白偶联受体，激活后经 Gq 使磷脂酶 Cβ 水解 PIP2，生成 IP3 与 DAG，IP3 触发胞质钙离子升高，从而引起平滑肌收缩。A 错在胞内受体结合的配体多为脂溶性类固醇激素；B 错在细胞因子受体走 JAK-STAT 通路，催产素并不属于细胞因子；C 错在催产素受体不是离子通道型受体；E 错在受体酪氨酸激酶结合的是生长因子类配体。","type":"A1","group":"c16-02","kind":"mechanism","chs":[23,24,25],"vignette":"一位28岁产妇产后6周复查，子宫湿重已由分娩时的约1000 g降至约60 g，肌层中Ⅰ型与Ⅲ型胶原的含量约为分娩时的10%。比较产后1周与6周的肌层活检：组织提取物的胶原降解活性由12 U/mg升至96 U/mg，而用抗体测得的酶原蛋白总量几乎没有变化；同期其天然抑制剂TIMP-1的含量由1.0降至0.35。体外加入外源的TIMP-1后，提取物的降解活性下降92%。免疫组化显示，该酶主要分布在胶原纤维周围，而子宫肌细胞经跨膜受体与基质中的胶原、纤连蛋白相连。复旧过程中肌细胞由肥大的铺展状态变回细长，与基质的黏附点随之重建。哺乳时吸吮刺激使神经垂体释放催产素，与子宫平滑肌细胞膜上的受体结合后引起强烈收缩。","vignette_title":"情景 2：产后六周缩回去的子宫","gidx":4,"gn":5,"anchor":"与子宫平滑肌细胞膜上的受体结合"},{"id":"gc16-04-4","ch":25,"part":5,"tag":"机制","stem":"作为阳性对照，表皮生长因子使MAPK磷酸化水平升高，其经过的通路是","options":["胞内受体与配体结合后，作为转录因子调控基因表达","受体酪氨酸激酶自身磷酸化，经衔接蛋白与SOS激活Ras","细胞因子受体激活JAK，使STAT磷酸化后二聚化入核","G蛋白偶联受体激活腺苷酸环化酶，使cAMP水平升高","离子通道型受体开放，使钠离子内流并引起细胞去极化"],"answer":1,"explain":"B 对：表皮生长因子与受体酪氨酸激酶结合后使受体二聚化并自身磷酸化，经含 SH2 结构域的衔接蛋白与 SOS 激活 Ras，再经激酶级联使 MAPK 磷酸化。A 错在胞内受体结合的配体多为脂溶性激素；C 错在 JAK-STAT 是细胞因子受体的通路；D 错在生长因子受体不是 G 蛋白偶联受体；E 错在离子通道型受体介导的是快速的离子流动，不引起 MAPK 磷酸化。","type":"A1","group":"c16-04","kind":"experiment","chs":[23,9,25],"vignette":"把同一批成纤维细胞接种到两种基质胶上：甲组胶的弹性模量为0.5 kPa（接近脂肪），乙组为25 kPa（接近肌肉）。两组胶的蛋白质成分完全相同，都含层粘连蛋白与Ⅳ型胶原，培养基也相同。24小时后固定染色：甲组细胞小而圆，黏着斑面积约为乙组的1/5；乙组铺展良好，胞质出现大量平行排列的肌动蛋白束，黏着斑内聚集的整合素明显增多。丙组在乙组基础上加入含RGD序列的可溶性多肽，2小时后细胞变圆、肌动蛋白束解聚。另取乙组细胞接种于可拉伸硅胶膜，施加10%、0.5 Hz的周期性牵张30分钟，胞质钙离子荧光强度升高3.2倍；提前加入机械敏感通道阻断剂后升幅被抑制85%，牵张5分钟后MAPK磷酸化升高4倍。阳性对照加入表皮生长因子5分钟后MAPK磷酸化也升高4倍。","vignette_title":"情景 4：软胶、硬胶和一张被拉伸的膜","gidx":4,"gn":6,"anchor":"加入表皮生长因子"},{"id":"gc16-04-5","ch":25,"part":5,"tag":"方案","stem":"若要判断牵张引起的MAPK磷酸化是否依赖胞质钙离子升高，最有判别力的做法是","options":["先用钙螯合剂缓冲掉胞质钙离子，再牵张并测MAPK磷酸化","把牵张的幅度由10%提高到20%，再测磷酸化水平的升幅","用免疫印迹测MAPK的总蛋白量，比较两组加样量是否一致","比较牵张前后钙荧光与磷酸化水平变化的时间先后顺序","把细胞接种到更硬的胶上，再测MAPK的磷酸化水平"],"answer":0,"explain":"A 对：若钙离子升高是 MAPK 磷酸化的上游环节，先用钙螯合剂把胞质钙离子缓冲掉，牵张引起的磷酸化就应明显减弱，这是最直接的因果检验。B 错在改变牵张幅度只说明剂量关系；C 错在测总蛋白量只是加样量对照；D 错在时间先后一致只能提示相关，不能证明因果；E 错在改用更硬的胶改变的是另一个自变量，与本问题无关。","type":"A1","group":"c16-04","kind":"experiment","chs":[23,9,25],"vignette":"把同一批成纤维细胞接种到两种基质胶上：甲组胶的弹性模量为0.5 kPa（接近脂肪），乙组为25 kPa（接近肌肉）。两组胶的蛋白质成分完全相同，都含层粘连蛋白与Ⅳ型胶原，培养基也相同。24小时后固定染色：甲组细胞小而圆，黏着斑面积约为乙组的1/5；乙组铺展良好，胞质出现大量平行排列的肌动蛋白束，黏着斑内聚集的整合素明显增多。丙组在乙组基础上加入含RGD序列的可溶性多肽，2小时后细胞变圆、肌动蛋白束解聚。另取乙组细胞接种于可拉伸硅胶膜，施加10%、0.5 Hz的周期性牵张30分钟，胞质钙离子荧光强度升高3.2倍；提前加入机械敏感通道阻断剂后升幅被抑制85%，牵张5分钟后MAPK磷酸化升高4倍。阳性对照加入表皮生长因子5分钟后MAPK磷酸化也升高4倍。","vignette_title":"情景 4：软胶、硬胶和一张被拉伸的膜","gidx":5,"gn":6,"anchor":"胞质钙离子荧光强度升高"},{"id":"gc18-03-1","ch":25,"part":5,"tag":"识别","stem":"成骨细胞维持甲组干细胞干性所依赖的信号传递方式属于","options":["内分泌信号，配体经血液运输后作用于远隔靶细胞","旁分泌信号，配体经组织液扩散作用于邻近细胞","接触依赖信号，配体锚定在膜上需细胞直接接触","突触信号，配体经狭窄的突触间隙作用于后膜","自分泌信号，细胞分泌的配体作用于自身受体"],"answer":2,"explain":"C 对：情景显示细胞必须直接接触才能维持干性，Notch 配体锚定在成骨细胞膜上，属于典型的接触依赖性信号。A 错：内分泌信号经血液运输作用于远隔靶细胞，与同一培养皿中的接触无关。B 错：旁分泌信号靠可溶分子经组织液扩散，隔滤膜的乙组本应同样受益，与结果不符。D 错：突触信号发生在神经细胞之间，此处不存在突触结构。E 错：自分泌是细胞作用于自身，成骨细胞作用于造血干细胞属另一种细胞间通信方式。","type":"A1","group":"c18-03","kind":"mechanism","chs":[28,25,27],"vignette":"研究者把小鼠造血干细胞分为三组培养：甲组与成骨细胞在同一培养皿中直接接触；乙组与成骨细胞之间隔一层孔径0.4µm的滤膜，培养液可自由通过而细胞不能接触；丙组不铺成骨细胞，仅用基础培养液培养。7天后，甲组中保持未分化表型的细胞占82%，乙组降到21%，丙组只有9%；给丙组补加干细胞因子后也只升到34%。甲组细胞中Notch受体的胞内段进入细胞核，其靶基因Hes1的转录本比乙组高6倍；加入γ-分泌酶抑制剂DAPT后，甲组该比例降到18%。稀释实验显示，甲组细胞每4次分裂中有3次产生一个保持干性的子细胞与一个开始表达髓系标志的子细胞，乙组细胞则大多分裂成两个走向分化的子细胞。","vignette_title":"情景 3：隔着一层滤膜的两个结果","gidx":1,"gn":5,"anchor":"隔一层孔径0.4µm的滤膜"},{"id":"gc18-03-4","ch":25,"part":5,"tag":"机制","stem":"加入DAPT后甲组干性细胞比例降到18%，DAPT阻断的环节是","options":["Notch配体与相邻细胞受体的结合过程","Notch受体被切割后胞内段入核的活化过程","干细胞因子与其受体结合后的JAK活化过程","成骨细胞分泌细胞外基质蛋白的合成过程","Hes1转录本在细胞质中的翻译与稳定过程"],"answer":1,"explain":"B 对：DAPT 抑制 γ-分泌酶，使 Notch 受体不能被切割、胞内段无法入核激活靶基因，干性维持随之下降。A 错：DAPT 作用在受体被切割这一步，不影响配体与受体的结合。C 错：JAK 通路属细胞因子受体通路，DAPT 不作用于此。D 错：成骨细胞分泌基质蛋白属龛结构的形成，与 γ-分泌酶的切割无关。E 错：Hes1 的转录本由胞内段入核后启动转录，DAPT 阻断的是转录之前的上游环节。","type":"A1","group":"c18-03","kind":"mechanism","chs":[28,25,27],"vignette":"研究者把小鼠造血干细胞分为三组培养：甲组与成骨细胞在同一培养皿中直接接触；乙组与成骨细胞之间隔一层孔径0.4µm的滤膜，培养液可自由通过而细胞不能接触；丙组不铺成骨细胞，仅用基础培养液培养。7天后，甲组中保持未分化表型的细胞占82%，乙组降到21%，丙组只有9%；给丙组补加干细胞因子后也只升到34%。甲组细胞中Notch受体的胞内段进入细胞核，其靶基因Hes1的转录本比乙组高6倍；加入γ-分泌酶抑制剂DAPT后，甲组该比例降到18%。稀释实验显示，甲组细胞每4次分裂中有3次产生一个保持干性的子细胞与一个开始表达髓系标志的子细胞，乙组细胞则大多分裂成两个走向分化的子细胞。","vignette_title":"情景 3：隔着一层滤膜的两个结果","gidx":4,"gn":5,"anchor":"加入γ-分泌酶抑制剂DAPT后"},{"id":"gc20-03-1","ch":25,"part":5,"tag":"机制","stem":"T3使靶细胞钠钾泵数目增多，其作用方式是","options":["T3与膜受体结合，经cAMP途径快速激活已有的钠钾泵分子","T3与胞质受体结合，经第二信使使钠钾泵发生磷酸化修饰","T3直接作为钠钾泵的变构激活剂，与泵的α亚基结合后起效","T3与核受体结合，经调控基因转录增加钠钾泵蛋白的合成","T3与核受体结合后抑制转录，使钠钾泵的降解速率明显减慢"],"answer":3,"explain":"D 对：甲状腺激素属脂溶性配体，与核受体结合后作为配体依赖的转录因子调控基因转录，钠钾泵蛋白的合成量因而增多，这与其起效缓慢、效应持久的特点一致。A 错：膜受体与cAMP通路是水溶性激素的作用方式，不能解释泵蛋白含量的增加。B 错：胞质受体与第二信使不参与甲状腺激素的作用机制。C 错：变构激活只改变已有酶的活性，不能使钠钾泵的数目增多。E 错：甲状腺激素与本例受体结合后促进转录，以降解减慢来解释泵蛋白增多与实测不符。","type":"A1","group":"c20-03","kind":"mechanism","chs":[13,16,25],"vignette":"32岁女性因怕热、多汗、心悸伴三个月内体重下降6kg就诊。体检：心率110次/分，双手细颤，甲状腺弥漫性肿大。检查：血清游离T4为正常上限的3倍，促甲状腺激素（TSH）降低，基础代谢率+45%，静息耗氧量较同龄女性高约40%，血胆固醇3.1mmol/L，血糖正常。医师解释，血中甲状腺激素绝大部分与结合蛋白结合运输，进入细胞后T4在脱碘酶作用下转变为活性更强的T3；T3与细胞核内的受体结合，受体作为配体依赖的转录因子开启一批基因，其中编码钠钾泵的基因转录明显增强，细胞膜上钠钾泵的数目达到同龄人的2.6倍。治疗6周后复查，基础代谢率降至+8%；治疗前取骨骼肌线粒体测定，以谷氨酸加苹果酸为底物时P/O比仍为2.5。","vignette_title":"情景 3：基础代谢率+45%的那位患者","gidx":1,"gn":5,"anchor":"T3与细胞核内的受体结合"},{"id":"gc20-03-2","ch":25,"part":5,"tag":"判读","stem":"血中甲状腺激素绝大部分与结合蛋白结合，这一形式的生理意义是","options":["结合形式可直接进入细胞，是受体识别的活性形式","结合形式可被肾小球滤过，随尿排出以避免激素蓄积","结合形式起运输与储存作用，游离激素才发挥作用","结合形式能迅速被靶细胞摄取，保证效应快速而短暂","结合形式可水解为游离激素，使血中总浓度保持恒定水平"],"answer":2,"explain":"C 对：甲状腺激素在血中绝大部分与结合蛋白结合，这种形式便于运输并起储存作用，只有游离激素才能进入细胞与受体结合。A 错：进入细胞的是游离激素，结合形式是运输形式而不是活性形式。B 错：结合形式分子量大，不易经肾小球滤过，随尿排出的是游离激素的代谢产物。D 错：经核受体调控转录的效应缓慢而持久，与快速短暂相反。E 错：结合形式与游离形式之间保持动态平衡，血中总浓度并不由水解来维持恒定。","type":"A1","group":"c20-03","kind":"mechanism","chs":[13,16,25],"vignette":"32岁女性因怕热、多汗、心悸伴三个月内体重下降6kg就诊。体检：心率110次/分，双手细颤，甲状腺弥漫性肿大。检查：血清游离T4为正常上限的3倍，促甲状腺激素（TSH）降低，基础代谢率+45%，静息耗氧量较同龄女性高约40%，血胆固醇3.1mmol/L，血糖正常。医师解释，血中甲状腺激素绝大部分与结合蛋白结合运输，进入细胞后T4在脱碘酶作用下转变为活性更强的T3；T3与细胞核内的受体结合，受体作为配体依赖的转录因子开启一批基因，其中编码钠钾泵的基因转录明显增强，细胞膜上钠钾泵的数目达到同龄人的2.6倍。治疗6周后复查，基础代谢率降至+8%；治疗前取骨骼肌线粒体测定，以谷氨酸加苹果酸为底物时P/O比仍为2.5。","vignette_title":"情景 3：基础代谢率+45%的那位患者","gidx":2,"gn":5,"anchor":"绝大部分与结合蛋白结合运输"},{"id":"gc22-01-1","ch":25,"part":5,"tag":"机制","stem":"该肿瘤细胞在无血清条件下仍维持高水平的MAPK磷酸化，其分子基础是","options":["血清中配体浓度偏低，使受体对配体的亲和力代偿性升高","肿瘤细胞自身合成并分泌配体，形成自分泌刺激的环路","受体数目显著增多，二聚化不再依赖配体的占据","受体在无配体时被胞内激酶磷酸化而直接转为活化构象","膜的流动性升高，使受体在膜上的侧向扩散速度加快"],"answer":2,"explain":"C 对：该基因拷贝数增加，膜上受体密度显著升高，两个受体在配体严重不足时也能相互靠近并二聚化，彼此磷酸化，故活化不再依赖配体占据。A 错在配体浓度低时受体亲和力并不会代偿性升高；B 与情景中该配体的 mRNA 几乎检测不到相矛盾；D 错在受体的自身磷酸化发生在两个受体之间，而不是被胞内其他激酶单独修饰；E 错在膜流动性加快只提高碰撞概率，无法解释配体缺如时的持续活化。","type":"A1","group":"c22-01","kind":"mechanism","chs":[25,4,26],"vignette":"一名患者的手术标本做免疫印迹检测，其乳腺肿瘤细胞膜上的HER2蛋白量约为同一患者正常乳腺上皮的12倍，荧光原位杂交显示相应的基因拷贝数明显增加。血清中能与之结合的配体浓度低于正常下限，肿瘤细胞内该配体的mRNA也几乎检测不到。研究者把肿瘤细胞放在无血清培养液中培养24小时并洗去全部可溶因子，细胞内的MAPK磷酸化水平仍为正常上皮的6倍；用荧光能量转移法测得，质膜上约40%的该受体分子以二聚体形式存在，而正常细胞这一比例不足5%。该受体为单次跨膜的内在膜蛋白，胞外段结合配体，胞内段具有酪氨酸激酶活性，两个受体靠近后彼此的酪氨酸残基被磷酸化。核提取物中，Myc与CyclinD的mRNA分别升高。向培养液中加入一种分子结构与ATP相似的抑制剂后，受体的自身磷酸化下降80%，细胞在G1期的比例由42%升到76%。","vignette_title":"情景 1：血清里查不到配体，受体却一直亮着","gidx":1,"gn":5,"anchor":"约40%的该受体分子以二聚体形式存在"},{"id":"gc22-01-3","ch":25,"part":5,"tag":"判读","stem":"该抑制剂使受体的自身磷酸化下降80%，说明它作用的环节最可能是","options":["竞争受体胞内段ATP结合位点，抑制其酪氨酸激酶活性","与受体胞外段结合，阻断配体与受体的相互识别","抑制配体的基因转录，使血清中配体浓度进一步下降","促进受体经溶酶体降解，使膜上受体数目明显减少","阻断受体与下游衔接蛋白结合，使信号无法向下传递"],"answer":0,"explain":"A 对：抑制剂的分子结构与 ATP 相似，提示它占据受体胞内段的核苷酸结合位点，竞争性抑制受体的酪氨酸激酶活性，磷酸基团无法转移给受体自身，故自身磷酸化明显下降。E 错在受体的自身磷酸化由两个受体相互完成，阻断下游衔接蛋白的结合不会使这一步下降；B 作用于受体活化的最上游，与配体浓度极低这一前提不符；C 的靶点是配体的基因转录，而抑制剂作用的是受体；D 使膜上受体数目减少，情景并未给出受体总量下降。","type":"A1","group":"c22-01","kind":"mechanism","chs":[25,4,26],"vignette":"一名患者的手术标本做免疫印迹检测，其乳腺肿瘤细胞膜上的HER2蛋白量约为同一患者正常乳腺上皮的12倍，荧光原位杂交显示相应的基因拷贝数明显增加。血清中能与之结合的配体浓度低于正常下限，肿瘤细胞内该配体的mRNA也几乎检测不到。研究者把肿瘤细胞放在无血清培养液中培养24小时并洗去全部可溶因子，细胞内的MAPK磷酸化水平仍为正常上皮的6倍；用荧光能量转移法测得，质膜上约40%的该受体分子以二聚体形式存在，而正常细胞这一比例不足5%。该受体为单次跨膜的内在膜蛋白，胞外段结合配体，胞内段具有酪氨酸激酶活性，两个受体靠近后彼此的酪氨酸残基被磷酸化。核提取物中，Myc与CyclinD的mRNA分别升高。向培养液中加入一种分子结构与ATP相似的抑制剂后，受体的自身磷酸化下降80%，细胞在G1期的比例由42%升到76%。","vignette_title":"情景 1：血清里查不到配体，受体却一直亮着","gidx":3,"gn":5,"anchor":"一种分子结构与ATP相似的抑制剂"},{"id":"gc22-02-2","ch":25,"part":5,"tag":"机制","stem":"复发灶细胞的受体被内吞后不被降解而重新出现在质膜上，其分子基础是","options":["内体的腔内酸化被抑制，受体在内体中被滞留","受体的配体亲和力升高，配体结合后不易解离","细胞的网格蛋白表达下降，受体不能被内吞","受体胞内段的泛素化位点突变，不能被泛素标记","受体自身的酪氨酸激酶活性下降，内吞信号减弱"],"answer":3,"explain":"D 对：泛素化标记是受体进入降解途径的分选信号，位点突变后受体不能被泛素化，在内体中转而经再循环返回质膜，受体下调因此失效。C 与情景中受体已被内吞这一前提矛盾；A 只会使受体滞留于内体，不会使其重新出现在质膜上；B 讲的是配体结合的强弱，与受体的去向无关；E 错在受体的内吞与去向并不由它自身的激酶活性高低决定。","type":"A1","group":"c22-02","kind":"mechanism","chs":[25,4,26],"vignette":"同一名患者的原发灶与复发灶细胞分别在含表皮生长因子的培养液中连续培养。原发灶细胞受体的自身磷酸化在15分钟达到峰值，60分钟后降到峰值的12%，24小时后质膜上的受体数目只剩处理前的40%；向培养液中加入氯喹（一种使溶酶体腔内pH升高、水解酶失活的弱碱）后，质膜上的受体数目不再下降，免疫电镜显示受体集中在内体与溶酶体样的囊泡中，而培养液里自始至终测不到受体的可溶胞外段。复发灶细胞受体的胞内段泛素化位点发生突变，受体被内吞后不能被泛素标记，24小时后质膜上的受体数目仍为处理前的95%，其自身磷酸化在12小时内维持不降；该细胞中还有一种能使MAPK去磷酸化的蛋白磷酸酶，表达量降到原发灶细胞的20%。该细胞的PTEN表达缺失，Akt的磷酸化持续处于高位。撤除生长因子24小时后，复发灶细胞仍有38%进入S期，原发灶细胞只有9%。","vignette_title":"情景 2：受体降不下去的那株细胞","gidx":2,"gn":5,"anchor":"受体被内吞后不能被泛素标记"},{"id":"gc22-02-3","ch":25,"part":5,"tag":"判读","stem":"该复发灶细胞的PTEN表达缺失，其Akt磷酸化持续处于高位，原因是","options":["PTEN缺失使PIP2的生成减少，Akt因失去抑制而活化","PIP3不能被水解，持续募集并激活下游的信号分子","PTEN缺失使磷酸二酯酶活性升高，第二信使堆积","PTEN缺失使受体的磷酸化位点增多，PI3K募集增加","PTEN缺失使Akt的蛋白降解被抑制，总量明显升高"],"answer":1,"explain":"B 对：PTEN 是一种脂质磷酸酶，能把 PIP3 水解为 PIP2，从而对 PI3K-Akt 通路起负性调节作用；PTEN 缺失后 PIP3 不能被水解而持续存在，不断募集并激活下游分子，Akt 因此长期处于磷酸化状态。A 错在 PTEN 缺失不会使 PIP2 减少；C 错在磷酸二酯酶水解的是 cAMP、cGMP 这类第二信使，与本通路无关；D 错在受体上磷酸化位点的数目由受体自身决定；E 错在 Akt 的活化取决于磷酸化水平，而不是蛋白总量升高。","type":"A1","group":"c22-02","kind":"mechanism","chs":[25,4,26],"vignette":"同一名患者的原发灶与复发灶细胞分别在含表皮生长因子的培养液中连续培养。原发灶细胞受体的自身磷酸化在15分钟达到峰值，60分钟后降到峰值的12%，24小时后质膜上的受体数目只剩处理前的40%；向培养液中加入氯喹（一种使溶酶体腔内pH升高、水解酶失活的弱碱）后，质膜上的受体数目不再下降，免疫电镜显示受体集中在内体与溶酶体样的囊泡中，而培养液里自始至终测不到受体的可溶胞外段。复发灶细胞受体的胞内段泛素化位点发生突变，受体被内吞后不能被泛素标记，24小时后质膜上的受体数目仍为处理前的95%，其自身磷酸化在12小时内维持不降；该细胞中还有一种能使MAPK去磷酸化的蛋白磷酸酶，表达量降到原发灶细胞的20%。该细胞的PTEN表达缺失，Akt的磷酸化持续处于高位。撤除生长因子24小时后，复发灶细胞仍有38%进入S期，原发灶细胞只有9%。","vignette_title":"情景 2：受体降不下去的那株细胞","gidx":3,"gn":5,"anchor":"该细胞的PTEN表达缺失"},{"id":"gc22-02-5","ch":25,"part":5,"tag":"判读","stem":"关于本组实验中信号的终止与负性调节，下列判断正确的是（X 型多选）","options":["受体下调使细胞表面可被激活的受体数目减少","该株细胞MAPK磷酸化维持不降，与受体下调失效有关","PTEN水解PIP3，对PI3K-Akt通路起负性调节","蛋白磷酸酶把磷酸基团加到信号蛋白上，使信号终止","信号通路的负反馈调节使刺激持续时反应逐渐增强"],"answer":[0,1,2],"explain":"答案 ABC。A 对：受体数目减少使可被配体激活的受体总量下降，细胞对该信号的敏感性随之降低，这是数量层面的负性调节。B 对：该株细胞受体不能被泛素标记而返回质膜，其 MAPK 磷酸化在 12 小时内不降，正是受体下调失效的直接后果。C 对：PTEN 把 PIP3 水解为 PIP2，是 PI3K-Akt 通路的负性调节分子，其缺失使 Akt 磷酸化持续处于高位。D 错：蛋白磷酸酶的作用是去除磷酸基团，加磷酸基团的是蛋白激酶。E 错：负反馈的作用方向是使刺激持续存在时反应逐渐减弱，与本选项相反。","type":"X","group":"c22-02","kind":"mechanism","chs":[25,4,26],"vignette":"同一名患者的原发灶与复发灶细胞分别在含表皮生长因子的培养液中连续培养。原发灶细胞受体的自身磷酸化在15分钟达到峰值，60分钟后降到峰值的12%，24小时后质膜上的受体数目只剩处理前的40%；向培养液中加入氯喹（一种使溶酶体腔内pH升高、水解酶失活的弱碱）后，质膜上的受体数目不再下降，免疫电镜显示受体集中在内体与溶酶体样的囊泡中，而培养液里自始至终测不到受体的可溶胞外段。复发灶细胞受体的胞内段泛素化位点发生突变，受体被内吞后不能被泛素标记，24小时后质膜上的受体数目仍为处理前的95%，其自身磷酸化在12小时内维持不降；该细胞中还有一种能使MAPK去磷酸化的蛋白磷酸酶，表达量降到原发灶细胞的20%。该细胞的PTEN表达缺失，Akt的磷酸化持续处于高位。撤除生长因子24小时后，复发灶细胞仍有38%进入S期，原发灶细胞只有9%。","vignette_title":"情景 2：受体降不下去的那株细胞","gidx":5,"gn":5,"anchor":"自身磷酸化在12小时内维持不降"},{"id":"gc22-04-1","ch":25,"part":5,"tag":"判读","stem":"第二线的三组磷酸化数据说明，化合物X阻断的环节位于","options":["受体与配体结合之前，受体的活化完全被抑制","受体自身磷酸化之后、MAPK活化之前的环节","MAPK活化之后、进入细胞核之前的环节","PI3K-Akt通路的上游，使Akt不能被磷酸化","细胞核内，使CyclinD基因的启动子不能被激活"],"answer":1,"explain":"B 对：受体自身磷酸化仍为 7.5 倍，说明受体这一步没有被阻断；MAPK 磷酸化由 9 倍降到 1.1 倍，说明阻断发生在受体之后、MAPK 活化之前；Akt 磷酸化仍为 6 倍，说明 PI3K-Akt 通路不受影响，也排除了受体层面的阻断。A 与受体磷酸化未降矛盾；C 与 MAPK 磷酸化下降矛盾；D 与 Akt 磷酸化仍为 6 倍矛盾；E 错在 CyclinD 报告基因需 MAPK 入核驱动，阻断点应在它上游。","type":"A1","group":"c22-04","kind":"experiment","chs":[25,26,4],"vignette":"研究生小赵用一株需要表皮生长因子刺激才能进入S期的人上皮细胞做三线联合测定。第一线：把含CyclinD启动子驱动荧光素酶的质粒转入细胞，无血清培养24小时后加生长因子，6小时后荧光素酶活性升到基线的7倍；先加化合物X再加生长因子，活性只有基线的1.2倍。第二线：免疫印迹显示，单加生长因子15分钟后受体自身磷酸化升到8倍、MAPK磷酸化升到9倍、Akt磷酸化升到6倍；先加X再加生长因子，受体自身磷酸化仍为7.5倍，MAPK磷酸化只有1.1倍，Akt磷酸化仍为6倍。第三线：流式测DNA含量，单加生长因子组G1期由45%降到32%、S期由30%升到48%；先加X组G1期由45%升到78%、S期由30%降到9%。另设一组先加X再加生长因子并同时导入组成性活化的MEK突变体，荧光素酶活性回到6倍，S期比例回到44%。","vignette_title":"情景 4：三份数据把阻断点夹在了哪里","gidx":1,"gn":5,"anchor":"MAPK磷酸化只有1.1倍"},{"id":"gc22-04-3","ch":25,"part":5,"tag":"方案","stem":"组成性活化的MEK突变体能挽救报告基因活性与S期比例，这一结果说明","options":["化合物X直接抑制MEK的催化活性，与上游的Ras无关","化合物X的抑制作用发生在MAPK入核之后的环节","组成性活化的MEK绕过了受体与G蛋白的偶联环节","报告基因活性的回升说明X对细胞没有其他毒性作用","化合物X阻断的位置在MEK及其上游，下游可被绕过"],"answer":4,"explain":"E 对：组成性活化的 MEK 能绕过上游环节，使报告基因活性与 S 期比例基本恢复，说明 X 的作用点在 MEK 或其上游，而 MEK 以下的下游环节仍可被激活，这与第二线 p-MEK 下游的 MAPK 磷酸化下降相吻合。A 把结论过度具体化为直接抑制 MEK 的催化活性，本实验无法区分 MEK 与其上游的 Raf；B 与挽救结果矛盾；C 错在该受体的信号经 Ras 传递而不经 G 蛋白；D 与挽救实验要回答的问题无关。","type":"A1","group":"c22-04","kind":"experiment","chs":[25,26,4],"vignette":"研究生小赵用一株需要表皮生长因子刺激才能进入S期的人上皮细胞做三线联合测定。第一线：把含CyclinD启动子驱动荧光素酶的质粒转入细胞，无血清培养24小时后加生长因子，6小时后荧光素酶活性升到基线的7倍；先加化合物X再加生长因子，活性只有基线的1.2倍。第二线：免疫印迹显示，单加生长因子15分钟后受体自身磷酸化升到8倍、MAPK磷酸化升到9倍、Akt磷酸化升到6倍；先加X再加生长因子，受体自身磷酸化仍为7.5倍，MAPK磷酸化只有1.1倍，Akt磷酸化仍为6倍。第三线：流式测DNA含量，单加生长因子组G1期由45%降到32%、S期由30%升到48%；先加X组G1期由45%升到78%、S期由30%降到9%。另设一组先加X再加生长因子并同时导入组成性活化的MEK突变体，荧光素酶活性回到6倍，S期比例回到44%。","vignette_title":"情景 4：三份数据把阻断点夹在了哪里","gidx":3,"gn":5,"anchor":"组成性活化的MEK突变体"},{"id":"gc22-04-5","ch":25,"part":5,"tag":"判读","stem":"关于本实验三线指标的联合判读，下列判断正确的是（X 型多选）","options":["受体自身磷酸化未下降，可排除X直接抑制受体激酶","报告基因反映启动子活性，不能直接代表蛋白含量","仅凭流式的周期分布即可把阻断点定位到MAPK","Akt磷酸化未改变，说明X对PI3K-Akt通路影响不大","三条指标互相印证，即可证明X的直接靶点是MAPK"],"answer":[0,1,3],"explain":"答案 ABD。A 对：受体自身磷酸化仍为 7.5 倍，说明 X 没有抑制受体的激酶活性，可排除受体层面的阻断。B 对：报告基因检测的是启动子驱动下游基因表达的能力，反映转录活性，不能直接代表相应蛋白的含量。D 对：Akt 磷酸化仍为 6 倍，说明 X 对 PI3K-Akt 通路影响不大，两条通路被区分开来。C 错：流式只反映各时相细胞的比例，单独使用无法把阻断点定位到某一步。E 错：组成性活化的 MEK 能挽救结果只说明阻断点在 MEK 及其上游，不能证明直接靶点就是 MAPK 本身。","type":"X","group":"c22-04","kind":"experiment","chs":[25,26,4],"vignette":"研究生小赵用一株需要表皮生长因子刺激才能进入S期的人上皮细胞做三线联合测定。第一线：把含CyclinD启动子驱动荧光素酶的质粒转入细胞，无血清培养24小时后加生长因子，6小时后荧光素酶活性升到基线的7倍；先加化合物X再加生长因子，活性只有基线的1.2倍。第二线：免疫印迹显示，单加生长因子15分钟后受体自身磷酸化升到8倍、MAPK磷酸化升到9倍、Akt磷酸化升到6倍；先加X再加生长因子，受体自身磷酸化仍为7.5倍，MAPK磷酸化只有1.1倍，Akt磷酸化仍为6倍。第三线：流式测DNA含量，单加生长因子组G1期由45%降到32%、S期由30%升到48%；先加X组G1期由45%升到78%、S期由30%降到9%。另设一组先加X再加生长因子并同时导入组成性活化的MEK突变体，荧光素酶活性回到6倍，S期比例回到44%。","vignette_title":"情景 4：三份数据把阻断点夹在了哪里","gidx":5,"gn":5,"anchor":"受体自身磷酸化仍为7.5倍"},{"id":"gc25-02-1","ch":25,"part":5,"tag":"机制","stem":"LIF 与膜受体结合后使 STAT3 被磷酸化并转入核内，完成这一磷酸化的是","options":["由受体自身携带的酪氨酸激酶结构域完成磷酸化","由活化后的 G 蛋白 α 亚基直接完成磷酸化","由与受体结合的非受体型酪氨酸激酶 JAK 完成","由 cAMP 激活的蛋白激酶 A 完成磷酸化","由磷脂酶 C 水解膜脂后生成的产物完成"],"answer":2,"explain":"C 对：细胞因子受体本身没有激酶活性，LIF 与受体结合使受体二聚化后，与受体结合的 JAK 被激活，JAK 使受体及 STAT3 的酪氨酸残基磷酸化，STAT3 再二聚化转入核内调控基因转录。A 是受体型酪氨酸激酶的特点，与细胞因子受体不符；B 与 G 蛋白无关；D 蛋白激酶 A 是丝氨酸与苏氨酸激酶，位于 cAMP 通路；E 磷脂酶 C 生成 IP3 与 DAG，不直接磷酸化 STAT3。","type":"A1","group":"c25-02","kind":"mechanism","chs":[27,28,25],"vignette":"把小鼠胚胎干细胞分成三组培养：甲组培养液中含白血病抑制因子（LIF）；乙组撤除 LIF；丙组撤除 LIF，同时导入一个持续活化的 STAT3 突变体。培养 5 天后，甲组与丙组仍呈碱性磷酸酶染色阳性，Oct4 与 Sox2 的转录本维持在高水平，形成的克隆能连续传代；乙组 Oct4 转录本降到原来的 15%，细胞内出现三个胚层的标志分子，克隆变为铺展的扁平细胞。检测显示，LIF 作用 10 分钟后 STAT3 在酪氨酸残基上被磷酸化，由细胞质转入细胞核；甲组 Oct4 基因启动子区的 H3K4 三甲基化水平高、DNA 甲基化只有 12%，乙组同一区域的 H3K27 三甲基化升高、DNA 甲基化升到 68%。乙组在撤除 LIF 第 5 天再补回 LIF，Oct4 的转录本只回升到原来的 20%。","vignette_title":"情景 2：把干性开关按下去以后","gidx":1,"gn":5,"anchor":"STAT3 在酪氨酸残基上被磷酸化"},{"id":"gc25-04-1","ch":25,"part":5,"tag":"判读","stem":"乙组受体自身磷酸化仍为 590% 而 Akt 磷酸化只有 90%，据此判断 PI3K 抑制剂阻断的环节是","options":["受体与胰岛素的结合受阻，使受体不能发生自身磷酸化","受体自身磷酸化之后、Akt 磷酸化之前的信号传递环节","Akt 磷酸化之后的下游环节，不影响 Akt 自身的磷酸化","糖原合酶的去磷酸化，使糖原合酶停留在低活性状态","胰岛素的降解，使培养液中胰岛素的浓度迅速下降"],"answer":1,"explain":"B 对：乙组受体自身磷酸化基本不受影响而 Akt 磷酸化明显下降，说明阻断点位于受体之后、Akt 之前，即 PI3K 催化 PIP2 生成 PIP3 这一步。A 与受体自身磷酸化仍为 590% 矛盾；C 阻断点在 Akt 上游，否则 Akt 磷酸化不会下降；D 糖原合酶的变化是下游后果而不是阻断环节；E 若胰岛素被降解，受体自身磷酸化也会同步下降。","type":"A1","group":"c25-04","kind":"experiment","chs":[1,3,25,11],"vignette":"为追踪胰岛素把葡萄糖送进糖原的分子链条，研究生用同一批大鼠肝细胞做四组实验，各组细胞数与培养条件一致。甲组加 10 nmol/L 胰岛素；乙组先加 PI3K 抑制剂再加等量胰岛素；丙组先加蛋白磷酸酶抑制剂再加等量胰岛素；丁组不加药。孵育 30 分钟后测定，结果以丁组为 100%：甲组受体自身磷酸化升到 620%，Akt 磷酸化升到 480%，糖原合酶激酶磷酸化升到 510%，糖原合酶活性升到 260%，细胞内 UDP-葡萄糖升到 380%，¹⁴C 标记的葡萄糖掺入糖原的量升到 340%；乙组受体自身磷酸化仍为 590%，而 Akt 磷酸化只有 90%，糖原合酶活性为 100%；丙组 Akt 磷酸化与糖原合酶激酶磷酸化均与甲组接近，糖原合酶活性却只有 110%。另一组细胞在胰岛素作用前导入一个不能被 Akt 磷酸化的糖原合酶激酶突变体，该突变体持续保持活性，其糖原合酶活性只有 120%，¹⁴C 掺入糖原只有 140%。","vignette_title":"情景 4：三个抑制剂与一条通往糖原的链条","gidx":1,"gn":6,"anchor":"受体自身磷酸化仍为"},{"id":"gc25-04-5","ch":25,"part":5,"tag":"方案","stem":"导入不能被 Akt 磷酸化的糖原合酶激酶突变体后糖原合酶活性只有 120%，这一结果的判别力在于","options":["说明胰岛素对糖原合成的调节与糖原合酶激酶没有关系","说明该突变体使糖原合酶的表达量下降，故活性不能升高","说明糖原合酶激酶可以直接催化糖原合酶去磷酸化而使其激活","说明胰岛素通过 Ras-MAPK 通路调节糖原合酶的活性","说明糖原合酶激酶被 Akt 磷酸化而失活是糖原合酶激活的环节"],"answer":4,"explain":"E 对：突变体不能被 Akt 磷酸化因而持续保持活性，糖原合酶就不能被激活，这一失落性结果把链条钉在糖原合酶激酶上——Akt 使该激酶磷酸化并失活，是该酶激活的必要环节。A 结果恰恰说明二者有关；B 引入突变改变的是激酶的磷酸化位点，不涉及糖原合酶的表达量；C 该激酶使糖原合酶磷酸化而抑制它，方向相反；D 本实验的阻断点是 PI3K-Akt 通路。","type":"A1","group":"c25-04","kind":"experiment","chs":[1,3,25,11],"vignette":"为追踪胰岛素把葡萄糖送进糖原的分子链条，研究生用同一批大鼠肝细胞做四组实验，各组细胞数与培养条件一致。甲组加 10 nmol/L 胰岛素；乙组先加 PI3K 抑制剂再加等量胰岛素；丙组先加蛋白磷酸酶抑制剂再加等量胰岛素；丁组不加药。孵育 30 分钟后测定，结果以丁组为 100%：甲组受体自身磷酸化升到 620%，Akt 磷酸化升到 480%，糖原合酶激酶磷酸化升到 510%，糖原合酶活性升到 260%，细胞内 UDP-葡萄糖升到 380%，¹⁴C 标记的葡萄糖掺入糖原的量升到 340%；乙组受体自身磷酸化仍为 590%，而 Akt 磷酸化只有 90%，糖原合酶活性为 100%；丙组 Akt 磷酸化与糖原合酶激酶磷酸化均与甲组接近，糖原合酶活性却只有 110%。另一组细胞在胰岛素作用前导入一个不能被 Akt 磷酸化的糖原合酶激酶突变体，该突变体持续保持活性，其糖原合酶活性只有 120%，¹⁴C 掺入糖原只有 140%。","vignette_title":"情景 4：三个抑制剂与一条通往糖原的链条","gidx":5,"gn":6,"anchor":"糖原合酶活性只有 120%"},{"id":"gc5-03-1","ch":25,"part":5,"tag":"识别","stem":"β2肾上腺素受体及其所激活的效应器是","options":["单次跨膜的受体酪氨酸激酶，经Ras激活MAPK级联","胞内受体，配体进入细胞后作为转录因子起效","七次跨膜的G蛋白偶联受体，经Gs激活腺苷酸环化酶","七次跨膜的离子通道型受体，配体结合后钙内流","单次跨膜受体，配体结合后经JAK激活STAT"],"answer":2,"explain":"C对：情景显示该受体被占据后Gs的α亚基活化腺苷酸环化酶、cAMP升高、PKA激活，是典型的七次跨膜G蛋白偶联受体。A错：受体酪氨酸激酶为单次跨膜，主要经Ras-MAPK与PI3K-Akt通路，不由Gs激活腺苷酸环化酶。D错：离子通道型受体直接开启离子通道，不通过腺苷酸环化酶。B错：胞内受体为脂溶性激素受体，其效应缓慢而持久，不会在2分钟内使cAMP升高约6倍。E错：JAK-STAT是细胞因子受体的通路，β2受体不属此类。","type":"A1","group":"c5-03","kind":"mechanism","chs":[25,4],"vignette":"支气管平滑肌细胞膜上分布着几种不同的受体。沙丁胺醇占据β2肾上腺素受体后，Gs的α亚基活化腺苷酸环化酶，胞内cAMP在2分钟内升高约6倍，PKA被激活，肌细胞舒张；乙酰胆碱占据M3受体后，经Gq激活磷脂酶Cβ，水解膜脂中的PIP2生成IP3与DAG，胞内钙离子升高，肌细胞收缩。该细胞膜上还有胰岛素受体；胞内的糖皮质激素受体也参与调节。用霍乱毒素处理后，Gs的α亚基被ADP-核糖基化，cAMP持续升高到基线的12倍。相邻的副交感神经节细胞上，乙酰胆碱作用于烟碱型受体，该受体本身就是配体门控的阳离子通道，结合后钠离子内流，细胞在20毫秒内去极化。","vignette_title":"情景 3：同一张膜上的几种受体","gidx":1,"gn":6,"anchor":"沙丁胺醇占据β2肾上腺素受体后"},{"id":"gc5-03-3","ch":25,"part":5,"tag":"机制","stem":"与β2受体相比，同一细胞上糖皮质激素受体的信号转导特点是","options":["受体激活后使靶蛋白磷酸化，作用迅速而短暂","配体为脂溶性激素，受体作为转录因子调控基因表达","配体为水溶性多肽，须与膜表面受体结合后入胞","受体位于膜上，配体结合后立即引起胞内钙升高","配体与受体结合后经G蛋白激活腺苷酸环化酶的活性"],"answer":1,"explain":"B对：糖皮质激素为脂溶性激素，可直接进入细胞与胞内受体结合，受体作为转录因子调控基因表达，效应缓慢而持久。C错：水溶性多肽须与细胞膜表面受体结合，并不进入细胞。D错：胞内受体不位于膜上，也不会引起胞内钙离子立即升高。E错：经G蛋白激活腺苷酸环化酶是β2受体等膜受体的方式。A错：使靶蛋白磷酸化、作用迅速而短暂，是膜受体经第二信使级联的典型特点，与核受体相反。","type":"A1","group":"c5-03","kind":"mechanism","chs":[25,4],"vignette":"支气管平滑肌细胞膜上分布着几种不同的受体。沙丁胺醇占据β2肾上腺素受体后，Gs的α亚基活化腺苷酸环化酶，胞内cAMP在2分钟内升高约6倍，PKA被激活，肌细胞舒张；乙酰胆碱占据M3受体后，经Gq激活磷脂酶Cβ，水解膜脂中的PIP2生成IP3与DAG，胞内钙离子升高，肌细胞收缩。该细胞膜上还有胰岛素受体；胞内的糖皮质激素受体也参与调节。用霍乱毒素处理后，Gs的α亚基被ADP-核糖基化，cAMP持续升高到基线的12倍。相邻的副交感神经节细胞上，乙酰胆碱作用于烟碱型受体，该受体本身就是配体门控的阳离子通道，结合后钠离子内流，细胞在20毫秒内去极化。","vignette_title":"情景 3：同一张膜上的几种受体","gidx":3,"gn":6,"anchor":"胞内的糖皮质激素受体"},{"id":"gc5-03-4","ch":25,"part":5,"tag":"判读","stem":"霍乱毒素处理后cAMP持续升高到基线的12倍，其机制是","options":["Gs的α亚基被ADP-核糖基化，GTP酶活性丧失而持续活化","Gi的α亚基被ADP-核糖基化，对腺苷酸环化酶的抑制被解除","G蛋白的βγ亚基直接激活腺苷酸环化酶而使其持续活化","磷酸二酯酶被抑制，cAMP的水解速度明显减慢而堆积","PKA的调节亚基被降解，催化亚基不再需要cAMP"],"answer":0,"explain":"A对：情景给出霍乱毒素使Gs的α亚基被ADP-核糖基化，其GTP酶活性丧失，α亚基持续处于活化状态，腺苷酸环化酶被持续激活，cAMP因而大幅升高。B错：霍乱毒素修饰的是Gs，修饰Gi的是百日咳毒素，靶点被偷换。D错：抑制磷酸二酯酶也能升高cAMP，但情景给出的机制是对Gsα亚基的修饰。C错：起主要作用的是α亚基，βγ亚基不直接激活腺苷酸环化酶。E错：霍乱毒素不降解PKA的调节亚基，且PKA活化仍需cAMP结合。","type":"A1","group":"c5-03","kind":"mechanism","chs":[25,4],"vignette":"支气管平滑肌细胞膜上分布着几种不同的受体。沙丁胺醇占据β2肾上腺素受体后，Gs的α亚基活化腺苷酸环化酶，胞内cAMP在2分钟内升高约6倍，PKA被激活，肌细胞舒张；乙酰胆碱占据M3受体后，经Gq激活磷脂酶Cβ，水解膜脂中的PIP2生成IP3与DAG，胞内钙离子升高，肌细胞收缩。该细胞膜上还有胰岛素受体；胞内的糖皮质激素受体也参与调节。用霍乱毒素处理后，Gs的α亚基被ADP-核糖基化，cAMP持续升高到基线的12倍。相邻的副交感神经节细胞上，乙酰胆碱作用于烟碱型受体，该受体本身就是配体门控的阳离子通道，结合后钠离子内流，细胞在20毫秒内去极化。","vignette_title":"情景 3：同一张膜上的几种受体","gidx":4,"gn":6,"anchor":"cAMP持续升高到基线的12倍"},{"id":"gc5-03-5","ch":25,"part":5,"tag":"判读","stem":"关于上述几种受体的信号转导，下列判断正确的是（X 型多选）","options":["烟碱型受体本身是离子通道，不依赖G蛋白传递信号","磷酸二酯酶水解cAMP，使第二信使浓度迅速下降","G蛋白α亚基的GTP酶活性是信号终止的重要机制","同一种细胞可表达多种受体，对同一刺激产生不同效应","胰岛素受体是七次跨膜的G蛋白偶联受体"],"answer":[0,1,2,3],"explain":"答案 ABCD。D对：同一细胞可同时表达β2、M3、胰岛素等多种受体，同一配体经不同受体可产生相反效应，如平滑肌舒张与收缩。C对：α亚基具GTP酶活性，水解GTP后与βγ亚基重新结合而失活，这是信号终止的重要机制。B对：磷酸二酯酶水解cAMP与cGMP，使第二信使浓度迅速下降。A对：烟碱型受体属离子通道型受体，配体结合后直接开放阳离子通道使细胞去极化，不通过G蛋白。E错：胰岛素受体是单次跨膜的受体酪氨酸激酶，配体结合后二聚化并自身磷酸化，并非七次跨膜的G蛋白偶联受体。","type":"X","group":"c5-03","kind":"mechanism","chs":[25,4],"vignette":"支气管平滑肌细胞膜上分布着几种不同的受体。沙丁胺醇占据β2肾上腺素受体后，Gs的α亚基活化腺苷酸环化酶，胞内cAMP在2分钟内升高约6倍，PKA被激活，肌细胞舒张；乙酰胆碱占据M3受体后，经Gq激活磷脂酶Cβ，水解膜脂中的PIP2生成IP3与DAG，胞内钙离子升高，肌细胞收缩。该细胞膜上还有胰岛素受体；胞内的糖皮质激素受体也参与调节。用霍乱毒素处理后，Gs的α亚基被ADP-核糖基化，cAMP持续升高到基线的12倍。相邻的副交感神经节细胞上，乙酰胆碱作用于烟碱型受体，该受体本身就是配体门控的阳离子通道，结合后钠离子内流，细胞在20毫秒内去极化。","vignette_title":"情景 3：同一张膜上的几种受体","gidx":5,"gn":6,"anchor":"该受体本身就是配体门控的阳离子通道"},{"id":"gc5-03-6","ch":25,"part":5,"tag":"机制","stem":"该细胞膜上的胰岛素受体与β2受体相比，其信号转导特点是","options":["具有酪氨酸激酶活性，配体结合后自身磷酸化","配体结合后经JAK-STAT通路传递信号","与配体结合后经Gs蛋白活化腺苷酸环化酶","配体入胞后与胞内受体结合，调控基因转录","为七次跨膜的受体，通过G蛋白偶联传递信号"],"answer":0,"explain":"A对：胰岛素受体属受体酪氨酸激酶，自身具有酪氨酸激酶活性，配体结合后受体二聚化并发生自身磷酸化，进而经Ras-MAPK、PI3K-Akt等通路传递信号。C错：经Gs活化腺苷酸环化酶是β2受体等G蛋白偶联受体的方式。E错：胰岛素受体为单次跨膜受体，不是七次跨膜受体。D错：胰岛素是水溶性多肽，不进入细胞与胞内受体结合。B错：JAK-STAT是细胞因子受体通路，JAK为非受体型酪氨酸激酶，不由胰岛素受体直接启动。","type":"A1","group":"c5-03","kind":"mechanism","chs":[25,4],"vignette":"支气管平滑肌细胞膜上分布着几种不同的受体。沙丁胺醇占据β2肾上腺素受体后，Gs的α亚基活化腺苷酸环化酶，胞内cAMP在2分钟内升高约6倍，PKA被激活，肌细胞舒张；乙酰胆碱占据M3受体后，经Gq激活磷脂酶Cβ，水解膜脂中的PIP2生成IP3与DAG，胞内钙离子升高，肌细胞收缩。该细胞膜上还有胰岛素受体；胞内的糖皮质激素受体也参与调节。用霍乱毒素处理后，Gs的α亚基被ADP-核糖基化，cAMP持续升高到基线的12倍。相邻的副交感神经节细胞上，乙酰胆碱作用于烟碱型受体，该受体本身就是配体门控的阳离子通道，结合后钠离子内流，细胞在20毫秒内去极化。","vignette_title":"情景 3：同一张膜上的几种受体","gidx":6,"gn":6,"anchor":"该细胞膜上还有胰岛素受体"},{"id":"gc8-01-1","ch":25,"part":5,"tag":"机制","stem":"肾上腺素与胰高血糖素在肝细胞内升高 cAMP 的共同环节是","options":["与膜受体结合后经 Gi 抑制腺苷酸环化酶，使 cAMP 降低","与膜受体结合后自身磷酸化，经 Ras-MAPK 通路传递信号","与胞内受体结合后作为转录因子直接调控基因转录","与膜受体结合后直接激活磷脂酶 C，生成 IP3 与 DAG","与膜受体结合后经 Gs 激活腺苷酸环化酶，使 cAMP 升高"],"answer":4,"explain":"E 对：肾上腺素与胰高血糖素都作用于肝细胞膜受体，经 Gs 激活腺苷酸环化酶使 cAMP 升高、PKA 活化，与情景中 cAMP 由 0.5 升至 4.0 μmol/L 吻合。B 把 Gs 与 Gi 的方向写反，Gi 是抑制该酶。B 错在 Ras-MAPK 属受体酪氨酸激酶通路，这两种激素的受体不是 RTK，也不发生自身磷酸化。C 错在二者受体都在细胞膜上，脂溶性配体才走胞内受体。D 错在磷脂酶 C-IP3-DAG 属 Gq 通路，与本例 cAMP 升高不符。","type":"A1","group":"c8-01","kind":"mechanism","chs":[25,16,11,12],"vignette":"一名青年因车祸大出血急诊入院。血浆肾上腺素升至正常的 12 倍，胰高血糖素升至 3 倍，胰岛素降至正常的四分之一；血糖 11.2 mmol/L，血游离脂肪酸由 0.4 升至 1.8 mmol/L，血酮体 1.1 mmol/L，尿氮排出明显增多。肝细胞内 cAMP 由 0.5 升至 4.0 μmol/L，PKA 被活化；果糖-2,6-二磷酸由 12 降至 2 nmol/g，糖原磷酸化酶活性升至 90%，糖原合酶活性降至 10%。","vignette_title":"情景 1：一个信号，同时开三条流水线","gidx":1,"gn":6,"anchor":"肾上腺素升至正常的 12 倍"},{"id":"gc9-02-3","ch":25,"part":5,"tag":"机制","stem":"治疗浓度维A酸能够作用于该受体，与维A酸的哪一特点有关","options":["离子型配体，与配体门控离子通道结合后开放通道","脂溶性配体，可穿过细胞膜与胞内受体结合","水溶性配体，与细胞膜表面的七次跨膜受体结合","亲水性配体，与受体酪氨酸激酶结合并激活 Ras","气体型配体，扩散入细胞后激活鸟苷酸环化酶"],"answer":1,"explain":"B 对：教材指出核受体的配体多为脂溶性（类固醇激素、甲状腺激素等），可穿过细胞膜与胞内受体结合，受体作为转录因子直接调控基因转录，效应缓慢而持久，与本例用药数周才见效相符。C 错：七次跨膜受体是 GPCR，其配体多为水溶性，不适用于维A酸。D 错：受体酪氨酸激酶通路走 Ras-MAPK，与核受体通路不同。A 错：配体门控离子通道介导快速信号，不负责慢速的分化调控。E 错：气体信号分子如 NO 激活的是鸟苷酸环化酶，与维A酸无关。","type":"A1","group":"c9-02","kind":"mechanism","chs":[22,27,25],"vignette":"一名急性早幼粒细胞白血病患者的外周血中，异常早幼粒细胞占 85%，这些细胞停滞在该阶段不再成熟。患者的维A酸受体 α（RARα）基因因染色体易位形成异常融合受体：它是一种反式作用因子，在生理浓度维A酸下仍与共阻遏物结合，并招募组蛋白去乙酰化酶，使粒细胞分化相关基因启动子区的乙酰化水平偏低、转录受抑。给予治疗浓度全反式维A酸（维A酸属脂溶性配体，可直接穿过细胞膜进入细胞）后，融合受体构象改变，释放共阻遏物、招募共激活物与组蛋白乙酰转移酶，靶基因重新转录。用药 4 周后，外周血早幼粒细胞降至 5%，中性粒细胞逐步恢复。","vignette_title":"情景 2：把抑制器换成激活器","gidx":3,"gn":5,"anchor":"维A酸属脂溶性配体"},{"ch":25,"part":5,"tag":"细胞通信方式","stem":"细胞通信方式可以类比人类交流方式。下列类比中最恰当的是：","options":["自言自语——旁分泌信号","家庭聚餐时亲戚间互相问候——旁分泌信号","高铁站广场上的列车晚点广播通知——突触信号传导","与远方的朋友打电话——自分泌信号","突触前膜释放神经递质作用于突触后膜——内分泌信号"],"answer":1,"explain":"亲戚间问候是邻近细胞间的作用，属旁分泌；自言自语、广场广播、打电话分别对应自分泌、内分泌和远距离信号。","type":"A1","id":"c25-22b2d6e7"},{"ch":25,"part":5,"tag":"PKA突变","stem":"PKA 全酶由催化亚基与调节亚基组成，调节亚基结合 cAMP 后释放催化亚基。若突变 X 导致 PKA 永久激活，下列解释最合理的是：","options":["X 突变使调节亚基与 cAMP 亲和力下降，催化亚基被持续抑制","X 突变使催化亚基被泛素化降解，PKA 活性丧失","X 突变使调节亚基与 cAMP 结合能力增强，PKA 更易激活但仍需 cAMP","X 突变破坏了调节亚基对催化亚基的抑制，催化亚基无需 cAMP 结合即持续活化","X 突变使细胞内磷酸二酯酶活性升高，cAMP 被持续水解"],"answer":3,"explain":"永久激活说明调节亚基丧失抑制催化亚基的能力；而丧失 cAMP 结合能力的突变（Y）才使 PKA 无法被激活。","type":"A1","id":"c25-046ebdba"},{"ch":25,"part":5,"tag":"受体类型","stem":"关于细胞受体类型及其特点的叙述，正确的是：","options":["核受体多为脂溶性配体（如类固醇激素、甲状腺激素）的受体，配体入胞后与受体结合，受体作为转录因子直接调控基因转录，效应缓慢而持久","G 蛋白偶联受体为单次跨膜受体，与配体结合后直接激活腺苷酸环化酶","受体酪氨酸激酶与配体结合后自身磷酸化，主要通过 cAMP 途径传递信号","离子通道型受体均为七次跨膜受体，属于 G 蛋白偶联受体家族","所有的信号分子都必须先与细胞膜表面受体结合才能发挥作用"],"answer":0,"explain":"核受体在胞质或核内，配体脂溶性、效应慢而持久；GPCR 为七次跨膜，RTK 主要走 Ras-MAPK 通路。","type":"A1","id":"c25-f801ad2a"},{"ch":25,"part":5,"tag":"第二信使","stem":"下列第二信使与其生成（催化）酶的对应，正确的是：","options":["cAMP 由 cGMP 经磷酸二酯酶水解生成","cGMP 由腺苷酸环化酶催化 ATP 生成","IP3 与 DAG 由磷脂酶 C 水解 PIP2 生成","DAG 由磷脂酶 A2 水解 PIP2 生成","IP3 由磷脂酶 C 水解磷脂酰丝氨酸生成"],"answer":2,"explain":"磷脂酶 C 水解 PIP2 生成 IP3 和 DAG；cAMP 由腺苷酸环化酶催化 ATP 生成，cGMP 由鸟苷酸环化酶催化 GTP 生成。","type":"A1","id":"c25-138c6bdd"},{"ch":25,"part":5,"tag":"G蛋白亚型","stem":"关于 G 蛋白偶联受体介导的信号转导，下列叙述正确的是：","options":["Gs 的 α 亚基活化后抑制腺苷酸环化酶，使 cAMP 降低","Gi 的 α 亚基活化后激活腺苷酸环化酶，使 cAMP 升高","霍乱毒素使 Gi 的 α 亚基 ADP-核糖基化并持续激活，导致 cAMP 降低","G 蛋白的 βγ 亚基只起固定 α 亚基的作用，不参与信号传递","Gq 活化后激活磷脂酶 Cβ，水解 PIP2 生成 IP3 和 DAG，使胞质 Ca2+ 升高"],"answer":4,"explain":"Gs 激活、Gi 抑制腺苷酸环化酶；霍乱毒素修饰的是 Gs；Gq 走 PLCβ-IP3/DAG-Ca2+ 通路，βγ 亚基亦可调节效应器。","type":"A1","id":"c25-3c5f74cd"},{"ch":25,"part":5,"tag":"RTK通路","stem":"关于受体酪氨酸激酶（RTK）介导的 Ras-MAPK 通路，下列叙述正确的是：","options":["Ras 是抑癌基因产物，其活化型突变使该通路信号持续关闭","SOS 是 Ras 的 GTP 酶激活蛋白（GAP），与 Ras 结合后使其失活","配体结合使 RTK 二聚化并发生自身磷酸化，GRB2 通过 SH2 结构域结合磷酸化酪氨酸位点，再经 SOS 激活 Ras","Ras 与 GDP 结合时为活化状态，与 GTP 结合时为失活状态","该通路的终末激酶 MAPK 入核后磷酸化 JAK，进而激活 STAT"],"answer":2,"explain":"Ras 是原癌基因产物、GTP 结合型为活化态；SOS 是 GEF 而非 GAP；JAK-STAT 属于细胞因子受体通路。","type":"A1","id":"c25-671fdfe3"},{"ch":25,"part":5,"tag":"JAK通路","stem":"关于 JAK-STAT 信号通路，下列叙述正确的是：","options":["细胞因子与受体结合使受体二聚化，JAK 被激活并使受体磷酸化，STAT 经 SH2 结构域结合后被 JAK 磷酸化，二聚化后转入核内调控基因转录","JAK 是受体分子自身携带的酪氨酸激酶结构域，属受体型酪氨酸激酶","STAT 是一种丝氨酸/苏氨酸激酶，可直接磷酸化细胞因子受体","该通路通过 G 蛋白偶联受体启动，与细胞因子受体无关","干扰素、白细胞介素等细胞因子的受体属于受体酪氨酸激酶家族"],"answer":0,"explain":"JAK 是非受体型酪氨酸激酶，与细胞因子受体结合发挥激酶作用；STAT 是信号转导与转录激活因子，不是激酶。","type":"A1","id":"c25-ca056121"},{"ch":25,"part":5,"tag":"信号与疾病","stem":"关于信号转导异常与药物靶点，下列叙述正确的是：","options":["百日咳毒素使 Gi 的 α 亚基持续活化，导致 cAMP 水平升高","霍乱毒素作用于 Gi 的 α 亚基，使 cAMP 水平降低而致病","曲妥珠单抗是酪氨酸激酶抑制剂，通过竞争 ATP 结合位点抑制 HER2","霍乱毒素使 Gs 的 α 亚基 ADP-核糖基化、GTP 酶活性丧失，腺苷酸环化酶持续激活，cAMP 大量升高引起小肠分泌性腹泻","伊马替尼通过阻断 G 蛋白偶联受体发挥抗白血病作用"],"answer":3,"explain":"霍乱毒素修饰 Gs、百日咳毒素抑制 Gi；曲妥珠单抗是抗 HER2 单抗，伊马替尼是抑制 BCR-ABL 的酪氨酸激酶抑制剂。","type":"A1","id":"c25-24adfa0f"},{"ch":25,"part":5,"tag":"接触依赖信号","stem":"接触依赖性信号转导（如 Notch-Delta 信号）区别于其他细胞通信方式的根本特点是：","options":["信号分子被分泌到细胞外液中，经血液运输至远隔靶细胞","信号分子经组织液扩散，只作用于紧邻的同种细胞","信号分子锚定于信号细胞膜上，必须与相邻细胞的膜受体直接接触才能传递信号","信号细胞与靶细胞之间存在缝隙连接，仅允许小分子无机离子通过","信号分子与受体结合后被靶细胞内吞，在溶酶体中被降解"],"answer":2,"explain":"接触依赖性信号的配体是膜结合分子，不经分泌释放，只在细胞直接接触时激活相邻细胞受体。","type":"A1","id":"c25-6b4fd256"},{"ch":25,"part":5,"tag":"NO与cGMP","stem":"一氧化氮（NO）作为气体信号分子使血管平滑肌舒张的机制是：","options":["NO 进入平滑肌细胞激活可溶性鸟苷酸环化酶，使 cGMP 升高，引起肌细胞舒张","NO 与细胞膜受体结合后经 Gs 激活腺苷酸环化酶，使 cAMP 升高","NO 直接抑制磷脂酶 C，使 IP3 生成减少、胞质 Ca2+ 浓度下降","NO 通过激活受体酪氨酸激酶启动 Ras-MAPK 通路","NO 由鸟苷酸环化酶催化 GTP 直接生成，无需经酶催化反应"],"answer":0,"explain":"NO 扩散入平滑肌细胞激活可溶性鸟苷酸环化酶，cGMP 升高使平滑肌舒张；硝酸甘油正是经此途径起效。","type":"A1","id":"c25-f9e03cc1"},{"ch":25,"part":5,"tag":"旁分泌","stem":"胰岛 D 细胞分泌的生长抑素经组织液扩散，作用于紧邻的 A 细胞和 B 细胞抑制其分泌。这种作用方式属于：","options":["自分泌","经典内分泌","旁分泌","接触依赖性信号","突触信号传导"],"answer":2,"explain":"分泌产物经局部扩散作用于邻近细胞为旁分泌；自分泌作用于自身，内分泌经血液运输至远隔靶细胞。","type":"A1","id":"c25-e5ee9e1c"},{"ch":25,"part":5,"tag":"胞内受体","stem":"与细胞膜表面受体介导的信号转导相比，胞内受体（核受体）信号转导的显著特点是：","options":["配体多为水溶性多肽激素，必须经膜受体才能把信息传入细胞","配体多为脂溶性类固醇激素或甲状腺激素，可直接进入细胞与受体结合，经调控基因转录产生缓慢而持久的效应","受体激活后主要通过第二信使级联反应引起靶蛋白构象改变，作用迅速而短暂","受体均位于细胞膜脂质双层中，以七次跨膜方式传递信号","受体活化后只能改变已存在酶的活性，不能影响基因表达"],"answer":1,"explain":"类固醇激素与甲状腺激素脂溶性，可穿过细胞膜与胞内受体结合，受体作为转录因子调控基因表达，效应慢而持久。","type":"A1","id":"c25-af1053bf"},{"ch":25,"part":5,"tag":"G蛋白效应器","stem":"不同 G 蛋白α亚基激活后作用于各自效应器的正确组合是：","options":["Gs 抑制腺苷酸环化酶使 cAMP 下降，Gi 激活腺苷酸环化酶使 cAMP 升高","Gq 激活腺苷酸环化酶，Gs 激活磷脂酶 C","Gi 激活磷脂酶 C 生成 IP3，Gq 抑制腺苷酸环化酶","Gs 激活腺苷酸环化酶使 cAMP 升高，Gi 抑制该酶，Gq 激活磷脂酶 Cβ 生成 IP3 和 DAG，使胞质 Ca2+ 升高","Gs、Gi 与 Gq 激活后均作用于同一效应器，仅作用强度不同"],"answer":3,"explain":"Gs 激活、Gi 抑制腺苷酸环化酶；Gq 经 PLCβ 水解 PIP2 生成 IP3 与 DAG，IP3 触发胞内钙释放。","type":"A1","id":"c25-da6ea5f3"},{"ch":25,"part":5,"tag":"PI3K-Akt","stem":"关于受体酪氨酸激酶经 PI3K-Akt 通路传递信号的过程，正确的是：","options":["PI3K 直接被 Ras-MAPK 通路的 ERK 磷酸化后产生 cAMP","PI3K 由 G 蛋白的 α 亚基直接激活，与 RTK 无关","Akt 被激活后通过水解 PIP3 产生 IP3 和 DAG 传递信号","PTEN 促进 PIP3 生成，是该通路的正性调节分子","RTK 自身磷酸化的酪氨酸位点募集 PI3K，催化 PIP2 生成 PIP3；PIP3 招募 PDK1 与 Akt 使 Akt 活化，促进细胞存活与生长"],"answer":4,"explain":"PI3K 催化 PIP2 生成 PIP3 激活 Akt；PTEN 把 PIP3 去磷酸化生成 PIP2，是该通路的负性调节分子。","type":"A1","id":"c25-2cdddbfd"},{"ch":25,"part":5,"tag":"信号终止","stem":"细胞信号转导的终止与负性调节机制不包括：","options":["G 蛋白α亚基具有 GTP 酶活性，水解 GTP 后与 βγ 亚基重新结合而失活","蛋白磷酸酶催化已磷酸化的信号蛋白去磷酸化，使信号终止","磷酸二酯酶水解 cAMP、cGMP，使第二信使浓度迅速下降","G 蛋白偶联受体被 GRK 磷酸化后与 β-arrestin 结合，发生脱敏与内化","小 GTP 结合蛋白的 GEF 加速 GTP 水解，GAP 促进 GDP 交换为 GTP"],"answer":4,"explain":"GEF 促进 GDP 换成 GTP 而激活小 G 蛋白，GAP 才加速 GTP 水解使其失活，该选项功能互换。","type":"A1","id":"c25-37be7275"},{"ch":25,"part":5,"tag":"信号靶点药物","stem":"关于作用于信号转导通路药物的靶点与机制，下列说法正确的是：","options":["西地那非抑制 cGMP 磷酸二酯酶（PDE5），使 cGMP 不被降解而维持血管平滑肌舒张","曲妥珠单抗通过竞争受体酪氨酸激酶的 ATP 结合位点抑制 HER2 的激酶活性","伊马替尼通过阻断 G 蛋白偶联受体治疗慢性髓性白血病","霍乱毒素使 Gi 的 α 亚基持续活化，cAMP 水平升高","百日咳毒素使 Gs 的 α 亚基 ADP-核糖基化并持续活化"],"answer":0,"explain":"西地那非抑制 PDE5、减少 cGMP 降解；曲妥珠单抗是抗 HER2 单抗，伊马替尼抑制 BCR-ABL 酪氨酸激酶。","type":"A1","id":"c25-4836750e"},{"id":"gc15-02-1","ch":26,"part":5,"tag":"机制","stem":"6小时取样时细胞已越过G1/S限制点，促成这一转换的分子事件是","options":["CDK1与CyclinB结合后，磷酸化核纤层并启动有丝分裂","APC/C活化后降解securin，使分离酶切割cohesin","CyclinD与CDK4/6磷酸化Rb并释放E2F","DNA损伤后p53稳定并诱导p21，使细胞阻滞在G1期","Cdc25去除CDK1的抑制性磷酸化，细胞进入G2/M"],"answer":2,"explain":"C 对：情景给出的Rb被磷酸化正是限制点前后的关键事件——CyclinD与CDK4/6活化后使Rb磷酸化，释放转录因子E2F，G1/S相关基因随之表达，细胞越过限制点。A 错：CDK1与CyclinB驱动的是G2/M转换，与本例的G1/S转换不是同一个关卡。B 错：APC/C在M期中期之后活化，降解securin使姐妹染色单体分离，属后期事件。D 错：p53与p21介导的是DNA损伤引起的阻滞，方向上是让细胞停下而不是越过限制点。E 错：Cdc25去除CDK1的抑制性磷酸化是进入M期的条件。","type":"A1","group":"c15-02","kind":"mechanism","chs":[18,26],"vignette":"研究者把培养的人细胞用无血清培养基培养48小时，使其停在G1期，随后换回含血清的培养基并在0、6、12、18小时取样。6小时起CyclinE相关激酶活性升高、Rb被磷酸化，细胞越过G1/S限制点；12小时流式细胞术显示DNA含量由2C升至4C。第二组细胞在换液的同时加入蛋白酶体抑制剂，p27不能被降解，18小时后DNA含量仍为2C。第三组细胞在G1期把前复制复合体的一个必需组分过量表达，结果S期之后仍不断出现DNA含量高于4C的细胞，Giemsa染色下可见染色体断裂。","vignette_title":"情景 2：一个周期里只许复制一次","gidx":1,"gn":5,"anchor":"细胞越过G1/S限制点"},{"id":"gc15-02-3","ch":26,"part":5,"tag":"机制","stem":"第二组细胞加入蛋白酶体抑制剂后，DNA含量停在2C的原因是","options":["抑制剂使CDK1不能被激活，细胞停留在G2期","抑制剂阻断DNA聚合酶的活性中心，复制无法起始","抑制剂使核糖核苷酸还原酶失活，dNTP供应不足","抑制剂使组蛋白合成停止，新合成的DNA不能组装","抑制剂使SCF无法把p27泛素化，CDK2持续受抑"],"answer":4,"explain":"E 对：p27是CDK抑制因子，须由SCF介导多聚泛素化后再由26S蛋白酶体降解，CDK2才能活化并越过G1/S；蛋白酶体受抑使p27堆积，细胞停在G1期，DNA含量仍为2C。A 错：CDK1的活化发生在G2/M关卡，与本例细胞停在G1期不符。B 错：该抑制剂作用于泛素-蛋白酶体途径，并不直接阻断聚合酶的活性中心。C 错：dNTP供应不足确实会阻碍复制，但那是核糖核苷酸还原酶受抑的结果，与本组处理无关。D 错：组蛋白合成在S期进行，细胞既然停在G1期，就没有新DNA需要包装。","type":"A1","group":"c15-02","kind":"mechanism","chs":[18,26],"vignette":"研究者把培养的人细胞用无血清培养基培养48小时，使其停在G1期，随后换回含血清的培养基并在0、6、12、18小时取样。6小时起CyclinE相关激酶活性升高、Rb被磷酸化，细胞越过G1/S限制点；12小时流式细胞术显示DNA含量由2C升至4C。第二组细胞在换液的同时加入蛋白酶体抑制剂，p27不能被降解，18小时后DNA含量仍为2C。第三组细胞在G1期把前复制复合体的一个必需组分过量表达，结果S期之后仍不断出现DNA含量高于4C的细胞，Giemsa染色下可见染色体断裂。","vignette_title":"情景 2：一个周期里只许复制一次","gidx":3,"gn":5,"anchor":"加入蛋白酶体抑制剂"},{"id":"gc18-01-4","ch":26,"part":5,"tag":"机制","stem":"乙株的Bcl-2表达量是甲株的9倍，与这一差异最相符的机制是","options":["Bcl-2基因发生点突变，编码的蛋白不易被降解","染色体易位把活跃的增强子带到Bcl-2旁侧","Bcl-2基因启动子被甲基化，转录水平随之升高","Bcl-2的两个等位基因先后失活，符合二次打击","Bcl-2蛋白在胞质中被泛素化后大量蓄积"],"answer":1,"explain":"B 对：染色体易位把活跃的增强子带到 Bcl-2 基因旁侧，使其转录异常升高，这是原癌基因激活的典型机制之一。A 错：点突变改变的是蛋白结构或活性，本例的 9 倍差异主要体现在表达量上。C 错：启动子甲基化通常抑制转录，方向与本例相反。D 错：Bcl-2 属抗凋亡的原癌基因，其作用是功能获得，二次打击学说是抑癌基因失活的规律。E 错：泛素化后的蛋白会被蛋白酶体降解，不会大量蓄积。","type":"A1","group":"c18-01","kind":"mechanism","chs":[29,26,6],"vignette":"实验室拿到两株人B淋巴瘤细胞，表面都表达Fas。加入同浓度的抗Fas抗体后，甲株6小时内78%的细胞出现膜出泡与核浓缩，乙株只有12%。检测显示：甲株在30分钟内出现caspase-8的活化片段，2小时后胞质中细胞色素c由0.3升到5.1ng/µg蛋白，同时检测到tBid；乙株的caspase-8同样被活化，胞质细胞色素c却始终低于0.4ng/µg，其Bcl-2表达量是甲株的9倍，Bcl-2基因旁侧因染色体易位而带有一段活跃的增强子。把乙株的Bcl-2用小干扰RNA下调后，凋亡率回到71%；在甲株中敲除Bax与Bak，凋亡率降到15%。两株细胞在凋亡后期都出现核纤层蛋白的切割片段。","vignette_title":"情景 1：同一个受体，两种结局","gidx":4,"gn":5,"anchor":"因染色体易位而带有一段活跃的增强子"},{"id":"gc18-04-4","ch":26,"part":5,"tag":"判读","stem":"甲组出现亚二倍体DNA峰，该峰代表","options":["DNA被切割后小片段丢失、含量低于2C的细胞","DNA复制完成后含量达到4C的G2期细胞","染色体数目加倍后含量为4C的多倍体细胞","处于S期正在合成DNA、含量在2C与4C间","细胞碎片与染料聚集体形成的假阳性信号"],"answer":0,"explain":"A 对：细胞发生凋亡后 DNA 被切割，小片段在染色时丢失，这部分细胞的 DNA 含量低于 2C，在流式图上表现为亚二倍体峰。B 错：G2 期细胞的 DNA 含量正好为 4C，不会低于 2C。C 错：多倍体细胞的含量更高，与亚二倍体峰的方向相反。D 错：S 期细胞的 DNA 含量介于 2C 与 4C 之间，并不低于 2C。E 错：碎片与染料聚集体可能形成干扰，但甲组同时有 42% 的活化 caspase-3 阳性细胞，不能把该峰解释为假阳性信号。","type":"A1","group":"c18-04","kind":"experiment","chs":[29,26,28],"vignette":"把同一株人结肠癌细胞分成四组：甲组加凋亡诱导剂，乙组反复冻融，丙组换入无血清培养液，丁组不加药。24小时后检测：甲组亚二倍体DNA峰由2%升到31%，活化caspase-3阳性率42%，线粒体膜电位下降的细胞占39%，PI阳性率11%；乙组PI阳性率86%，上清乳酸脱氢酶活性为对照的7倍，活化caspase-3阳性率4%；丙组LC3B-II与LC3B-I的比值由0.3升到2.1、p62由1.0降到0.4，PI阳性率9%，电镜下见双层膜结构包裹线粒体断片。随后四组各按每皿500个接种，10天后计数集落：甲组42个，乙组0个，丙组168个，丁组205个，即丙组克隆形成率约为丁组的82%、甲组约为20%。分选出的CD44阳性亚群克隆形成率为12%，阴性亚群为0.8%。","vignette_title":"情景 4：四组细胞与一次克隆计数","gidx":4,"gn":6,"anchor":"线粒体膜电位下降的细胞占39%"},{"id":"gc19-01-2","ch":26,"part":5,"tag":"机制","stem":"该肿瘤细胞 p53 缺失，对烷化剂反而更敏感，其机制是","options":["检查点失灵，细胞带着未修复的损伤进入 M 期而死亡","损伤被修复后重新进入周期，细胞分裂速度加快","细胞不再发生凋亡，损伤被耐受并逐步累积成突变","细胞周期缩短，更多细胞进入 G0 期躲开药物作用","p53 缺失使药物更易进入细胞，胞内浓度显著升高"],"answer":0,"explain":"A 对：p53 缺失使 G1/S 与 G2/M 检查点失灵，细胞带着未修复的断裂进入 M 期，分裂时染色体断裂而死亡，这正是检查点缺陷细胞对损伤更敏感的原因。B 错：损伤未修复时细胞难以顺利通过周期继续分裂。C 错：凋亡减少不等于损伤被耐受，检查点失灵恰恰使细胞更易死亡。D 错：周期缩短与进入 G0 期相互矛盾，且 G0 期细胞对烷化剂更耐受。E 错：p53 缺失改变的是损伤应答，而不是药物进入细胞的量。","type":"A1","group":"c19-01","kind":"mechanism","chs":[19,26,18],"vignette":"某化疗方案联合两种药物：一种烷化剂能与鸟嘌呤的 N7 位结合，并在 DNA 两条链之间形成交联，使复制与转录在损伤处停下；另一种药物抑制胸苷酸合成酶，使 dTMP 供应中断，S 期细胞的复制因原料不足而停步。用药后肿瘤明显缩小，但患者同时出现骨髓抑制与口腔黏膜溃疡。检测显示，肿瘤组织中处于 S 期的细胞约占 45%，而骨髓与黏膜上皮的更新同样活跃；该肿瘤细胞的 TP53 基因缺失，p53 蛋白检测不到，患者的造血细胞则 p53 功能完好。体外实验还显示，把培养细胞先阻滞在 G0 期，同样浓度的烷化剂几乎不引起死亡。","vignette_title":"情景 1：化疗药为何偏偏挑中正在复制的细胞","gidx":2,"gn":5,"anchor":"该肿瘤细胞的 TP53 基因缺失"},{"id":"gc19-01-3","ch":26,"part":5,"tag":"判读","stem":"患者的造血细胞 p53 功能完好，用药后它们最可能的结局是","options":["直接越过 G1/S 检查点，带着损伤迅速完成分裂","被阻滞在 M 期，因纺锤体无法正常装配而死亡","进入 G0 期静息，从此对药物的作用不再敏感","迅速启动坏死，细胞膜在数小时内即发生破裂","在 G1 期被 p21 阻滞，修复损伤后再决定命运"],"answer":4,"explain":"E 对：p53 功能完好时，损伤信号经 ATM 等激酶传到 p53，p21 抑制周期蛋白依赖性激酶，细胞停在 G1 期并获得修复时间，之后才决定继续增殖还是凋亡。A 错：p53 正常者不会无视 G1/S 检查点。B 错：纺锤体装配异常属于 M 期事件，本例损伤发生在复制与转录层面。C 错：进入 G0 期并非药物的主要后果，静息细胞对烷化剂更耐受。D 错：坏死多见于严重损伤或能量耗竭，不是本类损伤的首选结局。","type":"A1","group":"c19-01","kind":"mechanism","chs":[19,26,18],"vignette":"某化疗方案联合两种药物：一种烷化剂能与鸟嘌呤的 N7 位结合，并在 DNA 两条链之间形成交联，使复制与转录在损伤处停下；另一种药物抑制胸苷酸合成酶，使 dTMP 供应中断，S 期细胞的复制因原料不足而停步。用药后肿瘤明显缩小，但患者同时出现骨髓抑制与口腔黏膜溃疡。检测显示，肿瘤组织中处于 S 期的细胞约占 45%，而骨髓与黏膜上皮的更新同样活跃；该肿瘤细胞的 TP53 基因缺失，p53 蛋白检测不到，患者的造血细胞则 p53 功能完好。体外实验还显示，把培养细胞先阻滞在 G0 期，同样浓度的烷化剂几乎不引起死亡。","vignette_title":"情景 1：化疗药为何偏偏挑中正在复制的细胞","gidx":3,"gn":5,"anchor":"造血细胞则 p53 功能完好"},{"id":"gc19-04-3","ch":26,"part":5,"tag":"判读","stem":"综合 12 小时与 24 小时的流式结果，最合理的判断是","options":["细胞先发生凋亡，幸存者才堆积在 G2/M 期","细胞始终未被阻滞，凋亡率随处理时间而升高","细胞在凋亡之后重新进入周期，形成多倍体","细胞被阻滞在 G1/S 检查点，随后进入凋亡","细胞先在 G2/M 期被阻滞，修复失败者随后凋亡"],"answer":4,"explain":"E 对：12 小时细胞主要堆积在 G2/M 期，24 小时才出现亚二倍体峰，说明细胞先被 G2/M 检查点阻滞以获得修复时间，修复失败的细胞随后凋亡。A 错：凋亡峰出现于 24 小时，晚于 12 小时的阻滞，选项给出的时间顺序正好相反。B 错：若细胞始终未被阻滞，G2/M 期比例不会由 12% 升到 55%。C 错：多倍体化需要 DNA 反复复制，流式结果中并没有 DNA 含量高于 4C 的群体。D 错：G1 期比例下降而 G2/M 期比例升高，说明停滞发生在 G2 期与 M 期之间，而不是 G1/S 处。","type":"A1","group":"c19-04","kind":"experiment","chs":[19,26,29],"vignette":"研究生用一种抑制拓扑异构酶Ⅱ的药物处理 HeLa 细胞，药物在培养基中持续存在 24 小时，于 0、2、12、24 小时取样做三套检测。碱性彗星实验：尾矩由 1.2 升至 18（2 小时），12 小时回落到 4，24 小时为 3.5。γH2AX 免疫荧光：每核平均焦点数 2 小时为 32 个，12 小时为 9 个，24 小时为 5 个。流式细胞术测 DNA 含量：0 小时 G1 期 55%、S 期 30%、G2/M 期 12%；12 小时变为 G1 期 20%、S 期 22%、G2/M 期 55%；24 小时在 2C 峰之前出现一个占 28% 的亚二倍体峰。另设一组在给药同时加入 ATM 激酶抑制剂，2 小时时每核焦点数只有 6 个，而碱性彗星实验的尾矩仍为 17。","vignette_title":"情景 4：三张图对不上时，断裂到底修好了没有","gidx":3,"gn":6,"anchor":"G2/M 期 55%"},{"id":"gc19-04-6","ch":26,"part":5,"tag":"方案","stem":"若在给药同时抑制 G2/M 检查点，下列判断正确的是（X 型多选）","options":["带损伤的细胞提前进入 M 期，死亡比例可能上升","12 小时时 G2/M 期细胞比例会明显低于 55%","亚二倍体峰出现的时间可能比 24 小时更早","DNA 断裂会因检查点被抑制而更快被修复","检查点被抑制后药物无法再造成新的 DNA 断裂"],"answer":[0,1,2],"explain":"答案 ABC。A 对：检查点失效使带损伤的细胞提前进入 M 期，更容易发生有丝分裂灾难而死亡。B 对：G2/M 期阻滞依赖检查点，抑制后停留在 G2/M 期的细胞比例会下降。C 对：损伤更快转化为死亡，亚二倍体峰可出现得更早。D 错：检查点的作用是争取修复时间，修复本身由修复系统完成，阻断检查点并不会加快修复。E 错：断裂来自药物与拓扑异构酶Ⅱ的相互作用，与检查点是否被抑制无关。","type":"X","group":"c19-04","kind":"experiment","chs":[19,26,29],"vignette":"研究生用一种抑制拓扑异构酶Ⅱ的药物处理 HeLa 细胞，药物在培养基中持续存在 24 小时，于 0、2、12、24 小时取样做三套检测。碱性彗星实验：尾矩由 1.2 升至 18（2 小时），12 小时回落到 4，24 小时为 3.5。γH2AX 免疫荧光：每核平均焦点数 2 小时为 32 个，12 小时为 9 个，24 小时为 5 个。流式细胞术测 DNA 含量：0 小时 G1 期 55%、S 期 30%、G2/M 期 12%；12 小时变为 G1 期 20%、S 期 22%、G2/M 期 55%；24 小时在 2C 峰之前出现一个占 28% 的亚二倍体峰。另设一组在给药同时加入 ATM 激酶抑制剂，2 小时时每核焦点数只有 6 个，而碱性彗星实验的尾矩仍为 17。","vignette_title":"情景 4：三张图对不上时，断裂到底修好了没有","gidx":6,"gn":6,"anchor":"药物在培养基中持续存在 24 小时"},{"id":"gc22-01-4","ch":26,"part":5,"tag":"机制","stem":"核提取物中Myc与CyclinD的mRNA升高，据此判断该细胞在G1期的变化是","options":["周期蛋白B与CDK1结合增多，细胞被阻滞在G2/M转换处","p21表达升高使CDK2受抑制，细胞在G1期停留更久","APC/C提前活化使周期蛋白B被降解，细胞退出分裂期","周期蛋白D与CDK4/6结合增多，Rb被磷酸化而释放E2F","SCF活性下降使p27不能被降解，CDK2活性随之降低"],"answer":3,"explain":"D 对：CyclinD 的转录升高使其与 CDK4/6 结合增多，Rb 被磷酸化后释放 E2F，S 期相关基因表达增强，G1 期推进加快、比例下降，这与情景中抑制剂作用后 G1 期由 42% 升到 76% 的变化方向正好相反。A、C 涉及 CDK1 与 APC/C，属 G2/M 与分裂期事件；B 中 p21 升高会抑制 CDK2、延长 G1 期，方向相反；E 错在 p27 不能被降解同样使 G1 期延长。","type":"A1","group":"c22-01","kind":"mechanism","chs":[25,4,26],"vignette":"一名患者的手术标本做免疫印迹检测，其乳腺肿瘤细胞膜上的HER2蛋白量约为同一患者正常乳腺上皮的12倍，荧光原位杂交显示相应的基因拷贝数明显增加。血清中能与之结合的配体浓度低于正常下限，肿瘤细胞内该配体的mRNA也几乎检测不到。研究者把肿瘤细胞放在无血清培养液中培养24小时并洗去全部可溶因子，细胞内的MAPK磷酸化水平仍为正常上皮的6倍；用荧光能量转移法测得，质膜上约40%的该受体分子以二聚体形式存在，而正常细胞这一比例不足5%。该受体为单次跨膜的内在膜蛋白，胞外段结合配体，胞内段具有酪氨酸激酶活性，两个受体靠近后彼此的酪氨酸残基被磷酸化。核提取物中，Myc与CyclinD的mRNA分别升高。向培养液中加入一种分子结构与ATP相似的抑制剂后，受体的自身磷酸化下降80%，细胞在G1期的比例由42%升到76%。","vignette_title":"情景 1：血清里查不到配体，受体却一直亮着","gidx":4,"gn":5,"anchor":"Myc与CyclinD的mRNA分别升高"},{"id":"gc22-01-5","ch":26,"part":5,"tag":"判读","stem":"关于本例中从质膜受体到核内转录程序的这条链条，下列判断正确的是（X 型多选）","options":["该受体的活化不依赖配体占据，属于配体非依赖性激活","受体自身磷酸化后为含SH2结构域的衔接蛋白提供位点","MAPK被磷酸化后可进入核内，改变基因的转录程序","受体数目增多即可说明该细胞已获得无限增殖的能力","该受体的酪氨酸激酶活性需在配体持续结合时维持"],"answer":[0,1,2],"explain":"答案 ABC。A 对：血清配体低于正常下限，洗去可溶因子后 MAPK 磷酸化仍为正常上皮的 6 倍，说明该受体的活化不依赖配体占据。B 对：受体的自身磷酸化产生的磷酸酪氨酸位点，正是含 SH2 结构域衔接蛋白的结合位点，信号由此向下传递。C 对：MAPK 被磷酸化后可进入核内，Myc 与 CyclinD 转录升高即转录程序被改变的直接证据。D 错：无限增殖还涉及端粒维持、接触抑制丧失等多重改变，单靠受体数目增多不足以说明。E 错：与无血清条件下磷酸化仍维持在高位这一结果直接矛盾。","type":"X","group":"c22-01","kind":"mechanism","chs":[25,4,26],"vignette":"一名患者的手术标本做免疫印迹检测，其乳腺肿瘤细胞膜上的HER2蛋白量约为同一患者正常乳腺上皮的12倍，荧光原位杂交显示相应的基因拷贝数明显增加。血清中能与之结合的配体浓度低于正常下限，肿瘤细胞内该配体的mRNA也几乎检测不到。研究者把肿瘤细胞放在无血清培养液中培养24小时并洗去全部可溶因子，细胞内的MAPK磷酸化水平仍为正常上皮的6倍；用荧光能量转移法测得，质膜上约40%的该受体分子以二聚体形式存在，而正常细胞这一比例不足5%。该受体为单次跨膜的内在膜蛋白，胞外段结合配体，胞内段具有酪氨酸激酶活性，两个受体靠近后彼此的酪氨酸残基被磷酸化。核提取物中，Myc与CyclinD的mRNA分别升高。向培养液中加入一种分子结构与ATP相似的抑制剂后，受体的自身磷酸化下降80%，细胞在G1期的比例由42%升到76%。","vignette_title":"情景 1：血清里查不到配体，受体却一直亮着","gidx":5,"gn":5,"anchor":"洗去全部可溶因子"},{"id":"gc22-02-4","ch":26,"part":5,"tag":"判读","stem":"撤除生长因子24小时后，复发灶细胞仍有38%进入S期，最合理的解释是","options":["该细胞的信号终止缺陷使Rb被持续磷酸化并释放E2F","该细胞已进入G0期，不再依赖生长因子即可完成复制","该细胞中DNA损伤检查点被激活，G1期的阻滞被解除","该细胞缩短了G2期的时间，使单位时间内分裂次数增多","该细胞通过加快蛋白降解，使生长因子受体大量减少"],"answer":0,"explain":"A 对：受体下调失效与磷酸酶表达下降使 Ras-MAPK 与 PI3K-Akt 通路的信号都不能及时终止，Rb 被持续磷酸化、E2F 持续释放，G1/S 转换不再依赖生长因子的持续刺激，故撤除生长因子后仍有较多细胞进入 S 期。B 错在进入 G0 期的细胞不再增殖，与 38% 进入 S 期矛盾；C 错在检查点被激活只会使细胞停留于 G1 期；D 讲的是 G2 期长短，与进入 S 期的比例无关；E 与情景中该株细胞受体数目仍为 95% 相矛盾。","type":"A1","group":"c22-02","kind":"mechanism","chs":[25,4,26],"vignette":"同一名患者的原发灶与复发灶细胞分别在含表皮生长因子的培养液中连续培养。原发灶细胞受体的自身磷酸化在15分钟达到峰值，60分钟后降到峰值的12%，24小时后质膜上的受体数目只剩处理前的40%；向培养液中加入氯喹（一种使溶酶体腔内pH升高、水解酶失活的弱碱）后，质膜上的受体数目不再下降，免疫电镜显示受体集中在内体与溶酶体样的囊泡中，而培养液里自始至终测不到受体的可溶胞外段。复发灶细胞受体的胞内段泛素化位点发生突变，受体被内吞后不能被泛素标记，24小时后质膜上的受体数目仍为处理前的95%，其自身磷酸化在12小时内维持不降；该细胞中还有一种能使MAPK去磷酸化的蛋白磷酸酶，表达量降到原发灶细胞的20%。该细胞的PTEN表达缺失，Akt的磷酸化持续处于高位。撤除生长因子24小时后，复发灶细胞仍有38%进入S期，原发灶细胞只有9%。","vignette_title":"情景 2：受体降不下去的那株细胞","gidx":4,"gn":5,"anchor":"复发灶细胞仍有38%进入S期"},{"id":"gc22-03-2","ch":26,"part":5,"tag":"机制","stem":"甲药使细胞长期停留在分裂中期，其分子机制是","options":["纺锤体张力不足，纺锤体装配检查点持续抑制APC/C","CDK1的抑制性磷酸化被去除，细胞提前退出分裂期","黏连蛋白被提前切割，姐妹染色单体过早地分离","核纤层蛋白被持续磷酸化，核膜始终无法重新装配","中心体的复制受阻，细胞无法形成完整的纺锤体"],"answer":0,"explain":"A 对：微管被稳定后聚合体难以解聚，纺锤体不能正常组装并产生张力，动粒上聚集的 Mad2 说明纺锤体装配检查点持续活化，它抑制 APC/C，使 securin 不被降解、分离酶不被释放，姐妹染色单体无法分离，细胞长期停留在分裂中期。B 中去除 CDK1 的抑制性磷酸化会推动而不是阻滞分裂；C 的方向与阻滞相反；D 讲核膜重建障碍，与本例 M 期阻滞不符；E 错在情景并未显示中心体复制受阻。","type":"A1","group":"c22-03","kind":"mechanism","chs":[26,18,16],"vignette":"一位患者接受两种药物联合治疗：甲药从红豆杉中提取，进入细胞后与微管蛋白结合，使微管一旦聚合就难以解聚；乙药抑制拓扑异构酶，该酶原本通过切断并重新连接磷酸二酯键来消除复制叉前方的正超螺旋。检测显示，该患者肿瘤组织中处于S期的细胞约占45%、G2/M期约占18%；用药24小时后，肿瘤组织的G2/M期细胞升到62%，免疫荧光可见Mad2蛋白在未能正确连接的动粒上聚集，而S期细胞的比例下降到9%。这位患者的心肌细胞与神经元几乎没有损伤，骨髓与口腔黏膜上皮却出现明显的抑制与溃疡。同时测得肿瘤组织摄取葡萄糖的速率约为邻近正常组织的9倍，外周血乳酸升高，而心肌的能量供应仍以有氧氧化为主。停药三周后骨髓抑制逐渐恢复。","vignette_title":"情景 3：两种药只打正在分裂的细胞","gidx":2,"gn":5,"anchor":"Mad2蛋白在未能正确连接的动粒上聚集"},{"id":"gc22-03-3","ch":26,"part":5,"tag":"判读","stem":"该患者的心肌细胞与神经元几乎没有损伤，最合理的解释是","options":["这些细胞的药物摄取转运体表达很低，胞内药物浓度不足","这些细胞对拓扑异构酶抑制剂的灭活能力明显更强","这些细胞的DNA损伤修复通路活性高于肿瘤细胞","这些细胞不表达被药物作用的微管蛋白与拓扑异构酶","这些细胞已退出细胞周期，缺少药物作用的时相环节"],"answer":4,"explain":"E 对：甲药作用于分裂期的纺锤体、乙药作用于复制中的复制叉，两者的杀伤都以细胞进入 M 期或 S 期为前提；心肌细胞与神经元已退出细胞周期，缺少这两个时相环节，故几乎不受影响。A 错在情景未提供药物摄取的差异，且这类药物进入细胞并不依赖特异的转运体；B 的灭活能力差异不足以解释毫无损伤；C 错在修复活性高只能减轻损伤；D 错在这些细胞同样表达微管蛋白，只是不再分裂。","type":"A1","group":"c22-03","kind":"mechanism","chs":[26,18,16],"vignette":"一位患者接受两种药物联合治疗：甲药从红豆杉中提取，进入细胞后与微管蛋白结合，使微管一旦聚合就难以解聚；乙药抑制拓扑异构酶，该酶原本通过切断并重新连接磷酸二酯键来消除复制叉前方的正超螺旋。检测显示，该患者肿瘤组织中处于S期的细胞约占45%、G2/M期约占18%；用药24小时后，肿瘤组织的G2/M期细胞升到62%，免疫荧光可见Mad2蛋白在未能正确连接的动粒上聚集，而S期细胞的比例下降到9%。这位患者的心肌细胞与神经元几乎没有损伤，骨髓与口腔黏膜上皮却出现明显的抑制与溃疡。同时测得肿瘤组织摄取葡萄糖的速率约为邻近正常组织的9倍，外周血乳酸升高，而心肌的能量供应仍以有氧氧化为主。停药三周后骨髓抑制逐渐恢复。","vignette_title":"情景 3：两种药只打正在分裂的细胞","gidx":3,"gn":5,"anchor":"心肌细胞与神经元几乎没有损伤"},{"id":"gc22-03-5","ch":26,"part":5,"tag":"判读","stem":"关于本例的用药反应与治疗窗，下列判断正确的是（X 型多选）","options":["甲药使纺锤体功能异常，检查点持续活化引起M期阻滞","乙药造成复制叉停滞，S期细胞比例下降与之相符","骨髓抑制说明这类药物对静止期的细胞也有杀伤作用","心肌细胞与神经元不再分裂，对这两种药物的反应轻微","乳酸升高说明肿瘤细胞已完全丧失有氧氧化的能力"],"answer":[0,1,3],"explain":"答案 ABD。A 对：甲药干扰纺锤体，检查点持续活化，G2/M 期细胞由 18% 升到 62% 与 M 期阻滞相符。B 对：乙药抑制拓扑异构酶使复制叉停滞，S 期细胞比例由 45% 降到 9% 正是复制受阻的结果。D 对：心肌与神经元不再分裂，缺少 M 期与 S 期这两个作用环节，反应自然轻微。C 错：骨髓与口腔黏膜上皮恰恰是更新活跃、分裂旺盛的组织，骨髓抑制说明药物打击的是增殖细胞而不是静止期细胞。E 错：乳酸升高只提示糖酵解增强，不能证明有氧氧化的能力已经丧失。","type":"X","group":"c22-03","kind":"mechanism","chs":[26,18,16],"vignette":"一位患者接受两种药物联合治疗：甲药从红豆杉中提取，进入细胞后与微管蛋白结合，使微管一旦聚合就难以解聚；乙药抑制拓扑异构酶，该酶原本通过切断并重新连接磷酸二酯键来消除复制叉前方的正超螺旋。检测显示，该患者肿瘤组织中处于S期的细胞约占45%、G2/M期约占18%；用药24小时后，肿瘤组织的G2/M期细胞升到62%，免疫荧光可见Mad2蛋白在未能正确连接的动粒上聚集，而S期细胞的比例下降到9%。这位患者的心肌细胞与神经元几乎没有损伤，骨髓与口腔黏膜上皮却出现明显的抑制与溃疡。同时测得肿瘤组织摄取葡萄糖的速率约为邻近正常组织的9倍，外周血乳酸升高，而心肌的能量供应仍以有氧氧化为主。停药三周后骨髓抑制逐渐恢复。","vignette_title":"情景 3：两种药只打正在分裂的细胞","gidx":5,"gn":5,"anchor":"停药三周后骨髓抑制逐渐恢复"},{"id":"gc22-04-2","ch":26,"part":5,"tag":"判读","stem":"第一线与第三线的结果相互印证，共同说明化合物X使细胞","options":["阻滞在G2/M转换处，不能进入分裂期而凋亡","阻滞在分裂中期，DNA含量停留在4C的水平","大量死亡脱落，因而G1期的比例相对升高","阻滞在G1/S转换之前，S期基因的表达受抑制","越过G1/S限制点，进入S期的速度明显加快"],"answer":3,"explain":"D 对：报告基因由 CyclinD 启动子驱动，其活性下降说明该启动子不能被有效激活；流式显示 G1 期比例升高、S 期比例下降，说明细胞被阻滞在进入 S 期之前，两条证据方向一致，都指向 G1/S 转换受阻。A、B 讲的是 G2/M 与分裂中期，与 S 期比例下降不符；C 与情景中并未出现细胞大量死亡相矛盾；E 与 G1 期比例升高、S 期比例下降的结果正好相反。","type":"A1","group":"c22-04","kind":"experiment","chs":[25,26,4],"vignette":"研究生小赵用一株需要表皮生长因子刺激才能进入S期的人上皮细胞做三线联合测定。第一线：把含CyclinD启动子驱动荧光素酶的质粒转入细胞，无血清培养24小时后加生长因子，6小时后荧光素酶活性升到基线的7倍；先加化合物X再加生长因子，活性只有基线的1.2倍。第二线：免疫印迹显示，单加生长因子15分钟后受体自身磷酸化升到8倍、MAPK磷酸化升到9倍、Akt磷酸化升到6倍；先加X再加生长因子，受体自身磷酸化仍为7.5倍，MAPK磷酸化只有1.1倍，Akt磷酸化仍为6倍。第三线：流式测DNA含量，单加生长因子组G1期由45%降到32%、S期由30%升到48%；先加X组G1期由45%升到78%、S期由30%降到9%。另设一组先加X再加生长因子并同时导入组成性活化的MEK突变体，荧光素酶活性回到6倍，S期比例回到44%。","vignette_title":"情景 4：三份数据把阻断点夹在了哪里","gidx":2,"gn":5,"anchor":"S期由30%升到48%"},{"id":"gc23-02-3","ch":26,"part":5,"tag":"机制","stem":"加入蛋白酶体抑制剂后姐妹染色单体不能分离、分裂沟也不出现，最合理的解释是","options":["该药物与肌动蛋白单体结合，使收缩环不能装配","该药物使纺锤体微管解聚，染色体失去牵引力","该药物阻断蛋白降解，分离酶无法切割黏连蛋白","该药物抑制了 CDK1 的活性，细胞不再进入分裂","该药物使核纤层蛋白不能去磷酸化，核膜无法重建"],"answer":2,"explain":"C 对：泛素-蛋白酶体途径被阻断后，APC/C 无法降解 securin（后期抑制蛋白），分离酶不能被释放，cohesin（黏连蛋白）未被切割，姐妹染色单体因此停留在中期，其后的胞质分裂也不启动。A 错：该药物作用于蛋白酶体，并不与肌动蛋白结合；B 错：纺锤体微管若被解聚，染色体无法排列在赤道板上，与停留在中期的现象不符；D 错：抑制 CDK1 并不是该药物阻断单体分离的环节；E 错：核膜重建发生在末期，本组细胞尚未进入该阶段。","type":"A1","group":"c23-02","kind":"mechanism","chs":[9,26,8],"vignette":"同步化培养的 HeLa 细胞进入有丝分裂后期，姐妹染色单体在纺锤体的牵引下移向两极。此时位于两极之间的纺锤体中央区向细胞赤道面的皮层发出位置信号，赤道面下的肌动蛋白微丝与肌球蛋白 II 组装成一条环绕细胞的收缩环；荧光测量显示，环的直径在 10 分钟内由约 20 μm 缩到 8 μm，质膜随之内陷形成分裂沟。若在收缩环装配前用抑制肌球蛋白 II 的药物处理，染色体照常分离、核膜照常重建，分裂沟却不出现，最后形成含两个细胞核的大细胞。另有一组细胞在后期启动前加入蛋白酶体抑制剂，姐妹染色单体停留在中期不能分离，分裂沟也不出现。分裂沟加深到只剩一条细的细胞质桥时，沟底部的质膜仍在与囊泡融合、膜面积增加约 30%，随后桥断开，形成两个独立的子细胞；若用药物阻断囊泡与质膜的融合，分裂沟加深到一半便停住，两个子细胞长期以细胞质桥相连。","vignette_title":"情景 2：把细胞一分为二的三件事","gidx":3,"gn":5,"anchor":"姐妹染色单体停留在中期不能分离"},{"id":"gc4-02-4","ch":26,"part":5,"tag":"判读","stem":"体细胞端粒缩短到临界长度之后，细胞将","options":["染色体末端发生断裂，随后自行完成连接","转化为干细胞，重新表达端粒酶活性","进入细胞周期，分裂速度明显加快","立即发生凋亡，细胞膜很快出现破裂","退出细胞周期，进入复制性衰老的状态"],"answer":4,"explain":"E 对：端粒缩短到临界长度时，细胞不再进入细胞周期而停留于复制性衰老，这是体细胞分裂次数的计数机制。A 与数据方向相反，此刻细胞反而停止分裂；C 混淆了衰老与凋亡，衰老细胞代谢仍活跃、膜并不立即破裂；D 体细胞再表达端粒酶属重新激活，不是必然结局；E 末端的断裂与重接是基因组不稳定的表现，不是该环节的规定结局。","type":"A1","group":"c4-02","kind":"mechanism","chs":[18,17,26],"vignette":"真核生物的线性染色体末端是一段串联重复序列，人类为 5′-TTAGGG-3′ 重复数百至数千次，与一组端粒结合蛋白共同构成端粒。DNA 聚合酶不能从头起始合成，只能沿 5′→3′ 方向延伸，并需要一段 RNA 引物提供 3′-OH；当复制叉到达染色体末端，引物被切除后留下的空隙无法填补，子链因此比母链短 50–100 个核苷酸，这就是末端复制问题。端粒酶是一种核糖核蛋白，自带一段 RNA 作为模板，能以逆转录方式延长染色体 DNA 的 3′ 末端，随后由 DNA 聚合酶补齐另一条链。端粒酶在生殖细胞、干细胞和多数肿瘤细胞中活性较高，在普通体细胞中几乎不表达；体细胞每分裂一次端粒就缩短一些，缩短到临界长度后细胞退出细胞周期，进入复制性衰老。","vignette_title":"情景 2：染色体末端那道补不上的缺口","gidx":4,"gn":5,"anchor":"缩短到临界长度后细胞退出细胞周期"},{"id":"gc5-04-1","ch":26,"part":5,"tag":"判读","stem":"A组G1期升高而S期与EdU掺入率同步下降，说明","options":["细胞被阻滞在G1/S转换之前，DNA复制受抑制","细胞由G2期退回G1期，DNA含量随之重新减半","细胞被阻滞在G2/M转换阶段，DNA复制受到抑制","细胞大量死亡脱落，故G1期比例相对升高","细胞越过G1/S限制点，进入S期的速度加快"],"answer":0,"explain":"A对：G1期由46%升到79%、S期由32%降到8%、EdU掺入率由34%降到7%，三项指标一致指向细胞被阻滞在G1/S转换之前，进入S期进行DNA复制的细胞明显减少。C错：G2/M转换阻滞应表现为G2/M期比例升高，而不是G1期升高。D错：A组Annexin V单阳性仅3%，并没有大量死亡脱落。E错：若越过限制点则S期比例与EdU掺入率应升高而非下降。B错：细胞不能由G2期退回G1期，DNA含量也不会重新减半。","type":"A1","group":"c5-04","kind":"experiment","chs":[26,29,10],"vignette":"研究生小周把同一株Rb野生型人乳腺癌细胞分成三组：A组加CDK4/6抑制剂，B组加紫杉醇，C组不加药。24小时后做流式：A组G1期细胞由46%升到79%，S期由32%降到8%，EdU掺入率同步由34%降到7%，Annexin V单阳性细胞仅3%；B组G2/M期由18%升到61%，EdU掺入率几乎不变，镜下可见核膜崩解、核仁消失的细胞；C组周期分布与加药前基本一致。第48小时B组经Annexin V/PI双染示38%双阳性细胞，同时DNA电泳呈梯状条带（180～200bp整数倍）。另一株Rb缺失细胞用同样的抑制剂处理，周期分布毫无变化。","vignette_title":"情景 4：三组细胞，三种结局","gidx":1,"gn":6,"anchor":"A组G1期细胞由46%升到79%"},{"id":"gc5-04-2","ch":26,"part":5,"tag":"机制","stem":"CDK4/6抑制剂使细胞停滞于G1期，其分子机制是","options":["APC/C提前活化，使周期蛋白B被过早降解而退出周期","p21降解加快，使CDK2活性升高而推动细胞入S期","周期蛋白D与CDK4/6不能磷酸化Rb，E2F受抑制","Rb被持续磷酸化，E2F被释放而加速细胞进入S期","周期蛋白B与CDK1被抑制，细胞由此无法进入分裂期"],"answer":2,"explain":"C对：周期蛋白D与CDK4/6的作用是磷酸化Rb、释放E2F；抑制该激酶后Rb持续结合E2F，S期相关基因不能表达，细胞停滞于G1期。E错：周期蛋白B-CDK1被抑制主要造成G2/M阻滞，不能解释G1期比例升高。B错：p21是CDK抑制因子，其降解加快反而会加快进入S期，与结果相反。D错：Rb被持续磷酸化会释放E2F、加速入S期，是药物应当阻断的下游事件。A错：APC/C提前活化使细胞退出M期，与G1期堆积无关。","type":"A1","group":"c5-04","kind":"experiment","chs":[26,29,10],"vignette":"研究生小周把同一株Rb野生型人乳腺癌细胞分成三组：A组加CDK4/6抑制剂，B组加紫杉醇，C组不加药。24小时后做流式：A组G1期细胞由46%升到79%，S期由32%降到8%，EdU掺入率同步由34%降到7%，Annexin V单阳性细胞仅3%；B组G2/M期由18%升到61%，EdU掺入率几乎不变，镜下可见核膜崩解、核仁消失的细胞；C组周期分布与加药前基本一致。第48小时B组经Annexin V/PI双染示38%双阳性细胞，同时DNA电泳呈梯状条带（180～200bp整数倍）。另一株Rb缺失细胞用同样的抑制剂处理，周期分布毫无变化。","vignette_title":"情景 4：三组细胞，三种结局","gidx":2,"gn":6,"anchor":"A组加CDK4/6抑制剂"},{"id":"gc5-04-3","ch":26,"part":5,"tag":"机制","stem":"Rb缺失的细胞系对同一种抑制剂毫无反应，原因是","options":["Rb缺失使CyclinD表达下降，故药物失去靶点","Rb缺失使CDK4/6的催化活性被非特异激活","Rb缺失使E2F失去约束，抑制CDK4/6已无意义","Rb缺失使细胞周期检查点全部失活而加速增殖","Rb缺失使细胞对药物的摄取与转运发生障碍"],"answer":2,"explain":"C对：CDK4/6抑制剂使细胞停在G1期的关键下游是Rb；Rb缺失后E2F不再被约束，抑制CDK4/6已无法阻止细胞进入S期，故周期分布不变。E错：若为摄取或转运障碍，该药对Rb野生型细胞也应无效，与A组结果矛盾。A错：药物的靶点是CDK4/6而非CyclinD，且Rb缺失与CyclinD表达高低是两件事。D错：Rb缺失使G1/S关卡失守，但不能说全部检查点均失活。B错：抑制剂是抑制CDK4/6活性，不存在被非特异激活。","type":"A1","group":"c5-04","kind":"experiment","chs":[26,29,10],"vignette":"研究生小周把同一株Rb野生型人乳腺癌细胞分成三组：A组加CDK4/6抑制剂，B组加紫杉醇，C组不加药。24小时后做流式：A组G1期细胞由46%升到79%，S期由32%降到8%，EdU掺入率同步由34%降到7%，Annexin V单阳性细胞仅3%；B组G2/M期由18%升到61%，EdU掺入率几乎不变，镜下可见核膜崩解、核仁消失的细胞；C组周期分布与加药前基本一致。第48小时B组经Annexin V/PI双染示38%双阳性细胞，同时DNA电泳呈梯状条带（180～200bp整数倍）。另一株Rb缺失细胞用同样的抑制剂处理，周期分布毫无变化。","vignette_title":"情景 4：三组细胞，三种结局","gidx":3,"gn":6,"anchor":"另一株Rb缺失细胞用同样的抑制剂处理"},{"id":"gc5-04-6","ch":26,"part":5,"tag":"方案","stem":"关于本实验的设计与结果判读，下列判断正确的是（X 型多选）","options":["PI单染不能检出膜完整的早期凋亡细胞","G2/M期比例升高即可证明阻滞于分裂中期","A组G1期比例升高说明细胞阻滞于G1/S转换","EdU掺入率下降提示进入S期复制的细胞减少","Annexin V染色检测的是磷脂酰丝氨酸外翻"],"answer":[0,2,3,4],"explain":"答案 ACDE。A对：PI只能进入膜完整性丧失的细胞，早期凋亡细胞膜完整、拒染PI，故PI单染会漏检早期凋亡。D对：EdU掺入反映S期的DNA合成，掺入率下降提示进入S期进行复制的细胞减少，与S期比例下降一致。C对：G1期比例升高而S期与EdU掺入率同步下降，说明细胞被阻滞于G1/S转换。E对：Annexin V检测的正是凋亡时外翻到膜外表面的磷脂酰丝氨酸。B错：G2/M期比例升高只能提示M期阻滞，本组用紫杉醇干扰纺锤体、使纺锤体装配检查点持续激活，须结合核形态、DNA梯状条带等指标判断，不能仅凭此断定阻滞于分裂中期。","type":"X","group":"c5-04","kind":"experiment","chs":[26,29,10],"vignette":"研究生小周把同一株Rb野生型人乳腺癌细胞分成三组：A组加CDK4/6抑制剂，B组加紫杉醇，C组不加药。24小时后做流式：A组G1期细胞由46%升到79%，S期由32%降到8%，EdU掺入率同步由34%降到7%，Annexin V单阳性细胞仅3%；B组G2/M期由18%升到61%，EdU掺入率几乎不变，镜下可见核膜崩解、核仁消失的细胞；C组周期分布与加药前基本一致。第48小时B组经Annexin V/PI双染示38%双阳性细胞，同时DNA电泳呈梯状条带（180～200bp整数倍）。另一株Rb缺失细胞用同样的抑制剂处理，周期分布毫无变化。","vignette_title":"情景 4：三组细胞，三种结局","gidx":6,"gn":6,"anchor":"DNA电泳呈梯状条带"},{"id":"gc7-01-4","ch":26,"part":5,"tag":"判读","stem":"该肿瘤细胞 S 期比例升高、增殖加快，最可能的分子基础是","options":["突变使 Cyclin 在周期各时相的含量保持恒定","突变使某种周期蛋白过度表达，推动 G1/S 转换加速","突变使 CDK 的抑制性磷酸化位点被永久修饰","突变使 APC/C 提前活化，CyclinB 被大量降解","突变使细胞周期检查点全部关闭，细胞丧失修复能力"],"answer":1,"explain":"B 对：点突变激活原癌基因或灭活抑癌基因后，常见 CyclinD 等周期蛋白过度表达，CyclinD-CDK4/6 活性增强、Rb 被磷酸化而释放 E2F，G1/S 转换加速，S 期细胞比例随之升高。B 说检查点全部关闭过于绝对，也与点突变的情形不符；C 抑制性磷酸化被永久修饰只会抑制 CDK 活性、减慢周期；D Cyclin 恒定不符合其周期性合成与降解的规律；E APC/C 提前降解 CyclinB 会阻碍进入 M 期。","type":"A1","group":"c7-01","kind":"mechanism","chs":[2,19,26],"vignette":"细胞在有氧代谢中不断产生活性氧。鸟嘌呤被氧化后变成 8-氧代鸟嘌呤，这种碱基的构象发生变化，不再与胞嘧啶配对，而是与腺嘌呤配对；若它出现在模板链上，复制时对侧就会掺入腺嘌呤，G-C 碱基对被替换成 T-A，形成一种难以回复的替换突变。细胞对此有专门的清除机制：由糖苷酶识别并切除这个氧化碱基，形成无碱基位点，再由后续酶补上正确的鸟嘌呤。若这套机制失灵，突变就会在基因组中逐代累积。某位患者结肠肿瘤组织测序发现 APC 与 KRAS 基因同时带有点突变，肿瘤细胞体积小、增殖快，克隆形成率明显高于正常肠上皮，流式检测显示其 G1 期细胞比例下降、S 期比例升高。","vignette_title":"情景 1：从一次氧化损伤到一群失控的细胞","gidx":4,"gn":5,"anchor":"其 G1 期细胞比例下降、S 期比例升高"},{"id":"gc7-03-1","ch":26,"part":5,"tag":"机制","stem":"本例中复制叉停滞后细胞被阻滞于 G2/M，其直接机制是","options":["ATR 磷酸化 CHK1 抑制 Cdc25，CDK1 无法被激活","Mad 与 Bub 蛋白持续活化，使细胞阻滞于中期赤道板","APC/C 提前活化，securin 被降解导致后期提前","ATM 感知双链断裂后经 p53 上调 p21 抑制 CDK2","Rb 被去磷酸化后重新结合 E2F，细胞退回 G1 期"],"answer":0,"explain":"A 对：ATR 被单链 DNA 激活后磷酸化 CHK1，CHK1 使 Cdc25 磷酸酶失活，CDK1 的 Thr14 与 Tyr15 保持磷酸化状态，M 期启动受阻。B 描述的是 ATM-p53-p21 引起 G1 期阻滞的途径，本例主诉是复制压力；C 是纺锤体装配检查点；D APC/C 提前活化会导致 M 期进程异常，并非阻滞；E Rb 与 E2F 调控的是 G1/S 限制点。","type":"A1","group":"c7-03","kind":"mechanism","chs":[18,19,26],"vignette":"培养细胞中加入羟基脲后，核糖核苷酸还原酶被抑制，四种 dNTP 的供应在 40 分钟内降到不足原来的 10%，S 期的复制叉被迫停在半路，暴露出的单链 DNA 被 RPA 包裹。这一信号由 ATR 感知，它磷酸化下游的 CHK1，经 Cdc25 磷酸酶受抑使 CDK1 的抑制性磷酸化无法去除，细胞因此不能启动有丝分裂。研究者同时观察到，处理 12 小时后细胞累积在 S 期，2N 与 4N 峰之间的 S 期细胞比例由 28% 升至 63%，而 G2/M 并没有出现相应的峰值。把 DNA 双链断裂诱导剂阿霉素加到细胞中，ATM 通路被激活，被磷酸化的组蛋白变体形成焦点，细胞阻滞于 G2/M。若检查点失效，细胞会带着未完成复制的 DNA 强行进入分裂，随后出现染色体断裂与微核。","vignette_title":"情景 3：当复制叉撞上未修好的损伤","gidx":1,"gn":5,"anchor":"CDK1 的抑制性磷酸化无法去除"},{"id":"gc7-03-2","ch":26,"part":5,"tag":"判读","stem":"在上述情形下细胞选择可逆阻滞而非直接进入分裂，最合理的解释是","options":["阻滞使细胞越过 M 期直接进入下一个 S 期以补充复制","阻滞能直接清除已掺入的错误碱基，无需其他修复通路参与","阻滞为 dNTP 恢复与复制重启提供时间，避免遗传信息丢失","阻滞使细胞退出细胞周期进入 G0 期，从此不再进入周期","阻滞使受损的 DNA 在凝集状态下更易被修复酶所接近"],"answer":2,"explain":"C 对：检查点的意义在于争取时间，让 dNTP 供应恢复、停滞的复制叉重启并完成复制，避免未完成的染色体被带入子细胞。B 检查点只负责暂停，不执行碱基切除或替换；C 阻滞是可逆的，条件改善后细胞可继续周期；D 细胞周期是单向的，不存在越过 M 期直接补复制；E DNA 凝集反而不利于修复蛋白接近损伤。","type":"A1","group":"c7-03","kind":"mechanism","chs":[18,19,26],"vignette":"培养细胞中加入羟基脲后，核糖核苷酸还原酶被抑制，四种 dNTP 的供应在 40 分钟内降到不足原来的 10%，S 期的复制叉被迫停在半路，暴露出的单链 DNA 被 RPA 包裹。这一信号由 ATR 感知，它磷酸化下游的 CHK1，经 Cdc25 磷酸酶受抑使 CDK1 的抑制性磷酸化无法去除，细胞因此不能启动有丝分裂。研究者同时观察到，处理 12 小时后细胞累积在 S 期，2N 与 4N 峰之间的 S 期细胞比例由 28% 升至 63%，而 G2/M 并没有出现相应的峰值。把 DNA 双链断裂诱导剂阿霉素加到细胞中，ATM 通路被激活，被磷酸化的组蛋白变体形成焦点，细胞阻滞于 G2/M。若检查点失效，细胞会带着未完成复制的 DNA 强行进入分裂，随后出现染色体断裂与微核。","vignette_title":"情景 3：当复制叉撞上未修好的损伤","gidx":2,"gn":5,"anchor":"细胞因此不能启动有丝分裂"},{"id":"gc7-04-4","ch":26,"part":5,"tag":"判读","stem":"患者细胞在紫外线照射后大量累积于 G2/M，最合理的解释是","options":["细胞在 G2 期完成了 DNA 复制，DNA 含量因此加倍","损伤未修复使检查点持续激活，细胞无法越过 G2/M","细胞周期被缩短，单位时间内分裂次数明显增多","细胞被阻滞在 G1 期，未进入 S 期而直接进入 M 期","G2/M 期是唯一能修复双链断裂的时相"],"answer":1,"explain":"B 对：损伤长期残留使 ATM 与 ATR 通路持续活化，Cdc25 受抑、CDK1 无法激活，细胞停在 G2/M 之前，流式图上表现为 G2/M 峰升高、S 期比例下降。B DNA 加倍发生在 S 期，与累积在 G2/M 的成因无关；C 细胞并未跳过 S 期；D 双链断裂的修复并不限于某一时相，同源重组偏好 S 与 G2 期；E 周期被延长而非缩短，分裂次数应减少。","type":"A1","group":"c7-04","kind":"experiment","chs":[19,26],"vignette":"实验室拿到两株成纤维细胞：野生型与一名光敏患者的细胞。用 254 nm 紫外线照射后做克隆形成实验，随剂量加大，患者细胞的存活曲线下降得远比野生型陡峭；把同一批细胞改用电离辐射或丝裂霉素 C 处理，两株细胞的存活曲线几乎重合。随后做 γH2AX 焦点计数与单细胞凝胶电泳：紫外线 10 J/m2 后 30 分钟，两组每核焦点都在 20 个左右，6 小时后野生型降至 3 个以下，而患者细胞几乎不恢复；电泳中未修复的 DNA 断裂会迁移形成尾矩，照射后即刻两组的尾矩都升高，4 小时后野生型尾矩明显缩短，患者细胞的尾矩仍维持在高位。流式细胞术显示紫外线照射 24 小时后，患者细胞大量累积在 G2/M，S 期比例反而低于野生型。","vignette_title":"情景 4：一张存活曲线背后的修复缺陷","gidx":4,"gn":5,"anchor":"S 期比例反而低于野生型"},{"ch":26,"part":5,"tag":"周期时相","stem":"关于细胞周期各时相主要事件的叙述，正确的是：","options":["G1 期主要完成 DNA 复制，为进入 S 期做物质准备","G2 期进行 DNA 复制和端粒延伸，DNA 含量在此期加倍","M 期染色质凝集、核膜核仁消失，此期 DNA 含量加倍","S 期完成 DNA 复制，同时大量合成组蛋白等染色体蛋白以保证新合成 DNA 的包装","G0 期细胞已永久退出细胞周期，不再受任何刺激重返周期"],"answer":3,"explain":"DNA 复制与组蛋白合成均发生于 S 期，DNA 含量在 S 期加倍；G0 期细胞在适当刺激下可重新进入细胞周期。","type":"A1","id":"c26-6d268d9d"},{"ch":26,"part":5,"tag":"Cyclin","stem":"关于 Cyclin-CDK 复合物的叙述，正确的是：","options":["Cyclin 在细胞周期中含量恒定，而 CDK 的含量周期性波动","Cyclin 周期性合成与降解，与 CDK 结合是 CDK 表现激酶活性的必要条件，故复合物活性呈周期性变化","Cyclin 通过泛素-蛋白酶体途径合成，被磷酸化后失活","CDK 只有催化亚基，无需结合 Cyclin 即可保持活性","Cyclin-CDK 复合物通过使底物蛋白泛素化降解来驱动周期转换"],"answer":1,"explain":"Cyclin 是调节亚基、含量周期性升降，CDK 是催化亚基、含量相对恒定；复合物以磷酸化修饰底物而非降解底物。","type":"A1","id":"c26-d0573eab"},{"ch":26,"part":5,"tag":"检查点","stem":"关于 DNA 损伤检查点诱导细胞周期阻滞的机制，正确的是：","options":["DNA 损伤使 p53 降解、p21 转录下降，细胞滞留于 G1 期","DNA 损伤由 Mad2 感知并直接抑制 CDK1，使细胞阻滞于 M 期","DNA 损伤检查点通过抑制泛素-蛋白酶体途径使 CyclinB 堆积，细胞阻滞于 G1 期","DNA 损伤后 E2F 大量释放，促进 S 期基因表达以加速损伤修复","DNA 损伤激活 ATM/ATR，经 Chk1/Chk2 抑制 Cdc25 磷酸酶，使 CDK1 的抑制性磷酸化不能被去除，细胞阻滞于 G2/M"],"answer":4,"explain":"损伤时 p53 稳定并上调 p21；Mad2 属纺锤体装配检查点；Cdc25 受抑使 CDK1 保持抑制态而形成 G2/M 阻滞。","type":"A1","id":"c26-332ae8ee"},{"ch":26,"part":5,"tag":"泛素化降解","stem":"关于泛素-蛋白酶体途径调控细胞周期进展，下列叙述正确的是：","options":["SCF 与 APC/C 是两类 E3 泛素连接酶，分别介导不同时相关键蛋白（如 p27、CyclinB）的多聚泛素化，随后由 26S 蛋白酶体降解","APC/C 在 G1 期活化，通过降解 CyclinB 使细胞由 G1 期进入 S 期","泛素化的蛋白质主要在溶酶体中被酸性蛋白酶降解","泛素通过非共价方式标记底物蛋白","SCF 通过催化 CDK 磷酸化来调控细胞周期转换"],"answer":0,"explain":"APC/C 在 M 期中期后活化降解 CyclinB；泛素以共价方式连接底物，主要由 26S 蛋白酶体而非溶酶体降解。","type":"A1","id":"c26-f5c7aa15"},{"ch":26,"part":5,"tag":"p53与Rb","stem":"关于 p53 与 Rb 的功能比较，下列叙述正确的是：","options":["p53 是原癌基因产物，Rb 是抑癌基因产物，二者均经点突变失活","Rb 是转录因子，p53 是直接抑制 CDK 活性的酶","p53 在 DNA 损伤时被激活，作为转录因子诱导 p21 等表达引起周期阻滞或凋亡；Rb 通过结合并抑制 E2F 阻止细胞进入 S 期，磷酸化后释放 E2F","p53 仅在细胞核内以酶催化方式灭活 CDK，不参与转录调控","Rb 是人类肿瘤中突变率最高的基因，p53 突变多见于视网膜母细胞瘤"],"answer":2,"explain":"p53 与 Rb 均为抑癌基因；Rb 是 E2F 的负性结合蛋白，p53 是转录因子；Rb 突变见于视网膜母细胞瘤。","type":"A1","id":"c26-5196b30a"},{"ch":26,"part":5,"tag":"抗微管药物","stem":"关于抗微管类化疗药物与纺锤体装配检查点（SAC），下列叙述正确的是：","options":["抗微管类药物主要作用于 S 期，通过抑制 DNA 复制叉前进杀伤肿瘤细胞","紫杉醇促进微管聚合、秋水仙素抑制微管聚合，二者均干扰纺锤体功能，细胞因 SAC 持续激活而阻滞于 M 期，最终发生凋亡","SAC 由 Mad 与 Bub 等蛋白组成，其功能是监测 DNA 双链断裂","上述药物通过促进 CDK1 的抑制性磷酸化使细胞停滞于 G1 期","有丝分裂不受 SAC 调控，SAC 异常只影响细胞质分裂"],"answer":1,"explain":"抗微管药作用于 M 期纺锤体；SAC 监测动粒与微管的连接及张力而非 DNA 损伤，其功能异常与耐药相关。","type":"A1","id":"c26-8838daa7"},{"ch":26,"part":5,"tag":"乳腺癌机制","stem":"对一乳腺癌患者的癌细胞分析发现 p21 基因突变、CyclinD 基因扩增，细胞增殖显著加快并常见异倍体。下列解释最合理的是：","options":["p21 是癌基因产物，其突变激活 CyclinD 基因的转录","CyclinD 扩增直接导致 G2/M 检查点失效，引起染色体异倍体","p21 突变使细胞周期阻滞于 G2 期，染色体不能正常分离","CyclinD 扩增抑制 CDK4/6 活性，使细胞无法越过 G1 检查点","p21 属 CKI，功能丧失使 CDK 抑制解除，G1/S 推进加快；CyclinD 扩增进一步增强 CDK4/6 活性、促进 Rb 磷酸化并释放 E2F，二者共同导致增殖失控"],"answer":4,"explain":"p21 是 CKI（抑癌性质），并非癌基因；CyclinD-CDK4/6 作用于 G1/S，过度活化使 G1/S 检查点失守。","type":"A1","id":"c26-dfd186b9"},{"ch":26,"part":5,"tag":"减数分裂","stem":"关于减数分裂与生殖细胞发生，下列叙述正确的是：","options":["姐妹染色单体在减数分裂Ⅰ分离，同源染色体在减数分裂Ⅱ分离","初级精母细胞的染色体数目已经减半","减数分裂Ⅰ前期同源染色体联会并发生交叉互换，随后同源染色体分离；减数分裂Ⅱ姐妹染色单体分离，最终子细胞染色体数目减半","一个初级卵母细胞经减数分裂形成 4 个卵细胞","交叉互换发生在减数分裂Ⅱ前期，是姐妹染色单体之间的交换"],"answer":2,"explain":"减Ⅰ同源染色体分离、减Ⅱ姐妹染色单体分离；一个初级卵母细胞只形成 1 个卵细胞和 3 个极体。","type":"A1","id":"c26-5018a931"},{"ch":26,"part":5,"tag":"有丝分裂各期","stem":"关于有丝分裂前期（prophase）主要事件，正确的是：","options":["着丝粒分裂、姐妹染色单体分别移向细胞两极","已完成胞质分裂，形成两个子细胞","染色质高度螺旋化凝集为染色体，核膜与核仁消失，纺锤体开始形成","染色体排列在赤道板上，纺锤丝与着丝粒相连并处于张力平衡","核膜重新组装、染色体解螺旋，核仁重现"],"answer":2,"explain":"前期以染色质凝集、核膜核仁消失和纺锤体形成为标志；着丝粒分裂与染色单体分离发生在后期。","type":"A1","id":"c26-a79f4407"},{"ch":26,"part":5,"tag":"染色体不分离","stem":"对一克氏综合征（Klinefelter 综合征）患者外周血细胞作染色体核型分析，核型为 47,XXY。最可能出现的不分离事件是：","options":["母方减数分裂Ⅱ中姐妹染色单体不分离，形成 47,XXX 的卵子","父方减数分裂Ⅰ中同源 X 与 Y 染色体未分离，形成 24,XY 的精子","父方减数分裂Ⅱ中姐妹染色单体不分离，形成 24,YY 的精子","受精卵第一次卵裂时着丝粒不分裂，导致染色体加倍","减数分裂中发生同源染色体交叉互换，产生染色体结构重排"],"answer":1,"explain":"47,XXY 的额外 X 与父方 Y 同时出现，提示父本减数分裂Ⅰ期 X、Y 同源染色体不分离形成 24,XY 精子。","type":"A1","id":"c26-8f6b574a"},{"ch":26,"part":5,"tag":"联会与交叉","stem":"关于减数分裂前期Ⅰ的联会复合体与交叉现象，正确的是：","options":["联会复合体将姐妹染色单体连接在一起，其功能是保证有丝分裂的染色体排列","交叉发生于姐妹染色单体之间，交换后姐妹染色单体不再完全相同","交叉互换只改变染色体数目，不引起基因重组","联会复合体由同源染色体配对形成，是交叉互换的结构基础，非姐妹染色单体间交换片段产生基因重组","联会复合体在减数分裂Ⅱ前期形成，其后同源染色体彼此分离"],"answer":3,"explain":"联会复合体在同源染色体之间形成，介导非姐妹染色单体的片段交换，是基因重组的细胞学基础。","type":"A1","id":"c26-2fe7f752"},{"ch":26,"part":5,"tag":"G1/S限制点","stem":"将处于 G1 中期的培养细胞用无血清培养基洗去生长因子后，部分细胞仍能继续完成 DNA 复制并进入 M 期。最合理的解释是：","options":["细胞已通过 G1/S 限制点，Rb 被 CDK4/6-CyclinD 磷酸化而释放 E2F，G1/S 相关基因已启动表达","细胞已进入 G0 期，完全不需要任何生长因子即可无限增殖","生长因子通过直接磷酸化 CDK2 而维持细胞周期运转，去除后由细胞内 ATP 代偿","细胞在无血清条件下激活了 DNA 损伤检查点，阻滞于 G2 期","无血清培养使细胞直接跳过 S 期进入 M 期，DNA 含量不再增加"],"answer":0,"explain":"限制点是 G1 期生长因子依赖的关卡，越过该点后 Rb 已失活、E2F 已释放，周期推进不再依赖外界生长因子。","type":"A1","id":"c26-cb81292e"},{"ch":26,"part":5,"tag":"CDK活化调控","stem":"关于 CDK1 激酶活性获得所需的多层次调控，下列叙述正确的是：","options":["CDK1 单独存在即具活性，与 Cyclin 结合只是使其更稳定","CDK1 的活化仅需其抑制性磷酸化位点去磷酸化，无需其他修饰","CDK1 必须与 CyclinB 结合，经 CAK 磷酸化其 Thr161 位点并被 Cdc25 去除 Thr14/Tyr15 的抑制性磷酸化后，才表现激酶活性","CDK1 通过 CyclinB 被泛素化降解而获得活性","CDK1 活性的高低只取决于其蛋白总量，与翻译后修饰无关"],"answer":2,"explain":"CDK1 活化需三步：结合 CyclinB、CAK 磷酸化 Thr161、Cdc25 去除 Thr14/Tyr15 抑制性磷酸化。","type":"A1","id":"c26-45d0a9da"},{"ch":26,"part":5,"tag":"后期启动","stem":"有丝分裂中期向后期转换、姐妹染色单体分离的分子机制是：","options":["APC/C 被抑制使 securin 堆积，securin 直接切割 cohesin 使染色单体分离","SAC 持续活化，Mad2 与 Bub 蛋白促进分离酶提前活化","CDK1 持续高活性磷酸化 cohesin，使其从染色体上解离","APC/C 活化使 securin 被泛素化降解，释放分离酶（separase），后者切割 cohesin 使姐妹染色单体分离","凝缩蛋白（condensin）被降解，使姐妹染色单体之间的连接断开"],"answer":3,"explain":"SAC 关闭后 APC/C 活化降解 securin，分离酶得以切割 cohesin，姐妹染色单体在后期分离。","type":"A1","id":"c26-dea56ecb"},{"ch":26,"part":5,"tag":"原癌基因激活","stem":"关于原癌基因激活成为癌基因的机制，错误的是：","options":["点突变使 Ras 的 GTP 酶活性下降，Ras 持续处于 GTP 结合的活化状态","基因扩增使 MYC、HER2 等基因拷贝数增加、蛋白产物过量表达","染色体易位可把强增强子或活跃启动子带到原癌基因附近，使其表达异常升高","原癌基因被激活后其编码产物表现为功能获得或过度表达","激活必须使两个等位基因全部失活，符合二次打击学说"],"answer":4,"explain":"原癌基因激活是功能获得性改变，单个等位基因异常即可起作用；两次打击学说是抑癌基因失活的规律。","type":"A1","id":"c26-d4475b1b"},{"ch":26,"part":5,"tag":"二次打击学说","stem":"Knudson 二次打击学说对遗传性视网膜母细胞瘤的解释是：","options":["两次打击均发生在体细胞，因此患者只出现单侧单发肿瘤","患者从亲代获得一个突变的 Rb 等位基因，视网膜细胞再发生一次体细胞突变即可使 Rb 功能丧失，故多为双眼多发","Rb 是原癌基因，两次打击使其过度活化而促进增殖","两次打击分别使 Rb 基因的两个等位基因扩增，Rb 蛋白表达升高","遗传性病例在出生时体细胞中不存在任何突变，肿瘤完全由环境因素引起"],"answer":1,"explain":"遗传性病例生殖细胞已带一个 Rb 突变等位基因，视网膜细胞只需再发生一次体细胞突变即失活，故双眼多发。","type":"A1","id":"c26-a3cfaee3"},{"id":"gc18-03-5","ch":27,"part":5,"tag":"判读","stem":"关于本实验所反映的微环境、分化与自我更新，下列判断正确的是（X 型多选）","options":["干细胞微环境由邻近细胞、细胞外基质与因子共同组成","不对称分裂在维持干细胞池的同时持续提供祖细胞","干性细胞比例的高低由细胞自身的基因组决定","微环境信号失衡可使干细胞耗竭或过度增殖","细胞决定发生在形态差异出现之前并具有稳定性"],"answer":[0,1,3,4],"explain":"答案 ABDE。A 对：造血干细胞的龛由成骨细胞等邻近细胞、细胞外基质与细胞因子共同组成。B 对：一个子细胞保持干性、另一个走向分化，既维持干细胞池又持续提供祖细胞。D 对：微环境信号失衡可使干细胞耗竭或过度增殖，这正是龛异常致病的机制。E 对：细胞决定发生在形态差异出现之前，此后环境改变仍按既定方向分化，具有稳定性。C 错：干性比例由微环境信号与基因表达调控共同决定，细胞基因组保持完整，并不存在决定干性高低的基因型差异。","type":"X","group":"c18-03","kind":"mechanism","chs":[28,25,27],"vignette":"研究者把小鼠造血干细胞分为三组培养：甲组与成骨细胞在同一培养皿中直接接触；乙组与成骨细胞之间隔一层孔径0.4µm的滤膜，培养液可自由通过而细胞不能接触；丙组不铺成骨细胞，仅用基础培养液培养。7天后，甲组中保持未分化表型的细胞占82%，乙组降到21%，丙组只有9%；给丙组补加干细胞因子后也只升到34%。甲组细胞中Notch受体的胞内段进入细胞核，其靶基因Hes1的转录本比乙组高6倍；加入γ-分泌酶抑制剂DAPT后，甲组该比例降到18%。稀释实验显示，甲组细胞每4次分裂中有3次产生一个保持干性的子细胞与一个开始表达髓系标志的子细胞，乙组细胞则大多分裂成两个走向分化的子细胞。","vignette_title":"情景 3：隔着一层滤膜的两个结果","gidx":5,"gn":5,"anchor":"产生一个保持干性的子细胞"},{"id":"gc25-02-3","ch":27,"part":5,"tag":"机制","stem":"乙组 Oct4 基因启动子区 DNA 甲基化由 12% 升到 68%、H3K27 三甲基化升高，这对该细胞的意义是","options":["该基因的拷贝数随细胞分裂而减少，故转录本降到原来的 15%","该基因的一级结构发生突变，编码的蛋白失去正常功能","该区域甲基化后 DNA 双链解链，转录起始变得更容易","组蛋白修饰使 RNA 聚合酶发生别构，其催化活性随之下降","该基因所在染色质变为不易转录的状态，Oct4 表达关闭"],"answer":4,"explain":"E 对：启动子区 DNA 甲基化升高并伴 H3K27 三甲基化，是染色质转入不易转录状态的标志，Oct4 表达随之关闭，细胞离开未分化状态。A 分化并不涉及基因拷贝数改变；B 这里改变的是调控状态而不是碱基序列；C 甲基化通常抑制而非促进转录起始，且与解链无关；D 组蛋白修饰改变的是染色质的可及性，不是让 RNA 聚合酶发生别构。","type":"A1","group":"c25-02","kind":"mechanism","chs":[27,28,25],"vignette":"把小鼠胚胎干细胞分成三组培养：甲组培养液中含白血病抑制因子（LIF）；乙组撤除 LIF；丙组撤除 LIF，同时导入一个持续活化的 STAT3 突变体。培养 5 天后，甲组与丙组仍呈碱性磷酸酶染色阳性，Oct4 与 Sox2 的转录本维持在高水平，形成的克隆能连续传代；乙组 Oct4 转录本降到原来的 15%，细胞内出现三个胚层的标志分子，克隆变为铺展的扁平细胞。检测显示，LIF 作用 10 分钟后 STAT3 在酪氨酸残基上被磷酸化，由细胞质转入细胞核；甲组 Oct4 基因启动子区的 H3K4 三甲基化水平高、DNA 甲基化只有 12%，乙组同一区域的 H3K27 三甲基化升高、DNA 甲基化升到 68%。乙组在撤除 LIF 第 5 天再补回 LIF，Oct4 的转录本只回升到原来的 20%。","vignette_title":"情景 2：把干性开关按下去以后","gidx":3,"gn":5,"anchor":"同一区域的 H3K27 三甲基化升高"},{"id":"gc25-02-4","ch":27,"part":5,"tag":"判读","stem":"乙组在撤除 LIF 第 5 天再补回 LIF，Oct4 转录本只回升到原来的 20%，最合理的解释是","options":["补回的 LIF 与细胞表面受体结合后被迅速降解，未能起效","分化方向一旦确立即具有稳定性，环境改变后仍按既定方向进行","Oct4 基因在分化过程中被选择性丢失，故不能被重新激活","细胞已进入终末分化，重新获得 LIF 受体需要更长时间","LIF 的作用是促进细胞增殖，对 Oct4 的表达没有调节作用"],"answer":1,"explain":"B 对：撤除 LIF 5 天后细胞已获得稳定的分化方向，此时补回 LIF 只让 Oct4 轻微回升，正体现细胞决定的稳定性——决定一旦确立，环境改变仍按既定方向分化。A 情景中 LIF 作用 10 分钟即能激活 STAT3，不会因快速降解而失效；C 分化不涉及基因丢失；D 受体仍然存在，问题在于染色质状态已经改变；E LIF 通过 STAT3 直接维持 Oct4 等干性基因的表达。","type":"A1","group":"c25-02","kind":"mechanism","chs":[27,28,25],"vignette":"把小鼠胚胎干细胞分成三组培养：甲组培养液中含白血病抑制因子（LIF）；乙组撤除 LIF；丙组撤除 LIF，同时导入一个持续活化的 STAT3 突变体。培养 5 天后，甲组与丙组仍呈碱性磷酸酶染色阳性，Oct4 与 Sox2 的转录本维持在高水平，形成的克隆能连续传代；乙组 Oct4 转录本降到原来的 15%，细胞内出现三个胚层的标志分子，克隆变为铺展的扁平细胞。检测显示，LIF 作用 10 分钟后 STAT3 在酪氨酸残基上被磷酸化，由细胞质转入细胞核；甲组 Oct4 基因启动子区的 H3K4 三甲基化水平高、DNA 甲基化只有 12%，乙组同一区域的 H3K27 三甲基化升高、DNA 甲基化升到 68%。乙组在撤除 LIF 第 5 天再补回 LIF，Oct4 的转录本只回升到原来的 20%。","vignette_title":"情景 2：把干性开关按下去以后","gidx":4,"gn":5,"anchor":"克隆变为铺展的扁平细胞"},{"id":"gc5-02-5","ch":27,"part":5,"tag":"判读","stem":"关于本实验所反映的极性、黏附与分化关系，下列判断正确的是（X 型多选）","options":["钙黏素经连环蛋白与肌动蛋白微丝相连","细胞决定先于形态分化，环境改变后仍按原方向分化","细胞外钙离子浓度可影响黏附连接的完整性","细胞分化伴随基因组改变与染色体的丢失","紧密连接与黏着连接共同参与细胞顶底极性的维持"],"answer":[0,1,2,4],"explain":"答案 ABCE。E对：紧密连接提供栅栏、黏着连接提供机械连接与信号，二者共同参与顶底极性的建立与维持。B对：细胞决定发生在形态差异出现之前，是分化方向的稳定确立，此后环境改变仍按既定方向分化。C对：无钙培养使黏着连接迅速解体、低钙培养时变化缓慢，说明细胞外钙离子浓度影响连接的完整性。A对：钙黏素经β-连环蛋白、α-连环蛋白与肌动蛋白微丝相连，β-连环蛋白还可入核参与基因表达调控。D错：分化不涉及基因组改变与染色体丢失，基因组保持完整，差异来自基因的时空选择性表达。","type":"X","group":"c5-02","kind":"mechanism","chs":[24,8,27],"vignette":"把培养的单层肠上皮细胞置于无钙培养液中，30分钟后电镜下可见相邻细胞之间的黏着连接解体、细胞间隙增宽，位于细胞顶端的封闭带也随之断裂。荧光标记显示：原本只分布在顶端膜上的转运体，此时扩散到了基底面；基底面的钠钾泵也出现在顶端膜上。细胞新合成的顶端膜蛋白仍能被包装入囊泡并运往细胞表面，但囊泡无法在顶端定位。研究者改用低浓度钙离子培养液（0.1mmol/L）后，上述变化在2小时内才缓慢出现。","vignette_title":"情景 2：把钙离子拿走之后","gidx":5,"gn":5,"anchor":"改用低浓度钙离子培养液"},{"id":"gc9-01-1","ch":27,"part":5,"tag":"判读","stem":"两种祖细胞的基因组序列一致而蛋白质组不同，其根本原因是","options":["两细胞的染色体数目不同，导致基因拷贝数存在差异","两细胞中蛋白质降解速率不同，导致蛋白质组出现差异","组织特异性基因发生时空选择性表达，基因组保持完整","两细胞通过 DNA 序列重排适应环境，产生新的基因","两细胞的基因数目不同，分化中丢失了不表达的基因"],"answer":2,"explain":"C 对：情景给出测序无差异、核型正常，差异只能来自组织特异性基因的时空选择性表达，基因组保持完整。E 错：分化并不丢失基因，核移植实验已证明分化细胞的核基因组完整。A 错：两细胞核型正常，染色体数目并未改变。B 错：蛋白质降解只影响蛋白质的数量，解释不了 mRNA 水平的差异。D 错：DNA 序列重排与测序无差异、STR 分型一致的描述直接矛盾。","type":"A1","group":"c9-01","kind":"mechanism","chs":[22,27,20],"vignette":"从同一份骨髓样本中分选出红系祖细胞与粒系祖细胞，在同一培养条件下同步培养。两者的核型正常，STR 分型一致，全基因组测序未发现序列差异。检测显示：红系祖细胞中 β-珠蛋白基因启动子上游的增强子区组蛋白 H3 乙酰化水平很高，GATA-1 在该区富集，该基因 mRNA 占总 mRNA 的 30%；粒系祖细胞中同一区域 DNA 甲基化程度高、乙酰化水平很低，GATA-1 几乎不结合，该基因 mRNA 不足 1%。两细胞内 RNA 聚合酶 II 的总量、TATA 结合蛋白的水平以及通用转录因子的种类并无差别。","vignette_title":"情景 1：同一份基因组，两套表达程序","gidx":1,"gn":5,"anchor":"全基因组测序未发现序列差异"},{"id":"gc9-01-4","ch":27,"part":5,"tag":"判读","stem":"关于这两种祖细胞的比较，下列判断正确的是（X 型多选）","options":["红系中该基因位点的染色质疏松，有利于反式因子结合","两细胞中聚合酶总量相同，说明差异不在聚合酶的数量","粒系中该基因的沉默与其染色质高度折叠的状态有关","两细胞含相同的基因组，差异来自基因的选择性表达","该基因在粒系中不转录，是因为其增强子序列已经丢失"],"answer":[0,1,2,3],"explain":"答案 ABCD。D 对应测序无差异与组织特异性基因的选择性表达；A、C 对应红系乙酰化高、粒系甲基化高所形成的不同染色质状态；B 对应情景中两细胞 RNA 聚合酶 II 总量并无差别。E 错：测序未发现序列差异，增强子序列并未丢失，粒系中的沉默来自染色质状态与反式因子结合的差异。","type":"X","group":"c9-01","kind":"mechanism","chs":[22,27,20],"vignette":"从同一份骨髓样本中分选出红系祖细胞与粒系祖细胞，在同一培养条件下同步培养。两者的核型正常，STR 分型一致，全基因组测序未发现序列差异。检测显示：红系祖细胞中 β-珠蛋白基因启动子上游的增强子区组蛋白 H3 乙酰化水平很高，GATA-1 在该区富集，该基因 mRNA 占总 mRNA 的 30%；粒系祖细胞中同一区域 DNA 甲基化程度高、乙酰化水平很低，GATA-1 几乎不结合，该基因 mRNA 不足 1%。两细胞内 RNA 聚合酶 II 的总量、TATA 结合蛋白的水平以及通用转录因子的种类并无差别。","vignette_title":"情景 1：同一份基因组，两套表达程序","gidx":4,"gn":5,"anchor":"GATA-1 几乎不结合"},{"id":"gc9-02-4","ch":27,"part":5,"tag":"机制","stem":"治疗浓度维A酸使早幼粒细胞走向成熟，其分子过程是","options":["融合受体的 DNA 结合结构域突变，丧失结合能力","融合受体被蛋白酶彻底降解，靶基因的抑制被解除","融合受体构象改变，释放共阻遏物并招募共激活物","细胞内组蛋白被大量降解，靶基因的核小体减少","靶基因的启动子被重新甲基化而恢复转录活性"],"answer":2,"explain":"C 对：情景给出结合治疗浓度维A酸后，融合受体构象改变、释放共阻遏物并招募共激活物与组蛋白乙酰转移酶，靶基因重新转录，细胞恢复原有的分化程序。B 错：情景中没有受体被降解的证据，起作用的是构象变化。A 错：若 DNA 结合结构域突变而丧失结合能力，就谈不上重新激活靶基因。E 错：DNA 甲基化通常抑制转录，与恢复活性方向相反。D 错：核小体不会因治疗而大量消失，常染色质的形成靠修饰与重塑而不是组蛋白降解。","type":"A1","group":"c9-02","kind":"mechanism","chs":[22,27,25],"vignette":"一名急性早幼粒细胞白血病患者的外周血中，异常早幼粒细胞占 85%，这些细胞停滞在该阶段不再成熟。患者的维A酸受体 α（RARα）基因因染色体易位形成异常融合受体：它是一种反式作用因子，在生理浓度维A酸下仍与共阻遏物结合，并招募组蛋白去乙酰化酶，使粒细胞分化相关基因启动子区的乙酰化水平偏低、转录受抑。给予治疗浓度全反式维A酸（维A酸属脂溶性配体，可直接穿过细胞膜进入细胞）后，融合受体构象改变，释放共阻遏物、招募共激活物与组蛋白乙酰转移酶，靶基因重新转录。用药 4 周后，外周血早幼粒细胞降至 5%，中性粒细胞逐步恢复。","vignette_title":"情景 2：把抑制器换成激活器","gidx":4,"gn":5,"anchor":"融合受体构象改变"},{"id":"gc9-02-5","ch":27,"part":5,"tag":"判读","stem":"关于该病从受体异常到分化阻滞的过程，下列判断正确的是（X 型多选）","options":["治疗有效说明表达调控的改变可以逆转分化阻滞","异常受体作为反式作用因子抑制了分化相关基因","靶基因启动子区乙酰化偏低与其转录受抑相符","该病说明细胞的分化阻滞一旦形成便无法被逆转","维A酸与胞内受体结合后，受体直接调控基因转录"],"answer":[0,1,2,4],"explain":"答案 ABCE。A、B、C、E 分别对应情景中的四条线索：融合受体属于反式作用因子、靶基因乙酰化偏低、维A酸与胞内受体结合后受体直接调控转录、治疗后细胞恢复成熟。D 错：治疗有效恰恰说明分化阻滞可以被逆转，与 D 自相矛盾，也违背了分化具有可逆性与细胞具有可塑性的基本观点。","type":"X","group":"c9-02","kind":"mechanism","chs":[22,27,25],"vignette":"一名急性早幼粒细胞白血病患者的外周血中，异常早幼粒细胞占 85%，这些细胞停滞在该阶段不再成熟。患者的维A酸受体 α（RARα）基因因染色体易位形成异常融合受体：它是一种反式作用因子，在生理浓度维A酸下仍与共阻遏物结合，并招募组蛋白去乙酰化酶，使粒细胞分化相关基因启动子区的乙酰化水平偏低、转录受抑。给予治疗浓度全反式维A酸（维A酸属脂溶性配体，可直接穿过细胞膜进入细胞）后，融合受体构象改变，释放共阻遏物、招募共激活物与组蛋白乙酰转移酶，靶基因重新转录。用药 4 周后，外周血早幼粒细胞降至 5%，中性粒细胞逐步恢复。","vignette_title":"情景 2：把抑制器换成激活器","gidx":5,"gn":5,"anchor":"外周血早幼粒细胞降至 5%"},{"id":"gc9-04-5","ch":27,"part":5,"tag":"判读","stem":"报告基因活性随红系分化进程逐步升高，这一现象说明","options":["细胞内 RNA 聚合酶 II 的总量随分化不断增多","分化中红系特异反式因子逐步建立，调控程序随之改变","该增强子片段在分化后期发生了新的碱基序列改变","细胞基因组在分化过程中逐步获得了新的珠蛋白基因","报告基因载体在细胞内的拷贝数随培养天数不断增加"],"answer":1,"explain":"B 对：分化的实质是组织特异性基因的时空选择性表达，分化过程中红系特异的反式因子（如 GATA-1）逐步建立，使增强子活性随分化进程升高。E 错：稳定转染的载体拷贝数不会随培养天数不断线性增加。D 错：分化不产生新基因，细胞基因组保持完整。C 错：增强子序列本身在分化中没有改变，改变的是结合其上的因子与修饰。A 错：聚合酶总量增多解释不了为何只有报告基因活性升高，且情景中两细胞聚合酶总量相同。","type":"A1","group":"c9-04","kind":"experiment","chs":[22,27,28],"vignette":"研究生小陈把 β-珠蛋白基因上游 2 kb 的增强子片段接到荧光素酶报告基因上，分别转入红系细胞与宫颈癌细胞。红系中荧光素酶活性是宫颈癌细胞的 40 倍；把片段中一段 12 bp 序列定点突变后，红系中的活性倍数降到 3 倍。EMSA 中，红系核提取物与该 12 bp 探针孵育出现一条滞后条带，加入 50 倍未标记的同源探针后条带消失，加入抗 GATA-1 抗体后出现迁移更慢的条带。ChIP 显示抗 GATA-1 抗体沉淀的 DNA 中，该增强子片段富集 25 倍，对照抗体为 1 倍。另一部分实验里，流式分选出的 CD34 阳性 CD38 阴性细胞在受照小鼠体内能长期重建全部血细胞，连续移植仍可重建；把同一报告基因转入正在向红系分化的 CD34 阳性细胞后，活性随培养天数逐步升高。","vignette_title":"情景 4：一条滞后条带引出的四个实验","gidx":5,"gn":6,"anchor":"活性随培养天数逐步升高"},{"ch":27,"part":5,"tag":"分化实质","stem":"细胞分化的实质是：","options":["细胞基因组发生改变，选择性丢失不表达的基因","细胞数量增加所导致的形态差异","组织特异性基因在时间和空间上的选择性表达，细胞基因组保持完整","染色体数目和结构的改变","细胞质中细胞器数量的差异，与基因表达无关"],"answer":2,"explain":"分化细胞的基因组完整（核移植实验可证明），差异在于基因的选择性表达，而非基因丢失或染色体改变。","type":"A1","id":"c27-eccfba36"},{"ch":27,"part":5,"tag":"分化特点","stem":"关于细胞分化特点的叙述，正确的是：","options":["细胞一旦分化即绝对不可逆，任何条件下都不能改变","细胞分化仅发生在胚胎期，成体组织不再发生分化","细胞分化程度越高，其分化潜能越大","细胞决定发生在细胞分化之后，是分化的结果","细胞分化具有稳定性、可逆性和时空特异性，分化细胞在特定条件下可表现出可塑性"],"answer":4,"explain":"分化具有稳定性但并非绝对不可逆；成体仍有干细胞分化；决定先于分化，分化潜能随分化程度升高而降低。","type":"A1","id":"c27-586bfdc3"},{"ch":27,"part":5,"tag":"分化潜能","stem":"对“分化潜能随分化进行而受限”与“已分化细胞核具有全能性”的理解，正确的是：","options":["分化过程中细胞核遗传物质逐渐丢失，因此分化潜能越来越受限","细胞核全能性说明分化是可逆的，基因表达调控不具有稳定性","全能性只见于受精卵，已分化的细胞核在任何条件下都不能被重编程","分化中核基因组保持完整，潜能受限主要源于基因表达调控状态（表观遗传修饰等）的改变；在去核卵母细胞胞质中，已分化细胞的核可被重编程而恢复全能性","细胞核全能性只取决于核本身，与卵母细胞胞质环境无关"],"answer":3,"explain":"体细胞核移植与克隆动物证明基因组完整、潜能受限源于调控状态；重编程依赖卵母细胞胞质中的因子。","type":"A1","id":"c27-b2b2c3b6"},{"ch":27,"part":5,"tag":"分化调控","stem":"关于影响细胞分化的因素，下列叙述正确的是：","options":["细胞分化由胞外信号分子、细胞间接触与位置信息等外在因素，与细胞内转录因子等内在因素共同决定","细胞分化只受细胞内基因控制，与细胞外环境无关","位置效应是指细胞分化方向只取决于细胞自身的基因型","激素对体内所有细胞的效应完全相同，不具有组织特异性","胚胎诱导是指细胞完全自主地决定分化方向，不依赖相邻组织"],"answer":0,"explain":"位置效应、胚胎诱导、激素与细胞间相互作用均为分化的重要调控因素，激素的效应具有组织特异性。","type":"A1","id":"c27-585645a8"},{"ch":27,"part":5,"tag":"造血分化","stem":"以造血干细胞分化为例，关于转录因子调控的叙述正确的是：","options":["造血干细胞的分化方向仅由细胞因子决定，与转录因子无关","GATA 家族、PU.1 等转录因子通过调控谱系特异性基因的表达决定造血细胞的分化方向，不同转录因子间可相互拮抗形成调控网络","同一种转录因子在全部造血谱系中表达水平完全相同","转录因子通过改变 DNA 序列来决定分化方向","造血干细胞的分化方向由细胞体积大小决定"],"answer":1,"explain":"造血细胞分化受转录因子调控，转录因子通过调控基因表达而非改变 DNA 序列决定谱系走向。","type":"A1","id":"c27-7bb67696"},{"ch":27,"part":5,"tag":"胚胎期造血","stem":"关于哺乳动物胚胎期永久性造血的发生部位，下列叙述正确的是：","options":["永久性造血只发生在卵黄囊，其他部位仅有血岛形成","胚胎期造血自始至终都发生在骨髓中","永久性造血只发生在胎肝，出生后造血全部转移至脾","造血干细胞起源于胎盘，卵黄囊没有造血功能","卵黄囊血岛主要产生原始红细胞；永久性造血先后发生于 AGM 区（主动脉-性腺-中肾区）和胎肝，最终定位于骨髓"],"answer":4,"explain":"胚胎期造血历经卵黄囊、AGM 区、胎肝和骨髓等部位，并非局限于卵黄囊一处。","type":"A1","id":"c27-9cb84fb7"},{"ch":27,"part":5,"tag":"细胞决定","stem":"细胞决定是指：","options":["细胞已经表现出明显的形态与功能特征","细胞丧失进一步分化的能力","细胞在出现形态结构差异之前已获得向特定方向分化的稳定能力，此后即使环境改变仍按既定方向分化","细胞决定伴随基因丢失，使细胞只能表达一种基因","细胞决定与分化同时发生，二者不可区分"],"answer":2,"explain":"决定先于分化，是分化方向的稳定性确立；分化才出现形态功能差异，且二者均不涉及基因丢失。","type":"A1","id":"c27-3c049623"},{"ch":27,"part":5,"tag":"核移植","stem":"关于体细胞核移植（SCNT），下列叙述正确的是：","options":["将供体细胞核移入去核卵母细胞中，激活后形成克隆胚胎，其核基因组与供体细胞相同","克隆动物的核基因组主要来自卵母细胞","体细胞核移植获得的克隆动物表型完全正常，不发生任何异常","核移植前必须去除供体细胞核中的全部基因才能实现重编程","核移植的重编程过程只有在胚胎移入子宫后才能完成"],"answer":0,"explain":"克隆动物的核基因组来自供体细胞，故基因型与供体相同；重编程在卵母细胞胞质中完成，克隆动物常见异常表型。","type":"A1","id":"c27-6f4f6dff"},{"ch":27,"part":5,"tag":"X染色体失活","stem":"关于哺乳动物 X 染色体失活与剂量补偿，下列叙述正确的是：","options":["雌性个体的两条 X 染色体均保持活性，以保证与雄性剂量一致","X 染色体失活过程中，失活 X 上的基因被整条染色体删除","X 染色体失活由 Xist 基因表达的 RNA 及 DNA 甲基化、组蛋白修饰等表观遗传机制介导，失活的 X 形成巴氏小体","X 染色体失活只发生在生殖细胞形成过程中，体细胞中两条 X 均保持活性","巴氏小体是失活 X 染色体与常染色体易位后形成的结构，与表观遗传修饰无关"],"answer":2,"explain":"Xist RNA 顺式包被失活 X 并招募表观修饰，形成异染色质的巴氏小体；X 染色体并未被删除，属剂量补偿。","type":"A1","id":"c27-15abe69f"},{"ch":27,"part":5,"tag":"去分化","stem":"细胞去分化的含义是：","options":["已分化细胞通过有丝分裂产生两个相同的分化细胞","已分化的细胞失去其特有的形态与功能特征，回到未分化或低分化状态，是分化可逆性的表现","未分化细胞在诱导下获得特定形态与功能特征","细胞在分化过程中逐渐丧失增殖能力而进入 G0 期","细胞核被移入去核卵母细胞后发生基因组重排"],"answer":1,"explain":"去分化是已分化细胞逆向回到未分化/低分化状态；分化程度降低、增殖能力回升是其特征。","type":"A1","id":"c27-276d109c"},{"ch":27,"part":5,"tag":"选择性表达","stem":"同一基因组在不同分化细胞中产生不同蛋白质组的根本原因是：","options":["不同细胞的基因数目不同，分化中基因被选择性丢失","不同细胞的染色体数目不同，导致基因拷贝数存在差异","转录后的蛋白质全部被泛素化降解，只有一种蛋白得以保留","组织特异性基因在不同时间和空间的选择性表达，细胞基因组保持完整","细胞通过改变 DNA 碱基序列来适应环境，产生新的基因"],"answer":3,"explain":"分化不涉及基因组改变（核移植可证），差异来自组织特异性基因的时空选择性表达。","type":"A1","id":"c27-4dba37a8"},{"ch":27,"part":5,"tag":"细胞决定","stem":"细胞决定与细胞分化的关系是：","options":["细胞决定与细胞分化同时发生，二者无法区分","细胞决定是细胞已表现出明显形态与功能差异的阶段","细胞决定发生在形态差异出现之前，使细胞获得向特定方向分化的稳定能力，此后即使环境改变仍按既定方向分化","细胞决定伴随基因选择性丢失，使细胞只能表达一种基因","细胞决定是分化完成后的终末状态，细胞从此不再增殖"],"answer":2,"explain":"决定先于分化：形态变化之前分化方向已被稳定确定，且具有自主性，环境改变后仍按原方向分化。","type":"A1","id":"c27-b2f1454c"},{"ch":27,"part":5,"tag":"分化与肿瘤","stem":"关于细胞分化与肿瘤发生、治疗的关系，正确的是：","options":["肿瘤细胞的分化程度越低，其恶性程度通常越低，预后越好","肿瘤细胞均保持与来源组织完全相同的分化特征和功能","肿瘤发生与细胞分化调控异常无关，仅由细胞增殖失控引起","肿瘤细胞常呈现去分化或低分化特征，分化诱导剂（如全反式维A酸、亚砷酸）可诱导其分化成熟用于治疗","分化诱导治疗通过杀伤肿瘤干细胞而根治所有类型的白血病"],"answer":3,"explain":"肿瘤细胞常有去分化/低分化表型且分化程度与恶性程度相关；全反式维A酸、亚砷酸用于急性早幼粒细胞白血病诱导分化。","type":"A1","id":"c27-cab8fff7"},{"ch":27,"part":5,"tag":"胚胎诱导","stem":"关于胚胎诱导，正确的叙述是：","options":["胚胎诱导是指细胞完全自主地决定分化方向，不受相邻组织影响","胚胎诱导是指所有细胞在胚胎期同步分化为相同类型的细胞","胚胎诱导仅由胞内转录因子决定，与细胞间的相互作用无关","胚胎诱导是指激素经血液运输作用于远隔靶组织的过程","一部分细胞（组织者）产生信号作用于相邻的另一部分细胞，使其向特定方向分化，是细胞间相互作用调控分化的典型方式"],"answer":4,"explain":"诱导指组织者发出信号使相邻反应组织按特定方向分化，如中胚层背唇诱导外胚层形成神经管。","type":"A1","id":"c27-81fc90c4"},{"ch":27,"part":5,"tag":"位置效应","stem":"在蝾螈肢芽发育实验中，将肢芽远端组织移植到近端位置后，再生的肢体结构按新位置形成。该结果说明：","options":["细胞的分化方向受其所处位置信息的影响，位置效应是分化调控的重要因素","细胞分化方向完全由细胞自身基因型预先决定，与位置无关","移植组织的基因在移植后发生了突变，改变了分化方向","细胞的基因组在移植过程中被删除了一部分，故只能形成近端结构","激素是决定肢体结构形成顺序的唯一因素"],"answer":0,"explain":"位置效应指细胞分化方向受其所处位置信号影响，移植后按新位置形成结构是该效应的经典证据。","type":"A1","id":"c27-4a05e71d"},{"ch":27,"part":5,"tag":"激素与分化","stem":"关于激素对细胞分化的调节作用，正确的是：","options":["激素对体内所有细胞的效应完全相同，不具有组织特异性","激素只调节细胞代谢速率，不参与细胞分化方向的调控","激素作为分化调控因素仅在成体组织发挥作用，胚胎期细胞分化不依赖激素","激素通过磷脂酶 C 水解 PIP2 生成 IP3 才能影响细胞分化","蝌蚪变态发育中甲状腺激素诱导尾部细胞凋亡与肢体形成，说明激素是细胞分化调控的重要因素"],"answer":4,"explain":"甲状腺激素启动蝌蚪变态发育，性激素和糖皮质激素等也调控分化，激素效应具有组织特异性。","type":"A1","id":"c27-28cde98d"},{"id":"gc18-03-2","ch":28,"part":5,"tag":"机制","stem":"甲组保持未分化表型的比例远高于乙组与丙组，其原因是","options":["成骨细胞以膜结合配体与细胞因子维持干细胞龛","成骨细胞分泌的干细胞因子浓度高于丙组的培养液","滤膜阻挡了培养液中的营养物，使乙组细胞饥饿","乙组细胞在滤膜上无法贴壁，因而丢失了干性","甲组细胞分裂次数少于乙组，故分化程度更低"],"answer":0,"explain":"A 对：成骨细胞作为龛细胞，既提供膜结合配体经接触信号作用，也分泌细胞因子，二者共同维持造血干细胞的自我更新与分化平衡。B 错：丙组补加等量干细胞因子后干性细胞只升到 34%，说明可溶因子的浓度差异不是甲组与丙组差距的全部原因。C 错：滤膜孔径为 0.4µm，培养液中的营养物可以自由通过，不存在饥饿。D 错：情景显示乙组细胞仍存活并分裂，并未因无法贴壁而死亡。E 错：干性比例反映的是微环境信号与基因表达调控，不能归因于分裂次数之差。","type":"A1","group":"c18-03","kind":"mechanism","chs":[28,25,27],"vignette":"研究者把小鼠造血干细胞分为三组培养：甲组与成骨细胞在同一培养皿中直接接触；乙组与成骨细胞之间隔一层孔径0.4µm的滤膜，培养液可自由通过而细胞不能接触；丙组不铺成骨细胞，仅用基础培养液培养。7天后，甲组中保持未分化表型的细胞占82%，乙组降到21%，丙组只有9%；给丙组补加干细胞因子后也只升到34%。甲组细胞中Notch受体的胞内段进入细胞核，其靶基因Hes1的转录本比乙组高6倍；加入γ-分泌酶抑制剂DAPT后，甲组该比例降到18%。稀释实验显示，甲组细胞每4次分裂中有3次产生一个保持干性的子细胞与一个开始表达髓系标志的子细胞，乙组细胞则大多分裂成两个走向分化的子细胞。","vignette_title
