answer":4,"explain":"白细胞渗出依次经边集、滚动、黏附、游出和趋化作用；趋化因子具有特异性，外源性如可溶性细菌产物，内源性如白三烯、C5a和细胞因子等。","id":"z10-5f4ca638","type":"A1"},{"unit":"U10","ch":10,"part":3,"tag":"炎症细胞","stem":"寄生虫感染和过敏反应时，患者外周血中最常增多的白细胞是","options":["中性粒细胞","嗜碱性粒细胞","嗜酸性粒细胞","淋巴细胞","单核细胞"],"answer":2,"explain":"细菌感染以中性粒细胞增多为主，寄生虫感染和过敏反应引起嗜酸性粒细胞增多，一些病毒感染（如腮腺炎、风疹）则选择性引起淋巴细胞增多。","id":"z10-a238c4cb","type":"A1"},{"unit":"U10","ch":10,"part":3,"tag":"炎症介质","stem":"下列炎症介质中，属于血管活性胺、主要储存于肥大细胞和嗜碱性粒细胞颗粒内的是","options":["组胺","前列腺素","白三烯","肿瘤坏死因子（TNF）","5-羟色胺"],"answer":0,"explain":"组胺是主要储存于肥大细胞和嗜碱性粒细胞颗粒内的血管活性胺，可使小血管扩张、通透性升高；前列腺素、白三烯属花生四烯酸代谢产物。","id":"z10-56b5ca48","type":"A1"},{"unit":"U10","ch":10,"part":3,"tag":"急性炎症类型","stem":"白喉和细菌性痢疾时，黏膜表面由渗出的纤维素、白细胞和坏死上皮形成假膜。该炎症类型是","options":["浆液性炎","假膜性炎","化脓性炎","出血性炎","变质性炎"],"answer":1,"explain":"黏膜的纤维素性炎渗出的纤维素、白细胞和坏死上皮在黏膜表面形成假膜，又称假膜性炎；浆液性炎以浆液渗出为主，化脓性炎以大量中性粒细胞渗出为特征。","id":"z10-50b54b72","type":"A1"},{"unit":"U10","ch":10,"part":3,"tag":"肉芽肿性炎","stem":"结核肉芽肿的中心为干酪样坏死，坏死灶周围可见大量类上皮细胞和朗汉斯巨细胞。其中由巨噬细胞衍生而来、最重要的细胞成分是","options":["中性粒细胞","朗汉斯巨细胞","成纤维细胞","类上皮细胞","浆细胞"],"answer":3,"explain":"类上皮细胞由巨噬细胞衍生而来，是结核肉芽肿中最重要的成分；肉芽肿外围为淋巴细胞和成纤维细胞，能包围病原微生物、限制其向周围扩散。","id":"z10-2f2e7b25","type":"A1"},{"unit":"U10","ch":10,"part":3,"tag":"炎症结局","stem":"化脓菌引起的败血症进一步发展，化脓菌团（细菌栓子）随血流运行，在全身多处组织器官形成多发性栓塞性脓肿，该状态称为","options":["菌血症","毒血症","脓毒血症","败血症","淋巴道播散"],"answer":2,"explain":"脓毒血症时化脓菌团随血流运行，在全身多处形成多发性栓塞性脓肿；菌血症无全身中毒表现，毒血症为细菌毒素入血，败血症时细菌大量繁殖并产生毒素。","id":"z10-72b88b07","type":"A1"},{"unit":"U11","ch":11,"part":3,"tag":"发热概念","stem":"发热与过热的本质区别在于","options":["体温升高的幅度不同","体温调节中枢调定点是否上移","是否由病原微生物感染引起","是否伴有寒战","体温是否超过正常值0.5℃"],"answer":1,"explain":"发热是致热原使调定点上移的调节性体温升高；过热是调定点未移动的被动性体温升高，其本质区别在调定点是否上移。","id":"z11-f8c756bc","type":"A1"},{"unit":"U11","ch":11,"part":3,"tag":"致热原","stem":"下列物质中属于内源性致热原的是","options":["革兰阴性菌内毒素","革兰阳性菌外毒素","抗原-抗体复合物","白细胞介素-1","致热性类固醇"],"answer":3,"explain":"内源性致热原（EP）是一组致热性细胞因子，包括IL-1、TNF、IL-6、IFN等；A、B、C、E均为发热激活物。","id":"z11-f6202c49","type":"A1"},{"unit":"U11","ch":11,"part":3,"tag":"体温调节中枢","stem":"体温调节的正调节中枢位于","options":["视前区-下丘脑前部（POAH）","中杏仁核（MAN）","腹中隔（VSA）","延髓","脊髓"],"answer":0,"explain":"正调节中枢位于POAH，含冷敏和热敏神经元；MAN与VSA为负调节中枢，延髓和脊髓属次级中枢。","id":"z11-2453d892","type":"A1"},{"unit":"U11","ch":11,"part":3,"tag":"解热药机制","stem":"阿司匹林解热的主要作用机制是","options":["直接中和循环中的内源性致热原","抑制下丘脑终板血管器对致热原的转运","抑制环氧化酶活性，减少前列腺素E的生成","促进精氨酸加压素等负调节介质释放","直接抑制骨骼肌寒战而减少产热"],"answer":2,"explain":"阿司匹林抑制环氧化酶、减少中枢前列腺素E生成，使上调的调定点下降而退热，属阻断发热介质合成环节。","id":"z11-47ab34a6","type":"A1"},{"unit":"U11","ch":11,"part":3,"tag":"热限","stem":"下列属于发热负调节介质、与热限形成有关的是","options":["前列腺素E","环磷酸腺苷","促肾上腺皮质激素释放激素","一氧化氮","精氨酸加压素"],"answer":4,"explain":"精氨酸加压素、α-黑素细胞刺激素等为负调节介质，限制体温上升幅度而形成热限；A~D均为正调节介质。","id":"z11-6c73ea17","type":"A1"},{"unit":"U11","ch":11,"part":3,"tag":"发热时相","stem":"发热体温上升期机体产热增加的主要方式是","options":["骨骼肌寒战","皮肤血管扩张","汗腺分泌增加","呼吸加深加快","尿量增多"],"answer":0,"explain":"体温上升期以骨骼肌寒战为主要产热方式，此外还有棕色脂肪产热和代谢率升高；皮肤血管扩张、出汗为散热反应。","id":"z11-b8fe8b87","type":"A1"},{"unit":"U11","ch":11,"part":3,"tag":"热代谢特点","stem":"关于发热各时相热代谢特点的叙述，正确的是","options":["体温上升期散热大于产热","体温上升期产热与散热在较高水平保持平衡","高温持续期产热与散热在较高水平保持平衡","体温下降期产热大于散热","体温下降期产热与散热在较低水平保持平衡"],"answer":2,"explain":"高温持续期体温在新调定点水平波动，产热与散热在较高水平平衡；上升期产热大于散热，下降期散热大于产热。","id":"z11-5a39703e","type":"A1"},{"unit":"U11","ch":11,"part":3,"tag":"发热代谢变化","stem":"关于发热时机体代谢变化的叙述，正确的是","options":["体温每升高1℃，代谢率约升高3%","糖原分解减少，血糖降低","蛋白质合成增加，出现正氮平衡","脂肪分解减少，血游离脂肪酸降低","体温每升高1℃，代谢率约升高13%，分解代谢增强"],"answer":4,"explain":"发热时分解代谢增强，体温每升高1℃代谢率约升高13%，糖原、脂肪和蛋白质消耗增加，可出现负氮平衡和酮症。","id":"z11-123b02f5","type":"A1"},{"unit":"U11","ch":11,"part":3,"tag":"发热功能变化","stem":"关于发热时机体功能变化的叙述，正确的是","options":["心率减慢，心肌收缩力减弱","心率加快，心输出量增加，心脏负荷加重","消化液分泌增多，胃肠蠕动增强","呼吸变浅变慢","体温上升期尿量明显增多"],"answer":1,"explain":"发热时交感-肾上腺髓质系统兴奋，心率加快、心输出量增加而加重心脏负荷；消化液分泌减少，发热上升期尿量减少。","id":"z11-d8045756","type":"A1"},{"unit":"U11","ch":11,"part":3,"tag":"发热防治原则","stem":"关于发热处理原则的叙述，正确的是","options":["体温超过37.5℃即应常规使用解热药","解热药可替代针对原发病的病因治疗","所有发热患者均应首先采用物理降温","体温低于40℃且不伴严重疾病者可不急于解热，以免掩盖病情","应尽早解热以便及时明确病情"],"answer":3,"explain":"体温低于40℃且不伴严重疾病者可不急于解热，以免掩盖病情；高热（>40℃）、心脏病、妊娠及恶性肿瘤患者应及时解热。","id":"z11-09cec99e","type":"A1"},{"unit":"U12","ch":12,"part":3,"tag":"体内过程","stem":"关于药物体内过程（ADME）的叙述，正确的是","options":["生物转化是药物在体内发生化学结构改变、生成代谢物的过程","吸收、分布和排泄均使药物发生化学结构改变","排泄是指药物在肝药酶催化下生成代谢物的过程","消除仅指药物自肾和胆汁排出的过程","分布是指药物经血液循环进入肝并被代谢的过程"],"answer":0,"explain":"生物转化（代谢）是唯一使药物发生化学结构改变的过程，吸收、分布、排泄仅有量的改变；消除包括生物转化和排泄。","id":"z12-7a36e47b","type":"A1"},{"unit":"U12","ch":12,"part":3,"tag":"药物转运","stem":"关于药物被动转运特点的叙述，正确的是","options":["需要特异性载体参与并消耗ATP","顺浓度差转运，不消耗能量，无饱和现象和竞争性抑制","转运速度与膜两侧浓度差无关","具有饱和现象和竞争性抑制现象","可由低浓度侧向高浓度侧转运"],"answer":1,"explain":"被动转运顺浓度差进行、不耗能、不需载体，故无饱和性和竞争性抑制；需载体、耗能并有饱和性者属主动转运。","id":"z12-9ea1aafe","type":"A1"},{"unit":"U12","ch":12,"part":3,"tag":"首过效应","stem":"硝酸甘油舌下含服给药的主要药动学意义是","options":["减慢药物吸收以延长作用时间","减少药物与血浆蛋白的结合","避免肝首过效应，提高生物利用度","使药物的转运方式由被动转运变为主动转运","增加药物在肝内的生物转化"],"answer":2,"explain":"舌下黏膜吸收的药物不经门静脉和肝，可避免首过效应、提高生物利用度；口服给药则易受首过效应影响。","id":"z12-5476cbfc","type":"A1"},{"unit":"U12","ch":12,"part":3,"tag":"药物分布","stem":"关于药物与血浆蛋白结合的叙述，正确的是","options":["结合型药物可自由透过细胞膜到达靶部位","结合型药物的药理活性比游离型药物更强","药物与血浆蛋白的结合不可逆且无饱和性","只有游离型药物能透过细胞膜分布到靶部位发挥药理作用","血浆蛋白结合率高的药物消除较快、作用维持时间短"],"answer":3,"explain":"结合型药物分子量增大，不能跨膜转运、无药理活性也不被代谢排泄；仅游离型药物可分布到靶部位产生效应。","id":"z12-130e8e15","type":"A1"},{"unit":"U12","ch":12,"part":3,"tag":"药物排泄","stem":"弱酸性药物苯巴比妥中毒时，碱化尿液可加速其排泄，机制是","options":["增加肾小球滤过膜的孔径","使药物与血浆蛋白结合率升高","促进药物在肝内与葡萄糖醛酸结合","使药物在肾小管中非解离型增多而易于排出","使药物在肾小管中解离型增多、脂溶性降低，重吸收减少"],"answer":4,"explain":"碱化尿液使弱酸性药物解离型增多、脂溶性降低，肾小管重吸收减少而排泄加快；酸化尿液则作用相反。","id":"z12-4a99c7ae","type":"A1"},{"unit":"U12","ch":12,"part":3,"tag":"生物转化","stem":"关于药物生物转化第Ⅱ相反应（结合反应）的叙述，正确的是","options":["药物或其代谢物与葡萄糖醛酸、硫酸、甘氨酸等结合，极性增大而利于排出","主要通过氧化、还原和水解反应向药物分子引入极性基团","主要由肝微粒体细胞色素P450酶系催化完成","结合反应后药物脂溶性升高，易被肾小管重吸收","第Ⅱ相反应只能使药物灭活，不能生成活性代谢物"],"answer":0,"explain":"Ⅱ相反应是药物或其代谢物与葡萄糖醛酸、硫酸等结合，使极性增高、水溶性增加而利于排出；氧化、还原、水解属Ⅰ相反应。","id":"z12-cf6151d9","type":"A1"},{"unit":"U12","ch":12,"part":3,"tag":"一级动力学","stem":"关于一级消除动力学特点的叙述，正确的是","options":["单位时间内消除的药量恒定不变","药物转运速率与血药浓度成正比，半衰期恒定","半衰期随血药浓度升高而延长","血药浓度对时间作图呈直线下降","属于饱和动力学，需载体或酶系统参与"],"answer":1,"explain":"一级动力学为恒比转运，半衰期恒定且与血药浓度无关；单位时间消除药量恒定、半衰期随剂量延长者为零级动力学。","id":"z12-dca3a5d0","type":"A1"},{"unit":"U12","ch":12,"part":3,"tag":"零级动力学","stem":"关于零级消除动力学特点的叙述，正确的是","options":["单位时间内转运或消除药物的百分率恒定","半衰期恒定，与血药浓度无关","单位时间内消除的药量恒定，半衰期随剂量增大而延长","药物浓度的对数值与时间作图呈直线","是大多数药物在治疗剂量范围内的消除方式"],"answer":2,"explain":"零级动力学为恒速转运，单位时间消除药量恒定，半衰期随初始血药浓度升高而延长；A、B、D为一级动力学特征。","id":"z12-af3079a3","type":"A1"},{"unit":"U12","ch":12,"part":3,"tag":"半衰期","stem":"关于药物血浆消除半衰期（t1/2）的叙述，正确的是","options":["按一级动力学消除的药物，其半衰期随血药浓度升高而延长","按零级动力学消除的药物，其半衰期恒定不变","半衰期主要反映药物吸收的快慢","一级动力学药物的半衰期与消除速率常数成反比，t1/2=0.693/K","半衰期越长，药物的效能越强"],"answer":3,"explain":"一级动力学药物t1/2=0.693/K，为恒定值；零级动力学药物半衰期随剂量（初始浓度）增大而延长。","id":"z12-305f1949","type":"A1"},{"unit":"U12","ch":12,"part":3,"tag":"生物利用度","stem":"关于生物利用度的叙述，正确的是","options":["生物利用度反映药物与血浆蛋白结合的程度","相对生物利用度以静脉注射制剂作为参比制剂计算","口服给药的绝对生物利用度常大于100%","生物利用度与药物制剂的质量无关","静脉注射给药的绝对生物利用度为100%"],"answer":4,"explain":"静脉注射药物全部直接进入体循环，绝对生物利用度为100%；血管外给药因首过效应等常小于100%。","id":"z12-452d0d1f","type":"A1"},{"unit":"U12","ch":12,"part":3,"tag":"表观分布容积","stem":"关于表观分布容积（Vd）的叙述，正确的是","options":["Vd是体内药物量按血浆相同浓度分布所需的体液总容积，并非药物真正占有的容积","体重70kg者Vd为5L时，提示药物主要分布于某器官组织中","Vd越大，提示药物排泄越快、体内存留时间越短","Vd越小，提示药物在体内分布越广","Vd与血药浓度成正比"],"answer":0,"explain":"表观分布容积是计算所得的抽象容积，Vd约5L提示药物基本分布于血浆中，Vd越大提示排泄越慢、体内存留越久。","id":"z12-56fd626c","type":"A1"},{"unit":"U12","ch":12,"part":3,"tag":"稳态血药浓度","stem":"关于多次给药后稳态血药浓度（Css）的叙述，正确的是","options":["增加剂量可缩短达到稳态浓度的时间","一级动力学药物约经5个半衰期可达到稳态血药浓度","稳态浓度与给药间隔时间成正比","平均稳态浓度等于稳态峰浓度与谷浓度的算术平均值","缩短给药间隔可明显缩短达到稳态所需时间"],"answer":1,"explain":"一级动力学药物约经5个半衰期达稳态；稳态浓度与剂量成正比、与给药间隔成反比，达稳态时间不变，且不是峰谷浓度的平均值。","id":"z12-b7f9cf63","type":"A1"},{"unit":"U12","ch":12,"part":3,"tag":"药时曲线","stem":"关于单次血管外给药后血药浓度-时间曲线的叙述，正确的是","options":["峰浓度时药物的吸收已经停止","曲线下降段主要反映药物的吸收过程","峰浓度时药物的吸收速率与消除速率相等","血药浓度降至最低有效浓度以下即进入有效期","有效期是指血药浓度高于最小中毒浓度的时间"],"answer":2,"explain":"峰浓度时药物吸收速率与消除速率相等；曲线下降段为代谢排泄相，血药浓度低于最低有效浓度后为残留期。","id":"z12-9c72e615","type":"A1"},{"unit":"U12","ch":12,"part":3,"tag":"量效关系","stem":"关于量反应与质反应的叙述，正确的是","options":["血压升降、心率增减属于质反应","质反应可用具体数量或最大反应的百分率表示","死亡与生存属于量反应","死亡、惊厥等质反应须用多个实验对象以阳性率表示","将药物浓度改用对数值作图，量效曲线呈直线"],"answer":3,"explain":"质反应为全或无反应，须用多个实验对象以阳性率表示；血压、心率等量反应以数量表示，对数浓度作图呈对称S形曲线。","id":"z12-4b117c7e","type":"A1"},{"unit":"U12","ch":12,"part":3,"tag":"阈浓度","stem":"最小有效浓度（阈浓度）是指","options":["能引起50%最大效应的浓度","引起最大效应时的浓度","引起50%实验对象死亡的浓度","血药浓度不再随时间变化的浓度","恰能引起药理效应的浓度"],"answer":4,"explain":"最小有效浓度即恰能引起效应的阈浓度，横坐标用剂量表示时称最小有效剂量；EC50和LD50分别为50%效应和50%死亡。","id":"z12-3f7a9c87","type":"A1"},{"unit":"U12","ch":12,"part":3,"tag":"效能与效价强度","stem":"关于药物效能与效价强度的叙述，正确的是","options":["利尿药中氢氯噻嗪的效价强度大于呋塞米，而呋塞米的最大效能大于氢氯噻嗪","效能是指药物与受体的亲和力，效价强度是指最大效应","效能与效价强度的含义相同，二者平行一致","效价强度数值越大，说明药物的强度越大","效价强度反映药物的内在活性"],"answer":0,"explain":"效能指最大效应，反映内在活性；效价强度指引起等效反应的剂量或浓度，其值越小强度越大，两者并不平行。","id":"z12-95ee6300","type":"A1"},{"unit":"U12","ch":12,"part":3,"tag":"半数有效量","stem":"关于半数有效量（ED50）的叙述，正确的是","options":["是指恰能引起药理效应的剂量","是指能引起50%最大效应（或50%阳性反应）的剂量","是指引起动物死亡的剂量","是指引起最大效应的剂量","ED50越大，药物的效能越强"],"answer":1,"explain":"ED50是引起50%最大效应的剂量，其值越小效价强度越大，但不反映效能高低；恰能引起效应的剂量为最小有效剂量。","id":"z12-dd60ab49","type":"A1"},{"unit":"U12","ch":12,"part":3,"tag":"治疗指数","stem":"关于治疗指数（TI）的叙述，正确的是","options":["TI=ED50/LD50，其值越大药物越安全","TI越大，说明药物的效价强度越大","TI=LD50/ED50，其值越大越安全，但该安全指标并不绝对可靠","两药ED50与LD50分别相等时，两药的毒性必然相同","TI是评价药物制剂生物等效性的指标"],"answer":2,"explain":"治疗指数为LD50/ED50，值越大越安全，但两药ED50、LD50相等时毒性仍可不同，故该指标并不绝对可靠。","id":"z12-60a689a9","type":"A1"},{"unit":"U12","ch":12,"part":3,"tag":"受体类型","stem":"胰岛素的受体属于下列哪一类受体","options":["门控离子通道型受体（离子型受体）","G蛋白偶联受体","细胞内（核内）受体","具有酪氨酸激酶活性的受体","兼有离子通道与酶活性的受体"],"answer":3,"explain":"胰岛素、表皮生长因子等受体的胞内段具有酪氨酸激酶活性；甾体激素和甲状腺激素受体属细胞内受体，起效较慢。","id":"z12-e0f1361c","type":"A1"},{"unit":"U12","ch":12,"part":3,"tag":"激动药与拮抗药","stem":"关于作用于受体的药物分类的叙述，正确的是","options":["拮抗药具有较强亲和力和内在活性","完全激动药有亲和力而无内在活性","部分激动药的内在活性α=1","喷他佐辛是典型的完全激动药","拮抗药有较强亲和力而无内在活性（α=0），可拮抗激动药的效应"],"answer":4,"explain":"拮抗药有较强亲和力而无内在活性（α=0），本身不产生效应但可拮抗激动药；完全激动药α=1，部分激动药如喷他佐辛α＜1。","id":"z12-3581c289","type":"A1"},{"unit":"U12","ch":12,"part":3,"tag":"竞争性拮抗","stem":"关于竞争性拮抗药特点的叙述，正确的是","options":["使激动药量效曲线平行右移，最大效应不变，增加激动药剂量可恢复原效应","使激动药量效曲线右移且最大效应降低","与受体呈不可逆结合，拮抗作用不可逆","既降低激动药与受体的亲和力又降低其内在活性","其拮抗强度不能用拮抗参数pA2表示"],"answer":0,"explain":"竞争性拮抗药只降低激动药亲和力而不降低内在活性，故量效曲线平行右移、最大效应不变，其强度用pA2表示。","id":"z12-62e96b35","type":"A1"},{"unit":"U12","ch":12,"part":3,"tag":"肝药酶","stem":"苯巴比妥长期与某药合用后该药疗效明显减弱，其可能机制是","options":["苯巴比妥抑制肝药酶，减慢该药代谢","苯巴比妥诱导肝药酶，加速该药的生物转化","苯巴比妥减少该药的吸收","苯巴比妥竞争血浆蛋白结合位点","苯巴比妥碱化尿液加速该药排泄"],"answer":1,"explain":"苯巴比妥、利福平、苯妥英钠等为肝药酶诱导剂，可加速合用药物的生物转化、降低其血药浓度和疗效。","id":"z12-35676e3b","type":"A1"},{"unit":"U12","ch":12,"part":3,"tag":"不良反应","stem":"长期服用可乐定降血压，突然停药后血压急剧回升，这种不良反应属于","options":["副作用","毒性反应","停药反应（回跃反应）","后遗效应","继发反应"],"answer":2,"explain":"突然停药后原有疾病加剧称停药反应或回跃反应（反跳）；后遗效应指停药后血药浓度降至阈浓度以下仍残留的效应。","id":"z12-9d2fb896","type":"A1"},{"unit":"U12","ch":12,"part":3,"tag":"耐受性与耐药性","stem":"关于机体对药物反应变化的叙述，正确的是","options":["连续用药后机体对药物反应强度递减、增加剂量也不能保持药效，称为耐受性","病原体对化学治疗药物敏感性降低称为耐受性","连续用药后机体对药物反应强度递减、增加剂量仍可保持药效，称为耐药性","连续用药后机体对药物反应强度递减、增加剂量可保持药效，称为耐受性；病原体敏感性降低则称耐药性","依赖性仅指精神上对药物的渴求，不包括成瘾性"],"answer":3,"explain":"耐受性是机体对药物反应强度递减、增加剂量可保持药效；病原体和肿瘤细胞敏感性降低称耐药性；习惯性与成瘾性统称依赖性。","id":"z12-c0c5f85b","type":"A1"},{"unit":"U13","ch":13,"part":4,"tag":"肿瘤细胞生物学特点","stem":"关于肿瘤细胞的生物学特点，下列哪项不属于本章所述肿瘤细胞的生物学特点？","options":["持续增殖、抵抗细胞死亡","逃脱生长抑制、无限复制与永生化","血管新生、侵袭和远处转移","维持基因组稳定性","逃避免疫攻击、促肿瘤炎症反应"],"answer":3,"explain":"本章所述特点之一是基因组不稳定性，而非维持基因组稳定；其余各项均为肿瘤细胞的生物学特点。","id":"z13-57354769","type":"A1"},{"unit":"U13","ch":13,"part":4,"tag":"癌症危险因素","stem":"下列哪项不属于本章所述的促进癌症发生的重要危险因素？","options":["吸烟与饮酒","规律体育锻炼","紫外线照射","不健康的饮食与体重超标","微生物感染"],"answer":1,"explain":"本章将“不运动”列为危险因素，规律体育锻炼不属于危险因素；吸烟、饮酒、紫外线、不健康饮食、体重超标与微生物感染均可促进癌症发生。","id":"z13-7f662765","type":"A1"},{"unit":"U13","ch":13,"part":4,"tag":"癌基因","stem":"本章所述BRAF基因突变引起细胞过度增殖的机制是？","options":["使BRAF蛋白失去激酶活性，阻断增殖信号","通过染色体重排产生新的融合基因","使BRAF蛋白持续激活MAPK信号通路","使BRAF蛋白持续激活PI3K-AKT通路","使BRAF蛋白降解受阻，细胞周期停滞"],"answer":2,"explain":"BRAF突变（如V600E）使BRAF蛋白持续激活MAPK信号通路，导致细胞过度增殖、分化与存活；染色体重排产生融合基因是另一类激活机制。","id":"z13-ebbf2cdc","type":"A1"},{"unit":"U13","ch":13,"part":4,"tag":"抑癌基因","stem":"关于抑癌因子TP53（p53）在肿瘤发生中的作用，下列叙述符合本章内容的是？","options":["p53属于癌基因，其异常激活促进肿瘤发生","p53失活后细胞周期进程加快，但凋亡不受影响","p53仅在血液系统肿瘤中发生失活","p53通过激活MAPK通路促进细胞增殖","基因组或代谢信号异常时p53抑制细胞周期进程并促进凋亡，其失活可致细胞过度增殖"],"answer":4,"explain":"p53在基因组或代谢信号异常时抑制细胞周期、促进凋亡；肿瘤中TP53失活使这一负向调控丧失，细胞过度增殖。","id":"z13-9fb36967","type":"A1"},{"unit":"U13","ch":13,"part":4,"tag":"液体活检","stem":"关于液体活检，下列叙述符合本章内容的是？","options":["液体活检能直观显示肿瘤的形态学改变，已完全取代组织活检","组织活检仍是癌症诊断的金标准，液体活检创伤小、易获得且可重复获取","液体活检仅能检测循环肿瘤细胞，不能检测细胞游离DNA","液体活检基于第一代测序技术，不能用于检测耐药相关突变","液体活检主要显示原发灶形态学边界，用于肿瘤分级"],"answer":1,"explain":"组织活检仍是诊断金标准；液体活检在外周血中富集循环肿瘤细胞及游离DNA等，创伤小、易获得、可重复，但不能展现形态学改变。","id":"z13-baaea468","type":"A1"},{"unit":"U13","ch":13,"part":4,"tag":"影像学标志物","stem":"本章所述人工智能（机器学习）应用于影像学图像识别的范围是？","options":["手术、放疗和化疗","筛查、活检和随访","分级、分期和预后判断","识别、描述和监测","编码、转录和翻译"],"answer":3,"explain":"本章将人工智能的影像学应用分为识别（检测异常信号）、描述（判断边界、良恶性与分级）和监测（随访、评估疗效）三方面。","id":"z13-947171d2","type":"A1"},{"unit":"U13","ch":13,"part":4,"tag":"靶向治疗","stem":"下列药物与其作用靶点的配对，符合本章内容的是？","options":["伊马替尼——BCR-ABL1激酶","曲妥珠单抗——EGFR","克唑替尼——HER2","贝伐珠单抗——ALK","帕博利珠单抗——VEGF"],"answer":0,"explain":"伊马替尼靶向BCR-ABL1治疗慢性髓系白血病；曲妥珠单抗靶向HER2，克唑替尼靶向ALK，贝伐珠单抗抑制VEGF，帕博利珠单抗为免疫检查点抑制剂。","id":"z13-e223a7c9","type":"A1"},{"unit":"U13","ch":13,"part":4,"tag":"获得性耐药","stem":"非小细胞肺癌患者对EGFR抑制剂产生获得性耐药的机制，本章所述的是？","options":["肿瘤细胞完全丢失EGFR基因","肿瘤内血管生成明显减少","免疫检查点PD-L1高表达","肿瘤组织学类型由腺癌转变为鳞癌","EGFR发生T790M继发突变，影响EGFR与抑制剂的结合"],"answer":4,"explain":"EGFR T790M继发突变影响EGFR与抑制剂结合，是获得性耐药的机制之一；针对耐药已开发第二、三代酪氨酸激酶抑制剂。","id":"z13-369101e4","type":"A1"},{"unit":"U13","ch":13,"part":4,"tag":"DNA损伤修复","stem":"关于以DNA损伤修复通路为靶点的抗肿瘤策略，本章所述正确的是？","options":["抑制PARP可增强BRCA1/BRCA2的DNA修复功能","BRCA1/BRCA2功能缺失的肿瘤对PARP抑制剂不敏感","BRCA1/BRCA2功能缺失时DNA损伤修复异常，抑制PARP可有效阻止有丝分裂","PARP抑制剂主要通过激活p53发挥抗肿瘤作用","DNA损伤修复异常与肿瘤的发生发展无关"],"answer":2,"explain":"BRCA1/BRCA2功能缺失使DNA损伤修复异常，此时抑制PARP可有效阻止有丝分裂；其余选项与本章内容相反。","id":"z13-bdca90fb","type":"A1"},{"unit":"U13","ch":13,"part":4,"tag":"免疫治疗","stem":"关于肿瘤免疫检查点抑制剂，下列叙述符合本章内容的是？","options":["肿瘤细胞高表达免疫检查点结合蛋白使T细胞失去攻击能力，靶向CTLA-4、PD-1及PD-L1的药物已用于多种癌症治疗","免疫检查点抑制剂直接杀伤肿瘤细胞，作用不依赖T细胞","PD-1是肿瘤细胞表面的特异性抗原，可作为疫苗靶点","免疫疗法仅指免疫检查点抑制剂，不包括细胞过继免疫治疗","CTLA-4抑制剂目前仅获批用于乳腺癌的治疗"],"answer":0,"explain":"肿瘤细胞通过高表达免疫检查点结合蛋白使T细胞失去攻击能力，靶向CTLA-4、PD-1、PD-L1的药物已用于多种癌症；免疫治疗还包括CAR-T等过继治疗。","id":"z13-bee78d8d","type":"A1"},{"unit":"U14","ch":14,"part":4,"tag":"肿瘤概念","stem":"关于肿瘤性增生与非肿瘤性增生，下列叙述正确的是？","options":["肿瘤性增生一般是克隆性的，呈不可逆的自主性生长，与机体不相适应","肿瘤性增生是机体所需的、可逆的和自限性的","非肿瘤性增生的细胞不同程度地失去了分化成熟能力","炎症或损伤修复时的组织细胞增生属于肿瘤性增生","非肿瘤性增生的原因一旦清除仍会继续增生"],"answer":0,"explain":"肿瘤性增生为克隆性、与机体不协调、多呈不可逆自主性生长；非肿瘤性增生可逆、自限，细胞分化成熟，原因去除后即停止增生。","id":"z14-ca47bd7e","type":"A1"},{"unit":"U14","ch":14,"part":4,"tag":"大体形态","stem":"关于肿瘤的大体形态，下列叙述正确的是？","options":["生长于体表或腹腔的肿瘤因症状出现早，就诊时体积都很小","肿瘤质地与瘤细胞和间质的比例有关，瘤细胞多于间质者一般较软，间质多者较硬","良性肿瘤切面色泽多不均匀，呈鱼肉样","肿瘤颜色与组织起源、血供情况及色素多少无关","肿瘤体积越大提示其分化程度一定越高"],"answer":1,"explain":"肿瘤硬度取决于瘤细胞与间质比例以及有无变性坏死等，实质多于间质者较软；良性肿瘤色泽接近起源组织，体表或体腔内的肿瘤常长得很大。","id":"z14-888d0327","type":"A1"},{"unit":"U14","ch":14,"part":4,"tag":"组织结构","stem":"关于肿瘤的组织结构（实质与间质），下列叙述正确的是？","options":["肿瘤间质成分具有肿瘤类型特异性，可据以判断组织来源","肿瘤的生物学性质主要由间质决定","肿瘤的实质是瘤组织内肿瘤细胞的总称，肿瘤的类型和生物学性质主要由实质决定","生长迅速的肿瘤间质血管和淋巴管较少","肿瘤间质与恶性肿瘤的侵袭转移无关"],"answer":2,"explain":"实质即肿瘤细胞，决定肿瘤的类型与生物学性质；间质由结缔组织和血管等构成、不具类型特异性，同时是恶性肿瘤侵袭和转移的重要途径。","id":"z14-e979ac44","type":"A1"},{"unit":"U14","ch":14,"part":4,"tag":"异型性与分化","stem":"关于肿瘤的异型性与分化，下列叙述正确的是？","options":["异型性小表示肿瘤与正常组织差异大，分化程度低","分化程度高者异型性大，恶性程度高","异型性大小不能用于区别肿瘤性增生与非肿瘤性增生","异型性大说明肿瘤与正常组织差异大、分化程度低，是判断恶性程度和分级的主要组织学依据","异型性与分化是从相同角度表述同一个问题"],"answer":3,"explain":"异型性讲差异性、分化讲相似性，二者从相反角度表述同一问题；异型性大即分化低、恶性程度高，是鉴别肿瘤与分级的主要组织学依据。","id":"z14-5e7c0c07","type":"A1"},{"unit":"U14","ch":14,"part":4,"tag":"细胞异型性","stem":"关于恶性肿瘤细胞的异型性，下列叙述正确的是？","options":["正常细胞核质比为1:1，肿瘤细胞核质比减小","肿瘤细胞核仁常缩小、数目减少","肿瘤细胞胞质嗜碱性减弱","出现核分裂象即提示为恶性肿瘤","瘤细胞核体积增大、核质比增大，核仁肥大增多，并出现病理性核分裂象"],"answer":4,"explain":"肿瘤细胞核大、核质比增大（可至1:1）、核仁肥大增多，并出现不对称双极性、多极性、顿挫性等病理性核分裂象；良性病变也可见正常核分裂象。","id":"z14-37682b36","type":"A1"},{"unit":"U14","ch":14,"part":4,"tag":"生长方式","stem":"关于肿瘤的生长方式，下列叙述正确的是？","options":["膨胀性生长多见于良性肿瘤，常形成包膜、与周围组织分界清楚","浸润性生长多见于良性肿瘤，与周围组织分界清楚","良性肿瘤均为膨胀性生长，且都有完整的包膜","呈浸润性生长的肿瘤手术切除后很少复发","外生性生长仅见于恶性肿瘤"],"answer":0,"explain":"膨胀性生长为大多数良性肿瘤的生长方式，常有包膜、分界清楚、可推动；浸润性生长为大多数恶性肿瘤的方式，无包膜、分界不清、术后易复发。","id":"z14-75592ce9","type":"A1"},{"unit":"U14","ch":14,"part":4,"tag":"外生性生长","stem":"关于外生性生长，下列叙述正确的是？","options":["仅良性肿瘤可呈外生性生长","良性肿瘤只向表面生长、基底部无浸润，恶性肿瘤外生性生长时基底部伴有浸润性生长","恶性肿瘤外生性生长时基底部从不发生浸润","外生性生长的肿瘤表面坏死脱落后形成癌脐","外生性生长只发生在空腔脏器黏膜面，不发生于体表"],"answer":1,"explain":"良、恶性肿瘤都可呈外生性生长；良性者基底部无浸润，恶性者同时有基底部浸润，且因生长迅速、血供不足或继发感染坏死脱落，形成火山口状溃疡。","id":"z14-362c35c1","type":"A1"},{"unit":"U14","ch":14,"part":4,"tag":"直接蔓延","stem":"关于肿瘤的直接蔓延，下列叙述正确的是？","options":["直接蔓延是指肿瘤细胞经淋巴管到达远处器官继续生长","直接蔓延是良性肿瘤特有的生长方式","肿瘤细胞沿组织间隙、脉管壁或神经束衣不间断地浸润破坏邻近正常器官和组织，属于侵袭性生长","直接蔓延属于肿瘤的转移途径之一","晚期宫颈癌累及膀胱、直肠属于种植转移"],"answer":2,"explain":"直接蔓延即侵袭，指肿瘤沿组织间隙、脉管壁或神经束衣不间断浸润破坏邻近组织；它不属于转移，宫颈癌累及膀胱、直肠为直接蔓延。","id":"z14-c7203fb4","type":"A1"},{"unit":"U14","ch":14,"part":4,"tag":"淋巴道转移","stem":"关于淋巴道转移，下列叙述正确的是？","options":["是肉瘤最常见的转移途径","瘤细胞随淋巴液到达局部淋巴结后首先聚集在髓窦","局部淋巴结肿大一定提示已有癌转移","是癌最常见的转移途径，瘤细胞首先聚集在淋巴结边缘窦，逐渐破坏并取代淋巴结结构","左锁骨上淋巴结（Virchow淋巴结）转移的原发灶多位于乳腺"],"answer":3,"explain":"淋巴道转移是癌最常见的途径，瘤细胞先聚集于边缘窦再向皮质窦、髓窦蔓延；淋巴结肿大也可为反应性增生或炎症，Virchow淋巴结转移多来自肺和胃肠道。","id":"z14-9d032ba3","type":"A1"},{"unit":"U14","ch":14,"part":4,"tag":"血道转移","stem":"关于血道转移，下列叙述正确的是？","options":["是癌最常见的转移途径，肉瘤极少经血道转移","进入体循环静脉的瘤细胞经左心首先在肺内形成转移瘤","侵入门静脉系统的瘤细胞首先转移至脑","血道转移最常发生的器官依次为脾、肾、脑","肉瘤最常经血道转移，侵入门静脉系统的瘤细胞首先发生肝转移"],"answer":4,"explain":"血道转移是肉瘤最常见的途径；进入体循环静脉者经右心到肺，侵入门静脉系统者首先发生肝转移，血道转移最常见于肺，其次为肝和骨。","id":"z14-4dc14be7","type":"A1"},{"unit":"U14","ch":14,"part":4,"tag":"转移瘤形态","stem":"关于转移瘤的形态学特点，下列叙述正确的是？","options":["转移瘤边界相对清楚、常多发散在分布，多位于器官近被膜处，位于器官表面者可形成癌脐","转移瘤多为单发、边界不清、位于器官中央","转移瘤的组织学类型与原发瘤完全不同","器官表面的转移瘤中央坏死时表面隆起呈结节状","直径≤1mm的转移瘤称为跳跃式转移"],"answer":0,"explain":"转移瘤常多发、大小较一致、边界清楚、弥漫散在，多位于器官近被膜处；中央出血坏死下陷形成癌脐，直径≤1mm者为微转移。","id":"z14-fa411d27","type":"A1"},{"unit":"U14","ch":14,"part":4,"tag":"种植转移","stem":"关于种植转移，下列叙述正确的是？","options":["又称血道转移，瘤细胞随血流种植于远隔器官","胃癌破坏胃壁突破浆膜后可在腹腔脏器表面形成广泛种植，胃肠道黏液腺癌种植到双侧卵巢形成Krukenberg瘤","种植转移最易发生在颅腔和椎管","种植转移不伴有体腔积液","体腔积液细胞学检查对种植转移没有诊断价值"],"answer":1,"explain":"种植转移又称体腔转移，肿瘤细胞脱落种植于体腔浆膜及器官表面，常伴血性积液和粘连；积液细胞学检查简便有效，胃肠黏液腺癌可种植形成Krukenberg瘤。","id":"z14-0d9497e3","type":"A1"},{"unit":"U14","ch":14,"part":4,"tag":"侵袭转移机制","stem":"关于恶性肿瘤侵袭和转移的机制，下列叙述正确的是？","options":["癌细胞上皮钙黏素表达增多，使癌细胞彼此易于分离","癌细胞分泌的蛋白溶解酶可降解细胞外基质，但宿主间质细胞无此作用","上皮钙黏素等黏附分子介导的癌细胞间黏着力减弱使癌细胞分离，nm23的表达水平与肿瘤侵袭和转移能力有关","nm23表达水平越高，肿瘤的转移能力越强","转移的发生仅取决于瘤细胞，与局部组织微环境无关"],"answer":2,"explain":"癌细胞侵袭时先因上皮钙黏素减少而彼此分离，继而降解细胞外基质并迁移；nm23为转移抑制基因，表达高者转移性低，转移还需合适的组织微环境。","id":"z14-c2a69c65","type":"A1"},{"unit":"U14","ch":14,"part":4,"tag":"肿瘤命名","stem":"关于肿瘤的命名，下列叙述正确的是？","options":["来源于上皮组织的良性肿瘤称为腺瘤，恶性肿瘤称为肉瘤","由间叶组织发生的恶性肿瘤统称为癌","骨母细胞瘤、软骨母细胞瘤和脂肪母细胞瘤均为恶性肿瘤","精原细胞瘤、无性细胞瘤和内胚窦瘤虽以“瘤”结尾，但实际为恶性肿瘤","同一肿瘤中既有癌又有肉瘤成分者称为肉瘤样癌"],"answer":3,"explain":"上皮组织的恶性肿瘤称癌、间叶组织者称肉瘤；以“母细胞瘤”结尾者不一定都是恶性，骨、软骨、脂肪母细胞瘤为良性；癌与肉瘤成分并存应称癌肉瘤。","id":"z14-54cc5c22","type":"A1"},{"unit":"U14","ch":14,"part":4,"tag":"癌与肉瘤","stem":"关于癌与肉瘤的区别，下列叙述正确的是？","options":["癌多经血道转移，肉瘤多经淋巴道转移","网状纤维见于癌巢周围，肉瘤细胞之间无网状纤维","癌多见于青少年，肉瘤多见于40岁以上成人","免疫组化染色肉瘤表达角蛋白（keratin），癌表达波形蛋白（vimentin）","癌的发病率高于肉瘤，癌多见于40岁以上成人，肉瘤多见于青少年"],"answer":4,"explain":"癌发病率约为肉瘤的9倍且多见于40岁以上成人；网状纤维包绕癌巢而位于肉瘤细胞之间；癌多经淋巴道、肉瘤多经血道转移；癌表达角蛋白、EMA，肉瘤表达波形蛋白。","id":"z14-e768b86f","type":"A1"},{"unit":"U14","ch":14,"part":4,"tag":"良恶性鉴别","stem":"关于良性肿瘤与恶性肿瘤的区别，下列叙述正确的是？","options":["良性肿瘤分化好、异型性小，不见病理性核分裂象，不转移，术后很少复发","良性肿瘤多呈浸润性生长，与周围组织分界不清","恶性肿瘤生长缓慢，常无出血、坏死","恶性肿瘤不发生转移，但手术后容易复发","良、恶性肿瘤的区别有绝对界限，任一指标均可单独确诊"],"answer":0,"explain":"良性肿瘤分化好、异型性小、生长缓慢、有包膜、不转移、术后少复发；良恶性区别是相对的、任一项均有例外，须结合临床、病理形态与免疫标记综合判定。","id":"z14-56309f7b","type":"A1"},{"unit":"U14","ch":14,"part":4,"tag":"分级","stem":"关于肿瘤的分级，下列叙述正确的是？","options":["肿瘤的分级由临床医生判定，用于反映肿瘤的播散范围","分级由病理医生确定，现多采用Ⅰ～Ⅲ级分法，Ⅰ级为高分化、低度恶性，Ⅲ级为低分化、高度恶性","鳞状细胞癌的分级主要依据淋巴结转移的数目","肿瘤分级有严格的定量标准，客观性强","分级越高，肿瘤的分化程度越好"],"answer":1,"explain":"分级由病理医生根据分化成熟程度、异型性及核分裂象确定，多用Ⅰ～Ⅲ级；鳞癌以角化珠、细胞间桥及异型性分级，分级缺乏定量标准、主观性较大。","id":"z14-fb663ad1","type":"A1"},{"unit":"U14","ch":14,"part":4,"tag":"分期","stem":"关于肿瘤的分期（TNM法），下列叙述正确的是？","options":["分期由病理医生确定，主要用于判断肿瘤的分化程度","T表示淋巴结受累情况，N表示原发肿瘤","T表示原发肿瘤，T0表示原位癌；N表示淋巴结受累情况，N0表示无淋巴结转移；M表示血道转移","M0表示已有单个器官的血道转移","分期仅依据原发瘤大小，与淋巴结及血道转移无关"],"answer":2,"explain":"TNM 法为国际抗癌联盟广泛使用：T 为原发肿瘤（本教材口径 T0 为原位癌），N 为淋巴结受累（N0 为无转移），M 为血道转移（M0 为无血道转移）；分期由临床医生判定。（注：国际 UICC/AJCC 标准中 T0 指未见原发肿瘤，原位癌记为 Tis，考试按本教材口径作答。）","id":"z14-c71e45a7","type":"A1"},{"unit":"U14","ch":14,"part":4,"tag":"癌前病变","stem":"下列关于癌前病变的叙述，正确的是？","options":["癌前病变即原位癌，已具备癌的全部形态特征","所有癌前病变都必然转变为癌","大多数恶性肿瘤都能找到明确的癌前病变","癌前病变是具有较高癌变潜能的良性病变，如家族性腺瘤性息肉病、结肠绒毛状腺瘤，长期存在有可能转变为癌","口腔黏膜白斑和成人交界痣不属于癌前病变"],"answer":3,"explain":"癌前病变是癌变潜能较高的良性病变、并非必然癌变，且大多数癌目前未发现明确的癌前病变；黏膜白斑、交界痣、绒毛状腺瘤与FAP均属常见癌前病变。","id":"z14-0836ed07","type":"A1"},{"unit":"U14","ch":14,"part":4,"tag":"非典型增生","stem":"关于非典型增生与上皮内瘤变，下列叙述正确的是？","options":["非典型增生指上皮细胞增生伴一定异型性，此时已可诊断为癌","轻度非典型增生累及上皮全层，难以逆转","非典型增生常出现病理性核分裂象","上皮内瘤变仅指原位癌，不包括非典型增生","重度非典型增生累及上皮2/3以上但尚未累及全层，很难逆转、容易癌变，原位癌列入上皮内瘤变Ⅲ级"],"answer":4,"explain":"非典型增生一般不见病理性核分裂象；轻、中度（累及上皮下1/3至2/3）在病因消除后可恢复；上皮内瘤变涵盖非典型增生至原位癌的连续过程。","id":"z14-0cc080b5","type":"A1"},{"unit":"U14","ch":14,"part":4,"tag":"原位癌","stem":"关于原位癌，下列叙述正确的是？","options":["原位癌指上皮全层均为癌细胞，但基底膜完整、无间质浸润，不发生转移，确诊主要靠病理组织学检查","原位癌的基底膜已被癌细胞突破","原位癌易经淋巴道发生转移","原位癌常见明显肿块，肉眼即可确诊","原位癌属于癌前病变，尚未达到癌的程度"],"answer":0,"explain":"原位癌（浸润前癌、上皮内癌）上皮全层均为癌细胞而基底膜完整、无间质浸润，因而不发生转移；肉眼常无明显异常，须靠病理组织学确诊。","id":"z14-105046c1","type":"A1"},{"unit":"U14","ch":14,"part":4,"tag":"病理诊断","stem":"关于肿瘤的病理诊断方法，下列叙述正确的是？","options":["网状纤维染色时，网状纤维见于癌巢内癌细胞之间","网状纤维包绕癌巢而肉瘤细胞之间有网状纤维，免疫组化上皮标志物（角蛋白、EMA）阳性支持癌的诊断","免疫组化染色波形蛋白（vimentin）阳性支持癌的诊断","电子显微镜对肿瘤的病理诊断没有价值","手术中快速病理检查无助于判断切缘有无肿瘤浸润"],"answer":1,"explain":"网状纤维包绕癌巢而癌细胞之间无网状纤维，肉瘤细胞之间则有；角蛋白、EMA阳性提示癌，波形蛋白、结蛋白阳性提示肉瘤；电镜与术中快速病理均有诊断价值。","id":"z14-a4b906b2","type":"A1"},{"unit":"U14","ch":14,"part":4,"tag":"鳞状细胞癌","stem":"关于鳞状细胞癌，下列叙述正确的是？","options":["只发生在身体原有鳞状上皮被覆的部位，如皮肤、食管和宫颈","低分化鳞癌的癌巢中央可见大量角化珠","高分化鳞癌的癌巢中央可见角化珠（癌珠），癌细胞间可见细胞间桥","鳞状细胞癌的癌细胞不突破基底膜","鳞状细胞癌的分级取决于肿瘤的大小"],"answer":2,"explain":"高分化鳞癌可见角化珠和细胞间桥，低分化者无角化珠而细胞异型性明显；支气管、胆囊、肾盂等柱状或移行上皮可经鳞状上皮化生发展为鳞癌；分级与肿瘤大小无关。","id":"z14-0596a0c6","type":"A1"},{"unit":"U14","ch":14,"part":4,"tag":"骨肉瘤","stem":"关于骨肉瘤，下列叙述正确的是？","options":["是最常见的骨的原发性良性肿瘤","好发于婴幼儿，多位于颅骨","肿瘤细胞不产生骨样基质，故诊断困难","好发于青少年、以膝关节上下方长骨的干骺端最多见，肿瘤细胞直接形成骨样基质是诊断最重要的组织学依据","主要经淋巴道转移，血清碱性磷酸酶多降低"],"answer":3,"explain":"骨肉瘤是最常见的骨原发恶性肿瘤，好发11～25岁、膝关节上下方干骺端，镜下肿瘤细胞直接产生骨样基质是诊断依据；血清碱性磷酸酶增高，血道转移发生早。","id":"z14-0f50df29","type":"A1"},{"unit":"U15","ch":15,"part":4,"tag":"癌基因与原癌基因","stem":"关于原癌基因与癌基因，下列叙述正确的是","options":["原癌基因在正常细胞中不表达，仅在肿瘤细胞中被激活后才开始表达","原癌基因必须两个等位基因同时突变才能被激活为癌基因","原癌基因编码的蛋白参与调控细胞分裂和增殖，其两个等位基因中的一个被激活即可产生功能获得性突变","癌基因属于隐性基因，只有两个拷贝均失活才会导致肿瘤","原癌基因仅在胚胎期表达，出生后即从基因组中丢失"],"answer":2,"explain":"原癌基因在正常细胞中表达，是细胞增殖调控所必需；一个等位基因被激活即可以显性方式产生功能获得性突变。两个拷贝均失活是抑癌基因（隐性癌基因）的特征。","id":"z15-05fd6e50","type":"A1"},{"unit":"U15","ch":15,"part":4,"tag":"原癌基因激活机制","stem":"KRAS 基因编码一种小 GTP 酶，在胰腺癌、肺癌和结肠癌中常发生突变而被激活。其最常见的激活方式是","options":["染色体易位导致基因重排","基因拷贝数大量增加","长末端重复序列插入使基因被激活","启动子区高甲基化导致表达增强","点突变使 KRAS 蛋白持续与 GTP 结合并激活下游信号通路"],"answer":4,"explain":"KRAS 最常见的激活方式为点突变（多位于第 12、13 号氨基酸，如 G12D、G12V、G13D），突变蛋白持续与 GTP 结合；易位、扩增和启动子插入属其他激活机制。","id":"z15-79d519a6","type":"A1"},{"unit":"U15","ch":15,"part":4,"tag":"两次打击学说","stem":"关于 Knudson 提出的“两次打击”假说，下列叙述正确的是","options":["遗传型肿瘤的第一次突变发生于体细胞，第二次突变发生于生殖细胞","散发型肿瘤的两次突变均发生于体细胞，发病年龄较晚，多为单侧或单发","遗传型肿瘤患者出生时两个等位基因均已突变，故不会遗传给后代","两次打击假说只适用于视网膜母细胞瘤，不能解释乳腺癌等常见肿瘤的遗传易感性","两次打击假说认为一个癌基因需经两次激活才能导致肿瘤"],"answer":1,"explain":"遗传型第一次突变发生在生殖细胞、第二次在体细胞，发病早且常双侧多发；散发型两次突变均在体细胞，发病晚、多为单发。该假说也可解释乳腺癌等肿瘤的易感性。","id":"z15-f01a458a","type":"A1"},{"unit":"U15","ch":15,"part":4,"tag":"p53","stem":"关于抑癌基因 TP53 及其编码的 p53 蛋白，下列叙述正确的是","options":["TP53 定位于 17 号染色体短臂，编码一种转录因子，可通过调控 p21 等下游基因引起细胞周期阻滞","正常非应激细胞中 p53 蛋白水平很高，以维持细胞周期检查点功能","p53 蛋白的稳定性不受翻译后修饰影响，其水平由基因拷贝数决定","TP53 突变仅见于食管癌，在其他类型肿瘤中很少检出","E3 泛素连接酶 MDM2 可稳定 p53 蛋白，防止其经蛋白酶体途径降解"],"answer":0,"explain":"p53 是转录因子，可上调 p21 引起 G1 期阻滞；正常细胞中 p53 水平很低，MDM2 使其泛素化后经蛋白酶体降解，几乎所有类型肿瘤均可检出 TP53 突变。","id":"z15-1aa9aa68","type":"A1"},{"unit":"U15","ch":15,"part":4,"tag":"Rb 与细胞周期","stem":"关于 Rb 蛋白对细胞周期的调控，下列叙述正确的是","options":["Rb 基因是细胞周期的正性调控者，可促进 G1 期向 S 期转换","Rb 蛋白被磷酸化后与 E2F 的结合增强，从而抑制细胞周期进程","cyclinD-CDK4/6 可使 Rb 蛋白去磷酸化，进而释放 E2F","低磷酸化的 Rb 蛋白与 E2F 结合并抑制其转录活性，从而抑制细胞周期进程","病毒癌蛋白通过与 Rb 结合并激活 Rb 的功能而促进细胞增殖"],"answer":3,"explain":"Rb 是细胞周期负性调控者，低磷酸化 Rb 与 E2F 结合抑制转录；cyclinD-CDK4/6 使 Rb 高磷酸化而释放 E2F，病毒癌蛋白则使 Rb 失活。","id":"z15-521ca29a","type":"A1"},{"unit":"U15","ch":15,"part":4,"tag":"抑癌基因分类","stem":"按功能分类，参与 DNA 损伤修复、维持基因组完整性的抑癌基因（如 WRN）属于","options":["守门员基因","原癌基因","照顾者基因","副控基因","主控基因"],"answer":2,"explain":"抑癌基因分守门员（直接参与细胞周期或生长调控，如 TP53）与照顾者（参与 DNA 损伤修复、维持基因组完整性，如 WRN）两类；WRN 突变可致沃纳综合征。","id":"z15-6d74dfc7","type":"A1"},{"unit":"U15","ch":15,"part":4,"tag":"DNA 修复缺陷","stem":"着色性干皮病患者对日光异常敏感，皮肤暴露部位易发生基底细胞癌和鳞状上皮癌，其分子基础是","options":["错配修复系统缺陷，导致微卫星不稳定性","DNA 解旋酶 BLM 失活，姐妹染色单体互换频率显著增高","免疫球蛋白 V(D)J 重排异常，导致原癌基因易位激活","范科尼贫血相关基因缺陷，患者自发性染色体断裂频率增高","核苷酸切除修复系统缺陷，不能切除紫外线诱发的嘧啶二聚体"],"answer":4,"explain":"着色性干皮病因基因突变致核苷酸切除修复缺陷，不能切除紫外线诱发的嘧啶二聚体，DNA 突变增多而好发皮肤癌；BLM 失活见于布卢姆综合征。","id":"z15-250b2aa8","type":"A1"},{"unit":"U15","ch":15,"part":4,"tag":"肿瘤遗传易感性","stem":"关于肿瘤遗传易感性，下列叙述正确的是","options":["有遗传易感性的个体比不具遗传易感性者肿瘤发病率高 10～100 倍","肿瘤遗传易感性由体细胞突变决定，与胚系突变无关","遗传易感性只表现在单基因遗传的肿瘤中，散发性肿瘤不涉及","携带肿瘤易感基因胚系突变的个体必然发生相应肿瘤","家族性癌患者的一级亲属发病率与一般人群基本相同"],"answer":0,"explain":"肿瘤遗传易感性指具有胚系突变或某种基因多态性的个体容易发生肿瘤的特性，此类个体肿瘤发病率高 10～100 倍；胚系突变携带者并非必然发病。","id":"z15-4db40f0f","type":"A1"},{"unit":"U15","ch":15,"part":4,"tag":"表观遗传与基因组印记","stem":"肿瘤细胞除基因突变外，还存在表观遗传学改变。下列属于不改变 DNA 碱基序列的表观遗传学改变、并参与肿瘤发生的是","options":["TP53 基因发生点突变，编码蛋白功能丧失","KRAS 基因拷贝数增加，蛋白表达量升高","Rb 基因启动子区高甲基化导致表达沉默","t(9;22) 易位形成 BCR-ABL 融合基因","染色体 (8;14) 易位导致 c-Myc 基因激活"],"answer":2,"explain":"Rb 基因除突变、缺失外，还可因启动子区高甲基化而失活，属不改变碱基序列的表观遗传改变；基因组印记（如 p57 印记缺失）亦属此类，点突变、扩增、易位属遗传学改变。","id":"z15-c01e19fc","type":"A1"},{"unit":"U15","ch":15,"part":4,"tag":"染色体易位与核型","stem":"慢性粒细胞白血病患者中 95% 存在 t(9;22)(q34;q11) 易位，形成费城染色体。该易位导致","options":["8 号染色体上的 c-Myc 基因被激活而过度表达","ABL 原癌基因与 22 号染色体上的 BCR 基因形成融合基因，其编码蛋白具有自我激活的酪氨酸激酶活性","RB1 基因因 13 号染色体长臂缺失而丢失","APC 基因杂合性失活，导致结肠腺瘤性息肉病","WT1 基因因 11 号染色体短臂丢失而失活"],"answer":1,"explain":"t(9;22) 使 9q34 的 ABL 与 22q11 的 BCR 形成 BCR-ABL 融合基因，其编码蛋白具有自我激活的酪氨酸激酶活性，是 CML 的主控基因突变，可用伊马替尼靶向治疗。","id":"z15-ff6c0b4c","type":"A1"},{"unit":"U15","ch":15,"part":4,"tag":"杂合性缺失","stem":"视网膜母细胞瘤细胞中可见 13 号染色体长臂缺失 [del(13)(q14)]，导致 RB 基因丢失。这种染色体某一基因座上等位基因之一出现缺失或突变的现象称为","options":["基因扩增","染色体易位","基因组印记","杂合性缺失（LOH）","基因重排"],"answer":3,"explain":"杂合性缺失指染色体某一基因座上等位基因之一出现缺失或突变，使同源染色体相同位置上的基因呈杂合状态；抑癌基因的杂合性缺失是肿瘤发生的重要因素。","id":"z15-3a72ec97","type":"A1"},{"unit":"U15","ch":15,"part":4,"tag":"细胞周期失控","stem":"关于细胞周期蛋白（cyclin）与肿瘤发生的关系，下列叙述正确的是","options":["cyclinD 是细胞周期由 G0 期进入 G1 期最早发生变化的周期蛋白，其编码基因 CCND1 已被公认为原癌基因","cyclinD 过度表达会引起细胞周期阻滞，从而抑制细胞增殖","cyclinE 过表达与肿瘤细胞侵袭能力弱、不易转移相关","CDK4 在多数肿瘤中存在基因突变，是其功能异常的主要原因","CKI（如 p21、p16）是细胞周期的正性调控因子，其失活可抑制肿瘤发生"],"answer":0,"explain":"cyclinD 是 G0→G1 最早变化的周期蛋白，CCND1 过度表达致增殖失控，属原癌基因；CDK4 迄今未发现基因突变，CKI（p21、p16、p27）为负性调控因子。","id":"z15-9f719fac","type":"A1"},{"unit":"U15","ch":15,"part":4,"tag":"环境与遗传的相互作用","stem":"关于肿瘤发生中遗传因素与环境因素的关系，下列叙述正确的是","options":["癌症本身是一种遗传病，可通过家系代代相传","约 90% 的恶性肿瘤按孟德尔显性或隐性规律遗传","肿瘤的家族聚集现象完全由共同的生活习惯造成，与遗传无关","只要不接触致癌环境因素，携带遗传易感基因的个体就不会发生肿瘤","90% 以上的恶性肿瘤（如肺癌、胃癌、乳腺癌）由环境因素与遗传因素相互作用所致，以散发性为主"],"answer":4,"explain":"癌症本身不会遗传，仅约 3% 的恶性肿瘤按单基因方式遗传；90% 以上为环境因素与遗传因素相互作用所致的散发性肿瘤，易感个体对致癌环境因素更敏感。","id":"z15-e4d94a79","type":"A1"},{"unit":"U15","ch":15,"part":4,"tag":"靶向治疗","stem":"HER2 是乳腺癌中研究较广泛的癌基因，其编码蛋白属表皮生长因子受体家族。针对 HER2 阳性转移性乳腺癌的靶向药物曲妥珠单抗（赫赛汀）的作用机制是","options":["抑制 BCR-ABL 融合蛋白的酪氨酸激酶活性","与 HER2 特异性结合，阻断其与配体结合及下游信号通路激活","诱导 PML-RARα 融合蛋白降解，促进细胞分化","抑制 CDK4/6 活性，使 Rb 蛋白保持低磷酸化状态","抑制 DNA 拓扑异构酶Ⅱ活性，阻断 DNA 复制"],"answer":1,"explain":"曲妥珠单抗是抗 HER2 单克隆抗体，通过特异性结合 HER2 阻断配体结合及下游 PI3K/Akt、MAPK 等通路激活，抑制肿瘤生长，用于 HER2 阳性转移性乳腺癌。","id":"z15-707aaa86","type":"A1"},{"unit":"U15","ch":15,"part":4,"tag":"分化诱导治疗","stem":"急性早幼粒细胞白血病（APL）因 t(15;17)(q22;q21) 易位形成 PML-RARα 融合基因。该融合蛋白的致病机制是","options":["具有自我激活的酪氨酸激酶活性，促进早幼粒细胞增殖","属于抗凋亡蛋白，通过结合 Fas 受体抵抗凋亡","直接使 p53 蛋白降解，导致细胞周期检查点失能","具有显性抑制作用，对抗正常 RARα 的功能并干扰野生型 PML 的功能，抑制早幼粒细胞分化","作为一种转录激活因子，促进分化相关基因的表达"],"answer":3,"explain":"PML-RARα 融合蛋白具显性抑制作用，对抗正常 RARα 功能并与野生型 PML 形成异二聚体，抑制早幼粒细胞分化；全反式维甲酸和三氧化二砷可促其降解、恢复分化。","id":"z15-d3eb3215","type":"A1"},{"unit":"U15","ch":15,"part":4,"tag":"多步骤遗传损伤","stem":"要使正常细胞完全恶性转化，通常需要多种基因改变共同作用。下列最符合本节描述的是","options":["一个原癌基因被激活即可完成细胞的恶性转化","仅需两个抑癌基因发生失活突变即可完成恶性转化","几个癌基因的突变激活、两个或更多抑癌基因（如 p53、PTEN）的失活，以及凋亡调节和 DNA 修复基因的改变","只需抑癌基因启动子区发生高甲基化即可","只需出现染色体数目异常即可"],"answer":2,"explain":"细胞完全恶性转化需多个基因改变：几个癌基因激活、两个或更多抑癌基因（如 p53、PTEN）失活，以及凋亡调节和 DNA 修复基因改变，单一致癌改变不足以成瘤。","id":"z15-a43c2527","type":"A1"},{"unit":"U16","ch":16,"part":4,"tag":"肿瘤抗原分类","stem":"关于肿瘤特异性抗原（TSA）与肿瘤相关性抗原（TAA），下列叙述正确的是","options":["TSA 在正常细胞和肿瘤细胞中均可表达，TAA 只在肿瘤细胞中表达","TSA 即胚胎抗原，甲胎蛋白和癌胚抗原均属于 TSA","TAA 仅存在于肿瘤细胞，是临床免疫治疗最特异的靶标","TSA 只在肿瘤细胞中表达而正常细胞不表达；TAA 在肿瘤细胞和正常组织细胞中均可表达，但在肿瘤组织中高表达","TSA 的免疫原性均很强，故临床肿瘤免疫治疗多以其为靶标"],"answer":3,"explain":"TSA 仅表达于肿瘤细胞，TAA 在正常组织亦表达而肿瘤中高表达，AFP、CEA 属 TAA；因 TSA 种类少、免疫原性低、个体特异性高，临床免疫治疗靶标多为 TAA。","id":"z16-dd17af94","type":"A1"},{"unit":"U16","ch":16,"part":4,"tag":"肿瘤新生抗原","stem":"关于肿瘤新生抗原（neoantigen）及其与肿瘤突变负荷（TMB）的关系，下列叙述正确的是","options":["由正常细胞原有蛋白直接脱落形成，与基因突变无关","不同患者、不同部位肿瘤诱导产生的新生抗原完全相同，交叉反应强","一个肿瘤组织中的基因突变通常不足 10 个，故新生抗原种类很少","新生抗原即病毒抗原，仅见于病毒诱导的肿瘤","由肿瘤细胞基因突变产生，具有随机性和鲜明的个体化特征，免疫原性多较低；TMB 与肿瘤免疫治疗预后密切相关"],"answer":4,"explain":"新生抗原源于肿瘤基因突变所致的编码产物改变，因致癌因素作用随机而具随机性和个体化特征；一个肿瘤组织常有上千个基因突变（TMB 高），但多数新生抗原免疫原性低。","id":"z16-de915a53","type":"A1"},{"unit":"U16","ch":16,"part":4,"tag":"胚胎抗原与肿瘤标志物","stem":"甲胎蛋白（AFP）和癌胚抗原（CEA）是临床常用的肿瘤标志物。关于这两种抗原，下列叙述正确的是","options":["均属于肿瘤特异性抗原，只由肿瘤细胞合成和分泌","属于胚胎抗原，正常成人几乎不表达，细胞恶变时可重新大量表达，但免疫原性低、易致免疫耐受","AFP 主要由结肠癌细胞产生，CEA 主要由肝癌细胞产生","因免疫原性极强，是肿瘤免疫治疗最理想的靶标分子","其血清水平与肿瘤负荷无关，不能用于评价疗效和判断预后"],"answer":1,"explain":"AFP、CEA 属胚胎抗原（TAA）：胚胎期表达、出生后几近消失，恶变时重新大量合成，可作辅助诊断标志物；但免疫原性低且易致免疫耐受，难以成为免疫治疗靶标。","id":"z16-05a95224","type":"A1"},{"unit":"U16","ch":16,"part":4,"tag":"癌-睾丸抗原","stem":"关于癌-睾丸抗原（CTA，如 MAGE 家族、NY-ESO-1），下列叙述正确的是","options":["正常情况下广泛表达于各种体细胞，故免疫系统对其已产生中枢耐受","属于肿瘤特异性抗原，其能否被 T 细胞识别与 MHC 分子无关","正常情况下仅在睾丸、卵巢等生殖母细胞表达，因生殖母细胞不表达 MHC 分子而不被 CTL 识别；在肿瘤细胞中表达时可经 MHC 提呈并激活特异性 T 细胞","只在生殖系统肿瘤中表达，可作为睾丸肿瘤的特异性标志物","表达于细胞膜表面，可被抗体直接识别，无需抗原提呈"],"answer":2,"explain":"CTA 正常仅表达于睾丸、卵巢生殖母细胞，因不表达 MHC 而不被 CTL 识别；肿瘤细胞表达后经 MHC 提呈可激活特异性 T 细胞，如 MAGE-A1、NY-ESO-1。","id":"z16-9b376689","type":"A1"},{"unit":"U16","ch":16,"part":4,"tag":"病毒相关肿瘤抗原","stem":"关于病毒相关肿瘤抗原，下列叙述正确的是","options":["EB 病毒、HBV、HPV 等致瘤病毒形成的病毒蛋白产物属于肿瘤特异性抗原，同一种病毒引起的肿瘤即使组织来源不同也常表达相同的病毒抗原","病毒相关肿瘤抗原免疫原性弱，难以用于肿瘤的预防","不同组织来源的病毒相关肿瘤所表达的病毒抗原各不相同","病毒抗原在人体内不能引起免疫应答，故不能作为疫苗的靶点","HBV 疫苗可预防胃癌，HPV 疫苗可预防肺癌"],"answer":0,"explain":"EBV、HBV、HPV 等致瘤病毒的蛋白产物属 TSA，同一种病毒引起的肿瘤即使组织来源不同也常表达相同病毒抗原；病毒抗原抗原性强，据此制备的疫苗可预防肝癌和宫颈癌。","id":"z16-0e9f2f90","type":"A1"},{"unit":"U16","ch":16,"part":4,"tag":"固有免疫与 NK 细胞","stem":"NK 细胞是机体抗肿瘤固有免疫监视的“第一线”效应细胞，其特点是","options":["需经抗原预先致敏才能杀伤肿瘤细胞，且杀伤作用受 MHC 限制","主要通过识别 MHCⅠ类分子提呈的肿瘤抗原肽杀伤肿瘤细胞","只能通过分泌特异性抗体杀伤肿瘤细胞","不需预先抗原致敏，无抗原特异性和 MHC 限制，可通过 Fas/FasL、TRAIL 及穿孔素、颗粒酶直接杀伤肿瘤细胞，并参与 ADCC","在抗肿瘤免疫监视中作用有限，抗肿瘤主要依赖中性粒细胞"],"answer":3,"explain":"NK 细胞不依赖抗体、补体和适应性免疫即可直接杀伤靶细胞，无抗原特异性与 MHC 限制，是抗肿瘤免疫监视的第一线；其有 Fc 受体，可通过 ADCC 杀伤肿瘤细胞。","id":"z16-4bf6fc24","type":"A1"},{"unit":"U16","ch":16,"part":4,"tag":"巨噬细胞与肿瘤微环境","stem":"关于巨噬细胞在抗肿瘤免疫中的作用，下列叙述正确的是","options":["巨噬细胞只能直接杀伤肿瘤细胞，不具备抗原提呈功能","巨噬细胞杀伤肿瘤的能力与其活化状态无关","M2 型巨噬细胞可增强 CTL 的杀伤活性，抑制肿瘤生长和转移","用卡介苗等非特异性免疫激活剂激活巨噬细胞可促进肿瘤生长和扩散","巨噬细胞可提呈肿瘤抗原、分泌 TNF 和 NO 等发挥抗肿瘤作用；但在抑制性微环境中可向 M2 型分化，产生 EGF、TGF-β 等促进肿瘤生长和转移"],"answer":4,"explain":"巨噬细胞既可杀伤肿瘤、提呈抗原，又分泌 TNF、NO 等；静息状态活性很低，在抑制性微环境中向 M2 型极化后产生 EGF、TGF-β，反而促进肿瘤生长转移。","id":"z16-e2ff65d1","type":"A1"},{"unit":"U16","ch":16,"part":4,"tag":"适应性免疫与 CTL","stem":"关于机体适应性抗肿瘤免疫应答，下列叙述正确的是","options":["CD8⁺ CTL 通过 TCR 识别肿瘤细胞表面 MHCⅠ类分子/肿瘤抗原肽复合体，经穿孔素、颗粒酶或 Fas/FasL 途径杀伤肿瘤细胞","CD4⁺ Th 细胞直接识别肿瘤细胞表面 MHCⅠ类分子提呈的抗原肽并将其杀伤","树突状细胞等抗原提呈细胞将肿瘤抗原与 MHCⅠ类分子结合后提呈给 CD4⁺ T 细胞","肿瘤细胞被杀伤后释放的抗原不能再次激活 T 细胞，免疫应答随即终止","T 细胞分泌的 IL-2、IFN-γ 等细胞因子可抑制固有免疫细胞，削弱抗肿瘤效应"],"answer":0,"explain":"CD8⁺ CTL 识别 MHCⅠ类分子/肿瘤抗原肽复合体，经穿孔素、颗粒酶或 Fas/FasL 杀伤肿瘤；CD4⁺ Th 识别的是抗原提呈细胞 MHCⅡ类分子提呈的抗原信号。","id":"z16-34e8b34a","type":"A1"},{"unit":"U16","ch":16,"part":4,"tag":"免疫逃逸与抗原调变","stem":"肿瘤细胞对能够被免疫系统识别并导致其损伤的抗原或抗原表位下调表达，使其减少或丢失，从而避免被识别和杀伤。这一现象称为","options":["免疫耐受","抗原调变（antigenic modulation）","肿瘤漏逸","免疫忽视","免疫抑制"],"answer":1,"explain":"抗原调变指肿瘤细胞下调或丢失可被免疫系统识别的抗原/抗原表位以逃避攻击；肿瘤漏逸指肿瘤增殖速度超过免疫细胞而无法被清除；胚胎抗原易致免疫耐受。","id":"z16-a31482a7","type":"A1"},{"unit":"U16","ch":16,"part":4,"tag":"肿瘤微环境","stem":"关于肿瘤微环境与抗肿瘤免疫，下列叙述正确的是","options":["肿瘤微环境中的调节性 T 细胞可增强 CTL 的杀伤功能","肿瘤细胞表达 PD-L1 与 T 细胞表面 PD-1 结合后可促进 T 细胞活化","肿瘤细胞及基质细胞可分泌 IL-10、TGF-β 等抑制性细胞因子，并可促进调节性 T 细胞产生，抑制抗肿瘤免疫应答","肿瘤微环境中的缺氧条件不利于肿瘤细胞生长，可抑制血管新生","肿瘤微环境仅由肿瘤细胞构成，与基质细胞和免疫细胞无关"],"answer":2,"explain":"肿瘤微环境中的 IL-10、TGF-β、调节性 T 细胞及 PD-L1/PD-1 信号共同抑制免疫细胞活化并致其耗竭；缺氧则通过 VEGF 促进血管新生，有利于肿瘤生长。","id":"z16-78ffd6e2","type":"A1"},{"unit":"U17","ch":17,"part":4,"tag":"肿瘤外科","stem":"按照 Cady Blake 阐述的肿瘤外科治疗基本原则，居于首位的是","options":["手术操作的技术细节","病例的选择","肿瘤的生物学行为","淋巴结清扫的范围","手术切口的显露"],"answer":2,"explain":"该原则为“肿瘤生物学是第一位的，病例选择是第二位，手术操作和技术细节是最后需要考虑的”，故生物学行为居首。","id":"z17-d939e24e","type":"A1"},{"unit":"U17","ch":17,"part":4,"tag":"肿瘤外科","stem":"为防止术中肿瘤细胞脱落种植和血行转移，肿瘤外科手术操作中正确的方法是","options":["术中反复挤压肿瘤组织以判断其活动度","对已破溃的消化道肿瘤先分块切除以缩短手术时间","接触过肿瘤的手术器械继续用于正常组织","术中优先处理肿瘤的主要引流静脉，再结扎供应肿瘤区的动脉","先切断供应肿瘤区的动脉，再处理肿瘤的主要引流静脉"],"answer":3,"explain":"无瘤技术要求术中优先处理主要引流静脉、再结扎供应肿瘤区的动脉，以防血行转移；挤压、分块切除、重复使用器械均违背无瘤原则。","id":"z17-31bc4f55","type":"A1"},{"unit":"U17","ch":17,"part":4,"tag":"肿瘤外科","stem":"关于根治性手术（radical surgery）的定义，正确的是","options":["仅切除原发肿瘤而保留区域淋巴结","切除全部肿瘤组织及肿瘤可能累及的周围组织和区域淋巴结，以求达到彻底治愈","对分期较晚的肿瘤行大部切除，术后配合化疗、放疗等","以缓解症状、改善生存质量为目的而施行的手术","为明确诊断而在病变部位切取小块组织"],"answer":1,"explain":"根治性手术指切除全部肿瘤组织及可能累及的周围组织和区域淋巴结以求彻底治愈；大部切除后配合其他治疗为减瘤手术，缓解症状为姑息性手术。","id":"z17-46fcdde9","type":"A1"},{"unit":"U17","ch":17,"part":4,"tag":"肿瘤外科","stem":"关于根治性手术切除标本切缘的评价（R 分类），下列描述正确的是","options":["R0 表示肿瘤大体切除但显微镜下可见肿瘤残余","R0 表示肿瘤切除后肉眼可见的明显残留","R1 表示显微镜下切缘未见肿瘤残余的完全切除","R1 表示肿瘤大体切除但显微镜下可见肿瘤残留（切缘阳性）","R2 表示镜下切缘阴性的完全切除"],"answer":3,"explain":"R0 为镜下切缘未见肿瘤残余的完全切除，R1 为大部切除而镜下切缘阳性，R2 为肉眼可见残留；其余选项将三者含义颠倒。","id":"z17-523061ac","type":"A1"},{"unit":"U17","ch":17,"part":4,"tag":"肿瘤外科","stem":"关于恶性肿瘤多学科协作诊疗团队（MDT）及综合治疗策略，下列叙述正确的是","options":["应由肿瘤外科、肿瘤内科、放疗科、影像科、病理科等多学科医师组成 MDT，共同制订最优化的综合治疗策略","手术指征的把握仅由外科医生决定即可","MDT 仅适用于已失去手术机会的晚期肿瘤患者","TNM 分期已充分考虑了患者的器官功能和全身状况","Ⅲ期恶性实体瘤一般仅需局部治疗，不必全身治疗"],"answer":0,"explain":"MDT 由多学科医师组成以共同制订最优综合治疗策略；TNM 分期仅考虑肿瘤本身，对器官功能和全身状况缺乏考量，Ⅲ期多需综合治疗。","id":"z17-f2ab6c8d","type":"A1"},{"unit":"U17","ch":17,"part":4,"tag":"药物治疗","stem":"关于细胞毒类抗肿瘤药物按细胞增殖周期的分类，下列叙述正确的是","options":["细胞周期非特异性药物仅对增殖周期中某一时相的细胞有杀灭作用","烷化剂与抗肿瘤抗生素属于细胞周期特异性药物","细胞周期非特异性药物对 G1、S、G2、M 期及静止期（G0 期）细胞均有杀灭作用","羟基脲、氟尿嘧啶等抗代谢药主要作用于 M 期","长春新碱、长春碱属于细胞周期非特异性药物"],"answer":2,"explain":"细胞周期非特异性药物对各期及静止期（G0）细胞均有杀灭作用，如烷化剂和抗肿瘤抗生素；抗代谢药作用于 S 期，长春碱类作用于 M 期。","id":"z17-519595c0","type":"A1"},{"unit":"U17","ch":17,"part":4,"tag":"药物治疗","stem":"甲氨蝶呤抗肿瘤的主要作用机制是","options":["抑制二氢叶酸还原酶，使四氢叶酸生成不足而阻碍 DNA 合成","抑制 DNA 拓扑异构酶Ⅰ，使受损伤的 DNA 不能得到修复","与 DNA 碱基形成交叉联结而破坏 DNA 结构","抑制微管蛋白聚合，阻止纺锤丝的形成","抑制蛋白质合成的起始阶段，使核糖体分解并释放新生肽链"],"answer":0,"explain":"甲氨蝶呤结构与叶酸相似，抑制二氢叶酸还原酶使四氢叶酸不足、脱氧胸苷酸合成受阻而抑制 DNA 合成；C 为烷化剂或铂类机制。","id":"z17-c62374ed","type":"A1"},{"unit":"U17","ch":17,"part":4,"tag":"药物治疗","stem":"依西美坦治疗雌激素受体阳性乳腺癌的主要作用机制是","options":["与雌激素受体竞争性结合，阻断雌激素与受体的结合","作为芳香化酶的伪底物使该酶失活，减少雌激素的生物合成","抑制促性腺激素释放激素，减少 LH 与 FSH 的分泌","在靶组织与雄激素竞争雄激素受体","抑制脑垂体前叶分泌促卵泡激素，并对抗雌激素作用"],"answer":1,"explain":"依西美坦为芳香化酶抑制药，作为伪底物使芳香化酶失活、减少雌激素合成；A 为氟维司群，C 为亮丙瑞林，D 为氟他胺的机制。","id":"z17-0e5316b2","type":"A1"},{"unit":"U17","ch":17,"part":4,"tag":"药物治疗","stem":"关于贝伐珠单抗的作用机制，正确的是","options":["靶向 CD20，导致 B 细胞溶解并诱导其凋亡","阻断 HER2 介导的下游信号通路","阻断 EGFR 介导的下游信号通路，诱导癌细胞凋亡","与血管内皮生长因子（VEGF）结合，抑制肿瘤血管生成","结合 CTLA-4，增加肿瘤组织中 T 细胞的活化"],"answer":3,"explain":"贝伐珠单抗是作用于 VEGF 的重组人源化单克隆抗体，抑制肿瘤血管生成；A 为利妥昔单抗，B 为曲妥珠单抗，C 为西妥昔单抗。","id":"z17-07c10941","type":"A1"},{"unit":"U17","ch":17,"part":4,"tag":"药物治疗","stem":"伊马替尼治疗慢性粒细胞白血病的主要作用机制是","options":["抑制 DNA 拓扑异构酶Ⅱ，使 DNA 链断裂","嵌入 DNA 碱基对之间，干扰转录并阻止 RNA 的合成","抑制 PARP 酶，造成肿瘤细胞 DNA 修复途径缺陷","抑制 mTOR，阻断其介导的细胞信号转导","结合 ABL 酪氨酸激酶的 ATP 位点，抑制 BCR-ABL 激酶活性，阻止融合基因阳性细胞增殖"],"answer":4,"explain":"伊马替尼结合 ABL 酪氨酸激酶 ATP 位点，抑制 BCR-ABL 激酶活性，用于 CML 和胃肠道间质瘤；抑制拓扑异构酶Ⅱ为依托泊苷等药物的机制。","id":"z17-80454bf8","type":"A1"},{"unit":"U17","ch":17,"part":4,"tag":"药物治疗","stem":"关于维 A 酸与三氧化二砷（亚砷酸）治疗急性早幼粒细胞白血病的作用，正确的是","options":["维 A 酸通过抑制二氢叶酸还原酶杀伤白血病细胞","三氧化二砷通过抑制微管蛋白装配使细胞停止于 M 期","维 A 酸通过调节和降解 PML-RARα 融合蛋白，诱导白血病细胞分化成熟","两药均通过使 DNA 发生链间交联而直接杀伤细胞","两药均属于主要作用于 S 期的抗代谢药"],"answer":2,"explain":"维 A 酸调节并降解 PML-RARα 融合蛋白，重启髓系细胞分化基因调控网络；亚砷酸促进分化、诱导凋亡，两药均非抗代谢药。","id":"z17-364e24bf","type":"A1"},{"unit":"U17","ch":17,"part":4,"tag":"药物治疗","stem":"关于抗肿瘤药物的研发方向与选择性，下列叙述正确的是","options":["传统细胞毒类化疗药物因主要针对细胞分裂增殖，具有很高的细胞选择性","抗肿瘤药物由细胞毒类向分子靶向药物发展，对肿瘤细胞的选择性提高，减少了对正常快速增殖细胞的影响","分子靶向药物只作用于肿瘤细胞，不会产生任何不良反应","肿瘤细胞不易产生耐药性，无需不断开发新的抗肿瘤药物","分子靶向药物目前仅用于血液系统肿瘤的治疗"],"answer":1,"explain":"研发趋势是从细胞毒类向分子靶向药物发展，提高对肿瘤细胞的选择性、减少对正常增殖细胞的影响；细胞毒类药物缺乏选择性，靶向药仍有不良反应。","id":"z17-1f1c83c3","type":"A1"},{"unit":"U17","ch":17,"part":4,"tag":"放射治疗","stem":"关于放射治疗的基本原理，下列叙述正确的是","options":["肿瘤控制概率与正常组织并发症概率均随剂量增加而升高，二者之间可接受的剂量范围即治疗窗","治疗窗越大，处方剂量可选择的范围越小","治疗比是指肿瘤致死剂量与正常组织耐受剂量之比","治疗比小于 1 的肿瘤通过放疗容易实现临床治愈","只要给予足够高的剂量，即可在不增加正常组织损伤的前提下控制肿瘤"],"answer":0,"explain":"肿瘤控制概率与正常组织并发症概率均随剂量升高，两者之间可接受的剂量范围为治疗窗；治疗比为正常组织耐受剂量与肿瘤致死剂量之比，小于 1 时治愈困难。","id":"z17-aa1ab72b","type":"A1"},{"unit":"U17","ch":17,"part":4,"tag":"放射治疗","stem":"目前临床放射治疗最常使用的外照射设备及其产生的射线是","options":["钴-60 治疗机产生的 γ 射线","医用电子直线加速器产生的 X 射线或电子线","放射性核素密封源产生的 β 射线","质子加速器产生的质子束","重离子加速器产生的重离子束"],"answer":1,"explain":"教材指出目前最常用的外照射设备是医用电子直线加速器，其产生的 X 射线或电子线用于肿瘤治疗，临床常用能量为 4～20 MeV。","id":"z17-18605999","type":"A1"},{"unit":"U17","ch":17,"part":4,"tag":"放射治疗","stem":"按教材所述，可通过放疗或同步放化疗达到根治的肿瘤是","options":["胰腺癌","胃癌","鼻咽癌","胆囊癌","结肠癌"],"answer":2,"explain":"鼻咽癌、早期喉癌、早期肺癌、肛管癌、前列腺癌、宫颈癌及部分淋巴瘤等可通过放疗或同步放化疗根治，其余选项不属教材所列。","id":"z17-ce996b21","type":"A1"},{"unit":"U17","ch":17,"part":4,"tag":"放射治疗","stem":"与术后放疗相比，属于术前放疗优点的是","options":["可以获得肿瘤准确的病理分期，避免过度治疗","可由外科医生术中所见及放置银夹指导放疗范围，提高放疗的准确性","可以杀灭手术时可能残留或种植的亚临床病灶","有助于缩小肿瘤体积、提高手术切除率，且照射范围较小、副作用往往更低","术后放疗的照射范围通常小于术前放疗"],"answer":3,"explain":"术前放疗可缩小肿瘤体积、提高手术切除率并减少术中播散，照射范围较小、副作用更低；A、B、C 均为术后放疗的优势。","id":"z17-e6fde910","type":"A1"},{"unit":"U17","ch":17,"part":4,"tag":"放射治疗","stem":"关于分次放射治疗对早反应组织和晚反应组织的影响，正确的是","options":["α/β 值较大的组织增殖能力弱，对放疗分次大小的敏感性高","脊髓属于早反应组织，分次照射会加重其损伤","早反应组织修复能力强、损伤修复启动快，晚反应组织对分次大小敏感性高，分次治疗可减轻晚反应组织的损伤","分次照射会降低肿瘤细胞对射线的敏感性","相同累积总剂量下，分次照射与单次大剂量对正常组织的损伤完全相同"],"answer":2,"explain":"α/β 值大的早反应组织修复能力强；α/β 值小的晚反应组织（如脊髓）对分次剂量敏感，分次治疗可减小其损伤、提高正常组织耐受性。","id":"z17-e836d57f","type":"A1"},{"unit":"U17","ch":17,"part":4,"tag":"放射治疗","stem":"关于肿瘤姑息放疗与急诊放疗的适应证，下列叙述正确的是","options":["姑息放疗以根治肿瘤、延长生存期为主要目标","骨转移瘤放疗后疼痛缓解率可达 70%～90%，是骨转移瘤的主要治疗方式","存在脊柱不稳定性的脊髓压迫症患者应首选放疗","上腔静脉压迫综合征（SVCS）应首选手术治疗","脑转移患者禁止行全脑放疗"],"answer":1,"explain":"姑息放疗（减症放疗）以减轻症状、改善生活质量为目标，骨转移瘤放疗后疼痛缓解率可达 70%～90%；脊柱不稳定者不宜首选放疗，SVCS 首选放疗。","id":"z17-c271f7b9","type":"A1"},{"unit":"U17","ch":17,"part":4,"tag":"放射治疗","stem":"为提高放射治疗靶区勾画的精确性，下列做法正确的是","options":["仅依据 CT 模拟定位图像勾画靶区即可，不需其他影像手段","靶区只需勾画大体肿瘤区（GTV），不必考虑亚临床病变","内靶区（ITV）指包括日常摆位误差在内的扩大照射范围","危及器官（OAR）不必勾画，也不影响靶区处方剂量的大小","采用与 CT 模拟定位相同的体位及固定装置行 MRI、PET-CT 检查并与 CT 图像联合使用，必要时行 4DCT 扫描"],"answer":4,"explain":"MRI、PET-CT 与 CT 定位图像联合使用可提高勾画精度，4DCT 可得到包含呼吸运动的个体化 ITV；摆位误差属于计划靶区（PTV）的范围。","id":"z17-63fb5318","type":"A1"},{"unit":"U17","ch":17,"part":4,"tag":"免疫治疗","stem":"关于免疫检查点抑制剂的作用机制，下列叙述正确的是","options":["靶向 PD-1/PD-L1 的单克隆抗体阻断 PD-L1 与 PD-1 的结合，恢复 T 细胞活性，缓解免疫抑制","免疫检查点抑制剂可直接杀伤肿瘤细胞，属于细胞毒类抗肿瘤药物","伊匹单抗结合 PD-1 而阻断其与配体的结合","帕博利珠单抗结合 CTLA-4 而阻断其与 B7 的结合","免疫检查点抑制剂常引起骨髓抑制、呕吐和脱发等细胞毒性反应"],"answer":0,"explain":"PD-1/PD-L1 通路为免疫负调控，单抗阻断二者结合可恢复 T 细胞活性；伊匹单抗靶向 CTLA-4，且免疫检查点疗法一般不引起骨髓抑制和脱发。","id":"z17-aacf5cbd","type":"A1"},{"unit":"U17","ch":17,"part":4,"tag":"免疫治疗","stem":"关于嵌合抗原受体 T 细胞（CAR-T）的构建与作用原理，正确的是","options":["CAR-T 细胞识别肿瘤抗原必须依赖自身 MHC 分子的结合与提呈","CAR 只含抗体的 V 区片段，不含任何 T 细胞信号转导分子","CAR-T 细胞的活化只需抗原信号，不需要共刺激分子提供第二信号","第四代 CAR-T 细胞因载体容量有限，只能表达单一受体","CAR 由抗体的 V 区片段与 CD3ζ 的胞内 ITAM 区融合而成，识别抗原不需自身 MHC 提呈"],"answer":4,"explain":"CAR 由抗体 V 区片段与 CD3ζ 的 ITAM 区融合而成，识别抗原无需 MHC 提呈；T 细胞活化需双信号，第二代加入 CD28 或 4-1BB。","id":"z17-d90d1c49","type":"A1"},{"unit":"U17","ch":17,"part":4,"tag":"免疫治疗","stem":"与 CAR-T 相比，CAR-NK 的特点是","options":["更容易产生细胞因子风暴","只能自体给药，必须严格进行 HLA 配型","在无细胞因子的情况下注入体内后仍能长期持久存在","通常产生 IFN-γ 和 GM-CSF，不易产生细胞因子风暴，且可异体给药而无需 HLA 配型","通过分泌抗体直接中和肿瘤细胞"],"answer":3,"explain":"CAR-NK 靶向 TAA 释放毒性细胞因子杀伤肿瘤，通常产生 IFN-γ 和 GM-CSF，不易引起细胞因子风暴，可异体给药且无需 HLA 配型。","id":"z17-182577be","type":"A1"},{"unit":"U17","ch":17,"part":4,"tag":"免疫治疗","stem":"关于 TCR-T 细胞疗法，下列叙述正确的是","options":["将特异性识别肿瘤相关抗原的外源 TCR 基因转入 T 细胞，发挥 MHC 依赖性的抗肿瘤作用","与 CAR-T 相同，TCR-T 识别抗原不依赖 MHC 分子","因不受 MHC 限制，TCR-T 比 CAR-T 更容易引起细胞因子风暴","TCR-T 的靶点主要限于 CD19，只能用于治疗 B 细胞淋巴瘤","TCR-T 属于非特异性肿瘤细胞免疫治疗"],"answer":0,"explain":"TCR-T 通过转入特异性识别 TAA 的外源 TCR 基因提高亲和力，发挥 MHC 依赖性抗肿瘤作用；因 MHC 限制，其安全性较好，可减轻细胞因子风暴。","id":"z17-404c4bd9","type":"A1"},{"unit":"U17","ch":17,"part":4,"tag":"免疫治疗","stem":"目前肿瘤免疫治疗面临的主要难题是","options":["免疫治疗对绝大多数肿瘤患者均有明显疗效","各种肿瘤都已有理想的免疫治疗靶点，无需筛选患者","免疫检查点抑制剂会引起骨髓抑制、呕吐和脱发等细胞毒性反应","肿瘤抗原均能顺利被加工提呈，不存在识别障碍","免疫应答仅发生在相对小部分患者，缺乏有效可靠的疗效预测标志物，且部分肿瘤抗原可被多糖封闭而难以被加工提呈"],"answer":4,"explain":"教材指出免疫应答仅发生在相对小部分患者，缺乏有效可靠的疗效预测标志物是精准个体化免疫治疗的最大挑战；肿瘤抗原还可被多糖封闭而难以提呈。","id":"z17-f6adb49a","type":"A1"},{"id":"gz0-01-1","ch":11,"part":0,"tag":"机制","stem":"发热时体温上升的直接机制是","options":["调定点上移，产热增加而散热减少，体温升至新调定点","调定点不变，产热增加而散热障碍，体温被动升高","体温调节中枢受损，机体完全丧失调节体温的能力","皮肤血管扩张散热减少，骨骼肌被动产热增加","环境高温使散热受阻，体温随环境温度被动上升"],"answer":0,"explain":"A 对：发热的定义就是内源性致热原使体温调节中枢调定点上移、引起调节性体温升高（超过正常 0.5℃），机体随后按新调定点把体温调上去。B 描述的是调定点不变的被动性体温升高，即过热（如中暑、甲亢）；C、E 都把发热说成调节功能丧失或环境所致，与调定点上移这一核心不符；D 错在皮肤血管是收缩（减少散热）而非扩张，且骨骼肌是主动寒战产热。","type":"A1","group":"z0-01","kind":"mechanism","chs":[11,4],"vignette":"发热并不是体温调节失灵，而是调定点被上调了。细菌、病毒等发热激活物本身并不直接作用于体温中枢，它们促使机体产生内源性致热原——一组不耐热的小分子蛋白质（如白细胞介素-1）。内源性致热原经血流作用于下丘脑的体温调节中枢，使热敏神经元受抑、冷敏神经元兴奋，调定点上移。此时 37℃ 的血液对已上移的调定点而言成了冷刺激，于是产热增加、散热减少，体温一路上升——这就是患者先畏寒、皮肤苍白，继而出现寒战与鸡皮疙瘩的原因，此期骨骼肌寒战是产热迅速增加的主要方式。当体温升到新的调定点水平后，产热与散热在高水平上维持平衡，患者反而觉得酷热、皮肤发红。等病因消除或用了退热药，调定点回到正常水平，此时 39℃ 的血液成了热刺激，散热大于产热，体温随之下降。发热时能量消耗增加、糖原分解增强，体温每升高 1℃，代谢率约升高 13%。","vignette_title":"情景 1：发热不是调节失灵，是调定点被调高了","gidx":1,"gn":4,"anchor":"冷敏神经元兴奋，调定点上移"},{"id":"gz0-01-2","ch":11,"part":0,"tag":"判读","stem":"患者出现寒战、皮肤苍白与鸡皮疙瘩，其原因是","options":["调定点上移，产热大于散热并伴竖毛肌收缩","调定点下移，散热大于产热并伴皮肤血管扩张","调定点不变，棕色脂肪大量分解产热所致","内源性致热原直接引起骨骼肌不自主收缩","体温过高使下丘脑体温调节中枢受到完全抑制"],"answer":0,"explain":"A 对：调定点上移后，实际体温低于新调定点，机体判定为冷，于是产热增加、散热减少（皮肤血管收缩致苍白），竖毛肌收缩形成鸡皮疙瘩。B 把方向说反（调定点是上移）；C 漏掉了调定点上移这一前提；D 错在内源性致热原作用于体温调节中枢，寒战是中枢发出的神经指令经运动神经引起的，并非致热原直接作用于骨骼肌；E 与发热时中枢调节活跃的事实相反。","type":"A1","group":"z0-01","kind":"mechanism","chs":[11,4],"vignette":"发热并不是体温调节失灵，而是调定点被上调了。细菌、病毒等发热激活物本身并不直接作用于体温中枢，它们促使机体产生内源性致热原——一组不耐热的小分子蛋白质（如白细胞介素-1）。内源性致热原经血流作用于下丘脑的体温调节中枢，使热敏神经元受抑、冷敏神经元兴奋，调定点上移。此时 37℃ 的血液对已上移的调定点而言成了冷刺激，于是产热增加、散热减少，体温一路上升——这就是患者先畏寒、皮肤苍白，继而出现寒战与鸡皮疙瘩的原因，此期骨骼肌寒战是产热迅速增加的主要方式。当体温升到新的调定点水平后，产热与散热在高水平上维持平衡，患者反而觉得酷热、皮肤发红。等病因消除或用了退热药，调定点回到正常水平，此时 39℃ 的血液成了热刺激，散热大于产热，体温随之下降。发热时能量消耗增加、糖原分解增强，体温每升高 1℃，代谢率约升高 13%。","vignette_title":"情景 1：发热不是调节失灵，是调定点被调高了","gidx":2,"gn":4,"anchor":"患者先畏寒、皮肤苍白"},{"id":"gz0-01-3","ch":11,"part":0,"tag":"机制","stem":"体温上升期产热量迅速增加，其主要的产热方式是","options":["骨骼肌发生寒战，产热量迅速增加","棕色脂肪组织分解产热，产热量增加","肝糖原大量分解，血糖升高而产热增加","甲状腺激素分泌增多，代谢率持续升高","心率加快使血液循环加速，体表散热减少"],"answer":0,"explain":"A 对：情景已点明此期骨骼肌寒战是产热迅速增加的主要方式——由下丘脑发出神经指令、经运动神经引起骨骼肌寒战。B 棕色脂肪产热也是上升期的产热来源之一，但不是主要方式；C 肝糖原分解供能属于代谢底物层面的变化；D 甲状腺激素升高代谢率见于甲亢等长期状态，不是发热上升期的即时主要方式；E 心率加快是循环反应，且该期皮肤血管是收缩的。","type":"A1","group":"z0-01","kind":"mechanism","chs":[11,4],"vignette":"发热并不是体温调节失灵，而是调定点被上调了。细菌、病毒等发热激活物本身并不直接作用于体温中枢，它们促使机体产生内源性致热原——一组不耐热的小分子蛋白质（如白细胞介素-1）。内源性致热原经血流作用于下丘脑的体温调节中枢，使热敏神经元受抑、冷敏神经元兴奋，调定点上移。此时 37℃ 的血液对已上移的调定点而言成了冷刺激，于是产热增加、散热减少，体温一路上升——这就是患者先畏寒、皮肤苍白，继而出现寒战与鸡皮疙瘩的原因，此期骨骼肌寒战是产热迅速增加的主要方式。当体温升到新的调定点水平后，产热与散热在高水平上维持平衡，患者反而觉得酷热、皮肤发红。等病因消除或用了退热药，调定点回到正常水平，此时 39℃ 的血液成了热刺激，散热大于产热，体温随之下降。发热时能量消耗增加、糖原分解增强，体温每升高 1℃，代谢率约升高 13%。","vignette_title":"情景 1：发热不是调节失灵，是调定点被调高了","gidx":3,"gn":4,"anchor":"骨骼肌寒战是产热迅速增加的主要方式"},{"id":"gz0-01-4","ch":11,"part":0,"tag":"机制","stem":"关于发热三个时相与代谢变化，下列叙述正确的是（X 型多选）","options":["体温上升期产热大于散热，患者常有畏寒感","发热属于调定点未变的被动性体温升高","高温持续期产热与散热在高水平上维持平衡","体温下降期散热大于产热，常伴有出汗","体温每升高 1℃，代谢率约升高 13%"],"answer":[0,2,3,4],"explain":"答案 ACDE。A、C、D 对应三个时相的产热散热关系：上升期产热大于散热（畏寒、寒战）、持续期两者在高水平平衡（酷热、皮肤发红）、下降期散热大于产热（出汗退热）。E 对：发热时能量消耗增加，体温每升高 1℃ 代谢率约升高 13%，糖原分解增强、血糖可升高。B 错：调定点未变的被动性体温升高是过热（如中暑、甲亢），而发热的调定点是上移的。","type":"X","group":"z0-01","kind":"mechanism","chs":[11,4],"vignette":"发热并不是体温调节失灵，而是调定点被上调了。细菌、病毒等发热激活物本身并不直接作用于体温中枢，它们促使机体产生内源性致热原——一组不耐热的小分子蛋白质（如白细胞介素-1）。内源性致热原经血流作用于下丘脑的体温调节中枢，使热敏神经元受抑、冷敏神经元兴奋，调定点上移。此时 37℃ 的血液对已上移的调定点而言成了冷刺激，于是产热增加、散热减少，体温一路上升——这就是患者先畏寒、皮肤苍白，继而出现寒战与鸡皮疙瘩的原因，此期骨骼肌寒战是产热迅速增加的主要方式。当体温升到新的调定点水平后，产热与散热在高水平上维持平衡，患者反而觉得酷热、皮肤发红。等病因消除或用了退热药，调定点回到正常水平，此时 39℃ 的血液成了热刺激，散热大于产热，体温随之下降。发热时能量消耗增加、糖原分解增强，体温每升高 1℃，代谢率约升高 13%。","vignette_title":"情景 1：发热不是调节失灵，是调定点被调高了","gidx":4,"gn":4,"anchor":"产热与散热在高水平上维持平衡"},{"id":"gz0-02-1","ch":14,"part":0,"tag":"机制","stem":"原位癌发生局部侵袭时，最先出现的分子改变是","options":["上皮钙黏素表达减少，癌细胞彼此易于分离","层粘连蛋白受体减少，与基底膜的黏附减弱","金属蛋白酶抑制物升高，基质降解随之增强","nm23 表达水平升高，细胞运动能力增强","整合素表达下降，癌细胞从基底膜上脱落"],"answer":0,"explain":"A 对：正常上皮细胞靠上皮钙黏素彼此黏着，原位癌侵袭的第一步就是钙黏素表达减少、细胞易于分离并迁移。B 错：癌细胞表面层粘连蛋白受体反而增多，使其更易与基底膜黏附；C 错：金属蛋白酶组织抑制物属于转移抑制物，其减少才利于基质降解；D 错：nm23 是转移抑制基因，其表达升高对应低转移性；E 整合素并非简单的表达下降，癌细胞与细胞外基质的黏附在侵袭中是增强的。","type":"A1","group":"z0-02","kind":"mechanism","chs":[14,15,16],"vignette":"一个上皮来源的癌细胞要从原发灶走到远处器官，得过好几道关。第一步是摆脱与邻居的黏附：原位癌发生局部侵袭时，上皮钙黏素表达减少，癌细胞彼此容易分离；接着它要降解基底膜与细胞外基质，靠自身与间质细胞分泌的蛋白酶开路；进入血管后，还得在血流剪切力与免疫细胞的双重围剿中存活下来，形成瘤细胞栓子。临床上，癌最常经淋巴道转移，而肉瘤多经血道转移，血道转移的途径与栓子运行途径相同。到达远处器官后能否定植，取决于该器官的微环境是否适宜——这就是 1889 年 Paget 提出的种子与土壤假说。上皮-间质转化（EMT）使癌细胞获得迁移能力，血管新生（VEGF 等）为其提供通路。不过这条路极其低效：90% 的转移细胞能从原发灶逃逸，却只有不到 2% 形成微转移灶，最终形成临床明显转移灶的不到 0.02%。","vignette_title":"情景 2：一个癌细胞要走完的那条低效通路","gidx":1,"gn":4,"anchor":"上皮钙黏素表达减少"},{"id":"gz0-02-2","ch":14,"part":0,"tag":"判读","stem":"关于恶性肿瘤的转移途径，下列叙述正确的是","options":["癌最常经淋巴道转移，肉瘤多经血道转移","癌最常经血道转移，肉瘤多经淋巴道转移","种植转移多发生于胸腔，且不伴体腔积液","淋巴道转移严格逐站进行，不会发生跳跃","血道转移的途径与栓子运行途径完全不同"],"answer":0,"explain":"A 对：癌以淋巴道转移最常见，肉瘤以血道转移最常见，这是两者的典型差别。B 把两者对调。C 错：种植转移最易发生在腹腔，且常伴体腔血性积液与脏器粘连，积液内可查到恶性肿瘤细胞。D 错：淋巴道转移通常与引流方向一致，但少数可发生逆行转移或越过引流淋巴结的跳跃式转移。E 错：血道转移的途径与栓子运行途径相同（静脉→右心→肺，门静脉→肝等）。","type":"A1","group":"z0-02","kind":"mechanism","chs":[14,15,16],"vignette":"一个上皮来源的癌细胞要从原发灶走到远处器官，得过好几道关。第一步是摆脱与邻居的黏附：原位癌发生局部侵袭时，上皮钙黏素表达减少，癌细胞彼此容易分离；接着它要降解基底膜与细胞外基质，靠自身与间质细胞分泌的蛋白酶开路；进入血管后，还得在血流剪切力与免疫细胞的双重围剿中存活下来，形成瘤细胞栓子。临床上，癌最常经淋巴道转移，而肉瘤多经血道转移，血道转移的途径与栓子运行途径相同。到达远处器官后能否定植，取决于该器官的微环境是否适宜——这就是 1889 年 Paget 提出的种子与土壤假说。上皮-间质转化（EMT）使癌细胞获得迁移能力，血管新生（VEGF 等）为其提供通路。不过这条路极其低效：90% 的转移细胞能从原发灶逃逸，却只有不到 2% 形成微转移灶，最终形成临床明显转移灶的不到 0.02%。","vignette_title":"情景 2：一个癌细胞要走完的那条低效通路","gidx":2,"gn":4,"anchor":"癌最常经淋巴道转移"},{"id":"gz0-02-3","ch":14,"part":0,"tag":"机制","stem":"种子与土壤假说主要用于解释","options":["转移瘤为何具有器官选择性","原发瘤的组织学分类依据","确定肿瘤分级与分期的标准","说明淋巴道转移的引流方向","说明血道转移中瘤栓的运行路径"],"answer":0,"explain":"A 对：该假说认为转移能否成功取决于瘤细胞（种子）与靶器官微环境（土壤）是否相互适应，正好解释乳腺癌易转移至骨、肺、脑，而横纹肌、脾等部位转移瘤少见的现象。B、C 与转移部位的选择无关。D 淋巴道转移的引流方向由解剖与淋巴引流决定，是该假说要解释的现象之一而非其用途。E 血道转移中瘤栓的运行路径遵循栓子运行规律，属机械因素，也不是该假说的解释对象。","type":"A1","group":"z0-02","kind":"mechanism","chs":[14,15,16],"vignette":"一个上皮来源的癌细胞要从原发灶走到远处器官，得过好几道关。第一步是摆脱与邻居的黏附：原位癌发生局部侵袭时，上皮钙黏素表达减少，癌细胞彼此容易分离；接着它要降解基底膜与细胞外基质，靠自身与间质细胞分泌的蛋白酶开路；进入血管后，还得在血流剪切力与免疫细胞的双重围剿中存活下来，形成瘤细胞栓子。临床上，癌最常经淋巴道转移，而肉瘤多经血道转移，血道转移的途径与栓子运行途径相同。到达远处器官后能否定植，取决于该器官的微环境是否适宜——这就是 1889 年 Paget 提出的种子与土壤假说。上皮-间质转化（EMT）使癌细胞获得迁移能力，血管新生（VEGF 等）为其提供通路。不过这条路极其低效：90% 的转移细胞能从原发灶逃逸，却只有不到 2% 形成微转移灶，最终形成临床明显转移灶的不到 0.02%。","vignette_title":"情景 2：一个癌细胞要走完的那条低效通路","gidx":3,"gn":4,"anchor":"种子与土壤假说"},{"id":"gz0-02-4","ch":15,"part":0,"tag":"判读","stem":"关于肿瘤侵袭转移的机制与效率，下列叙述正确的是（X 型多选）","options":["上皮-间质转化使癌细胞获得迁移与侵袭能力","转移灶的形成需要适宜的组织微环境","血管新生为肿瘤转移提供必要的通路","进入血流的瘤细胞大多数能成功形成转移灶","肿瘤干细胞与肿瘤的复发、转移密切相关"],"answer":[0,1,2,4],"explain":"答案 ABCE。A 对：EMT 使极化上皮细胞获得间质表型，迁移与侵袭能力增强、基底膜被降解，是上皮源癌浸润转移的重要途径。B 对：即种子与土壤假说，靶器官微环境决定能否定植。C 对：血管新生（VEGF、FGF 等）为瘤细胞进入血道与在转移灶增殖提供条件。E 对：肿瘤干细胞具有高致瘤性、对放化疗不敏感，是复发与转移的重要原因。D 错：这条路极其低效——进入血流的瘤细胞绝大多数被清除，不到 2% 形成微转移灶，最终形成临床明显转移灶的不到 0.02%。","type":"X","group":"z0-02","kind":"mechanism","chs":[14,15,16],"vignette":"一个上皮来源的癌细胞要从原发灶走到远处器官，得过好几道关。第一步是摆脱与邻居的黏附：原位癌发生局部侵袭时，上皮钙黏素表达减少，癌细胞彼此容易分离；接着它要降解基底膜与细胞外基质，靠自身与间质细胞分泌的蛋白酶开路；进入血管后，还得在血流剪切力与免疫细胞的双重围剿中存活下来，形成瘤细胞栓子。临床上，癌最常经淋巴道转移，而肉瘤多经血道转移，血道转移的途径与栓子运行途径相同。到达远处器官后能否定植，取决于该器官的微环境是否适宜——这就是 1889 年 Paget 提出的种子与土壤假说。上皮-间质转化（EMT）使癌细胞获得迁移能力，血管新生（VEGF 等）为其提供通路。不过这条路极其低效：90% 的转移细胞能从原发灶逃逸，却只有不到 2% 形成微转移灶，最终形成临床明显转移灶的不到 0.02%。","vignette_title":"情景 2：一个癌细胞要走完的那条低效通路","gidx":4,"gn":4,"anchor":"90% 的转移细胞能从原发灶逃逸"},{"id":"gz0-03-1","ch":10,"part":0,"tag":"机制","stem":"伤口周围局部发红与发烫，直接原因是","options":["炎症介质使细动脉、毛细血管扩张而血流量增加","血管通透性增高使血浆蛋白渗入组织间隙","白细胞在局部聚集并释放溶酶体酶类物质","局部组织坏死释放的热量使该处温度升高","淋巴回流受阻导致局部血液淤滞而发热"],"answer":0,"explain":"A 对：炎症介质引起细动脉与毛细血管扩张、血流加快（动脉性充血），这是局部发红与温度升高的直接来源。B 描述的是肿胀的机制（炎性水肿），不是发红发烫；C 白细胞聚集与酶释放主要造成组织损伤与脓液形成；D 错在组织坏死并不「释放热量」，坏死区产热减少；E 淋巴回流受阻是水肿持续的原因之一，与发红发烫无关。","type":"A1","group":"z0-03","kind":"mechanism","chs":[10,3,9],"vignette":"手指被木刺扎伤两天后，伤口周围出现一片发红、发烫、肿胀的区域，碰一下就疼。这四个表现不是一句「发炎了」能解释的，它们各自对应着不同的血管与细胞事件。炎症介质（如组胺、前列腺素）使细动脉和毛细血管扩张，局部血流量增加——这就是发红与发烫的来源；血管通透性增高后，血浆蛋白和液体渗到组织间隙，形成炎性水肿，于是肿胀；渗出物与炎症介质作用于神经末梢，加上组织肿胀的压迫，产生疼痛。与此同时，白细胞正沿着边集—滚动—黏附—游出—趋化的顺序离开血管、向损伤处聚集：中性粒细胞在数小时内到达，其后是单核细胞。它们吞噬并清除病原体与坏死组织，但白细胞释放的溶酶体酶也会损伤自身组织，这就是白细胞的「双刃剑」作用。","vignette_title":"情景 3：红、肿、热、痛，各自对应哪件血管里的事","gidx":1,"gn":4,"anchor":"局部血流量增加"},{"id":"gz0-03-2","ch":10,"part":0,"tag":"机制","stem":"伤口周围肿胀的主要原因是","options":["血管通透性增高，血浆蛋白与液体渗出到组织间隙","血管扩张充血使局部血量增多而体积增大","白细胞游出血管后聚集成团造成局部隆起","淋巴管被纤维素阻塞导致淋巴回流出现障碍","组织坏死液化后形成脓腔而局部明显膨隆"],"answer":0,"explain":"A 对：血管通透性增高使血浆蛋白与液体渗出到组织间隙，形成炎性水肿，这是急性炎症局部肿胀的主要机制（渗出液聚在浆膜腔则为炎性积液）。B 把充血当作主因，充血只解释发红发烫；C 白细胞聚集的量不足以造成明显隆起；D 纤维素阻塞淋巴管会使水肿加重，但属继发因素；E 脓腔形成是化脓性炎的后期表现，本例是刺伤早期的红肿。","type":"A1","group":"z0-03","kind":"mechanism","chs":[10,3,9],"vignette":"手指被木刺扎伤两天后，伤口周围出现一片发红、发烫、肿胀的区域，碰一下就疼。这四个表现不是一句「发炎了」能解释的，它们各自对应着不同的血管与细胞事件。炎症介质（如组胺、前列腺素）使细动脉和毛细血管扩张，局部血流量增加——这就是发红与发烫的来源；血管通透性增高后，血浆蛋白和液体渗到组织间隙，形成炎性水肿，于是肿胀；渗出物与炎症介质作用于神经末梢，加上组织肿胀的压迫，产生疼痛。与此同时，白细胞正沿着边集—滚动—黏附—游出—趋化的顺序离开血管、向损伤处聚集：中性粒细胞在数小时内到达，其后是单核细胞。它们吞噬并清除病原体与坏死组织，但白细胞释放的溶酶体酶也会损伤自身组织，这就是白细胞的「双刃剑」作用。","vignette_title":"情景 3：红、肿、热、痛，各自对应哪件血管里的事","gidx":2,"gn":4,"anchor":"形成炎性水肿"},{"id":"gz0-03-3","ch":10,"part":0,"tag":"机制","stem":"中性粒细胞从血管内到达炎症病灶，其顺序是","options":["边集→滚动→黏附→游出→趋化","滚动→边集→黏附→趋化→游出","黏附→边集→滚动→游出→趋化","边集→黏附→滚动→趋化→游出","趋化→边集→滚动→黏附→游出"],"answer":0,"explain":"A 对：血流减慢后白细胞被推向血管边缘（边集），与内皮黏附分子反复结合分离而滚动，随后牢固黏附、穿血管壁游出，最后沿化学物质浓度梯度定向移动（趋化作用）到达病灶。B、C、D 都把滚动或黏附提到边集之前；E 把趋化放在最前，而趋化是白细胞出血管之后的最后一步。","type":"A1","group":"z0-03","kind":"mechanism","chs":[10,3,9],"vignette":"手指被木刺扎伤两天后，伤口周围出现一片发红、发烫、肿胀的区域，碰一下就疼。这四个表现不是一句「发炎了」能解释的，它们各自对应着不同的血管与细胞事件。炎症介质（如组胺、前列腺素）使细动脉和毛细血管扩张，局部血流量增加——这就是发红与发烫的来源；血管通透性增高后，血浆蛋白和液体渗到组织间隙，形成炎性水肿，于是肿胀；渗出物与炎症介质作用于神经末梢，加上组织肿胀的压迫，产生疼痛。与此同时，白细胞正沿着边集—滚动—黏附—游出—趋化的顺序离开血管、向损伤处聚集：中性粒细胞在数小时内到达，其后是单核细胞。它们吞噬并清除病原体与坏死组织，但白细胞释放的溶酶体酶也会损伤自身组织，这就是白细胞的「双刃剑」作用。","vignette_title":"情景 3：红、肿、热、痛，各自对应哪件血管里的事","gidx":3,"gn":4,"anchor":"边集—滚动—黏附—游出—趋化"},{"id":"gz0-03-4","ch":10,"part":0,"tag":"判读","stem":"关于炎症的基本病理变化与转归，下列叙述正确的是（X 型多选）","options":["变质、渗出、增生是炎症局部组织的三大基本变化","渗出是机体主动的抗损伤过程，把抗体与白细胞送到损伤处","白细胞在吞噬病原体的同时，也可损伤自身组织","渗出液过多可压迫邻近器官，纤维素过多可发生机化粘连","炎症对机体只有损害作用，不具有任何防御意义"],"answer":[0,1,2,3],"explain":"答案 ABCD。A 对：任何炎症都不同程度包含变质、渗出、增生三种基本病变。B 对：变质是损伤过程，渗出是机体主动的抗损伤过程，目的正是把血浆蛋白与白细胞送到损伤部位。C 对：即白细胞的「双刃剑」作用，其释放的溶酶体酶与活性氧也会破坏自身组织。D 对：大量渗出液可压迫邻近器官（如胸腔积液压迫肺），纤维素吸收不完全则机化、引起粘连。E 错：炎症本质上是防御性反应，只是在一定条件下才造成危害。","type":"X","group":"z0-03","kind":"mechanism","chs":[10,3,9],"vignette":"手指被木刺扎伤两天后，伤口周围出现一片发红、发烫、肿胀的区域，碰一下就疼。这四个表现不是一句「发炎了」能解释的，它们各自对应着不同的血管与细胞事件。炎症介质（如组胺、前列腺素）使细动脉和毛细血管扩张，局部血流量增加——这就是发红与发烫的来源；血管通透性增高后，血浆蛋白和液体渗到组织间隙，形成炎性水肿，于是肿胀；渗出物与炎症介质作用于神经末梢，加上组织肿胀的压迫，产生疼痛。与此同时，白细胞正沿着边集—滚动—黏附—游出—趋化的顺序离开血管、向损伤处聚集：中性粒细胞在数小时内到达，其后是单核细胞。它们吞噬并清除病原体与坏死组织，但白细胞释放的溶酶体酶也会损伤自身组织，这就是白细胞的「双刃剑」作用。","vignette_title":"情景 3：红、肿、热、痛，各自对应哪件血管里的事","gidx":4,"gn":4,"anchor":"白细胞释放的溶酶体酶也会损伤自身组织"},{"id":"gz0-04-1","ch":12,"part":0,"tag":"机制","stem":"硝酸甘油采用舌下含服而非常规口服，主要原因是","options":["舌下黏膜的吸收面积大，能提高药物的吸收总量","舌下吸收不经门静脉与肝，可避开首过效应","舌下含服可减少药物对胃肠黏膜的刺激作用","舌下给药能使药物以主动转运方式被迅速吸收","舌下含服能延长药物在体内的作用维持时间"],"answer":1,"explain":"B 对：舌下黏膜血流丰富、吸收迅速，且吸收后直接进入体循环、不经门静脉和肝，因此避开了首过效应，起效快、生物利用度高。A 错：舌下吸收面积小、吸收量有限，靠的是血流丰富而非面积大；C 胃肠刺激不是主要考虑；D 舌下吸收多数药物属被动转运；E 舌下给药恰恰是作用时间较短的给药方式。","type":"A1","group":"z0-04","kind":"mechanism","chs":[12,5],"vignette":"硝酸甘油是缓解心绞痛的老药，用法却很特别——舌下含服，而不是吞下去。原因藏在药物进入血液的路径里：口服药物主要在小肠吸收，吸收后先经门静脉进入肝脏，肝细胞滑面内质网上的细胞色素 P450 等药物代谢酶会把相当一部分原型药转化掉，使进入体循环的药量明显减少，这就是首过效应；硝酸甘油的首过效应很强，口服后生物利用度很低。舌下黏膜血流丰富、吸收迅速，且吸收后的药物直接进入体循环、不经过门静脉和肝，因此起效快、生物利用度高。类似的给药途径还有直肠给药与吸入给药。反过来说，某些前药本身没有药理活性，必须经肝内代谢生成活性产物才能起效，对它们而言「经过肝脏」恰恰是必要的。","vignette_title":"情景 4：硝酸甘油为什么要含在舌下，而不是吞下去","gidx":1,"gn":4,"anchor":"硝酸甘油的首过效应很强"},{"id":"gz0-04-2","ch":12,"part":0,"tag":"判读","stem":"首过效应使口服药物的生物利用度降低，其机制是","options":["药物在胃肠道与肝被代谢，进入体循环的原型药减少","药物与血浆蛋白结合后不能被转运到靶器官组织","药物在肾小管被重吸收，随尿液排出的药量减少","药物在脂肪组织中蓄积，使血药浓度长时间偏低","药物被 P 糖蛋白泵出肠上皮细胞，吸收随之减少"],"answer":0,"explain":"A 对：首过效应指口服药在通过胃肠道和肝时被肠菌酶、肠黏膜酶与肝药酶代谢，使进入体循环的原型药明显减少、生物利用度下降。B 讲的是血浆蛋白结合影响分布与作用，不属首过效应；C 是肾排泄环节；D 是分布环节（脂肪蓄积）；E 讲的是 P 糖蛋白外排影响吸收，虽会降低口服生物利用度，但机制是转运外排，不是「经肠道与肝代谢」。","type":"A1","group":"z0-04","kind":"mechanism","chs":[12,5],"vignette":"硝酸甘油是缓解心绞痛的老药，用法却很特别——舌下含服，而不是吞下去。原因藏在药物进入血液的路径里：口服药物主要在小肠吸收，吸收后先经门静脉进入肝脏，肝细胞滑面内质网上的细胞色素 P450 等药物代谢酶会把相当一部分原型药转化掉，使进入体循环的药量明显减少，这就是首过效应；硝酸甘油的首过效应很强，口服后生物利用度很低。舌下黏膜血流丰富、吸收迅速，且吸收后的药物直接进入体循环、不经过门静脉和肝，因此起效快、生物利用度高。类似的给药途径还有直肠给药与吸入给药。反过来说，某些前药本身没有药理活性，必须经肝内代谢生成活性产物才能起效，对它们而言「经过肝脏」恰恰是必要的。","vignette_title":"情景 4：硝酸甘油为什么要含在舌下，而不是吞下去","gidx":2,"gn":4,"anchor":"使进入体循环的药量明显减少"},{"id":"gz0-04-3","ch":12,"part":0,"tag":"判读","stem":"下列给药方式中，最需要关注首过效应的是","options":["静脉注射给药，药物直接进入血液循环","口服给药，药物吸收后经门静脉先进入肝","呼吸道吸入给药，药物经肺泡直接入血","完整皮肤贴剂给药，药物缓慢吸收入血","静脉滴注给药，药物持续直接进入血液循环"],"answer":1,"explain":"B 对：口服药在小肠吸收后经门静脉先入肝，是首过效应的经典路径（存在明显首过效应的药物不宜口服）。A、E 静脉给药直接进入血循环、无吸收过程，不存在首过效应；C 吸入给药经肺泡入血，避开肝；D 经皮给药吸收入血也不经门静脉，且完整皮肤吸收能力很差。","type":"A1","group":"z0-04","kind":"mechanism","chs":[12,5],"vignette":"硝酸甘油是缓解心绞痛的老药，用法却很特别——舌下含服，而不是吞下去。原因藏在药物进入血液的路径里：口服药物主要在小肠吸收，吸收后先经门静脉进入肝脏，肝细胞滑面内质网上的细胞色素 P450 等药物代谢酶会把相当一部分原型药转化掉，使进入体循环的药量明显减少，这就是首过效应；硝酸甘油的首过效应很强，口服后生物利用度很低。舌下黏膜血流丰富、吸收迅速，且吸收后的药物直接进入体循环、不经过门静脉和肝，因此起效快、生物利用度高。类似的给药途径还有直肠给药与吸入给药。反过来说，某些前药本身没有药理活性，必须经肝内代谢生成活性产物才能起效，对它们而言「经过肝脏」恰恰是必要的。","vignette_title":"情景 4：硝酸甘油为什么要含在舌下，而不是吞下去","gidx":3,"gn":4,"anchor":"口服药物主要在小肠吸收"},{"id":"gz0-04-4","ch":5,"part":0,"tag":"判读","stem":"关于药物的体内过程与跨膜转运，下列叙述正确的是（X 型多选）","options":["口服药物主要在小肠吸收，随后经门静脉进入肝","脂溶性高、非解离型比例大的药物更易通过细胞膜","弱酸性药物在碱性尿液中解离增多，排泄加快","前药需经体内代谢生成活性产物才能发挥药理作用","药物经肝代谢后一定失去活性并被排出体外"],"answer":[0,1,2,3],"explain":"答案 ABCD。A 对：小肠绒毛面积大、血流量大，是口服药的主要吸收部位，随后经门静脉入肝。B 对：跨膜转运以简单扩散为主，只有非解离型、脂溶性大的药物易透过生物膜。C 对：碱化尿液使弱酸性药物解离增多、难以被肾小管重吸收，故排泄加速（苯巴比妥中毒时的解毒思路）。D 对：前药本身无活性，需在体内经肠道或肝代谢生成活性代谢物才起效。E 错：代谢不等于灭活，有的代谢物仍保留活性甚至毒性增强（如含卤素化合物生成反应性代谢物致肾损害）。","type":"X","group":"z0-04","kind":"mechanism","chs":[12,5],"vignette":"硝酸甘油是缓解心绞痛的老药，用法却很特别——舌下含服，而不是吞下去。原因藏在药物进入血液的路径里：口服药物主要在小肠吸收，吸收后先经门静脉进入肝脏，肝细胞滑面内质网上的细胞色素 P450 等药物代谢酶会把相当一部分原型药转化掉，使进入体循环的药量明显减少，这就是首过效应；硝酸甘油的首过效应很强，口服后生物利用度很低。舌下黏膜血流丰富、吸收迅速，且吸收后的药物直接进入体循环、不经过门静脉和肝，因此起效快、生物利用度高。类似的给药途径还有直肠给药与吸入给药。反过来说，某些前药本身没有药理活性，必须经肝内代谢生成活性产物才能起效，对它们而言「经过肝脏」恰恰是必要的。","vignette_title":"情景 4：硝酸甘油为什么要含在舌下，而不是吞下去","gidx":4,"gn":4,"anchor":"必须经肝内代谢生成活性产物才能起效"}]}};
const CIDS = Object.keys(COURSES);
let CID = localStorage.getItem("quiz-active-course");
if (!CID || !COURSES[CID]) CID = CIDS[0];
let C = COURSES[CID];
let QB = C.qb, PARTS = C.parts, CH_TITLES = C.chTitles, LSKEY = C.lskey;
function chUnit(){ return C.chUnit || "章"; }
function partUnit(){ return C.partUnit || "篇"; }
function switchCourse(cid){
  if (cid === CID || !COURSES[cid]) return;
  save();                                  /* 存下当前课程进度 */
  CID = cid; C = COURSES[cid];
  QB = C.qb; PARTS = C.parts; CH_TITLES = C.chTitles; LSKEY = C.lskey;
  localStorage.setItem("quiz-active-course", cid);
  state = load(); draft = null;
  buildCourseRow(); buildPanel(); render();
}
function buildCourseRow(){
  const row = document.getElementById("courseRow");
  if (!row) return;
  row.innerHTML = "";
  CIDS.forEach(function(cid){
    const b = document.createElement("button");
    b.className = "cbtn" + (cid === CID ? " on" : "");
    b.textContent = COURSES[cid].short || COURSES[cid].name;
    b.title = COURSES[cid].name + "（" + COURSES[cid].qb.length + " 题）";
    b.onclick = function(){ switchCourse(cid); };
    row.appendChild(b);
  });
}
const ORDER = ["A","B","C","D","E"];
const pending = {};   /* X 型多选题提交前的暂选，不进进度 */
function fmtAns(v){ return (Array.isArray(v) ? v.slice().sort((a,b)=>a-b) : [v]).map(i => ORDER[i]).join(""); }
function isX(q){ return q.type === "X" || Array.isArray(q.answer); }

let state = load();
function blank(){ return {done:{}, scope:{parts:[], chs:[], order:"seq", filter:"all", qt:"all"}, cur:null, streak:0}; }
function load(){
  try{ const s = JSON.parse(localStorage.getItem(LSKEY)); if(s && s.done) return Object.assign(blank(), s); }catch(e){}
  return blank();
}
function save(){ try{ localStorage.setItem(LSKEY, JSON.stringify(state)); }catch(e){} }

const byId = {};
QB.forEach(q => byId[q.id] = q);

function chPart(ch){ return QB.find(q => q.ch === ch).part; }

function scoped(){
  const s = state.scope;
  let pool = QB.filter(q => (!s.parts.length || s.parts.includes(q.part))
        && (!s.chs.length || s.chs.includes(q.ch) || (q.chs && q.chs.some(c => s.chs.includes(c)))));
  if(s.qt === "case") pool = pool.filter(q => q.group);
  else if(s.qt === "plain") pool = pool.filter(q => !q.group);
  if(s.filter === "undone") pool = pool.filter(q => !(q.id in state.done));
  if(s.filter === "wrong") pool = pool.filter(q => state.done[q.id] && !state.done[q.id].ok);
  if(s.order === "rand") pool = pool.slice().sort(() => Math.random() - 0.5);
  else if(s.qt === "case") pool = pool.slice().sort((a,b) => String(a.group).localeCompare(String(b.group)) || (a.gidx||0)-(b.gidx||0));
  return pool;
}

/* ---------- metrics ---------- */
function refreshMetrics(){
  const doneIds = Object.keys(state.done);
  const ok = doneIds.filter(id => state.done[id].ok).length;
  document.getElementById("mDone").textContent = doneIds.length;
  document.getElementById("mTotal").textContent = QB.length;
  document.getElementById("mAcc").textContent = doneIds.length ? Math.round(ok / doneIds.length * 100) + "%" : "—";
  document.getElementById("mStreak").textContent = state.streak;
  const s = state.scope;
  const n = scoped().length;
  const bits = [];
  if(s.parts.length) bits.push("第" + s.parts.join("、") + partUnit());
  if(s.chs.length) bits.push(s.chs.length + " " + chUnit());
  if(s.qt === "case") bits.push("综合情景组");
  else if(s.qt === "plain") bits.push("传统题");
  bits.push(n + " 题");
  document.getElementById("mScope").textContent = "当前：" + bits.join(" · ");
  const bar = document.getElementById("bar");
  bar.style.width = (QB.length ? Math.min(100, doneIds.length / QB.length * 100) : 0) + "%";
}

/* ---------- setup panel ---------- */
let draft = null;
function syncCourseLabels(){
  const pl = document.getElementById("partLbl");
  if (pl) pl.textContent = partUnit();
  const cs = document.getElementById("chSummary");
  if (cs) cs.textContent = "按" + chUnit() + "筛选（可多选，不选=全部）";
  const cb = document.getElementById("courseBadge");
  if (cb) cb.textContent = C.short || "刷";
  document.title = "刷题站 · " + C.name;
}
function buildPanel(){
  syncCourseLabels();
  draft = {parts: state.scope.parts.slice(), chs: state.scope.chs.slice(), order: state.scope.order, filter: state.scope.filter, qt: state.scope.qt || "all"};
  const pr = document.getElementById("partRow");
  pr.innerHTML = '<span class="lbl">篇</span>';
  PARTS.forEach(p => {
    const b = document.createElement("button");
    b.className = "chip part" + (draft.parts.includes(p.no) ? " on" : "");
    b.textContent = "第" + p.no + partUnit() + " " + p.name;
    b.onclick = () => { toggle(draft.parts, p.no); syncPanel(); };
    pr.appendChild(b);
  });
  const cr = document.getElementById("chRow");
  cr.innerHTML = '<span class="lbl">章</span>';
  Object.keys(CH_TITLES).map(Number).sort((a, b) => a - b).forEach(ch => {
    const b = document.createElement("button");
    b.className = "chip ch" + (draft.chs.includes(ch) ? " on" : "");
    b.textContent = ch + ". " + CH_TITLES[ch];
    b.title = "第 " + ch + " 章 " + CH_TITLES[ch];
    b.onclick = () => { toggle(draft.chs, ch); syncPanel(); };
    cr.appendChild(b);
  });
  syncPanel();
}
function toggle(arr, v){ const i = arr.indexOf(v); i < 0 ? arr.push(v) : arr.splice(i, 1); }
function syncPanel(){
  const kids = document.querySelectorAll("#partRow .chip");
  PARTS.forEach((p, i) => kids[i].className = "chip part" + (draft.parts.includes(p.no) ? " on" : ""));
  const ck = document.querySelectorAll("#chRow .chip");
  Object.keys(CH_TITLES).map(Number).sort((a, b) => a - b).forEach((ch, i) => ck[i].className = "chip ch" + (draft.chs.includes(ch) ? " on" : ""));
  document.querySelectorAll("[data-order]").forEach(b => b.classList.toggle("on", b.dataset.order === draft.order));
  document.querySelectorAll("[data-filter]").forEach(b => b.classList.toggle("on", b.dataset.filter === draft.filter));
  document.querySelectorAll("[data-qt]").forEach(b => b.classList.toggle("on", b.dataset.qt === draft.qt));
}
document.querySelectorAll("[data-order]").forEach(b => b.onclick = () => { draft.order = b.dataset.order; syncPanel(); });
document.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { draft.filter = b.dataset.filter; syncPanel(); });
document.querySelectorAll("[data-qt]").forEach(b => b.onclick = () => { draft.qt = b.dataset.qt; syncPanel(); });
document.getElementById("btnAllCh").onclick = () => { draft.chs = Object.keys(CH_TITLES).map(Number); syncPanel(); };
document.getElementById("btnNoneCh").onclick = () => { draft.chs = []; draft.parts = []; syncPanel(); };
document.getElementById("btnApply").onclick = () => {
  state.scope = draft; state.cur = null; save();
  document.getElementById("panel").classList.remove("show");
  render();
};

/* ---------- rendering ---------- */
function render(){
  const pool = scoped();
  const stage = document.getElementById("stage");
  document.getElementById("btnScope").classList.toggle("on", document.getElementById("panel").classList.contains("show"));
  if(!pool.length){
    stage.innerHTML = '<div class="summary"><div class="empty">这个范围里没有题了 🎉<br>换个范围，或点「重置」清空做题记录。</div></div>';
    refreshMetrics(); return;
  }
  let idx = state.cur == null ? 0 : pool.findIndex(q => q.id === state.cur);
  if(idx < 0) idx = 0;
  const q = pool[idx];
  state.cur = q.id; save();

  const rec = state.done[q.id];
  const answered = !!rec;
  const xType = isX(q);
  const ansArr = xType ? q.answer.slice() : [q.answer];
  const chosenArr = answered ? (Array.isArray(rec.chosen) ? rec.chosen.slice() : [rec.chosen])
                             : (xType ? (pending[q.id] || []) : []);
  let html = '<div class="card">';
  html += '<div class="qhead"><span class="tag ch">第 ' + q.ch + ' ' + chUnit() + '</span><span class="tag">' + esc(q.tag) + '</span>'
        + (xType ? '<span class="tag xt">X 型 · 多选 ' + ansArr.length + ' 项</span>' : '')
        + '<span>' + esc(CH_TITLES[q.ch] || "") + '</span><span style="margin-left:auto">' + (idx + 1) + ' / ' + pool.length + '</span></div>';
  if(q.vignette){
    html += '<div class="vig"><div class="vigh">◆ ' + esc(q.vignette_title || "综合情景")
          + '<span>小问 ' + q.gidx + ' / ' + q.gn + ' · 涉第 ' + (q.chs || []).join("、") + ' ' + chUnit() + '</span></div>'
          + '<div class="vigt">' + esc(q.vignette) + '</div></div>';
  }
  html += '<div class="stem">' + esc(q.stem) + '</div><ul class="opts">';
  q.options.forEach((op, i) => {
    let cls = "opt"; let mark = "";
    if(answered){
      cls += " locked";
      if(ansArr.indexOf(i) >= 0){
        cls += " right";
        mark = '<span style="color:var(--ok); font-weight:700; font-size:12.5px">✓ 应选' + (chosenArr.indexOf(i) >= 0 ? "" : " · 你漏选") + '</span>';
      } else if(chosenArr.indexOf(i) >= 0){
        cls += " wrong";
        mark = '<span style="color:var(--bad); font-weight:700; font-size:12.5px">✗ 你多选</span>';
      }
    } else if(chosenArr.indexOf(i) >= 0){ cls += " sel"; }
    html += '<li class="' + cls + '" data-i="' + i + '"><span class="k">' + ORDER[i] + '</span><span class="v">' + esc(op) + mark + '</span></li>';
  });
  html += "</ul>";
  if(answered){
    const ok = rec.ok;
    html += '<div class="exp ' + (ok ? "good" : "bad") + '"><span class="who">' + (ok ? "✓ 答对了" : "✗ 答错了 · 正确答案 " + fmtAns(ansArr)) + '</span><br>' + esc(q.explain) + "</div>";
  } else if(xType){
    html += '<div class="xbar"><button class="btn sm" id="btnSubmitX">提交答案（已选 ' + chosenArr.length + ' 项）</button>'
          + '<span style="font-size:12.5px; color:var(--sub)">多选题：选 2–4 项后提交，全选对才算对</span></div>';
  } else {
    html += '<div style="margin-top:10px; font-size:12.5px; color:var(--sub)">键盘 <span class="kbd">A</span>–<span class="kbd">E</span> 或 <span class="kbd">1</span>–<span class="kbd">5</span> 选答案，<span class="kbd">空格</span>/<span class="kbd">→</span> 下一题</div>';
  }
  html += "</div>";
  stage.innerHTML = html;
  stage.querySelectorAll(".opt").forEach(li => li.onclick = () => pick(q, Number(li.dataset.i)));
  const sx = document.getElementById("btnSubmitX");
  if(sx) sx.onclick = () => submitX(q);
  document.getElementById("btnPrev").disabled = idx === 0;
  refreshMetrics();
}
function pick(q, i){
  if(state.done[q.id]) return;
  if(!isX(q)){ choose(q, i); return; }
  const cur = pending[q.id] || (pending[q.id] = []);
  const k = cur.indexOf(i);
  if(k < 0) cur.push(i); else cur.splice(k, 1);
  render();
}
function choose(q, i){
  if(state.done[q.id]) return;
  const ok = i === q.answer;
  state.done[q.id] = {chosen: i, ok: ok};
  state.streak = ok ? (state.streak + 1) : 0;
  save(); render();
  if(ok && document.getElementById("autoNext").checked === true) setTimeout(() => next(), 350);
}
function submitX(q){
  if(state.done[q.id]) return;
  const cur = (pending[q.id] || []).slice().sort((a, b) => a - b);
  if(cur.length < 2){ alert("X 型多选题请至少选择 2 项（可多选 2–4 项）"); return; }
  const ans = q.answer.slice().sort((a, b) => a - b);
  const ok = cur.length === ans.length && cur.every((v, i) => v === ans[i]);
  state.done[q.id] = {chosen: cur, ok: ok};
  delete pending[q.id];
  state.streak = ok ? (state.streak + 1) : 0;
  save(); render();
  if(ok && document.getElementById("autoNext").checked === true) setTimeout(() => next(), 350);
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function poolNow(){ return scoped(); }
function step(d){
  const pool = poolNow(); if(!pool.length) return;
  let idx = pool.findIndex(q => q.id === state.cur);
  if(idx < 0) idx = 0;
  const n = idx + d;
  if(n < 0 || n >= pool.length){
    if(n >= pool.length) summary(pool);
    return;
  }
  state.cur = pool[n].id; save(); render();
}
function next(){ step(1); }
function prev(){ step(-1); }

function summary(pool){
  const ids = pool.map(q => q.id).filter(id => state.done[id]);
  const ok = ids.filter(id => state.done[id].ok).length;
  const wrong = pool.filter(q => state.done[q.id] && !state.done[q.id].ok);
  let html = '<div class="summary"><div style="font-size:13px; color:var(--sub); letter-spacing:1px">本轮完成</div>';
  html += '<div class="big">' + (ids.length ? Math.round(ok / ids.length * 100) + "%" : "—") + "</div>";
  html += '<div style="font-size:14px; color:var(--sub)">答对 ' + ok + " / 已做 " + ids.length + " / 范围共 " + pool.length + " 题</div>";
  if(wrong.length){
    html += '<div class="wronglist"><div style="font-weight:700; font-size:14px; margin-bottom:4px">错题回顾（' + wrong.length + '）</div>';
    wrong.forEach(q => {
      html += '<div class="item"><div class="m">第 ' + q.ch + ' ' + chUnit() + ' · ' + esc(q.tag) + ' · 你选 ' + fmtAns(state.done[q.id].chosen) + '，正确 ' + fmtAns(q.answer) + "</div>" + esc(q.stem) + "</div>";
    });
    html += "</div>";
    html += '<div style="margin-top:14px"><button class="btn sm" onclick="onlyWrong()">只刷这些错题</button></div>';
  }
  html += "</div>";
  document.getElementById("stage").innerHTML = html;
}
function onlyWrong(){
  state.scope.filter = "wrong"; state.cur = null; save(); render();
}

/* ---------- top buttons ---------- */
document.getElementById("btnScope").onclick = () => {
  const p = document.getElementById("panel");
  p.classList.toggle("show");
  if(p.classList.contains("show")){ buildPanel(); p.scrollIntoView({behavior:"smooth", block:"start"}); }
  document.getElementById("btnScope").classList.toggle("on", p.classList.contains("show"));
};
document.getElementById("btnWrong").onclick = () => {
  state.scope.filter = (state.scope.filter === "wrong") ? "all" : "wrong";
  state.cur = null; save();
  document.getElementById("btnWrong").classList.toggle("on", state.scope.filter === "wrong");
  render();
};
document.getElementById("btnReset").onclick = () => {
  if(!confirm("清空全部做题记录和错题本？（题目本身不会删）")) return;
  localStorage.removeItem(LSKEY); state = blank(); draft = null;
  document.getElementById("btnWrong").classList.remove("on");
  document.getElementById("panel").classList.remove("show");
  render();
};
document.getElementById("btnNext").onclick = next;
document.getElementById("btnPrev").onclick = prev;
document.getElementById("btnBack").onclick = () => { document.getElementById("panel").classList.add("show"); buildPanel(); window.scrollTo({top:0, behavior:"smooth"}); };
document.addEventListener("keydown", e => {
  const q = byId[state.cur];
  const key = e.key.toUpperCase();
  if(q && !state.done[q.id] && isX(q) && e.key === "Enter"){ e.preventDefault(); submitX(q); return; }
  if(["A","B","C","D","E"].includes(key) && q){ pick(q, ORDER.indexOf(key)); }
  else if(["1","2","3","4","5"].includes(e.key) && q){ pick(q, Number(e.key) - 1); }
  else if(e.key === " " || e.key === "ArrowRight" || e.key === "Enter"){ e.preventDefault(); next(); }
  else if(e.key === "ArrowLeft"){ prev(); }
});

/* auto-next checkbox injected into footer */
const an = document.createElement("label");
an.style.cssText = "display:flex; align-items:center; gap:6px; font-size:13px; color:var(--sub); margin-left:6px";
an.innerHTML = '<input type="checkbox" id="autoNext"> 答对自动跳下一题';
document.querySelector(".foot").appendChild(an);

buildCourseRow();
buildPanel();
render();
// first ever visit: open the scope panel so the range is obvious
if(Object.keys(state.done).length === 0){
  document.getElementById("panel").classList.add("show");
  document.getElementById("btnScope").classList.add("on");
}
</script>
</body>
</html>
